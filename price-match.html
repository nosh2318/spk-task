<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>価格の一致</title>
<!-- 11/21 オーナー「マスタとどのOTAのどのクラスがあってないのか全店分わかりやすく可視化」。開くたび・1分ごとに DB（price_match_status＝ロボが送る 店×OTA×クラス の数）から読む。書き込みはしない -->
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--sub:#667085;--line:#e4e7ec;--ok:#12b76a;--okbg:#e7f8ef;--ng:#d92d20;--ngbg:#fdecea;--un:#98a2b3;--unbg:#f0f2f5;--off:#c8ccd4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1a1f26;--ink:#e6e9ee;--sub:#98a2b3;--line:#2a313b;--okbg:#0f2e20;--ngbg:#3a1714;--unbg:#232a33;--off:#3a414c}}
:root[data-theme="dark"]{--bg:#111418;--card:#1a1f26;--ink:#e6e9ee;--sub:#98a2b3;--line:#2a313b;--okbg:#0f2e20;--ngbg:#3a1714;--unbg:#232a33;--off:#3a414c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}.meta{color:var(--sub);font-size:12px;margin-bottom:12px}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.pill{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:110px}
.pill b{display:block;font-size:22px}.pill.ok b{color:var(--ok)}.pill.ng b{color:var(--ng)}.pill.un b{color:var(--un)}
.big{font-size:16px;font-weight:700;margin:0 0 12px;padding:10px 12px;border-radius:10px}.big.ok{background:var(--okbg);color:var(--ok)}.big.ng{background:var(--ngbg);color:var(--ng)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;overflow-x:auto}
.card h2{font-size:15px;margin:0 0 8px}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--line);padding:6px;text-align:center;white-space:nowrap}th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--sub);font-weight:600}
.c{display:inline-block;min-width:44px;border-radius:6px;padding:2px 6px;font-size:12px;font-weight:700;cursor:pointer}
.c.ok{background:var(--okbg);color:var(--ok)}.c.ng{background:var(--ngbg);color:var(--ng)}.c.un{background:var(--unbg);color:var(--un)}.c.off{color:var(--off);cursor:default}
.legend{color:var(--sub);font-size:12px;margin:-4px 0 12px}
#det{position:fixed;inset:auto 0 0 0;max-height:60vh;overflow:auto;background:var(--card);border-top:1px solid var(--line);padding:12px 16px;display:none;box-shadow:0 -6px 20px rgba(0,0,0,.15)}
#det h3{margin:0 0 6px;font-size:15px}#det table td{white-space:normal;text-align:left;font-size:12px}#det .x{float:right;cursor:pointer;color:var(--sub)}
.err{color:var(--ng)}
.v{display:block;font-size:10px;font-weight:600;margin-top:2px}.v.ok{color:var(--ok)}.v.ng{color:var(--ng)}.v.na{color:var(--un)}.v.t{color:var(--sub);font-weight:400;font-size:9px;margin-top:1px}
.big.warn{background:#fff4e5;color:#b54708}
</style>
</head>
<body>
<div class="wrap">
  <h1>価格の一致（マスター × 全OTA × 全クラス）</h1>
  <div class="meta" id="meta">読み込み中…</div>
  <div id="big"></div>
  <div id="ver"></div>
  <div class="sum" id="sum"></div>
  <div class="legend">緑＝同じ／赤＝違う（数＝欄数）／灰＝26時間以上読めていない（同じか不明）／—＝連動OFF。マスの下の小さい字＝答え合わせ（お客様の画面の値段をマスターと比べた結果・直近6時間）。マスをタップで中身。1分ごとに自動で読み直し。</div>
  <div id="out"></div>
</div>
<div id="det"></div>
<script>
const HD = { url: 'https://ckrxttbnawkclshczsia.supabase.co', key: 'sb_publishable_aTVhlY0YD-5BBfI03ZNnsg_MzO_vsIe' };
const BTDB = { url: 'https://ggqugvyskyiblxiycpci.supabase.co', key: 'sb_publishable_fI8HYYDFn3Soa4kOMbNCAA_oOxGPPKV' };
let VER = null, VERR = [];
const rpc = (db, fn, body) => fetch(db.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: db.key, Authorization: 'Bearer ' + db.key, 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
const SN = { nha: '那覇', spk: '札幌', takh: '高松 HANDYMAN', takb: '高松 BUDDICA' }, ON = { ART: 'エアトリ', JLN: 'じゃらん', RKT: '楽天', SKT: 'スカイチケット', RDC: 'レンタカードットコム', TAB: 'たびらい', ADMIN: 'admin（公式）' };
const STORES = ['nha', 'spk', 'takh', 'takb'], esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let DATA = null;
const fmtT = s => { const d = new Date(s); if (isNaN(d)) return String(s); const j = new Date(d.getTime() + 9 * 3600e3); return `${j.getUTCMonth() + 1}/${j.getUTCDate()} ${String(j.getUTCHours()).padStart(2, '0')}:${String(j.getUTCMinutes()).padStart(2, '0')}`; };
async function load() {
  try {
    const r = await fetch(HD.url + '/rest/v1/rpc/price_match_status', { method: 'POST', headers: { apikey: HD.key, Authorization: 'Bearer ' + HD.key, 'Content-Type': 'application/json' }, body: '{}' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    DATA = await r.json();
    /* 答え合わせ：お客様画面チェッカー（main＝那覇・札幌／BT＝高松）。読めない店は「答え合わせできず」と出す */
    VER = []; VERR = [];
    for (const [nm, db] of [['那覇・札幌', HD], ['高松', BTDB]]) { try { const v = await rpc(db, 'price_match_verify', { p_hours: 6 }); VER.push(...(v.rows || []).map(x => x.ota === 'OFFICIAL' ? { ...x, ota: 'ADMIN' } : x)); /* 公式＝admin */ } catch (e) { VERR.push(nm); } }
    render();
  } catch (e) { document.getElementById('meta').innerHTML = '<span class="err">読めませんでした（' + esc(e.message) + '）。1分後にもう一度読みます</span>'; }
}
function render() {
  const rows = (DATA.rows || []).map(x => { let n = {}; try { n = JSON.parse(x.note || '{}'); } catch {} return { ...x, u: +n.u || 0, read: n.read, ex: n.ex || [] }; });
  const links = DATA.links || {}, on = (s, o) => o === 'ADMIN' || links[s + '|' + o] === true; /* admin（公式）は常に連携 */
  const live = rows.filter(x => on(x.store, x.ota));
  const T = live.reduce((a, x) => ({ s: a.s + (+x.same || 0), d: a.d + (+x.diff || 0), u: a.u + x.u }), { s: 0, d: 0, u: 0 });
  const age = DATA.seen ? Math.round((Date.now() - new Date(DATA.seen.replace(' ', 'T') + ':00+09:00')) / 60000) : null;
  document.getElementById('meta').textContent = `ロボの最終集計 ${DATA.seen || 'なし'}${age != null ? `（${age}分前）` : ''}・この画面を読んだ時刻 ${DATA.at}`;
  const stale = age == null || age > 360, missing = [...Object.keys(links).filter(k => links[k] === true), 'nha|ADMIN', 'spk|ADMIN', 'takb|ADMIN'].filter(k => !rows.some(x => x.store + '|' + x.ota === k));
  const allOk = !stale && !missing.length && T.d === 0 && T.u === 0 && live.length > 0;
  document.getElementById('big').innerHTML = stale ? `<div class="big ng">⚠️ ロボの集計が止まっています（最終 ${esc(DATA.seen || 'なし')}）。下の数は古い可能性があります</div>`
    : `<div class="big ${allOk ? 'ok' : 'ng'}">${allOk ? '✅ 連動ONの全OTA・全クラスがマスターと同じ' : `⚠️ まだ揃っていません：違う ${T.d}欄・読めていない ${T.u}欄${missing.length ? `・集計が届いていない組 ${missing.map(k => { const [s, o] = k.split('|'); return (SN[s] || s) + (ON[o] || o); }).join('、')}` : ''}`}</div>`;
  const robotStale = stale;
  { const vk = x => `${x.store}|${x.ota}|${x.cls}`, VM = Object.fromEntries((VER || []).map(v => [vk(v), v]));
    const vOn = (VER || []).filter(v => on(v.store, v.ota)), vok = vOn.reduce((a, v) => a + (+v.ok || 0), 0);
    /* お客様画面の確認が、ロボが管理画面を読んだ時刻より後のものだけで答え合わせする（前の確認は書く前の値段を見ている） */
    const vT = s => new Date(`${new Date().getFullYear()}-${String(s).slice(0, 2)}-${String(s).slice(3, 5)}T${String(s).slice(6)}:00+09:00`).getTime();
    const fresh = x => { const v = VM[vk(x)]; return v && v.last && (!x.read || vT(v.last) >= new Date(x.read).getTime()); };
    /* 11/21 違う欄は1欄ずつの確認時刻（ngt）で見る。クラスの最新時刻で見ると、ほかの日の新しい確認につられて、書く前の「違う」まで数えてしまう。公式（ADMIN）は読みが30分ごとに進むので今まで通り */
    const ngF = x => { const v = VM[vk(x)]; if (!v) return 0; const rd = x.read ? new Date(x.read).getTime() : 0; if (x.ota !== 'ADMIN' && Array.isArray(v.ngt)) return v.ngt.filter(t => !rd || !(new Date(t).getTime() < rd)).length; return fresh(x) ? +v.ng || 0 : 0; };
    const ngOld = x => Math.max(0, (+(VM[vk(x)] || {}).ng || 0) - ngF(x));
    const liveK = new Set(live.map(vk));
    const vng = live.reduce((a, x) => a + ngF(x), 0) + vOn.filter(v => !liveK.has(vk(v))).reduce((a, v) => a + (+v.ng || 0), 0);
    const clash = live.filter(x => !(+x.diff) && !x.u && ngF(x) > 0), stale = live.filter(x => !(+x.diff) && !x.u && VM[vk(x)] && (!fresh(x) || ngOld(x) > 0)).length;
    const noVer = live.filter(x => !VM[vk(x)]).length;
    let msg, cl;
    if (!vok && !vng) { msg = '答え合わせ：直近6時間にお客様画面の確認がありません（チェッカーが止まっている間は答え合わせできません）'; cl = 'warn'; }
    else if (clash.length) { msg = `答え合わせ：⚠️ 上の表で「同じ」なのに、お客様の画面ではマスターと違う組が ${clash.length} 組（${clash.slice(0, 6).map(x => (SN[x.store] || x.store) + (ON[x.ota] || x.ota) + x.cls).join('、')}${clash.length > 6 ? '…' : ''}）`; cl = 'ng'; }
    else if (vng) { msg = `答え合わせ：お客様の画面でマスターと違う ${vng}件・同じ ${vok}件（違う件は上の表でも「違う／読めていない」の組だけ＝表の数字と食い違いなし）`; cl = 'warn'; }
    else if (stale) { msg = `答え合わせ：お客様の画面で確かめた ${vok}件はマスターと同じ。書いた後にまだ確かめていない所があります`; cl = 'warn'; }
    else { msg = `答え合わせ：✅ お客様の画面 ${vok}件すべてマスターと同じ＝表の数字は正確`; cl = 'ok'; }
    if (VERR.length) msg += `（${VERR.join('・')}は答え合わせを読めませんでした）`;
    if (noVer) msg += `／お客様画面の確認が無い組×クラス ${noVer}`;
    if (stale) msg += `／お客様画面の確認がロボの書き込みより前の組×クラス ${stale}（次の確認待ち）`;
    /* 11/22 ロボが書かない OTA（連動OFF・例 高松BUDDICA たびらい）のお客様画面のずれも隠さず出す */
    const offNg = (VER || []).filter(v => !on(v.store, v.ota) && +v.ng > 0);
    if (offNg.length) msg += `／ロボが書かないOTAでお客様の画面がマスターと違う ${offNg.reduce((a, v) => a + (+v.ng || 0), 0)}件（${[...new Set(offNg.map(v => (SN[v.store] || v.store) + (ON[v.ota] || v.ota)))].join('、')}）`;
    document.getElementById('ver').innerHTML = `<div class="big ${cl}" style="font-size:14px">${esc(msg)}</div>`;
    /* 11/22 管理画面は同じでもお客様の画面が違う時は、一番上を ✅ にしない */
    if (!robotStale && clash.length && T.d === 0 && T.u === 0) document.getElementById('big').innerHTML = `<div class="big ng">⚠️ 管理画面の値段はマスターと同じですが、お客様の画面で違う組が ${clash.length} 組あります（下の赤い「客✗」）</div>`;
    globalThis.__VM = VM; globalThis.__NGF = ngF; }
  document.getElementById('sum').innerHTML = `<div class="pill ok">同じ<b>${T.s}</b></div><div class="pill ng">違う<b>${T.d}</b></div><div class="pill un">読めていない<b>${T.u}</b></div>`;
  let h = '';
  for (const st of STORES) {
    const R = rows.filter(x => x.store === st); if (!R.length) continue;
    /* 11/22 ロボが書かない OTA も、お客様画面の確認があれば行を出す（例 高松BUDDICA たびらい） */
    const VS = (VER || []).filter(v => v.store === st && !R.some(x => x.ota === v.ota) && (+v.ok || 0) + (+v.ng || 0) > 0);
    const otas = [...new Set([...R.map(x => x.ota), ...VS.map(v => v.ota)])].sort((a, b) => (a === 'ADMIN') - (b === 'ADMIN')), clss = [...new Set([...R.map(x => x.cls), ...VS.map(v => v.cls)])].sort((a, b) => a.localeCompare(b, 'ja', { numeric: true }));
    const sd = R.filter(x => on(st, x.ota)).reduce((a, x) => a + (+x.diff || 0), 0), su = R.filter(x => on(st, x.ota)).reduce((a, x) => a + x.u, 0);
    /* 11/22 オーナー「最終同期時刻日付を全箇所に」：店の見出し＝ロボが OTA を読んだ一番新しい時刻、マスの下＝そのマスの「読」（ロボが OTA の値段を読んだ時刻）と「客」（お客様の画面を確かめた時刻） */
    const reads = R.map(x => x.read).filter(Boolean).sort(), lastRead = reads.length ? fmtT(reads.at(-1)) : 'なし';
    h += `<div class="card"><h2>${SN[st] || st}　<span style="font-weight:400;color:var(--sub)">違う ${sd}欄・読めていない ${su}欄・最終同期 ${esc(lastRead)}</span></h2><table><tr><th>OTA</th>${clss.map(c => `<th>${esc(c)}</th>`).join('')}</tr>`;
    for (const o of otas) {
      h += `<tr><td>${esc(ON[o] || o)}${on(st, o) ? '' : '（ロボは書かない）'}</td>`;
      for (const c of clss) { const x = R.find(y => y.ota === o && y.cls === c), k = `${st}|${o}|${c}`, vv = (globalThis.__VM || {})[k];
        const vtime = vv && vv.last ? `<span class="v t">客 ${esc(vv.last)}</span>` : '';
        if (!x && !(vv && VS.some(v => v.ota === o && v.cls === c))) { h += '<td><span class="c off">·</span></td>'; continue; }
        if (!x || !on(st, o)) { const vt = !vv ? '' : +vv.ng > 0 ? `<span class="v ng">客✗${vv.ng}</span>` : +vv.ok > 0 ? `<span class="v ok">客✓${vv.ok}</span>` : `<span class="v na">客?</span>`; h += `<td><span class="c off">—</span>${vt}${vtime}</td>`; continue; }
        const nf = vv && globalThis.__NGF ? globalThis.__NGF(x) : 0, no = vv ? Math.max(0, (+vv.ng || 0) - nf) : 0, vt = !vv ? '' : nf > 0 ? `<span class="v ng">客✗${nf}</span>` : no > 0 ? `<span class="v na">客待${no}</span>` : +vv.ok > 0 ? `<span class="v ok">客✓${vv.ok}</span>` : `<span class="v na">客?</span>`;
        const tt = `<span class="v t">読 ${esc(x.read ? fmtT(x.read) : 'なし')}</span>${vtime}`;
        if (+x.diff > 0) h += `<td><span class="c ng" data-k="${esc(k)}">違${x.diff}</span>${vt}${tt}</td>`;
        else if (x.u > 0) h += `<td><span class="c un" data-k="${esc(k)}">?${x.u}</span>${vt}${tt}</td>`;
        else h += `<td><span class="c ok" data-k="${esc(k)}">同</span>${vt}${tt}</td>`; }
      h += '</tr>';
    }
    h += '</table></div>';
  }
  document.getElementById('out').innerHTML = h || '<div class="card">ロボの集計がまだ届いていません</div>';
  document.querySelectorAll('.c[data-k]').forEach(el => el.onclick = () => show(rows.find(x => `${x.store}|${x.ota}|${x.cls}` === el.dataset.k)));
}
function show(x) {
  const d = document.getElementById('det'); if (!x) return;
  const rd = x.read ? new Date(x.read).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' }) : 'なし';
  d.innerHTML = `<span class="x" onclick="this.parentNode.style.display='none'">閉じる ✕</span><h3>${esc(SN[x.store] || x.store)}・${esc(ON[x.ota] || x.ota)}・${esc(x.cls)}</h3>
    <div style="color:var(--sub);font-size:12px;margin-bottom:6px">同じ ${x.same}欄・違う ${x.diff}欄・読めていない ${x.u}欄／OTAの値段を読んだ時刻（いちばん古い）${rd}</div>` +
    (x.ex.length ? `<table><tr><th>プラン・期間</th><th>欄</th><th>マスター</th><th>OTA</th></tr>${x.ex.map(e => `<tr><td>${esc(e.l)}</td><td>${esc(e.k)}</td><td>${Number.isFinite(+e.w) ? (+e.w).toLocaleString() : esc(e.w)}円</td><td>${e.g == null ? '読めず' : e.g.toLocaleString() + '円'}</td></tr>`).join('')}</table>${x.diff > x.ex.length ? `<div style="color:var(--sub);font-size:12px">ほか ${x.diff - x.ex.length}欄</div>` : ''}` : '<div>違う欄はありません</div>');
  { const vv = (globalThis.__VM || {})[`${x.store}|${x.ota}|${x.cls}`];
    d.innerHTML += !vv ? '<div style="margin-top:8px;color:var(--sub);font-size:12px">答え合わせ：直近6時間にお客様画面の確認なし</div>'
      : `<div style="margin-top:8px;font-size:12px"><b>答え合わせ（お客様の画面）</b> 同じ ${vv.ok}件・違う ${vv.ng}件・確認できず ${vv.na}件／最終 ${esc(vv.last)}</div>` +
        ((vv.ex || []).length ? `<table><tr><th>利用日</th><th>日数</th><th>マスター</th><th>お客様の画面</th></tr>${vv.ex.map(e => `<tr><td>${esc(e.d)}</td><td>${esc(e.n)}日</td><td>${Number.isFinite(+e.w) ? (+e.w).toLocaleString() : esc(e.w)}円</td><td>${Number.isFinite(+e.g) ? (+e.g).toLocaleString() : esc(e.g)}円</td></tr>`).join('')}</table>` : ''); }
  d.style.display = 'block';
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
