<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#002063">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HANDYMAN">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>HANDYMAN マイページ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{--navy:#002063;--navy2:#001548;--yel:#FABE00;--bg:#F4F5F7;--ink:#14181F;--sub:#5A6270;--mute:#7A818C;--line:#E3E6EA;--card:#fff;
--g:#1E7B4F;--gb:#E8F5EE;--o:#B45309;--ob:#FDF3E7;--b:#002063;--bb:#E8ECF5;--r:#B42318;--rb:#FDECEC}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--navy)}
button{font-family:inherit}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
header{background:var(--navy);height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top)}
header img{height:24px;margin-left:16px;min-width:0;flex:0 1 auto;object-fit:contain;object-position:left center}
@media(max-width:374px){header img{height:18px;margin-left:12px}header .lang{margin-right:6px;padding:4px 8px}header .bk{min-width:70px}}
.hdr-r{display:flex;align-items:center;height:56px}
.lang{font-size:12px;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:4px 10px;margin-right:10px}
.bk{height:56px;min-width:78px;background:var(--yel);color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;border:0;cursor:pointer}
@keyframes hdmPulse{0%,100%{box-shadow:0 0 0 0 rgba(250,190,0,.9);opacity:1}50%{box-shadow:0 0 0 6px rgba(250,190,0,0);opacity:.75}}
.strip{background:var(--navy2);padding:8px 12px;display:flex;gap:6px}
.strip div{flex:1;min-height:36px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;color:rgba(255,255,255,.45);font-size:13px}
.strip .on{background:var(--yel);color:var(--navy);font-weight:700;animation:hdmPulse 1.6s ease-in-out infinite}
.strip .on:before{content:"";width:8px;height:8px;border-radius:999px;background:var(--navy)}
.title{background:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.title small{display:block;font-size:12px;color:var(--sub)}
.title .who{font-size:15px;font-weight:700;color:var(--navy)}.title .rno{font-size:12px;color:var(--sub);margin-bottom:2px}
.title b{font-size:16px}
.badge{font-size:12px;font-weight:700;color:var(--navy);background:var(--bb);border-radius:999px;padding:4px 10px;white-space:nowrap}
main{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
.card{background:var(--card);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.h{font-size:13px;font-weight:700;color:var(--navy)}
.big{font-size:22px;font-weight:700;line-height:1.35}
.sub{font-size:12px;color:var(--sub);line-height:1.6}
.txt{font-size:14px;color:#3A414D;line-height:1.7}
.hero{background:var(--navy);color:#fff}
.hero .h{color:var(--yel)}
.hero .sub{color:rgba(255,255,255,.8)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.p-g{color:var(--g);background:var(--gb)}.p-o{color:var(--o);background:var(--ob)}.p-b{color:var(--b);background:var(--bb)}.p-r{color:var(--r);background:var(--rb)}.p-x{color:var(--mute);background:#EEF0F3}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #EEF0F3;text-decoration:none;color:var(--ink);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.row .l{display:flex;flex-direction:column;gap:2px}
.row .n{font-size:14px;font-weight:700}
.row .v{font-size:13px;color:#3A414D}
.row .r{font-size:11px;color:var(--mute)}
.row.dim{opacity:.55}
.chev{color:var(--mute)}
.btn{min-height:48px;border-radius:12px;border:0;background:var(--navy);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;width:100%}
.btn.y{background:var(--yel);color:var(--navy)}
.btn.o{background:#fff;border:1px solid var(--navy);color:var(--navy)}
.btn.g{background:#fff;border:1px solid #C9CED6;color:#3A414D;font-weight:500}
.btn.red{background:var(--r)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 10px;font-size:14px}
.kv dt{color:var(--sub);font-size:13px}.kv dd{margin:0;font-weight:500}
.must{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #EEF0F3;font-size:14px}
.must:last-child{border-bottom:0}
.steps{display:flex;gap:4px}
.steps div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--mute)}
.steps i{display:block;height:6px;width:100%;border-radius:3px;background:var(--line)}
.steps .on{color:var(--ink)}.steps .on i{background:var(--navy)}.steps .cur i{background:var(--yel)}
.tl{display:flex;flex-direction:column;gap:0}
.tl div{display:flex;gap:10px;font-size:13px;padding:6px 0;color:var(--mute)}
.tl div.done{color:var(--ink)}
.tl b{width:44px;flex-shrink:0;font-weight:700}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.live:before{content:"";width:8px;height:8px;border-radius:99px;background:#16a34a;animation:hdmPulse 1.6s infinite}
footer{background:#F3F5F8;border-top:3px solid var(--yel);padding:20px 20px 14px;display:flex;flex-direction:column;gap:12px}
footer .lg{background:var(--navy);padding:5px 8px;border-radius:4px;display:inline-flex;align-self:flex-start}
footer .lg img{height:16px}
footer .t{font-size:12px;color:#4B5563;line-height:1.7}
footer .ln{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
footer .ln a{font-size:12px;color:#4B5563;text-decoration:none;padding:4px 0}
footer .c{font-size:11px;color:#6B7280}
.wcard .wtop{display:flex;gap:12px;align-items:center}.wcard .wic{font-size:26px;width:44px;height:44px;border-radius:12px;background:#EEF2F8;display:flex;align-items:center;justify-content:center;flex-shrink:0}.wcard .wv{font-size:14px;font-weight:700;margin-top:2px;word-break:break-all}.wcard.warn{border:2px solid var(--yel)}.wrc>.card{margin:0}
/* ★2026-11-09 nosh「タスクバーが目立たない」→案1 紺のバー：紺地・白の絵と文字・今の画面は黄色 */
nav{position:sticky;bottom:0;background:var(--navy);border-top:3px solid var(--yel);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 -4px 14px rgba(0,0,0,.18)}
nav button{min-height:56px;border:0;background:none;font-size:12px;font-weight:700;color:#fff;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;padding:0 2px}
nav button .ic{width:26px;height:26px;flex-shrink:0}
nav button.on{background:var(--yel);color:var(--navy)}
nav button .dot{position:absolute;top:2px;right:calc(50% - 26px);min-width:18px;height:18px;border-radius:99px;background:var(--r);color:#fff;font-size:10px;font-weight:700;line-height:14px;padding:0 4px;border:2px solid var(--navy)}
.wentry{display:flex;flex-direction:row;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;border:2px solid var(--yel)}.wentry .wi{width:44px;height:44px;border-radius:12px;background:var(--yel);color:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0}.wentry .wt{flex:1;min-width:0}.wentry .wt b{font-size:15px;color:var(--navy);display:block}.wentry .wt span{font-size:12px;color:var(--sub)}.wentry .wn{background:var(--r);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.scrim.show{display:flex}
/* ★2026-11-09 全画面チャット（スタッフに聞く） */
#chatv{position:fixed;inset:0;z-index:60;background:#EEF1F5;display:none;flex-direction:column}
#chatv.show{display:flex}
html.cvopen,html.cvopen body{overflow:hidden}
.cvh{display:flex;align-items:center;gap:6px;background:var(--navy);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 10px 8px}
.cvb{background:none;border:0;color:#fff;font-size:30px;line-height:1;padding:0 10px 4px;cursor:pointer}
.cvt{display:flex;flex-direction:column;line-height:1.3}.cvt b{font-size:16px}.cvt span{font-size:11px;opacity:.8}
.cvl{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:14px 12px;-webkit-overflow-scrolling:touch}
.cvm{display:flex;gap:8px;max-width:86%}.cvm.me{align-self:flex-end;justify-content:flex-end}.cvm.st{align-self:flex-start}
.cvm i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-style:normal;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.cvm small{display:block;font-size:10px;color:var(--sub);margin:0 0 2px 2px}
.cvm p{margin:0;padding:9px 12px;border-radius:16px;font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word;background:#fff;color:var(--ink);border-top-left-radius:4px}
.cvm.me p{background:var(--navy);color:#fff;border-top-left-radius:16px;border-top-right-radius:4px}
.cvm p img{display:block;max-width:100%;border-radius:10px;margin-top:6px}
.cvm time{display:block;font-size:10px;color:var(--sub);margin-top:2px;text-align:right}
.cvf{background:#fff;border-top:1px solid #DDE2E8;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.cvr{display:flex;align-items:flex-end;gap:8px}
.cvp{flex:none;width:42px;height:42px;border-radius:50%;background:#F3F5F8;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
#chatIn{flex:1;font:inherit;font-size:16px;padding:10px 12px;border:1px solid #C9CED6;border-radius:21px;resize:none;max-height:120px;min-height:42px;line-height:1.4}
.cvs{flex:none;height:42px;padding:0 16px;border:0;border-radius:21px;background:var(--navy);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
#chatImgP{margin:0 0 6px}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
.sheet h3{margin:0;font-size:17px}
.sheet label{font-size:13px;font-weight:700;color:var(--sub)}
.sheet input,.sheet select,.sheet textarea{font:inherit;font-size:16px;padding:12px;border:1px solid #C9CED6;border-radius:10px;width:100%}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#14181F;color:#fff;font-size:14px;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:30;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.center{padding:60px 24px;text-align:center;color:var(--sub);font-size:14px;line-height:1.8}
.hlink{align-self:flex-start;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;margin-top:6px;cursor:pointer}
.ngmsg{background:#fdecec;color:#a11;border:1px solid #f3b4b4;border-radius:8px;padding:8px 10px;font-size:14px;font-weight:700;margin-top:6px}
.prev{background:#FFF7D6;color:#7A5B00;font-size:12px;padding:8px 14px;text-align:center}
/* ★2026-11-08 nosh「触りたくなるUI」6案（3店共通）：現在地ライン・準備リング・あと何分・押すと時刻つき返事・カウントダウン・返却日めくるカード */
.jr{background:#fff;border-radius:16px;padding:14px 6px 10px}
.jr ol{list-style:none;margin:0;padding:0;display:flex;justify-content:space-between;position:relative}
.jr ol:before{content:"";position:absolute;left:14px;right:14px;top:7px;height:3px;background:var(--line);border-radius:2px}
.jr .fl{position:absolute;left:14px;top:7px;height:3px;background:var(--navy);border-radius:2px}
.jr li{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0}
.jr li i{width:17px;height:17px;border-radius:50%;background:var(--line);border:3px solid #fff;box-sizing:border-box}
.jr li.dn i{background:var(--navy)}
.jr li.cu i{background:var(--yel);animation:hdmPulse 1.6s ease-in-out infinite}
.jr li span{font-size:12px;color:var(--mute);white-space:nowrap;letter-spacing:-.02em}
.jr li.cu span{color:var(--navy);font-weight:700}
.ring{position:relative;width:64px;height:64px;flex-shrink:0}
.ring svg{transform:rotate(-90deg);display:block}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:var(--navy)}
.ringhd{display:flex;align-items:center;gap:14px}
.okst{display:inline-block;border:3px solid var(--g);color:var(--g);border-radius:10px;padding:2px 12px;font-size:18px;font-weight:700;transform:rotate(-8deg);animation:okPop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes okPop{from{transform:rotate(-8deg) scale(.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.cd{display:flex;gap:6px;margin-top:2px}
.cd div{background:rgba(255,255,255,.12);border-radius:10px;min-width:54px;padding:6px 6px 4px;text-align:center}
.cd b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;color:#fff}
.cd small{font-size:12px;color:rgba(255,255,255,.8)}
.eta{display:flex;align-items:baseline;gap:6px}
.eta b{font-size:56px;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums}
.eta span{font-size:17px;font-weight:700}
.ack{display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.ack div{display:flex;align-items:center;gap:8px;font-size:13px;animation:ackIn .35s ease-out both}
.ack div+div{animation-delay:.25s}
.ack i{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;color:#fff;background:var(--navy)}
.ack i.g{background:var(--g)}
.ack i.w{background:#fff;border:2px dashed var(--o)}
.ack time{margin-left:auto;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
@keyframes ackIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.btn,.row{position:relative;overflow:hidden;transition:transform .12s}
.btn:active{transform:scale(.97)}
.rip{position:absolute;border-radius:50%;background:rgba(250,190,0,.45);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.ntf{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;width:100%;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.ntf b{font-size:15px}
.sw{width:50px;height:30px;border-radius:99px;background:#C9CED6;position:relative;flex-shrink:0}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--g)}.sw.on:after{left:23px}
.sto{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -2px}
.sto::-webkit-scrollbar{display:none}
.sto>div{flex:0 0 100%;scroll-snap-align:center;background:var(--navy);color:#fff;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;min-height:220px}
.sto>div:nth-child(2){background:#14427f}.sto>div:nth-child(3){background:#1f5e52}.sto>div:nth-child(4){background:#3b3f8f}
.sto svg{width:72px;height:72px}
.sto .t{font-size:20px;font-weight:700;line-height:1.4}
.sto .btn{margin-top:auto;background:var(--yel);color:var(--navy)}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .2s}
.dots i.on{width:20px;border-radius:4px;background:var(--navy)}
@media (prefers-reduced-motion:reduce){.jr li.cu i,.okst,.ack div,.rip{animation:none}.btn:active{transform:none}}
.ttq{display:flex;align-items:center;justify-content:space-between;gap:8px}.ttsw{display:flex;background:var(--bg);border-radius:999px;padding:3px}.ttsw button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:700;color:var(--sub);padding:6px 14px;border-radius:999px;cursor:pointer}.ttsw button[aria-selected=true]{background:var(--navy);color:#fff}.tth{background:var(--navy);color:#fff;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}.ttk{font-size:12px;opacity:.8;font-weight:700}.ttt{font-size:44px;font-weight:900;line-height:1.05;letter-spacing:1px;font-variant-numeric:tabular-nums}.ttr{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;flex-wrap:wrap}.ttr i{font-style:normal;color:var(--yel)}.tts{margin-top:8px;display:flex;align-items:baseline;gap:8px;background:rgba(255,255,255,.12);border-radius:10px;padding:6px 10px;font-size:13px}.tts b{font-size:18px}.tts.y{background:var(--yel);color:var(--navy);font-weight:700}.tts.y b{font-size:22px}.ttw{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:10px 2px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}.ttw::-webkit-scrollbar{display:none}.tt{flex:0 0 auto;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;width:64px;height:58px;border-radius:12px;border:1px solid var(--line);background:#fff}.tt b{font-size:15px;font-variant-numeric:tabular-nums}.tt small{font-size:10px;font-weight:700;color:var(--sub);min-height:12px}.tt.me{background:var(--yel);border-color:var(--yel)}.tt.me small,.tt.me b{color:var(--navy)}.tt.nx{border:2px solid var(--navy)}.tt.nx small{color:var(--navy)}.tt.past{opacity:.4;background:var(--bg)}.ttru{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.ttru div{background:var(--bg);border-radius:10px;padding:8px 6px;font-size:12px;font-weight:700;text-align:center;line-height:1.35}.ttru b{display:block;font-size:18px;margin-bottom:2px}.ttru small{font-weight:500;color:var(--sub);font-size:11px}
.meyasu{display:inline-block;align-self:flex-start;background:#fff4d6;color:#8a5a00;border:1px solid #f5c44f;border-radius:8px;padding:4px 10px;font-size:14px;font-weight:700;margin-top:6px}
.strip[hidden]{display:none}</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logo.png" alt="HANDYMAN RENTCAR">
    <div class="hdr-r"><span class="lang">JP</span>
      <button class="bk" onclick="openBooking()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#002063" stroke-width="2.2" stroke-linecap="round"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3M21 12v2"/></svg>予約確認</button>
    </div>
  </header>
  <div class="strip" aria-label="担当店舗" id="strip" hidden></div><!-- ★2026-11-09 nosh「この辺は削除？」：お客様には店舗の切替は不要（店名は見出しに出る）。切替と同時に隠す -->

function reqCard(c){

  if(c.status==="rejected")body+=`<br>${esc(REJ[rj.reason]||"")}${rj.text?"<br><span translate=\"no\">"+esc(rj.text)+"</span>":""}${rj.alt?"<br>代わりに："+esc(rj.alt):""}<br><b>今のご予約のままです。</b>`;

function shrink(f){return new Promise(res=>{if(!f||!/^image\//.test(f.type||"")){res(f);return;}const u=URL.createObjectURL(f),im=new Image();const to=setTimeout(()=>res(f),15000);im.onload=()=>{try{let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,1600/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);c.toBlob(b=>{clearTimeout(to);res(b&&b.size<f.size?b:f);},"image/jpeg",.7);}catch(_){clearTimeout(to);res(f);}};im.onerror=()=>{clearTimeout(to);res(f);};im.src=u;});}

function lateBus(r,dir){const B=ST.BUS[dir],bo=busOf(r,dir),now=jstNow(),nm=now.getUTCHours()*60+now.getUTCMinutes(),isT=bo.day===todayStr();

  o.push(dir==="back"?"タクシーで空港へ向かいます":"タクシーで店へ向かいます");o.push("まだ分からない");return o;}

"往路・復路とも無料で、ご予約はいりません。ご到着の時間に合わせてお迎えします（運行は9:00〜18:50）。":["Free both ways, no reservation needed. We pick you up around your arrival time (service 9:00–18:50).", "往返皆免費，無需預約。配合您的抵達時間前往迎接（運行 9:00〜18:50）。", "왕복 모두 무료이며 예약이 필요 없습니다. 도착 시간에 맞춰 마중 나갑니다(운행 9:00~18:50)."],

  var lastTap=0;
  ["pointerdown","touchstart","click"].forEach(function(ev){document.addEventListener(ev,function(){lastTap=Date.now();},true);});
  var SKIP_URL=/ux-track|quiz-track|mail-track|mypage-events|mypage_events|line-track|bt_shuttle_status|mpadmin_handoff|mypage-pay|\/rpc\/[a-z_]*(status|get|list|lookup)/;
  var SKIP_ACT={lookup:1,ping:1,guide_log:1,track:1,log:1,view:1,list:1,get:1,status:1,history:1,poll:1,cust_poll:1,read:1,mark_read:1,seen:1};
  var busyN=0,okAt=0,busy=null,done=null;
  function css(){if(document.getElementById("hdmAckCss"))return;var st=document.createElement("style");st.id="hdmAckCss";
    st.textContent="@keyframes hdmspin{to{transform:rotate(360deg)}}"+
    "#hdmBusy,#hdmDone{position:fixed;inset:0;z-index:2147483646;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(15,23,42,.38)}"+
    "#hdmDone{z-index:2147483647}#hdmBusy .b,#hdmDone .b{background:#fff;color:#0f172a;border-radius:18px;box-shadow:0 12px 36px rgba(0,0,0,.28);font:700 17px/1.5 system-ui,-apple-system,sans-serif;text-align:center}"+
    "#hdmBusy .b{display:flex;align-items:center;gap:12px;padding:20px 26px}"+
    "#hdmBusy .s{width:22px;height:22px;border:3px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:hdmspin .8s linear infinite}"+
    "#hdmDone .b{width:100%;max-width:340px;padding:26px 22px 20px}#hdmDone .i{font-size:52px;line-height:1.1;margin-bottom:6px}"+
    "#hdmDone .m{font-size:17px;margin:4px 0 18px;white-space:pre-line}#hdmDone button{width:100%;border:0;border-radius:12px;padding:14px;font:700 17px system-ui,sans-serif;background:#16a34a;color:#fff}";
    document.head.appendChild(st);}
  function lang(){try{return (typeof L!=="undefined"&&L)||"ja";}catch(e){return "ja";}}
  function T(o){return o[lang()]||o.ja;}
  function busyEl(){if(busy)return busy;css();busy=document.createElement("div");busy.id="hdmBusy";
    busy.innerHTML='<div class="b"><span class="s"></span><span>'+T({ja:"送信中…",en:"Sending…",zh:"傳送中…",ko:"전송 중…"})+'</span></div>';document.body.appendChild(busy);return busy;}
  function doneEl(){if(done)return done;css();done=document.createElement("div");done.id="hdmDone";
    done.innerHTML='<div class="b"><div class="i">✅</div><div class="m"></div><button type="button">OK</button></div>';
    done.querySelector("button").addEventListener("click",function(){done.style.display="none";});
    document.body.appendChild(done);return done;}
  function show(){busyN++;busyEl().style.display="flex";}
  function hide(){busyN=Math.max(0,busyN-1);if(!busyN&&busy)busy.style.display="none";}
  var of=window.fetch.bind(window);
  window.fetch=function(u,o){
    var url=String((u&&u.url)||u||""),m=String((o&&o.method)||"GET").toUpperCase(),act="";
    try{if(o&&typeof o.body==="string"&&o.body.charAt(0)==="{")act=String((JSON.parse(o.body)||{}).action||"");}catch(e){}
    var user=m!=="GET"&&!SKIP_URL.test(url)&&!SKIP_ACT[act]&&(Date.now()-lastTap<2000);
    if(!user)return of(u,o);
    show();
    return of(u,o).then(function(r){if(r&&r.ok)okAt=Date.now();return r;}).finally(hide);
  };
  var NG=/でき(ません|なかった)|失敗|エラー|送れ|入力して|選んで|不正|お試し|閲覧のみ|通信|電波|もう一度|fail|error|could not|unable|invalid/i;
  window.hdmDone=function(msg){var d=doneEl();d.querySelector(".m").textContent=String(msg||T({ja:"受け付けました",en:"Received",zh:"已受理",ko:"접수되었습니다"}));d.style.display="flex";};
  if(typeof toast==="function"){var _t=toast;
    toast=function(msg){if(Date.now()-okAt<4000&&!NG.test(String(msg||""))){okAt=0;return window.hdmDone(msg);}return _t.apply(this,arguments);};}
})();
</script>
</body>
</html>
