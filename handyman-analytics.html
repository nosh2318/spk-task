<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>🔵 HANDYMAN公式サイト 回遊解析</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:#f1f5f9;color:#0f1f45;font-size:14px}
  header{background:linear-gradient(135deg,#0F1F45,#1e3a8a);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  header h1{margin:0;font-size:17px}
  header .sub{font-size:11px;opacity:.85;margin-top:3px}
  .wrap{max-width:960px;margin:0 auto;padding:14px}
  .kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .kpi{background:#fff;border-radius:10px;padding:10px 16px;box-shadow:0 1px 5px rgba(0,0,0,.07);border-top:3px solid #1e3a8a;min-width:96px;flex:1}
  .kpi .l{font-size:11px;color:#64748b}.kpi .v{font-size:22px;font-weight:800}
  .card{background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.08);margin-bottom:14px;overflow:hidden}
  .card h2{font-size:13px;margin:0;padding:11px 15px;background:#f8fafc;border-bottom:1px solid #eef2f7;color:#0F1F45}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:8px 12px;text-align:left;border-bottom:1px solid #f0f0f0}
  th{background:#fff;color:#64748b;font-size:11px;font-weight:700}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:7px;background:#e2e8f0;border-radius:5px;overflow:hidden;margin-top:3px}
  .bar>i{display:block;height:100%;background:#1e3a8a}
  .empty{text-align:center;color:#94a3b8;padding:40px}
  .note{font-size:11px;color:#94a3b8;text-align:center;margin:10px 0}
  .pgname{font-family:ui-monospace,monospace;font-size:11px;color:#1e3a8a}
  .fstep{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid #f0f0f0}
  .fstep .fname{flex:0 0 150px;font-weight:700;font-size:12.5px}
  .fstep .fbarwrap{flex:1;background:#eef2f7;border-radius:6px;height:26px;position:relative;overflow:hidden}
  .fstep .fbar{height:100%;background:linear-gradient(90deg,#2563eb,#1e3a8a);border-radius:6px;min-width:2px}
  .fstep .fnum{flex:0 0 110px;text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}
  .fstep .fnum b{font-size:15px}
  .drop{padding:6px 14px;font-size:12px;color:#b91c1c;background:#fef2f2;border-bottom:1px solid #fee2e2}
  .drop.worst{background:#fee2e2;font-weight:800}
  .drop .ok{color:#15803d}
  .pri-hi{color:#b91c1c;font-weight:800}.pri-mid{color:#d97706;font-weight:700}.pri-lo{color:#15803d}
  .advice{padding:4px 2px}
  .advice .ai{display:flex;gap:9px;padding:9px 14px;border-bottom:1px solid #f0f0f0;align-items:flex-start}
  .advice .ai .rk{flex:0 0 22px;height:22px;border-radius:50%;background:#1e3a8a;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
  .advice .ai .tx{flex:1;font-size:12.5px;line-height:1.55}
  .advice .ai .tx b{color:#0F1F45}
</style>
</head>
<body>
<header>
  <h1>🔵 HANDYMAN公式サイト 回遊解析</h1>
  <div class="sub">rent-handyman.com の閲覧・クリック・離脱・端末・流入元（KEYDROPとは完全分離／off_* のみ集計）</div>
</header>
<div class="wrap">
  <style>.areabar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.ab{font-size:12px;padding:6px 13px;border-radius:9px;border:1px solid #334155;background:#13203a;color:#9fb3d4;cursor:pointer;font-weight:700}.ab.on{background:#2563eb;color:#fff;border-color:#2563eb}</style>
  <div class="areabar" id="areabar"></div>
  <div class="kpis" id="kpis"></div>
  <div class="card"><h2>🎯 予約ファネル（訪問→予約フロー→予約確定 ＝ どこで離脱したか）</h2><div id="funnel"><div class="empty">読み込み中…</div></div></div>
  <div class="card"><h2>🚪 離脱ポイント（改善優先度＝離脱率×流入量）</h2><div id="leaks"></div></div>
  <div class="card"><h2>💡 CV率を上げる考え方（この数字から導く次の一手）</h2><div id="advice"></div></div>
  <div class="card"><h2>📄 ページ別（PV/滞在/離脱）</h2><div id="pages"><div class="empty">読み込み中…</div></div></div>
  <div class="card"><h2>📱 端末別</h2><div id="devices"></div></div>
  <div class="card"><h2>🌐 流入元</h2><div id="sources"></div></div>
  <div class="card"><h2>📅 日別</h2><div id="daily"></div></div>
  <div class="card"><h2>🎁 旅を楽しむ クリック（マイページ）</h2><div id="travel"></div></div>
  <div class="note" id="note"></div>
</div>
<script>
const SB="https://ckrxttbnawkclshczsia.supabase.co";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
// 高松(BT)は別プロジェクト。CV(決済完了)ビューは各DBから取得する。
const BT_SB="https://ggqugvyskyiblxiycpci.supabase.co";
const BT_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18";
const esc=s=>(s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const PGN={off_top:"TOP",off_vehicles:"車両一覧",off_flow:"予約フロー",off_access:"アクセス",off_tkm_faq:"高松FAQ",off_tkm_airport:"高松空港",off_bus:"バス",off_insurance:"補償",off_contact:"問い合わせ"};
const pgLabel=p=>PGN[p]||p;
async function get(v){try{const r=await fetch(`${SB}/rest/v1/${v}?select=*`,{headers:{apikey:ANON,Authorization:"Bearer "+ANON}});const d=await r.json();return Array.isArray(d)?d:[];}catch(e){return[];}}
async function getBT(v){try{const r=await fetch(`${BT_SB}/rest/v1/${v}?select=*`,{headers:{apikey:BT_ANON,Authorization:"Bearer "+BT_ANON}});const d=await r.json();return Array.isArray(d)?d:[];}catch(e){return[];}}
function barRows(rows,label,val,max){max=max||Math.max(1,...rows.map(val));return rows.map(r=>`<tr><td>${esc(label(r))}</td><td class="n">${val(r).toLocaleString()}<div class="bar"><i style="width:${Math.round(val(r)/max*100)}%"></i></div></td></tr>`).join("");}
let RAW=null,AREA='all';
const AREAS=[['all','合計(全エリア)'],['common','共通(未選択)'],['naha','🌺那覇'],['sapporo','❄️札幌'],['takamatsu','🍜高松']];
const A2STORE={naha:'nha',sapporo:'spk',takamatsu:'tkm'};
function fA(rows){return AREA==='all'?(rows||[]):(rows||[]).filter(r=>r.area===AREA);}
function roll(rows,keyFn,fs){const m={},o=[];(rows||[]).forEach(r=>{const k=keyFn(r);if(!m[k]){m[k]=Object.assign({},r);o.push(k);}else{fs.forEach(f=>m[k][f]=(+m[k][f]||0)+(+r[f]||0));}});return o.map(k=>m[k]);}
function renderBar(){document.getElementById("areabar").innerHTML=AREAS.map(a=>'<button class="ab'+(AREA===a[0]?' on':'')+'" onclick="setArea(\''+a[0]+'\')">'+a[1]+'</button>').join("");}
function setArea(a){AREA=a;renderBar();render();}
async function load(){
  const [pg,ck,dv,sc,dl,tv,cvM,cvB,st]=await Promise.all([
    get("public_hdm_ev_page_v"),get("public_hdm_ev_click_v"),get("public_hdm_ev_device_v"),get("public_hdm_ev_source_v"),get("public_hdm_ev_daily_v"),get("public_kd_travel_v"),get("public_hdm_cv_v"),getBT("public_bt_cv_v"),get("public_hdm_ev_step_v")]);
  RAW={pages:pg,clicks:ck,devices:dv,sources:sc,daily:dl,travel:tv,cv:(cvM||[]).concat(cvB||[]),steps:st};renderBar();render();
}
function render(){
  let pages=fA(RAW.pages),clicks=fA(RAW.clicks),devices=fA(RAW.devices),sources=fA(RAW.sources),daily=fA(RAW.daily);
  if(AREA==='all'){pages=roll(pages,r=>r.page,['pv','sessions','clicks','exits']);clicks=roll(clicks,r=>r.page+'|'+r.target,['clicks','sessions']);devices=roll(devices,r=>r.device,['sessions','pv']);sources=roll(sources,r=>r.source,['sessions','pv']);daily=roll(daily,r=>r.day,['pv','sessions','clicks','exits']);}
  pages.sort((a,b)=>(+b.pv||0)-(+a.pv||0));clicks.sort((a,b)=>(+b.clicks||0)-(+a.clicks||0));devices.sort((a,b)=>(+b.sessions||0)-(+a.sessions||0));sources.sort((a,b)=>(+b.sessions||0)-(+a.sessions||0));daily.sort((a,b)=>String(a.day).localeCompare(String(b.day)));
  const totPv=pages.reduce((s,r)=>s+(+r.pv||0),0), totSes=devices.reduce((s,r)=>s+(+r.sessions||0),0);
  const avgSec=pages.length?Math.round(pages.reduce((s,r)=>s+(+r.avg_sec||0)*(+r.pv||0),0)/Math.max(1,totPv)):0;
  // ── CV（予約確定＝決済完了のみ）＝Square課金成功で確定した公式サイト予約の件数（公開ビュー public_hdm_cv_v / public_bt_cv_v）。
  //     #ctaBtnは予約フロー5段共通の「次へ」ボタンなのでクリック＝CVではない（旧集計の誤りを是正）。
  //     計測期間に揃えるため、ページビューのある最古日(_minDay)以降の決済完了のみを数える。 ──
  const flowSes=pages.filter(r=>r.page==='off_flow').reduce((s,r)=>s+(+r.sessions||0),0);
  const _trkDays=daily.map(r=>String(r.day)).filter(Boolean);
  const _minDay=_trkDays.length?_trkDays.reduce((a,b)=>a<b?a:b):'';
  const cv=fA(RAW.cv).filter(r=>!_minDay||String(r.day)>=_minDay).reduce((s,r)=>s+(+r.cv||0),0);
  const cvr=totSes?(cv/totSes*100):0;
  document.getElementById("kpis").innerHTML=
    `<div class="kpi"><div class="l">セッション</div><div class="v">${totSes.toLocaleString()}</div></div>`+
    `<div class="kpi"><div class="l">予約フロー到達</div><div class="v">${flowSes.toLocaleString()}</div></div>`+
    `<div class="kpi" style="border-top-color:#16a34a"><div class="l">予約確定(決済完了)</div><div class="v">${cv.toLocaleString()}</div></div>`+
    `<div class="kpi" style="border-top-color:#16a34a"><div class="l">CV率</div><div class="v">${cvr.toFixed(1)}%</div></div>`+
    `<div class="kpi"><div class="l">平均滞在(秒)</div><div class="v">${avgSec}</div></div>`;
  document.getElementById("pages").innerHTML=pages.length?`<table><thead><tr><th>ページ</th><th class="n">PV</th><th class="n">セッション</th><th class="n">クリック</th><th class="n">離脱</th><th class="n">平均秒</th></tr></thead><tbody>${pages.map(r=>`<tr><td>${esc(pgLabel(r.page))}<br><span class="pgname">${esc(r.page)}</span></td><td class="n">${(+r.pv).toLocaleString()}</td><td class="n">${(+r.sessions).toLocaleString()}</td><td class="n">${(+r.clicks).toLocaleString()}</td><td class="n">${(+r.exits).toLocaleString()}</td><td class="n">${r.avg_sec||0}</td></tr>`).join("")}</tbody></table>`:'<div class="empty">まだデータがありません（計測開始直後）</div>';
  // ── 🎯 ファネル：訪問 → 予約フロー到達 → 予約確定（各段の継続率・離脱率を可視化）──
  const stages=[
    {name:"① サイト訪問",n:totSes,color:"#64748b"},
    {name:"② 予約フロー到達",n:flowSes},
    {name:"③ 予約確定(CV)",n:cv,cv:true}];
  const base=Math.max(1,stages[0].n);
  let worstIdx=-1,worstDropPct=-1;
  for(let i=1;i<stages.length;i++){const prev=stages[i-1].n||0,cur=stages[i].n||0;const dp=prev?(1-cur/prev)*100:0;if(cur<=prev&&dp>worstDropPct){worstDropPct=dp;worstIdx=i;}}
  let fh="";
  stages.forEach((s,i)=>{
    const pct=s.n/base*100;
    fh+=`<div class="fstep"><div class="fname">${s.name}</div><div class="fbarwrap"><div class="fbar" style="width:${Math.max(2,pct)}%;background:${s.cv?'linear-gradient(90deg,#16a34a,#15803d)':''}"></div></div><div class="fnum"><b>${(s.n||0).toLocaleString()}</b> <span style="color:#64748b">${pct.toFixed(1)}%</span></div></div>`;
    if(i<stages.length-1){const prev=s.n||0,next=stages[i+1].n||0;const dropN=Math.max(0,prev-next);const dp=prev?dropN/prev*100:0;const worst=(i+1===worstIdx);fh+=`<div class="drop${worst?' worst':''}">▼ ${esc(s.name.replace(/^[①②③]\s*/,''))} → ${esc(stages[i+1].name.replace(/^[①②③]\s*/,''))}：<b>${dp.toFixed(0)}% 離脱</b>（${dropN.toLocaleString()} が進まず）${worst?' ← 最大の離脱＝最優先':''}</div>`;}
  });
  // ── 予約フロー内のステップ別離脱（off_flow / public_hdm_ev_step_v）──
  (function(){
    var smap={1:'空車選択',2:'オプション・補償',3:'お客様情報',4:'確認',5:'決済入力',6:'完了'};
    var srows=(RAW.steps||[]).filter(function(r){return r.page==='off_flow';});
    if(AREA!=='all'&&AREA!=='common'){var ac=A2STORE[AREA];srows=srows.filter(function(r){return r.area===AREA||r.area===ac;});}
    var byNo={};srows.forEach(function(r){var n=+r.step_no;byNo[n]=(byNo[n]||0)+(+r.sessions||0);});
    var nos=Object.keys(byNo).map(Number).sort(function(a,b){return a-b;});
    if(nos.length){
      var sbase=Math.max(1,byNo[nos[0]]||0),wIdx=-1,wDrop=-1;
      for(var j=1;j<nos.length;j++){var pv=byNo[nos[j-1]]||0,c2=byNo[nos[j]]||0,dp2=pv?(1-c2/pv)*100:0;if(c2<=pv&&dp2>wDrop){wDrop=dp2;wIdx=j;}}
      fh+='<div style="margin-top:16px;font-weight:800;color:#0a1f44;font-size:13px">🧭 予約フロー内のステップ別離脱（official-flow＝どの入力段階で諦めたか）</div>';
      nos.forEach(function(n,idx){
        var ses=byNo[n]||0,pct=ses/sbase*100;
        fh+='<div class="fstep"><div class="fname">STEP'+n+' '+(smap[n]||'')+'</div><div class="fbarwrap"><div class="fbar" style="width:'+Math.max(2,pct)+'%"></div></div><div class="fnum"><b>'+ses.toLocaleString()+'</b> <span style="color:#64748b">'+pct.toFixed(0)+'%</span></div></div>';
        if(idx<nos.length-1){var nx=byNo[nos[idx+1]]||0,dropN=Math.max(0,ses-nx),dp=ses?dropN/ses*100:0,worst=(idx+1===wIdx);fh+='<div class="drop'+(worst?' worst':'')+'">▼ '+(smap[n]||'')+' → '+(smap[nos[idx+1]]||'')+'：<b>'+dp.toFixed(0)+'% 離脱</b>（'+dropN.toLocaleString()+'）'+(worst?' ← このステップが最大の離脱':'')+'</div>';}
      });
    }else{
      fh+='<div class="empty" style="margin-top:12px">予約フローのステップ計測はまだデータがありません（計測フック導入直後。お客様が予約フローに進むと蓄積されます）。</div>';
    }
  })();
  document.getElementById("funnel").innerHTML=(totSes>0)?fh:'<div class="empty">まだデータがありません（計測開始直後）</div>';
  // ── 🚪 離脱ポイント：離脱率=exits/pv、優先度=離脱率×流入量（影響度）──
  const EXITOK={off_contact:1,off_tkm_faq:1,off_tkm_airport:1,off_access:1,off_bus:1,off_mypage_find:1,off_mypage_guide:1};
  const leaks=pages.map(r=>{const pv=+r.pv||0,ex=+r.exits||0;const rate=pv?ex/pv*100:0;return{page:r.page,pv,ex,rate,impact:ex*rate/100,info:!!EXITOK[r.page]};})
    .filter(r=>r.pv>0).sort((a,b)=>b.impact-a.impact).slice(0,8);
  const pri=r=>r.info?'<span class="pri-lo">情報ページ（離脱OK）</span>':(r.rate>=70?'<span class="pri-hi">高</span>':r.rate>=40?'<span class="pri-mid">中</span>':'<span class="pri-lo">低</span>');
  document.getElementById("leaks").innerHTML=leaks.length?
    `<table><thead><tr><th>ページ</th><th class="n">PV</th><th class="n">離脱</th><th class="n">離脱率</th><th class="n">影響度</th><th>改善優先度</th></tr></thead><tbody>`+
    leaks.map(r=>`<tr><td>${esc(pgLabel(r.page))}<br><span class="pgname">${esc(r.page)}</span></td><td class="n">${r.pv.toLocaleString()}</td><td class="n">${r.ex.toLocaleString()}</td><td class="n">${r.rate.toFixed(0)}%</td><td class="n">${r.impact.toFixed(1)}</td><td>${pri(r)}</td></tr>`).join("")+
    `</tbody></table><div class="note" style="margin:8px 12px;text-align:left">影響度＝離脱率×離脱数。大きいほど「多くの人が・高い確率で」抜ける＝直すと効く。情報ページ（アクセス/FAQ等）の離脱は目的達成後なので優先度を下げて表示。</div>`
    :'<div class="empty">離脱データなし</div>';
  // ── 💡 CV率を上げる考え方：世界基準CROのセオリーを、この数字の最大ボトルネックに当てる ──
  const PLAY={
    off_top:"ファーストビューで「3秒で価値＋予約CTA」。価格の最安値・空港送迎無料・予約ボタンを即見せる。スクロールしないと予約導線が無い状態を無くす。",
    off_flow:"フォーム離脱対策＝①入力項目を削る（必須を最小化・住所自動補完）②合計金額と追加料金を先に透明化③「この内容で予約」までの残ステップを表示④不安要素（キャンセル規定・補償）を確定ボタン直前に明示⑤かご落ちへLINE/メールのリマインド。",
    off_deliv:"配送料・エリア・時間を早い段階で明示。料金不明による離脱を防ぐ。",
    off_access:"情報提供が役割。離脱自体は許容だが、ページ下部に予約CTAを常設して回遊に戻す。",
    off_vehicles:"車両カードに在庫/価格/「この車で予約」を即配置。比較しやすく絞り込みを付ける。"};
  const GENERIC=[
    "CV率の公式は <b>CV = 訪問 × 各段の継続率</b>。最大の離脱段を1つ直す方が、全ページ微調整より効く（ボトルネック理論）。",
    "改善は<b>1変更＝1効果計測</b>のA/Bで。感覚でなく数値（このページのCV率）で採否を決める。",
    "モバイル比率が高いので、スマホでの<b>親指リーチ内CTA・1画面1アクション</b>を基準にする。"];
  const adv=[];let worstKey=null;
  // 最大離脱段の具体策
  if(worstIdx>=1){
    const fromName=stages[worstIdx-1].name.replace(/^[①②③]\s*/,''),toName=stages[worstIdx].name.replace(/^[①②③]\s*/,'');
    worstKey=worstIdx===1?'off_top':'off_flow';
    adv.push(`<b>最優先：「${fromName}→${toName}」で ${worstDropPct.toFixed(0)}% が離脱。</b> ${PLAY[worstKey]}`);
  }
  // 影響度トップの非情報ページ（ファネル最大離脱段と重複する場合は出さない）
  const topLeak=leaks.find(r=>!r.info&&r.page!==worstKey);
  if(topLeak&&PLAY[topLeak.page])adv.push(`<b>離脱影響度1位：${pgLabel(topLeak.page)}（離脱率${topLeak.rate.toFixed(0)}%）。</b> ${PLAY[topLeak.page]}`);
  GENERIC.forEach(g=>adv.push(g));
  document.getElementById("advice").innerHTML='<div class="advice">'+adv.map((t,i)=>`<div class="ai"><div class="rk">${i+1}</div><div class="tx">${t}</div></div>`).join("")+'</div>';
  document.getElementById("devices").innerHTML=devices.length?`<table><tbody>${barRows(devices,r=>r.device,r=>+r.sessions)}</tbody></table>`:'<div class="empty">なし</div>';
  document.getElementById("sources").innerHTML=sources.length?`<table><tbody>${barRows(sources,r=>r.source,r=>+r.sessions)}</tbody></table>`:'<div class="empty">なし</div>';
  document.getElementById("daily").innerHTML=daily.length?`<table><thead><tr><th>日</th><th class="n">PV</th><th class="n">セッション</th><th class="n">クリック</th></tr></thead><tbody>${daily.slice(-30).reverse().map(r=>`<tr><td>${esc(r.day)}</td><td class="n">${(+r.pv).toLocaleString()}</td><td class="n">${(+r.sessions).toLocaleString()}</td><td class="n">${(+r.clicks).toLocaleString()}</td></tr>`).join("")}</tbody></table>`:'<div class="empty">なし</div>';
  let travel=(RAW.travel||[]).slice();
  if(AREA!=='all'){const st=A2STORE[AREA];travel=st?travel.filter(r=>r.store===st):[];}
  const STN={spk:"❄️北海道(札幌)",nha:"🌺沖縄(那覇)",tkm:"🍜香川・四国(高松)"};
  const CATN={exp:"🎫体験・アクティビティ",hotel:"🏨ホテル・宿",gourmet:"🍽グルメ・お店",spot:"🗺おすすめスポット"};
  const tvTot=travel.reduce((s,r)=>s+(+r.clicks||0),0);
  document.getElementById("travel").innerHTML=travel.length?
    `<table><thead><tr><th>エリア</th><th>カテゴリ</th><th class="n">クリック</th><th class="n">利用者</th></tr></thead><tbody>`+
    travel.sort((a,b)=>(+b.clicks)-(+a.clicks)).map(r=>`<tr><td>${esc(STN[r.store]||r.store)}</td><td>${esc(CATN[r.category]||r.category)}</td><td class="n">${(+r.clicks).toLocaleString()}<div class="bar"><i style="width:${Math.round((+r.clicks)/Math.max(1,tvTot)*100)}%"></i></div></td><td class="n">${(+r.users).toLocaleString()}</td></tr>`).join("")+
    `</tbody></table><div class="note" style="margin:8px 12px">計 ${tvTot.toLocaleString()} クリック／どのエリア・カテゴリが押されるか＝記事化・アフィリ差替の優先度に使う</div>`
    :'<div class="empty">まだクリックがありません（マイページ設置直後）。押されると エリア×カテゴリ で集計されます</div>';
  const aLbl=(AREAS.find(a=>a[0]===AREA)||[])[1]||AREA;
  document.getElementById("note").textContent="最終更新 "+new Date().toLocaleString("ja-JP")+" ／ 表示エリア="+aLbl+" ／ common=サイト共通(店舗選択前) ／ HANDYMAN公式(off_*)＋マイページ旅クリック ／ KEYDROPは kd-analytics.html で別管理 ／ 自己テストは ?internal=1 で除外";
}
load(); setInterval(load,30000);
</script>
