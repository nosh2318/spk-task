<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>車両と料金 ｜ HANDYMAN RENTCAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#002063;--navy2:#0a2e80;--ink:#00163f;--y:#FABE00;--line:#e3e8f1;--mut:#5a6b85}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"Noto Sans JP",-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#eef2f8;color:#16243f;line-height:1.6}
img{max-width:100%;display:block}
.cap{font-family:"Arial Black",Impact,sans-serif;font-style:italic;letter-spacing:.02em}
header{position:sticky;top:0;z-index:20;background:rgba(0,16,51,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:11px 18px}
nav{margin-left:auto;display:flex;gap:20px;align-items:center}
nav a{color:#dfe7f5;text-decoration:none;font-size:12px;font-weight:800;letter-spacing:.05em}
nav .res{background:var(--y);color:#10203f;padding:8px 16px;border-radius:8px;font-weight:900}
.ham{display:none;flex-direction:column;gap:4px;background:none;border:0;cursor:pointer}.ham span{width:24px;height:2.5px;background:#fff;border-radius:2px}
@media(max-width:820px){nav a:not(.res){display:none}.ham{display:flex}}
@media(max-width:480px){.logoFull{display:none}.logoShort{display:inline!important}}
.logoShort{display:none}
.pagehead{background:linear-gradient(120deg,var(--ink),var(--navy));padding:32px 18px 22px;text-align:center;border-bottom:3px solid var(--y)}
.pagehead .en{font-size:30px;color:var(--y)}.pagehead .jp{font-size:12px;color:var(--mut);font-weight:800;letter-spacing:.12em;margin-top:4px}
.wrap{max-width:1080px;margin:0 auto;padding:22px 18px 50px}
.areaTab{display:flex;gap:10px;justify-content:center;margin-bottom:8px}
.areaTab button{flex:0 0 auto;min-width:150px;background:#fff;border:2px solid var(--line);color:#16243f;border-radius:999px;padding:11px 18px;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit}
.areaTab button.on{background:var(--y);color:#10203f;border-color:var(--y)}
.areaNote{text-align:center;font-size:11.5px;color:var(--mut);margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr 1fr}}
.car{background:#fff;box-shadow:0 4px 14px rgba(10,30,80,.06);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.car .pic{height:120px;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #eef2f8;position:relative}
.car .clschip{position:absolute;top:8px;left:8px;background:var(--y);color:#10203f;font-size:11px;font-weight:900;padding:2px 9px;border-radius:6px}
.car .azukari{position:absolute;top:8px;right:8px;background:#7c3aed;color:#fff;font-size:9px;font-weight:800;padding:2px 7px;border-radius:6px}
.car .bd{padding:12px 13px;flex:1;display:flex;flex-direction:column}
.car .nm{font-weight:900;font-size:14px;color:#0a1f44;line-height:1.35}
.car .spec{font-size:11px;color:var(--mut);margin-top:5px}
.car .pr{margin-top:auto;padding-top:10px;display:flex;align-items:baseline;gap:4px}
.car .pr b{font-size:20px;font-weight:900;color:var(--y)}.car .pr small{font-size:10px;color:var(--mut)}
.car .bk{margin-top:9px;background:var(--y);color:#10203f;border:0;border-radius:9px;padding:10px;font-size:13px;font-weight:900;cursor:pointer;text-align:center;text-decoration:none;display:block}
.equip{margin-top:26px;background:linear-gradient(120deg,var(--ink),var(--navy));border:0;border-radius:14px;padding:16px 18px}
.equip h3{font-size:13px;font-weight:900;color:var(--y);margin-bottom:10px}
.equip .tags{display:flex;flex-wrap:wrap;gap:7px}
.equip .tag{font-size:12px;color:#dfeeff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 12px;font-weight:700}
.equip p{font-size:11.5px;color:#a8bae0;margin-top:12px;line-height:1.7}
footer{background:var(--ink);text-align:center;padding:28px 18px;border-top:1px solid var(--line)}
footer .lk{font-size:12px;margin-top:12px}footer a{color:var(--mut);text-decoration:none;margin:0 8px}
</style></head>
<body>
<header><div class="hin">
  <a href="index.html"><img class="logoFull" src="official-clone/img/common/img_logo_v2.png" alt="HANDYMAN RENTCAR" style="height:30px"><img class="logoShort" src="official-clone/img/common/img_logo_short.png" alt="HANDYMAN" style="height:30px"></a>
  <nav><a href="official-vehicles.html">車両と料金</a><a href="#">保険プラン</a><a href="#">ご利用方法</a><a href="#">お問い合わせ</a><a class="res" href="official-design.html#search">予約する</a></nav>
  <button class="ham"><span></span><span></span><span></span></button>
</div></header>

<div class="pagehead"><div class="en cap">CAR TYPE</div><div class="jp">車両と料金</div></div>

<div class="wrap">
  <div class="areaTab"><button id="tNaha" class="on" onclick="setArea('naha')">🌺 那覇エリア</button><button id="tSpk" onclick="setArea('sapporo')">❄️ 札幌エリア</button></div>
  <div class="areaNote" id="areaNote"></div>
  <div class="grid" id="grid"></div>

  <div class="equip">
    <h3>🔧 全車標準装備</h3>
    <div class="tags" id="equipTags"></div>
    <p id="equipNote"></p>
  </div>
</div>

<footer><a href="index.html"><img src="official-clone/img/common/img_logo_v2.png" alt="HANDYMAN" style="height:26px;margin:0 auto"></a><div class="lk"><a href="#">お知らせ</a>・<a href="#">会社概要</a>・<a href="#">貸渡約款</a>・<a href="#">プライバシー</a>・<a href="#">特定商取引法</a></div><div style="color:#5b6c8a;font-size:11px;margin-top:10px">© HANDYMAN RENTCAR</div></footer>

<script>
// KEYDROP実データ（public_keydrop_classes_v 準拠）
const ICON={A:'🚐',A2:'🚐',B:'🚐',B2:'🚐',C:'🚙',S:'🚙',F:'🚗',H:'🚗'};
// KEYDROPと同じ車両画像（那覇=_nha優先→共通フォールバック / 札幌=共通）
function carImg(k,area){var base=(k==='A2')?'A':k;var common='official-assets/cars/class_'+base+'.png';var src=(area==='naha')?'official-assets/cars/class_'+base+'_nha.png':common;return '<img src="'+src+'" onerror="this.onerror=null;this.src=\''+common+'\'" alt="" style="width:100%;height:100%;object-fit:contain;background:#fff;padding:5px">';}
// 店舗別 実データ（KEYDROP public_keydrop_classes_v=札幌 / _nha_v=那覇 準拠）
const STORE={
 sapporo:{note:'❄️ 札幌店：デリバリー専門。札幌市・北広島市へお届け／回収します。',order:['A','A2','B','B2','C','S','F','H'],cls:{A:{label:'Aクラス',seats:'7〜8名',vehicles:'アルファード / ヴェルファイア 等',price:13000},A2:{label:'A2クラス',seats:'7〜8名',vehicles:'アルファード / ヴェルファイア 等',price:12000,azukari:true},B:{label:'Bクラス',seats:'7〜8名',vehicles:'ノア / デリカD5 等',price:11000},B2:{label:'B2クラス',seats:'7〜8名',vehicles:'ノア（高年式モデル）',price:12000,azukari:true},C:{label:'Cクラス',seats:'5名',vehicles:'ロッキー / CX-3 等',price:7000},S:{label:'Sクラス',seats:'5名',vehicles:'ハリアー / CX-5 等',price:9000},F:{label:'Fクラス',seats:'5名',vehicles:'ソリオ 等',price:6000},H:{label:'Hクラス',seats:'5名',vehicles:'アクセラ 等',price:6000}}},
 naha:{note:'🌺 那覇店：デリバリー・空港送迎・来店に対応。',order:['A','B','C','D','F','H','S'],cls:{A:{label:'プレミアムミニバン',seats:'8名',vehicles:'アルファード',price:12000},B:{label:'ミニバン',seats:'8名',vehicles:'ノア / ヴォクシー / アルファード / ヴェルファイア / セレナ',price:9000},C:{label:'コンパクトSUV',seats:'5名',vehicles:'ライズ / ヤリスクロス',price:7000},D:{label:'ミニバン',seats:'8名',vehicles:'ノア / セレナ',price:7000},F:{label:'コンパクト',seats:'5名',vehicles:'アクア / ヴィッツ / ノート',price:3500},H:{label:'セダン / ハイブリッド',seats:'5名',vehicles:'プリウス / プリウスα',price:4500},S:{label:'SUV',seats:'5名',vehicles:'ハリアー',price:5500}}}
};
const EQUIP=['ナビ','ETC車載器','Bluetooth','4WD','スタッドレスタイヤ'];
const EQNOTE='車種・色・仕様はお選びいただけません（同クラス内からランダムでご用意）。全車禁煙・ペット同乗不可。料金は1日（24時間）あたりの目安です。ハイシーズンは別料金。';
function setArea(a){
 document.getElementById('tNaha').classList.toggle('on',a==='naha');
 document.getElementById('tSpk').classList.toggle('on',a==='sapporo');
 var st=STORE[a];
 document.getElementById('areaNote').textContent=st.note;
 document.getElementById('grid').innerHTML=st.order.map(function(k){var c=st.cls[k];return (
   '<div class="car"><div class="pic">'+carImg(k,a)+'<span class="clschip">'+c.label+'</span></div>'+
   '<div class="bd"><div class="nm">'+c.vehicles+'</div><div class="spec">👥 '+c.seats+'</div>'+
   '<div class="pr"><b>¥'+c.price.toLocaleString()+'</b><small>〜 / 1日</small></div>'+
   '<a class="bk" href="index.html#search">この条件で予約</a></div></div>');
 }).join('');
}
document.getElementById('equipTags').innerHTML=EQUIP.map(function(e){return '<span class="tag">'+e+'</span>';}).join('');
document.getElementById('equipNote').textContent=EQNOTE;
setArea('naha');
</script>
</body></html>
