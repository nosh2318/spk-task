*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}

.sg{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;font:inherit;font-weight:600;font-size:14px;color:var(--sidei);background:none;border:0;border-radius:7px;padding:9px 8px;margin-top:2px;cursor:pointer}.sg:hover{background:var(--sideh)}.sg.cur{color:#fff}.sg i{font-style:normal;font-size:11px;color:var(--sidem)}.sgi{padding:2px 0 6px 10px;border-left:1px solid var(--sideh);margin-left:10px}.si:hover{background:var(--sideh)}.si.on{background:var(--sideh);color:#fff;font-weight:600}
.si small{color:var(--sidem);margin-left:4px}
.pb{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:9px;background:#e03131;color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;vertical-align:1px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.top b{font-size:16px}
.top .sp{flex:1}
.top a{color:var(--acc);font-size:13px;text-decoration:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:13px;padding:4px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#view{flex:1;min-height:0;position:relative}
#view iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.pad{padding:16px;overflow-y:auto;height:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow-x:auto}
.card h3{margin:0 0 6px;font-size:15px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv:first-of-type{border-top:0}
.kv b{font-size:18px}
.muted{color:var(--sub);font-size:12px}
.note{background:var(--chip);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:13px}
.note.warn{border-left:4px solid var(--warn)}
.st{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:2px}.st th{font-size:11px;color:var(--sub);font-weight:600;text-align:right;padding:3px 4px}.st td{padding:4px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}.st td:first-child,.st th:first-child{text-align:left}.st tr.sub td{color:var(--sub);font-size:12px;border-top:0;padding-top:0}.sec-h{font-weight:700;font-size:14px;margin:4px 0 8px}.td-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.td-row{font-size:13px}.td-new{margin-top:6px;display:inline-block;padding:4px 10px;border-radius:8px;background:#e8f6ec;color:#17663a;font-weight:600}.td-new b{font-size:18px}.td-al{margin-top:6px;font-size:13px}.td-al a{color:#c0392b;text-decoration:underline;margin-right:6px}.td-cash{margin-top:6px;padding:4px 10px;border-radius:8px;background:var(--chip);font-size:13px}.td-cash.warn{background:#fff1d6;border:1px solid #f0b44c}.td-red{color:#c0392b;font-weight:700}.td-pos{color:#17663a}.td-amt{margin-top:4px;font-size:13px}.td-sh{margin:2px 0 6px;font-size:13px;line-height:1.7}@media (prefers-color-scheme:dark){.td-new{background:#163524;color:#7ee2a2}.td-cash.warn{background:#3a2a10}}
@media (max-width:800px){
 /* スマホ：左メニューは隠し、上の「メニュー」選択で切り替える */
 .app{grid-template-columns:minmax(0,1fr)}
 #side{display:none}
 #msel{display:block;width:100%;font:inherit;font-size:15px;font-weight:600;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
 .top{padding:8px 12px;gap:8px}
 #ttl{display:none}
 .tabs{flex-wrap:nowrap;overflow-x:auto;width:100%;-webkit-overflow-scrolling:touch;scrollbar-width:none}
 .tabs button{flex:0 0 auto}
 #auth{font-size:11px}
 .pad{padding:12px}
 .grid{grid-template-columns:minmax(0,1fr)}
 .card{padding:12px}
 .st{font-size:12px}.st td,.st th{padding:4px 3px}
}
</style>
</head>

  function num(k){var m=t.match(new RegExp('\\b'+k+'\\s*=\\s*(\\d+)'));return m?+m[1]:0;}
  function str(k){var m=t.match(new RegExp('\\b'+k+'\\s*=\\s*"([0-9-]+)"'));return m?m[1]:'9999-99';}
  var T={rev:num('T_REV'),revOct:num('T_REV_OCT'),from:str('T_FROM'),cnt:num('T_CNT'),cntFrom:str('T_CNT_FROM')};
  // 店舗KPI画面の revT(m)／hasT(m) と同じ式（2026-10 だけ T_REV_OCT）
  T.revT=function(m){return m<T.from?0:(m==='2026-10'?T.revOct:T.rev);};
  T.cntT=function(m){return (T.cnt&&m>=T.cntFrom)?T.cnt:0;};
  return T;
 });
}
function utilOf(m){var u=(m&&m.util)||{},rd=0,ad=0;Object.keys(u).forEach(function(c){rd+=u[c].rd||0;ad+=u[c].ad||0;});return {rd:rd,ad:ad,p:ad?rd/ad:null};}
function pct(a,b){return b?Math.round(a/b*100)+'%':'—';}
function addYm(ym,n){var y=+ym.slice(0,4),m=+ym.slice(5)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+String(m+1).padStart(2,'0');}

var _tdTimer=null;
// 目標稼働率＝全店・全月 50%（オーナー決定 2026-10-21）
var T_UTIL=0.5;
// サマリ：上＝直近3か月（当月・翌月・翌々月）のカード／下＝年間（別枠）
function home(){
 var el=document.getElementById('home'),ym=ymNow(),yr=ym.slice(0,4);
 var ST=[['nha','那覇',MAIN_URL,MAIN_ANON,'nha_mtg_h2','nha-mtg-2026h2.html'],['spk','札幌',MAIN_URL,MAIN_ANON,'spk_mtg_h2','spk-mtg-2026h2.html'],['bt','高松',BT_URL,BT_ANON,'bt_mtg_h2','bt-mtg-2026h2.html']];
 todayLoad();clearInterval(_tdTimer);_tdTimer=setInterval(function(){if(cur.k==='home'&&document.getElementById('today'))todayLoad();else clearInterval(_tdTimer);},60000);
 var M3=[[ym,'当月'],[addYm(ym,1),'翌月'],[addYm(ym,2),'翌々月']];
 el.innerHTML='<div class="muted" style="margin-bottom:10px">売上＝返却月（予約＋予約外）／件数＝返却月の予約数／稼働率＝貸出日数÷稼働可能日数（店舗KPIの「グロス」と同じ）。翌月以降の実績は、今日時点で入っている予約の分です。</div>'+
  '<div class="sec-h">各店 本日の状況 <span class="muted" style="font-weight:400">（1分ごとに自動更新）</span></div><div class="grid" id="today"><div class="card"><div class="muted">読み込み中…</div></div></div>'+
  '<div class="sec-h" style="margin-top:18px">直近3か月</div><div class="grid" id="m3">'+M3.map(function(x){return '<div class="card"><h3>'+x[1]+'（'+(+x[0].slice(5))+'月）</h3><div class="muted">読み込み中…</div></div>';}).join('')+'</div>'+
  '<div class="sec-h" style="margin-top:18px">年間（'+yr+'年1〜12月・仮）</div><div class="card" id="yr"><div class="muted">読み込み中…</div></div>'+
  '<div class="sec-h" style="margin-top:18px">3店合計（年間）</div><div class="card" id="tot"><div class="muted">読み込み中…</div></div>'+
  '<div class="muted" style="margin-top:8px" id="src"></div>';
 Promise.all(ST.map(function(s){
  return Promise.all([rpc(s[2],s[3],s[4]),targetsOf(s[5])]).then(function(x){return {s:s,o:(x[0]&&x[0].data)||{},gen:x[0]&&x[0].generated,T:x[1]};},function(e){return {s:s,err:e.message};});
 })).then(function(R){
  function cell(v){return '<td>'+v+'</td>';}
  function head(){return '<tr><th></th>'+R.map(function(r){return '<th>'+r.s[1]+'</th>';}).join('')+'</tr>';}
  function line(l,f,cls){return '<tr'+(cls?' class="'+cls+'"':'')+'><td>'+l+'</td>'+R.map(function(r){return r.err?cell('—'):cell(f(r));}).join('')+'</tr>';}
  // 直近3か月
  document.getElementById('m3').innerHTML=M3.map(function(x){
   var k=x[0];
   function m(r){return r.o[k]||{};}
   return '<div class="card"><h3>'+x[1]+'（'+(+k.slice(5))+'月）</h3><table class="st">'+head()+
    line('目標売上',function(r){var t=r.T.revT(k);return t?yen(t):'<span class="muted">未設定</span>';})+
    line('実績売上',function(r){return '<b>'+yen(m(r).tot_r)+'</b>';})+
    line('進捗',function(r){var t=r.T.revT(k);return t?pct(m(r).tot_r||0,t):'';},'sub')+
    line('目標稼働率',function(){return Math.round(T_UTIL*100)+'%';})+
    line('実績稼働率',function(r){var u=utilOf(m(r));return '<b>'+(u.p==null?'—':Math.round(u.p*100)+'%')+'</b>';})+
    line('目標予約件数',function(r){var t=r.T.cntT(k);return t?t+'件':'<span class="muted">未設定</span>';})+
    line('予約件数',function(r){return '<b>'+(m(r).tot_c||0)+'件</b>';})+
    line('稼働台数',function(r){return (m(r).nveh||0)+'台';})+
    '</table></div>';
  }).join('');
  // 年間（目標がある指標は、目標を置いた月の実績だけで進捗を出す）
  var A=R.map(function(r){
   if(r.err)return null;var a={tR:0,aR:0,aRall:0,fR:0,tC:0,aC:0,aCall:0,rd:0,ad:0};
   for(var i=1;i<=12;i++){var k=yr+'-'+String(i).padStart(2,'0');a.tR+=r.T.revT(k);a.tC+=r.T.cntT(k);}
   Object.keys(r.o).filter(function(k){return k.slice(0,4)===yr;}).forEach(function(k){var mm=r.o[k];
    if(k<=ym){a.aRall+=mm.tot_r||0;a.aCall+=mm.tot_c||0;if(r.T.revT(k))a.aR+=mm.tot_r||0;if(r.T.cntT(k))a.aC+=mm.tot_c||0;var u=utilOf(mm);a.rd+=u.rd;a.ad+=u.ad;}
    else a.fR+=mm.tot_r||0;});
   return a;});
  function yl(l,f,cls){return '<tr'+(cls?' class="'+cls+'"':'')+'><td>'+l+'</td>'+A.map(function(a){return cell(a?f(a):'—');}).join('')+'</tr>';}
  document.getElementById('yr').innerHTML='<table class="st">'+head()+
   yl('目標売上（年）',function(a){return a.tR?yen(a.tR):'<span class="muted">未設定</span>';})+

   yl('目標予約件数（年）',function(a){return a.tC?a.tC+'件':'<span class="muted">未設定</span>';})+
   yl('予約件数（1月〜今月）',function(a){return '<b>'+a.aCall+'件</b>';})+
   yl('進捗（目標を置いた月の件数÷年間目標）',function(a){return a.tC?pct(a.aC,a.tC):'';},'sub')+

  // 3店合計（年間）：目標売上・実績売上・予約件数の合算

  document.getElementById('tot').innerHTML='<table class="st"><tr><th></th><th>3店合計</th></tr>'+
   '<tr><td>目標売上（年）</td><td>'+yen(S.tR)+'</td></tr>'+
   '<tr><td>実績売上（1月〜今月）</td><td><b>'+yen(S.aR)+'</b></td></tr>'+
   '<tr class="sub"><td>進捗（目標を置いた月の実績÷年間目標）</td><td>'+pct(S.aRt,S.tR)+'</td></tr>'+
   '<tr><td>予約件数（1月〜今月）</td><td><b>'+S.aC.toLocaleString()+'件</b></td></tr>'+
   '</table>'+(ok.length<A.length?'<div class="muted">※読めなかった店を除いた合計です</div>':'');
  document.getElementById('src').textContent='出所：'+R.map(function(r){return r.s[1]+'＝'+r.s[4]+(r.err?'（読めませんでした：'+r.err+'）':'（'+(r.gen||'')+'）')+'・目標＝'+r.s[5];}).join('／');
 });
}
