<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>HANDYMAN 本部ダッシュボード</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1c1a;--sub:#6b6862;--line:#e4e1da;--acc:#1f6feb;--side:#1f2026;--sidei:#c9cbd3;--sideh:#2e2f38;--sidem:#8b8e99;--warn:#b26a00;--chip:#efede8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#201f1e;--ink:#eceae5;--sub:#a29e96;--line:#34322f;--acc:#5b9bff;--warn:#e7a43a;--chip:#2a2927}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100vh}
#side{background:var(--side);color:var(--sidei);overflow-y:auto;padding:14px 10px 24px}
.brand{color:#fff;font-weight:700;font-size:15px;padding:2px 8px 8px}
.sh{font-size:11px;color:var(--sidem);margin:14px 8px 4px;letter-spacing:.06em}
.si{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-radius:7px;padding:6px 8px;cursor:pointer}
.si:hover{background:var(--sideh)}.si.on{background:var(--sideh);color:#fff;font-weight:600}
.si small{color:var(--sidem);margin-left:4px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.top b{font-size:16px}
.top .sp{flex:1}
.top a{color:var(--acc);font-size:13px;text-decoration:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:13px;padding:4px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#view{flex:1;min-height:0;position:relative}
#view iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.pad{padding:16px;overflow-y:auto;height:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{margin:0 0 6px;font-size:15px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv:first-of-type{border-top:0}
.kv b{font-size:18px}
.muted{color:var(--sub);font-size:12px}
.note{background:var(--chip);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:13px}
.note.warn{border-left:4px solid var(--warn)}
.st{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:2px}.st th{font-size:11px;color:var(--sub);font-weight:600;text-align:right;padding:3px 4px}.st td{padding:4px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}.st td:first-child,.st th:first-child{text-align:left}.st tr.sub td{color:var(--sub);font-size:12px;border-top:0;padding-top:0}.sec-h{font-weight:700;font-size:14px;margin:4px 0 8px}
@media (max-width:800px){
 .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
 #side{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;white-space:nowrap}
 .sh,.brand{display:none}.si{width:auto;padding:5px 10px}
}
</style>
</head>
<body>
<div class="app">
 <nav id="side"></nav>
 <div class="main">
  <div class="top"><b id="ttl"></b><div class="tabs" id="tabs"></div><span class="sp"></span><span id="auth" class="muted"></span><a id="newtab" target="_blank" rel="noopener">新しいタブで開く ↗</a></div>
  <div id="view"></div>
 </div>
</div>
<script>
// 統合ダッシュボード（第1段）：既存画面を1か所から開くだけ。新しい集計・データのコピーは作らない。
// 設計メモ docs/設計_統合ダッシュボード_集客データ移行_2026-10-21.md
var MAIN_URL='https://ckrxttbnawkclshczsia.supabase.co',MAIN_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
var BT_URL='https://ggqugvyskyiblxiycpci.supabase.co',BT_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18';
var BTA='https://buddica-touring.github.io/app/';
var SEC=[
 {g:'全体',items:[{k:'home',l:'サマリ'},
  {k:'apps',l:'店舗APP',tabs:[['那覇','https://nosh2318.github.io/naha-project/'],['札幌','index.html'],['高松',BTA]]}]},
 {g:'業績',items:[
  {k:'kpi',l:'店舗KPI',tabs:[['那覇','nha-mtg-2026h2.html'],['札幌','spk-mtg-2026h2.html'],['高松','bt-mtg-2026h2.html']]},
  {k:'acq',l:'獲得・OTA実績',tabs:[['札幌','hp-acquire.html?store=spk'],['那覇','hp-acquire.html?store=nha'],['高松 HDM',BTA+'hp-acquire.html?store=bt&scope=hdm'],['高松 費用・CPA（HDM＋BUDDICA）',BTA+'cost-cpa.html']]},
  {k:'acct',l:'月次会計',tabs:[['全店','hq-monthly.html']]},
  {k:'fleet',l:'車両収益',sub:'札幌',tabs:[['札幌','fleet-report.html']]},
  {k:'ext',l:'外部レポート',tabs:[['札幌 月次レポート','report.html']]}
 ]},
 {g:'BUDDICA',items:[
  {k:'buddica',l:'BUDDICA',tabs:[['調達',BTA+'procurement.html'],['進捗表','https://docs.google.com/spreadsheets/d/1XYx_aqJk-qm4mf8gW_p9BQiibsamC23t--BniNoB3a4/edit?rm=minimal#gid=1851333794'],['予算・原価','https://docs.google.com/spreadsheets/d/1L_mMMZv_3TbAeAGE2WrjzavddClxmpYecVP_lY3A5lY/edit?rm=minimal#gid=1584833199']]}
 ]},
 {g:'集客・販売',items:[
  {k:'mkt',l:'集客',tabs:[['集客ツール','https://claude.ai/artifact/7o98bxgmCGS9VjbxLcagg5']],ext:true,
   note:'集客ツールは claude.ai 上の画面のため、ここには埋め込めません。データをこの画面へ移すまでは「新しいタブで開く」から使ってください。'},
  {k:'price',l:'価格・クーポン',tabs:[['価格','price-controller.html'],['クーポン','https://rent-handyman.com/official-coupons.html']]},
  {k:'site',l:'サイト解析',tabs:[['公式サイト','handyman-analytics.html']]},
  {k:'mypage',l:'マイページ',tabs:[['管理','mypage-admin.html'],['利用実態','dashboard.html']]},
  {k:'quiz',l:'クイズ利用',tabs:[['クイズ','quiz-dashboard.html']]}
 ]},
 {g:'運営',items:[
  {k:'cs',l:'お客様対応',tabs:[['問い合わせ管理','https://handyman-inquiry.vercel.app/'],['チャット（札幌・那覇）','cs-chat-admin.html'],['高松 問い合わせ',BTA+'inquiry.html'],['LINE フォーム回答','https://step.lme.jp/basic/form-answer',1]],
   extNote:'Lメッセージは外部サービスのため、ここには埋め込めません（ログインが保持されません）。新しいタブで開いてください。'},
  {k:'shift',l:'シフト',tabs:[['3店','shift-hub.html']]},
  {k:'partner',l:'協力会社',tabs:[['協力会社ビュー','partner.html?owner=PARTNER_TEST']]},
  {k:'adv',l:'立替精算',tabs:[['立替金','advance.html']]},
  {k:'card',l:'カード支出',none:true,
   note:'カード支出の科目別レポートは、カード明細がファイルの中に入ったこのパソコンだけの資料で、科目の振り分けもこのパソコンのブラウザの中に保存されています。この統合画面は誰でも開ける場所にあるため、明細をそのまま載せることはできません。データをログインが必要な置き場所に移すまで、今のファイル（デスクトップの カード支出_科目別レポート.html）を使ってください。'},
  {k:'inv',l:'請求書',none:true,
   note:'請求書管理ツールは、発行した請求書がこのパソコンのブラウザの中だけに保存されています。データを移すまで、今のツール（デスクトップの HANDYMAN/invoices/invoice_manager.html）をそのまま使ってください。ブラウザの閲覧データは消さないでください。'}
 ]}
];
var ALL={};SEC.forEach(function(s){s.items.forEach(function(i){ALL[i.k]=i;});});
var cur={k:'home',t:0};
try{var sv=JSON.parse(localStorage.getItem('hq-ui')||'{}');if(ALL[sv.k]){cur.k=sv.k;cur.t=+sv.t||0;}}catch(e){}
var hk=location.hash.replace('#','').split('/');if(ALL[hk[0]]){cur.k=hk[0];cur.t=+hk[1]||0;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function side(){
 document.getElementById('side').innerHTML='<div class="brand">HANDYMAN 本部</div>'+SEC.map(function(s){
  return '<div class="sh">'+esc(s.g)+'</div>'+s.items.map(function(i){return '<button class="si'+(cur.k===i.k?' on':'')+'" data-k="'+i.k+'">'+esc(i.l)+(i.sub?'<small>'+esc(i.sub)+'</small>':'')+'</button>';}).join('');
 }).join('');
}
function show(){
 var it=ALL[cur.k];side();
 document.getElementById('ttl').textContent=it.l;
 var tabs=it.tabs||[];if(cur.t>=tabs.length)cur.t=0;
 document.getElementById('tabs').innerHTML=tabs.length>1?tabs.map(function(t,i){return '<button class="'+(i===cur.t?'on':'')+'" data-t="'+i+'">'+esc(t[0])+'</button>';}).join(''):'';
 var nt=document.getElementById('newtab'),v=document.getElementById('view');
 try{localStorage.setItem('hq-ui',JSON.stringify(cur));}catch(e){}
 history.replaceState(null,'','#'+cur.k+(cur.t?'/'+cur.t:''));
 if(cur.k==='home'){nt.style.display='none';v.innerHTML='<div class="pad" id="home"></div>';home();return;}
 if(it.none){nt.style.display='none';v.innerHTML='<div class="pad"><div class="note warn">'+esc(it.note)+'</div></div>';return;}
 var url=tabs[cur.t][1];nt.style.display='';nt.href=url;
 if(it.ext||tabs[cur.t][2]){v.innerHTML='<div class="pad"><div class="note">'+esc(it.ext?it.note:it.extNote)+'</div><a class="card" style="display:block;text-decoration:none;color:var(--acc)" href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(tabs[cur.t][0])+' を開く ↗</a></div>';return;}
 v.innerHTML='<iframe src="'+esc(url)+'" title="'+esc(it.l+' '+tabs[cur.t][0])+'"></iframe>';
}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-k]');if(b){cur={k:b.dataset.k,t:0};show();return;}
 var t=e.target.closest('[data-t]');if(t){cur.t=+t.dataset.t;show();}
});
var yen=function(n){return '¥'+Math.round(+n||0).toLocaleString();};
function ymNow(){var d=new Date(Date.now()+9*3600e3);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0');}
function rpc(url,anon,fn){return fetch(url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:anon,Authorization:'Bearer '+anon,'Content-Type':'application/json'},body:'{}'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
// 目標は各店の店舗KPI画面（*-mtg-2026h2.html）の定数が正本。ここでは写さず、その画面のソースから毎回読む。
function targetsOf(page){
 return fetch(page,{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
  function num(k){var m=t.match(new RegExp('\\b'+k+'\\s*=\\s*(\\d+)'));return m?+m[1]:0;}
  function str(k){var m=t.match(new RegExp('\\b'+k+'\\s*=\\s*"([0-9-]+)"'));return m?m[1]:'9999-99';}
  var T={rev:num('T_REV'),revOct:num('T_REV_OCT'),from:str('T_FROM'),cnt:num('T_CNT'),cntFrom:str('T_CNT_FROM')};
  // 店舗KPI画面の revT(m)／hasT(m) と同じ式（2026-10 だけ T_REV_OCT）
  T.revT=function(m){return m<T.from?0:(m==='2026-10'?T.revOct:T.rev);};
  T.cntT=function(m){return (T.cnt&&m>=T.cntFrom)?T.cnt:0;};
  return T;
 });
}
function utilOf(m){var u=(m&&m.util)||{},rd=0,ad=0;Object.keys(u).forEach(function(c){rd+=u[c].rd||0;ad+=u[c].ad||0;});return {rd:rd,ad:ad,p:ad?rd/ad:null};}
function pct(a,b){return b?Math.round(a/b*100)+'%':'—';}
function addYm(ym,n){var y=+ym.slice(0,4),m=+ym.slice(5)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+String(m+1).padStart(2,'0');}
// サマリ：上＝直近3か月（当月・翌月・翌々月）のカード／下＝年間（別枠）
function home(){
 var el=document.getElementById('home'),ym=ymNow(),yr=ym.slice(0,4);
 var ST=[['nha','那覇',MAIN_URL,MAIN_ANON,'nha_mtg_h2','nha-mtg-2026h2.html'],['spk','札幌',MAIN_URL,MAIN_ANON,'spk_mtg_h2','spk-mtg-2026h2.html'],['bt','高松',BT_URL,BT_ANON,'bt_mtg_h2','bt-mtg-2026h2.html']];
 var M3=[[ym,'当月'],[addYm(ym,1),'翌月'],[addYm(ym,2),'翌々月']];
 el.innerHTML='<div class="muted" style="margin-bottom:10px">売上＝返却月（予約＋予約外）／件数＝返却月の予約数／稼働率＝貸出日数÷稼働可能日数（店舗KPIの「グロス」と同じ）。翌月以降の実績は、今日時点で入っている予約の分です。</div>'+
  '<div class="sec-h">直近3か月</div><div class="grid" id="m3">'+M3.map(function(x){return '<div class="card"><h3>'+x[1]+'（'+(+x[0].slice(5))+'月）</h3><div class="muted">読み込み中…</div></div>';}).join('')+'</div>'+
  '<div class="sec-h" style="margin-top:18px">年間（'+yr+'年1〜12月・仮）</div><div class="card" id="yr"><div class="muted">読み込み中…</div></div>'+
  '<div class="muted" style="margin-top:8px" id="src"></div>';
 Promise.all(ST.map(function(s){
  return Promise.all([rpc(s[2],s[3],s[4]),targetsOf(s[5])]).then(function(x){return {s:s,o:(x[0]&&x[0].data)||{},gen:x[0]&&x[0].generated,T:x[1]};},function(e){return {s:s,err:e.message};});
 })).then(function(R){
  function cell(v){return '<td>'+v+'</td>';}
  function head(){return '<tr><th></th>'+R.map(function(r){return '<th>'+r.s[1]+'</th>';}).join('')+'</tr>';}
  function line(l,f,cls){return '<tr'+(cls?' class="'+cls+'"':'')+'><td>'+l+'</td>'+R.map(function(r){return r.err?cell('—'):cell(f(r));}).join('')+'</tr>';}
  // 直近3か月
  document.getElementById('m3').innerHTML=M3.map(function(x){
   var k=x[0];
   function m(r){return r.o[k]||{};}
   return '<div class="card"><h3>'+x[1]+'（'+(+k.slice(5))+'月）</h3><table class="st">'+head()+
    line('目標売上',function(r){var t=r.T.revT(k);return t?yen(t):'<span class="muted">未設定</span>';})+
    line('実績売上',function(r){return '<b>'+yen(m(r).tot_r)+'</b>';})+
    line('進捗',function(r){var t=r.T.revT(k);return t?pct(m(r).tot_r||0,t):'';},'sub')+
    line('目標稼働率',function(){return '<span class="muted">未設定</span>';})+
    line('実績稼働率',function(r){var u=utilOf(m(r));return '<b>'+(u.p==null?'—':Math.round(u.p*100)+'%')+'</b>';})+
    line('目標予約件数',function(r){var t=r.T.cntT(k);return t?t+'件':'<span class="muted">未設定</span>';})+
    line('予約件数',function(r){return '<b>'+(m(r).tot_c||0)+'件</b>';})+
    line('稼働台数',function(r){return (m(r).nveh||0)+'台';})+
    '</table></div>';
  }).join('');
  // 年間（目標がある指標は、目標を置いた月の実績だけで進捗を出す）
  var A=R.map(function(r){
   if(r.err)return null;var a={tR:0,aR:0,aRall:0,fR:0,tC:0,aC:0,aCall:0,rd:0,ad:0};
   for(var i=1;i<=12;i++){var k=yr+'-'+String(i).padStart(2,'0');a.tR+=r.T.revT(k);a.tC+=r.T.cntT(k);}
   Object.keys(r.o).filter(function(k){return k.slice(0,4)===yr;}).forEach(function(k){var mm=r.o[k];
    if(k<=ym){a.aRall+=mm.tot_r||0;a.aCall+=mm.tot_c||0;if(r.T.revT(k))a.aR+=mm.tot_r||0;if(r.T.cntT(k))a.aC+=mm.tot_c||0;var u=utilOf(mm);a.rd+=u.rd;a.ad+=u.ad;}
    else a.fR+=mm.tot_r||0;});
   return a;});
  function yl(l,f,cls){return '<tr'+(cls?' class="'+cls+'"':'')+'><td>'+l+'</td>'+A.map(function(a){return cell(a?f(a):'—');}).join('')+'</tr>';}
  document.getElementById('yr').innerHTML='<table class="st">'+head()+
   yl('目標売上（年）',function(a){return a.tR?yen(a.tR):'<span class="muted">未設定</span>';})+
   yl('実績売上（1月〜今月）',function(a){return '<b>'+yen(a.aRall)+'</b>';})+
   yl('進捗（目標を置いた月の実績÷年間目標）',function(a){return a.tR?pct(a.aR,a.tR):'';},'sub')+
   yl('先の月の予約済み売上（年内）',function(a){return yen(a.fR);})+
   yl('目標稼働率',function(){return '<span class="muted">未設定</span>';})+
   yl('実績稼働率（1月〜今月）',function(a){return '<b>'+(a.ad?Math.round(a.rd/a.ad*100)+'%':'—')+'</b>';})+
   yl('目標予約件数（年）',function(a){return a.tC?a.tC+'件':'<span class="muted">未設定</span>';})+
   yl('予約件数（1月〜今月）',function(a){return '<b>'+a.aCall+'件</b>';})+
   yl('進捗（目標を置いた月の件数÷年間目標）',function(a){return a.tC?pct(a.aC,a.tC):'';},'sub')+
   '</table>';
  document.getElementById('src').textContent='出所：'+R.map(function(r){return r.s[1]+'＝'+r.s[4]+(r.err?'（読めませんでした：'+r.err+'）':'（'+(r.gen||'')+'）')+'・目標＝'+r.s[5];}).join('／');
 });
}
// 管理APP（このサイト）のログイン状態。ログイン情報は管理APPと共有＝ここでログインし直す必要はない
function authState(){var ok=false;try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('sb-ckrxttbnawkclshczsia-auth-token')===0){var v=JSON.parse(localStorage.getItem(k)||'null');var s=v&&(v.currentSession||v.session||v);if(s&&(s.refresh_token||s.access_token))ok=true;}}}catch(e){}
 var a=document.getElementById('auth');a.innerHTML=ok?'🔓 管理APPにログイン済み':'🔒 未ログイン：<a href="index.html" target="_blank" rel="noopener">管理APP</a>でログインすると全画面に数字が出ます';a.style.color=ok?'':'var(--warn)';}
authState();window.addEventListener('focus',authState);
window.addEventListener('hashchange',function(){var h=location.hash.replace('#','').split('/');if(ALL[h[0]]&&(h[0]!==cur.k||(+h[1]||0)!==cur.t)){cur={k:h[0],t:+h[1]||0};show();}});
show();
</script>

</html>
