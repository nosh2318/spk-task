<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>札幌 配達先→拠点からの距離（DEL/COL自動時間の土台）</title>
<!-- place-geo v2 : 住所→座標→拠点(北5西16)からの直線距離km を spk_place_geo に保存。DEL/COL時間=基本+km×係数 の土台。ジオコーディングのみ(駅/経路は使わない=簡略) 2026-08-10 -->
<style>
body{font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;margin:0;background:#f1f5f9;color:#0f172a}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:17px;margin:8px 0}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:12px}
button{padding:12px 20px;border-radius:10px;border:none;background:#1e40af;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
button:disabled{background:#94a3b8;cursor:default}
.bar{height:12px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin:10px 0}
.bar>i{display:block;height:100%;background:#2563eb;width:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid #f1f5f9;padding:6px 8px;text-align:left}
th{background:#f8fafc;position:sticky;top:0}
.tbl{max-height:55vh;overflow:auto;border:1px solid #e2e8f0;border-radius:8px}
.muted{color:#64748b;font-size:13px}
.ok{color:#059669;font-weight:700}.ng{color:#dc2626;font-weight:700}
.km{font-family:monospace;font-weight:800;font-size:15px}
.stat{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin-top:8px}
.stat b{font-size:22px}
</style></head>
<body><div class="wrap">
<h1>🗺 配達先 → 拠点からの距離（DEL/COL自動時間の土台）</h1>
<div class="card">
  <div class="muted">拠点＝札幌市中央区北5条西16丁目1-1。DEL/COLの住所を「拠点から何km」に変換して保存するだけの画面です（同じ住所は1回だけ）。<b>ボタンを押して待つだけ</b>。</div>
  <div class="stat">
    <span>対象住所：<b id="cntAll">…</b></span>
    <span>未処理：<b id="cntTodo">…</b></span>
    <span>完了：<b id="cntDone" class="ok">0</b></span>
    <span>失敗：<b id="cntErr" class="ng">0</b></span>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div style="display:flex;gap:12px;align-items:center;margin-top:8px">
    <button id="start" disabled>読み込み中…</button>
    <span id="status" class="muted"></span>
  </div>
</div>
<div class="card"><div class="tbl"><table id="rt"><thead><tr>
  <th>住所</th><th>拠点からの距離</th><th>状態</th>
</tr></thead><tbody></tbody></table></div></div>
</div>
<script>
const SB="https://ckrxttbnawkclshczsia.supabase.co";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
const YARD_ADDR="北海道札幌市中央区北5条西16丁目1-1";
const $=s=>document.querySelector(s);
function sbGet(p){return fetch(SB+"/rest/v1/"+p,{headers:{apikey:ANON,Authorization:"Bearer "+ANON}}).then(r=>r.json());}
function sbUpsert(row){return fetch(SB+"/rest/v1/spk_place_geo",{method:"POST",headers:{apikey:ANON,Authorization:"Bearer "+ANON,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(row)});}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let geocoder,yard=null,done=0,err=0;
function badAddr(p){p=(p||"").trim();return !p||/未定|デモ|^-+$/.test(p);}
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function hkm(a,b){const R=6371,dl=(b.lat-a.lat)*Math.PI/180,dg=(b.lng-a.lng)*Math.PI/180,la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;const h=Math.sin(dl/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dg/2)**2;return +(2*R*Math.asin(Math.sqrt(h))).toFixed(2);}
function addRow(addr,km,state,cls){const tb=$("#rt tbody");const tr=document.createElement("tr");tr.innerHTML="<td>"+esc(addr)+"</td><td class='km'>"+esc(km)+"</td><td class='"+(cls||"")+"'>"+esc(state)+"</td>";tb.insertBefore(tr,tb.firstChild);}
function gGeocode(addr){return new Promise(res=>{geocoder.geocode({address:addr,region:"jp",componentRestrictions:{country:"jp"}},(r,s)=>res(s==="OK"&&r[0]?r[0].geometry.location:null));});}
async function init(){
  geocoder=new google.maps.Geocoder();
  const yl=await gGeocode(YARD_ADDR);
  if(!yl){$("#status").innerHTML="<span class='ng'>拠点の座標取得に失敗（Google Geocoding APIの設定を確認）</span>";return;}
  yard={lat:yl.lat(),lng:yl.lng()};
  const rs=await sbGet("reservations?select=del_place,col_place&lend_date=gte."+new Date(Date.now()-90*864e5).toISOString().slice(0,10));
  const cached=await sbGet("spk_place_geo?select=address");
  const have=new Set((cached||[]).map(x=>x.address));
  const set=new Set();(rs||[]).forEach(r=>{[r.del_place,r.col_place].forEach(p=>{if(!badAddr(p))set.add(p.trim());});});
  window._all=[...set];window._have=have;
  $("#cntAll").textContent=window._all.length;
  $("#cntTodo").textContent=window._all.filter(a=>!have.has(a)).length;
  $("#start").disabled=false;$("#start").textContent="▶ 距離を計算して保存";
}
async function run(){
  const q=window._all.filter(a=>!window._have.has(a));
  $("#start").disabled=true;$("#start").textContent="処理中…";done=0;err=0;const total=q.length;
  if(!total){$("#status").textContent="新しい住所はありません（全てキャッシュ済み）";$("#start").disabled=false;$("#start").textContent="▶ 再実行";return;}
  for(let i=0;i<q.length;i++){
    const addr=q[i];$("#status").textContent="("+(i+1)+"/"+total+") "+addr;
    try{
      const loc=await gGeocode(addr);await sleep(150);
      if(!loc){err++;$("#cntErr").textContent=err;addRow(addr,"—","住所解決不可","ng");}
      else{const c={lat:loc.lat(),lng:loc.lng()};const km=hkm(yard,c);
        await sbUpsert({address:addr,lat:c.lat,lng:c.lng,drive_km:km,updated_at:new Date().toISOString()});
        done++;$("#cntDone").textContent=done;addRow(addr,km+" km","✓保存","ok");}
    }catch(e){err++;$("#cntErr").textContent=err;addRow(addr,"—","エラー","ng");}
    $("#prog").style.width=Math.round((i+1)/total*100)+"%";
  }
  $("#status").textContent="完了（保存"+done+"・失敗"+err+"）";$("#start").disabled=false;$("#start").textContent="▶ 再実行";
}
window.addEventListener("load",()=>{$("#start").addEventListener("click",run);});
window._gmapReady=init;
</script>
<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCoX1EyEx-N5A0r4vRzC1KmVp3T29HILbI&callback=_gmapReady&language=ja&region=JP"></script>
</body></html>
