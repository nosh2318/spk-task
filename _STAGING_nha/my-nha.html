<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>HANDYMAN 那覇 マイページ（カルテ）</title>
<meta name="theme-color" content="#1e3a5f">
<meta http-equiv="Cache-Control" content="no-cache">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN',sans-serif;background:#eef1f5;color:#1e293b;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:520px;margin:0 auto}
.robar{background:#0F1F45;color:#fff;display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:13px;font-weight:700}
.robar button{background:#fff;color:#0F1F45;border:none;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}
.top{background:linear-gradient(135deg,#1e3a5f,#2d5a87);color:#fff;padding:18px 16px 14px;text-align:center}
.logo{font-size:24px;font-weight:900;letter-spacing:1px}
.logo b{color:#FABE00}
.store{font-size:12px;opacity:.8;margin-top:2px}
.hello{padding:16px 16px 6px;font-size:19px;font-weight:800}
.hello span{display:block;font-size:12px;color:#64748b;font-weight:600;margin-top:2px}
.card{background:#fff;border-radius:14px;margin:10px 12px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.card h3{font-size:12px;color:#64748b;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.row{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid #f1f5f9;gap:10px}
.row:last-child{border-bottom:none}
.row .k{font-size:12px;color:#94a3b8;font-weight:600;flex-shrink:0;min-width:78px}
.row .v{font-size:14px;font-weight:700;text-align:right;word-break:break-word}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px}
.b-ok{background:#dcfce7;color:#15803d}
.b-cancel{background:#fee2e2;color:#b91c1c}
.b-ins{background:#fef3c7;color:#92400e}
.bus-note{background:#eef4ff;border:1px solid #c7d7ff;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:12px;color:#1e40af;font-weight:600;line-height:1.5}
.bus-note a{display:inline-block;margin-top:6px;background:#1e3a5f;color:#fff;text-decoration:none;font-size:12px;font-weight:800;padding:7px 14px;border-radius:8px}
.hist{font-size:12px;color:#475569;padding:6px 0;border-bottom:1px dashed #e2e8f0;display:flex;gap:8px}
.hist:last-child{border-bottom:none}
.hist .hd{color:#94a3b8;flex-shrink:0;font-size:11px}
.chgbadge{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;color:#b45309;background:#fef3c7;border:1px solid #fde68a;border-radius:6px;padding:1px 6px;white-space:nowrap}
.foot{text-align:center;font-size:10px;color:#94a3b8;padding:16px 12px 26px}
.loading{text-align:center;padding:60px 20px;color:#94a3b8}
.spin{width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#2d5a87;border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{text-align:center;padding:50px 20px;color:#b91c1c;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading"><div class="spin"></div>読み込み中...</div>
</div>

<script>
// ============================================================
// my-nha.html : HANDYMAN 那覇 マイページ（内部カルテ・閲覧専用）
// 2026-07-08 / omni  ※札幌 my.html を複製元に、那覇の受け渡し区分(バス/個別時間)へ改修。
// このページは常に閲覧専用（スタッフが ?t=<token>&ro=1 で開く）。変更/依頼UIは無し。
// データは Edge Function handyman-mypage-nha(lookup) から取得＝OPシート(nha_tasks)と情報連動。
// ============================================================
const FN = "https://ckrxttbnawkclshczsia.supabase.co/functions/v1/handyman-mypage-nha";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
const VER = "v1.0 那覇カルテ 閲覧専用";
const BUS_URL = "bus.html";
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const qs = new URLSearchParams(location.search);
const TOKEN = (qs.get("t")||"").trim();
// ro=1 は札幌との呼称統一（このページは常に閲覧専用なので実質は表示バナー切替のみ）
const RO = qs.get("ro")==="1";

const CLASS_JP = {A:"アルファード/ヴェルファイア",A2:"アルファード/ヴェルファイア(預)",B:"ノア/デリカ",B2:"ノア(預)",C:"ロッキー/CX-3",S:"ハリアー/CX-5",F:"ルーミー/ソリオ",H:"カローラ/アクセラ",D:"軽自動車"};
const OTA_JP = {J:"じゃらん",R:"楽天",S:"skyticket",O:"エアトリ",RC:"レンタカーcom",G:"GoGoOut",HP:"オフィシャル(HP)",SP:"オフィシャル(HP)",direct:"直販",KEYDROP:"KEYDROP"};

// 受け渡し区分の表示種別（handoff確定ルール）
//  お届け: PUB→バス時刻表 / DEL・PU→場所+時間 / 来店→時間のみ
//  回収  : BDB→バス時刻表 / COL→場所+時間 / 返却→時間のみ / BD→時間のみ(個別)
function delKind(vt){
  vt=String(vt||"").trim();
  if(vt==="PUB")return "bus";
  if(vt==="来店")return "time";
  if(vt==="DEL"||vt==="PU"||vt==="BD")return "place";  // 個別=場所+時間
  return "place"; // 不明時は情報を出す側に倒す(場所+時間・空なら未確定表示)
}
function colKind(rt){
  rt=String(rt||"").trim();
  if(rt==="BDB")return "bus";
  if(rt==="返却")return "time";
  if(rt==="COL"||rt==="PU"||rt.indexOf("BD")===0)return "place";
  return "place";
}
const VT_JP = {PUB:"空港バス送迎",BDB:"空港バス送迎",DEL:"お届け",COL:"回収",来店:"来店",返却:"店頭返却",PU:"個別送迎",BD:"個別送迎","BD(バス)":"バス送迎"};
function vtLabel(v){return VT_JP[String(v||"").trim()]||String(v||"")||"—";}

function busBlock(title){
  return `<div class="bus-note">🚌 <b>${title}</b>は<b>無料シャトルバス</b>をご利用いただきます（那覇空港 ⇔ HANDYMANヤード）。<br>下記の時刻表でご確認ください。
    <br><a href="${BUS_URL}" target="_blank" rel="noopener">🚌 シャトルバス時刻表を開く</a></div>`;
}
function timeVal(v){v=String(v||"").trim();return v?esc(v):'<span style="color:#94a3b8">未設定</span>';}
function placeVal(v){v=String(v||"").trim();return v?esc(v):'<span style="color:#dc2626">未確定</span>';}

// 適用済み変更(applied)の「変更前」値を出す（recentChanges から）
function origOf(recent,field){
  const rc=(recent||[]).filter(c=>c.field===field&&c.status==="applied");
  if(!rc.length)return"";
  const c=rc[0];const ov=String(c.old_value||"").trim(),nv=String(c.new_value||"").trim();
  return (ov&&ov!==nv)?ov:"";
}
function chgBadge(recent,field){
  const ov=origOf(recent,field);
  return ov?`<span class="chgbadge">🔄 変更前 ${esc(ov)}</span>`:"";
}

function render(d){
  const r=d.reservation||{};
  const recent=d.recentChanges||[];
  const cls=CLASS_JP[r.vehicle_class]||r.vehicle_class||"—";
  const ota=r.ota_label||OTA_JP[r.ota]||r.ota||"—";
  const cancelled=r.cancelled;
  const del=r.delivery||{}, col=r.collection||{};
  const dk=delKind(del.visit_type), ck=colKind(col.return_type);

  // オプション
  const opts=[];
  if(r.opt_c)opts.push("チャイルドシート×"+r.opt_c);
  if(r.opt_b)opts.push("ベビーシート×"+r.opt_b);
  if(r.opt_j)opts.push("ジュニアシート×"+r.opt_j);
  if(r.opt_usb)opts.push("USB");
  const optStr=opts.length?opts.join("・"):"なし";

  // お届けカード
  let delRows="";
  if(dk==="bus"){
    delRows=`<div class="row"><span class="k">受け渡し</span><span class="v">${vtLabel(del.visit_type)}</span></div>
      ${busBlock("お届け")}`;
  }else if(dk==="time"){
    delRows=`<div class="row"><span class="k">受け渡し</span><span class="v">${vtLabel(del.visit_type)}</span></div>
      <div class="row"><span class="k">お渡し時間</span><span class="v">${timeVal(del.time)}${chgBadge(recent,'lend_time')}</span></div>`;
  }else{
    delRows=`<div class="row"><span class="k">受け渡し</span><span class="v">${vtLabel(del.visit_type)}</span></div>
      <div class="row"><span class="k">お届け場所</span><span class="v">${placeVal(del.place)}${chgBadge(recent,'del_place')}</span></div>
      <div class="row"><span class="k">お届け時間</span><span class="v">${timeVal(del.time)}${chgBadge(recent,'lend_time')}</span></div>`;
  }
  // 回収カード
  let colRows="";
  if(ck==="bus"){
    colRows=`<div class="row"><span class="k">受け渡し</span><span class="v">${vtLabel(col.return_type)}</span></div>
      ${busBlock("ご返却")}`;
  }else if(ck==="time"){
    colRows=`<div class="row"><span class="k">受け渡し</span><span class="v">${vtLabel(col.return_type)}</span></div>
      <div class="row"><span class="k">返却時間</span><span class="v">${timeVal(col.time)}${chgBadge(recent,'return_time')}</span></div>`;
  }else{
    colRows=`<div class="row"><span class="k">受け渡し</span><span class="v">${vtLabel(col.return_type)}</span></div>
      <div class="row"><span class="k">回収場所</span><span class="v">${placeVal(col.place)}${chgBadge(recent,'col_place')}</span></div>
      <div class="row"><span class="k">回収時間</span><span class="v">${timeVal(col.time)}${chgBadge(recent,'return_time')}</span></div>`;
  }

  // 履歴（最近の変更）
  let histHtml="";
  if(recent.length){
    histHtml = recent.slice(0,8).map(c=>{
      const d2=String(c.created_at||"").slice(0,16).replace("T"," ");
      const who=c.source==="staff"?"担当":"お客様";
      const st={applied:"反映",requested:"依頼",approved:"承認",rejected:"見送り"}[c.status]||c.status||"";
      const nv=String(c.new_value||"").trim();
      return `<div class="hist"><span class="hd">${esc(d2)}</span><span>${who}が ${esc(c.field)} を「${esc(nv)}」に（${esc(st)}）</span></div>`;
    }).join("");
  }

  $("#app").innerHTML = `
  ${RO?`<div class="robar"><button onclick="try{window.close()}catch(e){};setTimeout(function(){history.length>1?history.back():(location.href='index.html')},120)">← APPに戻る</button><span style="flex:1;text-align:center">🔒 スタッフ確認用（閲覧のみ）</span></div>`:""}
  <div class="top"><div class="logo">HAND<b>Y</b>MAN</div><div class="store">${esc(d.label||"那覇")}店</div></div>
  <div class="hello">${esc(r.name||"お客様")} 様<span>予約カルテ（閲覧専用）</span></div>

  <div class="card">
    <h3>📋 ご予約内容 ${cancelled?'<span class="badge b-cancel" style="margin-left:auto">キャンセル</span>':'<span class="badge b-ok" style="margin-left:auto">確定</span>'}</h3>
    <div class="row"><span class="k">予約番号</span><span class="v" style="font-family:monospace">${esc(r.id)}</span></div>
    <div class="row"><span class="k">ご予約元</span><span class="v">${esc(ota)}</span></div>
    <div class="row"><span class="k">ご利用期間</span><span class="v">${esc(r.lend_date||"")} ${esc(r.lend_time||"")}<br>〜 ${esc(r.return_date||"")} ${esc(r.return_time||"")}</span></div>
    <div class="row"><span class="k">車両クラス</span><span class="v">${esc(cls)}${r.vehicle_name?"<br><span style='font-size:11px;color:#64748b'>"+esc(r.vehicle_name)+"</span>":""}</span></div>
    <div class="row"><span class="k">人数</span><span class="v">${esc(r.people||"—")}名</span></div>
    <div class="row"><span class="k">補償</span><span class="v"><span class="badge b-ins">${esc(r.insurance||"基本")}</span></span></div>
    <div class="row"><span class="k">オプション</span><span class="v">${esc(optStr)}</span></div>
    ${r.del_flight?`<div class="row"><span class="k">便名</span><span class="v">✈ ${esc(r.del_flight)}</span></div>`:""}
  </div>

  <div class="card">
    <h3>🚚 お受け取り（お届け）</h3>
    ${delRows}
  </div>

  <div class="card">
    <h3>🔑 ご返却（回収）</h3>
    ${colRows}
  </div>

  ${histHtml?`<div class="card"><h3>🕘 最近の変更履歴</h3>${histHtml}</div>`:""}

  <div class="foot">HANDYMAN 那覇デリバリー専門店 ・ カルテ閲覧専用<br><span style="opacity:.5">${VER}</span></div>
  `;
}

async function load(){
  if(!TOKEN){ $("#app").innerHTML=`<div class="err">アクセスキーがありません。<br>OPシート/タスクサマリの「🪪カルテ」から開いてください。</div>`; return; }
  try{
    const r = await fetch(FN,{method:"POST",headers:{"Content-Type":"application/json","apikey":ANON,"Authorization":"Bearer "+ANON},body:JSON.stringify({action:"lookup",token:TOKEN})});
    const d = await r.json();
    if(!d.ok){ $("#app").innerHTML=`<div class="err">${esc(d.error||"予約が見つかりませんでした")}</div>`; return; }
    render(d);
  }catch(e){
    $("#app").innerHTML=`<div class="err">読み込みに失敗しました。<br>通信環境をご確認のうえ、再度お試しください。</div>`;
    console.error("[my-nha]",e);
  }
}
load();
</script>
</body>
</html>
