<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f1f5f9;color:#0f172a;padding:0 0 40px}
  .wrap{max-width:1040px;margin:0 auto;padding:0 12px}
  .mission{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#0369a1,#0284c7);color:#fff;padding:10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  .mission .m-wrap{max-width:1040px;margin:0 auto}
  .mission .m-t{font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .mission .m-s{font-size:11px;opacity:.92;margin-top:3px;line-height:1.5}
  .nav{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
  .nav a{padding:6px 12px;border-radius:999px;text-decoration:none;font-size:12px;font-weight:700}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px 16px;margin-bottom:14px}
  h2{font-size:13px;font-weight:900;margin:0 0 10px;color:#0f172a}
  .msel{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:12px}
  .msel button{border:1px solid #cbd5e1;background:#fff;width:36px;height:36px;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer;color:#475569}
  .msel .mlab{font-size:20px;font-weight:900;min-width:140px;text-align:center}
  .msel .mlab small{font-size:11px;font-weight:700;color:#64748b;display:block}
  .ind{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .ic{border-radius:10px;padding:9px 10px;border:1px solid #e2e8f0;background:#f8fafc}
  .ic .l{font-size:10px;font-weight:700;color:#64748b;margin-bottom:3px;line-height:1.2}
  .ic .v{font-size:17px;font-weight:900;line-height:1.05}
  .ic .v .u{font-size:9.5px;font-weight:800;color:#94a3b8;margin-left:3px}
  .ic .s{font-size:10px;color:#64748b;margin-top:2px;line-height:1.3}
  .ic.max{background:#f5f3ff;border-color:#c4b5fd}.ic.max .v{color:#6d28d9}
  .ic.tgt{background:#fffbeb;border-color:#fbbf24}.ic.tgt .v{color:#92400e}
  .ic.act{background:#eef2ff;border-color:#a5b4fc}.ic.act .v{color:#3730a3}
  .ic.ota{background:#ecfeff;border-color:#67e8f9}.ic.ota .v{color:#0e7490}
  .ic.prog{background:#fff7ed;border-color:#fb923c}.ic.prog .v{color:#c2410c}
  .ic.fc{background:#eff6ff;border-color:#3b82f6}.ic.fc .v{color:#1e40af}
  @media(max-width:860px){.ind{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:520px){.ind{grid-template-columns:repeat(2,1fr)}.ic .v{font-size:15px}}
  .decomp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:700;margin:6px 0}
  .chip{padding:5px 10px;border-radius:8px;font-weight:800}
  .chip.t{background:#fef3c7;color:#92400e}.chip.o{background:#cffafe;color:#0e7490}.chip.g{background:#dcfce7;color:#166534}.chip.e{background:#fee2e2;color:#b91c1c}.chip.b{background:#dbeafe;color:#1e40af}
  .binp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
  .binp input{padding:8px 10px;font-size:16px;font-weight:800;border:1.5px solid #cbd5e1;border-radius:8px;width:150px;text-align:right;color:#1d4ed8}
  .binp .rec{padding:8px 14px;border:1px solid #16a34a;background:#16a34a;color:#fff;border-radius:8px;font-weight:800;cursor:pointer;font-size:13px}
  .prm{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px}
  .prm label{display:flex;align-items:center;gap:3px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:4px 7px;font-weight:700;color:#475569}
  .prm input{width:62px;border:1px solid #cbd5e1;border-radius:5px;padding:3px 5px;text-align:right;font-size:11px;font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:7px 5px;border-bottom:1px solid #f1f5f9;text-align:right}
  th{color:#64748b;font-weight:700;background:#f8fafc;border-bottom:2px solid #e2e8f0;font-size:10.5px}
  th:first-child,td:first-child{text-align:left}
  th.gsep,td.gsep{border-left:2px solid #cbd5e1}
  th.grp{font-size:10px;font-weight:900;color:#475569;background:#eef2f7;text-align:center;padding:5px 4px}
  th.gA{color:#92400e;background:#fffbeb}th.gB{color:#b91c1c;background:#fef2f2}th.gC{color:#1e40af;background:#eff6ff}
  .pill{padding:2px 7px;border-radius:6px;font-size:10px;font-weight:800;color:#fff;white-space:nowrap}
  .note{font-size:11px;color:#64748b;line-height:1.7;margin-top:6px}
  .warn{background:#ecfeff;border:1px solid #a5f3fc;border-radius:10px;padding:10px 12px;font-size:12px;color:#0e7490;line-height:1.6}
  #stat{font-size:11px;color:#cbe9ff}
</style>
</head>
<body>
<div class="mission"><div class="m-wrap">
  <div class="m-t">🎯 ミッション：稼働の<u>空き枠（目標−OTA−オーガ）</u>を、HP広告で<u>いくら</u>埋めるか ― ❄️札幌</div>
  <div class="m-s">札幌は<b>直前予約主体（当月予約率〜60%）＝当月もまだ埋められる</b>。先行・売上はreservations実数。OTA割合・稼働率はダッシュボード。CPA/オーガ/目標稼働率/当月予約率は<b>暫定値（編集可）</b>。<span id="stat"></span></div>
</div></div>

<div class="wrap">
  <div class="nav">
    <a href="forecast.html" style="background:#fff;border:1px solid #cbd5e1;color:#475569">🔮 売上予測</a>
    <a href="planner.html" style="background:#fff;border:1px solid #cbd5e1;color:#475569">🎯 逆算プランナー</a>
    <a href="index.html" style="background:#fff;border:1px solid #cbd5e1;color:#475569">🏠 管理APP</a>
  </div>
  <div id="root"><div class="card empty" style="padding:26px;text-align:center;color:#64748b">読み込み中…</div></div>
</div>

<script>
const SU='https://ckrxttbnawkclshczsia.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
function _ext(d){if(!d)return null;if(typeof d==='string')return d;if(d.access_token)return d.access_token;if(d.currentSession&&d.currentSession.access_token)return d.currentSession.access_token;if(d.session&&d.session.access_token)return d.session.access_token;if(Array.isArray(d)&&typeof d[0]==='string')return d[0];return null;}
function getTok(){try{const v=localStorage.getItem('sb-ckrxttbnawkclshczsia-auth-token');if(v){try{const t=_ext(JSON.parse(v));if(t)return t;}catch(e){}}for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('sb-')&&k.indexOf('auth-token')>=0){const val=localStorage.getItem(k);if(!val)continue;try{const t=_ext(JSON.parse(val));if(t)return t;}catch(e){}}}return null;}catch(e){return null;}}
async function sbGet(p){const r=await fetch(SU+'/rest/v1/'+p,{headers:{apikey:SK,Authorization:'Bearer '+(getTok()||SK)}});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}

// ===== SPK 暫定パラメータ（編集可・localStorage spk_act_params）=====
const PRM_DEF={mcpa:18000,orga:0,nights:3.0,tgtu:50,mr:60}; // 限界CPA/オーガ床/平均泊数/目標稼働率%/当月予約率%
function loadPrm(){const o={...PRM_DEF};try{Object.assign(o,JSON.parse(localStorage.getItem('spk_act_params')||'{}'));}catch(e){}return o;}
function savePrm(o){localStorage.setItem('spk_act_params',JSON.stringify(o));}
let PRM=loadPrm();
// SPK FEED（直前予約主体＝前ロード型・暫定）：申込月Xの予算は 当月60%/翌25%/翌々15% に着地
function feed(x,l){const k=((l-x)%12+12)%12;return k===0?60:k===1?25:k===2?15:0;}
function remWin(L){let s=0;for(let x=NOW;x<=L;x++)s+=feed(x,L);return s;}

const Y=2026, NOW=new Date().getMonth()+1;
let TGTM=NOW, BUD=(()=>{try{const v=localStorage.getItem('spk_act_budget');return (v!==null&&v!=='')?Number(v):null;}catch(e){return null;}})();
let SNAP={}, AVGOTA=75, NVEH=17, FC={}, THISMO_HP={}; // FC[m]={confC,confS,fcstC,fcstS,nAct}

function dim(m){return new Date(Y,m,0).getDate();}
function man(v){return '¥'+(Math.round(v/10000*10)/10)+'万';}
const MN=m=>((m-1)%12+1)+'月';
function otaShare(detail){if(!Array.isArray(detail))return null;let ota=0,tot=0;detail.forEach(d=>{const o=(d.ota||'').toUpperCase();const p=+d.pct||0;tot+=p;if(o!=='HP'&&o!=='SP'&&o!=='オフィシャル')ota+=p;});return tot>0?Math.round(ota/tot*100):null;}

function model(m){
  const CPA=PRM.mcpa,ORGA=PRM.orga,NIGHTS=PRM.nights,mr=PRM.mr/100;
  const nAct=(SNAP[m]&&SNAP[m].active)||(FC[m]&&FC[m].nAct)||NVEH;
  const d=dim(m);
  const maxCnt=nAct*d/NIGHTS;                               // ① 最大値
  const tgtCnt=PRM.tgtu/100*maxCnt;                         // ② 目標件数（暫定 目標稼働率）
  const ota=(m<=NOW&&SNAP[m]&&SNAP[m].otaPct!=null)?SNAP[m].otaPct:AVGOTA;
  const otaCnt=tgtCnt*ota/100;                              // ③ OTA見込
  const empty=Math.max(0,tgtCnt-otaCnt-ORGA);             // ⑤ 空き枠
  const aov=(FC[m]&&FC[m].confC>0)?FC[m].confS/FC[m].confC:((SNAP[m]&&SNAP[m].returns>0)?SNAP[m].rev/SNAP[m].returns:25000);
  const hpBud=(aov>CPA)?Math.round(empty*CPA):0;           // ⑥ HP予算
  return {nAct,d,maxCnt,tgtU:PRM.tgtu,tgtCnt,ota,otaCnt,empty,aov,hpBud,tgtRev:tgtCnt*aov};
}

async function boot(){
  document.getElementById('stat').textContent=getTok()?'（認証OK）':'（未ログイン＝一部データが読めない場合あり）';
  // monthly_snapshots（札幌）
  try{
    const snaps=await sbGet('monthly_snapshots?store=eq.spk&year_month=gte.'+Y+'-01&year_month=lte.'+Y+'-12&select=year_month,utilization_pct,total_revenue,total_returns,active_vehicles,booking_rate_pct,ota_detail&limit=24');
    let oSum=0,oN=0;
    (snaps||[]).forEach(s=>{const m=+(s.year_month||'').slice(5,7);if(!m)return;const op=otaShare(s.ota_detail);SNAP[m]={util:s.utilization_pct,rev:s.total_revenue,returns:s.total_returns,active:s.active_vehicles,bk:s.booking_rate_pct,otaPct:op};if(op!=null&&m<NOW){oSum+=op;oN++;}});
    if(oN)AVGOTA=Math.round(oSum/oN);
  }catch(e){}
  // 稼働台数（現有）
  try{const v=await sbGet('vehicles?select=code,active');NVEH=(v||[]).filter(x=>x.active!==false).length||17;}catch(e){}
  // 先行・売上・予測を reservations から自前計算（札幌はspk_fcst無し）
  try{
    const mr=PRM.mr/100;
    const rsv=await sbGet('reservations?select=return_date,base_price,option_price,discount,price,status,ota,created_at,booked_at&return_date=gte.'+Y+'-01-01&return_date=lte.'+Y+'-12-31&limit=9000');
    const ms=Y+'-'+String(NOW).padStart(2,'0');
    (rsv||[]).forEach(r=>{
      const st=(r.status||'').trim();if(st&&/cancel|キャンセル/i.test(st))return;
      const m=+((r.return_date||'').slice(5,7));if(!m)return;
      const b=+r.base_price||0,o=+r.option_price||0,dc=+r.discount||0,p=+r.price||0;
      const rev=(b>0||o>0)?(b+o-dc):p;
      if(!FC[m])FC[m]={confC:0,confS:0};
      FC[m].confC++;FC[m].confS+=rev;
      // 今月発生・HP/自社 → 着地月別
      const cr=(r.booked_at||r.created_at||'').slice(0,7);
      const ot=(r.ota||'').toUpperCase();
      if(cr===ms&&(ot==='HP'||ot==='SP'||ot==='オフィシャル'||ot===''))THISMO_HP[m]=(THISMO_HP[m]||0)+1;
    });
    for(let m=1;m<=12;m++){const f=FC[m]||(FC[m]={confC:0,confS:0});f.fcstC=mr<1?f.confC/(1-mr):f.confC;f.fcstS=mr<1?f.confS/(1-mr):f.confS;f.nAct=(SNAP[m]&&SNAP[m].active)||NVEH;}
  }catch(e){document.getElementById('stat').textContent='⚠️ reservations取得失敗: '+e.message;}
  render();
}
function step(d){let m=TGTM+d;if(m<1)m=1;if(m>12)m=12;TGTM=m;render();}
function useRec(){BUD=null;try{localStorage.removeItem('spk_act_budget');}catch(e){}render();}
function saveBud(){const bi=document.getElementById('budIn');if(bi){BUD=Math.max(0,+bi.value||0);try{localStorage.setItem('spk_act_budget',BUD);}catch(e){}}const m=document.getElementById('budMsg');if(m){m.textContent='✅ 保存しました';m.style.color='#16a34a';setTimeout(()=>{if(m)m.textContent='';},1800);}}
function setPrm(k,v){PRM[k]=Number(v)||0;savePrm(PRM);for(let m=1;m<=12;m++){if(FC[m]){const mr=PRM.mr/100;FC[m].fcstC=mr<1?FC[m].confC/(1-mr):FC[m].confC;FC[m].fcstS=mr<1?FC[m].confS/(1-mr):FC[m].confS;}}render();}

function render(){
  const root=document.getElementById('root');
  const CPA=PRM.mcpa,ORGA=PRM.orga;
  const T=TGTM, mo=model(T), s=SNAP[T]||{}, f=FC[T]||{};
  const confC=f.confC||0, confS=f.confS||0;
  const progU=(s.util!=null)?s.util:Math.round(confC/mo.maxCnt*100);
  const recentUtil=(()=>{for(let m=NOW-1;m>=1;m--){if(SNAP[m]&&SNAP[m].util!=null)return{m,u:SNAP[m].util};}return null;})();

  let h='<div class="card">';
  h+='<div class="msel"><button onclick="step(-1)">‹</button>';
  h+='<div class="mlab">'+MN(T)+(T===NOW?' <small>当月・進行中</small>':T<NOW?' <small>完了</small>':' <small>'+(T-NOW)+'ヶ月先</small>')+'</div>';
  h+='<button onclick="step(1)">›</button></div>';
  // 指標パネル
  h+='<div class="ind">';
  h+='<div class="ic max"><div class="l">🧱 最大(限界)</div><div class="v">100<span class="u">%稼働率</span></div><div class="s"><b>'+Math.round(mo.maxCnt)+'件</b>＝'+mo.nAct+'台×'+mo.d+'日÷'+PRM.nights+'</div></div>';
  h+='<div class="ic tgt"><div class="l">🎯 目標</div><div class="v">'+mo.tgtU+'<span class="u">%稼働率</span></div><div class="s"><b>'+Math.round(mo.tgtCnt)+'件</b> ・ '+man(mo.tgtRev)+'<span class="u">売上</span></div></div>';
  h+='<div class="ic act"><div class="l">📊 実績(直近)</div><div class="v">'+(recentUtil?recentUtil.u:'—')+'<span class="u">%稼働率</span></div><div class="s">'+(recentUtil?MN(recentUtil.m)+'の確定値':'スナップショット無')+'</div></div>';
  h+='<div class="ic ota"><div class="l">🌐 OTA割合</div><div class="v">'+mo.ota+'<span class="u">%構成比</span></div><div class="s">→ OTA見込 <b>'+Math.round(mo.otaCnt)+'件</b>'+((s.otaPct!=null)?'(ダッシュボード)':'(平均'+AVGOTA+'%暫定)')+'</div></div>';
  h+='<div class="ic prog"><div class="l">📋 進捗(速報)</div><div class="v">'+progU+'<span class="u">%稼働率</span></div><div class="s"><b>'+confC+'件</b> ・ '+man(confS)+'<span class="u">売上</span></div></div>';
  h+='<div class="ic fc"><div class="l">🤖 予測(月末着地)</div><div class="v">'+(f.fcstC!=null?Math.round(f.fcstC):'—')+'<span class="u">件</span></div><div class="s">'+(f.fcstS!=null?man(f.fcstS)+'<span class="u">売上</span>':'—')+'</div></div>';
  h+='</div>';
  h+='<div class="note" style="margin-top:8px">予測＝先行 ÷ (1−当月予約率'+PRM.mr+'%)。札幌は直前予約主体なので<b>先行が少なくても着地は伸びる</b>。実績(直近)は確定スナップショット。</div>';
  h+='</div>';

  // 暫定パラメータ編集
  h+='<div class="card"><h2>⚙ 暫定パラメータ（実績が貯まったら更新）</h2><div class="prm">'
    +'<label>限界CPA¥ <input type="number" value="'+PRM.mcpa+'" onchange="setPrm(\'mcpa\',this.value)"></label>'
    +'<label>オーガ床 <input type="number" value="'+PRM.orga+'" onchange="setPrm(\'orga\',this.value)"></label>'
    +'<label>目標稼働% <input type="number" value="'+PRM.tgtu+'" onchange="setPrm(\'tgtu\',this.value)"></label>'
    +'<label>当月予約率% <input type="number" value="'+PRM.mr+'" onchange="setPrm(\'mr\',this.value)"></label>'
    +'<label>平均泊数 <input type="number" step="0.1" value="'+PRM.nights+'" onchange="setPrm(\'nights\',this.value)"></label>'
    +'</div><div class="note">限界CPA¥18,000＝5月実測(20万→11件)。オーガ床0＝新店で自社流入未確立。目標稼働率・当月予約率も実績で随時調整。</div></div>';

  // ===== 🎯 目標への積み上げ（目標＝速報＋残り[OTA+オーガ+HP]）=====
  const sokuho=(FC[T]&&FC[T].confC)||0;                    // 速報＝現在の合計数
  const tgt0=mo.tgtCnt, pp=tgt0>0?Math.min(1,sokuho/tgt0):0, zan=Math.max(0,tgt0-sokuho);
  const zOta=mo.otaCnt*(1-pp), zOrg=ORGA*(1-pp), zHp=mo.empty*(1-pp);
  const zHpBud=(mo.aov>CPA)?Math.round(zHp*CPA):0;
  h+='<div class="card"><h2>🎯 '+MN(T)+' 目標への積み上げ（目標 ＝ 速報 ＋ 残り）</h2>';
  h+='<div class="decomp">'
    +'<span class="chip t">🎯目標 '+Math.round(tgt0)+'件</span><span>＝</span>'
    +'<span class="chip" style="background:#ffedd5;color:#9a3412">📋速報(現合計) '+sokuho+'件</span><span>＋</span>'
    +'<span class="chip" style="background:#e0e7ff;color:#3730a3">残り '+Math.round(zan)+'件</span></div>';
  h+='<div class="decomp" style="margin-top:4px">'
    +'<span style="color:#64748b">残り'+Math.round(zan)+'件 ＝</span>'
    +'<span class="chip o">🌐残OTA '+Math.round(zOta)+'</span><span>＋</span>'
    +'<span class="chip g">🌱残オーガ '+Math.round(zOrg)+'</span><span>＋</span>'
    +'<span class="chip e">💴残HP '+Math.round(zHp)+'</span><span>×限界CPA¥'+(CPA/10000)+'万＝</span>'
    +'<span class="chip b">必要HP予算 '+man(zHpBud)+'</span></div>';
  h+='<div class="note">📋<b>速報＝現在の合計数</b>（今その月に入っている総数）。残り＝目標−速報。残りを OTA/オーガ/HP の構成比で分けたのが残OTA/残オーガ/残HP（<b>3つの合計＝残り</b>）。<b>予算で動かすのは💴残HPだけ</b>。⚠️札幌はOTA割合が高い（'+mo.ota+'%）＝残OTAが大きく出る。HPを伸ばすなら⚙でOTA割合を下げる。</div>';
  h+='</div>';

  // ===== 各月の目標への道のり ＋ 今月予算の広告着地 =====
  const months=[];for(let m=NOW;m<=Math.min(12,NOW+5);m++)months.push(m);
  let recB=0; [NOW,NOW+1,NOW+2].filter(m=>m<=12).forEach(L=>{const mm=model(L);const sk=(FC[L]&&FC[L].confC)||0;const p=mm.tgtCnt>0?Math.min(1,sk/mm.tgtCnt):0;const zh=mm.empty*(1-p);if(mm.aov>CPA)recB+=zh*feed(NOW,L)/100*CPA;}); recB=Math.round(recB);
  const B=(BUD===null?recB:BUD), adCv=B/CPA;
  h+='<div class="card"><h2>📊 各月の目標への道のり（並び＝目標→速報→残り→内訳）</h2>';
  h+='<div class="binp"><span style="font-size:12px;font-weight:700;color:#64748b">今月予算 ¥</span>'
    +'<input id="budIn" type="number" value="'+B+'" step="50000">'
    +'<button onclick="saveBud()" style="padding:8px 14px;border:1px solid #2563eb;background:#2563eb;color:#fff;border-radius:8px;font-weight:800;cursor:pointer;font-size:13px">💾 保存</button>'
    +'<button class="rec" onclick="useRec()">⚡推奨 '+man(recB)+'</button>'
    +'<span style="font-size:11px;color:#64748b">＝広告 '+adCv.toFixed(0)+'本獲得</span><span id="budMsg" style="font-size:11px;font-weight:700"></span></div>';
  let tAdR=0; months.forEach(L=>{tAdR+=adCv*feed(NOW,L)/100*model(L).aov;});
  h+='<div class="decomp"><span class="chip b">💴この予算で広告 '+adCv.toFixed(0)+'本</span><span>→</span><span class="chip e">売上(入金) +'+man(tAdR)+'</span><span style="font-size:10px;color:#64748b">（HPは事前決済＝着地月に入金）</span></div>';
  h+='<div style="overflow-x:auto"><table><thead><tr>'
    +'<th>着地月</th><th>🎯目標</th><th>📋速報<br>(現合計)</th><th>残り</th><th>🌐残OTA</th><th>🌱残オーガ</th><th>💴残HP</th><th>今月予算の<br>広告着地<br>件 ／ ¥</th><th>今月発生<br>【実績HP】</th>'
    +'</tr></thead><tbody>';
  months.forEach(L=>{
    const mm=model(L);
    const sk=(FC[L]&&FC[L].confC)||0;
    const tg=mm.tgtCnt, p=tg>0?Math.min(1,sk/tg):0, zn=Math.max(0,tg-sk);
    const zo=mm.otaCnt*(1-p), zg=ORGA*(1-p), zh=mm.empty*(1-p);
    const land=adCv*feed(NOW,L)/100;
    const got=THISMO_HP[L]||0;
    const tag=L===NOW?' <span style="font-size:9px;color:#16a34a">当月も可</span>':'';
    h+='<tr><td><b>'+MN(L)+'</b>'+tag+'</td>'
      +'<td style="color:#92400e;font-weight:800">'+Math.round(tg)+'</td>'
      +'<td style="color:#c2410c;font-weight:700">'+sk+'</td>'
      +'<td style="font-weight:700">'+Math.round(zn)+'</td>'
      +'<td style="color:#0e7490">'+Math.round(zo)+'</td>'
      +'<td style="color:#166534">'+Math.round(zg)+'</td>'
      +'<td style="color:#b91c1c;font-weight:900">'+Math.round(zh)+'</td>'
      +'<td style="color:#0891b2;font-weight:800">+'+land.toFixed(1)+'件<br><span style="color:#047857;font-size:10px">'+man(land*mm.aov)+'</span></td>'
      +'<td style="color:#1e40af;font-weight:900">'+got+'件</td>'
      +'</tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="note">並び＝<b>目標→速報(現状)→残り→残りの内訳(🌐OTA/🌱オーガ/💴HP)</b>。<b>残OTA＋残オーガ＋残HP＝残り＝目標−速報</b>（辻褄一致）。<b>今月予算の広告着地(予測)</b>＝今月予算がその月にいくつ着地するか。<b>今月発生【実績HP】</b>＝'+MN(NOW)+'発生のHP予約が実際にその月へ入った件数（投資で実際に増えた分＝当月進捗）。<b>札幌は当月着地'+feed(NOW,NOW)+'%＝当月もまだ埋められる</b>。FEED・限界CPA・当月予約率は暫定値（⚙で編集）。</div>';
  h+='</div>';

  root.innerHTML=h;
  const bi=document.getElementById('budIn');if(bi)bi.addEventListener('change',e=>{BUD=Math.max(0,+e.target.value||0);try{localStorage.setItem('spk_act_budget',BUD);}catch(e2){}render();});
}
boot();
</script>
</body>
</html>
