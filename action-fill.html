<div class="mission"><div class="m-wrap">
  <div class="m-t">🎯 ミッション：目標との<u>乖離</u>を、HP広告の<u>過去実績点（ROAS）</u>で<u>いくら</u>埋めるか ― ❄️札幌</div>

<script>
const SU='https://ckrxttbnawkclshczsia.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
function _ext(d){if(!d)return null;if(typeof d==='string')return d;if(d.access_token)return d.access_token;if(d.currentSession&&d.currentSession.access_token)return d.currentSession.access_token;if(d.session&&d.session.access_token)return d.session.access_token;if(Array.isArray(d)&&typeof d[0]==='string')return d[0];return null;}
function getTok(){try{const v=localStorage.getItem('sb-ckrxttbnawkclshczsia-auth-token');if(v){try{const t=_ext(JSON.parse(v));if(t)return t;}catch(e){}}for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('sb-')&&k.indexOf('auth-token')>=0){const val=localStorage.getItem(k);if(!val)continue;try{const t=_ext(JSON.parse(val));if(t)return t;}catch(e){}}}return null;}catch(e){return null;}}
// PostgRESTは1リクエスト最大1000件 → Rangeヘッダで全件ページネーション取得（取りこぼし防止）
async function sbGet(p){
  let out=[],from=0;const page=1000;
  while(true){
    const r=await fetch(SU+'/rest/v1/'+p,{headers:{apikey:SK,Authorization:'Bearer '+(getTok()||SK),'Range-Unit':'items','Range':from+'-'+(from+page-1)}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const c=await r.json();
    if(!Array.isArray(c))return c;
    out=out.concat(c);
    if(c.length<page)break;
    from+=page;
    if(from>200000)break;
  }
  return out;
}

// ===== 固定値 =====
const TGTU={1:50,2:50,3:50,4:50,5:50,6:50,7:50,8:50,9:50,10:50,11:50,12:50};        // 目標稼働率%（札幌・暫定フラット50）
const ACT25=null; // 札幌＝新店・2025実績なし
const NIGHTS=3.0;
// 広告費（2026・Web広告月次レポート実数・札幌分のみ＝organic.html AD_BASE と同値）。新しい月はここに追記。
const AD2026={5:175235};
const Y=2026, NOW=new Date().getMonth()+1;
let TGTM=NOW, BUD=(()=>{try{const v=localStorage.getItem('spk_act_budget');return (v!==null&&v!=='')?Number(v):null;}catch(e){return null;}})();
// 📡 オンタイム検証用：今月ここまでの実広告費（手入力・月キーで保存＝月替わりで自動リセット）
const MS_NOW=Y+'-'+String(NOW).padStart(2,'0');
let SPENT=(()=>{try{const v=localStorage.getItem('spk_act_spent_'+MS_NOW);return (v!==null&&v!=='')?Number(v):null;}catch(e){return null;}})();
function saveSpent(){const si=document.getElementById('spentIn');if(si){SPENT=Math.max(0,+si.value||0);try{localStorage.setItem('spk_act_spent_'+MS_NOW,SPENT);}catch(e){}}render();}
let SNAP={};
let BR={};      // BR[m]={rate,num,den,rev} 当月予約率＝当月発生÷当月返却(DB実数)
let HPPT={};    // HPPT[m]={cnt,rev} 2026 発生月の総HP件数・総HP売上(DB実数)
let THISMO_HP={};  // THISMO_HP[L]=今月(NOW)発生のHP予約でL着地の実績件数(DB実数)
// 発生月→着地月(返却月)の実測分散%（2026-04〜06発生・暦月。3月はCSV一括取込で汚染＝除外）
const FEED={4:{4:54,5:19,6:5,7:7,8:5,9:7,10:3},5:{2:2,5:47,6:14,7:11,8:19,9:5,10:3},6:{6:62,7:17,8:8,9:4,10:8}};
// 未観測月（7月〜）はクリーン146本のラグ分布から合成（暫定・実測が貯まったらFEEDに追記）
const DEF_LAG={0:54,1:16,2:8,3:12,4:5,5:4,6:1};
function distOf(T){if(FEED[T])return FEED[T];const d={};Object.keys(DEF_LAG).forEach(k2=>{const m=((T-1+ +k2)%12)+1;d[m]=(d[m]||0)+DEF_LAG[k2];});return d;}
function feed(x,l){return distOf(x)[l]||0;}
const F=(()=>{try{return JSON.parse(localStorage.getItem('spk_fcst')||'{}');}catch(e){return{};}})();

function dim(m){return new Date(Y,m,0).getDate();}
function man(v){return '¥'+(Math.round(v/10000*10)/10)+'万';}
const MN=m=>((m-1)%12+1)+'月';

// ===== 月モデル（目標＝稼働率→件数→売上。attribution無し）=====
function model(m){
  const nAct=(SNAP[m]&&SNAP[m].active)||(F[m]&&F[m].nActive)||15;
  const d=dim(m);
  const maxCnt=nAct*d/NIGHTS;
  const tgtU=TGTU[m]||55;
  const tgtCnt=tgtU/100*maxCnt;
  const aov=(F[m]&&F[m].fcstC>0)?F[m].fcstS/F[m].fcstC:((SNAP[m]&&SNAP[m].returns>0)?SNAP[m].rev/SNAP[m].returns:20000);
  return {nAct,d,maxCnt,tgtU,tgtCnt,aov,tgtRev:tgtCnt*aov};
}
// 実績点(月)
function ptOf(m){const sp=AD2026[m]||0,c=(HPPT[m]&&HPPT[m].cnt)||0,rv=(HPPT[m]&&HPPT[m].rev)||0;
  return {sp,c,rv,unit:c>0?Math.round(rv/c):0,cpa:(sp>0&&c>0)?Math.round(sp/c):0,roas:sp>0?rv/sp:0};}
// 信頼点（広告費>0 かつ 件数8以上＝新店基準・点が小さいのでレンジ広め注意）からROAS/CPAレンジを算出
function ranges(){let roas=[],cpa=[],ms=[];for(let m=1;m<=12;m++){const p=ptOf(m);if(p.sp>0&&p.c>=8){roas.push(p.roas);cpa.push(p.cpa);ms.push(m);}}
  if(!roas.length)return null;
  return {rLo:Math.min.apply(null,roas),rHi:Math.max.apply(null,roas),cLo:Math.min.apply(null,cpa),cHi:Math.max.apply(null,cpa),n:roas.length,ms};}
// 🔒 CPAの正本＝GCPA（広告費÷実HP総数・月別実測）。札幌は2026-05の1点のみ（¥175,235÷11本）＝月別形状はまだ無し→全月この値。点が増えたら月別に追記
const GCPA={5:15930};
const _gAvg=(()=>{const v=Object.values(GCPA);return Math.round(v.reduce((a,b)=>a+b,0)/v.length);})();
function gcpaOf(m){return GCPA[m]||_gAvg;} // 3月は実HP未確定→年平均代替
// 発生月T向けの月別補正レンジ：最新の実測ブレンドCPA(信頼点)を錨に、GCPA正本の月別形状で「その月に出したらCPA/ROASがどうなるか」を仮説化
function monthRanges(T){const rg=ranges();if(!rg)return null;
  const baseG=rg.ms.reduce((s,m)=>s+gcpaOf(m),0)/rg.ms.length;
  const f=gcpaOf(T)/baseG;
  return Object.assign({},rg,{cLo:rg.cLo*f,cHi:rg.cHi*f,rLo:rg.rLo/f,rHi:rg.rHi/f,f:f,gcpa:gcpaOf(T)});}

async function boot(){
  document.getElementById('stat').textContent=getTok()?'（認証OK）':'（未ログイン＝一部DBが読めない場合あり）';
  try{
    const snaps=await sbGet('monthly_snapshots?store=eq.spk&year_month=gte.'+Y+'-01&year_month=lte.'+Y+'-12&select=year_month,utilization_pct,total_revenue,total_returns,active_vehicles,booking_rate_pct&limit=24');
    (snaps||[]).forEach(s=>{const m=+(s.year_month||'').slice(5,7);if(!m)return;SNAP[m]={util:s.utilization_pct,rev:s.total_revenue,returns:s.total_returns,active:s.active_vehicles,bk:s.booking_rate_pct};});
  }catch(e){document.getElementById('stat').textContent='⚠️ snapshot取得失敗: '+e.message;}
  // 当月予約率(BR)：当月発生(発生月==返却月)÷当月返却。SPKはbooked_at無し＝created_at
  try{
    const ms=Y+'-'+String(NOW).padStart(2,'0');
    const acts=await sbGet('reservations?select=return_date,created_at,status,ota,base_price,option_price,discount,price&return_date=gte.'+Y+'-01-01&return_date=lte.'+Y+'-12-31&order=id.asc');
    const den={},num={},rev={};
    (acts||[]).forEach(a=>{const st=(a.status||'').trim();if(st&&/cancel|キャンセル/i.test(st))return;
      const em=(a.return_date||'').slice(0,7), lm=+em.slice(5,7);if(!lm)return;den[lm]=(den[lm]||0)+1;
      const bk=(a.created_at||''); // SPKはbooked_at列なし＝created_atが実発生日（GAS取込）
      if(bk.slice(0,7)===em){const r=(+a.base_price>0||+a.option_price>0)?(+a.base_price+(+a.option_price||0)-(+a.discount||0)):(+a.price||0);num[lm]=(num[lm]||0)+1;rev[lm]=(rev[lm]||0)+r;}
      // 今月(NOW)発生のHP予約 → 各着地月の実件数＋実売上（2026-06-08 売上併記・オーナー指示）
      const cr=bk.slice(0,7), o=(a.ota||'').toUpperCase();
      if(cr===ms && (o==='HP'||o==='SP'||o==='オフィシャル'||o==='')){
        const rv2=(+a.base_price>0||+a.option_price>0)?(+a.base_price+(+a.option_price||0)-(+a.discount||0)):(+a.price||0);
        if(!THISMO_HP[lm])THISMO_HP[lm]={cnt:0,rev:0};
        THISMO_HP[lm].cnt++;THISMO_HP[lm].rev+=rv2;
      }});
    for(let m=1;m<=12;m++){if(den[m])BR[m]={rate:Math.round((num[m]||0)/den[m]*100),num:num[m]||0,den:den[m],rev:rev[m]||0};}
  }catch(e){}
  // HP実績点：2026 発生月の総HP件数・総HP売上（DB実数）。発生月＝created_at（SPKはbooked_at無し）
  try{
    const hp=await sbGet('reservations?select=id,created_at,status,base_price,option_price,discount,price&ota=eq.HP&order=id.asc');
    (hp||[]).forEach(r=>{const st=(r.status||'').trim();if(st&&/cancel|キャンセル/i.test(st))return;
      const bk=r.created_at||'';
      if(bk.slice(0,4)!==String(Y))return; const m=+bk.slice(5,7); if(!m)return;
      const v=(+r.base_price>0||+r.option_price>0)?(+r.base_price+(+r.option_price||0)-(+r.discount||0)):(+r.price||0);
      if(!HPPT[m])HPPT[m]={cnt:0,rev:0}; HPPT[m].cnt++; HPPT[m].rev+=v;});
  }catch(e){}
  render();
}
function step(d){let m=TGTM+d;if(m<1)m=1;if(m>12)m=12;TGTM=m;render();}
function saveBud(){const bi=document.getElementById('budIn');if(bi){BUD=Math.max(0,+bi.value||0);try{localStorage.setItem('spk_act_budget',BUD);}catch(e){}}const m=document.getElementById('budMsg');if(m){m.textContent='✅ 保存しました';m.style.color='#16a34a';setTimeout(()=>{if(m)m.textContent='';},1800);}}
function setBud(v){BUD=Math.max(0,Math.round(v||0));try{localStorage.setItem('spk_act_budget',BUD);}catch(e){}render();}

function render(){
  const root=document.getElementById('root');
  const T=TGTM, mo=model(T), s=SNAP[T]||{}, f=F[T]||{};
  const a25=ACT25?ACT25[T]:null;
  const diff=a25!=null?Math.round((TGTU[T]-a25)*10)/10:null;
  const jg=diff==null?['#64748b','🆕 新店']:diff>20?['#dc2626','🔴 伸びしろ大']:diff>10?['#d97706','🟠 挑戦']:['#16a34a','🟢 実績圏'];
  const confC=(f.confC!=null)?f.confC:(s.returns||0), confS=(f.confS!=null)?f.confS:(s.rev||0);
  const progU=(s.util!=null)?s.util:Math.round(confC/mo.maxCnt*100);
  const brOb=BR[T]||null;
  const rg=ranges();
  const mg=monthRanges(T); // 発生月T向け 月別CPA/ROAS仮説（GCPA正本ベース）

  let h='<div class="card">';
  h+='<div class="msel"><button onclick="step(-1)">‹</button>';
  h+='<div class="mlab">'+MN(T)+(T===NOW?' <small>当月・進行中</small>':T<NOW?' <small>完了</small>':' <small>'+(T-NOW)+'ヶ月先</small>')+'</div>';
  h+='<button onclick="step(1)">›</button></div>';
  h+='<div class="ind">';
  h+='<div class="ic max"><div class="l">🧱 最大(限界)</div><div class="v">100<span class="u">%稼働率</span></div><div class="s"><b>'+Math.round(mo.maxCnt)+'件</b>＝'+mo.nAct+'台×'+mo.d+'日÷3.0</div></div>';
  h+='<div class="ic tgt"><div class="l">🎯 目標</div><div class="v">'+mo.tgtU+'<span class="u">%稼働率</span></div><div class="s"><b>'+Math.round(mo.tgtCnt)+'件</b> ・ '+man(mo.tgtRev)+'<span class="u">売上</span></div></div>';
  h+='<div class="ic act"><div class="l">📊 実績2025</div><div class="v">'+(a25!=null?a25+'<span class="u">%稼働率</span>':'—')+'</div><div class="s">'+(diff!=null?'差分 <b style="color:'+jg[0]+'">'+(diff>=0?'+':'')+diff+'pt</b> ':'前年なし ')+'<span class="pill" style="background:'+jg[0]+';color:#fff;padding:2px 6px;border-radius:6px">'+jg[1]+'</span></div></div>';
  h+='<div class="ic prog"><div class="l">📋 進捗(速報)</div><div class="v">'+progU+'<span class="u">%稼働率</span></div><div class="s"><b>'+confC+'件</b> ・ '+man(confS)+'<span class="u">売上</span></div></div>';
  h+='<div class="ic fc"><div class="l">🤖 予測(月末着地)</div><div class="v">'+(f.fcstC!=null?Math.round(f.fcstC):'—')+'<span class="u">件</span></div><div class="s">'+(f.fcstS!=null?man(f.fcstS)+'<span class="u">売上</span>':'forecast未取得')+'</div></div>';
  h+='<div class="ic ota"><div class="l">📅 当月予約率</div><div class="v">'+(brOb?brOb.rate:'—')+'<span class="u">%</span></div><div class="s">'+(brOb?'発生'+brOb.num+'/返却'+brOb.den+'件<br>直前で埋まる余地':'DB未取得')+'</div></div>';
  h+='</div>';
  h+='<div class="note" style="margin-top:10px">現実性：目標'+mo.tgtU+'%。'+(diff!=null?('実績2025 '+a25+'%（差分'+(diff>=0?'+':'')+diff+'pt）。'+(diff>20?'過去比で大きく上＝伸びしろ最大の月。集中投資。':diff>10?'過去比で挑戦的。取りにいく。':'過去実績圏。現実的。')):'新店＝前年実績なし。2026実績を積んで翌年から比較。')+'</div>';
  h+='</div>';

  // ===== 🎯 乖離（目標 − 速報）=====
  const gapC=Math.max(0,mo.tgtCnt-confC), gapR=Math.max(0,mo.tgtRev-confS);
  h+='<div class="card"><h2>🎯 '+MN(T)+' 乖離（目標 − 現状速報）</h2>';
  h+='<div class="decomp">'
    +'<span class="chip t">🎯目標 '+Math.round(mo.tgtCnt)+'件 / '+man(mo.tgtRev)+'</span><span>−</span>'
    +'<span class="chip" style="background:#ffedd5;color:#9a3412">📋速報 '+confC+'件 / '+man(confS)+'</span><span>＝</span>'
    +'<span class="chip e">乖離 '+Math.round(gapC)+'件 / '+man(gapR)+'</span></div>';
  h+='<div class="note">速報＝今その月に入っている総数（DB実数）。乖離＝目標−速報。この乖離は <b>HP広告・OTA・直前予約</b> で埋まる。広告で動かせるのはHP分のみ＝下の予算シナリオで見る。'
    +(brOb?'<b> 当月予約率'+brOb.rate+'%</b>＝この月はまだ直前予約で一定割合が自然に埋まる。':'')+'</div>';
  h+='</div>';

  // ===== 💴 本軸：予算 → 獲得本数 → 流通(入金) → 月別分配・売上計上（発生月T基準・月別CPA適用）=====
  const B=(BUD===null?(AD2026[NOW]||500000):BUD);
  h+='<div class="card"><h2>💴 予算シナリオ【本軸】 '+MN(T)+'に出す予算 → 獲得本数 → 流通(入金) → どの月にいくら売上計上か</h2>';
  h+='<div class="binp"><span style="font-size:12px;font-weight:700;color:#64748b">広告費 ¥</span>'
    +'<input id="budIn" type="number" value="'+B+'" step="50000">'
    +'<button onclick="saveBud()" style="padding:8px 14px;border:1px solid #2563eb;background:#2563eb;color:#fff;border-radius:8px;font-weight:800;cursor:pointer;font-size:13px">💾 保存</button>'
    +(mg?'<button class="rec" onclick="setBud('+Math.round(gapR/((mg.rLo+mg.rHi)/2))+')">⚡乖離'+man(gapR)+'を埋める目安 '+man(gapR/((mg.rLo+mg.rHi)/2))+'</button>':'')
    +'<span id="budMsg" style="font-size:12px;font-weight:700"></span></div>';
  if(mg){
    const cnLo=B/mg.cHi, cnHi=B/mg.cLo;     // 獲得本数（÷この月のCPA仮説）
    const rsLo=B*mg.rLo, rsHi=B*mg.rHi;     // 獲得流通＝入金（×この月のROAS仮説）
    h+='<div class="decomp">'
      +'<span class="chip" style="background:#e2e8f0;color:#334155">💴 '+MN(T)+'広告費 '+man(B)+'</span><span>→</span>'
      +'<span class="chip g">獲得 '+Math.round(cnLo)+'〜'+Math.round(cnHi)+'本</span><span>→</span>'
      +'<span class="chip b">流通(入金) '+man(rsLo)+'〜'+man(rsHi)+'</span>'
      +'<span class="chip" style="background:#fce7f3;color:#9d174d">@予約単価 '+yenK(mg.cLo*mg.rLo)+'〜'+yenK(mg.cHi*mg.rHi)+'</span>'
      +'<span class="chip" style="background:#ede9fe;color:#5b21b6">'+MN(T)+'のCPA '+yenK(mg.cLo)+'〜'+yenK(mg.cHi)+' ・ ROAS '+mg.rLo.toFixed(2)+'〜'+mg.rHi.toFixed(2)+'x</span>'
      +'<span class="chip" style="background:#fef3c7;color:#92400e">GCPA正本 '+MN(T)+'＝'+yenK(mg.gcpa)+'（係数x'+mg.f.toFixed(2)+'）</span></div>';
    // ===== 📡 オンタイム検証（当月のみ）：実広告費(手入力) ÷ 当月発生HP実数(DB) ＝ 実測CPA を仮説レンジと突合 =====
    if(T===NOW){
      const ac=(HPPT[NOW]&&HPPT[NOW].cnt)||0, ar=(HPPT[NOW]&&HPPT[NOW].rev)||0;
      const today=new Date().getDate(), dd=dim(NOW);
      h+='<div style="background:#f0fdf4;border:1px solid #86efac;border-radius:10px;padding:10px 12px;margin:10px 0">'
        +'<div style="font-size:12px;font-weight:900;color:#166534;margin-bottom:6px">📡 オンタイム検証（'+MN(NOW)+'実測 vs 仮説 ・ '+today+'/'+dd+'日経過）</div>'
        +'<div class="binp" style="margin:0 0 6px"><span style="font-size:12px;font-weight:700;color:#64748b">今月ここまでの実広告費 ¥</span>'
        +'<input id="spentIn" type="number" value="'+(SPENT===null?'':SPENT)+'" step="10000" placeholder="広告管理画面の消化額">'
        +'<button onclick="saveSpent()" style="padding:8px 14px;border:1px solid #16a34a;background:#16a34a;color:#fff;border-radius:8px;font-weight:800;cursor:pointer;font-size:13px">💾 反映</button></div>';
      if(SPENT>0){
        const acpa=ac>0?SPENT/ac:0, aroas=ar/SPENT;
        const eLo=SPENT/mg.cHi, eHi=SPENT/mg.cLo;
        const rmLo=Math.max(0,Math.round(eLo-ac)), rmHi=Math.max(0,Math.round(eHi-ac));
        const cMid=(mg.cLo+mg.cHi)/2;
        const dev=ac>0?acpa-cMid:0;
        const devS=(dev>=0?'+':'−')+'¥'+Math.round(Math.abs(dev)).toLocaleString();
        const inR=ac>0&&acpa>=mg.cLo&&acpa<=mg.cHi, good=ac>0&&acpa<mg.cLo;
        const col=ac<5?'#64748b':good?'#0891b2':inR?'#16a34a':'#dc2626';
        const jdg=ac<5?'⏳ '+ac+'本＝判定まだ薄い（8本〜）':good?'🎉 仮説より効率良':inR?'✅ 仮説レンジ内＝整合':'⚠️ 仮説よりCPA高＝下振れで読む';
        const aupr=ac>0?ar/ac:0;                                  // 実測 予約単価
        const uLo=mg.cLo*mg.rLo, uHi=mg.cHi*mg.rHi;               // 仮説 予約単価（CPA×ROAS）
        const exLo=SPENT*mg.rLo, exHi=SPENT*mg.rHi;               // この消化額の期待売上
        const revDev=ar-(exLo+exHi)/2, uDev=aupr-(uLo+uHi)/2;     // 乖離（実測−仮説中央）売上/単価は＋が良
        const pm=v=>(v>=0?'+':'−')+'¥'+Math.round(Math.abs(v)).toLocaleString();
        h+='<div class="ind" style="grid-template-columns:repeat(4,1fr)">'
          +'<div class="ic"><div class="l">📦 進捗 獲得</div><div class="v">'+ac+'<span class="u">本</span></div><div class="s">期待 '+Math.round(eLo)+'〜'+Math.round(eHi)+'本 ・ 残 '+rmLo+'〜'+rmHi+'本</div></div>'
          +'<div class="ic"><div class="l">💰 進捗 売上(流通)</div><div class="v" style="color:'+(revDev>=0?'#16a34a':'#dc2626')+'">'+man(ar)+'</div><div class="s">期待 '+man(exLo)+'〜'+man(exHi)+' ・ 乖離 <b style="color:'+(revDev>=0?'#16a34a':'#dc2626')+'">'+pm(revDev)+'</b></div></div>'
          +'<div class="ic"><div class="l">🧾 進捗 予約単価</div><div class="v" style="color:'+(uDev>=0?'#16a34a':'#dc2626')+'">'+(ac>0?yenK(aupr):'—')+'</div><div class="s">仮説 '+yenK(uLo)+'〜'+yenK(uHi)+' ・ 乖離 <b style="color:'+(uDev>=0?'#16a34a':'#dc2626')+'">'+(ac>0?pm(uDev):'—')+'</b></div></div>'
          +'<div class="ic"><div class="l">📈 進捗 ROAS</div><div class="v" style="color:'+(aroas>=mg.rLo?'#16a34a':'#dc2626')+'">'+aroas.toFixed(2)+'<span class="u">x</span></div><div class="s">仮説 '+mg.rLo.toFixed(2)+'〜'+mg.rHi.toFixed(2)+'x</div></div>'
          +'<div class="ic" style="border-color:'+col+'"><div class="l">💴 進捗CPA</div><div class="v" style="color:'+col+'">'+(ac>0?yenK(acpa):'—')+'</div><div class="s">実広告費÷'+ac+'本</div></div>'
          +'<div class="ic"><div class="l">📐 予測CPA</div><div class="v">'+yenK(mg.cLo)+'〜'+yenK(mg.cHi)+'</div><div class="s">'+MN(NOW)+'仮説</div></div>'
          +'<div class="ic"><div class="l">📊 CPA乖離</div><div class="v" style="color:'+(dev>0?'#dc2626':'#16a34a')+'">'+(ac>0?devS:'—')+'</div><div class="s">x'+(ac>0?(acpa/cMid).toFixed(1):'—')+'（実測÷仮説中央）</div></div>'
          +'<div class="ic"><div class="l">⏳ 残数</div><div class="v">'+rmLo+'〜'+rmHi+'<span class="u">本</span></div><div class="s">期待−実測</div></div>'
          +'</div>'
          +'<div style="font-size:12px;font-weight:900;color:'+col+';margin-top:8px">'+jdg+'</div>';
      }else{
        h+='<div class="note" style="margin:0">実広告費を入れると実測CPA/ROASを即算出（今 '+ac+'本・'+man(ar)+'＝DB自動）。</div>';
      }
      h+='</div>';
    }
    const dist=distOf(T);
    const lms=Object.keys(dist).map(Number).sort((a,b)=>((a>=T?a:a+12)-(b>=T?b:b+12)));
    h+='<div style="overflow-x:auto"><table><thead><tr><th>売上計上月<br>(着地月)</th><th>分配%<br>(実測FEED)</th><th>獲得本数</th><th>💰売上計上<br>(予測)</th><th>🎯目標</th><th>📋速報</th><th>残り</th><th>この予算の<br>充足率</th><th>📅当月予約率</th><th>🔄今月発生<br>【実績HP】</th></tr></thead><tbody>';
    lms.forEach(L=>{
      const pct=dist[L];
      const bLo=cnLo*pct/100, bHi=cnHi*pct/100;
      const vLo=rsLo*pct/100, vHi=rsHi*pct/100;
      const nxt=L<T; // 年跨ぎ＝来年着地
      const mm=model(L);
      const sk=(F[L]&&F[L].confC!=null)?F[L].confC:((SNAP[L]&&SNAP[L].returns)||0);
      const zn=Math.max(0,Math.round(mm.tgtCnt-sk));
      const mid=(bLo+bHi)/2;
      const fill=(!nxt&&zn>0)?Math.round(mid/zn*100):null;
      const bo=BR[L]||null;
      const got=THISMO_HP[L]||{cnt:0,rev:0};
      h+='<tr><td><b>'+MN(L)+'</b>'+(nxt?' <span style="font-size:9px;color:#64748b">来年</span>':L===NOW?' <span style="font-size:9px;color:#64748b">当月</span>':'')+'</td>'
        +'<td style="color:#7c3aed;font-weight:800">'+pct+'%</td>'
        +'<td style="font-weight:800">'+(Math.round(bLo*10)/10)+'〜'+(Math.round(bHi*10)/10)+'本</td>'
        +'<td style="color:#059669;font-weight:800">'+man(vLo)+'〜'+man(vHi)+'</td>'
        +(nxt?'<td colspan="4" style="color:#cbd5e1;text-align:center">来年分</td>'
          :('<td style="color:#92400e;font-weight:800">'+Math.round(mm.tgtCnt)+'</td>'
           +'<td style="color:#c2410c;font-weight:700">'+sk+'</td>'
           +'<td style="font-weight:700">'+zn+'</td>'
           +'<td style="font-weight:800;color:'+(fill==null?'#94a3b8':fill>=100?'#16a34a':fill>=30?'#d97706':'#dc2626')+'">'+(fill==null?'—':fill+'%')+'</td>'))
        +'<td style="color:#7c3aed;font-weight:700">'+(bo?bo.rate+'%':'<span style="color:#cbd5e1">–</span>')+'</td>'
        +'<td style="color:#1e40af;font-weight:900">'+got.cnt+'件'+(got.rev>0?'<div style="font-size:10px;color:#059669;font-weight:800">'+man(got.rev)+'</div>':'')+'</td></tr>';
    });
    h+='<tr style="background:#f8fafc"><td><b>合計</b></td><td style="font-weight:800">100%</td>'
      +'<td style="font-weight:900">'+Math.round(cnLo)+'〜'+Math.round(cnHi)+'本</td>'
      +'<td style="color:#059669;font-weight:900">'+man(rsLo)+'〜'+man(rsHi)+'</td><td colspan="6"></td></tr>';
    h+='</tbody></table></div>';
    h+='<div class="note"><b>読み方（本軸）</b>：'+MN(T)+'に広告費'+man(B)+' → <b>獲得 '+Math.round(cnLo)+'〜'+Math.round(cnHi)+'本</b>（÷'+MN(T)+'のCPA仮説 '+yenK(mg.cLo)+'〜'+yenK(mg.cHi)+'）→ <b>流通＝入金 '+man(rsLo)+'〜'+man(rsHi)+'</b>（×ROAS '+mg.rLo.toFixed(2)+'〜'+mg.rHi.toFixed(2)+'x）。'
      +'その獲得本数が<b>分配%＝'+MN(T)+'発生HP予約の実測着地分散（FEED）</b>で各月に割り振られ、<b>売上計上は利用（着地）月</b>に立つ。'
      +'充足率＝この1回の予算が各月の「残り（目標−速報）」をどれだけ埋めるか。残りは<b>OTA・直前予約（当月予約率分）でも埋まる</b>のでHP単独100%は不要。<br>'
      +'🔒 <b>CPAの正本＝GCPA</b>（広告費÷実HP総数・月別・marketing.htmlと同一表）。'+MN(T)+'のGCPA '+yenK(mg.gcpa)+' ÷ 信頼点月の平均GCPA ＝ 係数x'+mg.f.toFixed(2)+' を、最新の実測ブレンドCPA（信頼点'+rg.n+'点＝'+rg.ms.map(MN).join('・')+'・'+yenK(rg.cLo)+'〜'+yenK(rg.cHi)+'）に掛けた値。札幌はまだ1点＝月別の形なし（点が貯まると月別化）。レポートCV基準のCPAは不使用。'
      +'<b>🔄今月発生【実績HP】が答え合わせ</b>＝月末に期待本数と突合して毎月精度が上がる（'+(T===NOW?'当月':'この列は当月('+MN(NOW)+')発生分')+'）。</div>';
  }else{
    h+='<div class="warn">信頼点（広告費&gt;0かつHP件数8以上の月）がまだ無いため、予算→獲得→計上の逆算は出せません。実績が貯まると自動算出されます。それまでは下の実績点テーブルを目視で判断してください。</div>';
  }
  h+='</div>';

  // ===== 📊 HP広告 実績点（広告費↔総HP・total response）=====
  h+='<div class="card"><h2>📊 HP広告 実績点（広告費 → 総HP件数/総売上・2026 発生月・DB実数）</h2>';
  h+='<div style="overflow-x:auto"><table><thead><tr><th>月</th><th>広告費</th><th>総HP件数</th><th>総HP売上</th><th>予約単価</th><th>ブレンドCPA</th><th>ROAS</th></tr></thead><tbody>';
  let any=false;
  for(let m=1;m<=12;m++){const p=ptOf(m);if(p.sp<=0&&p.c<=0)continue;any=true;
    const weak=(p.sp>0&&p.c<8); // 件数過少月
    h+='<tr><td><b>'+MN(m)+'</b>'+(weak?' <span style="font-size:9px;color:#dc2626">⚠歪</span>':'')+(m===NOW?' <span style="font-size:9px;color:#64748b">当月</span>':'')+'</td>'
      +'<td style="color:#64748b">'+(p.sp>0?yenK(p.sp):'—')+'</td>'
      +'<td style="font-weight:800">'+(p.c||'—')+'</td>'
      +'<td style="color:#059669;font-weight:700">'+(p.rv>0?yenK(p.rv):'—')+'</td>'
      +'<td style="color:#9a3412">'+(p.unit>0?yenK(p.unit):'—')+'</td>'
      +'<td style="color:#0891b2">'+(p.cpa>0?yenK(p.cpa):'—')+'</td>'
      +'<td style="font-weight:900;color:'+(p.roas>=2?'#16a34a':p.roas>0?'#dc2626':'#94a3b8')+'">'+(p.roas>0?p.roas.toFixed(2)+'x':'—')+'</td></tr>';
  }
  if(!any)h+='<tr><td colspan="7" style="text-align:center;color:#94a3b8;padding:18px">2026のHP実績点がまだありません</td></tr>';
  h+='</tbody></table></div>';
  if(rg)h+='<div class="note">信頼点（広告費&gt;0 かつ 件数8以上・新店基準）：<b>'+rg.ms.map(MN).join('・')+'</b>（'+rg.n+'点）。<b>ROAS '+rg.rLo.toFixed(2)+'〜'+rg.rHi.toFixed(2)+'x ・ ブレンドCPA '+yenK(rg.cLo)+'〜'+yenK(rg.cHi)+'</b> を上の予算シナリオ【本軸】に使用。';
  else h+='<div class="note" style="color:#92400e">⚠ 信頼点（件数20以上）がまだ無いため予算シナリオは概算不可。毎月データが貯まると算出されます。';
  h+=' ⚠歪＝件数過少月（CPA/ROASが歪む）＝レンジから除外。<b>点は毎月積み上げて精度UP</b>。</div>';
  h+='</div>';

  // 📐 乖離をHP広告だけで埋める場合の必要予算（参考・T月のROAS仮説で逆算）
  if(mg){
    h+='<div class="card"><div class="warn">📐 <b>乖離 '+man(gapR)+' をHP広告だけで埋めるなら</b>：'+MN(T)+'のROAS仮説 '+mg.rLo.toFixed(2)+'〜'+mg.rHi.toFixed(2)+'x で逆算 → 広告費 <b>'+man(gapR/mg.rHi)+'〜'+man(gapR/mg.rLo)+'</b>（ROAS高=少額で済む）。ただし<b>OTA・直前予約でも埋まる</b>ので、これは「HPで全部取る」上限の目安。当月予約率'+(brOb?brOb.rate+'%':'—')+'分はこれから自然に入る。</div></div>';
  }

  if(!Object.keys(F).filter(k=>+k>=1&&+k<=12).length){
    h='<div class="card empty">📭 売上予測が未取得です。先に <b>🔮売上予測</b> を「年間進捗」で1回開くと、速報・予測・単価が反映されます（目標・乖離・実績点は表示済み）。<br><a href="forecast.html">🔮 売上予測を開く</a></div>'+h;
  }
  root.innerHTML=h;
  const bi=document.getElementById('budIn');if(bi)bi.addEventListener('change',e=>{BUD=Math.max(0,+e.target.value||0);try{localStorage.setItem('spk_act_budget',BUD);}catch(e2){}render();});
  const si=document.getElementById('spentIn');if(si)si.addEventListener('change',e=>{SPENT=Math.max(0,+e.target.value||0);try{localStorage.setItem('spk_act_spent_'+MS_NOW,SPENT);}catch(e2){}render();});
}
function yenK(v){return '¥'+Math.round(v).toLocaleString();}
window.addEventListener('storage',e=>{if(e.key==='spk_fcst'||e.key==='spk_vars')render();});
boot();
</script>
</body>
</html>
