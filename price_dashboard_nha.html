const CLSORD=['A','A2','B','B2','D','F','H'];
const fo=document.getElementById('fota');
[...new Set(DATA.map(r=>r.ota))].forEach((o,i)=>fo.innerHTML+=`<option ${i==0?'selected':''}>${o}</option>`);
const yen=n=>n==null?'—':'¥'+Number(n).toLocaleString();
const dl=v=>v==null?'—':`<span class="${v>0?'pos':'neg'}">${v>0?'+':''}${v.toLocaleString()}</span>`;
function sug(r){
 if(r['順位']==null) return ['圏外','keep'];
 if(r['最安']!=null&&r['単価']!=null&&r['単価']<r['最安']) return ['上げ余地','up'];
 if(r['順位']>=11&&(r['予約']||0)<=1) return [`下げ検討(${r['順位']}位・予約${r['予約']||0})`,'cut'];
 if(r['順位']>=11) return [`高め(${r['順位']}位)`,'cut'];
 return ['維持','keep'];
}
function render(){
 const ota=fo.value;
 const tb=document.querySelector('#t tbody'); tb.innerHTML='';
 const dates=[...new Set(DATA.filter(r=>r.ota===ota).map(r=>r['貸出日']))].sort();
 for(const d of dates){
   const season=(DATA.find(r=>r.ota===ota&&r['貸出日']===d)||{}).season||'';
   tb.innerHTML+=`<tr class="dhdr"><td class="l" colspan="9">🗓 貸出日 ${d}　<span style="font-size:11px;color:#6366f1">シーズナル ${season}</span></td></tr>`;
   const rs=DATA.filter(r=>r.ota===ota&&r['貸出日']===d).sort((a,b)=>CLSORD.indexOf(a.cls)-CLSORD.indexOf(b.cls));
   for(const r of rs){
     const rk=r['順位'],c=rk==null?'':(rk<=5?'rk-good':rk<=10?'rk-mid':'rk-bad');
     const [tx,ac]=sug(r);
     tb.innerHTML+=`<tr><td class="l">${r.cls}</td><td class="our">${yen(r['単価'])}</td>
       <td>${yen(r['最安'])}</td><td>${yen(r['p5'])}</td><td>${yen(r['p10'])}</td>
       <td class="${c}">${rk==null?'圏外':rk+'位'}/${r['掲載']||'—'}</td><td>${dl(r['d最安'])}</td>
       <td>${r['予約']||0}</td><td class="act ${ac}">${tx}</td></tr>`;
   }
 }
}
render();
