<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>シフト一元管理ハブ（3店舗・6〜10月）</title>
<style>
:root{--navy:#0e2a47;--ink:#1a2733;--gray:#5d6b7a;--line:#e3e9ef;--bg:#f3f6f9;--nha:#e8505b;--spk:#2c82c9;--bt:#1ec8b0;--accent:#5b6cf0}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);font-size:13px;line-height:1.5;padding-bottom:80px}
.bar{background:linear-gradient(120deg,#0e2a47,#16456f);color:#fff;padding:14px 0}
.wrap{max-width:1240px;margin:0 auto;padding:0 14px}
.bar h1{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar .sub{font-size:11px;opacity:.72;margin-top:3px}
.conn{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;gap:6px}
.pill .d{width:8px;height:8px;border-radius:50%;background:#f0a020}
.pill.ok .d{background:#3ddc84}.pill.ng .d{background:#e8505b}
.pill button{background:#fff;color:#0e2a47;border:none;border-radius:14px;padding:3px 9px;font-size:11px;font-weight:800;cursor:pointer;margin-left:4px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.months{display:flex;gap:6px}
.mbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;font-size:13px;font-weight:800;color:var(--gray);cursor:pointer}
.mbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:800;color:var(--gray);cursor:pointer}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn{border:none;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer}
.btn-sync{background:#0fa896;color:#fff}.btn-sync:hover{background:#0c8f80}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--gray)}
.note{background:#fff8ec;border:1px solid #f3e2c0;color:#7a5b13;border-radius:9px;padding:9px 12px;font-size:11.5px;line-height:1.6;margin-bottom:12px}
.store{background:#fff;border:1px solid var(--line);border-radius:13px;margin-bottom:14px;overflow:hidden}
.store-h{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line);font-weight:800;font-size:14px}
.store-h .sdot{width:12px;height:12px;border-radius:4px}
.store-h .cost{margin-left:auto;font-size:12px;color:var(--gray);font-weight:700}
.store-h .cost b{font-size:15px;color:var(--navy)}
.gwrap{overflow-x:auto}
.grid{border-collapse:collapse;font-size:11px;min-width:100%}
.grid th,.grid td{border:1px solid #eef2f6;text-align:center;white-space:nowrap}
.grid thead th{background:#f6f9fc;color:var(--gray);font-weight:700;padding:4px 3px;position:sticky;top:0;font-size:10px}
.grid .nm{position:sticky;left:0;background:#fff;text-align:left;padding:5px 9px;font-weight:700;min-width:206px;z-index:2;box-shadow:1px 0 0 #eef2f6}
.grid .wg{font-size:9.5px;color:#9aa6b2;font-weight:600}
.grid td.cell{width:30px;height:30px;cursor:default;font-weight:800}
.grid.edit td.cell{cursor:pointer}
.grid td.sat{background:#eaf3fc}.grid td.sun{background:#fdeef0}
.grid .nm.sat,.grid .nm.sun{background:#fff}
.grid thead th.sat{color:#2c82c9}.grid thead th.sun{color:#e8505b}
.grid thead th .tkc{display:inline-block;font-size:8.5px;font-weight:800;border-radius:5px;padding:0 3px;margin-top:1px;min-width:16px;line-height:1.5}
.grid thead th .tkc.cw{color:#1d6fb8;background:#e7f1fb}
.grid thead th .tkc.co{color:#0c8f80;background:#e3f8f4}
/* 出勤者0の日（調整対象）強調 */
.grid thead th.noone{background:#ffe2e2!important;color:#b91c1c!important;box-shadow:inset 0 -3px 0 #e8505b}
.grid thead th.noone .noneflag{display:block;font-size:11px;line-height:1}
.grid tr.cntrow td{background:#f1f5f9;font-weight:800;font-size:11px;color:#475569;height:24px}
.grid tr.cntrow td.noone0{background:#e8505b;color:#fff}
/* 左=あなパネル / 右=スケジュール の2カラム */
.storerow{display:flex;gap:10px;align-items:stretch}
.holepane{flex:0 0 150px;background:#fff;border:1px solid #eef2f6;border-radius:10px;padding:8px;align-self:flex-start;position:sticky;left:0;z-index:1}
.holehd{font-size:11px;font-weight:800;color:#475569;display:flex;align-items:center;gap:5px;margin-bottom:8px;line-height:1.3}
.holecnt{margin-left:auto;border-radius:7px;padding:1px 7px;font-weight:800;font-size:11px}
.holecnt.bad{background:#e8505b;color:#fff}.holecnt.ok{background:#dcfce7;color:#15803d}
.holelist{display:flex;flex-direction:column;gap:5px;max-height:300px;overflow:auto}
.holeitem{background:#fff1f1;border:1px solid #f3c0c0;border-radius:8px;padding:6px 9px;font-size:12.5px;color:#b91c1c;display:flex;align-items:center;justify-content:space-between;cursor:pointer;width:100%;font-weight:800}
.holeitem:hover{background:#ffe2e2}
.holeitem .hw{font-size:10px;color:#9aa6b2;font-weight:700}
.holeitem.sun b{color:#e8505b}.holeitem.sat b{color:#2c82c9}
.holeok{font-size:12px;color:#15803d;font-weight:700;text-align:center;padding:16px 4px;line-height:1.6}
.holeok span{font-size:10px;color:#9aa6b2;font-weight:600}
.storerow .gwrap{flex:1;min-width:0}
@media(max-width:640px){.storerow{flex-direction:column}.holepane{flex:1 1 auto;position:static;width:100%}.holelist{flex-direction:row;flex-wrap:wrap;max-height:none}.holeitem{width:auto}}
.grid thead .nm .tkh{font-size:8.5px;font-weight:700;color:#5d6b7a}
.sum{font-size:10px;color:var(--gray);font-weight:700}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--gray);padding:8px 14px;border-top:1px dashed #eef2f6}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;font-style:normal;text-align:center;line-height:14px;font-size:9px;font-weight:800}
.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;z-index:30}
.foot .tot{margin-left:auto;font-size:14px;font-weight:900;color:var(--navy)}
.foot .ds{font-size:11px;color:var(--gray);font-weight:700;display:flex;align-items:center;gap:5px}
.foot input{width:54px;border:1px solid var(--line);border-radius:7px;padding:5px;font-size:12px;text-align:right}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.ov.on{display:flex}
.ov .box{background:#fff;border-radius:16px;width:100%;max-width:340px;padding:24px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.ov .box h3{font-size:16px;font-weight:900;margin-bottom:4px}
.ov .box p{font-size:12px;color:var(--gray);margin-bottom:14px}
.ov .box input{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:9px;font-size:15px;margin-bottom:9px}
.ov .box .err{color:#e8505b;font-size:12px;margin-bottom:8px;display:none}
.ov .box button{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer}
.toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e2733;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.store-h .eye{background:#fff;border:1px solid var(--line);border-radius:7px;width:30px;height:27px;cursor:pointer;color:var(--gray);font-size:14px;margin-left:10px}
.store-h .eye:hover{border-color:var(--gray)}
.store.collapsed .collbar{display:flex;align-items:center;gap:9px;padding:11px 14px;font-weight:800;color:var(--gray)}
.collbar button{margin-left:auto;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:5px 13px;font-weight:800;cursor:pointer;font-size:12px}
.grid .nm .hidebtn{float:right;background:#f1f5f9;border:1px solid var(--line);border-radius:6px;color:var(--gray);font-size:11px;cursor:pointer;padding:1px 5px;line-height:1.3;margin-left:4px}
.grid .nm .hidebtn:hover{background:#fde8ea;border-color:#f3c0c6;color:#e8505b}
.grid .nm .hcfg{display:inline-flex;flex-direction:row;align-items:center;gap:8px;margin-top:3px;font-size:10px;color:#5d6b7a;font-weight:700;white-space:nowrap}
.grid .nm .hcfg label{display:inline-flex;align-items:center;gap:3px}
.grid .nm .hcfg input{width:54px;border:1px solid #d7dee6;border-radius:6px;padding:4px 5px;font-size:12.5px;text-align:right;background:#fffdf5}
.grid .nm .hcfg input:focus{outline:none;border-color:var(--accent);background:#fff}
.hiddenchips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;border-top:1px dashed #eef2f6;align-items:center}
.hiddenchips .hc{font-size:10.5px;font-weight:700;color:var(--gray);background:#f1f5f9;border:1px solid var(--line);border-radius:14px;padding:3px 10px;cursor:pointer}
.hiddenchips .hc:hover{background:#e2e8f0;color:var(--ink)}
@media(max-width:640px){.foot{font-size:11px;gap:8px}.tabs{margin-left:0;width:100%}}
</style>
</head>
<body>
<div class="bar"><div class="wrap">
  <h1>🗓 シフト一元管理ハブ <span style="font-size:11px;font-weight:700;background:rgba(255,255,255,.16);padding:3px 9px;border-radius:14px">那覇 / 札幌 / 高松 ・ 6〜10月限定</span></h1>
  <div class="sub">各店の出勤簿（実態＝マスター）を1画面で確認。編集タブはシミュレーション専用で、各店マスターには一切書き戻しません。</div>
  <div class="conn" id="conn"></div>
</div></div>

<div class="wrap">
  <div class="toolbar">
    <div class="months" id="months"></div>
    <button class="btn btn-ghost" onclick="loadAll()">↻ 最新に更新</button>
    <button class="btn btn-sync" onclick="syncFromMasters()">🔄 全同期</button>
    <button class="btn btn-ghost" onclick="syncSeishainOnly()">👔 正社員のみ同期</button>
    <button class="btn btn-ghost" onclick="resetToMaster()">↩ デフォルトに戻す</button>
    <button class="btn btn-sync" onclick="saveNow()">💾 保存</button>
    <div class="tabs">
      <button class="tab on" id="tab-master" onclick="setTab('master')">📋 マスター（実態）</button>
      <button class="tab" id="tab-sim" onclick="setTab('sim')">✏️ 編集（シミュレーション）</button>
    </div>
  </div>
  <div class="note" id="topnote"></div>
  <div id="stores"></div>
</div>

<div class="foot">
  <span class="ds">既定勤務時間 <input id="defH" type="number" step="0.5" value="8" onchange="recalc()">h <span style="color:#9aa6b2">（時刻未設定の出勤の人件費計算用）</span></span>
  <span id="footmode" class="ds"></span>
  <span class="tot" id="foottot"></span>
</div>

<div class="ov" id="loginOv"><div class="box">
  <h3 id="ovTitle">ログイン</h3>
  <p id="ovDesc"></p>
  <input id="ovEmail" type="email" autocapitalize="off" placeholder="メール">
  <input id="ovPass" type="password" placeholder="パスワード">
  <div class="err" id="ovErr"></div>
  <button id="ovBtn">ログイン</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
/* ===== config ===== */
const PROJ={
  A:{url:'https://ckrxttbnawkclshczsia.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8',ls:'sb-ckrxttbnawkclshczsia-auth-token',hubls:'shifthub_tokA'},
  B:{url:'https://ggqugvyskyiblxiycpci.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18',ls:'sb-ggqugvyskyiblxiycpci-auth-token',hubls:'shifthub_tokB'}
};
const STORES=[
  {key:'nha',label:'那覇',color:'var(--nha)',proj:'A',staffTbl:'nha_staff',shiftTbl:'nha_shifts',resTbl:'nha_reservations',sdCol:'start_date',edCol:'end_date'},
  {key:'spk',label:'札幌',color:'var(--spk)',proj:'A',staffTbl:'staff',shiftTbl:'shifts',resTbl:'reservations',sdCol:'lend_date',edCol:'return_date'},
  {key:'bt', label:'高松',color:'var(--bt)', proj:'B',staffTbl:'bt_staff',shiftTbl:'bt_shifts',resTbl:'bt_reservations',sdCol:'start_date',edCol:'end_date'}
];
const MONTHS=['2026-06','2026-07','2026-08','2026-09','2026-10'];
const SYM={'●':{l:'出勤',c:'#2563eb',bg:'#D4EBFA'},'公':{l:'公休',c:'#64748b',bg:'#E8E8E8'},'希':{l:'希望休',c:'#b45309',bg:'#FFF3CD'},'有':{l:'有休',c:'#15803d',bg:'#dcfce7'},'出':{l:'出張',c:'#6d28d9',bg:'#ede9fe'}};
const CYCLE=['','●','公','希','有','出'];
const WK=['日','月','火','水','木','金','土'];

let curMonth=MONTHS[0];
let tab='master';
let staffByStore={}, masterByStore={}, simByStore={}, taskCountByStore={};
let hidden={stores:[],staff:{}}; // 各店/各人の非表示（localStorage保持・表示と人件費から除外）
function loadHidden(){try{const h=JSON.parse(localStorage.getItem('shifthub_hidden'));if(h)hidden={stores:h.stores||[],staff:h.staff||{}};}catch(e){}}
function saveHidden(){try{localStorage.setItem('shifthub_hidden',JSON.stringify(hidden));}catch(e){}}
function isStoreHidden(k){return hidden.stores.indexOf(k)>=0;}
function isStaffHidden(k,name){return (hidden.staff[k]||[]).indexOf(name)>=0;}
function hideStore(k){if(!isStoreHidden(k))hidden.stores.push(k);saveHidden();render();}
function showStore(k){hidden.stores=hidden.stores.filter(x=>x!==k);saveHidden();render();}
function hideStaff(k,enc){const n=decodeURIComponent(enc);hidden.staff[k]=hidden.staff[k]||[];if(hidden.staff[k].indexOf(n)<0)hidden.staff[k].push(n);saveHidden();render();}
function showStaff(k,enc){const n=decodeURIComponent(enc);hidden.staff[k]=(hidden.staff[k]||[]).filter(x=>x!==n);saveHidden();render();}
// 人ごとの試算用 時給×勤務時間（シミュ専用・localStorage保持。初期＝実シフトから推定/master時給）
let simCfg={};
function loadCfg(){try{const c=JSON.parse(localStorage.getItem('shifthub_cfg'));if(c)simCfg=c;}catch(e){}}
function saveCfg(){try{localStorage.setItem('shifthub_cfg',JSON.stringify(simCfg));}catch(e){}}
function staffWage(k,name){const s=(staffByStore[k]||[]).find(x=>x.name===name);return s?s.wage:0;}
function estHours(k,name){const row=(masterByStore[k]||{})[name];if(!row)return 0;let sum=0,n=0;Object.keys(row).forEach(d=>{const c=row[d];if(c&&c.symbol==='●'&&c.start&&c.end){const a=c.start.split(':').map(Number),b=c.end.split(':').map(Number);let h=(b[0]*60+b[1]-(a[0]*60+a[1]))/60;if(h<0)h+=24;if(h>0){sum+=h;n++;}}});return n?Math.round(sum/n*10)/10:0;}
function cfgHours(k,name){const c=simCfg[k]&&simCfg[k][name];if(c&&c.h>0)return c.h;const e=estHours(k,name);return e||(+(($('defH')||{}).value)||8);}
function cfgWage(k,name){const c=simCfg[k]&&simCfg[k][name];if(c&&c.wage!=null&&c.wage!=='')return +c.wage;return staffWage(k,name);}
function setCfg(k,enc,field,v){const name=decodeURIComponent(enc);simCfg[k]=simCfg[k]||{};simCfg[k][name]=simCfg[k][name]||{};simCfg[k][name][field]=+v||0;saveCfg();render();}
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const yen=n=>'¥'+Math.round(n).toLocaleString();
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1900);}

/* ===== auth ===== */
function _ex(d){if(!d)return null;if(typeof d==='string')return d;if(d.access_token)return d.access_token;if(d.currentSession&&d.currentSession.access_token)return d.currentSession.access_token;if(d.session&&d.session.access_token)return d.session.access_token;if(Array.isArray(d)&&typeof d[0]==='string')return d[0];return null;}
function _notExpired(o){try{if(o&&typeof o==='object'&&o.expires_at)return (o.expires_at*1000)>Date.now()+5000;}catch(e){}return true;}
function tokenFor(proj){
  const c=PROJ[proj];
  try{const h=localStorage.getItem(c.hubls);if(h){const o=JSON.parse(h);const t=_ex(o);if(t&&_notExpired(o))return t;}}catch(e){}
  try{const v=localStorage.getItem(c.ls);if(v){const o=JSON.parse(v);const t=_ex(o);if(t&&_notExpired(o))return t;}}catch(e){}
  // 同一プロジェクトの sb-*-auth-token を総当り
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('sb-')===0&&k.indexOf('-auth-token')>0&&k.indexOf(c.url.split('//')[1].split('.')[0])>=0){const o=JSON.parse(localStorage.getItem(k));const t=_ex(o);if(t&&_notExpired(o))return t;}}}catch(e){}
  return null;
}
// BTトークン（ハブ保存・自動更新されない）を refresh_token で延長。失効していたら更新
async function ensureFreshB(){
  try{
    const raw=localStorage.getItem(PROJ.B.hubls);if(!raw)return;
    const o=JSON.parse(raw);
    if(o.expires_at&&(o.expires_at*1000)>Date.now()+60000)return; // まだ有効
    if(!o.refresh_token){return;}
    const r=await fetch(PROJ.B.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:PROJ.B.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:o.refresh_token})});
    const d=await r.json();
    if(d&&d.access_token){localStorage.setItem(PROJ.B.hubls,JSON.stringify({access_token:d.access_token,refresh_token:d.refresh_token||o.refresh_token,expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600)}));}
  }catch(e){}
}
function hdr(proj){const c=PROJ[proj];return {'apikey':c.key,'Authorization':'Bearer '+(tokenFor(proj)||c.key),'Content-Type':'application/json'};}
async function sbGet(proj,path){const c=PROJ[proj];const r=await fetch(c.url+'/rest/v1/'+path,{headers:hdr(proj)});if(!r.ok)throw new Error(proj+' HTTP '+r.status);return r.json();}
let _loginCb=null;
function openLogin(proj){
  const c=PROJ[proj];
  $('ovTitle').textContent=(proj==='B'?'高松（BUDDICA）':'那覇・札幌（HANDYMAN）')+' ログイン';
  $('ovDesc').textContent=proj==='B'?'高松は別システムのため初回だけログインが必要です。':'NHA/SPK のアカウントでログインしてください。';
  $('ovEmail').value=proj==='B'?'oshita.touring@buddica.co.jp':'';
  $('ovPass').value='';$('ovErr').style.display='none';
  $('loginOv').classList.add('on');
  $('ovBtn').onclick=()=>doLogin(proj);
  _loginCb=proj;
}
async function doLogin(proj){
  const c=PROJ[proj];const em=$('ovEmail').value.trim(),pw=$('ovPass').value;const b=$('ovBtn'),er=$('ovErr');
  if(!em||!pw){er.style.display='';er.textContent='入力してください';return;}
  b.disabled=true;b.textContent='確認中...';
  try{
    const r=await fetch(c.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})});
    const d=await r.json();
    if(d&&d.access_token){
      localStorage.setItem(c.hubls,JSON.stringify({access_token:d.access_token,refresh_token:d.refresh_token||'',expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600)}));
      $('loginOv').classList.remove('on');b.disabled=false;b.textContent='ログイン';
      renderConn();loadAll();
    }else{er.style.display='';er.textContent='認証に失敗しました';b.disabled=false;b.textContent='ログイン';}
  }catch(e){er.style.display='';er.textContent='接続エラー';b.disabled=false;b.textContent='ログイン';}
}
function projConnected(proj){return !!tokenFor(proj);}
function renderConn(){
  const aOk=projConnected('A'),bOk=projConnected('B');
  $('conn').innerHTML=
    `<span class="pill ${aOk?'ok':'ng'}"><span class="d"></span>那覇・札幌 ${aOk?'接続済':'未接続'}${aOk?'':"<button onclick=\"openLogin('A')\">ログイン</button>"}</span>`+
    `<span class="pill ${bOk?'ok':'ng'}"><span class="d"></span>高松 ${bOk?'接続済':'未接続'}${bOk?'':"<button onclick=\"openLogin('B')\">ログイン</button>"}</span>`;
}

/* ===== data ===== */
function daysIn(ym){const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();}
function dow(ym,d){const[y,m]=ym.split('-').map(Number);return new Date(y,m-1,d).getDay();}
async function loadStore(st){
  // staff
  let staff=[];
  try{staff=await sbGet(st.proj,st.staffTbl+'?select=*&order=sort_order');}catch(e){staff=[];}
  staff=(staff||[]).filter(s=>s&&s.name&&(s.active===undefined||s.active!==false));
  staffByStore[st.key]=staff.map(s=>({name:s.name,type:s.type||'',wage:+(s.hourly_wage||0),trans:+(s.transport_cost||0),monthly:+(s.monthly_salary||0),color:s.color||'#94a3b8'}));
  // shifts (当月)
  let sh=[];
  try{sh=await sbGet(st.proj,st.shiftTbl+'?select=date,staff_name,symbol,start_time,end_time&date=like.'+encodeURIComponent(curMonth+'-%'));}catch(e){sh=[];}
  const m={};
  (sh||[]).forEach(r=>{const dn=+String(r.date).slice(8,10);if(!dn)return;if(!m[r.staff_name])m[r.staff_name]={};const sym=r.symbol||((r.start_time&&r.end_time)?'●':'');m[r.staff_name][dn]={symbol:sym,start:r.start_time||'',end:r.end_time||''};});
  masterByStore[st.key]=m;
  // タスク数（OPシート準拠・未来月でも数えられるよう確定予約から算出）
  //  📋OPタスク = 配達(DEL=貸出日) + 回収(COL=返却日) / 🧽洗車 = 返却台数（返却日に1台1洗車）
  const ym=curMonth;
  let rs=[];
  try{rs=await sbGet(st.proj,st.resTbl+'?select='+st.sdCol+','+st.edCol+',status&or=('+st.sdCol+'.like.'+encodeURIComponent(ym+'-%')+','+st.edCol+'.like.'+encodeURIComponent(ym+'-%')+')');}catch(e){rs=[];}
  const tc={};
  (rs||[]).forEach(r=>{
    if(/cancel|キャンセル/i.test(String(r.status||'')))return;
    const sd=String(r[st.sdCol]||''),ed=String(r[st.edCol]||'');
    if(sd.slice(0,7)===ym){const d=+sd.slice(8,10);if(d){tc[d]=tc[d]||{w:0,o:0};tc[d].o++;}}
    if(ed.slice(0,7)===ym){const d=+ed.slice(8,10);if(d){tc[d]=tc[d]||{w:0,o:0};tc[d].o++;tc[d].w++;}}
  });
  taskCountByStore[st.key]=tc;
  // 名簿に無いがシフトに居る人を補完
  const have=new Set(staffByStore[st.key].map(s=>s.name));
  Object.keys(m).forEach(nm=>{if(!have.has(nm)){staffByStore[st.key].push({name:nm,type:'',wage:0,trans:0,monthly:0,color:'#cbd5e1'});have.add(nm);}});
}
async function loadAll(){
  $('stores').innerHTML='<div style="text-align:center;color:#9aa6b2;padding:40px">読み込み中…</div>';
  await ensureFreshB();
  for(const st of STORES){ if(projConnected(st.proj)){ try{await loadStore(st);}catch(e){masterByStore[st.key]={};staffByStore[st.key]=[];} } else { masterByStore[st.key]=null;staffByStore[st.key]=[]; } }
  loadSim();
  render();
}
/* ===== sim persistence (localStorage + project A app_settings) ===== */
function simKey(){return 'shifthub_sim_'+curMonth;}
function loadSim(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem(simKey()));}catch(e){}
  if(s&&s.byStore){simByStore=s.byStore;}
  else{ // 初期＝マスターのコピー
    simByStore={};STORES.forEach(st=>{simByStore[st.key]=deepCopy(masterByStore[st.key]||{});});
  }
}
function saveSim(){
  try{localStorage.setItem(simKey(),JSON.stringify({byStore:simByStore,at:new Date().toISOString()}));}catch(e){}
  // クラウド共有（project A・best-effort）
  if(projConnected('A')){fetch(PROJ.A.url+'/rest/v1/app_settings?on_conflict=key',{method:'POST',headers:Object.assign(hdr('A'),{'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify({key:simKey(),value:JSON.stringify(simByStore)})}).catch(()=>{});}
}
function deepCopy(o){return JSON.parse(JSON.stringify(o||{}));}
function saveNow(){saveSim();saveCfg();saveHidden();toast('保存しました（自動でも保存されています）');}
function syncFromMasters(){
  if(!confirm(curMonth+' のシミュレーションを「各店の実シフト」で上書きします。\n（マスターには一切影響しません。手元の編集は消えます）'))return;
  loadStore;  // noop guard
  (async()=>{
    await ensureFreshB();
    for(const st of STORES){if(projConnected(st.proj)){try{await loadStore(st);}catch(e){}}}
    simByStore={};STORES.forEach(st=>{simByStore[st.key]=deepCopy(masterByStore[st.key]||{});});
    saveSim();render();toast('実シフトを取り込みました');
  })();
}
// 正社員だけ実態から取り込む（バイトのシミュは残す＝正社員のシフト変更だけ追従）
function syncSeishainOnly(){
  (async()=>{
    await ensureFreshB();
    for(const st of STORES){if(projConnected(st.proj)){try{await loadStore(st);}catch(e){}}}
    let cnt=0;
    STORES.forEach(st=>{
      const m=masterByStore[st.key]||{};
      simByStore[st.key]=simByStore[st.key]||{};
      (staffByStore[st.key]||[]).forEach(s=>{
        if(s.type==='正社員'){ if(m[s.name]){simByStore[st.key][s.name]=deepCopy(m[s.name]);} else {delete simByStore[st.key][s.name];} cnt++; }
      });
    });
    saveSim();render();toast('正社員のシフトを実態から取り込みました（'+cnt+'名）');
  })();
}
// 編集を全部破棄してマスター（実態）に戻す（シフト＋時給/時間オーバーライドをクリア）
function resetToMaster(){
  if(!confirm(curMonth+' の編集（シミュレーション）を破棄して、マスター（実態）に戻します。\n手元のシフト編集・時給/時間の変更はすべて消えます。'))return;
  (async()=>{
    await ensureFreshB();
    for(const st of STORES){if(projConnected(st.proj)){try{await loadStore(st);}catch(e){}}}
    simByStore={};STORES.forEach(st=>{simByStore[st.key]=deepCopy(masterByStore[st.key]||{});});
    simCfg={};saveCfg();saveSim();render();toast('マスターの状態に戻しました');
  })();
}

/* ===== render ===== */
function setTab(t){tab=t;$('tab-master').classList.toggle('on',t==='master');$('tab-sim').classList.toggle('on',t==='sim');render();}
function renderMonths(){$('months').innerHTML=MONTHS.map(m=>`<button class="mbtn ${m===curMonth?'on':''}" onclick="setMonth('${m}')">${+m.slice(5)}月</button>`).join('');}
function setMonth(m){curMonth=m;renderMonths();loadAll();}
function cellHours(c,defH){if(c&&c.start&&c.end){const a=c.start.split(':').map(Number),b=c.end.split(':').map(Number);let h=(b[0]*60+b[1]-(a[0]*60+a[1]))/60;if(h<0)h+=24;if(h>0)return h;}return defH;}
function storeCost(stKey,data,defH,editable){
  let wage=0,trans=0,days=0,hours=0;
  const staff=staffByStore[stKey]||[];
  staff.forEach(s=>{
    if(isStaffHidden(stKey,s.name))return;
    if(s.type!=='アルバイト')return; // 正社員等は月給→時給ベースの人件費に含めない
    const fb=editable?cfgHours(stKey,s.name):defH;
    const w=editable?cfgWage(stKey,s.name):s.wage;
    const row=data[s.name]||{};
    Object.keys(row).forEach(dn=>{const c=row[dn];if(c&&c.symbol==='●'){days++;const h=cellHours(c,fb);hours+=h;if(w>0){wage+=h*w;trans+=s.trans;}}});
  });
  return {wage,trans,days,hours,total:wage+trans};
}
function gridHtml(stKey,editable){
  const data=editable?(simByStore[stKey]||{}):(masterByStore[stKey]||{});
  const staff=staffByStore[stKey]||[];
  const dn=daysIn(curMonth);
  const tc=taskCountByStore[stKey]||{};
  // 出勤者数を日ごとに集計（非表示は除外・編集タブの増減に都度追従）
  const dayCnt={};for(let d=1;d<=dn;d++)dayCnt[d]=0;
  staff.forEach(s=>{ if(isStaffHidden(stKey,s.name))return; const r=data[s.name]||{}; for(let d=1;d<=dn;d++){ if((r[d]&&r[d].symbol)==='●')dayCnt[d]++; } });
  const noneDays=[];for(let d=1;d<=dn;d++){if(dayCnt[d]===0)noneDays.push(d);}
  let head='<th class="nm">スタッフ<br><span class="tkh">🧽洗車 / 📋OPタスク</span></th>';
  for(let d=1;d<=dn;d++){const w=dow(curMonth,d);const c=tc[d]||{w:0,o:0};const none=dayCnt[d]===0;head+=`<th id="thd-${stKey}-${d}" class="${w===0?'sun':w===6?'sat':''}${none?' noone':''}" title="${none?'⚠️ 出勤者0人（調整対象）':''}">${none?'<span class="noneflag">⚠️</span>':''}${d}<br><span style="font-size:8px">${WK[w]}</span><br><span class="tkc cw" title="洗車">🧽${c.w||0}</span><br><span class="tkc co" title="OPタスク">📋${c.o||0}</span></th>`;}
  head+='<th>出勤</th>';
  // 👥出勤者数の集計行（0人＝赤・調整対象）
  let cntRow='<tr class="cntrow"><td class="nm">👥 出勤者数</td>';
  for(let d=1;d<=dn;d++){const n=dayCnt[d];cntRow+=`<td class="${n===0?'cell noone0':'cell'}">${n===0?'0':n}</td>`;}
  cntRow+=`<td class="sum">${noneDays.length?'⚠️'+noneDays.length+'日':'OK'}</td></tr>`;
  let body=cntRow;
  staff.forEach(s=>{
    if(isStaffHidden(stKey,s.name))return;
    const row=data[s.name]||{};
    let cnt=0;
    let tds='';
    for(let d=1;d<=dn;d++){
      const w=dow(curMonth,d);const c=row[d];const sym=c&&c.symbol||'';
      if(sym==='●')cnt++;
      const m=SYM[sym];
      const style=m?`background:${m.bg};color:${m.c}`:'';
      const cls='cell'+(w===0?' sun':w===6?' sat':'');
      tds+=`<td class="${cls}" style="${style}" ${editable?`onclick="cyc('${stKey}','${encodeURIComponent(s.name)}',${d})"`:''}>${sym}</td>`;
    }
    const wg=s.wage>0?`<span class="wg">時給¥${s.wage.toLocaleString()}${s.type==='アルバイト'?'':' ('+(s.type||'-')+')'}</span>`:(s.monthly>0?`<span class="wg">月給</span>`:`<span class="wg">${s.type||''}</span>`);
    const isHourly=s.type==='アルバイト';
    const enc=encodeURIComponent(s.name);
    const sub=(editable&&isHourly)
      ? `<span class="hcfg"><label>時給<input type="number" inputmode="numeric" step="10" min="0" value="${cfgWage(stKey,s.name)}" onclick="event.stopPropagation()" onchange="setCfg('${stKey}','${enc}','wage',this.value)">円</label><label>時間<input type="number" inputmode="decimal" step="0.5" min="0" value="${cfgHours(stKey,s.name)}" onclick="event.stopPropagation()" onchange="setCfg('${stKey}','${enc}','h',this.value)">h</label></span>`
      : wg;
    body+=`<tr><td class="nm"><button class="hidebtn" title="この人を非表示" onclick="hideStaff('${stKey}','${enc}')">🙈</button>${esc(s.name)}<br>${sub}</td>${tds}<td class="sum">${cnt}</td></tr>`;
  });
  const mm=+curMonth.slice(5);
  const holes=noneDays.length
    ? `<div class="holelist">${noneDays.map(d=>{const w=dow(curMonth,d);return `<button class="holeitem ${w===0?'sun':w===6?'sat':''}" onclick="(document.getElementById('thd-${stKey}-${d}')||{}).scrollIntoView&&document.getElementById('thd-${stKey}-${d}').scrollIntoView({inline:'center',block:'nearest'})"><b>${mm}/${d}</b><span class="hw">(${WK[w]})</span></button>`;}).join('')}</div>`
    : `<div class="holeok">✅ 穴なし<br><span>全日に出勤者あり</span></div>`;
  const holepane=`<div class="holepane"><div class="holehd">🕳 あな（出勤者0）<span class="holecnt ${noneDays.length?'bad':'ok'}">${noneDays.length}日</span></div>${holes}</div>`;
  return `<div class="storerow">${holepane}<div class="gwrap"><table class="grid ${editable?'edit':''}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div></div>`;
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){
  renderConn();
  $('topnote').innerHTML=tab==='master'
    ? '📋 <b>マスター（実態）</b>：各店の出勤簿の現在の状態をそのまま表示（編集不可）。これが正本です。'
    : '✏️ <b>編集（シミュレーション）</b>：セルをタップで 空→●→公→希→有→出。バイトは行に<b>時給×勤務時間</b>を持ち（初期＝実シフトから推定）、●の数×時給×時間で人件費を試算。<b>マスターには書き戻しません</b>。「🔄全同期」=全部を実シフトで上書き／「👔正社員のみ同期」=バイトのシミュは残して正社員シフトだけ追従。';
  const defH=+($('defH').value)||8;
  let html='';let grand=0;
  STORES.forEach(st=>{
    if(isStoreHidden(st.key)){
      html+=`<div class="store collapsed"><div class="collbar"><span style="width:12px;height:12px;border-radius:4px;display:inline-block;background:${st.color}"></span>${st.label}店（非表示）<button onclick="showStore('${st.key}')">表示する</button></div></div>`;
      return;
    }
    const connected=projConnected(st.proj);
    const data=tab==='sim'?(simByStore[st.key]||{}):(masterByStore[st.key]||{});
    const cost=connected?storeCost(st.key,data,defH,tab==='sim'):null;
    if(cost)grand+=cost.total;
    html+=`<div class="store"><div class="store-h"><span class="sdot" style="background:${st.color}"></span>${st.label}店`+
      (connected? (cost?`<span class="cost">バイト出勤 ${cost.days}日 ・ ${cost.hours.toFixed(1)}h ・ バイト人件費 <b>${yen(cost.total)}</b><span style="font-size:10px;color:#9aa6b2"> (賃金${yen(cost.wage)}+交通${yen(cost.trans)})</span></span>`:'') : `<span class="cost" style="color:#e8505b">未接続 → 上部でログイン</span>`)+
      `<button class="eye" title="この店を非表示" onclick="hideStore('${st.key}')">🙈</button>`+
      `</div>`;
    if(connected) html+=gridHtml(st.key,tab==='sim');
    const hs=(hidden.staff[st.key]||[]);
    if(hs.length) html+=`<div class="hiddenchips"><span style="color:#9aa6b2">🙈 非表示の人:</span>`+hs.map(n=>`<span class="hc" onclick="showStaff('${st.key}','${encodeURIComponent(n)}')">${esc(n)} ↩戻す</span>`).join('')+`</div>`;
    html+=`<div class="legend">`+Object.keys(SYM).map(k=>`<span><i style="background:${SYM[k].bg};color:${SYM[k].c}">${k}</i>${SYM[k].l}</span>`).join('')+`</div></div>`;
  });
  $('stores').innerHTML=html;
  $('footmode').textContent=tab==='sim'?'モード：シミュレーション（保存は自動・マスター非干渉）':'モード：実態ミラー';
  $('foottot').textContent=(tab==='sim'?'シミュ ':'実態 ')+'3店バイト人件費合計 '+yen(grand);
}
function recalc(){render();}
function cyc(stKey,nameEnc,d){
  if(tab!=='sim')return;
  const name=decodeURIComponent(nameEnc);
  const data=simByStore[stKey]||(simByStore[stKey]={});
  if(!data[name])data[name]={};
  const cur=(data[name][d]&&data[name][d].symbol)||'';
  const idx=CYCLE.indexOf(cur);const next=CYCLE[(idx+1)%CYCLE.length];
  if(!next){delete data[name][d];}
  else{const prev=data[name][d]||{};data[name][d]={symbol:next,start:prev.start||'',end:prev.end||''};}
  saveSim();render();
}

/* ===== init ===== */
loadHidden();loadCfg();renderMonths();renderConn();
$('loginOv').addEventListener('keydown',e=>{if(e.key==='Enter'&&_loginCb)doLogin(_loginCb);});
loadAll();
</script>
