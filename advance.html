<!DOCTYPE html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🧾 立替金（業務委託事業）</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;background:#f1f5f9;color:#0f172a}
#hd{background:linear-gradient(135deg,#ea580c,#c2410c);color:#fff;padding:16px 18px}
#hd .sub{font-size:12px;opacity:.85}#hd h1{margin:2px 0 0;font-size:20px}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.toolbar h2{margin:0;font-size:17px}
.btn{border:none;border-radius:9px;padding:9px 15px;font-size:14px;font-weight:800;cursor:pointer}
.btn-green{background:#16a34a;color:#fff}.btn-outline{background:#fff;color:#334155;border:1px solid #cbd5e1}
.advl{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px}
.advi{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;box-sizing:border-box;font-family:inherit}
@media(max-width:600px){#adv-form .grid{grid-template-columns:1fr !important}}
</style></head>
<body>
<div id="hd"><div class="sub">株式会社 Global Lines ／ 業務委託事業</div><h1>🧾 立替金 精算</h1></div>
<div class="wrap">
  <div class="toolbar">
    <h2>立替一覧</h2>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <input id="adv-fname" placeholder="提出者で絞込" oninput="renderAdvance()" style="padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px">
      <select id="adv-fstatus" onchange="renderAdvance()" style="padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px"><option value="">全ての状態</option><option value="unpaid">未精算のみ</option><option value="paid">精算済のみ</option></select>
      <select id="adv-groupby" onchange="renderAdvance()" style="padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px"><option value="month">📅 月別</option><option value="submitter">👤 担当者別</option></select>
      <button class="btn btn-green" onclick="showAdvanceForm()">➕ 立替を登録</button>
      <button class="btn btn-outline" onclick="advExportCsv()" title="現在の絞込結果をCSV出力">📥 CSV</button>
      <button class="btn btn-outline" onclick="advDownloadReceipts()" title="領収書をまとめてZIP">🗂 領収書ZIP</button>
    </div>
  </div>
  <div id="adv-form" style="display:none;background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:16px;overflow:hidden">
    <div style="background:linear-gradient(135deg,#ea580c,#c2410c);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between"><b id="adv-form-title">立替を登録</b><button onclick="closeAdvanceForm()" style="background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;border-radius:50%;font-size:16px;cursor:pointer">✕</button></div>
    <div class="grid" style="padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div><label class="advl">提出者 <span style="color:#dc2626">*</span></label><input id="adv-submitter" list="adv-people" placeholder="お名前" class="advi"><datalist id="adv-people"></datalist></div>
      <div><label class="advl">発生日</label><input id="adv-occurdate" type="date" class="advi"></div>
      <div><label class="advl">支払日 <span style="color:#dc2626">*</span></label><input id="adv-paydate" type="date" class="advi"></div>
      <div><label class="advl">支払先</label><input id="adv-payee" placeholder="例: ○○商店 / ガソリンスタンド" class="advi"></div>
      <div><label class="advl">科目・用途</label><input id="adv-category" list="adv-cats" placeholder="例: 交通費" class="advi"><datalist id="adv-cats"><option>交通費</option><option>燃料費</option><option>消耗品</option><option>駐車場</option><option>通信費</option><option>交際費</option><option>備品</option><option>その他</option></datalist></div>
      <div><label class="advl">金額（円） <span style="color:#dc2626">*</span></label><input id="adv-amount" type="number" inputmode="numeric" placeholder="0" class="advi"></div>
      <div><label class="advl">状態</label><select id="adv-status" class="advi"><option value="unpaid">未精算</option><option value="paid">精算済</option></select></div>
      <div style="grid-column:1/3"><label class="advl">詳細・メモ</label><textarea id="adv-detail" rows="2" placeholder="内容の詳細（任意）" class="advi" style="resize:vertical"></textarea></div>
      <div style="grid-column:1/3"><label class="advl">領収書（画像 / PDF）</label><input id="adv-file" type="file" accept="image/*,application/pdf" class="advi" style="padding:6px"><div id="adv-file-cur" style="font-size:12px;color:#64748b;margin-top:4px"></div></div>
    </div>
    <div style="padding:0 18px 18px;display:flex;gap:10px;justify-content:flex-end"><button class="btn btn-outline" onclick="closeAdvanceForm()">キャンセル</button><button class="btn btn-green" id="adv-save" onclick="saveAdvance()">📥 登録する</button></div>
  </div>
  <div id="adv-summary" style="margin-bottom:10px"></div>
  <div id="adv-list">読込中...</div>
</div>
<script>
const _SB_URL='https://ckrxttbnawkclshczsia.supabase.co';
const _SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
function _getSbToken(){return null;}
async function _sbReq(path,method='GET',body=null){
  const headers={'apikey':_SB_ANON,'Authorization':'Bearer '+_SB_ANON,'Content-Type':'application/json','Prefer':'return=representation,resolution=merge-duplicates'};
  const opts={method,headers}; if(body)opts.body=JSON.stringify(body);
  const r=await fetch(_SB_URL+'/rest/v1/'+path,opts);
  if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,140));
  const t=await r.text(); return t?JSON.parse(t):[];
}
let _advCache=[], _advEditId=null;
function _advEsc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function _advPeople(){try{return JSON.parse(localStorage.getItem('adv_people')||'[]');}catch(e){return[];}}
function _advRemember(n){if(!n)return;let p=_advPeople();if(!p.includes(n)){p.unshift(n);p=p.slice(0,12);localStorage.setItem('adv_people',JSON.stringify(p));}localStorage.setItem('adv_lastme',n);}
function _advFillPeople(){var dl=document.getElementById('adv-people');if(dl)dl.innerHTML=_advPeople().map(function(p){return '<option>'+_advEsc(p)+'</option>';}).join('');}
function _advFiltered(){var fn=(document.getElementById('adv-fname').value||'').trim();var fs=document.getElementById('adv-fstatus').value;return _advCache.filter(function(r){return (!fn||String(r.submitter||'').indexOf(fn)>=0)&&(!fs||(r.status||'unpaid')===fs);});}
async function renderAdvance(){
  var list=document.getElementById('adv-list'); if(!list)return; _advFillPeople(); list.innerHTML='読込中...';
  var rows=[]; try{ rows=await _sbReq('advance_reimbursements?order=occur_date.desc,pay_date.desc,id.desc'); }catch(e){ list.innerHTML='<div style="color:#dc2626;padding:16px">読込エラー: '+(e&&e.message||e)+'</div>'; return; }
  _advCache=rows||[]; var view=_advFiltered();
  var tot=view.reduce(function(a,r){return a+(Number(r.amount)||0);},0);
  var unpaid=view.filter(function(r){return (r.status||'unpaid')!=='paid';}).reduce(function(a,r){return a+(Number(r.amount)||0);},0);
  document.getElementById('adv-summary').innerHTML='<div style="display:flex;gap:12px;flex-wrap:wrap"><span style="background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:8px 14px;font-weight:700">件数 '+view.length+'</span><span style="background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:8px 14px;font-weight:700">合計 ¥'+tot.toLocaleString()+'</span><span style="background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:8px 14px;font-weight:800;color:#c2410c">未精算 ¥'+unpaid.toLocaleString()+'</span></div>';
  if(!view.length){ list.innerHTML='<div style="padding:24px;text-align:center;color:#94a3b8">立替の登録はありません。「➕ 立替を登録」から追加してください。</div>'; return; }
  var _gb=(document.getElementById('adv-groupby')||{}).value||'month';
  var _advRow=function(r){var paid=(r.status==='paid');return '<tr style="border-bottom:1px solid #f1f5f9">'
    +'<td style="padding:8px 10px;font-family:monospace;white-space:nowrap;color:#334155">'+_advEsc(r.occur_date||'')+'</td>'
    +'<td style="padding:8px 10px;font-family:monospace;white-space:nowrap">'+_advEsc(r.pay_date||'')+'</td>'
    +'<td style="padding:8px 10px;font-weight:700">'+_advEsc(r.submitter||'')+'</td>'
    +'<td style="padding:8px 10px">'+_advEsc(r.payee||'')+'</td>'
    +'<td style="padding:8px 10px"><span style="font-size:12px;background:#eef2ff;color:#3730a3;border-radius:6px;padding:2px 8px">'+_advEsc(r.category||'-')+'</span></td>'
    +'<td style="padding:8px 10px;font-weight:800;text-align:right;white-space:nowrap">¥'+(Number(r.amount)||0).toLocaleString()+'</td>'
    +'<td style="padding:8px 10px"><button onclick="toggleAdvPaid(\''+r.id+'\','+paid+')" style="border:none;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:800;cursor:pointer;background:'+(paid?'#dcfce7':'#fef3c7')+';color:'+(paid?'#15803d':'#b45309')+'">'+(paid?'✅精算済':'⏳未精算')+'</button></td>'
    +'<td style="padding:8px 10px">'+(r.file_url?'<a href="'+r.file_url+'" target="_blank" style="color:#2563eb;font-weight:700;text-decoration:none">📎 表示</a>':'<span style="color:#cbd5e1">なし</span>')+'</td>'
    +'<td style="padding:8px 10px;white-space:nowrap"><button title="編集" onclick="editAdvance(\''+r.id+'\')" style="background:none;border:none;cursor:pointer;font-size:15px">✏️</button><button title="削除" onclick="deleteAdvance(\''+r.id+'\')" style="background:none;border:none;cursor:pointer;font-size:15px">🗑</button></td>'
    +'</tr>'+(r.detail?'<tr><td colspan="9" style="padding:0 10px 8px 10px;font-size:12px;color:#64748b">📝 '+_advEsc(r.detail)+'</td></tr>':'');};
  var _thead='<thead><tr style="background:#f1f5f9">'+['発生日','支払日','提出者','支払先','科目','金額','状態','領収書',''].map(function(h){return '<th style="padding:8px 10px;text-align:left;font-size:12px;color:#475569;white-space:nowrap">'+h+'</th>';}).join('')+'</tr></thead>';
  var _grp={}; view.forEach(function(r){ var k=(_gb==='submitter')?((r.submitter||'').trim()||'（提出者なし）'):((r.occur_date||r.pay_date||'0000-00').slice(0,7)); (_grp[k]=_grp[k]||[]).push(r); });
  var _keys=Object.keys(_grp).sort(); if(_gb!=='submitter')_keys.reverse();
  list.innerHTML=_keys.map(function(k){ var g=_grp[k]; var sub=g.reduce(function(a,r){return a+(Number(r.amount)||0);},0); var up=g.filter(function(r){return (r.status||'unpaid')!=='paid';}).reduce(function(a,r){return a+(Number(r.amount)||0);},0); var label=(_gb==='submitter')?('👤 '+_advEsc(k)):('📅 '+((k==='0000-00')?'日付なし':(k.slice(0,4)+'年'+(+k.slice(5,7))+'月')));
    return '<div style="margin-bottom:16px"><div style="display:flex;align-items:center;gap:10px;background:#0f172a;color:#fff;padding:9px 14px;border-radius:8px 8px 0 0;flex-wrap:wrap"><b style="font-size:14px">'+label+'</b><span style="font-size:12px;opacity:.8">'+g.length+'件</span>'+(up>0?'<span style="font-size:12px;background:#c2410c;border-radius:6px;padding:1px 8px;font-weight:700">未精算 ¥'+up.toLocaleString()+'</span>':'')+'<span style="margin-left:auto;font-weight:800">合計 ¥'+sub.toLocaleString()+'</span>'+(g.some(function(r){return r.file_url;})?'<button onclick="advDLGroup(\''+encodeURIComponent(k)+'\')" style="background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:7px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap">🗂 領収書DL</button>':'')+'</div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;background:#fff;min-width:900px">'+_thead+'<tbody>'+g.map(_advRow).join('')+'</tbody></table></div></div>';
  }).join('');
}
function showAdvanceForm(){ _advEditId=null; _advFillPeople(); document.getElementById('adv-form-title').textContent='立替を登録'; document.getElementById('adv-submitter').value=localStorage.getItem('adv_lastme')||''; var td=new Date().toISOString().slice(0,10); document.getElementById('adv-occurdate').value=td; document.getElementById('adv-paydate').value=td; document.getElementById('adv-payee').value=''; document.getElementById('adv-category').value=''; document.getElementById('adv-amount').value=''; document.getElementById('adv-status').value='unpaid'; document.getElementById('adv-detail').value=''; document.getElementById('adv-file').value=''; document.getElementById('adv-file-cur').textContent=''; document.getElementById('adv-form').style.display='block'; document.getElementById('adv-form').scrollIntoView({behavior:'smooth'}); }
function closeAdvanceForm(){ document.getElementById('adv-form').style.display='none'; }
function editAdvance(id){ var r=_advCache.find(function(x){return String(x.id)===String(id);}); if(!r)return; _advEditId=id; _advFillPeople(); document.getElementById('adv-form-title').textContent='立替を編集'; document.getElementById('adv-submitter').value=r.submitter||''; document.getElementById('adv-occurdate').value=r.occur_date||''; document.getElementById('adv-paydate').value=r.pay_date||''; document.getElementById('adv-payee').value=r.payee||''; document.getElementById('adv-category').value=r.category||''; document.getElementById('adv-amount').value=r.amount||''; document.getElementById('adv-status').value=r.status||'unpaid'; document.getElementById('adv-detail').value=r.detail||''; document.getElementById('adv-file').value=''; document.getElementById('adv-file-cur').innerHTML=r.file_url?('現在の領収書: <a href="'+r.file_url+'" target="_blank">'+_advEsc(r.file_name||'領収書')+'</a>（差し替える場合のみ選択）'):''; document.getElementById('adv-form').style.display='block'; document.getElementById('adv-form').scrollIntoView({behavior:'smooth'}); }
async function saveAdvance(){
  var submitter=(document.getElementById('adv-submitter').value||'').trim(); var pay_date=document.getElementById('adv-paydate').value||null; var amount=parseFloat(document.getElementById('adv-amount').value)||0;
  if(!submitter){alert('提出者を入力してください');return;} if(!pay_date){alert('支払日を入力してください');return;} if(!amount){alert('金額を入力してください');return;}
  var btn=document.getElementById('adv-save'); btn.disabled=true; btn.textContent='保存中…';
  var file_url='',file_name='',file_type=''; var fin=document.getElementById('adv-file'); var f=fin.files&&fin.files[0];
  if(f){ var ext=(f.name.split('.').pop()||'bin'); var path='advance/adv_'+Date.now()+'.'+ext;
    try{ var up=await fetch(_SB_URL+'/storage/v1/object/received-invoices/'+path,{method:'POST',headers:{'apikey':_SB_ANON,'Authorization':'Bearer '+_SB_ANON,'Content-Type':(f.type||'application/octet-stream'),'x-upsert':'true'},body:f}); if(up.ok){file_url=_SB_URL+'/storage/v1/object/public/received-invoices/'+path;file_name=f.name;file_type=f.type;} else { if(!confirm('⚠️ 画像アップロード失敗（HTTP '+up.status+'）。画像なしで登録しますか？')){btn.disabled=false;btn.textContent='📥 登録する';return;} } }catch(e){ if(!confirm('⚠️ 画像アップロードエラー。画像なしで登録しますか？')){btn.disabled=false;btn.textContent='📥 登録する';return;} }
  } else if(_advEditId){ var ex=_advCache.find(function(x){return String(x.id)===String(_advEditId);}); if(ex){file_url=ex.file_url||'';file_name=ex.file_name||'';file_type=ex.file_type||'';} }
  var rec={submitter:submitter,occur_date:(document.getElementById('adv-occurdate').value||null),pay_date:pay_date,payee:document.getElementById('adv-payee').value||'',category:document.getElementById('adv-category').value||'',amount:amount,detail:document.getElementById('adv-detail').value||'',status:document.getElementById('adv-status').value||'unpaid',file_url:file_url,file_name:file_name,file_type:file_type,updated_at:new Date().toISOString()};
  try{ if(_advEditId){ await _sbReq('advance_reimbursements?id=eq.'+encodeURIComponent(_advEditId),'PATCH',rec); } else { await _sbReq('advance_reimbursements','POST',rec); } _advRemember(submitter); closeAdvanceForm(); await renderAdvance(); }catch(e){ alert('保存に失敗しました: '+(e&&e.message||e)); }
  btn.disabled=false; btn.textContent='📥 登録する';
}
async function toggleAdvPaid(id,cur){ var ns=cur?'unpaid':'paid'; try{ await _sbReq('advance_reimbursements?id=eq.'+encodeURIComponent(id),'PATCH',{status:ns,paid_date:(ns==='paid'?new Date().toISOString().slice(0,10):null)}); await renderAdvance(); }catch(e){ alert('更新に失敗: '+(e&&e.message||e)); } }
async function deleteAdvance(id){ var r=_advCache.find(function(x){return String(x.id)===String(id);}); if(!confirm('この立替を削除しますか？\n'+(r?((r.submitter||'')+' / ¥'+(Number(r.amount)||0).toLocaleString()):'')))return; try{ await _sbReq('advance_reimbursements?id=eq.'+encodeURIComponent(id),'DELETE'); await renderAdvance(); }catch(e){ alert('削除に失敗: '+(e&&e.message||e)); } }
function _advCsvEsc(s){s=String(s==null?'':s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function advExportCsv(){ var view=_advFiltered(); if(!view.length){alert('出力対象がありません');return;} var head=['発生日','支払日','提出者','支払先','科目・用途','金額','状態','精算日','詳細','メモ','領収書URL']; var lines=view.map(function(r){return [r.occur_date||'',r.pay_date||'',r.submitter||'',r.payee||'',r.category||'',(Number(r.amount)||0),((r.status==='paid')?'精算済':'未精算'),r.paid_date||'',(r.detail||'').replace(/\r?\n/g,' '),(r.memo||'').replace(/\r?\n/g,' '),r.file_url||''].map(_advCsvEsc).join(',');}); var csv='﻿'+head.join(',')+'\n'+lines.join('\n'); var blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='立替_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},2000); }
async function advDLGroup(k){k=decodeURIComponent(k);var gb=(document.getElementById('adv-groupby')||{}).value||'month';var fn=(document.getElementById('adv-fname').value||'').trim();var fs=(document.getElementById('adv-fstatus')||{}).value||'';var view=_advCache.filter(function(r){return (!fn||String(r.submitter||'').indexOf(fn)>=0)&&(!fs||(r.status||'unpaid')===fs);}).filter(function(r){var key=(gb==='submitter')?((r.submitter||'').trim()||'（提出者なし）'):((r.occur_date||r.pay_date||'0000-00').slice(0,7));return key===k;}).filter(function(r){return r.file_url;});if(!view.length){alert('この'+(gb==='submitter'?'担当者':'月')+'の領収書はありません');return;}var labl=(gb==='submitter')?k:((k==='0000-00')?'日付なし':(k.slice(0,4)+'年'+(+k.slice(5,7))+'月'));if(!confirm(labl+'の領収書'+view.length+'件をZIPでダウンロードします。よろしいですか？'))return;var zip=new JSZip(),okc=0;for(var i=0;i<view.length;i++){var r=view[i];try{var res=await fetch(r.file_url);if(!res.ok)continue;var buf=await res.arrayBuffer();var ext=(r.file_name&&r.file_name.indexOf('.')>=0)?r.file_name.split('.').pop():((r.file_url.split('.').pop()||'jpg').split('?')[0]);var nm=((r.occur_date||r.pay_date||'nodate')+'_'+(r.submitter||'')+'_'+(r.payee||'')+'_'+(i+1)+'.'+ext).replace(/[\/\\:*?"<>|]/g,'_');zip.file(nm,buf);okc++;}catch(e){}}if(!okc){alert('領収書の取得に失敗しました');return;}var blob=await zip.generateAsync({type:'blob'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='立替領収書_'+labl+'.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},2000);}
async function advDownloadReceipts(){ if(typeof JSZip==='undefined'){alert('ZIPライブラリ未読込');return;} var view=_advFiltered().filter(function(r){return r.file_url;}); if(!view.length){alert('領収書ファイルがありません');return;} if(!confirm(view.length+'件の領収書をZIPでダウンロードします。よろしいですか？'))return; var zip=new JSZip(),okc=0; for(var i=0;i<view.length;i++){var r=view[i];try{var res=await fetch(r.file_url);if(!res.ok)continue;var buf=await res.arrayBuffer();var ext=(r.file_name&&r.file_name.indexOf('.')>=0)?r.file_name.split('.').pop():((r.file_url.split('.').pop()||'jpg').split('?')[0]);var nm=((r.occur_date||r.pay_date||'nodate')+'_'+(r.submitter||'')+'_'+(r.payee||'')+'_'+(i+1)+'.'+ext).replace(/[\/\\:*?"<>|]/g,'_');zip.file(nm,buf);okc++;}catch(e){}} if(!okc){alert('領収書の取得に失敗しました');return;} var blob=await zip.generateAsync({type:'blob'}); var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='立替領収書_'+new Date().toISOString().slice(0,10)+'.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},2000); }
