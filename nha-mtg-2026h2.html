function daishoTxt(D){
  var months=D.months,o=D.data;
  var gm=(D.generated||"").slice(0,7);var ci=months.indexOf(gm);if(ci<0)ci=months.length-1;
  var cm=months[ci],C=o[cm]||{tot_c:0,tot_r:0,resv_r:0,ext_r:0,flow_c:0,flow_r:0,flow_chan:{},nveh:0};
  var per=C.nveh?Math.round(C.tot_r/C.nveh):0;
  function fclist(mo){var a=[];Object.keys(mo.flow_chan||{}).forEach(function(k){a.push([k,mo.flow_chan[k].c,mo.flow_chan[k].r]);});a.sort(function(x,y){return y[2]-x[2];});return a;}
  var L=[];

function dsumBox(D){var txt=daishoTxt(D);

function copyDaily(){var t=document.getElementById("dsumtxt").textContent;if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){alert("日報サマリーをコピーしました");},function(){prompt("コピーしてください",t);});}else{prompt("コピーしてください",t);}}
function setupMonthCollapse(months){
  var N=months.length,KEY="nha_mcol_h2",COLL;
  try{COLL=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"));}catch(e){COLL=new Set();}
  var tables=document.querySelectorAll("#body table");
  function save(){try{localStorage.setItem(KEY,JSON.stringify(Array.from(COLL)));}catch(e){}}
  function apply(){
    tables.forEach(function(t){
      var cols=t.querySelectorAll("colgroup col");var sub=Math.max(1,Math.round((cols.length-1)/N));
      for(var i=0;i<N;i++){var c=COLL.has(i);for(var s=0;s<sub;s++){var col=cols[1+i*sub+s];if(col)col.style.width=c?Math.round(24/sub)+"px":"";}}
      t.querySelectorAll("tr").forEach(function(tr){
        var d=0,ch=tr.children;
        for(var k=0;k<ch.length;k++){var cell=ch[k];if(cell.classList.contains("l"))continue;var mi=Math.floor(d/sub);cell.setAttribute("data-m",mi);if(COLL.has(mi))cell.classList.add("mcol");else cell.classList.remove("mcol");d+=(cell.colSpan||1);}
      });
    });
    document.querySelectorAll("#body th.mh").forEach(function(th){th.onclick=function(){var mi=+th.getAttribute("data-m");if(COLL.has(mi))COLL.delete(mi);else COLL.add(mi);save();apply();};});
    document.querySelectorAll("#body td.mcol,#body th.mcol").forEach(function(el){el.onclick=function(){COLL.delete(+el.getAttribute("data-m"));save();apply();};});
  }

}
function render(D){
  var months=D.months,o=D.data,CN=D.clsnames||{};
  var tc=0,tr=0;months.forEach(function(m){tc+=o[m].tot_c;tr+=o[m].tot_r;});
  var allc={};months.forEach(function(m){Object.keys(o[m].cls||{}).forEach(function(c){allc[c]=1;});Object.keys(o[m].util||{}).forEach(function(c){allc[c]=1;});});
  var clss=CORD.filter(function(c){return allc[c];}).concat(Object.keys(allc).filter(function(c){return CORD.indexOf(c)<0;}));
  function prog(m,a,t,i,g){g=g||hasT;if(!g(m))return '<td class="'+mc(i)+'"></td>';var p=t?Math.round(a/t*100):0;return '<td class="'+(p>=100?"pos":"")+mc(i)+'">'+p+"%</td>";}

    H+='<tr><td class="l">'+rowLabel+'</td>'+months.map(function(m,i){return '<td class="rev'+mc(i)+'">'+(fmt=="cnt"?valFn(m)+"件":yen(valFn(m)))+"</td>";}).join("")+"</tr>";
    H+='<tr class="gr"><td class="l">目標</td>'+months.map(function(m,i){return tgt(m,fmt=="cnt"?tgtFn(m)+"件":yen(tgtFn(m)),i,gate);}).join("")+"</tr>";
    H+='<tr class="gp"><td class="l">進捗</td>'+months.map(function(m,i){return prog(m,valFn(m),tgtFn(m),i,gate);}).join("")+"</tr>";

    return H;
  }
  function cell2(m,i,c,r){return c!=null?('<td class="cnt'+mc(i)+'">'+c+'件</td><td class="rev'+mbnd(i)+'">'+yen(r)+"</td>"):('<td class="cnt z'+mc(i)+'">–</td><td class="z'+mbnd(i)+'">–</td>');}
  var H="";

  H+=kpiSec("📈 予約数（実績）","予約実績",function(m){return o[m].tot_c;},function(m){return T_CNT;},"cnt",hasCntT);
  H+=kpiSec("🚗 台あたり売上（実績 / 目標 / 進捗 / 差分）　目標＝売上目標(550万)÷稼働台数","台あたり実績",perOf,perTgt,"rev");
  // 📊 稼働率（全体・日数ベース：貸出日数÷稼働可能日数）
  (function(){
    H+='<div class="h2">📊 稼働率（全体・日数ベース＝貸出日数÷稼働可能日数／稼働台数併記）</div><div class="tw"><table><colgroup><col style="width:170px">'+months.map(function(){return "<col>";}).join("")+'</colgroup><thead><tr><th class="l">区分</th>'+months.map(function(m,i){return '<th class="mh'+mc(i)+'">'+MN[m]+"</th>";}).join("")+"</tr></thead><tbody>";
    H+='<tr class="uf"><td class="l"><b>■ グロス（全体）</b></td>'+months.map(function(m,i){var uu=o[m].util||{};var rd=0,ad=0,nn=0;Object.keys(uu).forEach(function(c){rd+=uu[c].rd;ad+=uu[c].ad;nn+=uu[c].n;});if(!ad)return '<td class="'+mc(i)+'" style="text-align:right">–</td>';var p=Math.round(rd/ad*100);var bk=p>=100?" blink":(p>=45?" frblink":"");return '<td class="'+mc(i)+bk+'" style="text-align:right">'+p+'% <span style="color:#94a3b8;font-weight:500;font-size:9px">稼'+nn+'台 '+rd+"/"+ad+"</span></td>";}).join("")+"</tr>";
    H+="</tbody></table></div>";
  })();

    var DC={};vm.forEach(function(m){var sv=0,sp=0,o2={};dcl.forEach(function(c){var x=R(m,c),d=DS[c][1],vo=(x.rd-x.td)*d,pu=x.rd?x.ar-x.rd*d:0;o2[c]={vo:vo,pu:pu,x:x,d:d};sv+=vo;sp+=pu;});DC[m]={c:o2,sv:sv,sp:sp,ot:(AN[m].a-AN[m].t)-(sv+sp)};});
    row("<b>売上</b>（進捗／目標）","gp",function(X,m,i){return '<td class="'+mln(i)+'" colspan="3" style="text-align:left;white-space:nowrap">進捗 '+yen(X.a)+'　／　目標 '+yen(X.t)+'</td>'+cell(i,"<b>"+sc(X.a-X.t)+"</b>",pn(X.a-X.t));});
    dcl.forEach(function(c){
      row(lab(c),"",function(X,m,i){var z=(X.byC[c]||[])[0],q=DC[m].c[c];if(!z||z.k=='nov'){if(!q.x.td&&!q.x.ar)return '<td class="z'+mln(i)+'" colspan="4">'+(z?z.lb:'–')+'</td>';}
        var t=T[z?z.k:'ok'],r=X.rank[c],tip=z?z.tip.replace(/"/g,""):"",
          a1='<td class="'+mln(i)+'" title="'+tip+'" style="color:'+t[2]+';font-weight:800;text-align:left;white-space:nowrap;line-height:1.15">'+(r?'<span style="color:#dc2626">'+r+'</span>':'')+(z&&z.lb&&z.k!='nov'?z.lb:t[1]||'')+(z&&z.n0!==''&&z.k!='nov'?'<div style="font-size:10px;font-weight:600;color:#475569">'+z.n0+'→'+z.n1+'</div>':'')+'</td>';
        return a1+cell(i,sc(q.vo),pn(q.vo))+cell(i,q.x.rd?sc(q.pu):'—',q.x.rd?pn(q.pu):'z')+cell(i,'<b>'+sc(q.vo+q.pu)+'</b>',pn(q.vo+q.pu));});});
    row("予約外・その他","",function(X,m,i){var v=DC[m].ot;return '<td class="'+mln(i)+'" colspan="3" style="text-align:left;font-size:10px;color:#475569;white-space:nowrap" title="予約にひもづかない売上（オプション・予約外売上）や、目標と設計の端数の差">クラス外の売上（オプション・予約外）・端数</td>'+cell(i,sc(v),pn(v));});
    row("<b>合計</b>（＝売上の差）","uf",function(X,m,i){var D=DC[m];return '<td class="'+mln(i)+'" style="text-align:left"><b>'+(X.gap<=0?'✅達成':Math.abs(D.sv)>=Math.abs(D.sp)?'主因＝稼働':'主因＝単価')+'</b></td>'+cell(i,"<b>"+sc(D.sv)+"</b>",pn(D.sv))+cell(i,"<b>"+sc(D.sp)+"</b>",pn(D.sp))+cell(i,"<b>"+sc(X.a-X.t)+"</b>",pn(X.a-X.t));});
    row("取り戻すには","exaa",function(X,m,i){if(X.gap<=0)return '<td class="pos'+mln(i)+'" colspan="4">達成</td>';
      var un=X.uA>0?X.uA:X.uD,N=un?Math.ceil(X.gap/un):0,pd=X.left?Math.round(N/X.left*10)/10:0;
      return '<td class="'+mln(i)+'" colspan="2" style="text-align:left;white-space:nowrap" title="不足¥'+k(X.gap)+'÷1日あたり¥'+k(un)+'＝あと'+N+'日分'+(m==cur?'。残り'+X.left+'日で割ると毎日あと約'+pd+'台':'')+'"><b>'+(m==cur?'残り'+X.left+'日で 毎日あと約'+pd+'台':'今後の予約で あと'+N+'日分')+'</b></td>'+'<td class="'+mbnd(i)+'" colspan="2" style="text-align:right">予約 '+X.rd+'日→<b>'+(X.rd+N)+'日</b></td>';});
    H+='</tbody></table></div><div class="sub">内訳：稼働で＝(予約日数−設計日数)×設計単価／単価で＝予約日数×(1日料金−設計単価)／計＝そのクラスの売上−設計売上。クラスの計と「予約外・その他」を縦に足すと、売上の差（進捗−目標）に一致。やること＝そのクラスで差を埋める打ち手（下の小さい数字＝今→目標：¥＝1日料金／日＝予約日数／台＝台数）。①②③＝残りの日で取り戻せる額が大きい順。✅設計達成＝予約日数・料金とも設計どおり以上。⬇料金を下げるの下げ幅（設計より3%超高ければ設計単価へ・それ以外は−10%）は目安＝OTAの順位を見て調整。'+(isBT?'🔀BT車/HDM車を売る＝同じクラスでそのブランドの車だけ稼働が低い。':'')+'取り戻すには＝不足額を1日料金で割った予約日数。やることのセルに触れると理由。</div>';
  })();
  // ① 単価
  H+=head("💴 単価（1日あたり）　設計 / 進捗 / 差 / 比率",["設計","進捗","差","比率"]);
  rows.concat(tots).forEach(function(r){H+='<tr class="'+(r[3]||"")+'"><td class="l">'+r[0]+"</td>"+ms.map(function(m,i){var x=r[1](m),t=r[2]?DS[r[2]][1]:up(x.tr,x.td),a=up(x.ar,x.rd);
    return '<td class="'+mln(i)+'">'+yen(t)+'</td>'+(x.rd?'<td class="'+mbnd(i)+'"><b>'+yen(a)+"</b></td>"+dif(a-t,yen,i)+'<td class="'+(a>=t?"pos":"")+mbnd(i)+'">'+pct(a,t)+"%</td>":'<td class="z'+mbnd(i)+'">–</td><td class="z'+mbnd(i)+'">–</td><td class="z'+mbnd(i)+'">–</td>');}).join("")+"</tr>";});
  H+="</tbody></table></div>";
  // ② 稼働率
  H+=head("📊 稼働率　台数（配車表）/ 目標 / 進捗 / 差",["台数","目標","進捗","差"]);
  rows.concat(tots).forEach(function(r){H+='<tr class="'+(r[3]||"")+'"><td class="l">'+r[0]+"</td>"+ms.map(function(m,i){var x=r[1](m);
    return '<td class="'+mln(i)+'">'+x.n+"台</td>"+'<td class="'+mbnd(i)+'">'+pct(x.td,x.ad)+"% "+gs+x.td+"日</span></td>"+'<td class="'+mbnd(i)+'"><b>'+pct(x.rd,x.ad)+"%</b> "+gs+x.rd+"日</span></td>"+(function(){var dp=pct(x.rd,x.ad)-pct(x.td,x.ad),dd=x.rd-x.td;return '<td class="'+(dp>=0?"pos":"neg")+mbnd(i)+'">'+(dp>=0?"+":"−")+Math.abs(dp)+"% "+gs+(dd>=0?"+":"−")+Math.abs(dd)+"日</span></td>";})();}).join("")+"</tr>";});  /* 稼働率の差は％（日数は小さく添える） */
  H+='<tr class="act"><td class="l">稼働台数（配車表）</td>'+ms.map(function(m,i){return '<td class="'+mln(i)+'" colspan="4">'+o[m].nveh+"台</td>";}).join("")+"</tr>";
  H+="</tbody></table></div>";
  // ③ 売上
  H+=head("💰 売上　目標 / 進捗 / 差 / 達成率",["目標","進捗","差","達成率"]);
  rows.concat(tots).forEach(function(r){H+='<tr class="'+(r[3]||"")+'"><td class="l">'+r[0]+"</td>"+ms.map(function(m,i){var x=r[1](m),p=pct(x.ar,x.tr);
    return '<td class="'+mln(i)+'">'+yen(x.tr)+'</td><td class="'+mbnd(i)+'"><b>'+yen(x.ar)+"</b></td>"+dif(x.ar-x.tr,yen,i)+'<td class="'+(p>=100?"pos":"")+mbnd(i)+'">'+p+"%</td>";}).join("")+"</tr>";});
  H+='<tr><td class="l" style="font-weight:600">未配車・予約外・その他</td>'+ms.map(function(m,i){return '<td class="'+mln(i)+'"></td><td class="'+mbnd(i)+'">'+yen(o[m].tot_r-S(m,dcl).ar)+'</td><td class="'+mbnd(i)+'"></td><td class="'+mbnd(i)+'"></td>';}).join("")+"</tr>";
  H+='<tr class="foot"><td class="l">総合計（目標'+Math.round(T_REV/10000)+'万）</td>'+ms.map(function(m,i){var t=revT(m),a=o[m].tot_r,p=pct(a,t);return '<td class="'+mln(i)+'">'+yen(t)+'</td><td class="'+mbnd(i)+'"><b>'+yen(a)+"</b></td>"+dif(a-t,yen,i)+'<td class="'+(p>=100?"pos":"")+mbnd(i)+'">'+p+"%</td>";}).join("")+"</tr>";
  H+="</tbody></table></div>";
  H+='<div class="sub" style="margin-top:7px">進捗：実績売上＝返却月の予約売上(キャンセル/テスト除外・KPIタブと同じ)／進捗単価＝実績売上÷実績貸出日数。総合計は月の目標と比較。</div>';
  el.innerHTML=H;
}
