<script>
const SU='https://ckrxttbnawkclshczsia.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
// ★ 2026-05-13: 親APP の Supabase Auth トークンを共有（RLS authenticated 経路でデータ取得）
function _extractAccessToken(d){
  if(!d)return null;
  if(typeof d==='string')return d;
  if(d.access_token)return d.access_token;
  if(d.currentSession&&d.currentSession.access_token)return d.currentSession.access_token;
  if(d.session&&d.session.access_token)return d.session.access_token;
  if(Array.isArray(d)&&typeof d[0]==='string')return d[0];
  return null;
}
function getAuthToken(){
  try{
    const v=localStorage.getItem('sb-ckrxttbnawkclshczsia-auth-token');
    if(v){
      try{const tok=_extractAccessToken(JSON.parse(v));if(tok)return tok;}catch(e){}
    }
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith('sb-')&&k.indexOf('auth-token')>=0){
        const val=localStorage.getItem(k);
        if(!val)continue;
        try{const tok=_extractAccessToken(JSON.parse(val));if(tok)return tok;}catch(e){}
      }
    }
    return null;
  }catch(e){return null;}
}
let _authWarned=false;
function authHeader(){
  const t=getAuthToken();
  if(!t&&!_authWarned){_authWarned=true;console.warn('[monthly] No auth token - data may be empty under RLS');}
  return 'Bearer '+(t||SK);
}
// ★ 独立起動時のSupabase認証（APPにログインしていない場合でも動作）
function _ensureAuth(callback){
  if(getAuthToken()){callback();return;}
  var ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';
  ov.innerHTML='<div style="background:#fff;padding:32px 28px;border-radius:16px;width:90%;max-width:360px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)">'
    +'<div style="font-size:10px;color:#6b7280;letter-spacing:.3em;margin-bottom:4px;text-transform:uppercase">HANDYMAN</div>'
    +'<div style="font-size:16px;font-weight:800;color:#1e3a8a;margin-bottom:4px" id="_au_title">認証が必要です</div>'
    +'<div style="font-size:11px;color:#64748b;margin-bottom:20px">メールアドレスとパスワードを入力してください</div>'
    +'<input id="_au_email" type="email" inputmode="email" autocapitalize="off" autocorrect="off" placeholder="メールアドレス" style="width:100%;padding:10px;border:1.5px solid #d1d5db;border-radius:8px;font-size:15px;margin-bottom:8px;outline:none">'
    +'<input id="_au_pw" type="password" placeholder="パスワード" style="width:100%;padding:10px;border:1.5px solid #d1d5db;border-radius:8px;font-size:15px;margin-bottom:8px;outline:none">'
    +'<div id="_au_err" style="color:#dc2626;font-size:11px;font-weight:600;margin-bottom:8px;display:none"></div>'
    +'<button id="_au_btn" style="width:100%;padding:11px;background:linear-gradient(135deg,#1e3a8a,#1e40af);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer">ログイン</button>'
    +'</div>';
  document.body.appendChild(ov);
  window._authCb=callback;window._authOv=ov;
  ov.addEventListener('keydown',function(e){if(e.key==='Enter')_doAuthLogin();});
  document.getElementById('_au_btn').addEventListener('click',_doAuthLogin);
  setTimeout(function(){var el=document.getElementById('_au_email');if(el)el.focus();},100);
}
async function _doAuthLogin(){
  var btn=document.getElementById('_au_btn');
  var err=document.getElementById('_au_err');
  var email=(document.getElementById('_au_email')||{}).value||'';
  var pw=(document.getElementById('_au_pw')||{}).value||'';
  if(!email||!pw){if(err){err.style.display='';err.textContent='メールアドレスとパスワードを入力してください';}return;}
  if(btn){btn.disabled=true;btn.textContent='確認中...';}
  if(err)err.style.display='none';
  try{
    var res=await fetch(SU+'/auth/v1/token?grant_type=password',{
      method:'POST',headers:{apikey:SK,'Content-Type':'application/json'},
      body:JSON.stringify({email:email,password:pw})
    });
    var d=await res.json();
    if(d&&d.access_token){
      localStorage.setItem('sb-ckrxttbnawkclshczsia-auth-token',JSON.stringify({
        access_token:d.access_token,refresh_token:d.refresh_token||'',
        expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600),
        token_type:'bearer',user:d.user||{}
      }));
      if(window._authOv)window._authOv.remove();
      if(window._authCb)window._authCb();
    }else{
      var msg=(d&&(d.error_description||d.msg||d.message))||'メールアドレスまたはパスワードが違います';
      if(err){err.style.display='';err.textContent=msg;}
      if(btn){btn.disabled=false;btn.textContent='ログイン';}
    }
  }catch(e){
    if(err){err.style.display='';err.textContent='接続エラー: '+e.message;}
    if(btn){btn.disabled=false;btn.textContent='ログイン';}
  }
}

// ★ 2026-05-13: PIN 1215 認証（予算実績タブ専用ロック・毎回要求）
const _PIN_REQUIRED='1215';
function _showPinThen(onPass){
  const ov=document.createElement('div');
  ov.id='pin-overlay-monthly';
  ov.style.cssText='position:fixed;inset:0;background:linear-gradient(135deg,#1e3a8a,#1e40af);z-index:10000;display:flex;align-items:center;justify-content:center;font-family:-apple-system,sans-serif';
  ov.innerHTML='<div style="background:#fff;padding:36px 28px;border-radius:16px;width:90%;max-width:380px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)"><div style="font-size:11px;color:#6b7280;letter-spacing:.3em;margin-bottom:6px">📊 MONTHLY</div><div style="font-size:18px;font-weight:800;color:#1e3a8a;margin-bottom:6px">予算実績タブ</div><div style="font-size:11px;color:#64748b;margin-bottom:20px">表示するには PIN を入力してください</div><input id="pin-inp" type="password" inputmode="numeric" maxlength="4" placeholder="• • • •" style="width:100%;padding:12px;border:1.5px solid #d1d5db;border-radius:10px;font-size:22px;text-align:center;letter-spacing:10px;margin-bottom:8px"><div id="pin-err" style="color:#dc2626;font-size:12px;font-weight:600;margin-bottom:8px;display:none">PIN が一致しません</div><button id="pin-btn" style="width:100%;padding:12px;background:linear-gradient(135deg,#1e3a8a,#1e40af);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer">確認</button></div>';
  document.body.appendChild(ov);
  document.body.style.overflow='hidden';
  const inp=document.getElementById('pin-inp'),btn=document.getElementById('pin-btn'),err=document.getElementById('pin-err');
  setTimeout(()=>inp.focus(),100);
  function check(){
    if(inp.value===_PIN_REQUIRED){
      ov.remove();document.body.style.overflow='';
      if(onPass)onPass();
    }else{err.style.display='block';inp.value='';}
  }
  btn.onclick=check;
  inp.onkeydown=e=>{if(e.key==='Enter')check();};
}
const MS=['01','02','03','04','05','06','07','08','09','10','11','12'];
const _urlStore=new URLSearchParams(location.search).get('store');
const _fixedStore=(_urlStore==='nha'||_urlStore==='spk')?_urlStore:null; // 固定store(URLパラメータ)
let store=_fixedStore||'nha', year=new Date().getFullYear();
let mode='jisseki'; // 'yosan' | 'jisseki'
let theme='pl'; // 'pl' | 'cf' | 'cashin'
function _updateStateBar(){
  const storeL={'nha':'那覇','spk':'札幌','total':'両店合計'};
  const modeL={'yosan':'予算','jisseki':'実績','hikaku':'予実比較'};
  const el=id=>document.getElementById(id);
  const themeL={'pl':'PL','cf':'CF','cashin':'実入金CF'};
  if(el('sc-theme'))el('sc-theme').textContent=themeL[theme]||theme;
  if(el('sc-mode'))el('sc-mode').textContent=modeL[mode]||mode;
  if(el('sc-store'))el('sc-store').textContent=storeL[store]||store;
  if(el('sc-year'))el('sc-year').textContent=year+'年';
  var cl=document.getElementById('cost-link');
  if(cl)cl.href='./costmatrix.html?store='+(store==='total'?'nha':store)+'&t='+Date.now();
}
function setTheme(t){
  theme=t;
  [['bpl','pl','#2563eb'],['bcf','cf','#059669'],['bci','cashin','#d97706']].forEach(([id,key,col])=>{
    const b=document.getElementById(id); if(!b)return;
    b.style.background=t===key?col:'#334155';
    b.style.color=t===key?'#fff':'#64748b';
  });
  _updateStateBar();
  load();
}

// ===== 予算データ {base:{mm:v}, opt:{mm:v}, ..., manual:{items:[...]}} =====
let budgetData={};
function parseBudgetRaw(v){if(!v)return{};try{return JSON.parse(v);}catch(e){return{};}}
async function loadBudget(y){
  try{
    if(store==='total'){
      const[nv,sv]=await Promise.all([sbgkey('nha_app_settings','budget_nha_'+y),sbgkey('nha_app_settings','budget_spk_'+y)]);
      const nd=parseBudgetRaw(nv),sd=parseBudgetRaw(sv);
      budgetData={};
      ['base','opt','disc','extra','cashin','sga','cogs','repay'].forEach(k=>{
        budgetData[k]={};MS.forEach(m=>{budgetData[k][m]=(nd[k]&&nd[k][m]||0)+(sd[k]&&sd[k][m]||0);});
      });
      const ni=nd.manual&&nd.manual.items||[],si=sd.manual&&sd.manual.items||[];
      budgetData.manual={items:[...ni.map(it=>({...it,_s:'那覇'})),...si.map(it=>({...it,_s:'札幌'}))]};
    }else{
      const v=await sbgkey('nha_app_settings','budget_'+store+'_'+y);
      budgetData=parseBudgetRaw(v);
      if(!budgetData.manual)budgetData.manual={items:[]};
    }
  }catch(e){budgetData={manual:{items:[]}};}
}
async function _saveBudgetData(){
  if(store==='total')return;
  const key='budget_'+store+'_'+year;
  await fetch(SU+'/rest/v1/nha_app_settings',{method:'POST',headers:{apikey:SK,'Authorization':authHeader(),'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},body:JSON.stringify({key,value:JSON.stringify(budgetData)})});
}
function computeBudgetD(){
  const BD={};
  MS.forEach(m=>{
    const g=k=>budgetData[k]&&budgetData[k][m]||0;
    const items=budgetData.manual&&budgetData.manual.items||[];
    const manualExtra=items.reduce((s,it)=>s+(it.values&&it.values[m]||0),0);
    const rev=g('rev');  // ★ 予算は「売上」一本化（基本/付帯/割引/予約外を統合）
    const cashin=g('cashin');
    const sga=g('sga'),cogs=g('cogs'),repay=g('repay');
    // PL: 売上（rev）= 実績側の小計に対応
    const plRev=rev+manualExtra;
    const sub2=rev; // 予実比較用: 予算rev vs 実績小計
    const totalCost=sga+cogs;
    const operatingProfit=plRev-totalCost; // PL営業利益
    // CF: 現金ベース
    const cfNet=operatingProfit+cashin-repay; // CF残高
    const totalIn=plRev+cashin; // 後方互換用
    BD[m]={rev,sub2,cashin,sga,sgaTotal:sga,cogs,repay,manualExtra,
           plRev,totalIn,totalCost,operatingProfit,cfNet};

function parseManualRaw(v){
  if(!v)return{items:[]};
  try{
    const d=JSON.parse(v);
    if(d&&Array.isArray(d.items))return d; // 新形式
    // 旧形式 {mm:amount} → items配列に変換
    if(typeof d==='object'){
      const vals={};MS.forEach(m=>{if(d[m])vals[m]=d[m];});
      if(Object.keys(vals).length>0)return{items:[{id:'legacy',name:'その他売上',values:vals}]};
    }
  }catch(e){}
  return{items:[]};
}

function _recalcManual(){
  if(!window._monthlyD)return;
  MS.forEach(m=>{
    const tot=(manualData.items||[]).reduce((s,it)=>s+(it.values&&it.values[m]||0),0);
    const D=window._monthlyD[m];
    D.manualExtra=tot;
    D.plRev=D.base+D.opt-D.disc+D.extra+tot;           // ★ plRev更新（PL売上合計）
    D.totalIn=D.plRev+D.cashin;                          // 後方互換
    D.operatingProfit=D.plRev-D.totalCost;               // PL営業利益
    D.cfNet=D.operatingProfit+D.cashin-D.repay;          // CF残高
  });
}

async function sbq(tbl,qs){
  // Supabase max=1000行/クエリのためページネーションで全件取得
  const all=[];let offset=0;
  while(true){
    const r=await fetch(`${SU}/rest/v1/${tbl}?${qs}&limit=1000&offset=${offset}`,{headers:{apikey:SK,'Authorization':authHeader(),'Range-Unit':'items','Prefer':'count=none'}});
    const batch=await r.json();
    if(!Array.isArray(batch)||batch.length===0)break;
    all.push(...batch);
    if(batch.length<1000)break;
    offset+=1000;
  }
  return all;
}
async function sbgkey(tbl,key){
  const r=await fetch(`${SU}/rest/v1/${tbl}?key=eq.${encodeURIComponent(key)}&select=key,value`,{headers:{apikey:SK,'Authorization':authHeader()}});
  const d=await r.json();return d&&d[0]?d[0].value:null;
}

// ★ コスト内訳ミラーリング: cm_ci_totals_${store}_${y} があれば PL/CF の sga/acctActual/cogs/repay を上書き
// 戻り値: true=ミラー成功(全店分取得済) / false=未取得(現状計算をフォールバック)
function applyCMTotals(stores, y, D){
  const arr=Array.isArray(stores)?stores:[stores];
  const sg=MS.map(()=>0),ac=MS.map(()=>0),cg=MS.map(()=>0),rg=MS.map(()=>0);
  let allOk=true;
  arr.forEach(function(s){
    try{
      const raw=localStorage.getItem('cm_ci_totals_'+s+'_'+y);
      if(!raw){allOk=false;return;}
      const t=JSON.parse(raw);
      const _sg=t.sg||[],_ac=t.ac||[],_cg=t.cg||[],_rg=t.rg||[];
      MS.forEach(function(m,i){
        sg[i]+=+(_sg[i]||0);ac[i]+=+(_ac[i]||0);cg[i]+=+(_cg[i]||0);rg[i]+=+(_rg[i]||0);
      });
    }catch(e){allOk=false;}
  });
  if(!allOk)return false;
  MS.forEach(function(m,i){D[m].sga=sg[i];D[m].acctActual=ac[i];D[m].cogs=cg[i];D[m].repay=rg[i];});
  return true;
}

  // 全データ並列取得: ST構造 + cm_キー + 会計 + 車両保険 + 整備記録
  const [accts,cmRaws,vehRaw,stRaw,logsData]=await Promise.all([
    sbq(aTbl,`select=type,category,amount,date&date=gte.${y}-01-01&date=lte.${y}-12-31`),

    sbgkey(sTbl,`cm_st_${store}`), // costmatrixのST構造

  ]);

  // 月別集計
  const D={};
  MS.forEach(m=>{D[m]={base:0,opt:0,disc:0,extra:0,manualExtra:0,cashin:0,sga:0,cogs:0,acctActual:0,repay:0};});

    const a=r.amount||0,cat=r.category||'';
    if(r.type==='extra_sales')D[m].extra+=a;
    else if(r.type==='cash_in')D[m].cashin+=a;
    else if(r.type==='cash_out'||r.type==='card_pay'){
      // 整備カテゴリは nha_logs（車両費）で計上済みのため除外
      const isMaint=/修理|車検|点検|整備/.test(cat);
      if(!isMaint) D[m].acctActual+=a;
    }
  });
  // ★ 整備記録（costmatrixと同じソース）から車検/点検/修理を売上原価に加算
  (logsData||[]).forEach(r=>{
    const m=(r.date||'').slice(5,7);if(!D[m])return;
    const cost=Number(r.cost)||0;
    D[m].cogs+=cost;
  });
  // ── 車両保険（月額）→ 売上原価 ──
  const vIns=(vehRaw||[]).reduce(function(s,v){return s+(v.insurance_annual||0);},0);
  MS.forEach(function(m){D[m].cogs+=vIns;});
  // ── 販管費①・売上原価: costmatrixのST構造を読んで動的にID集合を構築 ──
  // カスタム項目（広告費等）も含めて完全一致させる
  const AUTO_SGA=['sga_social_ins']; // 自動計算（給与×15%）
  const AUTO_COGS=['cogs_insurance']; // 自動計算（車両タブ）
  const SGA_IDS=new Set(['s2a','s2b','s2c','s2d','s2e','s2f','s2g','s2h','s3a','s3b','s3c','s3d','s4','s4a','s11','s11a','s12','s12a','s13','s13a','s14','s14a']);
  const COGS_IDS=new Set(['c1a','c1b','c1c','c1d','c1e','c6a','c6b','c6c','c6d','c6e','c6f','c7']); // c3/c4/c5は会計実績から自動計上
  const SALARY_IDS=new Set(['s2a','s2b','s2c','s2d','s2e','s2f','s2g','s2h']);
  const REPAY_IDS=new Set(['r1','r2','r3','r4','r5','r6','r7','r8']); // ★ CF返済項目
  // STが取得できれば動的にオーバーライド（カスタム項目対応）
  try{
    if(stRaw){
      const st=JSON.parse(stRaw);
      const sgSec=st.find(function(s){return s.id==='sg';});
      const cgSec=st.find(function(s){return s.id==='cg';});
      if(sgSec){
        SGA_IDS.clear();SALARY_IDS.clear();
        (sgSec.items||[]).forEach(function(item){
          if(AUTO_SGA.includes(item.code))return;
          if(item.g){(item.subs||[]).forEach(function(sub){
            SGA_IDS.add(sub.id);
            if(item.code==='sga_salary')SALARY_IDS.add(sub.id);
          });}else{SGA_IDS.add(item.id);}
        });
        // 旧IDフォールバック（グループ化前のデータ対応）
        ['s4','s11','s12','s13','s14'].forEach(function(id){SGA_IDS.add(id);});
      }
      if(cgSec){
        COGS_IDS.clear();
        (cgSec.items||[]).forEach(function(item){
          if(AUTO_COGS.includes(item.code))return;
          if(item.g){(item.subs||[]).forEach(function(sub){COGS_IDS.add(sub.id);});}
          else{COGS_IDS.add(item.id);}
        });
        // 旧IDフォールバック（c3/c4/c5は会計実績自動計上のため除外）
        ['c7'].forEach(function(id){COGS_IDS.add(id);});
      }
    }
  }catch(e){}
  // ST読み込み状況をステータスに表示
  const stLoaded=stRaw?true:false;
  const sgIdCount=SGA_IDS.size;
  document.getElementById('status').textContent=(stLoaded?'✅ ST読込済（'+sgIdCount+'項目）':'⚠️ ST未取得（costmatrixを先に開いてください）')+' 読込中...';
  cmRaws.forEach(function(raw,i){
    if(!raw)return;
    try{
      const d=JSON.parse(raw);
      let salarySum=0;
      // ★ ST rg セクションから返済IDを動的取得
      if(stRaw){try{const st=JSON.parse(stRaw);const rg=st.find(function(s){return s.id==='rg';});if(rg){REPAY_IDS.clear();(rg.items||[]).forEach(function(i){REPAY_IDS.add(i.id);});}}catch(e){}}
      Object.entries(d).forEach(function([id,amount]){
        const a=Number(amount)||0;if(a<=0)return;
        if(SGA_IDS.has(id))D[MS[i]].sga+=a;
        if(SALARY_IDS.has(id))salarySum+=a;
        if(COGS_IDS.has(id))D[MS[i]].cogs+=a;
        if(REPAY_IDS.has(id))D[MS[i]].repay+=a; // ★ CF返済
      });
      D[MS[i]].sga+=Math.round(salarySum*0.15); // 社会保険（給与×15%）
    }catch(e){}
  });

  // その他売上 手動データをDに適用
  MS.forEach(m=>{D[m].manualExtra=(manualData.items||[]).reduce((s,it)=>s+(it.values&&it.values[m]||0),0);});
  // ★ コスト内訳ミラーリング（sga/acctActual/cogs/repay を localStorage cm_ci_totals_${store}_${y} で上書き）
  const _cmMirrored=applyCMTotals(store,y,D);
  if(_cmMirrored){document.getElementById('status').textContent='✅ コスト内訳と一致（cm_ci_totals）';}
  else{document.getElementById('status').textContent='⚠️ コスト内訳未開封 → 独自計算（costmatrixを先に開いてください）';}
  // 各月の合計
  MS.forEach(m=>{
    D[m].plRev=D[m].base+D[m].opt-D[m].disc+D[m].extra+D[m].manualExtra;  // PL売上
    D[m].totalIn=D[m].plRev+D[m].cashin;                                   // 後方互換
    D[m].sub2=D[m].base+D[m].opt-D[m].disc+D[m].extra;    // 小計（予実比較用）
    D[m].sgaTotal=D[m].sga+D[m].acctActual;               // 販管費合計
    D[m].totalCost=D[m].sgaTotal+D[m].cogs;               // PL支出
    D[m].operatingProfit=D[m].plRev-D[m].totalCost;                        // PL営業利益
    D[m].cfNet=D[m].operatingProfit+D[m].cashin-D[m].repay;                // CF残高
  });
  window._monthlyD=D; // 手動入力の即時反映用

  render(D);
  document.getElementById('status').textContent=`${year}年 読込完了`;
}

// ★ 合算モード: NHA + SPK を合算して表示
async function loadTotal(y){
  const sTbl='nha_app_settings';
  const [nhAccts,spkAccts,nhCmRaws,spkCmRaws,nhVeh,spkVeh,nhSt,spkSt,nhResvs,spkResvs,nhLogs,spkLogs]=await Promise.all([
    sbq('nha_accounting',`select=type,category,amount,date&date=gte.${y}-01-01&date=lte.${y}-12-31`),
    sbq('spk_accounting',`select=type,category,amount,date&date=gte.${y}-01-01&date=lte.${y}-12-31`),
    Promise.all(MS.map(m=>sbgkey(sTbl,`cm_nha_${y}-${m}`))),
    Promise.all(MS.map(m=>sbgkey(sTbl,`cm_spk_${y}-${m}`))),
    sbq('nha_vehicles',`select=insurance_annual`),
    sbq('vehicles',`select=insurance_annual`),
    sbgkey(sTbl,'cm_st_nha'),
    sbgkey(sTbl,'cm_st_spk'),
    sbq('nha_reservations',`select=base_price,option_price,discount,price,status,end_date&end_date=gte.${y}-01-01&end_date=lte.${y}-12-31&status=neq.cancelled`),
    sbq('reservations',`select=base_price,option_price,discount,price,status,return_date&return_date=gte.${y}-01-01&return_date=lte.${y}-12-31&status=neq.cancelled`),
    sbq('nha_logs',`select=type,cost,date&date=gte.${y}-01-01&date=lte.${y}-12-31&type=in.(inspection,semi_annual,repair,other)`),
    sbq('logs',`select=type,cost,date&store_id=eq.sapporo&date=gte.${y}-01-01&date=lte.${y}-12-31&type=in.(inspection,semi_annual,repair,other,oil)`),
  ]);
  const D={};
  MS.forEach(m=>{D[m]={base:0,opt:0,disc:0,extra:0,manualExtra:0,cashin:0,sga:0,cogs:0,acctActual:0,repay:0};});
  // 収入: 常にSupabaseから直接取得（キャッシュ廃止）
  const applyResvs=function(resvs,dCol){
    (resvs||[]).forEach(function(r){const m=(r[dCol]||'').slice(5,7);if(!D[m])return;const bp=r.base_price||0,op=r.option_price||0,dc=r.discount||0;if(bp>0||op>0){D[m].base+=bp;D[m].opt+=op;D[m].disc+=dc;}else D[m].base+=r.price||0;});
  };
  applyResvs(nhResvs,'end_date');
  applyResvs(spkResvs,'return_date');
  // 会計実績: 両店合算（修理/車検/点検は整備記録から取得するため除外）
  [...(nhAccts||[]),...(spkAccts||[])].forEach(r=>{
    const m=(r.date||'').slice(5,7);if(!D[m])return;
    const a=r.amount||0,cat=r.category||'';
    if(r.type==='extra_sales')D[m].extra+=a;
    else if(r.type==='cash_in')D[m].cashin+=a;
    else if(r.type==='cash_out'||r.type==='card_pay'){if(!/修理|車検|点検|整備/.test(cat))D[m].acctActual+=a;}
  });
  // ★ 整備記録（costmatrixと同じソース）から車検/点検/修理/その他を売上原価に加算
  [...(nhLogs||[]),...(spkLogs||[])].forEach(r=>{
    const m=(r.date||'').slice(5,7);if(!D[m])return;
    const cost=Number(r.cost)||0;
    D[m].cogs+=cost;
  });
  // 車両保険: 両店合算
  const nhIns=(nhVeh||[]).reduce((s,v)=>s+(v.insurance_annual||0),0);
  const spkIns=(spkVeh||[]).reduce((s,v)=>s+(v.insurance_annual||0),0);
  MS.forEach(m=>{D[m].cogs+=nhIns+spkIns;});
  // costmatrix手動入力: 両店合算
  [[nhCmRaws,nhSt,'nha'],[spkCmRaws,spkSt,'spk']].forEach(function([cmRaws,stRaw,s]){
    const SGA_IDS=new Set(['s2a','s2b','s2c','s2d','s2e','s2f','s2g','s2h','s3a','s3b','s3c','s3d','s4','s4a','s11','s11a','s12','s12a','s13','s13a','s14','s14a']);
    const COGS_IDS=new Set(['c1a','c1b','c1c','c1d','c1e','c6a','c6b','c6c','c6d','c6e','c6f','c7']);
    const SALARY_IDS=new Set(['s2a','s2b','s2c','s2d','s2e','s2f','s2g','s2h']);
    const REPAY_IDS=new Set(['r1','r2','r3','r4','r5','r6','r7','r8']);
    // ★ 単店舗ロードと同様にST構造から動的にID集合を再構築
    if(stRaw){try{
      const st=JSON.parse(stRaw);
      const sgSec=st.find(function(s){return s.id==='sg';});
      const cgSec=st.find(function(s){return s.id==='cg';});
      const rgSec=st.find(function(s){return s.id==='rg';});
      if(sgSec){
        SGA_IDS.clear();SALARY_IDS.clear();
        (sgSec.items||[]).forEach(function(item){
          if(item.code==='sga_social_ins')return;
          if(item.g){(item.subs||[]).forEach(function(sub){SGA_IDS.add(sub.id);if(item.code==='sga_salary')SALARY_IDS.add(sub.id);});}
          else{SGA_IDS.add(item.id);}
        });
        ['s4','s11','s12','s13','s14'].forEach(function(id){SGA_IDS.add(id);});
      }
      if(cgSec){
        COGS_IDS.clear();
        (cgSec.items||[]).forEach(function(item){
          if(item.code==='cogs_insurance')return;
          if(item.g){(item.subs||[]).forEach(function(sub){COGS_IDS.add(sub.id);});}
          else{COGS_IDS.add(item.id);}
        });
        COGS_IDS.add('c7');
      }
      if(rgSec){REPAY_IDS.clear();(rgSec.items||[]).forEach(function(i){REPAY_IDS.add(i.id);});}
    }catch(e){}}
    cmRaws.forEach(function(raw,i){if(!raw)return;try{const d=JSON.parse(raw);let sal=0;Object.entries(d).forEach(function([id,amt]){const a=Number(amt)||0;if(a<=0)return;if(SGA_IDS.has(id))D[MS[i]].sga+=a;if(SALARY_IDS.has(id))sal+=a;if(COGS_IDS.has(id))D[MS[i]].cogs+=a;if(REPAY_IDS.has(id))D[MS[i]].repay+=a;});D[MS[i]].sga+=Math.round(sal*0.15);}catch(e){}});
  });
  // ★ コスト内訳ミラーリング（NHA+SPK両方の cm_ci_totals が揃っていれば上書き）
  const _cmMirroredT=applyCMTotals(['nha','spk'],y,D);
  MS.forEach(m=>{D[m].manualExtra=(manualData.items||[]).reduce((s,it)=>s+(it.values&&it.values[m]||0),0);D[m].sub2=D[m].base+D[m].opt-D[m].disc+D[m].extra;D[m].plRev=D[m].sub2+D[m].manualExtra;D[m].totalIn=D[m].plRev+D[m].cashin;D[m].sgaTotal=D[m].sga+D[m].acctActual;D[m].totalCost=D[m].sgaTotal+D[m].cogs;D[m].operatingProfit=D[m].plRev-D[m].totalCost;D[m].cfNet=D[m].operatingProfit+D[m].cashin-D[m].repay;});
  window._monthlyD=D;
  if(mode==='hikaku'){renderHikaku(D);}else{render(D);}
  document.getElementById('status').textContent=_cmMirroredT?`✅ ${y}年 那覇＋札幌 合算（コスト内訳と一致）`:`⚠️ ${y}年 那覇＋札幌 合算（コスト内訳未開封→独自計算。両店のcostmatrixを先に開いてください）`;
}

function render(D){
  const rows=theme==='cf'?[
    {type:'sh',label:'◆ CF収支',bg:'#f0fdf4',color:'#15803d'},
    {type:'in',label:'現金入金',key:'cashin'},
    {type:'cm',label:'🏦 返済合計',key:'repay',bg:'#f5f3ff',tc:'#6d28d9'},
    {type:'sh',label:'◆ CF残高',bg:'#0f172a',color:'#94a3b8'},
    {type:'profit',label:'💰 CF残高（営業利益＋入金－返済）',key:'cfNet'},
  ]:[
    {type:'sub2',label:'売上（小計）',cls:'row-sub2'},
    {type:'manual',label:'✍️ その他売上（手動）'},
    {type:'sub',label:'PL売上合計',key:'plRev',cls:'row-subtotal'},
    {type:'sh',label:'◆ コスト',bg:'#fef2f2',color:'#b91c1c'},
    {type:'cm',label:'📋 販管費',key:'sgaTotal',bg:'#fff5f5',tc:'#991b1b'},
    {type:'cm',label:'📦 売上原価',key:'cogs',bg:'#fffbeb',tc:'#92400e'},
    {type:'total',label:'🔴 PL支出合計',key:'totalCost',cls:'row-balance'},
    {type:'profit',label:'💹 PL営業利益',key:'operatingProfit'},
  ];

  // 年計
  const ann={};
  ['base','opt','disc','extra','sub2','manualExtra','cashin','sga','sgaTotal','cogs','acctActual','plRev','totalIn','totalCost','operatingProfit','repay','cfNet'].forEach(k=>{
    ann[k]=MS.reduce((s,m)=>s+(D[m][k]||0),0);
  });

  let h=`<div class="tbl-wrap"><table>`;
  h+=`<thead><tr><th class="ic">項目</th>`;
  MS.forEach(m=>h+=`<th>${parseInt(m)}月</th>`);
  h+=`<th style="background:#1e293b;color:#fff;border-right:none;position:sticky;top:96px;z-index:10">年計</th></tr></thead><tbody>`;

  rows.forEach(row=>{
    if(row.type==='theme'){
      h+=`<tr><td colspan="${MS.length+2}" style="padding:14px 12px;font-size:14px;font-weight:900;color:#fff;background:#1e293b;border-top:4px solid #2563eb;letter-spacing:.08em">${row.label}</td></tr>`;return;
    }
    if(row.type==='sh'){
      h+=`<tr class="sec-hdr"><td colspan="${MS.length+2}" style="background:${row.bg};color:${row.color}">${row.label}</td></tr>`;
      return;
    }
    if(row.type==='manual'){
      const items=manualData.items||[];
      const ro=store==='total';
      // ▼ セクションヘッダー
      h+=`<tr style="background:#f5f3ff"><td class="ic" colspan="${MS.length+2}" style="background:#f5f3ff;color:#6d28d9;font-weight:800;font-size:11px;letter-spacing:.05em;padding:6px 10px">✍️ その他売上（手動）${!ro?`<button onclick="addManualItem()" style="margin-left:10px;padding:2px 8px;font-size:10px;background:#7c3aed;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:700">＋ 小項目追加</button>`:''}</td></tr>`;
      // ▼ 小項目なし
      if(items.length===0){
        h+=`<tr class="row-manual"><td class="ic" colspan="${MS.length+2}" style="text-align:center;color:#a78bfa;font-size:11px;padding:10px">${ro?'小項目が登録されていません':'↑「＋ 小項目追加」で追加してください'}</td></tr>`;
      }
      // ▼ 各小項目
      items.forEach(it=>{
        let rowTot=0;
        h+=`<tr class="row-manual"><td class="ic" style="padding-left:18px">`;
        if(!ro){
          h+=`<span ondblclick="renameManualItem('${it.id}')" title="ダブルクリックで名前変更" style="color:#7c3aed;font-weight:600;cursor:pointer">${it.name}</span>`;
          h+=`<button onclick="deleteManualItem('${it.id}')" style="margin-left:5px;padding:1px 4px;font-size:9px;background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:3px;cursor:pointer">✕</button>`;
        }else{
          h+=`<span style="color:#7c3aed;font-weight:600">${it.name}${it._s?' ('+it._s+')':''}</span>`;
        }
        h+=`</td>`;
        MS.forEach(m=>{
          const v=(it.values&&it.values[m])||0; rowTot+=v;
          h+=`<td style="padding:2px 4px;background:#faf5ff"><input class="mi" type="number" value="${v||''}" placeholder="0" ${ro?'readonly':''} onchange="saveManualExtra('${m}',this.value,'${it.id}')"/></td>`;
        });
        h+=`<td style="background:#faf5ff;color:#7c3aed;font-weight:700;text-align:right">${rowTot>0?'¥'+rowTot.toLocaleString():''}</td></tr>`;
      });
      // ▼ 小計行
      if(items.length>0){
        let grandTot=0;
        h+=`<tr style="background:#ede9fe"><td class="ic" style="background:#ede9fe;color:#6d28d9;font-weight:800;font-size:11px;padding-left:10px">小計</td>`;
        MS.forEach(m=>{
          const t=items.reduce((s,it)=>s+(it.values&&it.values[m]||0),0); grandTot+=t;
          h+=`<td style="background:#ede9fe;color:#7c3aed;font-weight:700;text-align:right">${t>0?'¥'+t.toLocaleString():''}</td>`;
        });
        h+=`<td style="background:#ede9fe;color:#6d28d9;font-weight:900;text-align:right">${grandTot>0?'¥'+grandTot.toLocaleString():''}</td></tr>`;
      }
      return;
    }
    // ★ 小計（予約売上＋予約外）= 基本+付帯-割引+予約外
    if(row.type==='sub2'){
      const annSub2=(ann.base||0)+(ann.opt||0)-(ann.disc||0)+(ann.extra||0);
      h+=`<tr class="${row.cls||'row-sub2'}"><td class="ic" style="padding-left:14px;font-size:11px">${row.label}</td>`;
      MS.forEach(m=>{const v=(D[m].base||0)+(D[m].opt||0)-(D[m].disc||0)+(D[m].extra||0);h+=`<td>${v>0?'¥'+v.toLocaleString():'—'}</td>`;});
      h+=`<td>${annSub2>0?'¥'+annSub2.toLocaleString():'—'}</td></tr>`;
      return;
    }
    const cls=row.cls||'';
    const isNeg=row.neg;
    const isCm=row.type==='cm';
    const isTotal=row.type==='total';
    const isProfit=row.type==='profit';
    const trStyle=isCm?` style="background:${row.bg}"`:'';
    const tdStyle=isCm?` style="color:${row.tc};font-weight:700"`:'';
    h+=`<tr class="${cls}"${trStyle}><td class="ic"${tdStyle}>${row.label}</td>`;
    MS.forEach(m=>{
      const v=D[m][row.key]||0;
      let disp='';
      if(v!==0){
        if(row.type==='bal'||isTotal){disp=v>0?'¥'+v.toLocaleString():'';}
        else if(isProfit){disp=(v>0?'+¥':'-¥')+Math.abs(v).toLocaleString();}
        else if(isNeg){disp=v>0?'-¥'+v.toLocaleString():'';}
        else{disp=v>0?'¥'+v.toLocaleString():'';}
      }
      let style='';
      if(row.type==='bal'){style=`style="color:${v>=0?'#86efac':'#fca5a5'}"`;}
      else if(isTotal){style=`style="color:#fff;font-weight:900"`;}
      else if(isCm){style=`style="background:${row.bg};color:${v>0?row.tc:'#94a3b8'};font-weight:${v>0?700:400}"`;}
      else if(isProfit){style=`style="background:${v>0?'#dcfce7':v<0?'#fee2e2':'#f8fafc'};color:${v>0?'#15803d':v<0?'#b91c1c':'#94a3b8'};font-weight:800;text-align:right"`;}
      h+=`<td ${style}>${disp}</td>`;
    });
    // 年計
    const av=ann[row.key]||0;
    let adisp='';
    if(av!==0){
      if(row.type==='bal'||isTotal){adisp=av>0?'¥'+av.toLocaleString():'';}
      else if(isProfit){adisp=(av>0?'+¥':'-¥')+Math.abs(av).toLocaleString();}
      else if(isNeg){adisp=av>0?'-¥'+av.toLocaleString():'';}
      else{adisp=av>0?'¥'+av.toLocaleString():'';}
    }
    let astyle='';
    if(row.type==='bal'){astyle=`style="color:${av>=0?'#86efac':'#fca5a5'}"`;}
    else if(isTotal){astyle=`style="color:#fff;font-weight:900"`;}
    else if(isCm){astyle=`style="background:${row.bg};color:${av>0?row.tc:'#94a3b8'};font-weight:${av>0?700:400}"`;}
    else if(isProfit){astyle=`style="background:${av>0?'#dcfce7':av<0?'#fee2e2':'#f8fafc'};color:${av>0?'#15803d':av<0?'#b91c1c':'#94a3b8'};font-weight:900;text-align:right"`;}
    h+=`<td ${astyle}>${adisp}</td></tr>`;
  });
  h+=`</tbody></table></div>`;
  document.getElementById('ct').innerHTML=h;
}

  (accts||[]).forEach(r=>{const m=(r.date||'').slice(5,7);if(!D[m])return;const a=r.amount||0,cat=r.category||'';if(r.type==='extra_sales')D[m].extra+=a;else if(r.type==='cash_in')D[m].cashin+=a;else if(r.type==='cash_out'||r.type==='card_pay'){if(!/修理|車検|点検|整備/.test(cat))D[m].acctActual+=a;}});
  (logsD||[]).forEach(r=>{const m=(r.date||'').slice(5,7);if(!D[m])return;D[m].cogs+=(Number(r.cost)||0);});
  const vIns=(vehRaw||[]).reduce((s,v)=>s+(v.insurance_annual||0),0);

  const SGA_IDS=new Set(['s2a','s2b','s2c','s2d','s2e','s2f','s2g','s2h','s3a','s3b','s3c','s3d','s4','s4a','s11','s11a','s12','s12a','s13','s13a','s14','s14a']);

  const BD=computeBudgetD();
  const KEYS=theme==='cf'?[

          h+=`<td style="background:#faf5ff;text-align:right;color:#059669;font-weight:${j!==0?600:400}">${f(j)}</td>`;

        });

        h+=`<td style="background:#f3e8ff;text-align:right;font-weight:700;${aps}">${ap}</td>`;
        h+=`</tr>`;
      });

      const bTotal=MS.reduce((s,m)=>s+bItems.reduce((s2,i)=>s2+((i.values&&i.values[m])||0),0),0);
      const jTotal=MS.reduce((s,m)=>s+jItems.reduce((s2,i)=>s2+((i.values&&i.values[m])||0),0),0);
      const totRows=MS.map(m=>({b:bItems.reduce((s,i)=>s+((i.values&&i.values[m])||0),0),j:jItems.reduce((s,i)=>s+((i.values&&i.values[m])||0),0)}));

const STORE_LABEL='HANDYMAN_那覇店';

// === CSV出力（月次収支表） ===
function exportCSV() {
  const tbl = document.querySelector('#ct table');
  if (!tbl) { alert('データが読み込まれていません'); return; }
  let csv = '\uFEFF';
  tbl.querySelectorAll('tr').forEach(tr => {
    const cells = [];
    tr.querySelectorAll('th,td').forEach(td => {
      let v = td.innerText.replace(/\r?\n/g, ' ').trim();
      if (v.includes(',') || v.includes('"') || v.includes('\n')) {
        v = '"' + v.replace(/"/g, '""') + '"';
      }
      cells.push(v);
    });
    csv += cells.join(',') + '\n';
  });
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = STORE_LABEL + '_月次収支_' + year + '_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function _ciFetchResv(storeKey,y){
  const tbl=storeKey==='nha'?'nha_reservations':'reservations';
  const retCol=storeKey==='nha'?'end_date':'return_date';
  const selCols=storeKey==='nha'?'id,ota,price,base_price,option_price,discount,created_at,start_date,end_date,status':'id,ota,price,base_price,option_price,discount,created_at,lend_date,return_date,status';
  const yS=(parseInt(y)-1)+'-10-01',yE=(parseInt(y)+1)+'-03-31';
  try{return await sbq(tbl,`select=${selCols}&${retCol}=gte.${yS}&${retCol}=lte.${yE}&status=neq.cancelled`);}
  catch(e){console.error('[CF]',storeKey,e);return[];}
}
function _ciCalc(resv,storeKey,y){const cf={};for(let m=1;m<=12;m++){const ym=y+'-'+String(m).padStart(2,'0');cf[ym]={};CI_ORDER.forEach(ota=>{cf[ym][ota]=0;});}resv.forEach(r=>{const cashYM=_ciGetCashYM(r,storeKey);if(!cashYM||!cashYM.startsWith(y+'-'))return;if(!cf[cashYM])return;const ota=r.ota||'HP';const key=CI_ORDER.includes(ota)?ota:'HP';// PL計算と同一の売上式: bp/op が設定済みなら bp+op-disc、旧形式は price をそのまま使用
         const bp=+(r.base_price)||0,op=+(r.option_price)||0,disc=+(r.discount)||0;
         const revenue=(bp>0||op>0)?Math.max(0,bp+op-disc):+(r.price)||0;
         cf[cashYM][key]+=revenue;});return cf;}

async function _ciLoadCostAndBalance(y,YM12,mNet,yearGrandNet){
  const nowYM_=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');
  try{
    const MS=['01','02','03','04','05','06','07','08','09','10','11','12'];
    const s=store==='total'?'spk':store;
    // ── コスト内訳が保存した計算済み月別合計をそのまま読む ──
    const sum={sga:{},acctActual:{},cogs:{},repay:{}};
    YM12.forEach(ym=>{sum.sga[ym]=0;sum.acctActual[ym]=0;sum.cogs[ym]=0;sum.repay[ym]=0;});
    const lsKey=`cm_ci_totals_${s}_${y}`;
    const lsRaw=localStorage.getItem(lsKey);
    if(lsRaw){
      const tot=JSON.parse(lsRaw);
      MS.forEach((m,i)=>{
        const ym=y+'-'+m;
        if(sum.sga[ym]!==undefined){sum.sga[ym]=tot.sg[i]||0;sum.acctActual[ym]=tot.ac[i]||0;sum.cogs[ym]=tot.cg[i]||0;sum.repay[ym]=tot.rg[i]||0;}
      });
    }
    // ── ブロック外で共通計算（初回・2回目以降とも実行） ──
    // 調整枠の読み込みと集計
    const adjD2=_ciAdjLoad(s,y);
    const adjByYm={};
    YM12.forEach(ym=>{adjByYm[ym]=(adjD2.d[0][ym]||0)+(adjD2.d[1][ym]||0)+(adjD2.d[2][ym]||0);});
    // 調整枠の年計セル更新
    for(let ai=0;ai<3;ai++){
      const yr=YM12.reduce((s,ym)=>s+((adjD2.d[ai]||{})[ym]||0),0);
      const el=document.getElementById('ci-adj-yr-'+ai);
      if(el){el.textContent=yr?'¥'+Math.round(yr).toLocaleString():'—';el.style.color=yr>=0?'#92400e':'#dc2626';}
    }
    // 調整込み入金合計
    const adjNet={};let adjGrand=0;
    YM12.forEach(ym=>{adjNet[ym]=(mNet[ym]||0)+adjByYm[ym];adjGrand+=adjNet[ym];});
    // 入金合計セル更新（調整込み）
    YM12.forEach(ym=>{
      const el=document.getElementById('ci-inc-'+ym);
      if(el){const v=adjNet[ym];el.textContent=v?'¥'+Math.round(v).toLocaleString():'—';}
    });
    const yrEl=document.getElementById('ci-inc-yr');
    if(yrEl)yrEl.textContent='¥'+Math.round(adjGrand).toLocaleString();
    // 総支出（常に sum から再計算）
    const totByYm={};YM12.forEach(ym=>{totByYm[ym]=(sum.sga[ym]||0)+(sum.acctActual[ym]||0)+(sum.cogs[ym]||0)+(sum.repay[ym]||0);});
    const yrTot=YM12.reduce((s,ym)=>s+(totByYm[ym]||0),0);
    // コスト行は初回のみDOM置換
    const balRow=document.getElementById('ci-bal-row');
    if(!balRow)return;
    if(!window._ciCostRendered){
      const incRow=document.getElementById('ci-cost-row');
      if(incRow){
        const sep2=`<tr style="height:2px;background:#f1f5f9"><td colspan="14" style="padding:0"></td></tr>`;
        const hrv=`<tr style="height:3px;background:#e2e8f0"><td colspan="14" style="padding:0"></td></tr>`;
        const mkCostTd=(v,cur,color)=>`<td style="padding:6px 5px;text-align:right;font-weight:${v?600:400};${cur?'background:#fef3c7;':''}color:${v?(color||'#374151'):'#64748b'}">${v?'¥'+Math.round(v).toLocaleString():'—'}</td>`;
        const mkCostYr=(v,bg,fc)=>`<td style="padding:7px 8px;text-align:right;font-weight:700;background:${bg};color:${v?fc:'#94a3b8'}">¥${Math.round(v).toLocaleString()}</td>`;
        const mkCostRow=(label,sub,dataMap,color,bg,bl)=>{const yr=YM12.reduce((s,ym)=>s+(dataMap[ym]||0),0);let r=`<td style="padding:7px 10px;font-weight:700;color:${color};background:${bg};border-left:4px solid ${bl};font-size:10.5px">${label}<br><span style="font-size:8pt;color:#94a3b8;font-weight:400">${sub}</span></td>`;YM12.forEach(ym=>{r+=mkCostTd(dataMap[ym]||0,ym===nowYM_,color);});r+=mkCostYr(yr,bg,color);return`<tr style="background:${bg}">${r}</tr>`;};
        let rows='';
        rows+=mkCostRow('📋 販管費①','手動入力',sum.sga,'#991b1b','#fff5f5','#f87171');
        rows+=sep2;rows+=mkCostRow('📊 販管費②','会計実績',sum.acctActual,'#1e40af','#eff6ff','#93c5fd');
        rows+=sep2;rows+=mkCostRow('📦 売上原価','リース/保険/修理等',sum.cogs,'#92400e','#fffbeb','#f59e0b');
        rows+=sep2;rows+=mkCostRow('🏦 返済','',sum.repay,'#059669','#f0fdf4','#86efac');
        rows+=hrv;
        let rInc=`<td style="padding:9px 10px;font-weight:900;color:#fff;font-size:11.5px;background:#1e40af">💵 入金合計</td>`;
        YM12.forEach(ym=>{const v=mNet[ym]||0;const cur=ym===nowYM_;const bg=cur?'#1d4ed8':v?'#2563eb':'#1e40af';rInc+=`<td style="padding:9px 5px;text-align:right;font-weight:${v?900:400};background:${bg};color:#fff;">${v?'¥'+Math.round(v).toLocaleString():'—'}</td>`;});
        rInc+=`<td style="padding:9px 8px;text-align:right;font-weight:900;color:#fff;background:#1e3a8a;font-size:12px">¥${Math.round(adjGrand).toLocaleString()}</td>`;
        rows+=`<tr>${rInc}</tr>`;
        let rTot=`<td style="padding:9px 10px;font-weight:900;color:#fff;font-size:11.5px;background:#7f1d1d">🔴 総支出合計</td>`;
        YM12.forEach(ym=>{const v=totByYm[ym]||0;rTot+=`<td style="padding:9px 5px;text-align:right;font-weight:${v?900:400};background:${ym===nowYM_?'#991b1b':'#7f1d1d'};color:#fff">${v?'¥'+Math.round(v).toLocaleString():'—'}</td>`;});
        rTot+=`<td style="padding:9px 8px;text-align:right;font-weight:900;color:#fff;background:#450a0a;font-size:12px">¥${Math.round(yrTot).toLocaleString()}</td>`;
        rows+=`<tr>${rTot}</tr>`;
        incRow.outerHTML=rows;
        window._ciCostRendered=true;
      }
    }
    // 残高（調整込み入金 − 総支出）
    const yrBal=adjGrand-yrTot;const ybc=yrBal>=0?'#34d399':'#f87171';
    let rBal=`<td style="padding:11px 10px;font-weight:900;color:#fbbf24;font-size:13px;border-left:4px solid #fbbf24;background:#0f172a">💰 残高（入金 − 総支出）</td>`;
    YM12.forEach(ym=>{const bal=adjNet[ym]-(totByYm[ym]||0);const bc=bal>=0?'#34d399':'#f87171';rBal+=`<td style="padding:11px 5px;text-align:right;font-weight:900;background:${ym===nowYM_?'#1d4ed8':'#0f172a'};color:${bal?bc:'#94a3b8'};font-size:12px">¥${Math.round(bal).toLocaleString()}</td>`;});
    rBal+=`<td style="padding:11px 8px;text-align:right;font-weight:900;color:${ybc};background:#000;font-size:13px">¥${Math.round(yrBal).toLocaleString()}</td>`;
    balRow.innerHTML=rBal;
    // 月初残高・期末残高を計算（累積残高）
    const ob=_ciObLoad(s,y);let prev=ob;
    YM12.forEach(ym=>{
      const opening=prev;
      const closing=opening+adjNet[ym]-(totByYm[ym]||0);
      prev=closing;
      const obEl=document.getElementById('ci-ob-'+ym);
      if(obEl){obEl.textContent=opening?'¥'+Math.round(opening).toLocaleString():'¥0';obEl.style.color=opening>=0?'#059669':'#dc2626';obEl.style.fontWeight='700';}
      const cbEl=document.getElementById('ci-cb-'+ym);
      if(cbEl){cbEl.textContent='¥'+Math.round(closing).toLocaleString();cbEl.style.color=closing>=0?'#6ee7b7':'#f87171';cbEl.style.fontWeight='900';}
    });
    const cbYrEl=document.getElementById('ci-cb-yr');
    if(cbYrEl){cbYrEl.textContent='¥'+Math.round(prev).toLocaleString();cbYrEl.style.color=prev>=0?'#6ee7b7':'#f87171';}
  }catch(e){console.error('[CI cost]',e);const r=document.getElementById('ci-cost-row');if(r)r.innerHTML=`<td colspan="14" style="padding:8px;color:#dc2626">コスト取得エラー: ${e.message}</td>`;}
}

</script>
