<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>沖縄クイズ | HANDYMAN 地域クイズ</title>
<style>
  :root{
    --blue:#2563eb; --blue-d:#1d4ed8; --ok:#16a34a; --ng:#ef4444;
    --bg:#f0f5ff; --card:#ffffff; --ink:#0f1f45; --sub:#64748b;
    --gold:#f5b301;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:linear-gradient(160deg,#e8f0ff,#f6faff);
    color:var(--ink); min-height:100vh;
    display:flex; justify-content:center;
  }
  .app{width:100%; max-width:440px; min-height:100vh; padding:16px; display:flex; flex-direction:column;}
  .hidden{display:none!important;}

  /* ---- 共通カード ---- */
  .card{background:var(--card); border-radius:22px; box-shadow:0 8px 28px rgba(30,60,120,.10); padding:22px; }

  /* ---- TOP ---- */
  .hero{
    position:relative; border-radius:22px; overflow:hidden; height:190px;
    background:linear-gradient(135deg,#0ea5e9,#2563eb 55%,#1e3a8a);
    display:flex; flex-direction:column; justify-content:flex-end; padding:18px; color:#fff;
    box-shadow:0 8px 28px rgba(30,60,120,.18);
  }
  .hero .waves{position:absolute; inset:0; opacity:.35; font-size:0; background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.5) 0 6px, transparent 7px),
    radial-gradient(circle at 70% 20%, rgba(255,255,255,.35) 0 10px, transparent 11px),
    radial-gradient(circle at 85% 60%, rgba(255,255,255,.4) 0 7px, transparent 8px);}
  .hero .emoji{position:absolute; top:14px; right:18px; font-size:54px; filter:drop-shadow(0 4px 8px rgba(0,0,0,.2));}
  .hero h1{margin:0; font-size:30px; font-weight:800; letter-spacing:.02em;}
  .hero p{margin:4px 0 0; font-size:13px; opacity:.92;}
  .meta{display:flex; gap:8px; margin:16px 0; flex-wrap:wrap;}
  .chip{background:#eef3ff; color:var(--blue-d); font-weight:700; font-size:13px; padding:8px 12px; border-radius:12px;}
  .chip.best{background:#fff7e0; color:#b7791f;}
  .stars{color:var(--gold); letter-spacing:2px;}
  .lead{color:var(--sub); font-size:13.5px; line-height:1.7; margin:2px 0 18px;}

  .btn{
    width:100%; border:none; border-radius:16px; padding:17px; font-size:17px; font-weight:800;
    background:var(--blue); color:#fff; cursor:pointer; box-shadow:0 6px 16px rgba(37,99,235,.32);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn.sub{background:#eef3ff; color:var(--blue-d); box-shadow:none;}
  .btn.ghost{background:transparent; color:var(--sub); box-shadow:none; font-weight:700;}

  /* ---- 問題 ---- */
  .topbar{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .qno{font-weight:800; font-size:15px; color:var(--blue-d); white-space:nowrap;}
  .bar{flex:1; height:9px; background:#e2e8f0; border-radius:99px; overflow:hidden;}
  .bar > i{display:block; height:100%; width:0; background:linear-gradient(90deg,#38bdf8,#2563eb); border-radius:99px; transition:width .3s ease;}
  .qwrap{animation:pop .3s ease;}
  @keyframes pop{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:none;}}
  .qtext{font-size:20px; font-weight:800; line-height:1.55; margin:6px 0 20px;}
  .choices{display:flex; flex-direction:column; gap:11px;}
  .choice{
    text-align:left; background:#fff; border:2px solid #e2e8f0; border-radius:15px; padding:15px 16px;
    font-size:16px; font-weight:600; color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:11px;
    transition:transform .1s, border-color .15s, background .15s;
  }
  .choice:active{transform:scale(.98);}
  .choice .mk{width:26px; height:26px; border-radius:99px; border:2px solid #cbd5e1; flex:none; display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff;}
  .choice.correct{border-color:var(--ok); background:#ecfdf3;}
  .choice.correct .mk{background:var(--ok); border-color:var(--ok);}
  .choice.wrong{border-color:var(--ng); background:#fef2f2;}
  .choice.wrong .mk{background:var(--ng); border-color:var(--ng);}
  .choice.dim{opacity:.45;}
  .choice[disabled]{cursor:default;}

  /* ---- フィードバック ---- */
  .fb{margin-top:16px; border-radius:16px; padding:16px; animation:pop .25s ease;}
  .fb.ok{background:#ecfdf3; border:1.5px solid #86efac;}
  .fb.ng{background:#fef2f2; border:1.5px solid #fca5a5;}
  .fb .h{font-size:18px; font-weight:800; margin-bottom:6px;}
  .fb.ok .h{color:var(--ok);} .fb.ng .h{color:var(--ng);}
  .fb .exp{font-size:13.5px; line-height:1.65; color:#334155;}
  .fb .ans{font-weight:800;}

  /* ---- 結果 ---- */
  .result{text-align:center;}
  .rankcircle{
    width:150px; height:150px; margin:6px auto 6px; border-radius:99px;
    background:conic-gradient(var(--gold) var(--p,80%), #e2e8f0 0);
    display:flex; align-items:center; justify-content:center;
  }
  .rankcircle .in{width:120px; height:120px; border-radius:99px; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .rankcircle .rk{font-size:48px; font-weight:900; color:var(--gold); line-height:1;}
  .rankcircle .rl{font-size:11px; color:var(--sub); font-weight:700; margin-top:2px;}
  .score{font-size:34px; font-weight:900; margin:8px 0 2px;}
  .score small{font-size:16px; color:var(--sub); font-weight:700;}
  .rate{color:var(--sub); font-weight:700; margin-bottom:4px;}
  .badge{display:inline-flex; align-items:center; gap:8px; background:#fff7e0; color:#b7791f; font-weight:800; padding:10px 16px; border-radius:14px; margin:12px 0 4px; font-size:14px;}
  .foot{margin-top:20px; text-align:center; color:#9aa7bd; font-size:11px;}
  .stack{display:flex; flex-direction:column; gap:10px; margin-top:20px;}
</style>
</head>
<body>
<div class="app">

  <!-- ===== TOP ===== -->
  <section id="scr-top">
    <div class="hero">
      <div class="waves"></div>
      <div class="emoji">🌺</div>
      <h1>沖縄クイズ</h1>
      <p>1分で沖縄を知る。旅がもっと楽しくなる。</p>
    </div>
    <div class="meta">
      <span class="chip">全15問</span>
      <span class="chip">約1分</span>
      <span class="chip"><span class="stars">★★★☆☆</span></span>
      <span class="chip best" id="bestChip" style="display:none">🏆 ベスト <b id="bestVal">-</b></span>
    </div>
    <p class="lead">観光・グルメ・ドライブ・絶景・文化…沖縄の魅力を4択で楽しく学べる会員コンテンツ。<br>スキマ時間にサクッと挑戦！</p>
    <button class="btn" onclick="startQuiz()">クイズを始める</button>
  </section>

  <!-- ===== 問題 ===== -->
  <section id="scr-quiz" class="hidden">
    <div class="topbar">
      <span class="qno" id="qno">Q1 / 15</span>
      <span class="bar"><i id="barFill"></i></span>
    </div>
    <div class="card">
      <div class="qwrap" id="qwrap"></div>
    </div>
  </section>

  <!-- ===== 結果 ===== -->
  <section id="scr-result" class="hidden">
    <div class="card result">
      <div class="rankcircle" id="rankCircle">
        <div class="in">
          <div class="rk" id="rankLetter">S</div>
          <div class="rl">RANK</div>
        </div>
      </div>
      <div class="score"><span id="scoreNum">0</span><small> / 15 正解</small></div>
      <div class="rate">正答率 <b id="rateVal">0%</b></div>
      <div class="badge" id="badgeBox">🏅 沖縄ビギナー</div>
      <div class="stack">
        <button class="btn" onclick="startQuiz()">もう一度挑戦</button>
        <button class="btn sub" onclick="goTop()">TOPへ戻る</button>
      </div>
    </div>
    <div class="foot">HANDYMAN 地域クイズ ・ モック版（v0.1）</div>
  </section>

</div>

<script>
/* ===== 沖縄15問（ダミー・仮） ===== */
const QUIZ = [
  {q:"沖縄県で一番長い橋は？", c:["古宇利大橋","伊良部大橋","海中道路","瀬底大橋"], a:1, e:"伊良部大橋は全長3,540m。無料で渡れる橋として日本最長級です。"},
  {q:"沖縄の県庁所在地は？", c:["名護市","浦添市","那覇市","沖縄市"], a:2, e:"那覇市。国際通りや首里城がある沖縄の中心都市です。"},
  {q:"「ちんすこう」は何のお菓子？", c:["揚げ菓子","焼き菓子","氷菓子","蒸し菓子"], a:1, e:"小麦粉・砂糖・ラードを使った琉球王朝時代からの焼き菓子です。"},
  {q:"沖縄そばの主な麺の原料は？", c:["そば粉","米粉","小麦粉","とうもろこし粉"], a:2, e:"名前は『そば』でも原料は小麦粉100%。だしはかつお＆豚が定番。"},
  {q:"沖縄美ら海水族館で人気の巨大な魚は？", c:["ジンベエザメ","ホホジロザメ","マンボウ","シャチ"], a:0, e:"ジンベエザメ。巨大水槽『黒潮の海』で複数飼育されています。"},
  {q:"沖縄の伝統的な守り神といえば？", c:["こま犬","シーサー","招き猫","龍"], a:1, e:"シーサー。屋根や門に置いて魔除け（マジムン返し）にします。"},
  {q:"沖縄本島から橋でつながる、ハートロックで有名な島は？", c:["竹富島","古宇利島","渡嘉敷島","久米島"], a:1, e:"古宇利島。ハート型の岩『ハートロック』が恋の島として人気。"},
  {q:"『ゴーヤー』は本土では何と呼ばれる？", c:["へちま","にがうり","冬瓜","おくら"], a:1, e:"にがうり。ゴーヤーチャンプルーが定番料理です。"},
  {q:"沖縄の方言で「めんそーれ」の意味は？", c:["さようなら","ありがとう","いらっしゃい","乾杯"], a:2, e:"『いらっしゃい／ようこそ』の意味。観光地でよく見かけます。"},
  {q:"世界遺産にも登録された、琉球王国の王城は？", c:["今帰仁城","首里城","中城城","勝連城"], a:1, e:"首里城。琉球王国の政治・文化の中心でした。"},
  {q:"沖縄本島で運転するとき、レンタカーで特に注意すべきなのは？", c:["高速道路が無い","右側通行","バス専用レーン時間帯","雪道"], a:2, e:"那覇市内は朝夕にバス専用レーン規制あり。時間帯の通行に注意。"},
  {q:"泡盛の主な原料は？", c:["米（タイ米）","さとうきび","芋","麦"], a:0, e:"タイ米と黒麹菌で造る沖縄の蒸留酒。古酒（クース）は熟成もの。"},
  {q:"沖縄で青い海が見られるビーチ、次のうち石垣島にあるのは？", c:["万座ビーチ","川平湾","エメラルドビーチ","波の上ビーチ"], a:1, e:"川平湾（かびらわん）。石垣島を代表するミシュラン三つ星の絶景。"},
  {q:"沖縄の夏によく食べる、氷にあずきや白玉をのせたものは？", c:["ぜんざい","かき氷","アイスクリン","サーターアンダギー"], a:0, e:"沖縄ぜんざいは『冷たい氷ぜんざい』が定番。金時豆と白玉入り。"},
  {q:"沖縄本島北部の、亜熱帯の森が広がるエリアの通称は？", c:["やんばる","ちゅら","うちなー","なんくる"], a:0, e:"やんばる（山原）。世界自然遺産に登録された豊かな森が広がります。"},
];

const BEST_KEY = "hdm_quiz_okinawa_best";
let idx=0, correct=0, locked=false;

/* ベストスコア表示 */
(function initBest(){
  const b = localStorage.getItem(BEST_KEY);
  if(b!==null){ document.getElementById('bestChip').style.display='inline-flex'; document.getElementById('bestVal').textContent = b+"/15"; }
})();

function show(id){ ['scr-top','scr-quiz','scr-result'].forEach(s=>document.getElementById(s).classList.toggle('hidden', s!==id)); window.scrollTo(0,0);}
function goTop(){ show('scr-top'); }

function startQuiz(){ idx=0; correct=0; locked=false; show('scr-quiz'); render(); }

function render(){
  locked=false;
  const item = QUIZ[idx];
  document.getElementById('qno').textContent = `Q${idx+1} / ${QUIZ.length}`;
  document.getElementById('barFill').style.width = ((idx)/QUIZ.length*100)+"%";
  let html = `<div class="qtext">${item.q}</div><div class="choices">`;
  item.c.forEach((ch,i)=>{
    html += `<button class="choice" id="ch${i}" onclick="answer(${i})"><span class="mk"></span><span>${ch}</span></button>`;
  });
  html += `</div><div id="fbSlot"></div>`;
  const w = document.getElementById('qwrap');
  w.innerHTML = html;
  w.style.animation='none'; void w.offsetWidth; w.style.animation='pop .3s ease';
}

function answer(i){
  if(locked) return; locked=true;
  const item = QUIZ[idx];
  const isOk = (i===item.a);
  if(isOk) correct++;
  // 選択肢の色付け
  item.c.forEach((_,k)=>{
    const el=document.getElementById('ch'+k);
    el.setAttribute('disabled','');
    if(k===item.a) el.classList.add('correct');
    else if(k===i) el.classList.add('wrong');
    else el.classList.add('dim');
    el.querySelector('.mk').textContent = (k===item.a)?'✓':(k===i?'✕':'');
  });
  document.getElementById('barFill').style.width = ((idx+1)/QUIZ.length*100)+"%";

  if(isOk){
    // 正解＝テンポよく自動で次へ（約0.8秒）
    const slot=document.getElementById('fbSlot');
    slot.innerHTML = `<div class="fb ok"><div class="h">◯ 正解！</div></div>`;
    setTimeout(next, 800);
  }else{
    // 不正解＝解説を見せて手動で次へ
    const slot=document.getElementById('fbSlot');
    slot.innerHTML = `<div class="fb ng">
        <div class="h">✕ 残念…</div>
        <div class="exp"><span class="ans">正解：${item.c[item.a]}</span><br>${item.e}</div>
      </div>
      <button class="btn" style="margin-top:14px" onclick="next()">次へ</button>`;
  }
}

function next(){
  idx++;
  if(idx>=QUIZ.length) finish();
  else render();
}

function rankOf(n){
  if(n>=15) return {r:"SS", label:"パーフェクト！", badge:"👑 沖縄マスター"};
  if(n>=13) return {r:"S",  label:"沖縄ツウ！",     badge:"🏆 沖縄エキスパート"};
  if(n>=11) return {r:"A",  label:"かなり詳しい",   badge:"🥇 沖縄好き"};
  if(n>=8)  return {r:"B",  label:"いい感じ",       badge:"🥈 沖縄トラベラー"};
  if(n>=5)  return {r:"C",  label:"これから！",     badge:"🥉 沖縄ビギナー"};
  return          {r:"D",  label:"また挑戦しよう", badge:"🌱 沖縄デビュー"};
}

function finish(){
  const rate = Math.round(correct/QUIZ.length*100);
  const rk = rankOf(correct);
  document.getElementById('scoreNum').textContent = correct;
  document.getElementById('rateVal').textContent = rate+"%";
  document.getElementById('rankLetter').textContent = rk.r;
  document.getElementById('badgeBox').textContent = rk.badge;
  const rc = document.getElementById('rankCircle');
  rc.style.setProperty('--p', rate+"%");
  // ベスト更新
  const prev = parseInt(localStorage.getItem(BEST_KEY)||"-1",10);
  if(correct>prev){ localStorage.setItem(BEST_KEY, correct); }
  document.getElementById('bestChip').style.display='inline-flex';
  document.getElementById('bestVal').textContent = Math.max(correct,prev>=0?prev:0)+"/15";
  show('scr-result');
}
</script>
</body>
</html>
