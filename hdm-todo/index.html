<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1e1f21" />
<title>HDM ToDo — 那覇空港店 業務管理</title>
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
<style>
:root{
  --bg:#f6f7f8; --panel:#ffffff; --rail:#1e1f21; --rail2:#2a2b2d; --railtx:#c7c9cc;
  --line:#e8eaed; --ink:#1b1c1d; --sub:#6b6f76; --mut:#9aa0a8;
  --accent:#4573d2; --accent-soft:#eaf0fb;
  --s-todo:#a3a9b3; --s-prog:#4573d2; --s-talk:#f59e0b; --s-done:#14a44d;
  --p-high:#e8384f; --p-mid:#f59e0b; --p-low:#6b7280;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
#root{min-height:100vh}
.app{display:flex;min-height:100vh}

/* ===== Desktop sidebar ===== */
.rail{width:248px;background:var(--rail);color:var(--railtx);flex-shrink:0;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.rail-brand{padding:18px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #34353799}
.rail-logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#4573d2,#7aa0ec);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px}
.rail-brand b{color:#fff;font-size:15px;letter-spacing:.2px;display:block}
.rail-brand span{font-size:11px;color:#8a8d92}
.rail-nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px}
.rail-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;
  color:var(--railtx);font-size:14px;font-weight:600;transition:.12s;width:100%;text-align:left}
.rail-item .ic{width:20px;text-align:center;font-size:16px;opacity:.92}
.rail-item:hover{background:#ffffff14;color:#fff}
.rail-item.on{background:#ffffff1f;color:#fff}
.rail-item .badge{margin-left:auto;background:#e8384f;color:#fff;font-size:11px;font-weight:700;
  min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.rail-foot{margin-top:auto;padding:14px;border-top:1px solid #34353799;font-size:11px;color:#7b7e83}
.rail-who{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rail-who select{background:#2f3032;color:#fff;border:1px solid #45464a;border-radius:8px;padding:6px 8px;font-size:13px;width:100%}

/* ===== Main ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:#fffffff2;backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px}
.topbar h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px}
.topbar .desc{font-size:12px;color:var(--sub);margin-top:1px}
.topbar .grow{flex:1}
.btn{border-radius:9px;padding:8px 13px;font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f3f4f6}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#3a63bd}
.btn.sm{padding:6px 10px;font-size:12px}
.content{padding:18px 20px 110px;max-width:1180px;width:100%;margin:0 auto}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:center;gap:9px;margin:22px 2px 11px}
.sec-h h2{font-size:14px;font-weight:800;margin:0;color:var(--ink);letter-spacing:.3px}
.sec-h .more{margin-left:auto}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{padding:15px 16px}
.kpi .lab{font-size:12px;color:var(--sub);font-weight:600}
.kpi .num{font-size:30px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
.kpi .sub2{font-size:11px;color:var(--mut);margin-top:2px}
.kpi.alert .num{color:var(--p-high)}
.kpi.warn .num{color:var(--s-talk)}

/* progress */
.bar{height:7px;border-radius:6px;background:#eceef1;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .3s}

/* task card */
.tcard{padding:14px 15px;display:flex;flex-direction:column;gap:9px;border-left:3px solid transparent}
.tcard + .tcard{margin-top:10px}
.tcard .row1{display:flex;align-items:flex-start;gap:10px}
.tcard .ttl{font-weight:700;font-size:15px;line-height:1.35;flex:1}
.tcard .ds{font-size:12.5px;color:var(--sub);margin-top:-2px}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip.who{background:#eef1f4;color:#475467}
.chip.due{background:#f2f4f7;color:#475467}
.chip.due.soon{background:#fff4e5;color:#b54708}
.chip.due.over{background:#fde8e8;color:#b42318}
.chip.st-todo{background:#eef0f3;color:#667085}
.chip.st-prog{background:#eaf0fb;color:#2f5fc0}
.chip.st-talk{background:#fff4e5;color:#b54708}
.chip.st-done{background:#e6f7ee;color:#0a7a3d}
.chip.kids{background:#eef0fb;color:#3a4a8a}
.dot{width:8px;height:8px;border-radius:3px;display:inline-block}
.area{font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;display:inline-flex;align-items:center;gap:6px;background:#f4f5f7;color:#475467}
.tcard .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tcard .acts{display:flex;flex-wrap:wrap;gap:7px}
.prog-wrap{display:flex;align-items:center;gap:10px}
.prog-wrap .pct{font-size:12px;font-weight:800;color:var(--sub);min-width:38px;text-align:right}

/* area tree */
.area-block{margin-bottom:14px;overflow:hidden}
.area-head{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer;border-left:4px solid transparent}
.area-head .ai{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0}
.area-head .an{font-weight:800;font-size:15px}
.area-head .acnt{font-size:11.5px;color:var(--sub);font-weight:700}
.area-head .aprog{margin-left:auto;display:flex;align-items:center;gap:9px;min-width:120px}
.area-head .aprog .bar{flex:1}
.area-head .aprog .pct{font-size:12px;font-weight:800;min-width:34px;text-align:right}
.area-head .chev{font-size:12px;color:var(--mut);transition:.15s;width:14px;text-align:center}
.area-head .chev.open{transform:rotate(90deg)}
.tnode{display:flex;align-items:center;gap:9px;padding:9px 12px;border-top:1px solid #f1f2f4}
.tnode:hover{background:#fafbfc}
.tnode .tw{flex:1;min-width:0}
.tnode .tt{font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px}
.tnode .tt .sd{width:8px;height:8px;border-radius:3px;flex-shrink:0}
.tnode .tmeta{display:flex;gap:6px;align-items:center;margin-top:4px}
.tnode .tprog{display:flex;align-items:center;gap:8px;width:160px;flex-shrink:0}
.tnode .tprog .bar{flex:1}
.tnode .tprog .pct{font-size:11px;font-weight:800;color:var(--sub);min-width:32px;text-align:right}
.tnode .tacts{display:flex;gap:6px;flex-shrink:0}
.tnode .exp{width:18px;text-align:center;font-size:11px;color:var(--mut);cursor:pointer;flex-shrink:0}
.tnode .exp.ph{visibility:hidden}
.iconbtn.mini{width:28px;height:28px;font-size:13px;border-radius:8px}
.add-top{display:flex;align-items:center;gap:6px;padding:9px 12px;border-top:1px dashed var(--line);color:var(--accent);font-weight:700;font-size:12.5px;width:100%;justify-content:flex-start}
.add-top:hover{background:#f7f9fe}

/* timeline */
.tl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius)}
.tl{min-width:760px;position:relative}
.tl-head{display:flex;position:sticky;top:0;background:#fff;z-index:2;border-bottom:1px solid var(--line)}
.tl-name-col{width:118px;flex-shrink:0;border-right:1px solid var(--line);background:#fff;position:sticky;left:0;z-index:3}
.tl-days{display:flex;flex:1}
.tl-day{flex:1;min-width:30px;text-align:center;padding:7px 0;font-size:11px;color:var(--sub);border-right:1px solid #f1f2f4}
.tl-day.we{background:#fafafb;color:#b42318}
.tl-day b{display:block;font-size:13px;color:var(--ink);font-weight:700}
.tl-row{display:flex;border-bottom:1px solid #f1f2f4;min-height:46px}
.tl-row .tl-name-col{display:flex;align-items:center;gap:7px;padding:8px 10px;font-size:12.5px;font-weight:700}
.tl-cnt{margin-left:auto;background:#eef1f4;color:#475467;font-size:10px;font-weight:800;border-radius:8px;padding:1px 6px;line-height:1.5}
.tl-grid{display:flex;flex:1;position:relative}
.tl-cell{flex:1;min-width:30px;border-right:1px solid #f5f6f7;cursor:crosshair}
.tl-cell.we{background:#fafafb}
.tl-cell.sel{background:#dbe6fb}
.tl-bars{position:absolute;inset:0;pointer-events:none}
.tl-bar{position:absolute;height:24px;border-radius:7px;display:flex;align-items:center;padding:0 9px;
  font-size:11.5px;font-weight:700;color:#fff;pointer-events:auto;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  box-shadow:0 1px 2px rgba(0,0,0,.18)}
.tl-bar .pf{position:absolute;left:0;top:0;bottom:0;background:#ffffff38;border-radius:7px}
.tl-hint{font-size:12px;color:var(--sub);padding:9px 14px;background:var(--accent-soft);border-radius:10px;margin-bottom:12px;display:flex;gap:8px;align-items:center}

/* dash */
.legend{display:flex;flex-direction:column;gap:7px}
.legend .li{display:flex;align-items:center;gap:8px;font-size:13px}
.legend .li b{margin-left:auto;font-weight:800}
.pbars{display:flex;flex-direction:column;gap:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.week .wd{text-align:center}
.week .wd .wn{font-size:11px;color:var(--sub);margin-bottom:5px}
.week .wd .wb{border-radius:9px;background:var(--accent-soft);color:var(--accent);font-weight:800;padding:11px 0;font-size:15px}
.week .wd.today .wb{background:var(--accent);color:#fff}
.week .wd .wb.z{background:#f1f2f4;color:#aeb4bd}
.focus-card{padding:13px 15px;display:flex;flex-direction:column;gap:9px}
.focus-card .fc-h{display:flex;align-items:center;gap:8px}
.focus-card .fc-h b{font-size:14px}

/* eval */
.eval-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.eval{padding:15px}
.eval-h{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.eval-h b{font-size:15px;display:block}
.eval-h .sub{font-size:11.5px;color:var(--sub)}
.eval-h .avatar{width:36px;height:36px;font-size:15px}
.grade{width:38px;height:38px;border-radius:11px;color:#fff;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.metric{margin-bottom:9px}
.metric.big .ml span{font-size:15px}
.metric .ml{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px}
.metric .ml span{color:var(--ink);font-weight:800}
.eval-pen{font-size:11.5px;color:#b42318;background:#fde8e8;border-radius:8px;padding:6px 9px;margin-top:6px;font-weight:700}
.eval-note{font-size:11px;color:var(--mut);margin-left:auto;font-weight:600}
.eval-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.estat{background:#f4f5f7;border-radius:9px;padding:6px 4px;font-size:10.5px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:1px}
.estat b{font-size:17px;color:var(--ink);line-height:1}
.estat.done b{color:var(--s-done)}
.estat.prog b{color:var(--s-prog)}
.estat.over b{color:var(--p-high)}
.bd{font-size:11px;color:var(--sub);background:#f9fafb;border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:2px 0 11px;line-height:1.75}
.bd .bdt{font-weight:800;color:var(--ink);font-size:11.5px;margin-bottom:2px}
.bd code{font-family:inherit;color:var(--ink);font-weight:700}
.bd .eq{color:var(--accent);font-weight:800}
.algo-box{font-size:12px;color:var(--sub);background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:13px 15px;line-height:1.75;margin-bottom:6px}
.algo-box b{color:var(--ink)}
.algo-box .formula{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin:8px 0;font-weight:700;color:var(--ink);font-size:12.5px}
.algo-box .gr{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.algo-box .gr span{padding:3px 9px;border-radius:7px;color:#fff;font-weight:800;font-size:11px}

/* logs */
.log{padding:13px 15px;border-left:3px solid var(--accent);display:flex;flex-direction:column;gap:3px}
.log .lh{font-size:12px;color:var(--sub);font-weight:700;display:flex;gap:8px;flex-wrap:wrap}
.log .lt{font-size:14px}
.timeline-feed{display:flex;flex-direction:column;gap:10px}

/* avatar */
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px}

/* forms / modal */
.scrim{position:fixed;inset:0;background:#101828a8;z-index:60;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:760px){.scrim{align-items:center}}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.2)}
@media(min-width:760px){.sheet{border-radius:18px}}
.sheet-h{position:sticky;top:0;background:#fff;padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;z-index:2}
.sheet-h b{font-size:16px;font-weight:800;flex:1}
.sheet-b{padding:16px 18px 22px;display:flex;flex-direction:column;gap:14px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink)}
.fld textarea{resize:vertical;min-height:64px}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:700;background:#fff;color:var(--sub)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg.st button.on.st-talk{background:var(--s-talk);border-color:var(--s-talk)}
.seg.st button.on.st-done{background:var(--s-done);border-color:var(--s-done)}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:17px;display:flex;align-items:center;justify-content:center}
.detail-log{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;background:#fafbfc}
.detail-log+.detail-log{margin-top:8px}
.parent-note{font-size:12px;background:#eef0fb;color:#3a4a8a;border-radius:9px;padding:8px 11px;font-weight:700;display:flex;gap:7px;align-items:center}

/* filters */
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;font-size:14px}
.filters input{flex:1;min-width:140px}
.viewtog{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.viewtog button{padding:8px 14px;font-size:13px;font-weight:700;color:var(--sub);background:#fff}
.viewtog button.on{background:var(--accent);color:#fff}

/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.bcol{background:#f1f2f4;border-radius:14px;padding:10px;min-height:120px}
.bcol-h{font-size:12.5px;font-weight:800;padding:4px 6px 9px;display:flex;align-items:center;gap:7px;color:var(--sub)}
.bcol-h .cnt{margin-left:auto;background:#fff;border-radius:8px;padding:1px 8px;font-size:11px;color:var(--sub)}
.bcard{background:#fff;border-radius:11px;padding:11px 12px;box-shadow:var(--shadow);margin-bottom:9px;display:flex;flex-direction:column;gap:7px}
.bcard .bt{font-weight:700;font-size:13.5px;line-height:1.3}

.bnav{display:none}
.empty{text-align:center;color:var(--mut);padding:34px 14px;font-size:14px}
.mono{font-variant-numeric:tabular-nums}
.hide-desk{display:none}

@media(max-width:759px){
  .rail{display:none}
  .content{padding:14px 13px 96px}
  .kgrid{grid-template-columns:repeat(2,1fr)}
  .board{grid-template-columns:1fr}
  .eval-grid{grid-template-columns:1fr}
  .topbar{padding:11px 14px}
  .topbar h1{font-size:16px}
  .hide-desk{display:inline-flex}
  .tnode .tprog{width:96px}
  .area-head .aprog{min-width:90px}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fff;
    border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--mut);padding:5px 6px;border-radius:10px;flex:1;position:relative}
  .bnav button.on{color:var(--accent)}
  .bnav button .ic{font-size:21px;line-height:1}
  .bnav button .nb{position:absolute;top:2px;right:50%;transform:translateX(15px);background:#e8384f;color:#fff;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
  .fld2{grid-template-columns:1fr}
  .kpi .num{font-size:26px}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useMemo,useEffect,useRef} = React;
const APP_VERSION = "v1.2.0";

/* ===== constants ===== */
const PEOPLE = [
  {name:"齊藤",   role:"管理者", color:"#4573d2", admin:true},
  {name:"伊江さん", role:"現場",  color:"#14a44d"},
  {name:"廣瀬さん", role:"現場",  color:"#f59e0b"},
];
const ASSIGNEES = ["全員","齊藤","伊江さん","廣瀬さん"];
const AREAS = [
  {name:"カスタマー対応", color:"#e8638a", icon:"📞"},
  {name:"車両整備/管理",  color:"#4573d2", icon:"🚗"},
  {name:"環境整備/管理",  color:"#14a44d", icon:"🌿"},
  {name:"情報管理",      color:"#8b5cf6", icon:"💾"},
];
const STATUS = [
  {k:"未着手", cls:"st-todo", color:"#a3a9b3"},
  {k:"進行中", cls:"st-prog", color:"#4573d2"},
  {k:"相談必要", cls:"st-talk", color:"#f59e0b"},
  {k:"完了",  cls:"st-done", color:"#14a44d"},
];
const PRIORITY = [{k:"高",c:"#e8384f"},{k:"中",c:"#f59e0b"},{k:"低",c:"#6b7280"}];
const areaColor = n => (AREAS.find(a=>a.name===n)||{}).color || "#64748b";
const areaIcon  = n => (AREAS.find(a=>a.name===n)||{}).icon || "📁";
const statusMeta = k => STATUS.find(s=>s.k===k) || STATUS[0];
const personColor = n => (PEOPLE.find(p=>p.name===n)||{}).color || "#64748b";

/* ===== hierarchy helpers ===== */
const childrenOf = (tasks,id)=>tasks.filter(t=>t.parentId===id);
const hasChildren = (tasks,id)=>tasks.some(t=>t.parentId===id);
const effProgress = (t,tasks)=>{const ch=childrenOf(tasks,t.id);if(!ch.length)return t.progress||0;return Math.round(ch.reduce((s,c)=>s+effProgress(c,tasks),0)/ch.length);};
const descendantIds = (tasks,id)=>{let r=[];childrenOf(tasks,id).forEach(c=>{r.push(c.id);r=r.concat(descendantIds(tasks,c.id));});return r;};
const depthOf = (t,tasks)=>{let d=0,p=t;while(p&&p.parentId){p=tasks.find(x=>x.id===p.parentId);d++;if(d>20)break;}return d;};

/* ===== date utils ===== */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const parse=s=>{const d=new Date(s+"T00:00:00");d.setHours(0,0,0,0);return d;};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const TODAY = iso(today());
const fmtJ = s => { const d=parse(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const dueLabel = due => {
  if(!due) return {t:"期限なし",cls:""};
  const d = diffDays(TODAY,due);
  if(d<0)  return {t:`${-d}日超過`,cls:"over"};
  if(d===0)return {t:"今日まで",cls:"over"};
  if(d<=5) return {t:`あと${d}日`,cls:"soon"};
  return {t:`あと${d}日`,cls:""};
};

function Donut({data,size=130}){
  const total = data.reduce((s,d)=>s+d.v,0)||1;
  let acc=0;
  const stops = data.map(d=>{const a=acc/total*360;acc+=d.v;const b=acc/total*360;return `${d.c} ${a}deg ${b}deg`;}).join(",");
  return (
    <div style={{width:size,height:size,borderRadius:"50%",background:`conic-gradient(${stops})`,position:"relative",flexShrink:0}}>
      <div style={{position:"absolute",inset:"22%",background:"#fff",borderRadius:"50%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
        <b style={{fontSize:22,fontWeight:800,lineHeight:1}}>{total}</b><span style={{fontSize:10,color:"var(--sub)"}}>件</span>
      </div>
    </div>
  );
}

/* ===== 評価アルゴリズム（明確化・1箇所に集約） ===== */
const EVAL = {
  weights:{ achieve:0.40, ontime:0.30, progress:0.20, log:0.10 }, // 合計1.0
  overduePenalty:8,    // 期限超過1件あたりの減点
  ontimeNeutral:70,    // 完了実績ゼロのときの納期確約率の中立値
  grades:[ {g:"S",min:85,c:"#7c3aed"},{g:"A",min:70,c:"#14a44d"},{g:"B",min:50,c:"#4573d2"},{g:"C",min:30,c:"#f59e0b"},{g:"D",min:0,c:"#e8384f"} ],
};
const gradeOf = s => EVAL.grades.find(x=>s>=x.min) || EVAL.grades[EVAL.grades.length-1];
function evalPerson(p,tasks){
  // 末端タスク（子を持たない＝実作業単位）のみで集計（親はロールアップなので二重計上しない）
  const list=tasks.filter(t=>t.assignee===p.name && !hasChildren(tasks,t.id));
  const n=list.length;
  const doneList=list.filter(t=>t.status==="完了");
  const done=doneList.length;
  const inProg=list.filter(t=>t.status==="進行中").length;
  const talk=list.filter(t=>t.status==="相談必要").length;
  const todo=list.filter(t=>t.status==="未着手").length;
  const avg=n?Math.round(list.reduce((s,t)=>s+(t.progress||0),0)/n):0;
  const achieve=n?Math.round(done/n*100):0;
  const onTime=doneList.filter(t=>t.due&&t.completedAt&&t.completedAt<=t.due).length;
  const ontimeRate=done?Math.round(onTime/done*100):null;
  const ontimeUsed=ontimeRate==null?EVAL.ontimeNeutral:ontimeRate;
  const overdue=list.filter(t=>t.status!=="完了"&&t.due&&diffDays(TODAY,t.due)<0).length;
  const logged=list.filter(t=>(t.logs||[]).length>0).length;
  const logRate=n?Math.round(logged/n*100):0;
  const W=EVAL.weights;
  const parts={ achieve:achieve*W.achieve, ontime:ontimeUsed*W.ontime, progress:avg*W.progress, log:logRate*W.log };
  const penalty=overdue*EVAL.overduePenalty;
  const raw=parts.achieve+parts.ontime+parts.progress+parts.log-penalty;
  const score=Math.max(0,Math.min(100,Math.round(raw)));
  return {...p,n,done,inProg,talk,todo,avg,achieve,ontimeRate,ontimeUsed,onTime,overdue,logged,logRate,parts,penalty,raw,score,grade:gradeOf(score)};
}

/* ===== TIMELINE ===== */
function Timeline({tasks,goals,onOpen,onCreate}){
  const base = parse(goals.month+"-01");
  const dim = new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
  const days = Array.from({length:dim},(_,i)=>addDays(base,i));
  const rows = ASSIGNEES;
  const [drag,setDrag] = useState(null);
  const dragging = useRef(false);
  const cellRange = (a,b)=>[Math.min(a,b),Math.max(a,b)];
  const start = (row,i)=>{dragging.current=true;setDrag({row,a:i,b:i});};
  const move  = (row,i)=>{if(dragging.current && drag && drag.row===row)setDrag(d=>({...d,b:i}));};
  const end   = ()=>{ if(dragging.current && drag){const [a,b]=cellRange(drag.a,drag.b);onCreate({assignee:drag.row, start:iso(days[a]), due:iso(days[b])});} dragging.current=false;setDrag(null); };
  useEffect(()=>{const up=()=>{if(dragging.current){end();}};window.addEventListener("mouseup",up);window.addEventListener("touchend",up);return()=>{window.removeEventListener("mouseup",up);window.removeEventListener("touchend",up);};});
  const inMonth = t => {const ts=parse(t.start||t.due), te=parse(t.due||t.start);return te>=base && ts<=addDays(base,dim-1);};
  // 実作業（末端タスク）を担当者ごとに表示。1人が複数タスクを持つ前提で「レーン分割」して全件を可視化
  const leaves = tasks.filter(t=>!hasChildren(tasks,t.id));
  const BAR_H=24, GAP=5, PADV=7;
  const layoutRow = (items)=>{
    const sorted=[...items].sort((a,b)=>(a.start||a.due||"").localeCompare(b.start||b.due||""));
    const laneEnd=[]; const placed=[];
    sorted.forEach(t=>{
      const s=Math.max(0,diffDays(iso(base),t.start||t.due));
      const e=Math.min(dim-1,diffDays(iso(base),t.due||t.start));
      let lane=laneEnd.findIndex(en=>en<s); // 重ならない（前タスクの終了 < 開始）最初のレーン
      if(lane<0){lane=laneEnd.length;laneEnd.push(e);}else{laneEnd[lane]=e;}
      placed.push({t,s,e,lane});
    });
    return {placed,lanes:Math.max(1,laneEnd.length)};
  };
  return (
    <div>

                      data-idx={i}/>;})}
                  <div className="tl-bars">
                    {placed.map(({t,s,e,lane})=>{
                      const left=(s/dim*100), w=((e-s+1)/dim*100);
                      const top=PADV+lane*(BAR_H+GAP);
                      return <div key={t.id} className="tl-bar" title={t.title+"（"+t.assignee+"）"} style={{left:left+"%",width:w+"%",top:top,height:BAR_H,background:areaColor(t.area)}}
                        onClick={ev=>{ev.stopPropagation();onOpen(t);}}>
                        <i className="pf" style={{width:(t.progress||0)+"%"}}/>
                        <span style={{position:"relative",zIndex:1,overflow:"hidden",textOverflow:"ellipsis"}}>{t.title}</span>
                      </div>;

                </div>
              </div>
            );
          })}
        </div>
      </div>
      <div style={{display:"flex",gap:14,flexWrap:"wrap",marginTop:14}}>
        {AREAS.map(a=><div key={a.name} style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"var(--sub)",fontWeight:700}}><span className="dot" style={{background:a.color}}/>{a.icon} {a.name}</div>)}
      </div>
    </div>
  );
}

/* ===== AI MANAGER ===== */
function AIManager({tasks,goals}){
  const over = tasks.filter(t=>t.status!=="完了"&&t.due&&diffDays(TODAY,t.due)<0);
  const soon = tasks.filter(t=>t.status!=="完了"&&t.due&&diffDays(TODAY,t.due)>=0&&diffDays(TODAY,t.due)<=3);
  const leaves = tasks.filter(t=>!hasChildren(tasks,t.id));
  const stale = leaves.filter(t=>t.status!=="完了"&&(t.logs||[]).length===0);
  const wait = tasks.filter(t=>t.status==="相談必要");
  const avg = leaves.length?Math.round(leaves.reduce((s,t)=>s+(t.progress||0),0)/leaves.length):0;
  const doneN = tasks.filter(t=>t.status==="完了").length;
  const report = [
    `【HDM ToDo 進捗レポート】`,
    `全体進捗: ${avg}% / 完了: ${doneN}/${tasks.length}件 / 期限3日以内: ${soon.length}件 / 期限超過: ${over.length}件`,
    ``,
    `■ 領域別`,
    ...AREAS.map(a=>{const tops=tasks.filter(t=>t.area===a.name&&!t.parentId);const v=tops.length?Math.round(tops.reduce((s,t)=>s+effProgress(t,tasks),0)/tops.length):0;return `・${a.name}: ${v}%（${tasks.filter(t=>t.area===a.name).length}件）`;}),
    ``,
    `■ 確認が必要`,
    ...[...soon,...over].slice(0,6).map(t=>`・${dueLabel(t.due).t}: ${t.title}（${t.assignee}・${t.progress||0}%）`),
    ``,
    `■ 担当別`,
    ...PEOPLE.map(p=>{const e=evalPerson(p,tasks);return `・${p.name}: スコア${e.score} / 達成率${e.achieve}% / 納期確約${e.ontimeRate==null?"—":e.ontimeRate+"%"}`;}),
    wait.length?`\n■ 相談必要: ${wait.map(t=>t.title).join("、")}`:"",
  ].filter(Boolean).join("\n");
  const Alert=({t})=>(<div className="card" style={{padding:"12px 15px",borderLeft:"3px solid var(--s-talk)",marginBottom:9}}>
    <div style={{fontWeight:700}}>{dueLabel(t.due).t}: {t.title}</div>
    <div style={{fontSize:12.5,color:"var(--sub)",marginTop:3}}>担当 {t.assignee} ・ {t.area} ・ 進捗{t.progress||0}%。今日できる作業と相談事項をログに残してください。</div>
  </div>);
  const copy=()=>{navigator.clipboard&&navigator.clipboard.writeText(report);};
  return (
    <div>
      <div className="kgrid" style={{gridTemplateColumns:"repeat(3,1fr)"}}>
        <div className="card kpi alert"><div className="lab">AIアラート</div><div className="num mono">{over.length+soon.length}</div><div className="sub2">確認対象</div></div>
        <div className="card kpi"><div className="lab">ログ未登録</div><div className="num mono">{stale.length}</div><div className="sub2">実作業</div></div>
        <div className="card kpi warn"><div className="lab">相談待ち</div><div className="num mono">{wait.length}</div><div className="sub2">齊藤確認</div></div>
      </div>
      <div className="sec-h"><h2>⚠️ 確認すべきタスク</h2></div>
      {[...over,...soon].length===0 && <div className="empty">緊急の確認事項はありません 👍</div>}
      {[...over,...soon].map(t=><Alert key={t.id} t={t}/>)}
      {stale.length>0 && <>
        <div className="sec-h"><h2>📝 ログが止まっているタスク</h2></div>
        {stale.map(t=><div key={t.id} className="card" style={{padding:"11px 15px",marginBottom:8,fontSize:13.5,display:"flex",gap:8,alignItems:"center"}}><span className="dot" style={{background:areaColor(t.area)}}/>{t.title}<span style={{marginLeft:"auto",fontSize:12,color:"var(--sub)"}}>{t.assignee}</span></div>)}
      </>}
      <div className="sec-h"><h2>📤 齊藤向け 報告文</h2><button className="btn sm more" onClick={copy}>コピー</button></div>
      <div className="card" style={{padding:16}}>
        <textarea readOnly value={report} style={{width:"100%",minHeight:230,border:"none",resize:"vertical",fontSize:13,lineHeight:1.7,color:"var(--ink)",background:"transparent",fontFamily:"inherit"}}/>
      </div>
    </div>
  );
}

/* ===== LOGS ===== */
function Logs({tasks,onOpen}){
  const feed=[];
  tasks.forEach(t=>(t.logs||[]).forEach(l=>feed.push({...l,task:t})));
  feed.sort((a,b)=>(b.date+b.author).localeCompare(a.date+a.author));
  return (
    <div>
      <div className="sec-h"><h2>📜 成果ログ（時系列）</h2><span style={{marginLeft:"auto",fontSize:12,color:"var(--mut)",fontWeight:700}}>{feed.length}件</span></div>
      {feed.length===0 && <div className="empty">まだログがありません</div>}

        {feed.map((l,i)=>(
          <div className="card log" key={i} style={{borderLeftColor:areaColor(l.task.area),cursor:"pointer"}} onClick={()=>onOpen(l.task)}>
            <div className="lh"><span>{l.date}</span>·<span>{l.author}</span>·<span style={{color:areaColor(l.task.area)}}>{l.task.title}</span></div>
            <div className="lt">{l.text}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function TaskEditor({task,initial,tasks,onSave,onClose,onDelete,me}){
  const ini=initial||{};
  const blank={title:"",assignee:ini.assignee||me,area:ini.area||AREAS[0].name,parentId:ini.parentId||null,priority:"中",
    status:"未着手",progress:0,start:ini.start||TODAY,due:ini.due||TODAY,description:"",logs:[],attachments:[],adminConfirmed:false,completedAt:null};
  const [f,setF]=useState(task?{...task}:{...blank});
  const [logText,setLogText]=useState("");
  const isNew=!task;
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const addLog=()=>{if(!logText.trim())return;set("logs",[...(f.logs||[]),{date:TODAY,author:me,text:logText.trim()}]);setLogText("");};
  const kids = task?childrenOf(tasks,task.id):[];
  // 親候補: 自分・自分の子孫を除外（循環防止）
  const banned = task?[task.id,...descendantIds(tasks,task.id)]:[];
  const parentOpts = tasks.filter(t=>banned.indexOf(t.id)<0);
  const parentTask = f.parentId?tasks.find(t=>t.id===f.parentId):null;
  return (
    <div className="scrim" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>

          <button className="iconbtn" onClick={onClose}>✕</button></div>
        <div className="sheet-b">
          {parentTask && <div className="parent-note">↳ 親タスク：<b style={{marginLeft:2}}>{parentTask.title}</b></div>}
          {kids.length>0 && <div className="parent-note" style={{background:"#eef7f0",color:"#0a7a3d"}}>🗂 子タスク {kids.length}件（進捗は子から自動集計）</div>}
          <div className="fld"><label>タイトル</label><input value={f.title} placeholder="例: LINE対応" onChange={e=>set("title",e.target.value)} autoFocus={isNew}/></div>
          <div className="fld2">
            <div className="fld"><label>担当領域</label><select value={f.area} onChange={e=>set("area",e.target.value)}>{AREAS.map(a=><option key={a.name}>{a.name}</option>)}</select></div>
            <div className="fld"><label>担当者</label><select value={f.assignee} onChange={e=>set("assignee",e.target.value)}>{ASSIGNEES.map(a=><option key={a}>{a}</option>)}</select></div>
          </div>
          <div className="fld"><label>親タスク（紐づけ先）</label>
            <select value={f.parentId||""} onChange={e=>{const v=e.target.value||null;set("parentId",v);if(v){const p=tasks.find(t=>t.id===v);if(p)set("area",p.area);}}}>
              <option value="">（なし＝親タスク／最上位）</option>
              {parentOpts.map(t=><option key={t.id} value={t.id}>{areaIcon(t.area)} {t.title}（{t.area}）</option>)}
            </select>
          </div>
          <div className="fld2">
            <div className="fld"><label>開始日</label><input type="date" value={f.start} onChange={e=>set("start",e.target.value)}/></div>
            <div className="fld"><label>期限</label><input type="date" value={f.due} onChange={e=>set("due",e.target.value)}/></div>
          </div>
          <div className="fld"><label>優先度</label><div className="seg">{PRIORITY.map(p=><button key={p.k} className={f.priority===p.k?"on":""} style={f.priority===p.k?{background:p.c,borderColor:p.c}:null} onClick={()=>set("priority",p.k)}>{p.k}</button>)}</div></div>
          <div className="fld"><label>ステータス</label><div className="seg st">{STATUS.map(s=><button key={s.k} className={(f.status===s.k?"on ":"")+s.cls} onClick={()=>{set("status",s.k);if(s.k==="完了")set("progress",100);}}>{s.k}</button>)}</div></div>
          {kids.length>0
            ? <div className="parent-note">進捗 {effProgress(f,tasks)}%（子タスクから自動集計のため手動入力は不可）</div>
            : <div className="fld"><label>進捗 {f.progress}%</label><input type="range" min="0" max="100" step="5" value={f.progress} onChange={e=>set("progress",+e.target.value)}/></div>}
          <div className="fld"><label>内容</label><textarea value={f.description} onChange={e=>set("description",e.target.value)} placeholder="作業内容・目的"/></div>
          {PEOPLE.find(p=>p.name===me&&p.admin) && <div className="fld"><label>管理者確認</label><div className="seg"><button className={f.adminConfirmed?"on":""} onClick={()=>set("adminConfirmed",!f.adminConfirmed)}>{f.adminConfirmed?"✓ 確認済":"未確認"}</button></div></div>}

          <div className="fld">
            <label>作業ログ</label>
            <div style={{display:"flex",gap:8,marginBottom:10}}>
              <input value={logText} onChange={e=>setLogText(e.target.value)} placeholder="今日やったこと・相談・完了報告" onKeyDown={e=>e.key==="Enter"&&addLog()}/>
              <button className="btn pri" onClick={addLog}>追加</button>
            </div>
            {(f.logs||[]).slice().reverse().map((l,i)=>(
              <div className="detail-log" key={i}><b style={{color:"var(--sub)"}}>{l.date} · {l.author}</b><div style={{marginTop:3}}>{l.text}</div></div>
            ))}
          </div>

          <div style={{display:"flex",gap:10,position:"sticky",bottom:0,background:"#fff",paddingTop:8}}>
            <button className="btn" style={{flex:1}} onClick={onClose}>キャンセル</button>
            <button className="btn pri" style={{flex:2}} onClick={()=>{if(!f.title.trim()){alert("タイトルを入力してください");return;}onSave(f);}}>{isNew?"作成":"保存"}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ===== ROOT ===== */
const TABS=[
  {k:"mytasks", ic:"✅", label:"マイタスク", bn:true},
  {k:"areas",   ic:"🗂", label:"担当領域", bn:true},
  {k:"timeline",ic:"🗓", label:"タイムライン", bn:true},
  {k:"list",    ic:"≣", label:"タスク一覧"},
  {k:"dash",    ic:"📊", label:"ダッシュボード", bn:true},
  {k:"ai",      ic:"🤖", label:"AI管理"},
  {k:"logs",    ic:"📜", label:"成果ログ"},
  {k:"goals",   ic:"🎯", label:"目標設定"},
];

function App(){
  const [state,setState]=useState(()=>{const s=DB.load();return (s&&s.tasks&&s.tasks[0]&&s.tasks[0].area)?s:seed();}); // 旧データ(areaなし)はseedで作り直し
  const [tab,setTab]=useState("mytasks");
  const [editor,setEditor]=useState(null);
  const [menuOpen,setMenuOpen]=useState(false);
  const [sync,setSync]=useState("connecting"); // connecting | cloud | off
  const revRef=useRef(0), fromRemote=useRef(false), cloudReady=useRef(false), saveTimer=useRef(null);

  // 初回: クラウドの最新を取得（無ければ現状を初期登録）
  useEffect(()=>{
    let alive=true;
    (async()=>{
      try{
        const row=await REMOTE.get();
        if(!alive)return;
        if(row && row.data && row.data.tasks && row.data.tasks.length){
          fromRemote.current=true; revRef.current=row.rev||0; cloudReady.current=true; setSync("cloud"); setState(row.data);
        }else{
          await REMOTE.put(state,1); revRef.current=1; cloudReady.current=true; setSync("cloud");
        }
      }catch(e){ cloudReady.current=false; setSync("off"); }
    })();
    return ()=>{alive=false;};
  },[]);

  // 保存: ローカルは即時 / クラウドは変更をまとめて送信
  useEffect(()=>{
    DB.save(state);
    if(!cloudReady.current) return;
    if(fromRemote.current){ fromRemote.current=false; return; } // 受信した内容はエコーバックしない
    if(saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(async()=>{
      try{ const nr=revRef.current+1; await REMOTE.put(state,nr); revRef.current=nr; setSync("cloud"); }
      catch(e){ cloudReady.current=false; setSync("off"); }
    },900);
  },[state]);

  // 他端末の編集を反映（編集モーダル中は上書きしない）
  useEffect(()=>{
    const iv=setInterval(async()=>{
      if(!cloudReady.current||editor)return;
      try{ const row=await REMOTE.get();
        if(row && (row.rev||0)>revRef.current && row.data && row.data.tasks){
          fromRemote.current=true; revRef.current=row.rev; setState(row.data);
        }
      }catch(e){}
    },12000);
    return ()=>clearInterval(iv);
  },[editor]);

  const syncTxt = sync==="cloud"?"☁ 全員と同期":sync==="off"?"📱 この端末のみ":"⏳ 接続中…";
  const syncColor = sync==="cloud"?"#14a44d":sync==="off"?"#9aa0a8":"#f59e0b";

  const {tasks,goals,me}=state;
  const setTasks=fn=>setState(s=>({...s,tasks:typeof fn==="function"?fn(s.tasks):fn}));
  const updTask=(id,patch)=>setTasks(ts=>ts.map(t=>t.id===id?{...t,...patch}:t));

  const onOpen=t=>setEditor({task:t});
  const onNew=initial=>setEditor({initial:initial||{}});
  const onAddChild=parent=>setEditor({initial:{parentId:parent.id,area:parent.area,assignee:parent.assignee,start:parent.start,due:parent.due}});
  const onAddTop=area=>setEditor({initial:{area}});
  const onProgress=(t,p)=>{
    const patch={progress:p,status:p>=100?"完了":(t.status==="未着手"?"進行中":t.status)};
    if(p>=100&&!t.completedAt) patch.completedAt=TODAY;
    if(p<100&&t.status==="完了") patch.completedAt=null;
    updTask(t.id,patch);
  };
  const onComplete=t=>updTask(t.id,{status:"完了",progress:100,completedAt:t.completedAt||TODAY});
  const onLog=t=>setEditor({task:t});
  const saveTask=f=>{
    const patch={...f};
    if(patch.status==="完了"&&!patch.completedAt) patch.completedAt=TODAY;
    if(patch.status!=="完了") patch.completedAt=null;
    if(patch.id) updTask(patch.id,patch);
    else setTasks(ts=>[{...patch,id:uid(),createdAt:TODAY},...ts]);
    setEditor(null);
  };
  const delTask=f=>{
    const desc=descendantIds(tasks,f.id);
    const msg=desc.length?`このタスクと子タスク${desc.length}件をすべて削除しますか？`:"このタスクを削除しますか？";
    if(confirm(msg)){const kill=new Set([f.id,...desc]);setTasks(ts=>ts.filter(t=>!kill.has(t.id)));setEditor(null);}
  };
  const setGoals=g=>setState(s=>({...s,goals:g}));

  const overdue = tasks.filter(t=>t.status!=="完了"&&t.due&&diffDays(TODAY,t.due)<0).length;
  const cur = TABS.find(t=>t.k===tab);
  const h={onOpen,onProgress,onComplete,onLog,onAddChild};

  const body = (
    tab==="mytasks" ? <MyTasks tasks={tasks} me={me} {...h}/> :
    tab==="areas"   ? <AreaTree tasks={tasks} onOpen={onOpen} onAddChild={onAddChild} onAddTop={onAddTop} onComplete={onComplete}/> :
    tab==="timeline"? <Timeline tasks={tasks} goals={goals} onOpen={onOpen} onCreate={onNew}/> :
    tab==="list"    ? <TaskList tasks={tasks} {...h}/> :
    tab==="dash"    ? <Dashboard tasks={tasks} goals={goals} go={setTab}/> :
    tab==="ai"      ? <AIManager tasks={tasks} goals={goals}/> :
    tab==="logs"    ? <Logs tasks={tasks} onOpen={onOpen}/> :
                      <Goals goals={goals} setGoals={setGoals}/>
  );

  return (
    <div className="app">
      <aside className="rail">
        <div className="rail-brand"><div className="rail-logo">H</div><div><b>HDM ToDo</b><span>那覇空港店 業務管理</span></div></div>
        <nav className="rail-nav">
          {TABS.map(t=>(
            <button key={t.k} className={"rail-item"+(tab===t.k?" on":"")} onClick={()=>setTab(t.k)}>
              <span className="ic">{t.ic}</span>{t.label}
              {t.k==="mytasks"&&overdue>0&&<span className="badge">{overdue}</span>}
            </button>
          ))}
        </nav>
        <div className="rail-foot">
          <div className="rail-who"><span style={{fontSize:11,color:"#9aa0a8"}}>入力中</span>
            <select value={me} onChange={e=>setState(s=>({...s,me:e.target.value}))}>{PEOPLE.map(p=><option key={p.name}>{p.name}</option>)}</select></div>
          <div><span style={{color:syncColor,fontWeight:700}}>{syncTxt}</span> · {APP_VERSION}</div>
        </div>
      </aside>

      <div className="main">
        <header className="topbar">
          <button className="iconbtn hide-desk" onClick={()=>setMenuOpen(true)}>☰</button>
          <div><h1>{cur.label}</h1><div className="desc">{me} さんとして操作中 · <span style={{color:syncColor,fontWeight:700}}>{syncTxt}</span></div></div>
          <div className="grow"/>
          <button className="btn pri" onClick={()=>onNew({})}>＋ タスク</button>
        </header>
        <main className="content">{body}</main>
      </div>

      <nav className="bnav">
        {TABS.filter(t=>t.bn).map(t=>(
          <button key={t.k} className={tab===t.k?"on":""} onClick={()=>setTab(t.k)}>
            <span className="ic">{t.ic}</span>{t.label.replace("ダッシュボード","ダッシュ").replace("タイムライン","予定")}
            {t.k==="mytasks"&&overdue>0&&<span className="nb">{overdue}</span>}
          </button>
        ))}
        <button className={["list","ai","logs","goals"].includes(tab)?"on":""} onClick={()=>setMenuOpen(true)}><span className="ic">⋯</span>メニュー</button>
      </nav>

      {menuOpen && (
        <div className="scrim" onClick={()=>setMenuOpen(false)}>
          <div className="sheet" onClick={e=>e.stopPropagation()}>
            <div className="sheet-h"><b>メニュー</b><button className="iconbtn" onClick={()=>setMenuOpen(false)}>✕</button></div>
            <div className="sheet-b">
              <div className="fld"><label>入力中の担当者</label><select value={me} onChange={e=>setState(s=>({...s,me:e.target.value}))}>{PEOPLE.map(p=><option key={p.name}>{p.name}</option>)}</select></div>
              {TABS.map(t=>(
                <button key={t.k} className={"rail-item"+(tab===t.k?" on":"")} style={{color:tab===t.k?"#fff":"var(--ink)",background:tab===t.k?"var(--accent)":"#f4f5f7"}} onClick={()=>{setTab(t.k);setMenuOpen(false);}}>
                  <span className="ic">{t.ic}</span>{t.label}
                </button>
              ))}
              <div style={{fontSize:11,color:"var(--mut)",textAlign:"center",marginTop:6}}>{APP_VERSION} · ローカル保存</div>
            </div>
          </div>
        </div>
      )}

      {editor && <TaskEditor task={editor.task} initial={editor.initial} tasks={tasks} me={me} onSave={saveTask} onClose={()=>setEditor(null)} onDelete={delTask}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
