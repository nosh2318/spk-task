<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>KEY-DROP 価格マスター（SPK）</title>
<style>
  :root{ --bk:#1a1a1a; --ye:#FABE00; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f5f6f8;color:#1a1a1a;font-size:14px}
  header{background:var(--bk);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
  header .logo{font-weight:900;letter-spacing:1px}
  header .logo b{color:var(--ye)}
  .wrap{max-width:920px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid #e6e8ec;border-radius:12px;padding:16px;margin-bottom:16px}
  .card h2{font-size:15px;margin:0 0 4px;border-left:4px solid var(--ye);padding-left:8px}
  .card .hint{font-size:11.5px;color:#64748b;margin:0 0 12px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:7px 6px;text-align:center;border-bottom:1px solid #eef0f3;font-size:13px}
  th{background:#f8fafc;font-size:12px;color:#475569}
  td.cls{font-weight:800;text-align:left;background:#fafbfc}
  input[type=number]{width:88px;padding:8px;border:1.5px solid #dde1e6;border-radius:8px;font-size:14px;text-align:right;font-family:inherit}
  input[type=text]{padding:8px;border:1.5px solid #dde1e6;border-radius:8px;font-size:14px;font-family:inherit}
  .tier0{color:#0369a1}.tier1{color:#1a1a1a}.tier2{color:#b91c1c}
  .preset-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .preset-row input.nm{width:120px}.preset-row input.md{width:78px}
  select{padding:8px;border:1.5px solid #dde1e6;border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
  .btn{border:none;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:800;cursor:pointer}
  .btn-primary{background:var(--ye);color:var(--bk)}
  .btn-dark{background:var(--bk);color:#fff}
  .btn-ghost{background:#eef0f3;color:#334155}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
  .save-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #e6e8ec;padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:flex-end}
  #msg{font-size:12.5px;font-weight:700}
  .danger{color:#dc2626}.ok{color:#16a34a}
  .prev{font-size:12.5px;color:#475569;background:#fffbe9;border:1px solid var(--ye);border-radius:8px;padding:10px 12px}
</style>
</head>
<body>
<header>
  <div class="logo">CARデリバリー <b>KEY-DROP</b></div>
  <div style="font-size:12px;opacity:.8">価格マスター（SPK管理）</div>
</header>
<div class="wrap">
  <div id="authMsg" class="card" style="display:none;border-color:#fca5a5;background:#fef2f2;color:#b91c1c;font-weight:700"></div>

  <div class="card">
    <h2>クラス別 料金（1日あたり・税込）</h2>
    <p class="hint">3段階：<span class="tier0">閑散</span> / <span class="tier1">通常</span> / <span class="tier2">繁忙</span>。日ごとに下のシーズン設定で段階が決まり、利用日数分を合算して請求します。顧客サイト・予約確定額はこの値が基準（サーバ再計算）。</p>
    <table id="priceTbl">
      <thead><tr><th>クラス</th><th class="tier0">閑散</th><th class="tier1">通常</th><th class="tier2">繁忙</th></tr></thead>
      <tbody id="priceBody"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>シーズン設定（繁忙/閑散の期間）</h2>
    <p class="hint">期間（月-日〜月-日）に当てはまる日は指定段階を適用。重複しない日は「基本段階」を使います。年跨ぎ（例 12-29〜01-03）も可。</p>
    <div id="presetList"></div>
    <button class="btn btn-ghost btn-sm" onclick="addPreset()">＋ シーズンを追加</button>
    <div style="margin-top:14px">
      <label style="font-weight:700">基本段階（シーズン外の通常日）：</label>
      <select id="defTier"><option value="0">閑散</option><option value="1" selected>通常</option><option value="2">繁忙</option></select>
    </div>
  </div>

  <div class="card">
    <h2>プレビュー</h2>
    <div class="prev" id="prev">日付を選ぶと、その日の段階と各クラス料金を表示します。
      <div style="margin-top:8px"><input type="date" id="prevDate" onchange="renderPrev()"></div>
      <div id="prevOut" style="margin-top:8px"></div>
    </div>
  </div>
</div>
<div class="save-bar">
  <span id="msg"></span>
  <button class="btn btn-ghost" onclick="loadCfg()">再読込</button>
  <button class="btn btn-primary" onclick="saveCfg()">保存</button>
</div>

<script>
const SB_URL="https://ckrxttbnawkclshczsia.supabase.co";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
const CLASSES=["A","A2","B","B2","C","S","F","H"];
const CLASS_LABEL={A:"A プレミアム",A2:"A2 預かり",B:"B ミニバン",B2:"B2 預かり",C:"C コンパクトSUV",S:"S SUV",F:"F コンパクト",H:"H セダン"};
let cfg={prices:{},presets:[],default:1};

// SPKログインのトークンを同一オリジンのlocalStorageから取得（authenticatedでapp_settings読み書き）
function authToken(){
  try{
    for(const k in localStorage){
      if(/^sb-.*-auth-token$/.test(k)){
        const v=JSON.parse(localStorage.getItem(k));
        const t=v && (v.access_token || (v.currentSession&&v.currentSession.access_token) || (Array.isArray(v)&&v[0]));
        if(t) return t;
      }
    }
  }catch(e){}
  return null;
}
function hdr(){ const t=authToken(); return {apikey:ANON, Authorization:"Bearer "+(t||ANON), "Content-Type":"application/json"}; }
function setMsg(s,cls){ const m=document.getElementById("msg"); m.textContent=s; m.className=cls||""; }

async function loadCfg(){
  const t=authToken();
  if(!t){ document.getElementById("authMsg").style.display="block"; document.getElementById("authMsg").textContent="⚠️ SPKにログインした状態でこのページを開いてください（価格の編集には認証が必要です）。SPKアプリのTOP→価格戦略などから開くとログインが引き継がれます。"; }
  try{
    const r=await fetch(SB_URL+"/rest/v1/app_settings?key=eq.hdm_keydrop_price&select=value",{headers:hdr()});
    const d=await r.json();
    if(Array.isArray(d)&&d[0]&&d[0].value){
      const v=typeof d[0].value==="string"?JSON.parse(d[0].value):d[0].value;
      cfg={prices:v.prices||{},presets:v.presets||[],default:(v.default!=null?v.default:1)};
    }
    // 欠けてるクラスは0で初期化
    CLASSES.forEach(c=>{ if(!Array.isArray(cfg.prices[c])||cfg.prices[c].length<3) cfg.prices[c]=[0,0,0]; });
    renderPrices(); renderPresets(); document.getElementById("defTier").value=String(cfg.default);
    setMsg("読み込みました","ok");
  }catch(e){ setMsg("読込エラー: "+e.message,"danger"); }
}

function renderPrices(){
  const b=document.getElementById("priceBody"); b.innerHTML="";
  CLASSES.forEach(c=>{
    const tr=document.createElement("tr");
    tr.innerHTML='<td class="cls">'+(CLASS_LABEL[c]||c)+'</td>'+
      [0,1,2].map(ti=>'<td><input type="number" min="0" step="100" data-c="'+c+'" data-t="'+ti+'" value="'+(cfg.prices[c][ti]||0)+'"></td>').join("");
    b.appendChild(tr);
  });
}
function renderPresets(){
  const w=document.getElementById("presetList"); w.innerHTML="";
  (cfg.presets||[]).forEach((p,i)=>{
    const row=document.createElement("div"); row.className="preset-row";
    row.innerHTML='<input type="text" class="nm" placeholder="名称(GW等)" value="'+(p.name||"")+'" data-i="'+i+'" data-k="name">'+
      '<input type="text" class="md" placeholder="開始 MM-DD" value="'+(p.start||"")+'" data-i="'+i+'" data-k="start">〜'+
      '<input type="text" class="md" placeholder="終了 MM-DD" value="'+(p.end||"")+'" data-i="'+i+'" data-k="end">'+
      '<select data-i="'+i+'" data-k="tier"><option value="0"'+(p.tier==0?" selected":"")+'>閑散</option><option value="1"'+(p.tier==1?" selected":"")+'>通常</option><option value="2"'+(p.tier==2?" selected":"")+'>繁忙</option></select>'+
      '<button class="btn btn-ghost btn-sm" data-del="'+i+'">削除</button>';
    w.appendChild(row);
  });
  w.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ cfg.presets.splice(+b.dataset.del,1); collect(); renderPresets(); });
}
function addPreset(){ collect(); cfg.presets.push({name:"",start:"",end:"",tier:2}); renderPresets(); }

// 画面値をcfgへ吸い上げ
function collect(){
  document.querySelectorAll("#priceBody input").forEach(inp=>{ cfg.prices[inp.dataset.c][+inp.dataset.t]=Math.max(0,Math.round(+inp.value||0)); });
  const rows={};
  document.querySelectorAll("#presetList .preset-row").forEach(r=>{
    r.querySelectorAll("[data-i]").forEach(el=>{ const i=+el.dataset.i; rows[i]=rows[i]||{}; rows[i][el.dataset.k]=el.value; });
  });
  cfg.presets=Object.keys(rows).map(i=>({name:(rows[i].name||"").trim(),start:(rows[i].start||"").trim(),end:(rows[i].end||"").trim(),tier:+rows[i].tier})).filter(p=>p.start&&p.end);
  cfg.default=+document.getElementById("defTier").value;
}

function tierOf(md){ // md = "MM-DD"
  let t=cfg.default;
  for(const p of (cfg.presets||[])){
    if(!p.start||!p.end) continue;
    if(p.start<=p.end){ if(md>=p.start&&md<=p.end){ t=p.tier; break; } }
    else { if(md>=p.start||md<=p.end){ t=p.tier; break; } } // 年跨ぎ
  }
  return t;
}
function renderPrev(){
  collect();
  const v=document.getElementById("prevDate").value; const out=document.getElementById("prevOut");
  if(!v){ out.textContent=""; return; }
  const md=v.slice(5); const t=tierOf(md); const tl=["閑散","通常","繁忙"][t];
  out.innerHTML="この日の段階：<b>"+tl+"</b><br>"+CLASSES.map(c=>(CLASS_LABEL[c]||c)+" = ¥"+(cfg.prices[c][t]||0).toLocaleString()).join(" ／ ");
}

async function saveCfg(){
  collect();
  if(!authToken()){ setMsg("ログインが必要です（SPK経由で開いてください）","danger"); return; }
  setMsg("保存中…","");
  try{
    const body={value:JSON.stringify({prices:cfg.prices,presets:cfg.presets,default:cfg.default})};
    let r=await fetch(SB_URL+"/rest/v1/app_settings?key=eq.hdm_keydrop_price",{method:"PATCH",headers:Object.assign(hdr(),{Prefer:"return=representation"}),body:JSON.stringify(body)});
    let d=await r.json().catch(()=>[]);
    if(r.ok && Array.isArray(d) && d.length){ setMsg("✅ 保存しました（顧客サイトに即反映）","ok"); return; }
    // 行が無ければINSERT
    if(r.ok && Array.isArray(d) && d.length===0){
      r=await fetch(SB_URL+"/rest/v1/app_settings",{method:"POST",headers:hdr(),body:JSON.stringify({key:"hdm_keydrop_price",value:body.value})});
      if(r.ok){ setMsg("✅ 新規保存しました","ok"); return; }
    }
    setMsg("保存失敗: HTTP "+r.status+" "+JSON.stringify(d).slice(0,120),"danger");
  }catch(e){ setMsg("保存エラー: "+e.message,"danger"); }
}

loadCfg();
</script>
</body>
</html>
