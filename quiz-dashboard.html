<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>🧩 クイズ利用ダッシュボード｜HANDYMAN</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;background:#eef2f8;color:#0f172a}
.wrap{max-width:920px;margin:0 auto;padding:16px}
h1{font-size:19px;margin:4px 0 2px;display:flex;align-items:center;gap:8px}
.sub{font-size:12px;color:#64748b;margin-bottom:14px}
.rowtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.btn{border:none;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer;background:#2563eb;color:#fff}
.tot{background:#0f1f45;color:#fff;border-radius:14px;padding:12px 16px;font-weight:800;font-size:14px}
.tot b{font-size:22px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:680px){.cards{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(15,31,69,.06)}
.ch{font-size:16px;font-weight:900;margin-bottom:2px}
.csub{font-size:11px;color:#94a3b8;margin-bottom:12px}
.fn{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.fr{display:flex;align-items:center;gap:9px}
.fr .lb{width:96px;font-size:12px;font-weight:700;color:#475569;flex:0 0 auto}
.fr .bar{flex:1;height:22px;background:#f1f5f9;border-radius:7px;overflow:hidden;position:relative}
.fr .bi{height:100%;border-radius:7px;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:12px;font-weight:800;white-space:nowrap;min-width:2px}
.fr .rt{width:44px;text-align:right;font-size:11px;font-weight:800;color:#64748b;flex:0 0 auto}
.kpis{display:flex;gap:10px;margin-bottom:14px}
.kpi{flex:1;background:#f8fafc;border:1px solid #eef2f7;border-radius:10px;padding:9px;text-align:center}
.kpi .n{font-size:20px;font-weight:900;color:#0f1f45}
.kpi .l{font-size:10px;color:#94a3b8;font-weight:700}
.rk{display:flex;flex-direction:column;gap:5px}
.rkr{display:flex;align-items:center;gap:8px}
.rkr .rl{width:26px;font-weight:900;font-size:12px;color:#0f1f45}
.rkr .rb{flex:1;height:12px;background:#f1f5f9;border-radius:6px;overflow:hidden}
.rkr .ri{height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);border-radius:6px}
.rkr .rn{width:26px;text-align:right;font-size:11px;font-weight:800;color:#64748b}
.sec{font-size:11px;font-weight:800;color:#64748b;margin:12px 0 6px}
.days{font-size:11px;color:#475569}
.days table{width:100%;border-collapse:collapse}
.days td,.days th{padding:3px 6px;border-bottom:1px solid #f1f5f9;text-align:right;font-size:11px}
.days th:first-child,.days td:first-child{text-align:left;color:#64748b}
.empty{color:#94a3b8;font-size:12px;text-align:center;padding:16px}
.note{font-size:10px;color:#94a3b8;margin-top:14px;line-height:1.6}
</style></head>
<body><div class="wrap">
<h1>🧩 クイズ利用ダッシュボード</h1>
<div class="sub">那覇＝沖縄クイズ／札幌＝札幌クイズ ・ カルテのバナー計測（表示→タップ→開始→完了）</div>
<div class="rowtop">
  <button class="btn" onclick="load()">🔄 更新</button>
  <span class="tot" id="tot">読込中…</span>
  <span style="font-size:11px;color:#94a3b8" id="upd"></span>
</div>
<div class="cards" id="cards"><div class="empty">読み込み中…</div></div>
<div class="note">※「人」＝ユニーク端末（session）。回数は延べ。完了＝最後まで解いた人。60秒ごとに自動更新。データは quiz_events（匿名・PIIなし）を集計RPCで取得。</div>
</div>
<script>
var SB="https://ckrxttbnawkclshczsia.supabase.co";
var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
var LABEL={nha:"🏝 那覇（沖縄クイズ）",spk:"❄️ 札幌（札幌クイズ）"};
var ORD={nha:0,spk:1};
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function pct(a,b){return b>0?Math.round(a/b*100):0;}
function funnel(s){
  var v=s.u_view||0,c=s.u_click||0,p=s.u_play||0,f=s.u_complete||0;
  var mx=Math.max(v,1);
  function row(lb,val,base,col){var w=Math.round(val/mx*100);return '<div class="fr"><div class="lb">'+lb+'</div><div class="bar"><div class="bi" style="width:'+Math.max(w,val>0?8:0)+'%;background:'+col+'">'+val+'人</div></div><div class="rt">'+(base?pct(val,base)+"%":"")+'</div></div>';}
  return '<div class="fn">'+
    row("👀 表示",v,0,"#94a3b8")+
    row("👆 タップ",c,v,"#2563eb")+
    row("▶️ 開始",p,v,"#0891b2")+
    row("🏁 完了",f,v,"#16a34a")+
  '</div>';
}
function ranks(s){
  var order=["SS","S","A","B","C","D"];var r=s.ranks||{};var mx=1;order.forEach(function(k){mx=Math.max(mx,r[k]||0);});
  var any=order.some(function(k){return r[k];});
  if(!any)return '';
  return '<div class="sec">ランク分布（完了者）</div><div class="rk">'+order.map(function(k){var n=r[k]||0;return '<div class="rkr"><div class="rl">'+k+'</div><div class="rb"><div class="ri" style="width:'+Math.round(n/mx*100)+'%"></div></div><div class="rn">'+n+'</div></div>';}).join("")+'</div>';
}
function days(s){
  var d=(s.by_day||[]).filter(function(x){return x.plays||x.completes;});
  if(!d.length)return '';
  return '<div class="sec">日別</div><div class="days"><table><tr><th>日</th><th>開始</th><th>完了</th></tr>'+d.map(function(x){return '<tr><td>'+esc(x.d)+'</td><td>'+(x.plays||0)+'</td><td>'+(x.completes||0)+'</td></tr>';}).join("")+'</table></div>';
}
function cardHtml(s){
  return '<div class="card"><div class="ch">'+(LABEL[s.store]||s.store)+'</div>'+
    '<div class="csub">利用者 '+(s.u_view||0)+'人が表示／'+(s.u_complete||0)+'人が完了</div>'+
    funnel(s)+
    '<div class="kpis"><div class="kpi"><div class="n">'+(s.avg_acc!=null?s.avg_acc+"%":"—")+'</div><div class="l">平均正答率</div></div>'+
    '<div class="kpi"><div class="n">'+(s.avg_score!=null?s.avg_score:"—")+'</div><div class="l">平均スコア/15</div></div>'+
    '<div class="kpi"><div class="n">'+(s.n_play||0)+'</div><div class="l">延べプレイ</div></div></div>'+
    ranks(s)+days(s)+'</div>';
}
function load(){
  fetch(SB+"/rest/v1/rpc/quiz_stats",{method:"POST",headers:{apikey:ANON,Authorization:"Bearer "+ANON,"Content-Type":"application/json"},body:"{}"})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||!d.stores){document.getElementById("cards").innerHTML='<div class="empty">データがありません</div>';return;}
      document.getElementById("tot").innerHTML='全体ユニーク利用者 <b>'+(d.total_users||0)+'</b> 人';
      var stores=d.stores.slice().sort(function(a,b){return (ORD[a.store]==null?9:ORD[a.store])-(ORD[b.store]==null?9:ORD[b.store]);});
      // 両店必ず表示（データ無しでも枠）
      ["nha","spk"].forEach(function(st){if(!stores.some(function(s){return s.store===st;}))stores.push({store:st});});
      stores.sort(function(a,b){return (ORD[a.store]==null?9:ORD[a.store])-(ORD[b.store]==null?9:ORD[b.store]);});
      document.getElementById("cards").innerHTML=stores.map(cardHtml).join("");
      var dt=new Date();document.getElementById("upd").textContent="更新 "+dt.getHours()+":"+String(dt.getMinutes()).padStart(2,"0");
    })
    .catch(function(e){document.getElementById("cards").innerHTML='<div class="empty">取得エラー: '+esc(e&&e.message||e)+'</div>';});
}
load();
setInterval(load,60000);
</script></body></html>
