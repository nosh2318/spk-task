<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>駐車場｜Tesla風モックアップ</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;font-family:-apple-system,"SF Pro Display","Helvetica Neue",Inter,"Hiragino Sans",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#16181d 0%,#0b0c0f 60%,#080809 100%);color:#f4f5f7;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:1040px;margin:0 auto;padding:26px 20px 80px}
  /* Header */
  .top{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid #1e2126}
  .title{font-size:15px;font-weight:600;letter-spacing:.14em;color:#9aa0a8;text-transform:uppercase}
  .title b{display:block;font-size:23px;font-weight:600;letter-spacing:.02em;color:#f4f5f7;margin-top:4px}
  .occ{text-align:right}
  .occ .n{font-size:40px;font-weight:300;letter-spacing:-.02em;line-height:1}
  .occ .n small{color:#5b616b;font-weight:300}
  .occ .l{font-size:11px;letter-spacing:.16em;color:#5b616b;text-transform:uppercase;margin-top:4px}
  /* guiding banner */
  .guide{margin:18px 0 6px;display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,#12141a,#0e0f13);border:1px solid #24272e;border-radius:16px;padding:14px 18px}
  .guide .car{width:46px;height:26px;flex:none}
  .guide .txt{font-size:13px;color:#c8ccd2}.guide .txt b{color:#fff;font-weight:600}
  .guide .go{margin-left:auto;font-size:12px;font-weight:600;letter-spacing:.04em;color:#fff;background:#3457dc;border:none;border-radius:999px;padding:9px 18px;cursor:pointer}
  /* zone */
  .zone{margin-top:30px}
  .zh{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
  .zh h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.18em;color:#8a9098;text-transform:uppercase}
  .zh .free{font-size:11px;color:#5b616b;letter-spacing:.1em}
  .zh .tag{font-size:9.5px;letter-spacing:.12em;color:#5b616b;border:1px solid #262a30;border-radius:5px;padding:1px 7px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  /* spot card */
  .spot{position:relative;background:#121317;border:1px solid #22252b;border-radius:16px;padding:16px 14px 14px;min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:border-color .25s,transform .25s}
  .spot:hover{border-color:#3a3f47;transform:translateY(-2px)}
  .spot .no{position:absolute;top:10px;left:12px;font-size:10px;font-weight:500;letter-spacing:.05em;color:#5b616b;font-variant-numeric:tabular-nums}
  .spot .car{width:76px;height:44px;margin:6px 0 8px}
  .spot .nm{font-size:13px;font-weight:600;color:#eef0f2;text-align:center;line-height:1.2}
  .spot .pl{font-size:11px;font-weight:400;color:#8a9098;font-variant-numeric:tabular-nums;letter-spacing:.03em;margin-top:2px}
  /* empty */
  .spot.empty{border-style:dashed;border-color:#22252b;background:#0d0e11;cursor:pointer}
  .spot.empty .plus{color:#4a5059;font-size:12px;letter-spacing:.1em}
  .spot.empty:hover{border-color:#3457dc}
  .spot.reco{border-color:#3457dc;box-shadow:0 0 0 1px #3457dc55, 0 0 22px -6px #3457dc}
  .spot.reco .crown{position:absolute;top:10px;right:12px;font-size:10px;color:#7f9bff;letter-spacing:.06em}
  /* status chips (subtle) */
  .st{position:absolute;bottom:10px;display:flex;gap:6px}
  .kchip{font-size:9px;font-weight:600;letter-spacing:.04em;display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:999px;border:1px solid}
  .kin{color:#8bffd4;border-color:#164e3b;background:#0c1f19;animation:kb 1.4s ease-in-out infinite}
  .kout{color:#ff9a9a;border-color:#4c1d1d;background:#1c0f0f}
  .kunk{color:#c9a24a;border-color:#3a2e12;background:#171207}
  @keyframes kb{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(52,211,153,.5)}50%{opacity:.55;box-shadow:0 0 10px 1px rgba(52,211,153,.55)}}
  .depart{position:absolute;top:0;left:14px;right:14px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#e82127,transparent)}
  .foot{margin-top:40px;text-align:center;font-size:10.5px;color:#40454d;letter-spacing:.1em}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title">HANDYMAN 札幌<b>駐車場マップ</b></div>
    <div class="occ"><div class="n">7<small> / 20</small></div><div class="l">Parked</div></div>
  </div>

  <div class="guide">
    <span class="car"></span>
    <div class="txt"><b>アルファード 3411</b> ・ 乗り捨て 19:00 ／ 停める場所をお選びください</div>
    <button class="go">トラストへ停車</button>
  </div>

  <div class="zone">
    <div class="zh"><h2>BIG スロット</h2><span class="free">空き 0</span></div>
    <div class="grid" id="big"></div>
  </div>

  <div class="zone">
    <div class="zh"><h2>トラストパーク 北6西15</h2><span class="tag">FREE</span><span class="free">空き 4 / 9</span></div>
    <div class="grid" id="trust"></div>
  </div>

  <div class="foot">TESLA-INSPIRED CONCEPT — 引き算の美学 / モノトーン + 1アクセント</div>
</div>

<script>
// 上から見たミニマルな車シルエット（白グレー・Tesla風）
function carSVG(color){return `<svg viewBox="0 0 90 52" width="76" height="44"><g fill="none" stroke="${color||'#cfd3d9'}" stroke-width="2.2" stroke-linejoin="round">
  <rect x="14" y="6" width="62" height="40" rx="13"/>
  <path d="M26 6 L30 18 L60 18 L64 6"/>
  <path d="M26 46 L30 34 L60 34 L64 46"/>
  <line x1="30" y1="26" x2="60" y2="26" stroke-width="1.4" opacity=".5"/>
</g></svg>`;}
const CARW=carSVG('#e5e8ec');
document.querySelector('.guide .car').outerHTML=`<span style="width:46px;flex:none">${carSVG('#9fb4ff')}</span>`;

const BIG=[
 {no:'172',nm:'アクセラ',pl:'8403',k:true},
 {no:'174',nm:'ノア',pl:'3382',k:false},
 {no:'200',nm:'ソリオ',pl:'8529',k:true,dep:true},
 {no:'221',nm:'ソリオ',pl:'6260',k:null},
 {no:'234',nm:'ロッキー',pl:'299',k:true},
 {no:'260',nm:'ヴェルファイア',pl:'3381',k:false},
 {no:'282',nm:'アルファード',pl:'7927',k:true},
];
const TRUST=[
 {nm:'CX-5',pl:'8065',k:true},{nm:'デリカD5',pl:'6057',k:true},{nm:'CX-3',pl:'4576',k:false},
 {nm:'ヴェルファイア',pl:'7673',k:null},{nm:'ノア',pl:'4014',k:true},
 {empty:true,reco:true},{empty:true},{empty:true},{empty:true},
];
function kchip(k){if(k===true)return '<span class="kchip kin">🔑 車内</span>';if(k===false)return '<span class="kchip kout">🚫 持出</span>';return '<span class="kchip kunk">❔ 未確認</span>';}
function tile(c,i){
  if(c.empty)return `<div class="spot empty${c.reco?' reco':''}">${c.reco?'<span class="crown">◆ おすすめ</span>':''}<span class="plus">＋ 入庫</span></div>`;
  return `<div class="spot${c.reco?' reco':''}">${c.dep?'<span class="depart"></span>':''}<span class="no">${c.no||''}</span>${carSVG(c.k===false?'#cfd3d9':'#e6e9ee')}<div class="nm">${c.nm}</div><div class="pl">${c.pl}</div><div class="st">${kchip(c.k)}</div></div>`;
}
document.getElementById('big').innerHTML=BIG.map(tile).join('');
document.getElementById('trust').innerHTML=TRUST.map(tile).join('');
</script>
</body>
</html>
