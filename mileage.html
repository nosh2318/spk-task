<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>走行距離リスト</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1c1a;--sub:#6b6862;--line:#e4e1da;--old:#b26a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#201f1e;--ink:#eceae5;--sub:#a29e96;--line:#34322f;--old:#e7a43a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 32px}
.bar{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.bar button{font:inherit;font-size:13px;padding:4px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.bar button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar .n{margin-left:auto;color:var(--sub);font-size:12px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:7px 10px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
th{border-top:0;font-size:12px;color:var(--sub);font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.nm{white-space:normal}
td .b{font-size:11px;color:var(--sub);margin-right:4px}
td.old{color:var(--old)}
#list{overflow-x:auto}
.msg{padding:24px;text-align:center;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
 <div class="bar" id="bar"></div>
 <div id="list"><div class="msg">読み込み中…</div></div>
</div>
<script>
// 走行距離リスト（店舗別）：表示だけ。DB には書かない。数字は各店の記録の中で日付が一番新しいもの。
var MAIN_URL='https://ckrxttbnawkclshczsia.supabase.co',MAIN_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
var BT_URL='https://ggqugvyskyiblxiycpci.supabase.co',BT_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18';
var ST={nha:['那覇',MAIN_URL,MAIN_ANON,'company_mileage',{p_store:'nha'}],spk:['札幌',MAIN_URL,MAIN_ANON,'company_mileage',{p_store:'spk'}],bt:['高松',BT_URL,BT_ANON,'bt_company_mileage',{}]};
var cur=new URLSearchParams(location.search).get('store');if(!ST[cur])cur='nha';
var one=!!new URLSearchParams(location.search).get('store');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function bar(n){document.getElementById('bar').innerHTML=(one?'':Object.keys(ST).map(function(k){return '<button data-s="'+k+'" class="'+(k===cur?'on':'')+'">'+ST[k][0]+'</button>';}).join(''))+'<span class="n">'+(n==null?'':n+'台')+'</span>';}
function load(){
 bar();document.getElementById('list').innerHTML='<div class="msg">読み込み中…</div>';
 var s=ST[cur];
 fetch(s[1]+'/rest/v1/rpc/'+s[3],{method:'POST',headers:{apikey:s[2],Authorization:'Bearer '+s[2],'Content-Type':'application/json'},body:JSON.stringify(s[4])})
 .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
 .then(function(a){
  if(!Array.isArray(a)||!a.length){document.getElementById('list').innerHTML='<div class="msg">車両がありません</div>';bar(0);return;}
  var today=new Date();
  var rows=a.map(function(v){
   var d=v.date?new Date(v.date+'T00:00:00+09:00'):null,old=d&&(today-d)/864e5>30;
   var ds=v.date?v.date.slice(0,4)+'/'+(+v.date.slice(5,7))+'/'+(+v.date.slice(8,10)):'—';
   return '<tr><td>'+esc(v.cls||'—')+'</td><td class="nm">'+(v.brand?'<span class="b">'+esc(v.brand)+'</span>':'')+esc(v.name)+'</td><td>'+esc(v.plate||'')+'</td><td class="r">'+(v.km?Number(v.km).toLocaleString()+' km':'—')+'</td><td class="r'+(old||!v.date?' old':'')+'">'+ds+'</td></tr>';
  }).join('');
  document.getElementById('list').innerHTML='<table><thead><tr><th>クラス</th><th>車両名</th><th>ナンバー</th><th class="r">走行距離</th><th class="r">更新日</th></tr></thead><tbody>'+rows+'</tbody></table>';
  bar(a.length);
 }).catch(function(){document.getElementById('list').innerHTML='<div class="msg">読み込めませんでした。再読込してください。</div>';});
}
document.getElementById('bar').addEventListener('click',function(e){var b=e.target.closest('[data-s]');if(b){cur=b.dataset.s;load();}});
load();
</script>
</body>
</html>
