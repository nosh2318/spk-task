<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>OTA設定</title>
<style>
:root{--bg:#f5f7fb;--fg:#0f172a;--mut:#64748b;--line:#cbd5e1;--ok:#166534;--okbg:#dcfce7;--ng:#991b1b;--ngbg:#fee2e2;--wait:#92400e;--waitbg:#fef3c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
header{background:#2f3b55;color:#fff;padding:12px 16px}header h1{margin:0;font-size:18px}
body.embed header{display:none}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin:0 0 12px}
h2{font-size:15px;margin:0 0 4px}
label{font-size:12px;font-weight:700;color:var(--mut)}
input{display:block;width:100%;margin-top:3px;padding:9px;border:1px solid var(--line);border-radius:6px;font-size:16px;color:var(--fg)}
button{border:none;background:#2563eb;color:#fff;border-radius:6px;padding:10px 16px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}button:disabled{background:#94a3b8;cursor:default}
.who{max-width:260px}
.row{display:grid;grid-template-columns:170px 1fr 1fr auto;gap:10px;align-items:end;padding:12px 0;border-top:1px solid #e2e8f0}
.name{font-weight:800;font-size:14px;align-self:center}
.state{margin-top:4px;font-size:12px;font-weight:400;color:var(--mut);line-height:1.5}
.st{display:inline-block;border-radius:4px;padding:1px 6px;font-weight:800;font-size:12px}.st.ok{background:var(--okbg);color:var(--ok)}.st.ng{background:var(--ngbg);color:var(--ng)}.st.wait{background:var(--waitbg);color:var(--wait)}
.msg{grid-column:1/-1;padding:8px 10px;border-radius:6px;font-size:13px}.msg.ok{background:var(--okbg);color:var(--ok)}.msg.ng{background:var(--ngbg);color:var(--ng)}
.note{font-size:12px;color:var(--mut);line-height:1.6;margin:6px 0 0}
.arow{display:grid;grid-template-columns:170px 1fr 1fr 1.4fr auto;gap:10px;align-items:end;padding:12px 0;border-top:1px solid #e2e8f0}
.arow .open{font-size:12px;font-weight:400}
.cp{display:flex;gap:6px;margin-top:3px}.cp input{margin-top:0;min-width:0}.cp .copy{width:auto;padding:0 10px;font-size:12px;background:#475569}
@media(max-width:720px){.row,.arow{grid-template-columns:1fr}.who{max-width:none}button{width:100%}}
</style></head><body>
<header><h1>OTA設定</h1></header>
<div class="wrap">
  <div class="card" id="login" hidden><div class="msg ng">業務アプリでログインしてから、もう一度開いてください。</div>
    <p class="note"><a href="./">業務アプリを開く</a></p></div>
  <div class="card" id="lock" hidden>
    <label class="who" style="display:block">暗証番号<input id="pin" type="password" inputmode="numeric" autocomplete="new-password"></label>
    <div style="margin-top:10px"><button id="unlock">解除</button></div>
    <div id="lockmsg" style="margin-top:10px"></div>
  </div>
  <div id="main" hidden>
    <div class="card"><label class="who" style="display:block">あなたの名前<input id="who" placeholder="例：山田" autocomplete="off"></label>
      <p class="note">楽天・じゃらん・エアトリ・スカイチケットは毎月初めにパス変更が必要です。ID・PASを変えて保存すると、在庫ロボへ自動で送ります。</p></div>
    <div id="acct"></div>
    <div class="card"><button id="addrow">行を追加</button></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB = window.supabase.createClient('https://ckrxttbnawkclshczsia.supabase.co', 'sb_publishable_aTVhlY0YD-5BBfI03ZNnsg_MzO_vsIe',
  { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
// 同じアカウントを使う店をまとめる。t は DB の invctl_cred_submit が受け付ける組
// 在庫ロボのキーチェーンは那覇・札幌・高松HDMで1項目を共有するので、HDMは nha へ1回送れば全店に効く
const HDM3 = o => ({ shops: '那覇・札幌・高松HDM', t: [['nha', o]] });
const HDM2 = o => ({ shops: '那覇・札幌', t: [['nha', o]] });
const BDC = o => ({ shops: '高松BUDDICA', t: [['takb', o]] });
const ROBOT = { 'HANDYMAN|楽天': HDM3('RKT'), 'HANDYMAN|じゃらん': HDM3('JLN'), 'HANDYMAN|スカイチケット': HDM2('SKT'),
  'HANDYMAN|エアトリ': HDM2('ART'), 'HANDYMAN|レンタカードットコム': { shops: '那覇', t: [['nha', 'RDC']] },
  'HANDYMAN|レンタカードットコム（札幌）': { shops: '札幌（HD02）', t: [['spk', 'RDC']] }, 'HANDYMAN|GoGoout': { shops: '那覇のみ', t: [] },
  'BUDDICA|BUDDICA/admin 入口': BDC('ADM'), 'BUDDICA|エアトリ': BDC('ART'), 'BUDDICA|たびらい': BDC('TAB'), 'BUDDICA|レンタカードットコム': BDC('RDC') };
// 月初にパス変更が必要なOTA
const MONTHLY = ['楽天', 'じゃらん', 'エアトリ', 'スカイチケット'];
const ym = t => new Date(t).toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: 'numeric' });
const DONE = ['ok', 'saved', 'saved_unverified'];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = t => new Date(t).toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric' });
if (new URLSearchParams(location.search).get('embed')) document.body.classList.add('embed');


// ID・パスと暗証はこのファイルに書かない。暗証の照合と復号はDB側で行い、暗証は開いている間だけメモリに持つ
let PIN = '';
const PIN_ERR = { bad_pin: '暗証番号が違います。', locked: '5回間違えたため、15分後にもう一度お試しください。', not_allowed: 'このログインでは開けません。', not_ready: '準備中です。' };
function acctRow(a) {
  const open = a.url ? `<a class="open" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">開く</a>` : '';
  const when = a.updated_at ? `${md(a.updated_at)} ${esc(a.updated_by || '')}` : '未入力';
  const r = ROBOT[a.grp + '|' + a.label] || {};
  return `<div class="arow" data-id="${a.id ?? ''}" data-grp="${esc(a.grp)}" data-lid="${esc(a.login_id)}" data-lpw="${esc(a.password)}" data-ts="${esc(a.updated_at || '')}">
    <label>OTA<input class="label" value="${esc(a.label)}" autocomplete="off"${r.t ? ' readonly' : ''}><div class="state">${esc(r.shops || '')}<br>${when}<br><span class="robot"></span></div></label>
    <label>ID<span class="cp"><input class="lid" value="${esc(a.login_id)}" autocomplete="off" spellcheck="false"><button type="button" class="copy" data-for="lid">コピー</button></span></label>
    <label>PAS<span class="cp"><input class="lpw" value="${esc(a.password)}" autocomplete="off" spellcheck="false"><button type="button" class="copy" data-for="lpw">コピー</button></span></label>
    <label>URL ${open}<input class="lurl" value="${esc(a.url)}" autocomplete="off" spellcheck="false"></label>
    <button class="save">保存</button>
    <div class="out" style="display:contents"></div>
  </div>`;
}
async function copyField(btn, input, ev) {
  ev.preventDefault();
  if (!input.value) return;
  let done = false;
  try { await navigator.clipboard.writeText(input.value); done = true; }
  catch (e) { input.select(); try { done = document.execCommand('copy'); } catch (e2) {} }
  const t = btn.textContent; btn.textContent = done ? '完了' : '失敗';
  setTimeout(() => { btn.textContent = t; }, 1200);
}
function bindRow(row) {
  row.querySelector('.save').onclick = () => saveRow(row);
  row.querySelectorAll('.copy').forEach(b => { b.onclick = ev => copyField(b, row.querySelector('.' + b.dataset.for), ev); });
}
// 札幌RDCは那覇と別アカウント。まだ行がなければ空の行を出す（保存した時に作られる）
const SPK_RDC = 'レンタカードットコム（札幌）';
function renderAcct(rows) {
  if (!rows.some(a => a.grp === 'HANDYMAN' && a.label === SPK_RDC)) {
    const i = rows.findIndex(a => a.grp === 'HANDYMAN' && a.label === 'レンタカードットコム');
    rows = rows.slice(); rows.splice(i < 0 ? rows.length : i + 1, 0, { id: null, grp: 'HANDYMAN', label: SPK_RDC, url: i < 0 ? '' : rows[i].url, login_id: '', password: '' });
  }
  // 管理画面ロボが入口で使う行。まだ無ければ空の行を出す（ID・PAS を入れて保存すると作られる）
  if (rows.some(a => a.grp === 'BUDDICA') && !rows.some(a => a.label === 'BUDDICA/admin 入口'))
    rows = [...rows, { id: null, grp: 'BUDDICA', label: 'BUDDICA/admin 入口', url: '', login_id: '', password: '' }];
  const grps = [...new Set(rows.map(a => a.grp))];
  $('acct').innerHTML = grps.map(g => `<div class="card"><h2>${esc(g)}</h2>${rows.filter(a => a.grp === g).map(acctRow).join('')}</div>`).join('');
  document.querySelectorAll('.arow').forEach(bindRow);
}
async function toRobot(targets, lid, lpw) {
  const k = await SB.rpc('invctl_cred_pubkeys'); if (k.error) throw k.error;
  if (!k.data.length) throw new Error('ロボの鍵がありません');
  const ciphers = [];
  for (const r of k.data) ciphers.push({ host: r.host, cipher: await seal(r.pem, lid ? JSON.stringify({ id: lid, pw: lpw }) : lpw) });
  for (const [s, o] of targets) {
    const r = await SB.rpc('invctl_cred_submit', { p_store: s, p_ota: o, p_ciphers: ciphers, p_name: $('who').value.trim() });
    if (r.error) throw r.error;
  }
}
async function saveRow(row) {
  const who = $('who').value.trim(), btn = row.querySelector('.save');
  if (!who) { say(row, '上の欄に名前を入れてください。'); $('who').focus(); return; }
  if (row.querySelector('.label').value.includes('レンタカードットコム') && (row.querySelector('.lid').value.trim().length > 10 || row.querySelector('.lpw').value.length > 10)) { say(row, 'レンタカードットコムは IDもパスも10文字までです。'); return; }
  btn.disabled = true;
  try {
    const r = await SB.rpc('ota_cfg_save', { p_pin: PIN, p_id: row.dataset.id ? Number(row.dataset.id) : null, p_grp: row.dataset.grp,
      p_label: row.querySelector('.label').value, p_url: row.querySelector('.lurl').value, p_login_id: row.querySelector('.lid').value,
      p_password: row.querySelector('.lpw').value, p_name: who, p_expected: row.dataset.ts || null });
    if (r.error) throw r.error;
    if (!r.data.ok) throw new Error(PIN_ERR[r.data.error] || (r.data.error === 'stale' ? '他の人が先に更新しました。開き直してください。' : r.data.error === 'bad_value' ? '入力内容を確認してください（URLは https:// から）。' : r.data.error));
    row.dataset.id = r.data.id; row.dataset.ts = r.data.updated_at;
    const lid = row.querySelector('.lid').value.trim(), lpw = row.querySelector('.lpw').value;
    const t = (ROBOT[row.dataset.grp + '|' + row.querySelector('.label').value] || {}).t || [];
    const changed = lpw !== row.dataset.lpw || lid !== row.dataset.lid;
    row.dataset.lid = lid; row.dataset.lpw = lpw;
    // BUDDICA 管理画面の入口（最初に出る小さなログイン窓）は 11/4 まで送り先が無かったので、変更が無くても保存のたびに送る（管理画面ロボが入口で使う）
    if (t.length && lpw && (changed || t.some(x => x[1] === 'ADM'))) { await toRobot(t, lid, lpw); say(row, t.some(x => x[1] === 'ADM') ? '保存して、管理画面ロボへ送りました。' : '保存して、在庫ロボへ送りました。', true); refresh(); }
    else say(row, '保存しました。', true);
  } catch (e) { say(row, '保存できませんでした：' + (e.message || e)); }
  btn.disabled = false;
}
async function unlock() {
  const pin = $('pin').value; $('unlock').disabled = true; $('lockmsg').innerHTML = '';
  try {
    const r = await SB.rpc('ota_cfg_list', { p_pin: pin });
    if (r.error) throw r.error;
    if (!r.data.ok) throw new Error(PIN_ERR[r.data.error] || r.data.error);
    PIN = pin; $('pin').value = ''; renderAcct(r.data.rows);
    $('lock').hidden = true; $('main').hidden = false; refresh(); setInterval(refresh, 10e3);
  } catch (e) { $('lockmsg').innerHTML = `<div class="msg ng">${esc(e.message || e)}</div>`; }
  $('unlock').disabled = false;
}
$('unlock').onclick = unlock;
$('pin').onkeydown = e => { if (e.key === 'Enter') unlock(); };
$('addrow').onclick = () => {
  const box = $('acct').querySelector('.card') || $('acct');
  box.insertAdjacentHTML('beforeend', acctRow({ id: null, grp: 'HANDYMAN', label: '', url: '', login_id: '', password: '' }));
  bindRow(box.lastElementChild);
};


try { $('who').value = localStorage.getItem('invctl_who') || ''; } catch (e) {}
$('who').oninput = () => { try { localStorage.setItem('invctl_who', $('who').value); } catch (e) {} };

const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
async function seal(pem, text) {
  const der = Uint8Array.from(atob(pem.replace(/-----[^-]+-----|\s/g, '')), c => c.charCodeAt(0));
  const key = await crypto.subtle.importKey('spki', der, { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
  return b64(await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, key, new TextEncoder().encode(text)));
}
function say(row, t, ok) { row.querySelector('.out').innerHTML = `<div class="msg ${ok ? 'ok' : 'ng'}">${esc(t)}</div>`; }


// 在庫ロボの状況を1行にまとめる（対象店のうち一番悪い状態を出す）
function robotLabel(rows, targets, monthly) {
  let parts = [], dates = [];
  for (const [s, o] of targets) {
    const live = rows.filter(x => x.store === s && x.ota === o && x.result !== 'replaced');
    const last = live[0], okRow = live.find(x => DONE.includes(x.result));
    if (last && !last.result) parts.push('wait');
    else if (last && !DONE.includes(last.result)) parts.push('ng');
    else if (!okRow) parts.push('none');
    if (okRow) dates.push(new Date(okRow.created_at).getTime());
  }
  if (parts.includes('ng')) return '<span class="st ng">❌ ロボがログイン失敗</span>';
  if (parts.includes('wait')) return '<span class="st wait">ロボ確認中</span>';
  if (parts.includes('none')) return monthly ? '<span class="st ng">今月未更新</span>' : '';
  const first = Math.min(...dates);
  if (monthly && ym(first) !== ym(Date.now())) return `<span class="st ng">今月未更新</span> 前回 ${md(first)}`;
  return `<span class="st ok">ロボ反映済み</span> ${md(first)}`;
}
async function refresh() {
  const r = await SB.rpc('invctl_cred_status', { p_store: null }); if (r.error) return;
  document.querySelectorAll('.arow').forEach(row => {
    const name = row.querySelector('.label').value, t = (ROBOT[row.dataset.grp + '|' + name] || {}).t || [];
    const el = row.querySelector('.robot'); if (el && t.length) el.innerHTML = robotLabel(r.data, t, MONTHLY.includes(name));
  });
}

(async () => {
  const { data } = await SB.auth.getSession();
  if (!data.session) { $('login').hidden = false; return; }
  $('lock').hidden = false; $('pin').focus();
})();
</script></body></html>
