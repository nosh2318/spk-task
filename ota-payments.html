<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>💰 OTA入金表（HDM 3店）</title>
<style>
:root{--nv:#0F1F45;--ac:#2563eb}
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;margin:0;background:#f4f6fb;color:#1f2937;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:14px}
h1{font-size:19px;margin:0 0 2px;color:var(--nv)}.sub{font-size:11.5px;color:#64748b;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}
.card{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 6px rgba(0,0,0,.06);border-top:3px solid var(--ac)}
.card .l{font-size:11px;color:#64748b}.card .v{font-size:22px;font-weight:800}.card .s{font-size:10.5px;color:#94a3b8}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;background:#fff;border-radius:10px;padding:10px 12px;box-shadow:0 1px 5px rgba(0,0,0,.05)}
.bar select,.bar input{padding:5px 8px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px}
.seg{display:inline-flex;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden}
.seg button{padding:6px 12px;border:none;background:#fff;cursor:pointer;font-size:12.5px;font-weight:600;color:#475569}
.seg button.on{background:var(--ac);color:#fff}
.sec{background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.06);margin-bottom:14px;overflow:hidden}
.sec h2{font-size:14px;margin:0;padding:11px 14px;background:#f1f5f9;color:var(--nv);border-bottom:1px solid #e2e8f0}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;font-size:12.5px;border-bottom:1px solid #f1f5f9;text-align:right;white-space:nowrap}
th{color:#475569;background:#f8fafc;text-align:right;position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
tr.grp{background:#eff6ff;font-weight:700}tr.grp td{color:var(--nv)}
tr.tot td{background:var(--nv);color:#fff;font-weight:800;font-size:13.5px}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:700}
.k-in{background:#dcfce7;color:#166534}.k-yo{background:#e0f2fe;color:#075985}.k-mi{background:#fee2e2;color:#991b1b}
.ov{overflow-x:auto}.mono{font-variant-numeric:tabular-nums}
.badge{font-size:10px;padding:1px 6px;border-radius:6px;background:#f1f5f9;color:#475569;margin-left:4px}
.note{font-size:11px;color:#64748b;padding:8px 14px;background:#fffbeb;border-top:1px solid #fde68a}
</style></head><body><div class="wrap">
<h1>💰 OTA入金表（HDM・那覇/札幌/高松）</h1>
<div class="sub" id="sub">読み込み中…</div>

<div class="bar">
 <span style="font-weight:700;font-size:12px">絞込</span>
 店舗<select id="fSt"><option value="">全て</option><option value="nha">🌺那覇</option><option value="spk">❄️札幌</option><option value="tkm">🍜高松</option></select>
 OTA<select id="fOta"><option value="">全て</option></select>
 状態<select id="fKind"><option value="">全て</option><option value="入金済">入金済</option><option value="予定">予定(OTA精算)</option><option value="未入金">未入金</option></select>
 <span style="border-left:1px solid #e2e8f0;padding-left:8px">OTA手数料<input id="fee" type="number" value="15" style="width:56px" min="0" max="50">% <span style="font-size:11px;color:#94a3b8">(自社0%)</span></span>
 <button id="rl" style="margin-left:auto;background:var(--ac);color:#fff;border:none;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer">🔄更新</button>
</div>

<div class="cards" id="cards"></div>

<div style="margin-bottom:12px"><span class="seg" id="view">
 <button data-v="month" class="on">📅 入金月別</button>
 <button data-v="store">🏬 店舗別</button>
 <button data-v="ota">🅾️ OTA別</button>
 <button data-v="matrix">🔢 月×OTA</button>
</span></div>

<div id="body"></div>

<div class="sec"><div class="note">
入金サイクル（台帳2026-05-17確定）：自社HP/SP=予約受付当月・0%／じゃらん=<b>当店Square集金＝実入金(paid_at)月</b>（未払いは「未入金」）／エアトリ・skyticket・RDドットコム・GoGoOut=返却月の翌月末／楽天=返却月の3ヶ月後末。OTA手数料は上のバーで調整可（実入金=売上×(1−手数料)）。高松はbrand=HDMのみ（BUDDICA/たびらいは対象外）。全予約を漏れなく計上。
</div></div>
</div>
<script>
const MAIN="https://ckrxttbnawkclshczsia.supabase.co",MANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
const BT="https://ggqugvyskyiblxiycpci.supabase.co",BANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18";
const rpc=(b,a,f)=>fetch(b+"/rest/v1/rpc/"+f,{method:"POST",headers:{apikey:a,Authorization:"Bearer "+a,"Content-Type":"application/json"},body:"{}"}).then(r=>r.json()).catch(_=>[]);
const STN={nha:"🌺那覇",spk:"❄️札幌",tkm:"🍜高松"};
const OTAORD=["自社/HP","じゃらん","楽天","エアトリ","skyticket","RDドットコム","GoGoOut"];
const yen=n=>"¥"+Math.round(n).toLocaleString();
let RAW=[];
function feeRate(ota){return ota==="自社/HP"?0:(Number(document.getElementById("fee").value)||0)/100;}
function net(r){return r.gross*(1-feeRate(r.ota));}
function filtered(){const s=document.getElementById("fSt").value,o=document.getElementById("fOta").value,k=document.getElementById("fKind").value;
 return RAW.filter(r=>(!s||r.store===s)&&(!o||r.ota===o)&&(!k||r.kind===k));}
function kchip(k){const c=k==="入金済"?"k-in":k==="予定"?"k-yo":"k-mi";return '<span class="chip '+c+'">'+k+'</span>';}
function agg(rows,keyfn){const m={};rows.forEach(r=>{const k=keyfn(r);(m[k]=m[k]||{cnt:0,gross:0,net:0,mi:0});m[k].cnt+=r.cnt;if(r.kind==="未入金"){m[k].mi+=r.gross;}else{m[k].gross+=r.gross;m[k].net+=net(r);}});return m;}
function cards(){const f=filtered();let g=0,nt=0,mi=0,c=0,cm=0;
 f.forEach(r=>{c+=r.cnt;if(r.kind==="未入金"){mi+=r.gross;}else{g+=r.gross;nt+=net(r);}});cm=g-nt;
 document.getElementById("cards").innerHTML=
 card("グロス売上",yen(g),c+"件（未入金除く）","#1e3a8a")+
 card("手数料",yen(cm),"OTA "+document.getElementById("fee").value+"%","#dc2626")+
 card("実入金(ネット)",yen(nt),"売上−手数料","#16a34a")+
 card("🔴未入金",yen(mi),"じゃらん未払い","#b45309");}
const card=(l,v,s,c)=>'<div class="card" style="border-top-color:'+c+'"><div class="l">'+l+'</div><div class="v mono">'+v+'</div><div class="s">'+s+'</div></div>';
function viewMonth(){const f=filtered().filter(r=>r.kind!=="未入金");const m=agg(f,r=>r.pay_month);
 const mi=filtered().filter(r=>r.kind==="未入金");
 const ks=Object.keys(m).sort().reverse();let h='<div class="sec"><h2>📅 入金月別（新しい順）</h2><div class="ov"><table><thead><tr><th>入金月</th><th>件数</th><th>グロス売上</th><th>手数料</th><th>実入金</th></tr></thead><tbody>';
 let tg=0,tn=0,tc=0;ks.forEach(k=>{const v=m[k];tg+=v.gross;tn+=v.net;tc+=v.cnt;
  h+='<tr><td>'+k+'</td><td class="mono">'+v.cnt+'</td><td class="mono">'+yen(v.gross)+'</td><td class="mono" style="color:#dc2626">-'+yen(v.gross-v.net)+'</td><td class="mono" style="font-weight:700">'+yen(v.net)+'</td></tr>';});
 h+='<tr class="tot"><td>合計（入金予定・確定）</td><td class="mono">'+tc+'</td><td class="mono">'+yen(tg)+'</td><td class="mono">-'+yen(tg-tn)+'</td><td class="mono">'+yen(tn)+'</td></tr>';
 if(mi.length){const g=mi.reduce((s,r)=>s+r.gross,0),c=mi.reduce((s,r)=>s+r.cnt,0);h+='<tr style="background:#fef2f2"><td>🔴 未入金（じゃらん未払い）</td><td class="mono">'+c+'</td><td class="mono" colspan=3 style="text-align:right;color:#991b1b;font-weight:700">'+yen(g)+'</td></tr>';}
 h+='</tbody></table></div></div>';document.getElementById("body").innerHTML=h;}
function viewGroup(keyfn,label,order){const f=filtered();const m=agg(f,keyfn);
 let ks=Object.keys(m);if(order)ks=order.filter(k=>m[k]);else ks.sort();
 let h='<div class="sec"><h2>'+label+'</h2><div class="ov"><table><thead><tr><th>'+label.replace(/^.. /,'')+'</th><th>件数</th><th>グロス売上</th><th>手数料</th><th>実入金</th><th>🔴未入金</th></tr></thead><tbody>';
 let tg=0,tn=0,tc=0,tm=0;ks.forEach(k=>{const v=m[k];tg+=v.gross;tn+=v.net;tc+=v.cnt;tm+=v.mi;
  h+='<tr><td>'+(STN[k]||k)+'</td><td class="mono">'+v.cnt+'</td><td class="mono">'+yen(v.gross)+'</td><td class="mono" style="color:#dc2626">-'+yen(v.gross-v.net)+'</td><td class="mono" style="font-weight:700">'+yen(v.net)+'</td><td class="mono" style="color:#b45309">'+(v.mi?yen(v.mi):"—")+'</td></tr>';});
 h+='<tr class="tot"><td>グロス合計</td><td class="mono">'+tc+'</td><td class="mono">'+yen(tg)+'</td><td class="mono">-'+yen(tg-tn)+'</td><td class="mono">'+yen(tn)+'</td><td class="mono">'+(tm?yen(tm):"—")+'</td></tr>';
 h+='</tbody></table></div></div>';document.getElementById("body").innerHTML=h;}
function viewMatrix(){const f=filtered().filter(r=>r.kind!=="未入金");
 const otas=OTAORD.filter(o=>f.some(r=>r.ota===o));const months=[...new Set(f.map(r=>r.pay_month))].sort().reverse();
 const cell={};f.forEach(r=>{const k=r.pay_month+"|"+r.ota;cell[k]=(cell[k]||0)+net(r);});
 let h='<div class="sec"><h2>🔢 入金月 × OTA（実入金ネット）</h2><div class="ov"><table><thead><tr><th>入金月</th>';
 otas.forEach(o=>h+='<th>'+o+'</th>');h+='<th>計</th></tr></thead><tbody>';
 const colT={};let gT=0;
 months.forEach(mn=>{let rt=0;h+='<tr><td>'+mn+'</td>';otas.forEach(o=>{const v=cell[mn+"|"+o]||0;rt+=v;colT[o]=(colT[o]||0)+v;h+='<td class="mono">'+(v?yen(v):"·")+'</td>';});gT+=rt;h+='<td class="mono" style="font-weight:700">'+yen(rt)+'</td></tr>';});
 h+='<tr class="tot"><td>計</td>';otas.forEach(o=>h+='<td class="mono">'+yen(colT[o]||0)+'</td>');h+='<td class="mono">'+yen(gT)+'</td></tr>';
 h+='</tbody></table></div></div>';document.getElementById("body").innerHTML=h;}
let VIEW="month";
function render(){cards();if(VIEW==="month")viewMonth();else if(VIEW==="store")viewGroup(r=>r.store,"🏬 店舗別",["nha","spk","tkm"]);else if(VIEW==="ota")viewGroup(r=>r.ota,"🅾️ OTA別",OTAORD);else viewMatrix();}
async function load(){document.getElementById("sub").textContent="読み込み中…";
 const [m,b]=await Promise.all([rpc(MAIN,MANON,"ota_settlement_v2"),rpc(BT,BANON,"bt_ota_settlement_v2")]);
 RAW=[].concat(Array.isArray(m)?m:[],Array.isArray(b)?b:[]);
 const otas=[...new Set(RAW.map(r=>r.ota))].sort((a,b)=>OTAORD.indexOf(a)-OTAORD.indexOf(b));
 document.getElementById("fOta").innerHTML='<option value="">全て</option>'+otas.map(o=>'<option>'+o+'</option>').join("");
 const tot=RAW.reduce((s,r)=>s+r.cnt,0);
 document.getElementById("sub").textContent="更新 "+new Date().toLocaleString("ja-JP")+"／全"+tot+"件（HDM・3店・全予約計上）";
 render();}
document.querySelectorAll("#view button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#view button").forEach(x=>x.classList.remove("on"));b.classList.add("on");VIEW=b.dataset.v;render();});
["fSt","fOta","fKind","fee"].forEach(id=>document.getElementById(id).addEventListener("input",render));
document.getElementById("rl").onclick=load;
load();
</script></body></html>
