<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>🌐 HP新規獲得サマリ｜札幌店</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f1f5f9;color:#0f172a;font-size:13px}
  .wrap{max-width:1180px;margin:0 auto;padding:12px}
  h1{font-size:16px;font-weight:900;margin:2px 0 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  h1 a{margin-left:auto;font-size:11px;font-weight:700;color:#7c3aed;text-decoration:none}
  .note{font-size:10.5px;color:#64748b;line-height:1.5;margin-bottom:10px}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .card h2{font-size:13px;font-weight:800;margin:0 0 8px;color:#4c1d95;display:flex;align-items:center;gap:6px}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid #eef2f6}
  th{background:#f8fafc;font-size:10.5px;color:#64748b;font-weight:700;position:sticky;top:0}
  td.l,th.l{text-align:left}
  tr:last-child td{border-bottom:none}
  tfoot td{font-weight:800;background:#faf5ff;border-top:2px solid #ddd6fe}
  .num{font-weight:700}
  .yen{color:#0f766e;font-weight:700}
  .cpa{color:#b45309;font-weight:800}
  .roas{color:#1d4ed8;font-weight:800}
  input.ad{width:92px;text-align:right;border:1.5px solid #cbd5e1;border-radius:7px;padding:4px 6px;font-size:12px;font-variant-numeric:tabular-nums}
  input.ad:focus{border-color:#7c3aed;outline:none;background:#faf5ff}
  .btn{border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:800;cursor:pointer;background:#7c3aed;color:#fff}
  .btn.g{background:#0f766e}
  .msg{font-size:11px;font-weight:700;margin-left:8px}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .mtx td,.mtx th{font-size:11px;padding:5px 7px}
  .mtx td.dep{color:#334155}
  .mtx td.zero{color:#cbd5e1}
  .mtx .diag{background:#f0fdf4}
  .kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .kpi{flex:1;min-width:120px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:8px 10px}
  .kpi .k{font-size:10px;color:#64748b;font-weight:700}
  .kpi .v{font-size:17px;font-weight:900;margin-top:2px}
  .warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:8px 10px;border-radius:8px;font-size:11.5px;font-weight:700}
  .sub{font-size:9px;color:#94a3b8;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌐 HP新規獲得サマリ <span style="font-size:11px;color:#64748b">❄️札幌店</span> <a href="index.html">🏠 管理APP</a></h1>
  <div class="note">
    <b>流通（発生月）ベース</b>＝予約が<b>入った月</b>で集計。「HP」＝公式サイト/直販（ota: HP・SP）・キャンセル除外。<br>
    ・獲得数/売上＝その月に発生したHP予約。CPA＝広告費÷獲得数／ROAS＝売上÷広告費。<br>
    ・<b>出発月分解</b>＝発生した予約が、実際に<b>どの月に出発（貸出）</b>するかを分解。売上も。<br>
    ・広告費は<b>手動入力</b>（保存で全端末共有）。※2026-02〜。
  </div>
  <div id="status" class="warn" style="display:none"></div>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <h2>📊 月次サマリ（流通＝発生月ベース）
      <button class="btn g" style="margin-left:auto" onclick="saveAd()">💾 広告費を保存</button><span id="msg" class="msg"></span>
    </h2>
    <div class="scroll"><table id="main"></table></div>
  </div>

  <div class="card">
    <h2>🗓 出発月 分解（発生月 × 出発月）</h2>
    <div class="sub" style="margin-bottom:6px">各セル＝件数（売上）。行＝予約が発生した月／列＝その予約が出発する月。緑＝発生月と同月出発。</div>
    <div class="scroll"><table id="mtx" class="mtx"></table></div>
  </div>
</div>
<script>
const SB='https://ckrxttbnawkclshczsia.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
const AD_KEY='hp_adspend_spk';
const START='2026-02';
function _sbToken(){try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.indexOf('sb-')===0&&key.indexOf('auth-token')>=0){let v=null;try{v=JSON.parse(localStorage.getItem(key));}catch(e){continue;}const t=(v&&v.access_token)||(v&&v.currentSession&&v.currentSession.access_token)||(v&&v.session&&v.session.access_token)||(Array.isArray(v)&&typeof v[0]==='string'?v[0]:null);if(t)return t;}}}catch(e){}return null;}
function H(){const t=_sbToken();return {apikey:ANON,Authorization:'Bearer '+(t||ANON),'Content-Type':'application/json'};}
const yen=n=>'¥'+Math.round(+n||0).toLocaleString();
const ym=s=>s?String(s).slice(0,7):'';
function months(a,b){const out=[];let[y,m]=a.split('-').map(Number);const[Y,M]=b.split('-').map(Number);while(y<Y||(y===Y&&m<=M)){out.push(y+'-'+String(m).padStart(2,'0'));m++;if(m>12){m=1;y++;}}return out;}
function revOf(r){const bp=+r.base_price||0,op=+r.option_price||0,d=+r.discount||0;return (bp>0||op>0)?Math.max(0,bp+op-d):(+r.price||0);}
function occYM(r){return ym(r.booked_at||r.created_at);}   // 発生月＝流通月
let AD={}, ROWS=[];

async function fetchAll(){
  let out=[],off=0;
  const q='select=id,ota,base_price,option_price,discount,price,created_at,lend_date,status&ota=in.(HP,SP)&status=neq.cancelled&order=id';
  while(true){
    const r=await fetch(SB+'/rest/v1/reservations?'+q+'&limit=1000&offset='+off,{headers:H()});
    if(!r.ok)throw new Error('取得失敗 '+r.status);
    const d=await r.json();out=out.concat(d);if(d.length<1000)break;off+=1000;
  }
  return out;
}
async function loadAd(){
  try{const r=await fetch(SB+'/rest/v1/app_settings?key=eq.'+AD_KEY+'&select=value',{headers:H()});const d=await r.json();if(d&&d[0]&&d[0].value){AD=JSON.parse(d[0].value)||{};}}catch(e){AD={};}
}
async function saveAd(){
  const msg=document.getElementById('msg');
  document.querySelectorAll('input.ad').forEach(i=>{const v=Math.round(+i.value||0);if(v>0)AD[i.dataset.ym]=v;else delete AD[i.dataset.ym];});
  try{
    const body=JSON.stringify([{key:AD_KEY,value:JSON.stringify(AD)}]);
    const r=await fetch(SB+'/rest/v1/app_settings?on_conflict=key',{method:'POST',headers:Object.assign({Prefer:'resolution=merge-duplicates,return=minimal'},H()),body});
    if(!r.ok)throw new Error(r.status);
    msg.textContent='✅ 保存しました';msg.style.color='#0f766e';render();
  }catch(e){msg.textContent='⚠️ 保存失敗（ログイン必須）';msg.style.color='#dc2626';}
  setTimeout(()=>{msg.textContent='';},2500);
}
function build(resv){
  const now=new Date();const curYM=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const occMonths=months(START,curYM);
  // 発生月→{count,rev, dep:{出発月:{count,rev}}}
  const M={};occMonths.forEach(m=>M[m]={count:0,rev:0,dep:{}});
  let depMin=curYM,depMax=START;
  resv.forEach(r=>{
    const o=occYM(r);if(!o||o<START)return;if(!M[o])return;
    const rev=revOf(r);M[o].count++;M[o].rev+=rev;
    const dm=ym(r.lend_date)||'—';
    if(!M[o].dep[dm])M[o].dep[dm]={count:0,rev:0};
    M[o].dep[dm].count++;M[o].dep[dm].rev+=rev;
    if(dm!=='—'){if(dm<depMin)depMin=dm;if(dm>depMax)depMax=dm;}
  });
  return {occMonths,M,depMonths:months(depMin<START?START:depMin, depMax<curYM?curYM:depMax)};
}
function render(){
  if(!ROWS.length)return;
  const {occMonths,M,depMonths}=BUILT;
  // KPI合計
  let tC=0,tR=0,tAd=0;occMonths.forEach(m=>{tC+=M[m].count;tR+=M[m].rev;tAd+=(+AD[m]||0);});
  const kpis=[['HP獲得(累計)',tC+'件'],['HP売上(累計)',yen(tR)],['広告費(累計)',yen(tAd)],['平均CPA',tC?yen(tAd/tC):'—'],['ROAS',tAd?(tR/tAd).toFixed(2)+'x':'—']];
  document.getElementById('kpis').innerHTML=kpis.map(k=>'<div class="kpi"><div class="k">'+k[0]+'</div><div class="v">'+k[1]+'</div></div>').join('');
  // メイン表
  let h='<thead><tr><th class="l">発生月</th><th>獲得数</th><th>売上</th><th>客単価</th><th>広告費(入力)</th><th>CPA</th><th>ROAS</th></tr></thead><tbody>';
  occMonths.forEach(m=>{
    const x=M[m],ad=+AD[m]||0;const cpa=x.count?ad/x.count:0,roas=ad?x.rev/ad:0;const adr=x.count?x.rev/x.count:0;
    h+='<tr><td class="l num">'+m+'</td><td class="num">'+x.count+'件</td><td class="yen">'+yen(x.rev)+'</td><td>'+yen(adr)+'</td>'
      +'<td><input class="ad" type="number" min="0" step="1000" data-ym="'+m+'" value="'+(ad||'')+'" placeholder="0"></td>'
      +'<td class="cpa">'+(ad&&x.count?yen(cpa):'—')+'</td><td class="roas">'+(ad?roas.toFixed(2)+'x':'—')+'</td></tr>';
  });
  h+='</tbody><tfoot><tr><td class="l">合計</td><td>'+tC+'件</td><td>'+yen(tR)+'</td><td>'+(tC?yen(tR/tC):'—')+'</td><td>'+yen(tAd)+'</td><td>'+(tAd&&tC?yen(tAd/tC):'—')+'</td><td>'+(tAd?(tR/tAd).toFixed(2)+'x':'—')+'</td></tr></tfoot>';
  document.getElementById('main').innerHTML=h;
  // 出発月分解マトリクス
  let mh='<thead><tr><th class="l">発生＼出発</th>';depMonths.forEach(d=>mh+='<th>'+d.slice(5)+'月</th>');mh+='<th>計</th></tr></thead><tbody>';
  occMonths.forEach(m=>{
    const x=M[m];mh+='<tr><td class="l num">'+m+'</td>';
    depMonths.forEach(d=>{const c=x.dep[d];if(c){mh+='<td class="dep'+(d===m?' diag':'')+'">'+c.count+'<div class="sub">'+yen(c.rev)+'</div></td>';}else{mh+='<td class="zero">·</td>';}});
    mh+='<td class="num">'+x.count+'<div class="sub">'+yen(x.rev)+'</div></td></tr>';
  });
  // 列合計（出発月ごとの計）
  mh+='</tbody><tfoot><tr><td class="l">計</td>';
  depMonths.forEach(d=>{let c=0,rv=0;occMonths.forEach(m=>{const cc=M[m].dep[d];if(cc){c+=cc.count;rv+=cc.rev;}});mh+='<td>'+(c||'·')+(c?'<div class="sub">'+yen(rv)+'</div>':'')+'</td>';});
  mh+='<td></td></tr></tfoot>';
  document.getElementById('mtx').innerHTML=mh;
}
let BUILT=null;
(async function(){
  const st=document.getElementById('status');
  if(!_sbToken()){st.style.display='block';st.textContent='⚠️ 管理APPにログインしてからこのページを開いてください（データはログイン必須）。';return;}
  try{
    await loadAd();
    const resv=await fetchAll();ROWS=resv;BUILT=build(resv);render();
  }catch(e){st.style.display='block';st.textContent='⚠️ 読み込みエラー: '+(e.message||e);}
})();
</script>
</body>
</html>
