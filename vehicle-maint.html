<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{font-family:-apple-system,"Hiragino Sans",sans-serif;margin:0;background:#f5f6f8;color:#222;font-size:14px}
header{background:#fff;padding:8px 12px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input,textarea{font:inherit}button{padding:5px 10px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
button.on{background:#1a56db;color:#fff;border-color:#1a56db}button.pri{background:#1a56db;color:#fff;border-color:#1a56db}
main{padding:10px;max-width:900px;margin:auto}
.row{background:#fff;border:1px solid #ddd;border-radius:8px;margin:6px 0;padding:8px 10px;cursor:pointer}
.row:hover{border-color:#1a56db}.t{font-weight:600}.s{color:#666;font-size:12px}
.tag{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;margin-right:3px;background:#eef}
.warn{background:#fde8e8;color:#b00}.ok{background:#e3f6e8;color:#176}.gray{background:#eee;color:#555}
.card{background:#fff;border:1px solid #ccc;border-radius:8px;padding:12px;margin:8px 0}
.card label{display:block;margin:8px 0 2px;font-size:12px;color:#555}.card input,.card select,.card textarea{width:100%;box-sizing:border-box;padding:6px;border:1px solid #bbb;border-radius:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.doc{display:flex;gap:6px;align-items:center;padding:4px 0;border-bottom:1px dashed #ddd}
#msg{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:9}
body{font-size:15px}main{max-width:1100px;padding:14px}
header{padding:10px 14px}header b{font-size:17px;margin-right:6px}
.row{padding:12px 14px;margin:8px 0}.row .t{font-size:16px;margin-bottom:6px}
.tag{font-size:13px;padding:3px 9px;margin:2px 4px 2px 0}
.card{padding:16px;margin:14px 0}.card>.t{font-size:16px;border-left:4px solid #1a56db;padding-left:8px;margin-bottom:10px}

button{padding:7px 14px}

.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:9px;background:#223;color:#fff;margin-right:6px;vertical-align:middle}
.login{background:#fff8e1;border:1px solid #f0c36d;border-radius:8px;padding:12px;margin:10px 0}.login input{padding:6px;margin:4px 6px 4px 0}
</style></head><body>
<header><b>車両整備</b>
<span id="stb"></span><span id="fb"></span><input id="q" placeholder="車名・ナンバー" style="padding:5px"></header>
<main id="m">読み込み中…</main><div id="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 齊藤さんの「車両整備」：那覇・札幌・高松を1画面で。車両ごとの車検証・請求書・整備履歴（オイル/タイヤ等）・アラート。
// 書くのは1アクション＝1行（車検証/履歴/請求書の追加・墓標）。アラートは保存せず開くたびに導出。走行距離は各店の既存の記録を読むだけ。
const MAINU='https://ckrxttbnawkclshczsia.supabase.co',MAINK='sb_publishable_aTVhlY0YD-5BBfI03ZNnsg_MzO_vsIe',BTU='https://ggqugvyskyiblxiycpci.supabase.co',BTK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18';
const CFG={spk:{n:'札幌',u:MAINU,k:MAINK,mt:'maintenance',vt:'vehicles',pre:''},nha:{n:'那覇',u:MAINU,k:MAINK,mt:'nha_maintenance',vt:'nha_vehicles',pre:''},bt:{n:'高松',u:BTU,k:BTK,mt:'bt_maintenance',vt:'bt_vehicles',pre:'bt_'}};
const ORDER=['nha','spk','bt'];
// 高松管理APPと同じ「ユーザー名→ログイン用メール」の対応
const BT_USER_MAP = {
  'oshita':    'oshita@bt.hdm',
  'takeyama':  'takeyama@bt.hdm',
  'saito-y':   'saito-y@bt.hdm',
  'toshima':   'toshima@bt.hdm',
  'saito-s':   'saito-s@bt.hdm',
  'hashisaka': 'hashisaka@bt.hdm',
  'takano':    'takano@bt.hdm',
  'higashitani':'higashitani@bt.hdm',
  'kumei':     'kumei@bt.hdm',
  'kurihara':  'kurihara@bt.hdm',
  'member':    'member@bt.hdm',
};
const btMail=u=>{u=(u||'').trim();return u.includes('@')?u:BT_USER_MAP[u]||'';};
const P=new URLSearchParams(location.search);let sf=CFG[P.get('store')]?P.get('store'):'all',cur='',flt='alert';
const CL={},client=s=>CL[CFG[s].u]||(CL[CFG[s].u]=window.supabase.createClient(CFG[s].u,CFG[s].k));
const tp=(s,p)=>p.replace(/^(maint_vehicle_docs|maint_service_log|maint_case_docs)/,m=>CFG[s].pre+m);
const ITEMS={oil:'オイル交換',oil_filter:'オイルフィルター',tire:'タイヤ交換',battery:'バッテリー',brake:'ブレーキ',wiper:'ワイパー',other:'その他'};
const DAYS_WARN=30,KM_WARN=1000,STATE_STALE=45;
const D={},NEED={}; // D[s]={VEHS,MTS,VDOCS,LOGS,STATE,INV}  NEED[s]=ログイン要
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t){const e=$('#msg');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500);}
const today=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const dd=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
async function tok(s){const{data}=await client(s).auth.getSession();return data&&data.session?data.session.access_token:null;}
async function sb(s,path,method,body,prefer){const t=await tok(s);if(!t)throw new Error('LOGIN');const r=await fetch(CFG[s].u+'/rest/v1/'+tp(s,path),{method:method||'GET',headers:{apikey:CFG[s].k,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:prefer||'return=representation'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,200));const x=await r.text();return x?JSON.parse(x):null;}
async function sbAll(s,p){let a=[];for(let o=0;o<50000;o+=1000){const x=await sb(s,p+'&limit=1000&offset='+o);a=a.concat(x||[]);if(!x||x.length<1000)break;}return a;}
const pick=(o,ks)=>{for(const k of ks)if(o[k])return String(o[k]).slice(0,10);return '';};
async function mileage(s){const r=await fetch(CFG[s].u+'/rest/v1/rpc/'+(s==='bt'?'bt_company_mileage':'company_mileage'),{method:'POST',headers:{apikey:CFG[s].k,Authorization:'Bearer '+CFG[s].k,'Content-Type':'application/json'},body:JSON.stringify(s==='bt'?{}:{p_store:s})});if(!r.ok)throw new Error('走行距離を読めません HTTP '+r.status);const a=await r.json();return Array.isArray(a)?a:[];}
async function loadStore(s){
  const [vs,mts,vd,lg,mi,ds]=await Promise.all([
    sbAll(s,CFG[s].vt+'?select=*&order=code.asc'),
    sbAll(s,CFG[s].mt+'?select=id,vehicle_code,start_date,end_date,label,workshop,work_detail,actual_cost,status&order=start_date.desc,id.asc'),
    sbAll(s,'maint_vehicle_docs?select=*&deleted=eq.false&order=created_at.desc'),
    sbAll(s,'maint_service_log?select=*&deleted=eq.false&order=done_date.desc,created_at.desc'),
    mileage(s),
    sbAll(s,'maint_case_docs?select=*&store=eq.'+s+'&kind=eq.invoice&deleted=eq.false&order=created_at.asc')]);
  const d={VEHS:vs.filter(v=>v.active!==false&&v.deleted!==true),MTS:mts,VDOCS:vd,LOGS:lg,STATE:{},INV:{}};
  mi.forEach(m=>{if(m.code)d.STATE[m.code]={odometer_km:m.km,odometer_at:m.date};});
  ds.forEach(x=>(d.INV[x.maint_id]=d.INV[x.maint_id]||[]).push(x));
  D[s]=d;NEED[s]=false;}
async function loadAll(only){
  const list=only?[only]:ORDER;
  const rs=await Promise.allSettled(list.map(loadStore));
  rs.forEach((r,i)=>{const s=list[i];if(r.status==='rejected'){NEED[s]=r.reason&&r.reason.message==='LOGIN'?'login':String(r.reason&&r.reason.message||r.reason);delete D[s];}});}
// ---- アラート導出（保存しない） ----
function alerts(s,v){const A=[],T=today(),d=D[s],code=v.code,odo=(d.STATE[code]||{}).odometer_km;
  if(!d.VDOCS.some(x=>x.vehicle_code===code&&x.kind==='shaken_cert'))A.push({lv:1,t:'車検証が未登録'});
  const due=pick(v,['inspection_due_date','inspectionDueDate']);
  if(!due)A.push({lv:1,t:'車検期日が未登録'});else{const n=dd(due,T);if(n<0)A.push({lv:2,t:'車検期日 超過（'+due+'）'});else if(n<=DAYS_WARN)A.push({lv:1,t:'車検期日まで'+n+'日（'+due+'）'});}
  const td=pick(v,['tenken_due_date','tenkenDueDate']);
  if(!td)A.push({lv:0,t:'半年点検の期限が未登録'});else{const n=dd(td,T);if(n<0)A.push({lv:2,t:'半年点検 期限超過（'+td+'）'});else if(n<=DAYS_WARN)A.push({lv:1,t:'半年点検まで'+n+'日（'+td+'）'});}
  for(const it of Object.keys(ITEMS)){if(it==='other')continue;
    const last=d.LOGS.find(l=>l.vehicle_code===code&&l.item===it);if(!last)continue;
    if(last.next_due_date){const n=dd(last.next_due_date,T);if(n<0)A.push({lv:2,t:ITEMS[it]+' 期限超過（'+last.next_due_date+'）'});else if(n<=DAYS_WARN)A.push({lv:1,t:ITEMS[it]+' まであと'+n+'日'});}
    if(last.next_due_km!=null){if(odo==null)A.push({lv:0,t:ITEMS[it]+'：走行距離が未登録のため km 判定不可'});else{const r=last.next_due_km-odo;if(r<0)A.push({lv:2,t:ITEMS[it]+' '+(-r)+'km 超過'});else if(r<=KM_WARN)A.push({lv:1,t:ITEMS[it]+' あと'+r+'km'});}}}
  return A;}
const lvTag=a=>'<span class="tag '+(a.lv>=2?'warn':a.lv==1?'':'gray')+'" style="'+(a.lv==1?'background:#fff3cd;color:#8a6d00':'')+'">'+esc(a.t)+'</span>';
const badge=s=>'<span class="badge">'+CFG[s].n+'</span>';
function loginBox(){let h='';
  if(NEED.bt==='login')h+='<div class="login"><b>高松を表示するには、高松のログインが必要です</b><div class="s">高松管理APPと同じユーザー名（例：saito-s）とパスワードを入れてください（この画面に一度だけ。以降は自動）</div><input id="bte" type="text" placeholder="ユーザー名" autocomplete="username"><input id="btp" type="password" placeholder="パスワード" autocomplete="current-password"><button class="pri" onclick="btLogin()">ログイン</button></div>';
  ['nha','spk'].forEach(s=>{});
  if(NEED.nha==='login'||NEED.spk==='login')h+='<div class="login">那覇・札幌を表示するには、管理APPで一度ログインしてから開いてください。</div>';
  ORDER.forEach(s=>{if(NEED[s]&&NEED[s]!=='login')h+='<div class="login">'+CFG[s].n+'を読み込めませんでした：'+esc(NEED[s])+'</div>';});
  return h;}
async function btLogin(){try{if(!btMail($('#bte').value))throw new Error('ユーザー名が違います（例：saito-s）');const {error}=await client('bt').auth.signInWithPassword({email:btMail($('#bte').value),password:$('#btp').value});if(error)throw new Error('ログインできませんでした（ユーザー名／パスワードを確認）');msg('ログインしました');await loadAll('bt');render();}catch(e){msg(e.message);}}
function render(){
  $('#stb').innerHTML=['all'].concat(ORDER).map(s=>'<button class="'+(s===sf?'on':'')+'" onclick="sf=\''+s+'\';cur=\'\';render()">'+(s==='all'?'全店':CFG[s].n)+'</button>').join('');
  $('#fb').innerHTML=[['alert','要対応のみ'],['all','全車']].map(f=>'<button class="'+(f[0]===flt?'on':'')+'" onclick="flt=\''+f[0]+'\';cur=\'\';render()">'+f[1]+'</button>').join('');
  if(cur){const [s,code]=cur.split(':');const v=D[s]&&D[s].VEHS.find(x=>x.code===code);if(v)return detail(s,v);}
  const q=$('#q').value.trim();let list=[];
  ORDER.forEach(s=>{if(!D[s]||(sf!=='all'&&sf!==s))return;D[s].VEHS.forEach(v=>list.push({s,v,A:alerts(s,v)}));});
  if(q)list=list.filter(({v})=>((v.name||'')+(v.plate_no||'')+v.code).includes(q));
  if(flt==='alert')list=list.filter(x=>x.A.some(a=>a.lv>=1));
  list.sort((a,b)=>Math.max(0,...b.A.map(x=>x.lv))-Math.max(0,...a.A.map(x=>x.lv)));
  $('#m').innerHTML=loginBox()+'<div class="s">'+list.length+'台'+(flt==='alert'?'（要対応）':'')+'</div>'+(list.map(({s,v,A})=>'<div class="row" onclick="cur=\''+s+':'+esc(v.code)+'\';render()"><div class="t">'+badge(s)+esc(v.name||v.code)+' '+esc(v.plate_no||'')+'</div><div>'+(A.length?A.map(lvTag).join(''):'<span class="tag ok">問題なし</span>')+'</div></div>').join('')||'<div class="card">該当なし</div>');}
function detail(s,v){const code=v.code,d=D[s],A=alerts(s,v),st=d.STATE[code]||{};
  const vd=d.VDOCS.filter(x=>x.vehicle_code===code&&x.kind==='shaken_cert');
  const mts=d.MTS.filter(m=>m.vehicle_code===code);
  const lg=d.LOGS.filter(l=>l.vehicle_code===code);
  const docRow=(x,del)=>'<div class="doc"><a href="#" onclick="openDoc(\''+s+'\',\''+x.path+'\');return false">'+esc(x.filename||x.path)+'</a><span class="s">'+esc((x.created_at||'').slice(0,10))+'</span>'+(del?'<button onclick="'+del+'(\''+s+'\',\''+x.id+'\')">外す</button>':'')+'</div>';
  let h='<button onclick="cur=\'\';render()">← 一覧へ</button><div class="card"><div class="t">'+badge(s)+esc(v.name||code)+' '+esc(v.plate_no||'')+'</div><div>'+(A.length?A.map(lvTag).join(''):'<span class="tag ok">問題なし</span>')+'</div></div>';
  h+='<div class="card"><div class="t">車検証</div>'+(vd.map(x=>docRow(x,'delVDoc')).join('')||'<div class="s">未登録</div>')+'<div class="s" style="margin-top:6px">差し替える時は新しい画像/PDFを追加してください（古いものは外すまで残ります）</div><input type="file" id="vf" accept="image/*,application/pdf"> <button class="pri" onclick="upVDoc(\''+s+'\',\''+esc(code)+'\')">追加</button></div>';
  h+='<div class="card"><div class="t">現在の走行距離</div><div>'+(st.odometer_km==null?'未登録':Number(st.odometer_km).toLocaleString()+' km')+(st.odometer_at?' <span class="s">（'+esc(st.odometer_at)+' 更新）</span>':'')+'</div><div class="s">各店の走行距離の記録から自動で表示します（ここでは入力しません）</div></div>';
  h+='<div class="card"><div class="t">整備履歴（オイル・タイヤなど）</div>'+(lg.map(l=>'<div class="doc"><span class="tag">'+esc(ITEMS[l.item]||l.item)+'</span><span>'+esc(l.done_date)+(l.odometer_km!=null?' / '+l.odometer_km+'km':'')+(l.next_due_date||l.next_due_km!=null?' → 次回 '+esc(l.next_due_date||'')+(l.next_due_km!=null?' '+l.next_due_km+'km':''):'')+(l.note?' / '+esc(l.note):'')+'</span><button onclick="delLog(\''+s+'\',\''+l.id+'\')">外す</button></div>').join('')||'<div class="s">記録なし</div>')
   +'<div class="g2" style="margin-top:8px"><div><label>項目</label><select id="l_item">'+Object.keys(ITEMS).map(k=>'<option value="'+k+'">'+ITEMS[k]+'</option>').join('')+'</select></div><div><label>実施日</label><input id="l_date" type="date" value="'+today()+'"></div><div><label>その時の走行距離 km</label><input id="l_km" type="number" min="0"></div><div><label>メモ</label><input id="l_note"></div><div><label>次回の目安（日付）</label><input id="l_nd" type="date"></div><div><label>次回の目安（km）</label><input id="l_nk" type="number" min="0"></div></div><button class="pri" style="margin-top:6px" onclick="addLog(\''+s+'\',\''+esc(code)+'\')">履歴を追加</button></div>';
  h+='<div class="card"><div class="t">車検・点検ごとの請求書</div>'+(mts.map(m=>{const ds=d.INV[m.id]||[];return '<div style="border-bottom:1px solid #eee;padding:6px 0"><div><b>'+esc(m.start_date)+'</b> '+esc(m.label||'')+' '+esc(m.workshop||'')+(m.actual_cost?' / '+m.actual_cost+'円':'')+' '+(ds.length?'':'<span class="tag warn">請求書なし</span>')+'</div>'+(m.work_detail?'<div class="s">整備内容：'+esc(m.work_detail)+'</div>':'')+ds.map(x=>docRow(x,'delInv')).join('')+'<input type="file" id="if_'+esc(m.id)+'" accept="image/*,application/pdf"> <button onclick="upInv(\''+s+'\',\''+esc(m.id)+'\')">請求書を追加</button></div>';}).join('')||'<div class="s">整備案件なし</div>')+'<div class="s" style="margin-top:6px">請求書に書かれたオイル・タイヤ等の内容は、上の「整備履歴」に転記してください</div></div>';
  $('#m').innerHTML=h;}
async function putFile(s,path,f){if(!f)throw new Error('ファイルを選んでください');if(f.size>10485760)throw new Error('10MBまでです');const t=await tok(s);
  const r=await fetch(CFG[s].u+'/storage/v1/object/maint-docs/'+path,{method:'POST',headers:{apikey:CFG[s].k,Authorization:'Bearer '+t,'Content-Type':f.type||'application/octet-stream'},body:f});if(!r.ok)throw new Error('アップロード失敗 '+r.status);}
const extOf=f=>(f.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').slice(0,5);
async function upVDoc(s,code){try{const f=$('#vf').files[0];const path=s+'/veh/'+code+'/'+Date.now()+'.'+extOf(f||{name:'x'});await putFile(s,path,f);
  const x=await sb(s,'maint_vehicle_docs','POST',{store:s,vehicle_code:code,kind:'shaken_cert',path,filename:f.name});D[s].VDOCS.unshift(x[0]);msg('登録しました');render();}catch(e){msg(e.message);}}
async function delVDoc(s,id){if(!confirm('この車検証を一覧から外しますか？（ファイルは残ります）'))return;try{await sb(s,'maint_vehicle_docs?id=eq.'+id,'PATCH',{deleted:true,deleted_at:new Date().toISOString()});D[s].VDOCS=D[s].VDOCS.filter(x=>x.id!==id);render();}catch(e){msg(e.message);}}
async function upInv(s,mid){try{const f=$('#if_'+mid).files[0];const path=s+'/'+mid+'/'+Date.now()+'.'+extOf(f||{name:'x'});await putFile(s,path,f);
  const x=await sb(s,'maint_case_docs','POST',{store:s,maint_id:mid,kind:'invoice',path,filename:f.name});(D[s].INV[mid]=D[s].INV[mid]||[]).push(x[0]);msg('登録しました');render();}catch(e){msg(e.message);}}
async function delInv(s,id){if(!confirm('この請求書を一覧から外しますか？（ファイルは残ります）'))return;try{await sb(s,'maint_case_docs?id=eq.'+id,'PATCH',{deleted:true,deleted_at:new Date().toISOString()});const I=D[s].INV;for(const k in I)I[k]=I[k].filter(x=>x.id!==id);render();}catch(e){msg(e.message);}}
async function openDoc(s,path){try{const t=await tok(s);const r=await fetch(CFG[s].u+'/storage/v1/object/sign/maint-docs/'+path,{method:'POST',headers:{apikey:CFG[s].k,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:300})});const j=await r.json();if(!j.signedURL)throw new Error('開けません');window.open(CFG[s].u+'/storage/v1'+j.signedURL,'_blank');}catch(e){msg(e.message);}}
async function addLog(s,code){try{const b={store:s,vehicle_code:code,item:$('#l_item').value,done_date:$('#l_date').value};if(!b.done_date)return msg('実施日を入れてください');
  const km=$('#l_km').value,nd=$('#l_nd').value,nk=$('#l_nk').value,nt=$('#l_note').value.trim();if(km!=='')b.odometer_km=+km;if(nd)b.next_due_date=nd;if(nk!=='')b.next_due_km=+nk;if(nt)b.note=nt;
  const x=await sb(s,'maint_service_log','POST',b);const L=D[s].LOGS;L.unshift(x[0]);L.sort((a,c)=>(c.done_date>a.done_date)-(c.done_date<a.done_date));msg('追加しました');render();}catch(e){msg(e.message);}}
async function delLog(s,id){if(!confirm('この履歴を外しますか？'))return;try{await sb(s,'maint_service_log?id=eq.'+id,'PATCH',{deleted:true,deleted_at:new Date().toISOString()});D[s].LOGS=D[s].LOGS.filter(l=>l.id!==id);render();}catch(e){msg(e.message);}}
$('#q').oninput=()=>{if(!cur)render();};
loadAll().then(render).catch(e=>{$('#m').innerHTML='<div class="card">エラー: '+esc(e.message)+'</div>';});
</script></body></html>
