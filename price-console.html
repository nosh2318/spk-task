<!DOCTYPE html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>価格コンソール（那覇 初版）</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#f1f5f9;color:#0f172a;font-size:14px}
header{background:#0f1f45;color:#fff;padding:12px 16px;position:sticky;top:0;z-index:30}
header h1{margin:0;font-size:16px}
header .sub{font-size:11px;color:#a9b6d6;margin-top:2px}
.wrap{max-width:1180px;margin:0 auto;padding:12px}
.topbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.storesel{display:flex;gap:6px}
.storesel button{padding:7px 14px;border:none;border-radius:8px;background:#e2e8f0;font-weight:700;cursor:pointer;font-size:13px}
.storesel button.on{background:#e11d48;color:#fff}
.maintabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.maintab{padding:9px 14px;border:none;border-radius:9px;background:#e2e8f0;font-weight:700;font-size:13px;cursor:pointer}
.maintab.on{background:#0f1f45;color:#fff}
.card{background:#fff;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:6px}
.muted{color:#64748b;font-size:12px;line-height:1.7}
.authbar{font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:8px;font-weight:700}
.authbar.ok{background:#dcfce7;color:#166534}
.authbar.ng{background:#fee2e2;color:#991b1b}
.err{color:#b91c1c;font-weight:700;font-size:12px;margin:6px 0;white-space:pre-wrap}
.otatabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.otatab{padding:6px 12px;border:1px solid #cbd5e1;border-radius:16px;background:#fff;font-weight:700;font-size:12px;cursor:pointer}
.otatab.on{background:#0f766e;color:#fff;border-color:#0f766e}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.pg{border-collapse:separate;border-spacing:0;font-size:12px;min-width:760px}
table.pg th,table.pg td{border-bottom:1px solid #eef2f7;border-right:1px solid #eef2f7;padding:5px 6px;text-align:center;white-space:nowrap}
table.pg thead th{position:sticky;top:0;background:#f1f5f9;color:#334155;font-weight:800;z-index:5}
table.pg td.cls,table.pg th.cls{position:sticky;left:0;background:#fbfdff;text-align:left;font-weight:800;z-index:6;min-width:120px}
table.pg thead th.cls{z-index:7}
table.pg td.tier{text-align:left;font-weight:700;min-width:120px}
table.pg td.tier small{font-weight:500;color:#64748b}
td.cell{cursor:pointer;min-width:84px}
td.cell.base{background:#fff}
td.cell.low{background:#eff6ff}
td.cell.high{background:#fff7ed}
td.cell.changed{outline:2px solid #0f766e;outline-offset:-2px}
td.cell.err{background:#fee2e2;color:#b91c1c}
td.cell.linked{cursor:not-allowed;background:#f5f3ff}
td.cell.linked .chg{color:#6d28d9}
td.ro.err{background:#fee2e2;color:#b91c1c}
td.cell .amt{font-variant-numeric:tabular-nums;font-size:14px;font-weight:700}
td.cell .chg{display:block;font-size:9px;color:#0f766e;font-weight:700}
td.ro{background:#f8fafc;color:#64748b;font-variant-numeric:tabular-nums}
td.meta{font-size:10px;color:#64748b}
input.celled{width:82px;padding:5px;border:2px solid #0f766e;border-radius:5px;text-align:right;font-size:14px}
input.mark{width:44px;padding:4px;border:1px solid #cbd5e1;border-radius:5px;text-align:center;font-size:12px}
.btn{padding:9px 14px;border:none;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer}
.btn.save{background:#0f1f45;color:#fff}
.btn.ghost{background:#e2e8f0;color:#0f172a}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}
.ftable{width:100%;border-collapse:collapse;font-size:13px}
.ftable th,.ftable td{padding:6px 7px;border-bottom:1px solid #eef2f7;text-align:left}
.ftable th{background:#f1f5f9;color:#334155;font-weight:800;font-size:12px}
.ftable input,.ftable select{padding:6px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px}
.ftable input[type=number]{text-align:right;width:92px}
.ftable input[type=date]{width:140px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;z-index:200;opacity:0;transition:.3s;max-width:90%}
.toast.on{opacity:1}
.toast.bad{background:#b91c1c}
.phd{padding:30px;text-align:center;color:#94a3b8;font-weight:700}
.empty{padding:20px;text-align:center;color:#94a3b8}
.legend{font-size:11px;color:#64748b;margin:4px 0;display:flex;gap:12px;flex-wrap:wrap}
.legend span b{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:3px}
.cmptbl{border-collapse:collapse;font-size:12px;min-width:620px}
.cmptbl th,.cmptbl td{border:1px solid #e5eaf1;padding:5px 7px;text-align:right;white-space:nowrap}
.cmptbl th{background:#f1f5f9;font-weight:800}
.cmptbl td.l,.cmptbl th.l{text-align:left}
.diag{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:300;display:none;align-items:center;justify-content:center;padding:16px}
.diag.on{display:flex}
.diag .box{background:#fff;border-radius:12px;padding:18px;max-width:420px;width:100%}
.diag h3{margin:0 0 8px;font-size:15px}
.diag .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
label.inl{font-size:12px;color:#64748b;display:flex;flex-direction:column;gap:3px}
.logfilter{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
.pill{font-size:10px;font-weight:800;padding:1px 6px;border-radius:10px}
.pill.manual{background:#e0e7ff;color:#3730a3}
.pill.other{background:#f1f5f9;color:#64748b}
.warn{color:#b45309;font-weight:700}
</style></head><body>
<header>
  <h1>価格コンソール</h1>
  <div class="sub">pc_* テーブル専用。フェーズ②＝那覇のみ初版（既存の価格設定・公式価格には触れません）</div>
</header>
<div class="wrap">
  <div class="topbar">
    <div class="storesel">
      <button class="on" id="store_nha" onclick="void 0">🌺 那覇</button>
      <button disabled title="後続フェーズ">❄️ 札幌</button>
      <button disabled title="後続フェーズ">🍜 高松</button>
    </div>
    <span class="muted">店＝<b>nha 固定</b>（この版）</span>
    <button class="btn ghost sm" style="margin-left:auto" onclick="reloadAll()">🔄 再読込</button>
  </div>
  <div id="authbar"></div>
  <div class="maintabs" id="maintabs"></div>
  <div id="body"><div class="phd">読み込み中…</div></div>
</div>
<div class="toast" id="toast"></div>
<div class="diag" id="diag"><div class="box" id="diagbox"></div></div>
<script>
// ===== 接続（price-controller.html と同一の MAIN url/anon/localStorageキー） =====
var MAIN={url:'https://ckrxttbnawkclshczsia.supabase.co',anon:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8',key:'sb-ckrxttbnawkclshczsia-auth-token'};
var STORE='nha';
// classes テーブルの store 識別子はフルネーム。STORE(短縮)→classesの store_id/store 値へ変換。
var STORE_FULL={nha:'naha',spk:'sapporo',tkm:'takamatsu'};
function storeFull(){return STORE_FULL[STORE]||STORE;}
// 車種名はコードに直書きしない：classes から読めた時だけ補い、読めなければコードのみ表示。
var NIGHTS=[['日帰り',1],['1泊2日',2],['2泊3日',3],['3泊4日',4],['4泊5日',5]];

// ---- 認証トークン（localStorage）。無ければ書込無効 ----
function tok(){try{var t=JSON.parse(localStorage.getItem(MAIN.key));if(t&&t.access_token&&(!t.expires_at||t.expires_at>Math.floor(Date.now()/1000)))return t.access_token;}catch(e){}return null;}
function authed(){return !!tok();}
function authH(){var t=tok();return 'Bearer '+(t||MAIN.anon);}

async function req(method,path,body,prefer){
  var o={method:method,headers:{apikey:MAIN.anon,Authorization:authH(),'Content-Type':'application/json'}};
  if(prefer)o.headers.Prefer=prefer;
  if(body!==undefined)o.body=JSON.stringify(body);
  var r,t;
  try{r=await fetch(MAIN.url+'/rest/v1/'+path,o);t=await r.text();}
  catch(e){return {ok:false,status:0,data:null,err:'通信エラー: '+e.message};}
  var data=null;try{data=t?JSON.parse(t):null;}catch(e){data=t;}
  return {ok:r.ok,status:r.status,data:data,err:r.ok?null:(typeof data==='object'&&data&&(data.message||data.hint)?((data.message||'')+(data.hint?' / '+data.hint:'')):('HTTP '+r.status+(t?': '+t:'')))};
}

function toast(m,bad){var t=document.getElementById('toast');t.textContent=m;t.className='toast on'+(bad?' bad':'');setTimeout(function(){t.className='toast';},2600);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function yen(n){return (n==null||n==='')?'—':'¥'+(+n).toLocaleString();}
function jst(ts){if(!ts)return '';var d=new Date(ts);if(isNaN(d))return ts;d=new Date(d.getTime()+9*3600*1000);return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate())+' '+p2(d.getUTCHours())+':'+p2(d.getUTCMinutes());}
function p2(n){return ('0'+n).slice(-2);}

// ===== 全データ保持 =====
var D={classes:[],store_class:[],store_ota:[],ota:[],tier:[],month_tier:[],price:{},rule:[],floor:[],setting:{},log:[]};
var TAB='price'; // price / rule / master / log / ph
var OTA='__all'; // 価格表で選択中のOTA（__all=全OTA比較）

// 段の既定並び：基本(L,R,H) → 安い日 → 高い日。pc_tier.sort を尊重。
function tiersSorted(){
  var t=D.tier.slice();
  var kindOrder={base:0,low:1,high:2};
  t.sort(function(a,b){var ka=kindOrder[a.kind]!=null?kindOrder[a.kind]:9,kb=kindOrder[b.kind]!=null?kindOrder[b.kind]:9;if(ka!==kb)return ka-kb;return (a.sort||0)-(b.sort||0);});
  return t;
}
// クラスの「コード一覧」は pc_store_class ＋ pc_price（と classes が読めた時）から構築。
// classes はログイン必須（anonでは0件）→ 未ログイン時でもコードは pc_* から出す。pc_store_class.sort で並べる。
function classList(){
  var scMap={};D.store_class.forEach(function(r){scMap[r.class]=r;});
  var codes={};
  D.classes.forEach(function(c){var code=clsCode(c);if(code)codes[code]=1;});
  D.store_class.forEach(function(r){codes[r.class]=1;});
  Object.keys(D.price).forEach(function(k){var cl=k.split('|')[1];if(cl)codes[cl]=1;});
  var arr=Object.keys(codes);
  arr.sort(function(a,b){var sa=scMap[a]?(scMap[a].sort||0):999,sb=scMap[b]?(scMap[b].sort||0):999;if(sa!==sb)return sa-sb;return a<b?-1:1;});
  return arr;
}
// classes 行からクラスコードを取り出す（列名ゆれに耐える）
function clsCode(c){return c.class||c.code||c.class_code||c.id||c.name||null;}
// 表示名(車種)は classes から読めたときだけ。読めなければ空（コードだけ表示＝車種名を直書きしない）。
function clsCarLabel(code){
  var hit='';
  D.classes.forEach(function(c){if(clsCode(c)===code){hit=c.car||c.cars||c.vehicles||c.name||c.label||'';}});
  return hit||'';
}

function activeOtas(){
  return D.store_ota.filter(function(r){return r.active!==false;}).sort(function(a,b){return (a.sort||0)-(b.sort||0);}).map(function(r){return r.ota;});
}
function otaName(id){var hit=D.ota.filter(function(o){return o.id===id;})[0];return hit?hit.name:id;}

// price マップ: key=ota|class|tier -> row
function pk(ota,cls,tier){return ota+'|'+cls+'|'+tier;}

// ---- 連動（pc_rule method='link'）ヘルパ ----
// ruleOf: クラスの決め方ルール行
function ruleOf(cl){return D.rule.filter(function(r){return r.class===cl;})[0]||null;}
// 連動先クラスか（＝手入力不可セル）。戻り {to,diff} または null
function linkRuleOf(cl){var r=ruleOf(cl);if(r&&r.method==='link'&&r.link_to){return {to:r.link_to,diff:(r.link_diff==null?0:+r.link_diff)};}return null;}
// あるクラスを連動元に持つ（下流）クラス一覧
function linkDependents(srcCl){return D.rule.filter(function(r){return r.method==='link'&&r.link_to===srcCl;}).map(function(r){return r.class;});}
// 連動元クラスの解決済みamount（連動の連動も再帰的に解決）。__all/空は null。
// seen=ループ保護。pending={key:amount} 未保存の編集値を優先的に解決に使う。
function resolveLinkedAmount(ota,cl,tierId,seen,pending){
  seen=seen||{};
  if(seen[cl])return null; // ループ
  seen[cl]=1;
  var link=linkRuleOf(cl);
  var key=pk(ota,cl,tierId);
  if(!link){ // 連動元：編集中→保存済みの順
    if(pending&&pending.hasOwnProperty(key)){var pv=pending[key].amount;return (pv===''||pv==null)?null:+pv;}
    var row=D.price[key];return (row&&row.amount!=null)?+row.amount:null;
  }
  var base=resolveLinkedAmount(ota,link.to,tierId,seen,pending);
  if(base==null)return null;
  return base+link.diff;
}
// 連動の表示ラベル（例「連動 B+1,500」）
function linkCellLabel(cl){var link=linkRuleOf(cl);if(!link)return '';return '連動 '+link.to+(link.diff>=0?'+':'')+link.diff.toLocaleString();}
// sell 判定：クラス×OTA を売るか（未指定=売る。A2/B2のOFFICIAL=false 等）
function sellsOtaClass(ota,cl){
  var r=D.store_class.filter(function(x){return x.class===cl;})[0];
  if(!r)return true;
  var sell=r.sell||{};if(typeof sell==='string'){try{sell=JSON.parse(sell);}catch(e){sell={};}}
  return sell[ota]!==false;
}
// batch_id 生成（ブラウザ・Date.now()+乱数）
function newBatchId(){return 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

// ===== 読込 =====
async function reloadAll(){
  document.getElementById('body').innerHTML='<div class="phd">読み込み中…</div>';
  var errs=[];
  async function g(tbl,path,assign){
    var r=await req('GET',path);
    if(!r.ok){errs.push(tbl+': '+r.err);assign(null,r);return;}
    assign(r.data,r);
  }
  // classes（店識別子はフルネーム：nha→naha）。ログイン必須（anonでは0件）。
  // 読めた時だけ表示名(車種)を補う。読めない時はクラスのコード一覧を pc_store_class / pc_price から構築する。
  var sf=storeFull();
  await g('classes','classes?select=*&or=(store_id.eq.'+sf+',store.eq.'+sf+')',function(d){ D.classes = d||[]; });
  if(!D.classes.length){ // store_id/store 列が無い等でヒットしない時は全件→フルネームで絞る
    var ra=await req('GET','classes?select=*&limit=1000');
    if(ra.ok&&Array.isArray(ra.data))D.classes=ra.data.filter(function(c){return !c.store_id||c.store_id===sf;}).filter(function(c){return !c.store||c.store===sf;});
  }
  await g('pc_store_class','pc_store_class?store=eq.'+STORE+'&select=*',function(d){D.store_class=d||[];});
  await g('pc_store_ota','pc_store_ota?store=eq.'+STORE+'&select=*',function(d){D.store_ota=d||[];});
  await g('pc_ota','pc_ota?select=*&order=sort',function(d){D.ota=d||[];});
  await g('pc_tier','pc_tier?select=*&order=sort',function(d){D.tier=d||[];});
  await g('pc_month_tier','pc_month_tier?select=*&order=month',function(d){D.month_tier=d||[];});
  await g('pc_rule','pc_rule?store=eq.'+STORE+'&select=*',function(d){D.rule=d||[];});
  await g('pc_floor','pc_floor?store=eq.'+STORE+'&select=*',function(d){D.floor=d||[];});
  await g('pc_setting','pc_setting?select=*',function(d){D.setting={};(d||[]).forEach(function(r){D.setting[r.key]=r.value;});});
  // pc_price（店で絞る）
  D.price={};
  await g('pc_price','pc_price?store=eq.'+STORE+'&select=*',function(d){(d||[]).forEach(function(r){D.price[pk(r.ota,r.class,r.tier)]=r;});});
  await loadLog();
  window.__loadErrs=errs;
  render();
}
async function loadLog(){
  var f='pc_log?store=eq.'+STORE+'&order=ts.desc&limit=500&select=*';
  var r=await req('GET',f);
  D.log=(r.ok&&Array.isArray(r.data))?r.data:[];
}

// ===== 共通描画 =====
function renderAuthbar(){
  var ab=document.getElementById('authbar');
  if(authed()){ab.className='authbar ok';ab.innerHTML='🔓 ログイン済み（保存できます）';}
  else{ab.className='authbar ng';ab.innerHTML='🔒 業務アプリでログインしてから開いてください（このままでは保存できません）';}
}
function renderTabs(){
  var tabs=[['price','価格表'],['rule','決め方'],['master','マスター'],['log','ログ'],['ph','カレンダー/案/入力/CP']];
  document.getElementById('maintabs').innerHTML=tabs.map(function(t){return '<button class="maintab'+(TAB===t[0]?' on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>';}).join('');
}
function setTab(t){TAB=t;render();}
function render(){
  renderAuthbar();renderTabs();
  var errHtml=(window.__loadErrs&&window.__loadErrs.length)?'<div class="card"><div class="err">読込エラー:\n'+esc(window.__loadErrs.join('\n'))+'\n（pc_* テーブルが未適用の可能性。sql/pc_schema.sql を Supabase SQL Editor で実行してください）</div></div>':'';
  var html;
  if(TAB==='price')html=viewPrice();
  else if(TAB==='rule')html=viewRule();
  else if(TAB==='master')html=viewMaster();
  else if(TAB==='log')html=viewLog();
  else html=viewPlaceholder();
  document.getElementById('body').innerHTML=errHtml+html;
}

// =====================================================================
// 1) 価格表
// =====================================================================
function viewPrice(){
  var otas=activeOtas();
  if(!otas.length)return '<div class="card"><div class="empty">掲載OTA（pc_store_ota）が未登録です。「マスター」タブで登録してください。</div></div>';
  var classes=classList();
  if(!classes.length)return '<div class="card"><div class="empty">クラス（classes / pc_store_class）が未登録です。「マスター」タブを確認してください。</div></div>';
  if(otas.indexOf(OTA)<0&&OTA!=='__all')OTA=otas[0];
  var tabs='<div class="otatabs">'+otas.map(function(o){return '<button class="otatab'+(OTA===o?' on':'')+'" onclick="setOta(\''+o+'\')">'+esc(otaName(o))+'</button>';}).join('')
    +'<button class="otatab'+(OTA==='__all'?' on':'')+'" onclick="setOta(\'__all\')">全OTA比較</button></div>';
  if(OTA==='__all')return '<div class="card"><h2>💴 価格表 — 全OTA比較（基本単価）</h2>'+tabs+priceCompare(otas,classes)+'</div>';
  return '<div class="card"><h2>💴 価格表 — '+esc(otaName(OTA))+'</h2>'+tabs
    +emptyTierWarnings(OTA,classes)
    +'<div class="legend"><span><b style="background:#fff;border:1px solid #cbd5e1"></b>基本</span><span><b style="background:#eff6ff"></b>安い日</span><span><b style="background:#fff7ed"></b>高い日</span><span><b style="background:#f5f3ff"></b>連動(自動)</span><span class="warn">⚠要確認＝段逆転</span></div>'
    +'<div class="muted">セルをクリックして「日帰り単価」を入力→Enter/Tab/矢印で移動。保存ボタンで確定。泊数列は単価×日数（赤＝泊数ごとの下限未満）。連動セルは元クラス＋差額で自動計算（手入力不可）。目印欄は任意メモ（prev_amountには保存しません）。安い日・高い日が空欄＝基本料金で売る目印（0円にしない）。前回値欄の📜でそのセルの価格ログ履歴を開けます。</div>'
    +'<div class="scroll" style="margin-top:8px">'+priceGrid(OTA,classes)+'</div>'

// #6 販売中の月で L/R/H が空欄なら警告（pc_month_tier が使う段のみ。売る class×ota が対象）。
// 連動クラスは計算値が出れば空扱いしない。
function emptyTierWarnings(ota,classes){
  var usedTiers={};D.month_tier.forEach(function(r){usedTiers[r.tier]=1;}); // 実際に使われている L/R/H のみ
  var tierIds=Object.keys(usedTiers);

        +'<td class="tier">'+esc(tr.name)+' <small>('+tr.id+')</small>'+(revWarn?'<br><span class="warn">⚠要確認</span>':'')+'</td>'

      // 泊数列：0〜4泊の各合計を pc_floor.amount(その泊数)と比較、下回れば赤
      NIGHTS.slice(1).forEach(function(n){

var markMap={};
function markOf(key){return markMap[key]||'';}
function setMark(key,v){markMap[key]=v;}

function chgLabel(before,after){ // 表示用：前→後・%
  var b=(before==null||before==='')?null:+before;
  var a=(after===''||after==null)?null:+after;
  var bStr=(b==null?'空':b.toLocaleString()),aStr=(a==null?'空':a.toLocaleString());
  var pct='';
  if(b!=null&&b>0&&a!=null){var d=Math.round((a-b)/b*100);pct=' ('+(d>=0?'+':'')+d+'%)';}
  return bStr+'→'+aStr+pct;
}
// セル編集
var editingTd=null;
function flushEditing(){if(editingTd){var inp=editingTd.querySelector('input');if(inp)commitInput(inp,editingTd);editingTd=null;}}
function editCell(td,ota,cl,tier){
  flushEditing();
  var key=pk(ota,cl,tier);
  var cur=editMap.hasOwnProperty(key)?editMap[key].amount:(D.price[key]?D.price[key].amount:'');
  td.innerHTML='<input class="celled" value="'+(cur==null?'':cur)+'" />';
  var inp=td.querySelector('input');editingTd=td;td.dataset.ota=ota;td.dataset.cl=cl;td.dataset.tier=tier;
  inp.focus();inp.select();
  inp.onkeydown=function(e){
    if(e.key==='Enter'){e.preventDefault();commitInput(inp,td);moveCell(td,1,0);}
    else if(e.key==='Tab'){e.preventDefault();commitInput(inp,td);moveCell(td,e.shiftKey?-1:1,0,true);}
    else if(e.key==='ArrowDown'){e.preventDefault();commitInput(inp,td);moveCell(td,1,0);}
    else if(e.key==='ArrowUp'){e.preventDefault();commitInput(inp,td);moveCell(td,-1,0);}
    else if(e.key==='Escape'){editingTd=null;render();}
  };
  inp.onblur=function(){if(editingTd===td){commitInput(inp,td);editingTd=null;}};
  inp.onpaste=function(e){
    var txt=(e.clipboardData||window.clipboardData).getData('text');
    if(txt&&(txt.indexOf('\t')>=0||txt.indexOf('\n')>=0)){e.preventDefault();pasteBlock(td,txt);}
  };
}
function commitInput(inp,td){
  var key=pk(td.dataset.ota,td.dataset.cl,td.dataset.tier);
  var raw=inp.value.trim();
  var orig=D.price[key]?D.price[key].amount:null;
  var newVal;
  if(raw===''){newVal='';}
  else{var n=parseInt(raw.replace(/[,，]/g,''),10);newVal=isNaN(n)?raw:n;}
  // 変更が無ければ editMap から除去
  if((newVal===''&&(orig==null||orig===''))||newVal===orig){delete editMap[key];}
  else{editMap[key]={amount:newVal};}
}
// 貼り付け（2次元・行×列）：フォーカスセル起点に「行優先」で編集可能セルへ流し込む。
// この版の価格表は編集可能列が「日帰り単価」1列のみ（泊数列は計算・連動行は読取専用）→
// 貼り付けの各行の値は、起点セルから下方向の編集可能セルへ順に入れ、読取専用/計算/連動セルはスキップ。
// 横に複数列が貼られた場合は、各行の先頭セル(cells[0])を単価として扱い、残りの列は無視（単価以外に入力可能列が無いため）。
function pasteBlock(startTd,txt){
  commitInputSafe(startTd);
  var lines=txt.replace(/\r/g,'').split('\n').filter(function(x){return x!=='';});
  // 貼り付けの全値を行優先で1次元に展開（1行に複数列あれば先頭列を採用）
  var vals=[];
  lines.forEach(function(line){var cells=line.split('\t');vals.push((cells[0]||'').trim());});
  var td=startTd,n=0;
  for(var i=0;i<vals.length&&td;i++){
    // 編集可能セルに当たるまで下へスキップ（連動/読取専用はスキップ）
    while(td&&!isEditableCell(td))td=nextEditableDown(td);
    if(!td)break;
    var v=vals[i];
    // data-ota はセルに無い（editCell時のみ dataset に入る）→ 現在表示中の OTA を使う
    var ota=OTA,cl=td.getAttribute('data-cl'),tier=td.getAttribute('data-tier');
    var key=pk(ota,cl,tier);
    var orig=D.price[key]?D.price[key].amount:null;
    var nv;if(v===''){nv='';}else{var num2=parseInt(v.replace(/[,，]/g,''),10);nv=isNaN(num2)?v:num2;}
    if((nv===''&&(orig==null||orig===''))||nv===orig)delete editMap[key];else editMap[key]={amount:nv};
    n++;
    td=nextEditableDown(td);
  }
  editingTd=null;render();toast('貼り付けました（'+n+'セル）');
}
function commitInputSafe(td){var inp=td.querySelector('input');if(inp)commitInput(inp,td);}
// 編集可能セル＝class 'cell' を持ち 'linked'/'ro' でない（＝日帰り単価列の手入力セル）
function isEditableCell(td){return td&&td.classList&&td.classList.contains('cell')&&!td.classList.contains('linked');}
// 同じ列インデックスで次の行の同列セルへ（連動/読取専用もそのまま返す＝呼び出し側でskip）
function nextEditableDown(td){
  var tr=td.closest('tr');var idx=Array.prototype.indexOf.call(tr.children,td);
  var nx=tr.nextElementSibling;
  while(nx){var c=nx.children[idx];if(c&&c.classList&&c.classList.contains('cell'))return c;nx=nx.nextElementSibling;}
  return null;
}
function nextCellDown(td){return nextEditableDown(td);}
function moveCell(td,dRow,dCol,horiz){
  var tr=td.closest('tr');var idx=Array.prototype.indexOf.call(tr.children,td);
  var target;
  if(horiz){ // Tab＝次の編集可能セルへ（この版は単価列のみ編集可→下へ送る）
    var nx=tr.nextElementSibling;if(dRow<0)nx=tr.previousElementSibling;
    if(nx)target=nx.children[idx];
  }else{
    var row=dRow>0?tr.nextElementSibling:tr.previousElementSibling;
    if(row)target=row.children[idx];
  }
  if(target&&target.classList.contains('cell')){target.click();}
  else render();
}
function pasteHelp(){alert('セルを編集状態にして、スプレッドシート等からコピーした値（複数行・タブ/改行区切り）を貼り付けると、そのセルを起点に行優先で編集可能セルへ順に入ります。連動セル・泊数の計算列・読取専用セルは自動でスキップします。1行に複数列ある場合は先頭列を単価として使います（この表で手入力できる列は「日帰り単価」1列のため）。');}

// ---- 逸脱チェック（追加B / pc_setting.deviation）----
function devCfg(){var d=D.setting.deviation;if(typeof d==='string'){try{d=JSON.parse(d);}catch(e){d={};}}return d||{};}
function num(v,def){var n=+v;return isNaN(n)?def:n;}
// ① 入力ミス系＝保存不可。戻り {block,msg} または null
function checkDeviation(cl,tr,amount,prev){
  if(amount==='')return null; // 空欄は許可
  var cfg=devCfg();
  var minA=num(cfg.min_amount,1000),maxA=num(cfg.max_amount,100000);
  var rLow=num(cfg.ratio_low,0.3333),rHigh=num(cfg.ratio_high,3.0);
  var n=+amount;
  if(isNaN(n))return {block:true,msg:'数字でない'};
  if(n===0)return {block:true,msg:'0円は不可'};
  if(n<minA)return {block:true,msg:'下限'+minA.toLocaleString()+'未満'};
  if(n>maxA)return {block:true,msg:'上限'+maxA.toLocaleString()+'超'};
  if(prev!=null&&prev>0){
    if(n<=prev*rLow)return {block:true,msg:'前回の'+Math.round(rLow*100)+'%以下'};
    if(n>=prev*rHigh)return {block:true,msg:'前回の'+rHigh+'倍以上'};
  }
  return null;
}
// pc_floor 下限（泊数ごと）。nights 省略時は0=日帰り。
function floorOf(ota,cl,nights){
  if(nights==null)nights=0;
  var hit=D.floor.filter(function(f){return f.ota===ota&&f.class===cl&&(+f.nights)===(+nights);})[0];
  return hit?hit.amount:null;
}
// 泊数ごとの下限違反チェック：単価 unit の 0〜4泊合計が1つでも下限未満なら {nights,total,floor} を返す
function floorViolation(ota,cl,unit){
  if(unit===''||unit==null)return null;
  for(var ni=0;ni<NIGHTS.length;ni++){
    var days=NIGHTS[ni][1],nights=days-1;
    var fl=floorOf(ota,cl,nights);
    if(fl!=null&&(+unit)*days<fl)return {nights:nights,total:(+unit)*days,floor:fl};
  }
  return null;
}
// ④ 段逆転（高い日tier の単価 < 基本、または 安い日tier > 基本）
// ※ 今は「基本」＝R段の同OTA・同クラスのamount（L/R/Hのうち存在するもの）。
//   フェーズ④以降（安い日/高い日に日付が入る）では、"その日付の月の L/R/H"（pc_month_tier→pc_price）
//   と比較する設計に差し替える。今回は準備のみ（下の baseTierAmount をその場所に変える）。
function baseTierAmount(ota,cl){
  var b=currentAmount(ota,cl,'R');if(b!==''&&b!=null)return +b;
  b=currentAmount(ota,cl,'H');if(b!==''&&b!=null)return +b;
  b=currentAmount(ota,cl,'L');if(b!==''&&b!=null)return +b;
  return null;
}
// 段逆転の判定。戻り null か {msg}
function tierReversal(ota,cl,tr){
  if(!tr||tr.kind==='base')return null;
  var amt=currentAmount(ota,cl,tr.id);if(amt===''||amt==null)return null;
  var baseAmt=baseTierAmount(ota,cl);if(baseAmt==null)return null;
  if(tr.kind==='high'&&+amt<baseAmt)return {msg:'高い日が基本('+baseAmt.toLocaleString()+')より安い'};
  if(tr.kind==='low'&&+amt>baseAmt)return {msg:'安い日が基本('+baseAmt.toLocaleString()+')より高い'};
  return null;
}
function tierReversalWarn(ota,cl,tr){return !!tierReversal(ota,cl,tr);}
function currentAmount(ota,cl,tierId){
  if(linkRuleOf(cl)){var c=resolveLinkedAmount(ota,cl,tierId,{},editMap);return c==null?null:c;}
  var key=pk(ota,cl,tierId);if(editMap.hasOwnProperty(key))return editMap[key].amount;return D.price[key]?D.price[key].amount:null;
}

// 1件を pc_price に保存＋pc_log＋pc_input_queue。戻り {ok,before,row,fails[]}（queue失敗も報告）
async function writeOnePrice(ota,cl,tierId,amt,trigger,reason,batchId){
  var fails=[];
  var cur=await req('GET','pc_price?store=eq.'+STORE+'&ota=eq.'+ota+'&class=eq.'+cl+'&tier=eq.'+tierId+'&select=*');
  if(!cur.ok)return {ok:false,fails:[otaName(ota)+' '+cl+'/'+tierId+': 読み直し失敗 '+cur.err]};
  var existing=(cur.data&&cur.data[0])?cur.data[0]:null;
  var before=existing?existing.amount:null;
  if(before===amt)return {ok:true,skipped:true,before:before,row:existing};
  var nowISO=new Date().toISOString();
  var w;
  if(existing)w=await req('PATCH','pc_price?store=eq.'+STORE+'&ota=eq.'+ota+'&class=eq.'+cl+'&tier=eq.'+tierId,{amount:amt,prev_amount:before,updated_at:nowISO},'return=representation');
  else w=await req('POST','pc_price',{store:STORE,ota:ota,class:cl,tier:tierId,amount:amt,prev_amount:before,updated_at:nowISO},'return=representation');
  if(!w.ok)return {ok:false,fails:[otaName(ota)+' '+cl+'/'+tierId+': '+w.err]};
  var lg=await req('POST','pc_log',{store:STORE,ota:ota,class:cl,tier:tierId,before:before,after:amt,trigger:trigger,reason:reason||null,batch_id:batchId},'return=minimal');
  if(!lg.ok)fails.push(otaName(ota)+' '+cl+'/'+tierId+': ログ記録失敗 '+lg.err);
  // pc_input_queue：失敗は握りつぶさず報告
  var q=await req('POST','pc_input_queue',{store:STORE,ota:ota,class:cl,tier:tierId,before:before,after:amt,status:'waiting'},'return=minimal');
  if(!q.ok)fails.push(otaName(ota)+' '+cl+'/'+tierId+': 入力リスト記録失敗 '+q.err);
  var row=(w.data&&w.data[0])?w.data[0]:{store:STORE,ota:ota,class:cl,tier:tierId,amount:amt,prev_amount:before,updated_at:nowISO};
  D.price[pk(ota,cl,tierId)]=row;
  return {ok:true,before:before,row:row,fails:fails};
}
// 連動カスケード：srcCl（連動元）の保存後、同OTA・同tier の下流クラスを再帰的に再計算して保存。
// 逸脱①/pc_floor に当たる件は保存せず中止し blocked[] に理由を積む。batchId は手入力と同一。
async function cascadeLink(ota,tierId,srcCl,batchId,okRef,failList,blocked,visited){
  visited=visited||{};
  var deps=linkDependents(srcCl);
  for(var i=0;i<deps.length;i++){
    var dep=deps[i];
    var vkey=ota+'|'+dep+'|'+tierId;
    if(visited[vkey])continue; visited[vkey]=1;
    if(!sellsOtaClass(ota,dep))continue; // そのOTAで売らないクラスは反映しない
    var calc=resolveLinkedAmount(ota,dep,tierId,{},editMap);
    if(calc==null)continue; // 連動元が空なら連動先も空のまま
    var tr=D.tier.filter(function(t){return t.id===tierId;})[0]||{id:tierId,kind:'base'};
    var prev=D.price[vkey]?D.price[vkey].amount:null;
    // 逸脱①
    var dev=checkDeviation(dep,tr,calc,prev);
    if(dev&&dev.block){blocked.push('連動 '+otaName(ota)+' '+dep+'/'+tierId+'（'+srcCl+'由来）：'+dev.msg+' → 保存せず中止');continue;}
    // pc_floor（泊数ごと）
    var fv=floorViolation(ota,dep,calc);
    if(fv){blocked.push('連動 '+otaName(ota)+' '+dep+'/'+tierId+'（'+srcCl+'由来）：'+fv.nights+'泊合計'+fv.total.toLocaleString()+'が下限'+fv.floor.toLocaleString()+'未満 → 保存せず中止');continue;}
    var r=await writeOnePrice(ota,dep,tierId,calc,'link','連動('+srcCl+')',batchId);
    if(!r.ok){failList.push.apply(failList,r.fails);continue;}
    if(r.fails&&r.fails.length)failList.push.apply(failList,r.fails);
    okRef.n++;
    // 連動の連動（dep を元に持つ下流）
    await cascadeLink(ota,tierId,dep,batchId,okRef,failList,blocked,visited);
  }
}

// ---- 保存（1件ずつ・保存直前に読み直し）----
async function savePrice(){
  flushEditing();
  var errEl=document.getElementById('priceerr');errEl.textContent='';
  if(!authed()){errEl.textContent='ログインしていません。保存できません。';return;}
  // 連動先クラスは手入力不可＝editMap から除外（念のため）
  Object.keys(editMap).forEach(function(k){if(linkRuleOf(k.split('|')[1]))delete editMap[k];});
  var keys=Object.keys(editMap);
  if(!keys.length){toast('変更がありません');return;}
  // ① ブロック判定（入力ミス＋泊数ごとの下限）を全件先に
  var blocks=[];
  keys.forEach(function(key){
    var parts=key.split('|'),ota=parts[0],cl=parts[1],tierId=parts[2];
    var tr=D.tier.filter(function(t){return t.id===tierId;})[0]||{id:tierId,kind:'base'};
    var amt=editMap[key].amount;
    var prev=D.price[key]?D.price[key].amount:null;
    var dev=checkDeviation(cl,tr,amt,prev);
    if(dev&&dev.block)blocks.push(otaName(ota)+' '+cl+'/'+tierId+'：'+dev.msg);
    // pc_floor（0〜4泊の各合計）
    if(amt!==''){var fv=floorViolation(ota,cl,amt);if(fv)blocks.push(otaName(ota)+' '+cl+'/'+tierId+'：'+fv.nights+'泊合計'+fv.total.toLocaleString()+'が下限'+fv.floor.toLocaleString()+'未満');}
  });
  if(blocks.length){errEl.textContent='保存不可（入力ミス/下限）:\n'+blocks.join('\n');render();return;}
  // ④ 段逆転（高い日<基本 / 安い日>基本）→ 理由必須。未入力なら保存不可。
  var revItems=[];
  keys.forEach(function(key){
    var parts=key.split('|'),ota=parts[0],cl=parts[1],tierId=parts[2];
    var tr=D.tier.filter(function(t){return t.id===tierId;})[0];if(!tr)return;
    var rv=tierReversal(ota,cl,tr);
    if(rv)revItems.push({key:key,ota:ota,cl:cl,tier:tierId,msg:rv.msg});
  });
  var reasonByKey={};
  if(revItems.length){
    var rr=await confirmReversal(revItems);
    if(rr===false){errEl.textContent='段逆転の理由が未入力のため保存を中止しました:\n'+revItems.map(function(x){return otaName(x.ota)+' '+x.cl+'/'+x.tier+'：'+x.msg;}).join('\n');render();return;}
    reasonByKey=rr; // {key:reason}
  }
  // ⑤ big_change 確認
  var cfg=devCfg();var big=num(cfg.big_change!=null?cfg.big_change:(D.setting.big_change),0.20);
  var bigList=keys.filter(function(key){var prev=D.price[key]?D.price[key].amount:null;var amt=editMap[key].amount;if(amt===''||prev==null||prev<=0)return false;return Math.abs((+amt)-prev)/prev>=big;});
  var reason='';
  if(bigList.length){
    reason=await confirmBig(bigList,big);
    if(reason===false){toast('保存を中止しました');return;}
  }
  // 1回の保存（手入力＋連動カスケード）は同じ batch_id
  var batchId=newBatchId();
  var okRef={n:0},failList=[],blocked=[],cascadeSrc=[];
  for(var i=0;i<keys.length;i++){
    var key=keys[i],parts=key.split('|'),ota=parts[0],cl=parts[1],tierId=parts[2];
    var amtRaw=editMap[key].amount;var amt=(amtRaw===''?null:+amtRaw);
    var rsn=reasonByKey[key]||reason||null;
    var r=await writeOnePrice(ota,cl,tierId,amt,'manual',rsn,batchId);
    if(!r.ok){failList.push.apply(failList,r.fails);continue;}
    if(r.fails&&r.fails.length)failList.push.apply(failList,r.fails);
    delete editMap[key];
    okRef.n++;
    cascadeSrc.push({ota:ota,tier:tierId,cl:cl});
  }
  // 連動カスケード（元の手入力分は保存済み。batchId 共通）
  var visited={};
  for(var j=0;j<cascadeSrc.length;j++){
    await cascadeLink(cascadeSrc[j].ota,cascadeSrc[j].tier,cascadeSrc[j].cl,batchId,okRef,failList,blocked,visited);
  }
  await loadLog();
  render();
  var msg='';
  if(blocked.length)msg+='⚠ 連動で止まった件:\n'+blocked.join('\n')+'\n（元の手入力分は保存済み）';
  if(failList.length)msg+=(msg?'\n\n':'')+'一部失敗:\n'+failList.join('\n');
  if(msg)document.getElementById('priceerr').textContent=msg;
  if(failList.length||blocked.length)toast(okRef.n+'件保存／'+(failList.length+blocked.length)+'件 要確認',true);
  else toast('✅ '+okRef.n+'件保存しました');
}
// 段逆転の理由入力（全件に理由が入るまで保存不可）。戻り {key:reason} または false（中止）
function confirmReversal(items){
  return new Promise(function(resolve){
    var box=document.getElementById('diagbox');
    box.innerHTML='<h3>⚠ 段の逆転（理由が必要）</h3><div class="muted">高い日が基本より安い／安い日が基本より高い設定です。保存するには各件の理由を入力してください（空欄があると保存できません）。</div>'
      +'<div style="max-height:220px;overflow:auto;margin:8px 0">'+items.map(function(x,i){return '<div style="margin-bottom:6px;font-size:12px"><b>'+esc(otaName(x.ota)+' '+x.cl+'/'+x.tier)+'</b> <span class="warn">'+esc(x.msg)+'</span><br><input id="rev_'+i+'" style="width:100%;padding:6px;border:1px solid #cbd5e1;border-radius:6px;margin-top:3px" placeholder="理由"></div>';}).join('')+'</div>'
      +'<div class="acts"><button class="btn ghost sm" onclick="__revRes(false)">中止</button><button class="btn save sm" onclick="__revRes(true)">保存する</button></div>';
    document.getElementById('diag').classList.add('on');
    window.__revRes=function(ok){
      if(!ok){document.getElementById('diag').classList.remove('on');resolve(false);return;}
      var map={},miss=false;
      items.forEach(function(x,i){var v=(document.getElementById('rev_'+i).value||'').trim();if(!v)miss=true;map[x.key]=v;});
      if(miss){alert('全ての理由を入力してください。');return;}
      document.getElementById('diag').classList.remove('on');resolve(map);
    };
  });
}
function confirmBig(list,big){
  return new Promise(function(resolve){
    var box=document.getElementById('diagbox');
    box.innerHTML='<h3>⚠ 大きな変更の確認</h3><div class="muted">前回比 ±'+Math.round(big*100)+'% 以上の変更が '+list.length+' 件あります。よろしいですか？</div>'
      +'<div style="max-height:120px;overflow:auto;font-size:11px;margin:8px 0;color:#334155">'+list.map(function(k){var p=k.split('|');return esc(otaName(p[0])+' '+p[1]+'/'+p[2]);}).join('<br>')+'</div>'
      +'<label class="inl">理由（任意）<input id="bigreason" style="padding:7px;border:1px solid #cbd5e1;border-radius:6px"></label>'
      +'<div class="acts"><button class="btn ghost sm" onclick="__bigRes(false)">中止</button><button class="btn save sm" onclick="__bigRes(true)">保存する</button></div>';
    document.getElementById('diag').classList.add('on');
    window.__bigRes=function(ok){var reason=document.getElementById('bigreason').value||'';document.getElementById('diag').classList.remove('on');resolve(ok?reason:false);};
  });
}

// 連動ループ検出（A→B→A 等）
function hasLinkLoop(links,start){
  var seen={},cur=start;
  while(cur&&links[cur]){if(seen[cur])return true;seen[cur]=1;cur=links[cur];}
  return false;
}
async function saveRules(){
  var errEl=document.getElementById('ruleerr');errEl.textContent='';
  if(!authed()){errEl.textContent='ログインしていません。';return;}
  // 画面の値を収集
  var sels=document.querySelectorAll('select.rm');
  var pending=[];var links={};
  sels.forEach(function(s){
    var cl=s.dataset.cl,method=s.value;
    var rec={store:STORE,class:cl,method:method,rank_base:null,rank_high:null,rank_low:null,link_to:null,link_diff:null};
    document.querySelectorAll('.rk[data-cl="'+cl+'"]').forEach(function(f){
      var fld=f.dataset.f,v=f.value;
      if(method==='market'&&/^rank_/.test(fld))rec[fld]=(v===''?null:parseInt(v,10));
      if(method==='link'&&fld==='link_to')rec.link_to=(v||null);
      if(method==='link'&&fld==='link_diff')rec.link_diff=(v===''?null:parseInt(v,10));
    });
    if(method==='link'&&rec.link_to)links[cl]=rec.link_to;
    pending.push(rec);
  });
  // ループ検出
  for(var cl in links){if(hasLinkLoop(links,cl)){errEl.textContent='連動がループしています（例 '+cl+'→…→'+cl+'）。保存を中止しました。';return;}}
  // 1件ずつ upsert（保存直前に読み直し）
  var ok=0,fail=[];
  for(var i=0;i<pending.length;i++){
    var rec=pending[i];
    var cur=await req('GET','pc_rule?store=eq.'+STORE+'&class=eq.'+rec.class+'&select=*');
    if(!cur.ok){fail.push(rec.class+': 読み直し失敗 '+cur.err);continue;}
    var exists=cur.data&&cur.data[0];
    var w;
    if(exists)w=await req('PATCH','pc_rule?store=eq.'+STORE+'&class=eq.'+rec.class,{method:rec.method,rank_base:rec.rank_base,rank_high:rec.rank_high,rank_low:rec.rank_low,link_to:rec.link_to,link_diff:rec.link_diff},'return=minimal');
    else w=await req('POST','pc_rule',rec,'return=minimal');
    if(!w.ok){fail.push(rec.class+': '+w.err);continue;}
    ok++;
  }
  await req('GET','pc_rule?store=eq.'+STORE+'&select=*').then(function(r){if(r.ok)D.rule=r.data||[];});
  // #1 決め方を保存したら、連動クラスを元クラスの現行amount（各OTA×各段）から再計算して反映。
  var batchId=newBatchId();
  var okRef={n:0},failList=[],blocked=[],visited={};
  var otas=activeOtas();
  var tierIds=D.tier.map(function(t){return t.id;});
  // 連動元（link_to を持たない＝manual/market、または連動チェーンの先頭）から順にカスケード
  var srcClasses=D.rule.filter(function(r){return r.method!=='link';}).map(function(r){return r.class;});
  for(var oi=0;oi<otas.length;oi++){
    for(var ti2=0;ti2<tierIds.length;ti2++){
      for(var si=0;si<srcClasses.length;si++){
        await cascadeLink(otas[oi],tierIds[ti2],srcClasses[si],batchId,okRef,failList,blocked,visited);
      }
    }
  }
  if(okRef.n)await loadLog();
  render();
  var msg='';
  if(fail.length)msg+='決め方の保存で一部失敗:\n'+fail.join('\n');
  if(blocked.length)msg+=(msg?'\n\n':'')+'⚠ 連動で止まった件:\n'+blocked.join('\n');
  if(failList.length)msg+=(msg?'\n\n':'')+'連動反映で一部失敗:\n'+failList.join('\n');
  if(msg)document.getElementById('ruleerr').textContent=msg;
  if(fail.length||blocked.length||failList.length)toast(ok+'件保存／連動'+okRef.n+'件反映（要確認あり）',true);
  else toast('✅ 決め方を保存（'+ok+'件）／連動'+okRef.n+'件を反映しました');
}

async function saveOtaRow(ota){

async function saveStoreClass(cl){

  var tr=document.querySelector('tr[data-cl="'+cl+'"]');
  var sort=parseInt(tr.querySelector('.sc[data-f="sort"]').value||'0',10);
  var sell={};tr.querySelectorAll('.sell').forEach(function(c){sell[c.dataset.ota]=c.checked;});
  var cur=await req('GET','pc_store_class?store=eq.'+STORE+'&class=eq.'+cl+'&select=*');
  if(!cur.ok){errEl.textContent='読み直し失敗: '+cur.err;return;}
  var w;
  if(cur.data&&cur.data[0])w=await req('PATCH','pc_store_class?store=eq.'+STORE+'&class=eq.'+cl,{sort:sort,sell:sell},'return=representation');
  else w=await req('POST','pc_store_class',{store:STORE,class:cl,sort:sort,sell:sell},'return=representation');
  if(!w.ok){errEl.textContent=cl+' 保存失敗: '+w.err;toast('保存失敗',true);return;}
  if(w.data&&w.data[0]){var found=false;for(var i=0;i<D.store_class.length;i++)if(D.store_class[i].class===cl){D.store_class[i]=w.data[0];found=true;}if(!found)D.store_class.push(w.data[0]);}
  toast('✅ '+cl+' を保存');
}
function masterMonthTier(){
  var baseTiers=D.tier.filter(function(t){return t.kind==='base';});
  var mtMap={};D.month_tier.forEach(function(r){mtMap[r.month]=r.tier;});
  var opts=baseTiers.map(function(t){return {id:t.id,name:t.name};});
  if(!opts.length)opts=[{id:'L',name:'閑散'},{id:'R',name:'通常'},{id:'H',name:'繁忙'}];
  var rows='';
  for(var m=1;m<=12;m++){
    var cur=mtMap[m]||'';
    rows+='<tr><td><b>'+m+'月</b></td><td><select class="mt" data-m="'+m+'">'
      +opts.map(function(o){return '<option value="'+o.id+'"'+(cur===o.id?' selected':'')+'>'+o.id+'（'+esc(o.name)+'）</option>';}).join('')
      +'</select></td></tr>';
  }
  return '<div class="muted warn">※ これは全店共通です。変更すると那覇以外にも影響します。</div>'
    +'<div class="scroll" style="margin-top:8px"><table class="ftable"><thead><tr><th>月</th><th>段（L/R/H）</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<div style="margin-top:10px"><button class="btn save" onclick="saveMonthTier()"'+(authed()?'':' disabled')+'>💾 月→段を保存</button></div>'
    +'<div id="mterr" class="err"></div>';
}
async function saveMonthTier(){
  var errEl=document.getElementById('mterr');errEl.textContent='';
  if(!authed()){errEl.textContent='ログインしていません。';return;}
  var sels=document.querySelectorAll('select.mt');
  var ok=0,fail=[];
  for(var i=0;i<sels.length;i++){
    var m=parseInt(sels[i].dataset.m,10),tier=sels[i].value;
    var cur=await req('GET','pc_month_tier?month=eq.'+m+'&select=*');
    if(!cur.ok){fail.push(m+'月: 読み直し失敗 '+cur.err);continue;}
    var w;
    if(cur.data&&cur.data[0]){if(cur.data[0].tier===tier){ok++;continue;}w=await req('PATCH','pc_month_tier?month=eq.'+m,{tier:tier},'return=minimal');}
    else w=await req('POST','pc_month_tier',{month:m,tier:tier},'return=minimal');
    if(!w.ok){fail.push(m+'月: '+w.err);continue;}
    ok++;
  }
  await req('GET','pc_month_tier?select=*&order=month').then(function(r){if(r.ok)D.month_tier=r.data||[];});
  render();
  if(fail.length){document.getElementById('mterr').textContent='一部失敗:\n'+fail.join('\n');toast(ok+'件保存／'+fail.length+'件失敗',true);}
  else toast('✅ 月→段を保存しました');
}
function masterSetting(){
  var s=D.setting;
  function v(k,def){var x=s[k];if(x==null)return def;return x;}
  var dev=devCfg();
  var ol=v('official_link_ota',{});if(typeof ol==='string'){try{ol=JSON.parse(ol);}catch(e){ol={};}}
  var otas=activeOtas();
  var olSel='<select id="set_official_link"><option value="">—</option>'+otas.map(function(o){return '<option value="'+o+'"'+((ol&&ol[STORE])===o?' selected':'')+'>'+esc(otaName(o))+'</option>';}).join('')+'</select>';
  return '<div class="scroll"><table class="ftable"><tbody>'
    +'<tr><td>gap_threshold（案のズレ目印・±円）</td><td><input type="number" id="set_gap" value="'+esc(stripNum(v('gap_threshold',1000)))+'"></td></tr>'
    +'<tr><td>low_cand_util（安い日候補 稼働率）</td><td><input type="number" step="0.01" id="set_lu" value="'+esc(stripNum(v('low_cand_util',0.40)))+'"></td></tr>'
    +'<tr><td>low_cand_days（安い日候補 何日以内）</td><td><input type="number" id="set_ld" value="'+esc(stripNum(v('low_cand_days',30)))+'"></td></tr>'
    +'<tr><td>cp_default_rate（CP初期割引率）</td><td><input type="number" step="0.01" id="set_cp" value="'+esc(stripNum(v('cp_default_rate',0.05)))+'"></td></tr>'
    +'<tr><td>big_change（大きな変更確認・±比率）</td><td><input type="number" step="0.01" id="set_big" value="'+esc(stripNum(v('big_change',0.20)))+'"></td></tr>'
    +'<tr><td>official_link_ota（公式HP連動先・那覇）</td><td>'+olSel+'</td></tr>'
    +'<tr><td colspan="2"><b>deviation（逸脱チェック）</b></td></tr>'
    +'<tr><td>min_amount</td><td><input type="number" id="dev_min" value="'+esc(num(dev.min_amount,1000))+'"></td></tr>'
    +'<tr><td>max_amount</td><td><input type="number" id="dev_max" value="'+esc(num(dev.max_amount,100000))+'"></td></tr>'
    +'<tr><td>ratio_low（前回のこの倍率以下は不可）</td><td><input type="number" step="0.0001" id="dev_rl" value="'+esc(num(dev.ratio_low,0.3333))+'"></td></tr>'
    +'<tr><td>ratio_high（前回のこの倍率以上は不可）</td><td><input type="number" step="0.1" id="dev_rh" value="'+esc(num(dev.ratio_high,3.0))+'"></td></tr>'
    +'<tr><td>market_out（後続フェーズ）</td><td><input type="number" step="0.01" id="dev_mo" value="'+esc(num(dev.market_out,0.20))+'"></td></tr>'
    +'<tr><td>other_ota（後続フェーズ）</td><td><input type="number" step="0.01" id="dev_oo" value="'+esc(num(dev.other_ota,0.60))+'"></td></tr>'
    +'<tr><td>prev_change</td><td><input type="number" step="0.01" id="dev_pc" value="'+esc(num(dev.prev_change,0.20))+'"></td></tr>'
    +'</tbody></table></div>'
    +'<div style="margin-top:10px"><button class="btn save" onclick="saveSettings()"'+(authed()?'':' disabled')+'>💾 設定を保存</button></div>'
    +'<div id="seterr" class="err"></div>';
}
function stripNum(x){if(typeof x==='object')return JSON.stringify(x);return x;}
async function saveSettings(){
  var errEl=document.getElementById('seterr');errEl.textContent='';
  if(!authed()){errEl.textContent='ログインしていません。';return;}
  function gv(id){return document.getElementById(id).value;}
  // official_link_ota は全店共通JSON（那覇分だけ差し替え・他店は読み直して保持）
  var curOL=await req('GET','pc_setting?key=eq.official_link_ota&select=value');
  var olObj=(curOL.ok&&curOL.data&&curOL.data[0])?curOL.data[0].value:{};if(typeof olObj==='string'){try{olObj=JSON.parse(olObj);}catch(e){olObj={};}}
  olObj=olObj||{};olObj[STORE]=(gv('set_official_link')||null);
  var dev={min_amount:+gv('dev_min'),max_amount:+gv('dev_max'),ratio_low:+gv('dev_rl'),ratio_high:+gv('dev_rh'),market_out:+gv('dev_mo'),other_ota:+gv('dev_oo'),prev_change:+gv('dev_pc')};
  var items=[
    ['gap_threshold',+gv('set_gap')],
    ['low_cand_util',+gv('set_lu')],
    ['low_cand_days',+gv('set_ld')],
    ['cp_default_rate',+gv('set_cp')],
    ['big_change',+gv('set_big')],
    ['official_link_ota',olObj],
    ['deviation',dev]
  ];
  var ok=0,fail=[];
  for(var i=0;i<items.length;i++){
    var key=items[i][0],val=items[i][1];
    var cur=await req('GET','pc_setting?key=eq.'+key+'&select=*');
    if(!cur.ok){fail.push(key+': 読み直し失敗 '+cur.err);continue;}
    var w;
    if(cur.data&&cur.data[0])w=await req('PATCH','pc_setting?key=eq.'+key,{value:val},'return=minimal');
    else w=await req('POST','pc_setting',{key:key,value:val},'return=minimal');
    if(!w.ok){fail.push(key+': '+w.err);continue;}
    ok++;D.setting[key]=val;
  }
  render();
  if(fail.length){document.getElementById('seterr').textContent='一部失敗:\n'+fail.join('\n');toast(ok+'件保存／'+fail.length+'件失敗',true);}
  else toast('✅ 設定を保存しました');
}

var logF={ota:'',cls:'',tier:'',trigger:''};
function viewLog(){
  var otas=activeOtas();
  var classes=classList();
  var tiers=D.tier.slice().sort(function(a,b){return (a.sort||0)-(b.sort||0);});
  var filtered=D.log.filter(function(r){
    if(logF.ota&&r.ota!==logF.ota)return false;
    if(logF.cls&&r.class!==logF.cls)return false;
    if(logF.tier&&r.tier!==logF.tier)return false;
    if(logF.trigger&&r.trigger!==logF.trigger)return false;
    return true;
  });
  var fil='<div class="logfilter">'
    +'<label class="inl">OTA<select onchange="logSet(\'ota\',this.value)"><option value="">全て</option>'+otas.map(function(o){return '<option value="'+o+'"'+(logF.ota===o?' selected':'')+'>'+esc(otaName(o))+'</option>';}).join('')+'</select></label>'
    +'<label class="inl">クラス<select onchange="logSet(\'cls\',this.value)"><option value="">全て</option>'+classes.map(function(c){return '<option value="'+c+'"'+(logF.cls===c?' selected':'')+'>'+c+'</option>';}).join('')+'</select></label>'
    +'<label class="inl">段<select onchange="logSet(\'tier\',this.value)"><option value="">全て</option>'+tiers.map(function(t){return '<option value="'+t.id+'"'+(logF.tier===t.id?' selected':'')+'>'+t.id+'</option>';}).join('')+'</select></label>'
    +'<label class="inl">きっかけ<select onchange="logSet(\'trigger\',this.value)"><option value="">全て</option>'+['manual','adopt','link','cp','deviation'].map(function(t){return '<option value="'+t+'"'+(logF.trigger===t?' selected':'')+'>'+t+'</option>';}).join('')+'</select></label>'
    +'<button class="btn ghost sm" onclick="exportLogCsv()">⬇ CSV書き出し</button></div>';
  var rows=filtered.map(function(r){
    return '<tr><td style="white-space:nowrap;font-variant-numeric:tabular-nums">'+esc(jst(r.ts))+'</td>'
      +'<td>'+esc(otaName(r.ota))+'</td><td>'+esc(r.class||'')+'</td><td>'+esc(r.tier||'')+'</td>'
      +'<td style="text-align:right">'+(r.before==null?'—':yen(r.before))+'</td>'
      +'<td style="text-align:right">'+(r.after==null?'—':yen(r.after))+'</td>'
      +'<td><span class="pill '+(r.trigger==='manual'?'manual':'other')+'">'+esc(r.trigger||'')+'</span></td>'
      +'<td>'+esc(r.reason||'')+'</td></tr>';
  }).join('');
  if(!rows)rows='<tr><td colspan="8" class="empty">ログがありません。</td></tr>';
  return '<div class="card"><h2>📜 ログ（pc_log・新しい順・JST表示）</h2>'+fil
    +'<div class="muted">'+filtered.length+'件（最大500件読込）。tsはUTC→JST(+9)に変換して表示。</div>'
    +'<div class="scroll" style="margin-top:8px"><table class="ftable"><thead><tr><th>日時(JST)</th><th>OTA</th><th>クラス</th><th>段</th><th>前</th><th>後</th><th>きっかけ</th><th>理由</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}
function logSet(f,v){logF[f]=v;render();}
function exportLogCsv(){
  var filtered=D.log.filter(function(r){if(logF.ota&&r.ota!==logF.ota)return false;if(logF.cls&&r.class!==logF.cls)return false;if(logF.tier&&r.tier!==logF.tier)return false;if(logF.trigger&&r.trigger!==logF.trigger)return false;return true;});
  var head=['日時(JST)','store','ota','class','tier','before','after','trigger','reason','batch_id'];
  var lines=[head.join(',')];
  filtered.forEach(function(r){
    var row=[jst(r.ts),r.store||'',r.ota||'',r.class||'',r.tier||'',r.before==null?'':r.before,r.after==null?'':r.after,r.trigger||'',r.reason||'',r.batch_id||''];
    lines.push(row.map(function(c){c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(','));
  });
  var blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pc_log_'+STORE+'_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}
