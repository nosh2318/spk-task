<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>HANDYMAN 協力会社ビュー</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN',sans-serif;background:#f3f4f6;color:#1e293b;font-size:13px}

/* ヘッダー */
.hdr{background:linear-gradient(135deg,#1e293b,#334155);padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.hdr h1{font-size:14px;font-weight:900;color:#fff}
.hdr .company{font-size:11px;font-weight:700;color:#cbd5e1;background:#475569;padding:4px 10px;border-radius:6px}
.hdr .ver{font-size:10px;color:#94a3b8;margin-left:auto}
.hdr .logout{font-size:11px;color:#fff;background:#dc2626;padding:5px 12px;border-radius:6px;border:none;cursor:pointer;font-weight:700}

/* タブ */
.tabs{display:flex;background:#fff;border-bottom:2px solid #e2e8f0;padding:0 10px;position:sticky;top:48px;z-index:99;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.tab{padding:10px 18px;font-size:13px;font-weight:700;color:#64748b;background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;transition:all .12s}
.tab.on{color:#1e40af;border-bottom-color:#1e40af;background:#eff6ff}
.tab:hover:not(.on){color:#334155;background:#f8fafc}

/* ログイン画面 */
.login-wrap{max-width:380px;margin:60px auto;background:#fff;border-radius:16px;padding:32px;box-shadow:0 4px 20px rgba(0,0,0,.08);text-align:center}
.login-wrap h2{font-size:18px;font-weight:900;color:#1e293b;margin-bottom:8px}
.login-wrap .sub{font-size:12px;color:#64748b;margin-bottom:24px}
.login-wrap input{width:100%;padding:12px;border:1.5px solid #d1d5db;border-radius:10px;font-size:14px;margin-bottom:10px;font-family:inherit}
.login-wrap input:focus{outline:2px solid #1e40af;border-color:#1e40af}
.login-wrap .err{color:#dc2626;font-size:12px;font-weight:600;margin-bottom:8px;display:none}
.login-wrap button{width:100%;padding:12px;background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}
.login-wrap button:disabled{background:#94a3b8;cursor:not-allowed}

/* サマリーカード */
.summary{display:flex;gap:12px;padding:14px 16px;flex-wrap:wrap;background:#fff;border-bottom:1px solid #e2e8f0}
.summary-card{flex:1;min-width:140px;padding:10px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
.summary-card .lbl{font-size:10px;font-weight:700;color:#64748b;letter-spacing:.05em;margin-bottom:4px}
.summary-card .val{font-size:18px;font-weight:900;color:#1e293b}
.summary-card .sub{font-size:10px;color:#94a3b8;margin-top:2px}

/* コンテンツ */
.content{padding:16px;min-height:calc(100vh - 200px)}
.loading{text-align:center;padding:60px;color:#94a3b8;font-size:13px}

/* 配車表（タイムライン） */
.timeline-ctrl{display:flex;align-items:center;gap:8px;padding:10px 0;margin-bottom:10px;flex-wrap:wrap}
.timeline-ctrl button{padding:6px 14px;font-size:12px;font-weight:700;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer}
.timeline-ctrl .ym-label{font-size:14px;font-weight:900;color:#1e293b;min-width:90px;text-align:center}

.tl-wrap{overflow:auto;border:1px solid #e2e8f0;border-radius:8px;background:#fff;max-height:calc(100vh - 320px)}
.tl-table{border-collapse:collapse;font-size:11px;width:max-content}
.tl-table th{padding:6px 4px;font-size:10px;font-weight:700;color:#475569;background:#f8fafc;border-bottom:2px solid #e2e8f0;border-right:1px solid #e2e8f0;white-space:nowrap;position:sticky;top:0;z-index:10;text-align:center;min-width:32px}
.tl-table th.vh-h{position:sticky;left:0;z-index:20;background:#f8fafc;min-width:200px;text-align:left;padding-left:10px}
.tl-table th.wknd{background:#fef3c7;color:#92400e}
.tl-table td{padding:0;border-bottom:1px solid #f1f5f9;border-right:1px solid #e2e8f0;position:relative;height:30px}
.tl-table td.vh-c{position:sticky;left:0;z-index:5;background:#fff;padding:4px 10px;min-width:200px;border-right:2px solid #94a3b8;font-size:11px}
.tl-table td.wknd{background:#fffbeb}
.tl-table td.today{background:#eff6ff!important}
.tl-table td.has-bar{cursor:pointer}
.tl-table td.has-bar:hover{background:#f1f5f9!important}

.cls-row td{background:#dbeafe!important;font-weight:800;color:#1e40af;padding:5px 10px}
.cls-row td.vh-c{background:#dbeafe!important}

.vh-cell .code{font-weight:900;color:#2563eb;font-size:12px;margin-right:6px}
.vh-cell .name{color:#64748b;font-size:10px}

.bar{position:absolute;top:3px;bottom:3px;color:#fff;font-size:9px;font-weight:600;display:flex;align-items:center;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer;z-index:2}
.bar-res{background:#dc2626}
.bar-maint{background:repeating-linear-gradient(45deg,#2563eb,#2563eb 4px,#3b82f6 4px,#3b82f6 8px);top:1px;bottom:1px;border:1px solid #1d4ed8}
.bar-partner{background:repeating-linear-gradient(45deg,#7c3aed,#7c3aed 4px,#a855f7 4px,#a855f7 8px);top:1px;bottom:1px;border:1px solid #6d28d9}

/* 予約データタブ */
.data-tbl{width:100%;border-collapse:collapse;font-size:11px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden}
.data-tbl th{padding:8px 10px;font-size:10px;font-weight:700;color:#475569;background:#f8fafc;border-bottom:2px solid #e2e8f0;text-align:left;position:sticky;top:0;z-index:5}
.data-tbl td{padding:7px 10px;font-size:11px;border-bottom:1px solid #f1f5f9}
.data-tbl tr:hover td{background:#f8fafc}
.data-tbl .ota-bdg{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;background:#dbeafe;color:#1e40af}
.data-tbl .status-active{color:#059669;font-weight:700}
.data-tbl .status-done{color:#94a3b8}
.data-tbl .status-future{color:#2563eb;font-weight:600}

/* モーダル */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:9000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:480px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-box h3{font-size:16px;font-weight:900;margin-bottom:14px;color:#1e293b}
.modal-box .field{margin-bottom:14px}
.modal-box label{display:block;font-size:11px;font-weight:700;color:#64748b;margin-bottom:5px}
.modal-box input,.modal-box select{width:100%;padding:9px 12px;border:1.5px solid #d1d5db;border-radius:8px;font-size:13px;font-family:inherit}
.modal-box input:focus,.modal-box select:focus{outline:2px solid #1e40af;border-color:#1e40af}
.modal-box .actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.modal-box .btn-cancel{padding:9px 18px;background:#f1f5f9;color:#475569;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.modal-box .btn-save{padding:9px 24px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.modal-box .btn-save.partner{background:#7c3aed}
.modal-box .btn-del{padding:9px 14px;background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;margin-right:auto}

/* 通知 */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:8px;font-size:12px;font-weight:700;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.3);opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.toast.err{background:#dc2626}
.toast.ok{background:#059669}

@media (max-width: 768px) {
  .summary-card{min-width:calc(50% - 6px)}
  .tab{padding:10px 12px;font-size:12px}
  .content{padding:10px}
}
</style>
</head>
<body>

<!-- ヘッダー -->
<div class="hdr">
  <h1>🚚 HANDYMAN 協力会社ビュー</h1>
  <span id="hd-company" class="company" style="display:none">—</span>
  <span class="ver">v0.1.0</span>
  <button id="hd-logout" class="logout" style="display:none" onclick="logout()">ログアウト</button>
</div>

<!-- ログイン画面 -->
<div id="login" class="login-wrap" style="display:none">
  <h2>🚚 協力会社ログイン</h2>
  <div class="sub">HANDYMAN より発行されたアカウントでログインしてください</div>
  <input id="ipt-email" type="email" placeholder="メールアドレス" autocapitalize="off" autocorrect="off" inputmode="email">
  <input id="ipt-pw" type="password" placeholder="パスワード">
  <div id="login-err" class="err"></div>
  <button id="btn-login" onclick="doLogin()">ログイン</button>
</div>

<!-- メインビュー -->
<div id="main" style="display:none">
  <!-- タブ -->
  <div class="tabs">
    <button class="tab on" id="tab-tl" onclick="switchTab('tl')">📅 配車表</button>
    <button class="tab" id="tab-data" onclick="switchTab('data')">📋 予約データ</button>
  </div>

  <!-- サマリー -->
  <div class="summary" id="summary">
    <div class="summary-card"><div class="lbl">所有車両</div><div class="val" id="sum-veh">—</div></div>
    <div class="summary-card"><div class="lbl">今月予約件数</div><div class="val" id="sum-res">—</div></div>
    <div class="summary-card"><div class="lbl">今月稼働日数</div><div class="val" id="sum-active">—</div></div>
    <div class="summary-card"><div class="lbl">今月稼働率</div><div class="val" id="sum-util">—</div></div>
  </div>

  <!-- コンテンツ -->
  <div class="content">
    <!-- 配車表タブ -->
    <div id="view-tl">
      <div class="timeline-ctrl">
        <button onclick="changeMonth(-1)">◀</button>
        <span class="ym-label" id="ym-label">—</span>
        <button onclick="changeMonth(1)">▶</button>
        <button onclick="changeMonth(0)" style="margin-left:8px">今月</button>
        <span style="margin-left:auto;font-size:11px;color:#94a3b8">クリックで自社予約・メンテ登録（空セル）／ 編集（既存ブロック）</span>
      </div>
      <div class="tl-wrap" id="tl-wrap">
        <div class="loading">読み込み中...</div>
      </div>
    </div>

    <!-- 予約データタブ -->
    <div id="view-data" style="display:none">
      <div class="timeline-ctrl">
        <span style="font-size:11px;color:#64748b;font-weight:700">自社車両の全予約（過去・現在・未来）</span>
        <span id="data-count" style="margin-left:auto;font-size:11px;color:#94a3b8"></span>
      </div>
      <div style="overflow:auto;max-height:calc(100vh - 340px)">
        <table class="data-tbl" id="data-tbl">
          <thead><tr>
            <th>車両</th><th>予約番号</th><th>顧客名</th><th>OTA</th>
            <th>貸出</th><th>返却</th><th>場所</th><th>金額</th><th>状態</th>
          </tr></thead>
          <tbody id="data-body"><tr><td colspan="9" class="loading">読み込み中...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 自社予約・メンテ登録モーダル -->
<div id="modal" class="modal-bg" style="display:none">
  <div class="modal-box">
    <h3 id="modal-title">在庫調整登録</h3>
    <div style="font-size:12px;color:#64748b;margin-bottom:14px" id="modal-vehicle">—</div>
    <div class="field">
      <label>ブロック種別</label>
      <select id="modal-blocktype">
        <option value="partner_reserved">🟣 自社予約（在庫ブロック）</option>
        <option value="maintenance">🔧 メンテナンス</option>
      </select>
    </div>
    <div class="field">
      <label>入庫日（開始）</label>
      <input id="modal-from" type="date">
    </div>
    <div class="field">
      <label>出庫日（終了）</label>
      <input id="modal-to" type="date">
    </div>
    <div class="field">
      <label>メモ（任意）</label>
      <input id="modal-memo" type="text" placeholder="任意の補足情報">
    </div>
    <div class="actions">
      <button id="modal-del" class="btn-del" style="display:none" onclick="doDelete()">🗑️ 削除</button>
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button id="modal-save" class="btn-save partner" onclick="doSave()">登録</button>
    </div>
  </div>
</div>

<!-- トースト通知 -->
<div id="toast" class="toast">—</div>

<!-- Supabase JS -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
/* ─────────────────────────────────────────
 * HANDYMAN 協力会社ビュー (partner.html)
 * v0.1.0 - 2026-05-16
 * 仕様: 自社所有車両のタイムライン + 在庫調整 + 予約データ
 * ───────────────────────────────────────── */

const SB_URL = 'https://ckrxttbnawkclshczsia.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

// 状態
let CURRENT_USER = null;       // Supabase Auth user
let OWNER_COMPANY = null;       // 'PARTNER_001' 等
let OWNER_LABEL = null;         // '○○モータース' 等
let CURRENT_TAB = 'tl';
let CURRENT_YM = null;          // {y:2026, m:5}
let VEHICLES = [];              // 自社車両一覧
let RESERVATIONS = [];          // 自社車両の予約
let FLEET = [];                 // 配車情報
let MAINTENANCE = [];           // メンテ・自社予約ブロック
let MODAL_CONTEXT = null;       // {vehicleCode, date, isEdit, maintRow}

// ─────────────────────────────────
// 認証関連
// ─────────────────────────────────
async function checkAuth() {
  const { data: { session } } = await sb.auth.getSession();
  if (session && session.user) {
    CURRENT_USER = session.user;
    return await resolveOwnerCompany();
  }
  return false;
}

async function resolveOwnerCompany() {
  // Supabase Auth の user_metadata に owner_company が入っている前提
  // 暫定: URLパラメータ ?owner=PARTNER_001 でテストも可能
  const urlOwner = new URLSearchParams(location.search).get('owner');
  if (urlOwner) {
    OWNER_COMPANY = urlOwner;
  } else {
    OWNER_COMPANY = CURRENT_USER.user_metadata?.owner_company
                  || CURRENT_USER.app_metadata?.owner_company;
  }
  if (!OWNER_COMPANY) {
    showToast('owner_company が設定されていません。管理者に連絡してください', 'err');
    return false;
  }
  // partner_companies からラベル取得
  const { data, error } = await sb.from('partner_companies')
    .select('label').eq('id', OWNER_COMPANY).maybeSingle();
  if (data) OWNER_LABEL = data.label;
  else OWNER_LABEL = OWNER_COMPANY;
  return true;
}

async function doLogin() {
  const email = document.getElementById('ipt-email').value.trim();
  const pw = document.getElementById('ipt-pw').value;
  const btn = document.getElementById('btn-login');
  const errEl = document.getElementById('login-err');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'ログイン中...';
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;
    CURRENT_USER = data.user;
    const ok = await resolveOwnerCompany();
    if (!ok) {
      errEl.textContent = 'アカウントに所有者会社が紐づいていません';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'ログイン';
      return;
    }
    location.reload();
  } catch (e) {
    errEl.textContent = e.message || 'ログイン失敗';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'ログイン';
  }
}

async function logout() {
  if (!confirm('ログアウトしますか？')) return;
  await sb.auth.signOut();
  location.reload();
}

// ─────────────────────────────────
// データ取得
// ─────────────────────────────────
async function loadData() {
  if (!OWNER_COMPANY) return;
  try {
    // 車両（自社所有のみ）
    const { data: vehs } = await sb.from('vehicles')
      .select('*').eq('owner_company', OWNER_COMPANY).order('type').order('code');
    VEHICLES = vehs || [];

    if (VEHICLES.length === 0) {
      document.getElementById('tl-wrap').innerHTML =
        '<div class="loading">所有車両が登録されていません。<br>管理者に確認してください。</div>';
      return;
    }

    const vehCodes = VEHICLES.map(v => v.code);

    // 予約（自社車両に配車されているもの）
    const { data: fl } = await sb.from('fleet')
      .select('*').in('vehicle_code', vehCodes);
    FLEET = fl || [];
    const resvIds = [...new Set(FLEET.map(f => f.reservation_id))];

    if (resvIds.length > 0) {
      // 1000件超対応のため分割取得
      RESERVATIONS = [];
      const CHUNK = 500;
      for (let i = 0; i < resvIds.length; i += CHUNK) {
        const chunk = resvIds.slice(i, i + CHUNK);
        const { data: rs } = await sb.from('reservations')
          .select('*').in('id', chunk);
        if (rs) RESERVATIONS = RESERVATIONS.concat(rs);
      }
    } else {
      RESERVATIONS = [];
    }

    // メンテ・自社予約ブロック
    const { data: mt } = await sb.from('maintenance')
      .select('*').in('vehicle_code', vehCodes);
    MAINTENANCE = mt || [];

    updateSummary();
    if (CURRENT_TAB === 'tl') renderTimeline();
    else renderData();
  } catch (e) {
    console.error('[loadData]', e);
    showToast('データ取得エラー: ' + e.message, 'err');
  }
}

function updateSummary() {
  const ym = CURRENT_YM;
  const ymStr = `${ym.y}-${String(ym.m).padStart(2, '0')}`;
  const daysInMonth = new Date(ym.y, ym.m, 0).getDate();

  // 今月の予約件数
  const monthResvs = RESERVATIONS.filter(r => {
    if (r.status === 'cancelled') return false;
    const ld = (r.lend_date || '').substring(0, 7);
    const rd = (r.return_date || '').substring(0, 7);
    return ld === ymStr || rd === ymStr ||
      (ld < ymStr && rd > ymStr);
  });

  // 稼働日数（車両×日のユニーク）
  const activeDays = new Set();
  monthResvs.forEach(r => {
    const f = FLEET.find(x => x.reservation_id === r.id);
    if (!f) return;
    const start = new Date(Math.max(new Date(r.lend_date).getTime(), new Date(`${ymStr}-01`).getTime()));
    const end = new Date(Math.min(new Date(r.return_date).getTime(), new Date(`${ymStr}-${daysInMonth}`).getTime()));
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      activeDays.add(f.vehicle_code + '|' + d.toISOString().substring(0, 10));
    }
  });

  const vehCount = VEHICLES.filter(v => v.active !== false).length;
  const maxDays = vehCount * daysInMonth;
  const util = maxDays > 0 ? Math.round(activeDays.size / maxDays * 100) : 0;

  document.getElementById('sum-veh').textContent = VEHICLES.length + '台';
  document.getElementById('sum-res').textContent = monthResvs.length + '件';
  document.getElementById('sum-active').textContent = activeDays.size + '日';
  document.getElementById('sum-util').textContent = util + '%';
}

// ─────────────────────────────────
// 配車表（タイムライン）レンダリング
// ─────────────────────────────────
function renderTimeline() {
  const wrap = document.getElementById('tl-wrap');
  if (VEHICLES.length === 0) {
    wrap.innerHTML = '<div class="loading">所有車両が登録されていません</div>';
    return;
  }
  const ym = CURRENT_YM;
  const daysInMonth = new Date(ym.y, ym.m, 0).getDate();
  const today = new Date().toISOString().substring(0, 10);
  const dates = [];
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${ym.y}-${String(ym.m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dow = new Date(ds).getDay();
    dates.push({ ds, d, dow, wknd: dow === 0 || dow === 6 });
  }
  document.getElementById('ym-label').textContent = `${ym.y}年${ym.m}月`;

  // クラスでグループ化
  const grps = {};
  VEHICLES.forEach(v => {
    const t = v.type || '?';
    if (!grps[t]) grps[t] = [];
    grps[t].push(v);
  });
  const clsOrder = ['A', 'B', 'C', 'S', 'F', 'H'];
  const sortedTypes = [...clsOrder.filter(t => grps[t]), ...Object.keys(grps).filter(t => clsOrder.indexOf(t) < 0)];

  let html = '<table class="tl-table"><thead><tr>';
  html += '<th class="vh-h">車両</th>';
  dates.forEach(d => {
    html += `<th class="${d.wknd ? 'wknd' : ''}">${d.d}<br><span style="font-size:8px;color:#94a3b8">${'日月火水木金土'[d.dow]}</span></th>`;
  });
  html += '</tr></thead><tbody>';

  sortedTypes.forEach(t => {
    html += `<tr class="cls-row"><td class="vh-c" colspan="${dates.length + 1}">${t}クラス（${grps[t].length}台）</td></tr>`;
    grps[t].forEach(v => {
      html += `<tr data-veh="${v.code}"><td class="vh-c vh-cell"><span class="code">${v.code}</span><span class="name">${v.name || ''} ${v.plate_no || ''}</span></td>`;
      dates.forEach(d => {
        const cls = (d.ds === today ? 'today' : (d.wknd ? 'wknd' : ''));
        html += `<td class="${cls} has-bar" data-veh="${v.code}" data-date="${d.ds}"></td>`;
      });
      html += '</tr>';
    });
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;

  // セルクリックハンドラ
  wrap.querySelectorAll('td.has-bar').forEach(td => {
    td.addEventListener('click', (e) => onCellClick(td.dataset.veh, td.dataset.date));
  });

  // バー描画
  drawBars(dates);
}

function drawBars(dates) {
  const dateIdx = {};
  dates.forEach((d, i) => dateIdx[d.ds] = i);
  // 予約バー
  RESERVATIONS.forEach(r => {
    if (r.status === 'cancelled') return;
    const f = FLEET.find(x => x.reservation_id === r.id);
    if (!f) return;
    const ld = r.lend_date, rd = r.return_date;
    if (!ld || !rd) return;
    placeBar(f.vehicle_code, ld, rd, 'bar-res', `${(r.lend_time || '').substring(0,5)}-${(r.return_time || '').substring(0,5)} ${r.name || ''}様`, () => alert(`予約詳細\n\n予約番号: ${r.id}\n顧客名: ${r.name}\n貸出: ${ld} ${r.lend_time || ''}\n返却: ${rd} ${r.return_time || ''}\nOTA: ${r.ota || ''}\n金額: ¥${(r.price || 0).toLocaleString()}`));
  });
  // メンテ・自社予約ブロック
  MAINTENANCE.forEach(m => {
    const ld = m.start_date || m.from_date, rd = m.end_date || m.to_date;
    if (!ld || !rd) return;
    const isPartnerResv = m.block_type === 'partner_reserved';
    const klass = isPartnerResv ? 'bar-partner' : 'bar-maint';
    const label = isPartnerResv ? '🟣 自社予約' : `🔧 ${m.label || 'メンテ'}`;
    placeBar(m.vehicle_code, ld, rd, klass, label, () => openModalEdit(m));
  });
  // 配置
  function placeBar(vehCode, ld, rd, klass, label, onClick) {
    const row = document.querySelector(`tr[data-veh="${vehCode}"]`);
    if (!row) return;
    const tds = row.querySelectorAll('td.has-bar');
    if (tds.length === 0) return;
    const ldKey = ld.substring(0, 10), rdKey = rd.substring(0, 10);
    const ldIdx = dateIdx[ldKey];
    const rdIdx = dateIdx[rdKey];
    // 範囲外（月をまたぐ場合）は調整
    const startIdx = (ldIdx !== undefined) ? ldIdx : 0;
    const endIdx = (rdIdx !== undefined) ? rdIdx : (tds.length - 1);
    if (ldIdx === undefined && rdIdx === undefined) return; // この月に含まれない
    if (startIdx > endIdx) return;
    const startTd = tds[startIdx];
    const span = endIdx - startIdx + 1;
    if (!startTd) return;
    const width = startTd.offsetWidth * span - 4;
    const bar = document.createElement('div');
    bar.className = 'bar ' + klass;
    bar.style.left = '2px';
    bar.style.width = (width) + 'px';
    bar.textContent = label;
    bar.title = label;
    bar.addEventListener('click', (e) => { e.stopPropagation(); onClick(); });
    startTd.appendChild(bar);
  }
}

// ─────────────────────────────────
// 予約データタブ
// ─────────────────────────────────
function renderData() {
  const body = document.getElementById('data-body');
  if (VEHICLES.length === 0) {
    body.innerHTML = '<tr><td colspan="9" class="loading">所有車両なし</td></tr>';
    return;
  }
  if (RESERVATIONS.length === 0) {
    body.innerHTML = '<tr><td colspan="9" class="loading">予約データなし</td></tr>';
    return;
  }
  const today = new Date().toISOString().substring(0, 10);
  // 出発日降順ソート
  const sorted = [...RESERVATIONS].sort((a, b) => (b.lend_date || '').localeCompare(a.lend_date || ''));
  let html = '';
  sorted.forEach(r => {
    const f = FLEET.find(x => x.reservation_id === r.id);
    const vc = f ? f.vehicle_code : '—';
    const veh = VEHICLES.find(v => v.code === vc);
    let status, statusCls;
    if (r.status === 'cancelled') { status = 'キャンセル'; statusCls = 'status-done'; }
    else if (r.return_date < today) { status = '完了'; statusCls = 'status-done'; }
    else if (r.lend_date <= today && r.return_date >= today) { status = '貸出中'; statusCls = 'status-active'; }
    else { status = '予約済'; statusCls = 'status-future'; }

    const otaLabel = { J:'じゃらん', R:'楽天', S:'スカイ', O:'エアトリ', HP:'HP', RC:'レンカ', G:'GoGo' }[r.ota] || r.ota || '—';
    const place = r.del_place || r.col_place || '—';

    html += `<tr><td><b>${vc}</b> ${veh ? veh.plate_no || '' : ''}</td>` +
      `<td><code style="font-size:10px;color:#2563eb">${r.id}</code></td>` +
      `<td>${r.name || '—'}様</td>` +
      `<td><span class="ota-bdg">${otaLabel}</span></td>` +
      `<td>${r.lend_date || '—'} ${(r.lend_time || '').substring(0, 5)}</td>` +
      `<td>${r.return_date || '—'} ${(r.return_time || '').substring(0, 5)}</td>` +
      `<td style="font-size:10px;color:#64748b">${place}</td>` +
      `<td>¥${(r.price || 0).toLocaleString()}</td>` +
      `<td class="${statusCls}">${status}</td></tr>`;
  });
  body.innerHTML = html;
  document.getElementById('data-count').textContent = `${sorted.length}件`;
}

// ─────────────────────────────────
// 在庫調整モーダル
// ─────────────────────────────────
function onCellClick(vehCode, date) {
  // 既存ブロックを確認
  const existingMaint = MAINTENANCE.find(m => {
    if (m.vehicle_code !== vehCode) return false;
    const s = m.start_date || m.from_date;
    const e = m.end_date || m.to_date;
    return s <= date && date <= e;
  });
  if (existingMaint) {
    openModalEdit(existingMaint);
    return;
  }
  // 既存予約のセルか確認 (予約セルは編集不可)
  const f = FLEET.find(x => {
    if (x.vehicle_code !== vehCode) return false;
    const r = RESERVATIONS.find(rr => rr.id === x.reservation_id && rr.status !== 'cancelled');
    if (!r) return false;
    return r.lend_date <= date && date <= r.return_date;
  });
  if (f) {
    showToast('予約済みの日付です（編集はマスター側でのみ可能）', 'err');
    return;
  }
  // 新規登録
  openModalAdd(vehCode, date);
}

function openModalAdd(vehCode, date) {
  const veh = VEHICLES.find(v => v.code === vehCode);
  MODAL_CONTEXT = { vehicleCode: vehCode, date, isEdit: false };
  document.getElementById('modal-title').textContent = '在庫調整 新規登録';
  document.getElementById('modal-vehicle').textContent = `車両: ${veh.name || ''} (${vehCode}) ${veh.plate_no || ''}`;
  document.getElementById('modal-blocktype').value = 'partner_reserved';
  document.getElementById('modal-from').value = date;
  document.getElementById('modal-to').value = date;
  document.getElementById('modal-memo').value = '';
  document.getElementById('modal-del').style.display = 'none';
  document.getElementById('modal').style.display = 'flex';
}

function openModalEdit(maintRow) {
  const veh = VEHICLES.find(v => v.code === maintRow.vehicle_code);
  // 他社管理データ（owner_company が異なる）は編集不可
  const isOwnRow = !maintRow.owner_company || maintRow.owner_company === OWNER_COMPANY || maintRow.owner_company === 'HANDYMAN';
  if (maintRow.owner_company && maintRow.owner_company !== OWNER_COMPANY && maintRow.owner_company !== 'HANDYMAN') {
    showToast('他社管理のデータは編集できません', 'err');
    return;
  }
  MODAL_CONTEXT = { vehicleCode: maintRow.vehicle_code, isEdit: true, maintRow };
  document.getElementById('modal-title').textContent = '在庫調整 編集';
  document.getElementById('modal-vehicle').textContent = `車両: ${veh ? veh.name || '' : ''} (${maintRow.vehicle_code})`;
  document.getElementById('modal-blocktype').value = maintRow.block_type || 'maintenance';
  document.getElementById('modal-from').value = (maintRow.start_date || maintRow.from_date || '').substring(0, 10);
  document.getElementById('modal-to').value = (maintRow.end_date || maintRow.to_date || '').substring(0, 10);
  document.getElementById('modal-memo').value = maintRow.memo || '';
  document.getElementById('modal-del').style.display = '';
  document.getElementById('modal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
  MODAL_CONTEXT = null;
}

async function doSave() {
  if (!MODAL_CONTEXT) return;
  const blockType = document.getElementById('modal-blocktype').value;
  const fromDate = document.getElementById('modal-from').value;
  const toDate = document.getElementById('modal-to').value;
  const memo = document.getElementById('modal-memo').value;
  if (!fromDate || !toDate) { showToast('日付を入力してください', 'err'); return; }
  if (fromDate > toDate) { showToast('開始日が終了日より後になっています', 'err'); return; }

  const row = {
    vehicle_code: MODAL_CONTEXT.vehicleCode,
    start_date: fromDate,
    end_date: toDate,
    label: blockType === 'partner_reserved' ? '自社予約' : 'メンテナンス',
    block_type: blockType,
    owner_company: OWNER_COMPANY,
    memo: memo || null
  };

  try {
    if (MODAL_CONTEXT.isEdit && MODAL_CONTEXT.maintRow) {
      const { error } = await sb.from('maintenance').update(row).eq('id', MODAL_CONTEXT.maintRow.id);
      if (error) throw error;
      await logAction(blockType === 'partner_reserved' ? 'partner_reserved_add' : 'maintenance_add', MODAL_CONTEXT.vehicleCode, fromDate, toDate, row);
      showToast('✅ 更新しました', 'ok');
    } else {
      const { error } = await sb.from('maintenance').insert(row);
      if (error) throw error;
      await logAction(blockType === 'partner_reserved' ? 'partner_reserved_add' : 'maintenance_add', MODAL_CONTEXT.vehicleCode, fromDate, toDate, row);
      showToast('✅ 登録しました', 'ok');
    }
    closeModal();
    await loadData();
  } catch (e) {
    console.error(e);
    showToast('保存失敗: ' + e.message, 'err');
  }
}

async function doDelete() {
  if (!MODAL_CONTEXT || !MODAL_CONTEXT.maintRow) return;
  if (!confirm('このブロックを削除しますか？')) return;
  try {
    const m = MODAL_CONTEXT.maintRow;
    const { error } = await sb.from('maintenance').delete().eq('id', m.id);
    if (error) throw error;
    await logAction(m.block_type === 'partner_reserved' ? 'partner_reserved_delete' : 'maintenance_delete',
                    m.vehicle_code, m.start_date || m.from_date, m.end_date || m.to_date, m);
    showToast('🗑️ 削除しました', 'ok');
    closeModal();
    await loadData();
  } catch (e) {
    showToast('削除失敗: ' + e.message, 'err');
  }
}

async function logAction(actionType, vehicleCode, dateFrom, dateTo, payload) {
  try {
    await sb.from('partner_actions').insert({
      owner_company: OWNER_COMPANY,
      user_email: CURRENT_USER?.email || null,
      action_type: actionType,
      vehicle_code: vehicleCode,
      target_date_from: dateFrom,
      target_date_to: dateTo,
      payload: payload
    });
  } catch (e) {
    console.warn('[logAction]', e);
  }
}

// ─────────────────────────────────
// UI制御
// ─────────────────────────────────
function switchTab(t) {
  CURRENT_TAB = t;
  document.getElementById('tab-tl').classList.toggle('on', t === 'tl');
  document.getElementById('tab-data').classList.toggle('on', t === 'data');
  document.getElementById('view-tl').style.display = (t === 'tl') ? '' : 'none';
  document.getElementById('view-data').style.display = (t === 'data') ? '' : 'none';
  if (t === 'tl') renderTimeline();
  else renderData();
}

function changeMonth(delta) {
  if (delta === 0) {
    const now = new Date();
    CURRENT_YM = { y: now.getFullYear(), m: now.getMonth() + 1 };
  } else {
    let y = CURRENT_YM.y, m = CURRENT_YM.m + delta;
    if (m > 12) { y++; m = 1; }
    if (m < 1) { y--; m = 12; }
    CURRENT_YM = { y, m };
  }
  updateSummary();
  renderTimeline();
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

// ─────────────────────────────────
// 初期化
// ─────────────────────────────────
(async () => {
  const authed = await checkAuth();
  if (!authed) {
    document.getElementById('login').style.display = '';
    return;
  }
  // 認証済み
  document.getElementById('login').style.display = 'none';
  document.getElementById('main').style.display = '';
  document.getElementById('hd-company').style.display = '';
  document.getElementById('hd-logout').style.display = '';
  document.getElementById('hd-company').textContent = '🏢 ' + (OWNER_LABEL || OWNER_COMPANY);
  const now = new Date();
  CURRENT_YM = { y: now.getFullYear(), m: now.getMonth() + 1 };
  await loadData();
})();
</script>
