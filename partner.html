<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>協力会社 車両P&L</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;background:#f3f4f6;color:#1e293b;padding:14px;max-width:1700px;margin:0 auto}
.hdr{background:linear-gradient(135deg,#4c1d95,#7c3aed);color:#fff;padding:14px 18px;border-radius:12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.hdr h1{font-size:18px;font-weight:800}
.hdr .sub{font-size:11px;opacity:.9;margin-top:3px}
.back-btn{background:#fff;color:#5b21b6;border:0;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700}
.controls{background:#fff;padding:10px 14px;border-radius:10px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.controls select,.controls button{padding:6px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;background:#fff;cursor:pointer}
.controls .lbl{font-size:11px;color:#475569;font-weight:600}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.kpi-card{background:#fff;padding:14px 18px;border-radius:10px;border:1px solid #e5e7eb}
.kpi-card .lbl{font-size:10px;color:#64748b;font-weight:600;margin-bottom:4px}
.kpi-card .val{font-size:22px;font-weight:800;color:#0f172a;font-variant-numeric:tabular-nums}
.kpi-card.rev{border-color:#86efac;background:linear-gradient(135deg,#f0fdf4,#dcfce7)}
.kpi-card.rev .val{color:#15803d}
.kpi-card.cost{border-color:#fca5a5;background:linear-gradient(135deg,#fef2f2,#fee2e2)}
.kpi-card.cost .val{color:#b91c1c}
.kpi-card.profit{border-color:#fbbf24;background:linear-gradient(135deg,#fffbeb,#fef3c7)}
.kpi-card.profit .val{color:#92400e}
.kpi-card.profit.neg .val{color:#dc2626}
.kpi-card .sub{font-size:11px;color:#64748b;margin-top:4px;font-weight:500}
.sec{background:#fff;border-radius:10px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sec-hdr{padding:12px 16px;background:linear-gradient(135deg,#1e293b,#334155);color:#fff;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;flex-wrap:wrap;gap:10px}
.sec-hdr .ttl{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec-hdr .arrow{font-size:11px;width:14px;transition:transform .15s;display:inline-block}
.sec-hdr.open .arrow{transform:rotate(90deg)}
.sec-hdr .stats{display:flex;gap:8px;font-size:11px;flex-wrap:wrap}
.sec-hdr .stat{padding:3px 10px;border-radius:5px;background:rgba(255,255,255,.18);font-weight:700}
.sec-hdr .stat.rev{background:#bbf7d0;color:#15803d}
.sec-hdr .stat.cost{background:#fecaca;color:#991b1b}
.sec-hdr .stat.profit{background:#fef3c7;color:#92400e}
.sec-hdr .stat.profit.neg{background:#fee2e2;color:#dc2626}
.sec-body{padding:0;display:none;overflow-x:auto}
.sec-body.open{display:block}
table{width:100%;border-collapse:collapse;font-size:11px;min-width:900px}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid #e5e7eb;white-space:nowrap;font-variant-numeric:tabular-nums}
th{background:#f1f5f9;font-weight:700;color:#475569;font-size:10px;position:sticky;top:0;z-index:1}
th.l,td.l{text-align:left}
td.l{font-weight:700;color:#1e293b;background:#fff;position:sticky;left:0;z-index:1;border-right:2px solid #cbd5e1}
td.rev{color:#15803d}
td.cost{color:#b91c1c}
td.profit{color:#0f172a;font-weight:700;background:#fef3c7}
td.profit.neg{color:#dc2626;background:#fee2e2}
td.tot{background:#1e293b;color:#fff;font-weight:800}
tr.resv-row:nth-child(even) td{background:#f8fafc}
.loading{padding:40px;text-align:center;color:#64748b}
.error{padding:20px;background:#fee2e2;color:#991b1b;border-radius:8px;margin:10px 0;font-size:12px}
.warn{padding:14px;background:#fef3c7;color:#92400e;border-radius:8px;margin-bottom:10px;font-size:12px;line-height:1.7}
.warn b{color:#78350f}
.warn code{display:block;margin-top:6px;padding:8px 10px;background:#fff;border-radius:4px;font-family:monospace;font-size:11px;color:#1e293b;border:1px solid #fbbf24;white-space:pre}
.veh-name{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.veh-name .nm{font-weight:800;color:#fff;font-size:13px}
.veh-name .code{font-size:9px;color:rgba(255,255,255,.7);font-weight:500;background:rgba(255,255,255,.1);padding:1px 4px;border-radius:3px}
.veh-name .plate{font-size:12px;background:#fff;color:#1d4ed8;padding:2px 9px;border-radius:5px;font-weight:800;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.veh-name .daily{font-size:10px;background:#dc2626;color:#fff;padding:2px 8px;border-radius:3px;font-weight:700}
.veh-name .nopt{font-size:9px;color:#fca5a5;background:rgba(239,68,68,.2);padding:1px 5px;border-radius:3px;font-weight:700}
.legend{padding:10px 14px;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:11px;color:#475569;line-height:1.7}
.legend b{color:#1e293b}
.cost-edit{display:inline-flex;align-items:center;gap:4px;margin-left:6px}
.cost-edit input{width:90px;padding:4px 8px;border:1px solid rgba(255,255,255,.3);border-radius:4px;font-size:11px;text-align:right;background:rgba(255,255,255,.15);color:#fff;font-weight:700}
.cost-edit input:focus{outline:none;border-color:#fff;background:#fff;color:#dc2626}
.cost-edit .save{padding:4px 10px;background:#fff;color:#dc2626;border:0;border-radius:4px;font-size:10px;font-weight:800;cursor:pointer;display:none}
.cost-edit input.dirty+.save{display:inline-block}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <h1 id="hdrTitle">🚗 協力会社 車両P&L</h1>
    <div class="sub" id="hdrSub">読込中...</div>
  </div>
  <button class="back-btn" onclick="history.back()">← 戻る</button>
</div>

<div class="controls">
  <span class="lbl">期間:</span>
  <select id="periodStart">
    <option value="2026-02">2026年2月〜 (PERIOD_START)</option>
    <option value="2026-04">2026年4月〜</option>
    <option value="2026-01">2026年1月〜</option>
  </select>
  <select id="periodEnd"></select>
  <button onclick="expandAll()">▼ 全展開</button>
  <button onclick="collapseAll()">▶ 全折りたたみ</button>
  <button onclick="loadAndRender()">🔄 再読込</button>
  <span style="margin-left:auto;font-size:11px;color:#475569" id="status">準備中...</span>
</div>

<div id="kpiSummary"></div>
<div id="content"><div class="loading">⏳ データ取得中...</div></div>

<script>
const SUPA='https://ckrxttbnawkclshczsia.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
let TOKEN=null;
let OWNER=new URLSearchParams(location.search).get('owner')||'PARTNER_TEST';
let SCHEMA_HAS_DAILY_COST=true;

async function auth(){
  const cached=localStorage.getItem('hm2_auth_token');
  if(cached){TOKEN=cached;return;}
  const r=await fetch(`${SUPA}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email:'member@g-lines.jp',password:'8888'})});
  const j=await r.json();
  if(j.access_token){TOKEN=j.access_token;localStorage.setItem('hm2_auth_token',TOKEN);}
}
async function sb(path){
  const h={'apikey':KEY};if(TOKEN)h['Authorization']='Bearer '+TOKEN;
  const r=await fetch(`${SUPA}/rest/v1/${path}`,{headers:h});
  if(r.status===401){localStorage.removeItem('hm2_auth_token');TOKEN=null;await auth();return sb(path);}
  if(r.status>=400){const t=await r.text();throw new Error(`HTTP ${r.status}: ${t}`);}
  return r.json();
}
async function sbAll(table,params){
  const rows=[];let off=0;const lim=1000;
  while(true){
    const p=params?(params+'&'):'';
    const data=await sb(`${table}?${p}limit=${lim}&offset=${off}`);
    if(!Array.isArray(data))break;
    rows.push(...data);
    if(data.length<lim)break;
    off+=lim;
  }
  return rows;
}

function genMonths(s,e){
  const out=[];const[sy,sm]=s.split('-').map(Number);const[ey,em]=e.split('-').map(Number);
  let y=sy,m=sm;
  while(y<ey||(y===ey&&m<=em)){out.push(`${y}-${String(m).padStart(2,'0')}`);m++;if(m>12){m=1;y++;}}
  return out;
}
function daysInMonth(ym){const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();}

const fmt=n=>{if(!n||n===0)return '—';return (n>=0?'¥':'-¥')+Math.abs(Math.round(n)).toLocaleString();};
const fmtPlus=n=>n>0?'+¥'+Math.round(n).toLocaleString():n<0?'-¥'+Math.abs(Math.round(n)).toLocaleString():'¥0';

const calcRev=r=>{
  const bp=+(r.base_price||0),op=+(r.option_price||0),disc=+(r.discount||0);
  if(bp>0||op>0)return Math.max(0,bp+op-disc);
  return +(r.price||0);
};
const calcDays=(ld,rd)=>{
  if(!ld||!rd)return 0;
  const d1=new Date(ld+'T00:00:00'),d2=new Date(rd+'T00:00:00');
  return Math.max(1,Math.round((d2-d1)/86400000)+1);
};

async function saveDailyCost(code,val){
  try{
    const r=await fetch(`${SUPA}/rest/v1/vehicles?code=eq.${encodeURIComponent(code)}`,{
      method:'PATCH',
      headers:{'apikey':KEY,'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json','Prefer':'return=representation'},
      body:JSON.stringify({partner_daily_cost:parseInt(val)||0})
    });
    if(!r.ok)throw new Error(await r.text());
    return true;
  }catch(e){console.error('saveDailyCost',e);return false;}
}
function onDailyCostInput(input){input.classList.add('dirty');}
async function onDailyCostSave(btn,code){
  const input=btn.previousElementSibling;
  const ok=await saveDailyCost(code,input.value);
  if(ok){input.classList.remove('dirty');btn.style.display='none';setTimeout(loadAndRender,300);}
  else{alert('⚠️ 保存失敗\npartner_daily_cost カラムがDBにない可能性。\nSupabase SQL Editor で以下を実行:\n\nALTER TABLE vehicles ADD COLUMN partner_daily_cost INT DEFAULT 0;\nNOTIFY pgrst, \'reload schema\';');}
}

async function fetchAll(){
  const ps=document.getElementById('periodStart').value;
  const pe=document.getElementById('periodEnd').value;
  document.getElementById('status').textContent='⏳ Supabase問い合わせ中...';
  let vehs;
  try{
    vehs=await sbAll('vehicles',`select=*&owner_company=eq.${encodeURIComponent(OWNER)}&order=type,code`);
    if(vehs.length>0&&!('partner_daily_cost' in vehs[0]))SCHEMA_HAS_DAILY_COST=false;
  }catch(e){
    SCHEMA_HAS_DAILY_COST=false;
    vehs=await sbAll('vehicles',`select=code,name,plate_no,type,owner_company,owner_label,active&owner_company=eq.${encodeURIComponent(OWNER)}&order=type,code`);
  }
  if(vehs.length===0)throw new Error(`所有者 "${OWNER}" の車両が見つかりません`);
  const vehCodes=vehs.map(v=>'"'+v.code+'"').join(',');
  const [fleet,resv,kpi]=await Promise.all([
    sbAll('fleet',`select=reservation_id,vehicle_code&vehicle_code=in.(${vehCodes})`),
    sbAll('reservations',`select=id,price,base_price,option_price,discount,return_date,lend_date,status,ota,name&return_date=gte.${ps}-01&return_date=lte.${pe}-31&status=neq.cancelled`),
    sbAll('vehicle_monthly_kpi',`select=year_month,vehicle_code,active&vehicle_code=in.(${vehCodes})`)
  ]);
  document.getElementById('status').textContent=`✅ ${vehs.length}台 / 予約 ${resv.length}件 (${new Date().toLocaleTimeString()})`;
  return{vehs,fleet,resv,kpi,periodStart:ps,periodEnd:pe};
}

function aggregate(data){
  const{vehs,fleet,resv,kpi,periodStart,periodEnd}=data;
  const fleetMap={};fleet.forEach(f=>{fleetMap[f.reservation_id]=f.vehicle_code;});
  const kpiMap={};kpi.forEach(k=>{if(!kpiMap[k.vehicle_code])kpiMap[k.vehicle_code]={};kpiMap[k.vehicle_code][k.year_month]=k.active;});
  const months=genMonths(periodStart,periodEnd);
  const vehStats={};
  vehs.forEach(v=>{
    const dailyCost=+(v.partner_daily_cost||0);
    vehStats[v.code]={veh:v,dailyCost,monthRev:{},monthCost:{},monthProfit:{},monthResv:{},activeMonths:{},monthActiveDays:{}};
    months.forEach(ym=>{
      const isActive=kpiMap[v.code]&&kpiMap[v.code][ym]!==undefined?kpiMap[v.code][ym]:!!v.active;
      const days=isActive?daysInMonth(ym):0;
      vehStats[v.code].activeMonths[ym]=isActive;
      vehStats[v.code].monthActiveDays[ym]=days;
      vehStats[v.code].monthRev[ym]=0;
      vehStats[v.code].monthCost[ym]=days*dailyCost;
      vehStats[v.code].monthResv[ym]=[];
    });
  });
  resv.forEach(r=>{
    const vc=fleetMap[r.id];
    if(!vc||!vehStats[vc])return;
    const ym=(r.return_date||'').slice(0,7);
    if(!vehStats[vc].monthRev.hasOwnProperty(ym))return;
    const rev=calcRev(r);
    vehStats[vc].monthRev[ym]+=rev;
    const days=calcDays(r.lend_date,r.return_date);
    const resvCost=days*vehStats[vc].dailyCost;
    vehStats[vc].monthResv[ym].push({...r,rev,days,resvCost});
  });
  Object.values(vehStats).forEach(s=>{months.forEach(ym=>{s.monthProfit[ym]=s.monthRev[ym]-s.monthCost[ym];});});
  return{months,vehStats};
}

function renderKpiSummary(data,agg){
  const{vehs}=data;const{months,vehStats}=agg;
  let totRev=0,totCost=0;
  Object.values(vehStats).forEach(s=>{months.forEach(ym=>{totRev+=s.monthRev[ym];totCost+=s.monthCost[ym];});});
  const totProfit=totRev-totCost;
  const totDays=months.reduce((a,ym)=>{return a+Object.values(vehStats).reduce((b,s)=>b+s.monthActiveDays[ym],0);},0);
  document.getElementById('kpiSummary').innerHTML=`<div class="kpi-grid">
    <div class="kpi-card"><div class="lbl">📋 車両数</div><div class="val">${vehs.length}台</div><div class="sub">期間内 ${totDays}日 稼働可能</div></div>
    <div class="kpi-card rev"><div class="lbl">💰 合計売上</div><div class="val">${fmt(totRev)}</div><div class="sub">${months.length}ヶ月分</div></div>
    <div class="kpi-card cost"><div class="lbl">📉 合計コスト</div><div class="val">${fmt(totCost)}</div><div class="sub">${SCHEMA_HAS_DAILY_COST?'日額×稼働日数':'⚠️ DBカラム未追加'}</div></div>
    <div class="kpi-card profit ${totProfit<0?'neg':''}"><div class="lbl">📈 合計粗利</div><div class="val">${fmtPlus(totProfit)}</div><div class="sub">売上 − コスト</div></div>
  </div>`;
}

function render(data){
  const agg=aggregate(data);
  renderKpiSummary(data,agg);
  const{vehs}=data;const{months,vehStats}=agg;
  let html='';
  if(!SCHEMA_HAS_DAILY_COST){
    html+=`<div class="warn"><b>⚠️ partner_daily_cost カラムが未追加です。</b><br>Supabase SQL Editor で実行してください:<code>ALTER TABLE vehicles ADD COLUMN IF NOT EXISTS partner_daily_cost INT DEFAULT 0;
NOTIFY pgrst, 'reload schema';</code>実行後、再読込ボタンで反映。</div>`;
  }
  vehs.forEach(v=>{
    const s=vehStats[v.code];if(!s)return;
    const totRev=months.reduce((a,ym)=>a+s.monthRev[ym],0);
    const totCost=months.reduce((a,ym)=>a+s.monthCost[ym],0);
    const totProfit=totRev-totCost;
    const totDays=months.reduce((a,ym)=>a+s.monthActiveDays[ym],0);
    const dailyCost=s.dailyCost;
    const plate=(v.plate_no||'').trim();
    const isValidPlate=plate&&!['未定','確認','-','—','TBD','tbd','none'].includes(plate);
    const vehHdr=`<div class="veh-name">
      <span class="nm">${v.name||'(車種未登録)'}</span>
      ${isValidPlate?`<span class="plate">${plate}</span>`:'<span class="nopt">⚠️ナンバー未登録</span>'}
      <span class="code">${v.code}</span>
      <span class="daily">¥${dailyCost.toLocaleString()}/日</span>
      ${SCHEMA_HAS_DAILY_COST?`<span class="cost-edit">日額編集:<input type="number" value="${dailyCost}" oninput="event.stopPropagation();onDailyCostInput(this)" onclick="event.stopPropagation()"><button class="save" onclick="event.stopPropagation();onDailyCostSave(this,'${v.code}')">💾保存</button></span>`:''}
    </div>`;
    html+=`<div class="sec">
      <div class="sec-hdr open" onclick="this.classList.toggle('open');this.parentNode.querySelector('.sec-body').classList.toggle('open');">
        <span class="ttl"><span class="arrow">▶</span> ${vehHdr}</span>
        <div class="stats">
          <span class="stat rev">💰 ${fmt(totRev)}</span>
          <span class="stat cost">📉 ${fmt(totCost)} (${totDays}日)</span>
          <span class="stat profit ${totProfit<0?'neg':''}">📈 ${fmtPlus(totProfit)}</span>
        </div>
      </div>
      <div class="sec-body open">
        <table>
          <thead><tr>
            <th class="l" style="min-width:200px">指標</th>
            ${months.map(ym=>`<th style="min-width:100px">${ym.slice(5)}月 (${daysInMonth(ym)}日)</th>`).join('')}
            <th style="min-width:120px;background:#1e293b;color:#fff">合計</th>
          </tr></thead>
          <tbody>
            <tr><td class="l">稼働日数</td>${months.map(ym=>`<td>${s.monthActiveDays[ym]>0?s.monthActiveDays[ym]+'日':'除外'}</td>`).join('')}<td class="tot">${totDays}日</td></tr>
            <tr><td class="l">💰 売上</td>${months.map(ym=>`<td class="rev">${fmt(s.monthRev[ym])}</td>`).join('')}<td class="rev tot">${fmt(totRev)}</td></tr>
            <tr><td class="l">📉 コスト (日額×日数)</td>${months.map(ym=>`<td class="cost">${s.monthCost[ym]>0?'-'+fmt(s.monthCost[ym]).replace('¥','¥'):'—'}</td>`).join('')}<td class="cost tot">-${fmt(totCost).replace('¥','¥')}</td></tr>
            <tr><td class="l">📈 粗利</td>${months.map(ym=>{const p=s.monthProfit[ym];return `<td class="profit ${p<0?'neg':''}">${fmtPlus(p)}</td>`;}).join('')}<td class="tot" style="background:${totProfit<0?'#dc2626':'#15803d'};color:#fff">${fmtPlus(totProfit)}</td></tr>
          </tbody>
        </table>
        <div style="padding:12px 14px;background:#f8fafc;border-top:1px solid #e2e8f0">
          <div style="font-size:12px;font-weight:800;color:#475569;margin-bottom:8px">📋 期間内の予約一覧 — 各予約に「日額コスト × 予約日数」をコストとして反映</div>
          <table style="font-size:11px;min-width:1000px">
            <thead><tr><th class="l">予約番号</th><th class="l">顧客</th><th class="l">OTA</th><th>貸出</th><th>返却</th><th>泊数</th><th>売上</th><th>日額</th><th>コスト</th><th>粗利</th></tr></thead>
            <tbody>
              ${(()=>{let lines='',sumR=0,sumC=0,sumP=0,cnt=0;months.forEach(ym=>{(s.monthResv[ym]||[]).forEach(r=>{const p=r.rev-r.resvCost;sumR+=r.rev;sumC+=r.resvCost;sumP+=p;cnt++;lines+=`<tr class="resv-row"><td class="l">${r.id||''}</td><td class="l">${r.name||''}</td><td class="l">${r.ota||''}</td><td>${r.lend_date||''}</td><td>${r.return_date||''}</td><td>${r.days}泊</td><td class="rev">${fmt(r.rev)}</td><td>¥${dailyCost.toLocaleString()}</td><td class="cost">-${fmt(r.resvCost).replace('¥','¥')}</td><td class="profit ${p<0?'neg':''}">${fmtPlus(p)}</td></tr>`;});});if(lines==='')return '<tr><td colspan="10" style="text-align:center;color:#94a3b8;padding:14px">この期間に予約なし</td></tr>';return lines+`<tr><td colspan="6" class="l" style="background:#1e293b;color:#fff;font-weight:800">合計 (${cnt}件)</td><td class="rev tot">${fmt(sumR)}</td><td class="tot">—</td><td class="cost tot">-${fmt(sumC).replace('¥','¥')}</td><td class="tot" style="background:${sumP<0?'#dc2626':'#15803d'};color:#fff">${fmtPlus(sumP)}</td></tr>`;})()}
            </tbody>
          </table>
        </div>
        <div class="legend">
          <b>📐 月コスト =</b> 日額コスト (¥${dailyCost.toLocaleString()}) × 稼働日数 (vehicle_monthly_kpi.active=true の月の暦日数)<br>
          <b>📐 予約コスト =</b> 日額コスト × 予約日数 (返却日 − 貸出日 + 1)<br>
          <b>📈 粗利 =</b> 売上 − コスト
        </div>
      </div>
    </div>`;
  });
  document.getElementById('content').innerHTML=html;
}

function expandAll(){document.querySelectorAll('.sec-hdr').forEach(h=>{h.classList.add('open');h.parentNode.querySelector('.sec-body').classList.add('open');});}
function collapseAll(){document.querySelectorAll('.sec-hdr').forEach(h=>{h.classList.remove('open');h.parentNode.querySelector('.sec-body').classList.remove('open');});}

async function loadAndRender(){
  try{
    document.getElementById('content').innerHTML='<div class="loading">⏳ データ取得中...</div>';
    document.getElementById('kpiSummary').innerHTML='';
    const data=await fetchAll();
    const ownerLabel=data.vehs[0]?.owner_label||OWNER;
    document.getElementById('hdrTitle').textContent=`🚗 ${ownerLabel} (${OWNER})`;
    document.getElementById('hdrSub').textContent=`${data.vehs.length}台 / 予約${data.resv.length}件 / 期間 ${data.periodStart}〜${data.periodEnd}`;
    render(data);
  }catch(e){
    console.error(e);
    document.getElementById('content').innerHTML=`<div class="error">⚠️ エラー: ${e.message}<br><br>URL に <code>?owner=PARTNER_TEST</code> 等のクエリパラメータが必要です。</div>`;
    document.getElementById('status').textContent='⚠️ エラー';
  }
}

async function init(){
  const sel=document.getElementById('periodEnd');
  const today=new Date();
  const opts=genMonths('2026-02',`${today.getFullYear()+1}-12`);
  opts.forEach(ym=>{
    const o=document.createElement('option');
    o.value=ym;o.textContent=ym+(ym===`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`?' (当月)':'');
    sel.appendChild(o);
  });
  sel.value=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
  await auth();
  await loadAndRender();
}
init();
</script>
</body>
</html>
