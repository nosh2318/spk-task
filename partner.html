<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>HANDYMAN 協力会社ビュー</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN',sans-serif;background:#f3f4f6;color:#1e293b;font-size:13px;-webkit-text-size-adjust:100%}

/* ヘッダー */
.hdr{background:linear-gradient(135deg,#1e293b,#334155);padding:8px 12px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.hdr h1{font-size:13px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.hdr .company{font-size:10px;font-weight:700;color:#fff;background:#7c3aed;padding:3px 8px;border-radius:5px;white-space:nowrap}
.hdr .logout{font-size:10px;color:#fff;background:#475569;padding:5px 10px;border-radius:5px;border:none;cursor:pointer;font-weight:700;min-height:32px;min-width:60px}

/* タブ */
.tabs{display:flex;background:#fff;border-bottom:2px solid #e2e8f0;padding:0;position:sticky;top:48px;z-index:99;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.tab{flex:1;padding:11px 8px;font-size:13px;font-weight:700;color:#64748b;background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;transition:all .12s;min-height:44px}
.tab.on{color:#1e40af;border-bottom-color:#1e40af;background:#eff6ff}

/* ログイン画面 */
.login-wrap{max-width:380px;margin:40px auto;background:#fff;border-radius:14px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.08);text-align:center}
.login-wrap h2{font-size:18px;font-weight:900;color:#1e293b;margin-bottom:8px}
.login-wrap .sub{font-size:12px;color:#64748b;margin-bottom:24px}
.login-wrap input{width:100%;padding:12px;border:1.5px solid #d1d5db;border-radius:10px;font-size:16px;margin-bottom:10px;font-family:inherit;-webkit-appearance:none}
.login-wrap input:focus{outline:2px solid #1e40af;border-color:#1e40af}
.login-wrap .err{color:#dc2626;font-size:12px;font-weight:600;margin-bottom:8px;display:none}
.login-wrap button{width:100%;padding:14px;background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;min-height:48px}
.login-wrap button:disabled{background:#94a3b8;cursor:not-allowed}

/* サマリー */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid #e2e8f0}
.summary-card{padding:8px 10px;background:#f8fafc;border-radius:8px;border:1px solid #e2e8f0;text-align:center}
.summary-card .lbl{font-size:9px;font-weight:700;color:#64748b;letter-spacing:.02em;margin-bottom:2px}
.summary-card .val{font-size:15px;font-weight:900;color:#1e293b}

/* コントロール */
.ctrl{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#fff;border-bottom:1px solid #e2e8f0;flex-wrap:wrap;position:sticky;top:88px;z-index:98}
.ctrl button{padding:6px 12px;font-size:12px;font-weight:700;background:#f1f5f9;color:#1e293b;border:1px solid #cbd5e1;border-radius:6px;cursor:pointer;min-height:36px;min-width:36px}
.ctrl button.today{background:#1e40af;color:#fff;border-color:#1e40af}
.ctrl .ym-label{font-size:13px;font-weight:900;color:#1e293b;min-width:80px;text-align:center;padding:0 4px}
.ctrl .hint{font-size:10px;color:#94a3b8;margin-left:auto;max-width:50%;text-align:right}

/* 配車表 (既存APP風) */
.tl-wrap{overflow:auto;background:#fff;-webkit-overflow-scrolling:touch}
.tl-table{border-collapse:collapse;font-size:11px;width:max-content;min-width:100%}
.tl-table th{padding:5px 3px;font-size:10px;font-weight:700;color:#475569;background:#f8fafc;border-bottom:2px solid #e2e8f0;border-right:1px solid #e2e8f0;white-space:nowrap;position:sticky;top:0;z-index:10;text-align:center;min-width:30px;height:44px}
.tl-table th.vh-h{position:sticky;left:0;z-index:20;background:#f8fafc;min-width:140px;max-width:180px;text-align:left;padding-left:8px;border-right:2px solid #94a3b8}
.tl-table th.wknd{background:#fef3c7;color:#92400e}
.tl-table th .dow{font-size:8px;color:#94a3b8;display:block}
.tl-table th.wknd .dow{color:#b45309}
.tl-table td{padding:0;border-bottom:1px solid #f1f5f9;border-right:1px solid #e2e8f0;position:relative;height:32px;min-width:30px}
.tl-table td.vh-c{position:sticky;left:0;z-index:5;background:#fff;padding:5px 8px;min-width:140px;max-width:180px;border-right:2px solid #94a3b8;font-size:11px;line-height:1.3}
.tl-table td.wknd{background:#fffbeb}
.tl-table td.today{background:#eff6ff!important}
.tl-table td.has-bar{cursor:pointer}
.tl-table td.has-bar:active{background:#e0e7ff!important}

.cls-row td{background:#dbeafe!important;font-weight:800;color:#1e40af;padding:5px 10px;font-size:11px;border-bottom:1px solid #93c5fd}
.cls-row td.vh-c{background:#dbeafe!important;border-right:2px solid #93c5fd}

.vh-cell .code{font-weight:900;color:#2563eb;font-size:12px;margin-right:5px}
.vh-cell .name{color:#1e293b;font-size:10px;font-weight:600}
.vh-cell .meta{font-size:9px;color:#64748b;margin-top:2px;display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.vh-cell .badge{font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px;background:#f1f5f9;color:#475569;border:1px solid #cbd5e1}
.vh-cell .badge.partner{background:#faf5ff;color:#7c3aed;border-color:#d8b4fe}
.vh-cell .badge.util{background:#f0fdf4;color:#059669;border-color:#86efac}

.bar{position:absolute;top:3px;bottom:3px;color:#fff;font-size:9px;font-weight:600;display:flex;align-items:center;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer;z-index:2}
.bar-res{background:#dc2626}
.bar-maint{background:repeating-linear-gradient(45deg,#2563eb,#2563eb 4px,#3b82f6 4px,#3b82f6 8px);top:1px;bottom:1px;border:1px solid #1d4ed8}
.bar-partner{background:repeating-linear-gradient(45deg,#7c3aed,#7c3aed 4px,#a855f7 4px,#a855f7 8px);top:1px;bottom:1px;border:1px solid #6d28d9}

/* 予約データタブ (既存APP風) */
.data-ctrl{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid #e2e8f0}
.data-ctrl .cnt{font-size:11px;font-weight:700;color:#64748b}
.data-ctrl .total{margin-left:auto;font-size:12px;font-weight:900;color:#059669}
.data-tbl-wrap{overflow:auto;background:#fff;-webkit-overflow-scrolling:touch}
.data-tbl{width:100%;border-collapse:collapse;font-size:11px;min-width:100%}
.data-tbl th{padding:7px 8px;font-size:9px;font-weight:700;color:#475569;background:#f8fafc;border-bottom:2px solid #e2e8f0;text-align:left;position:sticky;top:0;z-index:5;white-space:nowrap}
.data-tbl td{padding:7px 8px;font-size:11px;border-bottom:1px solid #f1f5f9;vertical-align:top;white-space:nowrap}
.data-tbl tr:active td{background:#f1f5f9}
.data-tbl .veh-c{font-weight:900;color:#2563eb}
.data-tbl .ota-bdg{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px}
.data-tbl .ota-J{background:#fee2e2;color:#b91c1c}
.data-tbl .ota-R{background:#fee2e2;color:#dc2626}
.data-tbl .ota-S{background:#ede9fe;color:#7c3aed}
.data-tbl .ota-O{background:#cffafe;color:#0891b2}
.data-tbl .ota-HP{background:#dbeafe;color:#1e40af}
.data-tbl .ota-RC{background:#d1fae5;color:#059669}
.data-tbl .ota-G{background:#fef3c7;color:#92400e}
.data-tbl .status{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;display:inline-block}
.data-tbl .status.active{background:#dcfce7;color:#15803d}
.data-tbl .status.done{background:#f1f5f9;color:#64748b}
.data-tbl .status.future{background:#dbeafe;color:#1e40af}
.data-tbl .status.cxl{background:#fee2e2;color:#991b1b}

/* スマホ専用: 予約データをカード形式に */
@media (max-width:768px){
  .summary{grid-template-columns:repeat(2,1fr)}
  .data-tbl thead{display:none}
  .data-tbl tr{display:block;border-bottom:6px solid #f3f4f6;padding:0;background:#fff!important}
  .data-tbl td{display:block;border-bottom:none;padding:3px 12px;white-space:normal}
  .data-tbl td.r1{padding-top:10px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:#fff!important;border-top:1px solid #e2e8f0}
  .data-tbl td.r2{font-size:13px;font-weight:700;color:#1e293b}
  .data-tbl td.r3{font-size:10px;color:#64748b}
  .data-tbl td.r4{padding-bottom:10px;font-size:11px;display:flex;justify-content:space-between;align-items:center}
  .data-tbl td.r4 .amt{font-size:13px;font-weight:900;color:#059669}
  .ctrl .hint{display:none}
  .tl-table th{min-width:26px;padding:4px 2px}
  .tl-table td{min-width:26px}
  .tl-table th.vh-h,.tl-table td.vh-c{min-width:110px;max-width:130px;font-size:10px;padding:4px 6px}
  .vh-cell .code{font-size:11px}
  .vh-cell .name{font-size:9px}
  .summary-card .val{font-size:13px}
  .hdr h1{font-size:11px}
}

/* モーダル */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:9000;display:flex;align-items:center;justify-content:center;padding:12px}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:440px;max-height:calc(100vh - 24px);overflow-y:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-box h3{font-size:16px;font-weight:900;margin-bottom:6px;color:#1e293b}
.modal-box .veh-info{font-size:11px;color:#64748b;margin-bottom:14px;padding:8px 10px;background:#f8fafc;border-radius:6px}
.modal-box .field{margin-bottom:12px}
.modal-box label{display:block;font-size:11px;font-weight:700;color:#64748b;margin-bottom:5px}
.modal-box input,.modal-box select,.modal-box textarea{width:100%;padding:11px 12px;border:1.5px solid #d1d5db;border-radius:8px;font-size:14px;font-family:inherit;-webkit-appearance:none}
.modal-box input:focus,.modal-box select:focus,.modal-box textarea:focus{outline:2px solid #1e40af;border-color:#1e40af}
.modal-box .actions{display:flex;gap:8px;margin-top:16px}
.modal-box .btn-cancel{flex:1;padding:11px;background:#f1f5f9;color:#475569;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;min-height:44px}
.modal-box .btn-save{flex:2;padding:11px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;min-height:44px}
.modal-box .btn-save.partner{background:#7c3aed}
.modal-box .btn-del{padding:11px 14px;background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;margin-right:auto;min-height:44px}

@media (max-width:480px){
  .modal-bg{padding:0;align-items:flex-end}
  .modal-box{border-radius:16px 16px 0 0;max-height:90vh}
}

/* トースト */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:11px 22px;border-radius:10px;font-size:12px;font-weight:700;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.3);opacity:0;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.err{background:#dc2626}
.toast.ok{background:#059669}

.loading{text-align:center;padding:40px;color:#94a3b8;font-size:13px}
</style>
</head>
<body>

<!-- ヘッダー -->
<div class="hdr">
  <h1>🚚 協力会社ビュー</h1>
  <span id="hd-company" class="company" style="display:none">—</span>
  <button id="hd-logout" class="logout" style="display:none" onclick="logout()">ログアウト</button>
</div>

<!-- ログイン画面 -->
<div id="login" class="login-wrap" style="display:none">
  <h2>🚚 協力会社ログイン</h2>
  <div class="sub">HANDYMAN より発行されたアカウントでログイン</div>
  <input id="ipt-email" type="email" placeholder="メールアドレス" autocapitalize="off" autocorrect="off" inputmode="email">
  <input id="ipt-pw" type="password" placeholder="パスワード">
  <div id="login-err" class="err"></div>
  <button id="btn-login" onclick="doLogin()">ログイン</button>
</div>

<!-- メインビュー -->
<div id="main" style="display:none">
  <div class="tabs">
    <button class="tab on" id="tab-tl" onclick="switchTab('tl')">📅 配車表</button>
    <button class="tab" id="tab-data" onclick="switchTab('data')">📋 予約データ</button>
  </div>

  <div class="summary">
    <div class="summary-card"><div class="lbl">所有車両</div><div class="val" id="sum-veh">—</div></div>
    <div class="summary-card"><div class="lbl">今月予約</div><div class="val" id="sum-res">—</div></div>
    <div class="summary-card"><div class="lbl">稼働日</div><div class="val" id="sum-active">—</div></div>
    <div class="summary-card"><div class="lbl">稼働率</div><div class="val" id="sum-util">—</div></div>
  </div>

  <!-- 配車表タブ -->
  <div id="view-tl">
    <div class="ctrl">
      <button onclick="changeMonth(-1)">◀</button>
      <span class="ym-label" id="ym-label">—</span>
      <button onclick="changeMonth(1)">▶</button>
      <button class="today" onclick="changeMonth(0)">今月</button>
      <span class="hint">空セル＝在庫調整 / 既存ブロック＝編集</span>
    </div>
    <div class="tl-wrap" id="tl-wrap" style="max-height:calc(100vh - 220px)">
      <div class="loading">読み込み中...</div>
    </div>
  </div>

  <!-- 予約データタブ -->
  <div id="view-data" style="display:none">
    <div class="data-ctrl">
      <span class="cnt" id="data-count">—</span>
      <span class="total" id="data-total">—</span>
    </div>
    <div class="data-tbl-wrap" style="max-height:calc(100vh - 200px)">
      <table class="data-tbl" id="data-tbl">
        <thead><tr>
          <th>車両</th><th>予約番号</th><th>顧客名</th><th>OTA</th>
          <th>貸出</th><th>返却</th><th>場所</th><th>金額</th><th>状態</th>
        </tr></thead>
        <tbody id="data-body"><tr><td colspan="9" class="loading">読み込み中...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 在庫調整モーダル -->
<div id="modal" class="modal-bg" style="display:none">
  <div class="modal-box">
    <h3 id="modal-title">在庫調整登録</h3>
    <div class="veh-info" id="modal-vehicle">—</div>
    <div class="field">
      <label>ブロック種別</label>
      <select id="modal-blocktype">
        <option value="partner_reserved">🟣 自社予約（在庫ブロック）</option>
        <option value="maintenance">🔧 メンテナンス</option>
      </select>
    </div>
    <div class="field">
      <label>入庫日（開始）</label>
      <input id="modal-from" type="date">
    </div>
    <div class="field">
      <label>出庫日（終了）</label>
      <input id="modal-to" type="date">
    </div>
    <div class="field">
      <label>メモ（任意）</label>
      <input id="modal-memo" type="text" placeholder="任意の補足">
    </div>
    <div class="actions">
      <button id="modal-del" class="btn-del" style="display:none" onclick="doDelete()">🗑️ 削除</button>
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button id="modal-save" class="btn-save partner" onclick="doSave()">登録</button>
    </div>
  </div>
</div>

<div id="toast" class="toast">—</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://ckrxttbnawkclshczsia.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
const sb=window.supabase.createClient(SB_URL,SB_KEY);

let CURRENT_USER=null,OWNER_COMPANY=null,OWNER_LABEL=null;
let CURRENT_TAB='tl';
let CURRENT_YM=null;
let VEHICLES=[],RESERVATIONS=[],FLEET=[],MAINTENANCE=[];
let MODAL_CONTEXT=null;
const isMobile=window.matchMedia('(max-width:768px)').matches;

// 認証
async function checkAuth(){
  const{data:{session}}=await sb.auth.getSession();
  if(session&&session.user){CURRENT_USER=session.user;return await resolveOwnerCompany();}
  return false;
}
async function resolveOwnerCompany(){
  const urlOwner=new URLSearchParams(location.search).get('owner');
  if(urlOwner)OWNER_COMPANY=urlOwner;
  else OWNER_COMPANY=CURRENT_USER.user_metadata?.owner_company||CURRENT_USER.app_metadata?.owner_company;
  if(!OWNER_COMPANY){showToast('owner_company が設定されていません','err');return false;}
  const{data}=await sb.from('partner_companies').select('label').eq('id',OWNER_COMPANY).maybeSingle();
  OWNER_LABEL=data?data.label:OWNER_COMPANY;
  return true;
}
async function doLogin(){
  const email=document.getElementById('ipt-email').value.trim();
  const pw=document.getElementById('ipt-pw').value;
  const btn=document.getElementById('btn-login');
  const errEl=document.getElementById('login-err');
  errEl.style.display='none';btn.disabled=true;btn.textContent='ログイン中...';
  try{
    const{data,error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error)throw error;
    CURRENT_USER=data.user;
    const ok=await resolveOwnerCompany();
    if(!ok){errEl.textContent='アカウントに所有者会社が紐づいていません';errEl.style.display='block';btn.disabled=false;btn.textContent='ログイン';return;}
    location.reload();
  }catch(e){errEl.textContent=e.message||'ログイン失敗';errEl.style.display='block';btn.disabled=false;btn.textContent='ログイン';}
}
async function logout(){if(!confirm('ログアウトしますか？'))return;await sb.auth.signOut();location.reload();}

// データ取得
async function loadData(){
  if(!OWNER_COMPANY)return;
  try{
    const{data:vehs}=await sb.from('vehicles').select('*').eq('owner_company',OWNER_COMPANY).order('type').order('code');
    VEHICLES=vehs||[];
    if(VEHICLES.length===0){
      document.getElementById('tl-wrap').innerHTML='<div class="loading">所有車両が登録されていません。<br>管理者に確認してください。</div>';
      return;
    }
    const vehCodes=VEHICLES.map(v=>v.code);
    const{data:fl}=await sb.from('fleet').select('*').in('vehicle_code',vehCodes);
    FLEET=fl||[];
    const resvIds=[...new Set(FLEET.map(f=>f.reservation_id))];
    RESERVATIONS=[];
    if(resvIds.length>0){
      const CHUNK=500;
      for(let i=0;i<resvIds.length;i+=CHUNK){
        const{data:rs}=await sb.from('reservations').select('*').in('id',resvIds.slice(i,i+CHUNK));
        if(rs)RESERVATIONS=RESERVATIONS.concat(rs);
      }
    }
    const{data:mt}=await sb.from('maintenance').select('*').in('vehicle_code',vehCodes);
    MAINTENANCE=mt||[];
    updateSummary();
    if(CURRENT_TAB==='tl')renderTimeline();else renderData();
  }catch(e){console.error('[loadData]',e);showToast('データ取得エラー: '+e.message,'err');}
}

function updateSummary(){
  const ym=CURRENT_YM;
  const ymStr=`${ym.y}-${String(ym.m).padStart(2,'0')}`;
  const daysInMonth=new Date(ym.y,ym.m,0).getDate();
  const monthResvs=RESERVATIONS.filter(r=>{
    if(r.status==='cancelled')return false;
    const ld=(r.lend_date||'').substring(0,7),rd=(r.return_date||'').substring(0,7);
    return ld===ymStr||rd===ymStr||(ld<ymStr&&rd>ymStr);
  });
  const activeDays=new Set();
  monthResvs.forEach(r=>{
    const f=FLEET.find(x=>x.reservation_id===r.id);if(!f)return;
    const start=new Date(Math.max(new Date(r.lend_date).getTime(),new Date(`${ymStr}-01`).getTime()));
    const end=new Date(Math.min(new Date(r.return_date).getTime(),new Date(`${ymStr}-${daysInMonth}`).getTime()));
    for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
      activeDays.add(f.vehicle_code+'|'+d.toISOString().substring(0,10));
    }
  });
  const vehCount=VEHICLES.filter(v=>v.active!==false).length;
  const maxDays=vehCount*daysInMonth;
  const util=maxDays>0?Math.round(activeDays.size/maxDays*100):0;
  document.getElementById('sum-veh').textContent=VEHICLES.length+'台';
  document.getElementById('sum-res').textContent=monthResvs.length+'件';
  document.getElementById('sum-active').textContent=activeDays.size+'日';
  document.getElementById('sum-util').textContent=util+'%';
}

// 各車両の月間稼働率
function calcUtilByVehicle(){
  const ym=CURRENT_YM;
  const ymStr=`${ym.y}-${String(ym.m).padStart(2,'0')}`;
  const daysInMonth=new Date(ym.y,ym.m,0).getDate();
  const map={};
  VEHICLES.forEach(v=>map[v.code]=new Set());
  RESERVATIONS.forEach(r=>{
    if(r.status==='cancelled')return;
    const f=FLEET.find(x=>x.reservation_id===r.id);if(!f||!map[f.vehicle_code])return;
    const start=new Date(Math.max(new Date(r.lend_date).getTime(),new Date(`${ymStr}-01`).getTime()));
    const end=new Date(Math.min(new Date(r.return_date).getTime(),new Date(`${ymStr}-${daysInMonth}`).getTime()));
    for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
      map[f.vehicle_code].add(d.toISOString().substring(0,10));
    }
  });
  const result={};
  Object.keys(map).forEach(c=>{const days=map[c].size;result[c]={days,pct:daysInMonth>0?Math.round(days/daysInMonth*100):0};});
  return result;
}

// 配車表 (既存APP風)
function renderTimeline(){
  const wrap=document.getElementById('tl-wrap');
  if(VEHICLES.length===0){wrap.innerHTML='<div class="loading">所有車両なし</div>';return;}
  const ym=CURRENT_YM;
  const daysInMonth=new Date(ym.y,ym.m,0).getDate();
  const today=new Date().toISOString().substring(0,10);
  const dates=[];
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${ym.y}-${String(ym.m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow=new Date(ds).getDay();
    dates.push({ds,d,dow,wknd:dow===0||dow===6});
  }
  document.getElementById('ym-label').textContent=`${ym.y}/${String(ym.m).padStart(2,'0')}`;
  const utils=calcUtilByVehicle();

  const grps={};
  VEHICLES.forEach(v=>{const t=v.type||'?';if(!grps[t])grps[t]=[];grps[t].push(v);});
  const clsOrder=['A','B','C','S','F','H'];
  const sortedTypes=[...clsOrder.filter(t=>grps[t]),...Object.keys(grps).filter(t=>clsOrder.indexOf(t)<0)];

  const cls2name={A:'アルファード/ヴェルファイア',B:'ノア/デリカD5',C:'ロッキー/CX-3',S:'ハリアー/CX-5',F:'ルーミー/ソリオ',H:'カローラ/アクセラ'};
  const dowChar='日月火水木金土';

  let html='<table class="tl-table"><thead><tr>';
  html+='<th class="vh-h">車両</th>';
  dates.forEach(d=>{
    const cls=d.wknd?'wknd':'';
    html+=`<th class="${cls}">${d.d}<span class="dow">${dowChar[d.dow]}</span></th>`;
  });
  html+='</tr></thead><tbody>';

  sortedTypes.forEach(t=>{
    const grpName=cls2name[t]||t;
    html+=`<tr class="cls-row"><td class="vh-c" colspan="${dates.length+1}">${t}クラス （${grps[t].length}台）${isMobile?'':' '+grpName}</td></tr>`;
    grps[t].forEach(v=>{
      const u=utils[v.code]||{days:0,pct:0};
      html+=`<tr data-veh="${v.code}"><td class="vh-c vh-cell">`+
        `<span class="code">${v.no||v.code}</span><span class="name">${v.name||''}</span>`+
        `<div class="meta">`+
        (v.owner_company&&v.owner_company!=='HANDYMAN'?`<span class="badge partner">🏢${v.owner_label||''}</span>`:'')+
        (u.days>0?`<span class="badge util">${u.days}日 ${u.pct}%</span>`:'')+
        `</div></td>`;
      dates.forEach(d=>{
        const cls=(d.ds===today?'today':(d.wknd?'wknd':''));
        html+=`<td class="${cls} has-bar" data-veh="${v.code}" data-date="${d.ds}"></td>`;
      });
      html+='</tr>';
    });
  });
  html+='</tbody></table>';
  wrap.innerHTML=html;
  wrap.querySelectorAll('td.has-bar').forEach(td=>{
    td.addEventListener('click',()=>onCellClick(td.dataset.veh,td.dataset.date));
  });
  drawBars(dates);
}

function drawBars(dates){
  const dateIdx={};dates.forEach((d,i)=>dateIdx[d.ds]=i);
  RESERVATIONS.forEach(r=>{
    if(r.status==='cancelled')return;
    const f=FLEET.find(x=>x.reservation_id===r.id);if(!f)return;
    if(!r.lend_date||!r.return_date)return;
    placeBar(f.vehicle_code,r.lend_date,r.return_date,'bar-res',
      `${(r.lend_time||'').substring(0,5)}-${(r.return_time||'').substring(0,5)} ${r.name||''}様`,
      ()=>alert(`予約詳細\n\n予約番号: ${r.id}\n顧客名: ${r.name||''}様\n貸出: ${r.lend_date} ${r.lend_time||''}\n返却: ${r.return_date} ${r.return_time||''}\nOTA: ${r.ota||''}\n金額: ¥${(r.price||0).toLocaleString()}`));
  });
  MAINTENANCE.forEach(m=>{
    const ld=m.start_date||m.from_date,rd=m.end_date||m.to_date;
    if(!ld||!rd)return;
    const isPartner=m.block_type==='partner_reserved';
    const klass=isPartner?'bar-partner':'bar-maint';
    const label=isPartner?`🟣 ${m.label||'自社予約'}`:`🔧 ${m.label||'メンテ'}`;
    placeBar(m.vehicle_code,ld,rd,klass,label,()=>openModalEdit(m));
  });
  function placeBar(vc,ld,rd,klass,label,onClick){
    const row=document.querySelector(`tr[data-veh="${vc}"]`);if(!row)return;
    const tds=row.querySelectorAll('td.has-bar');if(tds.length===0)return;
    const ldKey=ld.substring(0,10),rdKey=rd.substring(0,10);
    const ldIdx=dateIdx[ldKey],rdIdx=dateIdx[rdKey];
    const startIdx=(ldIdx!==undefined)?ldIdx:0;
    const endIdx=(rdIdx!==undefined)?rdIdx:(tds.length-1);
    if(ldIdx===undefined&&rdIdx===undefined)return;
    if(startIdx>endIdx)return;
    const startTd=tds[startIdx];if(!startTd)return;
    const span=endIdx-startIdx+1;
    const width=startTd.offsetWidth*span-4;
    const bar=document.createElement('div');
    bar.className='bar '+klass;
    bar.style.left='2px';bar.style.width=width+'px';
    bar.textContent=label;bar.title=label;
    bar.addEventListener('click',(e)=>{e.stopPropagation();onClick();});
    startTd.appendChild(bar);
  }
}

// 予約データタブ
function renderData(){
  const body=document.getElementById('data-body');
  if(VEHICLES.length===0){body.innerHTML='<tr><td colspan="9" class="loading">所有車両なし</td></tr>';return;}
  if(RESERVATIONS.length===0){body.innerHTML='<tr><td colspan="9" class="loading">予約データなし</td></tr>';return;}
  const today=new Date().toISOString().substring(0,10);
  const sorted=[...RESERVATIONS].sort((a,b)=>(b.lend_date||'').localeCompare(a.lend_date||''));
  let html='',total=0;
  sorted.forEach(r=>{
    const f=FLEET.find(x=>x.reservation_id===r.id);
    const vc=f?f.vehicle_code:'—';
    const veh=VEHICLES.find(v=>v.code===vc);
    let status,statusCls;
    if(r.status==='cancelled'){status='ｷｬﾝｾﾙ';statusCls='cxl';}
    else if(r.return_date<today){status='完了';statusCls='done';}
    else if(r.lend_date<=today&&r.return_date>=today){status='貸出中';statusCls='active';}
    else{status='予約済';statusCls='future';}
    const otaLabel={J:'じゃらん',R:'楽天',S:'スカイ',O:'エアトリ',HP:'HP',RC:'レンカ',G:'GoGo'}[r.ota]||r.ota||'—';
    const place=r.del_place||r.col_place||'—';
    const amt=r.price||0;
    if(r.status!=='cancelled')total+=amt;
    if(isMobile){
      // モバイル: カード形式
      html+=`<tr>`+
        `<td class="r1"><span class="veh-c">${vc}</span> ${veh?veh.plate_no||'':''} <span class="ota-bdg ota-${r.ota}">${otaLabel}</span> <span class="status ${statusCls}" style="margin-left:auto">${status}</span></td>`+
        `<td class="r2">${r.name||'—'}様</td>`+
        `<td class="r3">📅 ${r.lend_date||'—'} ${(r.lend_time||'').substring(0,5)} → ${r.return_date||'—'} ${(r.return_time||'').substring(0,5)}</td>`+
        `<td class="r4"><span style="font-size:10px;color:#64748b">${place}</span><span class="amt">¥${amt.toLocaleString()}</span></td>`+
        `</tr>`;
    }else{
      // PC: テーブル形式
      html+=`<tr>`+
        `<td><span class="veh-c">${vc}</span> ${veh?veh.plate_no||'':''}</td>`+
        `<td><code style="font-size:10px;color:#2563eb">${r.id}</code></td>`+
        `<td>${r.name||'—'}様</td>`+
        `<td><span class="ota-bdg ota-${r.ota}">${otaLabel}</span></td>`+
        `<td>${r.lend_date||'—'} ${(r.lend_time||'').substring(0,5)}</td>`+
        `<td>${r.return_date||'—'} ${(r.return_time||'').substring(0,5)}</td>`+
        `<td style="font-size:10px;color:#64748b">${place}</td>`+
        `<td>¥${amt.toLocaleString()}</td>`+
        `<td><span class="status ${statusCls}">${status}</span></td></tr>`;
    }
  });
  body.innerHTML=html;
  document.getElementById('data-count').textContent=`${sorted.length}件`;
  document.getElementById('data-total').textContent=`合計 ¥${total.toLocaleString()}`;
}

// モーダル
function onCellClick(vc,date){
  const existing=MAINTENANCE.find(m=>{
    if(m.vehicle_code!==vc)return false;
    const s=m.start_date||m.from_date,e=m.end_date||m.to_date;
    return s<=date&&date<=e;
  });
  if(existing){openModalEdit(existing);return;}
  const f=FLEET.find(x=>{
    if(x.vehicle_code!==vc)return false;
    const r=RESERVATIONS.find(rr=>rr.id===x.reservation_id&&rr.status!=='cancelled');
    if(!r)return false;
    return r.lend_date<=date&&date<=r.return_date;
  });
  if(f){showToast('予約済みの日付です','err');return;}
  openModalAdd(vc,date);
}

function openModalAdd(vc,date){
  const veh=VEHICLES.find(v=>v.code===vc);
  MODAL_CONTEXT={vehicleCode:vc,date,isEdit:false};
  document.getElementById('modal-title').textContent='在庫調整 新規登録';
  document.getElementById('modal-vehicle').textContent=`車両: ${veh.name||''} (${vc}) ${veh.plate_no||''}`;
  document.getElementById('modal-blocktype').value='partner_reserved';
  document.getElementById('modal-from').value=date;
  document.getElementById('modal-to').value=date;
  document.getElementById('modal-memo').value='';
  document.getElementById('modal-del').style.display='none';
  document.getElementById('modal').style.display='flex';
}

function openModalEdit(m){
  const veh=VEHICLES.find(v=>v.code===m.vehicle_code);
  if(m.owner_company&&m.owner_company!==OWNER_COMPANY&&m.owner_company!=='HANDYMAN'){
    showToast('他社管理データは編集不可','err');return;
  }
  MODAL_CONTEXT={vehicleCode:m.vehicle_code,isEdit:true,maintRow:m};
  document.getElementById('modal-title').textContent='在庫調整 編集';
  document.getElementById('modal-vehicle').textContent=`車両: ${veh?veh.name||'':''} (${m.vehicle_code})`;
  document.getElementById('modal-blocktype').value=m.block_type||'maintenance';
  document.getElementById('modal-from').value=(m.start_date||m.from_date||'').substring(0,10);
  document.getElementById('modal-to').value=(m.end_date||m.to_date||'').substring(0,10);
  document.getElementById('modal-memo').value=m.memo||'';
  document.getElementById('modal-del').style.display='';
  document.getElementById('modal').style.display='flex';
}

function closeModal(){document.getElementById('modal').style.display='none';MODAL_CONTEXT=null;}

async function doSave(){
  if(!MODAL_CONTEXT)return;
  const blockType=document.getElementById('modal-blocktype').value;
  const fromDate=document.getElementById('modal-from').value;
  const toDate=document.getElementById('modal-to').value;
  const memo=document.getElementById('modal-memo').value;
  if(!fromDate||!toDate){showToast('日付を入力してください','err');return;}
  if(fromDate>toDate){showToast('開始日が終了日より後になっています','err');return;}
  const row={
    vehicle_code:MODAL_CONTEXT.vehicleCode,
    start_date:fromDate,end_date:toDate,
    label:blockType==='partner_reserved'?'自社予約':'メンテナンス',
    block_type:blockType,owner_company:OWNER_COMPANY,memo:memo||null
  };
  try{
    if(MODAL_CONTEXT.isEdit&&MODAL_CONTEXT.maintRow){
      const{error}=await sb.from('maintenance').update(row).eq('id',MODAL_CONTEXT.maintRow.id);
      if(error)throw error;
      await logAction(blockType==='partner_reserved'?'partner_reserved_add':'maintenance_add',MODAL_CONTEXT.vehicleCode,fromDate,toDate,row);
      showToast('✅ 更新しました','ok');
    }else{
      const{error}=await sb.from('maintenance').insert(row);
      if(error)throw error;
      await logAction(blockType==='partner_reserved'?'partner_reserved_add':'maintenance_add',MODAL_CONTEXT.vehicleCode,fromDate,toDate,row);
      showToast('✅ 登録しました','ok');
    }
    closeModal();await loadData();
  }catch(e){console.error(e);showToast('保存失敗: '+e.message,'err');}
}

async function doDelete(){
  if(!MODAL_CONTEXT||!MODAL_CONTEXT.maintRow)return;
  if(!confirm('このブロックを削除しますか？'))return;
  try{
    const m=MODAL_CONTEXT.maintRow;
    const{error}=await sb.from('maintenance').delete().eq('id',m.id);
    if(error)throw error;
    await logAction(m.block_type==='partner_reserved'?'partner_reserved_delete':'maintenance_delete',m.vehicle_code,m.start_date||m.from_date,m.end_date||m.to_date,m);
    showToast('🗑️ 削除しました','ok');
    closeModal();await loadData();
  }catch(e){showToast('削除失敗: '+e.message,'err');}
}

async function logAction(actionType,vehicleCode,dateFrom,dateTo,payload){
  try{
    await sb.from('partner_actions').insert({
      owner_company:OWNER_COMPANY,
      user_email:CURRENT_USER?.email||null,
      action_type:actionType,
      vehicle_code:vehicleCode,
      target_date_from:dateFrom,target_date_to:dateTo,
      payload:payload
    });
  }catch(e){console.warn('[logAction]',e);}
}

function switchTab(t){
  CURRENT_TAB=t;
  document.getElementById('tab-tl').classList.toggle('on',t==='tl');
  document.getElementById('tab-data').classList.toggle('on',t==='data');
  document.getElementById('view-tl').style.display=(t==='tl')?'':'none';
  document.getElementById('view-data').style.display=(t==='data')?'':'none';
  if(t==='tl')renderTimeline();else renderData();
}

function changeMonth(delta){
  if(delta===0){const now=new Date();CURRENT_YM={y:now.getFullYear(),m:now.getMonth()+1};}
  else{let y=CURRENT_YM.y,m=CURRENT_YM.m+delta;if(m>12){y++;m=1;}if(m<1){y--;m=12;}CURRENT_YM={y,m};}
  updateSummary();renderTimeline();
}

function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show'+(type?' '+type:'');
  setTimeout(()=>{t.className='toast';},3000);
}

(async()=>{
  const authed=await checkAuth();
  if(!authed){document.getElementById('login').style.display='';return;}
  document.getElementById('login').style.display='none';
  document.getElementById('main').style.display='';
  document.getElementById('hd-company').style.display='';
  document.getElementById('hd-logout').style.display='';
  document.getElementById('hd-company').textContent='🏢 '+(OWNER_LABEL||OWNER_COMPANY);
  const now=new Date();
  CURRENT_YM={y:now.getFullYear(),m:now.getMonth()+1};
  await loadData();
})();
</script>
