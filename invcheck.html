<!DOCTYPE html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>在庫チェック</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#f6f7f9;color:#0f172a;font-size:14px}
.wrap{max-width:1200px;margin:0 auto;padding:12px}
.tabs,.months{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tabs button,.months button{flex:1;min-width:90px;padding:10px;border:none;border-radius:6px;background:#e2e8f0;font-weight:800;font-size:15px;cursor:pointer;position:relative}
.months button{font-size:14px;padding:8px}
.tabs button.on,.months button.on{background:#2f3b55;color:#fff}
.tabs .dot,.months .dot{position:absolute;top:4px;right:6px;width:10px;height:10px;border-radius:50%}
.big{border-radius:8px;padding:16px;margin:0 0 10px;font-size:22px;font-weight:900;text-align:center}
.big small{display:block;font-size:13px;font-weight:600;margin-top:4px}
.big.ok{background:#dcfce7;color:#166534}.big.ng{background:#fee2e2;color:#991b1b;animation:blink 1s infinite}.big.warn{background:#fef9c3;color:#854d0e}
@keyframes blink{50%{opacity:.55}}
.rule{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;font-size:13px}
.rule span{display:flex;align-items:center;gap:6px;background:#fff;border-radius:6px;padding:6px 10px}
.sw{width:18px;height:18px;border-radius:4px;display:inline-block}
.card{background:#fff;border-radius:8px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin:0 0 10px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:2px}
th{font-size:11px;color:#64748b;font-weight:700;padding:2px}
th.sat{color:#2563eb}th.sun{color:#dc2626}
td{width:34px;height:34px;text-align:center;font-weight:800;font-size:14px;border-radius:5px;cursor:pointer;font-variant-numeric:tabular-nums}
td.cls{text-align:left;cursor:default;font-size:17px;font-weight:900;padding:10px 4px 2px;height:auto}td.cls small{font-size:12px;color:#64748b;font-weight:600;margin-left:6px}
.lbl{position:sticky;left:0;background:#fff;z-index:1;text-align:left;white-space:nowrap;padding:0 8px 0 2px;font-size:13px;font-weight:800;width:auto;cursor:default}
td.nv{background:#f1f5f9;color:#334155;cursor:default;font-weight:700}tr.sub td.nv{color:#64748b}tr.eq td.nv{background:#2f3b55;color:#fff;font-weight:900}tr.eq .lbl{color:#2f3b55}tr.ota .lbl{font-weight:600;color:#475569}tr.gap td{height:12px;cursor:default}
td.nv.man,tr.sub td.nv.man{background:#dbeafe;color:#1d4ed8}
.sf{margin-left:14px;font-size:14px;font-weight:700;color:#334155;display:inline-flex;align-items:center;gap:6px}.sf button{width:30px;height:30px;border:none;border-radius:6px;background:#2f3b55;color:#fff;font-size:18px;font-weight:900;cursor:pointer}.sf b{min-width:22px;text-align:center;font-size:18px}
.g{background:#22c55e;color:#fff}.r{background:#dc2626;color:#fff;animation:blink 1s infinite}.y{background:#facc15;color:#422006}.n{background:#e2e8f0;color:#94a3b8}
.off{background:repeating-linear-gradient(45deg,#e2e8f0 0 4px,#f8fafc 4px 8px);color:#94a3b8}
#rel{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:14px;font-weight:700;color:#334155}#rel b{font-size:15px;color:#0f172a;margin-right:4px}#rel label{display:inline-flex;align-items:center;gap:6px}#rel input{font-size:15px;padding:4px 6px;border:1px solid #cbd5e1;border-radius:6px;background:#dbeafe;color:#1d4ed8;font-weight:800}
.foot{font-size:12px;color:#64748b;text-align:center;margin:6px 0 20px}
#pop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#pop .in{background:#fff;border-radius:10px;padding:16px;max-width:360px;width:100%}
#pop h3{margin:0 0 10px;font-size:17px}
#pop table{width:100%;border-spacing:0}
#pop td{width:auto;height:auto;cursor:default;border-radius:0;padding:8px 6px;border-bottom:1px solid #eef2f7;text-align:left;font-size:15px}
#pop td.v{text-align:right}
#pop button{margin-top:12px;width:100%;padding:10px;border:none;border-radius:6px;background:#2f3b55;color:#fff;font-size:15px;font-weight:800}
</style></head><body>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="big"></div>
  <div class="rule">
    <span><i class="sw g"></i>OTA ＝ 残数（正しい）</span>
    <span><i class="sw r"></i>OTAが残数より多い（売りすぎ・絶対ダメ）</span>
    <span><i class="sw y"></i>OTAが残数より少ない（売り逃し）</span>
    <span><i class="sw n"></i>ロボがまだ読めていない</span>
    <span><i class="sw off"></i>まだ売り出していない（在庫解放期間の外＝0）</span>
  </div>
  <div class="card" id="rel"></div>
  <div class="months" id="months"></div>
  <div class="card scroll"><table id="grid"></table></div>
  <div class="foot" id="foot"></div>
</div>
<div id="pop"><div class="in"><h3 id="popT"></h3><table id="popTbl"></table><button onclick="document.getElementById('pop').style.display='none'">とじる</button></div></div>
<script>
// ルールは1つだけ（オーナー 2026-10-26）：OTAに出す数 ＝ 配車表の残り − 安全在庫。多いのは絶対ダメ、少ないのは売り逃し
const DB = {
  hd: { url: 'https://ckrxttbnawkclshczsia.supabase.co', key: 'sb_publishable_aTVhlY0YD-5BBfI03ZNnsg_MzO_vsIe' },
  bt: { url: 'https://ggqugvyskyiblxiycpci.supabase.co', key: 'sb_publishable_fI8HYYDFn3Soa4kOMbNCAA_oOxGPPKV' },
};
const STORES = [
  { id: 'nha', name: '那覇', db: 'hd', otas: ['RKT', 'JLN', 'SKT', 'ART', 'RDC'] },
  { id: 'spk', name: '札幌', db: 'hd', otas: ['RKT', 'JLN', 'SKT', 'ART', 'RDC'] },
  { id: 'takh', name: '高松 HDM', db: 'bt', otas: ['RKT', 'JLN'] },
  { id: 'takb', name: '高松 BUDDICA', db: 'bt', otas: ['ART', 'TAB', 'RDC'] },
];
const OTA = { RKT: '楽天', JLN: 'じゃらん', SKT: 'skyticket', ART: 'エアトリ', RDC: 'レンタカードットコム', TAB: 'たびらい' };
const TABMAP = { 7343: 'A', 7344: 'C', 7345: 'E', 7346: 'D', 7347: 'F', 7348: 'G', 7349: 'H', 7473: 'I', 7474: 'J', 7475: 'K' }; // たびらいのクラス番号→配車表のクラス
// 高松BUDDICA の AA は1台ずつの欄（オーナー 10/26「AAもロジックに追加」）。OTAごとの欄 → 車
const AAV = { 'AA:783': 'Gクラス G400d', 'AA:row13': 'Gクラス G400d', 'AA:7350': 'Gクラス G400d', 'AA:784': 'Eクラス カブリオレ', 'AA:row11': 'Eクラス カブリオレ', 'AA:7351': 'Eクラス カブリオレ',
  'AA:785': 'イヴォーク', 'AA:row12': 'イヴォーク', 'AA:7352': 'イヴォーク', 'AA:786': 'ポルシェ 911', 'AA:row14': 'ポルシェ 911', 'AA:7354': 'ポルシェ 911', 'AA:787': 'ウルス', 'AA:row15': 'ウルス', 'AA:7353': 'ウルス' };
const DAYS = 180;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const jst = t => t ? new Date(t).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const wd = d => new Date(d + 'T12:00:00+09:00').getDay();
const rpc = (db, fn, body) => fetch(`${db.url}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: db.key, Authorization: `Bearer ${db.key}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
async function chunks(db, fn, body, pre = '') { // 1回で返るのは1000行まで。30日ずつ取る
  const d0 = new Date(Date.now() + 9 * 3600e3), day = k => new Date(d0.getTime() + k * 86400e3).toISOString().slice(0, 10);
  const rs = await Promise.all([0, 1, 2, 3, 4, 5, 6].map(k => rpc(db, `${fn}?${pre}dd=gte.${day(k * 30)}&dd=lt.${day(k * 30 + 30)}`, body)));
  if (rs.some(r => !r.ok)) return null;
  return (await Promise.all(rs.map(r => r.json()))).flat();
}

const P = new URLSearchParams(location.search);
let store = STORES.some(s => s.id === P.get('store')) ? P.get('store') : 'nha', month = null;
const cache = {}; // store → { cells: {cls|dd: {...}}, last }

// 1マス＝1クラス×1日。媒体ごとに OTAの数 と 正しい数（配車表の残り−安全在庫）を比べ、いちばん悪い色を付ける
async function fetchStore(s) {
  const r = await rpc(DB[s.db], 'invctl_dashboard', { p_store: s.id, p_days: DAYS });
  if (!r.ok) throw new Error(r.status);
  const d = await r.json(); let last = d.last_read, cells = d.cells;
  if (s.db === 'bt') { // 高松：ロボが読んだOTAの数は那覇・札幌のDBにある
    const on = {}; for (const o of s.otas) for (const x of (await chunks(DB.hd, 'invctl_snap', { p_store: s.id, p_days: DAYS }, 'ota=eq.' + o + '&')) || []) {
      const c = x.ota === 'TAB' ? (TABMAP[x.cls] || (+x.cls >= 7350 && +x.cls <= 7354 ? 'AA:' + x.cls : null)) : x.cls; if (!c) continue; on[c + '|' + x.dd + '|' + x.ota] = x.qty; if (!last || x.read_at > last) last = x.read_at; }
    cells = cells.map(([c, dd, o, sb, v]) => [c, dd, o, sb, on[c + '|' + dd + '|' + o] ?? v]);
  }
  const rem = {}, fl = {}; for (const [c, dd, f, , , re] of d.stock) { rem[c + '|' + dd] = re; fl[c + '|' + dd] = f; }
  const out = {};
  for (const [c0, dd, o, sb, v] of cells) {
    if (!s.otas.includes(o) || (s.id === 'takb' && c0 === 'AA')) continue; // AA はクラスでまとめず、車1台ごと（下）
    const c = AAV[c0] ? 'AA・' + AAV[c0] : c0;
    const k = c + '|' + dd, x = out[k] || (out[k] = { c, dd, rem: rem[k] ?? null, fleet: fl[k] ?? null, ok: sb, sb: {}, ota: {} });
    x.ok = Math.max(x.ok, sb); x.sb[o] = sb; x.ota[o] = v; // 残数＝売っているOTAに出す数（売らないOTA は 0 なので max）
  }
  for (const x of Object.values(out)) {
    const v = Object.entries(x.ota).filter(([, q]) => q != null);
    x.st = !v.length ? 'n' : v.some(([o, q]) => q > x.sb[o]) ? 'r' : v.some(([o, q]) => q < x.sb[o]) ? 'y' : 'g'; // OTAごとに、そのOTAに出すべき数と比べる
  }
  // 安全在庫（月×クラス）。ここで変えられる（オーナー 10/26「在庫調整は安全在庫を設定して全体をチェックする箇所」）
  const safe = {}; try { const q = await rpc(DB[s.db], 'invctl_safety', { p_store: s.id }); if (q.ok) for (const y of await q.json()) safe[y.cls + '|' + String(y.ym).slice(0, 7)] = y.qty; } catch {}
  // 那覇の A2・B2：手入力の枠・その日の予約数・分ける数（invctl_dashboard の share）
  const share = {}, base = {}; for (const [c, src, dd, b, sold, n] of d.share || []) { share[c + '|' + dd] = { src, b, sold, n }; base[c] = b; }
  // 在庫解放期間（店×OTAの売り出す最終日。オーナー 10/26「ダッシュボードに設定を追加 そこで制限かける」）
  const rel = {}; try { const q = await rpc(DB[s.db], 'invctl_release', { p_store: s.id }); if (q.ok) for (const y of await q.json()) rel[y.ota] = String(y.until).slice(0, 10); } catch {}
  return { cells: out, last, safe, share, base, rel };
}
async function loadAll() {
  await Promise.all(STORES.map(async s => { try { cache[s.id] = await fetchStore(s); } catch (e) { cache[s.id] = { err: e.message }; } }));
  draw();
}
const count = (id, ym) => { const c = cache[id]; if (!c || !c.cells) return null; const a = Object.values(c.cells).filter(x => !ym || x.dd.startsWith(ym));
  return { r: a.filter(x => x.st === 'r').length, y: a.filter(x => x.st === 'y').length, all: a.length }; };
const dotColor = n => !n ? '' : n.r ? '#dc2626' : n.y ? '#eab308' : '#22c55e';

function draw() {
  $('tabs').innerHTML = STORES.map(s => { const n = count(s.id); return `<button class="${s.id === store ? 'on' : ''}" data-s="${s.id}">${s.name}${n ? `<i class="dot" style="background:${dotColor(n)}"></i>` : ''}</button>`; }).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { store = b.dataset.s; history.replaceState(null, '', '?store=' + store + (P.get('embed') ? '&embed=1' : '')); draw(); });
  const c = cache[store];
  if (!c) { $('big').innerHTML = '<div class="big warn">読み込み中…</div>'; return; }
  if (c.err) { $('big').innerHTML = `<div class="big warn">読み込めませんでした（${esc(c.err)}）</div>`; return; }
  const n = count(store), name = STORES.find(s => s.id === store).name;
  const un = Object.values(c.cells).filter(x => x.st === 'n').length;
  $('big').innerHTML = n.r ? `<div class="big ng">❌ ${name}：売りすぎ ${n.r}マス<small>OTAの方が多い日があります（少ない ${n.y}マス）</small></div>`
    : n.y ? `<div class="big warn">⚠ ${name}：売りすぎ 0・少ない ${n.y}マス<small>多くはないので事故にはなりません。売り逃しです</small></div>`
    : `<div class="big ok">✅ ${name}：全部OK<small>全クラス・全媒体が 配車表の残り − 安全在庫 と同じ数です</small></div>`;
  if (un) $('big').innerHTML += `<div class="big warn" style="font-size:16px">読めていないマス ${un}（灰色）</div>`;
  const yms = [...new Set(Object.values(c.cells).map(x => x.dd.slice(0, 7)))].sort();
  if (!yms.includes(month)) month = yms[0];
  $('months').innerHTML = yms.map(ym => { const m = count(store, ym); return `<button class="${ym === month ? 'on' : ''}" data-m="${ym}">${+ym.slice(5)}月<i class="dot" style="background:${dotColor(m)}"></i></button>`; }).join('');
  $('months').querySelectorAll('button').forEach(b => b.onclick = () => { month = b.dataset.m; draw(); });
  const a = Object.values(c.cells).filter(x => x.dd.startsWith(month));
  const days = [...new Set(a.map(x => x.dd))].sort(), cls = [...new Set(a.map(x => x.c))].sort();
  // オーナー 10/26「稼働台数 − 予約台数 − 安全在庫 ＝ 残数 ＝ OTA掲載（全OTA同数）」をクラスごとに上から下へ並べる
  const head = `<tr><th class="lbl"></th>${days.map(d => `<th class="${wd(d) === 6 ? 'sat' : wd(d) === 0 ? 'sun' : ''}">${+d.slice(8)}</th>`).join('')}</tr>`;
  const so = STORES.find(z => z.id === store).otas;
  const row = (lbl, cl, f) => `<tr class="${cl}"><td class="lbl">${lbl}</td>${days.map(d => f(c.cells[k0 + '|' + d], d)).join('')}</tr>`;
  let k0 = '';
  // 那覇の A2・B2 は配車表に車がなく、A・B の残りから枠を分ける（オーナー 10/25）
  const sh = store === 'nha' ? { A: 'A2', B: 'B2' } : {}, share = (k, d) => { const y = sh[k] && c.share[sh[k] + '|' + d]; return y ? y.n : null; };
  const man = v => `<td class="nv man">${v ?? '—'}</td>`; // 手入力の値（安全在庫・A2/B2の枠）
  $('grid').innerHTML = cls.map(k => { k0 = k; const any = days.map(d => c.cells[k + '|' + d]).find(x => x && x.rem != null);
    const nv = v => `<td class="nv">${v ?? '—'}</td>`;
    const sf = c.safe[k + '|' + month] ?? 0, isSh = c.base[k] != null;
    if (k.startsWith('AA・')) return `<tr><td class="cls" colspan="${days.length + 1}">AA クラス ${esc(k.slice(3))}<small>（1台ごと。空いていて稼働中なら1、予約・整備・未稼働なら0。安全在庫なし）</small></td></tr>` + head +
      row('＝ 残数', 'eq', x => `<td class="nv">${x ? x.ok : '—'}</td>`) +
      so.map(o => row(OTA[o], 'ota', (x, d) => { if (!x) return '<td class="n"></td>'; const q = x.ota[o], b = x.sb[o] ?? x.ok; const st = q == null ? 'n' : q > b ? 'r' : q < b ? 'y' : c.rel[o] && d > c.rel[o] ? 'off' : 'g';
        return `<td class="${st}" data-k="${esc(k + '|' + d)}">${q ?? ''}</td>`; })).join('') + '<tr class="gap"><td></td></tr>';
    if (isSh) { const src = Object.keys(sh).find(z => sh[z] === k), sv = d => c.share[k + '|' + d];
      return `<tr><td class="cls" colspan="${days.length + 1}">${esc(k)} クラス<small>（${esc(src)} の残りから分ける）</small><span class="sf">${esc(k)}の枠（手入力） <button data-c="${esc(k)}" data-b="-1">−</button><b>${c.base[k]}</b><button data-c="${esc(k)}" data-b="1">＋</button></span></td></tr>` + head +
        row(`${esc(k)}の枠（手入力）`, 'sub', (x, d) => man(sv(d) ? sv(d).b : null)) +
        row(`− ${esc(k)}の予約台数`, 'sub', (x, d) => nv(sv(d) ? sv(d).sold : null)) +
        row('＝ 残数', 'eq', x => `<td class="nv">${x ? x.ok : '—'}</td>`) +
        so.map(o => row(OTA[o], 'ota', (x, d) => { if (!x) return '<td class="n"></td>'; const q = x.ota[o], b = x.sb[o] ?? x.ok; const st = q == null ? 'n' : q > b ? 'r' : q < b ? 'y' : c.rel[o] && d > c.rel[o] ? 'off' : 'g';
          return `<td class="${st}" data-k="${esc(k + '|' + d)}">${q ?? ''}</td>`; })).join('') + '<tr class="gap"><td></td></tr>'; }
    return `<tr><td class="cls" colspan="${days.length + 1}">${esc(k)} クラス${any ? `<span class="sf">${esc(+month.slice(5))}月の安全在庫（手入力） <button data-c="${esc(k)}" data-d="-1">−</button><b>${sf}</b><button data-c="${esc(k)}" data-d="1">＋</button></span>` : ''}</td></tr>` + head +
      row('稼働台数', '', x => nv(x && x.fleet)) +
      row('− 予約台数', 'sub', x => nv(x && x.fleet != null && x.rem != null ? x.fleet - Math.max(0, x.rem) : null)) +
      (sh[k] ? row(`− ${sh[k]}に回す分（${sh[k]}の枠 − ${sh[k]}の予約）`, 'sub', (x, d) => nv(share(k, d))) : '') +
      row('− 安全在庫（手入力）', 'sub', x => man(x && x.rem != null ? sf : null)) +
      row('＝ 残数', 'eq', x => `<td class="nv">${x ? x.ok : '—'}</td>`) +
      so.map(o => row(OTA[o], 'ota', (x, d) => { if (!x) return '<td class="n"></td>'; const q = x.ota[o], b = x.sb[o] ?? x.ok; const st = q == null ? 'n' : q > b ? 'r' : q < b ? 'y' : c.rel[o] && d > c.rel[o] ? 'off' : 'g';
        return `<td class="${st}" data-k="${esc(k + '|' + d)}">${q ?? ''}</td>`; })).join('') + '<tr class="gap"><td></td></tr>'; }).join('');
  $('rel').innerHTML = '<b>在庫解放期間</b>ここまで売り出す（この先は全部0）：' + so.map(o => `<label>${esc(OTA[o])}<input type="date" data-o="${esc(o)}" value="${esc(c.rel[o] || '')}"></label>`).join('');
  $('rel').querySelectorAll('input').forEach(i => i.onchange = () => setRel(i.dataset.o, i.value));
  $('grid').querySelectorAll('.sf button').forEach(b => b.onclick = () => b.dataset.b ? setBase(b.dataset.c, +b.dataset.b) : setSafe(b.dataset.c, +b.dataset.d));
  $('grid').querySelectorAll('td[data-k]').forEach(t => t.onclick = () => pop(c.cells[t.dataset.k]));
  $('foot').textContent = `OTAの行の数字＝いまOTAに出ている数（緑＝残数と同じ）。ロボがOTAを読んだ時刻 ${jst(c.last)}・5分ごとに自動で更新`;
}
async function setSafe(k, d) {
  const s = STORES.find(z => z.id === store), c = cache[store], q = Math.max(0, Math.min(99, (c.safe[k + '|' + month] ?? 0) + d));
  let who = ''; try { who = localStorage.getItem('inv_who') || ''; } catch {}
  const r = await rpc(DB[s.db], 'invctl_set_safety', { p_store: store, p_cls: k, p_ym: month + '-01', p_qty: q, p_by: (who || '在庫チェック画面') });
  if (!r.ok) { $('foot').textContent = `安全在庫を変えられませんでした（${r.status}）`; return; }
  try { cache[store] = await fetchStore(s); } catch (e) { cache[store] = { err: e.message }; } draw();
  $('foot').textContent = `${k}クラス ${+month.slice(5)}月の安全在庫を ${q} 台にしました。残数と色を出し直しました。`;
}
async function setRel(o, v) {
  const s = STORES.find(z => z.id === store);
  let who = ''; try { who = localStorage.getItem('inv_who') || ''; } catch {}
  const r = await rpc(DB[s.db], 'invctl_set_release', { p_store: store, p_ota: o, p_until: v, p_by: (who || '在庫チェック画面') });
  if (!r.ok) { $('foot').textContent = `${OTA[o]}の在庫解放期間を変えられませんでした（${r.status}）`; return; }
  try { cache[store] = await fetchStore(s); } catch (e) { cache[store] = { err: e.message }; } draw();
  $('foot').textContent = `${OTA[o]}は ${v} まで売り出します。残数と色を出し直しました。`;
}
async function setBase(k, d) {
  const s = STORES.find(z => z.id === store), c = cache[store], q = Math.max(0, Math.min(99, (c.base[k] ?? 0) + d));
  let who = ''; try { who = localStorage.getItem('inv_who') || ''; } catch {}
  const r = await rpc(DB[s.db], 'invctl_set_share', { p_store: store, p_cls: k, p_base: q, p_by: (who || '在庫チェック画面') });
  if (!r.ok) { $('foot').textContent = `${k}の枠を変えられませんでした（${r.status}）`; return; }
  try { cache[store] = await fetchStore(s); } catch (e) { cache[store] = { err: e.message }; } draw();
  $('foot').textContent = `${k}の枠を ${q} 台にしました（全部の月）。残数と色を出し直しました。`;
}
function pop(x) {
  const s = STORES.find(z => z.id === store), rem = Math.max(0, x.rem ?? 0);
  $('popT').textContent = `${s.name} ${x.c}クラス ${+x.dd.slice(5, 7)}/${+x.dd.slice(8)}`;
  $('popTbl').innerHTML = `<tr><td>稼働台数</td><td class="v">${x.fleet ?? '—'}台</td></tr><tr><td>− 予約台数（整備・未配車も）</td><td class="v">${x.fleet != null && x.rem != null ? x.fleet - rem : '—'}台</td></tr><tr><td>− 安全在庫など</td><td class="v">${x.rem != null ? Math.max(0, rem - x.ok) : '—'}台</td></tr>` +
    `<tr><td><b>＝ 残数（全OTAに出す数）</b></td><td class="v"><b>${x.ok}台</b></td></tr>` +
    s.otas.map(o => { const q = x.ota[o], b = x.sb[o] ?? x.ok; const st = q == null ? 'n' : q > b ? 'r' : q < b ? 'y' : 'g';
      return `<tr><td>${OTA[o]}</td><td class="v"><span class="sw ${st}" style="vertical-align:middle;margin-right:6px;animation:none"></span>${q ?? '未読'}${q == null ? '' : '台'}</td></tr>`; }).join('');
  $('pop').style.display = 'flex';
}
draw(); loadAll(); setInterval(loadAll, 5 * 60e3);
</script>
