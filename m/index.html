<style>
:root{--navy:#002063;--navy2:#001548;--yel:#FABE00;--bg:#F4F5F7;--ink:#14181F;--sub:#5A6270;--mute:#7A818C;--line:#E3E6EA;--card:#fff;
--g:#1E7B4F;--gb:#E8F5EE;--o:#B45309;--ob:#FDF3E7;--b:#002063;--bb:#E8ECF5;--r:#B42318;--rb:#FDECEC}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',system-ui,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--navy)}
button{font-family:inherit}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
header{background:var(--navy);height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top)}
header img{height:24px;margin-left:16px}
.hdr-r{display:flex;align-items:center;height:56px}
.lang{font-size:12px;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:4px 10px;margin-right:10px}
.bk{height:56px;min-width:78px;background:var(--yel);color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;border:0;cursor:pointer}
@keyframes hdmPulse{0%,100%{box-shadow:0 0 0 0 rgba(250,190,0,.9);opacity:1}50%{box-shadow:0 0 0 6px rgba(250,190,0,0);opacity:.75}}
.strip{background:var(--navy2);padding:8px 12px;display:flex;gap:6px}
.strip div{flex:1;min-height:36px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;color:rgba(255,255,255,.45);font-size:13px}
.strip .on{background:var(--yel);color:var(--navy);font-weight:700;animation:hdmPulse 1.6s ease-in-out infinite}
.strip .on:before{content:"";width:8px;height:8px;border-radius:999px;background:var(--navy)}
.title{background:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.title small{display:block;font-size:12px;color:var(--sub)}
.title b{font-size:16px}
.badge{font-size:12px;font-weight:700;color:var(--navy);background:var(--bb);border-radius:999px;padding:4px 10px;white-space:nowrap}
main{padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
.card{background:var(--card);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.h{font-size:13px;font-weight:700;color:var(--navy)}
.big{font-size:22px;font-weight:700;line-height:1.35}
.sub{font-size:12px;color:var(--sub);line-height:1.6}
.txt{font-size:14px;color:#3A414D;line-height:1.7}
.hero{background:var(--navy);color:#fff}
.hero .h{color:var(--yel)}
.hero .sub{color:rgba(255,255,255,.8)}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.p-g{color:var(--g);background:var(--gb)}.p-o{color:var(--o);background:var(--ob)}.p-b{color:var(--b);background:var(--bb)}.p-r{color:var(--r);background:var(--rb)}.p-x{color:var(--mute);background:#EEF0F3}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #EEF0F3;text-decoration:none;color:var(--ink);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.row .l{display:flex;flex-direction:column;gap:2px}
.row .n{font-size:14px;font-weight:700}
.row .v{font-size:13px;color:#3A414D}
.row .r{font-size:11px;color:var(--mute)}
.row.dim{opacity:.55}
.chev{color:var(--mute)}
.btn{min-height:48px;border-radius:12px;border:0;background:var(--navy);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;width:100%}
.btn.y{background:var(--yel);color:var(--navy)}
.btn.o{background:#fff;border:1px solid var(--navy);color:var(--navy)}
.btn.g{background:#fff;border:1px solid #C9CED6;color:#3A414D;font-weight:500}
.btn.red{background:var(--r)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 10px;font-size:14px}
.kv dt{color:var(--sub);font-size:13px}.kv dd{margin:0;font-weight:500}
.must{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #EEF0F3;font-size:14px}
.must:last-child{border-bottom:0}
.steps{display:flex;gap:4px}
.steps div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--mute)}
.steps i{display:block;height:6px;width:100%;border-radius:3px;background:var(--line)}
.steps .on{color:var(--ink)}.steps .on i{background:var(--navy)}.steps .cur i{background:var(--yel)}
.tl{display:flex;flex-direction:column;gap:0}
.tl div{display:flex;gap:10px;font-size:13px;padding:6px 0;color:var(--mute)}
.tl div.done{color:var(--ink)}
.tl b{width:44px;flex-shrink:0;font-weight:700}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.live:before{content:"";width:8px;height:8px;border-radius:99px;background:#16a34a;animation:hdmPulse 1.6s infinite}
footer{background:#F3F5F8;border-top:3px solid var(--yel);padding:20px 20px 14px;display:flex;flex-direction:column;gap:12px}
footer .lg{background:var(--navy);padding:5px 8px;border-radius:4px;display:inline-flex;align-self:flex-start}
footer .lg img{height:16px}
footer .t{font-size:12px;color:#4B5563;line-height:1.7}
footer .ln{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
footer .ln a{font-size:12px;color:#4B5563;text-decoration:none;padding:4px 0}
footer .c{font-size:11px;color:#6B7280}
nav{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{min-height:44px;border:0;background:none;font-size:12px;color:var(--sub);cursor:pointer;position:relative}
nav button.on{font-weight:700;color:var(--navy)}
nav button .dot{position:absolute;top:6px;right:calc(50% - 30px);min-width:16px;height:16px;border-radius:99px;background:var(--r);color:#fff;font-size:10px;line-height:16px;padding:0 4px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.scrim.show{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
.sheet h3{margin:0;font-size:17px}
.sheet label{font-size:13px;font-weight:700;color:var(--sub)}
.sheet input,.sheet select,.sheet textarea{font:inherit;font-size:16px;padding:12px;border:1px solid #C9CED6;border-radius:10px;width:100%}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#14181F;color:#fff;font-size:14px;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:30;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.center{padding:60px 24px;text-align:center;color:var(--sub);font-size:14px;line-height:1.8}
.prev{background:#FFF7D6;color:#7A5B00;font-size:12px;padding:8px 14px;text-align:center}
/* ★2026-11-08 nosh「触りたくなるUI」6案（3店共通）：現在地ライン・準備リング・あと何分・押すと時刻つき返事・カウントダウン・返却日めくるカード */
.jr{background:#fff;border-radius:16px;padding:14px 12px 10px}
.jr ol{list-style:none;margin:0;padding:0;display:flex;justify-content:space-between;position:relative}
.jr ol:before{content:"";position:absolute;left:14px;right:14px;top:7px;height:3px;background:var(--line);border-radius:2px}
.jr .fl{position:absolute;left:14px;top:7px;height:3px;background:var(--navy);border-radius:2px}
.jr li{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0}
.jr li i{width:17px;height:17px;border-radius:50%;background:var(--line);border:3px solid #fff;box-sizing:border-box}
.jr li.dn i{background:var(--navy)}
.jr li.cu i{background:var(--yel);animation:hdmPulse 1.6s ease-in-out infinite}
.jr li span{font-size:10px;color:var(--mute);white-space:nowrap}
.jr li.cu span{color:var(--navy);font-weight:700}
.ring{position:relative;width:64px;height:64px;flex-shrink:0}
.ring svg{transform:rotate(-90deg);display:block}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:var(--navy)}
.ringhd{display:flex;align-items:center;gap:14px}
.okst{display:inline-block;border:3px solid var(--g);color:var(--g);border-radius:10px;padding:2px 12px;font-size:18px;font-weight:700;transform:rotate(-8deg);animation:okPop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes okPop{from{transform:rotate(-8deg) scale(.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.cd{display:flex;gap:6px;margin-top:2px}
.cd div{background:rgba(255,255,255,.12);border-radius:10px;min-width:54px;padding:6px 6px 4px;text-align:center}
.cd b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;color:#fff}
.cd small{font-size:10px;color:rgba(255,255,255,.75)}
.eta{display:flex;align-items:baseline;gap:6px}
.eta b{font-size:56px;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums}
.eta span{font-size:17px;font-weight:700}
.ack{display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.ack div{display:flex;align-items:center;gap:8px;font-size:13px;animation:ackIn .35s ease-out both}
.ack div+div{animation-delay:.25s}
.ack i{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;color:#fff;background:var(--navy)}
.ack i.g{background:var(--g)}
.ack i.w{background:#fff;border:2px dashed var(--o)}
.ack time{margin-left:auto;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
@keyframes ackIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.btn,.row{position:relative;overflow:hidden;transition:transform .12s}
.btn:active{transform:scale(.97)}
.rip{position:absolute;border-radius:50%;background:rgba(250,190,0,.45);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.ntf{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;width:100%;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.ntf b{font-size:15px}
.sw{width:50px;height:30px;border-radius:99px;background:#C9CED6;position:relative;flex-shrink:0}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--g)}.sw.on:after{left:23px}
.sto{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -2px}
.sto::-webkit-scrollbar{display:none}
.sto>div{flex:0 0 100%;scroll-snap-align:center;background:var(--navy);color:#fff;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;min-height:220px}
.sto>div:nth-child(2){background:#14427f}.sto>div:nth-child(3){background:#1f5e52}.sto>div:nth-child(4){background:#3b3f8f}
.sto svg{width:72px;height:72px}
.sto .t{font-size:20px;font-weight:700;line-height:1.4}
.sto .btn{margin-top:auto;background:var(--yel);color:var(--navy)}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .2s}
.dots i.on{width:20px;border-radius:4px;background:var(--navy)}
@media (prefers-reduced-motion:reduce){.jr li.cu i,.okst,.ack div,.rip{animation:none}.btn:active{transform:none}}
</style>
</head>

const GAS_LIC="https://script.google.com/macros/s/AKfycbycpzE1RIu2LbIlYVeRYcXxfIgfDhY5y1Vtdh1Rj69S9uZEnmqFMDBHqq3y6pHS70_t7A/exec", GAS_LIC_SECRET="hdm-lic-7c3f9a21";

function openLicense(){if(!DATA)return;if(!LIC.length)LIC=[licNew()];licPaint();}
function licPaint(){const L=DATA.license||{},can=LIC.some(p=>p.front)&&!LIC_BUSY,mx=new Date().toISOString().slice(0,10);
  const slot=(i,side)=>{const p=LIC[i],u=side==="front"?p.fu:p.bu;return `<label style="flex:1;display:flex;flex-direction:column;gap:4px;cursor:pointer"><span>${side==="front"?"表（必須）":"裏（あれば）"}</span>${u?`<img src="${u}" style="width:100%;height:92px;object-fit:cover;border-radius:10px;border:1px solid #C9CED6">`:`<span style="height:92px;border:1px dashed #C9CED6;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--sub)">写真を選ぶ</span>`}<input type="file" accept="image/*,application/pdf" style="display:none" onchange="licPick(${i},'${side}',this)"></label>`;};

function licPick(i,side,inp){const f=inp.files&&inp.files[0];if(!f)return;const p=LIC[i];if(side==="front"){p.front=f;p.fu=/pdf/i.test(f.type)?"":URL.createObjectURL(f);}else{p.back=f;p.bu=/pdf/i.test(f.type)?"":URL.createObjectURL(f);}licPaint();}
function shrink(f){return new Promise(res=>{if(!f||!/^image\//.test(f.type||"")){res(f);return;}const u=URL.createObjectURL(f),im=new Image();const to=setTimeout(()=>res(f),15000);im.onload=()=>{try{let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,1600/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);c.toBlob(b=>{clearTimeout(to);res(b&&b.size<f.size?b:f);},"image/jpeg",.7);}catch(_){clearTimeout(to);res(f);}};im.onerror=()=>{clearTimeout(to);res(f);};im.src=u;});}
function b64(f){return new Promise((ok,ng)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=ng;r.readAsDataURL(f);});}
function acqCall(fn,body){return fetch(ST.ACQ[0]+fn,{method:"POST",headers:{apikey:ST.ACQ[1],Authorization:"Bearer "+ST.ACQ[1],"Content-Type":"application/json"},body:JSON.stringify({p_token:TOKEN,p_store:SID,...body})}).then(r=>r.json());}
async function licUpload(){if(LIC_BUSY||!DATA)return;const r=DATA.reservation,ppl=LIC.filter(p=>p.front),st=()=>$("#licSt");
  if(!ppl.length){toast("免許証の表を選んでください");return;}
  if(ppl.some(p=>!p.acq)){st().style.color="var(--r)";st().textContent="免許を初めて取った日を入れてください";return;}
  if(DEMO){toast("お試し表示のため送信しません");return;}
  const jobs=[];LIC.forEach((p,i)=>{if(p.front)jobs.push([p.front,"person"+(i+1)+"_front"]);if(p.back)jobs.push([p.back,"person"+(i+1)+"_back"]);});
  LIC_BUSY=true;licPaint();let ok=0,ng=0;
  for(let i=0;i<jobs.length;i++){try{const f=await shrink(jobs[i][0]),lb=jobs[i][1],ext=/pdf/i.test(f.type)?"pdf":"jpg";
    const resp=await fetch(GAS_LIC,{method:"POST",body:JSON.stringify({secret:GAS_LIC_SECRET,store:SID,resId:r.id,custName:r.name||"",label:lb,fileName:lb+"_"+Date.now()+"."+ext,mime:f.type||"image/jpeg",b64:await b64(f)})});
    const j=await resp.json().catch(()=>({}));if(resp.ok&&j.ok)ok++;else ng++;}catch(_){ng++;}
    if(st())st().textContent=`送っています ${i+1}/${jobs.length}`;}
  LIC_BUSY=false;
  if(ng){licPaint();st().style.color="var(--r)";st().textContent=`送れなかった写真があります（${ok}/${jobs.length}）。もう一度お試しください`;return;}
  try{await call("license_uploaded",{count:ok,drivers:ppl.length});}catch(_){}
  try{const g=await acqCall("lic_get_acquired",{});let base=0;Object.keys((g&&g.drivers)||{}).forEach(k=>base=Math.max(base,+k||0));const map={};ppl.forEach((p,i)=>map[String(base+i+1)]=p.acq);await acqCall("lic_report_acquired",{p_drivers:map});}catch(_){}
  LIC=[];DATA.license={cnt:((DATA.license&&DATA.license.cnt)||0)+ok,drivers:((DATA.license&&DATA.license.drivers)||0)+ppl.length};
  closeSheet();toast("免許証を登録しました");render();}

 [/([\d:]+)でしたら伺えます/g,(m,a)=>[`We can come at ${a}`,`若為${a}可以前往`,`${a}라면 방문 가능합니다`][I]],
 [/([\d:]+)はご用意できませんでした。/g,(m,a)=>[`${a} was not available. `,`${a}無法安排。`,`${a}는 준비하지 못했습니다. `][I]],
 [/(\d+)時間前を切ってからの変更/g,(m,a)=>[`Changes less than ${a}h before`,`${a}小時前之後的變更`,`${a}시간 전 이후의 변경`][I]],
 [/宛名を入れると、PDFですぐに発行できます（([^）]*)）。/g,(m,a)=>[`Enter a name to issue a PDF receipt right away (${a}).`,`輸入抬頭即可立即開立PDF收據（${a}）。`,`수신인을 입력하면 PDF로 바로 발행할 수 있습니다 (${a}).`][I]],
 [/^今[\s　]+/,()=>["Now ","目前 ","현재 "][I]],
 [/([\d\/]+ [\d:]+) まで$/,(m,a)=>[`by ${a}`,`${a}前`,`${a}까지`][I]],
 [/(\d+)時間前まで/g,(m,a)=>[`Until ${a}h before`,`${a}小時前為止`,`${a}시간 전까지`][I]],
 [/(\d+)分以内/g,(m,a)=>[`within ${a} min`,`${a}分鐘內`,`${a}분 이내`][I]],
 [/(\d+)分ほど/g,(m,a)=>[`About ${a} min`,`約${a}分鐘`,`${a}분 정도`][I]],
 [/(\d+)時間ほど/g,(m,a)=>[`About ${a} h`,`約${a}小時`,`${a}시간 정도`][I]],
 [/^(\d+)名$/,(m,a)=>[`${a} people`,`${a}人`,`${a}명`][I]],

];
const R2=[
 [/(\d+)名/g,(m,a)=>[`${a} people`,`${a}人`,`${a}명`][I]],
 [/(\d+)件/g,(m,a)=>[`${a}`,`${a}件`,`${a}건`][I]],
 [/([\d,]+)円/g,(m,a)=>[`¥${a}`,`${a}日圓`,`${a}엔`][I]],
 [/(\d+)日(?!圓)/g,(m,a)=>[`${a} days`,`${a}天`,`${a}일`][I]],
 [/(\d+)分(?!鐘)/g,(m,a)=>[`${a} min`,`${a}分鐘`,`${a}분`][I]],
 [/「([^」]*)」/g,(m,a)=>I===0?`"${a}"`:m]
];
const KEYS=Object.keys(D).filter(k=>k.length>=2).sort((a,b)=>b.length-a.length);
const JP=/[぀-ヿ一-鿿]/;
const CACHE=new Map();
function tr(s){if(!s||!JP.test(s))return s;if(CACHE.has(s))return CACHE.get(s);
  const lead=s.match(/^\s*/)[0],tail=s.match(/\s*$/)[0];let t=s.trim(),out;
  if(D[t])out=D[t][I];
  else{
    for(const [re,f] of R){t=t.replace(re,f);if(D[t]){t=D[t][I];break;}}
    if(JP.test(t))for(const k of KEYS){if(t.indexOf(k)<0)continue;const v=D[k][I];t=t.split(k).join(I===1?v:" "+v+" ");if(!JP.test(t))break;}
    for(const [re,f] of R2)t=t.replace(re,f);
    if(I!==1)t=t.replace(/・/g,' · ').replace(/\s{2,}/g," ").replace(/\s+([,.:;!?)）」、。])/g,"$1").replace(/([(（「])\s+/g,"$1").trim();
    out=t;}
  out=lead+out+tail;CACHE.set(s,out);return out;}
window.MP_TR=tr;
const SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,NOSCRIPT:1};
function walk(root){if(!root)return;
  if(root.nodeType===3){const p=root.parentNode;if(p&&!SKIP[p.nodeName]&&!(p.closest&&p.closest('[translate="no"]'))){const v=tr(root.nodeValue);if(v!==root.nodeValue)root.nodeValue=v;}return;}
  if(root.nodeType!==1||SKIP[root.nodeName])return;
  if(root.getAttribute&&root.getAttribute("translate")==="no")return;
  ["placeholder","title","aria-label","alt"].forEach(a=>{const v=root.getAttribute&&root.getAttribute(a);if(v&&JP.test(v))root.setAttribute(a,tr(v));});
  if(root.nodeName==="INPUT"&&/^(button|submit)$/i.test(root.type)&&JP.test(root.value))root.value=tr(root.value);
  for(let c=root.firstChild;c;c=c.nextSibling)walk(c);}
let busy=false;
const mo=new MutationObserver(ms=>{if(busy)return;busy=true;try{for(const m of ms){if(m.type==="characterData")walk(m.target);else m.addedNodes.forEach(walk);}}finally{mo.takeRecords();busy=false;}});
const _c=window.confirm,_a=window.alert;window.confirm=m=>_c.call(window,tr(String(m)));window.alert=m=>_a.call(window,tr(String(m)));
function start(){langBtn();busy=true;walk(document.body);document.title=tr(document.title);busy=false;mo.observe(document.body,{childList:true,subtree:true,characterData:true});}
if(document.body)start();else document.addEventListener("DOMContentLoaded",start);
})();
</script>
