<!DOCTYPE html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OTA価格</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#f6f7f9;color:#0f172a;font-size:14px}
.wrap{max-width:1200px;margin:0 auto;padding:12px}
.tabs,.periods{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tabs button,.periods button{flex:1;min-width:90px;padding:10px;border:none;border-radius:6px;background:#e2e8f0;font-weight:800;font-size:15px;cursor:pointer;position:relative}
.periods button{font-size:14px;padding:8px}
.tabs button.on,.periods button.on{background:#2f3b55;color:#fff}
.tabs .dot{position:absolute;top:4px;right:6px;width:10px;height:10px;border-radius:50%}
.mock{background:#fef3c7;color:#92400e;border-radius:8px;padding:8px 12px;margin:0 0 10px;font-weight:800;font-size:13px}
.big{border-radius:8px;padding:16px;margin:0 0 10px;font-size:22px;font-weight:900;text-align:center}
.big small{display:block;font-size:13px;font-weight:600;margin-top:4px}
.big.ok{background:#dcfce7;color:#166534}.big.ng{background:#fee2e2;color:#991b1b;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
.rule{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;font-size:13px}
.rule span{display:flex;align-items:center;gap:6px;background:#fff;border-radius:6px;padding:6px 10px}
.sw{width:18px;height:18px;border-radius:4px;display:inline-block}
.act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.go{padding:12px 18px;border:none;border-radius:8px;background:#f59e0b;color:#422006;font-size:16px;font-weight:900;cursor:pointer}
.go.sm{padding:6px 10px;font-size:12px;border-radius:6px}
.act .muted{font-size:13px;color:#64748b;font-weight:700}
.card{background:#fff;border-radius:8px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin:0 0 10px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:2px;width:100%}
th{font-size:12px;color:#64748b;font-weight:700;padding:4px;white-space:nowrap}
td{height:34px;text-align:right;font-weight:800;font-size:14px;border-radius:5px;padding:0 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
td.cls{text-align:left;font-size:17px;font-weight:900;padding:12px 4px 2px;height:auto}
td.lbl{text-align:left;font-size:13px;width:190px;white-space:normal}td.lbl small{display:block;font-size:11px;color:#64748b;font-weight:600}td small{display:block;font-size:10px;color:#64748b;font-weight:600;line-height:1.1}.big.info{background:#e0f2fe;color:#075985}.go.off{background:#e2e8f0;color:#94a3b8;cursor:not-allowed}
tr.truth td.v{background:#2f3b55;color:#fff}tr.truth td.lbl{color:#2f3b55;font-weight:900}
.w{background:#fff;color:#0f172a;box-shadow:inset 0 0 0 1px #e2e8f0}.g{background:#22c55e;color:#fff}.r{background:#dc2626;color:#fff;animation:blink 1s infinite}.n{background:#e2e8f0;color:#94a3b8}
td.st{text-align:center;font-size:12px}
td.pic{text-align:center;cursor:pointer;font-size:18px}
td.pic.no{background:#fee2e2;color:#991b1b;font-size:12px;cursor:default}
.foot{font-size:12px;color:#64748b;text-align:center;margin:6px 0 20px}
#pop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#pop .in{background:#fff;border-radius:10px;padding:16px;max-width:380px;width:100%}
#pop h3{margin:0 0 10px;font-size:17px}#pop p{margin:0 0 8px;font-size:14px;line-height:1.6}
#pop button{margin-top:12px;width:100%;padding:10px;border:none;border-radius:6px;background:#2f3b55;color:#fff;font-size:15px;font-weight:800}
</style></head><body>
<div class="wrap">
  <div class="mock">今のOTAの料金をロボが読んだ値です（読むだけ）。価格表はまだつないでいないので比べる相手がなく、「OTA変更」ボタンはまだ使えません。</div>
  <div class="tabs" id="tabs"></div>
  <div id="big"></div>
  <div class="rule">
    <span><i class="sw" style="background:#2f3b55"></i>価格表（正解）：つないだら出ます</span>
    <span><i class="sw w"></i>OTA の今の料金</span>
    <span><i class="sw g"></i>OTA ＝ 価格表</span>
    <span><i class="sw r"></i>OTA が価格表とちがう</span>
    <span><i class="sw n"></i>ロボがまだ読めていない</span>
  </div>
  <div class="act"><button class="go off" id="goAll" disabled></button><span class="muted" id="lastw"></span></div>
  <div class="card scroll"><table id="grid"></table></div>
  <div class="foot">ルール：価格表だけが正解。OTA変更ボタンで価格表どおりに書き、書いた後は全店・全OTA・全クラスの画面写真を必ず残す。ロボは在庫の見回りのついでに料金画面を読み、ここへ入れます（読むだけ）。</div>
</div>
<script>
// 価格（オーナー 2026-10-27「ダッシュボードに追加して 価格を 各店の価格表をだしてそこに OTA変更ボタン」）
// OTA の今の料金＝mini の在庫ロボが料金画面を読んで invctl.ota_price に入れた値。価格表（正解）はまだ無いので比べない
const HD = { url: 'https://ckrxttbnawkclshczsia.supabase.co', key: 'sb_publishable_aTVhlY0YD-5BBfI03ZNnsg_MzO_vsIe' };
const STORES = [
  { id: 'nha', name: '那覇', otas: ['RKT', 'JLN', 'SKT', 'ART', 'RDC'], cls: ['A', 'B', 'D', 'F', 'H', 'A2', 'B2'] },
  { id: 'spk', name: '札幌', otas: ['RKT', 'JLN', 'SKT', 'ART', 'RDC'], cls: ['A', 'B', 'C', 'F', 'G', 'H', 'S', 'A2', 'B2'] },
  { id: 'takh', name: '高松 HDM', otas: ['RKT', 'JLN'], cls: ['C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K'] },
  { id: 'takb', name: '高松 BUDDICA', otas: ['ART', 'TAB', 'RDC'], cls: ['A', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K'] },
];
const OTA = { RKT: '楽天', JLN: 'じゃらん', SKT: 'skyticket', ART: 'エアトリ', RDC: 'レンタカードットコム', TAB: 'たびらい' };
// OTA ごとの欄（読んだ欄名 → 見出し）
const FIELDS = {
  // 楽天の画面の見出しは「日帰り・01泊02日・02泊03日・03泊04日・1日追加」（10/27 確認）。じゃらん・エアトリも同じ並び（1倍・2倍・3倍・4倍・1倍）
  JLN: [['time_type_fee_1', '日帰り'], ['time_type_fee_2', '1泊2日'], ['time_type_fee_3', '2泊3日'], ['time_type_fee_4', '3泊4日'], ['over_fee_day', '1日追加']],
  RKT: [['kin_01_06', '日帰り'], ['kin_07_12', '1泊2日'], ['kin_13_24', '2泊3日'], ['kin_tyoka_hour', '3泊4日'], ['kin_tyoka_day', '1日追加']],
  ART: [['slot01_chgs', '日帰り'], ['slot02_chgs', '1泊2日'], ['slot03_chgs', '2泊3日'], ['slot04_chgs', '3泊4日'], ['add_day_chgs', '1日追加']],
  SKT: [['p0', '料金0'], ['p1', '料金1'], ['p2', '料金2'], ['p3', '料金3'], ['p4', '料金4'], ['p5', '料金5']],
  RDC: [['PRICE03', '3時間'], ['PRICE06', '6時間'], ['PRICE12', '12時間'], ['PRICE24', '24時間'], ['PRICEEX', '延長']],
};
const NOTE = { TAB: 'たびらいの金額表はまだ読めていません（画面を探し中）', RDC_spk: '札幌の料金表がRDCにありません（那覇の3件だけ）' };
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
let store = STORES.some(s => s.id === P.get('store')) ? P.get('store') : 'nha';
const data = {};
const yen = v => v == null ? '—' : Number(v).toLocaleString('ja-JP');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ago = t => { if (!t) return ''; const m = Math.round((Date.now() - Date.parse(t)) / 60000); return m < 60 ? `${m}分前` : m < 1440 ? `${Math.round(m / 60)}時間前` : new Date(t).toLocaleDateString('ja-JP'); };

async function load(st) {
  try {
    const r = await fetch(`${HD.url}/rest/v1/rpc/invctl_price_list`, { method: 'POST', headers: { apikey: HD.key, Authorization: `Bearer ${HD.key}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_store: st }) });
    data[st] = r.ok ? await r.json() : [];
  } catch { data[st] = []; }
}
// 1件（1プラン/1期間）を表の行にする。RDC は1件の中に期間ごとの行（_1,_2…）がある
function lines(x) {
  if (x.ota === 'RDC') {
    const ns = [...new Set(Object.keys(x.prices).map(k => (k.match(/_(\d+)$/) || [])[1]).filter(Boolean))].sort((a, b) => a - b);
    return ns.map(n => ({ x, sub: `期間${n}`, vals: FIELDS.RDC.map(([k, l]) => [l, x.prices[`${k}_${n}`]]) }));
  }
  return [{ x, sub: '', vals: (FIELDS[x.ota] || []).map(([k, l]) => [l, x.prices[k]]) }];
}
function draw() {
  const s = STORES.find(x => x.id === store), rows = data[store] || [];
  $('tabs').innerHTML = STORES.map(x => `<button class="${x.id === store ? 'on' : ''}" data-s="${x.id}">${x.name}<i class="dot" style="background:${(data[x.id] || []).length ? '#22c55e' : '#cbd5e1'}"></i></button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = async () => { store = b.dataset.s; history.replaceState(null, '', '?store=' + store + (P.get('embed') ? '&embed=1' : '')); if (!data[store]) { $('grid').innerHTML = '<tr><td class="lbl">読み込み中…</td></tr>'; await load(store); } draw(); });
  const per = s.otas.map(o => [o, rows.filter(r => r.ota === o).length]);
  const last = rows.reduce((m, r) => r.read_at > m ? r.read_at : m, '');
  $('big').innerHTML = `<div class="big info">${s.name}：OTAの料金 ${rows.length} 件を読みました<small>${per.map(([o, n]) => `${OTA[o]} ${n ? n + '件' : (NOTE[o] || NOTE[o + '_' + store] ? '—' : 'まだ')}`).join('・')}</small></div>`;
  $('goAll').textContent = `${s.name}：全OTAを価格表どおりに変更（価格表をつないだら使えます）`;
  $('lastw').textContent = last ? `最後に読んだ時刻：${new Date(last).toLocaleString('ja-JP')}（${ago(last)}）` : 'まだ読めていません';
  const cls = [...s.cls, ...new Set(rows.map(r => r.cls).filter(c => c && !s.cls.includes(c)))];
  let h = '';
  const otaRows = (list, onlyFound) => {
    let q = '';
    for (const o of s.otas) {
      const mine = list.filter(r => r.ota === o);
      if (!mine.length && onlyFound) continue;
      if (!mine.length) { q += `<tr><td class="lbl">${OTA[o]}</td><td class="n" colspan="6">${esc(NOTE[o + '_' + store] || NOTE[o] || 'まだ読めていない')}</td><td></td></tr>`; continue; }
      for (const x of mine) for (const ln of lines(x)) {
        q += `<tr><td class="lbl">${OTA[o]}<small title="${esc(x.label)}">${esc((x.label || '').slice(0, 40))}${ln.sub ? ' ' + ln.sub : ''}</small></td>`
          + ln.vals.map(([l, v]) => `<td class="${v == null ? 'n' : 'w'}"><small>${l}</small>${yen(v)}</td>`).join('') + '<td></td>'.repeat(Math.max(0, 6 - ln.vals.length))
          + `<td><button class="go sm off" disabled title="価格表をつないだら使えます">OTA変更</button></td></tr>`;
      }
    }
    return q;
  };
  for (const c of cls) {
    h += `<tr><td class="cls" colspan="8">${c}</td></tr>`;
    h += `<tr class="truth"><td class="lbl">価格表</td><td class="n" colspan="6">まだつないでいません</td><td></td></tr>`;
    h += otaRows(rows.filter(r => r.cls === c));
  }
  const unk = rows.filter(r => !r.cls || !cls.includes(r.cls));
  if (unk.length) { h += `<tr><td class="cls" colspan="8">クラス不明（ロボがクラスを読み取れなかった分）</td></tr>`; h += otaRows(unk, true); }
  $('grid').innerHTML = h;
}
(async () => { await Promise.all(STORES.map(x => load(x.id))); draw(); })();
</script>
</body></html>
