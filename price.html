<!DOCTYPE html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>価格チェック</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#f6f7f9;color:#0f172a;font-size:14px}
.wrap{max-width:1200px;margin:0 auto;padding:12px}
.tabs,.periods{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tabs button,.periods button{flex:1;min-width:90px;padding:10px;border:none;border-radius:6px;background:#e2e8f0;font-weight:800;font-size:15px;cursor:pointer;position:relative}
.periods button{font-size:14px;padding:8px}
.tabs button.on,.periods button.on{background:#2f3b55;color:#fff}
.tabs .dot{position:absolute;top:4px;right:6px;width:10px;height:10px;border-radius:50%}
.mock{background:#fef3c7;color:#92400e;border-radius:8px;padding:8px 12px;margin:0 0 10px;font-weight:800;font-size:13px}
.big{border-radius:8px;padding:16px;margin:0 0 10px;font-size:22px;font-weight:900;text-align:center}
.big small{display:block;font-size:13px;font-weight:600;margin-top:4px}
.big.ok{background:#dcfce7;color:#166534}.big.ng{background:#fee2e2;color:#991b1b;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
.rule{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;font-size:13px}
.rule span{display:flex;align-items:center;gap:6px;background:#fff;border-radius:6px;padding:6px 10px}
.sw{width:18px;height:18px;border-radius:4px;display:inline-block}
.act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.go{padding:12px 18px;border:none;border-radius:8px;background:#f59e0b;color:#422006;font-size:16px;font-weight:900;cursor:pointer}
.go.sm{padding:6px 10px;font-size:12px;border-radius:6px}
.act .muted{font-size:13px;color:#64748b;font-weight:700}
.card{background:#fff;border-radius:8px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin:0 0 10px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:2px;width:100%}
th{font-size:12px;color:#64748b;font-weight:700;padding:4px;white-space:nowrap}
td{height:34px;text-align:right;font-weight:800;font-size:14px;border-radius:5px;padding:0 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
td.cls{text-align:left;font-size:17px;font-weight:900;padding:12px 4px 2px;height:auto}
td.lbl{text-align:left;font-size:13px;width:150px}
tr.truth td.v{background:#2f3b55;color:#fff}tr.truth td.lbl{color:#2f3b55;font-weight:900}
.g{background:#22c55e;color:#fff}.r{background:#dc2626;color:#fff;animation:blink 1s infinite}.n{background:#e2e8f0;color:#94a3b8}
td.st{text-align:center;font-size:12px}
td.pic{text-align:center;cursor:pointer;font-size:18px}
td.pic.no{background:#fee2e2;color:#991b1b;font-size:12px;cursor:default}
.foot{font-size:12px;color:#64748b;text-align:center;margin:6px 0 20px}
#pop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#pop .in{background:#fff;border-radius:10px;padding:16px;max-width:380px;width:100%}
#pop h3{margin:0 0 10px;font-size:17px}#pop p{margin:0 0 8px;font-size:14px;line-height:1.6}
#pop button{margin-top:12px;width:100%;padding:10px;border:none;border-radius:6px;background:#2f3b55;color:#fff;font-size:15px;font-weight:800}
</style></head><body>
<div class="wrap">
  <div class="mock">イメージ（見た目の確認用）：価格表はまだつないでいません。数字は見本で、ボタンを押してもOTAには何も書きません。</div>
  <div class="tabs" id="tabs"></div>
  <div id="big"></div>
  <div class="rule">
    <span><i class="sw" style="background:#2f3b55"></i>価格表（正解）</span>
    <span><i class="sw g"></i>OTA ＝ 価格表</span>
    <span><i class="sw r"></i>OTA が価格表とちがう</span>
    <span><i class="sw n"></i>ロボがまだ読めていない</span>
    <span>📷 書いた後の画面写真（必須）</span>
  </div>
  <div class="periods" id="periods"></div>
  <div class="act"><button class="go" id="goAll"></button><span class="muted" id="lastw"></span></div>
  <div class="card scroll"><table id="grid"></table></div>
  <div class="foot">ルール：価格表だけが正解。OTA変更ボタンで価格表どおりに書き、書いた後は全店・全OTA・全クラスの画面写真を必ず残す（写真がない所は「写真なし」で赤）。</div>
</div>
<div id="pop"><div class="in"><h3 id="popT"></h3><div id="popB"></div><button onclick="document.getElementById('pop').style.display='none'">とじる</button></div></div>
<script>
// 価格（オーナー 2026-10-27「ダッシュボードに追加して 価格を 各店の価格表をだしてそこに OTA変更ボタンのイメージ」「価格変更後は全店全OTA全クラス画像証拠を義務化」）
const STORES = [
  { id: 'nha', name: '那覇', otas: ['RKT', 'JLN', 'SKT', 'ART', 'RDC'], cls: ['A', 'B', 'D', 'F', 'H', 'A2', 'B2'] },
  { id: 'spk', name: '札幌', otas: ['RKT', 'JLN', 'SKT', 'ART', 'RDC'], cls: ['A', 'B', 'C', 'D', 'F', 'G', 'H', 'S', 'A2', 'B2'] },
  { id: 'takh', name: '高松 HDM', otas: ['RKT', 'JLN'], cls: ['C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K'] },
  { id: 'takb', name: '高松 BUDDICA', otas: ['ART', 'TAB', 'RDC'], cls: ['A', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K'] },
];
const OTA = { RKT: '楽天', JLN: 'じゃらん', SKT: 'skyticket', ART: 'エアトリ', RDC: 'レンタカードットコム', TAB: 'たびらい' };
const COLS = ['日帰り', '1泊2日', '2泊3日', '3泊4日', '追加1日'];
const PERIODS = ['通常', 'LO（閑散）', 'LN', 'HN（繁忙）'];
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
let store = STORES.some(s => s.id === P.get('store')) ? P.get('store') : 'nha', period = 0;

// 見本の数字：価格表＝クラスごとの1日料金×日数。OTAは見本として一部だけずらす（赤の見え方の確認用）
const BASE = { A: 11000, A2: 12000, B: 8800, B2: 9600, C: 6600, D: 7700, E: 6600, F: 5500, G: 4400, H: 6600, I: 3300, J: 3850, K: 4950, S: 8800 };
const MUL = [1, 0.8, 0.9, 1.4];
const truth = (c, p) => { const d = Math.round(BASE[c] * MUL[p] / 100) * 100; return [d, d * 2, d * 3, d * 4, d]; };
const seed = s => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };
const otaVal = (st, c, o, p) => { const t = truth(c, p), h = seed(st + c + o + p); if (h % 23 === 0) return t.map(() => null); return h % 11 === 0 ? t.map((v, i) => i === 1 ? v + 1000 : v) : t; };
const pic = (st, c, o, p) => seed(st + c + o + p + 'pic') % 17 !== 0;
const yen = v => v == null ? '—' : v.toLocaleString('ja-JP');

function draw() {
  const s = STORES.find(x => x.id === store);
  const ng = st => { const x = STORES.find(y => y.id === st); let n = 0; for (const c of x.cls) for (const o of x.otas) { const t = truth(c, period), v = otaVal(st, c, o, period); n += v.some((q, i) => q != null && q !== t[i]) || !pic(st, c, o, period) ? 1 : 0; } return n; };
  $('tabs').innerHTML = STORES.map(x => `<button class="${x.id === store ? 'on' : ''}" data-s="${x.id}">${x.name}<i class="dot" style="background:${ng(x.id) ? '#dc2626' : '#22c55e'}"></i></button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { store = b.dataset.s; history.replaceState(null, '', '?store=' + store + (P.get('embed') ? '&embed=1' : '')); draw(); });
  $('periods').innerHTML = PERIODS.map((p, i) => `<button class="${i === period ? 'on' : ''}" data-p="${i}">${p}</button>`).join('');
  $('periods').querySelectorAll('button').forEach(b => b.onclick = () => { period = +b.dataset.p; draw(); });
  const n = ng(store);
  $('big').innerHTML = n ? `<div class="big ng">価格表とちがう／写真なし：${n} か所<small>「OTA変更」を押すと価格表どおりに書き、全部の画面写真を撮ります</small></div>` : `<div class="big ok">全OTAが価格表どおり ✅<small>${s.name}・${PERIODS[period]}</small></div>`;
  $('goAll').textContent = `${s.name}：全OTAを価格表どおりに変更`;
  $('goAll').onclick = () => pop(`${s.name} の全OTAを変更`, `<p>${s.otas.map(o => OTA[o]).join('・')} の全クラスを、価格表（${PERIODS[period]}）どおりに書きます。</p><p>書いた後、全クラスの画面を読み直して一致を確認し、画面写真を📷に残します。</p><p><b>イメージなので、今は何も書きません。</b></p>`);
  $('lastw').textContent = '最後に書いた時刻：—（まだ本番前）';
  let h = `<tr><th></th>${COLS.map(c => `<th>${c}</th>`).join('')}<th>状態</th><th>📷</th><th></th></tr>`;
  for (const c of s.cls) {
    const t = truth(c, period);
    h += `<tr><td class="cls" colspan="9">${c}</td></tr>`;
    h += `<tr class="truth"><td class="lbl">価格表</td>${t.map(v => `<td class="v">${yen(v)}</td>`).join('')}<td></td><td></td><td></td></tr>`;
    for (const o of s.otas) {
      const v = otaVal(store, c, o, period), bad = v.some((q, i) => q != null && q !== t[i]), none = v.every(q => q == null), ph = pic(store, c, o, period);
      h += `<tr><td class="lbl">${OTA[o]}</td>${v.map((q, i) => `<td class="${q == null ? 'n' : q === t[i] ? 'g' : 'r'}">${yen(q)}</td>`).join('')}`
        + `<td class="st ${none ? 'n' : bad ? 'r' : 'g'}">${none ? '未読' : bad ? 'ちがう' : '一致'}</td>`
        + (ph ? `<td class="pic" data-o="${o}" data-c="${c}">📷</td>` : `<td class="pic no">写真なし</td>`)
        + `<td><button class="go sm" data-o="${o}" data-c="${c}">OTA変更</button></td></tr>`;
    }
  }
  $('grid').innerHTML = h;
  $('grid').querySelectorAll('button[data-o]').forEach(b => b.onclick = () => pop(`${OTA[b.dataset.o]}・${b.dataset.c} を変更`, `<p>${s.name} ${OTA[b.dataset.o]} の ${b.dataset.c} を、価格表（${PERIODS[period]}）どおりに書きます。書いた後に読み直し、画面写真を残します。</p><p><b>イメージなので、今は何も書きません。</b></p>`));
  $('grid').querySelectorAll('td.pic[data-o]').forEach(b => b.onclick = () => pop(`📷 ${OTA[b.dataset.o]}・${b.dataset.c}`, `<p>ここに、書いた後のOTA管理画面の写真が出ます（撮った時刻つき）。</p><p><b>イメージ</b></p>`));
}
function pop(t, b) { $('popT').textContent = t; $('popB').innerHTML = b; $('pop').style.display = 'flex'; }
draw();
</script>
</body></html>
