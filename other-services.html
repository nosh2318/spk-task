<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>他サービス設定</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans',sans-serif;background:#f5f6f8;color:#1a1a1a;padding-bottom:40px}
  .hd{background:#1a1a1a;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
  .hd b{font-size:16px;font-weight:900}
  .hd .st{font-size:11px;opacity:.6;margin-left:auto}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  .desc{font-size:12px;color:#666;background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:16px;line-height:1.7}
  .brand{background:#fff;border-radius:14px;box-shadow:0 1px 8px rgba(0,0,0,.06);margin-bottom:14px;overflow:hidden}
  .brand-hd{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;user-select:none}
  .brand-ico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto}
  .brand-meta b{display:block;font-size:15px;font-weight:900}
  .brand-meta span{display:block;font-size:11px;color:#888;margin-top:2px}
  .chev{margin-left:auto;font-size:14px;color:#bbb;transition:.2s}
  .brand.open .chev{transform:rotate(90deg)}
  .links{display:none;border-top:1px solid #f0f0f0;padding:8px}
  .brand.open .links{display:block}
  .link{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:10px;text-decoration:none;color:#1a1a1a}
  .link:active{background:#f5f6f8}
  .link .li{width:34px;height:34px;border-radius:9px;background:#f1f2f5;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
  .link b{display:block;font-size:13px;font-weight:800}
  .link span{display:block;font-size:11px;color:#999;margin-top:1px}
  .link .go{margin-left:auto;color:#ccc;font-size:16px}
  .soon{opacity:.5;pointer-events:none}
  .badge{font-size:10px;font-weight:900;color:#fff;border-radius:5px;padding:2px 7px;margin-left:auto}
</style>
</head>
<body>
<div class="hd"><span style="font-size:18px">🧩</span><b>他サービス設定</b><span class="st" id="storeLbl">札幌店</span></div>
<div class="wrap">
  <div class="desc">HANDYMAN が運営する <b>他サービス（ブランド）</b>の表示・価格・設定をここで管理します。ブランドを選んで、中の各設定を編集してください。保存すると各顧客サイトに即反映されます。</div>
  <div id="brands"></div>
</div>

<script>
// 店舗判定：このファイルが置かれたリポでラベルを出し分け（NHAコピーは STORE='naha' に置換）
const STORE='spk';
const STORE_LABEL=(STORE==='naha')?'那覇店':'札幌店';
document.getElementById('storeLbl').textContent=STORE_LABEL;

const BRANDS=[
  {
    id:'keydrop', ico:'🔑', bg:'#1a1a1a', color:'#FABE00',
    name:'KEYDROP', sub:'カーデリバリー直販（keydrop.jp）',
    links:[
      {ico:'💴', l:'価格設定', s:'クラス×シーズナルの基本料金', url:'keydrop-pricing.html'},
      {ico:'🚗', l:'車両紹介', s:'クラスの車種名・定員・特徴・表示ON/OFF', url:'keydrop-vehicles.html'},
      {ico:'📍', l:'配達範囲', s:'配達可能エリア（中心/半径/市区町村）', url:'keydrop-admin.html'},
    ]
  },
  {
    id:'daisha', ico:'🚗', bg:'#0b3d2e', color:'#dfff200',
    name:'代車.com', sub:'代車・生活試乗（スワイプ予約）',
    links:[
      {ico:'💴', l:'価格設定', s:'クラス×シーズナル（閑散/通常/繁忙）の1日料金', url:'daisha-pricing.html'},
      {ico:'🧩', l:'商品情報設定', s:'クラス別の年式/装備/安心チェック/ギャラリー/紹介コピー', url:'daisha-products.html'},
    ]
  },
];

function render(){
  const el=document.getElementById('brands');
  el.innerHTML=BRANDS.map(function(b){
    return '<div class="brand" data-id="'+b.id+'">'
      +'<div class="brand-hd" onclick="toggle(this)">'
      +'<div class="brand-ico" style="background:'+b.bg+';color:'+b.color+'">'+b.ico+'</div>'
      +'<div class="brand-meta"><b>'+b.name+'</b><span>'+b.sub+'</span></div>'
      +'<span class="chev">›</span></div>'
      +'<div class="links">'+b.links.map(function(k){
        return '<a class="link'+(k.soon?' soon':'')+'" href="'+k.url+'">'
          +'<span class="li">'+k.ico+'</span>'
          +'<div><b>'+k.l+'</b><span>'+k.s+'</span></div>'
          +(k.soon?'<span class="badge" style="background:#94a3b8">準備中</span>':'<span class="go">›</span>')
          +'</a>';
      }).join('')+'</div></div>';
  }).join('');
  // 先頭ブランドは開いておく
  var first=document.querySelector('.brand');if(first)first.classList.add('open');
}
function toggle(hd){hd.parentElement.classList.toggle('open');}
render();
</script>
</body>
</html>
