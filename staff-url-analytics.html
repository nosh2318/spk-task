<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>個別URL 利用解析（バイトURL）</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f1f5f9;color:#0f172a;font-size:14px}
.wrap{max-width:1080px;margin:0 auto;padding:14px}
h1{font-size:19px;margin:6px 0 2px}
.sub{color:#64748b;font-size:12px;margin-bottom:12px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.ctrl select,.ctrl button{padding:8px 12px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font-size:14px;font-weight:600;cursor:pointer}
.ctrl button.on{background:#2563eb;color:#fff;border-color:#2563eb}
.cards{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.card{flex:1;min-width:130px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px}
.card .k{font-size:11px;color:#64748b;font-weight:700}
.card .v{font-size:26px;font-weight:900;margin-top:2px}
.sec{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.sec h2{font-size:14px;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid #eef2f7;text-align:left;white-space:nowrap}
th{color:#475569;font-size:11px;font-weight:700;background:#f8fafc;position:sticky;top:0}
.tblwrap{overflow-x:auto}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:800}
.b-spk{background:#e0f2fe;color:#0369a1}.b-nha{background:#fee2e2;color:#b91c1c}.b-bt{background:#dcfce7;color:#15803d}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.g{background:#16a34a}.a{background:#d97706}.r{background:#dc2626}.gray{background:#cbd5e1}
.mut{color:#94a3b8}
.bar{height:8px;border-radius:6px;background:#dbeafe}
.note{font-size:12px;color:#64748b;margin-top:6px}
.pill{display:inline-block;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:999px;padding:2px 8px;margin:2px 4px 2px 0;font-size:12px}
.pill b{color:#2563eb}
</style></head><body><div class="wrap">
<h1>📊 個別URL 利用解析（スタッフのバイトURL）</h1>
<div class="sub">staff.html?t=… の利用状況。誰がどれだけアクティブか・未来日まで見てるか・どのボタンが使われてるか。<b>計測開始日から前方記録</b>（過去は含みません）。</div>
<div class="ctrl">
  <span>店舗</span>
  <button data-store="all" class="on" onclick="setStore('all')">全店</button>
  <button data-store="spk" onclick="setStore('spk')">札幌</button>
  <button data-store="nha" onclick="setStore('nha')">那覇</button>
  <button data-store="bt" onclick="setStore('bt')">高松</button>
  <span style="margin-left:8px">期間</span>
  <select id="days" onchange="load()"><option value="7">直近7日</option><option value="30" selected>直近30日</option><option value="90">直近90日</option></select>
  <button onclick="load()">🔄 更新</button>
</div>
<div class="cards" id="cards"></div>
<div class="sec"><h2>👤 スタッフ別 利用状況</h2><div class="tblwrap"><table id="staffTbl"><thead><tr>
  <th>店</th><th>スタッフ</th><th>アクティブ日数</th><th>開いた回数</th><th>最終アクセス</th><th>端末</th><th>未来閲覧</th><th>操作数</th>
</tr></thead><tbody></tbody></table></div>
<div class="note">「アクティブ日数」＝期間内にURLを開いた日数／「未来閲覧」＝実際にスクロールして見た最も先の日付（当日より何日先まで確認したか。空＝当日分しか見ていない）。</div></div>
<div class="sec"><h2>🔘 ボタン別 クリック数（何が使われているか）</h2><div id="btns"></div></div>
<div class="sec"><h2>📱 端末別</h2><div id="dev"></div></div>
<div id="msg" class="mut" style="text-align:center;padding:20px"></div>
</div>
<script>
var SB="https://ckrxttbnawkclshczsia.supabase.co";
var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
var STORE="all";
function setStore(s){STORE=s;document.querySelectorAll("[data-store]").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-store")===s);});load();}
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function jstToday(){var n=new Date(Date.now()+9*3600*1000);return n.toISOString().slice(0,10);}
function stLbl(s){return s==="spk"?'<span class="badge b-spk">札幌</span>':s==="nha"?'<span class="badge b-nha">那覇</span>':s==="bt"?'<span class="badge b-bt">高松</span>':esc(s);}
function load(){
  var days=+document.getElementById("days").value;
  var since=new Date(Date.now()-days*86400000).toISOString();
  var q=SB+"/rest/v1/staff_url_events?select=ts,store,staff_name,session_id,kind,target,viewed_date,dwell_ms,device&ts=gte."+encodeURIComponent(since)+"&order=ts.desc&limit=100000";
  if(STORE!=="all")q+="&store=eq."+STORE;
  document.getElementById("msg").textContent="読み込み中…";
  fetch(q,{headers:{apikey:ANON,Authorization:"Bearer "+ANON}}).then(function(r){return r.json();}).then(render).catch(function(){document.getElementById("msg").textContent="読み込み失敗";});
}
function render(rows){
  rows=rows||[];
  document.getElementById("msg").textContent=rows.length?"":"データがありません（計測開始直後は空です。数日お待ちください）。";
  var today=jstToday();
  // スタッフ集計
  var byStaff={},btns={},devs={},pvTotal=0,sessSet={};
  rows.forEach(function(e){
    var key=e.store+"|"+(e.staff_name||"(不明)");
    var o=byStaff[key]||(byStaff[key]={store:e.store,name:e.staff_name||"(不明)",days:{},opens:0,last:null,dev:{},maxFut:null,acts:0});
    if(e.kind==="pv"){o.opens++;pvTotal++;o.days[String(e.ts).slice(0,10)]=1;}
    if(e.kind==="click"){o.acts++;btns[e.target||"(不明)"]=(btns[e.target||"(不明)"]||0)+1;}
    if(e.kind==="date_view"&&e.viewed_date){if(!o.maxFut||e.viewed_date>o.maxFut)o.maxFut=e.viewed_date;}
    if(!o.last||e.ts>o.last)o.last=e.ts;
    if(e.device)o.dev[e.device]=1;
    if(e.device)devs[e.device]=(devs[e.device]||0)+1;
    if(e.session_id)sessSet[e.session_id]=1;
  });
  var arr=Object.keys(byStaff).map(function(k){return byStaff[k];});
  arr.sort(function(a,b){return (b.last||"").localeCompare(a.last||"");});
  // カード
  var uniq=arr.length;
  document.getElementById("cards").innerHTML=
    card("開いたスタッフ",uniq+"人")+card("開いた延べ回数",pvTotal+"回")+card("セッション数",Object.keys(sessSet).length)+card("クリック総数",Object.values(btns).reduce(function(a,b){return a+b;},0));
  // スタッフ表
  var tb=document.querySelector("#staffTbl tbody");tb.innerHTML="";
  arr.forEach(function(o){
    var dcnt=Object.keys(o.days).length;
    var dotc=dcnt>=5?"g":dcnt>=2?"a":dcnt>=1?"r":"gray";
    var futTxt='<span class="mut">当日のみ</span>';
    if(o.maxFut){var dd=Math.round((new Date(o.maxFut)-new Date(today))/86400000);futTxt=dd>0?("＋"+dd+"日先まで <span class=mut>("+o.maxFut+")</span>"):"当日";}
    var last=o.last?String(o.last).replace("T"," ").slice(5,16):"-";
    tb.insertAdjacentHTML("beforeend","<tr><td>"+stLbl(o.store)+"</td><td><b>"+esc(o.name)+"</b></td>"+
      "<td><span class='dot "+dotc+"'></span>"+dcnt+"日</td><td>"+o.opens+"回</td><td class=mut>"+last+"</td>"+
      "<td>"+Object.keys(o.dev).map(function(d){return d==="mobile"?"📱":"💻";}).join("")+"</td>"+
      "<td>"+futTxt+"</td><td>"+o.acts+"</td></tr>");
  });
  // ボタン
  var be=Object.keys(btns).map(function(k){return{k:k,n:btns[k]};}).sort(function(a,b){return b.n-a.n;});
  var mx=be.length?be[0].n:1;
  document.getElementById("btns").innerHTML=be.length?be.map(function(x){return "<div style='display:flex;align-items:center;gap:8px;margin:4px 0'><div style='width:180px;font-size:12px'>"+esc(x.k)+"</div><div class=bar style='width:"+Math.max(6,x.n/mx*100)+"%'></div><div style='font-weight:800;font-size:12px'>"+x.n+"</div></div>";}).join(""):"<span class=mut>クリックデータなし</span>";
  // 端末
  var dt=Object.keys(devs).map(function(k){return "<span class=pill>"+(k==="mobile"?"📱 スマホ":"💻 PC")+" <b>"+devs[k]+"</b></span>";}).join("");
  document.getElementById("dev").innerHTML=dt||"<span class=mut>なし</span>";
}
function card(k,v){return "<div class=card><div class=k>"+k+"</div><div class=v>"+v+"</div></div>";}
load();
</script></body></html>
