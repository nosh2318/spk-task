<!doctype html><html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>出勤退勤 打刻キオスク｜HANDYMAN</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:#0b1220;color:#e8eef7;min-height:100vh;display:flex;flex-direction:column;align-items:center}
  .hd{width:100%;max-width:460px;padding:16px 18px 8px;display:flex;align-items:center;justify-content:space-between}
  .hd .t{font-size:16px;font-weight:900;flex:1;text-align:center}
  .hd .top{font-size:12px;font-weight:800;color:#a9c2e0;text-decoration:none;background:#12233d;border:1px solid #24405e;border-radius:8px;padding:5px 10px;white-space:nowrap}
  .hd .s{font-size:12px;color:#8fb0d8;font-weight:700;background:#12233d;border:1px solid #24405e;border-radius:8px;padding:3px 10px}
  .wrap{width:100%;max-width:460px;padding:8px 18px 28px;flex:1}
  .clock{text-align:center;font-size:13px;color:#7f9dc4;margin:2px 0 14px}
  .clock b{font-size:26px;color:#e8eef7;display:block;font-weight:900;letter-spacing:1px}
  /* keypad screen */
  .fields{display:flex;gap:10px;margin-bottom:10px}
  .fld{flex:1;background:#0f1c31;border:2px solid #24405e;border-radius:12px;padding:10px 12px;cursor:pointer}
  .fld.on{border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.18)}
  .fld .lb{font-size:11px;color:#7f9dc4;font-weight:700}
  .fld .vv{font-size:24px;font-weight:900;min-height:30px;letter-spacing:3px}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
  .keys button{padding:18px 0;font-size:24px;font-weight:900;border-radius:14px;border:1px solid #24405e;background:#13233c;color:#e8eef7;cursor:pointer}
  .keys button:active{background:#1d3556}
  .keys .act{background:#0d9488;border-color:#0d9488;color:#fff;font-size:18px}
  .keys .del{background:#1f2b40;color:#f0a5a5;font-size:20px}
  .login{width:100%;margin-top:12px;padding:16px 0;font-size:18px;font-weight:900;border:none;border-radius:14px;background:#2563eb;color:#fff;cursor:pointer}
  .login:disabled{background:#26364f;color:#6f88a8}
  .err{background:#3a1414;border:1px solid #7f1d1d;color:#fca5a5;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;margin-top:12px;text-align:center;display:none}
  /* member screen */
  .hi{text-align:center;margin:6px 0 16px}
  .hi .nm{font-size:26px;font-weight:900}
  .hi .st{font-size:13px;color:#8fb0d8;margin-top:4px}
  .big{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .big button{padding:22px 0;font-size:19px;font-weight:900;border:none;border-radius:16px;cursor:pointer;color:#fff;line-height:1.35}
  .b-in{background:#16a34a}.b-out{background:#dc2626}.b-task{background:#2563eb}.b-pay{background:#7c3aed}
  .big button:disabled{opacity:.45}
  .big button .sub{display:block;font-size:11px;font-weight:700;opacity:.85;margin-top:3px}
  .logout{width:100%;margin-top:6px;padding:13px 0;font-size:14px;font-weight:800;border:1px solid #24405e;border-radius:12px;background:#12233d;color:#a9c2e0;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0d9488;color:#fff;font-weight:800;padding:12px 20px;border-radius:12px;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  .toast.ng{background:#dc2626}
  .taskcard{margin-top:6px;background:#0f2a24;border:1px solid #0d9488;border-radius:14px;padding:14px;text-align:center;display:none}
  .taskcard.show{display:block}
  .taskcard a{display:inline-block;margin-top:8px;background:#0d9488;color:#fff;text-decoration:none;font-weight:900;padding:12px 22px;border-radius:12px;font-size:16px}
  .hint{font-size:11px;color:#5f7ba0;text-align:center;margin-top:16px;line-height:1.7}
</style></head>
<body>
<div class="hd"><a href="company3d.html" class="top">← 本社TOP</a><div class="t">⏰ 出勤退勤 打刻</div><div class="s" id="storeLbl">札幌店</div></div>
<div class="wrap">
  <div class="clock"><b id="clk">--:--</b><span id="cdate"></span></div>
  <!-- keypad -->
  <div id="scLogin">
    <div class="fields">
      <div class="fld on" id="fID" onclick="focusF('id')"><div class="lb">ID番号</div><div class="vv" id="vID"></div></div>
      <div class="fld" id="fPIN" onclick="focusF('pin')"><div class="lb">暗証番号(PIN)</div><div class="vv" id="vPIN"></div></div>
    </div>
    <div class="keys">
      <button onclick="key('1')">1</button><button onclick="key('2')">2</button><button onclick="key('3')">3</button>
      <button onclick="key('4')">4</button><button onclick="key('5')">5</button><button onclick="key('6')">6</button>
      <button onclick="key('7')">7</button><button onclick="key('8')">8</button><button onclick="key('9')">9</button>
      <button class="del" onclick="del()">⌫</button><button onclick="key('0')">0</button><button class="act" onclick="nextF()">次へ</button>
    </div>
    <button class="login" id="loginBtn" onclick="doLogin()" disabled>ログイン</button>
    <div class="err" id="err"></div>
    <div class="hint">ID番号と暗証番号(PIN)は「スタッフ登録」で設定します。<br>出勤時・退勤時に必ずここで打刻してください。</div>
  </div>
  <!-- member -->
  <div id="scMember" style="display:none">
    <div class="hi"><div class="nm" id="mName"></div><div class="st" id="mState">打刻状況を確認中…</div></div>
    <div class="big">
      <button class="b-in" id="btnIn" onclick="punch('in')">🟢 出勤<span class="sub">出勤時に押す</span></button>
      <button class="b-out" id="btnOut" onclick="punch('out')">🔴 退勤<span class="sub">退勤時に押す</span></button>
      <button class="b-task" onclick="openTasks()">📋 本日のタスク<span class="sub">自分の担当を開く</span></button>
      <button class="b-pay" onclick="openPay()">💰 給与明細<span class="sub">本人のみ</span></button>
    </div>
    <div class="taskcard" id="taskCard">
      打刻しました。<b id="taskName"></b> さん、本日のタスクはこちら👇
      <div><a id="taskLink" href="#" target="_blank">📋 本日のタスクを開く</a></div>
    </div>
    <button class="logout" onclick="logout()">← ログアウト（次の人へ）</button>
    <div class="hint">この画面は数十秒操作がないと自動でログアウトします。</div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const MAIN_URL='https://ckrxttbnawkclshczsia.supabase.co',MAIN_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
const STORE=(new URLSearchParams(location.search).get('store')||'spk').toLowerCase();
const STORE_LBL={spk:'札幌店',nha:'那覇店'}[STORE]||'札幌店';
const PUNCH_OK={spk:true,nha:false}[STORE]||false; // 打刻RPCがある店(現状SPKのみ)
document.getElementById('storeLbl').textContent=STORE_LBL;
let cur='id', idVal='', pinVal='', session=null, idleTimer=null;
function rpc(fn,body){return fetch(MAIN_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:MAIN_ANON,'Authorization':'Bearer '+MAIN_ANON,'Content-Type':'application/json'},body:JSON.stringify(body||{})}).then(r=>r.json());}
function tick(){const d=new Date();const p=n=>String(n).padStart(2,'0');document.getElementById('clk').textContent=p(d.getHours())+':'+p(d.getMinutes());document.getElementById('cdate').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日('+['日','月','火','水','木','金','土'][d.getDay()]+')';}
tick();setInterval(tick,1000);
function focusF(f){cur=f;document.getElementById('fID').classList.toggle('on',f==='id');document.getElementById('fPIN').classList.toggle('on',f==='pin');}
function render(){document.getElementById('vID').textContent=idVal;document.getElementById('vPIN').textContent='•'.repeat(pinVal.length);document.getElementById('loginBtn').disabled=!(idVal.length>0&&pinVal.length>0);}
function key(n){if(cur==='id'){if(idVal.length<8)idVal+=n;}else{if(pinVal.length<8)pinVal+=n;}render();hideErr();}
function del(){if(cur==='id')idVal=idVal.slice(0,-1);else pinVal=pinVal.slice(0,-1);render();}
function nextF(){if(cur==='id'&&idVal.length>0)focusF('pin');else if(cur==='pin'&&idVal.length>0&&pinVal.length>0)doLogin();}
function hideErr(){document.getElementById('err').style.display='none';}
function showErr(m){const e=document.getElementById('err');e.textContent=m;e.style.display='block';}
function toast(m,ng){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(ng?' ng':'');clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',2200);}
async function doLogin(){
  document.getElementById('loginBtn').disabled=true;hideErr();
  try{
    const r=await rpc('staff_kiosk_auth',{p_store:STORE,p_code:idVal,p_pin:pinVal});
    if(!r||!r.ok){showErr(r&&r.error==='invalid'?'ID番号または暗証番号が違います':'認証に失敗しました');document.getElementById('loginBtn').disabled=false;return;}
    session=r; showMember();
  }catch(e){showErr('通信エラー。もう一度お試しください');document.getElementById('loginBtn').disabled=false;}
}
function showMember(){
  document.getElementById('scLogin').style.display='none';
  document.getElementById('scMember').style.display='block';
  document.getElementById('mName').textContent=session.name+' さん';
  document.getElementById('taskCard').classList.remove('show');
  // 打刻ボタンの可否（打刻RPCが無い店は無効化）
  document.getElementById('btnIn').disabled=!PUNCH_OK;
  document.getElementById('btnOut').disabled=!PUNCH_OK;
  document.getElementById('mState').textContent=PUNCH_OK?'出勤 or 退勤を押してください':'打刻は準備中の店舗です（タスク/明細は利用可）';
  if(PUNCH_OK)loadState();
  resetIdle();
}
async function loadState(){
  try{const t=await rpc('spk_staff_timecard',{p_token:session.token});
    if(t&&t.ok){const inT=t.start||t.start_time, outT=t.end||t.end_time;
      let s='本日 未打刻'; if(inT&&outT)s='本日 出勤 '+inT+' / 退勤 '+outT; else if(inT)s='本日 出勤 '+inT+'（退勤まだ）';
      document.getElementById('mState').textContent=s;}
  }catch(e){}
}
async function punch(action){
  resetIdle();
  if(!PUNCH_OK){toast('この店舗の打刻は準備中です',true);return;}
  try{
    const r=await rpc('spk_staff_punch',{p_token:session.token,p_action:action});
    if(!r||!r.ok){toast((r&&r.msg)||'打刻できませんでした',true);return;}
    toast(action==='in'?'🟢 出勤を記録しました':'🔴 退勤を記録しました');
    if(action==='in'){ // 出勤したら当日タスクURLを渡す
      document.getElementById('taskName').textContent=session.name;
      document.getElementById('taskLink').href='staff.html?t='+session.token+'&_='+Date.now();
      document.getElementById('taskCard').classList.add('show');
    }
    loadState();
  }catch(e){toast('通信エラー',true);}
}
function openTasks(){resetIdle();window.open('staff.html?t='+session.token+'&_='+Date.now(),'_blank');}
function openPay(){resetIdle();toast('給与明細は準備中です');}
function logout(){session=null;idVal='';pinVal='';cur='id';render();focusF('id');
  document.getElementById('scMember').style.display='none';
  document.getElementById('scLogin').style.display='block';
  if(idleTimer)clearTimeout(idleTimer);}
function resetIdle(){if(idleTimer)clearTimeout(idleTimer);idleTimer=setTimeout(logout,45000);}
render();
</script>
</body></html>
