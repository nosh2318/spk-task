<!DOCTYPE html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>月次会計レポート｜BUDDICA/HDM 高松</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:#0b1222;color:#e8eefb;font-size:13px}
  header{position:sticky;top:0;z-index:10;background:#111a2e;border-bottom:1px solid #24304a;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  h1{font-size:16px;margin:0;font-weight:900}
  .sub{font-size:11px;color:#8fa2c4}
  .sp{flex:1}
  input[type=month]{background:#0b1222;border:1px solid #33436b;color:#e8eefb;border-radius:8px;padding:6px 10px;font-size:14px}
  .bf{display:flex;gap:4px}
  .bf button{background:#1b2740;border:1px solid #33436b;color:#cdd9f2;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .bf button.on{background:#2563eb;border-color:#2563eb;color:#fff}
  .btn{background:#0e9f50;border:none;color:#fff;border-radius:8px;padding:7px 13px;font-weight:800;cursor:pointer;font-size:12px}
  .btn.g{background:#334155}
  main{padding:16px;max-width:1400px;margin:0 auto}
  .rep{margin-bottom:34px}
  .rh{display:flex;align-items:baseline;gap:12px;border-left:5px solid;padding-left:10px;margin-bottom:10px}
  .rep.current .rh{border-color:#22c55e}.rep.future .rh{border-color:#f59e0b}.rep.past .rh{border-color:#64748b}
  .rh h2{font-size:18px;margin:0;font-weight:900}
  .rh .def{font-size:11px;color:#93a4bf}
  .rh .tot{margin-left:auto;font-size:20px;font-weight:900}
  .rep.current .tot{color:#4ade80}.rep.future .tot{color:#fbbf24}.rep.past .tot{color:#cbd5e1}
  /* 返却月別サマリー */
  .mbar{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 24px;align-items:stretch}
  .mbar .m{border-radius:12px;padding:10px 14px;min-width:120px;border:2px solid;background:#111a2e}
  .mbar .m.past{border-color:#64748b}.mbar .m.current{border-color:#22c55e;background:#0f2417}.mbar .m.future{border-color:#f59e0b}
  .mbar .m .tag{font-size:10px;font-weight:800;padding:0 6px;border-radius:5px;display:inline-block}
  .mbar .m.past .tag{background:#334155;color:#cbd5e1}.mbar .m.current .tag{background:#16a34a;color:#fff}.mbar .m.future .tag{background:#d97706;color:#fff}
  .mbar .m .mm{font-size:13px;font-weight:800;margin:4px 0 2px}
  .mbar .m .mv{font-size:17px;font-weight:900}
  .mbar .m .mc{font-size:10px;color:#8fa2c4}
  .mbar .arrowM{align-self:center;color:#3b5bdb;font-weight:900;font-size:18px}
  h3.mh{font-size:13px;color:#a9b8d6;margin:18px 0 8px;font-weight:800}
  .subm{font-size:12px;color:#8fa2c4;margin:14px 0 4px;font-weight:800;border-left:3px solid #33436b;padding-left:7px}
  .chsum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .chsum .c{background:#141d33;border:1px solid #26324e;border-radius:10px;padding:8px 12px;min-width:150px}
  .chsum .c .n{font-size:11px;color:#a9b8d6;font-weight:700}
  .chsum .c .v{font-size:17px;font-weight:900;margin-top:2px}
  .chsum .c .cnt{font-size:10px;color:#7f90b0}
  table{width:100%;border-collapse:collapse;background:#0e1626;border-radius:8px;overflow:hidden;margin-bottom:8px}
  th,td{padding:6px 8px;text-align:left;border-bottom:1px solid #1c2740;white-space:nowrap;font-size:12px}
  th{background:#182339;color:#a9b8d6;font-size:11px;position:sticky;top:0}
  td.num,th.num{text-align:right}
  tr.grp td{background:#172136;font-weight:900;color:#cfe0ff;border-top:2px solid #2a3a5c}
  .bd{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10.5px;font-weight:800}
  .bd.HDM{background:#1e3a8a;color:#dbeafe}.bd.BUDDICA{background:#047857;color:#d1fae5}
  .sb{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10.5px;font-weight:800}
  .sb.nha{background:#7c2d12;color:#fed7aa}.sb.spk{background:#0c4a6e;color:#bae6fd}.sb.bt{background:#4c1d95;color:#e9d5ff}
  .ch{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:700;background:#243149;color:#cdd9f2}
  .empty{color:#7f90b0;padding:14px}
  .note{font-size:11px;color:#8fa2c4;margin:6px 0 0}
  @media print{
    body{background:#fff;color:#111;font-size:11px}
    header{position:static;background:#fff;border-color:#ccc;color:#111}
    header .noprint,.btn,.bf,input{display:none!important}
    main{max-width:none}
    .rep.current .rh{border-color:#16a34a}.rep.future .rh{border-color:#d97706}.rep.past .rh{border-color:#64748b}
    .mbar .m{background:#fff!important}.mbar .m .mv,.mbar .m .mm{color:#111}
    .rh h2,.rh .def,.rh .tot{color:#111!important}
    table{background:#fff}th{background:#eef2f8;color:#333}td,th{border-color:#ccc}
    tr.grp td{background:#e8eef7;color:#111}
    .chsum .c{background:#f4f7fb;border-color:#ccc}.chsum .c .v,.chsum .c .n{color:#111}
    .bd.HDM{background:#dbeafe;color:#1e3a8a}.bd.BUDDICA{background:#d1fae5;color:#065f46}
    .ch{background:#eef2f8;color:#333}
  }
</style></head>
<body>
<header>
  <div><h1>📊 月次会計レポート（全店）</h1><div class="sub">那覇・札幌・高松（HDM＋BUDDICA）　｜　売上計上＝当月内返却実績・取扱高＝翌月以降返却（未来ストック）</div></div>
  <div class="sp"></div>
  <input type="month" id="ym">
  <div class="bf" id="bf">
    <button data-b="all" class="on">🏢 全店</button>
    <button data-b="nha">🌺 那覇</button>
    <button data-b="spk">❄️ 札幌</button>
    <button data-b="bt">🍜 高松</button>
  </div>
  <button class="btn g noprint" onclick="dlCSV()">⬇ CSV</button>
  <button class="btn noprint" onclick="window.print()">🖨 PDF（印刷）</button>
</header>
<main id="app"><div class="empty">読み込み中…</div></main>
<script>
const BT_URL='https://ggqugvyskyiblxiycpci.supabase.co',BT_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18';
const MAIN_URL='https://ckrxttbnawkclshczsia.supabase.co',MAIN_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
const STORES={nha:'🌺 那覇',spk:'❄️ 札幌',bt:'🍜 高松'};
let ROWS=[], STORE='all';
const yen=n=>'¥'+Math.round(+n||0).toLocaleString();
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function ymNow(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
async function rpc(url,anon,fn,ym){
  try{const r=await fetch(url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:anon,Authorization:'Bearer '+anon,'Content-Type':'application/json'},body:JSON.stringify({p_ym:ym})});const j=await r.json();return Array.isArray(j)?j:[];}catch(e){return [];}
}
async function load(){
  const ym=document.getElementById('ym').value||ymNow();
  document.getElementById('app').innerHTML='<div class="empty">全店 読み込み中…</div>';
  const [main,bt]=await Promise.all([
    rpc(MAIN_URL,MAIN_ANON,'hq_monthly_rows',ym),   // 那覇+札幌(HDM)
    rpc(BT_URL,BT_ANON,'bt_hq_monthly_rows',ym)      // 高松(HDM+BUDDICA)
  ]);
  ROWS=main.concat(bt);
  render();
}
function fil(){ return ROWS.filter(x=>STORE==='all'||x.store===STORE); }
function storeBadge(s){return '<span class="sb '+esc(s)+'">'+({nha:'那覇',spk:'札幌',bt:'高松'}[s]||s)+'</span>';}
const mkey=x=>(x.ret||'').slice(0,7);
const kn=rows=>rows.reduce((s,x)=>s+(+x.cnt||1),0);
function chanTable(rows){
  const byCh={}; rows.forEach(x=>{const k=x.channel||'(不明)';(byCh[k]=byCh[k]||{c:0,s:0,rows:[]});byCh[k].c+=(+x.cnt||1);byCh[k].s+=(+x.price||0);byCh[k].rows.push(x);});
  const ord=Object.keys(byCh).sort((a,b)=>byCh[b].s-byCh[a].s);
  let t='<table><thead><tr><th>店舗</th><th>予約者名</th><th>予約日</th><th>貸出日</th><th>返却日</th><th>車種</th><th>配車</th><th>補償</th><th class="num">料金</th><th>流入先</th><th>ブランド</th></tr></thead><tbody>';
  if(!rows.length)t+='<tr><td colspan="11" class="empty">該当なし</td></tr>';
  ord.forEach(k=>{
    t+='<tr class="grp"><td colspan="8">🔻 '+esc(k)+'</td><td class="num">'+yen(byCh[k].s)+'</td><td colspan="2">'+byCh[k].c+'件</td></tr>';
    byCh[k].rows.sort((a,b)=>(a.ret||'').localeCompare(b.ret||'')).forEach(x=>{
      t+='<tr><td>'+storeBadge(x.store)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.booked)+'</td><td>'+esc(x.lend)+'</td><td>'+esc(x.ret)+'</td><td>'+esc(x.vehicle)+'</td><td>'+esc(x.assigned||'-')+'</td><td>'+esc(x.insurance||'-')+'</td><td class="num">'+yen(x.price)+'</td><td><span class="ch">'+esc(x.channel)+'</span></td><td><span class="bd '+esc(x.brand)+'">'+esc(x.brand)+'</span></td></tr>';
    });
  });
  return t+'</tbody></table>';
}
// 過去は明細でなく「返却月×流入先」の集計表（大量データ対策）
function monthChanSummary(rows){
  const byM={}; rows.forEach(x=>{const m=mkey(x);if(!m)return;(byM[m]=byM[m]||{});const k=x.channel||'(不明)';(byM[m][k]=byM[m][k]||{c:0,s:0});byM[m][k].c+=(+x.cnt||1);byM[m][k].s+=(+x.price||0);});
  const ms=Object.keys(byM).sort().reverse(); if(!ms.length)return '<div class="empty">該当なし</div>';
  let t='<table><thead><tr><th>返却月</th><th>流入先</th><th class="num">件数</th><th class="num">売上</th></tr></thead><tbody>';
  ms.forEach(m=>{
    const chs=Object.keys(byM[m]).sort((a,b)=>byM[m][b].s-byM[m][a].s);
    const mt=chs.reduce((s,k)=>s+byM[m][k].s,0), mc=chs.reduce((s,k)=>s+byM[m][k].c,0);
    t+='<tr class="grp"><td colspan="2">📅 '+esc(m)+'</td><td class="num">'+mc+'件</td><td class="num">'+yen(mt)+'</td></tr>';
    chs.forEach(k=>{t+='<tr><td></td><td><span class="ch">'+esc(k)+'</span></td><td class="num">'+byCh0(byM[m][k].c)+'</td><td class="num">'+yen(byM[m][k].s)+'</td></tr>';});
  });
  return t+'</tbody></table>';
}
function byCh0(n){return n+'件';}
function chSummary(rows){
  const byCh={}; rows.forEach(x=>{const k=x.channel||'(不明)';(byCh[k]=byCh[k]||{c:0,s:0});byCh[k].c+=(+x.cnt||1);byCh[k].s+=(+x.price||0);});
  const ord=Object.keys(byCh).sort((a,b)=>byCh[b].s-byCh[a].s);const tot=rows.reduce((s,x)=>s+(+x.price||0),0);
  let h='<div class="chsum">';
  ord.forEach(k=>h+='<div class="c"><div class="n">'+esc(k)+'</div><div class="v">'+yen(byCh[k].s)+'</div><div class="cnt">'+byCh[k].c+'件</div></div>');
  return h+'<div class="c" style="border-color:#3b5bdb"><div class="n">合計</div><div class="v">'+yen(tot)+'</div><div class="cnt">'+kn(rows)+'件</div></div></div>';
}
function block(bucket,title,def,mode){
  const rows=fil().filter(x=>x.bucket===bucket);
  const tot=rows.reduce((s,x)=>s+(+x.price||0),0);
  let body;
  if(mode==='monthSummary'){          // 過去＝返却月×流入先の集計のみ（明細なし＝大量データ対策）
    body=chSummary(rows)+monthChanSummary(rows);
  }else if(mode==='monthDetail'){     // 未来＝合算(チャンネル別)＋月別に明細
    let ms=[...new Set(rows.map(mkey))].filter(Boolean).sort();
    const detail = ms.length ? ms.map(m=>{const mr=rows.filter(x=>mkey(x)===m);const mt=mr.reduce((s,x)=>s+(+x.price||0),0);
      return '<div class="subm">📅 '+esc(m)+'　'+yen(mt)+'　/　'+kn(mr)+'件</div>'+chanTable(mr);}).join('') : '<div class="empty">該当なし</div>';
    body = '<div class="subm">🧮 合算（チャンネル別・全未来月）</div>'+chSummary(rows)+'<div class="subm">📋 月別内訳</div>'+detail;
  }else{ body=chSummary(rows)+chanTable(rows); }   // 当月＝明細
  return '<div class="rep '+bucket+'"><div class="rh"><h2>'+title+'</h2><div class="def">'+def+'</div><div class="tot">'+yen(tot)+' <span style="font-size:12px;color:#8fa2c4">/ '+kn(rows)+'件</span></div></div>'+body+'</div>';
}
function monthSummary(){
  const rows=fil();const byM={};
  rows.forEach(x=>{const m=mkey(x);if(!m)return;(byM[m]=byM[m]||{c:0,s:0,b:x.bucket});byM[m].c+=(+x.cnt||1);byM[m].s+=(+x.price||0);});
  const ms=Object.keys(byM).sort(); if(!ms.length)return '';
  const tag={past:'過去 計上済',current:'当月 売上',future:'未来 取扱高'};
  let h='<h3 class="mh">📅 返却月別サマリー（過去＝計上済／当月＝売上／未来＝取扱高ストック）</h3><div class="mbar">';
  ms.forEach(m=>{const o=byM[m];h+='<div class="m '+o.b+'"><span class="tag">'+tag[o.b]+'</span><div class="mm">'+esc(m)+'</div><div class="mv">'+yen(o.s)+'</div><div class="mc">'+o.c+'件</div></div>';});
  return h+'</div>';
}
function topSummary(){
  const rows=fil();
  const g=b=>{const r=rows.filter(x=>x.bucket===b);return {s:r.reduce((a,x)=>a+(+x.price||0),0),c:kn(r)};};
  const p=g('past'),c=g('current'),f=g('future');
  return '<h3 class="mh">🧮 合算（過去・当月・未来）</h3><div class="mbar">'
    +'<div class="m past" style="min-width:180px"><span class="tag">過去 計上済</span><div class="mm">当年 過去合計</div><div class="mv">'+yen(p.s)+'</div><div class="mc">'+p.c+'件</div></div>'
    +'<div class="m current" style="min-width:180px"><span class="tag">当月 売上</span><div class="mm">当月売上</div><div class="mv">'+yen(c.s)+'</div><div class="mc">'+c.c+'件</div></div>'
    +'<div class="m future" style="min-width:180px"><span class="tag">未来 取扱高</span><div class="mm">取扱高 合計</div><div class="mv">'+yen(f.s)+'</div><div class="mc">'+f.c+'件</div></div>'
    +'<div class="m" style="min-width:180px;border-color:#3b5bdb"><span class="tag" style="background:#3b5bdb;color:#fff">当年累計</span><div class="mm">過去＋当月</div><div class="mv">'+yen(p.s+c.s)+'</div><div class="mc">'+(p.c+c.c)+'件</div></div>'
    +'</div>';
}
function render(){
  const ym=document.getElementById('ym').value||ymNow();
  const rows=fil();
  const sum=b=>rows.filter(x=>x.bucket===b).reduce((s,x)=>s+(+x.price||0),0);
  const cur=sum('current'),past=sum('past');
  document.getElementById('app').innerHTML=
    '<div class="note">対象月：<b>'+ym+'</b>　｜　売上定義＝日報と同一（キャンセル・テスト・オーナー予約は除外／料金＝base+option−discountのグロス）。<b>当年累計＝過去(計上済)＋当月＝'+yen(past+cur)+'</b>（別途 予約外売上あり）。実入金は入金フロー資料参照。</div>'+
    topSummary()+
    monthSummary()+
    block('current','📊 当月売上（当月内返却）','＝ '+ym+' 内に返却された予約実績を売上計上','detail')+
    block('future','📦 取扱高（未来ストック・翌月以降返却）','＝ 当月＋過去を除く未来の予約（未出発/未返却）','monthDetail')+
    block('past','📁 過去（計上済・当年の当月より前）','＝ 当月より前に返却済み（既に売上計上・集計のみ）','monthSummary');
}
document.getElementById('ym').value=ymNow();
document.getElementById('ym').addEventListener('change',load);
document.getElementById('bf').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;STORE=b.dataset.b;[...document.querySelectorAll('#bf button')].forEach(x=>x.classList.toggle('on',x===b));render();});
function dlCSV(){
  const rows=fil();const head=['区分','店舗','ブランド','流入先','予約者名','予約日','貸出日','返却日','車種','配車','補償','料金'];
  const bmap={current:'当月売上',future:'取扱高(未来)',past:'過去(計上済)'};
  const smap={nha:'那覇',spk:'札幌',bt:'高松'};
  const lines=[head.join(',')].concat(rows.map(x=>[bmap[x.bucket]||x.bucket,smap[x.store]||x.store,x.brand,x.channel,x.name,x.booked,x.lend,x.ret,x.vehicle,x.assigned,x.insurance,x.price].map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')));
  const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='月次会計_全店_'+(STORE==='all'?'全店':(smap[STORE]||STORE))+'_'+(document.getElementById('ym').value||ymNow())+'.csv';a.click();
}
load();
</script>
</body></html>
