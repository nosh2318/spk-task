<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>🅿️ 駐車場マップ（モック）｜札幌</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#1e293b;color:#e2e8f0}
  .wrap{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:90px}
  .hd{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:11px 15px 9px;box-shadow:0 3px 14px rgba(0,0,0,.35)}
  .hd h1{margin:0;font-size:16px;font-weight:900}
  .hd .note{font-size:10px;opacity:.85;margin-top:2px}
  .sum{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .sum .chip{background:rgba(255,255,255,.16);border-radius:8px;padding:3px 9px;font-size:10.5px;font-weight:800}
  .sum .chip b{font-size:13px}

  /* ===== 上から見た駐車場マップ ===== */
  .lot-map{margin:12px;border-radius:16px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.4);position:relative}
  .area{position:relative;padding:10px 12px 14px;background:
      repeating-linear-gradient(90deg,transparent,transparent 46px,rgba(255,255,255,.04) 46px,rgba(255,255,255,.04) 48px),
      linear-gradient(180deg,#4b5563,#3f4753)}
  .area .atitle{font-size:12px;font-weight:900;color:#fff;display:flex;align-items:center;gap:6px;margin-bottom:9px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .area .atitle .cap{margin-left:auto;font-size:10px;font-weight:800;color:#cbd5e1;background:rgba(0,0,0,.25);border-radius:6px;padding:2px 8px}
  /* 立体=建物っぽく */
  .area.tower{background:linear-gradient(180deg,#475569,#334155);border-bottom:3px solid #1e293b}
  .area.tower::before{content:"🏢 立体駐車場（機械式）";position:absolute;top:0;left:0;right:0;font-size:0}
  /* コインP=フェンス枠 */
  .area.coin{border-top:2px dashed rgba(255,255,255,.15)}

  .bays{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  @media(max-width:520px){.bays{grid-template-columns:repeat(3,1fr)}}
  /* 駐車マス（白線） */
  .bay{position:relative;height:88px;border-radius:6px;border:2px solid rgba(255,255,255,.55);border-top:none;background:rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,background .25s;overflow:visible}
  .bay .bno{position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;color:#fff;background:rgba(0,0,0,.5);border-radius:0 0 5px 5px;padding:1px 7px;z-index:3}
  .bay.free{background:rgba(16,185,129,.10)}
  .bay .freetag{font-size:10px;font-weight:800;color:#6ee7b7}
  .bay:active{transform:scale(.96)}
  .bay.pop{animation:bpop .5s cubic-bezier(.2,1.5,.4,1)}
  /* 誘導 */
  body.guiding .bay.occ{opacity:.3}
  body.guiding .bay.free{animation:bayglow 1s ease-in-out infinite}
  body.guiding .bay.reco{animation:recoGlow .8s ease-in-out infinite;border-color:#fbbf24}
  .bay .crown{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;color:#78350f;background:#fbbf24;border-radius:6px;padding:1px 6px;white-space:nowrap;z-index:4;box-shadow:0 2px 6px rgba(0,0,0,.3)}

  /* コインPのマス（横並び複数台） */
  .coinbays{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  @media(max-width:520px){.coinbays{grid-template-columns:repeat(3,1fr);gap:6px}}
  .cbay{position:relative;width:100%;min-height:118px;border-radius:8px;border:2px dashed rgba(255,255,255,.5);border-top:none;background:rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:17px 2px 6px;cursor:pointer;transition:transform .15s}
  .cbay.free{justify-content:center}
  .cbay .bno{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;color:#fff;background:rgba(0,0,0,.62);border-radius:0 0 7px 7px;padding:1px 10px;z-index:3;letter-spacing:.5px}
  .cbay .cname{font-size:9.5px;font-weight:800;color:#f8fafc;text-align:center;line-height:1.12;margin-top:4px;text-shadow:0 1px 2px rgba(0,0,0,.6);max-width:100%;word-break:break-all}
  .cbay:active{transform:scale(.95)}
  .cbay.free{background:rgba(16,185,129,.10)}
  .cbay .freetag{font-size:9px;font-weight:800;color:#6ee7b7}
  .cbay .cn{margin-top:3px;font-size:9px;font-weight:900;color:#fff;background:#0ea5e9;border-radius:5px;padding:1px 7px}
  .cbay .crown{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;color:#78350f;background:#fbbf24;border-radius:6px;padding:1px 6px;white-space:nowrap;z-index:4;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  body.guiding .cbay.occ{opacity:.3}
  body.guiding .cbay.free{animation:bayglow 1s ease-in-out infinite}
  body.guiding .cbay.reco{animation:recoGlow .8s ease-in-out infinite;border-color:#fbbf24}
  .cbay.pop{animation:bpop .5s cubic-bezier(.2,1.5,.4,1)}
  .area .atitle .paidtag{font-size:9px;font-weight:800;color:#fecaca;background:rgba(127,29,29,.6);border-radius:5px;padding:1px 6px;margin-left:6px}

  /* 通路 */
  .lane{height:26px;background:repeating-linear-gradient(90deg,#374151,#374151 18px,#fbbf24 18px,#fbbf24 30px);opacity:.9;position:relative}
  .lane .gate{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:900;color:#fff;background:#0f766e;border-radius:6px;padding:2px 8px}

  /* 上から見た車 */
  .carwrap{width:36px;height:60px;position:relative;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));animation:parkin .5s ease both}
  .carwrap .lbl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:8px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);text-align:center;line-height:1;z-index:2;width:34px}
  .car-svg{display:block}

  /* pools（下部リスト） */
  section{margin:12px}
  .stitle{font-size:12.5px;font-weight:900;color:#e2e8f0;display:flex;align-items:center;gap:6px;margin:0 2px 8px}
  .stitle .sub{font-size:9.5px;font-weight:700;color:#94a3b8;margin-left:auto}
  .pool{display:flex;flex-wrap:wrap;gap:7px}
  .pcar{border-radius:9px;padding:7px 10px;font-size:11px;font-weight:800;cursor:pointer;border:1.5px solid #475569;background:#334155;color:#e2e8f0;display:flex;align-items:center;gap:6px;transition:transform .12s}
  .pcar:active{transform:scale(.95)}
  .pcar.out{opacity:.5;cursor:default;border-style:dashed}
  .pcar .dot{width:9px;height:9px;border-radius:50%}
  .pcar.ret{border-color:#fbbf24;background:#422006}
  .hint{font-size:10px;color:#94a3b8;margin:2px 2px 6px;line-height:1.4}

  /* 入庫FAB */
  .fab{position:fixed;right:calc(50% - 380px + 14px);bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;background:linear-gradient(135deg,#0d9488,#14b8a6);color:#fff;border:none;border-radius:30px;padding:13px 22px;font-size:15px;font-weight:900;box-shadow:0 6px 20px rgba(13,148,136,.55);cursor:pointer;display:flex;align-items:center;gap:7px;animation:bob 2.4s ease-in-out infinite}
  @media(max-width:762px){.fab{right:14px}}
  .fab:active{transform:scale(.94)}
  /* 誘導バナー */
  .guidebar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:linear-gradient(135deg,#b45309,#f59e0b);color:#fff;padding:11px 15px calc(13px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.4);transform:translateY(120%);transition:transform .35s cubic-bezier(.2,1.2,.3,1);max-width:760px;margin:0 auto}
  .guidebar.on{transform:translateY(0)}
  .guidebar .g1{font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px}
  .guidebar .g1 .carico{font-size:18px;animation:drive 1s ease-in-out infinite}
  .guidebar .g2{font-size:10.5px;opacity:.92;margin-top:2px}
  .guidebar .gcancel{position:absolute;top:9px;right:12px;background:rgba(255,255,255,.22);border:none;color:#fff;border-radius:8px;padding:5px 11px;font-size:12px;font-weight:800;cursor:pointer}

  /* 走って入る車 */
  .flycar{position:fixed;z-index:80;pointer-events:none;transition:transform .8s cubic-bezier(.4,.7,.3,1);will-change:transform}
  .particle{position:fixed;z-index:85;font-size:17px;pointer-events:none;animation:pburst .8s ease-out forwards}
  /* modal / toast */
  .scrim{position:fixed;inset:0;background:rgba(2,6,23,.6);display:flex;align-items:flex-end;justify-content:center;z-index:70;animation:fadeIn .2s ease}
  .sheet{background:#1e293b;color:#e2e8f0;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto;animation:sheetUp .3s cubic-bezier(.2,1.1,.3,1);border-top:1px solid #334155}
  .sheet h3{margin:0 0 4px;font-size:15px;font-weight:900}
  .sheet .sd{font-size:11px;color:#94a3b8;margin-bottom:12px}
  .opt{width:100%;text-align:left;border:1.5px solid #334155;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:11px 12px;font-size:13px;font-weight:800;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:9px}
  .opt:active{background:#334155}
  .opt .dot{width:11px;height:11px;border-radius:50%}
  .btnrow{display:flex;gap:8px;margin-top:6px}
  .btn{flex:1;border:none;border-radius:12px;padding:12px;font-size:13px;font-weight:800;cursor:pointer}
  .btn.g{background:#334155;color:#cbd5e1}.btn.r{background:#7f1d1d;color:#fecaca}
  .toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-16px);z-index:90;background:#f8fafc;color:#0f172a;padding:9px 18px;border-radius:30px;font-size:13px;font-weight:900;opacity:0;transition:.3s;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @keyframes parkin{from{opacity:0;transform:translateY(-14px) scale(.85)}to{opacity:1;transform:none}}
  @keyframes bpop{0%{transform:scale(.7)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
  @keyframes bayglow{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,0);background:rgba(16,185,129,.1)}50%{box-shadow:0 0 0 5px rgba(16,185,129,.35);background:rgba(16,185,129,.25)}}
  @keyframes recoGlow{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.3)}50%{box-shadow:0 0 0 7px rgba(251,191,36,.5);background:rgba(251,191,36,.2)}}
  @keyframes drive{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes pburst{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(var(--rot))}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1>🅿️ 駐車場マップ（モック）</h1>
    <div class="note">※上から見たヤードの見取り図。右下「🚗入庫」→車を選ぶ→👑おすすめのマスが光る→タップで車が走って入庫。出庫はマスの車をタップ。保存されません。</div>
    <div class="sum" id="sum"></div>
  </div>

  <div class="lot-map" id="lotMap"></div>

  <section>
    <div class="stitle">🕒 本日返却予定 <span class="sub">予約から事前判明・到着で誘導</span></div>
    <div class="pool" id="returns"></div>
  </section>
  <section>
    <div class="stitle">⚠️ 要駐車（戻ってきた車）</div>
    <div class="pool" id="need"></div>
  </section>
  <section>
    <div class="stitle">🚙 貸出中（予約から自動・操作不要）</div>
    <div class="pool" id="out"></div>
  </section>
</div>

<button class="fab" id="fab" onclick="startGuide()">🚗 入庫</button>
<div class="guidebar" id="guidebar">
  <button class="gcancel" onclick="cancelGuide()">やめる</button>
  <div class="g1"><span class="carico">🚗</span><span id="gName"></span> を入れます</div>
  <div class="g2">👑おすすめ（光っているマス）をタップ→車が走って入ります</div>
</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
const CLS={A:"#7c3aed",A2:"#9333ea",B:"#0284c7",B2:"#0369a1",C:"#059669",S:"#d97706",F:"#db2777",H:"#64748b",G:"#0891b2"};
const CARS=[
  {id:"アルファード-3411",n:"アルファ",p:"3411",c:"A"},{id:"ヴェルファイア-9047",n:"ヴェル",p:"9047",c:"A"},
  {id:"ノア-3382",n:"ノア",p:"3382",c:"B"},{id:"デリカD5-1446",n:"デリカ",p:"1446",c:"B"},
  {id:"ロッキー-299",n:"ロッキー",p:"299",c:"C"},{id:"CX-3-4576",n:"CX-3",p:"4576",c:"C"},
  {id:"CX-5-8065",n:"CX-5",p:"8065",c:"S"},{id:"ハリアー-5512",n:"ハリアー",p:"5512",c:"S"},
  {id:"ソリオ-8529",n:"ソリオ",p:"8529",c:"F"},{id:"デミオ-1111",n:"デミオ",p:"1111",c:"G"},
  {id:"スタッフ車両-①",n:"ｽﾀｯﾌ①",p:"",c:"H"},{id:"スタッフ車両-②",n:"ｽﾀｯﾌ②",p:"",c:"H"},
];
const car=id=>CARS.find(c=>c.id===id)||{id,n:id,p:"",c:"H"};
// ★実レイアウト: 3エリア。mode= numbered(マス番号固定) / plain(番号なし) / manual(駐車時にNo手入力)
// bay= {no:固定マス番号(numberedのみ), car: null|{id, cn(手入力No)}}
let AREAS=[
  {name:"BIGスロット駐車場", ico:"🅿️", mode:"numbered", bays:[
    {no:"172",car:{id:"デリカD5-1446"}},{no:"174",car:{id:"CX-5-8065"}},{no:"200",car:null},{no:"221",car:null},
    {no:"234",car:{id:"スタッフ車両-①"}},{no:"260",car:{id:"ノア-3382"}},{no:"282",car:null}]},
  {name:"BIGスロット 有料枠", ico:"💰", mode:"plain", paid:true, bays:[
    {car:null},{car:{id:"スタッフ車両-②"}},{car:null},{car:null},{car:null}]},
  {name:"トラストパーク 北6西15", ico:"🅿️", mode:"manual", paid:true, bays:[
    {car:{id:"ロッキー-299",cn:"5"}},{car:null},{car:{id:"CX-3-4576",cn:"3"}},{car:null},{car:null}]},
  {name:"タイムズ 北13西16", ico:"🅿️", mode:"manual", paid:true, bays:[
    {car:{id:"ヴェルファイア-9047",cn:"12"}},{car:null},{car:null},{car:null},{car:null}]},
];
const OUT=["ハリアー-5512","ソリオ-8529"];
let RETURNS=[{id:"ハリアー-5512",time:"14:30"},{id:"ソリオ-8529",time:"16:00"}];
function placedIds(){const s=new Set();AREAS.forEach(a=>a.bays.forEach(b=>b.car&&s.add(b.car.id)));return s;}
function needCars(){const p=placedIds();return CARS.filter(c=>!p.has(c.id)&&!OUT.includes(c.id));}
// おすすめ: 同クラスがいるエリアの空き→無ければ最初の空き
function recoTarget(carId){const c=car(carId);
  for(let ai=0;ai<AREAS.length;ai++){if(AREAS[ai].bays.some(b=>b.car&&car(b.car.id).c===c.c)){const bi=AREAS[ai].bays.findIndex(b=>!b.car);if(bi>=0)return{a:ai,b:bi};}}
  for(let ai=0;ai<AREAS.length;ai++){const bi=AREAS[ai].bays.findIndex(b=>!b.car);if(bi>=0)return{a:ai,b:bi};}
  return null;}
// 上から見た車のSVG（精密：屋根・フロント/リアガラス・ミラー・タイヤ・ライト・影）
function carSVG(cls){const col=CLS[cls]||"#64748b";return `<svg class="car-svg" width="40" height="64" viewBox="0 0 44 72">
  <ellipse cx="23" cy="68" rx="18" ry="4.5" fill="#000" opacity=".16"/>
  <rect x="3" y="15" width="6" height="13" rx="3" fill="#1f2937"/><rect x="35" y="15" width="6" height="13" rx="3" fill="#1f2937"/>
  <rect x="3" y="44" width="6" height="13" rx="3" fill="#1f2937"/><rect x="35" y="44" width="6" height="13" rx="3" fill="#1f2937"/>
  <rect x="6" y="4" width="32" height="64" rx="13" fill="${col}"/>
  <rect x="6" y="4" width="32" height="22" rx="13" fill="#ffffff" opacity=".10"/>
  <rect x="2" y="27" width="6" height="7" rx="2.5" fill="${col}"/><rect x="36" y="27" width="6" height="7" rx="2.5" fill="${col}"/>
  <path d="M11 21 h22 l-3 11 h-16 z" fill="#d6ecf7" opacity=".95"/>
  <rect x="12" y="33" width="20" height="15" rx="5" fill="#000" opacity=".16"/>
  <path d="M13 49 h18 l-2.5 8 h-13 z" fill="#b9d4e6" opacity=".9"/>
  <rect x="11" y="6" width="6" height="4" rx="2" fill="#fff3c4"/><rect x="27" y="6" width="6" height="4" rx="2" fill="#fff3c4"/>
  <rect x="11" y="62" width="6" height="3" rx="1.5" fill="#ef4444"/><rect x="27" y="62" width="6" height="3" rx="1.5" fill="#ef4444"/>
</svg>`;}
function carGraphic(id){const c=car(id);return `<div class="carwrap">${carSVG(c.c)}</div>`;}

let modal=null, guideCar=null;
function areaFree(a){return a.bays.filter(b=>!b.car).length;}
function render(){
  const reco=guideCar?recoTarget(guideCar):null;
  const placed=placedIds();
  const totalCap=AREAS.reduce((s,a)=>s+a.bays.length,0);
  const parked=AREAS.reduce((s,a)=>s+a.bays.filter(b=>b.car).length,0);
  document.getElementById("sum").innerHTML=
    `<div class="chip">空き <b>${totalCap-parked}</b>/${totalCap}</div><div class="chip">貸出中 <b>${OUT.filter(id=>!placed.has(id)).length}</b></div><div class="chip">要駐車 <b>${needCars().length}</b></div>`;
  // マップ = 出入口レーン + 3エリア
  let html=`<div class="lane"><span class="gate">🚪 出入口</span></div>`;
  AREAS.forEach((a,ai)=>{
    const bays=a.bays.map((b,bi)=>{
      const noBadge=(a.mode==="numbered"&&b.no)?`<span class="bno">${b.no}</span>`:"";
      if(!b.car){const r=reco&&reco.a===ai&&reco.b===bi;return `<div class="cbay free${r?' reco':''}" id="bay_${ai}_${bi}" onclick="tapEmpty(${ai},${bi})">${noBadge}${r?'<span class="crown">👑ここへ</span>':''}<span class="freetag">空</span></div>`;}
      const cc=car(b.car.id);
      const cnBadge=(a.mode==="manual"&&b.car.cn)?`<span class="cn">駐車No.${b.car.cn}</span>`:"";
      return `<div class="cbay occ" id="bay_${ai}_${bi}" onclick="tapCar(${ai},${bi})">${noBadge}${carGraphic(b.car.id)}<div class="cname">${cc.n}${cc.p?'<br>'+cc.p:''}</div>${cnBadge}</div>`;
    }).join("");
    html+=`<div class="area ${a.paid?'paid':'own'}"><div class="atitle">${a.ico} ${a.name}${a.paid?'<span class="paidtag">有料</span>':''}<span class="cap">空き ${areaFree(a)}／${a.bays.length}台</span></div><div class="coinbays">${bays}</div></div>`;
  });
  document.getElementById("lotMap").innerHTML=html;
  // pools
  const retList=RETURNS.filter(r=>!placed.has(r.id));
  document.getElementById("returns").innerHTML=retList.length?retList.map(r=>{const c=car(r.id);return `<div class="pcar ret" onclick="pickNeed('${r.id}')"><span class="dot" style="background:${CLS[c.c]}"></span>${c.n}${c.p} <span style="color:#fbbf24;font-weight:900">🕒${r.time} 到着→誘導▶</span></div>`;}).join(""):'<div class="hint" style="margin:0">なし</div>';
  const need=needCars();
  document.getElementById("need").innerHTML=need.length?need.map(c=>`<div class="pcar" onclick="pickNeed('${c.id}')"><span class="dot" style="background:${CLS[c.c]}"></span>${c.n}${c.p}</div>`).join(""):'<div class="hint" style="margin:0">なし</div>';
  document.getElementById("out").innerHTML=OUT.filter(id=>!placed.has(id)).map(id=>{const c=car(id);return `<div class="pcar out"><span class="dot" style="background:${CLS[c.c]}"></span>${c.n}${c.p}</div>`;}).join("")||'<div class="hint" style="margin:0">なし</div>';
  renderModal();
}
function renderModal(){document.getElementById("modalRoot").innerHTML=modal?`<div class="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet">${modal}</div></div>`:"";}
function openSheet(h){modal=h;renderModal();}
function closeSheet(){modal=null;renderModal();}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600);}
function burst(el){const r=el.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;const em=["✨","🎉","⭐","💫"];for(let k=0;k<10;k++){const p=document.createElement("div");p.className="particle";p.textContent=em[k%4];const a=Math.PI*2*k/10,d=40+Math.random()*40;p.style.left=cx+"px";p.style.top=cy+"px";p.style.setProperty("--dx",Math.cos(a)*d+"px");p.style.setProperty("--dy",Math.sin(a)*d-20+"px");p.style.setProperty("--rot",Math.random()*180-90+"deg");document.body.appendChild(p);setTimeout(()=>p.remove(),820);}}
function exitGuide(){guideCar=null;document.body.classList.remove("guiding");document.getElementById("guidebar").classList.remove("on");document.getElementById("fab").style.display="";}

// ===== 入庫（誘導＋車が走って入る） =====
function startGuide(){
  const list=needCars().length?needCars():CARS.filter(c=>!placedIds().has(c.id)&&!OUT.includes(c.id));
  openSheet(`<h3>🚗 入庫する車を選択</h3><div class="sd">選ぶと👑おすすめのマスが光ります。</div>`+
    list.map(c=>`<button class="opt" onclick="enterGuide('${c.id}')"><span class="dot" style="background:${CLS[c.c]}"></span>${c.n} ${c.p}</button>`).join("")+
    `<div class="btnrow"><button class="btn g" onclick="closeSheet()">キャンセル</button></div>`);
}
function enterGuide(id){guideCar=id;closeSheet();document.body.classList.add("guiding");document.getElementById("gName").textContent=car(id).n+car(id).p;document.getElementById("guidebar").classList.add("on");document.getElementById("fab").style.display="none";render();}
function cancelGuide(){exitGuide();render();}
function pickNeed(id){enterGuide(id);}
// 出入口から目的マスへ車が走るアニメ
function driveInto(targetEl,cb){
  const gate=document.querySelector(".gate").getBoundingClientRect();
  const fc=document.createElement("div");fc.className="flycar";fc.innerHTML=carGraphic(guideCar);
  fc.querySelector(".carwrap").style.animation="none";
  document.body.appendChild(fc);
  fc.style.transform=`translate(${gate.left}px,${gate.top}px) scale(.9)`;
  const r=targetEl.getBoundingClientRect();
  const tx=r.left+r.width/2-20, ty=r.top+r.height/2-32;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{fc.style.transform=`translate(${tx}px,${ty}px) scale(1)`;}));
  setTimeout(()=>{fc.remove();cb();},820);
}
function tapEmpty(ai,bi){
  if(!guideCar){startGuide();return;}
  const el=document.getElementById(`bay_${ai}_${bi}`);
  driveInto(el,()=>{
    const a=AREAS[ai];let cn="";
    if(a.mode==="manual")cn=(prompt("駐車No（この駐車場のマス番号を入力）","")||"").trim();
    a.bays[bi].car={id:guideCar,cn};
    const nm=car(guideCar).n;const label=(a.mode==="numbered"?"No."+a.bays[bi].no:a.name)+(cn?" No."+cn:"");
    exitGuide();render();
    const b=document.getElementById(`bay_${ai}_${bi}`);if(b){b.classList.add("pop");burst(b);}
    toast("✅ "+label+" に "+nm+" 入庫！ナイス🎉");
  });
}
// ===== 出庫（タップ1回） =====
function tapCar(ai,bi){
  if(guideCar){toast("光っているマスを選んでください");return;}
  const a=AREAS[ai],b=a.bays[bi],c=car(b.car.id);
  const loc=(a.mode==="numbered"?"No."+b.no:a.name)+(b.car.cn?" No."+b.car.cn:"");
  openSheet(`<h3>${loc}：${c.n} ${c.p}</h3><div class="sd">出庫しますか？</div><div class="btnrow"><button class="btn g" onclick="closeSheet()">閉じる</button><button class="btn r" onclick="doOut(${ai},${bi})">🚙 出庫</button></div>`);
}
function doOut(ai,bi){const nm=car(AREAS[ai].bays[bi].car.id).n;AREAS[ai].bays[bi].car=null;closeSheet();render();toast("🚙 "+nm+" 出庫");}
render();
</script>
</body>
</html>
