<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>🅿️ 駐車場モック｜札幌</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#0f172a;color:#0f172a}
  .wrap{max-width:860px;margin:0 auto;background:#f1f5f9;min-height:100vh;padding-bottom:60px}
  .hd{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;padding:12px 16px 10px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
  .hd h1{margin:0;font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px}
  .hd .note{font-size:10.5px;opacity:.85;margin-top:3px}
  .sum{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .sum .chip{background:rgba(255,255,255,.16);border-radius:8px;padding:4px 10px;font-size:11px;font-weight:800}
  .sum .chip b{font-size:14px}
  section{margin:14px 12px 0}
  .stitle{font-size:13px;font-weight:900;color:#0f172a;display:flex;align-items:center;gap:6px;margin:0 2px 8px}
  .stitle .sub{font-size:10.5px;font-weight:700;color:#64748b;margin-left:auto}
  /* 立体 grid */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
  .slot{border-radius:12px;padding:9px 6px;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:2px solid transparent;transition:.12s;position:relative}
  .slot .no{position:absolute;top:5px;left:8px;font-size:10px;font-weight:900;color:#94a3b8}
  .slot.empty{background:#ecfdf5;border:2px dashed #6ee7b7}
  .slot.empty .lbl{color:#059669;font-size:12px;font-weight:800;margin-top:8px}
  .slot.occ{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  .slot .car{font-size:12.5px;font-weight:900;margin-top:10px;text-align:center;line-height:1.15}
  .slot .plate{font-size:10px;font-weight:700;color:#64748b;margin-top:2px}
  .slot .cls{position:absolute;top:5px;right:6px;font-size:9px;font-weight:900;color:#fff;border-radius:5px;padding:1px 5px}
  .slot:active{transform:scale(.96)}
  /* コインP lots */
  .lot{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:9px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-left:5px solid #0ea5e9}
  .lot .lh{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:900}
  .lot .lh .cnt{margin-left:auto;font-size:11px;font-weight:800;color:#0ea5e9}
  .lot .cars{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .lot .lcar{display:flex;align-items:center;gap:8px;background:#f8fafc;border-radius:8px;padding:7px 9px;cursor:pointer}
  .lot .lcar .cn{margin-left:auto;font-size:10px;font-weight:900;color:#fff;background:#0ea5e9;border-radius:6px;padding:2px 7px}
  .lot .lcar .nm{font-size:12px;font-weight:800}
  .lot .lcar .pl{font-size:10px;color:#64748b;font-weight:700}
  .lot .add{margin-top:8px;width:100%;border:1.5px dashed #cbd5e1;background:#fff;border-radius:8px;padding:8px;font-size:11.5px;font-weight:800;color:#0ea5e9;cursor:pointer}
  .clsbadge{font-size:9px;font-weight:900;color:#fff;border-radius:5px;padding:2px 6px}
  /* pools */
  .pool{display:flex;flex-wrap:wrap;gap:7px}
  .pcar{border-radius:9px;padding:7px 10px;font-size:11.5px;font-weight:800;cursor:pointer;border:1.5px solid #e2e8f0;background:#fff;display:flex;align-items:center;gap:6px}
  .pcar.out{opacity:.5;cursor:default;background:#f1f5f9;border-style:dashed}
  .pcar .dot{width:8px;height:8px;border-radius:50%}
  .hint{font-size:10.5px;color:#64748b;margin:2px 2px 8px;line-height:1.4}
  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px 24px;max-height:80vh;overflow:auto}
  .sheet h3{margin:0 0 4px;font-size:15px;font-weight:900}
  .sheet .sd{font-size:11.5px;color:#64748b;margin-bottom:12px}
  .opt{width:100%;text-align:left;border:1.5px solid #e2e8f0;background:#fff;border-radius:10px;padding:11px 12px;font-size:13px;font-weight:800;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:9px}
  .opt:active{background:#f1f5f9}
  .opt .dot{width:10px;height:10px;border-radius:50%}
  .btnrow{display:flex;gap:8px;margin-top:6px}
  .btn{flex:1;border:none;border-radius:10px;padding:12px;font-size:13px;font-weight:800;cursor:pointer}
  .btn.g{background:#f1f5f9;color:#475569}.btn.r{background:#fee2e2;color:#dc2626}.btn.b{background:#0d9488;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1>🅿️ 駐車場（モック）</h1>
    <div class="note">※これは見た目確認用のモックです。データは保存されません（再読込で戻ります）。実際に立体＝マス目・コインP＝ロット箱・タップで入出庫を体験できます。</div>
    <div class="sum" id="sum"></div>
  </div>

  <section>
    <div class="stitle">🏢 立体駐車場 <span class="sub" id="stStat"></span></div>
    <div class="grid" id="grid"></div>
    <div class="hint">緑＝空きスロット（タップで車を入れる）／白＝駐車中（タップで出庫・移動）。空き状況が一目で分かる。</div>
  </section>

  <section>
    <div class="stitle">🅿️ コインパーキング</div>
    <div id="lots"></div>
    <div class="hint">ロット単位で車を入れる（1ロットに複数台OK）。コイン精算番号は任意メモ。「どのロットに何台いるか」が見える。</div>
  </section>

  <section>
    <div class="stitle">⚠️ 要駐車（戻ってきたが未配置）</div>
    <div class="pool" id="need"></div>
    <div class="hint" id="needHint"></div>
  </section>

  <section>
    <div class="stitle">🚙 貸出中（予約から自動判定・操作不要）</div>
    <div class="pool" id="out"></div>
    <div class="hint">今日の予約で出ている車は自動でここに表示。人が出庫操作しなくてよい（＝自動化のイメージ）。</div>
  </section>
</div>

<div id="modalRoot"></div>

<script>
const CLS={A:"#7c3aed",A2:"#9333ea",B:"#0284c7",B2:"#0369a1",C:"#059669",S:"#d97706",F:"#db2777",H:"#64748b",G:"#0891b2"};
// ダミー車両（クラス付き）
const CARS=[
  {id:"アルファード-3411",n:"アルファード",p:"3411",c:"A"},
  {id:"ヴェルファイア-9047",n:"ヴェルファイア",p:"9047",c:"A"},
  {id:"ノア-3382",n:"ノア",p:"3382",c:"B"},
  {id:"デリカD5-1446",n:"デリカD5",p:"1446",c:"B"},
  {id:"ロッキー-299",n:"ロッキー",p:"299",c:"C"},
  {id:"CX-3-4576",n:"CX-3",p:"4576",c:"C"},
  {id:"CX-5-8065",n:"CX-5",p:"8065",c:"S"},
  {id:"ハリアー-5512",n:"ハリアー",p:"5512",c:"S"},
  {id:"ソリオ-8529",n:"ソリオ",p:"8529",c:"F"},
  {id:"デミオ-1111",n:"デミオ",p:"1111",c:"G"},
  {id:"スタッフ車両-①",n:"スタッフ車両①",p:"",c:"H"},
  {id:"スタッフ車両-②",n:"スタッフ車両②",p:"",c:"H"},
];
const car=id=>CARS.find(c=>c.id===id);
// 立体スロット（固定）
let SLOTS=[
  {no:"221",car:null},{no:"260",car:"スタッフ車両-②"},{no:"234",car:"スタッフ車両-①"},{no:"172",car:"デリカD5-1446"},
  {no:"174",car:"CX-5-8065"},{no:"200",car:"ノア-3382"},{no:"282",car:null},
];
// コインパーキング（ロット）
let LOTS=[
  {name:"トラストパーク 北6西15",cars:[{id:"ロッキー-299",cn:"5"}]},
  {name:"タイムズ 北13西16",cars:[{id:"CX-3-4576",cn:"3"}]},
  {name:"その他",cars:[]},
];
// 貸出中（自動・今日の予約で出ている想定）
const OUT=["ハリアー-5512","ソリオ-8529"];
// 状態算出
function placedIds(){const s=new Set();SLOTS.forEach(x=>x.car&&s.add(x.car));LOTS.forEach(l=>l.cars.forEach(c=>s.add(c.id)));return s;}
function needCars(){const p=placedIds();return CARS.filter(c=>!p.has(c.id)&&!OUT.includes(c.id));}

let modal=null;
function render(){
  const placed=placedIds();
  const emptySlots=SLOTS.filter(s=>!s.car).length;
  const coinCnt=LOTS.reduce((a,l)=>a+l.cars.length,0);
  // summary
  document.getElementById("sum").innerHTML=
    `<div class="chip">立体 空き <b>${emptySlots}</b>/${SLOTS.length}</div>`+
    `<div class="chip">コインP <b>${coinCnt}</b>台</div>`+
    `<div class="chip">貸出中 <b>${OUT.length}</b></div>`+
    `<div class="chip">要駐車 <b>${needCars().length}</b></div>`;
  document.getElementById("stStat").textContent=`空き ${emptySlots} / 満車 ${SLOTS.length-emptySlots}`;
  // 立体 grid
  document.getElementById("grid").innerHTML=SLOTS.map((s,i)=>{
    if(!s.car)return `<div class="slot empty" onclick="tapEmpty(${i})"><span class="no">${s.no}</span><span class="lbl">🟩 空き</span></div>`;
    const c=car(s.car)||{n:s.car,p:"",c:"H"};
    return `<div class="slot occ" onclick="tapSlot(${i})"><span class="no">${s.no}</span><span class="cls" style="background:${CLS[c.c]||'#64748b'}">${c.c}</span><span class="car">${c.n}</span><span class="plate">${c.p||""}</span></div>`;
  }).join("");
  // コインP
  document.getElementById("lots").innerHTML=LOTS.map((l,li)=>{
    const cars=l.cars.map((lc,ci)=>{const c=car(lc.id)||{n:lc.id,p:"",c:"H"};return `<div class="lcar" onclick="tapLotCar(${li},${ci})"><span class="clsbadge" style="background:${CLS[c.c]||'#64748b'}">${c.c}</span><span class="nm">${c.n}</span><span class="pl">${c.p||""}</span>${lc.cn?`<span class="cn">No.${lc.cn}</span>`:''}</div>`;}).join("");
    return `<div class="lot"><div class="lh">🅿️ ${l.name}<span class="cnt">${l.cars.length}台</span></div><div class="cars">${cars||'<div class="pl" style="color:#94a3b8;font-size:11px;padding:4px 2px">（空き）</div>'}</div><button class="add" onclick="tapLotAdd(${li})">＋ この駐車場に車を入れる</button></div>`;
  }).join("");
  // 要駐車
  const need=needCars();
  document.getElementById("need").innerHTML=need.length?need.map(c=>`<div class="pcar" onclick="tapNeed('${c.id}')"><span class="dot" style="background:${CLS[c.c]}"></span>${c.n} ${c.p}</div>`).join(""):'<div class="hint" style="margin:0">なし（全車 配置済み or 貸出中）</div>';
  document.getElementById("needHint").textContent=need.length?"タップ→どこに置いたか（立体スロット or コインP）を選ぶだけ。":"";
  // 貸出中
  document.getElementById("out").innerHTML=OUT.map(id=>{const c=car(id);return `<div class="pcar out"><span class="dot" style="background:${CLS[c.c]}"></span>${c.n} ${c.p}</div>`;}).join("");
  renderModal();
}
function openSheet(html){modal=html;renderModal();}
function closeSheet(){modal=null;renderModal();}
function renderModal(){document.getElementById("modalRoot").innerHTML=modal?`<div class="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet">${modal}</div></div>`:"";}

// --- interactions (モック=ローカル状態のみ) ---
let pending=null; // 置き場を選ぶ対象の carId
function tapEmpty(i){ // 空きスロット→要駐車の車から選んで入れる
  const need=needCars();
  if(!need.length){openSheet(`<h3>No.${SLOTS[i].no} に入れる</h3><div class="sd">今「要駐車」の車がありません。</div><div class="btnrow"><button class="btn g" onclick="closeSheet()">閉じる</button></div>`);return;}
  openSheet(`<h3>No.${SLOTS[i].no}（立体）に入れる車を選択</h3><div class="sd">タップで駐車します。</div>`+
    need.map(c=>`<button class="opt" onclick="doPark(${i},'${c.id}')"><span class="dot" style="background:${CLS[c.c]}"></span>${c.n} ${c.p}</button>`).join("")+
    `<div class="btnrow"><button class="btn g" onclick="closeSheet()">キャンセル</button></div>`);
}
function doPark(i,id){SLOTS[i].car=id;closeSheet();render();}
function tapSlot(i){const c=car(SLOTS[i].car)||{n:SLOTS[i].car};
  openSheet(`<h3>No.${SLOTS[i].no}：${c.n}</h3><div class="sd">操作を選択</div>`+
    `<button class="opt" onclick="doOut(${i})">🚙 出庫（この枠を空にする）</button>`+
    `<div class="btnrow"><button class="btn g" onclick="closeSheet()">閉じる</button></div>`);
}
function doOut(i){SLOTS[i].car=null;closeSheet();render();}
function tapLotAdd(li){
  const need=needCars();
  if(!need.length){openSheet(`<h3>${LOTS[li].name} に入れる</h3><div class="sd">今「要駐車」の車がありません。</div><div class="btnrow"><button class="btn g" onclick="closeSheet()">閉じる</button></div>`);return;}
  openSheet(`<h3>${LOTS[li].name} に入れる車を選択</h3><div class="sd">タップで駐車。次にコイン番号を任意入力。</div>`+
    need.map(c=>`<button class="opt" onclick="doLotPark(${li},'${c.id}')"><span class="dot" style="background:${CLS[c.c]}"></span>${c.n} ${c.p}</button>`).join("")+
    `<div class="btnrow"><button class="btn g" onclick="closeSheet()">キャンセル</button></div>`);
}
function doLotPark(li,id){const cn=prompt("コイン精算番号（任意・空でもOK）","");LOTS[li].cars.push({id,cn:(cn||"").trim()});closeSheet();render();}
function tapLotCar(li,ci){const lc=LOTS[li].cars[ci];const c=car(lc.id)||{n:lc.id};
  openSheet(`<h3>${LOTS[li].name}：${c.n}</h3><div class="sd">${lc.cn?'コインNo.'+lc.cn:'コイン番号なし'}</div>`+
    `<button class="opt" onclick="doLotOut(${li},${ci})">🚙 出庫（このロットから外す）</button>`+
    `<div class="btnrow"><button class="btn g" onclick="closeSheet()">閉じる</button></div>`);
}
function doLotOut(li,ci){LOTS[li].cars.splice(ci,1);closeSheet();render();}
function tapNeed(id){ // 要駐車の車→どこに置いたか選ぶ
  const c=car(id)||{n:id};
  const empties=SLOTS.map((s,i)=>({s,i})).filter(x=>!x.s.car);
  openSheet(`<h3>${c.n} を置いた場所は？</h3><div class="sd">実際に駐めた場所をタップ（それだけ）。</div>`+
    `<div class="sd" style="font-weight:800;color:#0f766e">🏢 立体駐車場（空き）</div>`+
    (empties.length?empties.map(x=>`<button class="opt" onclick="doPark(${x.i},'${id}')">No.${x.s.no}</button>`).join(""):'<div class="sd">空きスロットなし</div>')+
    `<div class="sd" style="font-weight:800;color:#0369a1;margin-top:6px">🅿️ コインパーキング</div>`+
    LOTS.map((l,li)=>`<button class="opt" onclick="doLotParkFromNeed(${li},'${id}')">${l.name}（${l.cars.length}台）</button>`).join("")+
    `<div class="btnrow"><button class="btn g" onclick="closeSheet()">キャンセル</button></div>`);
}
function doLotParkFromNeed(li,id){const cn=prompt("コイン精算番号（任意・空でもOK）","");LOTS[li].cars.push({id,cn:(cn||"").trim()});closeSheet();render();}
render();
</script>
</body>
</html>
