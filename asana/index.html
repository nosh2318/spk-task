<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BUDDICA TOURISM タスク</title>
<style>
:root{--accent:#796eff;--coral:#f06a6a;--ink:#1e1f21;--sub:#6b6f76;--line:#e8e8e9;--bg:#fafafa;--side:#2b2b2d}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;height:100dvh;overflow:hidden}
button{font-family:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:236px 1fr;height:100dvh}
/* ===== sidebar ===== */
.side{background:var(--side);color:#e6e6e8;display:flex;flex-direction:column;overflow:hidden}
.side .brand{display:flex;align-items:center;gap:8px;padding:14px 16px;font-weight:800;font-size:15px;color:#fff;flex-shrink:0}
.side .brand .dot{width:22px;height:22px;border-radius:7px;background:var(--coral);display:grid;place-items:center;color:#fff;font-size:13px}
.side .storesel{margin:0 12px 8px;padding:7px 9px;border-radius:8px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12);font-size:12px;font-weight:700;width:calc(100% - 24px)}
.side .sgrp{font-size:10px;font-weight:800;letter-spacing:.06em;color:#8b8d93;padding:12px 16px 5px}
.side .nav{flex:1;overflow-y:auto;padding-bottom:10px}
.side .pj{display:flex;align-items:center;gap:9px;padding:8px 16px;font-size:13px;color:#cfd0d4;cursor:pointer;border-left:3px solid transparent}
.side .pj:hover{background:rgba(255,255,255,.06)}
.side .pj.on{background:rgba(121,110,255,.18);color:#fff;border-left-color:var(--accent);font-weight:700}
.side .pj .pc{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.side .pj .cnt{margin-left:auto;font-size:11px;color:#8b8d93}
.side .addpj{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:12.5px;color:#9a9ca2;background:none;border:none;width:100%;text-align:left}
.side .addpj:hover{color:#fff}
/* 🏛 新規事業本部 */
.side .pj.hqitem{background:rgba(124,58,237,.16);color:#fff;font-weight:800;border-left-color:#7c3aed}
.side .pj.hqitem.on{background:rgba(124,58,237,.34)}
.side .pj.hqcast{background:rgba(167,139,250,.10);color:#e9e6ff;font-weight:700;margin-bottom:4px;border-left-color:#a78bfa}
.side .pj.hqcast.on{background:rgba(167,139,250,.26);color:#fff}
.side .pj.biz{font-weight:700;transition:opacity .15s}
.side .pj.biz.curbiz{background:rgba(255,255,255,.10);color:#fff;border-left-color:#e11d48}
/* 操作中以外の事業は薄く（関連性が低い＝今は触っていない）。ホバーで戻る */
.side .pj.biz:not(.curbiz){opacity:.38}
.side .pj.biz:not(.curbiz):hover{opacity:.9}
.side .pj.addbiz{font-size:12px;color:#8a8d93;font-weight:600}
.side .pj.addbiz:hover{color:#fff}
/* 初期登録うながし：管理者タブ点滅＋バッジ */
.side .pj.blink{animation:pjBlink 1.1s ease-in-out infinite}
@keyframes pjBlink{0%,100%{background:transparent}50%{background:rgba(245,158,11,.40)}}
.side .pj.blink .setupbadge{display:inline-block;margin-left:auto;font-size:10px;font-weight:800;color:#fff;background:#f59e0b;border-radius:999px;padding:2px 8px;white-space:nowrap;animation:badgePulse 1.1s ease-in-out infinite}
@keyframes badgePulse{0%,100%{opacity:.7}50%{opacity:1}}
.setup-banner{background:#fffbeb;border:1.5px solid #fde68a;color:#92400e;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;margin-bottom:14px}
/* 本部管理：事業カード */
.hqacard{background:#fff;border:1px solid #e6e8ec;border-radius:12px;padding:12px 14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.hqac-h{display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid #f0f1f4;margin-bottom:10px;flex-wrap:wrap}
.hqac-sec{margin:8px 0}
.hqac-l{font-size:12px;font-weight:800;color:#3a3f4b;margin-bottom:6px}
.hqtags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
.hqtag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#374151;background:#f4f5f7;border:1px solid #e6e8ec;border-radius:8px;padding:3px 8px}
.hqtag button{background:none;border:none;color:#9aa0a6;cursor:pointer;font-size:11px;padding:0 1px;line-height:1}
.hqtag button:hover{color:#dc2626}
.hqac-add{display:flex;gap:6px}
.hqac-add input{flex:1;border:1.5px solid #e2e4e8;border-radius:8px;padding:6px 9px;font-size:13px}
.hqac-add button{background:#0f766e;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-weight:800;cursor:pointer}
.apgrp.del{color:#dc2626;border-color:#fecaca}
/* 本部通達モーダル */
.bc-in{width:100%;border:1.5px solid #e2e4e8;border-radius:9px;padding:9px 11px;font-size:14px;margin-bottom:10px;font-family:inherit;box-sizing:border-box}
.bc-l{font-size:12px;font-weight:800;color:#3a3f4b;margin:4px 0 8px;display:flex;align-items:center;gap:6px}
.bc-list{display:flex;flex-direction:column;gap:7px;max-height:220px;overflow-y:auto;border:1px solid #eee;border-radius:9px;padding:9px}
.bc-chk{display:flex;align-items:center;font-size:13px;font-weight:600;color:#374151;cursor:pointer}
.bc-chk input{width:16px;height:16px}
/* サイドバー：プロジェクト名の横に✏️名前変更 */
.side .pj .pjname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .pj .pjedit{background:none;border:none;color:#cfd0d4;font-size:12px;cursor:pointer;opacity:.45;padding:0 3px;flex-shrink:0;line-height:1}
.side .pj:hover .pjedit{opacity:.95}
.side .pj.addpj2:hover{color:#fff!important}
.side .bizhdr{display:flex;align-items:center;gap:7px;padding:10px 16px 4px;font-size:12.5px;color:#fff;font-weight:700;margin-top:6px;border-top:1px solid rgba(255,255,255,.12)}
.side .bizhdr .pc{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.side .bizhdr b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hqbiz{background:#fff;border:1px solid #e6e8ec;border-radius:12px;padding:10px 12px 4px;margin:0 2px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.hqbizh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:#1f2430;padding:2px 0 8px;border-bottom:1px solid #f0f1f4;margin-bottom:6px;flex-wrap:wrap}
.hqbizh .pc{width:11px;height:11px;border-radius:4px}
.hqbizh .hqcnt{font-size:11px;font-weight:700;color:#6b6f76;background:#f4f5f7;padding:2px 9px;border-radius:999px}
.hqbizh .hqopen{margin-left:auto;font-size:11px;font-weight:800;color:#7c3aed;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:8px;padding:3px 9px;cursor:pointer}
.hqstage{padding:2px 0 6px;margin:0 0 14px}
.hqstage .bcol{flex:1 1 300px;min-width:280px;max-width:none}
@media(max-width:768px){.hqstage .bcol{flex:0 0 82vw;min-width:82vw;max-width:82vw}}
.hqpj{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:#3a3f4b;margin:10px 0 6px;padding-bottom:4px;border-bottom:1px dashed #e6e8ec}
.hqpj .hqpjdot{width:9px;height:9px;border-radius:3px}
.hqpj .hqpjn{font-size:11px;font-weight:700;color:#8a8d93;background:#f4f5f7;border-radius:999px;padding:1px 8px}
.hqlist{display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.hqrow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #eceef1;border-radius:9px;padding:8px 10px;cursor:pointer}
.hqrow:hover{border-color:#cbd5e1;background:#fafbfc}
.hqrow .hqst{font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 7px;white-space:nowrap;flex-shrink:0}
.hqrow .hqst.pend{background:#fff7ed;color:#d97706}
.hqrow .hqst.doing{background:#ecfeff;color:#0891b2}
.hqrow .hqst.check{background:#f5f3ff;color:#7c3aed}
.hqrow .hqtt{flex:1;min-width:0;font-size:13px;font-weight:700;color:#1f2430;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hqrow .hqasg{font-size:11.5px;color:#6b6f76;white-space:nowrap;flex-shrink:0}
.hqrow .due{flex-shrink:0}
.hqbcast{background:#fff;border:1px solid #eceef1;border-left:4px solid #7c3aed;border-radius:10px;padding:9px 12px;margin-bottom:8px}
.hqbcast-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hqbcast-act{margin-left:auto;display:flex;gap:6px}
.hqbcast-act .apgrp.del{color:#dc2626;border-color:#fecaca}
.hqbcast-t{font-size:13.5px;font-weight:800;color:#1f2430}
.hqbcast-n{font-size:11px;color:#8a8d93;font-weight:700}
.hqbcast-d{font-size:12px;color:#5b606b;margin:4px 0 2px;white-space:pre-wrap}
.hqbchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.hqbchip{display:inline-flex;align-items:center;gap:5px;font-size:11px;border:1px solid #e6e8ec;border-radius:8px;padding:3px 7px;cursor:pointer;background:#fafbfc}
.hqbchip:hover{background:#f1f3f6}
.side .me{padding:10px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#9a9ca2;display:flex;align-items:center;gap:8px;flex-shrink:0}
.side .me input{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:6px;color:#fff;padding:5px 7px;font-size:12px}
/* ===== main ===== */
.main{display:flex;flex-direction:column;overflow:hidden;background:#fff}
.top{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);flex-shrink:0}
.top h1{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.top .pcdot{width:11px;height:11px;border-radius:4px}
.top .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.top .filt{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:700;color:var(--sub)}
.top .addbtn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 15px;font-weight:800;font-size:13px}
.vseg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.vsegb{background:#fff;border:none;border-right:1px solid var(--line);padding:6px 11px;font-size:12px;font-weight:700;color:var(--sub);display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.vsegb:last-child{border-right:none}
.vsegb.on{background:var(--accent);color:#fff}
.vsegb .vsi{font-size:13px}
.ddue3{display:flex;gap:6px;flex:1;align-items:center}
.ddue3 .dsel{flex:1;min-width:0;border:1px solid #d1d5db;border-radius:8px;padding:7px 6px;font-size:14px;background:#fff}
.ddue3 .dclr{background:#f1f5f9;border:none;border-radius:7px;width:30px;height:30px;color:#94a3b8;font-weight:800;cursor:pointer;flex-shrink:0}
.list{flex:1;overflow-y:auto;padding:6px 0 60px}
.stsec{padding:14px 18px 2px}
.stsec .h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;margin-bottom:4px}
.stsec .h .chip{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px}
.stsec .h .n{color:var(--sub);font-weight:700}
.trow{display:flex;align-items:center;gap:11px;padding:9px 18px;border-bottom:1px solid #f3f3f4;cursor:pointer}
.trow:hover{background:#fafaff}
.trow.sel{background:#f3f1ff}
.chk{width:20px;height:20px;border-radius:50%;border:1.6px solid #cfd0d4;flex-shrink:0;display:grid;place-items:center;color:transparent;font-size:12px;background:#fff}
.chk.done{background:#16a34a;border-color:#16a34a;color:#fff}
.trow .ti{flex:1;min-width:0}
.trow .tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.cdone .tt{text-decoration:line-through;color:#9a9ca2}
.trow .meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--sub);margin-top:2px;flex-wrap:wrap}
.trow .av{width:22px;height:22px;border-radius:50%;background:#e4e2ff;color:#5b4eea;font-size:10px;font-weight:800;display:grid;place-items:center;flex-shrink:0}
.due{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:#f1f5f9;color:#475569}
.due.over{background:#fef2f2;color:#dc2626}
.due.today{background:#fffbeb;color:#b45309}
.cmt-badge{font-size:11px;color:#8b8d93;display:flex;align-items:center;gap:2px}
.empty{text-align:center;color:#9a9ca2;padding:40px 16px;font-size:13px}
.subs{display:flex;flex-direction:column;margin-top:4px}
.subrow{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid #f5f5f6}
.subrow .stt{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.subrow.d .stt{text-decoration:line-through;color:#9a9ca2}
.subrow .sst{font-size:10px;font-weight:800;padding:2px 7px;border-radius:10px;flex-shrink:0}
.subrow .sav{font-size:10px;color:#6b6f76;flex-shrink:0}
.subadd{margin-top:8px;background:#f3f1ff;color:#5b4eea;border:1px dashed #c9c3ff;border-radius:9px;padding:9px 11px;font-size:12.5px;font-weight:700;width:100%;text-align:left}
.bcrumb{display:block;font-size:12px;color:#5b4eea;background:none;border:none;padding:0;margin-bottom:8px;font-weight:700;text-align:left}
/* ===== board ===== */
.board{display:flex;gap:14px;padding:16px;overflow-x:auto;align-items:flex-start;height:100%}
.bcol{flex:0 0 300px;max-width:300px;background:#eef0f3;border:1.5px solid #d3d6dc;border-radius:14px;display:flex;flex-direction:column;max-height:100%;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.bcol-h{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:800;font-size:14px;cursor:pointer;border-bottom:2px solid #d3d6dc}
.bcol-h .pd{width:11px;height:11px;border-radius:4px;flex-shrink:0}
.bcol-h .bn{margin-left:auto;font-size:11px;color:#9a9ca2;font-weight:700}
.bcol-body{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;min-height:60px}
.bcol-body.dragover{outline:2px dashed #796eff;outline-offset:-3px;border-radius:11px;background:#f5f3ff}
.bcard{background:#fff;border:1px solid #e8e8e9;border-radius:11px;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:11px 12px;cursor:pointer}
.bcard:hover{border-color:#c9c3ff}
.bcard.dragging{opacity:.35}
.bcard-t{font-size:13.5px;font-weight:700;line-height:1.35;margin-bottom:7px;word-break:break-word}
.bcard-m{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bcard-m .btag{font-size:10px;font-weight:800;border-radius:6px;padding:2px 7px}
.bcard-m .bsub{font-size:11px;color:#6b6f76;font-weight:700}
.bprog{display:flex;align-items:center;gap:6px;margin:2px 0 7px}
.bprog-bar{flex:1;height:6px;border-radius:5px;background:#eceef1;overflow:hidden}
.bprog-bar i{display:block;height:100%;border-radius:5px;transition:width .3s}
.bprog-n{font-size:10.5px;font-weight:800;color:#6b6f76;min-width:32px;text-align:right}
.dprog{display:flex;align-items:center;gap:8px;flex:1}
.dprog-bar{flex:1;height:8px;border-radius:6px;background:#eceef1;overflow:hidden}
.dprog-bar i{display:block;height:100%;border-radius:6px}
.dprog-n{font-size:13px;font-weight:800;color:#1e1f21;min-width:40px;text-align:right}
.lprog{display:inline-flex;align-items:center;gap:5px}
.lprog-bar{width:46px;height:5px;border-radius:4px;background:#eceef1;overflow:hidden}
.lprog-bar i{display:block;height:100%;border-radius:4px}
.bcard-m .bsp{flex:1}
.bcard-m .bwho{font-size:10px;color:#9a9ca2;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.bcard-m .bav{width:22px;height:22px;border-radius:50%;background:#e4e2ff;color:#5b4eea;font-size:10px;font-weight:800;display:grid;place-items:center;flex-shrink:0}
.baddsub{background:none;border:1px dashed #c9c3ff;color:#6b62e6;border-radius:8px;padding:8px;font-size:12px;font-weight:700;width:100%;text-align:center;margin-top:2px}
.bhint{font-size:11px;color:#9a9ca2;padding:8px 18px 0}
.bgrp{display:flex;align-items:center;gap:7px;padding:8px 18px 2px}
.bgrp-l{font-size:11px;font-weight:800;color:#9a9ca2}
.bgrpb{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer}
.bgrpb.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bcol-h .bav{width:22px;height:22px;border-radius:50%;font-size:10px;font-weight:800;display:grid;place-items:center;flex-shrink:0}
@media(max-width:768px){.bcol{flex-basis:82vw;max-width:82vw}}
/* ===== list (Asana風テーブル) ===== */
.ltbl{min-width:680px}
.lgrid{display:grid;grid-template-columns:26px 24px minmax(180px,1fr) 130px 84px 78px 120px;align-items:center}
.lhead,.lrow{display:grid;grid-template-columns:26px 24px minmax(180px,1fr) 130px 84px 78px 120px;align-items:center}
.lhead{padding:8px 16px;border-bottom:1px solid var(--line);font-size:11px;font-weight:800;color:#9a9ca2;position:sticky;top:0;background:#fff;z-index:2}
.lhead .lname{font-size:11px;font-weight:800}
.lgh{display:flex;align-items:center;gap:8px;padding:11px 16px 5px;cursor:pointer;font-size:12px;font-weight:800}
.lgh .lgtw{color:#9a9ca2;font-size:11px;width:12px}
.lgh .chip{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px}
.lgh .lgn{color:#9a9ca2}
.lrow{padding:7px 16px;border-bottom:1px solid #f3f3f4;cursor:default}
.lrow:hover{background:#fafaff}
.lrow.sel{background:#f3f1ff}
.lrow .ltw{display:flex;justify-content:center;padding-left:calc(var(--d,0)*16px)}
.lexp{background:none;border:none;color:#9a9ca2;font-size:11px;padding:2px;cursor:pointer}
.lchk{width:19px;height:19px;border-radius:50%;border:1.6px solid #cfd0d4;display:grid;place-items:center;color:transparent;font-size:11px;background:#fff;cursor:pointer}
.lchk.done{background:#16a34a;border-color:#16a34a;color:#fff}
.lname{min-width:0;display:flex;align-items:center;gap:7px;cursor:pointer}
.lname .lnt{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lsubn{font-size:11px;color:#8b8d93;font-weight:700;flex-shrink:0}
.lcol{font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;min-width:0}
.lasg .bav{width:22px;height:22px;border-radius:50%;background:#e4e2ff;color:#5b4eea;font-size:10px;font-weight:800;display:grid;place-items:center;flex-shrink:0}
.lasgn{font-size:12px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldash{color:#cfd0d4}
.lprio{font-size:11px;font-weight:800;padding:2px 9px;border-radius:8px}
.ltag .btag{font-size:10px;font-weight:800;border-radius:6px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.laddrow{padding:8px 16px 8px 50px;font-size:12px;color:#9a9ca2;cursor:pointer}
.laddrow:hover{color:#5b4eea}
/* ===== detail ===== */

async function dl(cb,ov){var b=document.getElementById('ab'),er=document.getElementById('aerr');var em=(document.getElementById('ae')||{}).value||'',pw=(document.getElementById('ap')||{}).value||'';if(!em||!pw){er.style.display='';er.textContent='入力してください';return;}b.disabled=true;b.textContent='確認中...';try{var r=await fetch(SU+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SK,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})});var d=await r.json();if(d&&d.access_token){localStorage.setItem('sb-ckrxttbnawkclshczsia-auth-token',JSON.stringify({access_token:d.access_token,refresh_token:d.refresh_token||'',expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600),token_type:'bearer',user:d.user||{}}));if(!ME&&d.user&&d.user.email){ME=d.user.email.split('@')[0];localStorage.setItem('asana_me',ME);}ov.remove();cb();}else{er.style.display='';er.textContent='認証失敗';b.disabled=false;b.textContent='ログイン';}}catch(e){er.style.display='';er.textContent='接続エラー';b.disabled=false;b.textContent='ログイン';}}
async function sbGet(q){let r;try{r=await fetch(SU+'/rest/v1/'+q,{headers:{apikey:SK,Authorization:authH()}});}catch(e){r=null;}
  if(!r||!r.ok){try{r=await fetch(SU+'/rest/v1/'+q,{headers:{apikey:SK,Authorization:'Bearer '+SK}});}catch(e){return null;}}
  if(!r||!r.ok)return null;return r.json();}
async function sbPost(tbl,obj){let last='';for(let i=0;i<4;i++){try{const r=await fetch(SU+'/rest/v1/'+tbl,{method:'POST',headers:{apikey:SK,Authorization:authH(),'Content-Type':'application/json',Prefer:'return=representation,resolution=merge-duplicates'},body:JSON.stringify(obj)});if(r.ok)return r.json();last='HTTP '+r.status+' '+await r.text();}catch(e){last=(e&&e.message)||'net';}await new Promise(res=>setTimeout(res,300*(i+1)));}throw new Error(last||'post failed');}
// 画像を Supabase Storage(asana-attachments) にアップロード→公開URLを返す
const ASANA_BUCKET='asana-attachments';
async function uploadImg(file,taskId){
  const safe=(file.name||'image').replace(/[^A-Za-z0-9._-]/g,'_').slice(-50);
  const path=STORE+'/'+taskId+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'_'+safe;
  const r=await fetch(SU+'/storage/v1/object/'+ASANA_BUCKET+'/'+encodeURI(path),{method:'POST',headers:{apikey:SK,Authorization:authH(),'Content-Type':file.type||'application/octet-stream','x-upsert':'true'},body:file});
  if(!r.ok)throw new Error('HTTP '+r.status+' '+await r.text());
  return SU+'/storage/v1/object/public/'+ASANA_BUCKET+'/'+encodeURI(path);
}
async function uploadImgs(files,taskId){const out=[];for(const f of files){if(!f||!(f.type||'').startsWith('image/'))continue;out.push(await uploadImg(f,taskId));}return out;}
// ログ(コメント/承認)を「DB最新を取得→追記」で保存。複数人の同時コメント上書きを防止
async function appendLog(id,entry){
  let base=null;try{const rows=await sbGet(TBL()+'?id=eq.'+encodeURIComponent(id)+'&select=logs');if(rows&&rows[0]&&Array.isArray(rows[0].logs))base=rows[0].logs;}catch(e){}
  const t=findT(id);
  if(base===null)base=(t&&Array.isArray(t.logs))?t.logs:[];
  const merged=base.concat([entry]);
  if(t)t.logs=merged;
  await sbPatch(TBL(),id,{logs:merged});
  return merged;
}
// 状態/担当の変更を監査ログに記録しつつフィールドも保存（最新logs取得で上書き防止）
async function logEvent(id,entry,patch){
  let base=null;try{const rows=await sbGet(TBL()+'?id=eq.'+encodeURIComponent(id)+'&select=logs');if(rows&&rows[0]&&Array.isArray(rows[0].logs))base=rows[0].logs;}catch(e){}
  const t=findT(id);
  if(base===null)base=(t&&Array.isArray(t.logs))?t.logs:[];
  const logs=base.concat([entry]);
  if(t)t.logs=logs;
  await sbPatch(TBL(),id,Object.assign({logs},patch||{}));
  return logs;
}

async function hqAdminLoad(rerender){
  const stores=BUSINESSES.map(b=>b.store).filter(Boolean);if(!stores.length){HQADMIN={};return;}
  const inList=stores.map(s=>encodeURIComponent(s)).join(',');
  const nx={};stores.forEach(s=>nx[s]={members:[],projects:[]});
  try{const mrows=await sbGet(TBL()+'?store=in.('+inList+')&id=like._members*&select=store,attachments');(mrows||[]).forEach(r=>{if(nx[r.store])nx[r.store].members=Array.isArray(r.attachments)?r.attachments.filter(Boolean):[];});}catch(e){}
  try{const prows=await sbGet(TBL()+'?store=in.('+inList+')&id=like._projects*&select=store,attachments');(prows||[]).forEach(r=>{if(nx[r.store])nx[r.store].projects=Array.isArray(r.attachments)?r.attachments.filter(Boolean):[];});}catch(e){}
  HQADMIN=nx;
  if(rerender&&CUR==='__hqadmin')render();
}

// 保存前に必ずDB最新を取得（古いHQADMINで上書きしてメンバー消失するのを防止）
async function _fetchAtt(store,base){try{const r=await sbGet(TBL()+'?store=eq.'+encodeURIComponent(store)+'&id=eq.'+base+'__'+encodeURIComponent(store)+'&select=attachments');return (r&&r[0]&&Array.isArray(r[0].attachments))?r[0].attachments.filter(Boolean):[];}catch(e){return null;}}
async function hqAddMember(store){const inp=document.getElementById('hqm_'+store);const n=(inp&&inp.value||'').trim();if(!n)return;let cur=await _fetchAtt(store,'_members');if(cur===null)cur=((HQADMIN[store]||{}).members||[]).slice();if(!cur.includes(n))cur.push(n);HQADMIN[store]=Object.assign({projects:[]},HQADMIN[store],{members:cur});if(store===STORE)MEMBERS=cur.slice();render();await saveMembersFor(store,cur);if(store===HQ_STORE){await propagateMember(n,true);toast('「'+n+'」を全PJに登録しました');}}
async function hqDelMember(store,name){let cur=await _fetchAtt(store,'_members');if(cur===null)cur=((HQADMIN[store]||{}).members||[]).slice();cur=cur.filter(x=>x!==name);HQADMIN[store]=Object.assign({projects:[]},HQADMIN[store],{members:cur});if(store===STORE)MEMBERS=cur.slice();render();await saveMembersFor(store,cur);}
async function hqAddProject(store){const inp=document.getElementById('hqp_'+store);const n=(inp&&inp.value||'').trim();if(!n)return;let cur=await _fetchAtt(store,'_projects');if(cur===null)cur=((HQADMIN[store]||{}).projects||[]).slice();if(!cur.includes(n))cur.push(n);HQADMIN[store]=Object.assign({members:[]},HQADMIN[store],{projects:cur});if(store===STORE)PROJECTS=cur.slice();render();await saveProjectsFor(store,cur);}
async function hqDelProject(store,name){if(!confirm('プロジェクト「'+name+'」を削除しますか？'))return;let cur=await _fetchAtt(store,'_projects');if(cur===null)cur=((HQADMIN[store]||{}).projects||[]).slice();cur=cur.filter(x=>x!==name);HQADMIN[store]=Object.assign({members:[]},HQADMIN[store],{projects:cur});if(store===STORE)PROJECTS=cur.slice();render();await saveProjectsFor(store,cur);}
async function hqRenameProject(store,name){let nn=prompt('プロジェクト名を変更',name);if(nn===null)return;nn=nn.trim();if(!nn||nn===name)return;let cur=await _fetchAtt(store,'_projects');if(cur===null)cur=((HQADMIN[store]||{}).projects||[]).slice();const i=cur.indexOf(name);if(i<0)return;cur[i]=nn;HQADMIN[store]=Object.assign({members:[]},HQADMIN[store],{projects:cur});if(store===STORE)PROJECTS=cur.slice();render();await saveProjectsFor(store,cur);}
// 本部「全タスク」＝全PJ横断の全タスクを取得
async function loadHqAll(rerender){
  const stores=[...new Set(BUSINESSES.map(b=>b.store).concat([HQ_STORE]))];
  const inList=stores.map(s=>encodeURIComponent(s)).join(',');
  const rows=await sbGet(TBL()+'?store=in.('+inList+')&deleted=eq.false&select=*&order=updated_at.desc');
  if(rows===null)return;
  HQ_ALL=rows.filter(r=>r&&r.id&&String(r.id).charAt(0)!=='_').map(t=>{const logs=Array.isArray(t.logs)?t.logs:[];const rq=logs.find(l=>l&&l.type==='req');return {...t,_st:normStatus(t.status),logs,requester:t.requester||(rq&&rq.by)||''};});
  if(rerender&&(CUR==='__hqall'||STORE===HQ_STORE)&&!isEditing())render();
}

async function loadHQ(rerender){
  const stores=BUSINESSES.map(b=>b.store).filter(Boolean);
  if(!stores.length){HQ_TASKS=[];HQ_PEND=0;if(rerender&&CUR==='__hq')render();return;}
  const inList=stores.map(s=>encodeURIComponent(s)).join(',');
  const rows=await sbGet(TBL()+'?store=in.('+inList+')&deleted=eq.false&status=in.(approval,doing,check)&select=*&order=updated_at.desc');
  if(rows===null)return;
  HQ_TASKS=rows.filter(r=>r&&r.id&&String(r.id).charAt(0)!=='_').map(t=>{const logs=Array.isArray(t.logs)?t.logs:[];const rq=logs.find(l=>l&&l.type==='req');return {...t,_st:normStatus(t.status),logs,requester:t.requester||(rq&&rq.by)||''};});
  HQ_PEND=HQ_TASKS.filter(isApprPending).length;
  try{const mrows=await sbGet(TBL()+'?store=in.('+inList+')&id=like._members*&select=attachments');HQ_MEMBERS=[...new Set([].concat(...((mrows||[]).map(r=>Array.isArray(r.attachments)?r.attachments:[]))))].filter(Boolean);}catch(e){}
  // 📢 本部が出したタスク（通達）の横断一覧（全status）
  try{const brows=await sbGet(TBL()+'?store=in.('+inList+')&deleted=eq.false&area=eq.'+encodeURIComponent(HQ_BCAST_AREA)+'&select=*&order=created_at.desc');if(brows!==null)HQ_BROADCASTS=brows.filter(r=>r&&r.id&&String(r.id).charAt(0)!=='_').map(t=>({...t,_st:normStatus(t.status),logs:Array.isArray(t.logs)?t.logs:[]}));}catch(e){}
  if(rerender&&(CUR==='__hq'||CUR==='__hqcast'))render();
}

async function load(isPoll){
  const rows=await sbGet(TBL()+'?store=eq.'+encodeURIComponent(STORE)+'&deleted=eq.false&select=*&order=updated_at.desc');
  // 取得失敗（通信断・一時エラー）時は既存表示を維持して空にしない＝「タスクが消えた」を防止
  if(rows===null){const lc=document.getElementById('taskList');if(lc&&!TASKS.length)lc.innerHTML='<div class="empty">接続待ち…（自動で再試行します）</div>';return;}
  // 特殊行はストア固有id（_members__<store>）。store絞り済みなので接頭辞一致で取得（旧id _members も拾う）
  const memRow=(rows||[]).find(r=>String(r.id).indexOf('_members')===0);
  MEMBERS=Array.isArray(memRow&&memRow.attachments)?memRow.attachments.filter(Boolean):[];
  const projRow=(rows||[]).find(r=>String(r.id).indexOf('_projects')===0);
  PROJECTS=Array.isArray(projRow&&projRow.attachments)?projRow.attachments.filter(Boolean):[];
  const stRow=(rows||[]).find(r=>String(r.id).indexOf('_statuses')===0);
  STATUSES=(Array.isArray(stRow&&stRow.attachments)&&stRow.attachments.filter(s=>s&&s.k&&s.l).length)?stRow.attachments.filter(s=>s&&s.k&&s.l):DEFAULT_STATUSES.map(s=>({...s}));
  // ワークフロー用ステータス（対応中・チェック）を常設化
  if(!STATUSES.some(s=>s.k==='doing')){await ensureStatus(ST_DOING);}
  if(!STATUSES.some(s=>s.k==='check')){await ensureStatus(ST_CHECK);}
  TASKS=(rows||[]).filter(r=>r.id&&String(r.id).charAt(0)!=='_').map(t=>{const logs=Array.isArray(t.logs)?t.logs:[];const rq=logs.find(l=>l&&l.type==='req');return {...t,_st:normStatus(t.status),logs,requester:t.requester||(rq&&rq.by)||''};});
  const sig=dataSig();
  if(isPoll){
    if(sig===_lastSig)return;            // 変化なし→再描画しない（見ている位置を動かさない）
    if(isEditing())return;               // 入力中（コメント等）は再描画しない＝消えない・ズレない
  }
  _lastSig=sig;
  if(isPoll)renderKeepScroll(); else render();
  checkApprovalAlerts();
}

async function addStatus(){var inp=document.getElementById('stInput');var n=((inp&&inp.value)||window._stTyped||'').trim();if(!n)return;if(STATUSES.some(function(s){return s.l===n;})){toast('同名のステータスがあります');return;}window._stTyped='';if(inp)inp.value='';var pal=ST_PAL[STATUSES.length%ST_PAL.length];STATUSES.push({k:'st_'+Math.random().toString(36).slice(2,7),l:n,c:pal[0],bg:pal[1]});render();try{await saveStatuses();}catch(e){}toast('ステータス「'+n+'」を追加しました');}
async function renameStatus(k){var s=STATUSES.find(function(x){return x.k===k;});if(!s)return;var nn=prompt('ステータス名を変更',s.l);if(nn===null)return;nn=nn.trim();if(!nn||nn===s.l)return;s.l=nn;await saveStatuses();render();}
async function moveStatus(i,dir){var j=i+dir;if(j<0||j>=STATUSES.length)return;var tmp=STATUSES[i];STATUSES[i]=STATUSES[j];STATUSES[j]=tmp;await saveStatuses();render();}
async function delStatus(k){
  if(STATUSES.length<=1){toast('最後の1列は削除できません');return;}
  var s=STATUSES.find(function(x){return x.k===k;});
  var aff=TASKS.filter(function(t){return t._st===k;});
  var fb=hasSt('consult')?'consult':((STATUSES.find(function(x){return x.k!==k;})||{}).k||'consult');
  var fbl=(STATUSES.find(function(x){return x.k===fb;})||{}).l||fb;
  if(!confirm('ステータス「'+(s?s.l:k)+'」を削除しますか？'+(aff.length?'\n'+aff.length+'件のタスクは「'+fbl+'」へ移動します。':'')))return;
  STATUSES=STATUSES.filter(function(x){return x.k!==k;});
  aff.forEach(function(t){t.status=fb;t._st=fb;});
  await saveStatuses();render();
  try{await Promise.all(aff.map(function(t){return sbPatch(TBL(),t.id,{status:fb});}));toast('削除しました');}catch(e){toast('一部の反映に失敗');load();}
}
function children(id){return TASKS.filter(t=>t.parent_id===id).sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));}
// 進捗率：サブタスクがあれば完了割合・完了状態は100・それ以外は手入力progress
function progressOf(t){const subs=children(t.id);if(subs.length)return Math.round(subs.filter(s=>s._st==='done').length/subs.length*100);if(t._st==='done')return 100;return Math.max(0,Math.min(100,+t.progress||0));}
function curTasks(){if(CUR&&CUR.indexOf('__asg__')===0){const who=CUR.slice(7);return TASKS.filter(t=>!t.parent_id&&(t.assignee||'')===who);}return TASKS.filter(t=>!t.parent_id&&(CUR==='__all'||(t.area||'一般')===CUR));}
function depthOf(t){let d=0,cur=t,g=0;while(cur&&cur.parent_id&&g++<10){cur=TASKS.find(x=>x.id===cur.parent_id);if(cur)d++;else break;}return d;}
function chainOf(t){const arr=[];let cur=t,g=0;while(cur&&cur.parent_id&&g++<10){const p=TASKS.find(x=>x.id===cur.parent_id);if(!p)break;arr.unshift(p);cur=p;}return arr;}
const SUBLBL=['子タスク','孫タスク','ひ孫タスク'];

/* ---- 進捗調整ページ（1画面で全タスクの進捗確認＆%調整） ---- */
let PRG_PJ=localStorage.getItem('asana_prg_pj')||'__all';
let PRG_ASG=localStorage.getItem('asana_prg_asg')||'__all';
let PRG_HIDE=localStorage.getItem('asana_prg_hidedone')==='1';
function setPrgFilt(k,v){if(k==='pj')PRG_PJ=v;else if(k==='asg')PRG_ASG=v;else if(k==='hide')PRG_HIDE=v;localStorage.setItem('asana_prg_'+(k==='hide'?'hidedone':k),k==='hide'?(v?'1':'0'):v);render();}
// スライダー操作中はラベルだけ更新（onchangeで保存）
function prgLive(id,v){const n=document.getElementById('pn_'+id);if(n)n.textContent=v+'%';const b=document.getElementById('pb_'+id);if(b){b.style.width=v+'%';b.style.background=(+v>=100?'#16a34a':'#4573d2');}}
function prgSet(id,v){v=Math.max(0,Math.min(100,+v));prgLive(id,v);setField(id,'progress',v);}
function prgBump(id,cur,d){prgSet(id,(+cur||0)+d);}
function progressHtml(){
  const roots=TASKS.filter(t=>!t.parent_id);
  // フィルタ候補
  const pjList=projects();
  const asgSet={};roots.forEach(t=>{const a=(t.assignee||'').trim();if(a)asgSet[a]=1;});
  const asgNames=MEMBERS.concat(Object.keys(asgSet).filter(a=>!MEMBERS.includes(a)));
  const match=t=>{
    if(PRG_PJ!=='__all'&&(t.area||'一般')!==PRG_PJ)return false;
    if(PRG_ASG!=='__all'){const a=(t.assignee||'').trim();if(PRG_ASG==='__none'?a:(a!==PRG_ASG))return false;}
    return true;
  };
  const visRoots=roots.filter(match);
  // 全体サマリー（表示対象のルート基準）
  const allP=visRoots.map(progressOf);
  const avg=allP.length?Math.round(allP.reduce((a,b)=>a+b,0)/allP.length):0;
  const doneN=allP.filter(p=>p>=100).length, zeroN=allP.filter(p=>p===0).length, midN=allP.length-doneN-zeroN;
  const _td=new Date();_td.setHours(0,0,0,0);
  const overdueN=visRoots.filter(t=>t._st!=='done'&&t.due_date&&new Date(t.due_date+'T00:00:00')<_td).length;
  const filt=`<div class="prgfilt">
    <select onchange="setPrgFilt('pj',this.value)"><option value="__all"${PRG_PJ==='__all'?' selected':''}>📁 全プロジェクト</option>${pjList.map(p=>`<option value="${esc(p.a)}"${PRG_PJ===p.a?' selected':''}>${esc(p.a)} (${p.n})</option>`).join('')}</select>
    <select onchange="setPrgFilt('asg',this.value)"><option value="__all"${PRG_ASG==='__all'?' selected':''}>👤 全担当</option><option value="__none"${PRG_ASG==='__none'?' selected':''}>未割当</option>${asgNames.map(a=>`<option value="${esc(a)}"${PRG_ASG===a?' selected':''}>${esc(a)}</option>`).join('')}</select>
    <label style="font-size:12px;font-weight:700;color:#5b6b7b;display:inline-flex;align-items:center;gap:5px"><input type="checkbox" ${PRG_HIDE?'checked':''} onchange="setPrgFilt('hide',this.checked)">完了(100%)を隠す</label>
  </div>`;
  const sum=`<div class="prgsum">
    <div class="prgsum-c"><div class="prgsum-n">${avg}%</div><div class="prgsum-l">平均進捗（${allP.length}件）</div><div class="prgbig"><i style="width:${avg}%;background:${avg>=100?'#16a34a':'#4573d2'}"></i></div></div>
    <div class="prgsum-c"><div class="prgsum-n" style="color:#16a34a">${doneN}</div><div class="prgsum-l">完了 100%</div></div>
    <div class="prgsum-c"><div class="prgsum-n" style="color:#d97706">${midN}</div><div class="prgsum-l">進行中 1-99%</div></div>
    <div class="prgsum-c"><div class="prgsum-n" style="color:#9aa0a6">${zeroN}</div><div class="prgsum-l">未着手 0%</div></div>
    <div class="prgsum-c"><div class="prgsum-n" style="color:#dc2626">${overdueN}</div><div class="prgsum-l">📅 納期超過</div></div>
  </div>`;
  // 完了(status=完了)は専用グループにまとめる／それ以外をプロジェクト別に
  const activeRoots=visRoots.filter(t=>t._st!=='done');
  const doneRoots=visRoots.filter(t=>t._st==='done');
  const areas=[...new Set(activeRoots.map(t=>t.area||'一般'))];
  const _today=new Date();_today.setHours(0,0,0,0);
  const _mid=s=>{const d=new Date(s+'T00:00:00');d.setHours(0,0,0,0);return d;};
  // 📊 進捗ブロック
  const progBlock=t=>{
    const p=progressOf(t);const has=children(t.id).length>0;
    const inner=has
      ? `<div class="pbar"><i style="width:${p}%;background:${p>=100?'#16a34a':'#4573d2'}" id="pb_${t.id}"></i></div><span class="pnum" id="pn_${t.id}">${p}%</span><span class="pauto">自動(サブ)</span>`
      : `<button class="qb" onclick="prgBump('${t.id}',${p},-10)">−10</button><input type="range" min="0" max="100" step="5" value="${p}" oninput="prgLive('${t.id}',this.value)" onchange="prgSet('${t.id}',this.value)"><button class="qb" onclick="prgBump('${t.id}',${p},10)">+10</button><button class="qb ok" onclick="prgSet('${t.id}',100)">✓</button><span class="pnum" id="pn_${t.id}">${p}%</span>`;
    return `<div class="pblock"><span class="pbh">📊 進捗</span>${inner}</div>`;
  };
  // 📅 納期ブロック
  const dueBlock=t=>{
    const due=t.due_date;
    const cy=_today.getFullYear();
    const yNow=due?+due.slice(0,4):null,mNow=due?+due.slice(5,7):null,dNow=due?+due.slice(8,10):null;
    const yOpt=`<option value="">年</option>`+[cy-1,cy,cy+1,cy+2].map(y=>`<option value="${y}"${y===yNow?' selected':''}>${y}</option>`).join('');
    const mOpt=`<option value="">月</option>`+Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${m}"${m===mNow?' selected':''}>${m}</option>`).join('');
    const dOpt=`<option value="">日</option>`+Array.from({length:31},(_,i)=>i+1).map(d=>`<option value="${d}"${d===dNow?' selected':''}>${d}</option>`).join('');
    const sel=`<div class="ddsel"><select class="ddy" onchange="setDue('${t.id}',this)">${yOpt}</select><select class="ddm" onchange="setDue('${t.id}',this)">${mOpt}</select><select class="ddd" onchange="setDue('${t.id}',this)">${dOpt}</select></div>`;
    return `<div class="pblock due"><span class="pbh">📅 納期</span>${sel}</div>`;
  };
  const rowHtml=(t,isSub)=>{
    const cs=ST(t._st);const asg=(t.assignee||'').trim();
    return `<div class="prgrow ${isSub?'sub':''}">
      <div class="prow-top">
        <span class="pttl" onclick="openTask('${t.id}')">${isSub?'└ ':''}${esc(t.title)||'(無題)'}</span>
        <span class="pst" style="color:${cs.c};background:${cs.bg}">${esc(cs.l)}</span>
        ${asg?`<span class="pasg" style="background:${personColor(asg)}">${esc(asg)}</span>`:'<span class="pasg" style="background:#c2c6cc">未割当</span>'}
      </div>
      <div class="prow-bot">${progBlock(t)}${dueBlock(t)}</div>
    </div>`;
  };
  const groups=areas.map(ar=>{
    const list=activeRoots.filter(t=>(t.area||'一般')===ar);
    const gp=list.map(progressOf);const gavg=gp.length?Math.round(gp.reduce((a,b)=>a+b,0)/gp.length):0;
    let rows='';
    list.forEach(t=>{
      rows+=rowHtml(t,false);
      // 完了サブは完了グループへ寄せる（親配下では未完サブのみ表示）
      children(t.id).forEach(c=>{if(!match(c))return;if(c._st==='done')return;rows+=rowHtml(c,true);});
    });
    if(!rows)return '';
    return `<div class="prggrp"><div class="prggrp-h"><span class="gc" style="background:${pjColor(ar)}"></span>${esc(ar)}<span class="gavg">平均 ${gavg}%</span></div>${rows}</div>`;
  }).join('');
  // 完了グループ（status=完了の全タスクを集約）
  let doneGroup='';
  const doneSubs=[];TASKS.forEach(t=>{if(t.parent_id&&t._st==='done'&&match(t))doneSubs.push(t);});
  const allDone=doneRoots.concat(doneSubs.filter(t=>!doneRoots.some(r=>r.id===t.id)));
  if(!PRG_HIDE&&allDone.length){
    const drows=allDone.map(t=>rowHtml(t,!!t.parent_id)).join('');
    doneGroup=`<div class="prggrp"><div class="prggrp-h"><span class="gc" style="background:#16a34a"></span>✅ 完了<span class="gavg" style="color:#16a34a">${allDone.length}件</span></div>${drows}</div>`;
  }
  return `<div class="prgwrap">${filt}${sum}${groups}${doneGroup}${(groups||doneGroup)?'':'<div style="text-align:center;color:#9aa0a6;padding:40px;font-weight:700">該当タスクなし</div>'}</div>`;
}

// 担当者別ビューの下に「その人が受けたコメント」（to===本人 または 全員ALL）を表示。確認チェック(ack)付き
function recvCmtHtml(person){
  const items=[];
  TASKS.forEach(t=>{(t.logs||[]).forEach((l,i)=>{
    if(!l||l.type)return;                              // コメントのみ（状態/担当/依頼ログ除外）
    const to=l.to||'ALL';
    if(!((to===person)||(to==='ALL')))return;          // 本人宛 or 全員宛 だけ
    if((l.by||'')===person)return;                     // 自分の投稿は除外
    items.push({t,l,to});
  });});
  items.sort((a,b)=>String(b.l.at||'').localeCompare(String(a.l.at||'')));
  const ackd=items.filter(x=>Array.isArray(x.l.ack)&&x.l.ack.indexOf(person)>=0).length;
  let h=`<div class="recvwrap"><div class="recvhd">📥 ${esc(person)} が受けたコメント <span class="recvn">${items.length}</span>${items.length?`<span class="recvack">✓確認 ${ackd}/${items.length}</span>`:''}</div>`;
  if(!items.length)return h+`<div class="recvempty">受けたコメントはありません</div></div>`;
  h+=items.slice(0,80).map(x=>{
    const seen=Array.isArray(x.l.ack)&&x.l.ack.indexOf(person)>=0;
    const toL=(x.to==='ALL')?'<span class="cto">📢全員</span>':`<span class="cto">→ ${esc(person)}</span>`;
    const by=(x.l.by||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    const pn=person.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `<div class="recvrow ${seen?'seen':''}"><button class="recvchk ${seen?'on':''}" title="確認済みにする" onclick="ackRecv('${x.t.id}','${esc(x.l.at)}','${by}','${pn}')">✓</button><div class="recvbody" onclick="openTask('${x.t.id}')"><div class="recvmeta"><b>${esc(x.l.by||'?')}</b> ${toL} ・ ${esc(fmtAt(x.l.at))}</div><div class="recvtxt">${esc(x.l.text||((x.l.imgs&&x.l.imgs.length)?'🖼 画像':''))}</div><div class="recvtask">📌 ${esc(x.t.title||'(無題)')}</div></div></div>`;
  }).join('');
  return h+`</div>`;
}
async function ackRecv(taskId,at,by,person){
  try{
    let logs=null;
    try{const rows=await sbGet(TBL()+'?id=eq.'+encodeURIComponent(taskId)+'&select=logs');if(rows&&rows[0]&&Array.isArray(rows[0].logs))logs=rows[0].logs;}catch(e){}
    const t=TASKS.find(x=>x.id===taskId);
    if(logs===null)logs=(t&&Array.isArray(t.logs))?t.logs.slice():[];
    const idx=logs.findIndex(l=>l&&!l.type&&String(l.at)===String(at)&&String(l.by||'')===String(by));
    if(idx<0){toast('対象コメントが見つかりません');return;}
    const ack=Array.isArray(logs[idx].ack)?logs[idx].ack.slice():[];
    const p=ack.indexOf(person);if(p>=0)ack.splice(p,1);else ack.push(person);
    logs=logs.slice();logs[idx]=Object.assign({},logs[idx],{ack});
    if(t)t.logs=logs;
    await sbPatch(TBL(),taskId,{logs});
    render();
  }catch(e){toast('確認の更新に失敗しました');}
}

  }else{

async function sendBack(id){

  const nowIso=new Date().toISOString();

  const consultK=hasSt('consult')?'consult':fstK();
  let base=t.logs||[];try{const rows=await sbGet(TBL()+'?id=eq.'+encodeURIComponent(id)+'&select=logs');if(rows&&rows[0]&&Array.isArray(rows[0].logs))base=rows[0].logs;}catch(e){}

async function setField(id,field,val){
  const t=findT(id);if(!t)return;
  // ⑥ 対応中→完了 は、いったん依頼者の「チェック」へ回す（最終完了は依頼者が確定）
  if(field==='status'&&val==='done'&&t._st==='doing'){
    await ensureStatus(ST_CHECK);
    const who=(ME||'担当').trim();const now=new Date().toISOString();const req=(t.requester||'').trim();
    let base=t.logs||[];try{const rows=await sbGet(TBL()+'?id=eq.'+encodeURIComponent(id)+'&select=logs');if(rows&&rows[0]&&Array.isArray(rows[0].logs))base=rows[0].logs;}catch(e){}
    const logs=[...base,{type:'status',at:now,by:who,from:'対応中',to:'チェック'},{at:now,by:who,text:'🏁 対応完了 → 依頼者の最終チェック待ち'}];
    if(req&&(t.assignee||'')!==req)logs.push({type:'assign',at:now,by:who,from:t.assignee||'未割当',to:req});
    const patch={status:'check',logs};if(req)patch.assignee=req;
    t._st='check';t.status='check';if(req)t.assignee=req;t.logs=logs;render();if(SEL===id)openTask(id);
    try{await sbPatch(TBL(),id,patch);toast('依頼者へ最終チェックを依頼しました');}catch(e){toast('更新失敗');}
    return;
  }
  const before=t[field];
  t[field]=val;if(field==='status'){t._st=normStatus(val);if(val==='done'&&!t.completed_at)t.completed_at=new Date().toISOString();}
  const patch={};patch[field]=val;if(field==='status'&&val==='done')patch.completed_at=t.completed_at;
  // 「承認待ち」へ入れたら承認タブのpendingに（過去の判定はリセット）
  if(field==='status'&&val==='approval'){const a=appOf(t);const nb={...a,state:'pending',by:ME||'',at:new Date().toISOString(),decided_by:'',decided_at:''};t.approval=nb;patch.approval=nb;}
  // 監査ログ：状態変更・担当変更を記録（誰が・いつ・何→何）
  const who=(ME||'担当').trim();let evt=null;
  if(field==='status'&&before!==val){const fl=(ST(normStatus(before))||{}).l||before||'未設定';const tl=(ST(normStatus(val))||{}).l||val;evt={type:'status',at:new Date().toISOString(),by:who,from:fl,to:tl};}
  else if(field==='assignee'&&(before||'')!==(val||'')){evt={type:'assign',at:new Date().toISOString(),by:who,from:before||'未割当',to:val||'未割当'};}
  render();
  try{if(evt){await logEvent(id,evt,patch);}else{await sbPatch(TBL(),id,patch);}}catch(e){toast('更新失敗');}
}

function timelineHtml(srcRows){
  const f=(document.getElementById('filtSel')||{}).value||'open';
  let rows=srcRows||curTasks();
  if(f==='open')rows=rows.filter(t=>t._st!=='done');else if(f==='done')rows=rows.filter(t=>t._st==='done');
  if(!rows.length)return '<div class="empty">タスクがありません</div>';
  const MS=86400000,DAYW=40,LBLW=156;
  const today=new Date();today.setHours(0,0,0,0);
  const parse=s=>new Date(s+'T00:00:00');
  let ds=[];rows.forEach(t=>{if(t.start_date)ds.push(t.start_date);if(t.due_date)ds.push(t.due_date);});
  ds.sort();
  let min=ds.length?parse(ds[0]):new Date(today),max=ds.length?parse(ds[ds.length-1]):new Date(today);
  if(today<min)min=new Date(today);if(today>max)max=new Date(today);
  min=new Date(min.getTime()-2*MS);max=new Date(max.getTime()+3*MS);
  let nDays=Math.round((max-min)/MS)+1;if(nDays>180){nDays=180;max=new Date(min.getTime()+(nDays-1)*MS);}
  const col=iso=>Math.round((parse(iso)-min)/MS);
  const gw=nDays*DAYW;
  // ヘッダー（日付軸）
  let head=`<div class="g-row g-head"><div class="g-lbl g-corner">タスク</div><div class="g-track" style="width:${gw}px">`;
  for(let i=0;i<nDays;i++){const d=new Date(min.getTime()+i*MS),wd=d.getDay(),isT=d.getTime()===today.getTime();head+=`<div class="g-day ${wd===0?'sun':wd===6?'sat':''} ${isT?'today':''}" style="left:${i*DAYW}px;width:${DAYW}px">${d.getMonth()+1}/${d.getDate()}<span class="g-wd">${'日月火水木金土'[wd]}</span></div>`;}
  head+=`</div></div>`;
  // 今日ライン
  const todayLeft=LBLW+col(today.toISOString().slice(0,10))*DAYW+DAYW/2;
  const todayLine=`<div class="g-today" style="left:${todayLeft}px"></div>`;
  // プロジェクト別グループ
  const groups={};rows.forEach(t=>{const a=t.area||'一般';(groups[a]=groups[a]||[]).push(t);});
  let body='';
  Object.keys(groups).sort().forEach(a=>{
    body+=`<div class="g-grp"><span class="g-grp-in"><span class="pc" style="background:${pjColor(a)}"></span>${esc(a)} <span class="g-gn">${groups[a].length}</span></span></div>`;
    groups[a].sort((x,y)=>((x.due_date||x.start_date||'9999')+'').localeCompare((y.due_date||y.start_date||'9999')+'')).forEach(t=>{
      const st=ST(t._st),done=t._st==='done';const sd=t.start_date||t.due_date,ed=t.due_date||t.start_date;
      let bar='<span class="g-nodate">期日なし</span>';

function setupDnD(){
  const root=document.getElementById('taskList');if(!root||root._dnd)return;root._dnd=1;
  root.addEventListener('dragstart',e=>{const el=e.target.closest&&e.target.closest('[data-drag]');if(!el)return;DRAG={id:el.dataset.id};try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text','1');}catch(x){}el.classList.add('dragging');});
  root.addEventListener('dragend',()=>{DRAG=null;root.querySelectorAll('.dragging,.dragover').forEach(x=>x.classList.remove('dragging','dragover'));});
  root.addEventListener('dragover',e=>{const z=zoneFor(e.target);if(!z)return;e.preventDefault();root.querySelectorAll('.dragover').forEach(x=>{if(x!==z)x.classList.remove('dragover');});z.classList.add('dragover');});
  root.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-zone]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('dragover');});
  root.addEventListener('drop',e=>{const z=zoneFor(e.target);if(!z||!DRAG)return;e.preventDefault();const id=DRAG.id;z.classList.remove('dragover');applyZone(id,z);});
  // タッチ端末用ドラッグ（HTML5 dragはタッチ非対応）。長押し(350ms)で移動開始＝通常スワイプはスクロールのまま
  let TD=null,TDt=null;
  const tdClear=()=>{if(TDt){clearTimeout(TDt);TDt=null;}if(TD&&TD.el)TD.el.classList.remove('dragging');root.querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'));};
  root.addEventListener('touchstart',e=>{const el=e.target.closest&&e.target.closest('[data-drag]');if(!el){TD=null;return;}const t=e.touches[0];TD={id:el.dataset.id,el,x0:t.clientX,y0:t.clientY,ready:false,active:false};TDt=setTimeout(()=>{if(TD){TD.ready=true;TD.el.classList.add('dragging');try{navigator.vibrate&&navigator.vibrate(15);}catch(x){}}},350);},{passive:true});
  root.addEventListener('touchmove',e=>{if(!TD)return;const t=e.touches[0];
    if(!TD.ready){if(Math.abs(t.clientX-TD.x0)+Math.abs(t.clientY-TD.y0)>10){if(TDt){clearTimeout(TDt);TDt=null;}TD=null;}return;}
    TD.active=true;e.preventDefault();const tgt=document.elementFromPoint(t.clientX,t.clientY);const z=tgt&&tgt.closest&&tgt.closest('[data-zone]');root.querySelectorAll('.dragover').forEach(x=>{if(x!==z)x.classList.remove('dragover');});if(z)z.classList.add('dragover');},{passive:false});

  root.addEventListener('touchcancel',()=>{tdClear();TD=null;},{passive:true});
  root.addEventListener('click',e=>{if(root._suppressClick){root._suppressClick=false;e.stopPropagation();e.preventDefault();}},true);
}

    <div class="cmtbar"><input type="file" id="cmtImgInput" accept="image/*" multiple style="display:none" onchange="onCmtImgPick()"><button class="cmtimgbtn" onclick="document.getElementById('cmtImgInput').click()" title="画像を添付">📎</button><textarea id="cmtInput" rows="1" placeholder="コメントを書く…（改行=Enter / 送信=Shift+Enter）" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'" onkeydown="if(event.key==='Enter'&&event.shiftKey&&!event.isComposing&&event.keyCode!==229){event.preventDefault();addComment('${t.id}')}"></textarea><span id="cmtImgChip" class="cmtimgchip"></span><button onclick="addComment('${t.id}')">送信</button></div>`;
  d.classList.add('on');document.getElementById('scrim').classList.add('on');
  document.querySelectorAll('.trow').forEach(r=>r.classList.remove('sel'));
}
function closeDetail(){SEL=null;document.getElementById('detail').classList.remove('on');document.getElementById('scrim').classList.remove('on');render();}
function fmtAt(iso){try{const d=new Date(iso);const m=d.getMonth()+1,day=d.getDate(),hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0');return m+'/'+day+' '+hh+':'+mm;}catch(e){return '';}}

/* ---- init + poll（ログイン不要・anon） ---- */
setupDnD();
loadBusinesses().then(function(){ render(); load(); loadHQ(false); if(STORE===HQ_STORE)loadHqAll(true); });
setInterval(function(){ if(document.hidden)return; load(true); const hv=(CUR==='__hq'||CUR==='__hqcast'); loadHQ(hv); if(STORE===HQ_STORE&&!isEditing())loadHqAll(true); },10000);
// 復帰時に即同期（タブ復帰・オンライン復帰）＝更新の取りこぼし防止（入力中・変化なしは描画しない）
document.addEventListener('visibilitychange',function(){ if(!document.hidden){ load(true); loadHQ(CUR==='__hq'||CUR==='__hqcast'); } });
window.addEventListener('online',function(){ load(true); loadHQ(CUR==='__hq'||CUR==='__hqcast'); });
</script>
