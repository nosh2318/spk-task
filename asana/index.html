<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BUDDICA TOURING タスク</title>
<style>
:root{--accent:#796eff;--coral:#f06a6a;--ink:#1e1f21;--sub:#6b6f76;--line:#e8e8e9;--bg:#fafafa;--side:#2b2b2d}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;height:100dvh;overflow:hidden}
button{font-family:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:236px 1fr;height:100dvh}
/* ===== sidebar ===== */
.side{background:var(--side);color:#e6e6e8;display:flex;flex-direction:column;overflow:hidden}
.side .brand{display:flex;align-items:center;gap:8px;padding:14px 16px;font-weight:800;font-size:15px;color:#fff;flex-shrink:0}
.side .brand .dot{width:22px;height:22px;border-radius:7px;background:var(--coral);display:grid;place-items:center;color:#fff;font-size:13px}
.side .storesel{margin:0 12px 8px;padding:7px 9px;border-radius:8px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12);font-size:12px;font-weight:700;width:calc(100% - 24px)}
.side .sgrp{font-size:10px;font-weight:800;letter-spacing:.06em;color:#8b8d93;padding:12px 16px 5px}
.side .nav{flex:1;overflow-y:auto;padding-bottom:10px}
.side .pj{display:flex;align-items:center;gap:9px;padding:8px 16px;font-size:13px;color:#cfd0d4;cursor:pointer;border-left:3px solid transparent}
.side .pj:hover{background:rgba(255,255,255,.06)}
.side .pj.on{background:rgba(121,110,255,.18);color:#fff;border-left-color:var(--accent);font-weight:700}
.side .pj .pc{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.side .pj .cnt{margin-left:auto;font-size:11px;color:#8b8d93}
.side .addpj{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:12.5px;color:#9a9ca2;background:none;border:none;width:100%;text-align:left}
.side .addpj:hover{color:#fff}
.side .me{padding:10px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#9a9ca2;display:flex;align-items:center;gap:8px;flex-shrink:0}
.side .me input{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:6px;color:#fff;padding:5px 7px;font-size:12px}
/* ===== main ===== */
.main{display:flex;flex-direction:column;overflow:hidden;background:#fff}
.top{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);flex-shrink:0}
.top h1{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.top .pcdot{width:11px;height:11px;border-radius:4px}
.top .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.top .filt{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:700;color:var(--sub)}
.top .addbtn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 15px;font-weight:800;font-size:13px}
.list{flex:1;overflow-y:auto;padding:6px 0 60px}
.stsec{padding:14px 18px 2px}
.stsec .h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;margin-bottom:4px}
.stsec .h .chip{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px}
.stsec .h .n{color:var(--sub);font-weight:700}
.trow{display:flex;align-items:center;gap:11px;padding:9px 18px;border-bottom:1px solid #f3f3f4;cursor:pointer}
.trow:hover{background:#fafaff}
.trow.sel{background:#f3f1ff}
.chk{width:20px;height:20px;border-radius:50%;border:1.6px solid #cfd0d4;flex-shrink:0;display:grid;place-items:center;color:transparent;font-size:12px;background:#fff}
.chk.done{background:#16a34a;border-color:#16a34a;color:#fff}
.trow .ti{flex:1;min-width:0}
.trow .tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.cdone .tt{text-decoration:line-through;color:#9a9ca2}
.trow .meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--sub);margin-top:2px;flex-wrap:wrap}
.trow .av{width:22px;height:22px;border-radius:50%;background:#e4e2ff;color:#5b4eea;font-size:10px;font-weight:800;display:grid;place-items:center;flex-shrink:0}
.due{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:#f1f5f9;color:#475569}
.due.over{background:#fef2f2;color:#dc2626}
.due.today{background:#fffbeb;color:#b45309}
.cmt-badge{font-size:11px;color:#8b8d93;display:flex;align-items:center;gap:2px}
.empty{text-align:center;color:#9a9ca2;padding:40px 16px;font-size:13px}
.subs{display:flex;flex-direction:column;margin-top:4px}
.subrow{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid #f5f5f6}
.subrow .stt{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.subrow.d .stt{text-decoration:line-through;color:#9a9ca2}
.subrow .sst{font-size:10px;font-weight:800;padding:2px 7px;border-radius:10px;flex-shrink:0}
.subrow .sav{font-size:10px;color:#6b6f76;flex-shrink:0}
.subadd{margin-top:8px;background:#f3f1ff;color:#5b4eea;border:1px dashed #c9c3ff;border-radius:9px;padding:9px 11px;font-size:12.5px;font-weight:700;width:100%;text-align:left}
.bcrumb{display:block;font-size:12px;color:#5b4eea;background:none;border:none;padding:0;margin-bottom:8px;font-weight:700;text-align:left}
/* ===== board ===== */
.board{display:flex;gap:14px;padding:16px;overflow-x:auto;align-items:flex-start;height:100%}
.bcol{flex:0 0 300px;max-width:300px;background:#f3f4f6;border-radius:14px;display:flex;flex-direction:column;max-height:100%}
.bcol-h{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:800;font-size:14px;cursor:pointer;border-bottom:2px solid #e6e7ea}
.bcol-h .pd{width:11px;height:11px;border-radius:4px;flex-shrink:0}
.bcol-h .bn{margin-left:auto;font-size:11px;color:#9a9ca2;font-weight:700}
.bcol-body{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;min-height:60px}
.bcol-body.dragover{outline:2px dashed #796eff;outline-offset:-3px;border-radius:11px;background:#f5f3ff}
.bcard{background:#fff;border:1px solid #e8e8e9;border-radius:11px;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:11px 12px;cursor:pointer}
.bcard:hover{border-color:#c9c3ff}
.bcard.dragging{opacity:.35}
.bcard-t{font-size:13.5px;font-weight:700;line-height:1.35;margin-bottom:7px;word-break:break-word}
.bcard-m{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bcard-m .btag{font-size:10px;font-weight:800;border-radius:6px;padding:2px 7px}
.bcard-m .bsub{font-size:11px;color:#6b6f76;font-weight:700}
.bcard-m .bsp{flex:1}
.bcard-m .bwho{font-size:10px;color:#9a9ca2;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.bcard-m .bav{width:22px;height:22px;border-radius:50%;background:#e4e2ff;color:#5b4eea;font-size:10px;font-weight:800;display:grid;place-items:center;flex-shrink:0}
.baddsub{background:none;border:1px dashed #c9c3ff;color:#6b62e6;border-radius:8px;padding:8px;font-size:12px;font-weight:700;width:100%;text-align:center;margin-top:2px}
.bhint{font-size:11px;color:#9a9ca2;padding:8px 18px 0}
@media(max-width:768px){.bcol{flex-basis:82vw;max-width:82vw}}
/* ===== list (Asana風テーブル) ===== */
.ltbl{min-width:680px}
.lgrid{display:grid;grid-template-columns:26px 24px minmax(180px,1fr) 130px 84px 78px 120px;align-items:center}
.lhead,.lrow{display:grid;grid-template-columns:26px 24px minmax(180px,1fr) 130px 84px 78px 120px;align-items:center}
.lhead{padding:8px 16px;border-bottom:1px solid var(--line);font-size:11px;font-weight:800;color:#9a9ca2;position:sticky;top:0;background:#fff;z-index:2}
.lhead .lname{font-size:11px;font-weight:800}
.lgh{display:flex;align-items:center;gap:8px;padding:11px 16px 5px;cursor:pointer;font-size:12px;font-weight:800}
.lgh .lgtw{color:#9a9ca2;font-size:11px;width:12px}
.lgh .chip{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px}
.lgh .lgn{color:#9a9ca2}
.lrow{padding:7px 16px;border-bottom:1px solid #f3f3f4;cursor:default}
.lrow:hover{background:#fafaff}
.lrow.sel{background:#f3f1ff}
.lrow .ltw{display:flex;justify-content:center;padding-left:calc(var(--d,0)*16px)}
.lexp{background:none;border:none;color:#9a9ca2;font-size:11px;padding:2px;cursor:pointer}
.lchk{width:19px;height:19px;border-radius:50%;border:1.6px solid #cfd0d4;display:grid;place-items:center;color:transparent;font-size:11px;background:#fff;cursor:pointer}
.lchk.done{background:#16a34a;border-color:#16a34a;color:#fff}
.lname{min-width:0;display:flex;align-items:center;gap:7px;cursor:pointer}
.lname .lnt{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lsubn{font-size:11px;color:#8b8d93;font-weight:700;flex-shrink:0}
.lcol{font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;min-width:0}
.lasg .bav{width:22px;height:22px;border-radius:50%;background:#e4e2ff;color:#5b4eea;font-size:10px;font-weight:800;display:grid;place-items:center;flex-shrink:0}
.lasgn{font-size:12px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldash{color:#cfd0d4}
.lprio{font-size:11px;font-weight:800;padding:2px 9px;border-radius:8px}
.ltag .btag{font-size:10px;font-weight:800;border-radius:6px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.laddrow{padding:8px 16px 8px 50px;font-size:12px;color:#9a9ca2;cursor:pointer}
.laddrow:hover{color:#5b4eea}
/* ===== detail ===== */
.detail{position:fixed;top:0;right:0;width:420px;max-width:92vw;height:100dvh;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.12);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:.25s;z-index:50}
.detail.on{transform:none}
.detail .dh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
.detail .dh .x{background:none;border:none;font-size:20px;color:var(--sub);width:34px;height:34px;border-radius:8px}
.detail .dh .x:hover{background:#f1f1f2}
.detail .dh .cbtn{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px}
.detail .dh .cbtn.on{background:#16a34a;color:#fff;border-color:#16a34a}
.detail .db{flex:1;overflow-y:auto;padding:16px 18px}
.dtitle{font-size:18px;font-weight:800;width:100%;border:none;outline:none;resize:none;line-height:1.35;margin-bottom:14px}
.frow{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #f5f5f6}
.frow label{font-size:12px;font-weight:700;color:var(--sub)}
.frow select,.frow input{border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-size:13px;font-family:inherit;background:#fff;width:100%}
.statpills{display:flex;flex-wrap:wrap;gap:6px}
.statpill{font-size:12px;font-weight:800;padding:5px 11px;border-radius:20px;border:1.5px solid transparent;background:#f1f1f2;color:#6b6f76}
.statpill.on{border-style:solid}
.dsec-t{font-size:12px;font-weight:800;color:var(--sub);margin:16px 0 7px}
.ddesc{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;font-family:inherit;resize:vertical}
.cmts{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.cmt{display:flex;gap:9px}
.cmt .av{width:28px;height:28px;border-radius:50%;background:#e4e2ff;color:#5b4eea;font-size:11px;font-weight:800;display:grid;place-items:center;flex-shrink:0}
.cmt .cb{flex:1;min-width:0}
.cmt .cmeta{font-size:11px;color:#9a9ca2}
.cmt .cmeta b{color:var(--ink)}
.cmt .ctxt{font-size:13px;background:#f6f6f8;border-radius:10px;padding:8px 11px;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.cmtbar{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-shrink:0;background:#fff}
.cmtbar input{flex:1;border:1px solid var(--line);border-radius:20px;padding:9px 14px;font-size:13px}
.cmtbar button{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:0 16px;font-weight:800;font-size:13px}
.cmtby{border:1px solid var(--line);border-radius:14px;padding:0 6px;font-size:12px;max-width:96px;background:#fff;flex-shrink:0}
.ddel{margin-top:22px;background:none;border:1px solid #fecaca;color:#dc2626;border-radius:8px;padding:8px 13px;font-size:12px;font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:49;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
#memModal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px;pointer-events:none}
#memModal.on{display:flex;pointer-events:auto}
.mm-box{background:#fff;border-radius:16px;width:100%;max-width:380px;max-height:84vh;overflow-y:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mm-h{display:flex;align-items:center;margin-bottom:6px}.mm-h b{font-size:16px}.mm-x{margin-left:auto;background:none;border:none;font-size:18px;color:#9a9ca2}
.mm-sec{font-size:11px;font-weight:800;color:#6b6f76;margin:13px 0 6px}
.mm-chips{display:flex;flex-wrap:wrap;gap:6px}
.mm-chip{font-size:13px;font-weight:700;padding:7px 13px;border-radius:20px;background:#f1f1f2;color:#444;border:1.5px solid transparent}
.mm-chip.on{background:#eef0ff;color:#5b4eea;border-color:#5b4eea}
.mm-list{display:flex;flex-direction:column;gap:4px}
.mm-row{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:#f8f8fa;border-radius:8px;font-size:13px}
.mm-row button{background:none;border:none;color:#dc2626;font-size:12px;font-weight:700}
.mm-add{display:flex;gap:7px;margin-top:8px}
.mm-add input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px}
.mm-add button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0 14px;font-weight:800;font-size:13px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e1f21;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;z-index:200;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* ===== approval（承認・別枠） ===== */
.side .pj.appr.on{background:rgba(217,119,6,.20);border-left-color:#d97706}
.side .pj .abadge{margin-left:auto;background:#d97706;color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.apwrap{max-width:780px;margin:0 auto;padding:16px}
.apintro{font-size:12.5px;color:#6b6f76;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px 12px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;line-height:1.5}
.apintro .who{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:800;color:#9a3412}
.apintro select{border:1px solid #fed7aa;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:700;background:#fff}
.apcard{border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:11px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.apcard.pend{border-left:4px solid #d97706}
.apcard.appr{border-left:4px solid #16a34a;background:#f8fdf9}
.apcard.rej{border-left:4px solid #dc2626;background:#fef8f8}
.apcard .apt{font-size:14.5px;font-weight:800;cursor:pointer;word-break:break-word}
.apcard .apm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:11px;color:#6b6f76;font-weight:700;margin-top:6px}
.apcard .apdesc{font-size:12.5px;color:#475569;background:#f8f8fa;border-radius:8px;padding:8px 10px;margin-top:8px;white-space:pre-wrap;max-height:120px;overflow-y:auto}
.apcard .apcmts{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.apcard .apcmt{font-size:12px;background:#f6f6f8;border-radius:8px;padding:6px 9px;white-space:pre-wrap;word-break:break-word}
.apcard .apcmt b{color:var(--ink)}
.apact{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.apact input{flex:1;min-width:150px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px}
.apbtn{border:none;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:800;color:#fff}
.apbtn.ok{background:#16a34a}.apbtn.no{background:#dc2626}.apbtn.cm{background:#796eff}
.apbtn.re{background:#64748b}
.apverdict{font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;white-space:nowrap}
.apverdict.appr{background:#dcfce7;color:#15803d}.apverdict.rej{background:#fee2e2;color:#b91c1c}.apverdict.pend{background:#ffedd5;color:#c2410c}
.apsec{font-size:12px;font-weight:800;color:#9a9ca2;margin:18px 2px 8px}
.apflag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;background:#ffedd5;color:#c2410c}
.apflag.appr{background:#dcfce7;color:#15803d}.apflag.rej{background:#fee2e2;color:#b91c1c}
.aptoggle{display:flex;align-items:center;gap:8px;margin:12px 0 2px;flex-wrap:wrap}
.aptoggle .apl{font-size:12px;font-weight:800;color:var(--sub)}
.aptoggle button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:800;color:#6b6f76}
.aptoggle button.on{background:#fff7ed;border-color:#d97706;color:#c2410c}
/* ===== mobile ===== */
.mtabbar{display:none}
@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top h1{font-size:15px}
  .top .addbtn{padding:8px 12px}
  .pjchips{display:flex;gap:7px;overflow-x:auto;padding:9px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
  .pjchips::-webkit-scrollbar{display:none}
  .pjchip{flex:0 0 auto;font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:20px;background:#f1f1f2;color:#6b6f76;border:none;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .pjchip.on{background:var(--ink);color:#fff}
  .detail{width:100vw;max-width:100vw;border-left:none}
}
@media(min-width:761px){.pjchips{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="dot">✓</span> BUDDICA TOURING</div>
    <div class="sgrp">プロジェクト</div>
    <div class="nav" id="navProjects"></div>
    <button class="addpj" onclick="addProject()">＋ プロジェクトを追加</button>
  </aside>
  <main class="main">
    <div class="top">
      <h1><span class="pcdot" id="topDot"></span><span id="topTitle">全タスク</span></h1>
      <div class="sp">
        <button class="filt" id="viewBtn" onclick="toggleView()">🗂 ボード</button>
        <select class="filt" id="filtSel" onchange="render()">
          <option value="open">未完のみ</option>
          <option value="all">全部</option>
          <option value="done">完了</option>
        </select>
        <button class="addbtn" onclick="quickAdd()">＋ タスク</button>
      </div>
    </div>
    <div class="pjchips" id="pjChips"></div>
    <div class="list" id="taskList"><div class="empty">読み込み中…</div></div>
  </main>
</div>
<div class="scrim" id="scrim" onclick="closeDetail()"></div>

/* ---- auth + REST ---- */
function _ex(d){if(!d)return null;if(typeof d==='string')return d;if(d.access_token)return d.access_token;if(d.currentSession&&d.currentSession.access_token)return d.currentSession.access_token;if(d.session&&d.session.access_token)return d.session.access_token;if(Array.isArray(d)&&typeof d[0]==='string')return d[0];return null;}

function authH(){return 'Bearer '+(getTok()||SK);}/* anon可。ログイン済みならトークンも使う */
function ensureAuth(cb){if(getTok()){cb();return;}var ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';ov.innerHTML='<div style="background:#fff;padding:28px 24px;border-radius:16px;width:90%;max-width:340px;text-align:center"><div style="font-size:16px;font-weight:900;margin-bottom:14px">ログイン</div><input id="ae" type="email" autocapitalize="off" placeholder="メール" style="width:100%;padding:11px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;margin-bottom:8px"><input id="ap" type="password" placeholder="パスワード" style="width:100%;padding:11px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;margin-bottom:8px"><div id="aerr" style="color:#dc2626;font-size:12px;display:none;margin-bottom:8px"></div><button id="ab" style="width:100%;padding:12px;background:#796eff;color:#fff;border:none;border-radius:9px;font-weight:800">ログイン</button></div>';document.body.appendChild(ov);ov.addEventListener('keydown',e=>{if(e.key==='Enter')dl(cb,ov);});document.getElementById('ab').onclick=()=>dl(cb,ov);}
async function dl(cb,ov){var b=document.getElementById('ab'),er=document.getElementById('aerr');var em=(document.getElementById('ae')||{}).value||'',pw=(document.getElementById('ap')||{}).value||'';if(!em||!pw){er.style.display='';er.textContent='入力してください';return;}b.disabled=true;b.textContent='確認中...';try{var r=await fetch(SU+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SK,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})});var d=await r.json();if(d&&d.access_token){localStorage.setItem('sb-ckrxttbnawkclshczsia-auth-token',JSON.stringify({access_token:d.access_token,refresh_token:d.refresh_token||'',expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600),token_type:'bearer',user:d.user||{}}));if(!ME&&d.user&&d.user.email){ME=d.user.email.split('@')[0];localStorage.setItem('asana_me',ME);}ov.remove();cb();}else{er.style.display='';er.textContent='認証失敗';b.disabled=false;b.textContent='ログイン';}}catch(e){er.style.display='';er.textContent='接続エラー';b.disabled=false;b.textContent='ログイン';}}
async function sbGet(q){const r=await fetch(SU+'/rest/v1/'+q,{headers:{apikey:SK,Authorization:authH()}});if(!r.ok)return null;return r.json();}

async function load(){
  const rows=await sbGet(TBL()+'?deleted=eq.false&select=*&order=updated_at.desc');
  const memRow=(rows||[]).find(r=>r.id==='_members');
  MEMBERS=Array.isArray(memRow&&memRow.attachments)?memRow.attachments.filter(Boolean):[];
  const projRow=(rows||[]).find(r=>r.id==='_projects');
  PROJECTS=Array.isArray(projRow&&projRow.attachments)?projRow.attachments.filter(Boolean):[];
  const stRow=(rows||[]).find(r=>r.id==='_statuses');
  STATUSES=(Array.isArray(stRow&&stRow.attachments)&&stRow.attachments.filter(s=>s&&s.k&&s.l).length)?stRow.attachments.filter(s=>s&&s.k&&s.l):DEFAULT_STATUSES.map(s=>({...s}));
  TASKS=(rows||[]).filter(r=>r.id!=='_members'&&r.id!=='_projects'&&r.id!=='_statuses').map(t=>{const logs=Array.isArray(t.logs)?t.logs:[];const rq=logs.find(l=>l&&l.type==='req');return {...t,_st:normStatus(t.status),logs,requester:t.requester||(rq&&rq.by)||''};});

}
function projects(){
  const set={};TASKS.forEach(t=>{if(t.parent_id)return;const a=(t.area||'一般').trim()||'一般';set[a]=(set[a]||0)+1;});
  PROJECTS.forEach(a=>{if(a&&!(a in set))set[a]=0;});
  EXTRA_PJ.forEach(a=>{if(a&&!(a in set))set[a]=0;});
  if(!Object.keys(set).length)set['一般']=0;
  return Object.keys(set).sort().map(a=>({a,n:set[a]}));
}

async function addStatus(){var inp=document.getElementById('stInput');var n=(inp&&inp.value||'').trim();if(!n)return;if(STATUSES.some(function(s){return s.l===n;})){toast('同名のステータスがあります');return;}var pal=ST_PAL[STATUSES.length%ST_PAL.length];STATUSES.push({k:'st_'+Math.random().toString(36).slice(2,7),l:n,c:pal[0],bg:pal[1]});await saveStatuses();render();}
async function renameStatus(k){var s=STATUSES.find(function(x){return x.k===k;});if(!s)return;var nn=prompt('ステータス名を変更',s.l);if(nn===null)return;nn=nn.trim();if(!nn||nn===s.l)return;s.l=nn;await saveStatuses();render();}

async function delStatus(k){
  if(PROTECTED_ST.indexOf(k)>=0){toast('このステータスは削除できません（システムで使用）');return;}
  var s=STATUSES.find(function(x){return x.k===k;});
  var aff=TASKS.filter(function(t){return t._st===k;});
  var fb=hasSt('consult')?'consult':((STATUSES.find(function(x){return x.k!==k;})||{}).k||'consult');
  var fbl=(STATUSES.find(function(x){return x.k===fb;})||{}).l||fb;
  if(!confirm('ステータス「'+(s?s.l:k)+'」を削除しますか？'+(aff.length?'\n'+aff.length+'件のタスクは「'+fbl+'」へ移動します。':'')))return;
  STATUSES=STATUSES.filter(function(x){return x.k!==k;});
  aff.forEach(function(t){t.status=fb;t._st=fb;});
  await saveStatuses();render();
  try{await Promise.all(aff.map(function(t){return sbPatch(TBL(),t.id,{status:fb});}));toast('削除しました');}catch(e){toast('一部の反映に失敗');load();}
}
function children(id){return TASKS.filter(t=>t.parent_id===id).sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));}
function curTasks(){return TASKS.filter(t=>!t.parent_id&&(CUR==='__all'||(t.area||'一般')===CUR));}
function depthOf(t){let d=0,cur=t,g=0;while(cur&&cur.parent_id&&g++<10){cur=TASKS.find(x=>x.id===cur.parent_id);if(cur)d++;else break;}return d;}
function chainOf(t){const arr=[];let cur=t,g=0;while(cur&&cur.parent_id&&g++<10){const p=TASKS.find(x=>x.id===cur.parent_id);if(!p)break;arr.unshift(p);cur=p;}return arr;}

    `<button class="pjchip ${CUR==='__approval'?'on':''}" onclick="selPj('__approval')">🔖承認${pend?` (${pend})`:''}</button>`+
    pjs.map(p=>`<button class="pjchip ${CUR===p.a?'on':''}" onclick="selPj('${esc(p.a).replace(/'/g,"\\'")}')"><span style="width:8px;height:8px;border-radius:3px;background:${pjColor(p.a)};display:inline-block"></span>${esc(p.a)}</button>`).join('')+`<button class="pjchip ${CUR==='__admin'?'on':''}" onclick="selPj('__admin')">⚙️管理</button>`;
  const vb=document.getElementById('viewBtn');if(vb)vb.textContent=VIEW==='board'?'🗂 ボード':'📋 リスト';

let COLLAPSE={};let EXPAND={};
function toggleGroup(k){COLLAPSE[k]=!COLLAPSE[k];render();}
function toggleExp(id){EXPAND[id]=!EXPAND[id];render();}
function prioChip(p){p=p||'中';const c=p==='高'?['#fee2e2','#dc2626']:p==='低'?['#f1f5f9','#64748b']:['#fff7ed','#d97706'];return `<span class="lprio" style="background:${c[0]};color:${c[1]}">${esc(p)}</span>`;}
function lrow(t,depth){
  const st=ST(t._st);const done=t._st==='done';const subs=children(t.id);const has=subs.length>0;const exp=!!EXPAND[t.id];const subDone=subs.filter(s=>s._st==='done').length;
  let h=`<div class="lrow ${SEL===t.id?'sel':''}" style="--d:${depth}">`+
    `<span class="ltw">${has?`<button class="lexp" onclick="event.stopPropagation();toggleExp('${t.id}')">${exp?'▾':'▸'}</button>`:''}</span>`+
    `<span class="lchk ${done?'done':''}" onclick="event.stopPropagation();toggleDone('${t.id}')">✓</span>`+
    `<div class="lname" onclick="openTask('${t.id}')"><span class="lnt" style="${done?'text-decoration:line-through;color:#9a9ca2':''}">${esc(t.title)||'(無題)'}</span>${has?`<span class="lsubn">☑${subDone}/${subs.length}</span>`:''}${(t.logs||[]).filter(l=>!l||l.type!=='req').length?`<span class="lsubn">💬${(t.logs||[]).filter(l=>!l||l.type!=='req').length}</span>`:''}${apFlag(t)}</div>`+
    `<div class="lcol lasg" onclick="openTask('${t.id}')">${t.assignee?`<span class="bav">${esc(ini(t.assignee))}</span><span class="lasgn">${esc(t.assignee)}</span>`:'<span class="ldash">—</span>'}</div>`+
    `<div class="lcol ldue" onclick="openTask('${t.id}')">${t.due_date?`<span class="due ${dueClass(t.due_date)}">${dueLabel(t.due_date)}</span>`:'<span class="ldash">—</span>'}</div>`+
    `<div class="lcol" onclick="openTask('${t.id}')">${prioChip(t.priority)}</div>`+
    `<div class="lcol ltag" onclick="openTask('${t.id}')">${t.area?`<span class="btag" style="background:${pjColor(t.area)}1f;color:${pjColor(t.area)}">${esc(t.area)}</span>`:''}</div>`+
  `</div>`;
  if(has&&exp)subs.forEach(s=>{h+=lrow(s,depth+1);});
  return h;
}
function listHtml(){
  const filt=document.getElementById('filtSel').value;
  let rows=curTasks();
  if(filt==='open')rows=rows.filter(t=>t._st!=='done');
  else if(filt==='done')rows=rows.filter(t=>t._st==='done');
  let html='<div class="ltbl"><div class="lhead"><span class="ltw"></span><span class="lchk2"></span><div class="lname">名前</div><div class="lcol">担当</div><div class="lcol">期日</div><div class="lcol">優先度</div><div class="lcol ltag">プロジェクト</div></div>';
  STATUSES.forEach(s=>{
    const g=rows.filter(t=>t._st===s.k).sort((a,b)=>(a.due_date||'9999').localeCompare(b.due_date||'9999'));
    const col=!!COLLAPSE[s.k];
    html+=`<div class="lgh" onclick="toggleGroup('${s.k}')"><span class="lgtw">${col?'▸':'▾'}</span><span class="chip" style="background:${s.bg};color:${s.c}">${s.l}</span><span class="lgn">${g.length}</span></div>`;
    if(!col){g.forEach(t=>{html+=lrow(t,0);});html+=`<div class="laddrow" onclick="quickAddStatus('${s.k}')">＋ タスクを追加…</div>`;}
  });
  return html+'</div>';
}
function dueClass(d){if(!d)return '';const today=new Date().toISOString().slice(0,10);if(d<today)return 'over';if(d===today)return 'today';return '';}
function dueLabel(d){if(!d)return '';const md=d.slice(5).replace('-','/');return md;}
function taskRow(t){

    `<div class="ti"><div class="tt">${esc(t.title)||'(無題)'}</div>`+

        (cmt?`<span class="cmt-badge">💬${cmt}</span>`:'')+

    (t.assignee?`<div class="av" title="${esc(t.assignee)}">${esc(ini(t.assignee))}</div>`:'<div class="av" style="background:#f1f1f2;color:#b8b9bd">?</div>')+
  `</div>`;
}

function apCard(t,kind){
  const cmts=(t.logs||[]).filter(l=>l&&l.type!=='req');
  const lastCmts=cmts.slice(-3).map(c=>`<div class="apcmt"><b>${esc(c.by||'?')}</b> ${esc(c.text)}</div>`).join('');
  const verdict=kind==='appr'?'<span class="apverdict appr">✅ 承認済</span>':kind==='rej'?'<span class="apverdict rej">⛔ 却下</span>':'<span class="apverdict pend">⏳ 承認待ち</span>';
  const ap=appOf(t);
  const decided=ap.decided_by?`<span>判定: ${esc(ap.decided_by)} ・ ${esc(fmtAt(ap.decided_at||''))}</span>`:'';

async function setApprovalFlag(id,on){
  const t=TASKS.find(x=>x.id===id);if(!t)return;
  const a=appOf(t);
  if(on){
    const nb={...a,state:'pending',by:ME||'',at:new Date().toISOString(),decided_by:'',decided_at:''};
    t.approval=nb;t._st='approval';t.status='approval';if(SEL===id)openTask(id);render();
    try{await sbPatch(TBL(),id,{approval:nb,status:'approval'});}catch(e){toast('承認列が未作成です（SQLをRUN）');}
  }else{
    const nb={...a,state:''};t.approval=nb;if(t._st==='approval'){t._st='consult';t.status='consult';}
    if(SEL===id)openTask(id);render();
    try{await sbPatch(TBL(),id,{approval:nb,status:t.status});}catch(e){toast('保存失敗');}
  }

async function decide(id,verdict){
  const t=TASKS.find(x=>x.id===id);if(!t)return;
  const sel=document.getElementById('apDecider');const who=((sel&&sel.value)||localStorage.getItem('asana_decider')||ME||'').trim();
  if(!who){toast('決済者を選んでください');return;}
  const inp=document.getElementById('apc_'+id);const note=((inp&&inp.value)||'').trim();
  const nowIso=new Date().toISOString();
  const a=appOf(t);const nb={...a,required:true,state:verdict,decided_by:who,decided_at:nowIso};
  const logs=[...(t.logs||[]),{at:nowIso,by:who,text:(verdict==='approved'?'✅ 承認':'⛔ 却下')+(note?'：'+note:'')}];
  const patch={approval:nb,logs};
  // 承認＝進行OK / 却下＝保留 に状態も連動（最低限のやり取りで前へ進む）
  if(verdict==='approved'){patch.admin_confirmed=true;t.admin_confirmed=true;if(t._st==='approval'||t._st==='consult'){patch.status='go';t._st='go';t.status='go';}}
  else{if(t._st==='approval'||t._st==='consult'){patch.status='hold';t._st='hold';t.status='hold';}}
  t.approval=nb;t.logs=logs;render();if(SEL===id)openTask(id);
  try{await sbPatch(TBL(),id,patch);toast(verdict==='approved'?'承認しました':'却下しました');}catch(e){toast('保存失敗（承認列のSQL未RUN?）');load();}
}

function setupDnD(){
  const root=document.getElementById('taskList');if(!root||root._dnd)return;root._dnd=1;
  root.addEventListener('dragstart',e=>{const el=e.target.closest&&e.target.closest('[data-drag]');if(!el)return;DRAG={id:el.dataset.id};try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text','1');}catch(x){}el.classList.add('dragging');});
  root.addEventListener('dragend',()=>{DRAG=null;root.querySelectorAll('.dragging,.dragover').forEach(x=>x.classList.remove('dragging','dragover'));});
  root.addEventListener('dragover',e=>{const z=zoneFor(e.target);if(!z)return;e.preventDefault();root.querySelectorAll('.dragover').forEach(x=>{if(x!==z)x.classList.remove('dragover');});z.classList.add('dragover');});
  root.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-zone]');if(z&&!z.contains(e.relatedTarget))z.classList.remove('dragover');});
  root.addEventListener('drop',e=>{const z=zoneFor(e.target);if(!z||!DRAG)return;e.preventDefault();const id=DRAG.id,ns=z.dataset.status;z.classList.remove('dragover');const t=TASKS.find(x=>x.id===id);if(t&&t._st!==ns)setField(id,'status',ns);});
}

  const p0=TASKS.find(x=>x.id===parentId);const lbl=SUBLBL[depthOf(p0)]||'サブタスク';
  const title=prompt(lbl+'（依頼内容）');if(!title||!title.trim())return;
  const p=TASKS.find(x=>x.id===parentId);const now=new Date().toISOString();
  const reqlog={type:'req',by:'',at:now,text:title.trim()};
  const row={id:uid(),store:STORE,area:(p&&p.area)||'一般',title:title.trim(),requester:'',assignee:'',parent_id:parentId,status:'consult',priority:'中',progress:0,description:'',logs:[reqlog],attachments:[],admin_confirmed:false,deleted:false,created_at:now};
  try{const r=await sbPost(TBL(),row);const saved=(r&&r[0])||row;TASKS.push({...saved,_st:'consult',logs:[reqlog],requester:''});openTask(parentId);render();}
  catch(e){toast('保存失敗: '+e.message);}
}
function openTask(id){
  const t=TASKS.find(x=>x.id===id);if(!t)return;SEL=id;
  const d=document.getElementById('detail');
  const depth=depthOf(t);const chain=chainOf(t);
  const canSub=depth<2;            // 親(0)・子(1)はサブを持てる、孫(2)は不可＝3層まで
  const subLbl=SUBLBL[depth]||'サブタスク';
  const subs=canSub?children(t.id):[];
  const subHtml=!canSub?'':`<div class="dsec-t">☑ ${subLbl}${subs.length?` ・ 進行 ${subs.filter(s=>s._st==='done').length}/${subs.length}`:''}</div><div class="subs">${subs.map(subRow).join('')||'<div style="font-size:12px;color:#9a9ca2;padding:4px 0">'+subLbl+'を分けると、誰が何に回答すべきか一目で分かります</div>'}</div><button class="subadd" onclick="addSubtask('${t.id}')">＋ ${subLbl}を追加（個別に依頼/回答）</button>`;
  const bcrumb=chain.length?`<div style="margin-bottom:8px;font-size:12px;font-weight:700;line-height:1.6">${chain.map(p=>`<span onclick="openTask('${p.id}')" style="color:#5b4eea;cursor:pointer">${esc(p.title)||'(無題)'}</span>`).join(' <span style="color:#c9c3ff">›</span> ')} <span style="color:#c9c3ff">›</span> <span style="color:#9a9ca2">${esc(t.title)||'(無題)'}</span></div>`:'';
  const cmts=(t.logs||[]).map(c=>{
    if(c.type==='req')return `<div class="cmt"><div class="av" style="background:#eef2ff;color:#6366f1">📨</div><div class="cb"><div class="cmeta"><b>${esc(c.by)}</b> が依頼 ・ ${esc(fmtAt(c.at))}</div><div class="ctxt" style="background:#eef2ff">${esc(c.text)}</div></div></div>`;
    return `<div class="cmt"><div class="av">${esc(ini(c.by))}</div><div class="cb"><div class="cmeta"><b>${esc(c.by)}</b> ・ ${esc(fmtAt(c.at))}</div><div class="ctxt">${esc(c.text)}</div></div></div>`;
  }).join('')||'<div style="font-size:12px;color:#9a9ca2">まだコメントはありません</div>';
  const pjOpts=projects().map(p=>`<option value="${esc(p.a)}" ${(t.area||'一般')===p.a?'selected':''}>${esc(p.a)}</option>`).join('');
  const apOn=isApprPending(t);const apSt=apDecision(t);
  d.innerHTML=`
    <div class="dh">
      <button class="x" onclick="closeDetail()">✕</button>
      <button class="cbtn ${t.admin_confirmed?'on':''}" onclick="toggleConfirm('${t.id}')">${t.admin_confirmed?'✓ 確認済（進行OK）':'☐ 確認チェック'}</button>
    </div>
    <div class="db">
      ${bcrumb}
      <textarea class="dtitle" id="dTitle" rows="1" onchange="setField('${t.id}','title',this.value)">${esc(t.title)}</textarea>
      <div style="font-size:11px;color:#9a9ca2;margin:-8px 0 10px">✓ 各項目は変更するとその場で自動保存されます（保存ボタン不要）</div>
      <div class="statpills">${STATUSES.map(s=>`<button class="statpill ${t._st===s.k?'on':''}" style="${t._st===s.k?('background:'+s.bg+';color:'+s.c+';border-color:'+s.c):''}" onclick="setField('${t.id}','status','${s.k}')">${s.l}</button>`).join('')}</div>
      <div class="aptoggle"><span class="apl">承認</span><button class="${apOn?'on':''}" onclick="setApprovalFlag('${t.id}',${apOn?'false':'true'})">${apOn?'🔖 承認待ち（承認タブに表示中）':'🔖 承認に出す'}</button>${apOn?'<span class="apverdict pend">⏳ 承認待ち</span>':(apSt==='approved'?'<span class="apverdict appr">✅ 承認済</span>':apSt==='rejected'?'<span class="apverdict rej">⛔ 却下</span>':'')}</div>
      <div style="height:10px"></div>
      <div class="frow"><label>依頼者</label><select onchange="setField('${t.id}','requester',this.value)">${memberOpts(t.requester||'')}</select></div>
      <div class="frow"><label>担当(回答)</label><select onchange="setField('${t.id}','assignee',this.value)">${memberOpts(t.assignee||'')}</select></div>
      <div class="frow"><label>期限</label><input type="date" value="${esc(t.due_date||'')}" onchange="setField('${t.id}','due_date',this.value)"></div>
      <div class="frow"><label>優先度</label><select onchange="setField('${t.id}','priority',this.value)">${['低','中','高'].map(p=>`<option ${(t.priority||'中')===p?'selected':''}>${p}</option>`).join('')}</select></div>
      <div class="frow"><label>プロジェクト</label><select onchange="setField('${t.id}','area',this.value)">${pjOpts}</select></div>
      <div class="dsec-t">説明</div>
      <textarea class="ddesc" placeholder="詳細を書く…" onchange="setField('${t.id}','description',this.value)">${esc(t.description||'')}</textarea>
      ${subHtml}
      <div class="dsec-t">💬 コメント（やり取り）</div>
      <div class="cmts">${cmts}</div>
      <button class="ddel" onclick="delTask('${t.id}')">🗑 タスクを削除</button>
    </div>
    <div class="cmtbar"><select id="cmtBy" class="cmtby" title="投稿者">${memberOpts(localStorage.getItem('asana_cmt_by')||ME||'')}</select><input id="cmtInput" placeholder="コメントを書く…" onkeydown="if(event.key==='Enter'){event.preventDefault();addComment('${t.id}')}"><button onclick="addComment('${t.id}')">送信</button></div>`;
  d.classList.add('on');document.getElementById('scrim').classList.add('on');
  document.querySelectorAll('.trow').forEach(r=>r.classList.remove('sel'));
}
function closeDetail(){SEL=null;document.getElementById('detail').classList.remove('on');document.getElementById('scrim').classList.remove('on');render();}
function fmtAt(iso){try{const d=new Date(iso);const m=d.getMonth()+1,day=d.getDate(),hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0');return m+'/'+day+' '+hh+':'+mm;}catch(e){return '';}}

/* ---- init + poll（ログイン不要・anon） ---- */
setupDnD();
load(); setInterval(function(){ if(!document.hidden) load(); },15000);
</script>
</body>
</html>
