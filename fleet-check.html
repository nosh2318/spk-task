<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>車両管理チェック｜HANDYMAN</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#f1f5f9;color:#0f172a;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;font-size:14px}
  .wrap{max-width:1180px;margin:0 auto;padding:12px}
  h1{font-size:18px;margin:0 0 2px;font-weight:900}
  .sub{font-size:12px;color:#64748b;margin-bottom:8px}
  .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
  .bar .stg{font-size:13px;background:#fff;color:#334155;border:1px solid #cbd5e1;border-radius:999px;padding:6px 15px;cursor:pointer;font-weight:800}
  .bar .stg.on{background:#2563eb;color:#fff;border-color:#1d4ed8}
  .bar input{flex:1;min-width:150px;background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:8px 11px;font-size:14px}
  .cnt{font-size:12px;color:#64748b;margin-left:auto;font-weight:700}
  .help{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:12.5px;color:#1e40af;line-height:1.7}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  thead th{background:#f8fafc;font-size:11px;color:#64748b;font-weight:800;padding:8px 6px;text-align:left;border-bottom:1px solid #e2e8f0;white-space:nowrap}
  tbody td{padding:8px 6px;border-bottom:1px solid #f1f5f9;font-size:13px;vertical-align:middle}
  tr.clsgrp td{background:#eef2f7;font-weight:800;color:#0f172a;padding:6px 10px;border-top:3px solid var(--cc);font-size:12px}
  tr.clsgrp .cbadge{display:inline-block;color:#fff;padding:1px 9px;border-radius:5px;font-weight:900;margin-right:8px}
  tr.clsgrp .ccount{color:#64748b;font-weight:700;font-size:11px;margin-left:8px}
  .nm{font-weight:800}
  .pl{font-family:ui-monospace,monospace;font-weight:800;background:#0e1830;color:#bfe3ff;border-radius:6px;padding:2px 8px;font-size:13px;white-space:nowrap}
  .mil{font-weight:800;color:#0f766e}.mil.z{color:#cbd5e1;font-weight:600}
  .etcm{font-size:12px;color:#334155}.etcm .th{width:34px;height:26px;object-fit:cover;border-radius:5px;border:1px solid #cbd5e1;cursor:pointer;vertical-align:middle;margin-left:4px}
  .dmg{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;cursor:pointer;text-decoration:none;white-space:nowrap}
  .dmg.has{background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5}
  .dmg.none{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
  .dmg.na{background:#f1f5f9;color:#94a3b8;border:1px solid #e2e8f0;cursor:default}
  .rec{display:flex;gap:3px}
  .rec i{font-style:normal;font-size:13px;opacity:.22;filter:grayscale(1)}
  .rec i.on{opacity:1;filter:none}
  @keyframes mtblink{0%,100%{background:#eff6ff;box-shadow:0 0 0 0 rgba(37,99,235,.45);border-color:#bfdbfe}50%{background:#bfdbfe;box-shadow:0 0 0 5px rgba(37,99,235,0);border-color:#60a5fa}}
  .mtoggle{display:inline-flex;align-items:center;gap:4px;cursor:pointer;color:#1d4ed8;background:#eff6ff;border:1px solid #bfdbfe;border-radius:999px;padding:3px 11px;font-size:11px;font-weight:800;white-space:nowrap;animation:mtblink 1.5s ease-in-out infinite}
  .mtoggle:hover{background:#dbeafe;animation:none}
  .mtoggle b{display:inline-block;font-size:9px;transition:transform .15s}
  tr.open .mtoggle{background:#dbeafe;border-color:#93c5fd;animation:none;box-shadow:none}
  tr.open .mtoggle b{transform:rotate(180deg)}
  tr.detailrow{display:none}
  tr.grpRow.open + tr.detailrow{display:table-row}
  tr.detailrow>td{padding:0;background:#f8fafc;border-left:3px solid var(--cc);border-right:3px solid var(--cc);border-bottom:3px solid var(--cc)}
  .pd{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding:14px 16px 16px}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld.full{grid-column:1 / -1}
  .fld label{font-size:12px;font-weight:900;color:#0f172a;display:flex;align-items:center;gap:6px}
  .fld label .tag{font-size:10px;font-weight:800;color:#fff;background:#64748b;border-radius:5px;padding:1px 6px}
  .fld textarea,.fld input[type=text]{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;line-height:1.6;resize:vertical;background:#fff}
  .fld textarea{min-height:42px}
  .imgs{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .imgs .im{position:relative;width:66px;height:52px}
  .imgs .im img{width:66px;height:52px;object-fit:cover;border-radius:7px;border:1px solid #cbd5e1;cursor:pointer}
  .imgs .im .x{position:absolute;top:-6px;right:-6px;width:19px;height:19px;border-radius:50%;background:#dc2626;color:#fff;font-size:12px;line-height:19px;text-align:center;cursor:pointer;border:2px solid #fff;font-weight:800}
  .imgs .add{width:66px;height:52px;border:1.5px dashed #93c5fd;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#2563eb;font-size:20px;cursor:pointer;background:#f8fafc;flex-direction:column;gap:0}
  .imgs .add small{font-size:9px;font-weight:800}
  .etcbox{background:#ecfeff;border:1px solid #a5f3fc;border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .etcbox .l{font-size:11px;color:#0e7490;font-weight:800}.etcbox .v{font-size:14px;font-weight:800}
  .etcbox img{width:52px;height:40px;object-fit:cover;border-radius:6px;border:1px solid #a5f3fc;cursor:pointer;margin-left:auto}
  .dbtn{display:inline-flex;align-items:center;gap:6px;background:#1e293b;color:#fff;border:none;border-radius:8px;padding:8px 13px;font-size:13px;font-weight:800;cursor:pointer;text-decoration:none;width:fit-content}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
  .lb.open{display:flex}.lb img{max-width:100%;max-height:100%;border-radius:8px}
  #st{position:fixed;bottom:12px;left:12px;background:#0f172a;color:#fff;font-size:11px;padding:5px 10px;border-radius:8px;opacity:.85;z-index:70}
  #reload{position:fixed;right:16px;bottom:16px;z-index:60;width:52px;height:52px;border-radius:50%;background:#2563eb;color:#fff;border:none;font-size:22px;box-shadow:0 4px 12px rgba(37,99,235,.4);cursor:pointer}
  #reload.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .empty{text-align:center;color:#94a3b8;padding:30px;font-size:13px}
  @media(max-width:720px){
    .wrap{padding:8px}
    thead{display:none}
    tbody,tr,td{display:block}
    tr.grpRow{border:1px solid #e2e8f0;border-radius:12px;margin:8px 0;padding:8px 10px 10px;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.05);background:#fff}
    tr.grpRow td{border:none;padding:3px 0;display:flex;align-items:center;gap:8px}
    tr.grpRow td:before{content:attr(data-lb);font-size:11px;color:#94a3b8;font-weight:800;min-width:52px;flex-shrink:0}
    td.noNo{position:absolute;top:8px;right:12px;padding:0;color:#94a3b8;font-weight:800}
    td.noNo:before{content:""}
    tr.detailrow{margin:-6px 0 10px}
    tr.grpRow.open + tr.detailrow{display:block}
    tr.detailrow>td{display:block;border-radius:0 0 12px 12px}
    tr.detailrow>td:before{content:""}
    .pd{grid-template-columns:1fr;padding:12px}
    tr.clsgrp td{display:block}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🚗 車両管理チェック</h1>
  <div class="sub" id="sub">読み込み中…</div>
  <div class="bar">
    <span class="stg" data-s="nha">🌺 那覇</span>
    <span class="stg on" data-s="spk">❄️ 札幌</span>
    <input id="q" placeholder="🔍 車両名・ナンバー・クラスで検索">
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="help">💡 各車の <b style="background:#dbeafe;border-radius:999px;padding:1px 8px;white-space:nowrap">📋 チェック ▾</b> をタップすると、<b>ETC箇所・ナビ・内装・タイヤ・インパクト</b>の状態と<b>写真</b>、<b>傷チェック</b>を記録・確認できます（車両名/ナンバー/年式/走行/ETC/傷は各店マスタから自動引用）。</div>
  <table><tbody id="tb"><tr><td class="empty">読み込み中…</td></tr></tbody></table>
</div>
<button id="reload" title="最新に更新">🔄</button>
<div id="st">接続中…</div>
<div class="lb" id="lb" onclick="this.classList.remove('open')"><img id="lbimg"></div>
<script>
const SB='https://ckrxttbnawkclshczsia.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
const BUCKET='memo-images', DMGV='https://nosh2318.github.io/handyman-damage/v.html?t=';
const CLSCOL={A:'#7c3aed',A2:'#6d28d9',B:'#0284c7',B2:'#0369a1',C:'#059669',D:'#0d9488',S:'#d97706',F:'#db2777',G:'#65a30d',H:'#64748b',E:'#4f46e5'};
const CLSLBL={A:'ラグジュアリーミニバン',A2:'ラグジュアリーミニバン',B:'ミニバン',B2:'ミニバン',C:'ミニバン',D:'SUV',E:'セダン/HV',F:'コンパクトSUV',G:'コンパクト',H:'コンパクト/ハイトワゴン',S:'SUV'};
let store=(new URLSearchParams(location.search).get('store')||'spk'), VEH=[], CHK={}, q='', openRows=new Set();
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H=(u,o)=>fetch(SB+u,Object.assign({headers:{apikey:ANON,Authorization:'Bearer '+ANON,'Content-Type':'application/json'}},o||{}));
function setStatus(t){$('st').textContent=t;}
function rpc(fn,body){return H('/rest/v1/rpc/'+fn,{method:'POST',body:JSON.stringify(body||{})}).then(r=>r.json()).catch(()=>[]);}

/* ===== 読み込み ===== */
async function load(){
  setStatus('読み込み中…');
  const [veh,chk]=await Promise.all([
    rpc('fleet_master_ext',{p_store:store}),
    H('/rest/v1/fleet_check?store=eq.'+store+'&select=*').then(r=>r.json()).catch(()=>[])
  ]);
  VEH=Array.isArray(veh)?veh:[];
  CHK={}; (Array.isArray(chk)?chk:[]).forEach(c=>{CHK[c.vehicle_code]=c;});
  const named=store==='nha'?'🌺 那覇':'❄️ 札幌';
  $('sub').textContent=named+'　'+VEH.length+'台　（車両マスタ＋走行/ETC/傷チェック連携）';
  render(); setStatus('接続OK');
}
/* fleet_check行を取得(なければ空) */
function ck(code){return CHK[code]||{store,vehicle_code:code,nav_images:[],interior_images:[],tire_images:[],impact_images:[]};}
function imgsOf(c,f){const v=(CHK[c]||{})[f];return Array.isArray(v)?v:[];}
function hasData(code){const c=CHK[code];if(!c)return{};return{nav:!!(c.nav_state||(c.nav_images||[]).length),interior:!!(c.interior_state||(c.interior_images||[]).length),tire:!!(c.tire_state||(c.tire_images||[]).length),impact:!!(c.impact_state||(c.impact_images||[]).length)};}

/* ===== 保存(1項目だけ・merge-duplicates) ===== */
async function save(code,field,val){
  const cur=CHK[code]||{store,vehicle_code:code};
  cur[field]=val; CHK[code]=cur;
  const body={store,vehicle_code:code,updated_at:new Date().toISOString()}; body[field]=val;
  const r=await H('/rest/v1/fleet_check?on_conflict=store,vehicle_code',{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+ANON,'Content-Type':'application/json',Prefer:'return=minimal,resolution=merge-duplicates'},body:JSON.stringify(body)});
  if(!r.ok){setStatus('⚠️保存失敗');return false;}
  setStatus('保存OK '+new Date().toLocaleTimeString('ja-JP').slice(0,5)); return true;
}
/* ===== 画像: 縮小→アップ→配列に追加(競合防止で最新配列を再取得してから追加) ===== */
function resize(file){return new Promise(res=>{const img=new Image();img.onload=()=>{let{width:w,height:h}=img;const mx=1280;if(w>mx||h>mx){if(w>h){h=Math.round(h*mx/w);w=mx;}else{w=Math.round(w*mx/h);h=mx;}}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);cv.toBlob(b=>res(b),'image/jpeg',.82);};img.src=URL.createObjectURL(file);});}
async function addImg(code,field,file){
  setStatus('画像アップ中…');
  const blob=await resize(file);
  const ts=Date.now()+'_'+Math.floor(performance.now());
  const path='fleet/'+store+'/'+encodeURIComponent(code)+'/'+field+'/'+ts+'.jpg';
  const up=await fetch(SB+'/storage/v1/object/'+BUCKET+'/'+path,{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+ANON,'Content-Type':'image/jpeg'},body:blob});
  if(!up.ok){setStatus('⚠️画像アップ失敗');alert('画像アップロードに失敗しました');return;}
  const url=SB+'/storage/v1/object/public/'+BUCKET+'/'+path;
  // 最新のimages配列を再取得してから追加（他人の追加を消さない）
  const fresh=await H('/rest/v1/fleet_check?store=eq.'+store+'&vehicle_code=eq.'+encodeURIComponent(code)+'&select='+field+'_images').then(r=>r.json()).catch(()=>[]);
  let arr=(fresh&&fresh[0]&&Array.isArray(fresh[0][field+'_images']))?fresh[0][field+'_images']:imgsOf(code,field);
  arr=arr.concat([url]);
  await save(code,field+'_images',arr);
  render();
}
async function delImg(code,field,url){
  if(!confirm('この写真を削除しますか？'))return;
  const arr=imgsOf(code,field).filter(u=>u!==url);
  await save(code,field+'_images',arr); render();
}
window.openLb=u=>{$('lbimg').src=u;$('lb').classList.add('open');};

/* ===== 画像フィールドHTML ===== */
function imgField(code,field){
  const arr=imgsOf(code,field);
  const thumbs=arr.map(u=>`<div class="im"><img src="${esc(u)}" onclick="openLb('${esc(u)}')"><span class="x" data-del="${field}" data-url="${esc(u)}">×</span></div>`).join('');
  return `<div class="imgs" data-imgf="${field}" data-code="${esc(code)}">${thumbs}<label class="add">📷<small>追加</small><input type="file" accept="image/*" capture="environment" style="display:none" data-imgadd="${field}"></label></div>`;
}

/* ===== 描画 ===== */
function render(){
  let list=VEH.slice();
  if(q){const qq=q.toLowerCase();list=list.filter(v=>((v.name||'')+(v.plate||'')+(v.cls||'')).toLowerCase().includes(qq));}
  const byCls={};list.forEach(v=>{(byCls[v.cls||'—']=byCls[v.cls||'—']||[]).push(v);});
  const cls=Object.keys(byCls).sort();
  let no=0,html='';
  cls.forEach(c=>{
    const col=CLSCOL[c]||'#64748b';
    html+=`<tr class="clsgrp" style="--cc:${col}"><td colspan="9"><span class="cbadge" style="background:${col}">${c||'—'}</span>${CLSLBL[c]||''}<span class="ccount">${byCls[c].length}台</span></td></tr>`;
    byCls[c].forEach(v=>{
      no++;const code=v.code;const hd=hasData(code);const cc=CHK[code]||{};
      const mil=(v.mileage!=null&&v.mileage>0)?`<span class="mil">${Number(v.mileage).toLocaleString()}km</span>`:`<span class="mil z">未記録</span>`;
      const etc=(v.etc_loc||v.etc_img||cc.etc_note)?`<span class="etcm">${esc(v.etc_loc||cc.etc_note||'（写真）')}${v.etc_img?`<img class="th" src="${esc(v.etc_img)}" onclick="openLb('${esc(v.etc_img)}')">`:''}</span>`:`<span class="mil z">—</span>`;
      const dmg=v.share_token?`<a class="dmg ${v.dmg>0?'has':'none'}" href="${DMGV}${v.share_token}" target="_blank" rel="noopener">🩹 ${v.dmg>0?v.dmg+'件':'なし'}</a>`:`<span class="dmg na">未発行</span>`;
      const rec=`<div class="rec" title="記録状況(ナビ/内装/タイヤ/衝撃)"><i class="${hd.nav?'on':''}">🧭</i><i class="${hd.interior?'on':''}">💺</i><i class="${hd.tire?'on':''}">🛞</i><i class="${hd.impact?'on':''}">💥</i></div>`;
      html+=`<tr class="grpRow ${openRows.has(code)?'open':''}" data-code="${esc(code)}" style="--cc:${col}">
        <td class="noNo">#${no}</td>
        <td data-lb="車両名"><span class="nm">${esc(v.name)||'—'}</span></td>
        <td data-lb="クラス"><span class="cbadge" style="background:${col};color:#fff;padding:1px 8px;border-radius:5px;font-weight:900;font-size:11px">${c||'—'}</span></td>
        <td data-lb="ナンバー"><span class="pl">${esc(v.plate)||'—'}</span></td>
        <td data-lb="年式">${esc(v.year)||'—'}</td>
        <td data-lb="走行">${mil}</td>
        <td data-lb="ETC">${etc}</td>
        <td data-lb="傷">${dmg}</td>
        <td data-lb="記録" style="display:flex;gap:8px;align-items:center;justify-content:flex-end">${rec}<span class="mtoggle" title="タップで詳細チェックを開く">📋 チェック <b>▾</b></span></td>
      </tr>
      <tr class="detailrow" data-code="${esc(code)}" style="--cc:${col}"><td colspan="9"><div class="pd">
        <div class="fld full">
          <label>⑤ ETC箇所 <span class="tag">マスタ</span></label>
          ${(v.etc_loc||v.etc_img)?`<div class="etcbox"><div><div class="l">📍 設置場所（マスタ）</div><div class="v">${esc(v.etc_loc||'（写真参照）')}</div></div>${v.etc_img?`<img src="${esc(v.etc_img)}" onclick="openLb('${esc(v.etc_img)}')">`:''}</div>`:''}
          <input type="text" data-f="etc_note" placeholder="ETC箇所の補足メモ（マスタに無い場合はここに記入）" value="${esc(cc.etc_note)}">
        </div>
        <div class="fld"><label>⑥ ナビ状態</label><textarea data-f="nav_state" placeholder="ナビの状態・型番・不具合など">${esc(cc.nav_state)}</textarea>${imgField(code,'nav')}</div>
        <div class="fld"><label>⑦ 内装状態</label><textarea data-f="interior_state" placeholder="内装の状態・汚れ・破損など">${esc(cc.interior_state)}</textarea>${imgField(code,'interior')}</div>
        <div class="fld"><label>⑧ タイヤ状態</label><textarea data-f="tire_state" placeholder="タイヤの状態・溝・夏冬・交換時期など">${esc(cc.tire_state)}</textarea>${imgField(code,'tire')}</div>
        ${store==='spk'?`<div class="fld"><label>⑨ タイヤ交換/保管場所 <span class="tag" style="background:#0284c7">札幌</span></label><input type="text" data-f="tire_storage" placeholder="夏/冬タイヤの保管場所・交換予定など" value="${esc(cc.tire_storage)}"></div>`:''}
        <div class="fld full"><label>⑪ インパクト箇所</label><textarea data-f="impact_state" placeholder="衝撃・凹み・修復歴など">${esc(cc.impact_state)}</textarea>${imgField(code,'impact')}</div>
        <div class="fld full"><label>⑩ 傷チェック</label>${v.share_token?`<a class="dbtn" href="${DMGV}${v.share_token}" target="_blank" rel="noopener">🩹 傷チェックを開く（現在 ${v.dmg||0}件）</a>`:`<span class="mil z">傷チェック未発行（傷チェックアプリで共有を有効化）</span>`}</div>
        <div class="fld full"><label>📝 メモ</label><textarea data-f="memo" placeholder="その他メモ">${esc(cc.memo)}</textarea></div>
      </div></td></tr>`;
    });
  });
  $('tb').innerHTML=list.length?html:'<tr><td class="empty">該当する車両がありません</td></tr>';
  $('cnt').textContent=list.length+'台';
  wire();
}
function wire(){
  const tb=$('tb');
  tb.querySelectorAll('.mtoggle').forEach(el=>el.onclick=e=>{e.stopPropagation();const code=el.closest('tr').dataset.code;if(openRows.has(code))openRows.delete(code);else openRows.add(code);el.closest('tr').classList.toggle('open');});
  tb.querySelectorAll('.detailrow [data-f]').forEach(el=>el.addEventListener('change',()=>save(el.closest('.detailrow').dataset.code, el.dataset.f, el.value)));
  tb.querySelectorAll('input[data-imgadd]').forEach(el=>el.onchange=e=>{const f=el.dataset.imgadd,code=el.closest('.imgs').dataset.code,file=e.target.files[0];if(file)addImg(code,f,file);e.target.value='';});
  tb.querySelectorAll('.imgs .x').forEach(el=>el.onclick=()=>{const code=el.closest('.imgs').dataset.code;delImg(code,el.dataset.del,el.dataset.url);});
}
/* store切替 */
document.querySelectorAll('.bar .stg').forEach(b=>b.onclick=()=>{document.querySelectorAll('.bar .stg').forEach(x=>x.classList.remove('on'));b.classList.add('on');store=b.dataset.s;openRows.clear();load();});
$('q').oninput=e=>{q=e.target.value.trim();render();};
$('reload').onclick=()=>{$('reload').classList.add('spin');load().finally(()=>$('reload').classList.remove('spin'));};
/* 初期store反映 */
document.querySelectorAll('.bar .stg').forEach(x=>x.classList.toggle('on',x.dataset.s===store));
/* ページズーム抑止(スマホでレイアウト崩れ防止) */
document.addEventListener('gesturestart',e=>e.preventDefault());
load();
/* アイドル時60秒ごとに最新化(入力中はスキップ) */
setInterval(()=>{const a=document.activeElement;if(!a||a.tagName==='BODY')load();},60000);
</script>
</body>
</html>
