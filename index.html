<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:text;user-select:text}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN',sans-serif;margin:0;background:#f3f4f6}
::-webkit-scrollbar{height:5px;width:5px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
.fade-in{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.tl-bar{position:absolute;top:3px;bottom:3px;border-radius:4px;cursor:pointer;display:flex;align-items:center;padding:0 4px;overflow:hidden;white-space:nowrap;font-size:9px;font-weight:600;transition:opacity .2s;z-index:2}
.tl-bar:hover{opacity:.85;z-index:3}
.top-nav{display:none;position:sticky;top:0;left:0;right:0;z-index:100;background:#1e293b;padding:4px 6px env(safe-area-inset-top,4px);box-shadow:0 2px 8px rgba(0,0,0,.12);overflow-x:auto;-webkit-overflow-scrolling:touch}
.top-nav button{flex-shrink:0;display:inline-flex;align-items:center;gap:3px;padding:6px 10px;border:none;background:transparent;cursor:pointer;font-size:11px;color:#94a3b8;transition:all .15s;border-radius:8px;font-weight:600;white-space:nowrap}
.top-nav button.active{background:#2563eb;color:#fff}
.top-nav button .ico{font-size:16px}
.sidebar{width:56px;min-width:56px;background:#1e293b;display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:2px}
.sidebar button{width:44px;height:44px;border-radius:10px;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;font-size:9px;gap:1px;transition:all .15s}
.sidebar button:hover{background:#334155;color:#e2e8f0}
.sidebar button.active{background:#2563eb;color:#fff}
.sidebar button .ico{font-size:18px}
@media(max-width:768px){.sidebar{display:none!important}.top-nav{display:flex!important}.top-nav.hide-on-top{display:none!important}.main-area{padding-top:0!important}.sync-desktop{display:none!important}}
@media(min-width:769px){.top-nav{display:none!important}.sidebar{display:flex!important}.sidebar.hide-on-top{display:none!important}}
.app-shell{height:100vh;height:100dvh}
.op-fullscreen{position:fixed;inset:0;z-index:200;background:#f3f4f6;display:flex;flex-direction:column}
.op-fullscreen .op-header{background:linear-gradient(135deg,#1e40af,#2563eb);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.op-fullscreen .op-body{flex:1;overflow:auto;padding:8px}
@media(max-width:768px){.op-fullscreen .op-body{padding:4px}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:300;padding:12px}
.modal-box{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.15);width:100%;overflow-y:auto}
.input-s{border:1px solid #d1d5db;border-radius:8px;padding:5px 8px;font-size:12px;width:100%}
.btn-primary{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:6px 16px;font-size:12px;font-weight:700;cursor:pointer}
.btn-primary:hover{background:#1d4ed8}
.btn-danger{background:#dc2626;color:#fff;border:none;border-radius:8px;padding:6px 16px;font-size:12px;font-weight:700;cursor:pointer}
.btn-ghost{background:none;border:1px solid #d1d5db;border-radius:8px;padding:6px 16px;font-size:12px;cursor:pointer;color:#374151}
.shift-grid{position:relative;overflow:auto;max-height:400px}
.shift-grid table{border-collapse:collapse}
.shift-grid th,.shift-grid td{border:1px solid #d1d5db}
.shift-grid thead th{position:sticky;top:0;z-index:2}
.shift-col{position:sticky;left:0;z-index:3;background:#fff}
.shift-col-header{position:sticky;left:0;z-index:4;background:#D2B48C}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes kReqBlink{0%,100%{border-color:#fca5a5;box-shadow:0 0 0 0 rgba(220,38,38,0)}50%{border-color:#dc2626;box-shadow:0 0 0 3px rgba(220,38,38,.25)}}
@keyframes mmRun{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(2px) translateY(-1.5px) rotate(-6deg)}50%{transform:translateX(0) translateY(0) rotate(0)}75%{transform:translateX(-1.5px) translateY(-1.5px) rotate(6deg)}100%{transform:translateX(0) rotate(0)}}
@keyframes mmPop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
@keyframes mmSheen{0%{background-position:-120% 0}100%{background-position:220% 0}}
.mm-badge{position:relative;display:inline-flex;align-items:center;gap:3px;border-radius:999px;font-weight:900;white-space:nowrap;flex-shrink:0;animation:mmPop .34s cubic-bezier(.34,1.56,.64,1);box-shadow:0 1px 4px rgba(0,0,0,.14);overflow:hidden}
.mm-badge::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:200% 100%;animation:mmSheen 2.6s ease-in-out infinite;pointer-events:none}
.mm-badge .mm-ic{display:inline-block;animation:mmRun .75s ease-in-out infinite;will-change:transform}
@keyframes mmZoom{0%{left:-90px;transform:scaleX(1) translateY(0)}15%{transform:scaleX(1.05) translateY(-6px)}50%{transform:scaleX(1) translateY(0)}100%{left:110%;transform:scaleX(1) translateY(-2px)}}
@keyframes apPop{0%{transform:translate(-50%,-50%) scale(.5) rotate(-6deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(2deg);opacity:1}72%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}100%{transform:translate(-50%,-50%) scale(.96) translateY(-14px);opacity:0}}
.assign-pop{position:fixed;left:50%;top:42%;z-index:100002;pointer-events:none;display:flex;align-items:center;gap:10px;padding:16px 26px;border-radius:18px;background:linear-gradient(135deg,#f59e0b,#ec4899,#8b5cf6);color:#fff;font-weight:900;font-size:22px;box-shadow:0 12px 40px rgba(0,0,0,.35);animation:apPop 1.5s cubic-bezier(.34,1.56,.64,1) forwards;white-space:nowrap;text-shadow:0 2px 4px rgba(0,0,0,.3)}
.assign-pop .ap-ic{font-size:30px;animation:mmRun .7s ease-in-out infinite}
.kreq{animation:kReqBlink .8s ease-in-out infinite;border-color:#dc2626!important}
</style>

<body>
<div id="root"><div id="splash" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#f0f2f5"><div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:flex;align-items:center;justify-content:center;margin-bottom:12px"><span style="color:#fff;font-weight:900;font-size:24px">S</span></div><div style="font-size:16px;font-weight:700;color:#1e293b">札幌店 タスク管理</div><div style="margin-top:16px;width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:sp .8s linear infinite"></div><div id="splash-status" style="margin-top:12px;font-size:11px;color:#94a3b8">読み込み中...</div><style>@keyframes sp{to{transform:rotate(360deg)}}</style></div></div>
<script>
// ★ SWバージョン付きキャッシュ (2026-07-12): app.js/CDNをcache-firstで高速化 (NHA同型)
//    - index.html(このローダー)は絶対キャッシュしない = 常にネットワークで最新版を取得
//    - sw.js は SW_V(=?v値)を含むキャッシュキーで、版が上がれば旧キャッシュを自動掃除
//    - sw.js?v=<版> を上げれば .update() で確実に新SWへ入替 → activateで旧キャッシュ全削除
var CV='spk-v1008';
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js?v=900').then(function(r){try{r.update();}catch(e){}}).catch(function(){});
}
</script>
<script>
var ss=document.getElementById('splash-status');
function splashMsg(t){if(ss)ss.textContent=t;}
splashMsg('ライブラリ読込中...');
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>splashMsg('アプリ準備中...');</script>
<script>
function showErr(title,detail){
  var d=document.createElement("div");
  d.style.cssText="position:fixed;top:0;left:0;right:0;background:#fee2e2;color:#991b1b;padding:12px;font-size:12px;z-index:99999;white-space:pre-wrap;max-height:300px;overflow:auto";
  d.textContent=title+"\n"+detail;
  document.body.appendChild(d);
}
window.onerror=function(msg,src,line,col,err){
  showErr("[JS Error] "+msg,"Source: "+(src||"unknown")+"\nLine: "+line+" Col: "+col+(err&&err.stack?"\n"+err.stack:""));
};
window.addEventListener("unhandledrejection",function(e){
  var r=e.reason;
  if(r&&r.message&&r.message.indexOf("SyntaxError")>=0){showErr("[Babel Compile Error]",r.message);}
  console.error("Unhandled promise:",r);
});
</script>
<script>
// ★ アプリ本体を外部読込（NHA同型ローダー・2026-07-12）
//    ./app.js?v=<版> に固定 → SWキャッシュキーが安定しヒット(2回目以降 激速)。
//    sw.js?v= を上げれば新URL → SWが旧キャッシュを掃除して新app.jsを取得。
(function(){
  var s=document.createElement("script");
  s.src="./app.js?v=900";
  s.onerror=function(){try{splashMsg("読込エラー。再試行中...");}catch(e){}setTimeout(function(){location.reload();},2000);};
  document.body.appendChild(s);
})();
</script>
