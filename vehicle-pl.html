<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>札幌店 車両P&L 月別マトリクス</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;background:#f3f4f6;color:#1e293b;padding:14px;max-width:1600px;margin:0 auto}
.hdr{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;padding:14px 18px;border-radius:12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.hdr h1{font-size:18px;font-weight:800}
.hdr .sub{font-size:11px;opacity:.85;margin-top:3px}
.back-btn{background:#fff;color:#1e40af;border:0;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700}
.back-btn:hover{background:#f1f5f9}
.controls{background:#fff;padding:10px 14px;border-radius:10px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.controls select,.controls button{padding:6px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;background:#fff;cursor:pointer}
.controls button:hover{background:#f1f5f9}
.controls .lbl{font-size:11px;color:#475569;font-weight:600}
.class-sec{background:#fff;border-radius:10px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.class-hdr{padding:12px 16px;background:linear-gradient(135deg,#1e293b,#334155);color:#fff;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;flex-wrap:wrap;gap:10px}
.class-hdr:hover{background:linear-gradient(135deg,#0f172a,#1e3a8a)}
.class-hdr .ttl{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.class-hdr .arrow{font-size:11px;width:14px;display:inline-block;transition:transform .15s}
.class-hdr.open .arrow{transform:rotate(90deg)}
.class-hdr .stats{display:flex;gap:8px;font-size:11px}
.class-hdr .stat{padding:3px 10px;border-radius:5px;background:rgba(255,255,255,.18);font-weight:700}
.class-hdr .stat.rev{background:#bbf7d0;color:#15803d}
.class-hdr .stat.cost{background:#fecaca;color:#991b1b}
.class-hdr .stat.profit{font-weight:800;background:#fef3c7;color:#92400e}
.class-hdr .stat.profit.neg{background:#fee2e2;color:#dc2626}
.class-body{padding:0;display:none;overflow-x:auto}
.class-body.open{display:block}
table{width:100%;border-collapse:collapse;font-size:11px;min-width:800px}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid #e5e7eb;white-space:nowrap;font-variant-numeric:tabular-nums}
th{background:#f1f5f9;font-weight:700;color:#475569;font-size:10px;position:sticky;top:0;z-index:1}
th.l{text-align:left}
td.l{text-align:left;font-weight:700;color:#1e293b;background:#fff;position:sticky;left:0;z-index:1;border-right:2px solid #cbd5e1}
td.metric{text-align:left;font-size:10px;color:#64748b;background:#f8fafc;font-weight:600;padding-left:18px}
td.rev{color:#15803d}
td.cost{color:#b91c1c}
td.profit{color:#0f172a;font-weight:700;background:#fef3c7}
td.profit.neg{color:#dc2626;background:#fee2e2}
td.tot{background:#1e293b;color:#fff;font-weight:800}
tr.veh-summary td{background:#dbeafe;font-weight:800;color:#1e3a8a;border-top:2px solid #93c5fd}
.veh-block{border-bottom:3px solid #cbd5e1}
.veh-block:last-child{border-bottom:0}
.loading{padding:40px;text-align:center;color:#64748b;font-size:13px}
.error{padding:20px;background:#fee2e2;color:#991b1b;border-radius:8px;margin:10px 0;font-size:12px}
.veh-name{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.veh-name .nm{font-weight:800;color:#0f172a;font-size:12px}
.veh-name .code{font-size:9px;color:#94a3b8;font-weight:500;background:#f8fafc;padding:1px 4px;border-radius:3px}
.veh-name .plate{font-size:12px;background:#1d4ed8;color:#fff;padding:2px 9px;border-radius:5px;font-weight:800;letter-spacing:.5px;font-variant-numeric:tabular-nums;box-shadow:0 1px 3px rgba(29,78,216,.3)}
.veh-name .plate.empty{background:#fef3c7;color:#92400e}
.veh-name .inactive{font-size:9px;color:#dc2626;background:#fee2e2;padding:1px 5px;border-radius:3px;font-weight:700}
.legend{padding:8px 12px;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:10px;color:#475569;line-height:1.6}
.legend b{color:#1e293b}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <h1>🏎 札幌店 車両P&L 月別マトリクス</h1>
    <div class="sub">車両別 × 月別 売上 / 原価 (固定費) / 粗利 — 起点: 2026-02</div>
  </div>
  <button class="back-btn" onclick="history.back()">← 前ページに戻る</button>
</div>

<div class="controls">
  <span class="lbl">期間:</span>
  <select id="periodStart">
    <option value="2026-02">2026年2月〜 (PERIOD_START)</option>
    <option value="2026-04">2026年4月〜</option>
    <option value="2026-01">2026年1月〜</option>
  </select>
  <select id="periodEnd"></select>
  <button onclick="expandAll()">▼ 全クラス展開</button>
  <button onclick="collapseAll()">▶ 全クラス折りたたみ</button>
  <button onclick="loadAndRender()">🔄 再読込</button>
  <span style="margin-left:auto;font-size:11px;color:#475569" id="status">準備中...</span>
</div>

<div id="content"><div class="loading">⏳ データ取得中...</div></div>

<script>
const SUPA='https://ckrxttbnawkclshczsia.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
let TOKEN=null;

// ── 認証 (member@g-lines.jp 自動ログイン) ──
async function auth(){
  const cached=localStorage.getItem('hm2_auth_token');
  if(cached){TOKEN=cached;return;}
  const r=await fetch(`${SUPA}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email:'member@g-lines.jp',password:'8888'})});
  const j=await r.json();
  if(j.access_token){TOKEN=j.access_token;localStorage.setItem('hm2_auth_token',TOKEN);}
}
async function sb(path){
  const h={'apikey':KEY};
  if(TOKEN)h['Authorization']='Bearer '+TOKEN;
  const r=await fetch(`${SUPA}/rest/v1/${path}`,{headers:h});
  if(r.status===401){localStorage.removeItem('hm2_auth_token');TOKEN=null;await auth();return sb(path);}
  return r.json();
}
async function sbAll(table,params){
  const rows=[];let off=0;const lim=1000;
  while(true){
    const p=params?(params+'&'):'';
    const data=await sb(`${table}?${p}limit=${lim}&offset=${off}`);
    if(!Array.isArray(data))break;
    rows.push(...data);
    if(data.length<lim)break;
    off+=lim;
  }
  return rows;
}

// ── 月リスト生成 ──
function genMonths(start,end){
  const out=[];const[sy,sm]=start.split('-').map(Number);const[ey,em]=end.split('-').map(Number);
  let y=sy,m=sm;
  while(y<ey||(y===ey&&m<=em)){
    out.push(`${y}-${String(m).padStart(2,'0')}`);
    m++;if(m>12){m=1;y++;}
  }
  return out;
}

// ── フォーマット (オーナー指示 2026-05-26: K表記禁止・生の数字のみ) ──
const fmt=n=>{if(!n||n===0)return '—';return (n>=0?'¥':'-¥')+Math.abs(Math.round(n)).toLocaleString();};
const fmtFull=n=>n>=0?'¥'+Math.round(n).toLocaleString():'-¥'+Math.abs(Math.round(n)).toLocaleString();
const fmtPlus=n=>n>0?'+'+fmtFull(n):n<0?fmtFull(n):'¥0';

// ── 売上計算式 (monthly.html _ciCalc 準拠) ──
const calcRev=r=>{
  const bp=+(r.base_price||0),op=+(r.option_price||0),disc=+(r.discount||0);
  if(bp>0||op>0)return Math.max(0,bp+op-disc);
  return +(r.price||0);
};
// ── 月次原価 (KPIマスター v4 準拠・自動車税除外) ──
const calcMonthlyCost=v=>{
  return (+v.lease_monthly||0)+(+v.insurance_annual||0)+(+v.shaken_cost||0)/24+(+v.tenken_cost||0)/6;
};

// ── データ全取得 ──
async function fetchAll(){
  const periodStart=document.getElementById('periodStart').value;
  const periodEnd=document.getElementById('periodEnd').value;
  document.getElementById('status').textContent='⏳ Supabase問い合わせ中...';
  // 並列取得
  const [vehs,fleet,resv,kpi,classes]=await Promise.all([
    sbAll('vehicles','select=code,name,plate_no,type,lease_monthly,insurance_annual,shaken_cost,tenken_cost,car_tax,active&order=type,id'),
    sbAll('fleet','select=reservation_id,vehicle_code'),
    sbAll('reservations',`select=id,price,base_price,option_price,discount,return_date,lend_date,status,ota,name&return_date=gte.${periodStart}-01&return_date=lte.${periodEnd}-31&status=neq.cancelled`),
    sbAll('vehicle_monthly_kpi','select=year_month,vehicle_code,active'),
    sbAll('classes','select=type,label,sort_order&order=sort_order')
  ]);
  document.getElementById('status').textContent=`✅ ${vehs.length}台 / ${resv.length}件 (${new Date().toLocaleTimeString()})`;
  return{vehs,fleet,resv,kpi,classes,periodStart,periodEnd};
}

// ── 月別集計 ──
function aggregate(data){
  const{vehs,fleet,resv,kpi,periodStart,periodEnd}=data;
  // fleet マップ: reservation_id → vehicle_code
  const fleetMap={};
  fleet.forEach(f=>{fleetMap[f.reservation_id]=f.vehicle_code;});
  // KPI active マップ: code → set of active months
  const kpiMap={};
  kpi.forEach(k=>{if(!kpiMap[k.vehicle_code])kpiMap[k.vehicle_code]={};kpiMap[k.vehicle_code][k.year_month]=k.active;});
  // 各車両の月別売上集計
  const months=genMonths(periodStart,periodEnd);
  const vehStats={};
  vehs.forEach(v=>{
    vehStats[v.code]={
      veh:v,
      monthRev:{},     // ym → 売上
      monthCost:{},    // ym → 原価 (active月のみ)
      monthProfit:{},  // ym → 粗利
      activeMonths:{} // ym → bool
    };
    months.forEach(ym=>{
      const isActive=kpiMap[v.code]&&kpiMap[v.code][ym]!==undefined?kpiMap[v.code][ym]:!!v.active;
      vehStats[v.code].activeMonths[ym]=isActive;
      vehStats[v.code].monthRev[ym]=0;
      vehStats[v.code].monthCost[ym]=isActive?calcMonthlyCost(v):0;
    });
  });
  // 予約を車両に紐付けして月別売上集計
  resv.forEach(r=>{
    const vc=fleetMap[r.id];
    if(!vc||!vehStats[vc])return;
    const rd=r.return_date;
    if(!rd)return;
    const ym=rd.slice(0,7);
    if(!vehStats[vc].monthRev.hasOwnProperty(ym))return;
    vehStats[vc].monthRev[ym]+=calcRev(r);
  });
  // 粗利計算
  Object.values(vehStats).forEach(s=>{
    months.forEach(ym=>{
      s.monthProfit[ym]=s.monthRev[ym]-s.monthCost[ym];
    });
  });
  return{months,vehStats};
}

// ── レンダリング ──
function render(data){
  const{vehs,classes}=data;
  const{months,vehStats}=aggregate(data);
  // クラス別グループ化
  const clsMap={};
  classes.forEach(c=>{clsMap[c.type]={label:c.label,sortOrder:c.sort_order,vehs:[]};});
  vehs.forEach(v=>{
    if(!clsMap[v.type])clsMap[v.type]={label:v.type,sortOrder:99,vehs:[]};
    clsMap[v.type].vehs.push(v);
  });
  const clsList=Object.keys(clsMap).map(t=>({type:t,...clsMap[t]})).sort((a,b)=>a.sortOrder-b.sortOrder);
  // HTML 生成
  let html='';
  clsList.forEach(cls=>{
    if(cls.vehs.length===0)return;
    // クラス合計
    let clsRev=0,clsCost=0,clsProfit=0;
    cls.vehs.forEach(v=>{
      const s=vehStats[v.code];if(!s)return;
      months.forEach(ym=>{clsRev+=s.monthRev[ym];clsCost+=s.monthCost[ym];clsProfit+=s.monthProfit[ym];});
    });
    const open=cls.vehs.length<=5;// 5台以下はデフォルト展開
    html+=`<div class="class-sec">
      <div class="class-hdr ${open?'open':''}" onclick="this.classList.toggle('open');this.parentNode.querySelector('.class-body').classList.toggle('open');">
        <span class="ttl"><span class="arrow">▶</span> ${cls.type}クラス (${cls.vehs.length}台) ${cls.label||''}</span>
        <div class="stats">
          <span class="stat rev">💰 売上 ${fmt(clsRev)}</span>
          <span class="stat cost">📉 原価 ${fmt(clsCost)}</span>
          <span class="stat profit ${clsProfit<0?'neg':''}">${clsProfit>=0?'📈':'⚠️'} 粗利 ${fmtPlus(clsProfit)}</span>
        </div>
      </div>
      <div class="class-body ${open?'open':''}">
        <table>
          <thead><tr>
            <th class="l" style="min-width:200px">車両 / 指標</th>
            ${months.map(ym=>`<th style="min-width:80px">${ym.slice(5)}月</th>`).join('')}
            <th style="min-width:90px;background:#1e293b;color:#fff">合計</th>
          </tr></thead>
          <tbody>`;
    cls.vehs.forEach(v=>{
      const s=vehStats[v.code];if(!s){html+=`<tr><td class="l">${v.name}</td><td colspan="${months.length+1}">データなし</td></tr>`;return;}
      const totRev=months.reduce((a,ym)=>a+s.monthRev[ym],0);
      const totCost=months.reduce((a,ym)=>a+s.monthCost[ym],0);
      const totProfit=totRev-totCost;
      const allInactive=months.every(ym=>!s.activeMonths[ym]);
      const vehHdr=`<div class="veh-name"><span>${v.name}</span><span class="plate">${v.plate_no||''}</span><span class="code">${v.code}</span>${allInactive?'<span class="inactive">除外</span>':''}</div>`;
      html+=`<tr class="veh-block veh-summary"><td class="l">${vehHdr}</td>${months.map(ym=>{const p=s.monthProfit[ym];return `<td class="profit ${p<0?'neg':''}">${fmtPlus(p)}</td>`;}).join('')}<td class="tot">${fmtPlus(totProfit)}</td></tr>`;
      html+=`<tr><td class="metric">└ 💰 売上</td>${months.map(ym=>`<td class="rev">${fmt(s.monthRev[ym])}</td>`).join('')}<td class="rev tot">${fmt(totRev)}</td></tr>`;
      html+=`<tr><td class="metric">└ 📉 原価 (固定費)</td>${months.map(ym=>`<td class="cost">${s.activeMonths[ym]?'-'+fmt(s.monthCost[ym]).replace('¥','¥'):'—'}</td>`).join('')}<td class="cost tot">-${fmt(totCost).replace('¥','¥')}</td></tr>`;
    });
    html+=`</tbody></table>
        <div class="legend">
          <b>📐 月次原価 (固定費) =</b> リース料 + 保険料(月額) + 車検代/24 + 半年点検代/6 ${' '}<i>(KPIマスター v4 準拠・自動車税除外)</i><br>
          <b>💰 売上 =</b> (基本料金+付帯料金-割引) ※bp/op両0時は price フィールド ・ 集計範囲: returnDate が当月内の予約のみ<br>
          <b>📈 粗利 =</b> 売上 − 原価 ・ <b>除外</b>表示の月は vehicle_monthly_kpi.active=false (原価=¥0でカウント)
        </div>
      </div>
    </div>`;
  });
  document.getElementById('content').innerHTML=html;
}

function expandAll(){document.querySelectorAll('.class-hdr').forEach(h=>{h.classList.add('open');h.parentNode.querySelector('.class-body').classList.add('open');});}
function collapseAll(){document.querySelectorAll('.class-hdr').forEach(h=>{h.classList.remove('open');h.parentNode.querySelector('.class-body').classList.remove('open');});}

async function loadAndRender(){
  try{
    document.getElementById('content').innerHTML='<div class="loading">⏳ データ取得中...</div>';
    const data=await fetchAll();
    render(data);
  }catch(e){
    console.error(e);
    document.getElementById('content').innerHTML=`<div class="error">⚠️ エラー: ${e.message}</div>`;
    document.getElementById('status').textContent='⚠️ エラー';
  }
}

// ── 初期化 ──
async function init(){
  // 期間End セレクタ生成 (PERIOD_START〜+12ヶ月)
  const sel=document.getElementById('periodEnd');
  const today=new Date();
  const opts=genMonths('2026-02',`${today.getFullYear()+1}-12`);
  opts.forEach(ym=>{
    const o=document.createElement('option');
    o.value=ym;o.textContent=ym+(ym===`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`?' (当月)':'');
    sel.appendChild(o);
  });
  sel.value=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
  // 認証→読込
  await auth();
  await loadAndRender();
}
init();
</script>
</body>
</html>
