<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KEYDROP 価格パトロール（公式サイト同期）</title>
<style>
:root{--navy:#111;--y:#FABE00;--gr:#0e9f50;--line:#e3e8f0;--mut:#7a8aa0}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans JP",-apple-system,sans-serif;background:#f5f7fb;color:#1a1a1a}
.hd{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hd b{font-weight:900;font-size:16px}.hd .y{color:var(--y)}
.hd .meta{margin-left:auto;font-size:12px;color:#cbd5e1}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.note{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px;color:#42506a;margin-bottom:14px;line-height:1.7}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{background:#fff;border:2px solid var(--line);border-radius:9px;padding:8px 18px;font-weight:900;font-size:13px;cursor:pointer}
.tab.on{border-color:var(--y);background:#fffdf5}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;overflow-x:auto}
.card h2{font-size:14px;font-weight:900;margin:0 0 10px;padding-left:9px;border-left:5px solid var(--y)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:center;white-space:nowrap}
th{background:#f0f3f9;font-weight:900}
td.cls{background:#fafbfe;font-weight:900;text-align:left}
td.p{font-weight:800}
.hi{background:#fff4d6}.lo{background:#eafaf0}
.mut{color:var(--mut);font-size:11px}
.err{color:#c0392b;font-weight:800}
#status{font-size:12px;color:var(--mut);margin-left:8px}
</style></head><body>
<div class="hd"><span class="y">🔑</span><b>KEYDROP <span class="y">価格パトロール</span></b>
<span class="mut" style="color:#cbd5e1">公式サイト(rent-handyman.jp)→ 毎週水曜 同期</span>
<span class="meta" id="fetched">—</span></div>
<div class="wrap">
<div class="note">
<b>これは何？</b>　公式サイトの「札幌店・那覇店 × 各クラス」の<b>1日単位料金</b>を、シーズン変動が出やすい<b>各月4サンプル日</b>で調査した価格表です（<b>90日窓内</b>）。
毎週水曜に自動更新。<span class="hi">黄=そのクラスの高値日</span> / <span class="lo">緑=安値日</span>。
取得できなかった日は在庫切れ等で空欄（KEYDROP同期時は<b>旧価格を維持し¥0にしません</b>）。
</div>
<div class="tabs"><button class="tab on" data-s="sapporo" onclick="setStore('sapporo')">🏔 札幌店</button><button class="tab" data-s="naha" onclick="setStore('naha')">🌺 那覇店</button><span id="status">読込中…</span></div>
<div id="panel"></div>
</div>
<script>
var SB="https://ckrxttbnawkclshczsia.supabase.co";
var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
var CLSORD={sapporo:['A','A2','B','B2','C','S','F','H','G'],naha:['A','B','C','D','S','F','H']};
var DATA={sapporo:[],naha:[]},CUR='sapporo';
function fmt(n){return '¥'+(+n).toLocaleString();}
function load(){
  fetch(SB+"/rest/v1/public_kd_price_patrol_v?order=store,vehicle_class,sample_date&limit=2000",{headers:{apikey:ANON,Authorization:"Bearer "+ANON}})
  .then(function(r){return r.json();}).then(function(rows){
    DATA={sapporo:[],naha:[]};var fetched='';
    rows.forEach(function(x){if(DATA[x.store])DATA[x.store].push(x);if(x.fetched_at>fetched)fetched=x.fetched_at;});
    document.getElementById('fetched').textContent=fetched?('最終取得: '+fetched.slice(0,10)):'';
    document.getElementById('status').textContent='';
    render();
  }).catch(function(e){document.getElementById('status').innerHTML='<span class="err">読込失敗: '+e+'</span>';});
}
function setStore(s){CUR=s;document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-s')===s);});render();}
function render(){
  var rows=DATA[CUR]||[];var p=document.getElementById('panel');
  if(!rows.length){p.innerHTML='<div class="card">データがありません（初回パトロール前）。</div>';return;}
  var dates=[];rows.forEach(function(x){if(dates.indexOf(x.sample_date)<0)dates.push(x.sample_date);});dates.sort();
  var byc={};rows.forEach(function(x){(byc[x.vehicle_class]=byc[x.vehicle_class]||{})[x.sample_date]=x.price;});
  var order=(CLSORD[CUR]||[]).filter(function(c){return byc[c];});
  Object.keys(byc).forEach(function(c){if(order.indexOf(c)<0)order.push(c);});
  var h='<div class="card"><h2>'+(CUR==='sapporo'?'札幌店':'那覇空港店')+' ｜ 1日単位料金（公式サイト）</h2><table><thead><tr><th>クラス</th>';
  dates.forEach(function(d){h+='<th>'+d.slice(5).replace('-','/')+'</th>';});h+='</tr></thead><tbody>';
  order.forEach(function(c){
    var vals=dates.map(function(d){return byc[c][d];}).filter(function(v){return v!=null;});
    var mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals);
    h+='<tr><td class="cls">'+c+'</td>';
    dates.forEach(function(d){var v=byc[c][d];
      if(v==null){h+='<td class="mut">—</td>';}
      else{var cl=(v===mx&&mx!==mn)?'hi':((v===mn&&mx!==mn)?'lo':'');h+='<td class="p '+cl+'">'+fmt(v)+'</td>';}
    });h+='</tr>';
  });
  h+='</tbody></table><div class="mut" style="margin-top:8px">※日帰り=1日料金。空欄=その日在庫切れ等で未取得。</div></div>';
  p.innerHTML=h;
}
load();setInterval(load,300000);
</script></body></html>
