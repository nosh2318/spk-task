<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>🅿️ 駐車場マップ｜札幌</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#1e293b;color:#e2e8f0}
  .wrap{max-width:900px;margin:0 auto;min-height:100vh;padding-bottom:96px}
  .hd{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:10px 14px 8px;box-shadow:0 3px 14px rgba(0,0,0,.35)}
  .hd .row1{display:flex;align-items:center;gap:8px}
  .hd h1{margin:0;font-size:15px;font-weight:900}
  .hd .st{margin-left:auto;font-size:10px;font-weight:800;background:rgba(255,255,255,.18);border-radius:8px;padding:3px 9px}
  .sum{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .sum .chip{background:rgba(255,255,255,.16);border-radius:8px;padding:3px 9px;font-size:10.5px;font-weight:800}
  .sum .chip b{font-size:13px}
  /* 返却/要駐車リスト（ヘッダー） */
  .retbar{margin-top:8px;background:rgba(0,0,0,.2);border-radius:10px;padding:7px 9px}
  .retbar .rt{font-size:10.5px;font-weight:900;color:#fde68a;margin-bottom:5px;display:flex;align-items:center;gap:5px}
  .retbar .chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .retchip{flex-shrink:0;background:#422006;border:1.5px solid #f59e0b;color:#fff;border-radius:9px;padding:6px 10px;font-size:11px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:5px;transition:transform .12s}
  .retchip:active{transform:scale(.94)}
  .retchip .dot{width:8px;height:8px;border-radius:50%}
  .retchip.sel{background:#f59e0b;color:#1e293b;animation:pulseSel .8s ease-in-out infinite}

  .lot-map{margin:12px;border-radius:16px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  .lane{height:24px;background:repeating-linear-gradient(90deg,#374151,#374151 18px,#fbbf24 18px,#fbbf24 30px);opacity:.9;position:relative}
  .lane .gate{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:900;color:#fff;background:#0f766e;border-radius:6px;padding:2px 8px}
  .area{position:relative;padding:9px 11px 13px;background:linear-gradient(180deg,#4b5563,#3f4753)}
  .area.paid{background:linear-gradient(180deg,#475569,#374151)}
  .area .atitle{font-size:12px;font-weight:900;color:#fff;display:flex;align-items:center;gap:6px;margin-bottom:9px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .area .atitle .cap{margin-left:auto;font-size:10px;font-weight:800;color:#cbd5e1;background:rgba(0,0,0,.25);border-radius:6px;padding:2px 8px}
  .area .atitle .paidtag{font-size:9px;font-weight:800;color:#fecaca;background:rgba(127,29,29,.6);border-radius:5px;padding:1px 6px}
  .coinbays{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  @media(max-width:560px){.coinbays{grid-template-columns:repeat(3,1fr);gap:6px}}
  .cbay{position:relative;width:100%;min-height:118px;border-radius:8px;border:2px dashed rgba(255,255,255,.5);border-top:none;background:rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:17px 2px 6px;cursor:pointer;transition:transform .15s}
  .cbay.free{justify-content:center}
  .cbay.manual,.cbay.plain{border-color:rgba(125,211,252,.55)}
  .cbay:active{transform:scale(.95)}
  .cbay.pop{animation:bpop .5s cubic-bezier(.2,1.5,.4,1)}
  .cbay .bno{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;color:#fff;background:rgba(0,0,0,.62);border-radius:0 0 7px 7px;padding:1px 10px;z-index:3;letter-spacing:.5px}
  .cbay .freetag{font-size:10px;font-weight:800;color:#6ee7b7}
  .cbay .addtag{font-size:10px;font-weight:900;color:#7dd3fc}
  .cbay .cname{font-size:9.5px;font-weight:800;color:#f8fafc;text-align:center;line-height:1.12;margin-top:4px;text-shadow:0 1px 2px rgba(0,0,0,.6);max-width:100%;word-break:break-all}
  .cbay .cn{margin-top:3px;font-size:9px;font-weight:900;color:#fff;background:#0ea5e9;border-radius:5px;padding:1px 7px}
  .cbay .crown{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;color:#78350f;background:#fbbf24;border-radius:6px;padding:1px 6px;white-space:nowrap;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.35)}
  body.guiding .cbay.occ{opacity:.32}
  body.guiding .cbay.reco{animation:recoGlow .75s ease-in-out infinite;border-color:#fbbf24;border-style:solid}
  .carwrap{width:40px;height:64px;position:relative;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));animation:parkin .5s ease both}
  .car-svg{display:block}
  /* 誘導バナー */
  .guidebar{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:11px 15px calc(13px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.4);transform:translateY(120%);transition:transform .35s cubic-bezier(.2,1.2,.3,1);max-width:900px;margin:0 auto;background:linear-gradient(135deg,#b45309,#f59e0b)}
  .guidebar.full{background:linear-gradient(135deg,#9d174d,#db2777)}
  .guidebar.on{transform:translateY(0)}
  .guidebar .g1{font-size:14px;font-weight:900;color:#fff;display:flex;align-items:center;gap:8px}
  .guidebar .g1 .carico{font-size:18px;animation:drive 1s ease-in-out infinite}
  .guidebar .g2{font-size:11px;color:#fff;opacity:.95;margin-top:2px}
  .guidebar .gcancel{position:absolute;top:9px;right:12px;background:rgba(255,255,255,.22);border:none;color:#fff;border-radius:8px;padding:5px 11px;font-size:12px;font-weight:800;cursor:pointer}
  .flycar{position:fixed;z-index:80;pointer-events:none;transition:transform .8s cubic-bezier(.4,.7,.3,1);will-change:transform}
  /* GOOD JOB */
  .goodjob{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
  .goodjob.on{animation:gjshow 1.5s ease forwards}
  .goodjob .gj{font-size:46px;font-weight:900;color:#fde047;text-shadow:0 4px 16px rgba(0,0,0,.5);transform:scale(.5) rotate(-8deg);letter-spacing:1px;text-align:center}
  .goodjob.on .gj{animation:gjpop 1.5s cubic-bezier(.2,1.5,.3,1) forwards}
  .goodjob .sub{font-size:15px;color:#fff;font-weight:800;margin-top:6px}
  .particle{position:fixed;z-index:90;font-size:20px;pointer-events:none;animation:pburst 1s ease-out forwards}
  /* modal/toast */
  .scrim{position:fixed;inset:0;background:rgba(2,6,23,.6);display:flex;align-items:flex-end;justify-content:center;z-index:70;animation:fadeIn .2s ease}
  .sheet{background:#1e293b;color:#e2e8f0;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto;animation:sheetUp .3s cubic-bezier(.2,1.1,.3,1);border-top:1px solid #334155}
  .sheet h3{margin:0 0 4px;font-size:15px;font-weight:900}
  .sheet .sd{font-size:11px;color:#94a3b8;margin-bottom:12px}
  .opt{width:100%;text-align:left;border:1.5px solid #334155;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:11px 12px;font-size:13px;font-weight:800;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:9px}
  .opt:active{background:#334155}
  .opt .dot{width:11px;height:11px;border-radius:50%}
  .btnrow{display:flex;gap:8px;margin-top:6px}
  .btn{flex:1;border:none;border-radius:12px;padding:12px;font-size:13px;font-weight:800;cursor:pointer}
  .btn.g{background:#334155;color:#cbd5e1}.btn.r{background:#7f1d1d;color:#fecaca}
  .toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-16px);z-index:99;background:#f8fafc;color:#0f172a;padding:9px 18px;border-radius:30px;font-size:13px;font-weight:900;opacity:0;transition:.3s;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @keyframes parkin{from{opacity:0;transform:translateY(-14px) scale(.85)}to{opacity:1;transform:none}}
  @keyframes bpop{0%{transform:scale(.7)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
  @keyframes recoGlow{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.35);background:rgba(251,191,36,.12)}50%{box-shadow:0 0 0 8px rgba(251,191,36,.5);background:rgba(251,191,36,.28)}}
  @keyframes pulseSel{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.4)}50%{box-shadow:0 0 0 5px rgba(245,158,11,.5)}}
  @keyframes drive{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes gjshow{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
  @keyframes gjpop{0%{transform:scale(.4) rotate(-10deg)}25%{transform:scale(1.15) rotate(4deg)}45%{transform:scale(1) rotate(-2deg)}80%{transform:scale(1)}100%{transform:scale(1.05)}}
  @keyframes pburst{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--rot))}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="row1"><h1>🅿️ 駐車場マップ</h1><span class="st" id="st">接続中…</span></div>
    <div class="sum" id="sum"></div>
    <div class="retbar"><div class="rt">🕒 本日返却予定（到着→タップでBIG空きへ誘導・満車ならトラスト）</div><div class="chips" id="retToday"></div></div>
  </div>
  <div class="lot-map" id="lotMap"></div>
</div>
<div class="guidebar" id="guidebar">
  <button class="gcancel" onclick="cancelGuide()">やめる</button>
  <div class="g1"><span class="carico">🚗</span><span id="gName"></span></div>
  <div class="g2" id="gMsg"></div>
</div>
<div class="goodjob" id="goodjob"><div><div class="gj">GOOD JOB! 🎉</div><div class="sub" id="gjSub"></div></div></div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
const PARK_URL="https://rkrvjpipvpybkmqadmrb.supabase.co";
const PARK_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrcnZqcGlwdnB5YmttcWFkbXJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4MjI4MjQsImV4cCI6MjA4ODM5ODgyNH0.Jq_yIfAp1gsXdOtigwEwMb43iPD188PRKKdwc0D4tU4";
const MAIN_SB="https://ckrxttbnawkclshczsia.supabase.co";
const MAIN_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
const sb=window.supabase.createClient(PARK_URL,PARK_ANON);
const CLS={A:"#7c3aed",A2:"#9333ea",B:"#0284c7",B2:"#0369a1",C:"#059669",S:"#d97706",F:"#db2777",H:"#64748b",G:"#0891b2"};
// エリア定義（noから判定）
const AREA_DEFS=[
  {key:"BIG",name:"BIGスロット駐車場",ico:"🅿️",mode:"numbered"},
  {key:"TRUST",name:"トラストパーク 北6西15",ico:"🅿️",mode:"manual",paid:true},
  {key:"TIMES",name:"タイムズ 北13西16",ico:"🅿️",mode:"manual",paid:true},
  {key:"PAID",name:"BIGスロット 有料枠",ico:"💰",mode:"plain",paid:true},
];
function areaOf(no){no=String(no||"");if(/^\d+$/.test(no.trim()))return "BIG";if(no.indexOf("トラスト")>=0)return "TRUST";if(no.indexOf("タイムズ")>=0)return "TIMES";return "PAID";}
function areaDef(k){return AREA_DEFS.find(a=>a.key===k);}
let SPOTS=[];   // {id,no,carId,memo}
let ROSTER=[];  // {id,n,p,c}
let RETURNS=[]; // {id,n,p,c,time} 本日返却予定(予約RPC)
let guideCar=null, modal=null, busy=false;
function car(id){return ROSTER.find(c=>c.id===id)||{id,n:id,p:"",c:"H"};}
function placedIds(){const s=new Set();SPOTS.forEach(sp=>sp.carId&&s.add(sp.carId));return s;}
function needCars(){const p=placedIds();return ROSTER.filter(c=>!p.has(c.id));}
function baysOf(k){return SPOTS.filter(sp=>areaOf(sp.no)===k).sort((a,b)=>{const na=parseInt(a.no,10),nb=parseInt(b.no,10);if(!isNaN(na)&&!isNaN(nb))return na-nb;return a.id-b.id;});}
// おすすめ: BIG空き最優先→無ければトラスト空き
function recoSpotId(){const big=baysOf("BIG").find(sp=>!sp.carId);if(big)return{id:big.id,full:false};const tr=baysOf("TRUST").find(sp=>!sp.carId);if(tr)return{id:tr.id,full:true};return null;}
function carSVG(cls){const col=CLS[cls]||"#64748b";return `<svg class="car-svg" width="40" height="64" viewBox="0 0 44 72"><ellipse cx="23" cy="68" rx="18" ry="4.5" fill="#000" opacity=".16"/><rect x="3" y="15" width="6" height="13" rx="3" fill="#1f2937"/><rect x="35" y="15" width="6" height="13" rx="3" fill="#1f2937"/><rect x="3" y="44" width="6" height="13" rx="3" fill="#1f2937"/><rect x="35" y="44" width="6" height="13" rx="3" fill="#1f2937"/><rect x="6" y="4" width="32" height="64" rx="13" fill="${col}"/><rect x="6" y="4" width="32" height="22" rx="13" fill="#ffffff" opacity=".10"/><rect x="2" y="27" width="6" height="7" rx="2.5" fill="${col}"/><rect x="36" y="27" width="6" height="7" rx="2.5" fill="${col}"/><path d="M11 21 h22 l-3 11 h-16 z" fill="#d6ecf7" opacity=".95"/><rect x="12" y="33" width="20" height="15" rx="5" fill="#000" opacity=".16"/><path d="M13 49 h18 l-2.5 8 h-13 z" fill="#b9d4e6" opacity=".9"/><rect x="11" y="6" width="6" height="4" rx="2" fill="#fff3c4"/><rect x="27" y="6" width="6" height="4" rx="2" fill="#fff3c4"/><rect x="11" y="62" width="6" height="3" rx="1.5" fill="#ef4444"/><rect x="27" y="62" width="6" height="3" rx="1.5" fill="#ef4444"/></svg>`;}
function carGraphic(id){return `<div class="carwrap">${carSVG(car(id).c)}</div>`;}
const $=id=>document.getElementById(id);

function render(){
  const reco=guideCar?recoSpotId():null;
  const total=SPOTS.length, parked=SPOTS.filter(s=>s.carId).length;
  $("sum").innerHTML=`<div class="chip">空き <b>${total-parked}</b>/${total}</div><div class="chip">BIG空き <b>${baysOf("BIG").filter(s=>!s.carId).length}</b></div><div class="chip">本日返却 <b>${RETURNS.length}</b></div>`;
  // 🕒 本日返却予定（未駐車のみ・時刻付き）
  const placed=placedIds();
  const rtoday=RETURNS.filter(r=>!placed.has(r.id));
  $("retToday").innerHTML=rtoday.length?rtoday.map(r=>`<div class="retchip ${guideCar===r.id?'sel':''}" onclick="pickCar('${r.id}')"><span class="dot" style="background:${CLS[r.c]}"></span>${r.n} ${r.p} <span style="color:#fde047">🕒${r.time} 到着→誘導▶</span></div>`).join(""):'<span style="font-size:10.5px;color:#94a3b8">本日の返却予定なし</span>';
  // マップ
  let html=`<div class="lane"><span class="gate">🚪 出入口</span></div>`;
  AREA_DEFS.forEach(a=>{
    const bays=baysOf(a.key);const free=bays.filter(b=>!b.carId).length;
    const cells=bays.map(sp=>{
      const noBadge=(a.mode==="numbered"&&sp.no)?`<span class="bno">${sp.no}</span>`:"";
      if(!sp.carId){const r=reco&&reco.id===sp.id;const lbl=a.mode==="numbered"?'<span class="freetag">空</span>':'<span class="addtag">＋入庫</span>';return `<div class="cbay free ${a.mode}${r?' reco':''}" data-sp="${sp.id}" onclick="tapEmpty(${sp.id})">${noBadge}${r?'<span class="crown">👑ここへ</span>':''}${lbl}</div>`;}
      const cc=car(sp.carId);const cn=(a.mode==="manual"&&sp.memo)?`<span class="cn">駐車No.${sp.memo}</span>`:"";
      return `<div class="cbay occ" data-sp="${sp.id}" onclick="tapCar(${sp.id})">${noBadge}${carGraphic(sp.carId)}<div class="cname">${cc.n}${cc.p?'<br>'+cc.p:''}</div>${cn}</div>`;
    }).join("");
    html+=`<div class="area ${a.paid?'paid':''}"><div class="atitle">${a.ico} ${a.name}${a.paid?'<span class="paidtag">有料</span>':''}<span class="cap">空き ${free}／${bays.length}台</span></div><div class="coinbays">${cells||'<div style="font-size:10px;color:#94a3b8;padding:6px">（マス未登録）</div>'}</div></div>`;
  });
  $("lotMap").innerHTML=html;
  renderModal();
}
function renderModal(){$("modalRoot").innerHTML=modal?`<div class="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet">${modal}</div></div>`:"";}
function openSheet(h){modal=h;renderModal();}
function closeSheet(){modal=null;renderModal();}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1700);}
function burst(el){const r=el.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;const em=["✨","🎉","⭐","💫","🟡"];for(let k=0;k<14;k++){const p=document.createElement("div");p.className="particle";p.textContent=em[k%5];const a=Math.PI*2*k/14,d=50+Math.random()*70;p.style.left=cx+"px";p.style.top=cy+"px";p.style.setProperty("--dx",Math.cos(a)*d+"px");p.style.setProperty("--dy",Math.sin(a)*d-30+"px");p.style.setProperty("--rot",Math.random()*220-110+"deg");document.body.appendChild(p);setTimeout(()=>p.remove(),1000);}}
function goodJob(sub){$("gjSub").textContent=sub||"";const g=$("goodjob");g.classList.remove("on");void g.offsetWidth;g.classList.add("on");setTimeout(()=>g.classList.remove("on"),1500);}
function exitGuide(){guideCar=null;document.body.classList.remove("guiding");$("guidebar").classList.remove("on");}

// ===== DB書き込み（1マス1行・他枠の同一車は先に空ける） =====
async function dbSetCar(spotId,carId,memo){
  try{
    if(carId){await sb.from("parking_spots").update({car_id:null,updated_at:new Date().toISOString(),updated_by:"spk"}).eq("car_id",carId).neq("id",spotId);}
    const patch={car_id:carId||null,updated_at:new Date().toISOString(),updated_by:"spk"};
    if(memo!==undefined)patch.memo=memo||"";
    await sb.from("parking_spots").update(patch).eq("id",spotId);
  }catch(e){console.log("dbSetCar err",e);toast("⚠️ 保存失敗（通信）");}
}
function optimistic(spotId,carId,memo){SPOTS.forEach(s=>{if(s.carId===carId&&s.id!==spotId)s.carId=null;});const sp=SPOTS.find(s=>s.id===spotId);if(sp){sp.carId=carId||null;if(memo!==undefined)sp.memo=memo||"";}}

// ===== 誘導・入庫 =====
function pickCar(id){ // 返却チップから選択→誘導
  guideCar=id;document.body.classList.add("guiding");
  const reco=recoSpotId();
  $("gName").textContent=car(id).n+" "+car(id).p+" をどこに停めますか？";
  const gb=$("guidebar");
  if(reco&&reco.full){gb.classList.add("full");$("gMsg").textContent="⚠️ BIG満車 → 光っている「トラストパーク」へ停めてください";}
  else if(reco){gb.classList.remove("full");$("gMsg").textContent="👑 光っているBIGの空きマスへ停めてください";}
  else{gb.classList.remove("full");$("gMsg").textContent="空きがありません";}
  gb.classList.add("on");render();
}
function cancelGuide(){exitGuide();render();}
function driveInto(el,cb){
  const gate=document.querySelector(".gate").getBoundingClientRect();
  const fc=document.createElement("div");fc.className="flycar";fc.innerHTML=carGraphic(guideCar);
  const cw=fc.querySelector(".carwrap");if(cw)cw.style.animation="none";
  document.body.appendChild(fc);
  fc.style.transform=`translate(${gate.left}px,${gate.top}px) scale(.9)`;
  const r=el.getBoundingClientRect();const tx=r.left+r.width/2-20,ty=r.top+r.height/2-32;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{fc.style.transform=`translate(${tx}px,${ty}px) scale(1)`;}));
  setTimeout(()=>{fc.remove();cb();},820);
}
async function finishPark(spotId,id,memo){
  optimistic(spotId,id,memo);await dbSetCar(spotId,id,memo);
  const sp=SPOTS.find(s=>s.id===spotId);const aname=sp?areaDef(areaOf(sp.no)).name:"";
  const label=(sp&&areaOf(sp.no)==="BIG"?"No."+sp.no:aname)+(memo?" 駐車No."+memo:"");
  exitGuide();render();
  const el=document.querySelector(`.cbay[data-sp="${spotId}"]`);if(el){el.classList.add("pop");burst(el);}
  goodJob(label+" に "+car(id).n);
}
function tapEmpty(spotId){
  const sp=SPOTS.find(s=>s.id===spotId);if(!sp)return;const a=areaDef(areaOf(sp.no));
  if(a.mode==="numbered"){ // BIG=誘導アニメ
    if(!guideCar){openPickSheet(spotId);return;}
    const el=document.querySelector(`.cbay[data-sp="${spotId}"]`);
    driveInto(el,()=>finishPark(spotId,guideCar,undefined));
    return;
  }
  // 手動エリア: 車選択→(トラスト/タイムズはNo入力)
  if(guideCar){const cn=a.mode==="manual"?(prompt("駐車No（このコインPのマス番号）","")||"").trim():"";finishPark(spotId,guideCar,cn);return;}
  openPickSheet(spotId);
}
function openPickSheet(spotId){
  const sp=SPOTS.find(s=>s.id===spotId);const a=areaDef(areaOf(sp.no));
  const list=needCars();
  if(!list.length){openSheet(`<h3>入庫</h3><div class="sd">未駐車の車がありません。</div><div class="btnrow"><button class="btn g" onclick="closeSheet()">閉じる</button></div>`);return;}
  openSheet(`<h3>${a.ico} ${a.name} に入庫</h3><div class="sd">車を選択${a.mode==="manual"?"（次に駐車Noを入力）":""}</div>`+
    list.map(c=>`<button class="opt" onclick="doPick(${spotId},'${c.id}')"><span class="dot" style="background:${CLS[c.c]}"></span>${c.n} ${c.p}</button>`).join("")+
    `<div class="btnrow"><button class="btn g" onclick="closeSheet()">キャンセル</button></div>`);
}
function doPick(spotId,id){closeSheet();const sp=SPOTS.find(s=>s.id===spotId);const a=areaDef(areaOf(sp.no));const cn=a.mode==="manual"?(prompt("駐車No（このコインPのマス番号）","")||"").trim():"";finishPark(spotId,id,a.mode==="numbered"?undefined:cn);}
// ===== 出庫 =====
function tapCar(spotId){
  if(guideCar){toast("光っているマスに停めてください");return;}
  const sp=SPOTS.find(s=>s.id===spotId);if(!sp||!sp.carId)return;const c=car(sp.carId);const a=areaDef(areaOf(sp.no));
  const loc=(a.mode==="numbered"?"No."+sp.no:a.name)+(sp.memo?" 駐車No."+sp.memo:"");
  openSheet(`<h3>${loc}：${c.n} ${c.p}</h3><div class="sd">出庫しますか？</div><div class="btnrow"><button class="btn g" onclick="closeSheet()">閉じる</button><button class="btn r" onclick="doOut(${spotId})">🚙 出庫</button></div>`);
}
async function doOut(spotId){const sp=SPOTS.find(s=>s.id===spotId);const nm=sp&&sp.carId?car(sp.carId).n:"";closeSheet();optimistic(spotId,null,"");await dbSetCar(spotId,null,"");render();toast("🚙 "+nm+" 出庫");}

// ===== 読み込み・リアルタイム =====
async function loadRoster(){
  try{const r=await fetch(MAIN_SB+"/rest/v1/rpc/spk_fleet_for_parking",{method:"POST",headers:{"apikey":MAIN_ANON,"Authorization":"Bearer "+MAIN_ANON,"Content-Type":"application/json"},body:"{}"});
    const d=await r.json();if(Array.isArray(d))ROSTER=d.filter(v=>v&&v.name).map(v=>({id:v.name+"-"+v.no,n:v.name,p:String(v.no||""),c:v.type||"H"}));
  }catch(e){console.log("roster err",e);}
}
async function loadSpots(){
  try{const{data,error}=await sb.from("parking_spots").select("*").order("id");if(!error&&data)SPOTS=data.map(r=>({id:r.id,no:r.no,carId:r.car_id,memo:r.memo||""}));}catch(e){console.log("spots err",e);}
}
async function loadReturns(){
  try{const r=await fetch(MAIN_SB+"/rest/v1/rpc/spk_parking_returns_today",{method:"POST",headers:{"apikey":MAIN_ANON,"Authorization":"Bearer "+MAIN_ANON,"Content-Type":"application/json"},body:"{}"});
    const d=await r.json();if(Array.isArray(d))RETURNS=d.map(x=>({id:x.name+"-"+x.no,n:x.name,p:String(x.no||""),c:x.type||"H",time:x.return_time||""}));}catch(e){console.log("returns err",e);}
}
async function boot(){
  await Promise.all([loadRoster(),loadSpots(),loadReturns()]);
  $("st").textContent="🟢 稼働中";render();
  // リアルタイム（他端末の入出庫を即反映）
  sb.channel("pk-rt").on("postgres_changes",{event:"*",schema:"public",table:"parking_spots"},async()=>{await loadSpots();render();}).subscribe();
  // 予備ポーリング（15秒）
  setInterval(async()=>{if(document.visibilityState==="visible"){await Promise.all([loadSpots(),loadReturns()]);render();}},15000);
  document.addEventListener("visibilitychange",async()=>{if(document.visibilityState==="visible"){await loadSpots();render();}});
}
boot();
</script>
