<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OTAのパス更新</title>
<style>
:root{--bg:#f5f7fb;--fg:#0f172a;--mut:#64748b;--line:#cbd5e1;--ok:#166534;--okbg:#dcfce7;--ng:#991b1b;--ngbg:#fee2e2;--wait:#92400e;--waitbg:#fef3c7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
header{background:#2f3b55;color:#fff;padding:12px 16px}header h1{margin:0;font-size:18px}header .sub{font-size:12px;opacity:.85;margin-top:2px}
.wrap{max-width:640px;margin:0 auto;padding:12px 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin:0 0 12px}
label{display:block;font-size:13px;font-weight:700;margin:0 0 10px}
select,input{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:6px;font-size:16px}
.row{display:flex;gap:10px}.row label{flex:1}
button{width:100%;border:none;background:#2563eb;color:#fff;border-radius:6px;padding:12px;font-size:16px;font-weight:800;cursor:pointer}button:disabled{background:#94a3b8}
.msg{margin-top:10px;padding:10px;border-radius:6px;font-size:14px}.msg.ok{background:var(--okbg);color:var(--ok)}.msg.ng{background:var(--ngbg);color:var(--ng)}
.note{font-size:12px;color:var(--mut);line-height:1.6}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #e2e8f0;padding:6px 4px;text-align:left}
.st{display:inline-block;border-radius:4px;padding:2px 8px;font-weight:800}.st.ok{background:var(--okbg);color:var(--ok)}.st.ng{background:var(--ngbg);color:var(--ng)}.st.wait{background:var(--waitbg);color:var(--wait);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.4}}
body.embed header{display:none}
</style></head><body>
<header><h1>🔑 OTAのパス更新</h1><div class="sub">OTAのパスワードが変わったら、ここに新しいパスを入れてください。ロボが受け取って、すぐ動き直します。</div></header>
<div class="wrap">
  <div class="card" id="login" hidden><div class="msg ng">業務アプリでログインしてから、もう一度開いてください。</div>
    <div class="note" style="margin-top:8px"><a href="./">業務アプリを開く</a></div></div>
  <div class="card" id="form" hidden>
    <div class="row"><label>店<select id="store"></select></label><label>OTA<select id="ota"></select></label></div>
    <label>あなたの名前<input id="who" placeholder="例：山田" autocomplete="off"></label>
    <label>ID（変わった時だけ）<input id="uid" autocomplete="off" spellcheck="false" placeholder="変わっていなければ空のまま"></label>
    <label>新しいパスワード<input id="pw" type="password" autocomplete="new-password" spellcheck="false"></label>
    <button id="send">登録する</button>
    <div id="msg"></div>
    <div class="note" style="margin-top:10px">IDが変わった時だけ、IDも入れてください。<br>パスはロボのMacだけが開ける形にして送ります。Slack の会話には書かないでください。</div>
  </div>
  <div class="card"><b>結果</b> <span class="note">（10秒ごとに更新）</span><table id="hist"></table></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB = window.supabase.createClient('https://ckrxttbnawkclshczsia.supabase.co', 'sb_publishable_aTVhlY0YD-5BBfI03ZNnsg_MzO_vsIe',
  { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
const STORES = { nha: ['那覇', ['RKT', 'JLN', 'SKT', 'ART', 'RDC']], spk: ['札幌', ['RKT', 'JLN', 'SKT', 'ART', 'RDC']],
  takh: ['高松 HDM', ['RKT', 'JLN']], takb: ['高松 BUDDICA', ['ART', 'TAB', 'RDC']] };
const OTA = { RKT: '楽天', JLN: 'じゃらん', SKT: 'skyticket', ART: 'エアトリ', RDC: 'レンタカードットコム', TAB: 'たびらい' };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const jst = t => t ? new Date(t).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const q = new URLSearchParams(location.search);
if (q.get('embed')) document.body.classList.add('embed');

$('store').innerHTML = Object.entries(STORES).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join('');
function otas() { $('ota').innerHTML = STORES[$('store').value][1].map(o => `<option value="${o}">${OTA[o]}</option>`).join(''); }
$('store').onchange = otas;
if (STORES[q.get('store')]) $('store').value = q.get('store');
otas();
if (STORES[$('store').value][1].includes(q.get('ota'))) $('ota').value = q.get('ota');
try { $('who').value = localStorage.getItem('invctl_who') || ''; } catch (e) {}
$('who').oninput = () => { try { localStorage.setItem('invctl_who', $('who').value); } catch (e) {} };

const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
async function seal(pem, text) {
  const der = Uint8Array.from(atob(pem.replace(/-----[^-]+-----|\s/g, '')), c => c.charCodeAt(0));
  const key = await crypto.subtle.importKey('spki', der, { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
  return b64(await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, key, new TextEncoder().encode(text)));
}
function say(t, ok) { $('msg').innerHTML = `<div class="msg ${ok ? 'ok' : 'ng'}">${esc(t)}</div>`; }

$('send').onclick = async () => {
  const who = $('who').value.trim(), pw = $('pw').value, uid = $('uid').value.trim();
  if (!who) { say('名前を入れてください。'); $('who').focus(); return; }
  if (!pw) { say('新しいパスワードを入れてください。'); $('pw').focus(); return; }
  if (uid.length > 64) { say('IDが長すぎます。'); $('uid').focus(); return; }
  if ($('ota').value === 'RDC' && (uid.length > 10 || pw.length > 10)) { say('レンタカードットコムは IDもパスも10文字までです。'); return; }
  $('send').disabled = true;
  try {
    const k = await SB.rpc('invctl_cred_pubkeys'); if (k.error) throw k.error;
    if (!k.data.length) throw new Error('ロボの鍵がありません');
    const ciphers = [];
    for (const r of k.data) ciphers.push({ host: r.host, cipher: await seal(r.pem, uid ? JSON.stringify({ id: uid, pw }) : pw) });
    const s = await SB.rpc('invctl_cred_submit', { p_store: $('store').value, p_ota: $('ota').value, p_ciphers: ciphers, p_name: who });
    if (s.error) throw s.error;
    $('pw').value = ''; $('uid').value = '';
    say(`${STORES[$('store').value][0]} ${OTA[$('ota').value]} ${uid ? 'のIDとパス' : 'のパス'}を送りました。下の結果が ✅ になれば完了です。`, true);
    hist();
  } catch (e) { say('送れませんでした：' + (e.message || e)); }
  $('send').disabled = false;
};

async function hist() {
  const r = await SB.rpc('invctl_cred_status', { p_store: null }); if (r.error) return;
  const rows = r.data.filter(x => x.result !== 'replaced');
  $('hist').innerHTML = rows.length ? '<tr><th>送った時刻</th><th>店・OTA</th><th>人</th><th>結果</th></tr>' + rows.slice(0, 20).map(x => {
    const st = !x.result ? `<span class="st wait">${x.taken_at ? 'ログイン確認中' : 'ロボ待ち'}</span>`
      : x.result === 'ok' ? '<span class="st ok">✅ 再稼働</span>' : x.result === 'saved' ? '<span class="st ok">✅ 登録済み</span>' : `<span class="st ng">❌ ${esc(x.result === 'ng' ? 'パスが違います' : x.result)}</span>`;
    return `<tr><td>${jst(x.created_at)}</td><td>${esc(STORES[x.store]?.[0] || x.store)} ${esc(OTA[x.ota] || x.ota)}</td><td>${esc(x.by_name)}</td><td>${st}</td></tr>`;
  }).join('') : '<tr><td class="note">まだありません</td></tr>';
}

(async () => {
  const { data } = await SB.auth.getSession();
  if (!data.session) { $('login').hidden = false; return; }
  $('form').hidden = false; hist(); setInterval(hist, 10e3);
})();
</script></body></html>
