<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEYDROP 車両と料金（車両紹介）</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans',sans-serif;background:#f5f6f8;color:#1a1a1a;padding-bottom:90px}
  .hd{background:#1a1a1a;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
  .hd .mark{width:18px;height:14px;display:flex;flex-direction:column;justify-content:space-between}
  .hd .mark i{height:3px;background:#FABE00;border-radius:2px;display:block}
  .hd b{font-size:16px;font-weight:900}.hd .y{color:#FABE00}
  .wrap{max-width:880px;margin:0 auto;padding:16px}
  .desc{font-size:12px;color:#666;background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:14px;line-height:1.7}
  .cls{background:#fff;border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.06);padding:14px 16px;margin-bottom:12px}
  .cls h3{font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .tag{font-size:11px;font-weight:900;color:#fff;border-radius:6px;padding:2px 8px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
  @media(max-width:560px){.row{grid-template-columns:1fr}}
  .fld label{display:block;font-size:10px;font-weight:800;color:#666;margin-bottom:3px}
  .fld input{width:100%;padding:9px 11px;border:1.5px solid #e2e2e2;border-radius:8px;font-size:14px;outline:none}
  .fld input:focus{border-color:#FABE00}
  .full{grid-column:1/-1}
  .show{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;margin-top:4px}
  .common-card{background:#fff;border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.06);padding:14px 16px;margin-bottom:12px}
  .common-card h3{font-size:14px;font-weight:900;margin-bottom:10px}
  .common-card textarea{width:100%;padding:10px;border:1.5px solid #e2e2e2;border-radius:8px;font-size:13px;outline:none;min-height:60px;font-family:inherit;resize:vertical}
  .savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #eee;padding:12px 16px;display:flex;justify-content:center;z-index:30}
  .save{padding:14px 30px;background:#FABE00;color:#1a1a1a;border:none;border-radius:11px;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 3px 10px rgba(250,190,0,.4);max-width:600px;width:100%}
  .msg{font-size:12px;font-weight:800;text-align:center;position:fixed;bottom:64px;left:0;right:0;z-index:31}
  .ok{color:#16a34a}.err{color:#dc2626}
  .note{font-size:11px;color:#a07c00;background:#fffbf0;border:1px solid #FABE00;border-radius:9px;padding:9px 12px;margin-bottom:12px}
</style>
</head>
<body>
<div class="hd"><span class="mark"><i></i><i></i><i></i></span><b>KEY<span class="y">DROP</span> 車両と料金</b><span style="font-size:11px;opacity:.7">車両紹介</span></div>
<div class="wrap">
  <div class="desc">顧客サイトの<b>「車両と料金」ページ</b>に表示されるクラス紹介を編集します。<b>料金は「💴KEYDROP価格」</b>で管理（このページは車種名・定員・特徴・表示ON/OFFのみ）。保存で顧客サイトに即反映。</div>
  <div class="note">💡 各クラスの画像は固定（class_A〜H.png）。ここでは文言と公開可否を編集します。</div>
  <div id="list"></div>
  <div class="common-card">
    <h3>🔧 全車共通の表記</h3>
    <div class="fld" style="margin-bottom:8px"><label>共通装備・条件</label><textarea id="common"></textarea></div>
    <div class="fld"><label>注記</label><textarea id="note" style="min-height:44px"></textarea></div>
  </div>
</div>
<div class="savebar"><button class="save" id="saveBtn">💾 保存（顧客サイトに即反映）</button></div>
<div class="msg" id="msg"></div>

<script>
const SU='https://ckrxttbnawkclshczsia.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
function _ex(d){if(!d)return null;if(typeof d==='string')return d;if(d.access_token)return d.access_token;if(d.currentSession&&d.currentSession.access_token)return d.currentSession.access_token;if(d.session&&d.session.access_token)return d.session.access_token;if(Array.isArray(d)&&typeof d[0]==='string')return d[0];return null;}
function getTok(){try{const v=localStorage.getItem('sb-ckrxttbnawkclshczsia-auth-token');if(v){try{const t=_ex(JSON.parse(v));if(t)return t;}catch(e){}}for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('sb-')&&k.indexOf('auth-token')>=0){const val=localStorage.getItem(k);if(!val)continue;try{const t=_ex(JSON.parse(val));if(t)return t;}catch(e){}}}return null;}catch(e){return null;}}
function authH(){return 'Bearer '+(getTok()||SK);}
function ensureAuth(cb){if(getTok()){cb();return;}var ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';ov.innerHTML='<div style="background:#fff;padding:30px 26px;border-radius:16px;width:90%;max-width:360px;text-align:center"><div style="font-size:16px;font-weight:900;margin-bottom:14px">ログイン</div><input id="ae" type="email" autocapitalize="off" placeholder="メール" style="width:100%;padding:11px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;margin-bottom:8px"><input id="ap" type="password" placeholder="パスワード" style="width:100%;padding:11px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;margin-bottom:8px"><div id="aerr" style="color:#dc2626;font-size:12px;display:none;margin-bottom:8px"></div><button id="ab" style="width:100%;padding:12px;background:#1a1a1a;color:#fff;border:none;border-radius:9px;font-weight:800;cursor:pointer">ログイン</button></div>';document.body.appendChild(ov);ov.addEventListener('keydown',function(e){if(e.key==='Enter')dl(cb,ov);});document.getElementById('ab').onclick=function(){dl(cb,ov);};}
async function dl(cb,ov){var b=document.getElementById('ab'),er=document.getElementById('aerr');var em=(document.getElementById('ae')||{}).value||'',pw=(document.getElementById('ap')||{}).value||'';if(!em||!pw){er.style.display='';er.textContent='入力してください';return;}b.disabled=true;b.textContent='確認中...';try{var r=await fetch(SU+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SK,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})});var d=await r.json();if(d&&d.access_token){localStorage.setItem('sb-ckrxttbnawkclshczsia-auth-token',JSON.stringify({access_token:d.access_token,refresh_token:d.refresh_token||'',expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600),token_type:'bearer',user:d.user||{}}));ov.remove();cb();}else{er.style.display='';er.textContent='認証失敗';b.disabled=false;b.textContent='ログイン';}}catch(e){er.style.display='';er.textContent='接続エラー';b.disabled=false;b.textContent='ログイン';}}
async function sbGet(key){const r=await fetch(SU+'/rest/v1/app_settings?key=eq.'+key+'&select=value',{headers:{apikey:SK,Authorization:authH()}});if(!r.ok)return null;const d=await r.json();return d&&d[0]?d[0].value:null;}
async function sbSet(key,obj){const r=await fetch(SU+'/rest/v1/app_settings',{method:'POST',headers:{apikey:SK,Authorization:authH(),'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify({key:key,value:JSON.stringify(obj)})});if(!r.ok)throw new Error('HTTP '+r.status+' '+await r.text());return await r.json();}
function pv(v){if(v==null)return null;if(typeof v==='string'){try{return JSON.parse(v);}catch(e){return null;}}return v;}

const COLORS={A:'#7c3aed',A2:'#6d28d9',B:'#0284c7',B2:'#0369a1',C:'#059669',S:'#d97706',F:'#db2777',H:'#64748b'};
const DEF={order:['A','A2','B','B2','C','S','F','H'],items:{}};
let DATA=null;

function row(k,it){
  return '<div class="cls" data-k="'+k+'"><h3><span class="tag" style="background:'+(COLORS[k]||'#1a1a1a')+'">'+k+'クラス</span></h3>'
    +'<div class="row"><div class="fld"><label>表示名</label><input class="f-label" value="'+(it.label||'').replace(/"/g,'&quot;')+'"></div>'
    +'<div class="fld"><label>定員</label><input class="f-seats" value="'+(it.seats||'').replace(/"/g,'&quot;')+'"></div></div>'
    +'<div class="row"><div class="fld full"><label>車種</label><input class="f-vehicles" value="'+(it.vehicles||'').replace(/"/g,'&quot;')+'"></div></div>'
    +'<div class="row"><div class="fld full"><label>特徴</label><input class="f-feature" value="'+(it.feature||'').replace(/"/g,'&quot;')+'"></div></div>'
    +'<label class="show"><input type="checkbox" class="f-show" '+(it.show!==false?'checked':'')+'> 顧客サイトに表示する</label></div>';
}
function build(){
  const list=document.getElementById('list');
  const order=DATA.order||Object.keys(DATA.items||{});
  list.innerHTML=order.map(function(k){return row(k,(DATA.items||{})[k]||{});}).join('');
  document.getElementById('common').value=DATA.common||'';
  document.getElementById('note').value=DATA.note||'';
}
function collect(){
  const items={},order=[];
  document.querySelectorAll('.cls').forEach(function(c){
    const k=c.dataset.k;order.push(k);
    items[k]={label:c.querySelector('.f-label').value.trim(),seats:c.querySelector('.f-seats').value.trim(),vehicles:c.querySelector('.f-vehicles').value.trim(),feature:c.querySelector('.f-feature').value.trim(),show:c.querySelector('.f-show').checked};
  });
  return {order:order,items:items,common:document.getElementById('common').value.trim(),note:document.getElementById('note').value.trim()};
}
document.getElementById('saveBtn').onclick=async function(){
  const m=document.getElementById('msg');m.textContent='';m.className='msg';this.disabled=true;this.textContent='保存中...';
  try{await sbSet('hdm_keydrop_classes',collect());m.textContent='✅ 保存しました（顧客サイトに即反映）';m.className='msg ok';}
  catch(e){m.textContent='保存失敗: '+e.message;m.className='msg err';}
  this.disabled=false;this.textContent='💾 保存（顧客サイトに即反映）';
};
async function load(){
  DATA=pv(await sbGet('hdm_keydrop_classes'))||DEF;
  if(!DATA.items)DATA.items={};
  if(!DATA.order)DATA.order=['A','A2','B','B2','C','S','F','H'];
  build();
}
ensureAuth(load);
</script>
</body>
</html>
