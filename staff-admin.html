<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>バイトURL一覧 - HANDYMAN札幌</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;background:#f1f5f9;color:#0f172a;font-size:14px;max-width:720px;margin:0 auto;padding-bottom:40px}
.bar{background:linear-gradient(135deg,#0f172a,#059669);color:#fff;padding:14px 16px;font-weight:800;font-size:17px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px}
.bar a{margin-left:auto;color:#fff;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:8px;text-decoration:none;font-size:12px}
.wrap{padding:12px}
.note{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;font-size:12px;border-radius:10px;padding:9px 12px;margin-bottom:12px}
.card{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.nm{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.tp{font-size:10px;font-weight:700;padding:1px 8px;border-radius:10px;background:#dbeafe;color:#1d4ed8}
.tp.pt{background:#fef3c7;color:#92400e}
.cnt{margin-left:auto;font-size:11px;color:#64748b;font-weight:700}
.urlrow{display:flex;gap:6px;margin-top:8px;align-items:center}
.urlrow input{flex:1;font-size:11px;padding:7px 9px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;color:#475569}
.btn{font-size:12px;font-weight:800;padding:7px 12px;border-radius:8px;border:none;cursor:pointer;white-space:nowrap}
.btn.cp{background:#059669;color:#fff}.btn.op{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.badge{font-size:10px;font-weight:800;border-radius:8px;padding:2px 7px}
.badge.t{background:#dbeafe;color:#1d4ed8}.badge.r{background:#fef3c7;color:#b45309}
.loading{text-align:center;padding:60px;color:#64748b}
.spin{width:32px;height:32px;border:4px solid #e2e8f0;border-top-color:#059669;border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:20px;margin:16px;text-align:center}
</style></head>
<body>
<div class="bar">🔗 バイトURL一覧<a href="./">← APPに戻る</a></div>
<div id="app"><div class="loading"><div class="spin"></div>読み込み中…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SB="https://ckrxttbnawkclshczsia.supabase.co";
var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
var app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
// アプリのログイントークンを再利用
function appToken(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k));var t=(v&&(v.access_token||(v.currentSession&&v.currentSession.access_token)||(v.session&&v.session.access_token)))||(Array.isArray(v)&&v[0]);if(t)return t;}}}catch(e){}return null;}
var TK=appToken();
function urlOf(tok){return location.origin+location.pathname.replace(/[^/]*$/,"")+"staff.html?t="+tok;}
function copy(id){var el=document.getElementById(id);el.select();try{navigator.clipboard.writeText(el.value);}catch(e){document.execCommand("copy");}var b=document.getElementById(id+"b");if(b){var o=b.textContent;b.textContent="✓";setTimeout(function(){b.textContent=o;},1200);}}
window.copy=copy;

function render(staff,taskCounts,pbal){
  pbal=pbal||{};
  var h='<div class="wrap">';
  // 💴 小口現金 残高一覧（当月・全バイト・オンタイム）
  h+='<div style="background:#0f172a;border-radius:12px;padding:12px;margin-bottom:12px;color:#fff">'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span style="font-weight:900;font-size:14px">💴 小口現金 残高（'+curYM().replace("-","年")+'月）</span><button class="btn" style="background:#334155;color:#fff;margin-left:auto" onclick="load()">↻ 更新</button></div>'
    +'<div style="display:grid;grid-template-columns:1fr auto auto auto;gap:2px 10px;font-size:12px">'
    +'<div style="color:#94a3b8;font-weight:700">バイト</div><div style="color:#94a3b8;font-weight:700;text-align:right">支給</div><div style="color:#94a3b8;font-weight:700;text-align:right">使用</div><div style="color:#94a3b8;font-weight:700;text-align:right">残高</div>';
  var ptStaff=staff.filter(function(s){return s.type==="アルバイト";});
  var listStaff=ptStaff.length?ptStaff:staff;
  listStaff.forEach(function(s){
    var nm=String(s.name).replace(/\s*さん\s*$/,"");var b=pbal[nm]||{g:0,u:0};var bal=b.g-b.u;
    h+='<div style="padding:4px 0;border-top:1px solid #1e293b;font-weight:700">'+esc(nm)+'</div>'
      +'<div style="padding:4px 0;border-top:1px solid #1e293b;text-align:right;color:#34d399">¥'+b.g.toLocaleString()+'</div>'
      +'<div style="padding:4px 0;border-top:1px solid #1e293b;text-align:right;color:#f87171">¥'+b.u.toLocaleString()+'</div>'
      +'<div style="padding:4px 0;border-top:1px solid #1e293b;text-align:right;font-weight:900;color:'+(bal>=0?"#60a5fa":"#f87171")+'">¥'+bal.toLocaleString()+'</div>';
  });
  h+='</div></div>';
  h+='<div class="note">各バイトの個別URL（ログイン不要・自分の担当タスク＋駐車場＋対応履歴）。コピーして本人に配布してください。出勤簿未登録でも依頼→承認で使えます。</div>';
  staff.forEach(function(s,i){
    var tok=s.share_token;var u=urlOf(tok);var id="u"+i;
    var c=taskCounts[s.name]||{t:0,r:0};
    var isPt=(s.type==="アルバイト");
    var nmClean=String(s.name).replace(/\s*さん\s*$/,"");
    h+='<div class="card"><div class="nm">'+esc(nmClean)+' さん'
      +'<span class="tp'+(isPt?" pt":"")+'">'+esc(s.type||"")+'</span>'
      +'<span class="cnt">担当 <span class="badge t">'+c.t+'</span>'+(c.r?' 依頼 <span class="badge r">'+c.r+'</span>':'')+'</span></div>'
      +'<div class="urlrow"><input id="'+id+'" readonly value="'+esc(u)+'">'
      +'<button class="btn cp" id="'+id+'b" onclick="copy(\''+id+'\')">📋コピー</button>'
      +'<a class="btn op" href="'+esc(u)+'" target="_blank">開く</a></div>'
      +'<div style="margin-top:8px"><button class="btn" style="background:#059669;color:#fff" onclick="pettyToggle(\''+esc(nmClean).replace(/'/g,"\\'")+'\',\''+id+'\')">💴 小口現金（支給・補充）</button>'
      +'<div id="'+id+'p" style="display:none;margin-top:8px"></div></div></div>';
  });
  if(!staff.length)h+='<div class="err">アクティブなスタッフがいません</div>';
  h+='</div>';app.innerHTML=h;
}
function showErr(m){app.innerHTML='<div class="err">⚠️ '+esc(m)+'<br><span style="font-size:12px;font-weight:400">APPにログインした状態で開いてください</span></div>';}

// ===== 💴 小口現金 管理（支給・補充を手動入力） =====
function curYM(){return new Date(Date.now()+9*3600*1000).toISOString().slice(0,7);}
function today10(){return new Date(Date.now()+9*3600*1000).toISOString().slice(0,10);}
var PMONTH={}; // id → 表示中のym
window.pettyToggle=function(name,id){
  var box=document.getElementById(id+"p");if(!box)return;
  if(box.style.display==="none"){box.style.display="block";if(!PMONTH[id])PMONTH[id]=curYM();pettyLoad(name,id);}
  else{box.style.display="none";}
};
function pettyLoad(name,id){
  var box=document.getElementById(id+"p");if(!box)return;
  var ym=PMONTH[id]||curYM();
  box.innerHTML='<div style="color:#94a3b8;font-size:12px;padding:6px">読み込み中…</div>';
  fetch(SB+"/rest/v1/spk_petty_cash?staff_name=eq."+encodeURIComponent(name)+"&ym=eq."+encodeURIComponent(ym)+"&order=date.asc,created_at.asc&select=*",{headers:{apikey:ANON,Authorization:"Bearer "+ANON}})
    .then(function(r){return r.json();})
    .then(function(rows){pettyRender(name,id,Array.isArray(rows)?rows:[]);})
    .catch(function(){box.innerHTML='<div class="err">通信エラー</div>';});
}
function pettyRender(name,id,rows){
  var box=document.getElementById(id+"p");if(!box)return;
  var ym=PMONTH[id]||curYM(),given=0,used=0;
  rows.forEach(function(r){if(r.kind==="topup")given+=(+r.amount||0);else used+=(+r.amount||0);});
  var bal=given-used;
  var h='<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px">'
    +'<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">'
    +'<button class="btn" onclick="pettyNav(\''+esc(name).replace(/\x27/g,"\\x27")+'\',\''+id+'\',-1)">‹</button>'
    +'<div style="flex:1;text-align:center;font-weight:800">'+ym.replace("-","年")+'月</div>'
    +'<button class="btn" onclick="pettyNav(\''+esc(name).replace(/\x27/g,"\\x27")+'\',\''+id+'\',1)">›</button></div>'
    +'<div style="display:flex;gap:6px;text-align:center;margin-bottom:10px;font-size:12px">'
    +'<div style="flex:1;background:#f0fdf4;border-radius:8px;padding:6px"><div style="color:#64748b;font-size:10px">支給・補充</div><div style="font-weight:900;color:#059669">¥'+given.toLocaleString()+'</div></div>'
    +'<div style="flex:1;background:#fef2f2;border-radius:8px;padding:6px"><div style="color:#64748b;font-size:10px">使用</div><div style="font-weight:900;color:#dc2626">¥'+used.toLocaleString()+'</div></div>'
    +'<div style="flex:1;background:#eff6ff;border-radius:8px;padding:6px"><div style="color:#64748b;font-size:10px">残高</div><div style="font-weight:900;color:'+(bal>=0?"#1e40af":"#dc2626")+'">¥'+bal.toLocaleString()+'</div></div></div>';
  // 支給/補充フォーム
  h+='<div style="display:flex;gap:6px;margin-bottom:6px">'
    +'<input id="'+id+'_amt" type="number" inputmode="numeric" placeholder="金額" style="width:90px;padding:8px;border:1px solid #cbd5e1;border-radius:8px">'
    +'<input id="'+id+'_note" type="text" placeholder="メモ（例：月初配布 / 補充）" style="flex:1;padding:8px;border:1px solid #cbd5e1;border-radius:8px">'
    +'<button class="btn" style="background:#059669;color:#fff" onclick="pettyTopup(\''+esc(name).replace(/\x27/g,"\\x27")+'\',\''+id+'\')">＋支給</button></div>';
  // 一覧
  if(rows.length){
    h+='<div style="max-height:220px;overflow:auto">';
    rows.forEach(function(r){
      var isTop=(r.kind==="topup");
      h+='<div style="display:flex;align-items:center;gap:6px;padding:5px 2px;border-bottom:1px solid #eef2f7;font-size:12px">'
        +'<div style="flex:1"><b style="color:'+(isTop?"#166534":"#334155")+'">'+(isTop?"➕ ":"")+esc(r.description||(isTop?"支給・補充":"(用途なし)"))+'</b><span style="color:#94a3b8"> '+esc(r.date||"")+'</span>'+(r.receipt_url?' <a href="'+esc(r.receipt_url)+'" target="_blank">📎</a>':'')+'</div>'
        +'<div style="font-weight:800;color:'+(isTop?"#059669":"#dc2626")+'">'+(isTop?"+":"−")+'¥'+(+r.amount||0).toLocaleString()+'</div>'
        +'<button onclick="pettyAdminDel(\''+esc(name).replace(/\x27/g,"\\x27")+'\',\''+id+'\',\''+esc(r.id)+'\')" style="background:none;border:none;color:#cbd5e1;cursor:pointer">🗑</button></div>';
    });
    h+='</div>';
  }else{h+='<div style="color:#94a3b8;font-size:12px;padding:4px">この月の記録はありません</div>';}
  h+='</div>';
  box.innerHTML=h;
}
window.pettyNav=function(name,id,d){var p=(PMONTH[id]||curYM()).split("-");var dt=new Date(Date.UTC(+p[0],+p[1]-1+d,1));PMONTH[id]=dt.getUTCFullYear()+"-"+String(dt.getUTCMonth()+1).padStart(2,"0");pettyLoad(name,id);};
window.pettyTopup=function(name,id){
  var amt=parseInt((((document.getElementById(id+"_amt")||{}).value)||"").replace(/[^0-9]/g,""),10);
  if(!amt||amt<=0){alert("金額を入力してください");return;}
  var note=(((document.getElementById(id+"_note")||{}).value)||"").trim()||"現金支給・補充";
  var ym=PMONTH[id]||curYM();
  var row={id:"petty_top_"+ym.replace("-","")+"_"+Date.now()+"_"+Math.floor(Math.random()*1000),staff_name:name,ym:ym,date:today10(),kind:"topup",description:note,amount:amt,receipt_url:"",receipt_name:""};
  fetch(SB+"/rest/v1/spk_petty_cash",{method:"POST",headers:{apikey:ANON,Authorization:"Bearer "+ANON,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify(row)})
    .then(function(r){if(!r.ok)throw new Error();pettyLoad(name,id);})
    .catch(function(){alert("支給の保存に失敗しました");});
};
window.pettyAdminDel=function(name,id,rid){
  if(!confirm("この記録を削除しますか？"))return;
  fetch(SB+"/rest/v1/spk_petty_cash?id=eq."+encodeURIComponent(rid),{method:"DELETE",headers:{apikey:ANON,Authorization:"Bearer "+ANON,"Prefer":"return=minimal"}})
    .then(function(){pettyLoad(name,id);})
    .catch(function(){alert("削除に失敗しました");});
};

async function load(){
  if(!TK){showErr("ログイン情報が見つかりません");return;}
  var H={apikey:ANON,Authorization:"Bearer "+TK};
  try{
    var r=await fetch(SB+"/rest/v1/staff?select=name,type,share_token,active,sort_order&order=sort_order",{headers:H});
    if(!r.ok){showErr("スタッフ取得に失敗（HTTP "+r.status+"）");return;}
    var staff=(await r.json()).filter(function(s){return s.active!==false&&s.share_token;});
    // タスク/依頼件数（今日以降・assigneeまたはrequested_to）
    var counts={};
    try{
      var today=new Date(Date.now()+9*3600*1000).toISOString().slice(0,10);
      var tr=await fetch(SB+"/rest/v1/tasks?select=assignee,requested_to,date,deleted&date=gte."+today,{headers:H});
      if(tr.ok){var ts=await tr.json();ts.forEach(function(t){if(t.deleted)return;
        if(t.assignee){var n=t.assignee;counts[n]=counts[n]||{t:0,r:0};counts[n].t++;}
        if(Array.isArray(t.requested_to))t.requested_to.forEach(function(n){counts[n]=counts[n]||{t:0,r:0};counts[n].r++;});
      });}
    }catch(e){}
    // 💴 当月の小口現金 残高（全バイト・オンタイム）
    var pbal={};
    try{
      var pr=await fetch(SB+"/rest/v1/spk_petty_cash?ym=eq."+curYM()+"&select=staff_name,kind,amount",{headers:{apikey:ANON,Authorization:"Bearer "+ANON}});
      if(pr.ok){(await pr.json()).forEach(function(p){var n=p.staff_name||"";pbal[n]=pbal[n]||{g:0,u:0};if(p.kind==="topup")pbal[n].g+=(+p.amount||0);else pbal[n].u+=(+p.amount||0);});}
    }catch(e){}
    render(staff,counts,pbal);
  }catch(e){showErr("通信エラー");}
}
load();
</script>
</body></html>
