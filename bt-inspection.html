<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>高松 車検・点検スケジュール</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#f1f5f9;color:#0f172a;padding:14px}
.wrap{max-width:860px;margin:0 auto}h1{font-size:19px;margin:0 0 4px}.sub{color:#64748b;font-size:12px;margin-bottom:12px}
.seg button{border:1px solid #cbd5e1;background:#fff;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer}
.seg button.on{background:#0f172a;color:#fff;border-color:#0f172a}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.sec{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin:12px 0;overflow:hidden}
.sec h2{margin:0;padding:11px 14px;font-size:15px;color:#fff}.sec.shaken h2{background:#b91c1c}.sec.tenken h2{background:#0369a1}
.sec h2 .n{float:right;font-weight:700;opacity:.9}
table{width:100%;border-collapse:collapse}th,td{padding:8px 10px;font-size:13px;text-align:left;border-bottom:1px solid #f1f5f9}
th{background:#f8fafc;color:#475569;font-size:11px}td.d{font-weight:800;white-space:nowrap}
.bd{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700}.bd.hdm{background:#dbeafe;color:#1e40af}.bd.bud{background:#dcfce7;color:#166534}
.empty{padding:16px;color:#94a3b8;text-align:center;font-size:13px}.st{font-size:11px;color:#64748b}
.foot{color:#94a3b8;font-size:11px;text-align:center;margin:16px 0}
</style></head><body><div class="wrap">
<h1>🔧 高松 車検・点検スケジュール</h1>
<div class="sub" id="sub">読み込み中…</div>
<div class="seg" style="margin-bottom:6px">
 <button data-r="year" class="on">今年（年内）</button>
 <button data-r="all">今後すべて</button>
</div>
<div id="body"></div>
<div class="foot">配車表（メンテナンス予定）から自動生成・5分ごと更新／このページは共有用（閲覧のみ）</div>
</div>
<script>
const BT="https://ggqugvyskyiblxiycpci.supabase.co",BANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18";
let RANGE="year",DATA=[];
const yEnd=(new Date()).getFullYear()+"-12-31";
function fmt(d){if(!d)return"";const[y,m,dd]=d.split("-");const w=["日","月","火","水","木","金","土"][new Date(d+"T00:00:00+09:00").getDay()];return `${+m}/${+dd}(${w})`;}
function stJp(s){return({pending:"予定",approved:"確定",reschedule:"変更依頼中",cancel_request:"取消依頼",in_shop:"入庫中",done:"完了"}[s]||s||"予定");}
function brand(b){return b==="HDM"?'<span class="bd hdm">HDM</span>':b?'<span class="bd bud">BUDDICA</span>':"";}
function rows(kind){return DATA.filter(r=>r.kind===kind&&(RANGE==="all"||r.start_date<=yEnd));}
function tbl(list){if(!list.length)return '<div class="empty">該当なし</div>';
 let h='<table><thead><tr><th>日程</th><th>項目</th><th>車種</th><th>ナンバー</th><th>ブランド</th><th>状態</th></tr></thead><tbody>';
 list.forEach(r=>{h+='<tr><td class="d">'+fmt(r.start_date)+'</td><td>'+r.label+'</td><td>'+r.name+'</td><td>'+(r.plate_no||"—")+'</td><td>'+brand(r.brand)+'</td><td class="st">'+stJp(r.status)+'</td></tr>';});
 return h+'</tbody></table>';}
function render(){const sha=rows("車検"),ten=rows("点検");
 document.getElementById("body").innerHTML=
  '<div class="sec shaken"><h2>🚗 車検 <span class="n">'+sha.length+'件</span></h2>'+tbl(sha)+'</div>'+
  '<div class="sec tenken"><h2>🔍 点検 <span class="n">'+ten.length+'件</span></h2>'+tbl(ten)+'</div>';
 const label=RANGE==="year"?"年内（〜"+yEnd+"）":"今後すべて";
 document.getElementById("sub").textContent=label+"／車検"+sha.length+"件・点検"+ten.length+"件 ｜ 更新 "+new Date().toLocaleString("ja-JP");}
async function load(){try{const r=await fetch(BT+"/rest/v1/rpc/bt_inspection_schedule",{method:"POST",headers:{apikey:BANON,Authorization:"Bearer "+BANON,"Content-Type":"application/json"},body:"{}"});DATA=await r.json();if(!Array.isArray(DATA))DATA=[];}catch(e){document.getElementById("sub").textContent="読み込み失敗";return;}render();}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".seg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");RANGE=b.dataset.r;render();});
load();setInterval(load,300000);
</script></body></html>
