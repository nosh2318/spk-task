<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>高松 車検・点検カレンダー</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#f1f5f9;color:#0f172a;padding:12px}
.wrap{max-width:940px;margin:0 auto}h1{font-size:19px;margin:0 0 2px}.sub{color:#64748b;font-size:12px;margin-bottom:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.seg button{border:1px solid #cbd5e1;background:#fff;padding:6px 13px;font-size:13px;font-weight:700;cursor:pointer}
.seg button.on{background:#0f172a;color:#fff;border-color:#0f172a}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.note{font-size:11px;color:#64748b;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;margin-bottom:10px}
.grp{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin:12px 0;overflow:hidden}
.grp>.gh{padding:11px 14px;font-size:16px;font-weight:800;color:#fff}.grp.shaken>.gh{background:#b91c1c}.grp.tenken>.gh{background:#0369a1}
.grp>.gh .n{float:right;font-size:12px;opacity:.9}
.mon h3{margin:0;padding:8px 14px;font-size:13px;background:#f1f5f9;color:#334155;border-top:1px solid #e2e8f0}
.cal{width:100%;border-collapse:collapse;table-layout:fixed}
.cal th{font-size:10px;color:#64748b;padding:5px 0;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.cal td{border:1px solid #f1f5f9;vertical-align:top;height:62px;padding:2px;width:14.2%}
.cal td.pad{background:#fafafa}.dn{font-size:10px;color:#94a3b8;font-weight:700}.cal td.today .dn{color:#dc2626}
.cal td.sun .dn{color:#dc2626}.cal td.sat .dn{color:#2563eb}.cal td.has{background:#fffdf5}
.ev{display:block;margin-top:2px;padding:2px 4px;border-radius:5px;font-size:10px;font-weight:700;line-height:1.2;cursor:pointer;border-left:3px solid}
.ev.pending{background:#fef9c3;color:#854d0e;border-color:#eab308}
.ev.approved{background:#dcfce7;color:#166534;border-color:#22c55e}
.ev.reschedule{background:#f3e8ff;color:#6b21a8;border-color:#a855f7}
.ev .s{font-size:8px;opacity:.85;font-weight:700}
.empty{padding:14px;color:#94a3b8;text-align:center;font-size:13px}
.foot{color:#94a3b8;font-size:11px;text-align:center;margin:16px 0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:480px;padding:18px;max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:17px}.sheet .meta{color:#475569;font-size:13px;margin-bottom:12px}
.sheet label{font-size:12px;color:#475569;font-weight:700;display:block;margin:10px 0 4px}
.sheet input{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;margin-top:10px}
.btn.ok{background:#16a34a;color:#fff}.btn.re{background:#7c3aed;color:#fff}.btn.rv{background:#fff;color:#b45309;border:1px solid #fcd34d}.btn.x{background:#e2e8f0;color:#334155}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.badge.pending{background:#fef9c3;color:#854d0e}.badge.approved{background:#dcfce7;color:#166534}.badge.reschedule{background:#f3e8ff;color:#6b21a8}
@media(max-width:560px){.cal td{height:56px}.ev{font-size:9px}}
</style></head><body><div class="wrap">
<h1>🔧 高松 車検・点検カレンダー</h1>
<div class="sub" id="sub">読み込み中…</div>
<div class="bar"><span class="seg"><button data-r="year" class="on">年内</button><button data-r="all">今後すべて</button></span></div>
<div class="note">📅 表示日は<b>リクエスト日付</b>です。整備会社さまは各予定をタップして<b>「この日で確定」</b>または<b>「別日を提案」</b>できます。<br>🟡リクエスト中　🟢確定　🟣整備が別日提案　／　配車表と連動（配車表で日付を変えると自動反映）</div>
<div id="body"></div>
<div class="foot">配車表（メンテナンス予定）と同じデータ・自動更新／共有用</div>
</div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<script>
const BT="https://ggqugvyskyiblxiycpci.supabase.co",BANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18";
let RANGE="year",DATA=[],CUR=null;
const now=new Date(),todayS=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0"),yEnd=now.getFullYear()+"-12-31",WD=["日","月","火","水","木","金","土"];
function inR(r){return RANGE==="all"||r.start_date<=yEnd;}
function stJp(s){return{pending:"リクエスト中",approved:"確定",reschedule:"整備が別日提案"}[s]||s;}
function fmt(d){if(!d)return"";const[y,m,dd]=d.split("-");return `${+m}/${+dd}(${WD[new Date(d+"T00:00:00+09:00").getDay()]})`;}
function monthCal(ym,evs){const[y,m]=ym.split("-").map(Number),days=new Date(y,m,0).getDate(),lead=new Date(y,m-1,1).getDay(),byd={};
 evs.forEach(e=>{(byd[e.start_date]=byd[e.start_date]||[]).push(e);});
 let h='<div class="mon"><h3>'+y+'年'+m+'月（'+evs.length+'件）</h3><table class="cal"><thead><tr>';
 WD.forEach((w,i)=>h+='<th style="color:'+(i===0?"#dc2626":i===6?"#2563eb":"#64748b")+'">'+w+'</th>');
 h+='</tr></thead><tbody><tr>';
 for(let i=0;i<lead;i++)h+='<td class="pad"></td>';
 for(let d=1;d<=days;d++){const ds=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0"),dow=new Date(y,m-1,d).getDay(),ev=byd[ds]||[];
  let cls="";if(dow===0)cls+=" sun";if(dow===6)cls+=" sat";if(ds===todayS)cls+=" today";if(ev.length)cls+=" has";
  h+='<td class="'+cls.trim()+'"><span class="dn">'+d+'</span>';
  ev.forEach(e=>{const b=e.brand==="HDM"?"HDM":"BUD";const ps=e.status==="reschedule"&&e.proposed_date?'→'+fmt(e.proposed_date):"";h+='<span class="ev '+e.status+'" onclick="openSheet(\''+e.id+'\')">'+e.name+'<br><span class="s">'+(e.plate_no||"")+' '+b+ps+'</span></span>';});
  h+='</td>';if((lead+d)%7===0&&d<days)h+='</tr><tr>';}
 const used=(lead+days)%7;if(used)for(let i=used;i<7;i++)h+='<td class="pad"></td>';
 return h+'</tr></tbody></table></div>';}
function calFor(kind){const evs=DATA.filter(e=>e.kind===kind&&inR(e));const cls=kind==="車検"?"shaken":"tenken";
 let inner=evs.length?[...new Set(evs.map(e=>e.start_date.slice(0,7)))].sort().map(ym=>monthCal(ym,evs.filter(e=>e.start_date.slice(0,7)===ym))).join(""):'<div class="empty">該当なし</div>';
 return '<div class="grp '+cls+'"><div class="gh">'+(kind==="車検"?"🚗 車検カレンダー":"🔍 点検カレンダー")+'<span class="n">'+evs.length+'件</span></div>'+inner+'</div>';}
function render(){document.getElementById("body").innerHTML=calFor("車検")+calFor("点検");
 const s=DATA.filter(e=>e.kind==="車検"&&inR(e)).length,t=DATA.filter(e=>e.kind==="点検"&&inR(e)).length;
 document.getElementById("sub").textContent=(RANGE==="year"?"年内（〜"+yEnd+"）":"今後すべて")+"／車検"+s+"件・点検"+t+"件 ｜ 更新 "+new Date().toLocaleString("ja-JP");}
window.openSheet=function(id){const e=DATA.find(x=>x.id===id);if(!e)return;CUR=e;
 const st=e.status;const by=e.responded_by?'（回答: '+e.responded_by+'）':"";
 document.getElementById("sheet").innerHTML=
  '<h3>'+(e.kind)+'　'+e.name+'（'+(e.plate_no||"—")+'）</h3>'+
  '<div class="meta">'+(e.brand==="HDM"?"HANDYMAN":"BUDDICA")+'　項目: '+e.label+'<br>リクエスト日付: <b>'+fmt(e.start_date)+'</b>　<span class="badge '+st+'">'+stJp(st)+by+'</span>'+(st==="reschedule"&&e.proposed_date?'<br>整備提案日: <b>'+fmt(e.proposed_date)+'</b>':"")+'</div>'+
  '<label>整備会社名（任意）</label><input id="rBy" placeholder="例: ◯◯自動車" value="'+(e.responded_by||"")+'">'+
  '<button class="btn ok" onclick="respond(\'approve\')">✅ この日（'+fmt(e.start_date)+'）で確定</button>'+
  '<label>別日を提案する場合の日付</label><input id="rDate" type="date" value="'+(e.proposed_date||"")+'">'+
  '<button class="btn re" onclick="respond(\'propose\')">📅 別日を提案する</button>'+
  (st!=="pending"?'<button class="btn rv" onclick="respond(\'revert\')">↩ リクエスト中に戻す（取り消し）</button>':"")+
  '<button class="btn x" onclick="closeSheet()">閉じる</button>';
 document.getElementById("scrim").style.display="flex";}
window.closeSheet=function(){document.getElementById("scrim").style.display="none";CUR=null;}
window.respond=async function(act){if(!CUR)return;const by=(document.getElementById("rBy")||{}).value||"";const dt=(document.getElementById("rDate")||{}).value||"";
 if(act==="propose"&&!dt){alert("提案する日付を選んでください");return;}
 if(act==="approve"&&!confirm("この日で確定します。よろしいですか？"))return;
 try{const r=await fetch(BT+"/rest/v1/rpc/bt_inspection_respond",{method:"POST",headers:{apikey:BANON,Authorization:"Bearer "+BANON,"Content-Type":"application/json"},body:JSON.stringify({p_id:CUR.id,p_action:act,p_date:dt,p_by:by})});const res=await r.json();
  if(res==="approved"||res==="proposed"||res==="reverted"){closeSheet();await load();alert(res==="approved"?"確定しました":res==="proposed"?"別日を提案しました":"リクエスト中に戻しました");}else{alert("失敗: "+res);}}catch(e){alert("通信エラー");}}
async function load(){try{const r=await fetch(BT+"/rest/v1/rpc/bt_inspection_schedule",{method:"POST",headers:{apikey:BANON,Authorization:"Bearer "+BANON,"Content-Type":"application/json"},body:"{}"});DATA=await r.json();if(!Array.isArray(DATA))DATA=[];}catch(e){document.getElementById("sub").textContent="読み込み失敗";return;}render();}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".seg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");RANGE=b.dataset.r;render();});
document.getElementById("scrim").onclick=e=>{if(e.target.id==="scrim")closeSheet();};
load();setInterval(()=>{if(!CUR)load();},300000);
</script></body></html>
