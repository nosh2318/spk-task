<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>高松 車検・点検カレンダー</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#f1f5f9;color:#0f172a;padding:12px}
.wrap{max-width:900px;margin:0 auto}h1{font-size:19px;margin:0 0 4px}.sub{color:#64748b;font-size:12px;margin-bottom:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.seg button{border:1px solid #cbd5e1;background:#fff;padding:6px 13px;font-size:13px;font-weight:700;cursor:pointer}
.seg button.on{background:#0f172a;color:#fff;border-color:#0f172a}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.lg{font-size:11px;color:#475569;margin-left:auto}.lg b{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin:0 3px 0 8px}
.mon{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin:12px 0;overflow:hidden}
.mon h2{margin:0;padding:10px 14px;font-size:15px;background:#0f172a;color:#fff}.mon h2 .n{float:right;font-size:12px;opacity:.85;font-weight:700}
.cal{width:100%;border-collapse:collapse;table-layout:fixed}
.cal th{font-size:11px;color:#64748b;padding:6px 0;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.cal td{border:1px solid #f1f5f9;vertical-align:top;height:66px;padding:3px;width:14.2%}
.cal td.pad{background:#fafafa}.dn{font-size:11px;color:#94a3b8;font-weight:700}.cal td.today .dn{color:#dc2626}
.cal td.sun .dn{color:#dc2626}.cal td.sat .dn{color:#2563eb}
.cal td.has{background:#fffdf5}
.ev{display:block;margin-top:2px;padding:2px 4px;border-radius:5px;font-size:10px;font-weight:700;line-height:1.25;overflow:hidden}
.ev.s{background:#fee2e2;color:#991b1b}.ev.t{background:#dbeafe;color:#1e40af}
.ev .bd{font-size:8px;opacity:.75}
.empty{padding:14px;color:#94a3b8;text-align:center;font-size:13px}
.foot{color:#94a3b8;font-size:11px;text-align:center;margin:16px 0}
@media(max-width:560px){.cal td{height:58px}.ev{font-size:9px}}
</style></head><body><div class="wrap">
<h1>🔧 高松 車検・点検カレンダー</h1>
<div class="sub" id="sub">読み込み中…</div>
<div class="bar">
 <span class="seg"><button data-r="year" class="on">年内</button><button data-r="all">今後すべて</button></span>
 <span class="lg"><b style="background:#fca5a5"></b>車検 <b style="background:#93c5fd"></b>点検</span>
</div>
<div id="body"></div>
<div class="foot">配車表（メンテナンス予定）から自動生成・5分ごと更新／共有用（閲覧のみ）</div>
</div>
<script>
const BT="https://ggqugvyskyiblxiycpci.supabase.co",BANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18";
let RANGE="year",DATA=[];
const now=new Date(),todayS=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
const yEnd=now.getFullYear()+"-12-31";
const WD=["日","月","火","水","木","金","土"];
function inR(r){return RANGE==="all"||r.start_date<=yEnd;}
function monthCal(ym,evs){
 const[y,m]=ym.split("-").map(Number);const first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),lead=first.getDay();
 const byd={};evs.forEach(e=>{(byd[e.start_date]=byd[e.start_date]||[]).push(e);});
 let h='<div class="mon"><h2>'+y+'年'+m+'月<span class="n">車検'+evs.filter(e=>e.kind==="車検").length+'・点検'+evs.filter(e=>e.kind==="点検").length+'</span></h2><table class="cal"><thead><tr>';
 WD.forEach((w,i)=>h+='<th style="color:'+(i===0?"#dc2626":i===6?"#2563eb":"#64748b")+'">'+w+'</th>');
 h+='</tr></thead><tbody><tr>';
 for(let i=0;i<lead;i++)h+='<td class="pad"></td>';
 for(let d=1;d<=days;d++){const ds=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");const dow=new Date(y,m-1,d).getDay();const ev=byd[ds]||[];
  let cls="";if(dow===0)cls+=" sun";if(dow===6)cls+=" sat";if(ds===todayS)cls+=" today";if(ev.length)cls+=" has";
  h+='<td class="'+cls.trim()+'"><span class="dn">'+d+'</span>';
  ev.forEach(e=>{const b=e.brand==="HDM"?"HDM":"BUD";h+='<span class="ev '+(e.kind==="車検"?"s":"t")+'">'+e.name+'<br><span class="bd">'+(e.plate_no||"")+' '+b+'</span></span>';});
  h+='</td>';if((lead+d)%7===0&&d<days)h+='</tr><tr>';}
 const used=(lead+days)%7;if(used)for(let i=used;i<7;i++)h+='<td class="pad"></td>';
 return h+'</tr></tbody></table></div>';
}
function render(){const evs=DATA.filter(inR);
 if(!evs.length){document.getElementById("body").innerHTML='<div class="empty">該当する車検・点検の予定はありません</div>';}
 else{const months=[...new Set(evs.map(e=>e.start_date.slice(0,7)))].sort();
  document.getElementById("body").innerHTML=months.map(ym=>monthCal(ym,evs.filter(e=>e.start_date.slice(0,7)===ym))).join("");}
 const sha=evs.filter(e=>e.kind==="車検").length,ten=evs.filter(e=>e.kind==="点検").length;
 document.getElementById("sub").textContent=(RANGE==="year"?"年内（〜"+yEnd+"）":"今後すべて")+"／車検"+sha+"件・点検"+ten+"件 ｜ 更新 "+new Date().toLocaleString("ja-JP");}
async function load(){try{const r=await fetch(BT+"/rest/v1/rpc/bt_inspection_schedule",{method:"POST",headers:{apikey:BANON,Authorization:"Bearer "+BANON,"Content-Type":"application/json"},body:"{}"});DATA=await r.json();if(!Array.isArray(DATA))DATA=[];}catch(e){document.getElementById("sub").textContent="読み込み失敗";return;}render();}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".seg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");RANGE=b.dataset.r;render();});
load();setInterval(load,300000);
</script></body></html>
