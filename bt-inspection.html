<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>高松 車検・点検カレンダー</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#eef2f7;color:#0f172a;padding:12px}
.wrap{max-width:1080px;margin:0 auto}h1{font-size:20px;margin:0 0 2px}.sub{color:#64748b;font-size:12px;margin-bottom:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.seg button{border:1px solid #cbd5e1;background:#fff;padding:7px 15px;font-size:13px;font-weight:700;cursor:pointer}
.seg button.on{background:#0f172a;color:#fff;border-color:#0f172a}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.note{font-size:12px;color:#475569;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:9px 11px;margin-bottom:10px;line-height:1.5}
.grp{background:#fff;border:1px solid #e2e8f0;border-radius:14px;margin:14px 0;overflow:hidden}
.grp>.gh{padding:12px 16px;font-size:17px;font-weight:800;color:#fff}.grp.shaken>.gh{background:#b91c1c}.grp.tenken>.gh{background:#0369a1}
.grp>.gh .n{float:right;font-size:12px;opacity:.9}
.mon h3{margin:0;padding:9px 16px;font-size:14px;font-weight:800;background:#f1f5f9;color:#334155;border-top:1px solid #e2e8f0}
.tlw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tl{border-collapse:collapse;table-layout:fixed}
.tl th{font-size:10px;color:#64748b;padding:4px 0;background:#f8fafc;border-bottom:1px solid #e2e8f0;font-weight:700;line-height:1.2}
.tl th.sun{color:#dc2626}.tl th.sat{color:#2563eb}.tl th.today{background:#fed7aa;color:#9a3412}
.tl td{border-left:1px solid #f1f5f9;border-bottom:1px solid #eef2f7;height:34px;padding:0}
.tl td.we{background:#fafbfc}.tl td.today{background:#fff7ed}
.tl .nm{position:sticky;left:0;z-index:1;background:#fff;text-align:left;padding:3px 8px;border-right:1px solid #e2e8f0;cursor:pointer;font-size:12px;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .nm .s{display:block;font-size:9px;color:#64748b;font-weight:600}
.tb{display:block;margin:0 1px;height:24px;line-height:24px;padding:0 6px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:4px solid}
.tb.cut{border-left-style:dashed;border-radius:0 6px 6px 0}
.tb.pending{background:#fef9c3;color:#854d0e;border-color:#eab308}
.tb.approved{background:#dcfce7;color:#166534;border-color:#22c55e}
.tb.reqmoved{background:#f1f5f9;color:#94a3b8;border-color:#cbd5e1;text-decoration:line-through}
.tb.prop{background:#f3e8ff;color:#6b21a8;border-color:#7c3aed;padding:0 2px;text-align:center}
.empty{padding:16px;color:#94a3b8;text-align:center;font-size:13px}
.foot{color:#94a3b8;font-size:11px;text-align:center;margin:16px 0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:500px;padding:18px;max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:17px}.sheet .meta{color:#475569;font-size:13px;margin-bottom:10px;line-height:1.6}
.sheet label{font-size:12px;color:#475569;font-weight:700;display:block;margin:11px 0 4px}
.sheet input,.sheet textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;font-family:inherit}
.sheet textarea{min-height:60px;resize:vertical}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;margin-top:10px}
.btn.ok{background:#16a34a;color:#fff}.btn.re{background:#7c3aed;color:#fff}.btn.mo{background:#0369a1;color:#fff}.btn.rv{background:#fff;color:#b45309;border:1px solid #fcd34d}.btn.x{background:#e2e8f0;color:#334155}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.badge.pending{background:#fef9c3;color:#854d0e}.badge.approved{background:#dcfce7;color:#166534}.badge.reschedule{background:#f3e8ff;color:#6b21a8}
@media(max-width:560px){.tl .nm{font-size:11px}.tb{font-size:10px}}
</style></head><body><div class="wrap">
<h1>🔧 高松 車検・点検カレンダー</h1>
<div class="sub" id="sub">読み込み中…</div>
<div class="bar"><span class="seg"><button data-r="year" class="on">年内</button><button data-r="all">今後すべて</button></span></div>
<div class="note">📅 1行＝1台。<b>入庫予定の期間をバー</b>で表示（横にスクロールできます）。バーか車名をタップ→<b>この日で確定／別日を提案／メモ</b>。別日を提案すると<b>提案日に🟣</b>が表示されます。<br>🟡リクエスト中　🟢確定　🟣整備が別日提案　／　配車表と連動（配車表で日付を変えると自動反映）</div>
<div id="body"></div>
<div class="foot">配車表（メンテナンス予定）と同じデータ・自動更新／共有用</div>
</div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<script>
const BT="https://ggqugvyskyiblxiycpci.supabase.co",BANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18";
let RANGE="year",DATA=[],CUR=null;
const now=new Date(),todayS=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0"),yEnd=now.getFullYear()+"-12-31",WD=["日","月","火","水","木","金","土"];
function inR(r){return RANGE==="all"||r.start_date<=yEnd;}
function stJp(s){return{pending:"リクエスト中",approved:"確定",reschedule:"整備が別日提案"}[s]||s;}
function fmt(d){if(!d)return"";const[y,m,dd]=d.split("-");return `${+m}/${+dd}(${WD[new Date(d+"T00:00:00+09:00").getDay()]})`;}
function nextDay(ds){const d=new Date(ds+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+1);return d.toISOString().slice(0,10);}
// 入庫予定の全日(start_date〜end_date・終了日含む＝配車表と同じ)。終了日なし/不正は開始日のみ
function spanDays(e){const out=[e.start_date];if(!e.end_date||e.end_date<=e.start_date)return out;let d=e.start_date;while(out.length<62){d=nextDay(d);if(d>e.end_date)break;out.push(d);}return out;}
function lastDay(e){return e.end_date&&e.end_date>e.start_date?e.end_date:e.start_date;}
function dDiff(a,b){return Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/864e5);}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
// その予定が触れる月(入庫期間の全日+提案日)
function monthsOf(e){const s=new Set(spanDays(e).map(d=>d.slice(0,7)));if(e.status==="reschedule"&&e.proposed_date)s.add(e.proposed_date.slice(0,7));return s;}
// 月ごとのタイムライン：1行＝1件、入庫期間を1本のバーで
function monthTL(ym,items){const[y,m]=ym.split("-").map(Number),days=new Date(y,m,0).getDate(),ms=ym+"-01",me=ym+"-"+String(days).padStart(2,"0");
 const ds=d=>ym+"-"+String(d).padStart(2,"0"),dcls=d=>{const w=new Date(y,m-1,d).getDay();return(ds(d)===todayS?"today":"")+(w===0?" sun":w===6?" sat":"");};
 let h='<div class="mon"><h3>'+y+'年'+m+'月</h3><div class="tlw"><table class="tl" style="width:'+(118+days*28)+'px"><colgroup><col style="width:118px">'+'<col style="width:28px">'.repeat(days)+'</colgroup><thead><tr><th class="nm">車両</th>';
 for(let d=1;d<=days;d++)h+='<th class="'+dcls(d)+'">'+d+'<br>'+WD[new Date(y,m-1,d).getDay()]+'</th>';
 h+='</tr></thead><tbody>';
 items.forEach(e=>{const rs=e.status==="reschedule"&&e.proposed_date,role=rs?"reqmoved":e.status,b=e.brand==="HDM"?"HDM":"BUD",L=lastDay(e),op="openSheet('"+e.id+"')";
  const s=e.start_date<ms?ms:e.start_date,en=L>me?me:L,has=e.start_date<=me&&L>=ms;
  h+='<tr><td class="nm" onclick="'+op+'">'+esc(e.name)+'<span class="s">'+esc(e.plate_no)+' '+b+'</span></td>';
  for(let d=1;d<=days;){const x=ds(d),we=/sun|sat/.test(dcls(d))?"we":"",td=x===todayS?"today":we;
   if(has&&x===s){const n=dDiff(s,en)+1,cut=e.start_date<ms?" cut":"";
    const md=v=>{const p=v.split("-");return +p[1]+"/"+(+p[2]);};
    const lab=(cut?"〜":md(e.start_date)+(L>e.start_date?"〜":""))+(L>e.start_date||cut?md(L):"")+(role==="approved"?" ✅":"")+(rs?" →🟣"+md(e.proposed_date):"")+(e.memo?" 📝"+esc(e.memo):"");
    h+='<td colspan="'+n+'"><span class="tb '+role+cut+'" onclick="'+op+'" title="'+lab.replace(/"/g,"")+'">'+lab+'</span></td>';d+=n;continue;}
   if(rs&&x===e.proposed_date){h+='<td class="'+td+'"><span class="tb prop" onclick="'+op+'" title="提案日">🟣</span></td>';d++;continue;}
   h+='<td class="'+td+'"></td>';d++;}
  h+='</tr>';});
 return h+'</tbody></table></div></div>';}
function calFor(kind){const list=DATA.filter(e=>e.kind===kind&&inR(e)),cnt=list.length,cls=kind==="車検"?"shaken":"tenken";
 const months=[...new Set(list.flatMap(e=>[...monthsOf(e)]))].sort();
 let inner=months.length?months.map(ym=>monthTL(ym,list.filter(e=>monthsOf(e).has(ym)).sort((a,b)=>a.start_date<b.start_date?-1:a.start_date>b.start_date?1:0))).join(""):'<div class="empty">該当なし</div>';
 return '<div class="grp '+cls+'"><div class="gh">'+(kind==="車検"?"🚗 車検カレンダー":"🔍 点検カレンダー")+'<span class="n">'+cnt+'件</span></div>'+inner+'</div>';}
function render(){document.getElementById("body").innerHTML=calFor("車検")+calFor("点検");
 const s=DATA.filter(e=>e.kind==="車検"&&inR(e)).length,t=DATA.filter(e=>e.kind==="点検"&&inR(e)).length;
 document.getElementById("sub").textContent=(RANGE==="year"?"年内（〜"+yEnd+"）":"今後すべて")+"／車検"+s+"件・点検"+t+"件 ｜ 更新 "+new Date().toLocaleString("ja-JP");}
window.openSheet=function(id){const e=DATA.find(x=>x.id===id);if(!e)return;CUR=e;const st=e.status;const by=e.responded_by?'（回答: '+e.responded_by+'）':"";
 document.getElementById("sheet").innerHTML=
  '<h3>'+e.kind+'　'+e.name+'（'+(e.plate_no||"—")+'）</h3>'+
  '<div class="meta">'+(e.brand==="HDM"?"HANDYMAN":"BUDDICA")+'　項目: '+e.label+'<br>リクエスト日付: <b>'+fmt(e.start_date)+(e.end_date&&e.end_date>e.start_date?'〜'+fmt(e.end_date):"")+'</b>　<span class="badge '+st+'">'+stJp(st)+by+'</span>'+(st==="reschedule"&&e.proposed_date?'<br>🟣整備提案日: <b>'+fmt(e.proposed_date)+'</b>':"")+'</div>'+
  '<label>整備会社名（任意）</label><input id="rBy" placeholder="例: ◯◯自動車" value="'+(e.responded_by||"")+'">'+
  '<button class="btn ok" onclick="respond(\'approve\')">✅ この日（'+fmt(e.start_date)+'）で確定</button>'+
  '<label>別日を提案する日付</label><input id="rDate" type="date" value="'+(e.proposed_date||"")+'">'+
  '<button class="btn re" onclick="respond(\'propose\')">📅 別日を提案する</button>'+
  '<label>メモ（部品待ち・工場都合など）</label><textarea id="rMemo" placeholder="例: 部品入荷待ち／午前のみ可">'+(e.memo||"")+'</textarea>'+
  '<button class="btn mo" onclick="respond(\'memo\')">📝 メモを保存</button>'+
  (st!=="pending"?'<button class="btn rv" onclick="respond(\'revert\')">↩ リクエスト中に戻す（取り消し）</button>':"")+
  '<button class="btn x" onclick="closeSheet()">閉じる</button>';
 document.getElementById("scrim").style.display="flex";}
window.closeSheet=function(){document.getElementById("scrim").style.display="none";CUR=null;}
window.respond=async function(act){if(!CUR)return;const by=(document.getElementById("rBy")||{}).value||"",dt=(document.getElementById("rDate")||{}).value||"",memo=(document.getElementById("rMemo")||{}).value||"";
 if(act==="propose"&&!dt){alert("提案する日付を選んでください");return;}
 if(act==="approve"&&!confirm("この日で確定します。よろしいですか？"))return;
 try{const r=await fetch(BT+"/rest/v1/rpc/bt_inspection_respond",{method:"POST",headers:{apikey:BANON,Authorization:"Bearer "+BANON,"Content-Type":"application/json"},body:JSON.stringify({p_id:CUR.id,p_action:act,p_date:dt,p_by:by,p_memo:memo})});const res=await r.json();
  const ok={approved:"確定しました",proposed:"別日を提案しました",reverted:"リクエスト中に戻しました",memo:"メモを保存しました"};
  if(ok[res]){closeSheet();await load();alert(ok[res]);}else{alert("失敗: "+res);}}catch(e){alert("通信エラー");}}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".seg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");RANGE=b.dataset.r;render();});
document.getElementById("scrim").onclick=e=>{if(e.target.id==="scrim")closeSheet();};
async function load(){try{const r=await fetch(BT+"/rest/v1/rpc/bt_inspection_schedule",{method:"POST",headers:{apikey:BANON,Authorization:"Bearer "+BANON,"Content-Type":"application/json"},body:"{}"});DATA=await r.json();if(!Array.isArray(DATA))DATA=[];}catch(e){document.getElementById("sub").textContent="読み込み失敗";return;}render();}
load();setInterval(()=>{if(!CUR)load();},300000);
</script></body></html>
