<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>HANDYMAN 予約フロー プロトタイプ</title>
<style>
:root{--navy:#0F1F45;--navy2:#1b2f5e;--y:#FABE00;--line:#e3e8f0;--gray:#64748b;--bg:#f5f7fb}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;background:var(--bg);color:#1a2333;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}
.hd{background:var(--navy);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.hd .bars{display:flex;flex-direction:column;gap:2px;transform:skewX(-12deg)}
.hd .bars i{display:block;height:3px;background:var(--y);border-radius:2px}
.hd .bars i:nth-child(1){width:20px}.hd .bars i:nth-child(2){width:15px}.hd .bars i:nth-child(3){width:10px}
.hd h1{font-size:16px;font-weight:900;letter-spacing:.02em}.hd .sub{font-size:9.5px;color:#cbd6ea;font-weight:700;margin-top:1px}
.steps{display:flex;gap:4px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);font-size:10px;color:var(--gray);overflow-x:auto}
.steps span{white-space:nowrap;padding:3px 8px;border-radius:999px;background:#eef2f7;font-weight:700}
.steps span.on{background:var(--navy);color:#fff}.steps span.dn{background:#dcfce7;color:#15803d}
.body{flex:1;padding:18px 16px 90px}
h2{font-size:17px;font-weight:900;color:var(--navy);margin-bottom:4px}
.lead{font-size:12px;color:var(--gray);margin-bottom:16px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:11px;cursor:pointer;transition:.12s;font-size:15px;font-weight:800;color:#1a2333;position:relative}
.opt:hover{border-color:var(--navy)}
.opt.sel{border-color:var(--navy);background:#f4f7ff}
.opt small{display:block;font-size:11.5px;color:var(--gray);font-weight:600;margin-top:3px}
.opt .ic{font-size:20px;margin-right:8px;vertical-align:-3px}
.opt .badge{position:absolute;top:12px;right:14px;font-size:10px;font-weight:900;color:#fff;background:var(--y);color:#1a2333;padding:2px 8px;border-radius:999px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:800;color:var(--navy);margin-bottom:5px}
.field input,.field select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px;font-size:15px;font-family:inherit;background:#fff}
.field input:focus,.field select:focus{outline:none;border-color:var(--navy)}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.veh{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer}
.veh.sel{border-color:var(--navy);background:#f4f7ff}
.veh .vi{width:54px;height:40px;border-radius:8px;background:var(--navy);color:var(--y);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.veh .vn{font-weight:800;font-size:14px}.veh .vs{font-size:11px;color:var(--gray)}
.veh .vp{margin-left:auto;text-align:right;font-weight:900;color:var(--navy)}.veh .vp small{font-weight:600;color:var(--gray);font-size:10px}
.cta{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:560px;width:100%;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(#fff0,#fff 22%)}
.btn{width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit}
.btn.p{background:var(--y);color:#1a2333;box-shadow:0 6px 16px rgba(250,190,0,.4)}
.btn.p:disabled{background:#e3e8f0;color:#aab4c2;box-shadow:none}
.back{background:none;border:none;color:var(--gray);font-size:13px;font-weight:700;cursor:pointer;margin-bottom:10px;padding:4px 0}
.sumcard{background:#f4f7ff;border:1px solid #d6e0f5;border-radius:14px;padding:14px;margin-bottom:14px}
.sumrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #d6e0f5;font-size:13px}
.sumrow:last-child{border-bottom:0}.sumrow b{color:var(--navy)}
.tot{font-size:22px;font-weight:900;color:var(--navy);text-align:center;margin:8px 0}
.note{font-size:11px;color:var(--gray);margin-top:10px;line-height:1.6}
.devtag{font-size:10px;color:#b45309;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:6px 10px;margin-bottom:14px;font-weight:700}
.vt{font-family:monospace;font-size:11px;color:#7c3aed;background:#f5f3ff;padding:2px 6px;border-radius:5px}
</style></head>
<body><div class="wrap">
<div class="hd"><span class="bars"><i></i><i></i><i></i></span><div><h1>HANDYMAN レンタカー</h1><div class="sub">Car Rental ・ プロトタイプ</div></div></div>
<div class="steps" id="steps"></div>
<div class="body" id="body"></div>
<div class="cta" id="cta"></div>
</div>
<script>
const S={area:'',method:'',sd:'',st:'10:00',ed:'',et:'18:00',place:'',flight:'',vclass:'',vname:'',price:0};
// 受取方法→ visit_type/return_type（那覇APP/GASと同じ社内コード）
const VT={delivery:{v:'DEL',r:'COL'},airport:{v:'PUB',r:'BDB'},store:{v:'来店',r:'返却'}};
// サンプル車種（本番はSupabase価格マスターから動的取得）
const CARS={
 sapporo:[{c:'A',n:'アルファード/ヴェルファイア',s:8,p:15000,i:'🚐'},{c:'B',n:'ノア/デリカD5',s:8,p:12000,i:'🚐'},{c:'S',n:'ハリアー/CX-5',s:5,p:9000,i:'🚙'},{c:'C',n:'ロッキー/CX-3',s:5,p:8000,i:'🚙'},{c:'F',n:'ルーミー/ソリオ',s:5,p:6000,i:'🚗'},{c:'H',n:'カローラ/アクセラ',s:5,p:8000,i:'🚗'}],
 naha:[{c:'A',n:'アルファード/ヴェルファイア',s:8,p:15000,i:'🚐'},{c:'B',n:'ノア/デリカD5',s:8,p:12000,i:'🚐'},{c:'S',n:'ハリアー/CX-5',s:5,p:9000,i:'🚙'},{c:'C',n:'ロッキー/CX-3',s:5,p:8000,i:'🚙'},{c:'F',n:'ルーミー/ソリオ',s:5,p:6000,i:'🚗'},{c:'H',n:'カローラ/アクセラ',s:5,p:8000,i:'🚗'}]
};
let step=0; // 0 area,1 method(那覇のみ),2 datetime+detail,3 vehicle,4 confirm
const $=id=>document.getElementById(id);
function methodLabel(m){return {delivery:'デリバリー（指定場所へお届け/回収）',airport:'空港送迎（空港で受渡し）',store:'来店（店舗で受取/返却）'}[m]||''}
function steplist(){
 const names=['エリア','受取方法','日時・詳細','車種','確認'];
 let arr=names; if(S.area==='sapporo')arr=['エリア','日時・詳細','車種','確認'];
 const cur=mapStep();
 $('steps').innerHTML=arr.map((n,i)=>`<span class="${i<cur?'dn':i===cur?'on':''}">${i+1} ${n}</span>`).join('');
}
function mapStep(){ // 表示用インデックス（札幌はmethodをスキップ）
 if(S.area==='sapporo'){return [0,null,1,2,3][step];}
 return step;
}
function days(){if(!S.sd||!S.ed)return 1;const a=new Date(S.sd),b=new Date(S.ed);return Math.max(1,Math.round((b-a)/86400000)+1);}
function render(){
 steplist();let h='',cta='';
 if(step===0){
  h=`<h2>エリアを選択</h2><div class="lead">ご利用の店舗エリアをお選びください。</div>
  <button class="opt ${S.area==='sapporo'?'sel':''}" onclick="pick('area','sapporo')"><span class="ic">❄️</span>札幌エリア<span class="badge">デリバリー専門</span><small>札幌市・北広島市へお届け／回収</small></button>
  <button class="opt ${S.area==='naha'?'sel':''}" onclick="pick('area','naha')"><span class="ic">🌺</span>那覇エリア<small>デリバリー・空港送迎・来店から選べます</small></button>`;
 } else if(step===1){ // 受取方法（那覇のみ）
  h=`<button class="back" onclick="go(0)">‹ エリアへ</button><h2>受取方法を選択</h2><div class="lead">那覇エリアは3つの受取方法があります。</div>
  <button class="opt ${S.method==='delivery'?'sel':''}" onclick="pick('method','delivery')"><span class="ic">📍</span>デリバリー<small>ご指定の場所（ホテル/自宅等）へお届け・回収</small></button>
  <button class="opt ${S.method==='airport'?'sel':''}" onclick="pick('method','airport')"><span class="ic">✈️</span>空港送迎<small>那覇空港で受渡し（便名をお伺いします）</small></button>
  <button class="opt ${S.method==='store'?'sel':''}" onclick="pick('method','store')"><span class="ic">🏢</span>来店<small>店舗で受取・返却</small></button>`;
 } else if(step===2){ // 日時＋受取方法別の詳細
  const m=S.area==='sapporo'?'delivery':S.method;
  h=`<button class="back" onclick="go(S.area==='sapporo'?0:1)">‹ 戻る</button><h2>日時・詳細</h2><div class="lead">${methodLabel(m)}</div>
  <div class="field"><label>📅 出発（貸出）</label><div class="row2"><input type="date" id="sd" value="${S.sd}"><select id="st">${timeOpts(S.st)}</select></div></div>
  <div class="field"><label>📅 返却</label><div class="row2"><input type="date" id="ed" value="${S.ed}"><select id="et">${timeOpts(S.et)}</select></div></div>`;
  if(m==='delivery')h+=`<div class="field"><label>📍 お届け／回収場所</label><input id="place" placeholder="ホテル名・住所など" value="${S.place}"><div class="note">本番では地図で指定（KEYDROPと同じ）。</div></div>`;
  if(m==='airport')h+=`<div class="field"><label>✈️ 到着便名</label><input id="flight" placeholder="例: NH123" value="${S.flight}"><div class="note">那覇空港で受渡し。返却も空港。</div></div>`;
  if(m==='store')h+=`<div class="field"><label>🏢 受取店舗</label><input value="那覇空港店" disabled><div class="note">店舗で受取・返却。</div></div>`;
 } else if(step===3){ // 車種
  const list=CARS[S.area]||[];
  h=`<button class="back" onclick="go(2)">‹ 日時へ</button><h2>車種を選択</h2><div class="lead">${days()}日間・${methodLabel(S.area==='sapporo'?'delivery':S.method)}<br><span style="font-size:11px">※価格はサンプル。本番は価格マスター（シーズン）連動</span></div>`+
  list.map(v=>`<div class="veh ${S.vclass===v.c?'sel':''}" onclick="pickVeh('${v.c}','${v.n}',${v.p})"><div class="vi">${v.i}</div><div><div class="vn">${v.n}<span style="font-size:10px;color:#94a3b8"> ${v.c}クラス</span></div><div class="vs">👥${v.s}名</div></div><div class="vp">¥${(v.p*days()).toLocaleString()}<small>/${days()}日</small></div></div>`).join('');
 } else if(step===4){ // 確認
  const m=S.area==='sapporo'?'delivery':S.method;const vt=VT[m];const sub=S.price*days();const ins=1100*days();
  h=`<button class="back" onclick="go(3)">‹ 車種へ</button><h2>ご予約内容の確認</h2><div class="lead">プロトタイプ：ここで決済（Square/じゃらん）へ進みます。</div>
  <div class="sumcard">
   <div class="sumrow"><span>エリア</span><b>${S.area==='sapporo'?'札幌':'那覇'}</b></div>
   <div class="sumrow"><span>受取方法</span><b>${methodLabel(m)}</b></div>
   <div class="sumrow"><span>貸出</span><b>${S.sd} ${S.st}</b></div>
   <div class="sumrow"><span>返却</span><b>${S.ed} ${S.et}</b></div>
   ${m==='delivery'?`<div class="sumrow"><span>場所</span><b>${S.place||'(未入力)'}</b></div>`:''}
   ${m==='airport'?`<div class="sumrow"><span>便名</span><b>${S.flight||'(未入力)'}</b></div>`:''}
   <div class="sumrow"><span>車種</span><b>${S.vname}（${S.vclass}）</b></div>
   <div class="sumrow"><span>基本料金（${days()}日）</span><b>¥${sub.toLocaleString()}</b></div>
   <div class="sumrow"><span>免責補償</span><b>¥${ins.toLocaleString()}</b></div>
  </div>
  <div class="tot">合計 ¥${(sub+ins).toLocaleString()}</div>
  <div class="devtag">🛠 開発メモ（本番は非表示）：この予約がSupabaseに書かれる際の社内コード →
   visit_type=<span class="vt">${vt.v}</span> / return_type=<span class="vt">${vt.r}</span> / vehicle_class=<span class="vt">${S.vclass}</span> / ota=<span class="vt">${S.area==='sapporo'?'HP(札幌→reservations)':'HP(那覇→nha_reservations)'}</span>
   → そのまま${S.area==='sapporo'?'札幌':'那覇'}APP(admin)で配車・タスク管理。</div>
  <div class="note">※プロトタイプのため決済・DB保存は未接続。フロー/分岐の確認用です。</div>`;
 }
 $('body').innerHTML=h;
 // CTA
 if(step===0)cta=`<button class="btn p" ${S.area?'':'disabled'} onclick="next()">次へ進む</button>`;
 else if(step===1)cta=`<button class="btn p" ${S.method?'':'disabled'} onclick="next()">次へ進む</button>`;
 else if(step===2)cta=`<button class="btn p" onclick="saveDetail()">車種を選ぶ</button>`;
 else if(step===3)cta=`<button class="btn p" ${S.vclass?'':'disabled'} onclick="next()">確認へ</button>`;
 else if(step===4)cta=`<button class="btn p" onclick="alert('プロトタイプ：ここで決済へ。実装時はSupabase保存＋Square/じゃらん。')">この内容で予約（決済へ）</button>`;
 $('cta').innerHTML=cta;
}
function pick(k,v){S[k]=v;render();}
function pickVeh(c,n,p){S.vclass=c;S.vname=n;S.price=p;render();}
function go(s){step=s;render();}
function next(){
 if(step===0){ if(S.area==='sapporo'){S.method='delivery';step=2;} else step=1; }
 else if(step===1){step=2;}
 else if(step===3){step=4;}
 render();
}
function saveDetail(){
 S.sd=$('sd').value;S.ed=$('ed').value;S.st=$('st').value;S.et=$('et').value;
 if($('place'))S.place=$('place').value; if($('flight'))S.flight=$('flight').value;
 if(!S.sd||!S.ed){alert('出発日と返却日を選んでください');return;}
 if(new Date(S.ed)<new Date(S.sd)){alert('返却日は出発日以降にしてください');return;}
 step=3;render();
}
function timeOpts(sel){let h='';for(let i=8;i<=20;i++){const v=(i<10?'0'+i:i)+':00';h+=`<option ${v===sel?'selected':''}>${v}</option>`;const v2=(i<10?'0'+i:i)+':30';h+=`<option ${v2===sel?'selected':''}>${v2}</option>`;}return h;}
render();
</script></body></html>
