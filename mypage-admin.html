<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>マイページ管理ダッシュボード（全店）｜ HANDYMAN</title>
<style>
:root{--navy:#0a1f44;--y:#FABE00;--line:#dbe3ef;--mut:#64748b;--ok:#0e9f50;--dang:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",system-ui,sans-serif;background:#eef2f8;color:#16243f}
header{position:sticky;top:0;z-index:6;background:var(--navy);color:#fff;padding:11px 14px;display:flex;align-items:center;gap:8px}
header .t{font-weight:900;font-size:15px}header .sp{flex:1}
.wrap{max-width:960px;margin:0 auto;padding:12px 10px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 4px rgba(20,40,80,.05)}
.btn{border:0;border-radius:9px;padding:8px 12px;font-weight:800;cursor:pointer;font-family:inherit;font-size:13px}
.btn.ok{background:var(--ok);color:#fff}.btn.dang{background:var(--dang);color:#fff}.btn.g{background:#e8eef7;color:#16243f}
.btn.sm{padding:6px 10px;font-size:12px}
input{font-family:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut);font-size:12px}
.k{font-size:11px;color:var(--mut)}.v{font-weight:700;font-size:14px}
.note{background:#fffbea;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px;white-space:pre-wrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0a1f44;color:#fff;padding:10px 16px;border-radius:10px;font-weight:800;z-index:20;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
/* サマリタイル */
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media(max-width:760px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer;background:#fff;transition:.1s}
.tile:hover{border-color:var(--navy)}
.tile.on{outline:2px solid var(--navy);outline-offset:-2px}
.tile .bn{font-size:11px;font-weight:900;padding:2px 0;border-radius:6px;margin-bottom:6px}
.tile .num{font-size:26px;font-weight:900;line-height:1}
.tile .num.zero{color:#cbd5e1}
.tile .lb{font-size:10px;color:var(--mut);margin-top:3px}
/* リスト */
.filt{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{padding:5px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:12px;cursor:pointer;color:#334155}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.it{border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.it.cancel{border-left-color:var(--dang);background:#fef5f5}
.it.change{border-left-color:#d97706}
.it.ready{border-left-color:#0a58c2}
.it .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bdg{font-size:10.5px;font-weight:900;padding:2px 7px;border-radius:6px;color:#fff}
.it .nm{font-weight:800;font-size:14px}
.it .sub{font-size:11.5px;color:var(--mut);margin-top:3px}
.it .acts{margin-top:9px;display:flex;gap:8px}
.empty{padding:20px;text-align:center;color:var(--mut);font-size:13px}
.lg{cursor:pointer}
</style></head>
<body>
<header><span class="t">📲 マイページ管理</span><span class="mut" style="color:#cfe0ff" id="hdrPin">未処理を確認中…</span><span class="sp"></span>
<button class="btn g sm" onclick="loadAll()">🔄 更新</button></header>
<div class="wrap">

<!-- サマリ -->
<div class="card">
  <div class="row"><b>📊 未処理サマリ</b>
    <span style="width:6px"></span>
    <span class="chip on" data-r="renew" onclick="setRN(true)">🆕 公式リニューアルのみ</span>
    <span class="chip" data-r="all" onclick="setRN(false)">全予約（OTA含む）</span>
    <span class="sp" style="flex:1"></span><span class="mut" id="totline"></span></div>
  <div class="tiles" id="tiles" style="margin-top:10px"></div>
</div>

<!-- リスト（未処理／処理済みアーカイブ 切替） -->
<div class="card">
  <div class="row"><b id="listTitle">店舗未選択</b></div>
  <div class="filt" style="margin-top:8px">
    <span class="chip on" data-v="pending" onclick="setVIEW('pending')">🔴 未処理<span id="v-pending" style="margin-left:4px;opacity:.7">0</span></span>
    <span class="chip" data-v="archive" onclick="setVIEW('archive')">🗂 処理済み（アーカイブ）<span id="v-archive" style="margin-left:4px;opacity:.7">0</span></span>
  </div>
  <div class="filt">
    <span class="chip on" data-t="all" onclick="setTF('all')">全種別</span>
    <span class="chip" data-t="cancel" onclick="setTF('cancel')">🚫 キャンセル</span>
    <span class="chip" data-t="change" onclick="setTF('change')">✏️ 変更</span>
    <span class="chip" data-t="ready" onclick="setTF('ready')">🕒 早め回収</span>
  </div>
  <div id="list" style="margin-top:10px"><div class="empty">読み込み中…</div></div>
</div>

<!-- 予約検索 -->
<div class="card">
  <div class="row lg" onclick="var e=document.getElementById('searchBody');e.style.display=e.style.display==='none'?'block':'none'"><b>🔎 予約検索</b><span class="sp" style="flex:1"></span><span class="mut">予約番号で検索 ▾</span></div>
  <div id="searchBody" style="display:none;margin-top:10px">
    <div class="row"><input id="q" placeholder="予約番号（HDMS/HDMN/HDMT/KDN…）" style="flex:1" onkeydown="if(event.key==='Enter')search()"><button class="btn g" onclick="search()">検索</button></div>
    <div id="sresult"></div>
  </div>
</div>

</div>
<div class="toast" id="toast"></div>
<script>
const MAIN="https://ckrxttbnawkclshczsia.supabase.co";
const MAIN_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
const BT="https://ggqugvyskyiblxiycpci.supabase.co";
const BT_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18";
let ITEMS=[], TF="all", BF=localStorage.getItem('mpa_bucket')||"", VIEW="pending", RN=(localStorage.getItem('mpa_rn')!=="0");
const BUCK={
  hdm_spk:{n:"HDM / 札幌",c:"#0a58c2",ef:MAIN+"/functions/v1/handyman-mypage",anon:MAIN_ANON,my:"https://nosh2318.github.io/spk-task/my.html?t=",myLb:"📄 マイページ"},
  hdm_nha:{n:"HDM / 那覇",c:"#166534",ef:MAIN+"/functions/v1/handyman-mypage-nha",anon:MAIN_ANON,my:"https://nosh2318.github.io/naha-project/my-nha.html?t=",myLb:"📄 マイページ"},
  hdm_tkm:{n:"HDM / 高松",c:"#b45309",ef:BT+"/functions/v1/handyman-mypage-tkm",anon:BT_ANON,my:"https://nosh2318.github.io/spk-task/my-tkm.html?t=",myLb:"📄 マイページ"},
  but_tkm:{n:"BUT / 高松",c:"#7c3aed",ef:BT+"/functions/v1/handyman-mypage-tkm",anon:BT_ANON,my:"https://buddica-touring.github.io/app/guide/?t=",myLb:"📘 ご利用ガイド"},
  key_spk:{n:"KEY / 札幌",c:"#0d9488",ef:MAIN+"/functions/v1/keydrop-mypage",anon:MAIN_ANON,my:"https://keydrop.jp/mypage.html?t=",myLb:"📄 マイページ"},
  key_nha:{n:"KEY / 那覇",c:"#0891b2",ef:MAIN+"/functions/v1/keydrop-mypage",anon:MAIN_ANON,my:"https://keydrop.jp/mypage.html?t=",myLb:"📄 マイページ"},
};
function myLink(x){var B=BUCK[x.bucket];if(!B||!x.token)return"";return `<a href="${B.my}${encodeURIComponent(x.token)}" target="_blank" rel="noopener" class="btn g sm" style="text-decoration:none;display:inline-block">${B.myLb}を開く 🔗</a>`;}
const BORD=["hdm_spk","hdm_nha","hdm_tkm","but_tkm","key_spk","key_nha"];
const OTAJP={J:"じゃらん",R:"楽天",O:"エアトリ",RC:"レンタカーcom",HANDYMAN:"オフィシャル(HP)",HP:"オフィシャル(HP)",KEYDROP:"KEYDROP"};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1900);}
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function otaJp(o){return OTAJP[o]||o||"—";}
function typeOf(f){f=String(f||"");if(/cancel|キャンセル/.test(f))return"cancel";if(f==="ready")return"ready";return"change";}
function tyLabel(ty,f){return ty==="cancel"?"🚫 キャンセル申請":ty==="ready"?"🕒 早め回収OK":"✏️ 変更（"+esc(f)+"）";}
async function rpc(base,anon,fn){try{const r=await fetch(base+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:anon,Authorization:"Bearer "+anon,"Content-Type":"application/json"},body:"{}"});if(!r.ok)return[];const j=await r.json();return Array.isArray(j)?j:[];}catch(e){return[];}}
async function loadAll(){
  document.getElementById('hdrPin').textContent="読み込み中…";
  const [a,b]=await Promise.all([rpc(MAIN,MAIN_ANON,"mpadmin_pending"),rpc(BT,BT_ANON,"mpadmin_pending_bt")]);
  ITEMS=a.concat(b).map(x=>Object.assign({},x,{ty:typeOf(x.field)}));
  renderTiles();renderList();
  const req=ITEMS.filter(x=>x.status==="requested").length;
  document.getElementById('hdrPin').textContent="未処理 合計 "+req+"件";
}
function rnOk(x){return RN?(x.renewal!==false):true;}
function reqBy(bk){return ITEMS.filter(x=>x.status==="requested"&&x.bucket===bk&&rnOk(x)).length;}
function setRN(v){RN=v;localStorage.setItem('mpa_rn',v?"1":"0");document.querySelectorAll('.chip[data-r]').forEach(c=>c.classList.toggle('on',(c.dataset.r==='renew')===v));renderTiles();renderList();}
function renderTiles(){
  const total=ITEMS.filter(x=>x.status==="requested").length;
  document.getElementById('totline').textContent="未処理 合計 "+total+"件";
  document.getElementById('tiles').innerHTML=BORD.map(bk=>{
    const n=reqBy(bk);const on=BF===bk;
    return `<div class="tile ${on?'on':''}" onclick="setBF('${bk}')">
      <div class="bn" style="background:${BUCK[bk].c}22;color:${BUCK[bk].c}">${BUCK[bk].n}</div>
      <div class="num ${n?'':'zero'}" style="${n?'color:'+BUCK[bk].c:''}">${n}</div>
      <div class="lb">未処理</div></div>`;
  }).join("");
}
function setBF(bk){BF=bk;localStorage.setItem('mpa_bucket',bk);renderTiles();renderList();}
function setTF(t){TF=t;document.querySelectorAll('.chip[data-t]').forEach(c=>c.classList.toggle('on',c.dataset.t===t));renderList();}
function setVIEW(v){VIEW=v;document.querySelectorAll('.chip[data-v]').forEach(c=>c.classList.toggle('on',c.dataset.v===v));renderList();}
function itKey(x){return x.bucket+"-"+x.id;}
function chBadges(x){var a=[];
  a.push(x.mail?'<span class="pill" style="background:#e0f2fe;color:#0369a1">📧 メール</span>':'<span class="pill" style="background:#fee2e2;color:#b91c1c">📧 メールなし</span>');
  if(x.line)a.push('<span class="pill" style="background:#dcfce7;color:#166534">📱 LINE連携</span>');
  return '<span style="display:inline-flex;gap:5px;flex-wrap:wrap">'+a.join('')+'</span>';}
function renderList(){
  const el=document.getElementById('list');
  const inB=x=>x.bucket===BF&&rnOk(x);
  const req=ITEMS.filter(x=>x.status==="requested"&&BF&&inB(x));
  const arch=ITEMS.filter(x=>x.status!=="requested"&&BF&&inB(x));
  document.getElementById('v-pending').textContent=req.length;
  document.getElementById('v-archive').textContent=arch.length;
  document.getElementById('listTitle').textContent=(BF&&BUCK[BF]?BUCK[BF].n:"店舗未選択")+(VIEW==="archive"?"｜🗂 処理済み（アーカイブ）":"｜🔴 未処理");
  if(!BF||!BUCK[BF]){el.innerHTML='<div class="empty">↑ 上のタイルから店舗を選択してください</div>';return;}
  const prio={cancel:0,change:1,ready:2};
  if(VIEW==="pending"){
    let arr=req.filter(x=>TF==="all"||x.ty===TF).sort((a,b)=>(prio[a.ty]-prio[b.ty])||String(b.at||"").localeCompare(String(a.at||"")));
    if(!arr.length){el.innerHTML='<div class="empty">✅ この店舗の未処理はありません</div>';return;}
    el.innerHTML=arr.map(x=>{const B=BUCK[x.bucket];
      return `<div class="it ${x.ty}"><div class="top">
        <span class="bdg" style="background:${B.c}">${B.n}</span>
        <span class="nm">${esc(x.name||'-')} 様</span>
        <span class="mut">${tyLabel(x.ty,x.field)}</span>
        <span class="sp" style="flex:1"></span><span class="mut">${esc((x.at||'').slice(5,16).replace('T',' '))}</span></div>
        <div class="sub">${esc(x.rid)} ・ ${esc(x.sd||'-')}〜${esc(x.ed||'-')} ・ ${esc(x.cls||'-')} ・ ¥${Number(x.price||0).toLocaleString()} ・ ${esc(otaJp(x.ota))}${x.renewal===false?' ・ <b style="color:#b45309">既存OTA</b>':''}</div>
        <div class="sub" style="margin-top:4px">${chBadges(x)}${x.mail?' <span class="mut">'+esc(x.mail)+'</span>':''}</div>
        ${x.newv?`<div class="sub">希望内容: <b>${esc(x.newv)}</b></div>`:''}
        ${x.note?`<div class="note">📝 ${esc(x.note)}</div>`:''}
        <div class="acts" style="flex-wrap:wrap"><button class="btn ok sm" onclick="decide('${itKey(x)}','approved')">✅ 承認（反映＋メール通知）</button>
        <button class="btn dang sm" onclick="decide('${itKey(x)}','rejected')">🚫 却下</button>
        <button class="btn g sm" onclick="decide('${itKey(x)}','acknowledged')">✔ 確認済み（対応不要）</button>
        ${myLink(x)}</div></div>`;
    }).join("");
  }else{
    let arr=arch.filter(x=>TF==="all"||x.ty===TF).sort((a,b)=>String(b.at||"").localeCompare(String(a.at||"")));
    if(!arr.length){el.innerHTML='<div class="empty">🗂 処理済み（直近30日）はありません</div>';return;}
    el.innerHTML=arr.map(x=>{const B=BUCK[x.bucket];
      const lb=x.status==="approved"?{t:"✅ 承認済",c:"#0e9f50"}:x.status==="rejected"?{t:"🚫 却下",c:"#dc2626"}:{t:"✔ 確認済み",c:"#64748b"};
      return `<div class="it ${x.ty}" style="opacity:.9"><div class="top">
        <span class="bdg" style="background:${lb.c}">${lb.t}</span>
        <span class="nm">${esc(x.name||'-')} 様</span>
        <span class="mut">${tyLabel(x.ty,x.field)}</span>
        <span class="sp" style="flex:1"></span><span class="mut">${esc((x.at||'').slice(5,16).replace('T',' '))}</span></div>
        <div class="sub">${esc(x.rid)} ・ ${esc(x.sd||'-')}〜${esc(x.ed||'-')} ・ ${esc(x.cls||'-')} ・ ${esc(otaJp(x.ota))}</div>
        ${x.newv?`<div class="sub">内容: ${esc(x.newv)}</div>`:''}
        ${myLink(x)?`<div style="margin-top:8px">${myLink(x)}</div>`:''}</div>`;
    }).join("");
  }
}
function getPin(){let p=localStorage.getItem('mpa_pin')||"";if(!p){p=(prompt("承認/却下の共通PINを入力してください（初回のみ）")||"").trim();if(p)localStorage.setItem('mpa_pin',p);}return p;}
async function decide(key,decision){
  const x=ITEMS.find(i=>itKey(i)===key);if(!x)return;const B=BUCK[x.bucket];
  const jp=decision==="approved"?"承認":decision==="rejected"?"却下":"確認済み（対応不要でアーカイブ）";
  const extra=decision==="approved"?"反映し、顧客へメール通知します。":decision==="acknowledged"?"反映・通知はせず、リストから外してアーカイブします。":"";
  if(!confirm(jp+"にします。\n【"+B.n+"】"+(x.name||'')+"様 / "+x.rid+"\n"+extra+"\nよろしいですか？"))return;
  const pin=getPin();if(!pin){toast("PINが未入力です");return;}
  try{const r=await fetch(B.ef,{method:"POST",headers:{apikey:B.anon,Authorization:"Bearer "+B.anon,"Content-Type":"application/json"},
    body:JSON.stringify({action:"decide",admin_pin:pin,change_id:isNaN(+x.id)?x.id:+x.id,decision})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok){toast(decision==="approved"?"承認しました":decision==="rejected"?"却下しました":"確認済みにしました");x.status=decision;x.at=new Date().toISOString();renderTiles();renderList();
      const req=ITEMS.filter(i=>i.status==="requested").length;document.getElementById('hdrPin').textContent="未処理 "+req+"件";}
    else if(r.status===401){localStorage.removeItem('mpa_pin');toast("PINが違います。もう一度お試しください");}
    else toast("失敗: "+(j.error||("http "+r.status)));
  }catch(e){toast("通信エラー");}
}
async function api(base,anon,path){const r=await fetch(base+"/rest/v1/"+path,{headers:{apikey:anon,Authorization:"Bearer "+anon}});if(!r.ok)return[];return await r.json().catch(()=>[]);}
async function search(){
  const q=document.getElementById('q').value.trim();const out=document.getElementById('sresult');if(!q){out.innerHTML="";return;}
  out.innerHTML='<p class="mut">※ 予約詳細の検索は認証が必要なため、この画面では未処理一覧に含まれる予約のみ表示します。</p>';
  const hit=ITEMS.filter(x=>String(x.rid)===q||String(x.rid).indexOf(q)>=0);
  if(!hit.length){out.innerHTML='<p class="mut">未処理一覧に該当予約はありません。</p>';return;}
  out.innerHTML=hit.map(x=>{const B=BUCK[x.bucket];return `<div class="it ${x.ty}"><div class="top"><span class="bdg" style="background:${B.c}">${B.n}</span><span class="nm">${esc(x.name||'-')} 様</span><span class="mut">${esc(x.rid)}</span></div>
  <div class="sub">${esc(x.sd||'-')}〜${esc(x.ed||'-')} ・ ${esc(x.cls||'-')} ・ ¥${Number(x.price||0).toLocaleString()} ・ ${tyLabel(x.ty,x.field)} ・ ${x.status}</div>${x.note?`<div class="note">📝 ${esc(x.note)}</div>`:''}</div>`;}).join("");
}
document.querySelectorAll('.chip[data-r]').forEach(c=>c.classList.toggle('on',(c.dataset.r==='renew')===RN));
loadAll();
</script>
</body></html>
