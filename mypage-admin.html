<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>マイページ管理（全店統合・カンバン）｜ HANDYMAN</title>
<style>
:root{--navy:#0a1f44;--y:#FABE00;--line:#dbe3ef;--mut:#64748b;--ok:#0e9f50;--dang:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",system-ui,sans-serif;background:#eef2f8;color:#16243f}
header{position:sticky;top:0;z-index:6;background:var(--navy);color:#fff;padding:11px 14px;display:flex;align-items:center;gap:8px}
header .t{font-weight:900;font-size:15px}header .sp{flex:1}
.wrap{max-width:1160px;margin:0 auto;padding:12px 10px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 1px 4px rgba(20,40,80,.05)}
.btn{border:0;border-radius:9px;padding:8px 12px;font-weight:800;cursor:pointer;font-family:inherit;font-size:13px}
.btn.ok{background:var(--ok);color:#fff}.btn.dang{background:var(--dang);color:#fff}.btn.g{background:#e8eef7;color:#16243f}.btn.y{background:var(--y);color:#10203f}
.btn.sm{padding:6px 10px;font-size:12px}
input,select{font-family:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
.b-spk{background:#e0edff;color:#0a58c2}.b-nha{background:#dcfce7;color:#166534}.b-tkm{background:#fef3c7;color:#92400e}
.mut{color:var(--mut);font-size:12px}
.k{font-size:11px;color:var(--mut)}.v{font-weight:700;font-size:14px}
.note{background:#fffbea;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px;white-space:pre-wrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0a1f44;color:#fff;padding:10px 16px;border-radius:10px;font-weight:800;z-index:20;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.pill{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:#f1f5f9;color:#475569}
small.err{color:var(--dang)}
.lg{cursor:pointer}
/* 店舗タブ */
.stabs{display:flex;gap:6px;position:sticky;top:44px;background:#eef2f8;padding:8px 0;z-index:5}
.stab{padding:7px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:13px;cursor:pointer;color:#334155}
.stab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* カンバン */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.col{background:#f4f6fb;border:1px solid var(--line);border-radius:12px;padding:8px;min-height:200px}
.col.drop{outline:2px dashed var(--navy);outline-offset:-4px;background:#eaf0fb}
.colh{font-weight:900;font-size:13px;padding:4px 6px 8px;display:flex;align-items:center;gap:6px}
.colh .c{background:#fff;border:1px solid var(--line);border-radius:999px;font-size:11px;padding:0 7px}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(20,40,80,.05)}
.kc:active{cursor:grabbing}
.kc.dragging{opacity:.5}
.kc.cancel{border-left:4px solid var(--dang);background:#fef4f4}
.kc.change{border-left:4px solid #d97706}
.kc.ready{border-left:4px solid #0a58c2}
.kc .nm{font-weight:800;font-size:13.5px}
.kc .sub{font-size:11.5px;color:var(--mut);margin-top:2px}
.kc .ty{font-size:11px;font-weight:800}
.kc .acts{margin-top:8px;display:none;gap:6px}
.kc.open .acts{display:flex}
.kc.done{opacity:.75;cursor:default}
.empty{padding:14px;text-align:center;color:var(--mut);font-size:12px}
.hint{font-size:11.5px;color:var(--mut);margin:2px 0 6px}
@media(max-width:720px){.board{grid-template-columns:1fr}.wrap{padding-bottom:60px}}
</style></head>
<body>
<header><span class="t">📲 マイページ管理</span><span class="pill" id="hdrLogin">未ログイン</span><span class="sp"></span>
<button class="btn g sm" onclick="loadAll()">🔄 更新</button></header>
<div class="wrap">

<!-- ログイン -->
<div class="card" id="loginCard">
  <div class="row lg" onclick="toggleLogin()"><b>👤 スタッフログイン</b><span class="sp" style="flex:1"></span><span class="mut" id="loginSummary">名前＋番号でログイン</span><span id="loginCaret">▾</span></div>
  <div id="loginBody" style="margin-top:10px">
    <p class="mut">札幌・那覇は「本社ログイン」1回でどちらも操作可。高松は別ログイン。</p>
    <div class="row" style="margin-top:6px;align-items:flex-start">
      <div style="flex:1;min-width:180px"><div class="k">本社ログイン（札幌・那覇）</div>
        <div class="row" style="margin-top:4px"><input id="mUser" placeholder="名前 例: oshita" style="flex:2"><input id="mPass" type="password" placeholder="番号" style="flex:1" onkeydown="if(event.key==='Enter')loginMain()"></div>
        <div class="row" style="margin-top:6px"><button class="btn y sm" onclick="loginMain()">ログイン</button><span id="mState" class="mut"></span></div></div>
      <div style="flex:1;min-width:180px"><div class="k">高松ログイン</div>
        <div class="row" style="margin-top:4px"><input id="bUser" placeholder="名前 例: oshita" style="flex:2"><input id="bPass" type="password" placeholder="番号" style="flex:1" onkeydown="if(event.key==='Enter')loginBt()"></div>
        <div class="row" style="margin-top:6px"><button class="btn y sm" onclick="loginBt()">ログイン</button><span id="bState" class="mut"></span></div></div>
    </div>
  </div>
</div>

<!-- 店舗タブ -->
<div class="stabs" id="stabs" style="display:none"></div>
<p class="hint" id="hint" style="display:none">カードを「✅承認・反映済」または「🚫却下」の列へドラッグで処理（確認あり）。カードをタップすると承認/却下ボタンも出ます。</p>

<!-- カンバン -->
<div id="board"></div>

<!-- 予約検索 -->
<div class="card">
  <div class="row lg" onclick="var e=document.getElementById('searchBody');e.style.display=e.style.display==='none'?'block':'none'"><b>🔎 予約検索</b><span class="sp" style="flex:1"></span><span class="mut">予約番号で検索 ▾</span></div>
  <div id="searchBody" style="display:none;margin-top:10px">
    <div class="row"><input id="q" placeholder="予約番号（HDMS/HDMN/HDMT…）" style="flex:1" onkeydown="if(event.key==='Enter')search()"><button class="btn g" onclick="search()">検索</button></div>
    <div id="sresult"></div>
  </div>
</div>

</div>
<div class="toast" id="toast"></div>
<script>
const MAIN="https://ckrxttbnawkclshczsia.supabase.co";
const MAIN_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
const BT="https://ggqugvyskyiblxiycpci.supabase.co";
const BT_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18";
let TOK={main:localStorage.getItem('mpa_main')||"",bt:localStorage.getItem('mpa_bt')||""};
let ITEMS=[], STORE=null, DRAG=null;
const OTAJP={J:"じゃらん",R:"楽天",O:"エアトリ",RC:"レンタカーcom",HANDYMAN:"オフィシャル(HP)",HP:"オフィシャル(HP)"};
const STL={spk:{n:"札幌",b:"b-spk"},nha:{n:"那覇",b:"b-nha"},tkm:{n:"高松",b:"b-tkm"}};
const COLS=[{k:"requested",t:"🔴 承認待ち"},{k:"approved",t:"✅ 承認・反映済"},{k:"rejected",t:"🚫 却下"}];
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1900);}
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function otaJp(o){return OTAJP[o]||o||"—";}
function typeOf(f){f=String(f||"");if(/cancel|キャンセル/.test(f))return"cancel";if(f==="ready")return"ready";return"change";}
function tyLabel(ty,f){return ty==="cancel"?"🚫 キャンセル申請":ty==="ready"?"🕒 早め回収OK":"✏️ 変更（"+esc(f)+"）";}
function toggleLogin(){const b=document.getElementById('loginBody');b.style.display=b.style.display==='none'?'block':'none';document.getElementById('loginCaret').textContent=b.style.display==='none'?'▸':'▾';}
function toggleLoginClose(){if(TOK.main||TOK.bt){document.getElementById('loginBody').style.display='none';document.getElementById('loginCaret').textContent='▸';}}
function updHdr(){const on=[];if(TOK.main)on.push("本社");if(TOK.bt)on.push("高松");
  document.getElementById('hdrLogin').textContent=on.length?("✅ "+on.join("＋")):"未ログイン";
  document.getElementById('loginSummary').textContent=on.length?("ログイン: "+on.join("／")):"名前＋番号でログイン";
  const show=on.length>0;document.getElementById('stabs').style.display=show?"flex":"none";document.getElementById('hint').style.display=show?"block":"none";}
async function login(base,anon,email,pass){const r=await fetch(base+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:anon,"Content-Type":"application/json"},body:JSON.stringify({email,password:pass})});const j=await r.json();if(!r.ok||!j.access_token)throw new Error(j.error_description||j.msg||"ログイン失敗");return j.access_token;}
async function loginMain(){const st=document.getElementById('mState');st.textContent="…";try{const u=document.getElementById('mUser').value.trim();const email=u.indexOf('@')>=0?u:(u+"@spk.hdm");TOK.main=await login(MAIN,MAIN_ANON,email,document.getElementById('mPass').value.trim());localStorage.setItem('mpa_main',TOK.main);st.textContent="✅";STORE=null;updHdr();toggleLoginClose();loadAll();}catch(e){st.innerHTML='<small class="err">'+esc(e.message)+'</small>';}}
async function loginBt(){const st=document.getElementById('bState');st.textContent="…";try{const u=document.getElementById('bUser').value.trim();const email=u.indexOf('@')>=0?u:(u+"@bt.hdm");TOK.bt=await login(BT,BT_ANON,email,document.getElementById('bPass').value.trim());localStorage.setItem('mpa_bt',TOK.bt);st.textContent="✅";STORE=null;updHdr();toggleLoginClose();loadAll();}catch(e){st.innerHTML='<small class="err">'+esc(e.message)+'</small>';}}
function H(base,tok){return{apikey:base===BT?BT_ANON:MAIN_ANON,Authorization:"Bearer "+(tok||(base===BT?BT_ANON:MAIN_ANON))};}
async function api(base,tok,path){const r=await fetch(base+"/rest/v1/"+path,{headers:H(base,tok)});if(!r.ok)return[];return await r.json().catch(()=>[]);}

async function loadPending(){
  const items=[];
  const stMap=["requested","approved","rejected"];
  if(TOK.main){for(const store of ["spk","nha"]){
    const rows=await api(MAIN,TOK.main,`mypage_changes?store=eq.${store}&status=in.(requested,approved,rejected)&order=created_at.desc&limit=400&select=id,reservation_id,field,new_value,note,status,created_at`);
    const rtbl=store==="spk"?"reservations":"nha_reservations";const dcol=store==="spk"?"lend_date,return_date,vehicle":"start_date,end_date,vehicle_class";
    for(const c of rows){ if(c.status!=="requested"){items.push(mk(store,c,{}));continue;}
      const rv=(await api(MAIN,TOK.main,`${rtbl}?id=eq.${encodeURIComponent(c.reservation_id)}&select=name,ota,${dcol},price,mail`))[0]||{};
      items.push(mk(store,c,rv));}
  }}
  if(TOK.bt){const rows=await api(BT,TOK.bt,`bt_reservation_changes?status=in.(requested,approved,rejected)&order=created_at.desc&limit=400&select=id,reservation_id,change_type,field_name,new_value,status,created_at`);
    for(const c of rows){c.field=c.change_type||c.field_name; if(c.status!=="requested"){items.push(mk("tkm",c,{}));continue;}
      const rv=(await api(BT,TOK.bt,`bt_reservations?id=eq.${encodeURIComponent(c.reservation_id)}&select=name,ota,start_date,end_date,vehicle_class,price,mail`))[0]||{};
      items.push(mk("tkm",c,rv));}}
  items.forEach(it=>it.ty=typeOf(it.field));
  ITEMS=items;if(!STORE)STORE=firstStore();renderTabs();render();
}
function mk(store,c,rv){return{store,id:c.id,rid:c.reservation_id,field:c.field,newv:c.new_value,note:c.note||"",status:c.status,at:c.created_at,name:rv.name,ota:rv.ota,sd:rv.lend_date||rv.start_date,ed:rv.return_date||rv.end_date,cls:rv.vehicle||rv.vehicle_class,price:rv.price,mail:rv.mail};}
function stores(){const a=[];if(TOK.main){a.push("spk","nha");}if(TOK.bt)a.push("tkm");return a;}
function firstStore(){return stores()[0]||"spk";}
function renderTabs(){const el=document.getElementById('stabs');
  el.innerHTML=stores().map(s=>{const n=ITEMS.filter(it=>it.store===s&&it.status==="requested").length;
    return `<span class="stab ${STORE===s?'on':''}" onclick="setStore('${s}')">${STL[s].n}${n?` <b style="color:${STORE===s?'#FABE00':'#dc2626'}">${n}</b>`:''}</span>`;}).join("");}
function setStore(s){STORE=s;renderTabs();render();}
function render(){
  const board=document.getElementById('board');
  if(!TOK.main&&!TOK.bt){board.innerHTML='<div class="card"><div class="empty">↑ ログインすると承認待ちボードが表示されます</div></div>';return;}
  const arr=ITEMS.filter(it=>it.store===STORE);
  const prio={cancel:0,change:1,ready:2};
  board.innerHTML=`<div class="board">`+COLS.map(col=>{
    let cards=arr.filter(it=>it.status===col.k);
    if(col.k==="requested")cards.sort((a,b)=>(prio[a.ty]-prio[b.ty])||String(b.at||"").localeCompare(String(a.at||"")));
    else cards.sort((a,b)=>String(b.at||"").localeCompare(String(a.at||""))).splice(30);
    return `<div class="col" data-st="${col.k}" ondragover="dOver(event,this)" ondragleave="this.classList.remove('drop')" ondrop="dDrop(event,'${col.k}')">
      <div class="colh">${col.t}<span class="c">${cards.length}</span></div>
      ${cards.map(it=>cardHtml(it,col.k)).join("")||'<div class="empty">—</div>'}
    </div>`;}).join("")+`</div>`;
}
function cardHtml(it,colk){
  const done=colk!=="requested";const key=it.store+"-"+it.id;
  return `<div class="kc ${it.ty} ${done?'done':''}" ${done?'':'draggable="true"'} data-key="${key}"
    ${done?'':`ondragstart="dStart(event,'${key}')" ondragend="dEnd(event)" onclick="this.classList.toggle('open')"`}>
    <div class="ty">${tyLabel(it.ty,it.field)}</div>
    <div class="nm">${esc(it.name||'-')} 様</div>
    <div class="sub">${esc(it.rid)}</div>
    <div class="sub">${esc(it.sd||'-')}〜${esc(it.ed||'-')} ・ ${esc(it.cls||'-')} ・ ¥${Number(it.price||0).toLocaleString()}</div>
    ${it.newv?`<div class="sub">希望: ${esc(it.newv)}</div>`:''}
    ${it.note?`<div class="note">📝 ${esc(it.note)}</div>`:''}
    ${done?`<div class="sub">${colk==='approved'?'✅ 反映済':'🚫 却下'}・${esc((it.at||'').slice(5,16).replace('T',' '))}</div>`:
      `<div class="acts"><button class="btn ok sm" onclick="event.stopPropagation();act('${key}','approved')">✅ 承認</button>
       <button class="btn dang sm" onclick="event.stopPropagation();act('${key}','rejected')">🚫 却下</button></div>`}
  </div>`;
}
function itByKey(key){return ITEMS.find(it=>it.store+"-"+it.id===key);}
function dStart(e,key){DRAG=key;e.dataTransfer.effectAllowed="move";const el=e.target.closest('.kc');if(el)el.classList.add('dragging');}
function dEnd(e){const el=e.target.closest('.kc');if(el)el.classList.remove('dragging');DRAG=null;document.querySelectorAll('.col').forEach(c=>c.classList.remove('drop'));}
function dOver(e,col){e.preventDefault();e.dataTransfer.dropEffect="move";document.querySelectorAll('.col').forEach(c=>c.classList.remove('drop'));col.classList.add('drop');}
function dDrop(e,colk){e.preventDefault();document.querySelectorAll('.col').forEach(c=>c.classList.remove('drop'));
  if(!DRAG)return;const it=itByKey(DRAG);if(!it||it.status!=="requested")return;
  if(colk==="approved")act(DRAG,"approved");else if(colk==="rejected")act(DRAG,"rejected");DRAG=null;}
async function act(key,decision){
  const it=itByKey(key);if(!it)return;const store=it.store;const st=store==="tkm"?TOK.bt:TOK.main;if(!st){toast("先にログインしてください");return;}
  const msg=decision==="approved"?`【${STL[store].n}】${it.name||''}様 の「${tyLabel(it.ty,it.field).replace(/^[^ ]+ /,'')}」を承認します。\n反映し、顧客へメール通知します。よろしいですか？`:`【${STL[store].n}】${it.name||''}様 の申請を却下します。よろしいですか？`;
  if(!confirm(msg))return;
  const fn=store==="spk"?MAIN+"/functions/v1/handyman-mypage":store==="nha"?MAIN+"/functions/v1/handyman-mypage-nha":BT+"/functions/v1/handyman-mypage-tkm";
  const anon=store==="tkm"?BT_ANON:MAIN_ANON;
  try{const r=await fetch(fn,{method:"POST",headers:{apikey:anon,Authorization:"Bearer "+anon,"Content-Type":"application/json"},body:JSON.stringify({action:"decide",staff_token:st,change_id:it.id,decision})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok){toast(decision==="approved"?"承認しました":"却下しました");it.status=decision;renderTabs();render();}
    else toast("失敗: "+(j.error||("http "+r.status)));}catch(e){toast("通信エラー");}
}
async function search(){
  const q=document.getElementById('q').value.trim();const out=document.getElementById('sresult');if(!q){out.innerHTML="";return;}out.innerHTML='<p class="mut">検索中…</p>';const hits=[];
  if(TOK.main){const s=(await api(MAIN,TOK.main,`reservations?id=eq.${encodeURIComponent(q)}&select=id,name,ota,lend_date,return_date,vehicle,price,status,del_place,insurance,memo,mail`))[0];if(s)hits.push({store:"札幌",...s,sd:s.lend_date,ed:s.return_date,cls:s.vehicle});
    const n=(await api(MAIN,TOK.main,`nha_reservations?id=eq.${encodeURIComponent(q)}&select=id,name,ota,start_date,end_date,vehicle_class,price,status,del_place,insurance,memo,mail`))[0];if(n)hits.push({store:"那覇",...n,sd:n.start_date,ed:n.end_date,cls:n.vehicle_class});}
  if(TOK.bt){const t=(await api(BT,TOK.bt,`bt_reservations?id=eq.${encodeURIComponent(q)}&select=id,name,ota,start_date,end_date,vehicle_class,price,status,del_place,insurance,memo,mail`))[0];if(t)hits.push({store:"高松",...t,sd:t.start_date,ed:t.end_date,cls:t.vehicle_class});}
  if(!hits.length){out.innerHTML='<p class="mut">該当なし（ログイン済みの店舗のみ検索）。</p>';return;}
  out.innerHTML=hits.map(h=>`<div class="card"><div class="row"><span class="pill">${h.store}</span> <b>${esc(h.id)}</b> <span class="mut">${esc(h.status||"")}</span></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;margin:8px 0"><div><div class="k">お客様</div><div class="v">${esc(h.name||"-")} 様</div></div>
  <div><div class="k">ご予約元</div><div class="v">${esc(otaJp(h.ota))}</div></div>
  <div><div class="k">利用期間</div><div class="v">${esc(h.sd||"-")} 〜 ${esc(h.ed||"-")}</div></div>
  <div><div class="k">車両/金額</div><div class="v">${esc(h.cls||"-")} / ¥${Number(h.price||0).toLocaleString()}</div></div>
  <div><div class="k">受け渡し</div><div class="v">${esc(h.del_place||"-")}</div></div>
  <div><div class="k">補償</div><div class="v">${esc(h.insurance||"-")}</div></div></div>
  ${h.memo?`<div class="note">📝 備考・ご要望: ${esc(h.memo)}</div>`:""}</div>`).join("");
}
function loadAll(){updHdr();loadPending();}
updHdr();toggleLoginClose();loadAll();
</script>
</body></html>
