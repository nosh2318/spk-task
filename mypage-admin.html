<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>マイページ管理（全店統合）｜ HANDYMAN</title>
<style>
:root{--navy:#0a1f44;--y:#FABE00;--line:#dbe3ef;--mut:#64748b;--ok:#0e9f50;--dang:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",system-ui,sans-serif;background:#eef2f8;color:#16243f}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header .t{font-weight:900;font-size:16px}header .sp{flex:1}
.wrap{max-width:920px;margin:0 auto;padding:14px 12px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 1px 4px rgba(20,40,80,.05)}
.btn{border:0;border-radius:9px;padding:9px 14px;font-weight:800;cursor:pointer;font-family:inherit;font-size:13px}
.btn.ok{background:var(--ok);color:#fff}.btn.dang{background:var(--dang);color:#fff}.btn.g{background:#e8eef7;color:#16243f}
.btn.y{background:var(--y);color:#10203f}
input{font-family:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
.b-spk{background:#e0edff;color:#0a58c2}.b-nha{background:#dcfce7;color:#166534}.b-tkm{background:#fef3c7;color:#92400e}
.pend{border-left:4px solid var(--dang)}
.mut{color:var(--mut);font-size:12px}.hl{font-weight:900;color:#b91c1c}
.tabs{display:flex;gap:6px;margin:8px 0}.tab{padding:7px 12px;border-radius:999px;background:#e8eef7;font-weight:800;font-size:13px;cursor:pointer;border:0}
.tab.on{background:var(--navy);color:#fff}
h2{font-size:15px;margin:6px 0 2px}
.k{font-size:12px;color:var(--mut)}.v{font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:8px 0}
.note{background:#fffbea;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px;white-space:pre-wrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0a1f44;color:#fff;padding:10px 16px;border-radius:10px;font-weight:800;z-index:20;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.pill{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:#f1f5f9;color:#475569}
small.err{color:var(--dang)}
</style></head>
<body>
<header><span class="t">📲 マイページ管理</span><span class="pill">全店統合</span><span class="sp"></span>
<button class="btn g" onclick="loadAll()">🔄 更新</button></header>
<div class="wrap">

<!-- ログイン -->
<div class="card" id="loginCard">
  <h2>スタッフログイン</h2>
  <p class="mut">名前＋番号でログイン。札幌/那覇は同じログイン（本社DB）、高松は高松DB。両方ログインすると全店の承認待ちが1画面に出ます。</p>
  <div class="row" style="margin-top:8px">
    <div style="flex:1;min-width:150px"><div class="k">札幌/那覇（本社）ログイン</div>
      <input id="mUser" placeholder="名前 例: oshita" autocomplete="username">
      <input id="mPass" type="password" placeholder="番号 例: 0111" autocomplete="current-password" style="margin-top:6px">
      <div class="row" style="margin-top:6px"><select id="mStore" style="padding:8px;border:1px solid var(--line);border-radius:8px"><option value="spk">札幌(@spk.hdm)</option><option value="nha">那覇(@nha.hdm)</option></select>
      <button class="btn y" onclick="loginMain()">ログイン</button><span id="mState" class="mut"></span></div>
    </div>
    <div style="flex:1;min-width:150px"><div class="k">高松ログイン</div>
      <input id="bUser" placeholder="名前 例: oshita" autocomplete="username">
      <input id="bPass" type="password" placeholder="番号 例: 0111" autocomplete="current-password" style="margin-top:6px">
      <div class="row" style="margin-top:6px"><button class="btn y" onclick="loginBt()">ログイン</button><span id="bState" class="mut"></span></div>
    </div>
  </div>
</div>

<!-- 承認待ち -->
<div class="card">
  <h2>🔴 承認待ち <span id="pendCount" class="pill">0</span></h2>
  <p class="mut">キャンセル申請・変更リクエスト（オプション/補償/早め回収）を店舗横断で表示。承認＝反映＋顧客へメール通知。</p>
  <div id="pending"></div>
</div>

<!-- 予約検索 -->
<div class="card">
  <h2>🔎 予約検索</h2>
  <div class="row"><input id="q" placeholder="予約番号（HDMS/HDMN/HDMT…）" style="flex:1"><button class="btn g" onclick="search()">検索</button></div>
  <div id="sresult"></div>
</div>

</div>
<div class="toast" id="toast"></div>
<script>
const MAIN="https://ckrxttbnawkclshczsia.supabase.co";
const MAIN_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
const BT="https://ggqugvyskyiblxiycpci.supabase.co";
const BT_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18";
let TOK={main:localStorage.getItem('mpa_main')||"",bt:localStorage.getItem('mpa_bt')||""};
const OTAJP={J:"じゃらん",R:"楽天",O:"エアトリ",RC:"レンタカーcom",HANDYMAN:"オフィシャル(HP)",HP:"オフィシャル(HP)"};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);}
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
async function login(base,anon,user,pass){
  const email=(user.indexOf('@')>=0)?user:(user);
  const r=await fetch(base+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:anon,"Content-Type":"application/json"},body:JSON.stringify({email,password:pass})});
  const j=await r.json();if(!r.ok||!j.access_token)throw new Error(j.error_description||j.msg||"ログイン失敗");return j.access_token;
}
async function loginMain(){
  const st=document.getElementById('mState');st.textContent="…";
  try{const u=document.getElementById('mUser').value.trim();const store=document.getElementById('mStore').value;
    const email=u.indexOf('@')>=0?u:(u+"@"+store+".hdm");
    TOK.main=await login(MAIN,MAIN_ANON,email,document.getElementById('mPass').value.trim());
    localStorage.setItem('mpa_main',TOK.main);st.textContent="✅ "+email;loadAll();
  }catch(e){st.innerHTML='<small class="err">'+esc(e.message)+'</small>';}
}
async function loginBt(){
  const st=document.getElementById('bState');st.textContent="…";
  try{const u=document.getElementById('bUser').value.trim();const email=u.indexOf('@')>=0?u:(u+"@bt.hdm");
    TOK.bt=await login(BT,BT_ANON,email,document.getElementById('bPass').value.trim());
    localStorage.setItem('mpa_bt',TOK.bt);st.textContent="✅ "+email;loadAll();
  }catch(e){st.innerHTML='<small class="err">'+esc(e.message)+'</small>';}
}
function H(base,tok){return{apikey:base===BT?BT_ANON:MAIN_ANON,Authorization:"Bearer "+(tok||(base===BT?BT_ANON:MAIN_ANON)),"Content-Type":"application/json"};}
async function api(base,tok,path){const r=await fetch(base+"/rest/v1/"+path,{headers:H(base,tok)});if(!r.ok)return[];return await r.json().catch(()=>[]);}
function otaJp(o){return OTAJP[o]||o||"—";}

// ---- 承認待ち読込 ----
async function loadPending(){
  const box=document.getElementById('pending');const items=[];
  // spk/nha: mypage_changes(status=requested)
  if(TOK.main){
    for(const store of ["spk","nha"]){
      const rows=await api(MAIN,TOK.main,`mypage_changes?store=eq.${store}&status=eq.requested&order=created_at.desc&limit=200&select=id,reservation_id,field,old_value,new_value,note,created_at`);
      const rtbl=store==="spk"?"reservations":"nha_reservations";
      for(const c of rows){
        const rv=(await api(MAIN,TOK.main,`${rtbl}?id=eq.${encodeURIComponent(c.reservation_id)}&select=name,ota,${store==="spk"?"lend_date,return_date,vehicle":"start_date,end_date,vehicle_class"},price,mail`))[0]||{};
        items.push({store,id:c.id,rid:c.reservation_id,field:c.field,newv:c.new_value,note:c.note,at:c.created_at,
          name:rv.name,ota:rv.ota,sd:rv.lend_date||rv.start_date,ed:rv.return_date||rv.end_date,cls:rv.vehicle||rv.vehicle_class,price:rv.price,mail:rv.mail});
      }
    }
  }
  // tkm: bt_reservation_changes(status=requested)
  if(TOK.bt){
    const rows=await api(BT,TOK.bt,`bt_reservation_changes?status=eq.requested&order=created_at.desc&limit=200&select=id,reservation_id,change_type,field_name,new_value,created_at`);
    for(const c of rows){
      const rv=(await api(BT,TOK.bt,`bt_reservations?id=eq.${encodeURIComponent(c.reservation_id)}&select=name,ota,start_date,end_date,vehicle_class,price,mail`))[0]||{};
      items.push({store:"tkm",id:c.id,rid:c.reservation_id,field:c.change_type||c.field_name,newv:c.new_value,note:"",at:c.created_at,
        name:rv.name,ota:rv.ota,sd:rv.start_date,ed:rv.end_date,cls:rv.vehicle_class,price:rv.price,mail:rv.mail});
    }
  }
  items.sort((a,b)=>String(b.at||"").localeCompare(String(a.at||"")));
  document.getElementById('pendCount').textContent=items.length;
  if(!TOK.main&&!TOK.bt){box.innerHTML='<p class="mut">↑ ログインすると承認待ちが表示されます。</p>';return;}
  if(!items.length){box.innerHTML='<p class="mut">✅ 承認待ちはありません。</p>';return;}
  box.innerHTML=items.map(it=>{
    const b=it.store==="spk"?"b-spk":it.store==="nha"?"b-nha":"b-tkm";
    const label=it.store==="spk"?"札幌":it.store==="nha"?"那覇":"高松";
    const ftype=/cancel|キャンセル/.test(String(it.field))?"🚫 キャンセル申請":"✏️ 変更リクエスト（"+esc(it.field)+"）";
    return `<div class="card pend"><div class="row"><span class="badge ${b}">${label}</span> <b>${ftype}</b><span class="sp" style="flex:1"></span><span class="mut">${esc((it.at||"").slice(0,16).replace("T"," "))}</span></div>
    <div class="grid"><div><div class="k">お客様</div><div class="v">${esc(it.name||"-")} 様</div></div>
    <div><div class="k">予約番号</div><div class="v">${esc(it.rid)}</div></div>
    <div><div class="k">ご予約元</div><div class="v">${esc(otaJp(it.ota))}</div></div>
    <div><div class="k">利用期間</div><div class="v">${esc(it.sd||"-")} 〜 ${esc(it.ed||"-")}</div></div>
    <div><div class="k">車両/金額</div><div class="v">${esc(it.cls||"-")} / ¥${Number(it.price||0).toLocaleString()}</div></div>
    <div><div class="k">連絡先</div><div class="v">${esc(it.mail||"-")}</div></div></div>
    ${it.newv?`<div class="k">希望内容</div><div class="v">${esc(it.newv)}</div>`:""}
    ${it.note?`<div class="note">📝 ${esc(it.note)}</div>`:""}
    <div class="row" style="margin-top:10px"><button class="btn ok" onclick="decide('${it.store}',${it.id},'approved')">✅ 承認（反映＋メール通知）</button>
    <button class="btn dang" onclick="decide('${it.store}',${it.id},'rejected')">🚫 却下</button></div></div>`;
  }).join("");
}
async function decide(store,id,decision){
  const st=store==="tkm"?TOK.bt:TOK.main;
  if(!st){toast("先にログインしてください");return;}
  if(!confirm(decision==="approved"?"承認します。反映され、顧客へメール通知します。よろしいですか？":"却下します。よろしいですか？"))return;
  const fn=store==="spk"?MAIN+"/functions/v1/handyman-mypage":store==="nha"?MAIN+"/functions/v1/handyman-mypage-nha":BT+"/functions/v1/handyman-mypage-tkm";
  const anon=store==="tkm"?BT_ANON:MAIN_ANON;
  try{
    const r=await fetch(fn,{method:"POST",headers:{apikey:anon,Authorization:"Bearer "+anon,"Content-Type":"application/json"},
      body:JSON.stringify({action:"decide",staff_token:st,change_id:id,decision})});
    const j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok){toast(decision==="approved"?"承認しました":"却下しました");loadAll();}
    else toast("失敗: "+(j.error||("http "+r.status)));
  }catch(e){toast("通信エラー");}
}
async function search(){
  const q=document.getElementById('q').value.trim();const out=document.getElementById('sresult');
  if(!q){out.innerHTML="";return;}out.innerHTML='<p class="mut">検索中…</p>';
  const hits=[];
  if(TOK.main){
    const s=(await api(MAIN,TOK.main,`reservations?id=eq.${encodeURIComponent(q)}&select=id,name,ota,lend_date,return_date,vehicle,price,status,del_place,insurance,memo,mail`))[0];
    if(s)hits.push({store:"札幌",...s,sd:s.lend_date,ed:s.return_date,cls:s.vehicle});
    const n=(await api(MAIN,TOK.main,`nha_reservations?id=eq.${encodeURIComponent(q)}&select=id,name,ota,start_date,end_date,vehicle_class,price,status,del_place,insurance,memo,mail`))[0];
    if(n)hits.push({store:"那覇",...n,sd:n.start_date,ed:n.end_date,cls:n.vehicle_class});
  }
  if(TOK.bt){
    const t=(await api(BT,TOK.bt,`bt_reservations?id=eq.${encodeURIComponent(q)}&select=id,name,ota,start_date,end_date,vehicle_class,price,status,del_place,insurance,memo,mail`))[0];
    if(t)hits.push({store:"高松",...t,sd:t.start_date,ed:t.end_date,cls:t.vehicle_class});
  }
  if(!hits.length){out.innerHTML='<p class="mut">該当なし（ログイン済みの店舗のみ検索します）。</p>';return;}
  out.innerHTML=hits.map(h=>`<div class="card"><div class="row"><span class="pill">${h.store}</span> <b>${esc(h.id)}</b> <span class="mut">${esc(h.status||"")}</span></div>
  <div class="grid"><div><div class="k">お客様</div><div class="v">${esc(h.name||"-")} 様</div></div>
  <div><div class="k">ご予約元</div><div class="v">${esc(otaJp(h.ota))}</div></div>
  <div><div class="k">利用期間</div><div class="v">${esc(h.sd||"-")} 〜 ${esc(h.ed||"-")}</div></div>
  <div><div class="k">車両/金額</div><div class="v">${esc(h.cls||"-")} / ¥${Number(h.price||0).toLocaleString()}</div></div>
  <div><div class="k">受け渡し</div><div class="v">${esc(h.del_place||"-")}</div></div>
  <div><div class="k">補償</div><div class="v">${esc(h.insurance||"-")}</div></div>
  <div><div class="k">連絡先</div><div class="v">${esc(h.mail||"-")}</div></div></div>
  ${h.memo?`<div class="note">📝 備考・ご要望: ${esc(h.memo)}</div>`:""}</div>`).join("");
}
function loadAll(){loadPending();}
// 起動時：保存トークンで自動ロード
if(TOK.main)document.getElementById('mState').textContent="✅ ログイン済み";
if(TOK.bt)document.getElementById('bState').textContent="✅ ログイン済み";
loadAll();
</script>
</body></html>
