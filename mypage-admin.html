<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>マイページ管理｜ HANDYMAN</title>
<script>
/* 2026-11-07 マイページ管理は mypage-active.html（リスト＋アクション）に合体。
   Slack・各店APP・hq/company3d の旧リンク（?bucket=〇〇&rid=〇〇）をそのままアクションタブへ転送する。
   旧画面は mypage-admin-old.html に残してある。 */
(function(){var u=new URLSearchParams(location.search);u.set("tab","action");
  location.replace("mypage-active.html?"+u.toString());})();
</script>
</head><body style="font-family:system-ui,sans-serif;padding:24px">
<p>マイページ管理（新画面）へ移動しています… <a href="mypage-active.html?tab=action">開かない場合はこちら</a></p>
<p style="color:#64748b;font-size:13px">旧画面は <a href="mypage-admin-old.html">こちら</a></p>
</body></html>
