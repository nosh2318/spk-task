<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>札幌店 月次レポート</title>
<style>
:root{--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--bg:#f4f5f7;--accent:#0d9488;--yellow:#d97706}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;font-size:14px}
.wrap{max-width:960px;margin:0 auto;padding:18px 16px 60px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.bar h1{font-size:19px;margin:0}
.bar .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button{font:inherit}
select{padding:9px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-weight:700}
.btn{padding:9px 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}
.btn.sec{background:#fff;color:var(--ink);border:1px solid #cbd5e1}
.sheet{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 6px 24px rgba(0,0,0,.05)}
.rhead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px}
.rhead .t{font-size:22px;font-weight:900}
.rhead .m{font-size:15px;font-weight:800;color:var(--accent)}
.rhead .sub{font-size:11px;color:var(--mut);margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.kpi{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .l{font-size:11px;color:var(--mut);font-weight:700}
.kpi .v{font-size:21px;font-weight:900;margin-top:6px;letter-spacing:-.02em}
.kpi .v small{font-size:12px;font-weight:700;color:var(--mut)}
h2.sec{font-size:14px;margin:22px 0 8px;padding-left:9px;border-left:4px solid var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:4px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{background:#f1f5f9;font-size:11px;color:var(--mut);border-bottom:2px solid #cbd5e1}
tfoot td{font-weight:900;border-top:2px solid var(--ink);border-bottom:0;background:#f8fafc}
tbody tr:hover{background:#f9fafb}
.clschip{display:inline-block;min-width:20px;text-align:center;font-weight:900;color:#fff;border-radius:6px;padding:2px 6px;font-size:11px}
.note{font-size:11px;color:var(--mut);margin-top:18px;border-top:1px dashed var(--line);padding-top:10px;line-height:1.7}
.msg{padding:40px 16px;text-align:center;color:var(--mut)}
@media print{
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .bar,.noprint{display:none!important}
  .sheet{border:0;box-shadow:none;padding:0;border-radius:0}
  .kpi,table,h2.sec{break-inside:avoid}
  h2.sec{break-after:avoid}
  @page{size:A4;margin:12mm}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar noprint">
    <h1>📋 札幌店 月次レポート</h1>
    <div class="ctl">
      <select id="mFrom"><option>…</option></select>
      <span style="color:#6b7280;font-weight:800">〜</span>
      <select id="mTo"><option>…</option></select>
      <button class="btn sec" id="qAll" type="button">全期間</button>
      <button class="btn sec" id="qYear" type="button">今年</button>
      <button class="btn" id="pdfBtn">📄 PDF出力</button>
    </div>
  </div>
  <div class="sheet" id="sheet"><div class="msg" id="msg">読み込み中…</div></div>
</div>
<script>
const SB='https://ckrxttbnawkclshczsia.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
function _sbToken(){try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.indexOf('sb-')===0&&key.indexOf('auth-token')>=0){let v=null;try{v=JSON.parse(localStorage.getItem(key));}catch(e){continue;}const t=(v&&v.access_token)||(v&&v.currentSession&&v.currentSession.access_token)||(v&&v.session&&v.session.access_token)||(Array.isArray(v)&&typeof v[0]==='string'?v[0]:null);if(t)return t;}}}catch(e){}return null;}
const CLS_COLOR={A:'#7c3aed',A2:'#8b5cf6',B:'#0284c7',B2:'#0ea5e9',C:'#059669',S:'#d97706',F:'#db2777',H:'#64748b',D:'#334155'};
const OTA_NAME={R:'楽天',J:'じゃらん',S:'スカイチケット',O:'エアトリ',HP:'公式HP',direct:'直販/他',KEYDROP:'KEYDROP'};
const yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP');
const num=n=>Math.round(n||0).toLocaleString('ja-JP');
const R1=v=>Math.round(v||0),R10=v=>Math.round((v||0)*10)/10;
const mlab=ym=>(+ym.slice(5))+'月';
let SNAPS=[],YMS=[];

async function boot(){
  const tok=_sbToken();
  const H={apikey:ANON,Authorization:'Bearer '+(tok||ANON)};
  try{
    const r=await fetch(SB+'/rest/v1/monthly_snapshots?store=eq.spk&order=year_month.asc&select=*',{headers:H});
    SNAPS=await r.json();
    if(!Array.isArray(SNAPS)||!SNAPS.length)throw new Error('empty');
  }catch(e){
    document.getElementById('msg').innerHTML='データを取得できませんでした。<br><br>本体アプリ（<b>札幌店APP</b>）でログインした状態で、TOPの「📋 月次レポート」から開いてください。';
    document.getElementById('mFrom').innerHTML='<option>—</option>';document.getElementById('mTo').innerHTML='<option>—</option>';return;
  }
  YMS=SNAPS.map(s=>s.year_month);
  const opts=YMS.map(m=>`<option value="${m}">${m.replace('-','年')}月</option>`).join('');
  const fSel=document.getElementById('mFrom'),tSel=document.getElementById('mTo');
  fSel.innerHTML=opts;tSel.innerHTML=opts;
  const last=YMS[YMS.length-1], first=YMS[0];
  fSel.value=first;tSel.value=last; // 既定=全期間（各月推移が見える）
  const go=()=>{let a=fSel.value,b=tSel.value;if(a>b){const t=a;a=b;b=t;fSel.value=a;tSel.value=b;}render(a,b);};
  fSel.onchange=go;tSel.onchange=go;
  document.getElementById('qAll').onclick=()=>{fSel.value=first;tSel.value=last;go();};
  document.getElementById('qYear').onclick=()=>{const y=last.slice(0,4);const ys=YMS.filter(m=>m.slice(0,4)===y);fSel.value=ys[0];tSel.value=ys[ys.length-1];go();};
  render(first,last);
}
// 期間合計（箱の足し上げ）
function aggregate(rows){
  let rev=0,cnt=0,rd=0,ad=0;const ota={},cls={};
  rows.forEach(s=>{
    rev+=+s.total_revenue||0;cnt+=+s.total_returns||0;rd+=+s.total_rental_days||0;ad+=+s.total_available_days||0;
    (Array.isArray(s.ota_detail)?s.ota_detail:[]).forEach(o=>{const a=ota[o.ota]||(ota[o.ota]={ota:o.ota,count:0,revenue:0});a.count+=+o.count||0;a.revenue+=+o.revenue||0;});
    (Array.isArray(s.class_detail)?s.class_detail:[]).forEach(c=>{const a=cls[c.type]||(cls[c.type]={type:c.type,count:0,revenue:0,rd:0,ad:0});a.revenue+=+c.revenue||0;a.rd+=+c.rental_days||0;a.ad+=+c.avail_days||0;a.count=Math.max(a.count,+c.count||0);});
  });
  return {rev,cnt,rd,ad,util:ad>0?rd/ad*100:0,adr:rd>0?rev/rd:0,ota:Object.values(ota),cls:Object.values(cls)};
}
function mk(s){const rev=+s.total_revenue||0,cnt=+s.total_returns||0,rd=+s.total_rental_days||0,ad=+s.total_available_days||0;return{ym:s.year_month,rev,cnt,uni:cnt?rev/cnt:0,nights:cnt?rd/cnt:0,util:ad?rd/ad*100:0,rd,ad,ota:Array.isArray(s.ota_detail)?s.ota_detail:[],cls:Array.isArray(s.class_detail)?s.class_detail:[]};}
function render(from,to){
  const rows=SNAPS.filter(s=>s.year_month>=from&&s.year_month<=to).sort((a,b)=>a.year_month<b.year_month?-1:1);
  if(!rows.length)return;
  const M=rows.map(mk), g=aggregate(rows);
  const uni=g.cnt>0?g.rev/g.cnt:0, nights=g.cnt>0?g.rd/g.cnt:0;
  const nowYm=new Date().toISOString().slice(0,7);
  const hasPartial=rows.some(s=>s.year_month>=nowYm);
  const single=(from===to);
  const yl=y=>y.replace('-','年')+'月';
  const period=single?yl(from):(yl(from)+'〜'+yl(to));
  g.cls.sort((a,b)=>b.revenue-a.revenue);g.ota.sort((a,b)=>b.revenue-a.revenue);
  const otaKeys=g.ota.map(o=>o.ota), clsKeys=g.cls.map(c=>c.type);
  const omap=m=>{const x={};(m.ota||[]).forEach(o=>x[o.ota]=o);return x;};
  const cmap=m=>{const x={};(m.cls||[]).forEach(c=>x[c.type]=c);return x;};
  const chip=k=>`<span class="clschip" style="background:${CLS_COLOR[k]||'#64748b'}">${k}</span>`;
  const tag=m=>m.ym>=nowYm?' <span style="color:#d97706;font-size:9px;font-weight:900">途中</span>':'';
  const bg=m=>m.ym>=nowYm?' style="background:#fffbeb"':'';
  const cards=[['合計売上',yen(g.rev)],['件数（予約）',num(g.cnt)+'<small> 件</small>'],['客単価',yen(uni)],['平均泊数',R10(nights)+'<small> 泊</small>'],['稼働率グロス',R10(g.util)+'<small> %</small>']].map(k=>`<div class="kpi"><div class="l">${single?k[0]:k[0]+'（期間計）'}</div><div class="v">${k[1]}</div></div>`).join('');
  // ① 主要KPI 月次推移
  const kpiT=`<table><thead><tr><th>月</th><th>合計売上</th><th>件数</th><th>客単価</th><th>平均泊数</th><th>稼働率グロス</th></tr></thead><tbody>`+
    M.map(m=>`<tr${bg(m)}><td>${mlab(m.ym)}${tag(m)}</td><td>${yen(m.rev)}</td><td>${num(m.cnt)}</td><td>${yen(m.uni)}</td><td>${R10(m.nights)}泊</td><td>${R10(m.util)}%</td></tr>`).join('')+
    `</tbody><tfoot><tr><td>${single?'計':'期間'}</td><td>${yen(g.rev)}</td><td>${num(g.cnt)}</td><td>${yen(uni)}</td><td>${R10(nights)}泊</td><td>${R10(g.util)}%</td></tr></tfoot></table>`;
  // ② チャンネル別 売上構成率 推移（月×OTA）
  const chT=`<table><thead><tr><th>月</th>${otaKeys.map(k=>`<th>${OTA_NAME[k]||k}</th>`).join('')}<th>売上計</th></tr></thead><tbody>`+
    M.map(m=>{const x=omap(m);return `<tr${bg(m)}><td>${mlab(m.ym)}</td>${otaKeys.map(k=>{const o=x[k];return `<td>${o&&m.rev?R1(o.revenue/m.rev*100)+'%':'–'}</td>`;}).join('')}<td>${yen(m.rev)}</td></tr>`;}).join('')+
    `</tbody><tfoot><tr><td>期間</td>${otaKeys.map(k=>{const o=g.ota.find(y=>y.ota===k);return `<td>${o&&g.rev?R1(o.revenue/g.rev*100)+'%':'–'}</td>`;}).join('')}<td>${yen(g.rev)}</td></tr></tfoot></table>`;
  // ③ クラス別 売上構成比 推移
  const crT=`<table><thead><tr><th>月</th>${clsKeys.map(k=>`<th>${chip(k)}</th>`).join('')}<th>売上計</th></tr></thead><tbody>`+
    M.map(m=>{const x=cmap(m);return `<tr${bg(m)}><td>${mlab(m.ym)}</td>${clsKeys.map(k=>{const c=x[k];return `<td>${c&&m.rev?R1(c.revenue/m.rev*100)+'%':'–'}</td>`;}).join('')}<td>${yen(m.rev)}</td></tr>`;}).join('')+
    `</tbody><tfoot><tr><td>期間</td>${clsKeys.map(k=>{const c=g.cls.find(y=>y.type===k);return `<td>${c&&g.rev?R1(c.revenue/g.rev*100)+'%':'–'}</td>`;}).join('')}<td>${yen(g.rev)}</td></tr></tfoot></table>`;
  // ④ クラス別 稼働率 推移
  const cuT=`<table><thead><tr><th>月</th>${clsKeys.map(k=>`<th>${chip(k)}</th>`).join('')}<th>グロス</th></tr></thead><tbody>`+
    M.map(m=>{const x=cmap(m);return `<tr${bg(m)}><td>${mlab(m.ym)}</td>${clsKeys.map(k=>{const c=x[k];return `<td>${c&&c.avail_days?R1(c.rental_days/c.avail_days*100)+'%':'–'}</td>`;}).join('')}<td>${R10(m.util)}%</td></tr>`;}).join('')+
    `</tbody><tfoot><tr><td>期間</td>${clsKeys.map(k=>{const c=g.cls.find(y=>y.type===k);return `<td>${c&&c.ad?R1(c.rd/c.ad*100)+'%':'–'}</td>`;}).join('')}<td>${R10(g.util)}%</td></tr></tfoot></table>`;
  document.getElementById('sheet').innerHTML=`
    <div class="rhead"><div><div class="t">札幌店 月次レポート</div><div class="sub">HANDYMAN 札幌デリバリー店${hasPartial?'　※<span style="color:#d97706">途中</span>＝当月/未来月＝先行予約ベースの途中経過（確定前）':'　※確定実績'}</div></div><div style="text-align:right"><div class="m">${period}</div><div class="sub">出力: ${new Date().toLocaleString('ja-JP')}</div></div></div>
    <div class="kpis">${cards}</div>
    <h2 class="sec">📈 主要KPI 月次推移</h2>${kpiT}
    <h2 class="sec">📊 チャンネル別 売上構成率 推移</h2>${chT}
    <h2 class="sec">🚗 クラス別 売上構成比 推移</h2>${crT}
    <h2 class="sec">🚗 クラス別 稼働率 推移</h2>${cuT}
    <div class="note">出所＝正本箱 monthly_snapshots（経営管理ダッシュボードと同一値・再集計なし）／客単価＝売上÷件数／平均泊数＝延べ稼働日数÷件数／稼働率グロス＝延べ稼働日数÷延べ稼働可能日数（実稼働ベース）／各セル＝その月の値・「期間」行＝合計または期間グロス。当月/未来月は先行予約ベースの途中経過。</div>`;
}
document.getElementById('pdfBtn').onclick=()=>window.print();
boot();
</script>
</body>
</html>
