<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>札幌店 月次レポート</title>
<style>
:root{--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--bg:#f4f5f7;--accent:#0d9488;--yellow:#d97706}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;font-size:14px}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 60px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.bar h1{font-size:19px;margin:0}
.bar .ctl{display:flex;gap:8px;align-items:center}
select,button{font:inherit}
select{padding:9px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-weight:700}
.btn{padding:9px 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}
.btn.sec{background:#fff;color:var(--ink);border:1px solid #cbd5e1}
.sheet{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 6px 24px rgba(0,0,0,.05)}
.rhead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px}
.rhead .t{font-size:22px;font-weight:900}
.rhead .m{font-size:15px;font-weight:800;color:var(--accent)}
.rhead .sub{font-size:11px;color:var(--mut);margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.kpi{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .l{font-size:11px;color:var(--mut);font-weight:700}
.kpi .v{font-size:22px;font-weight:900;margin-top:6px;letter-spacing:-.02em}
.kpi .v small{font-size:12px;font-weight:700;color:var(--mut)}
h2.sec{font-size:14px;margin:22px 0 8px;padding-left:9px;border-left:4px solid var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
thead th{background:#f1f5f9;font-size:11px;color:var(--mut);border-bottom:2px solid #cbd5e1}
tfoot td{font-weight:900;border-top:2px solid var(--ink);border-bottom:0}
.bar2{height:8px;border-radius:5px;background:#e5e7eb;overflow:hidden;min-width:60px;display:inline-block;vertical-align:middle}
.bar2 i{display:block;height:100%;background:var(--accent)}
.clschip{display:inline-block;min-width:22px;text-align:center;font-weight:900;color:#fff;border-radius:6px;padding:2px 7px;font-size:12px}
.note{font-size:11px;color:var(--mut);margin-top:18px;border-top:1px dashed var(--line);padding-top:10px}
.msg{padding:40px 16px;text-align:center;color:var(--mut)}
@media print{
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .bar,.noprint{display:none!important}
  .sheet{border:0;box-shadow:none;padding:0;border-radius:0}
  .kpi,.sheet{break-inside:avoid}
  h2.sec{break-after:avoid}
  @page{size:A4;margin:14mm}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar noprint">
    <h1>📋 札幌店 月次レポート</h1>
    <div class="ctl">
      <select id="mSel"><option>読込中…</option></select>
      <button class="btn" id="pdfBtn">📄 PDF出力</button>
    </div>
  </div>
  <div class="sheet" id="sheet"><div class="msg" id="msg">読み込み中…</div></div>
</div>
<script>
const SB='https://ckrxttbnawkclshczsia.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
// 本体アプリのログイントークンを再利用（同一オリジン）
function _sbToken(){try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.indexOf('sb-')===0&&key.indexOf('auth-token')>=0){let v=null;try{v=JSON.parse(localStorage.getItem(key));}catch(e){continue;}const t=(v&&v.access_token)||(v&&v.currentSession&&v.currentSession.access_token)||(v&&v.session&&v.session.access_token)||(Array.isArray(v)&&typeof v[0]==='string'?v[0]:null);if(t)return t;}}}catch(e){}return null;}
const CLS_COLOR={A:'#7c3aed',A2:'#8b5cf6',B:'#0284c7',B2:'#0ea5e9',C:'#059669',S:'#d97706',F:'#db2777',H:'#64748b',D:'#334155'};
const OTA_NAME={R:'楽天トラベル',J:'じゃらん',S:'スカイチケット',O:'エアトリ',HP:'公式HP',direct:'直販/その他',KEYDROP:'KEYDROP','レンタカー.com':'レンタカー.com'};
const yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP');
const num=n=>Math.round(n||0).toLocaleString('ja-JP');
let SNAPS=[];

async function boot(){
  const tok=_sbToken();
  const H={apikey:ANON,Authorization:'Bearer '+(tok||ANON)};
  try{
    const r=await fetch(SB+'/rest/v1/monthly_snapshots?store=eq.spk&order=year_month.desc&select=*',{headers:H});
    SNAPS=await r.json();
    if(!Array.isArray(SNAPS)||!SNAPS.length){throw new Error('empty');}
  }catch(e){
    document.getElementById('msg').innerHTML='データを取得できませんでした。<br><br>本体アプリ（<b>札幌店APP</b>）でログインした状態で、TOPの「📋 月次レポート」から開いてください。';
    document.getElementById('mSel').innerHTML='<option>—</option>';return;
  }
  const sel=document.getElementById('mSel');
  sel.innerHTML=SNAPS.map(s=>`<option value="${s.year_month}">${s.year_month.replace('-','年')}月</option>`).join('');
  sel.onchange=()=>render(sel.value);
  render(SNAPS[0].year_month);
}
function pct(part,whole){return whole>0?Math.round(part/whole*1000)/10:0;}
function render(ym){
  const s=SNAPS.find(x=>x.year_month===ym);if(!s)return;
  const rev=+s.total_revenue||0, cnt=+s.total_returns||0;
  const uni=cnt>0?rev/cnt:0;                       // 客単価
  const nights=cnt>0?(+s.total_rental_days||0)/cnt:0; // 平均泊数
  const cd=Array.isArray(s.class_detail)?s.class_detail.slice():[];
  const od=Array.isArray(s.ota_detail)?s.ota_detail.slice():[];
  cd.sort((a,b)=>(b.revenue||0)-(a.revenue||0));
  od.sort((a,b)=>(b.revenue||0)-(a.revenue||0));
  const future=ym>=new Date().toISOString().slice(0,7);
  // KPI
  const kpi=[
    ['合計売上',yen(rev)],
    ['件数（予約）',num(cnt)+'<small> 件</small>'],
    ['客単価',yen(uni)],
    ['平均泊数',(Math.round(nights*10)/10)+'<small> 泊</small>'],
    ['稼働率グロス',(Math.round((+s.utilization_pct||0)*10)/10)+'<small> %</small>'],
  ].map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div></div>`).join('');
  // チャンネル別（構成率＝件数ベースpct＋売上構成）
  const otaRows=od.map(o=>{const rp=pct(o.revenue||0,rev);return `<tr><td>${OTA_NAME[o.ota]||o.ota}</td><td>${num(o.count)}</td><td>${o.pct!=null?o.pct:pct(o.count,cnt)}%</td><td>${yen(o.revenue)}</td><td><span class="bar2" style="width:80px"><i style="width:${rp}%"></i></span> ${rp}%</td></tr>`;}).join('');
  // クラス別（売上構成比＋稼働率）
  const clsRows=cd.map(c=>{const rp=pct(c.revenue||0,rev);const col=CLS_COLOR[c.type]||'#64748b';return `<tr><td><span class="clschip" style="background:${col}">${c.type}</span> <span style="color:#6b7280;font-size:12px">${num(c.count)}台</span></td><td>${yen(c.revenue)}</td><td><span class="bar2" style="width:90px"><i style="width:${rp}%;background:${col}"></i></span> ${rp}%</td><td>${Math.round((c.util_pct||0)*10)/10}%</td><td>${yen(c.adr)}</td></tr>`;}).join('');
  document.getElementById('sheet').innerHTML=`
    <div class="rhead"><div><div class="t">札幌店 月次レポート</div><div class="sub">HANDYMAN 札幌デリバリー店${future?'　※当月/未来月＝途中値（確定前）':'　※確定実績'}</div></div><div style="text-align:right"><div class="m">${ym.replace('-','年')}月</div><div class="sub">出力: ${new Date().toLocaleString('ja-JP')}</div></div></div>
    <div class="kpis">${kpi}</div>
    <h2 class="sec">📊 チャンネル別 構成率</h2>
    <table><thead><tr><th>チャネル</th><th>件数</th><th>件数構成</th><th>売上</th><th>売上構成</th></tr></thead><tbody>${otaRows||'<tr><td colspan="5">データなし</td></tr>'}</tbody><tfoot><tr><td>合計</td><td>${num(cnt)}</td><td>100%</td><td>${yen(rev)}</td><td>100%</td></tr></tfoot></table>
    <h2 class="sec">🚗 クラス別 売上構成比・稼働率</h2>
    <table><thead><tr><th>クラス</th><th>売上</th><th>売上構成比</th><th>稼働率</th><th>ADR(泊単価)</th></tr></thead><tbody>${clsRows||'<tr><td colspan="5">データなし</td></tr>'}</tbody><tfoot><tr><td>合計</td><td>${yen(rev)}</td><td>100%</td><td>${Math.round((+s.utilization_pct||0)*10)/10}%</td><td>${yen(s.avg_daily_rate)}</td></tr></tfoot></table>
    <div class="note">出所＝正本箱 monthly_snapshots（経営管理ダッシュボードと同一値・再集計なし）／客単価＝売上÷件数／平均泊数＝延べ稼働日数÷件数／稼働率グロス＝実稼働ベース。</div>`;
}
document.getElementById('pdfBtn').onclick=()=>window.print();
boot();
</script>
</body>
</html>
