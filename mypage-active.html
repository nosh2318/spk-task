<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>マイページ アクティブ管理（全店）｜ HANDYMAN</title>
<style>
:root{--navy:#002063;--y:#FABE00;--bg:#eef2f8;--card:#fff;--fg:#16243f;--line:#dbe3ef;--mut:#5b6b84;
  --ok:#137a43;--okb:#e3f4ea;--tmp:#9a5b00;--tmpb:#fff3d6;--ng:#b4232c;--ngb:#fde6e7;--na:#6b7280;--nab:#eceef2;--inf:#1d4fb8;--infb:#e5edfc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:14px}
header{position:sticky;top:0;z-index:6;background:var(--navy);color:#fff;padding:11px max(14px,env(safe-area-inset-right)) 11px max(14px,env(safe-area-inset-left));display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header .t{font-weight:900;font-size:15px}header .sp{flex:1}
header a{color:#cfe0ff;font-size:12px;font-weight:700}
.pin{background:var(--y);color:#002063;font-weight:900;font-size:11px;border-radius:999px;padding:2px 9px}
.wrap{max-width:960px;margin:0 auto;padding:12px max(10px,env(safe-area-inset-right)) 60px max(10px,env(safe-area-inset-left))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.btn{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-weight:800;cursor:pointer;font-family:inherit;font-size:13px;background:#e8eef7;color:var(--fg);text-decoration:none;display:inline-block}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.sm{padding:6px 10px;font-size:12px}
input{font-family:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px}
.mut{color:var(--mut);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media(max-width:760px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{border:1px solid var(--line);border-radius:12px;padding:9px 8px;cursor:pointer;background:var(--card);text-align:left;font-family:inherit;color:var(--fg)}
.tile.on{outline:2px solid var(--navy);outline-offset:-2px}
.tile .bn{font-size:11px;font-weight:900}
.tile .num{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.tile .num small{font-size:11px;color:var(--mut);font-weight:600}
.bar{height:5px;border-radius:3px;background:var(--nab);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--ok)}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{padding:6px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:12px;cursor:pointer;color:#334155;font-family:inherit}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.it{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--card);cursor:pointer}
.it .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nm{font-weight:800;font-size:14px}
.pl{font-size:11px;font-weight:900;border-radius:999px;padding:1px 8px;white-space:nowrap}
.s1,.s5,.scall{background:var(--ngb);color:var(--ng)}.s2{background:var(--tmpb);color:var(--tmp)}.s3{background:var(--infb);color:var(--inf)}.s4{background:var(--okb);color:var(--ok)}
.bk{font-size:10.5px;font-weight:900;padding:1px 7px;border-radius:6px;color:#fff}
.dots{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:7px}
.d{font-size:10.5px;text-align:center;border-radius:6px;padding:2px 0;font-weight:800}
.ok{background:var(--okb);color:var(--ok)}.tmp{background:var(--tmpb);color:var(--tmp)}.ng{background:var(--ngb);color:var(--ng)}.na{background:var(--nab);color:var(--na)}
.det{margin-top:9px;border-top:1px dashed var(--line);padding-top:8px;display:none}
.it.open .det{display:block}
.ir{display:grid;grid-template-columns:3em 1fr;gap:8px;align-items:center;padding:4px 0;font-size:13px}
.ir .why{font-size:11.5px;color:var(--mut)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.flag{font-size:11px;font-weight:800;border-radius:4px;padding:0 6px;border:1px solid currentColor}
.empty{padding:20px;text-align:center;color:var(--mut);font-size:13px}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:11px}
</style></head>
<body>
<header><span class="t">📲 マイページ アクティブ</span><span class="pin" id="hdr">読み込み中…</span><span class="sp"></span>
<a href="mypage-admin.html">依頼の処理へ →</a>
<button class="btn sm" onclick="loadAll()">🔄 更新</button></header>
<div class="wrap">

<div class="card" id="pinCard" style="display:none">
  <b>管理PINを入力してください</b><div class="mut" style="margin:4px 0 8px">マイページ管理（依頼の処理）と同じPINです。この端末に保存されます。</div>
  <form onsubmit="event.preventDefault();savePin()" style="display:flex;gap:8px"><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" style="flex:1" aria-label="管理PIN"><button class="btn pri">開く</button></form>
</div>

<div class="card">
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b>店舗別 準備完了 / 全予約</b><span class="mut" id="range"></span></div>
  <div class="tiles" id="tiles" style="margin-top:10px"></div>
</div>

<div class="card">
  <div class="filt" id="filt"></div>
  <div class="legend"><span class="d ok" style="padding:1px 6px">済</span><span class="d tmp" style="padding:1px 6px">仮</span><span class="d ng" style="padding:1px 6px">未</span><span class="d na" style="padding:1px 6px">不要</span><span class="mut">仮＝OTAの値のまま／本人の確定がまだ</span></div>
  <div id="list" style="margin-top:10px"><div class="empty">読み込み中…</div></div>
</div>
</div>
<script>
const MAIN="https://ckrxttbnawkclshczsia.supabase.co";
const MAIN_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
const BT="https://ggqugvyskyiblxiycpci.supabase.co";
const BT_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18";
const BUCK={
  hdm_spk:{n:"HDM 札幌",c:"#0a58c2",my:"https://nosh2318.github.io/spk-task/my.html?t="},
  hdm_nha:{n:"HDM 那覇",c:"#166534",my:"https://nosh2318.github.io/naha-project/my-nha.html?t="},
  hdm_tkm:{n:"HDM 高松",c:"#b45309",my:"https://nosh2318.github.io/spk-task/my-tkm.html?t="},
  but_tkm:{n:"BUT 高松",c:"#7c3aed",my:"https://buddica-touring.github.io/app/guide/?t="},
  key_spk:{n:"KEY 札幌",c:"#0d9488",my:"https://keydrop.jp/mypage.html?t="},
  key_nha:{n:"KEY 那覇",c:"#0891b2",my:"https://keydrop.jp/mypage.html?t="}};
const BORD=["hdm_nha","hdm_spk","hdm_tkm","but_tkm","key_spk","key_nha"];
const OTAJP={J:"じゃらん",R:"楽天",O:"エアトリ",RC:"レンタカーcom",HANDYMAN:"公式",HP:"公式",KEYDROP:"KEYDROP"};
const ITEMS=[["lic","免許"],["time","時間"],["place","場所"],["opt","OP"],["pay","決済"],["save","保存"]];
const STG={1:"未達",2:"未開封",3:"開封・未完了",4:"準備完了",5:"当日未確認"};
let ROWS=[],BF="",FL="today",OPEN={};
try{BF=localStorage.getItem("mpact_bucket")||"";FL=localStorage.getItem("mpact_filter")||"today";}catch(e){}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const getPin=()=>{try{return localStorage.getItem("mpa_pin")||"";}catch(e){return "";}};
function savePin(){const v=document.getElementById("pinIn").value.trim();if(!v)return;try{localStorage.setItem("mpa_pin",v);}catch(e){}document.getElementById("pinCard").style.display="none";loadAll();}

/* ---- JST の日付ユーティリティ ---- */
function jstNow(){return new Date(Date.now()+9*3600e3);}               // UTC表現のJST
function ymd(d){return d.toISOString().slice(0,10);}
function addDays(s,n){const d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return ymd(d);}
function jstAt(s,hh){return new Date(s+"T"+String(hh).padStart(2,"0")+":00:00+09:00");} // 実時刻
function md(s){return s?(+s.slice(5,7))+"/"+(+s.slice(8,10)):"";}

/* ---- 判定（ここ1か所） ---- */
function method(r){const v=String(r.vt||"");if(/PUB|^PU$|airport|送迎/i.test(v))return"pickup";if(/DEL|delivery|デリ/i.test(v))return"delivery";return"visit";}
const MLB={pickup:"送迎",delivery:"デリバリー",visit:"来店"};
function judge(r){
  const ev=r.ev||{}, chf=(r.chg&&r.chg.fields||[]).join(","), m=method(r), it={}, why={};
  const n=r.lic?(+r.lic.drivers||+r.lic.cnt||0):0;
  it.lic=n>0?"ok":"ng"; why.lic=n>0?("登録 "+n+"名"):"まだ登録がありません";
  if(ev.time_confirmed||/time/.test(chf)){it.time="ok";why.time="マイページで確定・変更済";}
  else if(r.st){it.time="tmp";why.time="OTAの値（"+esc(r.st)+"）のまま";} else {it.time="ng";why.time="時刻がありません";}
  if(m==="visit"){it.place="na";why.place="来店は不要";}
  else if(m==="pickup"){ if(r.del_flight){it.place="ok";why.place="到着便 "+esc(r.del_flight)+(r.col_flight?" ・ 帰り "+esc(r.col_flight):"");} else {it.place="ng";why.place="到着便がまだ";} }
  else { if((r.del_lat||ev.place_confirmed||/place/.test(chf))){it.place="ok";why.place="お届け先を地図で確定";} else if(r.del_place){it.place="tmp";why.place="住所はあるが地図の確定がまだ";} else {it.place="ng";why.place="お届け先がまだ";} }
  if(ev.opt_confirmed||/option/.test(chf)){it.opt="ok";why.opt="マイページで確定";} else {it.opt="tmp";why.opt="予約時の内容のまま";}
  const pt=String((r.payment||"")+" "+(r.pay_method||"")), ota=String(r.ota||"");
  if(r.paid||r.jalan_paid){it.pay="ok";why.pay="支払い済";}
  else if(/現地/.test(pt)){it.pay="tmp";why.pay="現地決済（受け渡しで確認）";}
  else if(ota==="J"||/じゃらん/.test(ota)){it.pay="ng";why.pay="じゃらんの決済リンクが未払い";}
  else if(/支払済|事前|card|Credit|カード/i.test(pt)||/^(O|RC|HANDYMAN|HP|KEYDROP)$/.test(ota)||/エアトリ|たびらい|レンタカードットコム|skyticket/.test(ota)){it.pay="ok";why.pay="事前決済";}
  else {it.pay="tmp";why.pay="決済の記録が見つかりません";}
  const vias=ev.vias||[];
  if(r.line||ev.standalone||vias.some(v=>/^(cal|home|line)$/.test(v))){it.save="ok";why.save=r.line?"LINE連携済":ev.standalone?"ホーム画面から開いた":"カレンダーから開いた";}
  else if((ev.open_days||0)>=2){it.save="tmp";why.save=ev.open_days+"日に分けて開いている";}
  else {it.save="ng";why.save="ホーム画面・カレンダー・LINE のどれもなし";}
  const done=ITEMS.every(([k])=>it[k]==="ok"||it[k]==="na");
  const opened=(ev.opens||0)>0, now=new Date();
  let stage=done?4:(!opened&&!r.mail&&!r.line)?1:!opened?2:3;
  const eve=jstAt(addDays(r.sd,-1),19);
  if(now>=eve&&(!ev.last_at||new Date(ev.last_at)<eve))stage=5;
  const deadline=jstAt(addDays(r.sd,-3),19);
  const call=!done&&now>=deadline;
  return {it,why,stage,done,call,deadline,m,opened};
}

/* ---- 読み込み ---- */
async function ef(base,anon,fn,body){const r=await fetch(base+"/functions/v1/"+fn,{method:"POST",headers:{apikey:anon,Authorization:"Bearer "+anon,"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(r.status===401)throw new Error("pin");if(!j.ok)throw new Error(j.error||("http "+r.status));return j;}
async function loadAll(){
  const pin=getPin(); if(!pin){document.getElementById("pinCard").style.display="block";document.getElementById("hdr").textContent="PINが必要です";return;}
  const today=ymd(jstNow()), from=addDays(today,-1), to=addDays(today,30);
  document.getElementById("range").textContent=md(from)+"〜"+md(to)+" に貸出";
  document.getElementById("hdr").textContent="読み込み中…";
  try{
    const [a,b]=await Promise.all([ef(MAIN,MAIN_ANON,"mypage-active",{admin_pin:pin,action:"list",from,to}),ef(BT,BT_ANON,"mypage-active-bt",{admin_pin:pin,from,to}).catch(e=>{if(e.message==="pin")throw e;console.warn(e);return {rows:[]};})]);
    const tk=b.rows.map(r=>r.token).filter(Boolean);
    if(tk.length){const g=await ef(MAIN,MAIN_ANON,"mypage-active",{admin_pin:pin,action:"agg",tokens:tk});b.rows.forEach(r=>{r.ev=r.token&&g.agg[r.token]||null;});}
    ROWS=a.rows.concat(b.rows).map(r=>Object.assign(r,{j:judge(r)}));
    render();
  }catch(e){
    if(e.message==="pin"){try{localStorage.removeItem("mpa_pin");}catch(_){}document.getElementById("pinCard").style.display="block";document.getElementById("hdr").textContent="PINが違います";return;}
    document.getElementById("hdr").textContent="読み込みに失敗";document.getElementById("list").innerHTML='<div class="empty">読み込めませんでした（'+esc(e.message)+'）。🔄 更新 を押してください。</div>';
  }
}

/* ---- 表示 ---- */
const FILTERS=[
  ["today","今日追う",r=>!r.j.done&&(r.j.call||r.j.stage===1||r.j.stage===5||(r.j.stage===2&&r.sd<=addDays(ymd(jstNow()),7)))],
  ["call","要電話",r=>r.j.call],
  ["s1","未達",r=>r.j.stage===1],
  ["s2","未開封",r=>r.j.stage===2],
  ["tom","明日貸出",r=>r.sd===addDays(ymd(jstNow()),1)],
  ["all","全予約",r=>true]];
function prio(r){return (r.j.call?0:10)+({5:0,1:1,2:2,3:3,4:9}[r.j.stage]);}
function render(){
  const inB=r=>!BF||r.bucket===BF;
  document.getElementById("tiles").innerHTML=BORD.map(bk=>{const rs=ROWS.filter(r=>r.bucket===bk),ok=rs.filter(r=>r.j.done).length,B=BUCK[bk],pc=rs.length?Math.round(ok/rs.length*100):0;
    return `<button class="tile ${BF===bk?"on":""}" onclick="setB('${bk}')" aria-pressed="${BF===bk}"><div class="bn" style="color:${B.c}">${B.n}</div><div class="num">${ok}<small>/${rs.length}</small></div><div class="bar"><i style="width:${pc}%"></i></div></button>`;}).join("");
  const base=ROWS.filter(inB);
  document.getElementById("filt").innerHTML=FILTERS.map(([k,l,f])=>`<button class="chip ${FL===k?"on":""}" onclick="setF('${k}')">${l} ${base.filter(f).length}</button>`).join("");
  const f=(FILTERS.find(x=>x[0]===FL)||FILTERS[0])[2];
  const list=base.filter(f).sort((a,b)=>String(a.sd).localeCompare(String(b.sd))||prio(a)-prio(b));
  const callN=ROWS.filter(r=>r.j.call).length;
  document.getElementById("hdr").textContent="要電話 "+callN+" ・ 準備完了 "+ROWS.filter(r=>r.j.done).length+"/"+ROWS.length;
  document.getElementById("list").innerHTML=list.length?list.map(card).join(""):'<div class="empty">該当する予約はありません</div>';
}
function card(r){
  const B=BUCK[r.bucket]||{n:r.bucket,c:"#334155",my:""},j=r.j,key=r.bucket+"|"+r.rid,ev=r.ev||{};
  const reach=[r.line?"📱LINE":"",r.mail?"📧メール":"",r.tel?"☎電話":""].filter(Boolean).join(" ")||"連絡先なし";
  const dots=ITEMS.map(([k,l])=>`<span class="d ${j.it[k]}">${k==="place"&&j.m==="pickup"?"便名":l}</span>`).join("");
  const rows=ITEMS.map(([k,l])=>`<div class="ir"><span class="d ${j.it[k]}">${{ok:"済",tmp:"仮",ng:"未",na:"不要"}[j.it[k]]}</span><span>${l==="OP"?"オプション":l}<div class="why">${j.why[k]}</div></span></div>`).join("");
  const opened=ev.opens?`開いた ${ev.opens}回（${ev.open_days}日）・最後 ${md(String(ev.last_at).slice(0,10))}`:"まだ開いていません";
  return `<div class="it ${OPEN[key]?"open":""}" onclick="tog('${esc(key)}')">
    <div class="top">${j.call?'<span class="pl scall">要電話</span>':""}<span class="pl s${j.stage}">${STG[j.stage]}</span><span class="nm">${esc(r.name||"-")} 様</span><span class="mut">${md(r.sd)} ${MLB[j.m]}</span><span style="flex:1"></span>${r.chg&&r.chg.pending?'<span class="flag" style="color:var(--inf)">依頼あり</span>':""}<span class="bk" style="background:${B.c}">${B.n}</span></div>
    <div class="dots">${dots}</div>
    <div class="det" onclick="event.stopPropagation()">
      <div class="mut">${esc(r.rid)} ・ ${esc(OTAJP[r.ota]||r.ota||"-")} ・ ${md(r.sd)} ${esc(r.st||"")}〜${md(r.ed)} ${esc(r.et||"")} ・ ${reach}</div>
      <div class="mut" style="margin:2px 0 6px">${opened} ・ 期限 ${md(addDays(r.sd,-3))} 19:00</div>
      ${rows}
      <div class="acts">${r.token&&B.my?`<a class="btn sm pri" href="${B.my}${encodeURIComponent(r.token)}&ro=1" target="_blank" rel="noopener">マイページを開く</a>`:""}
      <a class="btn sm" href="mypage-admin.html?bucket=${r.bucket}&rid=${encodeURIComponent(r.rid)}">依頼の履歴</a></div>
    </div></div>`;
}
function tog(k){OPEN[k]=!OPEN[k];render();}
function setB(b){BF=BF===b?"":b;try{localStorage.setItem("mpact_bucket",BF);}catch(e){}render();}
function setF(f){FL=f;try{localStorage.setItem("mpact_filter",FL);}catch(e){}render();}
(function(){try{const u=new URLSearchParams(location.search);const b=u.get("bucket");if(b&&BUCK[b])BF=b;const f=u.get("f");if(f&&FILTERS.some(x=>x[0]===f))FL=f;}catch(e){}})();
loadAll();
</script>
</body></html>
