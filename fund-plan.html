<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>資金計画｜HANDYMAN</title>
<style>
  :root{--bg:#0b1222;--card:#111a2e;--line:rgba(255,255,255,.1);--mut:#93a4bf;--sk:#60a5fa;--tk:#34d399;--rp:#fb923c}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:#e8f0ff;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#0b1222,rgba(11,18,34,.96));padding:12px 16px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:17px;font-weight:800}
  .sub{font-size:11px;color:var(--mut);margin-top:2px}
  .bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
  .bar button{font-size:12px;background:#16223c;color:#cbd5e1;border:1px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer;font-weight:700}
  .bar button.on{background:#2563eb;color:#fff;border-color:#3b82f6}
  main{padding:14px 16px 60px}
  h2{font-size:13px;font-weight:800;color:#8fd3e6;border-left:4px solid #38bdf8;padding-left:8px;margin:18px 0 10px;display:flex;gap:8px;align-items:baseline}
  h2 small{font-size:11px;color:var(--mut);font-weight:600}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;border-top:3px solid var(--c,#64748b)}
  .tile .t{font-size:12px;color:var(--mut);font-weight:700}
  .tile .v{font-size:21px;font-weight:900;margin-top:3px;font-variant-numeric:tabular-nums}
  .tile .n{font-size:12px;color:#cbd5e1;margin-top:2px}
  .tile .w{font-size:11px;color:#fbbf24;margin-top:2px}
  .wrap{display:flex;gap:14px;align-items:flex-start}
  .left{flex:1;min-width:0}
  .panel{width:400px;flex-shrink:0;position:sticky;top:120px;max-height:calc(100vh - 135px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
  @media(max-width:900px){.wrap{flex-direction:column}.panel{width:100%;position:static;max-height:none}}
  .map{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
  .map table{border-collapse:separate;border-spacing:0;min-width:100%}
  .map th,.map td{padding:6px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top}
  .map th{font-size:11px;color:var(--mut);font-weight:700;white-space:nowrap;cursor:pointer;background:#0e1830}
  .map th.now{color:#fde68a}
  .map td.st{font-size:12px;font-weight:800;white-space:nowrap;background:#0e1830;position:sticky;left:0;z-index:1}
  .cell{min-width:112px;min-height:44px;border-radius:8px;padding:5px 6px;cursor:pointer;border:1px solid transparent;font-size:11px;display:flex;flex-direction:column;gap:2px}
  .cell .ln{display:flex;align-items:center;gap:4px;white-space:nowrap}
  .cell .ln i{width:7px;height:7px;border-radius:50%;background:var(--c);flex-shrink:0}
  .cell .ln b{margin-left:auto;padding-left:6px;font-variant-numeric:tabular-nums}
  .cell .amt{border-top:1px solid rgba(255,255,255,.15);margin-top:2px;padding-top:2px;text-align:right}
  .cell:hover{border-color:#3b82f6}
  .cell.sel{border-color:#fde68a;box-shadow:0 0 0 1px #fde68a}
  .cell.empty{cursor:default;opacity:.35}
  .cell .amt{font-weight:900;font-size:12.5px;font-variant-numeric:tabular-nums}
  .dots{display:flex;gap:6px;flex-wrap:wrap}
  .dots i{font-style:normal;display:inline-flex;align-items:center;gap:3px;color:#e2e8f0}
  .dots i:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
  .legend{display:flex;gap:12px;font-size:11px;color:var(--mut);margin:8px 2px 0;flex-wrap:wrap}
  .legend i{font-style:normal;display:inline-flex;align-items:center;gap:4px}
  .legend i:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
  .pay{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:12.5px}
  .pay th,.pay td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .pay th{font-size:11px;color:var(--mut);background:#0e1830}
  .pay th:first-child,.pay td:first-child{text-align:left}
  .pay tr.r{cursor:pointer}.pay tr.r:hover td{background:#16223c}
  .pay tr.sel td{background:#1e293b}
  .pay tr.past td{color:#64748b}
  .pay .tot td{font-weight:900;background:#0e1830}
  .paywrap{overflow-x:auto}
  .ph{padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
  .ph b{font-size:14px}.ph .s{font-size:11.5px;color:var(--mut);margin-top:3px}
  .it{padding:11px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
  .it .h{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .tag{font-size:10.5px;font-weight:900;border-radius:6px;padding:2px 7px;color:#0b1222;background:var(--c)}
  .stg{font-size:10.5px;color:#cbd5e1;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
  .it .nm{font-weight:800}.it .pl{font-family:ui-monospace,monospace;color:#bfe3ff;font-size:12px}
  .it .am{margin-left:auto;font-weight:900;font-variant-numeric:tabular-nums}
  .it .am.no{color:#fbbf24;font-weight:700;font-size:11.5px}
  .kv{display:grid;grid-template-columns:72px 1fr;gap:3px 8px;margin-top:7px;color:#cbd5e1}
  .kv span:nth-child(odd){color:var(--mut);font-size:11.5px}
  .pd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .pd input{background:#0e1830;border:1px solid var(--line);border-radius:7px;color:#fff;padding:4px 7px;font-size:12.5px;color-scheme:dark}
  .pd .kari{font-size:10.5px;color:#fbbf24}
  .pd .ok{font-size:10.5px;color:#34d399}
  .msg{padding:30px;text-align:center;color:var(--mut)}
  .note{font-size:11px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>資金計画</h1>
  <div class="sub">車検・点検・修理/整備の日程と支払予定（配車表の整備ブロックから毎回読込・AMEX 20日締め 翌月10日引落）</div>
  <div class="bar" id="stores"></div>
</header>
<main>
  <div id="sum"></div>
  <div class="wrap">
    <div class="left">
      <h2>月別・店舗別 <small>いつ・どの店で・何台・いくら（入庫月）。マスを押すと右に明細</small></h2>
      <div class="map" id="map"><div class="msg">読み込み中…</div></div>
      <div class="legend"><i style="--c:var(--sk)">車検</i><i style="--c:var(--tk)">点検</i><i style="--c:var(--rp)">修理・整備</i><span>色の濃さ＝金額</span></div>
      <h2>精算予定表 <small>引落日ごと（行を押すと右に明細）</small></h2>
      <div class="paywrap" id="pay"></div>
      <div class="note">払う日：1〜19日→翌月10日引落／20日以降→翌々月10日引落。払う日が未入力の整備は入庫日で仮計算（「仮」）。金額＝実費があれば実費、無ければ予算。10日が休日の場合はカード会社の規定で前後します。</div>
    </div>
    <div class="panel" id="panel"><div class="msg">マップのマス、または精算予定表の行を押すと明細が出ます</div></div>
  </div>
</main>
<script>
// 2026-10-24 資金計画：正本＝配車表の整備ブロック（maintenance / nha_maintenance / bt_maintenance）を開くたびに読む。
// 書くのは「カードで払う日」だけ（hq_maint_pay・1整備＝1行）。設計メモ docs/設計_資金計画_車検点検修理_2026-10-24.md
const MAIN_URL='https://ckrxttbnawkclshczsia.supabase.co',MAIN_ANON='sb_publishable_aTVhlY0YD-5BBfI03ZNnsg_MzO_vsIe';
const BT_URL='https://ggqugvyskyiblxiycpci.supabase.co',BT_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18';
const ST={nha:'那覇',spk:'札幌',bt:'高松'},STORES=['nha','spk','bt'];
const TY={sk:{l:'車検',c:'var(--sk)'},tk:{l:'点検',c:'var(--tk)'},rp:{l:'修理・整備',c:'var(--rp)'}},TYS=['sk','tk','rp'];
let ITEMS=[],PAY={},storeSel='all',sel=null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function yen(n){return '¥'+Math.round(n).toLocaleString();}
function man(n){return n>=10000?(Math.round(n/1000)/10).toLocaleString()+'万':yen(n);}
function tok(){for(const k of Object.keys(localStorage)){if(k.indexOf('sb-ckrxttbnawkclshczsia-auth-token')===0){try{const v=JSON.parse(localStorage.getItem(k));const s=v.currentSession||v.session||v;if(s&&s.access_token&&(!s.expires_at||s.expires_at*1000>Date.now()+30000))return s.access_token;}catch(e){}}}return null;}
async function sb(path,method,body,prefer){const t=tok();if(!t)throw new Error('LOGIN');const r=await fetch(MAIN_URL+'/rest/v1/'+path,{method:method||'GET',headers:{apikey:MAIN_ANON,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:prefer||'return=representation'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,160));const x=await r.text();return x?JSON.parse(x):null;}
async function sbAll(path){let all=[];for(let off=0;off<100000;off+=1000){const p=await sb(path+(path.includes('?')?'&':'?')+'limit=1000&offset='+off);all=all.concat(p||[]);if(!p||p.length<1000)break;}return all;}
function today(){const d=new Date(Date.now()+9*3600e3);return d.toISOString().slice(0,10);}
function ymAdd(ym,n){let y=+ym.slice(0,4),m=+ym.slice(5,7)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+String(m+1).padStart(2,'0');}
function typeOf(l){l=String(l||'');return l.includes('車検')?'sk':l.includes('点検')?'tk':'rp';}
// AMEX：1〜19日→当月20日締め・翌月10日引落／20日以降→翌月20日締め・翌々月10日引落（オーナー確定 2026-10-24）
function bill(d){if(!/^\d{4}-\d{2}-\d{2}/.test(d||''))return null;const ym=d.slice(0,7),day=+d.slice(8,10);const cm=day>=20?ymAdd(ym,1):ym;return {close:cm+'-20',wd:ymAdd(cm,1)+'-10'};}

function norm(store,r,vn){const v=vn[r.vehicle_code]||{};const act=+r.actual_cost||0,cost=+r.cost||0;
  return {store,id:String(r.id),key:store+':'+r.id,code:r.vehicle_code,name:r.name||v.name||r.vehicle_code||'（車両不明）',plate:r.plate||v.plate_no||'',
    start:String(r.start_date||'').slice(0,10),end:String(r.end_date||'').slice(0,10),label:r.label||'',ty:typeOf(r.label),
    amt:act>0?act:(cost>0?cost:0),fixed:act>0,cost,act,workshop:r.workshop||'',status:r.status||'',detail:r.work_detail||''};}
function withPay(it){const p=PAY[it.key];const pd=p&&p.pay_date?p.pay_date:null;const b=bill(pd||it.start);return Object.assign(it,{pay:pd,kari:!pd,close:b?b.close:'',wd:b?b.wd:''});}

async function load(){
  if(!tok()){document.getElementById('map').innerHTML='<div class="msg">ログインが必要です（ダッシュボードでログインしてから開いてください）</div>';return;}
  const from=ymAdd(today().slice(0,7),-14)+'-01';
  const cols='id,vehicle_code,start_date,end_date,label,cost,actual_cost,workshop,status,work_detail';
  try{
    const [spk,nha,vs,vn,bt,pay]=await Promise.all([
      sbAll('maintenance?select='+cols+'&block_type=eq.maintenance&start_date=gte.'+from+'&order=start_date.asc,id.asc'),
      sbAll('nha_maintenance?select='+cols+'&start_date=gte.'+from+'&order=start_date.asc,id.asc'),
      sbAll('vehicles?select=code,name,plate_no,owner_company&order=code.asc'),
      sbAll('nha_vehicles?select=code,name,plate_no&order=code.asc'),
      fetch(BT_URL+'/rest/v1/rpc/bt_company_maint_plan',{method:'POST',headers:{apikey:BT_ANON,Authorization:'Bearer '+BT_ANON,'Content-Type':'application/json'},body:'{}'}).then(r=>{if(!r.ok)throw new Error('高松 HTTP '+r.status);return r.json();}),
      sbAll('hq_maint_pay?select=key,pay_date,updated_at&order=key.asc')
    ]);
    const mp=a=>{const o={};a.forEach(v=>o[v.code]=v);return o;};
    PAY={};pay.forEach(p=>PAY[p.key]=p);
    const btRows=(bt||[]).filter(r=>String(r.start||'')>=from).map(r=>({id:r.id,vehicle_code:r.code,name:r.name,plate:r.plate,start_date:r.start,end_date:r.end,label:r.label,cost:r.cost,actual_cost:r.actual,workshop:r.workshop,status:r.status,work_detail:r.detail}));
    // 清掃は費用の対象外（車検・点検・修理/整備のみ）
    // 札幌の協力会社所有車（vehicles.owner_company≠HANDYMAN）の整備は自社カード精算の対象外（オーナー確定 2026-10-24）
    const vsm=mp(vs),own=r=>{const v=vsm[r.vehicle_code];return !v||!v.owner_company||v.owner_company==='HANDYMAN';};
    ITEMS=[].concat(spk.filter(own).map(r=>norm('spk',r,vsm)),nha.map(r=>norm('nha',r,mp(vn))),btRows.map(r=>norm('bt',r,{}))).filter(i=>i.label!=='清掃').map(withPay);
    render();
  }catch(e){document.getElementById('map').innerHTML='<div class="msg">'+(e.message==='LOGIN'?'ログインが必要です':'読み込めませんでした：'+esc(e.message))+'</div>';}
}

function vis(){return ITEMS.filter(i=>storeSel==='all'||i.store===storeSel);}
function agg(a){const o={n:0,amt:0,no:0,kari:0};TYS.forEach(t=>o[t]={n:0,amt:0,no:0});a.forEach(i=>{o.n++;o.amt+=i.amt;if(!i.amt)o.no++;if(i.kari)o.kari++;o[i.ty].n++;o[i.ty].amt+=i.amt;if(!i.amt)o[i.ty].no++;});return o;}

function renderStores(){document.getElementById('stores').innerHTML=[['all','全店']].concat(STORES.map(s=>[s,ST[s]])).map(([k,l])=>'<button class="'+(storeSel===k?'on':'')+'" onclick="setStore(\''+k+'\')">'+l+'</button>').join('');}
function setStore(k){storeSel=k;sel=null;render();}

function renderSum(){
  const td=today(),a=vis().filter(i=>i.wd>=td),g=agg(a);
  const tile=(c,t,x)=>'<div class="tile" style="--c:'+c+'"><div class="t">'+t+'</div><div class="v">'+yen(x.amt)+'</div><div class="n">'+x.n+'件</div>'+(x.no?'<div class="w">うち予算未入力 '+x.no+'件</div>':'')+'</div>';
  document.getElementById('sum').innerHTML='<h2>サマリ <small>'+(storeSel==='all'?'全店':ST[storeSel])+'・これから引落の分（引落日が今日以降）</small></h2><div class="tiles">'+
    TYS.map(t=>tile(TY[t].c,TY[t].l,g[t])).join('')+tile('#e2e8f0','合計',g)+'</div>';
}

function renderMap(){
  const m0=ymAdd(today().slice(0,7),-2),months=Array.from({length:14},(_,i)=>ymAdd(m0,i)),cur=today().slice(0,7);
  const rows=storeSel==='all'?STORES:[storeSel],V=vis();
  const cellOf=(s,ym)=>V.filter(i=>i.store===s&&i.start.slice(0,7)===ym);
  let max=1;rows.forEach(s=>months.forEach(ym=>{max=Math.max(max,cellOf(s,ym).reduce((x,i)=>x+i.amt,0));}));
  let h='<table><tr><th></th>'+months.map(ym=>'<th class="'+(ym===cur?'now':'')+'" onclick="pick(\'m\',\''+ym+'\')">'+(+ym.slice(5))+'月'+(ym.slice(5)==='01'||ym===m0?'<br><small>'+ym.slice(0,4)+'</small>':'')+'</th>').join('')+'</tr>';
  rows.forEach(s=>{h+='<tr><td class="st">'+ST[s]+'</td>'+months.map(ym=>{const a=cellOf(s,ym);if(!a.length)return '<td><div class="cell empty"></div></td>';
    const g=agg(a),k='c|'+s+'|'+ym,al=.08+.5*Math.sqrt(g.amt/max);
    return '<td><div class="cell'+(sel===k?' sel':'')+'" style="background:rgba(59,130,246,'+al.toFixed(2)+')" onclick="pick(\'c\',\''+s+'\',\''+ym+'\')">'+TYS.filter(t=>g[t].n).map(t=>'<div class="ln"><i style="--c:'+TY[t].c+'"></i>'+(t==='rp'?'修理':TY[t].l)+' '+g[t].n+'台<b>'+(g[t].amt?man(g[t].amt):'未')+'</b></div>').join('')+'<div class="amt">計 '+(g.amt?man(g.amt):'—')+'</div></div></td>';}).join('')+'</tr>';});
  document.getElementById('map').innerHTML=h+'</table>';
}

function renderPay(){
  const td=today(),V=vis(),wds=[...new Set(V.map(i=>i.wd).filter(Boolean))].sort().filter(w=>w>=ymAdd(td.slice(0,7),-2));
  let tot=agg([]);
  let h='<table class="pay"><tr><th>引落日</th><th>締め</th><th>件数</th>'+TYS.map(t=>'<th>'+TY[t].l+'</th>').join('')+'<th>合計</th><th>うち仮</th></tr>';
  wds.forEach(w=>{const a=V.filter(i=>i.wd===w),g=agg(a),k='w|'+w;if(w>=td)tot=agg(V.filter(i=>i.wd>=td));
    h+='<tr class="r'+(w<td?' past':'')+(sel===k?' sel':'')+'" onclick="pick(\'w\',\''+w+'\')"><td>'+w.replace(/-/g,'/')+(w<td?' 済':'')+'</td><td>'+a[0].close.slice(5).replace('-','/')+'</td><td>'+g.n+'</td>'+TYS.map(t=>'<td>'+(g[t].amt?yen(g[t].amt):'—')+'</td>').join('')+'<td><b>'+yen(g.amt)+'</b></td><td>'+(g.kari||'')+'</td></tr>';});
  h+='<tr class="tot"><td>今後の合計</td><td></td><td>'+tot.n+'</td>'+TYS.map(t=>'<td>'+yen(tot[t].amt)+'</td>').join('')+'<td>'+yen(tot.amt)+'</td><td>'+(tot.kari||'')+'</td></tr></table>';
  document.getElementById('pay').innerHTML=wds.length?h:'<div class="msg">対象なし</div>';
}

function pick(kind,a,b){sel=kind==='c'?'c|'+a+'|'+b:kind+'|'+a;renderMap();renderPay();renderPanel();if(innerWidth<=900)document.getElementById('panel').scrollIntoView({behavior:'smooth'});}
function curItems(){if(!sel)return null;const p=sel.split('|'),V=vis();
  if(p[0]==='c')return {t:ST[p[1]]+'　'+p[2].replace('-','年')+'月 入庫',a:V.filter(i=>i.store===p[1]&&i.start.slice(0,7)===p[2])};
  if(p[0]==='m')return {t:(storeSel==='all'?'全店':ST[storeSel])+'　'+p[1].replace('-','年')+'月 入庫',a:V.filter(i=>i.start.slice(0,7)===p[1])};
  return {t:p[1].replace(/-/g,'/')+' 引落',a:V.filter(i=>i.wd===p[1])};}
function renderPanel(){const c=curItems(),el=document.getElementById('panel');if(!c){el.innerHTML='<div class="msg">マップのマス、または精算予定表の行を押すと明細が出ます</div>';return;}
  const a=c.a.slice().sort((x,y)=>(x.start+x.store).localeCompare(y.start+y.store)),g=agg(a);
  el.innerHTML='<div class="ph"><b>'+esc(c.t)+'</b><div class="s">'+g.n+'件・'+yen(g.amt)+'　'+TYS.filter(t=>g[t].n).map(t=>TY[t].l+' '+g[t].n+'件 '+yen(g[t].amt)).join('／')+'</div></div>'+
   (a.length?a.map(it=>'<div class="it"><div class="h"><span class="tag" style="--c:'+TY[it.ty].c+'">'+esc(it.label||TY[it.ty].l)+'</span>'+(storeSel==='all'?'<span class="stg">'+ST[it.store]+'</span>':'')+'<span class="nm">'+esc(it.name)+'</span><span class="pl">'+esc(it.plate)+'</span>'+
     (it.amt?'<span class="am">'+yen(it.amt)+'</span>':'<span class="am no">予算未入力</span>')+'</div><div class="kv">'+
     '<span>日程</span><span>'+esc(it.start.replace(/-/g,'/'))+(it.end&&it.end!==it.start?' 〜 '+esc(it.end.replace(/-/g,'/')):'')+'</span>'+
     '<span>金額</span><span>予算 '+(it.cost?yen(it.cost):'—')+'／実費 '+(it.act?yen(it.act):'—')+'</span>'+
     (it.workshop?'<span>工場</span><span>'+esc(it.workshop)+'</span>':'')+
     (it.status?'<span>状態</span><span>'+esc({approved:'承認済',pending:'承認待ち'}[it.status]||it.status)+'</span>':'')+
     (it.detail?'<span>作業内容</span><span>'+esc(it.detail)+'</span>':'')+
     '<span>払う日</span><span class="pd"><input type="date" value="'+(it.pay||'')+'" onchange="savePay(\''+esc(it.key)+'\',this.value,this)">'+(it.kari?'<span class="kari">未入力（入庫日で仮計算）</span>':'')+'</span>'+
     '<span>締め/引落</span><span>'+esc(it.close.replace(/-/g,'/'))+' 締め → <b>'+esc(it.wd.replace(/-/g,'/'))+'</b> 引落'+(it.kari?'（仮）':'')+'</span>'+
     '</div></div>').join(''):'<div class="msg">この範囲の整備はありません</div>');}

async function savePay(key,val,el){const it=ITEMS.find(i=>i.key===key);if(!it)return;el.disabled=true;
  try{const r=await sb('hq_maint_pay?on_conflict=key','POST',{key,store:it.store,maint_id:it.id,pay_date:val||null},'return=representation,resolution=merge-duplicates');
    if(!r||!r.length||(r[0].pay_date||'')!==(val||''))throw new Error('保存の確認ができませんでした');
    PAY[key]=r[0];withPay(it);render();
  }catch(e){alert(e.message==='LOGIN'?'ログインが切れています。ダッシュボードで再ログインしてください':'保存できませんでした：'+e.message);el.disabled=false;}}

function render(){renderStores();renderSum();renderMap();renderPay();renderPanel();}
renderStores();load();
</script>
