<!DOCTYPE html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>📮 通知・メール・LINE 台帳</title>
<style>
:root{--bd:#e2e8f0;--mut:#64748b}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#f4f6fb;color:#0f172a;font-size:14px}
.wrap{max-width:960px;margin:0 auto;padding:14px 12px 40px}
h1{font-size:19px;margin:2px 0}
.sub{color:var(--mut);font-size:12px}
.rf{float:right;background:#2563eb;color:#fff;border:0;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;margin:12px 0;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.chd{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.chd .t{font-size:15px;font-weight:700}
.chd .who{font-size:11.5px;color:var(--mut);background:#f1f5f9;padding:2px 8px;border-radius:10px}
.st{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.st.on{color:#16a34a}.st.off{color:#dc2626}.st.warn{color:#d97706}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:7px 10px;text-align:left;border-bottom:1px solid #f1f5f9;vertical-align:top}
th{background:#fafbfc;color:var(--mut);font-weight:600;font-size:11px}
tr:last-child td{border-bottom:0}
td.w{white-space:nowrap;color:#334155}
.ch{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10.5px;font-weight:700}
.mail{background:#dbeafe;color:#1e40af}.line{background:#dcfce7;color:#166534}.slack{background:#fef3c7;color:#92400e}.wh{background:#ede9fe;color:#6d28d9}
.b{font-weight:700}
.foot{padding:7px 14px;background:#fafbfc;font-size:11.5px;color:var(--mut);border-top:1px dashed var(--bd)}
.kpi{display:flex;gap:10px;margin:10px 0}
.kbox{flex:1;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;text-align:center}
.kbox .n{font-size:24px;font-weight:800}
.note{margin:14px 0;padding:9px 12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;font-size:12px;color:#9a3412}
.cov{background:#fff;border:2px solid #16a34a;border-radius:12px;padding:12px 14px;margin:12px 0}
.cov h3{margin:0 0 8px;font-size:14px}
.covrow{display:flex;flex-wrap:wrap;gap:8px}
.covitem{flex:1;min-width:130px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:9px;padding:8px 10px}
.covitem.miss{background:#fef2f2;border-color:#fecaca}
.covitem .lbl{font-size:11.5px;color:var(--mut)}
.covitem .val{font-size:19px;font-weight:800}
</style></head><body><div class="wrap">
<button class="rf" onclick="loadAll()">🔄 更新</button>
<h1>📮 通知・メール・LINE 台帳</h1>
<div class="sub" id="gen">読込中…</div>

<div class="cov" id="cov"></div>

<div class="card" id="inbox"><div class="chd"><span style="font-size:17px">📥</span><span class="t">reserve 受信箱（.com=高松 / .jp=札幌那覇）</span><span class="st" id="inbox_st">読込中…</span></div><div id="inbox_body"><div class="foot" style="border:0">読込中…</div></div></div>

<div class="kpi">
<div class="kbox"><div class="sub">札幌 じゃらん未払</div><div class="n" id="up_spk">–</div></div>
<div class="kbox"><div class="sub">那覇 じゃらん未払</div><div class="n" id="up_nha">–</div></div>
<div class="kbox"><div class="sub">全体の稼働</div><div class="n" id="health">–</div></div>
</div>

<div id="cards"></div>

<div class="note">💡 楽天(R)は全メール対象外＝仕様（楽天メールに自社LINE誘導が含む＝二重回避）。「稼働中」＝そのcronが動いて直近成功。実際に届いたかは各カード下部の「直近24h送信」で確認。</div>
</div>

<script>
const MAIN="https://ckrxttbnawkclshczsia.supabase.co",MANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
const BT="https://ggqugvyskyiblxiycpci.supabase.co",BANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18";
function rpc(base,anon,fn){return fetch(base+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:anon,Authorization:"Bearer "+anon,"Content-Type":"application/json"},body:"{}"}).then(r=>r.json()).catch(e=>({ok:false}));}
function rpcP(base,anon,fn,p){return fetch(base+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:anon,Authorization:"Bearer "+anon,"Content-Type":"application/json"},body:JSON.stringify(p)}).then(r=>r.ok?r.json():[]).catch(()=>[]);}
function sbGet(base,anon,path){return fetch(base+"/rest/v1/"+path,{headers:{apikey:anon,Authorization:"Bearer "+anon}}).then(r=>r.ok?r.json():[]).catch(()=>[]);}
async function loadInbox(){
  const st=document.getElementById("inbox_st"),bd=document.getElementById("inbox_body");
  const rows=await sbGet(MAIN,MANON,"reserve_inbox_mirror?select=*&order=gmail_date.desc&limit=60");
  if(!rows.length){st.textContent="受信0";st.className="st warn";bd.innerHTML='<div class="foot" style="border:0">直近の受信記録なし（GASが30分毎に記録）</div>';return;}
  const nos=[...new Set(rows.map(r=>r.reservation_no).filter(Boolean))];
  let btSet=new Set(),mnSet=new Set();
  if(nos.length){
    const [bt,mn]=await Promise.all([rpcP(BT,BANON,"bt_reserve_check",{p_nos:nos}),rpcP(MAIN,MANON,"reserve_check",{p_nos:nos})]);
    btSet=new Set(bt||[]);mnSet=new Set(mn||[]);
  }
  let miss=0;
  const tr=rows.map(r=>{
    const jst=new Date(r.gmail_date).toLocaleString("ja-JP",{timeZone:"Asia/Tokyo",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
    const com=(r.to_addr||"").indexOf(".com")>=0;
    const dst=com?'<span class="ch wh">.com 高松</span>':'<span class="ch mail">.jp 札幌那覇</span>';
    const imp=r.reservation_no&&(btSet.has(r.reservation_no)||mnSet.has(r.reservation_no));
    let impCell;
    if(!r.reservation_no)impCell='<span style="color:#94a3b8">番号未取得</span>';
    else if(imp)impCell='<span style="color:#16a34a;font-weight:700">✅取込済</span>';
    else{impCell='<span style="color:#dc2626;font-weight:700">❌未取込</span>';miss++;}
    return `<tr><td class="w">${jst}</td><td>${dst}</td><td class="w">${r.ota||"-"}</td><td class="w">${r.store_guess||"-"}</td><td class="w">${r.reservation_no||"-"}</td><td>${impCell}</td><td style="color:#64748b">${(r.subject||"").slice(0,30)}</td></tr>`;
  }).join("");
  st.textContent=miss?("⚠️未取込"+miss+"件"):("✅全"+rows.length+"件取込済");
  st.className="st "+(miss?"off":"on");
  bd.innerHTML=`<table><thead><tr><th>受信</th><th>宛先</th><th>OTA</th><th>店</th><th>予約番号</th><th>取込</th><th>件名</th></tr></thead><tbody>${tr}</tbody></table><div class="foot">reserve@rent-handyman.com(高松)/.jp(札幌那覇)宛の予約メール受信記録。取込＝BT/本DBに予約が実在するか照合。GASが30分毎に記録。</div>`;
}

// ===== 系統マスター（何を・いつ・どのcronが担当か）=====
const M=(t)=>`<span class="ch mail">メール</span>`,L=(t)=>`<span class="ch line">LINE</span>`,SL=`<span class="ch slack">Slack</span>`,WH=`<span class="ch wh">Webhook</span>`;
const GROUPS=[
 {key:".com HDM", icon:"🟦", title:".com 初動・リマインダー", who:"那覇 / 札幌 HDM", crons:["official-notify"],
  rows:[["初動 welcome","予約登録され次第",M(),"予約確認・<b>じゃらんは決済リンク付</b>"],
    ["場所リマインド","貸出3日前 10時",M(),"お届け場所の入力依頼（未設定のみ）"],
    ["前日","貸出前日 18時",M(),"明日の貸出案内"],
    ["返却前日","返却前日 17時",M(),"明日の返却案内"],
    ["<b>傷チェック</b>","出発当日 8時〜",M(),"傷チェックURL"],
    ["返却日","返却当日 9時〜",M(),"返却案内"],
    ["御礼","返却翌日 10時",M(),"お礼"],
    ["<b>じゃらん催促</b>","毎日 10時",M(),"未払のみ・決済リンク再送"]]},
 {key:"高松HDM", icon:"🟪", title:"高松HDM 初動・リマインダー", who:"高松 HDM（hdm-tkm）", crons:["hdm-tkm-enqueue","hdm-tkm-send-mail"],
  rows:[["初動 welcome","予約完了時",M(),"予約確認＋マイページ（じゃらんは決済リンク付）"],
    ["統合リマインド","貸出4日前・2日前",M(),"未了項目（免許/約款/送迎/決済）を1通"],
    ["前日リマインド","貸出前日",M(),"未了項目がある時"],
    ["<b>傷チェック</b>","出発当日 8時〜",M(),"傷チェックURL"],
    ["御礼","返却後1〜3日",M(),"お礼"]]},
 {key:"じゃらん決済", icon:"🟩", title:"じゃらん事前決済（全店）", who:"那覇 / 札幌 / 高松", crons:["payment-reconcile-monitor","payment-unpaid-alert"],
  rows:[["<b>消し込み</b>","入金の瞬間・常時",WH,"Square Webhook→DB即paid（見逃しゼロ）"],
    ["reconcile安全網","毎時15分",WH,"既払×DB未払を自動修正"],
    ["<b>未入金アラート</b>","毎朝9時",SL,"貸出3日前〜当日の未払→スタッフSlack"]]},
 {key:"マイページ/LINE", icon:"🟨", title:"マイページ・傷・免許・御礼（LINE）", who:"那覇 / 札幌", crons:["mypage-notify-spk","mypage-notify-nha","line-damage-check","line-damage-check-nha","license-reminder-spk","license-reminder-nha","line-thanks-spk","line-thanks-nha","returnday-reminder-nha","damage-overdue-alert-spk","damage-overdue-alert-nha","spk-staff-notify-instant","spk-staff-notify-hourly"],
  rows:[["マイページURL","登録後（前日/返却3h再ナッジ）",L(),"マイページ案内"],
    ["傷チェック","出発当日 8時（LINE連携客）",L(),"傷チェックURL"],
    ["免許リマインド","毎朝10時",L(),"免許証未提出"],
    ["御礼/返却案内","毎朝9-10時",L(),"御礼・返却"],
    ["スタッフ通知","担当の付外・随時",L(),"タスク担当を本人へ"],
    ["傷チェック未対応","15分毎",SL,"スタッフ警告"]]},
 {key:"KEYDROP", icon:"🟧", title:"KEYDROP（keydrop.jp）", who:"那覇 / 札幌", crons:["keydrop-place-reminder","keydrop-reminder","keydrop-return-reminder","keydrop-damage-check","keydrop-returnday","keydrop-thanks"],
  rows:[["場所/前日/返却前日","10時 / 18時 / 17時",M(),"各リマインド"],
    ["傷チェック / 返却日 / 御礼","8時 / 9時〜 / 10時",M(),"傷・返却・お礼"],
    ["消し込み","入金の瞬間",WH,"同webhook"]]},
 {key:"高松BUDDICA", icon:"🟫", title:"高松BUDDICA（buddica-tourism.jp・別ブランド）", who:"高松 BUDDICA", crons:["bt-mail-guide","bt-mail-remind","bt-mail-remind2","bt-mail-remind4","bt-mail-return","bt-mail-thanks","bt-mail-dayof","bt-notify-site-resv"],
  rows:[["初動ご利用ガイド","予約後（15分毎）",M(),"ご利用ガイド"],
    ["各リマインド","毎朝9時 ほか",M(),"remind/remind2/remind4"],
    ["返却前日 / 当日 / 御礼","8時 / 20時 / 10時",M(),"返却前・当日・お礼"]]}
];

function healthOf(crons,g){ // g=グループのcron名リスト
  const mine=crons.filter(c=>g.some(p=>c.name.startsWith(p)||c.name===p));
  if(!mine.length) return {cls:"warn",txt:"cron未検出"};
  const off=mine.filter(c=>!c.active);
  if(off.length===mine.length) return {cls:"off",txt:"○停止"};
  const bad=mine.filter(c=>c.active && c.last_status && !["succeeded","connecting","starting","running"].includes(c.last_status));
  const last=mine.map(c=>c.last_run).filter(Boolean).sort().slice(-1)[0]||"";
  if(bad.length) return {cls:"warn",txt:"⚠️要確認 "+last};
  return {cls:"on",txt:"● 稼働中 "+last};
}

async function loadAll(){
  const [m,b]=await Promise.all([rpc(MAIN,MANON,"mail_status"),rpc(BT,BANON,"bt_mail_status")]);
  document.getElementById("gen").textContent="更新 "+(m.gen||b.gen||"?")+" JST ／ 60秒ごと自動更新";
  if(m.jalan_unpaid){document.getElementById("up_spk").textContent=m.jalan_unpaid.spk;document.getElementById("up_nha").textContent=m.jalan_unpaid.nha;}
  // ===== 本日の到達実績（対象→送信済）＝正常に送信されてるかの決定的確認 =====
  const cv=m.coverage||{};
  function ci(lbl,s,t){const ok=s>=t;return `<div class="covitem${ok?'':' miss'}"><div class="lbl">${lbl}</div><div class="val">${s}/${t} ${t===0?'（対象なし）':(ok?'✅':'⚠️'+(t-s)+'未')}</div></div>`;}
  const w=cv.welcome||{},g=cv.damage||{};
  const bc=(b&&b.coverage)||{},bh=bc.hdm||{},bb=bc.buddica||{};
  document.getElementById("cov").innerHTML=`<h3>✅ 本日の到達実績（対象 → 送信済）＝ここが全て一致＝正常稼働</h3>
   <div class="covrow" style="margin-bottom:6px"><b style="width:100%;font-size:12px;color:#64748b">初動メール（直近24h登録の対象予約）</b>${ci('札幌',w.spk_s,w.spk_t)}${ci('那覇',w.nha_s,w.nha_t)}${ci('高松HDM',bh.s,bh.t)}${ci('高松BUDDICA',bb.s,bb.t)}</div>
   <div class="covrow"><b style="width:100%;font-size:12px;color:#64748b">傷チェック（本日出発）</b>${ci('札幌',g.spk_s,g.spk_t)}${ci('那覇',g.nha_s,g.nha_t)}</div>`;
  const crons=[...(m.crons||[]),...(b.crons||[])];
  const sends=[...(m.sends||[]),...(b.sends||[])];
  let okg=0;
  const html=GROUPS.map(g=>{
    const h=healthOf(crons,g.crons); if(h.cls==="on")okg++;
    const rows=g.rows.map(r=>`<tr><td class="w b">${r[0]}</td><td class="w">${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("");
    // 直近24h送信（このグループのcronが書く先を大まかに集約）
    const rel=sends.filter(s=>{
      if(g.key===".com HDM") return ["spk","nha"].includes(s.store)&&s.action.startsWith("mail_");
      if(g.key==="高松HDM") return s.store==="HDM高松";
      if(g.key==="マイページ/LINE") return ["spk","nha"].includes(s.store)&&!s.action.startsWith("mail_")&&!s.action.includes("jalan");
      if(g.key==="KEYDROP") return s.action.includes("keydrop");
      if(g.key==="高松BUDDICA") return s.store==="BUDDICA";
      return false;});
    const tot=rel.reduce((a,s)=>a+s.cnt,0);
    const foot = g.key==="じゃらん決済" ? `未払：札幌${m.jalan_unpaid?.spk??"?"} / 那覇${m.jalan_unpaid?.nha??"?"}` : `直近24h送信 ${tot}件`+(rel.length?`（${rel.slice(0,4).map(s=>s.action+":"+s.cnt).join(" / ")}）`:"");
    return `<div class="card"><div class="chd"><span style="font-size:17px">${g.icon}</span><span class="t">${g.title}</span><span class="who">${g.who}</span><span class="st ${h.cls}">${h.txt}</span></div>
    <table><thead><tr><th>何を</th><th>いつ</th><th>ch</th><th>内容</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="foot">${foot}</div></div>`;
  }).join("");
  document.getElementById("cards").innerHTML=html;
  document.getElementById("health").textContent=okg+"/"+GROUPS.length;
}
loadAll();loadInbox();setInterval(()=>{loadAll();loadInbox();},60000);
</script></body></html>
