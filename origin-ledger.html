<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌱 起源台帳（決定台帳）| HANDYMAN</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:#f1f5f9;color:#1e293b;font-size:14px}
  header{background:linear-gradient(135deg,#0f766e,#065f46);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  header h1{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
  header .sub{font-size:11px;opacity:.85;margin-top:3px}
  .wrap{max-width:960px;margin:0 auto;padding:14px}
  .cards{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .kpi{background:#fff;border-radius:10px;padding:10px 16px;box-shadow:0 1px 5px rgba(0,0,0,.07);border-top:3px solid #94a3b8;min-width:92px}
  .kpi.o{border-top-color:#d97706}.kpi.d{border-top-color:#16a34a}.kpi.c{border-top-color:#64748b}
  .kpi .l{font-size:11px;color:#64748b}.kpi .v{font-size:22px;font-weight:800}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .tab{border:1px solid #cbd5e1;background:#fff;border-radius:20px;padding:6px 14px;font-size:12.5px;cursor:pointer;font-weight:700;color:#475569}
  .tab.on{background:#0f766e;color:#fff;border-color:#0f766e}
  .bar input{flex:1;min-width:160px;border:1px solid #cbd5e1;border-radius:8px;padding:7px 12px;font-size:13px}
  .btn{border:none;background:#0f766e;color:#fff;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .card{background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.08);margin-bottom:12px;overflow:hidden;border-left:5px solid #94a3b8}
  .card.decided{border-left-color:#d97706}.card.in_progress{border-left-color:#2563eb}.card.done{border-left-color:#16a34a}.card.cancelled{border-left-color:#94a3b8;opacity:.75}.card.requested{border-left-color:#9333ea}
  .acts{display:flex;gap:8px;padding:2px 15px 13px;flex-wrap:wrap}
  .abtn{border:none;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:800;cursor:pointer}
  .abtn.done{background:#16a34a;color:#fff}.abtn.run{background:#2563eb;color:#fff}.abtn.cancel{background:#f8fafc;color:#64748b;border:1px solid #cbd5e1}
  .abtn:active{transform:translateY(1px)}
  .waitb{font-size:11.5px;color:#7e22ce;background:#faf5ff;border:1px solid #e9d5ff;border-radius:8px;padding:7px 12px;font-weight:700}
  .chead{display:flex;align-items:center;gap:8px;padding:11px 15px;flex-wrap:wrap;background:#f8fafc;border-bottom:1px solid #eef2f7}
  .oid{font-family:ui-monospace,monospace;font-size:11px;color:#64748b}
  .st{font-size:11px;font-weight:800;border-radius:20px;padding:3px 11px;color:#fff}
  .st.decided{background:#d97706}.st.in_progress{background:#2563eb}.st.done{background:#16a34a}.st.cancelled{background:#94a3b8}
  .who{font-size:12px;color:#334155;font-weight:700}
  .ts{font-size:11px;color:#94a3b8;margin-left:auto}
  .body{padding:6px 15px 12px}
  .row{display:flex;gap:8px;padding:7px 0;border-bottom:1px dashed #eef2f7}
  .row:last-child{border-bottom:none}
  .rl{flex:0 0 74px;font-size:11px;font-weight:800;color:#0f766e}
  .rv{flex:1;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .rv.dim{color:#94a3b8}
  .tgt{font-size:11.5px;color:#64748b;margin-top:2px}
  .hist{margin:6px 15px 12px;background:#f8fafc;border-radius:8px;padding:8px 12px;display:none}
  .hist.open{display:block}
  .hist .h{font-size:11px;color:#475569;padding:3px 0;border-bottom:1px solid #eef2f7;font-family:ui-monospace,monospace}
  .more{font-size:11px;color:#0f766e;cursor:pointer;font-weight:700;padding:4px 15px 10px}
  .empty{text-align:center;color:#94a3b8;padding:50px 20px}
  .note{font-size:11px;color:#94a3b8;text-align:center;margin-top:10px}
  @media(max-width:560px){.rl{flex-basis:60px}.ts{width:100%;margin-left:0}}
</style>
</head>
<body>
<header>
  <h1>🌱 起源台帳（決定台帳）</h1>
  <div class="sub">会話で決めたアクションを「①理由 → ②実行内容 → ③進捗 → ④結果」で記録。互いに1つの台帳を見て 正/誤・言った言わない を判断する。</div>
</header>
<div class="wrap">
  <div class="cards" id="kpis"></div>
  <div class="bar">
    <div class="tab on" data-f="open">未完</div>
    <div class="tab" data-f="done">完了</div>
    <div class="tab" data-f="cancelled">中止</div>
    <div class="tab" data-f="all">全部</div>
    <input id="q" placeholder="🔍 理由・実行内容・誰・IDで検索">
    <button class="btn" onclick="load()">↻ 更新</button>
  </div>
  <div id="list"><div class="empty">読み込み中…</div></div>
  <div class="note" id="note"></div>
</div>
<script>
const SB="https://ckrxttbnawkclshczsia.supabase.co";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
let FILTER="open", ROWS=[], OPEN={};
const esc=s=>(s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const stLabel={decided:"①決定",in_progress:"②実行中",requested:"▶ OMNI依頼",done:"④完了",cancelled:"中止"};
let WD={}; // oid→{reason,action,target} 起源の元情報（消し込み/依頼のinsertに複写）
function fmt(ts){if(!ts)return"";const d=new Date(ts);if(isNaN(d))return ts;const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}

async function load(){
  try{
    const r=await fetch(`${SB}/rest/v1/agent_task_ledger?select=*&order=id.asc`,{headers:{apikey:ANON,Authorization:"Bearer "+ANON}});
    ROWS=await r.json();
    if(!Array.isArray(ROWS)){document.getElementById("list").innerHTML='<div class="empty">読み取りエラー</div>';return;}
    render();
    document.getElementById("note").textContent="最終更新 "+fmt(new Date().toISOString())+" ／ 全"+ROWS.length+"レコード（追記のみ・改ざん不能ハッシュ連鎖）";
  }catch(e){document.getElementById("list").innerHTML='<div class="empty">通信エラー: '+esc(e.message)+'</div>';}
}

function groups(){
  // origin_idごとに履歴をまとめ、最新状態を代表にする
  const g={};
  for(const r of ROWS){(g[r.origin_id]=g[r.origin_id]||[]).push(r);}
  const arr=Object.keys(g).map(oid=>{
    const hist=g[oid].sort((a,b)=>a.id-b.id);
    const cur=hist[hist.length-1];
    // reason/action/targetは最初の記録が起源。結果は最新。
    const first=hist[0];
    return {oid,cur,first,hist};
  });
  // 最新更新が上
  arr.sort((a,b)=>b.cur.id-a.cur.id);
  return arr;
}

function render(){
  const all=groups();
  const cnt={decided:0,in_progress:0,done:0,cancelled:0};
  all.forEach(o=>cnt[o.cur.progress]=(cnt[o.cur.progress]||0)+1);
  const openN=cnt.decided+cnt.in_progress;
  document.getElementById("kpis").innerHTML=
    `<div class="kpi o"><div class="l">未完(要対応)</div><div class="v">${openN}</div></div>`+
    `<div class="kpi d"><div class="l">完了</div><div class="v">${cnt.done||0}</div></div>`+
    `<div class="kpi c"><div class="l">中止</div><div class="v">${cnt.cancelled||0}</div></div>`+
    `<div class="kpi"><div class="l">起源 合計</div><div class="v">${all.length}</div></div>`;
  const q=document.getElementById("q").value.trim().toLowerCase();
  let list=all.filter(o=>{
    if(FILTER==="open")return o.cur.progress==="decided"||o.cur.progress==="in_progress";
    if(FILTER==="done")return o.cur.progress==="done";
    if(FILTER==="cancelled")return o.cur.progress==="cancelled";
    return true;
  });
  if(q)list=list.filter(o=>[o.oid,o.first.reason,o.first.action,o.first.target,o.cur.who,o.cur.result].join(" ").toLowerCase().includes(q));
  const el=document.getElementById("list");
  if(!list.length){el.innerHTML='<div class="empty">該当する起源がありません</div>';return;}
  el.innerHTML=list.map(o=>{
    const c=o.cur, f=o.first;
    WD[o.oid]={reason:f.reason,action:f.action,target:f.target};
    const histRows=o.hist.map(h=>`<div class="h">${fmt(h.ts)} ・ ${esc(stLabel[h.progress]||h.progress)} ${h.result?"／ "+esc(h.result):""} <span style="color:#cbd5e1">(${esc(h.agent||"")})</span></div>`).join("");
    let acts="";
    if(c.progress==="decided"||c.progress==="in_progress"){
      acts=`<div class="acts"><button class="abtn done" onclick="mark('${o.oid}','done')">✅ 消し込み（完了）</button><button class="abtn run" onclick="mark('${o.oid}','requested')">▶ 最後までやらせる</button></div>`;
    }else if(c.progress==="requested"){
      acts=`<div class="acts"><span class="waitb">▶ OMNIが実行中/待機（自動で完遂→結果を記録します）</span><button class="abtn cancel" onclick="mark('${o.oid}','cancelled')">取消</button></div>`;
    }
    return `<div class="card ${c.progress}">
      <div class="chead">
        <span class="st ${c.progress}">${esc(stLabel[c.progress]||c.progress)}</span>
        <span class="who">👤 ${esc(c.who||"")}</span>
        <span class="oid">${esc(o.oid)}</span>
        <span class="ts">${fmt(f.ts)}${o.hist.length>1?" → "+fmt(c.ts):""}</span>
      </div>
      <div class="body">
        <div class="row"><div class="rl">①理由</div><div class="rv">${esc(f.reason)||'<span class="dim">—</span>'}</div></div>
        <div class="row"><div class="rl">②実行内容</div><div class="rv">${esc(f.action)||'<span class="dim">—</span>'}<div class="tgt">📍 ${esc(f.target)||"—"}</div></div></div>
        <div class="row"><div class="rl">③進捗</div><div class="rv">${esc(stLabel[c.progress]||c.progress)} <span style="color:#94a3b8">(${esc(c.agent||"")})</span></div></div>
        <div class="row"><div class="rl">④結果</div><div class="rv ${c.result?'':'dim'}">${esc(c.result)||"（未）"}</div></div>
      </div>
      ${acts}
      ${o.hist.length>1?`<div class="more" onclick="tog('${o.oid}')">${OPEN[o.oid]?"▲ 履歴を閉じる":"▼ 履歴 "+o.hist.length+"件"}</div><div class="hist ${OPEN[o.oid]?'open':''}">${histRows}</div>`:""}
    </div>`;
  }).join("");
}
function tog(oid){OPEN[oid]=!OPEN[oid];render();}
async function mark(oid,progress){
  const meta=WD[oid]||{};
  let who,result,confirmMsg;
  if(progress==="done"){confirmMsg="この起源を「完了（消し込み）」にしますか？";who="オーナー(消し込み)";result="オーナーが完了確認（消し込み）";}
  else if(progress==="requested"){confirmMsg="この起源をOMNIに「最後まで完遂」させますか？（自動で作業→結果を記録します）";who="オーナー(依頼)";result="オーナーがOMNIに完遂を依頼";}
  else if(progress==="cancelled"){confirmMsg="この依頼を取り消しますか？";who="オーナー(取消)";result="オーナーが依頼を取消";}
  if(!confirm(confirmMsg))return;
  const r=(progress==="done")?prompt("完了メモ（任意・空でOK）",result)||result:result;
  const row={origin_id:oid,ts:new Date().toISOString(),who,agent:"viewer",
    reason:meta.reason||"",action:meta.action||"",target:meta.target||"",progress,result:r};
  try{
    const resp=await fetch(`${SB}/rest/v1/agent_task_ledger`,{method:"POST",
      headers:{apikey:ANON,Authorization:"Bearer "+ANON,"Content-Type":"application/json","Prefer":"return=minimal"},
      body:JSON.stringify(row)});
    if(!resp.ok){alert("失敗: HTTP "+resp.status);return;}
    await load();
  }catch(e){alert("通信エラー: "+e.message);}
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");FILTER=t.dataset.f;render();});
document.getElementById("q").addEventListener("input",render);
load();
setInterval(load,30000);
</script>
</body>
</html>
