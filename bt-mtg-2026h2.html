function setupMonthCollapse(months){

var ACQ_D=null,ACQ_KEY="btmtg_acq_range";

  try{localStorage.setItem(ACQ_KEY,JSON.stringify({f:a.value,t:latest?null:b.value}));}catch(e){}loadAcq();}

    function rowM(lab,fn,cls){H+='<tr class="'+(cls||'')+'"><td class="l">'+lab+'</td>'+ms.map(function(m,i){var X=AN[m];return '<td class="'+mln(i)+'" colspan="4" style="text-align:left">'+(X?fn(X,m):'<span class="z">確定</span>')+'</td>';}).join('')+'</tr>';}
    rowM('<b>達成</b>',function(X){var p=Math.min(100,Math.round(X.a/X.t*100)),col=p>=100?'#16a34a':p>=80?'#eab308':'#dc2626';return '<div style="position:relative;background:#e5e7eb;border-radius:4px;height:16px"><div style="width:'+p+'%;background:'+col+';height:100%;border-radius:4px;opacity:.85"></div><span style="position:absolute;left:6px;top:1px;font-size:11px;font-weight:800;color:#111">'+Math.round(X.a/X.t*100)+'%　'+(X.gap>0?'不足 '+man(-X.gap):'達成 '+man(-X.gap))+'</span></div>';});
    rowM('<b>主な原因</b>',function(X){if(X.gap<=0)return '<span class="pos">✅ 達成</span>';return X.mcP?'<span style="background:#fef3c7;color:#92400e;border-radius:5px;padding:1px 7px;font-weight:900">単価が安い</span> <span style="font-size:11px">設計比 −'+Math.round((1-X.uA/X.uD)*100)+'%</span>':'<span style="background:#fee2e2;color:#991b1b;border-radius:5px;padding:1px 7px;font-weight:900">稼働が足りない</span> <span style="font-size:11px">'+P(X.go)+'／設計'+P(X.dO)+'</span>';});
    rowM('<b>打ち手の効果</b>',function(X,m){if(X.gap<=0)return '–';var r=X.gap-X.ind;return '<b class="pos">'+man(X.ind)+'</b> <span style="font-size:11px">'+(r>0?'残り '+man(-r)+(m==cur?'':'（今後の予約で）'):'で到達')+'</span>';});
    dcl.forEach(function(c){if(!vm.some(function(m){return AN[m].byC[c]&&AN[m].byC[c].length;}))return;
      H+='<tr><td class="l">'+lab(c)+'</td>'+ms.map(function(m,i){var X=AN[m],L=X&&X.byC[c]||[];return '<td class="'+mln(i)+'" colspan="4" style="text-align:left;white-space:nowrap">'+(L.length?L.slice(0,2).map(chip).join(' '):'<span style="color:#cbd5e1">・</span>')+'</td>';}).join('')+'</tr>';});
    H+='</tbody></table></div><div class="sub">⬆値上げ＝売れているのに設計より安い／📣見せ方＝安いのに売れない（掲載・写真・プラン名）／💲価格確認＝売れず単価は設計以上（OTA順位）／🔍掲載確認＝予約がほぼ0／➕台数追加＝ほぼ満車'+(isBT?'／🔀販路＝同クラスでBT車とHDM車の稼働差20pt以上（弱い側の販路を確認）':'')+'。売れ足は同じ月の店全体と比べるので、先の月でも判定できる。見込み額＝店全体の売れ足まで戻した場合（今月は残り日数の分だけ）。</div>';
  })();

    return '<td class="'+mln(i)+'">'+x.n+"台</td>"+'<td class="'+mbnd(i)+'">'+pct(x.td,x.ad)+"% "+gs+x.td+"日</span></td>"+'<td class="'+mbnd(i)+'"><b>'+pct(x.rd,x.ad)+"%</b> "+gs+x.rd+"日</span></td>"+(function(){var dp=pct(x.rd,x.ad)-pct(x.td,x.ad),dd=x.rd-x.td;return '<td class="'+(dp>=0?"pos":"neg")+mbnd(i)+'">'+(dp>=0?"+":"−")+Math.abs(dp)+"% "+gs+(dd>=0?"+":"−")+Math.abs(dd)+"日</span></td>";})();}).join("")+"</tr>";});  /* 稼働率の差は％（日数は小さく添える） */
  H+='<tr class="act"><td class="l">稼働台数（配車表）</td>'+ms.map(function(m,i){return '<td class="'+mln(i)+'" colspan="4">'+o[m].nveh+"台 "+gs+"(BT"+o[m].nbt+"/HDM"+o[m].nhd+")</span></td>";}).join("")+"</tr>";
  H+="</tbody></table></div>";
  // ③ 売上
  H+=head("💰 売上　目標 / 進捗 / 差 / 達成率",["目標","進捗","差","達成率"]);
  L_S.forEach(function(r){if(typeof r=="string"){H+=r;return;}H+='<tr class="'+(r[3]||"")+'"><td class="l">'+r[0]+"</td>"+ms.map(function(m,i){var x=r[1](m),p=pct(x.ar,x.tr);

  H+='<tr><td class="l" style="font-weight:600">未配車・予約外</td>'+ms.map(function(m,i){return '<td class="'+mln(i)+'"></td><td class="'+mbnd(i)+'">'+yen(o[m].tot_r-S(m,dcl).ar)+'</td><td class="'+mbnd(i)+'"></td><td class="'+mbnd(i)+'"></td>';}).join("")+"</tr>";
  H+='<tr class="foot"><td class="l">総合計（目標 10月400万・11月〜500万）</td>'+ms.map(function(m,i){var t=revT(m),a=o[m].tot_r,p=pct(a,t);return '<td class="'+mln(i)+'">'+yen(t)+'</td><td class="'+mbnd(i)+'"><b>'+yen(a)+"</b></td>"+dif(a-t,yen,i)+'<td class="'+(p>=100?"pos":"")+mbnd(i)+'">'+p+"%</td>";}).join("")+"</tr>";
  H+="</tbody></table></div>";
  H+='<div class="sub" style="margin-top:7px">設計：目標日数＝稼働可能日数×目標率／目標売上＝目標日数×設計単価（クラス計は月の日数・台数で500万前後）。進捗：実績売上＝返却月の予約売上(キャンセル/テスト除外・KPIタブと同じ)。ブランド別：台数・稼働＝車両のブランド／売上＝予約のブランド(KPIタブと同じ・HDM予約をBT車に配車した分はHDM売上)／ブランド目標＝そのブランドの稼働可能日数×目標率×設計単価／進捗単価＝実績売上÷実績貸出日数。総合計は予約+予約外で月の目標(10月400万・11月〜500万)と比較。</div>';
