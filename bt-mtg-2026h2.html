<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BUDDICA TOURISM 高松空港店 レポート（ライブ）</title>
<style>
@page{size:A4 landscape;margin:7mm}*{box-sizing:border-box}body{font-family:"Hiragino Sans",sans-serif;color:#0f172a;margin:0;padding:12px;background:#fff}
h1{font-size:16px;margin:0 0 2px}.sub{font-size:10.5px;color:#64748b;margin-bottom:7px}.h2{font-size:13px;font-weight:800;margin:10px 0 4px}
table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #d7dee8;padding:3px 6px;font-size:11px;text-align:right;overflow:hidden}
th{background:#0f172a;color:#fff;font-weight:800;font-size:10px}th.mh{background:#0d9488}td.l,th.l{text-align:left;font-weight:800}
td.l .cn{font-weight:500;color:#94a3b8;font-size:9.5px}td.cnt{color:#475569;font-size:10px}td.rev{font-weight:700}
/* ★月の縦割り：各月の左に太線＋月バンド背景 */
.ms{border-left:2.5px solid #0f172a !important}
.mb{background:#f3f8f8}
tr:nth-child(even) td.mb{background:#eef5f4}
tr.foot td{font-weight:900;background:#ecfeff!important;border-top:2px solid #0d9488}
tr.act td{font-weight:800;background:#eef2ff!important;font-size:10px}.z{color:#cbd5e1}
.pos{color:#16a34a;font-weight:900}.neg{color:#dc2626;font-weight:900}
tr.gr td{background:#f0fdf4!important;font-weight:800}tr.gt2 td{background:#eef2ff!important;font-weight:800}tr.gp td{background:#fef9c3!important;font-weight:800}
tr.brow td{background:#dcfce7!important;font-weight:900;color:#166534}tr.brow.hd td{background:#dbeafe!important;color:#1e40af}
tr.uf td{font-weight:900;background:#ecfeff!important;border-top:2px solid #0d9488}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:6px}.rb{font-size:11px;background:#0d9488;color:#fff;border:none;border-radius:7px;padding:5px 12px;font-weight:800;cursor:pointer}.upd{font-size:10px;color:#94a3b8}
.blink{animation:blink .7s steps(1) infinite;background:#fee2e2!important;color:#b91c1c!important;border:2px solid #dc2626!important;font-weight:900}@keyframes blink{50%{background:#dc2626!important;color:#fff!important}}
@media print{.rb{display:none}}
</style></head><body>
<h1>🍜 BUDDICA TOURISM 高松空港店 レポート（2026年8月〜12月）</h1>
<div class="sub">BUDDICA / HANDYMAN高松空港店　｜　返却月ベース・キャンセル/テスト除外・売上＝基本+付帯−割引　｜　稼働台数＝月次フラグ優先(配車表と連動)</div>
<div class="bar"><button class="rb" onclick="load()">🔄 最新に更新</button><span class="upd" id="upd">読み込み中…</span></div>
<div id="body"><div style="padding:30px;color:#94a3b8">📡 最新データを読み込み中…</div></div>
<script>
var SB="https://ggqugvyskyiblxiycpci.supabase.co",ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18";
var T_CNT=150,T_REV=5000000,T_FROM="2026-11";
var MN={"2026-08":"8月","2026-09":"9月","2026-10":"10月","2026-11":"11月","2026-12":"12月"};
var CORD=["A","AA","B","C","D","E","F","G","H","I","J","K","送迎","未配車"];
function yen(n){return "¥"+Math.round(n).toLocaleString();}
function hasT(m){return m>=T_FROM;}
function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function mbnd(i){return i%2?" mb":"";}  /* 月バンド背景(その月の全列) */
function mc(i){return mbnd(i)+(i>0?" ms":"");}  /* 月バンド＋左縦線(先頭月は線なし・月の先頭列用) */
function render(D){
  var months=D.months,o=D.data,CN=D.clsnames||{};
  var tc=0,tr=0;months.forEach(function(m){tc+=o[m].tot_c;tr+=o[m].tot_r;});
  var allc={};months.forEach(function(m){Object.keys(o[m].cls||{}).forEach(function(c){allc[c]=1;});Object.keys(o[m].util||{}).forEach(function(c){allc[c]=1;});});
  var clss=CORD.filter(function(c){return allc[c];}).concat(Object.keys(allc).filter(function(c){return CORD.indexOf(c)<0;}));
  function prog(m,a,t,i){if(!hasT(m))return '<td class="'+mc(i)+'"></td>';var p=t?Math.round(a/t*100):0;return '<td class="'+(p>=100?"pos":"")+mc(i)+'">'+p+"%</td>";}
  function tgt(m,x,i){return '<td class="'+mc(i)+'">'+(hasT(m)?x:"")+"</td>";}
  function diff(m,a,t,f,i){if(!hasT(m))return '<td class="'+mc(i)+'"></td>';var dv=a-t,cl=dv>=0?"pos":"neg",sg=dv>=0?"+":"−";var tx=f=="cnt"?(Math.abs(dv)+"件"):yen(Math.abs(dv));return '<td class="'+cl+mc(i)+'">'+sg+tx+"</td>";}
  function perOf(m){return o[m].nveh?Math.round(o[m].tot_r/o[m].nveh):0;}
  function perTgt(m){return o[m].nveh?Math.round(T_REV/o[m].nveh):0;}
  function kpiSec(title,rowLabel,valFn,tgtFn,fmt){
    var H='<div class="h2">'+title+'</div><table><colgroup><col style="width:160px">'+months.map(function(){return "<col>";}).join("")+'</colgroup><thead><tr><th class="l">区分</th>'+months.map(function(m,i){return '<th class="mh'+mc(i)+'">'+MN[m]+"</th>";}).join("")+"</tr></thead><tbody>";
    H+='<tr><td class="l">'+rowLabel+'</td>'+months.map(function(m,i){return '<td class="rev'+mc(i)+'">'+(fmt=="cnt"?valFn(m)+"件":yen(valFn(m)))+"</td>";}).join("")+"</tr>";
    H+='<tr class="gr"><td class="l">目標</td>'+months.map(function(m,i){return tgt(m,fmt=="cnt"?tgtFn(m)+"件":yen(tgtFn(m)),i);}).join("")+"</tr>";
    H+='<tr class="gp"><td class="l">進捗</td>'+months.map(function(m,i){return prog(m,valFn(m),tgtFn(m),i);}).join("")+"</tr>";
    H+='<tr class="gt2"><td class="l">差分</td>'+months.map(function(m,i){return diff(m,valFn(m),tgtFn(m),fmt,i);}).join("")+"</tr></tbody></table>";
    return H;
  }
  function cell2(m,i,c,r){return c!=null?('<td class="cnt'+mc(i)+'">'+c+'件</td><td class="rev'+mbnd(i)+'">'+yen(r)+"</td>"):('<td class="cnt z'+mc(i)+'">–</td><td class="z'+mbnd(i)+'">–</td>');}
  var H="";
  H+=kpiSec("💰 売上（実績 / 目標 / 進捗 / 差分）　目標＝各月 500万円（11月以降）","売上実績",function(m){return o[m].tot_r;},function(m){return T_REV;},"rev");
  H+=kpiSec("📈 予約数（実績 / 目標 / 進捗 / 差分）　目標＝各月 "+T_CNT+"件（11月以降）","予約実績",function(m){return o[m].tot_c;},function(m){return T_CNT;},"cnt");
  H+=kpiSec("🚗 台あたり売上（実績 / 目標 / 進捗 / 差分）　目標＝売上目標500万 ÷ 稼働台数（11月以降）","台あたり実績",perOf,perTgt,"rev");
  // クラス別 × 月
  H+='<div class="h2">🚗 クラス別 × 月（予約数・売上）</div><table><colgroup><col style="width:160px">'+months.map(function(){return "<col><col>";}).join("")+'</colgroup><thead><tr><th class="l" rowspan="2">クラス（車両）</th>'+months.map(function(m,i){return '<th class="mh'+mc(i)+'" colspan="2">'+MN[m]+"</th>";}).join("")+"</tr><tr>"+months.map(function(m,i){return '<th class="'+mc(i)+'">予約数</th><th class="'+mbnd(i)+'">売上</th>';}).join("")+"</tr></thead><tbody>";
  clss.forEach(function(c){
    var nm=CN[c]||"";var lab=esc(c)+(nm?' <span class="cn">'+esc(nm)+"</span>":(c=="未配車"?' <span class="cn">車両未割当</span>':""));
    H+='<tr><td class="l">'+lab+"</td>"+months.map(function(m,i){var v=(o[m].cls||{})[c];return cell2(m,i,v?v.c:null,v?v.r:0);}).join("")+"</tr>";
  });
  H+='<tr class="foot"><td class="l">月合計</td>'+months.map(function(m,i){return '<td class="cnt'+mc(i)+'">'+o[m].tot_c+'件</td><td class="rev'+mbnd(i)+'">'+yen(o[m].tot_r)+"</td>";}).join("")+"</tr>";
  H+='<tr class="act"><td class="l">稼働台数（フラグ）</td>'+months.map(function(m,i){return '<td class="'+mc(i)+'" colspan="2">'+o[m].nveh+'台<span style="color:#94a3b8;font-weight:500"> (BT'+o[m].nbt+"/HDM"+o[m].nhd+")</span></td>";}).join("")+"</tr></tbody></table>";
  // チャネル別
  function bchans(br){var t={};months.forEach(function(m){Object.keys(o[m].chan||{}).forEach(function(k){var p=k.split("|");if(p[0]==br)t[p.slice(1).join("|")]=(t[p.slice(1).join("|")]||0)+(o[m].chan[k].r||0);});});return Object.keys(t).sort(function(a,b){return t[b]-t[a];});}
  function bmt(br,m){var c=0,r=0;Object.keys(o[m].chan||{}).forEach(function(k){var p=k.split("|");if(p[0]==br){c+=o[m].chan[k].c;r+=o[m].chan[k].r;}});return[c,r];}
  H+='<div class="h2">📊 売上チャネル別 × 月（ブランド別内訳）</div><table><colgroup><col style="width:160px">'+months.map(function(){return "<col><col>";}).join("")+'</colgroup><thead><tr><th class="l" rowspan="2">チャネル</th>'+months.map(function(m,i){return '<th class="mh'+mc(i)+'" colspan="2">'+MN[m]+"</th>";}).join("")+"</tr><tr>"+months.map(function(m,i){return '<th class="'+mc(i)+'">予約数</th><th class="'+mbnd(i)+'">売上</th>';}).join("")+"</tr></thead><tbody>";
  [["BUDDICA","🟢 BUDDICA（BT）",""],["HDM","🔵 HDM（HANDYMAN高松）","hd"]].forEach(function(bb){
    var chans=bchans(bb[0]);if(!chans.length)return;
    H+='<tr class="brow '+bb[2]+'"><td class="l">'+bb[1]+"</td>"+months.map(function(m,i){var cr=bmt(bb[0],m);return cell2(m,i,cr[0]||null,cr[1]);}).join("")+"</tr>";
    chans.forEach(function(ch){H+='<tr><td class="l" style="padding-left:16px;font-weight:500">'+esc(ch)+"</td>"+months.map(function(m,i){var v=(o[m].chan||{})[bb[0]+"|"+ch];return cell2(m,i,v?v.c:null,v?v.r:0);}).join("")+"</tr>";});
  });
  H+='<tr class="foot"><td class="l">総合計</td>'+months.map(function(m,i){return '<td class="cnt'+mc(i)+'">'+o[m].tot_c+'件</td><td class="rev'+mbnd(i)+'">'+yen(o[m].tot_r)+"</td>";}).join("")+"</tr></tbody></table>";
  // クラス別グロス稼働率
  H+='<div class="h2">📈 クラス別 グロス稼働率 × 月（貸出日数 ÷ 稼働可能日数）</div><table><colgroup><col style="width:160px">'+months.map(function(){return "<col>";}).join("")+'</colgroup><thead><tr><th class="l">クラス（車両）</th>'+months.map(function(m,i){return '<th class="mh'+mc(i)+'">'+MN[m]+"</th>";}).join("")+"</tr></thead><tbody>";
  clss.filter(function(c){return c!="未配車";}).forEach(function(c){
    var nm=CN[c]||"";var lab=esc(c)+(nm?' <span class="cn">'+esc(nm)+"</span>":"");
    H+='<tr><td class="l">'+lab+"</td>"+months.map(function(m,i){var u=(o[m].util||{})[c];if(!u||!u.ad)return '<td class="z'+mc(i)+'">–</td>';var p=Math.round(u.rd/u.ad*100);var col=p>=60?"#16a34a":p>=30?"#0d9488":"#64748b";var bk=p>=100?" blink":"";return '<td class="'+mc(i)+bk+'" title="'+(p>=100?"稼働率100%超＝配車表フラグと予約の不整合(要確認)":"")+'"><b style="color:'+(p>=100?"#b91c1c":col)+'">'+p+'%</b> <span style="color:#94a3b8;font-size:9px">'+u.rd+"/"+u.ad+"</span></td>";}).join("")+"</tr>";
  });
  H+='<tr class="uf"><td class="l">グロス（全クラス）</td>'+months.map(function(m,i){var rd=0,ad=0;Object.keys(o[m].util||{}).forEach(function(c){rd+=o[m].util[c].rd;ad+=o[m].util[c].ad;});var p=ad?Math.round(rd/ad*100):0;var bk=p>=100?" blink":"";return '<td class="'+mc(i)+bk+'">'+p+'% <span style="color:#94a3b8;font-weight:500;font-size:9px">'+rd+"/"+ad+"</span></td>";}).join("")+"</tr></tbody></table>";
  H+='<div class="sub" style="margin-top:7px">全期間 合計：予約 <b>'+tc+"件</b>／売上 <b>"+yen(tr)+"</b>　※目標は11月以降。稼働率＝貸出日数÷(稼働台数×日数−メンテ日)。稼働台数・稼働率は配車表フラグと連動。</div>";
  document.getElementById("body").innerHTML=H;
  document.getElementById("upd").textContent="最終更新 "+(D.generated||"")+"（DBライブ）";
}
function load(){
  document.getElementById("upd").textContent="更新中…";
  fetch(SB+"/rest/v1/rpc/bt_mtg_h2",{method:"POST",headers:{apikey:ANON,Authorization:"Bearer "+ANON,"Content-Type":"application/json"},body:"{}"})
    .then(function(r){return r.json();}).then(function(d){if(!d||!d.data)throw 0;render(d);})
    .catch(function(){document.getElementById("body").innerHTML='<div style="padding:24px;color:#dc2626">読み込みに失敗しました。<button class="rb" onclick="load()">再読み込み</button></div>';});
}
load();
</script></body></html>
