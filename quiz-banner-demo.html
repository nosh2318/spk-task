<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>カルテ + クイズバナー デモ</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#eef2f8;color:#0f1f45;display:flex;justify-content:center;min-height:100vh;}
  .app{width:100%;max-width:460px;padding:14px;}
  .demoTag{background:#111827;color:#fff;font-size:11px;text-align:center;padding:6px;border-radius:8px;margin-bottom:12px;letter-spacing:.04em;}

  /* ===== カルテ ヘッダー(モック) ===== */
  .khead{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:18px;padding:18px 18px 20px;box-shadow:0 6px 18px rgba(30,60,120,.18);}
  .khead .ttl{font-size:13px;opacity:.85;}
  .khead .name{font-size:22px;font-weight:800;margin-top:2px;}
  .khead .sub{font-size:12.5px;opacity:.9;margin-top:6px;line-height:1.6;}

  /* ===== ★クイズ バナー★ ===== */
  .quizBanner{
    margin:14px 0;border:none;width:100%;text-align:left;cursor:pointer;
    border-radius:18px;padding:16px 18px;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(120deg,#0ea5e9,#2563eb 60%,#1e40af);
    box-shadow:0 8px 22px rgba(37,99,235,.30);
    display:flex;align-items:center;gap:14px;transition:transform .12s;
  }
  .quizBanner:active{transform:scale(.98);}
  .quizBanner .ico{font-size:40px;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.2));}
  .quizBanner .tx{flex:1;}
  .quizBanner .tx b{font-size:17px;font-weight:800;display:block;}
  .quizBanner .tx span{font-size:12.5px;opacity:.92;}
  .quizBanner .go{background:rgba(255,255,255,.22);border-radius:12px;padding:9px 12px;font-weight:800;font-size:13px;white-space:nowrap;}
  .quizBanner .spark{position:absolute;top:-10px;right:60px;font-size:20px;opacity:.7;animation:fl 2.4s ease-in-out infinite;}
  @keyframes fl{0%,100%{transform:translateY(0);}50%{transform:translateY(6px);}}
  .badgeNew{position:absolute;top:10px;right:12px;background:#f5b301;color:#4a2e00;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;}

  /* ===== カルテ本文(モック) ===== */
  .kcard{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 3px 12px rgba(30,60,120,.06);}
  .kcard h3{font-size:13px;color:#64748b;margin-bottom:10px;font-weight:700;}
  .krow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:14px;}
  .krow:last-child{border-bottom:none;}
  .krow .k{color:#64748b;} .krow .v{font-weight:700;}

  /* ===== クイズ モーダル(iframe) ===== */
  .scrim{position:fixed;inset:0;background:rgba(15,31,69,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding-top:0;}
  .scrim.on{display:flex;}
  .qmodal{width:100%;max-width:460px;height:100vh;background:#f6faff;position:relative;}
  .qmodal iframe{width:100%;height:100%;border:none;}
  .qclose{position:absolute;top:10px;right:12px;z-index:60;background:#0f1f45;color:#fff;border:none;border-radius:99px;width:38px;height:38px;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25);}
</style>
</head>
<body>
<div class="app">
  <div class="demoTag">🔎 デモ表示 ／ 実際のカルテ（お客様マイページ）にこう載るイメージ</div>

  <!-- カルテヘッダー(モック) -->
  <div class="khead">
    <div class="ttl">HANDYMAN 那覇 ・ ご予約カルテ</div>
    <div class="name">大下 様 専用ページ</div>
    <div class="sub">予約番号 SAMPLE-0000 ／ 2026-08-05 〜 08-07<br>Sクラス（ハリアー）・お届け</div>
  </div>

  <!-- ★ クイズ バナー ★ -->
  <button class="quizBanner" onclick="openQuiz()">
    <span class="badgeNew">NEW</span>
    <span class="spark">✨</span>
    <span class="ico">🌺</span>
    <span class="tx"><b>沖縄クイズに挑戦！</b><span>全15問・約1分／旅がもっと楽しくなる</span></span>
    <span class="go">遊ぶ ▶</span>
  </button>

  <!-- カルテ本文(モック) -->
  <div class="kcard">
    <h3>お届け</h3>
    <div class="krow"><span class="k">日時</span><span class="v">8/5 10:00</span></div>
    <div class="krow"><span class="k">場所</span><span class="v">那覇空港</span></div>
  </div>
  <div class="kcard">
    <h3>ご返却</h3>
    <div class="krow"><span class="k">日時</span><span class="v">8/7 12:00</span></div>
    <div class="krow"><span class="k">場所</span><span class="v">那覇空港</span></div>
  </div>
</div>

<!-- クイズ モーダル -->
<div class="scrim" id="scrim">
  <div class="qmodal">
    <button class="qclose" onclick="closeQuiz()">✕</button>
    <iframe id="qframe" src="about:blank" title="沖縄クイズ"></iframe>
  </div>
</div>

<script>
  function openQuiz(){
    var f=document.getElementById('qframe');
    if(f.src.indexOf('quiz.html')<0) f.src='quiz.html';
    document.getElementById('scrim').classList.add('on');
    document.body.style.overflow='hidden';
  }
  function closeQuiz(){
    document.getElementById('scrim').classList.remove('on');
    document.body.style.overflow='';
  }
</script>
</body>
</html>
