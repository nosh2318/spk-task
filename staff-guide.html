<main>
  <div class="hero">
    <div class="brand">HANDYMAN スタッフ用</div>
    <h1>個別URL ステップ説明書</h1>
    <p class="lead">個別URLで押すボタンと、そのときお客様のマイページがどう変わるかを、時間の順にステップごとに並べました。黄色い枠が押す所、緑の枠はお客様の画面が変わるステップです。左がスタッフのスマホ、右がお客様のスマホです。店舗を選んでください。名前・時間・文は見本です（実際の文とは少し違うことがあります）。</p>
  </div>
  <nav class="tabs" aria-label="店舗">
    <a href="#spk" data-st="spk">札幌</a>

</main>

<script>
(function(){
"use strict";
var RM=false;try{RM=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}

/* ---------- 画面の部品 ---------- */
function bar(t,r){return '<div class="bar"><span>'+t+'</span><span>'+(r||"")+'</span></div>';}
function sBar(name){return bar(name+' さん','本日 3件');}
function mBar(st){return bar('マイページ',st);}
function task(type,time,who,body){return '<div class="k"><div class="tt">'+time+' '+type+'　'+who+'様</div>'+(body||"")+'</div>';}
function btn(cls,txt,tap){return '<span class="bt '+cls+'"'+(tap?' data-tap':'')+'>'+txt+'</span>';}
function line(txt){return '<div class="notif"><b>LINE</b>　'+txt+'</div>';}
function ok(t){return '<div class="k g">'+t+'</div>';}
function idle(t){return '<div class="idle">'+t+'</div>';}

/* ---------- 場面（step: s＝スタッフ画面, c＝お客様画面, cap＝説明） ---------- */
var STO={spk:{jp:"札幌",staff:"三國",tag:"札幌デリバリー"},nha:{jp:"那覇",staff:"仲間",tag:"那覇"},tkm:{jp:"高松",staff:"多田",tag:"高松"}};

function setupScene(st){
  var n=STO[st].staff;
  return {title:"最初に1回：ホーム画面に保存して通知をON",solo:false,steps:[
    {cap:"本部から届いた自分の個別URLを開きます（Safari）。iPhoneはこのままでは通知が届かないので、上に「通知：OFF」と出ます。",
     s:sBar(n)+'<div class="k y"><div class="tt">通知：OFF</div><span class="mut">iPhoneはホーム画面に追加してから</span><div class="btns">'+btn("nv","やり方",1)+'</div></div>'+task("DEL","10:00","山田"),c:null},
    {cap:"画面の下の共有ボタン（□↑）を押します。",
     s:sBar(n)+'<div class="k y"><div class="tt">通知：OFF</div></div>'+task("DEL","10:00","山田")+'<div style="margin-top:auto;text-align:center"><span class="bt" data-tap style="display:inline-block;width:60px">□↑</span></div>'},
    {cap:"「ホーム画面に追加」を押して、右上の「追加」。",
     s:'<div class="sheet"><div>コピー</div><div>リーディングリストに追加</div><div data-tap class="hl">＋ ホーム画面に追加</div><div>ブックマークを追加</div></div>'},
    {cap:"ホーム画面に「個別URL」のアイコンができます。次からは必ずこのアイコンから開きます。",
     s:'<div class="home"><div class="app"><i></i>カメラ</div><div class="app"><i></i>写真</div><div class="app me" data-tap><i>HDM</i>個別URL</div><div class="app"><i></i>LINE</div></div>'},
    {cap:"アイコンから開くと、黄色い枠の「ONにする」が押せます。",
     s:sBar(n)+'<div class="k y"><div class="tt">通知：OFF</div><span class="mut">変更の依頼などがスマホに届きます</span><div class="btns">'+btn("nx","ONにする",1)+'</div></div>'+task("DEL","10:00","山田")},
    {cap:"「許可」を押します。",
     s:sBar(n)+task("DEL","10:00","山田")+'<div class="dim"><div class="dlg"><b>“個別URL”は通知を送信します。よろしいですか？</b><div class="btns">'+btn("","許可しない")+btn("nv","許可",1)+'</div></div></div>'},
    {cap:"これで完了。通知は出勤打刻で届き始め、退勤打刻で止まります。打刻しないと届きません（打刻必須）。 Androidは保存しなくても「ONにする」→「許可」だけでできます。",
     s:sBar(n)+ok("✅ 通知ON：勤務中なので届きます")+'<div class="k"><span class="mut">🌙 勤務外のときは「通知ON：勤務外なので止まっています」と出ます</span></div>'+task("DEL","10:00","山田")}
  ]};
}

function approveScene(st){
  var n=STO[st].staff;
  var card=function(t){return '<div class="k y"><span class="tag">お客様から変更の依頼</span><div class="tt">11/12 回収　山田様</div><div>回収の時間　<s class="mut">15:00</s> → <b>17:00</b></div>'+(t||"")+'</div>';};
  var bts=function(tap){return '<div class="btns" style="flex-direction:column">'+btn("gr","受けられる（承認）",tap)+btn("rd","できない → 代わりの案…")+'</div><span class="mut">迷ったら「社員に相談」</span>';};
  return {title:"変更の依頼を「受けられる（承認）」",steps:[
    {cap:"お客様がマイページで、回収の時間を15:00から17:00に変えたいと送りました。",
     s:sBar(n)+task("COL","15:00","山田"),
     c:mBar("返却日")+'<div class="k"><div class="tt">回収の時間</div><div>15:00 → <b>17:00</b> に変えたい</div>'+btn("nv","送る",1)+'</div>'},
    {cap:"担当のスマホに通知が届き、アイコンに数字が付きます。お客様の画面は「確認中」のまま残ります。",
     s:'<div class="notif"><b>個別URL</b>　【'+STO[st].jp+'】お客様から変更の依頼<br>11/12 回収 山田様 15:00→17:00</div><div class="home"><div class="app"><i></i>カメラ</div><div class="app me" data-tap><i>HDM<b>1</b></i>個別URL</div><div class="app"><i></i>LINE</div><div class="app"><i></i>写真</div></div>',
     c:mBar("返却日")+'<div class="k b"><div class="tt">🕓 確認中：回収の時間 17:00</div><span class="mut">受け付けました。スタッフが確認しています</span></div>'},
    {cap:"個別URLのいちばん上に黄色いカードが出ます。受けられるなら「受けられる（承認）」。",
     s:sBar(n)+card(bts(1))+task("COL","15:00","山田"),c:"keep"},
    {cap:"確認が出るので「OK」。",
     s:sBar(n)+card(bts())+'<div class="dim"><div class="dlg"><b>この変更を承認しますか？</b>回収の時間：15:00 → 17:00<br><span class="mut">お客様に通知されます</span><div class="btns">'+btn("","キャンセル")+btn("nv","OK",1)+'</div></div></div>',c:"keep"},
    {cap:"これだけで、お客様への通知・マイページ・OPシート・タスクまで全部17:00に変わります。LINEで報告はいりません。",
     s:sBar(n)+ok("✅ 承認しました<br><span class='mut'>山田様に通知済み。OPシート・タスクも 17:00 に変わりました。</span>")+task("COL","17:00","山田"),
     c:mBar("返却日")+'<div class="k g">✅ 回収の時間を 17:00 に変更しました</div>'+line("回収の時間の変更を承りました（17:00前後）")}
  ]};
}

function altScene(st){
  var n=STO[st].staff;
  var head='<div class="k y"><span class="tag">お客様から変更の依頼</span><div class="tt">11/12 回収　山田様</div><div>回収の時間 15:00 → <b>17:00</b></div>';
  return {title:"できない時は「代わりの案」を4ステップで",steps:[
    {cap:"17:00は無理な時は「できない → 代わりの案…」。",
     s:sBar(n)+head+'<div class="btns" style="flex-direction:column">'+btn("gr","受けられる（承認）")+btn("rd","できない → 代わりの案…",1)+'</div></div>',c:mBar("返却日")+'<div class="k b"><div class="tt">🕓 確認中：回収の時間 17:00</div></div>'},
    {cap:"① 理由をタップで選びます（予約状況・スタッフ状況・エリア外・締切後）。",

  if(st!=="tkm")add("","お届け・回収の移動手段と送迎者を選ぶ","お届けのあと戻る手段、回収に行く手段を選びます。管理画面・タスクサマリー・個別URLのどこで選んでも同じ値になります（2026-11-13から、那覇も札幌と同じ）。",moveScene(st));
  if(st!=="tkm"){
  add("④ 担当の役割：変更の依頼","変更の依頼に返事する","自分が担当（または担当なし）のお届け・回収の、時間・場所の変更です。"+(st==="nha"?"送迎・来店の変更は本部が返します。":"")+"「確認しました」はなく、返事をするまでカードは消えません。だれかが返すと全員の画面から消えます。",approveScene(st));

  add(st==="tkm"?"⑤ 本部からのお知らせ":"⑦ 本部からのお知らせ","タスクの変更を確認する","",hqScene(st));
  add(st==="tkm"?"⑥ 押し忘れた時":"⑧ 押し忘れた時","「大丈夫ですか？」に答える","OKだけでよく、困っている時だけ書いて本部に送ります。",pressScene(st));
  add("管理画面を使う人へ","古い画面からは上書きできません","開いたままの古い画面が、ほかの人の決めた値を古い値で戻してしまう事故を防ぐ仕組みです（2026-11-12から、3店）。",staleScene(st));
  var last="";
  H.forEach(function(h,i){
    if(h.stage&&h.stage!==last){out+='<div class="stage">'+h.stage+'</div>';last=h.stage;}
    out+='<section class="card">'+(h.title?'<h2>'+h.title+'</h2>':'')+(h.intro?(/^</.test(h.intro)?h.intro:'<p>'+h.intro+'</p>'):'')
      +'<div class="scene" data-sc="'+i+'"><h3>'+h.sc.title+'</h3><div class="steps"></div></div>'+h.after+'</section>';

/* ---------- 動かす ---------- */
function drawScene(el,sc){
  var lastC='<div class="idle">お客様の画面はそのまま</div>',h="";
  sc.steps.forEach(function(st,i){
    var cust;
    if(st.c===null){cust='<div class="idle">この時、お客様の画面は変わりません</div>';lastC=cust;}
    else if(st.c==="keep"||st.c===undefined){cust=lastC;}
    else{cust=st.c;lastC=st.c;}
    var changed=(st.c!=="keep"&&st.c!==undefined&&st.c!==null)||i===0;
    h+='<div class="step"><div class="cap"><b>'+(i+1)+'</b><span>'+st.cap+'</span></div>'
      +'<div class="duo"><div class="pwrap"><div class="plabel">スタッフ（個別URL）</div><div class="phone"><div class="scr">'+st.s+'</div></div></div>'
      +'<div class="pwrap"><div class="plabel">お客様（マイページ）'+(changed&&i>0?' <span class="tag">変わる</span>':'')+'</div><div class="phone'+(changed&&i>0?' chg':'')+'"><div class="scr">'+cust+'</div></div></div></div></div>';
  });
  el.querySelector(".steps").innerHTML=h;
}
function render(st){
  var P=page(st),b=document.getElementById("body");
  if(typeof P==="string"){b.innerHTML='<div style="display:flex;flex-direction:column;gap:16px">'+P+rules(st)+'</div>';}
  else{b.innerHTML='<div style="display:flex;flex-direction:column;gap:16px">'+P.html+'</div>';
    Array.prototype.forEach.call(b.querySelectorAll(".scene"),function(el){drawScene(el,P.scenes[+el.getAttribute("data-sc")]);});}
  Array.prototype.forEach.call(document.querySelectorAll(".tabs a"),function(a){if(a.getAttribute("data-st")===st)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
}
/* 個別URLから開いた時（?only=1）は、その店だけを出し、店舗タブを隠す */
try{if(/[?&]only=1/.test(location.search)){var tb=document.querySelector(".tabs");if(tb)tb.hidden=true;}}catch(e){}
function route(){var h=(location.hash||"").replace("#","");render(/^(spk|nha|tkm)$/.test(h)?h:"spk");}
window.addEventListener("hashchange",route);
route();
})();
