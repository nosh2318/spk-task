<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>集客ツール</title>

<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
h1{font-size:20px;margin:4px 0 0}

.hl{font-weight:600;font-size:14px;margin:6px 0}

.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;border:1px solid currentColor}
.btn{font:inherit;font-size:13px;padding:4px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.ok{border-color:var(--ok);color:var(--ok)}.btn.ng{border-color:var(--ng);color:var(--ng)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sel.ok{background:var(--ok);color:#fff}.btn.sel.ng{background:var(--ng);color:#fff}

.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip[disabled]{color:var(--off);border-style:dashed;cursor:default;background:transparent}
.cat{font-size:12px;color:var(--sub);align-self:center;margin-left:4px}
.rank{list-style:none;margin:6px 0 0;padding:0}
.rank li{padding:6px 0;border-top:1px solid var(--line)}
.rank .top{display:flex;gap:6px;align-items:baseline}
.rank .n{color:var(--sub);font-size:12px;width:16px;flex:none}
.rank .name{font-weight:600;font-size:14px}

.rank .bar i{display:block;height:100%;background:var(--hot);border-radius:3px}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;background:var(--chip);color:var(--sub)}
.tag.new{background:var(--acc);color:#fff}.tag.up{background:var(--warn);color:#fff}.tag.ng{background:var(--ng);color:#fff}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 90px 44px;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.tr .tb{position:relative;height:10px;background:var(--chip);border-radius:5px}
.tr .tb i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}

.cov{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}

.meter{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;margin:6px 0 2px}.meter i{display:block;height:100%;background:var(--ok)}
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:10px}
.mcard{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--ok);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.mcard.need{border-top-color:var(--warn)}.mcard.sel{outline:2px solid var(--acc)}.mcard.off{border-top-color:var(--off);cursor:default;opacity:.75}
.mc-top{display:flex;justify-content:space-between;align-items:center}.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:#f6e3d3;color:#8a4b14}.badge.off{background:var(--chip);color:var(--sub)}
.mc-name{font-size:19px;font-weight:700}.mc-big{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 6px}.mc-big span{font-size:13px;font-weight:600}.mc-big b{font-size:32px;line-height:1}.mc-big small{font-size:15px;color:var(--sub)}
.mc-cells{display:grid;gap:4px;background:var(--chip);border-radius:8px;padding:6px 8px}.mc-cells div{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}.mc-cells span{font-size:11px;color:var(--sub)}.mc-cells b{font-size:13px;overflow-wrap:anywhere}
.mc-foot{font-size:12px;color:var(--acc);margin-top:auto;padding-top:8px}
.detail{margin-top:12px;border:2px solid var(--acc)}
.obox{border:2px solid var(--hot);border-radius:12px;padding:8px 12px;min-width:200px}
.st{border-top:1px solid var(--line)}.alert-line{font-size:13px;color:var(--warn);background:var(--chip);border-radius:8px;padding:6px 8px;margin-bottom:8px}.acts{margin:0;padding-left:20px;font-size:14px}.acts li{padding:4px 0}
.st-row{display:grid;grid-template-columns:minmax(140px,1.2fr) minmax(140px,1fr) minmax(140px,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:start}
.st-head{font-size:12px;color:var(--sub);font-weight:600;padding:6px 0}.st-row details summary{cursor:pointer;font-size:12px;color:var(--acc)}
.st-words{font-size:12px;margin-top:4px;max-height:220px;overflow:auto}.st-words div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line)}
.st-act.todo{color:var(--acc);font-weight:600}
@media (max-width:640px){.st-row{grid-template-columns:1fr 1fr}.st-head{display:none}}.dsec{margin-top:14px;padding-top:4px;border-top:1px solid var(--line)}
.ltabs{display:flex;flex-wrap:wrap;gap:6px}.ltabs button{font:inherit;font-size:13px;padding:4px 10px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:flex;gap:6px;align-items:baseline}.ltabs button span{font-size:11px;color:var(--sub)}.ltabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}.ltabs button.on span{color:#fff}

.colsA{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}

.mgrid{display:grid;gap:10px;min-width:min-content}

.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:8px}

.ged{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:12px}.ged input{font:inherit;width:96px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.asks{list-style:none;margin:6px 0 0;padding:0}.asks li{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;border-top:1px solid var(--line);padding:8px 0;font-size:14px}.asks li>div{min-width:0}

.ow{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-top:14px}.ow>div{display:flex;flex-direction:column;gap:14px;min-width:0}@media (min-width:900px){.ow{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}

    const res=await fetch(SC_URL,{method:'POST',body:JSON.stringify({token:t}),signal:ac.signal}); // ヘッダを付けない（付けると事前確認で失敗する）
    const j=await res.json();
    if(j&&Array.isArray(j.rows)&&j.period){const d=new Date();SCLIVE={rows:j.rows,period:j.period,stamp:(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};scAt=Date.now()}
    else{SCLIVE={err:(j&&j.error)||'unknown'};scAt=Date.now()-480e3} // 失敗は2分後に再試行
  }catch(e){SCLIVE={err:'fetch'};scAt=Date.now()-480e3}
  finally{clearTimeout(tm);scBusy=false}
  applySc();render();
}
async function loadAll(force){
  if(loading)return;if(!force&&Date.now()-lastLoad<60000)return;loading=true;
  try{
    const s=await sessLoad();
    if(!s){$("#runline").innerHTML='🔒 未ログインです。<a href="index.html" target="_blank" rel="noopener">管理APP</a>でログインしてから、この画面を開き直してください。';return}
    const cols=Object.keys(SET);let res;
    try{res=await Promise.all(cols.map(c=>rpc('mkt_read',{p_collections:[c]})))}
    catch(e){$("#runline").innerHTML='データを読めませんでした（'+esc(e.message)+'）。<a href="index.html" target="_blank" rel="noopener">管理APP</a>でログインし直してから開き直してください。';return}
    cols.forEach((c,i)=>SET[c]((res[i]||[]).map(r=>{VER[c+'/'+r.doc_id]=r.version;return Object.assign({id:r.doc_id},r.data)})));
    db=MKT_DB;uid=(s.user&&s.user.id)||'';
    await deriveHP();await deriveLive();applySc();
    lastLoad=Date.now();render();loadSc();
  }finally{loading=false}
}
loadAll(true);
setInterval(()=>{if(document.visibilityState==='visible')loadAll()},120000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadAll()});
