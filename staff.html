<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>スタッフ専用ページ</title>
<style>
:root{--blue:#2563eb;--red:#dc2626;--teal:#0d9488;--green:#059669;--amber:#d97706;--slate:#64748b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;background:#f1f5f9;color:#0f172a;font-size:15px;max-width:560px;margin:0 auto;padding-bottom:40px}
.hero{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hero .brand{font-size:12px;opacity:.8;letter-spacing:1px}
.hero .name{font-size:22px;font-weight:800;margin-top:2px}
.hero .sub{font-size:12px;opacity:.85;margin-top:3px}
.wrap{padding:12px}
.parkbtn{display:block;width:100%;text-align:center;background:#fff;border:2px solid var(--teal);color:var(--teal);font-weight:800;font-size:15px;padding:12px;border-radius:12px;margin:4px 0 14px;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sechd{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;font-weight:800;font-size:15px}
.sechd .cnt{margin-left:auto;font-size:12px;color:var(--slate);font-weight:700}
.card{background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:9px;box-shadow:0 1px 3px rgba(0,0,0,.07);border-left:5px solid var(--slate)}
.card.DEL,.card.PU,.card.PUB{border-left-color:var(--blue)}
.card.COL,.card.BD,.card.BDB,.card.返却{border-left-color:var(--red)}
.card.洗車{border-left-color:var(--teal)}
.card.done{opacity:.5}
.r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-weight:800;color:#fff;border-radius:6px;padding:3px 9px;font-size:14px;background:var(--slate)}
.badge.DEL,.badge.PU,.badge.PUB{background:var(--blue)}
.badge.COL,.badge.BD,.badge.BDB,.badge.返却{background:var(--red)}
.badge.洗車{background:var(--teal)}
.tm{font-size:19px;font-weight:800}
.cust{font-size:15px;font-weight:700}
.r2{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px}
.veh{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;font-weight:800;border-radius:7px;padding:3px 9px;font-size:14px}
.veh.nov{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.place{color:#334155;font-size:13px}
.cls{color:var(--slate);font-size:12px}
.r3{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.abtn{font-size:13px;font-weight:800;padding:8px 12px;border-radius:8px;border:none;cursor:pointer;color:#fff}
.abtn.dep{background:#16a34a}.abtn.col{background:#ea580c}.abtn.arr{background:#dcfce7;color:#15803d;border:1px solid #86efac}
.abtn.drp{background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5}
.abtn.car{background:#fffbeb;color:#92400e;border:1px solid #fcd34d}
.abtn.lic{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.abtn.dly{background:#fffbeb;color:#b45309;border:1px solid #fcd34d}
.abtn.done{background:#0f172a;color:#fff;margin-left:auto}
a.place{color:#1d4ed8;text-decoration:underline;font-size:13px}
a.myp{background:#065f46;color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:3px 8px;text-decoration:none;white-space:nowrap;margin-left:auto}
.tabs{display:flex;gap:4px;padding:8px 8px 0;background:#0f172a;position:sticky;top:0;z-index:6;overflow-x:auto}
.tab{flex:0 0 auto;background:none;border:none;color:#94a3b8;font-weight:700;font-size:12px;padding:9px 10px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px}
.tab.on{background:#f1f5f9;color:#0f172a}
.tab .tb{font-size:10px;font-weight:800;background:#475569;color:#fff;border-radius:8px;padding:1px 6px}
.tab.on .tb{background:#cbd5e1;color:#0f172a}
.tab .tb.alert{background:#f59e0b;color:#fff}
.reqhd{display:flex;align-items:center;gap:8px;margin:6px 2px 8px;font-weight:800;font-size:15px;color:#b45309}
.reqhd .cnt{margin-left:auto;font-size:12px;font-weight:700}
.card.req{border-left-color:#f59e0b;background:#fffdf7}
.abtn.appr{background:#f59e0b;color:#fff;width:100%;padding:11px;font-size:14px}
.abtn.skip{background:#f8fafc;color:#64748b;border:1px solid #cbd5e1;width:100%;padding:9px;font-size:12px;margin-top:6px}
.card.skipped{opacity:.72;background:#f8fafc}
.lockbadge{display:inline-block;font-size:10px;font-weight:800;color:#64748b;background:#e2e8f0;border-radius:6px;padding:2px 8px}
.dayhd{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:#1e293b;background:#e2e8f0;border-radius:8px;padding:7px 11px;margin:14px 0 8px}
.dayhd .ttag{font-size:10px;font-weight:800;color:#fff;background:#059669;border-radius:6px;padding:2px 8px}
.empty{text-align:center;color:var(--slate);padding:20px;font-size:14px}
.loading{text-align:center;padding:50px 20px;color:var(--slate)}
.spin{width:34px;height:34px;border:4px solid #e2e8f0;border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:16px;margin:16px;text-align:center}
.err button{margin-top:10px;background:var(--red);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-weight:700;font-size:14px}
.ver{text-align:center;color:#94a3b8;font-size:10px;margin-top:16px}
.note{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;font-size:12px;border-radius:10px;padding:9px 11px;margin-bottom:12px}
</style></head>
<body>
<div id="app"><div class="loading"><div class="spin"></div>読み込み中…</div></div>
<script>
var SB="https://ckrxttbnawkclshczsia.supabase.co";
var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
var VER="staff-v2.9";
var TOKEN=new URLSearchParams(location.search).get("t")||"";
var app=document.getElementById("app");

function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function shortDate(d){var p=(d||"").split("-");return p.length===3?(+p[1])+"/"+(+p[2]):d;}
function jstToday(){var n=new Date(Date.now()+9*3600*1000);return n.toISOString().slice(0,10);}
function jpWd(d){var p=(d||"").split("-");if(p.length!==3)return"";return "日月火水木金土"[new Date(+p[0],+p[1]-1,+p[2]).getDay()];}
function addDays(d,n){var p=(d||"").split("-");if(p.length!==3)return d;var dt=new Date(+p[0],+p[1]-1,+p[2]+n);return dt.getFullYear()+"-"+("0"+(dt.getMonth()+1)).slice(-2)+"-"+("0"+dt.getDate()).slice(-2);}
function dayHead(d,today){var tag=(d===today)?'<span class="ttag">本日</span>':(d===addDays(today,1))?'<span class="ttag" style="background:#0284c7">明日</span>':'';return '<div class="dayhd">📅 '+shortDate(d)+'（'+jpWd(d)+'）'+tag+'</div>';}
function groupByDate(list,cardFn,today){var by={},order=[];list.forEach(function(x){var d=x.date||"";if(!by[d]){by[d]=[];order.push(d);}by[d].push(x);});order.sort();return order.map(function(d){return dayHead(d,today)+by[d].map(cardFn).join("");}).join("");}

function typeLabel(t){var m={DEL:"お届け",PU:"送迎お迎え",PUB:"バスお迎え",COL:"回収",BD:"お見送り",BDB:"バスお見送り","返却":"返却","洗車":"洗車"};return m[t]||t;}
function mypLink(x){return x.mypage?('<a class="myp" href="my.html?t='+encodeURIComponent(x.mypage)+'&ro=1" target="_blank" rel="noopener">🪪 カルテ（閲覧）</a>'):'';}

function taskCard(x){
  var t=x.type||"";
  var plate=x.plate?(" "+x.plate):"";
  var veh=x.vehicle?('<span class="veh">🚗 '+esc(x.vehicle)+esc(plate)+'</span>'):'<span class="veh nov">未配車</span>';
  var tm=x.time||(t==="COL"||t==="BD"||t==="BDB"||t==="返却"?(x.return_time||""):"");
  var pl=x.place?('<a class="place" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.place)+'" target="_blank" rel="noopener">📍 '+esc(x.place)+'</a>'):'';
  var cust=x.customer?('<span class="cust">'+esc(x.customer)+'</span>'):'';
  var rid=esc(x.resv||"");
  var tid=esc(x._id||"");
  var isDel=(t==="DEL"||t==="PU"||t==="PUB"||t==="来店"||t==="PUB来店");
  var isCol=(t==="COL"||t==="BD"||t==="BDB"||t==="返却");
  var btns='<div class="r3">';
  var etm=esc(tm||"");
  if(rid&&isDel){
    btns+='<button class="abtn dep" onclick="saAction(\''+rid+'\',\'depart\')">🚚出発</button>';
    btns+='<button class="abtn arr" onclick="saAction(\''+rid+'\',\'arrival\')">📱到着</button>';
    btns+='<button class="abtn dly" onclick="saDelay(\''+rid+'\',\'delay_del\',\''+etm+'\')">⏳遅延</button>';
  }else if(rid&&isCol){
    btns+='<button class="abtn col" onclick="saAction(\''+rid+'\',\'collect\')">🧭回収に向かう</button>';
    btns+='<button class="abtn arr" onclick="saAction(\''+rid+'\',\'col_arrival\')">📱到着</button>';
    btns+='<button class="abtn dly" onclick="saDelay(\''+rid+'\',\'delay_col\',\''+etm+'\')">⏳遅延</button>';
    btns+='<button class="abtn drp" onclick="saAction(\''+rid+'\',\'dropoff\')">🚗乗捨</button>';
  }
  if(rid&&(isDel||isCol)){
    btns+='<button class="abtn car" onclick="openCarmon()">📍位置</button>';
    btns+='<button class="abtn lic" onclick="openLicense(\''+rid+'\',\''+esc(x.customer||"")+'\')">🪪免許証</button>';
  }
  if(tid&&!x.done){ btns+='<button class="abtn done" onclick="saDone(\''+tid+'\')">✅完了</button>'; }
  btns+='</div>';
  return '<div class="card '+esc(t)+(x.done?' done':'')+'">'
    +'<div class="r1"><span class="badge '+esc(t)+'">'+esc(typeLabel(t))+'</span>'
    +(tm?'<span class="tm">'+esc(tm)+'</span>':'')+cust+(x.done?' <span style="color:#059669;font-weight:800;font-size:13px">✓済</span>':'')+mypLink(x)+'</div>'
    +'<div class="r2">'+veh+pl+'</div>'+btns+'</div>';
}
function ymShift(ym,delta){var p=(ym||jstToday().slice(0,7)).split("-");var y=+p[0],m=+p[1]-1+delta;var d=new Date(Date.UTC(y,m,1));return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0");}
window.openHistory=function(ym){
  ym=ym||jstToday().slice(0,7);
  app.innerHTML='<div class="loading"><div class="spin"></div>対応履歴を読み込み中…</div>';
  fetch(SB+"/rest/v1/rpc/spk_staff_history",{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},body:JSON.stringify({p_token:TOKEN,p_ym:ym})})
    .then(function(r){return r.json();})
    .then(function(d){ if(!d||d.ok===false){showErr("履歴の読み込みに失敗しました");return;} renderHistory(d); })
    .catch(function(){showErr("通信エラー");});
};
function renderHistory(d){
  var ym=d.ym||jstToday().slice(0,7);var tk=(d.tasks||[]);
  var name=String(d.staff||"").replace(/\s*さん\s*$/,"");
  var h='<div class="hero" style="background:linear-gradient(135deg,#7c2d12,#b45309)"><div class="brand">対応履歴（給与の基礎）</div>'
    +'<div class="name">'+esc(name)+' さん</div></div>';
  h+='<div class="wrap">';
  h+='<button class="parkbtn" style="border-color:#94a3b8;color:#475569" onclick="load()">← タスクに戻る</button>';
  h+='<div style="display:flex;align-items:center;gap:8px;margin:10px 0">'
    +'<button class="abtn" style="background:#e2e8f0;color:#334155" onclick="openHistory(\''+ymShift(ym,-1)+'\')">‹ 前月</button>'
    +'<div style="flex:1;text-align:center;font-weight:800;font-size:16px">'+ym.replace("-","年")+'月</div>'
    +'<button class="abtn" style="background:#e2e8f0;color:#334155" onclick="openHistory(\''+ymShift(ym,1)+'\')">翌月 ›</button></div>';
  h+='<div style="background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fcd34d;border-radius:12px;padding:16px;text-align:center;margin-bottom:12px">'
    +'<div style="font-size:12px;color:#92400e;font-weight:700">今月の対応（完了）件数</div>'
    +'<div style="font-size:36px;font-weight:900;color:#b45309;line-height:1.1">'+(d.count||0)+'<span style="font-size:16px"> 件</span></div>'
    +'<div style="font-size:11px;color:#a16207;margin-top:4px">※この件数が給与明細の基礎になります</div></div>';
  h+='<div class="sechd">✅ 完了したタスク<span class="cnt">'+tk.length+'件</span></div>';
  if(!tk.length){h+='<div class="empty">この月の完了タスクはありません</div>';}
  else{h+=tk.map(function(x){
    var da=(x.done_at||"").slice(0,16).replace("T"," ");
    return '<div class="card '+esc(x.type)+'"><div class="r1"><span class="badge '+esc(x.type)+'">'+esc(typeLabel(x.type))+'</span>'
      +'<span style="font-size:12px;color:#64748b;font-weight:700">'+shortDate(x.date)+(x.time?" "+esc(x.time):"")+'</span>'
      +(x.customer?'<span class="cust">'+esc(x.customer)+'</span>':'')+'</div>'
      +(x.vehicle?'<div class="r2"><span class="veh">🚗 '+esc(x.vehicle)+(x.plate?" "+esc(x.plate):"")+'</span></div>':'')+'</div>';
  }).join("");}
  h+='<div class="ver">'+VER+'</div></div>';
  app.innerHTML=h;
}
function requestCard(x){
  var t=x.type||"";var plate=x.plate?(" "+x.plate):"";
  var veh=x.vehicle?('<span class="veh">🚗 '+esc(x.vehicle)+esc(plate)+'</span>'):'';
  var tm=x.time||x.return_time||"";
  var pl=x.place?('<a class="place" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.place)+'" target="_blank" rel="noopener">📍 '+esc(x.place)+'</a>'):'';
  var cust=x.customer?('<span class="cust">'+esc(x.customer)+'</span>'):'';
  var tid=esc(x._id||"");
  return '<div class="card req '+esc(t)+'">'
    +'<div class="r1"><span class="badge '+esc(t)+'">'+esc(typeLabel(t))+'</span>'
    +(tm?'<span class="tm">'+esc(tm)+'</span>':'')+'<span style="font-size:11px;color:#b45309;font-weight:700">'+shortDate(x.date)+'</span>'+cust+mypLink(x)+'</div>'
    +'<div class="r2">'+veh+pl+'</div>'
    +'<div class="r3"><button class="abtn appr" onclick="saApprove(\''+tid+'\')">🙋 承認して引き受ける</button>'
    +'<button class="abtn skip" onclick="saSkip(\''+tid+'\')">⏭ この依頼をスキップ（辞退）</button></div></div>';
}
function skipCard(x){
  var t=x.type||"";var plate=x.plate?(" "+x.plate):"";
  var veh=x.vehicle?('<span class="veh">🚗 '+esc(x.vehicle)+esc(plate)+'</span>'):'';
  var tm=x.time||x.return_time||"";
  var pl=x.place?('<a class="place" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.place)+'" target="_blank" rel="noopener">📍 '+esc(x.place)+'</a>'):'';
  var cust=x.customer?('<span class="cust">'+esc(x.customer)+'</span>'):'';
  return '<div class="card skipped '+esc(t)+'">'
    +'<div class="r1"><span class="badge '+esc(t)+'">'+esc(typeLabel(t))+'</span>'
    +(tm?'<span class="tm">'+esc(tm)+'</span>':'')+'<span style="font-size:11px;color:#94a3b8;font-weight:700">'+shortDate(x.date)+'</span>'+cust
    +'<span class="lockbadge" style="margin-left:auto">🔒 スキップ済</span></div>'
    +'<div class="r2">'+veh+pl+'</div>'
    +'<div class="r3" style="font-size:11px;color:#94a3b8;font-weight:600">この依頼は辞退済みです（閲覧のみ・操作できません）</div></div>';
}
window.saSkip=function(tid){
  if(!confirm("この依頼をスキップ（辞退）しますか？\n・「スキップ」タブに移動します（閲覧のみ・操作不可）\n・他に候補がいなければOPシートの担当はブランクに戻ります\n・#sapporo_operation に通知が届きます"))return;
  fetch(SAEF,{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},body:JSON.stringify({token:TOKEN,action:"skip",task_id:tid})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||d.ok===false){alert("⚠️ スキップできませんでした（"+((d&&d.error)||"エラー")+"）");return;}
      alert("⏭ スキップしました。"+(d.blanked?"\nOPシートの担当はブランクに戻りました。":""));
      load();
    })
    .catch(function(){alert("⚠️ 通信エラー。電波を確認してください");});
};
window.saApprove=function(tid){
  if(!confirm("このタスクを引き受けますか？\n（承認するとあなたの担当になり、#sapporo_operationに通知が届きます）"))return;
  fetch(SAEF,{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},body:JSON.stringify({token:TOKEN,action:"approve",task_id:tid})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||d.ok===false){
        if(d&&d.error==="already_taken"){alert("⚠️ このタスクは既に「"+(d.taken_by||"他の方")+"」が引き受けました");load();return;}
        alert("⚠️ 承認できませんでした（"+((d&&d.error)||"エラー")+"）");return;
      }
      alert("🙋 引き受けました！あなたの担当タスクになりました。");
      load();
    })
    .catch(function(){alert("⚠️ 通信エラー。電波を確認してください");});
};
var SAEF="https://ckrxttbnawkclshczsia.supabase.co/functions/v1/staff-action";
function openCarmon(){window.open("https://web.carmon.alpine-srv.net/","_blank");}
function openLicense(rid,name){window.open("license.html?id="+encodeURIComponent(rid)+"&name="+encodeURIComponent(name),"_blank");}
window.saDelay=function(rid,action,defTm){
  var kind=(action==="delay_col")?"回収":"お届け";
  var tm=prompt(kind+"の到着予定時間を入力してください（例 18:30）",defTm||"");
  if(tm===null)return; tm=String(tm).trim(); if(!tm){alert("時間が未入力です");return;}
  if(!confirm(kind+"遅延のご案内を送信しますか？\n到着予定：「"+tm+"」\n（お客様LINEに自動送信します）"))return;
  fetch(SAEF,{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},body:JSON.stringify({token:TOKEN,resv_no:rid,action:action,time:tm})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||d.ok===false){alert("⚠️ 実行できませんでした（"+((d&&d.error)||"エラー")+"）");return;}
      if(d.sent){alert("✅ "+kind+"遅延のご案内をLINEに自動送信しました");}
      else{var m=d.message||"";try{navigator.clipboard.writeText(m);}catch(e){}alert("⚠️ LINE未登録（"+(d.reason||"")+"）。案内文をコピーしました→手動で送ってください。");}
    })
    .catch(function(){alert("⚠️ 通信エラー。電波を確認してください");});
};
window.saDone=function(tid){
  if(!confirm("このタスクを完了にしますか？\n（#sapporo_operation に完了通知が届きます）"))return;
  fetch(SAEF,{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},body:JSON.stringify({token:TOKEN,action:"done",task_id:tid})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||d.ok===false){alert("⚠️ 完了にできませんでした（"+((d&&d.error)||"エラー")+"）");return;}
      alert("✅ 完了しました"+(d.posted?"（通知を送信しました）":""));
      load();
    })
    .catch(function(){alert("⚠️ 通信エラー。電波を確認してください");});
};
window.saAction=function(rid,action){
  var lbl={depart:"出発",collect:"回収に向かう",arrival:"到着",col_arrival:"到着",dropoff:"乗り捨て依頼"}[action]||action;
  var isDrv=(action==="depart"||action==="collect");
  if(!confirm(lbl+"しますか？\n"+(isDrv?"（お客様へマイページ案内をLINE自動送信し、位置送信ページを開きます）":"（お客様へ「"+lbl+"」をLINE自動送信します）")))return;
  fetch(SAEF,{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},body:JSON.stringify({token:TOKEN,resv_no:rid,action:action})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||d.ok===false){alert("⚠️ 実行できませんでした（"+((d&&d.error)||"エラー")+"）");return;}
      if(d.sent){alert("✅ "+lbl+"を記録し、お客様LINEに自動送信しました");}
      else{
        var m=d.message||"";
        try{navigator.clipboard.writeText(m);}catch(e){}
        alert("🚚 "+lbl+"を記録しました。\n⚠️ このお客様はLINE未登録です（"+(d.reason||"")+"）。\n案内文をコピーしました→LINE/エルメに貼り付けて送ってください。");
      }
      if(isDrv&&d.driver_url){ location.href=d.driver_url; return; }
      load();
    })
    .catch(function(){alert("⚠️ 通信エラー。電波を確認してください");});
};

var STAB="today";var LASTD=null;
window.setTab=function(tab){
  if(tab==="park"){ location.href="parking-staff.html?t="+encodeURIComponent(TOKEN); return; }
  if(tab==="history"){ openHistory(""); return; }
  STAB=tab;if(LASTD)render(LASTD);
};
function render(d){
  LASTD=d;
  var today=jstToday();
  var tk=(d.tasks||[]);
  var tdy=tk.filter(function(x){return x.date===today;});
  var fut=tk.filter(function(x){return x.date>today;});
  var reqs=(d.requests||[]);
  var skips=(d.skips||[]);
  var name=esc(String(d.staff||"").replace(/\s*さん\s*$/,""));
  var h='<div class="hero"><div class="brand">HANDYMAN 札幌デリバリー</div>'
    +'<div class="name">'+name+' さん</div>'
    +'<div class="sub">本日 '+tdy.length+'件 ／ 未来 '+fut.length+'件'+(reqs.length?'　／　📢依頼 '+reqs.length+'件':'')+'</div></div>';
  // 5タブ
  function tab(id,label,cnt,alert){return '<button class="tab'+(STAB===id?" on":"")+'" onclick="setTab(\''+id+'\')">'+label+(cnt!=null?'<span class="tb'+(alert?" alert":"")+'">'+cnt+'</span>':'')+'</button>';}
  h+='<div class="tabs">'
    +tab("today","📋本日",tdy.length)
    +tab("future","🗓未来",fut.length)
    +tab("requests","📢依頼",reqs.length,reqs.length>0)
    +tab("skips","⏭スキップ",skips.length)
    +tab("park","🅿️駐車場")
    +tab("history","📋履歴")
    +'</div>';
  h+='<div class="wrap">';
  if(STAB==="requests"){
    if(reqs.length){
      h+='<div class="note" style="background:#fffbeb;border-color:#fde68a;color:#92400e">対応できるタスクの「🙋承認」を押すと、あなたの担当になります（先着1名）。日付ごとに確認できます。</div>';
      h+=groupByDate(reqs,requestCard,today);
    }else{ h+='<div class="empty">現在、依頼は来ていません</div>'; }
  }else if(STAB==="skips"){
    h+='<div class="sechd">⏭ スキップ（辞退）したタスク<span class="cnt">'+skips.length+'件</span></div>';
    h+='<div class="note">辞退した依頼の記録です。閲覧のみで操作はできません（ロック）。</div>';
    h+= skips.length?groupByDate(skips,skipCard,today):'<div class="empty">スキップした依頼はありません</div>';
  }else if(STAB==="future"){
    h+='<div class="sechd">🗓 未来の担当タスク（本日以外）<span class="cnt">'+fut.length+'件</span></div>';
    h+= fut.length?groupByDate(fut,taskCard,today):'<div class="empty">本日以外の担当タスクはありません</div>';
  }else{
    h+='<div class="note">OPシートで担当・時間が変わると、この画面も自動で最新になります（30秒ごと）。</div>';
    h+='<div class="sechd">📋 本日 <span style="color:#94a3b8;font-weight:600;font-size:12px">'+shortDate(today)+'</span><span class="cnt">'+tdy.length+'件</span></div>';
    h+= tdy.length?tdy.map(taskCard).join(""):'<div class="empty">本日の担当タスクはありません</div>';
  }
  h+='<div class="ver">'+VER+'</div></div>';
  app.innerHTML=h;
}

function showErr(msg){
  app.innerHTML='<div class="err">⚠️ '+esc(msg)+'<br><button onclick="load()">再読み込み</button></div>';
}

function load(){
  if(!TOKEN){showErr("URLが正しくありません（token無し）");return;}
  var ctrl=new AbortController();var to=setTimeout(function(){ctrl.abort();},15000);
  fetch(SB+"/rest/v1/rpc/spk_staff_view",{method:"POST",signal:ctrl.signal,
    headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},
    body:JSON.stringify({p_token:TOKEN})})
  .then(function(r){return r.json();})
  .then(function(d){clearTimeout(to);
    if(!d||d.ok===false){showErr(d&&d.error==="invalid_token"?"このURLは無効です（担当者へ連絡してください）":"読み込みに失敗しました");return;}
    render(d);})
  .catch(function(e){clearTimeout(to);showErr("通信エラー。電波を確認して再読み込みしてください");});
}
load();
setInterval(function(){if(!document.hidden&&TOKEN)load();},30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)load();});
</script>
