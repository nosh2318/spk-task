<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>スタッフ専用ページ</title>
<style>
:root{--blue:#2563eb;--red:#dc2626;--teal:#0d9488;--green:#059669;--amber:#d97706;--slate:#64748b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;background:#f1f5f9;color:#0f172a;font-size:15px;max-width:560px;margin:0 auto;padding-bottom:40px}
.hero{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hero .brand{font-size:12px;opacity:.8;letter-spacing:1px}
.hero .name{font-size:22px;font-weight:800;margin-top:2px}
.hero .sub{font-size:12px;opacity:.85;margin-top:3px}
.wrap{padding:12px}
.parkbtn{display:block;width:100%;text-align:center;background:#fff;border:2px solid var(--teal);color:var(--teal);font-weight:800;font-size:15px;padding:12px;border-radius:12px;margin:4px 0 14px;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sechd{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;font-weight:800;font-size:15px}
.sechd .cnt{margin-left:auto;font-size:12px;color:var(--slate);font-weight:700}
.card{background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:9px;box-shadow:0 1px 3px rgba(0,0,0,.07);border-left:5px solid var(--slate)}
.card.DEL,.card.PU,.card.PUB{border-left-color:var(--blue)}
.card.COL,.card.BD,.card.BDB,.card.返却{border-left-color:var(--red)}
.card.洗車{border-left-color:var(--teal)}
.card.done{opacity:.5}
.r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-weight:800;color:#fff;border-radius:6px;padding:3px 9px;font-size:14px;background:var(--slate)}
.badge.DEL,.badge.PU,.badge.PUB{background:var(--blue)}
.badge.COL,.badge.BD,.badge.BDB,.badge.返却{background:var(--red)}
.badge.洗車{background:var(--teal)}
.tm{font-size:19px;font-weight:800}
.cust{font-size:15px;font-weight:700}
.r2{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px}
.veh{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;font-weight:800;border-radius:7px;padding:3px 9px;font-size:14px}
.veh.nov{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.place{color:#334155;font-size:13px}
.cls{color:var(--slate);font-size:12px}
.r3{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.abtn{font-size:13px;font-weight:800;padding:8px 12px;border-radius:8px;border:none;cursor:pointer;color:#fff}
.abtn.dep{background:#16a34a}.abtn.col{background:#ea580c}.abtn.arr{background:#dcfce7;color:#15803d;border:1px solid #86efac}
.abtn.drp{background:#fef2f2;color:#b91c1c;border:1px solid #fca5a5}
.abtn.car{background:#fffbeb;color:#92400e;border:1px solid #fcd34d}
.abtn.lic{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.abtn.done{background:#0f172a;color:#fff;margin-left:auto}
a.place{color:#1d4ed8;text-decoration:underline;font-size:13px}
.empty{text-align:center;color:var(--slate);padding:20px;font-size:14px}
.loading{text-align:center;padding:50px 20px;color:var(--slate)}
.spin{width:34px;height:34px;border:4px solid #e2e8f0;border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:16px;margin:16px;text-align:center}
.err button{margin-top:10px;background:var(--red);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-weight:700;font-size:14px}
.ver{text-align:center;color:#94a3b8;font-size:10px;margin-top:16px}
.note{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;font-size:12px;border-radius:10px;padding:9px 11px;margin-bottom:12px}
</style></head>
<body>
<div id="app"><div class="loading"><div class="spin"></div>読み込み中…</div></div>
<script>
var SB="https://ckrxttbnawkclshczsia.supabase.co";
var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
var VER="staff-v2.2";
var TOKEN=new URLSearchParams(location.search).get("t")||"";
var app=document.getElementById("app");

function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function shortDate(d){var p=(d||"").split("-");return p.length===3?(+p[1])+"/"+(+p[2]):d;}
function jstToday(){var n=new Date(Date.now()+9*3600*1000);return n.toISOString().slice(0,10);}

function typeLabel(t){var m={DEL:"お届け",PU:"送迎お迎え",PUB:"バスお迎え",COL:"回収",BD:"お見送り",BDB:"バスお見送り","返却":"返却","洗車":"洗車"};return m[t]||t;}

function taskCard(x){
  var t=x.type||"";
  var plate=x.plate?(" "+x.plate):"";
  var veh=x.vehicle?('<span class="veh">🚗 '+esc(x.vehicle)+esc(plate)+'</span>'):'<span class="veh nov">未配車</span>';
  var tm=x.time||(t==="COL"||t==="BD"||t==="BDB"||t==="返却"?(x.return_time||""):"");
  var pl=x.place?('<a class="place" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.place)+'" target="_blank" rel="noopener">📍 '+esc(x.place)+'</a>'):'';
  var cust=x.customer?('<span class="cust">'+esc(x.customer)+'</span>'):'';
  var rid=esc(x.resv||"");
  var tid=esc(x._id||"");
  var isDel=(t==="DEL"||t==="PU"||t==="PUB"||t==="来店"||t==="PUB来店");
  var isCol=(t==="COL"||t==="BD"||t==="BDB"||t==="返却");
  var btns='<div class="r3">';
  if(rid&&isDel){
    btns+='<button class="abtn dep" onclick="saAction(\''+rid+'\',\'depart\')">🚚出発</button>';
    btns+='<button class="abtn arr" onclick="saAction(\''+rid+'\',\'arrival\')">📱到着</button>';
  }else if(rid&&isCol){
    btns+='<button class="abtn col" onclick="saAction(\''+rid+'\',\'collect\')">🧭回収に向かう</button>';
    btns+='<button class="abtn arr" onclick="saAction(\''+rid+'\',\'col_arrival\')">📱到着</button>';
    btns+='<button class="abtn drp" onclick="saAction(\''+rid+'\',\'dropoff\')">🚗乗捨</button>';
  }
  if(rid&&(isDel||isCol)){
    btns+='<button class="abtn car" onclick="openCarmon()">📍位置</button>';
    btns+='<button class="abtn lic" onclick="openLicense(\''+rid+'\',\''+esc(x.customer||"")+'\')">🪪免許証</button>';
  }
  if(tid&&!x.done){ btns+='<button class="abtn done" onclick="saDone(\''+tid+'\')">✅完了</button>'; }
  btns+='</div>';
  return '<div class="card '+esc(t)+(x.done?' done':'')+'">'
    +'<div class="r1"><span class="badge '+esc(t)+'">'+esc(typeLabel(t))+'</span>'
    +(tm?'<span class="tm">'+esc(tm)+'</span>':'')+cust+(x.done?' <span style="color:#059669;font-weight:800;font-size:13px">✓済</span>':'')+'</div>'
    +'<div class="r2">'+veh+pl+'</div>'+btns+'</div>';
}
var SAEF="https://ckrxttbnawkclshczsia.supabase.co/functions/v1/staff-action";
function openCarmon(){window.open("https://web.carmon.alpine-srv.net/","_blank");}
function openLicense(rid,name){window.open("license.html?id="+encodeURIComponent(rid)+"&name="+encodeURIComponent(name),"_blank");}
window.saDone=function(tid){
  if(!confirm("このタスクを完了にしますか？\n（#sapporo_operation に完了通知が届きます）"))return;
  fetch(SAEF,{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},body:JSON.stringify({token:TOKEN,action:"done",task_id:tid})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||d.ok===false){alert("⚠️ 完了にできませんでした（"+((d&&d.error)||"エラー")+"）");return;}
      alert("✅ 完了しました"+(d.posted?"（通知を送信しました）":""));
      load();
    })
    .catch(function(){alert("⚠️ 通信エラー。電波を確認してください");});
};
window.saAction=function(rid,action){
  var lbl={depart:"出発",collect:"回収に向かう",arrival:"到着",col_arrival:"到着",dropoff:"乗り捨て依頼"}[action]||action;
  var isDrv=(action==="depart"||action==="collect");
  if(!confirm(lbl+"しますか？\n"+(isDrv?"（お客様へマイページ案内をLINE自動送信し、位置送信ページを開きます）":"（お客様へ「"+lbl+"」をLINE自動送信します）")))return;
  fetch(SAEF,{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},body:JSON.stringify({token:TOKEN,resv_no:rid,action:action})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||d.ok===false){alert("⚠️ 実行できませんでした（"+((d&&d.error)||"エラー")+"）");return;}
      if(d.sent){alert("✅ "+lbl+"を記録し、お客様LINEに自動送信しました");}
      else{
        var m=d.message||"";
        try{navigator.clipboard.writeText(m);}catch(e){}
        alert("🚚 "+lbl+"を記録しました。\n⚠️ このお客様はLINE未登録です（"+(d.reason||"")+"）。\n案内文をコピーしました→LINE/エルメに貼り付けて送ってください。");
      }
      if(isDrv&&d.driver_url){ location.href=d.driver_url; return; }
      load();
    })
    .catch(function(){alert("⚠️ 通信エラー。電波を確認してください");});
};

function render(d){
  var today=jstToday();
  var tk=(d.tasks||[]);
  var tdy=tk.filter(function(x){return x.date===today;});
  var tmr=tk.filter(function(x){return x.date>today;});
  var pu=TOKEN;
  var h='<div class="hero"><div class="brand">HANDYMAN 札幌デリバリー</div>'
    +'<div class="name">'+esc(String(d.staff||"").replace(/\s*さん\s*$/,""))+' さん</div>'
    +'<div class="sub">担当タスク（本日 '+tdy.length+'件 / 翌日 '+tmr.length+'件）</div></div>';
  h+='<div class="wrap">';
  h+='<a class="parkbtn" href="parking-staff.html?t='+encodeURIComponent(pu)+'">🅿️ 駐車場を開く</a>';
  h+='<div class="note">OPシートで担当・時間が変わると、この画面も自動で最新になります（30秒ごと）。</div>';
  h+='<div class="sechd">📋 本日 <span style="color:#94a3b8;font-weight:600;font-size:12px">'+shortDate(today)+'</span><span class="cnt">'+tdy.length+'件</span></div>';
  h+= tdy.length?tdy.map(taskCard).join(""):'<div class="empty">本日の担当タスクはありません</div>';
  h+='<div class="sechd">🗓 翌日<span class="cnt">'+tmr.length+'件</span></div>';
  h+= tmr.length?tmr.map(taskCard).join(""):'<div class="empty">翌日の担当タスクはありません</div>';
  h+='<div class="ver">'+VER+'</div></div>';
  app.innerHTML=h;
}

function showErr(msg){
  app.innerHTML='<div class="err">⚠️ '+esc(msg)+'<br><button onclick="load()">再読み込み</button></div>';
}

function load(){
  if(!TOKEN){showErr("URLが正しくありません（token無し）");return;}
  var ctrl=new AbortController();var to=setTimeout(function(){ctrl.abort();},15000);
  fetch(SB+"/rest/v1/rpc/spk_staff_view",{method:"POST",signal:ctrl.signal,
    headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},
    body:JSON.stringify({p_token:TOKEN})})
  .then(function(r){return r.json();})
  .then(function(d){clearTimeout(to);
    if(!d||d.ok===false){showErr(d&&d.error==="invalid_token"?"このURLは無効です（担当者へ連絡してください）":"読み込みに失敗しました");return;}
    render(d);})
  .catch(function(e){clearTimeout(to);showErr("通信エラー。電波を確認して再読み込みしてください");});
}
load();
setInterval(function(){if(!document.hidden&&TOKEN)load();},30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)load();});
</script>
</body></html>
