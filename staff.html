/* ★2026-11-08 押した ✓時刻（那覇と同じ・3店統一）。正本はサーバー（spk_line_sends＝OP・タスクサマリーと同じ表）。
   どの端末で開いても同じ時刻が出る。押した直後はこの画面にもすぐ出す（次の読み込みでサーバーの値に置き換わる）。 */
var ACTED={};
function actedOf(rid,a){return (rid&&a&&ACTED[rid+"|"+a])?ACTED[rid+"|"+a]:null;}
function actedMark(rid,a){if(rid&&a)ACTED[rid+"|"+a]={at:new Date().toISOString()};}
function actedLabel(at){try{var d=new Date(at);return "✓"+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}catch(e){return "✓済";}}
/* ★2026-11-09 nosh「ステップわかるようにして」「全店」：①②の番号（那覇と同じ）。次に押すボタンは紺＋黄色の枠、押したものは緑＋✓時刻 */
var STEP_NO=["","①","②","③","④","⑤"];
var STEP_NEXT=' style="background:#002063;color:#fff;border:none;box-shadow:0 0 0 3px #FABE00;font-weight:900"';
var STEP_LATER=' style="background:#fff;color:#002063;border:1px solid #C9CED6;font-weight:700"';
var STEP_DONE=' style="background:#dcfce7;color:#15803d;border:1px solid #86efac;font-weight:800"';
function _ab(cls,rid,actKey,oc,label,step,isNext){
  var d=actedOf(rid,actKey);
  var st=d?STEP_DONE:(step?(isNext?STEP_NEXT:STEP_LATER):'');
  return '<button class="abtn '+cls+(d?' acted':'')+'" onclick="'+oc+'"'+st+'>'+(step?STEP_NO[step]:'')+label+(d?((step?'<br><span style="font-size:11px">':' ')+actedLabel(d.at)+(step?'</span>':'')):'')+'</button>';
}
function pressLoad(cb){

    .then(function(d){try{if(d&&d.ok&&d.acts){var nx={};Object.keys(d.acts).forEach(function(rid){var m=d.acts[rid]||{};Object.keys(m).forEach(function(k){if(m[k]&&m[k].at)nx[rid+"|"+k]={at:m[k].at};});});Object.keys(ACTED).forEach(function(k){if(!nx[k])nx[k]=ACTED[k];});ACTED=nx;}}catch(e){}fin();})

}
/* ★2026-11-13 オーナー依頼（札幌・那覇）：お届けの「出発」の前に「オプション確認」。チャイルドシート等の積み忘れを現地で気づく事故を防ぐ。
   記録はこの端末だけ（DB に書かない・お客様へ何も送らない）。オプションありで未確認のまま「出発」を押すと先に確認を出す。中身はカードの札（opt_*）と同じ */
function optChkTask(rid){return ((LASTD&&LASTD.tasks)||[]).filter(function(y){return String(y.resv||"")===String(rid)&&(y.type==="DEL"||y.type==="PU"||y.type==="PUB"||y.type==="来店"||y.type==="PUB来店");})[0]||null;}
function optChkList(x){var o=[];if(!x)return o;if(+x.opt_b>0)o.push('ベビーシート×'+x.opt_b);if(+x.opt_c>0)o.push('チャイルドシート×'+x.opt_c);if(+x.opt_j>0)o.push('ジュニアシート×'+x.opt_j);if(+x.opt_usb>0)o.push('USB');if(+x.opt_parasol>0)o.push('日傘×'+x.opt_parasol);return o;}
function optChkKey(rid){return "optchk|spk|"+rid;}
function optChkDone(rid){try{var v=rid&&localStorage.getItem(optChkKey(rid));return v?{at:v}:null;}catch(e){return null;}}
function optChkBtn(rid,isNext){var d=optChkDone(rid);var st=d?STEP_DONE:(isNext?STEP_NEXT:STEP_LATER);return '<button class="abtn opt'+(d?' acted':'')+'" onclick="optChkAsk(\''+rid+'\',false)"'+st+'>'+STEP_NO[1]+'オプション確認'+(d?'<br><span style="font-size:11px">'+actedLabel(d.at)+'</span>':'')+'</button>';}
window.optChkAsk=function(rid,warn){var a=optChkList(optChkTask(rid));
  if(!a.length)alert("📋 この予約のオプションはありません");
  else if(!confirm((warn?"⚠️ まだオプション確認をしていません\n\n":"📋 オプション確認\n\n")+a.map(function(x){return "・"+x;}).join("\n")+"\n\n車に積みましたか？"))return false;
  try{localStorage.setItem(optChkKey(rid),new Date().toISOString());}catch(e){}
  if(!warn&&LASTD)setContent(tasksContent(LASTD));
  return true;};
/* ★2026-11-13 オーナー指示「オプション確認を押さないと出発を押せないように」（オプションなしの予約も同じ）。出発済み（再送）は止めない */
function optChkGate(rid){if(optChkDone(rid)||actedOf(rid,"depart"))return true;alert("⚠️ 先に「①オプション確認」を押してください\n（チャイルドシートなどを積んだか確認してから出発します）");return false;}
window.saAction=function(rid,action){
  var lbl={depart:"出発",collect:"回収に向かう",arrival:"到着",col_arrival:"到着",dropoff:"乗り捨て依頼"}[action]||action;
  var isDrv=(action==="depart"||action==="collect");
  if(action!=="dropoff"){var _tt=((action==="depart"||action==="arrival")?"DEL":"COL"),_tk=((LASTD&&LASTD.tasks)||[]).filter(function(y){return String(y.resv||"")===String(rid)&&y.type===_tt;})[0];if(_tk&&saTooEarly(_tk))return;}
  if(action==="depart"&&!optChkGate(rid))return;

  fetch(SAEF,{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},body:JSON.stringify({token:TOKEN,resv_no:rid,action:action})})
    .then(function(r){return r.json();})

      if(!d||d.ok===false){alert("⚠️ 実行できませんでした（"+((d&&d.error)||"エラー")+"）");return;}

        var m=d.message||"";
        try{navigator.clipboard.writeText(m);}catch(e){}

      }
      if(isDrv&&d.driver_url){ location.href=d.driver_url; return; }
      load();
    })
    .catch(function(){alert("⚠️ 通信エラー。電波を確認してください");});
};

// 📋本日/🗓未来/📢依頼/⏭スキップ の中身（同期・LASTDから即描画）
function tasksContent(d){
  var today=jstToday();
  var tk=(d.tasks||[]);
  var tdy=tk.filter(function(x){return x.date===today;});
  var fut=tk.filter(function(x){return x.date>today;});
  var reqs=(d.requests||[]);
  var skips=(d.skips||[]);
  var h='';
  if(STAB==="requests"){
    if(reqs.length){
      h+='<div class="note" style="background:#fffbeb;border-color:#fde68a;color:#92400e">対応できるタスクの「🙋承認」を押すと、あなたの担当になります（先着1名）。日付ごとに確認できます。</div>';
      h+=groupByDate(reqs,requestCard,today);
    }else{ h+='<div class="empty">現在、依頼は来ていません</div>'; }
  }else if(STAB==="skips"){
    h+='<div class="sechd">⏭ スキップ（辞退）したタスク<span class="cnt">'+skips.length+'件</span></div>';
    h+='<div class="note">辞退した依頼の記録です。閲覧のみで操作はできません（ロック）。</div>';
    h+= skips.length?groupByDate(skips,skipCard,today):'<div class="empty">スキップした依頼はありません</div>';
  }else{
    // 📋 タスク（日別）：本日以降の各日付を選んで、その日のタスクだけ表示。未来でまとめない。
    var cnt={},order=[];
    tk.forEach(function(x){ if(x.date>=today){ if(cnt[x.date]==null){cnt[x.date]=0;order.push(x.date);} cnt[x.date]++; } });
    order.sort();
    var sd=(SDATE&&cnt[SDATE]!=null)?SDATE:(cnt[today]!=null?today:(order[0]||today));
    // 日付セレクタ（横スクロール）
    h+='<div class="dsel">'+order.map(function(dd){
      var on=(dd===sd); var lb=(dd===today?'本日':(dd===addDays(today,1)?'明日':shortDate(dd)));
      return '<button class="dchip'+(on?' on':'')+'" onclick="setSDate(\''+dd+'\')">'+lb+'<span class="dwd">'+jpWd(dd)+'</span><span class="dcnt">'+cnt[dd]+'</span></button>';
    }).join('')+'</div>';
    var dayTasks=tk.filter(function(x){return x.date===sd;});
    h+='<div class="sechd">📅 '+shortDate(sd)+'（'+jpWd(sd)+'）'+(sd===today?' <span style="color:#059669;font-size:12px;font-weight:800">本日</span>':'')+'<span class="cnt">'+dayTasks.length+'件</span></div>';
    h+=_tfiltBar(dayTasks);
    var _shown=_applyTFilt(dayTasks).slice().sort(_dispSort);  // ★2026-11-12 表示時刻で並べる（◯時以降＝その時刻の後ろ・時間なし＝最後）
    h+= _shown.length?_shown.map(taskCard).join(""):'<div class="empty">'+(dayTasks.length?'この種別のタスクはありません':'この日の担当タスクはありません')+'</div>';
  }
  return h;
}

    var isCard=(PETTY_METHOD==="カード");

    fetch(SB+"/rest/v1/spk_petty_cash",{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify(row)})
      .then(function(r){ if(!r.ok)throw new Error("save");
        // ★本体会計へ自動反映：現金→出納帳(cash_out/現金)、カード→会計カードタブ(card_pay/クレジットカード)。id=pc_+小口id で紐付け→削除も同期
        var acc=isCard
          ? {id:"pc_"+id,date:date,type:"card_pay",category:"旅費交通費",sub_category:"",description:desc||"カード払い",amount:amt,input_by:nm,staff_name:nm,memo:"スタッフ入力（カード）"+(receiptUrl?"・領収書あり":""),pay_method:"クレジットカード",resv_no:"",url:receiptUrl||"",paid:false}

        fetch(SB+"/rest/v1/spk_accounting",{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json","Prefer":"return=minimal,resolution=merge-duplicates"},body:JSON.stringify(acc)}).catch(function(){});
        PETTY_FILE=null; openPetty(PETTY_YM); })
      .catch(function(){ if(btn){btn.disabled=false;btn.textContent="💾 記録する";} alert("保存に失敗しました。通信を確認してもう一度お試しください。"); });
  }
  if(PETTY_FILE){
    var f=PETTY_FILE, ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
    var path="r/"+PETTY_YM+"/"+id+"."+ext; // ★Storageキーは日本語不可(Invalid key)→ASCIIのみ(id)。氏名はreceipt_nameに保持
    fetch(SB+"/storage/v1/object/petty-receipts/"+path,{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":f.type||"image/jpeg","x-upsert":"false"},body:f})
      .then(function(r){ if(!r.ok)throw new Error("up"); insert(SB+"/storage/v1/object/public/petty-receipts/"+path,f.name); })
      .catch(function(){ insert("",""); /* 画像失敗でも記録は残す（後で添付可） */ });
  }else{ insert("",""); }
};

<script>/* 2026-11-14 nosh「確認は全ての押すアクションに必要。小さなボタンでも『いいですか』」
   スタッフ画面で、押す・選ぶと記録や通知が飛ぶもののうち、まだ確認が無かったものに「よろしいですか？」を出す（3店共通）。

(function(){

  function txt(el){return String((el&&(el.innerText||el.textContent))||"").replace(/\s+/g," ").trim().slice(0,40);}
  function selTxt(el){try{var o=el.options[el.selectedIndex];return o?txt(o):"";}catch(e){return "";}}
  function oc(el,ev){return String((el&&el.getAttribute&&el.getAttribute("on"+ev))||"");}
  /* 押すボタン：関数名 → 確認の文 */
  var CLICK={
    nudgeAck:function(){return "お客様の知らせを「確認済」にします。よろしいですか？";},

    /* 本部（マイページ管理・チャット管理） */

    refDone:function(){return "返金済みにします。よろしいですか？";},
    altOther:function(){return "このメッセージでお客様に返します（依頼はお断り）。よろしいですか？";},
    altKeep:function(){return "今のご予約のままでお客様に返します（依頼はお断り）。よろしいですか？";}
  };

    CLICK.send=function(){var i=document.getElementById("inp");return (i&&String(i.value||"").trim())||(function(){try{return pendingImg;}catch(e){return null;}})()?"お客様に送ります。よろしいですか？":null;};

  }

  var CHANGE={
    saMove:function(el){return "「"+selTxt(el)+"」にします。よろしいですか？";},
    wcCheck:function(el){var l=el.closest&&el.closest("label");return (el.checked?"チェックします":"チェックを外します")+(l?"：「"+txt(l)+"」":"")+"\nよろしいですか？";},
    wcTire:function(el){return "タイヤの記録を「"+(el.tagName==="SELECT"?selTxt(el):el.value)+"」にします。よろしいですか？";},
    clOther:function(el){return "「"+String(el.value||"").slice(0,40)+"」で記録します。よろしいですか？";}
  };
  function fnOf(s,map){for(var k in map){if(new RegExp("(^|[^\\w$.])"+k+"\\(").test(s))return k;}return null;}
  /* 選ぶ前の値を覚えておく（キャンセルで戻すため） */
  document.addEventListener("focusin",function(e){var t=e.target;if(t&&(t.tagName==="SELECT"||t.tagName==="INPUT"))t.__prev=t.type==="checkbox"?t.checked:t.value;},true);
  document.addEventListener("pointerdown",function(e){var t=e.target&&e.target.closest&&e.target.closest("select,input");if(t)t.__prev=t.type==="checkbox"?t.checked:t.value;},true);
  document.addEventListener("click",function(e){
    var b=e.target&&e.target.closest?e.target.closest("button,[onclick]"):null;if(!b||b.disabled)return;
