@keyframes mvRun{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(4px) translateY(-3px) rotate(-8deg)}50%{transform:translateX(0) translateY(0) rotate(0)}75%{transform:translateX(-3px) translateY(-3px) rotate(8deg)}100%{transform:translateX(0) rotate(0)}}

function typeLabel(t){return t||"";}/* ★OPシートと同一表記(コード DEL/PU/PUB/COL/BD/BDB/来店/返却/洗車)。用語を変えない＝OPシートの個別ミラー */

// ★2026-08-04 OPシート本体(index.src.html MOVE_MEANS_ICON/STYLE)と完全一致させる。現行の選択肢＝送迎/徒歩/自転車/電動自転車/電動KB/地下鉄/JR/バス。旧値(ミニ自転車/キックボード/ループ/送り)は過去データ表示用に後方互換で残す。「自転車が🚗表示」等はMV_INFO未登録→🚗フォールバックが原因だった。
var MV_INFO={"送迎":{ic:"🚗",lb:"送迎",g:"linear-gradient(135deg,#fb7185,#be123c)"},"徒歩":{ic:"🏃",lb:"徒歩",g:"linear-gradient(135deg,#fb923c,#ea580c)"},"自転車":{ic:"🚲",lb:"自転車",g:"linear-gradient(135deg,#34d399,#059669)"},"電動自転車":{ic:"⚡",lb:"電動チャリ",g:"linear-gradient(135deg,#22d3ee,#0891b2)"},"電動KB":{ic:"🛴",lb:"電動KB",g:"linear-gradient(135deg,#c084fc,#7c3aed)"},"地下鉄":{ic:"🚇",lb:"地下鉄",g:"linear-gradient(135deg,#2dd4bf,#0f766e)"},"JR":{ic:"🚃",lb:"JR",g:"linear-gradient(135deg,#60a5fa,#1d4ed8)"},"バス":{ic:"🚌",lb:"バス",g:"linear-gradient(135deg,#fbbf24,#d97706)"},"ミニ自転車":{ic:"🚲",lb:"ミニ自転車",g:"linear-gradient(135deg,#34d399,#059669)"},"キックボード":{ic:"🛴",lb:"キック",g:"linear-gradient(135deg,#c084fc,#7c3aed)"},"ループ":{ic:"🚌",lb:"ループ",g:"linear-gradient(135deg,#fbbf24,#d97706)"},"送り":{ic:"🚙",lb:"送り",g:"linear-gradient(135deg,#fb7185,#be123c)"}};
// ★2026-08-04 移動手段の方向ラベルをタスク種別で出し分け（DEL/入庫＝目的地"から"の帰り／COL/引取＝目的地"まで"の行き）＝OPシート本体(_moveMeansLabel)と統一
function moveMeansLbl(type){return (type==="DEL"||type==="入庫"?"目的地から":"目的地まで")+"の移動手段";}

  return '<div class="mv-banner" style="background:'+m.g+'"><span class="mv-ic">'+m.ic+'</span>'
    +'<span class="mv-tx"><span class="mv-lb">'+moveMeansLbl(x.type||"")+'</span><span class="mv-nm">'+esc(m.lb)+'</span></span>'
    +'<span class="mv-chevron">💨</span></div>';
}
function taskCard(x){
  var t=x.type||"";
  var plate=x.plate?(" "+x.plate):"";
  var veh=x.vehicle?('<span class="veh">🚗 '+esc(x.vehicle)+esc(plate)+'</span>'):'<span class="veh nov">未配車</span>';

  var tmIsAfter=(t==="洗車"&&!x.time&&!!x.wash_after);

function fireConfetti(){try{var c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100000";document.body.appendChild(c);var ctx=c.getContext("2d");var W=c.width=window.innerWidth,H=c.height=window.innerHeight;var cols=["#f43f5e","#f59e0b","#10b981","#3b82f6","#a855f7","#22d3ee","#eab308","#ec4899"];var P=[];for(var i=0;i<160;i++){P.push({x:W/2+(Math.random()-.5)*180,y:H*0.34,vx:(Math.random()-.5)*13,vy:Math.random()*-13-4,g:0.30+Math.random()*0.22,s:6+Math.random()*8,rot:Math.random()*6.28,vr:(Math.random()-.5)*.5,col:cols[i%cols.length]});}var t0=null,dur=1800;function fr(ts){if(!t0)t0=ts;var el=ts-t0;ctx.clearRect(0,0,W,H);for(var k=0;k<P.length;k++){var p=P[k];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.max(0,1-el/dur);ctx.fillStyle=p.col;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62);ctx.restore();}if(el<dur){requestAnimationFrame(fr);}else{c.remove();}}requestAnimationFrame(fr);}catch(e){}}

// 📋本日/🗓未来/📢依頼/⏭スキップ の中身（同期・LASTDから即描画）
function tasksContent(d){
  var today=jstToday();
  var tk=(d.tasks||[]);
  var tdy=tk.filter(function(x){return x.date===today;});
  var fut=tk.filter(function(x){return x.date>today;});
  var reqs=(d.requests||[]);
  var skips=(d.skips||[]);
  var h='';
  if(STAB==="requests"){
    if(reqs.length){
      h+='<div class="note" style="background:#fffbeb;border-color:#fde68a;color:#92400e">対応できるタスクの「🙋承認」を押すと、あなたの担当になります（先着1名）。日付ごとに確認できます。</div>';
      h+=groupByDate(reqs,requestCard,today);
    }else{ h+='<div class="empty">現在、依頼は来ていません</div>'; }
  }else if(STAB==="skips"){
    h+='<div class="sechd">⏭ スキップ（辞退）したタスク<span class="cnt">'+skips.length+'件</span></div>';
    h+='<div class="note">辞退した依頼の記録です。閲覧のみで操作はできません（ロック）。</div>';
    h+= skips.length?groupByDate(skips,skipCard,today):'<div class="empty">スキップした依頼はありません</div>';
  }else if(STAB==="future"){
    h+='<div class="sechd">🗓 未来の担当タスク（本日以外）<span class="cnt">'+fut.length+'件</span></div>';
    h+= fut.length?groupByDate(fut,taskCard,today):'<div class="empty">本日以外の担当タスクはありません</div>';
  }else{
    h+='<div class="note">OPシートで担当・時間が変わると、この画面も自動で最新になります（30秒ごと）。</div>';
    h+='<div class="sechd">📋 本日 <span style="color:#94a3b8;font-weight:600;font-size:12px">'+shortDate(today)+'</span><span class="cnt">'+tdy.length+'件</span></div>';
    // 🔀 種別で絞り込み（DEL/COL/洗車/その他）
    var _fc=function(id){return id==="all"?tdy.length:tdy.filter(function(x){return _tcat(x.type)===id;}).length;};
    var _fbtn=function(id,label){var on=(TFILT===id);var c=_fc(id);return '<button class="tfbtn'+(on?" on":"")+'" onclick="setTFilt(\''+id+'\')">'+label+'<span class="tfc">'+c+'</span></button>';};
    h+='<div class="tfilt">'+_fbtn("all","すべて")+_fbtn("DEL","🚚DEL")+_fbtn("COL","📦COL")+_fbtn("洗車","🧽洗車")+_fbtn("other","📌その他")+'</div>';
    var _shown=(TFILT==="all")?tdy:tdy.filter(function(x){return _tcat(x.type)===TFILT;});
    h+= _shown.length?_shown.map(taskCard).join(""):'<div class="empty">'+(tdy.length?'この種別のタスクはありません':'本日の担当タスクはありません')+'</div>';
  }
  return h;
}
// ===== 💴 小口現金（月初¥5,000配布・本人が使った分を記録→残高が減る・領収書を合わせる） =====
var PETTY_FLOAT=5000;           // 月初配布額（各月ここからスタート）
var PETTY_YM=null, PETTY_ROWS=[], PETTY_FILE=null, PETTY_METHOD="現金";  // ★現金/カード（カードは現金残高に影響せず会計カードタブへ）
function pettyName(){return String((LASTD&&LASTD.staff)||"").replace(/\s*さん\s*$/,"").trim();}
window.openPetty=function(ym){
  MODE="petty";STAB="petty";
  PETTY_YM=ym||jstToday().slice(0,7);
  var nm=pettyName();
  if(!nm){setContent('<div class="empty">スタッフ情報の読み込み後にご利用ください</div>');return;}
  busy("小口現金を読み込み中…");
  var q=SB+"/rest/v1/spk_petty_cash?staff_name=eq."+encodeURIComponent(nm)+"&ym=eq."+encodeURIComponent(PETTY_YM)+"&order=date.asc,created_at.asc&select=*";
  fetch(q,{headers:{"apikey":ANON,"Authorization":"Bearer "+ANON}})
    .then(function(r){return r.json();})
    .then(function(rows){ PETTY_ROWS=Array.isArray(rows)?rows:[]; renderPetty(); })
    .catch(function(){setContent('<div class="err" style="margin:16px 0">⚠️ 通信エラー<br><button onclick="openPetty(\''+PETTY_YM+'\')">再読み込み</button></div>');});
};
function renderPetty(){
  var ym=PETTY_YM, given=0, used=0;
  PETTY_ROWS.forEach(function(r){ if(r.kind==="topup"){given+=(+r.amount||0);} else if(r.kind!=="card"){used+=(+r.amount||0);} });  // ★カードは現金残高に含めない
  var bal=given-used;
  var h='<div style="display:flex;gap:8px;align-items:center;margin:10px 0 6px">'
    +'<button class="abtn" style="background:#e2e8f0;color:#334155" onclick="openPetty(\''+ymShift(ym,-1)+'\')">‹ 前月</button>'
    +'<div style="flex:1;text-align:center;font-weight:800;font-size:16px">'+ym.replace("-","年")+'月</div>'
    +'<button class="abtn" style="background:#e2e8f0;color:#334155" onclick="openPetty(\''+ymShift(ym,1)+'\')">翌月 ›</button></div>';
  // 残高カード（支給・補充 − 使用 ＝ 残高）
  h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">'
    +pettyCard("支給・補充","¥"+given.toLocaleString(),"#059669","#f0fdf4")
    +pettyCard("使用","¥"+used.toLocaleString(),"#dc2626","#fef2f2")
    +pettyCard("残高","¥"+bal.toLocaleString(),bal>=0?"#1e40af":"#dc2626",bal>=0?"#eff6ff":"#fef2f2")
    +'</div>';
  if(given===0){h+='<div class="note" style="background:#fffbeb;border-color:#fde68a;color:#92400e">まだ今月の現金が配布されていません。管理者が支給するとここに残高が表示されます。</div>';}
  // 入力フォーム
  h+='<div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:14px">'
    +'<div style="font-weight:800;font-size:13px;margin-bottom:8px">➕ 使った分を記録</div>'
    +'<div style="display:flex;gap:6px;margin-bottom:9px">'
      +'<button type="button" id="pm_cash" onclick="pettyMethod(\'現金\')" style="flex:1;padding:9px;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer;border:2px solid '+(PETTY_METHOD==="現金"?"#059669":"#e2e8f0")+';background:'+(PETTY_METHOD==="現金"?"#f0fdf4":"#fff")+';color:'+(PETTY_METHOD==="現金"?"#059669":"#94a3b8")+'">💵 現金</button>'
      +'<button type="button" id="pm_card" onclick="pettyMethod(\'カード\')" style="flex:1;padding:9px;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer;border:2px solid '+(PETTY_METHOD==="カード"?"#2563eb":"#e2e8f0")+';background:'+(PETTY_METHOD==="カード"?"#eff6ff":"#fff")+';color:'+(PETTY_METHOD==="カード"?"#2563eb":"#94a3b8")+'">💳 カード</button>'
    +'</div>'
    +'<div style="font-size:11px;color:#64748b;margin-bottom:8px">'+(PETTY_METHOD==="カード"?"💳 カード払い＝会計「カード」タブに自動反映（現金残高は減りません）":"💵 現金払い＝小口現金の残高から差し引かれます")+'</div>'
    +'<div style="display:flex;gap:8px;margin-bottom:8px"><input id="p_date" type="date" value="'+jstToday()+'" style="flex:1;padding:9px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px"><input id="p_amt" type="number" inputmode="numeric" placeholder="金額" style="width:110px;padding:9px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px"></div>'
    +'<input id="p_desc" type="text" placeholder="用途（例：JR / 地下鉄 / バス / 駐車場）" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;margin-bottom:8px">'
    +'<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#475569;margin-bottom:10px">📎 領収書（写真）<input id="p_file" type="file" accept="image/*" onchange="pettyPick(event)" style="font-size:12px"></label>'
    +'<div id="p_fname" style="font-size:11px;color:#64748b;margin-bottom:8px"></div>'
    +'<button id="p_save" class="parkbtn" style="margin:0" onclick="pettyAdd()">💾 記録する</button>'
    +'</div>';
  // 一覧
  h+='<div class="sechd">📒 今月の記録<span class="cnt">'+PETTY_ROWS.length+'件</span></div>';
  if(!PETTY_ROWS.length){h+='<div class="empty">まだ記録がありません</div>';}
  else{
    h+=PETTY_ROWS.map(function(r){
      var isTop=(r.kind==="topup");
      if(isTop){
        return '<div style="display:flex;align-items:center;gap:8px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:9px 11px;margin-bottom:6px">'
          +'<div style="flex:1"><div style="font-weight:700;font-size:14px;color:#166534">➕ '+esc(r.description||"現金支給・補充")+'</div>'
          +'<div style="font-size:11px;color:#86a692">'+esc(r.date||"")+' ・ 管理者</div></div>'
          +'<div style="font-weight:800;color:#059669;font-size:15px">+¥'+(+r.amount||0).toLocaleString()+'</div></div>';
      }
      var rc=r.receipt_url?('<a href="'+esc(r.receipt_url)+'" target="_blank" rel="noopener" style="color:#2563eb;font-weight:700;text-decoration:none">📎領収書</a>'):'<span style="color:#f59e0b;font-weight:700">📎未添付</span>';
      var isCard=(r.kind==="card");
      return '<div style="display:flex;align-items:center;gap:8px;background:'+(isCard?"#f8fbff":"#fff")+';border:1px solid '+(isCard?"#dbeafe":"#eef2f7")+';border-radius:10px;padding:9px 11px;margin-bottom:6px">'
        +'<div style="flex:1"><div style="font-weight:700;font-size:14px">'+(isCard?'<span style="font-size:10px;font-weight:800;color:#2563eb;background:#eff6ff;border:1px solid #bfdbfe;border-radius:5px;padding:1px 5px;margin-right:5px">💳カード</span>':'')+esc(r.description||"(用途なし)")+'</div>'
        +'<div style="font-size:11px;color:#94a3b8">'+esc(r.date||"")+' ・ '+rc+(isCard?' ・ <span style="color:#2563eb">会計カードへ反映</span>':'')+'</div></div>'
        +'<div style="font-weight:800;color:#dc2626;font-size:15px">−¥'+(+r.amount||0).toLocaleString()+'</div>'
        +'<button onclick="pettyDel(\''+esc(r.id)+'\')" style="background:none;border:none;color:#cbd5e1;font-size:16px;cursor:pointer;padding:2px 4px">🗑</button>'
        +'</div>';
    }).join("");
  }
  setContent(h);
}
function pettyCard(l,v,c,bg){return '<div style="background:'+bg+';border-radius:10px;padding:10px 6px;text-align:center"><div style="font-size:10px;color:#64748b;font-weight:600">'+l+'</div><div style="font-weight:900;font-size:16px;color:'+c+';margin-top:2px">'+v+'</div></div>';}
window.pettyPick=function(ev){var f=ev.target.files&&ev.target.files[0];PETTY_FILE=f||null;var e=document.getElementById("p_fname");if(e)e.textContent=f?("選択: "+f.name):"";};
window.pettyMethod=function(m){ // 現金/カード切替（入力値を保持して再描画）
  var d=(document.getElementById("p_date")||{}).value, a=(document.getElementById("p_amt")||{}).value, s=(document.getElementById("p_desc")||{}).value;
  PETTY_METHOD=m; renderPetty();
  var pd=document.getElementById("p_date"),pa=document.getElementById("p_amt"),ps=document.getElementById("p_desc"),pf=document.getElementById("p_fname");
  if(pd&&d)pd.value=d; if(pa&&a)pa.value=a; if(ps&&s)ps.value=s; if(pf&&PETTY_FILE)pf.textContent="選択: "+PETTY_FILE.name;
};
window.pettyAdd=function(){
  var nm=pettyName();
  var date=(document.getElementById("p_date")||{}).value||jstToday();
  var amt=parseInt(((document.getElementById("p_amt")||{}).value||"").replace(/[^0-9]/g,""),10);
  var desc=((document.getElementById("p_desc")||{}).value||"").trim();
  if(!amt||amt<=0){alert("金額を入力してください");return;}
  var btn=document.getElementById("p_save");if(btn){btn.disabled=true;btn.textContent="保存中…";}
  var id="petty_"+PETTY_YM.replace("-","")+"_"+Date.now()+"_"+Math.floor(Math.random()*1000);
  function insert(receiptUrl,receiptName){
    var isCard=(PETTY_METHOD==="カード");
    var row={id:id,staff_name:nm,ym:PETTY_YM,date:date,kind:isCard?"card":"expense",description:desc,amount:amt,receipt_url:receiptUrl||"",receipt_name:receiptName||""};
    fetch(SB+"/rest/v1/spk_petty_cash",{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify(row)})
      .then(function(r){ if(!r.ok)throw new Error("save");
        // ★本体会計へ自動反映：現金→出納帳(cash_out/現金)、カード→会計カードタブ(card_pay/クレジットカード)。id=pc_+小口id で紐付け→削除も同期
        var acc=isCard
          ? {id:"pc_"+id,date:date,type:"card_pay",category:"旅費交通費",sub_category:"",description:desc||"カード払い",amount:amt,input_by:nm,staff_name:nm,memo:"スタッフ入力（カード）"+(receiptUrl?"・領収書あり":""),pay_method:"クレジットカード",resv_no:"",url:receiptUrl||"",paid:false}
          : {id:"pc_"+id,date:date,type:"cash_out",category:"旅費交通費",sub_category:"",description:desc||"小口現金",amount:amt,input_by:nm,staff_name:nm,memo:"小口現金"+(receiptUrl?"（領収書あり）":""),pay_method:"現金",resv_no:"",url:receiptUrl||"",paid:false};
        fetch(SB+"/rest/v1/spk_accounting",{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json","Prefer":"return=minimal,resolution=merge-duplicates"},body:JSON.stringify(acc)}).catch(function(){});
        PETTY_FILE=null; openPetty(PETTY_YM); })
      .catch(function(){ if(btn){btn.disabled=false;btn.textContent="💾 記録する";} alert("保存に失敗しました。通信を確認してもう一度お試しください。"); });
  }
  if(PETTY_FILE){
    var f=PETTY_FILE, ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
    var path="r/"+PETTY_YM+"/"+id+"."+ext; // ★Storageキーは日本語不可(Invalid key)→ASCIIのみ(id)。氏名はreceipt_nameに保持
    fetch(SB+"/storage/v1/object/petty-receipts/"+path,{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":f.type||"image/jpeg","x-upsert":"true"},body:f})
      .then(function(r){ if(!r.ok)throw new Error("up"); insert(SB+"/storage/v1/object/public/petty-receipts/"+path,f.name); })
      .catch(function(){ insert("",""); /* 画像失敗でも記録は残す（後で添付可） */ });
  }else{ insert("",""); }
};
window.pettyDel=function(id){
  if(!confirm("この記録を削除しますか？"))return;
  fetch(SB+"/rest/v1/spk_petty_cash?id=eq."+encodeURIComponent(id)+"&staff_name=eq."+encodeURIComponent(pettyName()),{method:"DELETE",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Prefer":"return=minimal"}})
    .then(function(){
      // 本体会計のミラー行も同期削除
      fetch(SB+"/rest/v1/spk_accounting?id=eq."+encodeURIComponent("pc_"+id),{method:"DELETE",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Prefer":"return=minimal"}}).catch(function(){});
      openPetty(PETTY_YM); })
    .catch(function(){ alert("削除に失敗しました"); });
};

  LASTD=d;

}

// ===== 🗓 出勤簿（閲覧＋先の月の休み希望入力） =====
var SHSYM={'●':{l:'出勤',c:'#2563eb',bg:'#D4EBFA'},'公':{l:'公休',c:'#64748b',bg:'#E8E8E8'},'希':{l:'希望休',c:'#b45309',bg:'#FFF3CD'},'有':{l:'有休',c:'#15803d',bg:'#dcfce7'},'出':{l:'出張',c:'#6d28d9',bg:'#ede9fe'}};
var SHDATA=null;
window.openShift=function(ym){
  MODE="shift";STAB="shift";
  ym=ym||jstToday().slice(0,7);
  busy("出勤簿を読み込み中…");
  fetch(SB+"/rest/v1/rpc/spk_staff_shifts",{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},body:JSON.stringify({p_token:TOKEN,p_ym:ym})})
    .then(function(r){return r.json();})
    .then(function(d){ if(!d||d.ok===false){setContent('<div class="err" style="margin:16px 0">⚠️ 出勤簿の読み込みに失敗しました<br><button onclick="openShift(\''+ym+'\')">再読み込み</button></div>');return;} MODE="shift"; SHDATA=d; renderShift(d); })
    .catch(function(){setContent('<div class="err" style="margin:16px 0">⚠️ 通信エラー<br><button onclick="openShift(\''+ym+'\')">再読み込み</button></div>');});
};
window.sendWish=function(date,on,pattern){
  var pk=document.getElementById("wishpick"); if(pk)pk.remove();
  var el=document.getElementById("cell-"+date); if(el){el.style.opacity=.5;el.style.pointerEvents="none";}
  var body={p_token:TOKEN,p_date:date,p_on:on}; if(pattern)body.p_pattern=pattern;
  fetch(SB+"/rest/v1/rpc/spk_staff_wish",{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||d.ok===false){ alert("⚠️ "+((d&&d.msg)||"登録できませんでした")); }
      openShift((SHDATA&&SHDATA.ym)||date.slice(0,7));
    })
    .catch(function(){ alert("通信エラー。もう一度お試しください"); openShift((SHDATA&&SHDATA.ym)||date.slice(0,7)); });
};
// 休み希望のパターン選択シート（①午前のみ不可 ②午後のみ不可 ③終日不可 ＋取消）

  var h='<div id="wishpick" onclick="if(event.target===this)this.remove()" style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9999;display:flex;align-items:flex-end;justify-content:center">'
    +'<div style="background:#fff;width:100%;max-width:420px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))">'
    +'<div style="text-align:center;font-weight:900;font-size:16px;color:#92400e;margin-bottom:4px">'+md+' の休み希望</div>'

    +btn('am','① 午前のみ出勤不可','午前だけ休み希望（午後は出勤可）')
    +btn('pm','② 午後のみ出勤不可','午後だけ休み希望（午前は出勤可）')
    +btn('full','③ 終日 出勤不可','1日まるごと休み希望')
    +(curPattern!==null?'<button onclick="sendWish(\''+date+'\',false)" style="display:block;width:100%;margin:4px 0 8px;padding:11px;border-radius:12px;border:1px solid #fecaca;background:#fff;font-size:14px;font-weight:800;color:#dc2626">🗑 この日の希望を取消</button>':'')
    +'<button onclick="var e=document.getElementById(\'wishpick\');if(e)e.remove()" style="display:block;width:100%;padding:11px;border-radius:12px;border:1px solid #e2e8f0;background:#f8fafc;font-size:14px;font-weight:700;color:#64748b">閉じる</button>'
    +'</div></div>';
  document.body.insertAdjacentHTML("beforeend",h);
};
function renderShift(d){
  MODE="shift";
  var ym=d.ym||jstToday().slice(0,7);var today=d.today||jstToday();
  var editable=!!d.editable;
  var map={};(d.shifts||[]).forEach(function(s){map[s.date]=s;});
  var yy=+ym.slice(0,4),mm=+ym.slice(5,7);
  var first=new Date(yy,mm-1,1),ndays=new Date(yy,mm,0).getDate(),off=first.getDay();
  var work=(d.shifts||[]).filter(function(s){return s.symbol==='●'||(!s.symbol&&s.start);}).length;
  var wish=(d.shifts||[]).filter(function(s){return s.symbol==='希';}).length;
  var h='<div style="font-weight:800;font-size:15px;color:#059669;margin:2px 2px 8px">🗓 出勤簿</div>';
  h+='<div style="display:flex;align-items:center;gap:8px;margin:10px 0">'
    +'<button class="abtn" style="background:#e2e8f0;color:#334155" onclick="openShift(\''+ymShift(ym,-1)+'\')">‹ 前月</button>'
    +'<div style="flex:1;text-align:center;font-weight:800;font-size:16px">'+ym.replace("-","年")+'月</div>'
    +'<button class="abtn" style="background:#e2e8f0;color:#334155" onclick="openShift(\''+ymShift(ym,1)+'\')">翌月 ›</button></div>';
  // 凡例
  h+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">';
  Object.keys(SHSYM).forEach(function(k){var s=SHSYM[k];h+='<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:'+s.bg+';color:'+s.c+'">'+k+' '+s.l+'</span>';});
  h+='</div>';
  if(editable){
    h+='<div class="note" style="background:#fffbeb;border-color:#fde68a;color:#92400e">✏️ <b>先の月です。</b>休みたい日をタップすると <b>①午前のみ不可／②午後のみ不可／③終日不可</b> から希望休を選べます（もう一度タップで変更・取消）。<br>すでに出勤・公休などの予定が入っている日は変更できません。</div>';
  }else{
    h+='<div class="note">👀 閲覧専用です。休み希望は<b>先の月</b>から入力できます（「翌月 ›」で移動）。</div>';
  }
  // カレンダー
  var wd=['日','月','火','水','木','金','土'];
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">';
  wd.forEach(function(w,i){h+='<div style="text-align:center;font-size:11px;font-weight:800;padding:4px 0;color:'+(i===0?'#dc2626':i===6?'#2563eb':'#64748b')+'">'+w+'</div>';});
  for(var i=0;i<off;i++){h+='<div></div>';}
  for(var day=1;day<=ndays;day++){
    var ds=ym+'-'+("0"+day).slice(-2);var s=map[ds];var sym=s?s.symbol:'';
    if(!sym&&s&&s.start){sym='●';}
    var isToday=(ds===today);var dow=new Date(yy,mm-1,day).getDay();
    var cfg=SHSYM[sym];var bg=cfg?cfg.bg:'#fff';var bd=isToday?'2px solid #059669':'1px solid #e2e8f0';
    var canTap=editable&&(sym===''||sym==='希');
    var inner='<div style="font-size:12px;font-weight:800;color:'+(dow===0?'#dc2626':dow===6?'#2563eb':'#334155')+'">'+day+'</div>';
    var wmemo=(sym==='希'&&s)?String(s.memo||''):'';
    var wlabel=(wmemo==='AM'||wmemo==='①'||wmemo==='午前')?'①午前不可':(wmemo==='PM'||wmemo==='②'||wmemo==='午後')?'②午後不可':'③終日不可';
    if(cfg){inner+='<div style="font-size:11px;font-weight:800;color:'+cfg.c+';margin-top:2px">'+sym+'</div>';
      if(sym==='希'){inner+='<div style="font-size:8px;font-weight:800;color:#b45309;line-height:1.1">'+wlabel+'</div>';}
      if(sym==='●'&&s.start){inner+='<div style="font-size:8px;color:#475569;line-height:1.15">'+esc((s.start||'').slice(0,5))+(s.end?'<br>〜'+esc((s.end||'').slice(0,5)):'')+'</div>';}
    }else if(!sym&&s&&s.start){inner+='<div style="font-size:8px;color:#94a3b8;margin-top:2px;line-height:1.15">'+esc((s.start||'').slice(0,5))+(s.end?'<br>〜'+esc((s.end||'').slice(0,5)):'')+'</div>';}
    if(canTap&&sym==='希'){inner+='<div style="font-size:8px;color:#b45309;margin-top:1px">タップで変更</div>';}
    else if(canTap){inner+='<div style="font-size:8px;color:#cbd5e1;margin-top:1px">＋休</div>';}
    var curPat=(sym==='希')?((wmemo==='AM'||wmemo==='①')?'am':(wmemo==='PM'||wmemo==='②')?'pm':'full'):null;
    var tap=canTap?(' onclick="openWishPick(\''+ds+'\','+(curPat?'\''+curPat+'\'':'null')+')" style="cursor:pointer"'):'';
    h+='<div id="cell-'+ds+'"'+tap+' style="min-height:52px;border:'+bd+';border-radius:8px;background:'+bg+';padding:3px 2px 2px;text-align:center;'+(canTap?'':'opacity:'+(editable?'.75':'1'))+'">'+inner+'</div>';
  }
  h+='</div>';
  h+='<div style="margin-top:12px;display:flex;gap:8px;text-align:center">'
    +'<div style="flex:1;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:8px"><div style="font-size:11px;color:#1d4ed8;font-weight:700">出勤予定</div><div style="font-size:22px;font-weight:900;color:#1d4ed8">'+work+'<span style="font-size:12px">日</span></div></div>'
    +'<div style="flex:1;background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:8px"><div style="font-size:11px;color:#b45309;font-weight:700">希望休</div><div style="font-size:22px;font-weight:900;color:#b45309">'+wish+'<span style="font-size:12px">日</span></div></div></div>';
  setContent(h);
}

function load(){
  if(!TOKEN){showErr("URLが正しくありません（token無し）");return;}
  var ctrl=new AbortController();var to=setTimeout(function(){ctrl.abort();},15000);
  fetch(SB+"/rest/v1/rpc/spk_staff_view",{method:"POST",signal:ctrl.signal,
    headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},
    body:JSON.stringify({p_token:TOKEN})})
  .then(function(r){return r.json();})
  .then(function(d){clearTimeout(to);
    if(!d||d.ok===false){showErr(d&&d.error==="invalid_token"?"このURLは無効です（担当者へ連絡してください）":"読み込みに失敗しました");return;}
    fetchLic(d);})
  .catch(function(e){clearTimeout(to);showErr("通信エラー。電波を確認して再読み込みしてください");});
}
// 🪪 免許証提出状況を license_uploads からバッチ取得（お届け/回収の予約番号のみ・anon読取OK）→ 取得後に描画
function fetchLic(d){
  try{
    var relev={DEL:1,PU:1,PUB:1,"来店":1,"PUB来店":1,COL:1,BD:1,BDB:1,"返却":1};
    var rids={};
    (d.tasks||[]).forEach(function(x){ if(x.resv&&relev[x.type||""]) rids[x.resv]=1; });
    var list=Object.keys(rids);
    if(!list.length){ window.LICMAP={}; render(d); return; }
    var inq=list.map(function(r){return '"'+String(r).replace(/"/g,"")+'"';}).join(",");
    fetch(SB+"/rest/v1/license_uploads?select=reservation_id,cnt&store=eq.spk&reservation_id=in.("+encodeURIComponent(inq)+")",
      {headers:{"apikey":ANON,"Authorization":"Bearer "+ANON}})
      .then(function(r){return r.json();})
      .then(function(rows){ var m={}; (rows||[]).forEach(function(row){ if((row.cnt||0)>0) m[row.reservation_id]=1; }); window.LICMAP=m; render(d); })
      .catch(function(){ window.LICMAP=window.LICMAP||{}; render(d); });
  }catch(e){ render(d); }
}
// ===== ⏰ タイムカード打刻 =====
var PCDATA=null;var PCCLK=null;
function pcRpc(fn,body,cb){
  fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){return r.json();}).then(cb).catch(function(){cb({ok:false,msg:"通信エラー"});});
}
window.openPunch=function(){
  MODE="punch";STAB="punch";
  if(PCCLK){clearInterval(PCCLK);PCCLK=null;}
  busy("読み込み中…");
  pcRpc("spk_staff_timecard",{p_token:TOKEN},function(d){
    if(!d||d.ok===false){setContent('<div class="err" style="margin:16px 0">⚠️ '+esc(d&&d.error==="invalid_token"?"このURLは無効です":"読み込みに失敗しました")+'<br><button onclick="openPunch()">再読み込み</button></div>');return;}
    PCDATA=d;renderPunch();
  });
};
function pcRefresh(){ pcRpc("spk_staff_timecard",{p_token:TOKEN},function(d){ if(d&&d.ok!==false){PCDATA=d;renderPunch();} }); }
function jstNowHM(){var n=new Date(Date.now()+9*3600*1000);return ("0"+n.getUTCHours()).slice(-2)+":"+("0"+n.getUTCMinutes()).slice(-2);}
function jstClockStr(){var n=new Date(Date.now()+9*3600*1000);return ("0"+n.getUTCHours()).slice(-2)+":"+("0"+n.getUTCMinutes()).slice(-2)+":"+("0"+n.getUTCSeconds()).slice(-2);}
window.doPunch=function(action,label){
  if(!window.confirm(label+" を記録します。よろしいですか？"))return;
  pcRpc("spk_staff_punch",{p_token:TOKEN,p_action:action,p_time:jstNowHM()},function(d){
    if(!d||d.ok===false){ alert("⚠️ "+((d&&d.msg)||"記録できませんでした")); }
    pcRefresh();
  });
};
function renderPunch(){
  MODE="punch";STAB="punch";
  var d=PCDATA||{};
  var brk=Array.isArray(d.breaks)?d.breaks:[];
  var hasIn=!!(d.start);var hasOut=!!(d.end);
  var onBreak=brk.length>0 && !(brk[brk.length-1].end);
  // 状態: 未出勤 / 勤務中 / 休憩中 / 退勤済
  var st = hasOut?"done":(onBreak?"onbreak":(hasIn?"working":"none"));
  var stLabel={none:{t:"未出勤",bg:"#f1f5f9",c:"#64748b"},working:{t:"勤務中",bg:"#dcfce7",c:"#15803d"},onbreak:{t:"休憩中",bg:"#dbeafe",c:"#1d4ed8"},done:{t:"本日は退勤済み",bg:"#fee2e2",c:"#b91c1c"}}[st];
  var h='<div style="font-weight:800;font-size:15px;color:#1e3a8a;margin:2px 2px 6px">⏰ タイムカード打刻</div>';
  h+='<div class="pc-clock"><div class="pc-time" id="pcClock">'+jstClockStr()+'</div><div class="pc-date">'+shortDate(d.date||jstToday())+'（'+jpWd(d.date||jstToday())+'）</div></div>';
  h+='<div style="text-align:center;margin:4px 0 6px"><span class="pc-status-pill" style="background:'+stLabel.bg+';color:'+stLabel.c+'">'+stLabel.t+'</span></div>';
  // 4大ボタン
  var canIn=(st==="none");var canOut=(st==="working");var canBs=(st==="working");var canBe=(st==="onbreak");
  h+='<div class="pc-grid">'
    +'<button class="pc-btn in" '+(canIn?'':'disabled')+' onclick="doPunch(\'in\',\'出勤\')"><span class="pc-ic">🟢</span>出勤</button>'
    +'<button class="pc-btn out" '+(canOut?'':'disabled')+' onclick="doPunch(\'out\',\'退勤\')"><span class="pc-ic">🔴</span>退勤</button>'
    +'<button class="pc-btn bs" '+(canBs?'':'disabled')+' onclick="doPunch(\'break_start\',\'休憩開始\')"><span class="pc-ic">☕</span>休憩開始</button>'
    +'<button class="pc-btn be" '+(canBe?'':'disabled')+' onclick="doPunch(\'break_end\',\'休憩終了\')"><span class="pc-ic">✅</span>休憩終了</button>'
    +'</div>';
  // 今日の状態
  h+='<div class="pc-state">';
  h+='<div class="pc-row"><span class="pc-lb">🟢 出勤</span><span class="pc-vl'+(hasIn?'':' dim')+'">'+(d.start||'—')+'</span></div>';
  brk.forEach(function(b,i){ h+='<div class="pc-brk">☕ 休憩'+(i+1)+'　'+(b.start||'—')+' 〜 '+(b.end||'（休憩中）')+'</div>'; });
  h+='<div class="pc-row"><span class="pc-lb">🔴 退勤</span><span class="pc-vl'+(hasOut?'':' dim')+'">'+(d.end||'—')+'</span></div>';
  h+='</div>';
  // 修正申請
  h+='<button class="pc-fix-btn" onclick="openFixReq()">✏️ 打刻を間違えた・押し忘れた（修正申請）</button>';
  var reqs=(d.requests||[]).filter(function(r){return r.status==="pending";});
  if(reqs.length){
    h+='<div class="pc-reqbox"><div style="font-size:12px;font-weight:800;color:#92400e;margin-bottom:4px">✏️ 申請中（店舗の承認待ち）</div>';
    reqs.forEach(function(r){
      var bn=(r.break_index!=null)?("休憩"+(r.break_index+1)+" "):"休憩";
      var fl=r.field==="start"?"出勤":r.field==="end"?"退勤":(r.field==="break"?(bn+(r.sub==="break_end"?"終了":"開始")):"");
      h+='<div class="pc-req">'+fl+'：'+(r.old_value||"（未打刻）")+' → <b>'+esc(r.new_value)+'</b>'+(r.reason?'　（'+esc(r.reason)+'）':'')+'</div>';
    });
    h+='</div>';
  }
  h+='<div class="note" style="margin-top:12px">打刻した時刻がそのまま勤務実績になります。シフトに入っていない日でも打刻できます。間違えたら「修正申請」から直してください（店舗が確認して確定します）。</div>';
  setContent(h);
  if(PCCLK){clearInterval(PCCLK);}
  PCCLK=setInterval(function(){var el=document.getElementById("pcClock");if(el&&MODE==="punch"){el.textContent=jstClockStr();}else{clearInterval(PCCLK);PCCLK=null;}},1000);
}
// 修正申請シート（当日だけでなく過去の勤務日も選んで申請できる）
var FXDATA=null; // 現在申請対象の日の打刻データ（当日 or 過去日）
window.openFixReq=function(){
  var d=PCDATA||{};
  FXDATA=d; // 初期は当日
  // 対象日プルダウン：直近30日で打刻/シフトがある日（recent_dates）＋当日を必ず含める
  var today=d.today||jstToday();
  var recent=Array.isArray(d.recent_dates)?d.recent_dates.slice():[];
  if(recent.indexOf(today)<0)recent.unshift(today);
  var dOpts='';recent.forEach(function(dt){
    var lb=shortDate(dt)+'（'+jpWd(dt)+'）'+(dt===today?' — 本日':'');
    dOpts+='<option value="'+dt+'"'+(dt===(d.date||today)?' selected':'')+'>'+lb+'</option>';
  });
  var minDate=addDays(today,-60);
  var h='<div class="pc-modal" id="pcFix" onclick="if(event.target===this)this.remove()"><div class="pc-sheet">'
    +'<div style="text-align:center;font-weight:900;font-size:16px;color:#0f172a;margin-bottom:4px">✏️ 打刻の修正申請</div>'
    +'<div style="text-align:center;font-size:11px;color:#94a3b8;margin-bottom:8px">対象の勤務日を選び、直したい打刻と正しい時刻・理由を入力してください</div>'
    +'<label>対象の勤務日</label><select id="fxDate" onchange="fxDateChange(this.value)">'+dOpts+'</select>'
    +'<div style="font-size:11px;color:#94a3b8;margin:2px 0 6px">一覧に無い過去日（押し忘れで記録が無い日）はこちら → <input id="fxDatePick" type="date" max="'+today+'" min="'+minDate+'" onchange="if(this.value)fxDateChange(this.value)" style="font-size:14px;padding:4px 6px;border:1px solid #cbd5e1;border-radius:6px" /></div>'
    +'<div id="fxBody">'+fxBodyHtml(FXDATA)+'</div>'
    +'<button class="pc-submit" onclick="submitFixReq()">この内容で申請する</button>'
    +'<button class="pc-cancel" onclick="var e=document.getElementById(\'pcFix\');if(e)e.remove()">キャンセル</button>'
    +'</div></div>';
  document.body.insertAdjacentHTML("beforeend",h);
  fxSetDefaultTime();
};
// 対象日の打刻状態に応じた「どの打刻を直すか／正しい時刻」部分のHTML
function fxBodyHtml(d){
  d=d||{};var brk=Array.isArray(d.breaks)?d.breaks:[];
  var opts='<option value="start">🟢 出勤時刻</option><option value="end">🔴 退勤時刻</option>';
  brk.forEach(function(b,i){
    opts+='<option value="bs'+i+'">☕ 休憩'+(i+1)+' 開始</option>';
    opts+='<option value="be'+i+'">☕ 休憩'+(i+1)+' 終了</option>';
  });
  opts+='<option value="addbs">➕ 休憩を追加 — 開始（押し忘れ）</option>';
  opts+='<option value="addbe">➕ 休憩を追加 — 終了（押し忘れ）</option>';
  var tOpts='';for(var hh=0;hh<24;hh++){for(var mm=0;mm<60;mm+=15){var t=("0"+hh).slice(-2)+":"+("0"+mm).slice(-2);tOpts+='<option value="'+t+'">'+t+'</option>';}}
  // 現在の打刻状況の要約（未打刻の日でも安心して申請できるよう見せる）
  var sm='<div style="font-size:11px;color:#64748b;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:7px 9px;margin:2px 0 6px">'
    +'現在の記録：出勤 <b>'+(d.start||'—')+'</b> ／ 退勤 <b>'+(d.end||'—')+'</b>'
    +(brk.length?'　'+brk.map(function(b,i){return '休憩'+(i+1)+' '+(b.start||'—')+'-'+(b.end||'…');}).join('　'):'　休憩 なし')
    +'</div>';
  return sm
    +'<label>どの打刻を直しますか？</label><select id="fxTarget" onchange="fxTargetChange()">'+opts+'</select>'
    +'<div id="fxAddNote" style="display:none;font-size:11px;color:#0d9488;background:#f0fdfa;border:1px solid #99f6e4;border-radius:8px;padding:7px 9px;margin:2px 0 4px">押し忘れて休憩の打刻が無い場合に使います。開始・終了を別々に申請してください（両方承認されると休憩1回分になります）。</div>'
    +'<label>正しい時刻</label><select id="fxTime">'+tOpts+'</select>'
    +'<label>理由</label><input id="fxReason" type="text" placeholder="例：押し忘れ / 押し間違い" />';
}
function fxSetDefaultTime(){
  var ft=document.getElementById("fxTime");if(!ft)return;
  var n=jstNowHM();ft.value=n.slice(0,3)+((+n.slice(3,5)<15)?"00":(+n.slice(3,5)<30)?"15":(+n.slice(3,5)<45)?"30":"45");
}
// 対象日を変えたら、その日の打刻状態を取得して申請フォームを組み直す
window.fxDateChange=function(date){
  if(!date)return;
  var body=document.getElementById("fxBody");if(body)body.innerHTML='<div style="text-align:center;color:#94a3b8;padding:14px">読み込み中…</div>';
  // プルダウンとピッカーの表示を同期
  var sel=document.getElementById("fxDate");if(sel){var found=false;for(var i=0;i<sel.options.length;i++){if(sel.options[i].value===date){sel.selectedIndex=i;found=true;break;}}if(!found){var o=document.createElement("option");o.value=date;o.textContent=shortDate(date)+'（'+jpWd(date)+'）';sel.insertBefore(o,sel.firstChild);sel.value=date;}}
  pcRpc("spk_staff_timecard",{p_token:TOKEN,p_date:date},function(d){
    if(!d||d.ok===false){var b=document.getElementById("fxBody");if(b)b.innerHTML='<div style="color:#dc2626;padding:10px">読み込みに失敗しました</div>';return;}
    FXDATA=d;var b=document.getElementById("fxBody");if(b){b.innerHTML=fxBodyHtml(d);fxSetDefaultTime();}
  });
};
// 「休憩を追加」を選んだ時だけ案内を表示
window.fxTargetChange=function(){
  var tgt=(document.getElementById("fxTarget")||{}).value||"";
  var note=document.getElementById("fxAddNote");
  if(note)note.style.display=(tgt.indexOf("add")===0)?"block":"none";
};
window.submitFixReq=function(){
  var d=FXDATA||PCDATA||{};var tgt=document.getElementById("fxTarget").value;
  var brk=Array.isArray(d.breaks)?d.breaks:[];
  var tm=document.getElementById("fxTime").value;var reason=document.getElementById("fxReason").value||"";
  var body={p_token:TOKEN,p_date:d.date,p_new_value:tm,p_reason:reason};
  if(tgt==="start"){body.p_field="start";}
  else if(tgt==="end"){body.p_field="end";}
  else if(tgt.indexOf("bs")===0){body.p_field="break";body.p_sub="break_start";body.p_break_index=+tgt.slice(2);}
  else if(tgt.indexOf("be")===0){body.p_field="break";body.p_sub="break_end";body.p_break_index=+tgt.slice(2);}
  // ＋休憩を追加：break_index = 既存件数（末尾に新規休憩を足す申請）
  else if(tgt==="addbs"){body.p_field="break";body.p_sub="break_start";body.p_break_index=brk.length;}
  else if(tgt==="addbe"){body.p_field="break";body.p_sub="break_end";body.p_break_index=brk.length;}
  var e=document.getElementById("pcFix");if(e)e.remove();
  pcRpc("spk_staff_timecard_request",body,function(r){
    if(!r||r.ok===false){ alert("⚠️ "+((r&&r.msg)||"申請できませんでした")); }
    else{ alert("✅ 修正申請を送信しました。店舗の確認をお待ちください。"); }
    pcRefresh();
  });
};
load();
setInterval(function(){if(!document.hidden&&TOKEN&&MODE==="tasks")load();},30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&MODE==="tasks")load();});
</script>
