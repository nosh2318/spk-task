<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#f1f5f9;color:#0f172a;font-size:14px}
header{background:#0f1f45;color:#fff;padding:12px 16px;position:sticky;top:0;z-index:10}

.fld label{display:block;font-size:12px;color:#64748b;margin-bottom:3px}
.fld input{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;text-align:right;font-size:16px}
.hrow{display:flex;gap:10px;padding:7px 2px;border-bottom:1px solid #f1f5f9;font-size:12px;align-items:baseline}
.hrow .hts{color:#64748b;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.hrow .hch{color:#0f172a}
.histbl{font-size:11px;white-space:nowrap;border-collapse:collapse;min-width:100%}
.histbl th,.histbl td{padding:3px 6px;border:1px solid #e5eaf1;text-align:right;font-variant-numeric:tabular-nums}
.histbl td.cls{text-align:left;font-weight:800;background:#fbfdff}
.histbl td.knd{text-align:left;white-space:nowrap}
.histbl th{background:#f1f5f9;color:#334155;font-weight:800}
.histbl th.rev{background:#0f1f45;color:#fff}
.histbl th.rev.cur{background:#0f766e}
.histbl tr.hi td{background:#fff7ed}
.histbl td.chg{text-align:left;color:#64748b;white-space:normal;min-width:180px;max-width:260px;font-size:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;z-index:200;opacity:0;transition:.3s}

.authbar{font-size:11px;padding:6px 10px;border-radius:8px;margin-bottom:8px}
.authbar.ok{background:#dcfce7;color:#166534}
</style></head><body>

<script>
var MAIN={url:'https://ckrxttbnawkclshczsia.supabase.co',anon:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8',key:'sb-ckrxttbnawkclshczsia-auth-token'};
var BT={url:'https://ggqugvyskyiblxiycpci.supabase.co',anon:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18',key:'sb-ggqugvyskyiblxiycpci-auth-token'};
var DBOF={spk:MAIN,nha:MAIN,tkm:BT};

var STORE='nha', PRICE={spk:null,nha:null,tkm:null}, ORIG={spk:'',nha:'',tkm:''}, winStart=null;
var START='2026-10'; // 販売開始月＝カレンダーはここから

function curYM(){var n=new Date();return n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2);}
function ymShift(ym,n){var y=+ym.split('-')[0],m=+ym.split('-')[1]-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+('0'+(m+1)).slice(-2);}
function winMove(n){var nx=ymShift(winStart||START,n*4);if(nx<START)nx=START;winStart=nx;refreshCal();}
function tok(db){try{var t=JSON.parse(localStorage.getItem(db.key));if(t&&t.access_token&&(!t.expires_at||t.expires_at>Math.floor(Date.now()/1000)))return t.access_token;}catch(e){}return null;}
function authH(db){var t=tok(db);return 'Bearer '+(t||db.anon);}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},2200);}
function nowStr(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}

// ---- 祝日計算（ハッピーマンデー/春分秋分/振替/国民の休日） ----
function jpHol(y){
  var h={},pad=function(m,d){return y+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2)};
  var nthMon=function(m,n){var d=1+((8-new Date(y,m-1,1).getDay())%7)+(n-1)*7;return d};
  h[pad(1,1)]='元日';h[pad(1,nthMon(1,2))]='成人の日';h[pad(2,11)]='建国';h[pad(2,23)]='天皇誕生日';
  var shun=Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4));h[pad(3,shun)]='春分';
  h[pad(4,29)]='昭和';h[pad(5,3)]='憲法';h[pad(5,4)]='みどり';h[pad(5,5)]='こども';
  h[pad(7,nthMon(7,3))]='海';h[pad(8,11)]='山';h[pad(9,nthMon(9,3))]='敬老';
  var shubun=Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4));h[pad(9,shubun)]='秋分';
  h[pad(10,nthMon(10,2))]='スポーツ';h[pad(11,3)]='文化';h[pad(11,23)]='勤労感謝';
  var ks=Object.keys(h);ks.forEach(function(k){var dt=new Date(k+'T00:00:00');if(dt.getDay()===0){var n=new Date(dt);do{n.setDate(n.getDate()+1)}while(h[fmt(n)]);h[fmt(n)]='振替'}});
  for(var m=1;m<=12;m++){for(var d=1;d<=31;d++){var c=new Date(y,m-1,d);if(c.getMonth()!==m-1)continue;var p=new Date(c),nx=new Date(c);p.setDate(d-1);nx.setDate(d+1);if(!h[fmt(c)]&&c.getDay()!==0&&c.getDay()!==6&&h[fmt(p)]&&h[fmt(nx)])h[fmt(c)]='国民';}}
  return h;
}
function fmt(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function isRest(d,hol){return d.getDay()===0||d.getDay()===6||!!hol[fmt(d)]}
function longWeekends(y){
  var hol=jpHol(y),out={},d=new Date(y,0,1),end=new Date(y+1,1,15);
  while(d<=end){
    if(isRest(d,hol)){
      var run=[],c=new Date(d);
      while(c<=end&&isRest(c,hol)){run.push(fmt(c));c.setDate(c.getDate()+1)}
      if(run.length>=3){run.forEach(function(x){out[x]=1});var pv=new Date(run[0]+'T00:00:00');pv.setDate(pv.getDate()-1);out[fmt(pv)]=1;}
      d=c;
    }else d.setDate(d.getDate()+1);
  }
  return Object.keys(out).sort();
}
function months4(){
  var s=winStart||START;var y=+s.split('-')[0],mo=+s.split('-')[1],out=[];
  for(var i=0;i<4;i++){out.push(y+'-'+('0'+mo).slice(-2));mo++;if(mo>12){mo=1;y++;}}
  return out;
}

async function req(db,method,path,body){
  var o={method:method,headers:{apikey:db.anon,Authorization:authH(db),'Content-Type':'application/json'}};
  if(body)o.body=JSON.stringify(body);
  if(method!=='GET')o.headers.Prefer='return=representation';
  var r=await fetch(db.url+'/rest/v1/'+path,o);var t=await r.text();
  return {ok:r.ok,status:r.status,data:t?JSON.parse(t):null};
}
async function load(){
  var m=await req(MAIN,'GET','app_settings?key=eq.hdm_official_price&select=value');
  if(m.ok&&m.data&&m.data[0]){var v=JSON.parse(m.data[0].value);PRICE.spk=v.spk;PRICE.nha=v.nha;}
  var b=await req(BT,'GET','bt_app_settings?key=eq.hdm_official_price&select=value');
  if(b.ok&&b.data&&b.data[0]){var vb=JSON.parse(b.data[0].value);PRICE.tkm=vb.tkm;}
  ['spk','nha','tkm'].forEach(function(s){if(PRICE[s])ORIG[s]=snap(PRICE[s]);});
  render();
}
function sw(s){STORE=s;document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.s===s)});render();}

function render(){
  var ab=document.getElementById('authbar');ab.className='authbar ok';ab.innerHTML='🔓 ログイン不要で保存できます（3店ともこの画面で設定OK）';
  var P=PRICE[STORE];
  if(!P){document.getElementById('body').innerHTML='<div class="card">価格データが未設定です。</div>';return;}
  var ins=P.insurance||{cdw:1100,noc:1650},seat=P.seat||{child:1100,junior:550};
  var html=priceTable()
   +'<div id="calwrap">'+calMulti()+'</div>'
   +'<div class="card"><h2>🛡 補償（1日あたり）</h2><div class="sub2">'
   +'<div class="fld"><label>免責補償 CDW</label><input type="number" step="50" value="'+ins.cdw+'" onchange="setIns(\'cdw\',this.value)"></div>'
   +'<div class="fld"><label>'+(STORE==='tkm'?'フル補償 NOC':'NOC補償')+'</label><input type="number" step="50" value="'+ins.noc+'" onchange="setIns(\'noc\',this.value)"></div>'
   +'</div></div>'
   +'<div class="card"><h2>🪑 シート（1個・1日あたり）</h2><div class="sub2">'
   +'<div class="fld"><label>チャイルドシート</label><input type="number" step="50" value="'+seat.child+'" onchange="setSeat(\'child\',this.value)"></div>'
   +'<div class="fld"><label>ジュニアシート</label><input type="number" step="50" value="'+seat.junior+'" onchange="setSeat(\'junior\',this.value)"></div>'
   +'</div></div>'
   +'<button class="btn save" onclick="save()">💾 この店（'+({spk:'札幌',nha:'那覇',tkm:'高松'})[STORE]+'）を保存して公式サイトに反映</button>'
   +histView();
  document.getElementById('body').innerHTML=html;
}

// 💴 クラス別 安い日/高い日
function priceTable(){
  var P=PRICE[STORE];
  var rows=Object.keys(P.price).map(function(c){
    var cv=P.price[c]||{};
    return '<tr><td class="cls"><b>'+(CLS_LABEL[c]||c)+'</b></td>'
     +'<td><input class="pv" type="number" step="100" value="'+(cv.a||'')+'" onchange="setP(\''+c+'\',\'a\',this.value)"></td>'
     +'<td><input class="pv b" type="number" step="100" value="'+(cv.b||'')+'" onchange="setP(\''+c+'\',\'b\',this.value)"></td></tr>';
  }).join('');
  return '<div class="card"><h2>💴 クラス別 1日料金</h2>'
   +'<div class="muted">安い日＝通常。高い日＝下のカレンダーで選んだ日（連休など）。</div>'
   +'<table><tr><th></th><th>🔵 安い日（¥）</th><th>🟧 高い日（¥）</th></tr>'+rows+'</table></div>';
}
function setP(c,k,v){PRICE[STORE].price[c]=PRICE[STORE].price[c]||{};PRICE[STORE].price[c][k]=parseInt(v,10)||0;}
function setIns(k,v){PRICE[STORE].insurance=PRICE[STORE].insurance||{};PRICE[STORE].insurance[k]=parseInt(v,10)||0;}
function setSeat(k,v){PRICE[STORE].seat=PRICE[STORE].seat||{};PRICE[STORE].seat[k]=parseInt(v,10)||0;}

// 📅 高い日カレンダー（4ヶ月）
function calOne(ym){
  var P=PRICE[STORE],hd=P.high_dates||[];
  var y=+ym.split('-')[0],mo=+ym.split('-')[1],hol=jpHol(y);
  var start=new Date(y,mo-1,1).getDay(),dim=new Date(y,mo,0).getDate();
  var cells='';for(var i=0;i<start;i++)cells+='<div class="day empty"></div>';
  for(var d=1;d<=dim;d++){var dt=new Date(y,mo-1,d),k=fmt(dt),cl='day',high=hd.indexOf(k)>=0;
    if(dt.getDay()===0||hol[k])cl+=' hol';else if(dt.getDay()===6)cl+=' sat';
    if(high)cl+=' B';
    cells+='<div class="'+cl+'" onclick="togB(\''+k+'\')">'+d+(hol[k]?'<small>'+hol[k]+'</small>':'')+'</div>';}
  var hcnt=hd.filter(function(x){return x.slice(0,7)===ym;}).length;
  return '<div class="mcal"><h3>'+y+'年'+mo+'月 <span class="mbadge">高い'+hcnt+'日</span></h3>'
   +'<div class="cal"><div class="dow">日</div><div class="dow">月</div><div class="dow">火</div><div class="dow">水</div><div class="dow">木</div><div class="dow">金</div><div class="dow">土</div>'+cells+'</div></div>';
}
function calMulti(){
  var ms=months4(),P=PRICE[STORE],hTot=(P.high_dates||[]).length;
  return '<div class="card"><h2>📅 高い日カレンダー（4ヶ月ごと）</h2>'
   +'<div class="muted">日付タップで 通常⇄高い を切替。オレンジ＝高い日。連休などを高いに設定してください。</div>'
   +winNav()
   +'<div style="margin:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
   +'<button class="btn ghost sm" onclick="autoB()">🎌 連休を自動で高いに</button>'
   +'<button class="btn ghost sm" onclick="clrB()">全解除</button>'
   +'<span class="mbadge">高い '+hTot+'日</span></div>'
   +'<div class="m4grid">'+ms.map(calOne).join('')+'</div></div>';
}
function winNav(){
  var ms=months4(),s=ms[0],e=ms[ms.length-1];
  var atStart=(winStart||START)<=START;
  var noNext=ymShift(s,4)>ymShift(START,24);
  return '<div class="winnav"><button class="btn ghost sm" onclick="winMove(-1)"'+(atStart?' disabled':'')+'>◀ 前の4ヶ月</button><b>'+s+' 〜 '+e+'</b><button class="btn ghost sm" onclick="winMove(1)"'+(noNext?' disabled':'')+'>次の4ヶ月 ▶</button></div>';
}
function refreshCal(){var e=document.getElementById('calwrap');if(e)e.innerHTML=calMulti();}
function togB(k){var hd=PRICE[STORE].high_dates||[];var i=hd.indexOf(k);if(i>=0)hd.splice(i,1);else hd.push(k);hd.sort();PRICE[STORE].high_dates=hd;refreshCal();}
function autoB(){var y=new Date().getFullYear();var set={};(PRICE[STORE].high_dates||[]).forEach(function(x){set[x]=1});longWeekends(y).forEach(function(x){set[x]=1});longWeekends(y+1).forEach(function(x){set[x]=1});PRICE[STORE].high_dates=Object.keys(set).sort();refreshCal();toast('連休・連休前日を高いに設定しました');}
function clrB(){PRICE[STORE].high_dates=[];refreshCal();}

// 📜 変更履歴
function snap(P){return JSON.stringify({price:P.price,high_dates:P.high_dates,insurance:P.insurance,seat:P.seat});}
function diffChanges(oldS,P){
  var o={};try{o=JSON.parse(oldS)}catch(e){}var ch=[];
  Object.keys(P.price||{}).forEach(function(c){
    var np=P.price[c]||{},op=(o.price||{})[c]||{};
    if((op.a||0)!==(np.a||0))ch.push((CLS_LABEL[c]||c)+' 安い '+(op.a||0).toLocaleString()+'→'+(np.a||0).toLocaleString());
    if((op.b||0)!==(np.b||0))ch.push((CLS_LABEL[c]||c)+' 高い '+(op.b||0).toLocaleString()+'→'+(np.b||0).toLocaleString());
  });
  var oh=(o.high_dates||[]).length,nh=(P.high_dates||[]).length;
  if(oh!==nh)ch.push('高い日 '+oh+'→'+nh+'日');
  var oi=o.insurance||{},ni=P.insurance||{};
  if((oi.cdw||0)!==(ni.cdw||0))ch.push('免責 '+(oi.cdw||0)+'→'+(ni.cdw||0));
  if((oi.noc||0)!==(ni.noc||0))ch.push('NOC '+(oi.noc||0)+'→'+(ni.noc||0));
  var os=o.seat||{},ns=P.seat||{};
  if((os.child||0)!==(ns.child||0))ch.push('ﾁｬｲﾙﾄﾞ '+(os.child||0)+'→'+(ns.child||0));
  if((os.junior||0)!==(ns.junior||0))ch.push('ｼﾞｭﾆｱ '+(os.junior||0)+'→'+(ns.junior||0));
  return ch;
}
// 📜 価格履歴＝クラス×泊数料金 を「改定日ごと」に横並び（左＝現在／右へ過去）
var NIGHTS=[['日帰り',1],['1泊2日',2],['2泊3日',3],['3泊4日',4],['4泊5日',5]];
function histView(){
  var P=PRICE[STORE];
  // 列＝現在＋各改定スナップショット（新しい順）
  var cols=[{ts:'現在',changes:'',price:P.price}];
  (P.history||[]).forEach(function(e){if(e.snap&&e.snap.price)cols.push({ts:e.ts,changes:e.changes||'',price:e.snap.price});});
  var classes=Object.keys(P.price);
  var yen=function(n){return '¥'+(n||0).toLocaleString();};
  // ヘッダー2段（改定日→泊数）
  var h1='<tr><th rowspan="2">クラス</th><th rowspan="2">種別</th>';
  cols.forEach(function(c,i){h1+='<th class="rev'+(i===0?' cur':'')+'" colspan="'+NIGHTS.length+'">'+(i===0?'🟢 現在':c.ts)+'</th>';});
  h1+='</tr><tr>';
  cols.forEach(function(){NIGHTS.forEach(function(n){h1+='<th>'+n[0]+'</th>';});});
  h1+='</tr>';
  // 本体：クラス×(安い/高い)
  var body=classes.map(function(cl){
    var r='';
    [['🔵 安い日','a',''],['🟧 高い日','b','hi']].forEach(function(t){
      r+='<tr'+(t[2]?' class="hi"':'')+'><td class="cls">'+(CLS_LABEL[cl]||cl)+'</td><td class="knd">'+t[0]+'</td>';
      cols.forEach(function(c){
        var pc=(c.price||{})[cl]||{},u=+pc[t[1]]||+pc.a||0;
        NIGHTS.forEach(function(n){r+='<td>'+yen(u*n[1])+'</td>';});
      });
      r+='</tr>';
    });
    return r;
  }).join('');
  // 改定メモ行（何を変えたか）
  var memo='';
  if(cols.length>1){
    memo='<div class="muted" style="margin-top:8px">📝 改定メモ：'
     +cols.slice(1).map(function(c){return '<b>'+c.ts+'</b> '+(c.changes||'');}).join('　／　')+'</div>';
  }
  return '<div class="card"><h2>📜 価格履歴（クラス×泊数・改定日ごと）</h2>'
   +'<div class="muted">1日単価×泊数で表示。安い日＝全日通常、高い日＝全日高い設定の目安です。価格を保存するたび右側に履歴が積まれます。</div>'
   +'<div style="overflow-x:auto;margin-top:8px"><table class="histbl">'+h1+body+'</table></div>'+memo+'</div>';
}

async function save(){
  var db=DBOF[STORE],tbl=TBLOF[STORE];
  var changes=diffChanges(ORIG[STORE],PRICE[STORE]);
  if(changes.length){
    PRICE[STORE].history=PRICE[STORE].history||[];
    PRICE[STORE].history.unshift({ts:nowStr(),changes:changes.join(' / '),snap:{price:JSON.parse(JSON.stringify(PRICE[STORE].price)),high:(PRICE[STORE].high_dates||[]).length}});
    PRICE[STORE].history=PRICE[STORE].history.slice(0,50);
  }
  // 旧構造の名残(months/proposals/_market/research_dates)は保存時に除去してクリーンに
  delete PRICE[STORE].months;delete PRICE[STORE].proposals;delete PRICE[STORE]._market;delete PRICE[STORE].research_dates;
  var payload;
  if(db===MAIN){
    var cur=await req(MAIN,'GET','app_settings?key=eq.hdm_official_price&select=value');
    var obj=(cur.ok&&cur.data&&cur.data[0])?JSON.parse(cur.data[0].value):{};
    obj[STORE]=PRICE[STORE];payload=obj;
  }else{
    var curb=await req(BT,'GET','bt_app_settings?key=eq.hdm_official_price&select=value');
    var objb=(curb.ok&&curb.data&&curb.data[0])?JSON.parse(curb.data[0].value):{};
    objb.tkm=PRICE.tkm;payload=objb;
  }
  var r=await req(db,'POST',tbl,{key:'hdm_official_price',value:JSON.stringify(payload)});
  if(!r.ok){r=await req(db,'PATCH',tbl+'?key=eq.hdm_official_price',{value:JSON.stringify(payload)});}
  if(r.ok){ORIG[STORE]=snap(PRICE[STORE]);render();toast(changes.length?'✅ 保存しました（'+changes.length+'件の変更を履歴に記録）':'✅ 保存しました（変更なし）');}
  else toast('⚠️ 保存失敗（'+r.status+'）');
}
load();
</script></body></html>
