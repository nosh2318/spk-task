// ---- 祝日計算（ハッピーマンデー/春分秋分/振替/国民の休日） ----
function jpHol(y){
  var h={},pad=function(m,d){return y+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2)};
  var nthMon=function(m,n){var d=1+((8-new Date(y,m-1,1).getDay())%7)+(n-1)*7;return d};
  h[pad(1,1)]='元日';h[pad(1,nthMon(1,2))]='成人の日';h[pad(2,11)]='建国';h[pad(2,23)]='天皇誕生日';
  var shun=Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4));h[pad(3,shun)]='春分';
  h[pad(4,29)]='昭和';h[pad(5,3)]='憲法';h[pad(5,4)]='みどり';h[pad(5,5)]='こども';
  h[pad(7,nthMon(7,3))]='海';h[pad(8,11)]='山';h[pad(9,nthMon(9,3))]='敬老';
  var shubun=Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4));h[pad(9,shubun)]='秋分';
  h[pad(10,nthMon(10,2))]='スポーツ';h[pad(11,3)]='文化';h[pad(11,23)]='勤労感謝';
  // 振替休日
  var ks=Object.keys(h);ks.forEach(function(k){var dt=new Date(k+'T00:00:00');if(dt.getDay()===0){var n=new Date(dt);do{n.setDate(n.getDate()+1)}while(h[fmt(n)]);h[fmt(n)]='振替'}});
  // 国民の休日（2祝日に挟まれた平日）
  for(var m=1;m<=12;m++){for(var d=1;d<=31;d++){var c=new Date(y,m-1,d);if(c.getMonth()!==m-1)continue;var p=new Date(c),nx=new Date(c);p.setDate(d-1);nx.setDate(d+1);if(!h[fmt(c)]&&c.getDay()!==0&&c.getDay()!==6&&h[fmt(p)]&&h[fmt(nx)])h[fmt(c)]='国民';}}
  return h;
}
function fmt(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function isRest(d,hol){return d.getDay()===0||d.getDay()===6||!!hol[fmt(d)]}
// 連休(3連休以上)＋連休前日 の候補日を返す
function longWeekends(y){
  var hol=jpHol(y),out={},d=new Date(y,0,1),end=new Date(y+1,1,15);
  while(d<=end){
    if(isRest(d,hol)){
      var run=[],c=new Date(d);
      while(c<=end&&isRest(c,hol)){run.push(fmt(c));c.setDate(c.getDate()+1)}
      if(run.length>=3){run.forEach(function(x){out[x]=1});var pv=new Date(run[0]+'T00:00:00');pv.setDate(pv.getDate()-1);out[fmt(pv)]=1;}
      d=c;
    }else d.setDate(d.getDate()+1);
  }
  return Object.keys(out).sort();
}

async function req(db,method,path,body){
  var o={method:method,headers:{apikey:db.anon,Authorization:authH(db),'Content-Type':'application/json'}};
  if(body)o.body=JSON.stringify(body);
  if(method!=='GET')o.headers.Prefer='return=representation';
  var r=await fetch(db.url+'/rest/v1/'+path,o);var t=await r.text();
  return {ok:r.ok,status:r.status,data:t?JSON.parse(t):null};
}

function calOne(ym){
  var P=PRICE[STORE],hd=P.high_dates||[],rd=P.research_dates||[];
  var y=+ym.split('-')[0],mo=+ym.split('-')[1],hol=jpHol(y);
  var first=new Date(y,mo-1,1),start=first.getDay(),dim=new Date(y,mo,0).getDate();
  var fn=(calMode==='research')?'togR':'togB';
  var cells='';for(var i=0;i<start;i++)cells+='<div class="day empty"></div>';
  for(var d=1;d<=dim;d++){var dt=new Date(y,mo-1,d),k=fmt(dt),cl='day',high=hd.indexOf(k)>=0,res=rd.indexOf(k)>=0;
    if(dt.getDay()===0||hol[k])cl+=' hol';else if(dt.getDay()===6)cl+=' sat';
    if(high)cl+=' B';
    if(res)cl+=' R';
    cells+='<div class="'+cl+'" onclick="'+fn+'(\''+k+'\')">'+d+(res?'<span class="rmk">🔍</span>':'')+(hol[k]?'<small>'+hol[k]+'</small>':'')+'</div>';}
  var hcnt=hd.filter(function(x){return x.slice(0,7)===ym;}).length;
  var rcnt=rd.filter(function(x){return x.slice(0,7)===ym;}).length;
  var badge=(calMode==='research')?'<span class="mbadge dim">🔍調査'+rcnt+'日</span>':'<span class="mbadge dim">高い'+hcnt+'日</span>';
  return '<div class="mcal"><h3>'+y+'年'+mo+'月 '+badge+'</h3>'
   +'<div class="cal sm"><div class="dow">日</div><div class="dow">月</div><div class="dow">火</div><div class="dow">水</div><div class="dow">木</div><div class="dow">金</div><div class="dow">土</div>'+cells+'</div></div>';
}

var MIN_DAYS=2; // 提案には高い日・通常日を最低2日ずつ調査が必要
// 🔍 調査：直近4ヶ月ぶんの提案を作成（既存の市場データから）。★人が採用で止める＝提案止め

   .then(function(list){
     if(!P.proposals)P.proposals={};P._market=P._market||{};
     var ok=[],ng=[];
     list.forEach(function(x){
       if(x.res&&x.res.market&&Object.keys(x.res.market).length)P._market[x.ym]=x.res.market;
       if(x.res&&x.res.props&&Object.keys(x.res.props).length){P.proposals[x.ym]=x.res.props;ok.push(x.ym);}

     });

     if(ng.length)msg+='　／調査データ不足：'+ng.join('/')+'（🔄再調査で取得）';

// 価格調査→クラス別提案。高い日/通常日それぞれの市場（top10とmedの中間＝市場ポジション）から、通常＝通常日市場・高い＝連休日市場を算出。
// 最低「高い2日・通常2日」なければ提案しない。高い>通常を保証。marketは設定vs市場の乖離アラート用に返す。
// ★全自動化時：proposeを定期実行しadoptを自動発火に置換。
function loadMarketProposal(store,ym){
  var P=PRICE[store];
  var high=(P.high_dates||[]);
  return fetch(MAIN.url+'/rest/v1/rpc/market_proposal',{method:'POST',headers:{'apikey':MAIN.anon,'Authorization':'Bearer '+MAIN.anon,'Content-Type':'application/json'},body:JSON.stringify({p_store:store,p_ym:ym,p_high:high})})
   .then(function(r){return r.json();})
   .then(function(stats){
     if(!stats||typeof stats!=='object'||!Object.keys(stats).length)return {props:{},market:{},short:[]};
     var props={},market={},short=[];
     var r100=function(v){return Math.round(v/100)*100;};
     var mref=function(t10,med){t10=t10||med;med=med||t10;return (t10&&med)?(t10+med)/2:(t10||med);};
     var masterA=function(c){var m=((P.months[ym]||{})[c]||{}).a;return (m!=null?m:P.price[c].a)||0;};
     // クラスの上下関係はマスター(運営設定=正)で固定。市場からは①水準(全体) ②連休プレミアム(高い/通常比)だけ取る＝逆転・潰れを防止
     var sumMkt=0,sumMas=0,gaps=[];
     Object.keys(P.price).forEach(function(c){
       var s=stats[c];if(!s)return;
       var mn=mref(s.n_top10,s.n_med), mh=mref(s.h_top10,s.h_med);
       if(mn)market[c]={n:Math.round(mn),h:Math.round(mh||mn)};
       // 水準/ギャップの算出に使うのは「高い日・通常日 各2日以上」揃ったクラスのみ
       if((s.n_cnt||0)>=MIN_DAYS&&(s.h_cnt||0)>=MIN_DAYS&&mn&&mh&&masterA(c)){
         sumMkt+=mn; sumMas+=masterA(c); gaps.push(mh/mn);
       }else{short.push(CLS_LABEL[c]||c);}
     });
     if(!gaps.length||!sumMas)return {props:{},market:market,short:['データ不足（高い日/通常日 各2日以上が必要）']};
     var level=sumMkt/sumMas; // 市場水準÷現行水準
     gaps.sort(function(a,b){return a-b;});
     var gap=Math.max(1.05, gaps[Math.floor(gaps.length/2)]); // 連休プレミアム(中央値・最低+5%でギャップ保証)
     // 全クラスをマスター価格×水準で提案＝クラス階層を保ったまま市場連動。高い=通常×連休プレミアム
     Object.keys(P.price).forEach(function(c){
       if(!masterA(c))return;
       var a=r100(masterA(c)*level);
       props[c]={a:a, b:r100(a*gap)};
     });
     return {props:props,market:market,short:short};
   });
}

async function save(){

  if(db===MAIN){ // {spk,nha} 両方入りを保持して更新
