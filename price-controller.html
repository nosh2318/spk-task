// ---- 祝日計算（ハッピーマンデー/春分秋分/振替/国民の休日） ----
function jpHol(y){
  var h={},pad=function(m,d){return y+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2)};
  var nthMon=function(m,n){var d=1+((8-new Date(y,m-1,1).getDay())%7)+(n-1)*7;return d};
  h[pad(1,1)]='元日';h[pad(1,nthMon(1,2))]='成人の日';h[pad(2,11)]='建国';h[pad(2,23)]='天皇誕生日';
  var shun=Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4));h[pad(3,shun)]='春分';
  h[pad(4,29)]='昭和';h[pad(5,3)]='憲法';h[pad(5,4)]='みどり';h[pad(5,5)]='こども';
  h[pad(7,nthMon(7,3))]='海';h[pad(8,11)]='山';h[pad(9,nthMon(9,3))]='敬老';
  var shubun=Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4));h[pad(9,shubun)]='秋分';
  h[pad(10,nthMon(10,2))]='スポーツ';h[pad(11,3)]='文化';h[pad(11,23)]='勤労感謝';
  var ks=Object.keys(h);ks.forEach(function(k){var dt=new Date(k+'T00:00:00');if(dt.getDay()===0){var n=new Date(dt);do{n.setDate(n.getDate()+1)}while(h[fmt(n)]);h[fmt(n)]='振替'}});
  for(var m=1;m<=12;m++){for(var d=1;d<=31;d++){var c=new Date(y,m-1,d);if(c.getMonth()!==m-1)continue;var p=new Date(c),nx=new Date(c);p.setDate(d-1);nx.setDate(d+1);if(!h[fmt(c)]&&c.getDay()!==0&&c.getDay()!==6&&h[fmt(p)]&&h[fmt(nx)])h[fmt(c)]='国民';}}
  return h;
}
function fmt(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function isRest(d,hol){return d.getDay()===0||d.getDay()===6||!!hol[fmt(d)]}
function longWeekends(y){
  var hol=jpHol(y),out={},d=new Date(y,0,1),end=new Date(y+1,1,15);
  while(d<=end){
    if(isRest(d,hol)){
      var run=[],c=new Date(d);
      while(c<=end&&isRest(c,hol)){run.push(fmt(c));c.setDate(c.getDate()+1)}
      if(run.length>=3){run.forEach(function(x){out[x]=1});var pv=new Date(run[0]+'T00:00:00');pv.setDate(pv.getDate()-1);out[fmt(pv)]=1;}
      d=c;
    }else d.setDate(d.getDate()+1);
  }
  return Object.keys(out).sort();
}
function months4(){
  var s=winStart||START;var y=+s.split('-')[0],mo=+s.split('-')[1],out=[];
  for(var i=0;i<4;i++){out.push(y+'-'+('0'+mo).slice(-2));mo++;if(mo>12){mo=1;y++;}}
  return out;
}

  if(method!=='GET')o.headers.Prefer='return=representation';
  var r=await fetch(db.url+'/rest/v1/'+path,o);var t=await r.text();
  return {ok:r.ok,status:r.status,data:t?JSON.parse(t):null};
}

  return out;}
async function saveStore(s){
  // ① 競合チェック：読み込み後に他の人（別担当・スクリプト）が変えていたら止める＝他人の調整を消さない
  var db=DBOF[s],tbl=TBLOF[s];
  var cur=await req(db,'GET',tbl+'?key=eq.'+KEYOF[s]+'&select=value');
  var live=(cur.ok&&cur.data&&cur.data[0])?JSON.parse(cur.data[0].value)[s]:null;
  var conflict=live&&JSON.stringify(live)!==ORIG_RAW[s];
  var oldP=JSON.parse(ORIG_RAW[s]||'{}'),newP=buildPayload(s);
  return {ok:true,conflict:conflict,live:live,site:siteDiff(oldP,newP),ota:otaDiff(oldP,newP),payload:newP};
}
async function save(){
  if(WRITE_ENABLED){var w=await realSave(STORE);toast(w.msg);if(w.ok)render();return;}
  var r=await saveStore(STORE);
  var msg='【見本のため保存はしていません】\n\n';
  if(r.conflict){var h=(r.live.history||[])[0]||{};msg+='⚠️ この画面を開いた後に、他の人が価格を変更しています（最新：'+(h.ts||'')+' '+((h.changes||'').slice(0,80))+'）。\n本番では保存を止め、再読み込みをお願いする画面になります。\n\n';}
  msg+='■ 公式サイトで料金が変わる日（今月から'+HORIZON+'ヶ月）：'+r.site.length+'件\n'+(r.site.slice(0,40).join('\n')||'（なし）')+(r.site.length>40?'\n…ほか'+(r.site.length-40)+'件':'')
     +'\n\n■ OTAの3段（記録のみ・公式サイトには効かない）：'+r.ota.length+'件\n'+(r.ota.slice(0,20).join('\n')||'（なし）')+(r.ota.length>20?'\n…ほか'+(r.ota.length-20)+'件':'');
  alert(msg);
}
// ===================== ①保存（ドッキング時に WRITE_ENABLED=true にする） =====================
var WRITE_ENABLED=true; // 本番（ドッキング版）
// ★2026-10-22 公式の基本料金（TL/TR/TH）が空のクラスがあれば保存しない（空だと公式HPで0円表示のおそれ）。
//  販売していない月（INACTIVE / INACTIVE_FROM）は見ない＝那覇C・S、札幌11月以降のH は空でも止めない。
function emptyBase(s){
  var off=((PRICE[s]||{}).channels||{}).official||{},t=off.tiers||{},ym0=curYM(),out=[];
  var ina=function(c,ym){var f=(INACTIVE_FROM[s]||{})[c];if(f)return ym>=f;return !!((INACTIVE[s]||{})[c]);};
  clsKeys(off.price||{}).forEach(function(c){var need={};
    for(var i=0;i<HORIZON;i++){var ym=ymShift(ym0,i);if(!ina(c,ym))need[tierOf(ym)]=1;}
    var miss=['L','R','H'].filter(function(k){var v=(t[c]||{})[k];return need[k]&&(v==null||v===''||isNaN(+v));});
    if(miss.length)out.push(c+'クラス（'+miss.map(TN).join('・')+'）');});
  return out;
}
async function realSave(s){
  var eb=(s==='bdc')?[]:emptyBase(s);
  if(eb.length)return {ok:false,msg:'⚠️ '+eb.join('、')+'の基本料金が空です。入力してから保存してください（保存していません）'};
  var r=await saveStore(s);
  if(r.conflict)return {ok:false,msg:'この画面を開いた後に、他の人が価格を変更しています。再読み込みしてから、もう一度変更してください。'};
  var db=DBOF[s],tbl=TBLOF[s],P=r.payload;
  var ch=r.site.concat(r.ota);
  var items=changeItems(normCopy(ORIG_RAW[s],s),PRICE[s]);
  if(ch.length||items.length){P.history=P.history||[];P.history.unshift({ts:nowStr(),items:items,changes:ch.slice(0,30).join(' / ')+(ch.length>30?' ほか'+(ch.length-30)+'件':''),snap:{channels:JSON.parse(JSON.stringify(P.channels||{})),high:(P.high_dates||[]).length}});keepHist(P);}
  var cur=await req(db,'GET',tbl+'?key=eq.'+KEYOF[s]+'&select=value');
  var obj=(cur.ok&&cur.data&&cur.data[0])?JSON.parse(cur.data[0].value):{};
  var exists=!!(cur.ok&&cur.data&&cur.data[0]);
  if((exists?JSON.stringify(obj[s]):'')!==ORIG_RAW[s])return {ok:false,msg:'保存の直前に他の人が変更しました。再読み込みしてください。'};
  obj[s]=P;
  var w=exists?await req(db,'PATCH',tbl+'?key=eq.'+KEYOF[s],{value:JSON.stringify(obj)}):await req(db,'POST',tbl,{key:KEYOF[s],value:JSON.stringify(obj)});
  if(!w.ok)return {ok:false,msg:'保存に失敗しました（'+w.status+'）。何も変わっていません。'};
  ORIG_RAW[s]=JSON.stringify(P);
  if(ch.length&&s!=='bdc'){try{fetch(MAIN.url+'/functions/v1/price-notify',{method:'POST',headers:{'Authorization':'Bearer '+MAIN.anon,'apikey':MAIN.anon,'Content-Type':'application/json'},body:JSON.stringify({store:s,changes:ch.slice(0,30)})}).catch(function(){});}catch(e){}}
  return {ok:true,msg:'✅ 保存しました（'+ch.length+'件）'};
}

// ===================== OTAの「段ごとの値段」（入力リスト・比較で共通） =====================
// 段：基本 L/R/H ／ 安い日 L1〜L9・LO・LN・LD（その月に安い日がある時だけ）／ 高い日 HN・HG・HB・HS（その期間に高い日がある時だけ）
var LOOK=12; // 今月から12ヶ月を見る
function tierPrices(P,k){
  var ch=(P.channels||{})[k]||{},out={},ym0=curYM();
  var lows={},highs={};
  for(var i=0;i<LOOK;i++){var ym=ymShift(ym0,i);
    if((P.low_dates||[]).some(function(d){return d.slice(0,7)===ym;}))lows[ym]=1;
    (P.high_dates||[]).forEach(function(d){if(d.slice(0,7)===ym){var nm=highName(d);if(nm==='HX')nm='HX '+(+ym.slice(5))+'月';highs[nm]=highs[nm]||ym;}});}
  Object.keys(ch.price||{}).forEach(function(c){
    if(inactS(c)||!chanHas(k,c))return;
    var t=(ch.tiers||{})[c]||{},p=(ch.price||{})[c]||{},row={};
    ['L','R','H'].forEach(function(x){if(t[x]!=null&&t[x]!=='')row[TN(x)]=+t[x];});
    Object.keys(lows).forEach(function(ym){var m=((ch.months||{})[ym]||{})[c]||{},v=(m.a!=null?m.a:p.a);if(v==null)v=t[tierOf(ym)];if(v!=null)row[LOW_NAME[+ym.slice(5)]]=+v;});
    Object.keys(highs).forEach(function(nm){var ym=highs[nm],m=((ch.months||{})[ym]||{})[c]||{},v=(m.b!=null?m.b:p.b);if(v==null)v=t[tierOf(ym)];if(v!=null)row[nm]=+v;});
    out[c]=row;});
  return out;
}
var TIER_ORDER=['TL','TR','TH','L1','L2','L3','L4','L5','L6','L7','L8','L9','LO','LN','LD','HN','HG','HB','HS','HX'];
function tierIdx(t){var i=TIER_ORDER.indexOf(t);if(i<0&&t.indexOf('HX')===0)return TIER_ORDER.indexOf('HX')*100+parseInt(t.slice(3),10);return i*100;}
function tierSort(a,b){return tierIdx(a)-tierIdx(b);}
function saleRate(){var P=PRICE[STORE];return (P.sale_rate!=null?+P.sale_rate:5);}
// セール価格：100円未満切り捨て（整数で計算＝小数の誤差なし）
function salePrice(v,pct){return Math.floor(v*(100-pct)/10000)*100;}

// ===================== ②入力担当用リスト =====================
function inputTab(){
  var P=PRICE[STORE],pct=saleRate();
  var otas=chansOf().filter(function(c){return c.k!=='official';});
  var html='<div class="card"><h2>🧾 入力リスト（入力担当用）</h2>'
   +'<div class="mprice">🏷 セールの割引率 <input type="number" min="0" max="50" step="1" value="'+pct+'" onchange="PRICE[STORE].sale_rate=+this.value;render()"> %　<span class="muted">（セールの日帰り＝通常の日帰り×(100−率)÷100、100円未満切り捨て。1泊2日〜4泊5日＝セールの日帰り×日数）</span></div></div>';
  otas.forEach(function(o){
    var now=tierPrices(P,o.k),ent=((P.channels[o.k]||{}).entered)||null,eV=(ent&&ent.v)||{},rows=[];
    Object.keys(now).forEach(function(c){Object.keys(now[c]).sort(tierSort).forEach(function(t){var a=(eV[c]||{})[t],b=now[c][t];if(a!==b)rows.push({c:c,t:t,a:a,b:b});});});
    var body=rows.map(function(r){return '<tr><td class="cls">'+r.c+'</td><td class="knd"><b>'+r.t+'</b></td><td>'+(r.a==null?'<span style="color:#94a3b8">未登録</span>':'¥'+r.a.toLocaleString())+'</td><td><b>¥'+r.b.toLocaleString()+'</b></td>'
      +NIGHTS.slice(1).map(function(n){return '<td>¥'+(r.b*n[1]).toLocaleString()+'</td>';}).join('')
      +NIGHTS.map(function(n,i){return '<td style="color:#a5524c;background:#faf1f0'+(i===0?';border-left:2px solid #dfb3ae':'')+'">¥'+(salePrice(r.b,pct)*n[1]).toLocaleString()+'</td>';}).join('')+'</tr>';}).join('');
    html+='<div class="card"><h2>'+o.n+'　<span style="font-size:12px;color:'+(rows.length?'#a5524c':'#4f8a5b')+'">'+(rows.length?'入力待ち '+rows.length+'件':'✅ すべて入力済み')+'</span>'
     +'<span style="margin-left:auto;font-size:11px;color:#64748b;font-weight:500">'+(ent?'前回の入力済み：'+ent.ts:'まだ入力済みの記録なし')+'</span></h2>'
     +(rows.length?'<div style="overflow-x:auto"><table class="histbl"><tr><th rowspan="2">クラス</th><th rowspan="2">段</th><th rowspan="2">前<br>（日帰り）</th><th colspan="5">通常</th><th colspan="5" style="background:#f4e4e2;color:#a5524c">セール −'+pct+'%</th></tr><tr>'+NIGHTS.map(function(n){return '<th>'+n[0]+'</th>';}).join('')+NIGHTS.map(function(n){return '<th style="background:#f4e4e2;color:#a5524c">'+n[0]+'</th>';}).join('')+'</tr>'+body+'</table></div>'
       +'<button class="btn sm" style="margin-top:8px;background:#4f8a5b;color:#fff" onclick="markDone(\''+o.k+'\')">✅ '+o.n+' に入れ終わった（入力済み）</button>':'')
     +'</div>';
  });
  return html;
}
function markDone(k){
  var P=PRICE[STORE];P.channels[k].entered={ts:nowStr(),v:tierPrices(P,k)};
  P.input_log=P.input_log||[];P.input_log.unshift({ts:nowStr(),ota:k});P.input_log=P.input_log.slice(0,200);
  render();toast(WRITE_ENABLED?'入力済みにしました':'入力済みにしました（見本のため保存はされません）');
}

// ===================== ④OTA比較 =====================
function cmpTab(){
  var P=PRICE[STORE],otas=chansOf(),tp={};
  otas.forEach(function(o){tp[o.k]=tierPrices(P,o.k);});
  var classes=clsKeys(P.price).filter(function(c){return !inactS(c);});
  var body=classes.map(function(c){
    var names={};otas.forEach(function(o){Object.keys(tp[o.k][c]||{}).forEach(function(t){names[t]=1;});});
    var ts=Object.keys(names).sort(tierSort);
    return ts.map(function(t,i){
      var vals=otas.map(function(o){var v=(tp[o.k][c]||{})[t];if(v!=null&&o.k==='official'&&OTA_INCL_INS[STORE])v=v+((P.insurance||{}).cdw||1100);return v;});
      var nums=vals.filter(function(v){return v!=null;}),mn=Math.min.apply(null,nums),mx=Math.max.apply(null,nums);
      return '<tr>'+(i===0?'<td class="cls" rowspan="'+ts.length+'">'+clsName(c)+'</td>':'')+'<td class="knd"><b>'+t+'</b></td>'
        +vals.map(function(v){return '<td'+(v!=null&&nums.length>1&&v===mn&&mn!==mx?' style="color:#4a6491"':v!=null&&nums.length>1&&v===mx&&mn!==mx?' style="color:#a5524c"':'')+'>'+(v==null?'':'¥'+v.toLocaleString())+'</td>';}).join('')+'</tr>';}).join('');
  }).join('');
  return '<div class="card"><h2>⚖️ OTA比較（日帰り）</h2>'
   +'<div style="overflow-x:auto;margin-top:8px"><table class="histbl"><tr><th>クラス</th><th>段</th>'+otas.map(function(o){return '<th>'+o.n.replace(/^[^ ]+ /,'')+'</th>';}).join('')+'</tr>'+body+'</table></div></div>';
}

document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.dataset.s===STORE)});
if(STORE==='bdc'){var _t=document.querySelector('.tabs');if(_t)_t.style.display='none';var _h=document.querySelector('header h1');if(_h)_h.textContent='BUDDICA TOURISM 価格コントローラー';document.title='BUDDICA TOURISM 価格コントローラー';}
load();
</script></body></html>
