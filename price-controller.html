function tok(db){try{var t=JSON.parse(localStorage.getItem(db.key));if(t&&t.access_token&&(!t.expires_at||t.expires_at>Math.floor(Date.now()/1000)))return t.access_token;}catch(e){}return null;}

// ---- 祝日計算（ハッピーマンデー/春分秋分/振替/国民の休日） ----
function jpHol(y){
  var h={},pad=function(m,d){return y+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2)};
  var nthMon=function(m,n){var d=1+((8-new Date(y,m-1,1).getDay())%7)+(n-1)*7;return d};
  h[pad(1,1)]='元日';h[pad(1,nthMon(1,2))]='成人の日';h[pad(2,11)]='建国';h[pad(2,23)]='天皇誕生日';
  var shun=Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4));h[pad(3,shun)]='春分';
  h[pad(4,29)]='昭和';h[pad(5,3)]='憲法';h[pad(5,4)]='みどり';h[pad(5,5)]='こども';
  h[pad(7,nthMon(7,3))]='海';h[pad(8,11)]='山';h[pad(9,nthMon(9,3))]='敬老';
  var shubun=Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4));h[pad(9,shubun)]='秋分';
  h[pad(10,nthMon(10,2))]='スポーツ';h[pad(11,3)]='文化';h[pad(11,23)]='勤労感謝';
  // 振替休日
  var ks=Object.keys(h);ks.forEach(function(k){var dt=new Date(k+'T00:00:00');if(dt.getDay()===0){var n=new Date(dt);do{n.setDate(n.getDate()+1)}while(h[fmt(n)]);h[fmt(n)]='振替'}});
  // 国民の休日（2祝日に挟まれた平日）
  for(var m=1;m<=12;m++){for(var d=1;d<=31;d++){var c=new Date(y,m-1,d);if(c.getMonth()!==m-1)continue;var p=new Date(c),nx=new Date(c);p.setDate(d-1);nx.setDate(d+1);if(!h[fmt(c)]&&c.getDay()!==0&&c.getDay()!==6&&h[fmt(p)]&&h[fmt(nx)])h[fmt(c)]='国民';}}
  return h;
}
function fmt(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function isRest(d,hol){return d.getDay()===0||d.getDay()===6||!!hol[fmt(d)]}
// 連休(3連休以上)＋連休前日 の候補日を返す
function longWeekends(y){
  var hol=jpHol(y),out={},d=new Date(y,0,1),end=new Date(y+1,1,15);
  while(d<=end){
    if(isRest(d,hol)){
      var run=[],c=new Date(d);
      while(c<=end&&isRest(c,hol)){run.push(fmt(c));c.setDate(c.getDate()+1)}
      if(run.length>=3){run.forEach(function(x){out[x]=1});var pv=new Date(run[0]+'T00:00:00');pv.setDate(pv.getDate()-1);out[fmt(pv)]=1;}
      d=c;
    }else d.setDate(d.getDate()+1);
  }
  return Object.keys(out).sort();
}

async function req(db,method,path,body){
  var o={method:method,headers:{apikey:db.anon,Authorization:authH(db),'Content-Type':'application/json'}};
  if(body)o.body=JSON.stringify(body);
  if(method!=='GET')o.headers.Prefer='return=representation';
  var r=await fetch(db.url+'/rest/v1/'+path,o);var t=await r.text();
  return {ok:r.ok,status:r.status,data:t?JSON.parse(t):null};
}

  render();
}

function calCard(){
  var P=PRICE[STORE],hd=P.high_dates||[];
  if(!calYM){var n=new Date();calYM=n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2);}
  var y=+calYM.split('-')[0],mo=+calYM.split('-')[1],hol=jpHol(y);
  // 高い/通常は全クラス共通（store単位のhigh_dates）＝クラス別表示は廃止
  var first=new Date(y,mo-1,1),start=first.getDay(),dim=new Date(y,mo,0).getDate();
  var cells='';for(var i=0;i<start;i++)cells+='<div class="day empty"></div>';
  for(var d=1;d<=dim;d++){var dt=new Date(y,mo-1,d),k=fmt(dt),cl='day',high=hd.indexOf(k)>=0;
    if(dt.getDay()===0||hol[k])cl+=' hol';else if(dt.getDay()===6)cl+=' sat';
    if(high)cl+=' B';
    cells+='<div class="'+cl+'" onclick="togB(\''+k+'\')">'+d+(hol[k]?'<small>'+hol[k]+'</small>':'')+'<b class="dp">'+(high?'高い':'通常')+'</b></div>';}
  return '<div class="card"><h2>📅 カレンダー（高い日を区切る）</h2>'
   +'<div class="muted">オレンジの日が「高い」。日付タップで通常⇄高いを切替。<b>高い/通常は全クラス共通</b>です（各クラスの金額は上の月別料金で設定）。</div>'
   +'<div style="margin:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
   +'<button class="btn ghost sm" onclick="autoB()">🎌 連休を自動で高いに</button><button class="btn ghost sm" onclick="clrB()">全解除</button></div>'
   +'<div class="calnav"><button class="btn ghost sm" onclick="calMove(-1)">◀</button><b>'+y+'年'+mo+'月</b><button class="btn ghost sm" onclick="calMove(1)">▶</button></div>'
   +'<div class="cal"><div class="dow">日</div><div class="dow">月</div><div class="dow">火</div><div class="dow">水</div><div class="dow">木</div><div class="dow">金</div><div class="dow">土</div>'+cells+'</div>'
   +'<div style="margin-top:8px">高い日 計 '+(hd.length)+'日（全クラス共通）</div></div>';
}
function calMove(n){var y=+calYM.split('-')[0],m=+calYM.split('-')[1]+n;if(m<1){m=12;y--}if(m>12){m=1;y++}calYM=y+'-'+('0'+m).slice(-2);render();}
// カレンダーだけ部分更新（入力欄のフォーカス/入力を保持＝数字入力が飛ばない）
function refreshCal(){var e=document.getElementById('calwrap');if(e)e.innerHTML=calCard();}
function setP(c,k,v){PRICE[STORE].price[c][k]=parseInt(v,10)||0;}
// 月別 料金（通常/高い を月ごとに入力）
function monthCard(){
  var P=PRICE[STORE];if(!P.months)P.months={};
  if(!calYM){var n=new Date();calYM=n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2);}
  var y=+calYM.split('-')[0],mo=+calYM.split('-')[1],mm=P.months[calYM]||{};
  var rows=Object.keys(P.price).map(function(c){
    var def=P.price[c].a,mc=mm[c]||{},av=(mc.a!=null?mc.a:''),bv=(mc.b!=null?mc.b:'');
    var ot=(CLS_OTA[STORE]||{})[c];
    var info=ot?('<div class="clsinfo"><span class="otar">楽天</span>'+(ot.r||'—')+'<br><span class="otaj">じゃらん</span>'+(ot.j||'—')+'</div>'):(STORE==='tkm'?'<div class="clsinfo dim">楽天/じゃらん 実データ蓄積中</div>':'');
    return '<tr><td class="cls"><b>'+(CLS_LABEL[c]||c)+'</b>'+info+'</td>'
     +'<td><input class="pv" type="number" step="100" placeholder="'+def.toLocaleString()+'" value="'+av+'" onchange="setMP(\''+c+'\',\'a\',this.value)"></td>'
     +'<td><input class="pv b" type="number" step="100" placeholder="通常と同じ" value="'+bv+'" onchange="setMP(\''+c+'\',\'b\',this.value)"></td></tr>';
  }).join('');
  return '<div class="card"><h2>💴 月別料金（1日あたり・クラス別）</h2>'
   +'<div class="muted">月を切り替えて、その月の<b>通常</b>と<span class="tagB">高い</span>をクラスごとに入力。通常が空欄なら既定料金（薄字）を使います。どの日を「高い」にするかは下のカレンダーで区切ります。<br>🛒 クラス名の下は<b>楽天・じゃらんが実際にそのクラスを販売している商品名（プラン名）</b>＝実予約データから抽出。「このクラスは楽天/じゃらんでこの名前で売っている」を確認して価格を決められます。</div>'
   +'<div class="calnav"><button class="btn ghost sm" onclick="monthMove(-1)">◀</button><b>'+y+'年'+mo+'月</b><button class="btn ghost sm" onclick="monthMove(1)">▶</button></div>'
   +'<table><tr><th>クラス</th><th><span class="tagA">通常</span></th><th><span class="tagB">高い</span></th></tr>'+rows+'</table></div>';
}
function monthMove(n){calMove(n);}
function setMP(c,ab,v){var P=PRICE[STORE];if(!P.months)P.months={};if(!P.months[calYM])P.months[calYM]={};if(!P.months[calYM][c])P.months[calYM][c]={};
  var n=parseInt(v,10);
  if(v===''||isNaN(n)){delete P.months[calYM][c][ab];if(!Object.keys(P.months[calYM][c]).length)delete P.months[calYM][c];if(!Object.keys(P.months[calYM]).length)delete P.months[calYM];}
  else P.months[calYM][c][ab]=n;
  refreshCal(); // 入力した数字をカレンダーに即反映（入力欄は再描画しない＝入力が飛ばない）
}
function setCalCls(v){calCls=v;refreshCal();}
function setIns(k,v){PRICE[STORE].insurance=PRICE[STORE].insurance||{};PRICE[STORE].insurance[k]=parseInt(v,10)||0;}
function setSeat(k,v){PRICE[STORE].seat=PRICE[STORE].seat||{};PRICE[STORE].seat[k]=parseInt(v,10)||0;}
function togB(k){var hd=PRICE[STORE].high_dates||[];var i=hd.indexOf(k);if(i>=0)hd.splice(i,1);else hd.push(k);hd.sort();PRICE[STORE].high_dates=hd;refreshCal();}
function autoB(){var y=new Date().getFullYear();var set={};(PRICE[STORE].high_dates||[]).forEach(function(x){set[x]=1});longWeekends(y).forEach(function(x){set[x]=1});longWeekends(y+1).forEach(function(x){set[x]=1});PRICE[STORE].high_dates=Object.keys(set).sort();refreshCal();toast('連休・連休前日を高いに設定しました');}
function clrB(){PRICE[STORE].high_dates=[];refreshCal();}

function showLogin(){document.getElementById('lov2').style.display='flex';document.getElementById('le').value=ACCT[STORE];}
async function doLogin(){
  var db=DBOF[STORE],e=document.getElementById('le').value,p=document.getElementById('lp').value,err=document.getElementById('lerr');
  try{var r=await fetch(db.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:db.anon,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});
    var d=await r.json();
    if(d&&d.access_token){localStorage.setItem(db.key,JSON.stringify({access_token:d.access_token,refresh_token:d.refresh_token||'',expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600),token_type:'bearer',user:d.user||{}}));document.getElementById('lov2').style.display='none';render();toast('ログインしました');}
    else{err.textContent='メール/パスワードが違います';}
  }catch(x){err.textContent='接続エラー';}
}
async function save(){
  var db=DBOF[STORE]; // 3店とも hdm_official_price キー限定でanon書込可＝ログイン不要
  var tbl=TBLOF[STORE],payload;
  if(db===MAIN){ // {spk,nha} 両方入りを保持して更新
    var cur=await req(MAIN,'GET','app_settings?key=eq.hdm_official_price&select=value');
    var obj=(cur.ok&&cur.data&&cur.data[0])?JSON.parse(cur.data[0].value):{};
    obj[STORE]=PRICE[STORE];payload=obj;
  }else{
    var curb=await req(BT,'GET','bt_app_settings?key=eq.hdm_official_price&select=value');
    var objb=(curb.ok&&curb.data&&curb.data[0])?JSON.parse(curb.data[0].value):{};
    objb.tkm=PRICE.tkm;payload=objb;
  }
  var r=await req(db,'POST',tbl,{key:'hdm_official_price',value:JSON.stringify(payload)});
  // POSTがconflictならPATCH
  if(!r.ok){r=await req(db,'PATCH',tbl+'?key=eq.hdm_official_price',{value:JSON.stringify(payload)});}
  if(r.ok)toast('✅ 保存しました。公式サイトに反映されます');
  else toast('⚠️ 保存失敗（'+r.status+'）ログインし直してください');
}

load();
