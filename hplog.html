<!DOCTYPE html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUDDICA（HP）記録</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#f6f7f9;color:#0f172a;font-size:14px}
.wrap{max-width:1200px;margin:0 auto;padding:12px}
.tabs,.months{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tabs a,.tabs button,.months button{flex:1;min-width:90px;padding:10px;border:none;border-radius:6px;background:#e2e8f0;font-weight:800;font-size:15px;cursor:pointer;position:relative;color:#0f172a;text-decoration:none;text-align:center;font-family:inherit}
.months button{font-size:14px;padding:8px}
.tabs .on,.months button.on{background:#2f3b55;color:#fff}
.tabs .dot,.months .dot{position:absolute;top:4px;right:6px;width:10px;height:10px;border-radius:50%}
.big{border-radius:8px;padding:16px;margin:0 0 10px;font-size:22px;font-weight:900;text-align:center}
.big small{display:block;font-size:13px;font-weight:600;margin-top:4px}
.big.ok{background:#dcfce7;color:#166534}.big.ng{background:#fee2e2;color:#991b1b;animation:blink 1s infinite}.big.warn{background:#fef9c3;color:#854d0e}
@keyframes blink{50%{opacity:.55}}
.rule{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;font-size:13px}
.rule span{display:flex;align-items:center;gap:6px;background:#fff;border-radius:6px;padding:6px 10px}
.sw{width:18px;height:18px;border-radius:4px;display:inline-block}
.card{background:#fff;border-radius:8px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin:0 0 10px}
.card h2{margin:2px 0 8px;font-size:16px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:0 0 10px}
.nums div{background:#fff;border-radius:8px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.nums b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.nums span{font-size:12px;color:#475569;font-weight:700}
table.g{border-collapse:separate;border-spacing:2px}
table.g th{font-size:11px;color:#64748b;font-weight:700;padding:2px}
th.sat{color:#2563eb}th.sun{color:#dc2626}
table.g td{width:34px;height:30px;text-align:center;font-weight:800;font-size:12px;border-radius:5px}
td.cls{text-align:left;font-size:15px;font-weight:900;padding:8px 4px 2px;height:auto}
.lbl{position:sticky;left:0;background:#fff;z-index:1;text-align:left!important;white-space:nowrap;padding:0 8px 0 2px;font-size:13px;font-weight:800;width:auto!important}
.lbl small{color:#64748b;font-weight:600;margin-left:4px}
.A{background:#2f3b55}.G{background:#22c55e;color:#fff}.R{background:#dc2626;color:#fff;animation:blink 1s infinite}.Y{background:#facc15;color:#422006}.E{background:#f1f5f9}.W{background:#cbd5e1;color:#334155}.O{background:#9ca3af}.S{background:#bbf7d0;color:#166534}
table.l{width:100%;border-collapse:collapse;font-size:13px}
table.l th{text-align:left;font-size:12px;color:#64748b;padding:6px;border-bottom:1px solid #e2e8f0;white-space:nowrap}
table.l td{padding:7px 6px;border-bottom:1px solid #eef2f7;vertical-align:top}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.gap td{height:10px}
.foot{font-size:12px;color:#64748b;text-align:center;margin:6px 0 20px}
table.l{width:100%;border-collapse:collapse;font-size:14px}
table.l th{text-align:left;font-size:12px;color:#64748b;padding:6px;border-bottom:1px solid #e2e8f0;white-space:nowrap}
table.l td{padding:8px 6px;border-bottom:1px solid #eef2f7;vertical-align:top}
.q{display:flex;gap:8px;margin:0 0 10px}
.q input{flex:1;font-size:18px;padding:10px 12px;border:2px solid #cbd5e1;border-radius:8px;font-family:inherit}
.q button{font-size:16px;font-weight:800;padding:0 18px;border:none;border-radius:8px;background:#2f3b55;color:#fff}
.foot{font-size:12px;color:#64748b;text-align:center;margin:6px 0 20px}
.pre{background:#fef3c7;color:#92400e;border-radius:999px;padding:1px 8px;font-weight:700;white-space:nowrap}
</style></head><body>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="q"><input id="q" inputmode="search" placeholder="予約番号で検索（一部だけでも可）"><button id="go">検索</button></div>
  <div class="card"><h2>📝 ロボが admin に登録した予約</h2><div class="scroll"><table class="l" id="regs"></table></div></div>
  <div class="card"><h2>✖ ロボが admin でキャンセルした予約</h2><div class="scroll"><table class="l" id="cans"></table></div></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const DB = { url: 'https://ggqugvyskyiblxiycpci.supabase.co', key: 'sb_publishable_fI8HYYDFn3Soa4kOMbNCAA_oOxGPPKV' };
const STORES = [['nha', '那覇'], ['spk', '札幌'], ['takh', '高松 HDM'], ['takb', '高松 BUDDICA']];
const OTA = { 'たびらい': 'たびらい', 'レンタカードットコム': 'レンタカーコム', 'エアトリ': 'エアトリ' };
const KIND = { new: '新規', update: '変更', dates: '日付の変更', prereg: '未配車の先押さえ' };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const jst = t => t ? new Date(t).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const ymd = d => d ? `${+d.slice(5, 7)}/${+d.slice(8, 10)}` : '';
const P = new URLSearchParams(location.search), EMB = P.get('embed') ? '&embed=1' : '';
$('tabs').innerHTML = STORES.map(([id, n]) => `<a href="invcheck.html?store=${id}${EMB}">${n}</a>`).join('') + `<a href="hpcheck.html${EMB ? '?embed=1' : ''}">BUDDICA（HP）</a><button class="on">HP 登録・キャンセル記録</button>` +
  [['nha', '那覇'], ['spk', '札幌']].map(([id, n]) => `<a href="hdmcheck.html?store=${id}${EMB}">HDM admin ${n}</a>`).join('');
async function load() {
  const q = $('q').value.trim();
  try {
    const r = await fetch(`${DB.url}/rest/v1/rpc/invctl_hp_log`, { method: 'POST', headers: { apikey: DB.key, Authorization: `Bearer ${DB.key}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_q: q || null }) });
    if (!r.ok) throw new Error(r.status);
    draw(await r.json(), q);
  } catch (e) { $('regs').innerHTML = `<tr><td>読み込めませんでした（${esc(e.message)}）</td></tr>`; $('cans').innerHTML = ''; }
}
function draw(rows, q) {
  const hl = rn => q ? esc(rn).replace(esc(q), m => `<mark>${m}</mark>`) : esc(rn);
  const row = (a, kind) => `<tr><td>${jst(a.at)}</td><td>${esc(OTA[a.ota] || a.ota || '—')}</td><td><b>${hl(a.rn)}</b></td><td><b>${esc(a.plate || '—')}</b></td><td>${a.dfrom ? ymd(a.dfrom) + '〜' + ymd(a.dto) : '—'}</td>${kind ? `<td>${a.action === 'prereg' ? `<span class="pre">${esc(KIND.prereg)}</span>` : esc(KIND[a.action] || a.action)}</td>` : ''}<td>${a.ok ? '✅' : '❌ ' + esc(a.msg)}</td></tr>`;
  const regs = rows.filter(a => a.action !== 'cancel'), cans = rows.filter(a => a.action === 'cancel');
  const none = q ? `「${esc(q)}」は見つかりません` : 'まだありません';
  $('regs').innerHTML = regs.length ? '<tr><th>いつ</th><th>OTA</th><th>予約番号</th><th>車</th><th>日付</th><th>内容</th><th>結果</th></tr>' + regs.map(a => row(a, true)).join('') : `<tr><td>${none}</td></tr>`;
  $('cans').innerHTML = cans.length ? '<tr><th>いつ</th><th>OTA</th><th>予約番号</th><th>車</th><th>日付</th><th>結果</th></tr>' + cans.map(a => row(a, false)).join('') : `<tr><td>${none}</td></tr>`;
  $('foot').textContent = `登録 ${regs.length}件・キャンセル ${cans.length}件${q ? '（検索中）' : ''}`;
}
$('go').onclick = load; $('q').onkeydown = e => { if (e.key === 'Enter') load(); };
load(); setInterval(() => { if (!$('q').value.trim()) load(); }, 5 * 60e3);
</script>
</body></html>
