<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>HANDYMANカンパニー｜3Dバーチャル本社</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1222;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;color:#fff;-webkit-text-size-adjust:100%}
canvas#c{touch-action:none;display:block}
  #c{display:block;width:100vw;height:100vh}
  /* HUD */
  .hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:9px 14px;z-index:10;
    background:linear-gradient(180deg,rgba(11,18,34,.9),rgba(11,18,34,0));pointer-events:none}
  .hud h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.4px}
  .hud .tag{font-size:10px;opacity:.7}
  .hud .sp{flex:1}
  .hud .st{font-size:11px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);padding:3px 9px;border-radius:999px;pointer-events:auto}
  .hud #clk{font-variant-numeric:tabular-nums;font-weight:700}
  .hud a{color:#93c5fd;text-decoration:none;font-size:11px;pointer-events:auto}
  .legend{position:fixed;left:12px;bottom:12px;z-index:10;font-size:11px;display:flex;flex-direction:column;gap:5px}

  .hint{position:fixed;right:12px;bottom:12px;z-index:10;font-size:10.5px;color:#9fb0c9;text-align:right;background:rgba(11,18,34,.55);border-radius:8px;padding:6px 9px}
  .nav{position:fixed;top:40px;left:50%;transform:translateX(-50%);z-index:11;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:96vw}
  .nav button{font-size:11px;background:rgba(15,23,42,.82);color:#cbd5e1;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:700}
  .nav button:hover{background:rgba(59,130,246,.35);color:#fff}
  .nav button.on{background:#2563eb;color:#fff;border-color:#3b82f6}
  .zoom{position:fixed;right:14px;top:82px;z-index:12;display:flex;flex-direction:column;gap:8px}
  .zoom button{width:44px;height:44px;font-size:24px;font-weight:800;border-radius:12px;background:rgba(15,23,42,.88);
    color:#fff;border:1px solid rgba(255,255,255,.22);cursor:pointer;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .zoom button:active{background:#2563eb}
  .rotc{position:fixed;right:14px;top:210px;z-index:12;display:grid;grid-template-columns:44px 44px;gap:6px}
  .rotc .lbl{grid-column:1/3;font-size:9px;color:#7dd3fc;text-align:center;font-weight:700;margin-bottom:-2px}
  .rotc button{width:44px;height:40px;font-size:20px;font-weight:800;border-radius:11px;background:rgba(15,23,42,.88);color:#7dd3fc;border:1px solid rgba(125,211,252,.4);cursor:pointer;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.4)}
  .rotc button:active{background:#0e7490;color:#fff}
  #backbtn{display:none;position:fixed;left:12px;top:56px;z-index:25;align-items:center;gap:6px;background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;border:1.5px solid #60a5fa;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.55)}
  #backbtn:active{background:#1e3a8a}
  /* floating task labels */
  #labels{position:fixed;inset:0;z-index:5;pointer-events:none}
  .tl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;background:rgba(15,23,42,.92);
    border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:3px 8px;font-size:10.5px;line-height:1.35;
    box-shadow:0 4px 12px rgba(0,0,0,.4);will-change:left,top}
  .tl .w{font-weight:800;font-size:10px;opacity:.85}
  .tl .t{font-weight:700}
  .tl.stuck{border-color:#ef4444;background:rgba(60,10,10,.92)} .tl.stuck .t{color:#fca5a5}
  .tl.staff{border-color:#f59e0b66;background:rgba(50,34,8,.9)} .tl.staff .t{color:#fde68a;font-weight:800}
  @keyframes blinkDone{0%,100%{opacity:1;box-shadow:0 0 0 rgba(74,222,128,0)}50%{opacity:.4;box-shadow:0 0 14px rgba(74,222,128,.9)}}
  .tl.staff.done{border-color:#4ade80;background:rgba(8,40,20,.92);animation:blinkDone 1.1s ease-in-out infinite}
  .tl.count{background:rgba(37,99,235,.92);border-color:#3b82f6} .tl.count .t{font-weight:800}
  .tl.tasksum{background:rgba(10,16,32,.97);border-color:#38bdf8;border-width:1.5px;max-width:310px;white-space:normal;text-align:left;z-index:9;box-shadow:0 4px 16px rgba(0,0,0,.6)} .tl.tasksum .w{color:#93c5fd;font-size:11px} .tl.tasksum .t{font-size:10.5px;line-height:1.6;color:#dbe6f5} .tl.tasksum b{color:#fde68a;font-weight:800}
  .tl.alert{background:rgba(60,10,10,.96);border-color:#ef4444;border-width:1.5px;max-width:300px;white-space:normal;text-align:left;z-index:9;box-shadow:0 0 14px rgba(239,68,68,.5)} .tl.alert .w{color:#fca5a5;font-size:11px;font-weight:800} .tl.alert .t{font-size:10.5px;line-height:1.6;color:#fecaca} .tl.alert b{color:#fde047;font-weight:900}
  .tl.alertok{background:rgba(8,40,20,.9);border-color:#22c55e55} .tl.alertok .w{color:#86efac;font-size:10.5px}
  .tl.newbk{background:rgba(6,26,16,.96);border-color:#22c55e;border-width:1.5px;max-width:320px;white-space:normal;text-align:left;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,.6)} .tl.newbk .w{color:#86efac;font-size:11px;font-weight:800} .tl.newbk .t{font-size:11px;line-height:1.6;color:#dcfce7} .tl.newbk b{color:#fde68a;font-weight:900;font-size:13px}
  .tl.inq{background:rgba(60,10,10,.97);border-color:#ef4444;border-width:2px;max-width:330px;white-space:normal;text-align:left;z-index:11} .tl.inq .w{color:#fecaca;font-size:12px;font-weight:900} .tl.inq .t{font-size:11px;line-height:1.6;color:#fee2e2} .tl.inq b{color:#fde047;font-weight:900;font-size:14px}
  .tl.inqok{background:rgba(8,40,20,.92);border-color:#22c55e88} .tl.inqok .w{color:#86efac;font-size:11px;font-weight:800}
  .tl.inqblink{animation:blinkInq 1s ease-in-out infinite} @keyframes blinkInq{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 20px 4px rgba(239,68,68,.95)}}
  .tl.appr{background:rgba(58,40,6,.97);border-color:#f59e0b;border-width:2px;max-width:330px;white-space:normal;text-align:left;z-index:11} .tl.appr .w{color:#fde68a;font-size:12px;font-weight:900} .tl.appr .t{font-size:11px;line-height:1.6;color:#fef3c7} .tl.appr b{color:#fff;font-weight:900;font-size:14px}
  /* 固定アラートパネル（右上・縦積み・3D吹き出しの重なり解消） */
  #alertPanel{position:fixed;top:56px;right:12px;width:min(300px,44vw);display:flex;flex-direction:column;gap:7px;z-index:40;pointer-events:none}
  #alertPanel .arow{pointer-events:auto;background:rgba(12,20,36,.94);border:1px solid #24405e;border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.55;box-shadow:0 3px 10px rgba(0,0,0,.4);cursor:pointer;text-decoration:none;display:block;color:#e8eef7}
  #alertPanel .arow .w{font-weight:900}
  #alertPanel .arow .t{font-size:11px;opacity:.9;margin-top:1px}
  #alertPanel .arow b{font-size:15px;font-weight:900}
  #alertPanel .arow.red{background:rgba(60,10,10,.95);border-color:#ef4444} #alertPanel .arow.red .w{color:#fecaca} #alertPanel .arow.red b{color:#fde047}
  #alertPanel .arow.amber{background:rgba(58,40,6,.95);border-color:#f59e0b} #alertPanel .arow.amber .w{color:#fde68a} #alertPanel .arow.amber b{color:#fff}
  #alertPanel .arow.green{background:rgba(8,40,20,.9);border-color:#22c55e88} #alertPanel .arow.green .w{color:#86efac}
  #alertPanel .arow.blink{animation:blinkInq 1.1s ease-in-out infinite}
  /* 「未対応タスクあり」ピン（区画の上・アラート時のみ・PC/スマホ両方） */
  .tl.pinlbl{background:#dc2626;border:2px solid #fff;border-radius:12px;padding:5px 11px;text-align:center;white-space:nowrap;box-shadow:0 4px 14px rgba(220,38,38,.6);z-index:20;cursor:pointer;transform:translate(-50%,-100%);animation:pinbob 1s ease-in-out infinite}
  .tl.pinlbl::after{content:'';position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:7px solid transparent;border-top-color:#dc2626}
  .tl.pinlbl .pw{color:#fff;font-weight:900;font-size:12px}
  .tl.pinlbl .pn{color:#fee2e2;font-size:11px;font-weight:800;margin-top:1px}
  @keyframes pinbob{0%,100%{margin-top:0}50%{margin-top:-5px}}
  .tl.pinlbl.red{background:#dc2626;box-shadow:0 4px 14px rgba(220,38,38,.6)} .tl.pinlbl.red::after{border-top-color:#dc2626}
  .tl.pinlbl.amber{background:#d97706;box-shadow:0 4px 14px rgba(217,119,6,.55)} .tl.pinlbl.amber::after{border-top-color:#d97706} .tl.pinlbl.amber .pn{color:#fff7ed}
  .tl.pinlbl.green{background:#15803d;box-shadow:0 4px 14px rgba(21,128,61,.5);animation:none;border-color:#86efac} .tl.pinlbl.green::after{border-top-color:#15803d} .tl.pinlbl.green .pn{color:#dcfce7}
  /* 集約ピン（担当部の上に各アラートを1行リンクで） */
  .tl.pinlbl.multi{background:rgba(10,16,32,.96);border:2px solid #b91c1c;padding:5px;text-align:left;animation:none;box-shadow:0 5px 18px rgba(0,0,0,.55)}
  .tl.pinlbl.multi::after{border-top-color:rgba(10,16,32,.96)}
  .tl.pinlbl.multi .pln{display:block;padding:5px 9px;border-radius:8px;margin:2px 0;font-size:11.5px;font-weight:900;color:#fff;text-decoration:none;white-space:nowrap;cursor:pointer}
  .tl.pinlbl.multi .pln.red{background:#dc2626}.tl.pinlbl.multi .pln.amber{background:#d97706}.tl.pinlbl.multi .pln.green{background:#15803d;font-weight:800}
  @media(max-width:760px){ #alertPanel{top:46px;bottom:auto;right:6px;left:6px;width:auto;flex-direction:row;gap:6px;overflow-x:auto;padding-bottom:2px} #alertPanel .arow{flex:0 0 auto;min-width:150px;font-size:11px;padding:6px 9px} #alertPanel .arow .t{font-size:10px} }
  .apprblink{animation:blinkAppr 1s ease-in-out infinite} @keyframes blinkAppr{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}50%{box-shadow:0 0 20px 4px rgba(245,158,11,.9)}}
  /* 各店の状況＝画面左の固定パネル（3Dエリアに重ならない） */
  #storehud{position:fixed;left:10px;top:96px;width:250px;max-height:calc(100vh - 210px);overflow-y:auto;z-index:20;font-size:11px}
  #storehud .shhd{background:rgba(10,16,32,.95);border:1px solid #38bdf8;border-radius:10px 10px 0 0;padding:7px 10px;font-weight:800;color:#93c5fd;display:flex;justify-content:space-between;align-items:center}
  #storehud .shhd #shtoggle{font-size:10px;color:#7dd3fc;cursor:pointer;font-weight:600}
  #storehud.min #shbody{display:none} #storehud.min .shhd{border-radius:10px}
  #storehud .shcard{background:rgba(10,16,32,.95);border:1px solid #24405e;border-top:none;padding:8px 10px}
  #storehud .shcard:last-child{border-radius:0 0 10px 10px}
  #storehud .shnm{font-weight:800;font-size:12px;margin-bottom:3px;display:flex;justify-content:space-between;gap:6px}
  #storehud .shatt{font-size:10px;color:#93a4bd;font-weight:600}
  #storehud .shrow{color:#dbe6f5;line-height:1.55;font-size:10.5px}
  #storehud .shrow b{color:#eef3fb;font-weight:800}
  #storehud .shalert{margin-top:4px;color:#e0a9a9;font-size:10.5px;font-weight:700}
  #storehud .shalert a{color:#e0a9a9;text-decoration:underline;text-decoration-color:rgba(224,169,169,.4)}
  #storehud .shnew{margin-top:5px;color:#4ade80;font-size:11.5px;font-weight:800;background:rgba(16,60,32,.6);border:1px solid rgba(34,197,94,.5);border-radius:7px;padding:3px 8px;display:inline-block} #storehud .shnew b{color:#fff;font-size:15px;font-weight:900}
  #storehud .shpetty{margin-top:5px;font-size:10.5px;font-weight:800;color:#fcd34d;background:rgba(60,40,6,.7);border:1px solid rgba(245,158,11,.55);border-radius:7px;padding:3px 8px;animation:blinkAppr 1.1s ease-in-out infinite} #storehud .shpetty a{color:#fcd34d;text-decoration:none} #storehud .shpetty b{color:#fff;font-weight:900}
  #storehud .shcash{margin-top:5px;font-size:10.5px;font-weight:700;color:#a9c2e0;background:rgba(12,24,44,.6);border:1px solid #24405e;border-radius:7px;padding:3px 8px} #storehud .shcash a{color:#a9c2e0;text-decoration:none} #storehud .shcash b{color:#eef3fb;font-weight:900}
  /* CS問い合わせ＝画面上部の固定バナー（点滅） */
  #inqbanner{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:21;max-width:92vw}
  #inqbanner .ib{background:rgba(60,10,10,.97);border:2px solid #ef4444;border-radius:12px;padding:8px 16px;color:#fee2e2;font-weight:800;font-size:12.5px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.5);animation:blinkInq 1s ease-in-out infinite}
  #inqbanner .ib b{color:#fde047;font-size:15px} #inqbanner .ib a{color:#fff;text-decoration:underline}
  #inqbanner .ibok{background:rgba(8,40,20,.9);border:1px solid #22c55e66;border-radius:12px;padding:5px 14px;color:#86efac;font-weight:700;font-size:11px;text-align:center;animation:none;box-shadow:none}
  @media(max-width:760px){
    #storehud{top:auto;bottom:52px;left:6px;right:6px;width:auto;max-height:44vh;display:flex;flex-direction:column;z-index:22}
    #storehud.min{width:auto;max-height:none}
    #inqbanner{display:none}
  }
  .tl.room{background:rgba(15,23,42,.88);border-color:rgba(96,165,250,.55);padding:5px 13px;border-width:1.5px;box-shadow:0 3px 14px rgba(0,0,0,.5)} .tl.room .rm{font-weight:900;font-size:16px;letter-spacing:.3px;color:#eaf2ff}
  .tl.on{border-color:#22c55e55} .tl::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:rgba(15,23,42,.92)}
  /* panel */
  .scrim{position:fixed;inset:0;background:rgba(4,8,18,.5);display:none;z-index:40}
  .panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);background:#0f172a;z-index:41;
    transform:translateX(100%);transition:.22s;box-shadow:-8px 0 30px rgba(0,0,0,.5);display:flex;flex-direction:column;border-left:1px solid rgba(255,255,255,.1)}
  .panel.open{transform:none}.scrim.open{display:block}
  .panel .ph{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
  .panel .ph .x{float:right;cursor:pointer;color:#93a4bf;font-size:18px}
  .panel .ph .nm{font-weight:800;font-size:15px} .panel .ph .sub{font-size:11px;color:#9fb0c9;margin-top:3px}
  .panel .pb{padding:14px 16px;overflow:auto;font-size:12.5px}
  .panel .pb h4{margin:0 0 6px;font-size:11px;color:#9fb0c9;font-weight:700}
  .kd{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .kd span{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:3px 8px;font-size:11px}
  .items{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .items .itcard{display:block;text-decoration:none;background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.22);border-radius:8px;padding:9px 11px;transition:.15s}
  a.itcard:hover{background:rgba(34,211,238,.14);border-color:rgba(34,211,238,.5)}
  .items .itt{font-weight:700;font-size:12.5px;color:#e8f2ff}
  .items .itd{font-size:10.5px;color:#93a4bf;margin-top:3px;line-height:1.45}
  .items .itu{font-size:11px;color:#22d3ee;margin-top:5px;font-weight:700}
  .items .itu.file{color:#cbd6e6;font-weight:500;word-break:break-all;font-size:10px}
  .items .itu.no{color:#f59e0b}
  .items .itlinks{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .items .itlink{font-size:11px;color:#22d3ee;text-decoration:none;padding:3px 6px;border-radius:5px;background:rgba(34,211,238,.09);border:1px solid rgba(34,211,238,.2)}
  a.itlink:hover{background:rgba(34,211,238,.2)}
  .items .itlink.no{color:#f59e0b;background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.25)}
  .items .grp{margin-top:9px}
  .items .grph{font-size:11px;font-weight:800;color:#8fd3e6;margin-bottom:5px;border-left:3px solid rgba(34,211,238,.55);padding-left:6px}
  .items .chips{display:flex;flex-wrap:wrap;gap:4px}
  .items .chips span{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:5px;padding:2px 7px;font-size:10.5px;color:#dbe6f5;white-space:nowrap}
  .who .b{display:inline-block;background:rgba(255,255,255,.08);border-radius:5px;padding:2px 7px;font-size:10.5px;margin:0 5px 5px 0}
  .live{font-weight:700;margin:2px 0 12px}
  .raise{font-size:11px;border:1px dashed #475569;background:transparent;color:#cbd5e1;border-radius:8px;padding:6px 10px;cursor:pointer}
  .raise:hover{background:rgba(255,255,255,.06)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid rgba(255,255,255,.2);
    padding:9px 16px;border-radius:10px;font-size:12.5px;opacity:0;transition:.2s;z-index:60}.toast.show{opacity:1}
  /* ===== スマホ最適化 ===== */
  @media(max-width:640px){
    .hud{padding:5px 8px;gap:5px;flex-wrap:wrap;align-items:center}
    .hud h1{font-size:12px;letter-spacing:0}
    .hud .tag{display:none}
    .hud .sp{display:none}
    .hud .st{font-size:9.5px;padding:2px 6px;white-space:nowrap}
    .hud a{font-size:9.5px}
    .nav{top:auto;bottom:0;left:0;right:0;transform:none;max-width:100vw;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:5px;background:linear-gradient(0deg,rgba(11,18,34,.96),rgba(11,18,34,.55))}
    .nav::-webkit-scrollbar{display:none}
    .nav button{font-size:11px;padding:7px 13px;flex-shrink:0}
    .zoom{top:auto;bottom:62px;right:8px;gap:6px}
    .zoom button{width:40px;height:40px;font-size:22px}
    .rotc{top:auto;bottom:62px;right:56px;grid-template-columns:38px 38px;gap:5px}
    .rotc button{width:38px;height:36px;font-size:18px}
    .tl{font-size:9px;padding:2px 6px;line-height:1.3}
    .tl.room{padding:3px 9px} .tl.room .rm{font-size:12.5px}
    .tl.tasksum{max-width:74vw;font-size:9px} .tl.tasksum .w{font-size:9.5px} .tl.tasksum .t{font-size:9px}
    .tl.staff .t,.tl.staff .w{font-size:9px}
    .legend{display:none}
    .hint{display:none}
    .panel{width:100vw}
    .panel .pb{font-size:12px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div class="hud">
  <h1>🏢 HANDYMANカンパニー</h1><span class="tag">3Dバーチャル本社 v0.2</span>
  <div class="sp"></div>
  <span class="st">🟢 出社中 <b id="onc">—</b></span>
  <span class="st">🔴 詰まり <b id="stc">—</b></span>
  <span class="st">👥 出勤 <b id="atc">—</b></span>
  <span class="st">🤖 CLI <b id="cli">—</b></span>
  <span class="st">🕐 <span id="clk">--:--:--</span></span>
  <a href="company.html">▦ 2D一覧へ</a>
</div>
<div class="nav" id="nav"></div>

function makeSign(text,color){
  const cvs=document.createElement('canvas'); cvs.width=600; cvs.height=150;
  const x=cvs.getContext('2d');
  const hex='#'+('000000'+color.toString(16)).slice(-6);
  x.clearRect(0,0,600,150);
  // 濃い背景ピル＋店色の枠＋白文字＝暗背景でも必ず読める
  const rx=16,ry=26,rw=568,rh=98,r=26;
  x.fillStyle='rgba(6,12,26,.86)';
  x.beginPath();x.moveTo(rx+r,ry);x.arcTo(rx+rw,ry,rx+rw,ry+rh,r);x.arcTo(rx+rw,ry+rh,rx,ry+rh,r);x.arcTo(rx,ry+rh,rx,ry,r);x.arcTo(rx,ry,rx+rw,ry,r);x.closePath();x.fill();
  x.lineWidth=5;x.strokeStyle=hex;x.stroke();
  x.font='bold 58px -apple-system,sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.fillStyle='#ffffff';x.fillText(text,300,78);
  const tex=new THREE.CanvasTexture(cvs);
  // depthTest無効＝他の3D(部屋/ラベル)に隠れず常に最前面
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false}));
  sp.scale.set(12.5,3.1,1); sp.renderOrder=1000; return sp;
}

(function(){const nav=document.getElementById('nav');
  nav.innerHTML='<button class="on" data-k="all" onclick="focusUnit(\'all\',this)">🗺 全体</button>'+UNITS.map(u=>`<button data-k="${u.key}" onclick="focusUnit('${u.key}',this)">${u.name}</button>`).join('');})();
let drag=false,px=0,py=0,moved=0;const activePtr=new Set();
cv.addEventListener('pointerdown',e=>{activePtr.add(e.pointerId);drag=true;px=e.clientX;py=e.clientY;moved=0;});
addEventListener('pointerup',e=>{activePtr.delete(e.pointerId);if(drag&&moved<5)pick(e);drag=false;});
addEventListener('pointercancel',e=>{activePtr.delete(e.pointerId);drag=false;});
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(e.pointerType==='touch'){ if(activePtr.size>=2)return; // 2本指はピンチ拡大縮小に任せる
    // スマホ 1本指ドラッグ＝中心を移動(パン)
    const s=radius*0.0016,ct=Math.cos(theta),st=Math.sin(theta);tGoal.x-=(dx*ct+dy*st)*s;tGoal.z-=(-dx*st+dy*ct)*s;
  } else { // PCマウス＝回転
    theta-=dx*0.005;phi=Math.max(0.25,Math.min(1.4,phi-dy*0.004));updCam();
  }});
window.zoomBy=function(d){rGoal=Math.max(12,Math.min(140,rGoal+d));};
window.rotY=function(d){theta+=d;updCam();}; // 左右回転(ヨー)＝PC/スマホ共通ボタン
window.rotP=function(d){phi=Math.max(0.28,Math.min(1.35,phi+d));updCam();}; // 上下の傾き(ピッチ)
cv.addEventListener('wheel',e=>{e.preventDefault();rGoal=Math.max(12,Math.min(140,rGoal+e.deltaY*0.06));},{passive:false});
// スマホ 2本指＝拡大縮小(ピンチ)。ブラウザ自体のピンチズーム(ページ拡大でラベルが崩れる)を抑止
let pd=0;cv.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const a=e.touches[0],b=e.touches[1];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd)rGoal=Math.max(14,Math.min(140,rGoal-(d-pd)*0.12));pd=d;}},{passive:false});
cv.addEventListener('gesturestart',e=>e.preventDefault());cv.addEventListener('gesturechange',e=>e.preventDefault());
cv.addEventListener('touchend',()=>{pd=0;});

// ===== PICK =====
const ray=new THREE.Raycaster(),m=new THREE.Vector2();
function pick(e){
  m.x=(e.clientX/innerWidth)*2-1; m.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(m,camera); const hit=ray.intersectObjects(clickable)[0];
  if(hit){const u=hit.object.userData.u;
    if(activeUnit==='all'){ // 全体表示中：店のどこ(部屋含む)を押しても、まずその店にズーム(アップ)
      window.focusUnit(u.key,document.querySelector('.nav button[data-k="'+u.key+'"]'));
    } else { openP(u,hit.object.userData.dp); } // ズーム済み：部屋の詳細を表示
    return;
  }
  // 土台(スペース)クリック→その店にズーム(部署が見える焦点ビュー＝店全体のアップ)
  const ph=ray.intersectObjects(platforms.filter(p=>p.visible!==false&&p.parent&&p.parent.visible))[0];
  if(ph&&ph.object.userData.platUnit){const k=ph.object.userData.platUnit;window.focusUnit(k,document.querySelector('.nav button[data-k="'+k+'"]'));}
}
function openP(u,dp){
  document.getElementById('pnm').textContent=`${AREA[dp.area]} ${dp.nm}`;
  document.getElementById('psub').textContent=`${u.name.replace(/^[^ ]+ /,'')}　/　${dp.st==='stuck'?'🔴 詰まり':dp.st==='on'?'🟢 稼働中':'⚪ 待機'}`;
  document.getElementById('plive').innerHTML=dp.how?dp.how:(dp.task&&dp.task!=='—'?`▶ ${dp.task}`:'—');
  document.getElementById('plive').style.color=dp.st==='stuck'?'#fca5a5':'#cbd6e6';
  document.getElementById('pwho').innerHTML=`<span class="b">${dp.area==='human'?'🧑':dp.area==='ai'?'🤖':'🤝'} ${dp.worker}</span>`;
  const pk=document.getElementById('pkd'), kh=document.getElementById('pkh');
  if(dp.items){
    kh.textContent='🔗 対象機能（クリックで状況確認）';
    pk.className='items';
    pk.innerHTML = dp.items.length ? dp.items.map(it=>{
      const uu=it.u||'', isFile=uu.startsWith('file:'), hasMulti=Array.isArray(it.links)&&it.links.length, hasGroups=Array.isArray(it.groups)&&it.groups.length;
      let tail='';
      if(hasGroups){ tail+=it.groups.map(g=>`<div class="grp"><div class="grph">${g.h}</div><div class="chips">${g.chips.map(c=>`<span>${c}</span>`).join('')}</div></div>`).join(''); }
      if(hasMulti){ tail+=`<div class="itlinks">`+it.links.map(l=>l.u?`<a class="itlink" href="${l.u}" target="_blank" rel="noopener">🔗 ${l.t}</a>`:`<span class="itlink no">${l.t}${l.note?'（'+l.note+'）':''}</span>`).join('')+`</div>`; }
      if(!hasGroups && !hasMulti){ tail = uu ? (isFile?`<div class="itu file">🖥 ${uu}</div>`:`<div class="itu">🔗 開く</div>`) : `<div class="itu no">${it.note||'準備中'}</div>`; }
      const body=`<div class="itt">${it.t}</div>`+(it.d?`<div class="itd">${it.d}</div>`:'')+tail;
      return (uu && !isFile && !hasMulti && !hasGroups) ? `<a class="itcard" href="${uu}" target="_blank" rel="noopener">${body}</a>` : `<div class="itcard">${body}</div>`;
    }).join('') : '<div class="itd">（今後定義）</div>';
  } else if(dp.groups){
    kh.textContent='📋 この部署の担当（子タスク）';
    pk.className='items';
    pk.innerHTML=dp.groups.map(g=>`<div class="grp"><div class="grph">${g.h}</div><div class="chips">${g.chips.map(c=>`<span>${c}</span>`).join('')}</div></div>`).join('')+((dp.kd&&dp.kd.length)?`<div class="chips" style="margin-top:8px">${dp.kd.map(k=>`<span>${k}</span>`).join('')}</div>`:'');
  } else {
    kh.textContent='📋 この部署の担当（子タスク）';
    pk.className='items';
    pk.innerHTML=`<div class="chips">${(dp.kd||[]).map(k=>`<span>${k}</span>`).join('')}</div>`;
  }
  document.getElementById('praise').onclick=()=>toast(`🙋 「${dp.nm}」に手を挙げました（デモ）`);
  document.getElementById('panel').classList.add('open');document.getElementById('scrim').classList.add('open');
}
function closeP(){document.getElementById('panel').classList.remove('open');document.getElementById('scrim').classList.remove('open');}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);}
window.closeP=closeP;

// ===== LOOP =====
const v=new THREE.Vector3();
function project(p){v.copy(p).project(camera);return{x:(v.x*.5+.5)*innerWidth,y:(-v.y*.5+.5)*innerHeight,vis:v.z<1};}
let t0=0;
function loop(ts){
  const t=ts*0.001;
  target.lerp(tGoal,0.1); radius+=(rGoal-radius)*0.1; updCam();
  // avatars bob + stuck pulse
  UNITS.forEach(u=>u.depts.forEach((dp,i)=>{
    if(dp._av)dp._av.position.y=0.45+Math.sin(t*2+i)*0.06;
    if(dp._pil&&dp.st==='stuck')dp._pil.material.emissiveIntensity=0.6+Math.sin(t*6)*0.5;
  }));
  // 対応が必要な部は区画(プラットフォーム)を赤く点滅させる
  UNITS.forEach(u=>{ if(!u._plat)return; const m=u._plat.material;
    if(u._alert){ const p=0.5+Math.sin(t*4)*0.5; m.emissive.setHex(0xff2d2d); m.emissiveIntensity=0.3+p*0.8; m.opacity=0.5+p*0.35; }
    else if(m.emissiveIntensity>0){ m.emissive.setHex(0x000000); m.emissiveIntensity=0; m.opacity=0.35; }
  });
  // 出勤者が歩き回る
  for(const s of movers){const q=s.userData;
    if(q.cli&&!cliOnline){s.position.y=0.45;if(s._walk){s._walk.legL.rotation.x=s._walk.legR.rotation.x=s._walk.armL.rotation.x=s._walk.armR.rotation.x=0;}continue;} // オフラインCLIは歩かず静止
    let dx=q.tx-s.position.x,dz=q.tz-s.position.z;const dd=Math.hypot(dx,dz);let moving=false;
    if(dd<0.3){q.tx=q.ux+(Math.random()-.5)*q.rx*2;q.tz=q.uz+(Math.random()-.5)*q.rz*2;}
    else{s.position.x+=dx/dd*0.035;s.position.z+=dz/dd*0.035;s.rotation.y=Math.atan2(dx,dz);moving=true;}
    s.position.y=0.45+Math.abs(Math.sin(t*7+q.ph))*(s._walk?0.05:0.09);
    // 歩行モーション（腕振り・足踏み）
    if(s._walk){const w=s._walk;const a=Math.sin(t*9+w.ph)*(moving?0.62:0.12);w.legL.rotation.x=a;w.legR.rotation.x=-a;w.armL.rotation.x=-a*0.9;w.armR.rotation.x=a*0.9;}}
  // OMNI＝固定(動かない)。アンテナが明滅して稼働中を表現
  for(const o of omnis){if(o.userData.ant)o.userData.ant.material.emissiveIntensity=1.0+Math.sin(t*4)*0.6;}
  // labels（全体=タスク＋出勤数／店を選ぶと=その店のタスク＋出勤者名）
  const _pins=[];
  for(const L of labelDivs){
    let show;
    if(L.type==='apin'){ show = !!L.active && (activeUnit==='all'||activeUnit===L.unitKey); } // アラートピン=該当時のみ・全体＋その部（担当区画の上）
    else if(L.type==='tasksum'){ show = (activeUnit==='all' || (L.keys&&L.keys.indexOf(activeUnit)>=0)); }
    else if(L.type==='bubble'){ show = (activeUnit==='all' || L.key===activeUnit); } // 吹き出し(新規予約/問い合わせ)は全体＋その拠点で表示
    else if(activeUnit==='all'){ show = (L.type==='staff'||L.type==='count') && innerWidth>760; } // 全体=人の名前＋出勤数(PCのみ)。スマホは密集回避で隠し区画/ピン/看板だけ。店タップで詳細
    else { show = (L.key===activeUnit); } // 店選択=その店の全ラベル(部署名含む)
    if(!show){L.div.style.display='none';continue;}
    if(L.follow)L.pos.set(L.follow.position.x,L.follow.position.y+2.1,L.follow.position.z);
    const s=project(L.pos); if(!s.vis){L.div.style.display='none';continue;}
    L.div.style.display='block';
    if(L.type==='apin'){ L._px=s.x; L._py=s.y; L.div.style.left=s.x+'px'; L.div.style.top=s.y+'px'; _pins.push(L); continue; } // 位置は後でファンアウト
    L.div.style.left=s.x+'px';L.div.style.top=s.y+'px';
  }
  dodgePins(_pins); // アラートピンが重ならないよう方向を分散

  renderer.render(scene,camera); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize); resize();
setInterval(()=>document.getElementById('clk').textContent=new Date().toLocaleTimeString('ja-JP'),1000);
</script>
