function makeSign(text,color){

  x.fillStyle='rgba(10,16,30,.0)'; x.fillRect(0,0,512,128);

  x.strokeStyle='rgba(255,255,255,.25)'; x.lineWidth=2; x.strokeText(text,256,64);
  const tex=new THREE.CanvasTexture(cvs);

}

cv.addEventListener('wheel',e=>{e.preventDefault();rGoal=Math.max(12,Math.min(140,rGoal+e.deltaY*0.06));},{passive:false});
// pinch
let pd=0;cv.addEventListener('touchmove',e=>{if(e.touches.length===2){const a=e.touches[0],b=e.touches[1];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd)rGoal=Math.max(14,Math.min(140,rGoal-(d-pd)*0.12));pd=d;}},{passive:true});
cv.addEventListener('touchend',()=>pd=0);

// ===== PICK =====
const ray=new THREE.Raycaster(),m=new THREE.Vector2();
function pick(e){
  m.x=(e.clientX/innerWidth)*2-1; m.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(m,camera); const hit=ray.intersectObjects(clickable)[0];
  if(hit)openP(hit.object.userData.u,hit.object.userData.dp);
}
function openP(u,dp){
  document.getElementById('pnm').textContent=`${AREA[dp.area]} ${dp.nm}`;
  document.getElementById('psub').textContent=`${u.name.replace(/^[^ ]+ /,'')}　/　${dp.st==='stuck'?'🔴 詰まり':dp.st==='on'?'🟢 稼働中':'⚪ 待機'}`;
  document.getElementById('plive').innerHTML=dp.how?dp.how:(dp.task&&dp.task!=='—'?`▶ ${dp.task}`:'—');
  document.getElementById('plive').style.color=dp.st==='stuck'?'#fca5a5':'#cbd6e6';
  document.getElementById('pwho').innerHTML=`<span class="b">${dp.area==='human'?'🧑':dp.area==='ai'?'🤖':'🤝'} ${dp.worker}</span>`;
  const pk=document.getElementById('pkd'), kh=document.getElementById('pkh');
  if(dp.items){
    kh.textContent='🔗 対象機能（クリックで状況確認）';
    pk.className='items';
    pk.innerHTML = dp.items.length ? dp.items.map(it=>{
      const uu=it.u||'', isFile=uu.startsWith('file:'), hasMulti=Array.isArray(it.links)&&it.links.length, hasGroups=Array.isArray(it.groups)&&it.groups.length;
      let tail='';
      if(hasGroups){ tail+=it.groups.map(g=>`<div class="grp"><div class="grph">${g.h}</div><div class="chips">${g.chips.map(c=>`<span>${c}</span>`).join('')}</div></div>`).join(''); }
      if(hasMulti){ tail+=`<div class="itlinks">`+it.links.map(l=>l.u?`<a class="itlink" href="${l.u}" target="_blank" rel="noopener">🔗 ${l.t}</a>`:`<span class="itlink no">${l.t}${l.note?'（'+l.note+'）':''}</span>`).join('')+`</div>`; }
      if(!hasGroups && !hasMulti){ tail = uu ? (isFile?`<div class="itu file">🖥 ${uu}</div>`:`<div class="itu">🔗 開く</div>`) : `<div class="itu no">${it.note||'準備中'}</div>`; }
      const body=`<div class="itt">${it.t}</div>`+(it.d?`<div class="itd">${it.d}</div>`:'')+tail;
      return (uu && !isFile && !hasMulti && !hasGroups) ? `<a class="itcard" href="${uu}" target="_blank" rel="noopener">${body}</a>` : `<div class="itcard">${body}</div>`;
    }).join('') : '<div class="itd">（今後定義）</div>';
  } else {
    kh.textContent='📋 この部署の課（実装機能）';
    pk.className='kd';
    pk.innerHTML=(dp.kd||[]).map(k=>`<span>${k}</span>`).join('');
  }
  document.getElementById('praise').onclick=()=>toast(`🙋 「${dp.nm}」に手を挙げました（デモ）`);
  document.getElementById('panel').classList.add('open');document.getElementById('scrim').classList.add('open');
}
function closeP(){document.getElementById('panel').classList.remove('open');document.getElementById('scrim').classList.remove('open');}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);}
window.closeP=closeP;

// ===== LOOP =====
const v=new THREE.Vector3();
function project(p){v.copy(p).project(camera);return{x:(v.x*.5+.5)*innerWidth,y:(-v.y*.5+.5)*innerHeight,vis:v.z<1};}
let t0=0;
function loop(ts){
  const t=ts*0.001;
  target.lerp(tGoal,0.1); radius+=(rGoal-radius)*0.1; updCam();
  // avatars bob + stuck pulse
  UNITS.forEach(u=>u.depts.forEach((dp,i)=>{
    if(dp._av)dp._av.position.y=0.45+Math.sin(t*2+i)*0.06;
    if(dp._pil&&dp.st==='stuck')dp._pil.material.emissiveIntensity=0.6+Math.sin(t*6)*0.5;
  }));
  // 出勤者が歩き回る
  for(const s of movers){const q=s.userData;
    if(q.cli&&!cliOnline){s.position.y=0.45;continue;} // オフラインCLIは歩かず静止
    let dx=q.tx-s.position.x,dz=q.tz-s.position.z;const dd=Math.hypot(dx,dz);
    if(dd<0.3){q.tx=q.ux+(Math.random()-.5)*q.rx*2;q.tz=q.uz+(Math.random()-.5)*q.rz*2;}
    else{s.position.x+=dx/dd*0.035;s.position.z+=dz/dd*0.035;s.rotation.y=Math.atan2(dx,dz);}
    s.position.y=0.45+Math.abs(Math.sin(t*7+q.ph))*0.09;}
  // labels（全体=タスク＋出勤数／店を選ぶと=その店のタスク＋出勤者名）
  for(const L of labelDivs){
    const show = activeUnit==='all' ? (L.type==='staff'||L.type==='task'||L.type==='count') : (L.key===activeUnit);
    if(!show){L.div.style.display='none';continue;}
    if(L.follow)L.pos.set(L.follow.position.x,L.follow.position.y+2.1,L.follow.position.z);
    const s=project(L.pos); if(!s.vis){L.div.style.display='none';continue;}
    L.div.style.display='block';L.div.style.left=s.x+'px';L.div.style.top=s.y+'px';
  }
  renderer.render(scene,camera); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize); resize();
setInterval(()=>document.getElementById('clk').textContent=new Date().toLocaleTimeString('ja-JP'),1000);
</script>
