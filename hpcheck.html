<!DOCTYPE html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUDDICA（HP）チェック</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#f6f7f9;color:#0f172a;font-size:14px}
.wrap{max-width:1200px;margin:0 auto;padding:12px}
.tabs,.months{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tabs a,.tabs button,.months button{flex:1;min-width:90px;padding:10px;border:none;border-radius:6px;background:#e2e8f0;font-weight:800;font-size:15px;cursor:pointer;position:relative;color:#0f172a;text-decoration:none;text-align:center;font-family:inherit}
.months button{font-size:14px;padding:8px}
.tabs .on,.months button.on{background:#2f3b55;color:#fff}
.tabs .dot,.months .dot{position:absolute;top:4px;right:6px;width:10px;height:10px;border-radius:50%}
.big{border-radius:8px;padding:16px;margin:0 0 10px;font-size:22px;font-weight:900;text-align:center}
.big small{display:block;font-size:13px;font-weight:600;margin-top:4px}
.big.ok{background:#dcfce7;color:#166534}.big.ng{background:#fee2e2;color:#991b1b;animation:blink 1s infinite}.big.warn{background:#fef9c3;color:#854d0e}
@keyframes blink{50%{opacity:.55}}
.rule{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;font-size:13px}
.rule span{display:flex;align-items:center;gap:6px;background:#fff;border-radius:6px;padding:6px 10px}
.sw{width:18px;height:18px;border-radius:4px;display:inline-block}
.card{background:#fff;border-radius:8px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin:0 0 10px}
.card h2{margin:2px 0 8px;font-size:16px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:0 0 10px}
.nums div{background:#fff;border-radius:8px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.nums b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.nums span{font-size:12px;color:#475569;font-weight:700}
table.g{border-collapse:separate;border-spacing:2px}
table.g th{font-size:11px;color:#64748b;font-weight:700;padding:2px}
th.sat{color:#2563eb}th.sun{color:#dc2626}
table.g td{width:34px;height:30px;text-align:center;font-weight:800;font-size:12px;border-radius:5px}
td.cls{text-align:left;font-size:15px;font-weight:900;padding:8px 4px 2px;height:auto}
.lbl{position:sticky;left:0;background:#fff;z-index:1;text-align:left!important;white-space:nowrap;padding:0 8px 0 2px;font-size:13px;font-weight:800;width:auto!important}
.lbl small{color:#64748b;font-weight:600;margin-left:4px}
.A{background:#2f3b55}.G{background:#22c55e;color:#fff}.R{background:#dc2626;color:#fff;animation:blink 1s infinite}.Y{background:#facc15;color:#422006}.E{background:#f1f5f9}.W{background:#cbd5e1;color:#334155}
table.l{width:100%;border-collapse:collapse;font-size:13px}
table.l th{text-align:left;font-size:12px;color:#64748b;padding:6px;border-bottom:1px solid #e2e8f0;white-space:nowrap}
table.l td{padding:7px 6px;border-bottom:1px solid #eef2f7;vertical-align:top}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.gap td{height:10px}
.foot{font-size:12px;color:#64748b;text-align:center;margin:6px 0 20px}
</style></head><body>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="big"></div>
  <div class="nums" id="nums"></div>
  <div class="rule">
    <span><i class="sw A"></i>APP の行：予約あり（正解）</span>
    <span><i class="sw G"></i>admin の行：APP と同じ（正しい）</span>
    <span><i class="sw R"></i>admin の行：APPは予約ありなのに空き（HPで二重に売れる・絶対ダメ）</span>
    <span><i class="sw Y"></i>admin の行：APPは空きなのに埋まっている（HPの売り逃し）</span>
  </div>
  <div class="months" id="months"></div>
  <div class="card scroll"><table class="g" id="grid"></table></div>
  <div class="card"><h2>直すもの（ちがう所が赤字）</h2><div class="scroll"><table class="l" id="list"></table></div></div>
  <div class="card"><h2>ロボがadminにしたこと（新しい順）</h2><div class="scroll"><table class="l" id="acts"></table></div></div>
  <div class="foot" id="foot"></div>
</div>
<script>
// BUDDICA の admin（公式HPの在庫）は APP（配車表）を真似するだけ（オーナー 2026-10-26）。対象はたびらい・レンタカードットコム・エアトリ
const DB = { url: 'https://ggqugvyskyiblxiycpci.supabase.co', key: 'sb_publishable_fI8HYYDFn3Soa4kOMbNCAA_oOxGPPKV' };
const STORES = [['nha', '那覇'], ['spk', '札幌'], ['takh', '高松 HDM'], ['takb', '高松 BUDDICA']];
const OTA = { 'たびらい': 'たびらい', 'レンタカードットコム': 'レンタカーコム', 'エアトリ': 'エアトリ' };
// 予約ごとの状態 → 色と言葉
const ST = {
  missing: ['R', 'adminに無い', 'HPで同じ車が売れてしまう。ロボが登録します'],
  car: ['R', '車がちがう', 'APPで車を入れ替えた。ロボがadminの車を入れ替えます'],
  time: ['Y', '時刻がちがう', 'ロボがAPPの時刻に直します'],
  cancel: ['Y', 'キャンセル漏れ', 'APPはキャンセル。ロボがadminもキャンセルにします'],
  dup: ['Y', 'adminに2行ある', 'APPと同じ方を残し、もう1行はスタッフが確認'],
  extra: ['Y', 'adminだけにある', 'APPに無い予約。スタッフが確認'],
  wait: ['W', 'APPで未配車', '車が決まったら自動で入ります。出発3日前までに配車を'],
};
const COLOR = { R: '#dc2626', Y: '#eab308', W: '#94a3b8', G: '#22c55e' };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const jst = t => t ? new Date(t).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const md = t => t ? `${+t.slice(5, 7)}/${+t.slice(8, 10)} ${t.slice(11, 16)}` : '—';
const wd = d => new Date(d + 'T12:00:00+09:00').getDay();
const P = new URLSearchParams(location.search), EMB = P.get('embed') ? '&embed=1' : '';
let D = null, month = null, err = null;

async function load() {
  try {
    const r = await fetch(`${DB.url}/rest/v1/rpc/invctl_hp_dashboard`, { method: 'POST', headers: { apikey: DB.key, Authorization: `Bearer ${DB.key}`, 'Content-Type': 'application/json' }, body: '{}' });
    if (!r.ok) throw new Error(r.status); D = await r.json(); err = null;
  } catch (e) { err = e.message; }
  draw();
}
// 予約が車×日のどこを埋めるか（日付の範囲）
const days = (f, t) => { const a = []; if (!f || !t) return a; for (let d = new Date(f.slice(0, 10) + 'T12:00:00Z'); d.toISOString().slice(0, 10) <= t.slice(0, 10); d.setUTCDate(d.getUTCDate() + 1)) a.push(d.toISOString().slice(0, 10)); return a; };

function draw() {
  $('tabs').innerHTML = STORES.map(([id, n]) => `<a href="invcheck.html?store=${id}${EMB}">${n}</a>`).join('') + `<button class="on">BUDDICA（HP）</button>`;
  if (err) { $('big').innerHTML = `<div class="big warn">読み込めませんでした（${esc(err)}）</div>`; return; }
  if (!D) { $('big').innerHTML = '<div class="big warn">読み込み中…</div>'; return; }
  // 時刻のずれが30分以内は一致とみなす（丸め方のちがい）
  const near = x => x.state === 'time' && (x.rows || []).some(r => r.st !== 3 && Math.abs(new Date(r.f) - new Date(x.af)) <= 30 * 60e3 && Math.abs(new Date(r.t) - new Date(x.at)) <= 30 * 60e3);
  const nNear = (D.rows || []).filter(near).length;
  const rows = (D.rows || []).map(x => near(x) ? { ...x, state: 'ok' } : x), bad = rows.filter(x => x.state !== 'ok');
  const n = k => rows.filter(x => ST[x.state] && ST[x.state][0] === k).length, nr = n('R'), ny = n('Y'), nw = n('W');
  const stale = !D.last_read || Date.now() - new Date(D.last_read) > 60 * 60e3;
  $('big').innerHTML = (stale ? `<div class="big ng">⏸ ロボが admin を ${D.last_read ? '1時間以上' : 'まだ'} 見ていません<small>最後に見た時刻 ${jst(D.last_read)}。mini のロボと admin のログインを確認</small></div>` : '') +
    (nr ? `<div class="big ng">❌ HPで二重に売れてしまう予約 ${nr}件<small>APPの予約が admin に入っていない／車がちがう（ほかに 売り逃し ${ny}件）</small></div>`
      : ny ? `<div class="big warn">⚠ 二重に売れる心配 0・売り逃し ${ny}件<small>admin の方が多く埋まっています。事故にはなりません</small></div>`
      : `<div class="big ok">✅ BUDDICA（HP）：全部OK<small>たびらい・レンタカーコム・エアトリの予約が admin と同じです</small></div>`);
  const live = rows.filter(x => x.ast === 1).length;
  $('nums').innerHTML = [[live, 'APPの予約（今日以降）'], [rows.filter(x => x.ast === 1 && x.state === 'ok').length, 'admin と同じ'], [nr, 'HPで二重に売れる', COLOR.R], [ny, '売り逃し・確認', COLOR.Y], [nw, '未配車で待ち', COLOR.W]]
    .map(([v, l, c]) => `<div><b style="color:${v && c ? c : '#0f172a'}">${v}</b><span>${l}</span></div>`).join('');

  // 車×日。APP の行（正解）と admin の行を上下に並べ、admin の行だけに色を付ける（在庫チェックの OTA の行と同じ見方）
  const app = {}, adm = {}, wait = {};
  for (const x of rows) {
    if (x.ast === 1 && x.ap) for (const d of days(x.af, x.at)) (app[x.ap + '|' + d] ||= []).push(x.rn);
    if (x.ast === 1 && !x.ap) for (const d of days(x.af, x.at)) (wait[d] ||= []).push(x.rn);
    for (const r of (x.rows || [])) if (r.st !== 3) for (const d of days(r.f, r.t)) (adm[r.plate + '|' + d] ||= []).push(x.rn);
  }
  const col = k => app[k] && adm[k] ? 'G' : app[k] ? 'R' : adm[k] ? 'Y' : 'E';
  const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  const keys = [...new Set([...Object.keys(app), ...Object.keys(adm)])];
  const yms = [...new Set([...keys.map(k => k.split('|')[1].slice(0, 7)), ...Object.keys(wait).map(d => d.slice(0, 7))].filter(m => m >= today.slice(0, 7)))].sort();
  if (!yms.length) yms.push(today.slice(0, 7));
  if (!yms.includes(month)) month = yms[0];
  const mc = ym => { const v = keys.filter(k => k.split('|')[1].startsWith(ym) && k.split('|')[1] >= today).map(col); return v.includes('R') ? COLOR.R : v.includes('Y') ? COLOR.Y : v.length ? COLOR.G : ''; };
  $('months').innerHTML = yms.map(ym => `<button class="${ym === month ? 'on' : ''}" data-m="${ym}">${+ym.slice(5)}月${mc(ym) ? `<i class="dot" style="background:${mc(ym)}"></i>` : ''}</button>`).join('');
  $('months').querySelectorAll('button').forEach(b => b.onclick = () => { month = b.dataset.m; draw(); });
  const last = new Date(Date.UTC(+month.slice(0, 4), +month.slice(5), 0)).getUTCDate();
  const ds = Array.from({ length: last }, (_, i) => `${month}-${String(i + 1).padStart(2, '0')}`).filter(d => d >= today);
  const head = `<tr><th class="lbl"></th>${ds.map(d => `<th class="${wd(d) === 6 ? 'sat' : wd(d) === 0 ? 'sun' : ''}">${+d.slice(8)}</th>`).join('')}</tr>`;
  let html = '';
  for (const c of (D.cars || [])) {
    if (!ds.some(d => app[c.plate + '|' + d] || adm[c.plate + '|' + d])) continue; // その月に何も無い車は出さない
    html += `<tr><td class="cls" colspan="${ds.length + 1}">${esc(c.plate)} ${esc(c.name)}<small>（${esc(c.cls)}クラス）</small></td></tr>` + head +
      `<tr><td class="lbl">APP（正解）</td>${ds.map(d => `<td class="${app[c.plate + '|' + d] ? 'A' : 'E'}"></td>`).join('')}</tr>` +
      `<tr><td class="lbl">admin（HP）</td>${ds.map(d => `<td class="${col(c.plate + '|' + d)}"></td>`).join('')}</tr><tr class="gap"><td></td></tr>`;
  }
  if (ds.some(d => wait[d])) html += `<tr><td class="cls" colspan="${ds.length + 1}">APPで未配車（車が決まったら自動で入る）</td></tr>` + head +
    `<tr><td class="lbl">未配車の予約</td>${ds.map(d => `<td class="${wait[d] ? 'W' : 'E'}">${wait[d] ? wait[d].length : ''}</td>`).join('')}</tr>`;
  $('grid').innerHTML = html || `<tr><td>${+month.slice(5)}月はOTAの予約がありません</td></tr>`;

  // 一覧：直すものだけを1行ずつ（予約番号／何がちがう／だれが）。入れ替えた2件は1行にまとめる
  const wide = x => x.state === 'time' && x.bf <= x.af && x.bt >= x.at;
  const plateOf = x => ((x.rows || []).find(r => r.st !== 3) || {}).plate;
  const items = [], used = new Set(), cars = bad.filter(x => x.state === 'car');
  for (const a of cars) {
    if (used.has(a.rn)) continue;
    const b = cars.find(y => y !== a && !used.has(y.rn) && y.ap === plateOf(a) && plateOf(y) === a.ap && y.af < a.at && a.af < y.at); // 期間が重なる2件だけ（片方だけ直すと車がぶつかる）
    if (b) { used.add(a.rn); used.add(b.rn); items.push({ k: 'R', rn: `${a.rn}<br>${b.rn}`, what: `入れ替え（2件同時に直す）<br><small>${esc(plateOf(a))}⇔${esc(a.ap)}</small>`, who: 'ロボ', d: a.af }); }
  }
  const nWide = bad.filter(wide).length;
  const short = t => t ? `${+t.slice(8, 10)}日${t.slice(11, 16)}` : '';
  for (const x of bad) {
    if (used.has(x.rn) || wide(x)) continue;
    const pa = plateOf(x), r0 = (x.rows || []).find(r => r.st !== 3) || {};
    const what = x.state === 'car' ? `車：admin ${esc(pa)} → <b style="color:#dc2626">${esc(x.ap)}</b>`
      : x.state === 'time' ? `時刻：${r0.f !== x.af ? `貸出 ${short(r0.f)} → <b style="color:#dc2626">${short(x.af)}</b> ` : ''}${r0.t !== x.at ? `返却 ${short(r0.t)} → <b style="color:#dc2626">${short(x.at)}</b>` : ''}`
      : x.state === 'missing' ? `未登録：<b style="color:#dc2626">${esc(x.ap)} ${md(x.af)}〜${md(x.at)}</b>`
      : x.state === 'cancel' ? 'キャンセル：APPはキャンセル、adminは確定のまま'
      : x.state === 'dup' ? 'adminに2行ある（二重登録）'
      : x.state === 'extra' ? 'adminだけにある（番号ちがい？）'
      : `APPで未配車（${md(x.af)}〜）`;
    const who = ['missing', 'car', 'time', 'cancel'].includes(x.state) ? 'ロボ' : '人';
    items.push({ k: ST[x.state][0], rn: esc(x.rn) + `<br><small style="color:#64748b">${esc(OTA[x.ota] || '')}</small>`, what, who, d: x.af || x.bf });
  }
  const order = { R: 0, Y: 1, W: 2 };
  items.sort((a, b) => order[a.k] - order[b.k] || String(a.d).localeCompare(String(b.d)));
  $('list').innerHTML = (items.length ? `<tr><th>予約番号</th><th>何がちがう</th><th>だれが</th></tr>` + items.map(i =>
    `<tr><td style="border-left:6px solid ${COLOR[i.k]}">${i.rn}</td><td>${i.what}</td><td>${i.who === 'ロボ' ? '<span class="pill" style="background:#2563eb;color:#fff">ロボが直す</span>' : '<span class="pill" style="background:#f97316;color:#fff">人が見る</span>'}</td></tr>`).join('') : '<tr><td>直すものはありません</td></tr>') +
    (nNear + nWide ? `<tr><td colspan="3" style="color:#64748b">一覧から外したもの：時刻のずれが30分以内（丸め方のちがい）${nNear}件、admin が APP より長く押さえているだけ（売りすぎにはならない）${nWide}件。どちらもロボが APP の時刻に合わせます</td></tr>` : '');
  const acts = D.actions || [];
  $('acts').innerHTML = acts.length ? '<tr><th>時刻</th><th>予約番号</th><th>したこと</th><th>結果</th></tr>' + acts.map(a => `<tr><td>${jst(a.at)}</td><td>${esc(a.rn)}</td><td>${esc(a.action)}</td><td>${a.ok ? '✅' : '❌ ' + esc(a.msg)}</td></tr>`).join('') : '<tr><td>まだありません</td></tr>';
  $('foot').textContent = `ロボが admin を見た時刻 ${jst(D.last_read)}・この画面は5分ごとに自動で更新`;
}
draw(); load(); setInterval(load, 5 * 60e3);
</script>
</body></html>
