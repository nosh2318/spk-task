<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>🌐 HP新規獲得サマリ｜全店統合</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f1f5f9;color:#0f172a}
  .hd{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#4c1d95,#7c3aed);color:#fff;padding:8px 14px 0;box-shadow:0 2px 10px rgba(0,0,0,.18)}
  .hd .t{font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .hd .t span.s{font-size:10.5px;opacity:.85;font-weight:600}
  .tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs button{flex-shrink:0;border:none;border-radius:10px 10px 0 0;padding:9px 18px;font-size:13.5px;font-weight:800;cursor:pointer;background:rgba(255,255,255,.16);color:#ede9fe}
  .tabs button.on{background:#f1f5f9;color:#4c1d95}
  .frames{height:calc(100vh - 92px)}
  .frames iframe{width:100%;height:100%;border:none;display:none;background:#f1f5f9}
  .frames iframe.on{display:block}
</style>
</head>
<body>
<div class="hd">
  <div class="t">🌐 HP新規獲得サマリ — 全店統合 <span class="s">流通ベース／広告費・CPA・効果・リードタイム／店舗をタブで切替</span></div>
  <div class="tabs" id="tabs"></div>
</div>
<div class="frames" id="frames"></div>
<script>
// 各店ページを iframe で束ねる。認証は各iframeが自分のオリジンのログイントークンを使う
//  ・札幌/那覇＝main DB（このオリジン nosh2318 のトークンで動く／同ページを store で切替）
//  ・高松＝BT独立DB（buddica-touring オリジンのトークンが要る→そのオリジンのページを埋め込む）
const TABS=[
  {id:'spk', ico:'❄️', l:'札幌', src:'hp-acquire.html?store=spk'},
  {id:'nha', ico:'🏝️', l:'那覇', src:'hp-acquire.html?store=nha'},
  {id:'bt',  ico:'🚐', l:'高松', src:'https://buddica-touring.github.io/app/hp-acquire.html?store=bt'},
];
const KEY='hp_hub_tab';
let cur=(()=>{try{const v=localStorage.getItem(KEY);return TABS.some(t=>t.id===v)?v:TABS[0].id;}catch(e){return TABS[0].id;}})();
const tabsEl=document.getElementById('tabs'), framesEl=document.getElementById('frames');
function render(){
  tabsEl.innerHTML=TABS.map(t=>'<button class="'+(t.id===cur?'on':'')+'" onclick="go(\''+t.id+'\')">'+t.ico+' '+t.l+'</button>').join('');
  TABS.forEach(t=>{
    let f=document.getElementById('fr_'+t.id);
    if(t.id===cur&&!f){f=document.createElement('iframe');f.id='fr_'+t.id;f.src=t.src;framesEl.appendChild(f);}
    if(f)f.className=(t.id===cur?'on':'');
  });
}
function go(id){cur=id;try{localStorage.setItem(KEY,id);}catch(e){}render();}
render();
</script>
</body>
</html>
