<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>🏢 本社会計 合算（出納帳・カード）</title>
<style>
  :root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--dim:#64748b;--line:#e2e8f0;
        --spk:#2563eb;--nha:#e11d48;--sum:#0f766e;--in:#059669;--out:#dc2626;--card2:#7c3aed}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
  .wrap{max-width:1080px;margin:0 auto;padding:14px 14px 60px}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:12px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px;position:sticky;top:0;z-index:5}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:0;background:#fff;color:var(--dim);padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer}
  .seg button.on{background:var(--sum);color:#fff}
  select,input{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:14px;background:#fff;color:var(--ink)}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;color:#334155}
  .btn:hover{background:#f8fafc}
  .grow{flex:1}
  /* KPI cards */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .kc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .kc .l{font-size:11px;color:var(--dim);font-weight:700;margin-bottom:4px}
  .kc .v{font-size:22px;font-weight:800;letter-spacing:-.01em}
  .kc .s{font-size:11px;color:var(--dim);margin-top:3px}
  .kc.in .v{color:var(--in)} .kc.out .v{color:var(--out)} .kc.card .v{color:var(--card2)} .kc.bal .v{color:var(--sum)}
  /* store cards */
  .stores{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
  @media(max-width:720px){.stores{grid-template-columns:1fr}}
  .sc{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .sc .h{padding:9px 12px;font-weight:800;font-size:14px;color:#fff}
  .sc.spk .h{background:var(--spk)} .sc.nha .h{background:var(--nha)} .sc.sum .h{background:var(--sum)}
  .sc table{width:100%;border-collapse:collapse}
  .sc td{padding:8px 12px;border-top:1px solid var(--line);font-size:13px}
  .sc td.k{color:var(--dim)} .sc td.v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .pos{color:var(--in)} .neg{color:var(--out)}
  /* yearly table */
  .ytbl{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
  table.y{width:100%;border-collapse:collapse;min-width:640px}
  table.y th,table.y td{padding:8px 10px;font-size:12.5px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.y th{background:#f8fafc;color:var(--dim);position:sticky;top:0;font-weight:700}
  table.y td:first-child,table.y th:first-child{text-align:left;position:sticky;left:0;background:#f8fafc}
  table.y tr.tot td{font-weight:800;border-top:2px solid #cbd5e1;background:#f8fafc}
  .muted{color:var(--dim)} .loading{text-align:center;color:var(--dim);padding:40px}
  .foot{margin-top:16px;color:var(--dim);font-size:11px;line-height:1.7}
  .tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700}
  .tag.spk{background:#dbeafe;color:#1d4ed8} .tag.nha{background:#fce7f3;color:#be123c}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>🏢 本社会計 合算</h1>
      <div class="sub">出納帳（現金）＋カード払い ／ 札幌・那覇 合算 ・ 閲覧/集計専用</div>
    </div>
  </div>

  <div class="bar">
    <div class="seg" id="modeSeg">
      <button data-m="month" class="on">📅 月次</button>
      <button data-m="year">📆 年次</button>
    </div>
    <select id="yearSel"></select>
    <select id="monthSel"></select>
    <span class="grow"></span>
    <button class="btn" id="reload">↻ 更新</button>
    <button class="btn" id="csv">⬇️ CSV</button>
  </div>

  <div id="body"><div class="loading">読み込み中…</div></div>

  <div class="foot" id="foot"></div>
</div>

<script>
const SB="https://ckrxttbnawkclshczsia.supabase.co";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
const H={apikey:ANON,Authorization:"Bearer "+ANON};
const STORES=[
  {key:"spk",name:"札幌",tbl:"spk_accounting",obTbl:"app_settings",obKey:"spk_opening_balance",cls:"spk"},
  {key:"nha",name:"那覇",tbl:"nha_accounting",obTbl:"nha_app_settings",obKey:"opening_balances",cls:"nha"},
];
let MODE="month";
let OB={}; // store.key -> {YM:amount}
let DATA=null; // rendered dataset for CSV

const yen=n=>"¥"+Math.round(n||0).toLocaleString();
const signCls=n=>n>0?"pos":n<0?"neg":"";
const pad2=n=>String(n).padStart(2,"0");

async function sbGet(path){
  const r=await fetch(SB+"/rest/v1/"+path,{headers:H});
  if(!r.ok) throw new Error(path+" "+r.status);
  return r.json();
}

// 月初残高設定(全店)を1回ロード
async function loadOB(){
  for(const s of STORES){
    try{
      const r=await sbGet(`${s.obTbl}?key=eq.${s.obKey}&select=value`);
      let v=r&&r[0]?r[0].value:null;
      if(typeof v==="string"){try{v=JSON.parse(v);}catch(e){v={};}}
      OB[s.key]=v||{};
    }catch(e){OB[s.key]={};}
  }
}

// 店×期間の会計行を取得(出納帳+カードのみ)
async function fetchRows(s, gte, lt){
  const q=`${s.tbl}?select=date,type,category,amount,paid,description,resv_no,staff_name,user_name,payee&type=in.(cash_in,cash_out,card_pay)&date=gte.${gte}&date=lt.${lt}&order=date.asc&limit=5000`;
  try{return await sbGet(q);}catch(e){return [];}
}

// 1店1ヶ月の集計(アプリと同一式)
function calcMonth(rows, ymOB){
  let cashIn=0,cashOut=0,cashCollected=0,cardTotal=0,cardPaid=0,cardUnpaid=0;
  rows.forEach(r=>{
    const a=+r.amount||0;
    if(r.type==="cash_in"){cashIn+=a; if(r.category==="現金売上"&&r.paid)cashCollected+=a;}
    else if(r.type==="cash_out")cashOut+=a;
    else if(r.type==="card_pay"){cardTotal+=a; if(r.paid)cardPaid+=a; else cardUnpaid+=a;}
  });
  const net=cashIn-cashOut;
  const opening=+ymOB||0;
  const onHand=opening+net-cashCollected; // 現金残高=月初+当月収支-回収済現金売上
  return {cashIn,cashOut,net,opening,onHand,cardTotal,cardPaid,cardUnpaid,count:rows.length};
}

function emptyAgg(){return {cashIn:0,cashOut:0,net:0,opening:0,onHand:0,cardTotal:0,cardPaid:0,cardUnpaid:0,count:0};}
function addAgg(a,b){for(const k in a){a[k]+=b[k];}return a;}

/* ---------- 月次 ---------- */
async function renderMonth(y,m){
  const gte=`${y}-${pad2(m)}-01`;
  const nm=m===12?1:m+1, ny=m===12?y+1:y;
  const lt=`${ny}-${pad2(nm)}-01`;
  const ym=`${y}-${pad2(m)}`;
  const per={};
  for(const s of STORES){
    const rows=await fetchRows(s,gte,lt);
    per[s.key]=calcMonth(rows,(OB[s.key]||{})[ym]);
  }
  const sum=STORES.reduce((acc,s)=>addAgg(acc,{...per[s.key]}),emptyAgg());
  DATA={mode:"month",ym,per,sum};

  const kpi=(cls,l,v,s)=>`<div class="kc ${cls}"><div class="l">${l}</div><div class="v">${yen(v)}</div>${s?`<div class="s">${s}</div>`:""}</div>`;
  const kpis=`<div class="kpis">
    ${kpi("in","現金入金 合算",sum.cashIn)}
    ${kpi("out","出金 合算",sum.cashOut)}
    ${kpi("bal","当月収支 合算",sum.net,"入金−出金")}
    ${kpi("card","カード払い 合算",sum.cardTotal,`入金済 ${yen(sum.cardPaid)} / 未 ${yen(sum.cardUnpaid)}`)}
    ${kpi("bal","現金残高 合算",sum.onHand,"月初+収支−回収")}
  </div>`;

  const storeCard=(cls,name,d)=>`<div class="sc ${cls}"><div class="h">${name}</div><table>
    <tr><td class="k">現金入金</td><td class="v pos">${yen(d.cashIn)}</td></tr>
    <tr><td class="k">出金</td><td class="v neg">${yen(d.cashOut)}</td></tr>
    <tr><td class="k">当月収支</td><td class="v ${signCls(d.net)}">${yen(d.net)}</td></tr>
    <tr><td class="k">月初残高</td><td class="v">${yen(d.opening)}</td></tr>
    <tr><td class="k">現金残高</td><td class="v ${signCls(d.onHand)}">${yen(d.onHand)}</td></tr>
    <tr><td class="k">カード払い</td><td class="v" style="color:var(--card2)">${yen(d.cardTotal)}</td></tr>
    <tr><td class="k muted">└ 入金済/未</td><td class="v muted" style="font-weight:600">${yen(d.cardPaid)} / ${yen(d.cardUnpaid)}</td></tr>
    <tr><td class="k muted">明細件数</td><td class="v muted" style="font-weight:600">${d.count}件</td></tr>
  </table></div>`;

  document.getElementById("body").innerHTML=kpis+`<div class="stores">
    ${storeCard("spk","🔵 札幌",per.spk)}
    ${storeCard("nha","🔴 那覇",per.nha)}
    ${storeCard("sum","🏢 合算",sum)}
  </div>`;
  document.getElementById("foot").innerHTML=`※ アプリの会計タブと同じ計算式で集計（現金入金=cash_in・出金=cash_out・現金残高=月初+当月収支−回収済現金売上・カード=card_pay）。登録/修正は各店APPで。`;
}

/* ---------- 年次 ---------- */
async function renderYear(y){
  const gte=`${y}-01-01`, lt=`${y+1}-01-01`;
  const allRows={};
  for(const s of STORES){ allRows[s.key]=await fetchRows(s,gte,lt); }
  // 月別に振り分け
  const months=[];
  for(let m=1;m<=12;m++){
    const ym=`${y}-${pad2(m)}`;
    const per={};
    for(const s of STORES){
      const rows=allRows[s.key].filter(r=>(r.date||"").slice(0,7)===ym);
      per[s.key]=calcMonth(rows,(OB[s.key]||{})[ym]);
    }
    const sum=STORES.reduce((acc,s)=>addAgg(acc,{...per[s.key]}),emptyAgg());
    months.push({m,ym,per,sum});
  }
  const yt=months.reduce((a,mo)=>{a.cashIn+=mo.sum.cashIn;a.cashOut+=mo.sum.cashOut;a.net+=mo.sum.net;a.cardTotal+=mo.sum.cardTotal;return a;},{cashIn:0,cashOut:0,net:0,cardTotal:0});
  DATA={mode:"year",year:y,months,yt};

  const kpi=(cls,l,v)=>`<div class="kc ${cls}"><div class="l">${l}</div><div class="v">${yen(v)}</div></div>`;
  const kpis=`<div class="kpis">
    ${kpi("in",`${y}年 現金入金 合算`,yt.cashIn)}
    ${kpi("out",`${y}年 出金 合算`,yt.cashOut)}
    ${kpi("bal",`${y}年 収支 合算`,yt.net)}
    ${kpi("card",`${y}年 カード払い 合算`,yt.cardTotal)}
  </div>`;

  let rows="";
  months.forEach(mo=>{
    rows+=`<tr>
      <td>${mo.m}月</td>
      <td class="pos">${yen(mo.sum.cashIn)}</td>
      <td class="neg">${yen(mo.sum.cashOut)}</td>
      <td class="${signCls(mo.sum.net)}">${yen(mo.sum.net)}</td>
      <td style="color:var(--card2)">${yen(mo.sum.cardTotal)}</td>
      <td class="muted"><span class="tag spk">札 ${yen(mo.per.spk.cardTotal)}</span> <span class="tag nha">那 ${yen(mo.per.nha.cardTotal)}</span></td>
    </tr>`;
  });
  const tbl=`<div class="ytbl"><table class="y">
    <thead><tr><th>月</th><th>現金入金</th><th>出金</th><th>当月収支</th><th>カード払い(合算)</th><th>カード内訳</th></tr></thead>
    <tbody>${rows}
      <tr class="tot"><td>${y}年 計</td><td class="pos">${yen(yt.cashIn)}</td><td class="neg">${yen(yt.cashOut)}</td><td class="${signCls(yt.net)}">${yen(yt.net)}</td><td style="color:var(--card2)">${yen(yt.cardTotal)}</td><td></td></tr>
    </tbody></table></div>`;
  document.getElementById("body").innerHTML=kpis+tbl;
  document.getElementById("foot").innerHTML=`※ 月別＝札幌+那覇の合算。現金入金/出金/収支は各店 cash_in/cash_out、カードは card_pay。数字は各店APPの会計と一致。`;
}

/* ---------- CSV ---------- */
function toCSV(){
  if(!DATA) return;
  let lines=[];
  if(DATA.mode==="month"){
    lines.push(["本社会計合算",DATA.ym]);
    lines.push(["店舗","現金入金","出金","当月収支","月初残高","現金残高","カード払い","カード入金済","カード未入金","件数"]);
    STORES.forEach(s=>{const d=DATA.per[s.key];lines.push([s.name,d.cashIn,d.cashOut,d.net,d.opening,d.onHand,d.cardTotal,d.cardPaid,d.cardUnpaid,d.count]);});
    const d=DATA.sum;lines.push(["合算",d.cashIn,d.cashOut,d.net,d.opening,d.onHand,d.cardTotal,d.cardPaid,d.cardUnpaid,d.count]);
  }else{
    lines.push(["本社会計合算(年次)",DATA.year+"年"]);
    lines.push(["月","現金入金(合算)","出金(合算)","当月収支(合算)","カード払い(合算)","カード札幌","カード那覇"]);
    DATA.months.forEach(mo=>lines.push([mo.m+"月",mo.sum.cashIn,mo.sum.cashOut,mo.sum.net,mo.sum.cardTotal,mo.per.spk.cardTotal,mo.per.nha.cardTotal]));
    lines.push(["年計",DATA.yt.cashIn,DATA.yt.cashOut,DATA.yt.net,DATA.yt.cardTotal,"",""]);
  }
  const csv="﻿"+lines.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`本社会計合算_${DATA.mode==="month"?DATA.ym:DATA.year+"年"}.csv`;a.click();
}

/* ---------- init ---------- */
function initPickers(){
  const now=new Date();
  const ys=document.getElementById("yearSel"), ms=document.getElementById("monthSel");
  for(let y=now.getFullYear()+1;y>=2026;y--){const o=document.createElement("option");o.value=y;o.textContent=y+"年";ys.appendChild(o);}
  ys.value=now.getFullYear();
  for(let m=1;m<=12;m++){const o=document.createElement("option");o.value=m;o.textContent=m+"月";ms.appendChild(o);}
  ms.value=now.getMonth()+1;
}
async function render(){
  document.getElementById("body").innerHTML='<div class="loading">集計中…</div>';
  const y=+document.getElementById("yearSel").value, m=+document.getElementById("monthSel").value;
  document.getElementById("monthSel").style.display=MODE==="month"?"":"none";
  try{
    if(MODE==="month") await renderMonth(y,m); else await renderYear(y);
  }catch(e){document.getElementById("body").innerHTML='<div class="loading">読込エラー: '+e.message+'</div>';}
}
document.getElementById("modeSeg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  MODE=b.dataset.m;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle("on",x===b));
  render();
});
document.getElementById("yearSel").addEventListener("change",render);
document.getElementById("monthSel").addEventListener("change",render);
document.getElementById("reload").addEventListener("click",render);
document.getElementById("csv").addEventListener("click",toCSV);

(async()=>{initPickers();await loadOB();render();})();
</script>
</body>
</html>
