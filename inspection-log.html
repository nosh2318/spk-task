<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>点検記録 | HANDYMAN 札幌</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:#f1f5f9;color:#0f172a;font-size:14px}
.wrap{max-width:900px;margin:0 auto;padding:12px 12px 60px}
h1{font-size:18px;margin:4px 0 2px}
.sub{font-size:11.5px;color:#64748b;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:1px solid #cbd5e1;background:#fff;border-radius:10px;padding:9px;font-size:14px;font-weight:900;color:#334155;cursor:pointer}
.tabs button.on{background:#0f172a;color:#fff;border-color:#0f172a}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.bar select,.bar input{border:1px solid #cbd5e1;border-radius:8px;padding:7px 9px;font-size:14px;background:#fff;font-family:inherit}
.bar input[type=search]{flex:1;min-width:140px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;color:#475569;cursor:pointer}
.seg button.on{background:#0f172a;color:#fff;border-color:#0f172a}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.sum div{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:800;color:#475569}
.sum b{font-size:16px;color:#0f172a;margin-left:4px}
.day{font-size:13px;font-weight:900;margin:14px 2px 6px}
.card{background:#fff;border:1px solid #e2e8f0;border-left:5px solid #94a3b8;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.card.done{border-left-color:#16a34a}.card.part{border-left-color:#f59e0b}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kd{font-size:11px;font-weight:900;border-radius:6px;padding:2px 8px;color:#fff}
.kd.pre{background:#2563eb}.kd.post{background:#7c3aed}
.car{font-weight:800;font-size:14.5px}
.meta{font-size:11.5px;color:#64748b;margin-top:3px}
.pg{margin-left:auto;font-size:12px;font-weight:900;border-radius:999px;padding:3px 10px;background:#f1f5f9;color:#475569}
.card.done .pg{background:#16a34a;color:#fff}.card.part .pg{background:#fef3c7;color:#92400e}
.ng{margin-top:6px;font-size:12px;color:#b91c1c;font-weight:700}
.memo{margin-top:6px;font-size:13px;background:#f8fafc;border-radius:8px;padding:6px 9px;white-space:pre-wrap}
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ph a{display:block;width:72px;height:72px;border-radius:8px;overflow:hidden;background:#e2e8f0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.st{font-size:12px;font-weight:900;color:#fff;border-radius:999px;padding:2px 10px}
.empty,.loading{color:#94a3b8;padding:24px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔧 点検記録</h1>
  <div class="sub">洗車タスク（出発前点検）・返却タスク（返却後点検）でチェックした記録です。この画面は見るだけです。</div>
  <div class="tabs" id="tabs" style="display:none"><button data-t="insp" class="on">🔧 点検</button><button data-t="tire">🛞 タイヤ</button></div>
  <div id="vInsp">
    <div class="bar">
      <select id="per"><option value="7">直近7日</option><option value="14">直近14日</option><option value="31">直近31日</option></select>
      <div class="seg" id="kind"><button data-k="all" class="on">すべて</button><button data-k="pre">出発前</button><button data-k="post">返却後</button></div>
      <input type="search" id="q" placeholder="車両名・ナンバー・担当者">
    </div>
    <div class="sum" id="sum"></div>
    <div id="list" class="loading">読み込み中…</div>
  </div>
  <div id="vTire" style="display:none">
    <div class="bar"><div class="seg" id="tst"><button data-s="" class="on">すべて</button><button data-s="交換">交換</button><button data-s="相談">相談</button><button data-s="未確認">未確認</button><button data-s="確認済">確認済</button></div></div>
    <div class="sum" id="tsum"></div>
    <div id="tlist" class="loading">読み込み中…</div>
  </div>
</div>
<script>
const P="spk";
const SB_URL='https://ckrxttbnawkclshczsia.supabase.co';
const SB_KEY='sb_publishable_aTVhlY0YD-5BBfI03ZNnsg_MzO_vsIe';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
// 項目はスタッフ専用ページ(staff.html)の WC_ITEMS と同じキー（増減したら両方を揃える）
const ITEMS={
  post:[["damage","外装の新しい傷・へこみ"],["tire_tread","タイヤ溝（スリップサイン）"],["tire_damage","タイヤ損傷（パンク・亀裂）"],["lost","忘れ物なし"],["dirt","車内の汚れ・臭い（喫煙・ペット）"],["fuel","燃料（満タン返却）"],["warning","警告灯なし"],["etc_card","ETCカード抜き取り"],["key","鍵・付属品の返却"]],
  pre:[["exterior","外装の傷・へこみ確認"],["interior","車内清掃・ゴミなし"],["fuel","燃料 満タン"],["washer","ウォッシャー液"],["oil","エンジンオイル量"],["coolant","冷却水量"],["tire_air","タイヤ空気圧・外観（亀裂・釘）"],["lights","ライト類（前照灯・ブレーキ・ウインカー）"],["warning","警告灯なし（エンジン始動）"],["aircon","エアコン作動"],["docs","車検証・自賠責・取扱説明書"]]
};
const CKCOL={"未確認":"#64748b","確認済":"#166534","交換":"#b91c1c","相談":"#7e22ce"};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=at=>{if(!at)return "";const d=new Date(at);return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
const WD="日月火水木金土";
let REC=[],KIND="all",VEH={},TREC=[],TST="";
async function signAll(bucket,paths){
  const st=sb.storage.from(bucket),u={};if(!paths.length)return u;
  for(let i=0;i<paths.length;i+=100){const {data}=await st.createSignedUrls(paths.slice(i,i+100),3600);(data||[]).forEach(d=>{if(d.signedUrl)u[d.path]={full:d.signedUrl,thumb:d.signedUrl};});}
  const q=paths.slice();const w=async()=>{while(q.length){const p=q.shift();try{const r=await st.createSignedUrl(p,3600,{transform:{width:240,height:240,resize:"cover",quality:70}});if(r.data&&r.data.signedUrl&&u[p])u[p].thumb=r.data.signedUrl;}catch(e){}}};
  await Promise.all([0,1,2,3,4,5].map(w));return u;
}
async function needLogin(el){const {data:{session}}=await sb.auth.getSession();if(!session){el.className="";el.innerHTML='⚠️ 本体APPでログインしてから開いてください（同じブラウザでAPPにログイン済みなら自動で繋がります）';return true;}return false;}
async function loadVeh(){if(Object.keys(VEH).length)return;const {data}=await sb.from(P==="nha"?"nha_vehicles":"vehicles").select("code,name,plate_no,type,active");(data||[]).forEach(v=>VEH[v.code]=v);}
async function load(){
  $("list").className="loading";$("list").textContent="読み込み中…";
  if(await needLogin($("list")))return;
  const since=new Date(Date.now()-(+$("per").value)*864e5).toISOString();
  const [cr,pr]=await Promise.all([
    sb.from(P+"_inspection_checks").select("*").gte("updated_at",since).order("updated_at",{ascending:false}).limit(5000),
    sb.from(P+"_inspection_photos").select("*").eq("deleted",false).gte("created_at",since).order("created_at").limit(2000)]);
  if(cr.error||pr.error){$("list").className="";$("list").innerHTML='取得失敗：'+esc((cr.error||pr.error).message);return;}
  await loadVeh();
  const g={};const key=(t,k)=>t+"|"+k;
  const ens=(t,k,vc,d)=>{const kk=key(t,k);return g[kk]=g[kk]||{tid:t,kind:k,vc:vc,date:d,checks:{},photos:[],last:null,by:new Set()};};
  (cr.data||[]).forEach(c=>{const x=ens(c.task_id,c.kind,c.vehicle_code,c.task_date);x.checks[c.item_key]=c;if(c.checked_by)x.by.add(c.checked_by);if(!x.last||c.updated_at>x.last)x.last=c.updated_at;});
  (pr.data||[]).forEach(p=>{const x=ens(p.task_id,p.kind,p.vehicle_code,p.task_date);x.photos.push(p);if(p.uploaded_by)x.by.add(p.uploaded_by);if(!x.last||p.created_at>x.last)x.last=p.created_at;});
  const urls=await signAll(P+"-inspections",(pr.data||[]).map(p=>p.path));
  REC=Object.values(g).map(x=>{const items=ITEMS[x.kind]||[];const v=VEH[x.vc]||{};const n=items.filter(([k])=>x.checks[k]&&x.checks[k].checked).length;
    return Object.assign(x,{v,n,t:items.length,ng:items.filter(([k])=>!(x.checks[k]&&x.checks[k].checked)).map(([,l])=>l),memo:(x.checks._memo&&x.checks._memo.note)||"",urls,byTxt:[...x.by].join("・")});});
  render();
}
function render(){
  const q=$("q").value.trim().toLowerCase();
  const list=REC.filter(x=>(KIND==="all"||x.kind===KIND)&&(!q||[x.v.name,x.v.plate_no,x.vc,x.byTxt].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.last).localeCompare(String(a.last)));
  const done=list.filter(x=>x.n===x.t).length;
  $("sum").innerHTML='<div>記録<b>'+list.length+'</b></div><div>完了<b style="color:#16a34a">'+done+'</b></div><div>途中<b style="color:#b45309">'+(list.length-done)+'</b></div>';
  if(!list.length){$("list").className="empty";$("list").textContent="この期間の点検記録はありません";return;}
  $("list").className="";
  let html="",prev="";
  list.forEach(x=>{
    if(x.date!==prev){prev=x.date;html+='<div class="day">📅 '+(+String(x.date).slice(5,7))+'/'+(+String(x.date).slice(8,10))+'（'+WD[new Date(x.date+"T00:00:00Z").getUTCDay()]+'）</div>';}
    const st=x.n===x.t?"done":(x.n>0?"part":"");
    html+='<div class="card '+st+'"><div class="hd"><span class="kd '+x.kind+'">'+(x.kind==="pre"?"出発前":"返却後")+'</span><span class="car">'+esc(x.v.name||x.vc||"車両不明")+' '+esc(x.v.plate_no||"")+'</span><span class="pg">'+x.n+' / '+x.t+'</span></div>'+
      '<div class="meta">担当 '+esc(x.byTxt||"-")+'・最終更新 '+fmt(x.last)+'</div>'+
      (x.n<x.t?'<div class="ng">未チェック：'+x.ng.map(esc).join("・")+'</div>':'')+
      (x.memo?'<div class="memo">'+esc(x.memo)+'</div>':'')+
      (x.photos.length?'<div class="ph">'+x.photos.map(p=>{const u=x.urls[p.path];return u?'<a href="'+esc(u.full)+'" target="_blank" rel="noopener"><img src="'+esc(u.thumb)+'" loading="lazy" alt=""></a>':'';}).join("")+'</div>':'')+
    '</div>';
  });
  $("list").innerHTML=html;
}
// 🛞 タイヤ（那覇のみ・札幌はAPPの🛞タイヤ画面に統合済み）：今年度の行＋写真
const fy=()=>{const d=new Date(Date.now()+9*3600e3);return d.getUTCMonth()+1>=4?d.getUTCFullYear():d.getUTCFullYear()-1;};
async function loadTire(){
  $("tlist").className="loading";$("tlist").textContent="読み込み中…";
  if(await needLogin($("tlist")))return;
  await loadVeh();
  const y=fy();
  const [tr,pr]=await Promise.all([sb.from(P+"_tire_status").select("*").eq("year",y),sb.from(P+"_tire_photos").select("*").eq("deleted",false).eq("year",y).order("created_at")]);
  if(tr.error||pr.error){$("tlist").className="";$("tlist").innerHTML='取得失敗：'+esc((tr.error||pr.error).message);return;}
  const T={};(tr.data||[]).forEach(r=>T[r.vehicle_code]=r);const PH={};(pr.data||[]).forEach(p=>{(PH[p.vehicle_code]=PH[p.vehicle_code]||[]).push(p);});
  const urls=await signAll(P+"-tires",(pr.data||[]).map(p=>p.path));
  TREC=Object.values(VEH).filter(v=>v.active!==false).map(v=>({v,t:T[v.code]||{},ph:PH[v.code]||[],urls}))
    .sort((a,b)=>String(a.v.type||"").localeCompare(String(b.v.type||""))||String(a.v.plate_no||"").localeCompare(String(b.v.plate_no||"")));
  renderTire();
}
function renderTire(){
  const stOf=x=>x.t.check_status||"未確認";
  const cnt={};TREC.forEach(x=>{cnt[stOf(x)]=(cnt[stOf(x)]||0)+1;});
  $("tsum").innerHTML='<div>'+fy()+'年度<b>'+TREC.length+'</b>台</div>'+["確認済","交換","相談","未確認"].map(s=>'<div>'+s+'<b style="color:'+CKCOL[s]+'">'+(cnt[s]||0)+'</b></div>').join("");
  const list=TST?TREC.filter(x=>stOf(x)===TST):TREC;
  if(!list.length){$("tlist").className="empty";$("tlist").textContent="該当する車両はありません";return;}
  $("tlist").className="";
  $("tlist").innerHTML=list.map(x=>{const s=stOf(x);return '<div class="card" style="border-left-color:'+CKCOL[s]+'"><div class="hd"><span class="car">'+esc(x.v.name||x.v.code)+' '+esc(x.v.plate_no||"")+'</span><span class="st" style="background:'+CKCOL[s]+'">'+s+'</span></div>'+
    '<div class="meta">'+(x.t.check_at?'最終チェック '+fmt(x.t.check_at)+' '+esc(x.t.check_by||""):'まだチェックされていません')+'</div>'+
    ((x.t.plan_date||x.t.dest)?'<div class="meta" style="color:#334155;font-weight:700">'+(x.t.plan_date?'交換予定 '+esc(x.t.plan_date):'')+(x.t.plan_date&&x.t.dest?'・':'')+(x.t.dest?'入庫先 '+esc(x.t.dest):'')+'</div>':'')+
    (x.t.memo?'<div class="memo">'+esc(x.t.memo)+'</div>':'')+
    (x.ph.length?'<div class="ph">'+x.ph.map(p=>{const u=x.urls[p.path];return u?'<a href="'+esc(u.full)+'" target="_blank" rel="noopener"><img src="'+esc(u.thumb)+'" loading="lazy" alt=""></a>':'';}).join("")+'</div>':'')+'</div>';}).join("");
}
$("per").addEventListener("change",load);
$("q").addEventListener("input",render);
$("kind").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;KIND=b.dataset.k;document.querySelectorAll("#kind button").forEach(x=>x.classList.toggle("on",x===b));render();});
$("tst").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;TST=b.dataset.s;document.querySelectorAll("#tst button").forEach(x=>x.classList.toggle("on",x===b));renderTire();});
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));const t=b.dataset.t==="tire";$("vInsp").style.display=t?"none":"";$("vTire").style.display=t?"":"none";if(t&&!TREC.length)loadTire();});
load();
</script>
</body>
</html>
