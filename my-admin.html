<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>マイページ管理 | HANDYMAN 札幌</title>
<style>
:root{--bg:#f1f4f7;--card:#fff;--ink:#1c2430;--sub:#6b7784;--line:#e4e8ee;--accent:#0e7a6b;
  --gold:#b45309;--danger:#b91c1c;--ok:#0e9f50;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:0 12px 60px}
.top{display:flex;align-items:center;gap:8px;padding:16px 4px 10px}
.logo{font-weight:900;font-size:17px}.logo b{color:var(--accent)}
.top .t{font-weight:800;font-size:15px}
.store{margin-left:auto;font-size:12px;color:var(--sub);border:1px solid var(--line);padding:3px 10px;border-radius:999px;background:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(20,30,45,.05)}
.card h2{margin:0 0 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px}
.badge{background:var(--danger);color:#fff;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;margin-left:2px}
.cfgrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.cfgrow:first-of-type{border-top:0}
.cfgrow .cl{flex:1;font-weight:700}
.cfgrow .cl small{display:block;font-weight:500;color:var(--sub);font-size:11.5px}
.sw{width:46px;height:26px;border-radius:999px;background:#cbd5e1;position:relative;cursor:pointer;flex:none;transition:.2s}
.sw.on{background:var(--ok)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on::after{left:23px}
.inp{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:14px;width:90px}
.inp.wide{width:220px}
.savebar{display:flex;gap:8px;margin-top:12px}
.btn{padding:9px 14px;border-radius:9px;font-weight:800;font-size:13px;border:0;cursor:pointer}
.btn.pri{background:var(--accent);color:#fff}.btn.ok{background:var(--ok);color:#fff}
.btn.dang{background:#fff;color:var(--danger);border:1.5px solid #f0c2c2}
.btn.ghost{background:#eef1f4;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--sub)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.item.req{border-left:4px solid var(--gold);background:#fffdf7}
.item.cancel{border-left:4px solid var(--danger);background:#fff7f7}
.item.applied{border-left:4px solid var(--ok)}
.item .ih{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px}
.item .rid{font-family:ui-monospace,monospace;color:var(--sub);font-size:12px}
.item .body{font-size:13px;margin-top:4px}
.item .arrow{color:var(--gold);font-weight:800}
.item .meta{font-size:11px;color:var(--sub);margin-top:3px}
.st{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:auto}
.st.requested{background:#fef3c7;color:var(--gold)}.st.applied{background:#dcfce7;color:var(--ok)}
.st.approved{background:#dbeafe;color:#1d4ed8}.st.rejected{background:#f1f5f9;color:var(--sub)}
.acts{display:flex;gap:8px;margin-top:9px}
.acts .btn{flex:1;padding:8px}
.warn{border:1px solid #f3c9c9;background:#fff6f6;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.warn b{color:var(--danger)}
.mmrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;margin-top:5px}
.mmrow .lab{color:var(--sub);font-size:10px}
.empty{text-align:center;color:var(--sub);padding:22px;font-size:13px}
.login{max-width:360px;margin:60px auto;text-align:center}
.login input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px;font-size:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2430;color:#fff;padding:11px 18px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.25s;z-index:99}
.toast.show{opacity:1}
.spin{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="spin"></div></div>
<div class="toast" id="toast"></div>
<script>
const SB="https://ckrxttbnawkclshczsia.supabase.co";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
const $=s=>document.querySelector(s);
let CFG=null, CHANGES=[], FILTER="req", MISMATCH=[];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
function tok(){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf("sb-")===0&&k.indexOf("auth-token")>=0){let v=null;try{v=JSON.parse(localStorage.getItem(k))}catch(e){continue}const t=(v&&v.access_token)||(v&&v.currentSession&&v.currentSession.access_token)||(v&&v.session&&v.session.access_token)||(Array.isArray(v)&&typeof v[0]==="string"?v[0]:null);if(t)return t}}}catch(e){}return null}
function H(){const t=tok();return{apikey:ANON,Authorization:"Bearer "+(t||ANON),"Content-Type":"application/json"}}
async function api(path,opt){const r=await fetch(SB+"/rest/v1/"+path,{...opt,headers:{...H(),...(opt&&opt.headers||{})}});if(!r.ok)throw new Error(await r.text());const ct=r.headers.get("content-type")||"";return ct.includes("json")?r.json():null}

const FLD={del_place:"お届け先",col_place:"回収先",lend_time:"お届け時間",return_time:"回収時間",
  option:"オプション変更",insurance:"補償変更",method:"受渡方法変更",cancel:"キャンセル申請"};
function isReq(c){return c.status==="requested"}

async function loadAll(){
  const [cfg,changes]=await Promise.all([
    api("spk_line_config?id=eq.1&select=*"),
    api("mypage_changes?store=eq.spk&order=created_at.desc&limit=200&select=*"),
  ]);
  CFG=cfg[0]||{}; CHANGES=changes||[];
  await buildMismatch();
  render();
}
async function buildMismatch(){
  MISMATCH=[];
  // 直近の場所変更(applied)の予約について、reservations.del/col_place と OPシート(tasks _ssPlace)の食い違いを検出
  const ids=[...new Set(CHANGES.filter(c=>c.status==="applied"&&(c.field==="del_place"||c.field==="col_place")).map(c=>c.reservation_id))].slice(0,40);
  if(!ids.length)return;
  const inList="("+ids.map(encodeURIComponent).join(",")+")";
  let res=[],tasks=[];
  try{res=await api("reservations?id=in."+inList+"&select=id,name,del_place,col_place");}catch(e){return}
  try{tasks=await api("tasks?reservation_id=in."+inList+"&select=_id,reservation_id,place,changed_json");}catch(e){}
  const tmap={};
  tasks.forEach(t=>{let cj={};try{cj=JSON.parse(t.changed_json||"{}")}catch(e){}
    const kind=t._id.slice(0,2); const ss=cj._ssPlace||t.place||"";
    if(kind==="d-")tmap[t.reservation_id]=Object.assign(tmap[t.reservation_id]||{},{del:ss});
    if(kind==="c-")tmap[t.reservation_id]=Object.assign(tmap[t.reservation_id]||{},{col:ss});
  });
  res.forEach(r=>{const tm=tmap[r.id]||{};
    if(r.del_place&&tm.del!==undefined&&r.del_place!==tm.del)MISMATCH.push({id:r.id,name:r.name,kind:"お届け先",resv:r.del_place,op:tm.del});
    if(r.col_place&&tm.col!==undefined&&r.col_place!==tm.col)MISMATCH.push({id:r.id,name:r.name,kind:"回収先",resv:r.col_place,op:tm.col});
  });
}

async function saveCfg(){
  const body={damage_enabled:CFG.damage_enabled,track_enabled:CFG.track_enabled,thanks_enabled:CFG.thanks_enabled,
    test_mode:CFG.test_mode,test_user_id:CFG.test_user_id||"",lead_min:parseInt(CFG.lead_min)||30};
  try{await api("spk_line_config?id=eq.1",{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(body)});
    toast("設定を保存しました");}catch(e){toast("保存失敗（ログイン要）")}
}
async function decide(id,status){
  try{await api("mypage_changes?id=eq."+id,{method:"PATCH",headers:{Prefer:"return=minimal"},
    body:JSON.stringify({status})});
    const c=CHANGES.find(x=>x.id===id);if(c)c.status=status;
    toast(status==="approved"?"承認しました":"却下しました");render();
  }catch(e){toast("更新失敗（ログイン要）")}
}

function render(){
  const reqCount=CHANGES.filter(isReq).length;
  const cfgSw=(k,label,sub)=>`<div class="cfgrow"><div class="cl">${label}${sub?`<small>${sub}</small>`:""}</div>
    <div class="sw ${CFG[k]?"on":""}" onclick="CFG.${k}=!CFG.${k};render()"></div></div>`;
  const list=CHANGES.filter(c=>FILTER==="all"?true:FILTER==="req"?isReq(c):c.status==="applied");
  $("#app").innerHTML=`
  <div class="top"><div class="logo">HAND<b>Y</b>MAN</div><div class="t">マイページ管理</div><div class="store">札幌店</div></div>

  <div class="card">
    <h2>⚙️ 自動送信トリガー設定</h2>
    ${cfgSw("damage_enabled","🩹 車両状態チェック 自動送信","出発前に傷チェックURLを送信")}
    <div class="cfgrow"><div class="cl">└ 発火：出発の何分前</div>
      <input class="inp" type="number" value="${CFG.lead_min||30}" onchange="CFG.lead_min=this.value"> 分前</div>
    ${cfgSw("track_enabled","🛰 位置追跡 自動送信","出発/回収開始で追跡URLを送信")}
    ${cfgSw("thanks_enabled","🙏 御礼 自動送信","返却翌日に御礼メッセージ")}
    ${cfgSw("test_mode","🧪 テストモード","ONの間は下記の宛先にのみ送信（本番停止）")}
    <div class="cfgrow"><div class="cl">└ テスト宛先 userId</div>
      <input class="inp wide" value="${esc(CFG.test_user_id||"")}" onchange="CFG.test_user_id=this.value" placeholder="U..."></div>
    <div class="savebar"><button class="btn pri" onclick="saveCfg()">設定を保存</button>
      <button class="btn ghost" onclick="loadAll()">再読込</button></div>
  </div>

  <div class="card">
    <h2>📋 変更・依頼 ${reqCount?`<span class="badge">要対応 ${reqCount}</span>`:""}</h2>
    <div class="chips">
      <div class="chip ${FILTER==="req"?"on":""}" onclick="FILTER='req';render()">要対応</div>
      <div class="chip ${FILTER==="applied"?"on":""}" onclick="FILTER='applied';render()">反映済</div>
      <div class="chip ${FILTER==="all"?"on":""}" onclick="FILTER='all';render()">すべて</div>
    </div>
    ${list.length?list.map(itemHtml).join(""):`<div class="empty">該当なし</div>`}
  </div>

  <div class="card">
    <h2>🚫 場所の食い違い ${MISMATCH.length?`<span class="badge">${MISMATCH.length}</span>`:""}</h2>
    ${MISMATCH.length?MISMATCH.map(m=>`<div class="warn">
      <b>⚠️ ${esc(m.kind)}が不一致</b> <span class="rid">${esc(m.id)}</span> ${esc(m.name||"")}様
      <div class="mmrow"><div><div class="lab">予約(正本)</div>${esc(m.resv)}</div>
        <div><div class="lab">OPシート表示</div>${esc(m.op)||"（空）"}</div></div>
      </div>`).join(""):`<div class="empty">食い違いなし ✅</div>`}
  </div>

  <div style="text-align:center;color:var(--sub);font-size:11px;padding:8px">v1.0 管理コンソール</div>`;
}
function itemHtml(c){
  const cls=c.field==="cancel"?"cancel":(isReq(c)?"req":(c.status==="applied"?"applied":""));
  const isPlaceTime=["del_place","col_place","lend_time","return_time"].includes(c.field);
  return `<div class="item ${cls}">
    <div class="ih">${esc(FLD[c.field]||c.field)}<span class="rid">${esc(c.reservation_id)}</span>
      <span class="st ${c.status}">${{requested:"要対応",applied:"反映済",approved:"承認済",rejected:"却下"}[c.status]||c.status}</span></div>
    <div class="body">${c.old_value?`<span class="muted">${esc(c.old_value)}</span> <span class="arrow">→</span> `:""}<b>${esc(c.new_value)}</b></div>
    ${c.note?`<div class="meta">📝 ${esc(c.note)}</div>`:""}
    <div class="meta">${esc((c.source==="customer"?"顧客":"スタッフ"))} ・ ${esc((c.created_at||"").slice(5,16).replace("T"," "))}
      ${isPlaceTime?" ・ ✅OPシート即反映済":""}</div>
    ${isReq(c)?`<div class="acts">
      <button class="btn ok" onclick="decide(${c.id},'approved')">承認</button>
      <button class="btn dang" onclick="decide(${c.id},'rejected')">却下</button>
      ${c.field==="cancel"?`<span style="flex:2;font-size:11px;color:var(--sub);align-self:center">※承認後アプリでキャンセル確定</span>`:`<span style="flex:2;font-size:11px;color:var(--sub);align-self:center">※承認後アプリで内容を反映</span>`}
    </div>`:""}
  </div>`;
}

// 起動：ログイン確認
if(!tok()){
  $("#app").innerHTML=`<div class="login"><div class="logo" style="font-size:22px;margin-bottom:6px">HAND<b style="color:#0e7a6b">Y</b>MAN</div>
    <div style="font-weight:800;margin-bottom:16px">マイページ管理 ログイン</div>
    <input id="le" type="email" placeholder="メールアドレス" autocomplete="username">
    <input id="lp" type="password" placeholder="パスワード" autocomplete="current-password">
    <button class="btn pri" style="width:100%;padding:13px" onclick="doLogin()">ログイン</button>
    <div id="lerr" style="color:#b91c1c;font-size:12px;margin-top:8px"></div></div>`;
}else loadAll().catch(e=>{$("#app").innerHTML=`<div class="empty">読み込み失敗：${esc(e.message)}</div>`});

async function doLogin(){
  const email=$("#le").value.trim(),password=$("#lp").value;
  try{const r=await fetch(SB+"/auth/v1/token?grant_type=password",{method:"POST",
    headers:{apikey:ANON,"Content-Type":"application/json"},body:JSON.stringify({email,password})});
    const d=await r.json();if(!r.ok||!d.access_token){$("#lerr").textContent="ログイン失敗";return}
    localStorage.setItem("sb-ckrxttbnawkclshczsia-auth-token",JSON.stringify(d));
    loadAll();
  }catch(e){$("#lerr").textContent="通信エラー"}
}
</script>
</body>
</html>
