<!doctype html><html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>CSチャット管理｜HANDYMAN</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:#0b1220;color:#e8eef7;height:100vh;display:flex;flex-direction:column}
  .hd{padding:12px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1c2c47;flex-wrap:wrap}
  .hd .t{font-size:16px;font-weight:900}
  .hd .sp{flex:1}
  .stbtn{font-size:12px;font-weight:800;padding:5px 12px;border-radius:8px;border:1px solid #24405e;background:#12233d;color:#a9c2e0;cursor:pointer}
  .stbtn.on{background:#0d9488;border-color:#0d9488;color:#fff}
  .who{font-size:12px;color:#8fb0d8}
  /* login */
  #login{max-width:340px;margin:60px auto;padding:24px;background:#0f1c31;border:1px solid #24405e;border-radius:16px}
  #login h2{font-size:16px;margin:0 0 14px}
  #login input{width:100%;padding:11px 12px;margin-bottom:10px;border-radius:8px;border:1px solid #24405e;background:#0b1524;color:#e8eef7;font-size:14px}
  #login button{width:100%;padding:12px;border:none;border-radius:10px;background:#2563eb;color:#fff;font-weight:900;font-size:15px;cursor:pointer}
  #login .e{color:#fca5a5;font-size:12px;font-weight:700;min-height:16px}
  /* main */
  #main{flex:1;display:flex;min-height:0}
  .list{width:320px;border-right:1px solid #1c2c47;overflow-y:auto;flex-shrink:0}
  .empty{padding:24px;color:#5f7ba0;text-align:center;font-size:13px}
  .th{padding:12px 14px;border-bottom:1px solid #16233b;cursor:pointer}
  .th:hover{background:#0f1c31}
  .th.on{background:#12283f}
  .th .n{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
  .th .badge{background:#dc2626;color:#fff;font-size:10px;font-weight:900;border-radius:10px;padding:1px 7px}
  .th .r{font-size:11px;color:#7f9dc4;margin-top:2px}
  .th .m{font-size:12px;color:#a9c2e0;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pane{flex:1;display:flex;flex-direction:column;min-width:0}
  .pane .top{padding:12px 16px;border-bottom:1px solid #1c2c47}
  .pane .top .n{font-weight:900;font-size:15px}
  .pane .top .r{font-size:12px;color:#8fb0d8;margin-top:3px;line-height:1.6}
  .msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .bub{max-width:76%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .bub.customer{align-self:flex-start;background:#1c2c47;border-bottom-left-radius:4px}
  .bub.staff{align-self:flex-end;background:#0d9488;color:#fff;border-bottom-right-radius:4px}
  .bub.system{align-self:center;background:#132033;color:#8fb0d8;font-size:12px;border-radius:10px}
  .bub .ts{display:block;font-size:9px;opacity:.6;margin-top:3px}
  .composer{padding:12px 16px;border-top:1px solid #1c2c47;display:flex;gap:8px}
  .composer textarea{flex:1;padding:10px 12px;border-radius:10px;border:1px solid #24405e;background:#0b1524;color:#e8eef7;font-size:14px;resize:none;font-family:inherit;min-height:44px;max-height:120px}
  .composer button{padding:0 18px;border:none;border-radius:10px;background:#2563eb;color:#fff;font-weight:900;cursor:pointer}
  .composer button:disabled{opacity:.4}
  .nopane{flex:1;display:flex;align-items:center;justify-content:center;color:#5f7ba0}
  .closebtn{font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;border:1px solid #24405e;background:#12233d;color:#a9c2e0;cursor:pointer;margin-left:8px}
</style></head>
<body>
<div class="hd">
  <a href="company3d.html" class="stbtn">← 本社TOP</a>
  <div class="t">💬 CSチャット管理</div>
  <button class="stbtn on" id="st_spk" onclick="setStore('spk')">❄️ 札幌</button>
  <button class="stbtn" id="st_nha" onclick="setStore('nha')">🌺 那覇</button>
  <label style="font-size:12px;color:#8fb0d8"><input type="checkbox" id="unreadOnly" checked onchange="loadList()"> 未対応のみ</label>
  <div class="sp"></div>
  <div class="who" id="who"></div>
</div>
<div id="login">
  <h2>スタッフ ログイン</h2>
  <input id="lname" placeholder="名前（例: oshita）" autocomplete="username">
  <input id="lpin" type="password" placeholder="番号（例: 0111）" autocomplete="current-password">
  <button onclick="doLogin()">ログイン</button>
  <div class="e" id="lerr"></div>
</div>
<div id="main" style="display:none">
  <div class="list" id="list"><div class="empty">読み込み中…</div></div>
  <div class="pane" id="pane"><div class="nopane">← 左の一覧からお客様を選択</div></div>
</div>
<script>
const U='https://ckrxttbnawkclshczsia.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
const EF=U+'/functions/v1/cs-chat';
let STORE=(new URLSearchParams(location.search).get('store')||'spk'), JWT='', curTid=(new URLSearchParams(location.search).get('id')||''), poll=null;
function ef(body){return fetch(EF,{method:'POST',headers:{apikey:AK,'Authorization':'Bearer '+AK,'Content-Type':'application/json'},body:JSON.stringify(Object.assign({store:STORE,staff_token:JWT},body))}).then(r=>r.json());}
function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function tfmt(s){try{const d=new Date(s);const p=n=>String(n).padStart(2,'0');return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());}catch(e){return '';}}
async function doLogin(){
  const nm=document.getElementById('lname').value.trim(), pin=document.getElementById('lpin').value.trim();
  const em=document.getElementById('lerr'); em.textContent='';
  if(!nm||!pin){em.textContent='名前と番号を入力してください';return;}
  const email=nm.indexOf('@')>=0?nm:(nm+'@'+STORE+'.hdm');
  try{
    const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:AK,'Content-Type':'application/json'},body:JSON.stringify({email,password:pin})}).then(r=>r.json());
    if(!r.access_token){em.textContent='ログインできませんでした（名前/番号を確認）';return;}
    JWT=r.access_token;
    localStorage.setItem('cschat_jwt',JWT);
    document.getElementById('login').style.display='none';
    document.getElementById('main').style.display='flex';
    document.getElementById('who').textContent=(r.user&&r.user.email||'').split('@')[0]+' でログイン中';
    startPoll();
    if(curTid)openThread(curTid);
  }catch(e){em.textContent='通信エラー';}
}
function setStore(s){STORE=s;document.getElementById('st_spk').classList.toggle('on',s==='spk');document.getElementById('st_nha').classList.toggle('on',s==='nha');curTid='';document.getElementById('pane').innerHTML='<div class="nopane">← 左の一覧からお客様を選択</div>';loadList();}
async function loadList(){
  const only=document.getElementById('unreadOnly').checked;
  const r=await ef({action:'staff_list',only_unread:only});
  const el=document.getElementById('list');
  if(!r||!r.ok){el.innerHTML='<div class="empty">認証エラー。再ログインしてください</div>';return;}
  if(!r.threads.length){el.innerHTML='<div class="empty">'+(only?'未対応のチャットはありません ✅':'チャットはありません')+'</div>';return;}
  el.innerHTML=r.threads.map(t=>`<div class="th ${t.id===curTid?'on':''}" onclick="openThread('${t.id}')">
    <div class="n">${esc(t.cust_name||'お客様')} 様 ${t.unread_staff>0?`<span class="badge">${t.unread_staff}</span>`:''}</div>
    <div class="r">予約 ${esc(t.reservation_id||'-')}</div>
    <div class="m">${esc(t.last_msg||'')}</div>
  </div>`).join('');
}
async function openThread(tid){
  curTid=tid;
  const r=await ef({action:'staff_thread',thread_id:tid});
  const pane=document.getElementById('pane');
  if(!r||!r.ok){pane.innerHTML='<div class="nopane">スレッドを開けませんでした</div>';return;}
  const rv=r.reservation||{}, th=r.thread||{};
  const dates=rv.lend_date?`${rv.lend_date}〜${rv.return_date||''}`:(rv.start_date?`${rv.start_date}〜${rv.end_date||''}`:'');
  pane.innerHTML=`<div class="top">
      <div class="n">${esc(th.cust_name||rv.name||'お客様')} 様 <button class="closebtn" onclick="closeThread('${tid}')">対応完了</button></div>
      <div class="r">予約 <b>${esc(th.reservation_id||'-')}</b> ／ ${esc(rv.ota||'')} ／ ${esc(rv.vehicle||'')}<br>${esc(dates)} ／ お届け ${esc(rv.del_place||'-')} ／ 回収 ${esc(rv.col_place||'-')}</div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="composer"><textarea id="inp" placeholder="返信を入力…" oninput="autoGrow(this)"></textarea><button id="sendBtn" onclick="send()">送信</button></div>`;
  renderMsgs(r.messages);
  loadList();
}
function renderMsgs(list){
  const m=document.getElementById('msgs'); if(!m)return;
  m.innerHTML=(list||[]).map(x=>`<div class="bub ${x.sender}">${esc(x.body)}<span class="ts">${tfmt(x.created_at)}</span></div>`).join('');
  m.scrollTop=m.scrollHeight;
}
function autoGrow(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px';}
async function send(){
  const inp=document.getElementById('inp'); const body=inp.value.trim(); if(!body)return;
  document.getElementById('sendBtn').disabled=true;
  const r=await ef({action:'staff_send',thread_id:curTid,body});
  document.getElementById('sendBtn').disabled=false;
  if(r&&r.ok){inp.value='';autoGrow(inp);renderMsgs(r.messages);}
}
async function closeThread(tid){
  if(!confirm('このチャットを「対応完了」にしますか？'))return;
  await ef({action:'staff_close',thread_id:tid});
  curTid='';document.getElementById('pane').innerHTML='<div class="nopane">← 左の一覧からお客様を選択</div>';loadList();
}
function startPoll(){if(poll)clearInterval(poll);poll=setInterval(()=>{if(document.visibilityState==='visible'){loadList();if(curTid){ef({action:'staff_thread',thread_id:curTid}).then(r=>{if(r&&r.ok)renderMsgs(r.messages);});}}},8000);loadList();}
// 自動ログイン（保存JWT）
(function(){const j=localStorage.getItem('cschat_jwt');if(j){JWT=j;fetch(U+'/auth/v1/user',{headers:{apikey:AK,'Authorization':'Bearer '+JWT}}).then(r=>r.ok?r.json():null).then(u=>{if(u){document.getElementById('login').style.display='none';document.getElementById('main').style.display='flex';document.getElementById('who').textContent=(u.email||'').split('@')[0]+' でログイン中';setStore(STORE);startPoll();if(curTid)openThread(curTid);}});}})();
</script>
</body></html>
