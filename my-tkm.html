<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>HANDYMAN マイページ</title>
<style>
:root{
  --bg:#f5efe4; --card:#fff; --ink:#1c2430; --sub:#6b7784; --line:#e6ddcd;
  --accent:#0e7a6b; --accent-d:#0a5e52; --warn:#c2410c; --danger:#b91c1c; --gold:#b45309;
  --r:16px; --shadow:0 3px 16px rgba(20,30,45,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(60px + env(safe-area-inset-bottom));min-height:100vh}
.top{padding:22px 4px 12px;display:flex;align-items:center;gap:10px}
.logo{font-weight:800;letter-spacing:.5px;font-size:19px}
.logo b{color:var(--accent)}
.store{margin-left:auto;font-size:14px;font-weight:800;color:#fff;border:none;box-shadow:0 2px 6px rgba(15,31,69,.22);white-space:nowrap;
  padding:6px 15px;border-radius:999px;background:#0F1F45}
.langsw{display:flex;gap:4px;margin:0 0 10px;flex-wrap:wrap}
.langsw button{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
  background:#fff;color:var(--sub);cursor:pointer}
.langsw button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.hello{font-size:19px;font-weight:800;padding:2px 4px 12px;letter-spacing:.3px}
.hello span{font-size:13px;font-weight:700;color:var(--sub);margin-left:4px}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;
  border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;
  display:flex;align-items:center;gap:12px;overflow:hidden}
.hero .hero-txt{flex:1;min-width:0}
.hero .rid{font-size:12px;opacity:.85;letter-spacing:1px}
.hero .car{font-size:22px;font-weight:800;margin:2px 0 8px}
.hero .st{display:inline-block;font-size:12px;font-weight:700;background:rgba(255,255,255,.2);
  padding:4px 12px;border-radius:999px}
.hero .hero-car{width:40%;max-width:180px;flex:none;object-fit:contain;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.hero.no-img{}
/* ── 新ヒーロー(沖縄/シーサー背景) ── */
.nhero{position:relative;border-radius:var(--r);overflow:hidden;color:#fff;margin:6px 0 14px;min-height:300px;box-shadow:var(--shadow);
  background:linear-gradient(180deg,rgba(3,8,28,.5) 0%,rgba(4,14,40,.38) 45%,rgba(3,8,28,.82) 100%),url('images/hero-takamatsu-kv.png') center 45%/cover no-repeat}
.nhero::before{content:"";position:absolute;left:0;right:0;top:0;height:92px;background:linear-gradient(180deg,rgba(3,8,28,.72),rgba(3,8,28,0))}
.nhero .nh-logo{position:absolute;top:14px;left:14px;height:26px;z-index:3;filter:drop-shadow(0 1px 4px rgba(0,0,0,.45))}
.nhero .nh-lang{position:absolute;top:14px;right:12px;z-index:4;display:flex;gap:3px}
.nhero .nh-lang button{border:1.5px solid #FABE00;background:rgba(255,255,255,.16);color:#fff;font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:8px;cursor:pointer;animation:langGlow 1.3s ease-in-out infinite}
@keyframes langGlow{0%,100%{box-shadow:0 0 0 0 rgba(250,190,0,0);border-color:#FABE00}50%{box-shadow:0 0 0 3px rgba(250,190,0,.6);border-color:#ffd45e}}
.nhero .nh-lang button.on{background:#fff;color:#0F1F45}
.nhero .nh-c{position:relative;z-index:2;text-align:center;padding:72px 18px 20px}
.nhero .nh-eye{font-family:"Hiragino Mincho ProN",serif;font-size:13px;font-style:italic;letter-spacing:2px;opacity:.85;margin-bottom:6px}
.nhero .nh-oki{font-family:"Hiragino Mincho ProN",serif;font-size:50px;font-weight:800;color:#FABE00;line-height:1;letter-spacing:.14em;padding-left:.14em;text-shadow:0 3px 20px rgba(0,0,0,.45)}
.nhero .nh-name{margin-top:12px;font-family:"Hiragino Mincho ProN",serif;font-size:14px;letter-spacing:1px;opacity:.95}
.nhero .nh-cd{margin-top:14px;display:inline-flex;align-items:baseline;gap:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);padding:7px 16px;border-radius:999px}
.nhero .nh-cd b{font-size:26px;font-weight:800;line-height:1}
.nhero .nh-wx{margin-top:10px;font-size:12px;display:inline-flex;gap:6px;align-items:center;background:rgba(0,0,0,.2);padding:4px 12px;border-radius:999px}
.nhero .nh-wx b{font-size:14px}
.nhero .nh-st{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;opacity:.92;z-index:2}
/* ── デモ一致: アコーディオン/区切り/ドライブ/おもてなし ── */
.divlabel{display:flex;align-items:center;gap:10px;margin:16px 4px 12px;color:var(--sub);font-size:11px;letter-spacing:3px;font-weight:800}
.divlabel::before,.divlabel::after{content:"";flex:1;height:1px;background:#e6ddcd}
.acc{background:#fff;border:1px solid #e6ddcd;border-radius:16px;margin-bottom:11px;box-shadow:0 5px 16px rgba(10,59,71,.05);overflow:hidden}
.acc>summary{list-style:none;cursor:pointer;padding:15px 15px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;color:var(--accent-d)}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .ic{font-size:17px}
.acc>summary .chev{order:9;margin-left:auto;transition:.25s;color:var(--sub);font-size:12px}
.acc[open]>summary .chev{transform:rotate(180deg)}
@keyframes glowPulseN{0%,100%{box-shadow:0 5px 16px rgba(10,59,71,.05)}50%{box-shadow:0 0 0 3px rgba(224,135,106,.3),0 6px 18px rgba(10,59,71,.06)}}
@keyframes blinkN{0%,100%{opacity:.3}50%{opacity:1}}
.acc:not([open]){animation:glowPulseN 2.4s ease-in-out infinite}
.acc:not([open])>summary .chev{color:#e0876a}
.acc:not([open])>summary::after{content:"未確認";font-size:9px;font-weight:800;color:#fff;background:#e0876a;border-radius:999px;padding:2px 7px;animation:blinkN 1.1s ease-in-out infinite}
.acc>.accb{padding:0 15px 15px}
.acc>.accb .row:first-of-type{border-top:0}
.spotn{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #eceff3}
.spotn:last-child{border-bottom:none}
.spotn .th{width:52px;height:52px;border-radius:12px;flex-shrink:0}
.spotn .nm{font-size:14px;font-weight:800}.spotn .ds{font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.5}.spotn .mn{font-size:10.5px;color:var(--accent);font-weight:800;margin-top:3px}
.spg .city{font-weight:800;font-size:12.5px;color:var(--accent-d);margin:14px 0 2px;display:flex;align-items:center;gap:5px}
.spg .city:first-child{margin-top:4px}
.spg .sp{padding:9px 0 9px 20px;border-bottom:1px solid #eceff3}
.spg .sp:last-child{border-bottom:none}
.spg .sp .nm{font-size:14px;font-weight:800}
.spg .sp .ds{font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.55}
.spg .sp .mp{display:inline-block;margin-top:5px;font-size:11.5px;font-weight:800;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:999px;padding:3px 11px}
.busitem .busttl{font-weight:800;font-size:13px;color:#0F1F45}
.busdiv{font-weight:800;font-size:13.5px;color:#0F1F45;animation:busBlink 1.2s ease-in-out infinite}
.busdiv2{margin-top:16px;padding-top:14px;border-top:2px dashed #e6ddcd}
.pkway{font-weight:800;font-size:12.5px;color:#0F1F45;margin:12px 0 8px;display:flex;align-items:center;gap:6px}
.pkway::before{content:"";flex:0 0 18px;height:2px;background:#FABE00}
.pksteps{display:flex;flex-direction:column;gap:14px}
.pkstep{position:relative;background:#fff;border:1px solid #e6ddcd;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(15,31,69,.06)}
.pkstep .pkhd{display:flex;align-items:center;gap:10px;padding:11px 13px}
.pknum{flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:#0F1F45;color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(15,31,69,.3)}
.pkcap{font-size:13.5px;font-weight:700;color:#1e293b;line-height:1.5}
.pkstep img{display:block;width:100%;height:auto}
.pkimg2{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.pkgoal{border-color:#FABE00;box-shadow:0 3px 12px rgba(250,190,0,.28)}
.pkgoal .pknum{background:#F86018}
.pkgoal .pkcap{color:#c2410c}
.quizbnr{display:flex;align-items:center;gap:11px;background:linear-gradient(120deg,#0F1F45,#1e3a8a);color:#fff;border-radius:16px;padding:13px 15px;margin-bottom:14px;cursor:pointer;box-shadow:0 6px 18px rgba(15,31,69,.28);position:relative;overflow:hidden}
.quizbnr::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;background:radial-gradient(circle,rgba(250,190,0,.35),transparent 70%)}
.quizbnr .qb-ic{font-size:26px;flex:0 0 auto;animation:qbwiggle 2s ease-in-out infinite}
@keyframes qbwiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.quizbnr .qb-tx{flex:1;line-height:1.3;min-width:0}
.quizbnr .qb-tx b{display:block;font-size:15px;font-weight:900}
.quizbnr .qb-tx span{display:block;font-size:11.5px;opacity:.85;margin-top:1px}
.quizbnr .qb-go{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:#FABE00;color:#0F1F45;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px}
.tvbox{background:#fff;border:1px solid #e6e9ef;border-radius:16px;padding:14px 14px 12px;margin-bottom:14px;box-shadow:0 4px 14px rgba(15,31,69,.08)}
.tvbox .tv-h{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.tvbox .tv-h .ic{font-size:20px}
.tvbox .tv-h b{font-size:15px;font-weight:900;color:#0F1F45}
.tvbox .tv-sub{font-size:11.5px;color:#7b8aa3;margin:0 0 11px 28px}
.tv-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tv-item{display:flex;align-items:center;gap:9px;border:1px solid #e6e9ef;border-radius:12px;padding:11px 12px;cursor:pointer;text-decoration:none;color:#0F1F45;background:#fbfcfe}
.tv-item:active{transform:translateY(1px)}
.tv-item .te{font-size:22px;flex:0 0 auto}
.tv-item .tt{font-size:12.5px;font-weight:800;line-height:1.3}
.tv-item .tg{margin-left:auto;color:#c7cfdb;font-weight:900;font-size:12px}
@keyframes busBlink{0%,100%{opacity:1}50%{opacity:.4}}
.mp2{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:800;color:#fff;background:var(--accent);border-radius:10px;padding:9px 15px;text-decoration:none}
.oshin{text-align:center;padding:22px 18px;background:linear-gradient(180deg,#0c3f86,#03081c);color:#fff;border-radius:18px;margin:14px 0 6px;font-family:"Hiragino Mincho ProN",serif}
.oshin p{font-size:13.5px;line-height:1.9;margin:8px 4px 0;opacity:.95}.oshin .sig{font-size:11px;letter-spacing:2px;opacity:.8;margin-top:12px}
.card{background:var(--card);border:1px solid #d5dce4;border-radius:var(--r);
  padding:16px;margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
.card h2{margin:-16px -16px 12px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px;
  padding:12px 16px;background:#f6f9fb;border-bottom:1px solid #e2e7ee;color:var(--accent-d)}
.card h2 .em{font-size:16px}
.row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid #eceff3}
.row:first-of-type{border-top:0}
.row .k{width:82px;flex:none;color:var(--sub);font-size:13px;padding-top:1px}
.row .v{flex:1;font-weight:600;word-break:break-word}
.row .v.big{font-size:16px}
.edit{margin-left:auto;flex:none;font-size:12px;font-weight:700;color:var(--accent);
  border:1px solid var(--accent);background:#f0faf7;border-radius:999px;padding:4px 12px;cursor:pointer}
.edit.req{color:var(--gold);border-color:var(--gold);background:#fff8ec}
.muted{color:var(--sub)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
  padding:5px 12px;border-radius:999px}
.pill.wait{background:#f1f3f5;color:var(--sub)}
.pill.on{background:#eafaf5;color:var(--accent-d)}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:14px;border-radius:12px;font-weight:800;font-size:15px;border:0;cursor:pointer;
  background:var(--accent);color:#fff;text-decoration:none}
.bigbtn.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.note{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.5}
.hrow{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.hrow:first-of-type{border-top:0}
.hdate{color:var(--sub);font-size:11.5px;flex:0 0 auto;min-width:32px;font-weight:700}
.htx{flex:1;line-height:1.5}
.hpill{flex:0 0 auto;padding:1px 8px;border-radius:999px;font-size:10.5px;font-weight:700}
.hint{font-size:12.5px;color:var(--accent-d);background:#eafaf5;border:1px solid #b7e6da;
  border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;margin-top:10px;line-height:1.6;font-weight:600}
.hint b{color:var(--accent-d)}
.dashed{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--sub)}
.reqbar{display:flex;gap:8px;flex-wrap:wrap}
.reqbtn{flex:1;min-width:calc(50% - 4px);text-align:center;padding:11px 8px;border-radius:12px;
  font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.reqbtn.danger{color:var(--danger);border-color:#f3c9c9;background:#fff6f6}
.foot{text-align:center;color:var(--sub);font-size:11px;padding:18px 0 4px;line-height:1.7}
.foot a{color:var(--accent)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,28,38,.5);display:none;align-items:flex-end;
  justify-content:center;z-index:50}
.scrim.show{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:17px;font-weight:800}
.sheet p.sub{margin:0 0 14px;color:var(--sub);font-size:13px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1.5px solid var(--line);
  border-radius:10px;font-size:16px;font-family:inherit;background:#fff}
.field textarea{min-height:80px;resize:vertical}
.sheet .acts{display:flex;gap:10px;margin-top:6px}
.sheet .acts button{flex:1;padding:13px;border-radius:11px;font-weight:800;font-size:15px;border:0;cursor:pointer}
.btn-cancel{background:#eef1f4;color:var(--ink)}
.btn-ok{background:var(--accent);color:#fff}
.btn-ok.req{background:var(--gold)}
.btn-ok.danger{background:var(--danger)}
.sheet .acts button:disabled{opacity:.4;cursor:not-allowed}
.optrow{display:grid;grid-template-columns:52px 1fr 16px 88px;gap:9px;align-items:center;
  padding:11px 0;border-top:1px solid var(--line)}
.optimg{width:52px;height:52px;object-fit:cover;border-radius:9px;border:1px solid var(--line);background:#fafbfc}
.optlbl{font-weight:700;font-size:13px}
.optprice{display:block;font-size:11px;color:var(--sub);font-weight:600;margin-top:1px}
.optprev-tot{margin-top:6px;padding-top:6px;border-top:1px dashed #e6cfa0;font-weight:800;font-size:14px;text-align:right;color:var(--gold)}
.optcur{font-size:13px;color:var(--sub);text-align:right}
.optarrow{text-align:center;color:var(--sub)}
.optsel{padding:8px;border:1.5px solid var(--line);border-radius:9px;font-size:16px;background:#fff}
.optprev{background:#fff8ec;border:1px solid #f3d9a8;border-radius:10px;padding:10px 12px;margin-top:12px}
.optprev-h{font-size:11px;font-weight:800;color:var(--gold);margin-bottom:4px}
.optprev-r{font-size:13px;font-weight:600}
.trkbtns{display:flex;gap:8px;margin-top:10px}
.trkbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;text-align:center;
  padding:13px 8px;border-radius:12px;font-weight:800;font-size:13.5px;text-decoration:none;
  background:#eef1f4;color:#0F1F45;border:1.5px solid #dfe4ea}
.trkbtn.live{background:#0F1F45;color:#fff;border-color:#0F1F45}
.trkbtn .livebadge{font-size:10px;font-weight:800;background:#0e9f50;color:#fff;border-radius:999px;padding:1px 7px;margin-left:4px}
/* 追跡プレビュー(見本・本番配色 ネイビー×ゴールド) */
.tphone{position:relative;border-radius:14px;overflow:hidden;border:1px solid #dfe4ea;
  box-shadow:0 4px 18px rgba(15,31,69,.14);background:#fff}
.tp-badge{position:absolute;top:9px;right:9px;z-index:4;background:rgba(15,31,69,.82);color:#fff;
  font-size:10px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.5px}
.tp-hd{background:#0F1F45;color:#fff;padding:11px 14px;display:flex;align-items:center;gap:8px}
.tp-logo{font-weight:900;font-size:15px;letter-spacing:.5px}.tp-logo b{color:#FABE00}
.tp-hdsub{font-size:11px;opacity:.85;font-weight:700}
.tp-status{background:#0e9f50;color:#fff;font-size:12.5px;font-weight:800;padding:8px 14px;
  display:flex;align-items:center;gap:8px}
.tp-status b{font-size:15px;margin:0 1px}
.tp-dot{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.7);
  animation:tppulse 1.6s infinite}
@keyframes tppulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.tp-map{position:relative;height:180px;background:linear-gradient(120deg,#e8f0e9 0%,#e3ecf4 100%)}
.tp-map::before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(#d5e0ea 1px,transparent 1px),linear-gradient(90deg,#d5e0ea 1px,transparent 1px);
  background-size:32px 32px;opacity:.7}
.tp-route{position:absolute;left:20%;top:74%;width:60%;height:4px;
  background:repeating-linear-gradient(90deg,#0F1F45 0 11px,transparent 11px 20px);
  transform:rotate(-27deg);transform-origin:left center;border-radius:2px;opacity:.8}
.tp-car{position:absolute;font-size:28px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.25));z-index:2;
  animation:tpmove 3.6s ease-in-out infinite}
.tp-dest{position:absolute;right:15%;top:20%;font-size:28px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.25))}
.tp-destlbl{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:#0F1F45;color:#fff;
  font-size:9px;font-weight:800;padding:2px 7px;border-radius:6px;white-space:nowrap}
@keyframes tpmove{0%{left:17%;top:76%}50%{left:55%;top:48%}100%{left:17%;top:76%}}
.tp-bar{display:flex;align-items:center;gap:10px;padding:11px 12px;background:#fff;border-top:1px solid #eef1f4}
.tp-info{flex:none}
.tp-k{font-size:10px;color:var(--sub);font-weight:700}
.tp-v{font-size:15px;font-weight:900;color:#0F1F45}
.tp-share{flex:1;background:#FABE00;color:#0F1F45;border:0;border-radius:10px;padding:11px;
  font-size:13px;font-weight:900;box-shadow:0 2px 6px rgba(250,190,0,.4)}
.mpmap{width:100%;height:230px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:#eef1f4}

function otaName(o){const e=OTANAME[o];return e?(e[L]||e.ja):(o||"-");}
function placeErrJs(place,lat,lng){
  if(/新千歳|千歳空港|千歳市/.test(place))return t('err_chitose');
  if(lat!=null&&lng!=null)return (lat>=42.90&&lat<=43.30&&lng>=141.15&&lng<=141.62)?null:t('err_sapporo');
  // ピン座標が無い自由入力は「札幌」表記必須をやめる（すすきの/大通/丘珠/カタカナ名等の有効な場所が弾かれないように）。市外の明示(新千歳/千歳)のみ上でブロック。
  return null;
}
function t(k){const e=TX[k];return e?(e[L]||e.ja):k;}
function tf(k){const e=TX[k];if(!e)return"";const f=e[L]||e.ja;const a=[].slice.call(arguments,1);return typeof f==="function"?f.apply(null,a):f;}
function langSwitch(){return `<div class="langsw">`+LANGS.map(l=>`<button class="${L===l.k?'on':''}" onclick="setLang('${l.k}')">${l.n}</button>`).join("")+`</div>`;}

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const WD_L={ja:["日","月","火","水","木","金","土"],en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],zh:["日","一","二","三","四","五","六"],ko:["일","월","화","수","목","금","토"]};
function fmtDate(d){if(!d)return"";const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d);if(!m)return d;
  const dt=new Date(+m[1],+m[2]-1,+m[3]);return `${+m[2]}/${+m[3]}(${(WD_L[L]||WD_L.ja)[dt.getDay()]})`}
function dateTime(d,t){const dd=fmtDate(d);return dd?(dd+(t?" "+t:"")):(t||"—")}
function daysTo(ds){if(!ds)return null;const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(ds);if(!m)return null;const target=new Date(+m[1],+m[2]-1,+m[3]);const now=new Date();now.setHours(0,0,0,0);target.setHours(0,0,0,0);return Math.round((target-now)/86400000);}
function nhWxIcon(c){if(c===0)return"☀️";if(c<=2)return"🌤";if(c<=3)return"⛅️";if(c<=48)return"🌫";if(c<=67)return"🌧";if(c<=77)return"🌨";if(c<=82)return"🌦";return"⛈";}
function nhLoadWx(){try{fetch("https://api.open-meteo.com/v1/forecast?latitude=34.2141&longitude=134.0156&current=temperature_2m,weather_code&timezone=Asia%2FTokyo").then(r=>r.json()).then(d=>{if(d&&d.current){var t=document.getElementById("nhWxT");if(t)t.textContent=Math.round(d.current.temperature_2m)+"°";var i=document.getElementById("nhWxIc");if(i)i.textContent=nhWxIcon(d.current.weather_code);}}).catch(()=>{});}catch(e){}}

function trackUrl(resId,trk,type){ // type: "del"=お届け / "col"=回収

  const t=trk.token?("&t="+encodeURIComponent(trk.token)):"";

function classImg(v){ // 店舗別クラス画像。那覇は専用画像(_nha)があるB/C/F/H/Sのみ表示。A/A2/B2/Dは札幌画像を出さない(誤画像防止)＝画像なし。
  const store=(DATA&&DATA.store)||"spk";
  if(store==="tkm"){ return ""; } // ★高松=専用クラス画像なし=ヒーロー画像を出さない(誤画像防止)
  if(store==="nha"){ return ["B","C","F","H","S"].includes(v) ? (IMG_BASE+"class_"+encodeURIComponent(v)+"_nha.png") : ""; }
  return IMG_BASE+"class_"+encodeURIComponent(v)+".png";
}

  if(RO)return;
  const sh=$("#sheet");
  sh.innerHTML='<div style="padding:22px 18px 24px">'
    +'<div style="font-size:16px;font-weight:800;color:#0a1f44;margin-bottom:10px">'+t('cf_title')+'</div>'

    +'<div style="display:flex;gap:10px">'
    +'<button type="button" id="cfNo" style="flex:1;padding:13px;border:1px solid #cbd5e1;background:#fff;border-radius:11px;font-weight:700;color:#64748b;font-size:14px">'+t('cf_cancel')+'</button>'
    +'<button type="button" id="cfYes" style="flex:1.5;padding:13px;border:none;background:#ee6a1c;color:#fff;border-radius:11px;font-weight:800;font-size:14px">'+t('cf_ok')+'</button>'

let SENDING=false; // 送信系(lookup以外)の多重実行ガード（モバイルのゴーストクリック/二重タップで2回叩かれるのを防ぐ）
async function call(action, body){
  const mut = action!=="lookup";
  if(mut && RO){ toast("スタッフ確認用（閲覧のみ）のため編集できません"); return {status:0, json:{dropped:true, ro:true}}; } // 閲覧専用は書込禁止
  if(mut){ if(SENDING) return {status:0, json:{dropped:true}}; SENDING=true; }
  try{
    // ★ タイムアウト＋通信エラーを握る（無いと詰まった端末でスピナーが永久に回る）
    const ctrl=new AbortController();
    const to=setTimeout(function(){try{ctrl.abort()}catch(e){}}, action==="lookup"?15000:20000);
    try{
      const r = await fetch(FN,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action,token:TOKEN,...body}),signal:ctrl.signal});
      return {status:r.status, json: await r.json().catch(()=>({}))};
    }catch(e){
      return {status:0, json:{ok:false,_neterr:true,error:(e&&e.name==="AbortError")?"timeout":"network"}};
    }finally{ clearTimeout(to); }
  } finally { if(mut) SENDING=false; }
}

const HFLD_L={del_place:{ja:"お届け場所",en:"delivery location",zh:"送車地點",ko:"배달 장소"},col_place:{ja:"回収場所",en:"pickup location",zh:"取車地點",ko:"회수 장소"},lend_time:{ja:"お届け時間",en:"delivery time",zh:"送車時間",ko:"배달 시간"},return_time:{ja:"回収時間",en:"pickup time",zh:"取車時間",ko:"회수 시간"},option:{ja:"オプション",en:"option",zh:"選配",ko:"옵션"},insurance:{ja:"補償",en:"insurance",zh:"保障",ko:"보장"},method:{ja:"受渡方法",en:"handover method",zh:"交車方式",ko:"인수 방법"},cancel:{ja:"キャンセル",en:"cancellation",zh:"取消",ko:"취소"}};

function histLine(c,mode){
  const e=HFLD_L[c.field]; if(!e)return null;
  if(!["applied","requested","approved","rejected"].includes(c.status))return null;

/* ===== 免許証セルフアップロード（保存先=GAS→Googleドライブ・store='nha'・license.htmlと同一） ===== */
let LIC=[{front:null,back:null,fu:null,bu:null}];
let LIC_BUSY=false;
function licSlot(i,side){
  const p=LIC[i], f=p[side], url=side==="front"?p.fu:p.bu, lab=side==="front"?t('lic_front'):t('lic_back');

    : `<button onclick="document.getElementById('${inputId}').click()" style="width:100%;height:96px;border:1.5px dashed #cbd5e1;border-radius:10px;background:#f8fafc;color:#64748b;font-size:13px;font-weight:700;cursor:pointer">${t('lic_choose')}</button>`;
  return `<div style="flex:1;min-width:0">
    <div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:5px">${lab}</div>
    ${inner}
    <input type="file" id="${inputId}" accept="image/*" capture="environment" style="display:none" onchange="licPick(${i},'${side}',this)">
  </div>`;
}
function licBody(){
  const multi=LIC.length>1;
  const drivers=LIC.map((p,i)=>`
    <div style="border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:10px;background:#fff">
      ${multi?`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:13px;font-weight:800;color:#0F1F45">${t('lic_driver')}${i+1}</span>${i>0?`<button onclick="licDel(${i})" style="background:none;border:none;color:#dc2626;font-size:12px;font-weight:700;cursor:pointer">✕</button>`:""}</div>`:""}
      <div style="display:flex;gap:10px">${licSlot(i,"front")}${licSlot(i,"back")}</div>
    </div>`).join("");
  const canUp=LIC.some(p=>p.front)&&!LIC_BUSY;
  return drivers
    +`<button onclick="licAdd()" style="width:100%;background:#f1f5f9;color:#334155;border:1px dashed #cbd5e1;border-radius:10px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:10px">${t('lic_add')}</button>`
    +`<button id="licUpBtn" onclick="licUpload()" ${canUp?"":"disabled"} style="width:100%;background:${canUp?"#0F1F45":"#cbd5e1"};color:#fff;border:none;border-radius:11px;padding:13px;font-size:15px;font-weight:800;cursor:${canUp?"pointer":"default"}">${LIC_BUSY?t('lic_uploading'):t('lic_upload')}</button>`
    +`<div id="licStatus" style="margin-top:8px;font-size:13px;font-weight:700"></div>`;
}
function licPaint(){const el=document.getElementById('licbody'); if(el)el.innerHTML=licBody();}

function licPick(i,side,input){
  const f=input.files&&input.files[0]; if(!f)return;
  if(side==="front"){LIC[i].front=f; LIC[i].fu=URL.createObjectURL(f);}
  else{LIC[i].back=f; LIC[i].bu=URL.createObjectURL(f);}
  licPaint();
}
function licAdd(){ if(LIC.length>=5)return; LIC.push({front:null,back:null,fu:null,bu:null}); licPaint(); }
function licDel(i){ LIC.splice(i,1); if(!LIC.length)LIC=[{front:null,back:null,fu:null,bu:null}]; licPaint(); }
function _fileToB64(file){return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(String(rd.result).split(',')[1]);rd.onerror=rej;rd.readAsDataURL(file);});}
async function licUpload(){
  if(LIC_BUSY)return;
  const r=DATA&&DATA.reservation; if(!r)return;
  const jobs=[];
  LIC.forEach((p,i)=>{ if(p.front)jobs.push({file:p.front,label:"person"+(i+1)+"_front"}); if(p.back)jobs.push({file:p.back,label:"person"+(i+1)+"_back"}); });
  const st=document.getElementById('licStatus');
  if(!jobs.length){ if(st){st.style.color="#dc2626";st.textContent=t('lic_need_front');} return; }
  LIC_BUSY=true; licPaint();
  const st2=document.getElementById('licStatus'); if(st2){st2.style.color="#475569";st2.textContent=t('lic_uploading')+" 0/"+jobs.length;}
  let ok=0, err=0;
  for(let i=0;i<jobs.length;i++){
    const j=jobs[i];
    try{
      const b64=await _fileToB64(j.file);
      const resp=await fetch(GAS_LICENSE_URL,{method:"POST",body:JSON.stringify({
        secret:GAS_LICENSE_SECRET, store:"bt", resId:r.id, custName:r.name||"", label:j.label,
        fileName:j.label+"_"+Date.now()+".jpg", mime:j.file.type||"image/jpeg", b64:b64
      })});
      let jr={}; try{jr=await resp.json();}catch(e){}
      if(resp.ok&&jr.ok)ok++; else err++;
    }catch(e){ err++; }
    const s=document.getElementById('licStatus'); if(s)s.textContent=t('lic_uploading')+" "+(i+1)+"/"+jobs.length;
  }
  LIC_BUSY=false;
  const drv=LIC.filter(p=>p.front).length||1;
  if(err===0){ try{ call("license_uploaded",{count:ok,drivers:drv}); }catch(e){} LIC=[{front:null,back:null,fu:null,bu:null}]; licPaint(); const s=document.getElementById('licStatus'); if(s){s.style.color="#0e7a3b";s.textContent=t('lic_done');} }
  else{ licPaint(); const s=document.getElementById('licStatus'); if(s){s.style.color="#dc2626";s.textContent=t('lic_err')+" ("+ok+"/"+jobs.length+")";} }
}

<div style="font-weight:800;color:#0F1F45;margin:14px 0 4px;border-top:1px solid #eee;padding-top:10px">第1章 總則</div>
<h4 style="margin:8px 0 3px;font-size:13px">第1條（條款之適用）</h4>
<p>1. 本公司依本條款及細則將租賃車輛（租車）出租予承租人，承租人據此承租。未規定事項依法令或一般慣例。<br>2. 本公司於不違反法令之範圍內得接受特約，特約優先於本條款。</p>
<div style="font-weight:800;color:#0F1F45;margin:14px 0 4px;border-top:1px solid #eee;padding-top:10px">第2章 預約</div>
<h4 style="margin:8px 0 3px;font-size:13px">第2條（預約申請）</h4>
<p>1. 承租人經本公司同意得取消預約。<br>2. 逾承租開始時間1小時仍未著手締約手續者，視為取消預約。<br>3. 此時承租人應支付所定預約取消手續費，本公司退還已收預約金。<br>4. 因本公司事由致預約取消或未締約者，退還已收預約金。</p>
<h4 style="margin:8px 0 3px;font-size:13px">第3條（預約變更）</h4>

<h4 style="margin:8px 0 3px;font-size:13px">第4條（預約之取消等）</h4>

<h4 style="margin:8px 0 3px;font-size:13px">第5條（替代車輛）</h4>
<p>本公司無法提供所預約車種等級時，得提出替代車輛。承租人同意時以較低費率出租；不同意時得取消預約，並退還已付預約金。</p>

<h4 style="margin:8px 0 3px;font-size:13px">第7條（預約業務之代辦）</h4>

<p>1. 承租人載明承租條件，本公司依條款、費率表等明示租賃條件並締約。<br>2. 締約時承租人支付所定租賃費用。<br>3〜5. 承租人應於締約前提示或提交全體駕駛人之駕照，並保證無吊扣、吊銷、失效之駕駛人。<br>6. 本公司依基本通達須將駕駛人之駕照種類與號碼記載於租賃證，並得要求提示、提交駕照（含國際、外國駕照）。<br>7〜8. 本公司得要求提交身分證明文件、告知手機號碼，並以信用卡或現金付款。</p>
<p style="font-size:11px;color:#8a94a0;margin-top:10px">※本條款為摘要。正式全文將於交車時供您確認。</p>

<div style="font-weight:800;color:#0F1F45;margin:2px 0 6px">개인정보의 취급에 대하여</div>
<p>1. 임차인(대여계약 신청자 포함) 및 운전자는 당사가 아래 목적으로 개인정보를 이용하는 데 동의합니다.</p>
<p style="padding-left:1em">a. 대여증 작성 등 렌터카 관련 기본통달(지려 제138호, 1995.6.13.)에 따른 의무 이행을 위하여.<br>b. 임차인·운전자의 본인확인 및 심사를 위하여.<br>c. 상품개발·고객만족 향상 등을 위한 설문조사를 위하여.<br>d. 개인을 식별·특정할 수 없도록 가공한 통계데이터 작성을 위하여.</p>
<p>2. 대여기간 중 통신형 내비게이션 및 블랙박스에서 취득한 정보를 통계적으로 집계·분석하여, 개인을 식별할 수 없도록 가공한 통계데이터를 제3자에게 제공하는 데 동의합니다. 가공데이터를 개인 식별 가능한 상태로 복원하는 것은 금지합니다.</p>
<div style="font-weight:800;color:#0F1F45;margin:14px 0 4px;border-top:1px solid #eee;padding-top:10px">제1장 총칙</div>
<h4 style="margin:8px 0 3px;font-size:13px">제1조(약관의 적용)</h4>
<p>1. 당사는 본 약관 및 세칙에 따라 대여차량(렌터카)을 임차인에게 대여하고 임차인은 이를 임차합니다. 정함이 없는 사항은 법령 또는 일반 관습에 따릅니다.<br>2. 당사는 법령에 반하지 않는 범위에서 특약에 응할 수 있으며, 특약은 본 약관에 우선합니다.</p>
<div style="font-weight:800;color:#0F1F45;margin:14px 0 4px;border-top:1px solid #eee;padding-top:10px">제2장 예약</div>
<h4 style="margin:8px 0 3px;font-size:13px">제2조(예약 신청)</h4>
<p>1. 임차인은 당사의 승인을 얻어 예약을 취소할 수 있습니다.<br>2. 대여 개시시각을 1시간 이상 경과해도 계약 체결 절차에 착수하지 않은 경우 예약은 취소된 것으로 봅니다.<br>3. 이 경우 임차인은 소정의 예약취소 수수료를 지급하고, 당사는 수령한 예약금을 반환합니다.<br>4. 당사 사정으로 예약이 취소되거나 계약이 체결되지 않은 경우 수령한 예약금을 반환합니다.</p>
<h4 style="margin:8px 0 3px;font-size:13px">제3조(예약 변경)</h4>
<p>임차인은 임차 조건을 변경하려는 경우 사전에 당사의 승낙을 받아야 합니다.</p>
<h4 style="margin:8px 0 3px;font-size:13px">제4조(예약의 취소 등)</h4>
<p>천재·도난·리콜 등 임차인·당사 어느 쪽의 책임에도 의하지 않는 사유로 계약이 체결되지 않은 경우 예약은 취소되며 수령한 예약금을 반환합니다.</p>
<h4 style="margin:8px 0 3px;font-size:13px">제5조(대체 차량)</h4>
<p>예약한 차종 등급을 대여할 수 없는 경우 당사는 대체 차량을 제안할 수 있습니다. 임차인이 승낙하면 더 낮은 요금으로 대여하고, 승낙하지 않으면 예약을 취소할 수 있으며 지급한 예약금은 반환합니다.</p>
<h4 style="margin:8px 0 3px;font-size:13px">제6조(면책)</h4>
<p>제4조·제5조의 조치를 제외하고, 예약 취소 또는 계약 미체결에 대해 당사와 임차인은 상호 어떠한 청구도 하지 않습니다.</p>
<h4 style="margin:8px 0 3px;font-size:13px">제7조(예약업무의 대행)</h4>
<p>임차인은 여행대리점·제휴사 등(대행업자)을 통해 예약의 신청·변경·취소를 할 수 있습니다.</p>

function editField(field){

    col_place:{title:t('edit_col_place'),label:t('lbl_col_place'),type:"text",val:r.col_place||"",ph:t('ph_col')},

  }[field];

  $("#sheet").innerHTML=`
    <h3>${esc(CFG.title)}</h3>
    <p class="sub">${subTxt}</p>
    <div class="field"><label>${esc(CFG.label)}</label>${input}</div>

      <button class="btn-ok" onclick="saveField('${field}')">${t('apply_this')}</button></div>`;

async function saveField(field){
  const r=DATA.reservation, cur={del_place:r.del_place,col_place:r.col_place,lend_time:r.lend_time,return_time:r.return_time}[field]||"";
  const v=$("#fv").value.trim();
  if(v===cur){toast(t('no_change'));return}
  if((field==="del_place"||field==="col_place")&&v.length<2){toast(t('min2'));return}
  if(field==="del_place"||field==="col_place"){const pe=placeErrJs(v,null,null);if(pe){toast(pe);return}}
  const _lb={del_place:t('del_place'),col_place:t('col_place'),lend_time:t('del_dt'),return_time:t('col_dt')}[field]||"";
  if(!confirm(tf('reg_confirm',_lb,v)))return;
  const {json}=await call("update",{[field]:v});
  if(json.dropped)return;
  if(json.ok){closeSheet();toast(json.pendingApproval?t('pending_appr'):t('saved'));await load()}
  else if(json.lineOnly){closeSheet();toast(json.error)}
  else toast(json.error||t('save_fail'));
}

const GMAPS_KEY="AIzaSyCoX1EyEx-N5A0r4vRzC1KmVp3T29HILbI";
const SPK_CENTER={lat:34.3428,lng:134.0466}; // ★高松市中心(高松版=デリバリー無しで通常未使用だが札幌座標を残さない)

function gLang(){return L==="zh"?"zh-TW":L;}
function loadGoogle(){
  if(_gLoaded)return Promise.resolve();
  if(_gLoading)return _gLoading;
  _gLoading=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=`https://maps.googleapis.com/maps/api/js?key=${GMAPS_KEY}&libraries=places&language=${gLang()}`;
    s.async=true;s.onload=()=>{_gLoaded=true;res()};s.onerror=rej;document.head.appendChild(s);
  });
  return _gLoading;
}

function initMpMap(){
  const el=document.getElementById("mpMap"); if(!el)return;
  const c=(mpPicked.lat&&mpPicked.lng)?{lat:+mpPicked.lat,lng:+mpPicked.lng}:SPK_CENTER;
  el.innerHTML="";
  mpMap=new google.maps.Map(el,{center:c,zoom:mpPicked.lat?16:13,disableDefaultUI:true,zoomControl:true,gestureHandling:"greedy",clickableIcons:false});
  mpMarker=new google.maps.Marker({position:c,map:mpMap,draggable:true});
  mpGeocoder=new google.maps.Geocoder();
  mpAuto=new google.maps.places.AutocompleteService();
  mpPlaces=new google.maps.places.PlacesService(mpMap);
  mpTok=new google.maps.places.AutocompleteSessionToken();
  mpMap.addListener("click",e=>{mpMarker.setPosition(e.latLng);mpReverse(e.latLng.lat(),e.latLng.lng())});
  mpMarker.addListener("dragend",()=>{const ll=mpMarker.getPosition();mpReverse(ll.lat(),ll.lng())});
}
function mpReverse(lat,lng){
  mpPicked.lat=lat;mpPicked.lng=lng;
  const pe=document.getElementById("mpPicked"); if(pe)pe.textContent=t('map_getting');
  mpGeocoder.geocode({location:{lat,lng},language:gLang()},(res,st)=>{
    let addr=`${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    if(st==="OK"&&res&&res[0])addr=res[0].formatted_address.replace(/^日本[、,]\s*/,"").replace(/〒?\s*\d{3}-?\d{4}\s*/,"").trim();
    mpPicked.place=addr;
    const pe=document.getElementById("mpPicked"); if(pe)pe.textContent=addr;
    const si=document.getElementById("mpSearch"); if(si)si.value=addr;
    mpStNote();
  });
}
// 札幌駅を指定した場合の停車注意（南口は停車不可→北口推奨）
function mpStNote(){
  const si=document.getElementById("mpSearch");
  const v=((si&&si.value)||mpPicked.place||"");
  const el=document.getElementById("mpStNote");
  if(el)el.style.display=/札幌駅|札幌\s*駅|sapporo\s*st(a|ation)?|札幌車站|삿포로역/i.test(v)?"block":"none";
}
let _mpDeb=null;
function mpSearchInput(){
  mpStNote();
  const q=document.getElementById("mpSearch").value.trim();
  const box=document.getElementById("mpSuggest");
  if(q.length<2){box.style.display="none";return}
  clearTimeout(_mpDeb);
  _mpDeb=setTimeout(()=>{
    if(!mpAuto){box.style.display="none";return}
    mpAuto.getPlacePredictions({input:q,sessionToken:mpTok,language:gLang(),
      locationBias:{center:SPK_CENTER,radius:60000},componentRestrictions:{country:"jp"}},(preds,st)=>{
      if(st!=="OK"||!preds||!preds.length){box.innerHTML='<div class="mpsug-i" style="color:#999">'+t('map_no_hit')+'</div>';box.style.display="block";return}
      box.innerHTML=preds.slice(0,6).map(p=>`<div class="mpsug-i" onclick="mpPick('${p.place_id}')">📍 ${esc(p.description)}</div>`).join("");
      box.style.display="block";
    });
  },350);
}
function mpPick(placeId){
  document.getElementById("mpSuggest").style.display="none";
  mpPlaces.getDetails({placeId,fields:["geometry","name","formatted_address"],sessionToken:mpTok,language:gLang()},(pl,st)=>{
    mpTok=new google.maps.places.AutocompleteSessionToken();
    if(st!=="OK"||!pl||!pl.geometry)return;
    const lat=pl.geometry.location.lat(),lng=pl.geometry.location.lng();
    let addr=(pl.formatted_address||"").replace(/^日本[、,]\s*/,"").replace(/〒?\s*\d{3}-?\d{4}\s*/,"").trim();
    const name=pl.name?(pl.name+(addr?" "+addr:"")):addr;
    mpPicked={place:name,lat,lng};
    document.getElementById("mpPicked").textContent=name;
    document.getElementById("mpSearch").value=name;
    if(mpMap){mpMap.setCenter({lat,lng});mpMap.setZoom(16);mpMarker.setPosition({lat,lng})}
    mpStNote();
  });
}

  {v:"免責",price:1100,unit:"/24h",
    label:{ja:"基本プラン＋免責補償",en:"Basic + CDW",zh:"基本方案＋免責保障",ko:"기본 플랜＋면책 보장"},
    desc:{ja:"事故時に、お客様が自己負担する費用（免責額）を免除する制度です。<br>基本補償ではカバーできない車両補償の自己負担額15万円が免除されます。",en:"Waives your out-of-pocket deductible in an accident.<br>The ¥150,000 vehicle deductible not covered by basic is waived.",zh:"事故時免除您的自付免責額。<br>基本方案未涵蓋的車輛自付額15萬日圓可免除。",ko:"사고 시 자기부담(면책액)을 면제합니다.<br>기본에서 커버되지 않는 차량 자기부담 15만엔이 면제됩니다."}},
  {v:"NOC",price:1650,unit:"/24h",
    label:{ja:"基本＋免責＋NOC補償（安心ワイドパック）",en:"Basic + CDW + NOC (Full Pack)",zh:"基本＋免責＋NOC（安心全包）",ko:"기본＋면책＋NOC(안심 와이드팩)"},
    desc:{ja:"免責補償もノンオペレーションチャージの心配もなくしたい方へ、すべての補償をひとまとめにした安心ワイドパック。<br>損傷タイヤの修理代・ホイールキャップ紛失の補償も付きます。",en:"All-in-one pack: no deductible and no non-operation charge worries.<br>Also covers damaged tire repair and hubcap loss.",zh:"將所有保障整合的安心全包，免除免責與NOC的擔憂。<br>另含輪胎損傷修理與輪圈蓋遺失保障。",ko:"면책도 NOC 걱정도 없는 올인원 안심 와이드팩.<br>손상 타이어 수리·휠캡 분실 보장도 포함."}},
];
function insLabel(v){const p=INS_PLANS.find(x=>x.v===v);return p?(p.label[L]||p.label.ja):(v||"—");}
function insDesc(p){return p.desc[L]||p.desc.ja;}
function yen(n){return "¥"+Number(n||0).toLocaleString()}
function reqOption(){
  const r=DATA.reservation;
  const uq=t('unit_qty');
  const rows=OPTDEF.map(o=>{
    const cur=+(r[o.key]||0), lb=optLabel(o);
    let opts="";
    for(let i=0;i<=o.max;i++)opts+=`<option value="${i}" ${i===cur?"selected":""}>${i}${uq}</option>`;
    return `<div class="optrow">
      <img class="optimg" src="${o.img}" alt="${lb}" onerror="this.style.visibility='hidden'">
      <div class="optlbl">${lb}<span class="optprice">${yen(o.price)}${t('per_car')}</span></div>
      <div class="optarrow">→</div>
      <select class="optsel" data-key="${o.key}" data-cur="${cur}" data-price="${o.price}" onchange="optPreview()">${opts}</select>
    </div>`;
  }).join("");
  $("#sheet").innerHTML=`
    <h3>${t('opt_title')}</h3>
    <p class="sub">${t('opt_sub')}</p>
    ${rows}
    <div id="optprev" class="optprev" style="display:none"></div>
    <div class="note" style="margin-top:8px">${t('opt_note')}</div>
    <div class="acts" style="margin-top:10px"><button class="btn-cancel" onclick="closeSheet()">${t('cancel_btn')}</button>
      <button class="btn-ok req" id="optbtn" disabled onclick="sendOption()">${t('req_this')}</button></div>`;
  $("#scrim").classList.add("show");
}
function optDiffs(){
  const diffs=[];
  document.querySelectorAll(".optsel").forEach(s=>{
    const cur=+s.dataset.cur, nv=+s.value; if(cur===nv)return;
    const def=OPTDEF.find(o=>o.key===s.dataset.key);
    diffs.push({label:optLabel(def),from:cur,to:nv,price:+s.dataset.price,diff:(nv-cur)*(+s.dataset.price)});
  });
  return diffs;
}
function optPreview(){
  const d=optDiffs(), box=$("#optprev"), btn=$("#optbtn"), uq=t('unit_qty');
  if(!d.length){box.style.display="none";btn.disabled=true;return}
  const total=d.reduce((s,x)=>s+x.diff,0);
  const sign=total>=0?"＋":"−";
  box.style.display="block";
  box.innerHTML="<div class='optprev-h'>"+t('change_content')+"</div>"+
    d.map(x=>`<div class="optprev-r">${x.label}：<b>${x.from}${uq}</b> → <b style="color:var(--gold)">${x.to}${uq}</b>
      <span style="color:var(--sub)">（${x.diff>=0?"＋":"−"}${yen(Math.abs(x.diff))}）</span></div>`).join("")+
    `<div class="optprev-tot">${t('approx')} ${sign}${yen(Math.abs(total))}</div>`;
  btn.disabled=false;
}
async function sendOption(){
  const d=optDiffs(); if(!d.length){toast(t('no_change'));return}
  const total=d.reduce((s,x)=>s+x.diff,0), uq=t('unit_qty');
  const detail=d.map(x=>`${x.label} ${x.from}${uq}→${x.to}${uq}`).join(" / ")+`（${t('approx')}${total>=0?"＋":"−"}${yen(Math.abs(total))}）`;
  const target={}; document.querySelectorAll(".optsel").forEach(s=>{target[s.dataset.key]=+s.value});
  if(!confirm(t('opt_confirm')+"\n"+detail+"\n"+t('confirm_ok')))return;
  const {json}=await call("request",{req_type:"option",detail,target});
  if(json.dropped)return;
  if(json.ok){closeSheet();toast(json.alreadyRequested?t('already_req'):t('received'));await load()}
  else toast(json.error||t('send_fail'));
}
/* ---- 補償 変更依頼（プルダウンで選択・金額表示）---- */
function insCur(){const ins=String(DATA.reservation.insurance||"");
  if(/フル|NOC|安心/.test(ins))return"NOC"; if(/免責|CDW/.test(ins))return"免責"; return"なし"}
function reqInsurance(){
  const cur=insCur();
  const curLabel=insLabel(cur);
  const nowTag={ja:"✓ 現在のプラン",en:"✓ Current plan",zh:"✓ 目前方案",ko:"✓ 현재 플랜"}[L];
  const opts=INS_PLANS.map(p=>`<option value="${p.v}" ${p.v===cur?"selected":""}>${insLabel(p.v)}（${p.price?yen(p.price)+(p.unit||""):t('free')}）${p.v===cur?" ★"+nowTag.replace("✓ ",""):""}</option>`).join("");
  const planCards=INS_PLANS.map(p=>{const isCur=p.v===cur;return `<div class="inscard" style="${isCur?'border:2px solid var(--gold);background:#fffdf5':''}">
      <div class="insttl">${esc(insLabel(p.v))} <span class="insprice">${p.price?yen(p.price)+(p.unit||""):t('free')}</span>${isCur?` <span style="background:var(--gold);color:#3a2f00;font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:4px;white-space:nowrap">${nowTag}</span>`:''}</div>
      <div class="insdesc">${insDesc(p)}</div></div>`;}).join("");
  $("#sheet").innerHTML=`
    <h3>${t('ins_title')}</h3>
    <p class="sub">${t('ins_sub')}</p>
    <div class="row" style="border:0;padding:8px 10px;margin-bottom:8px;background:#fffdf5;border:1.5px solid var(--gold);border-radius:10px"><div class="k" style="font-weight:700">${t('current')}</div><div class="v" style="font-weight:800;color:#3a2f00">${esc(curLabel)}</div></div>
    ${planCards}
    <div class="field"><label>${t('new_plan')}</label>
      <select id="insel" onchange="insPreview()">${opts}</select></div>
    <div id="insprev" class="optprev" style="display:none"></div>
    <div class="note" style="margin-top:6px">${t('ins_note')}</div>
    <div class="acts" style="margin-top:10px"><button class="btn-cancel" onclick="closeSheet()">${t('cancel_btn')}</button>
      <button class="btn-ok req" id="insbtn" disabled onclick="sendInsurance()">${t('req_this')}</button></div>`;
  $("#scrim").classList.add("show");
}
function insPreview(){
  const cur=insCur(), sel=$("#insel").value, box=$("#insprev"), btn=$("#insbtn");
  if(sel===cur){box.style.display="none";btn.disabled=true;return}
  const a=INS_PLANS.find(p=>p.v===cur)||{price:0}, b=INS_PLANS.find(p=>p.v===sel)||{price:0};
  const diff=(b.price||0)-(a.price||0);
  box.style.display="block";
  box.innerHTML=`<div class='optprev-h'>${t('change_content')}</div>
    <div class="optprev-r"><b>${esc(insLabel(cur))}</b> → <b style="color:var(--gold)">${esc(insLabel(sel))}</b></div>
    <div class="optprev-tot">${t('approx')} ${diff>=0?"＋":"−"}${yen(Math.abs(diff))}/${{ja:"日",en:"day",zh:"日",ko:"일"}[L]}</div>`;
  btn.disabled=false;
}
async function sendInsurance(){
  const cur=insCur(), sel=$("#insel").value;
  if(sel===cur){toast(t('no_change'));return}
  const detail=`補償を「${insLabel(sel)}」に変更希望（現在:${insLabel(cur)}）`;
  if(!confirm(t('ins_confirm')+"\n"+insLabel(sel)+"\n"+t('confirm_ok')))return;
  const {json}=await call("request",{req_type:"insurance",detail,target:{insurance:sel}});
  if(json.dropped)return;
  if(json.ok){closeSheet();toast(json.alreadyRequested?t('already_req'):t('received'));await load()}
  else toast(json.error||t('send_fail'));
}
async function sendReq(kind){
  const detail=$("#rq").value.trim();
  if(detail.length<1){toast(t('enter_content'));return}
  if(!confirm(detail+"\n"+t('confirm_ok')))return;
  const {json}=await call("request",{req_type:kind,detail});
  if(json.dropped)return;
  if(json.ok){closeSheet();toast(json.alreadyRequested?t('already_req'):t('received'));await load()}
  else toast(json.error||t('send_fail'));
}

/* ---- キャンセル申請（規定・料金を提示 → 同意して申請）---- */
const CANCEL_POLICY=[  // 予約取消料（正式）※借受予約日基準
  {when:{ja:"借受日の7日前まで",en:"Up to 7 days before",zh:"租車日7天前",ko:"대여일 7일 전까지"},fee:{ja:"無料",en:"Free",zh:"免費",ko:"무료"}},
  {when:{ja:"6日〜3日前",en:"6–3 days before",zh:"6～3天前",ko:"6~3일 전"},fee:{ja:"料金総額の 20%",en:"20% of total",zh:"總額20%",ko:"총액의 20%"}},
  {when:{ja:"2日前・前日",en:"2 days / 1 day before",zh:"2天前・前一天",ko:"2일 전・전날"},fee:{ja:"料金総額の 30%",en:"30% of total",zh:"總額30%",ko:"총액의 30%"}},
  {when:{ja:"当日以降",en:"On the day or later",zh:"當天以後",ko:"당일 이후"},fee:{ja:"料金総額の 50%",en:"50% of total",zh:"總額50%",ko:"총액의 50%"}},
];
function askCancel(){
  const rows=CANCEL_POLICY.map(p=>`<tr><td style="padding:8px 6px;border-top:1px solid var(--line)">${p.when[L]||p.when.ja}</td>
    <td style="padding:8px 6px;border-top:1px solid var(--line);text-align:right;font-weight:700">${p.fee[L]||p.fee.ja}</td></tr>`).join("");
  $("#sheet").innerHTML=`
    <h3>${t('cancel_title')}</h3>

    <table style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:10px">
      <thead><tr><th style="text-align:left;padding:6px;color:var(--sub);font-size:12px">${t('cancel_when')}</th>
      <th style="text-align:right;padding:6px;color:var(--sub);font-size:12px">${t('cancel_fee')}</th></tr></thead>
      <tbody>${rows}</tbody></table>
    <div class="note" style="margin:0 0 12px">${t('cancel_policy_note')}</div>
    <div class="field"><label>${t('reason_opt')}</label>
      <textarea id="cr" placeholder="${t('reason_ph')}"></textarea></div>
    <label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-bottom:12px;cursor:pointer">
      <input type="checkbox" id="agree" style="width:18px;height:18px;margin-top:2px" onchange="document.getElementById('cbtn').disabled=!this.checked">
      <span>${t('agree_policy')}</span></label>
    <div class="acts"><button class="btn-cancel" onclick="closeSheet()">${t('cancel_btn')}</button>
      <button class="btn-ok danger" id="cbtn" disabled onclick="sendCancel()">${t('cancel_apply')}</button></div>`;
  $("#scrim").classList.add("show");
}
function openReady(){
  const r=DATA.reservation;
  $("#sheet").innerHTML=`
    <h3>🟢 ${t('ready_time_title')}</h3>
    <p class="sub">${t('ready_time_sub')}</p>
    <div class="field"><label>${t('ready_time_label')}（${fmtDate(r.return_date)}）</label>${timeSel("rdyt",r.return_time||"")}</div>
    <div class="acts"><button class="btn-cancel" onclick="closeSheet()">${t('cancel_btn')}</button>
      <button class="btn-ok" style="background:#0e9f50" onclick="confirmReady()">${t('ready_send')}</button></div>`;
  $("#scrim").classList.add("show");
}
async function confirmReady(){
  const time=$("#rdyt").value.trim();
  if(!time){toast(t('ready_time_req'));return}
  const {json}=await call("ready",{time});
  if(json.dropped)return;
  if(json.ok){closeSheet();toast(json.alreadyRequested?t('already_req'):t('ready_received'));await load()}
  else toast(json.error||t('send_fail'));
}
async function sendCancel(){
  const reason=$("#cr").value.trim();
  if(!confirm(t('cancel_confirm')+"\n"+t('confirm_contact')))return;
  const {json}=await call("cancel_request",{reason});
  if(json.dropped)return;
  if(json.ok){closeSheet();toast(json.alreadyRequested?t('applied_already'):t('cancel_req_done'));await load()}
  else toast(json.error||t('send_fail'));
}

async function load(){
  if(!TOKEN){$("#app").innerHTML=`<div class="center">${t('no_key')}</div>`;return}
  let res=await call("lookup",{ro:RO});
  // ★ 通信エラー/タイムアウトは最大2回まで自動リトライ（コールドスタート・瞬断・端末差 対策）
  for(let i=0;i<2 && res.json && res.json._neterr;i++){
    await new Promise(function(r){setTimeout(r,1200);});
    res=await call("lookup",{ro:RO});
  }
  const {status,json}=res;
  if(!json.ok){
    const netmsg={ja:"通信が不安定なため読み込めませんでした。電波の良い場所で再読み込みしてください。",en:"Network unstable. Please reload where signal is good.",zh:"網路不穩定，請在訊號良好處重新載入。",ko:"네트워크가 불안정합니다. 신호가 좋은 곳에서 새로고침 해주세요."};
    const msg=json._neterr?(netmsg[L]||netmsg.ja):esc(json.error||t('not_found'));
    $("#app").innerHTML=`<div class="center">${msg}<br><br><button onclick="location.reload()" style="margin-top:10px;padding:9px 20px;border-radius:8px;border:none;background:#0F1F45;color:#fff;font-weight:800;font-size:15px;cursor:pointer">🔄 再読み込み</button></div>`;
    return;
  }
  DATA=json;
  try{document.title=(json.reservation.name||t('guest'))+" | HANDYMAN "+json.label}catch(e){}
  render();
}
/* ★★ 総合計測テレメトリ（マイページ全ボタン+滞在秒+スクロール+セクション別滞在） __TELEMETRY_MARK__ */
(function(){
  try{
    var STORE="tkm", PAGE=(((new URLSearchParams(location.search)).get("ro")==="1"))?"karte":"mypage";
    var TK=(new URLSearchParams(location.search)).get("t")||"";
    var EF="https://ckrxttbnawkclshczsia.supabase.co/functions/v1/ux-track";
    var SESS=""; try{SESS=sessionStorage.getItem("hdm_ux_sess")||"";}catch(e){}
    if(!SESS){ SESS="u"+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36); try{sessionStorage.setItem("hdm_ux_sess",SESS);}catch(e){} }
    function lang(){ try{return (typeof L!=="undefined")?L:"";}catch(e){return "";} }
    function post(o){ try{fetch(EF,{method:"POST",headers:{"Content-Type":"application/json"},keepalive:true,body:JSON.stringify(o)}).catch(function(){});}catch(e){} }
    function trk(action,event,value,meta){ post({store:STORE,page:PAGE,action:action,event:event,value:(value==null?null:value),token:TK,session:SESS,lang:lang(),meta:meta||null}); }
    window.__trk=trk;
    trk("page","page_view");
    var t0=Date.now(), maxScroll=0;
    function scp(){ var h=document.documentElement.scrollHeight-window.innerHeight; if(h<=6)return 100; return Math.min(100,Math.round(window.scrollY/h*100)); }
    window.addEventListener("scroll",function(){ var p=scp(); if(p>maxScroll)maxScroll=p; },{passive:true});
    /* セクション別 表示/滞在（絵文字でキー判定＝多言語非依存） */
    var EMO={"🚗":"resv","📍":"place","🗺":"drive","🩹":"damage","🪪":"license","🛰":"track","🧩":"quiz","🚌":"bus","🎁":"option","🛡":"insurance"};
    var secTime={}, secOpen={}, seen={};
    function secKey(el){ var s=el.querySelector("summary"); var tx=s?s.textContent:""; for(var e in EMO){ if(tx.indexOf(e)>=0)return EMO[e]; } return el.id||"sec"; }
    var io=new IntersectionObserver(function(ents){ ents.forEach(function(en){ var k=secKey(en.target); if(en.isIntersecting){ if(!secOpen[k]){ secOpen[k]=Date.now(); if(!seen[k]){ seen[k]=1; trk("acc_"+k,"section_view"); } } } else if(secOpen[k]){ secTime[k]=(secTime[k]||0)+(Date.now()-secOpen[k])/1000; secOpen[k]=0; } }); },{threshold:0.5});
    function observeAll(){ try{ document.querySelectorAll("details.acc").forEach(function(el){ io.observe(el); }); }catch(e){} }
    /* render後に再observe（renderがDOM差し替えするため） */
    if(typeof window.render==="function"){ var _r=window.render; window.render=function(){ var x=_r.apply(this,arguments); setTimeout(observeAll,60); return x; }; }
    setTimeout(observeAll,400);
    /* 主要ボタンを自動計測（関数ラップ） */
    ["reqOption","sendOption","reqInsurance","sendInsurance","askCancel","sendCancel","openReady","confirmReady","saveField","mpSave","mpPick","licUpload","licAdd","licDel","receiveDone","setLang","openQuiz","scrollLic","closeQuiz","signTerms","signDamage","savePickup"].forEach(function(n){ var o=window[n]; if(typeof o!=="function")return; window[n]=function(){ try{trk("btn_"+n,"click");}catch(e){} return o.apply(this,arguments); }; });
    ["mapPicker","editField"].forEach(function(n){ var o=window[n]; if(typeof o!=="function")return; window[n]=function(f){ try{trk(n+"_"+(f||""),"click");}catch(e){} return o.apply(this,arguments); }; });
    if(typeof window.call==="function"){ var _c=window.call; window.call=function(a){ try{ if(a&&a!=="lookup")trk("call_"+a,"click"); }catch(e){} return _c.apply(this,arguments); }; }
    /* 離脱時に滞在秒/スクロール/セクション滞在をsendBeaconで確実送信 */
    function flush(){
      var rows=[{store:STORE,page:PAGE,action:"page",event:"page_dwell",value:Math.round((Date.now()-t0)/1000),token:TK,session:SESS,lang:lang()},
                {store:STORE,page:PAGE,action:"page",event:"scroll",value:maxScroll,token:TK,session:SESS,lang:lang()}];
      for(var k in secOpen){ if(secOpen[k]){ secTime[k]=(secTime[k]||0)+(Date.now()-secOpen[k])/1000; secOpen[k]=0; } }
      for(var k in secTime){ if(secTime[k]>=1)rows.push({store:STORE,page:PAGE,action:"acc_"+k,event:"section_dwell",value:Math.round(secTime[k]),token:TK,session:SESS,lang:lang()}); }
      try{ navigator.sendBeacon(EF, new Blob([JSON.stringify({batch:rows})],{type:"application/json"})); }catch(e){ post({batch:rows}); }
    }
    var flushed=false;
    window.addEventListener("visibilitychange",function(){ if(document.visibilityState==="hidden"&&!flushed){ flushed=true; flush(); setTimeout(function(){flushed=false;},2000); } });
    window.addEventListener("pagehide",flush);
  }catch(e){}
})();

load();
