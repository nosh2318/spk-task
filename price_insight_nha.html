const clsList=[...new Set(Object.values(DATA).map(d=>d.cls))];
const order=['A','A2','B','B2','D','F','H'];clsList.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
const sel=document.getElementById('cls');clsList.forEach(c=>sel.innerHTML+=`<option>${c}</option>`);
const yen=n=>n==null?'—':'¥'+Number(n).toLocaleString();
function pclass(p){return {'最安以下':'p-cheapest','最安〜5位':'p-comp','5位〜10位':'p-mid','10位超':'p-high'}[p]||''}
function vclass(v){if(v.startsWith('⬆'))return'v-up';if(v.startsWith('⬇'))return'v-down';if(v.startsWith('🎯'))return'v-traffic';if(v.startsWith('✅'))return'v-keep';return'v-na'}
function utilHTML(U){
 if(!U||U.rep==null)return '<div class="util v-na" style="padding:6px 8px;border-radius:6px">稼働率データなし</div>';
 const rep=U.rep,ok=rep>=50;
 const chips=(U.rows||[]).map(r=>`<span class="mchip ${r.st==='途中'?'fut':''}">${r.m.slice(5)}月 ${r.util}%${r.st==='途中'?'途':''}</span>`).join('');
 return `<div class="util"><b>稼働率（成績表・目標50%）：<span style="color:${ok?'#16a34a':'#d97706'}">${rep}%</span></b> <span style="color:#888">（${U.status}月基準）</span>
  <div class="gauge"><div class="gfill ${ok?'ok':'ng'}" style="width:${Math.min(rep,100)}%"></div><div class="gline"></div></div>
  <div>${chips}</div></div>`;
}
function render(){
 const c=sel.value;const tiers=['A','B','C'];let h='';
 for(const t of tiers){
  const d=DATA[c+'|'+t];if(!d)continue;
  const mx=Math.max(...d.levels.map(L=>L.cnt),1);
  let rowsH=d.levels.map(L=>`<tr><td class="l">${yen(L.price)}</td><td>${L.cnt}本 <span class="bar2" style="width:${Math.round(L.cnt/mx*80)}px"></span></td><td class="${pclass(L.pos)}">${L.pos}</td><td class="l ${pclass(L.pos)}">${L.reason}</td></tr>`).join('');
  h+=`<div class="tier"><div class="th">${c} / ${d.tname}　<span style="font-size:12px;color:#888">計${d.total}本</span></div>
   <div class="mk">市場(5OTA中央値)：最安 ${yen(d.market.min)} ／ 5位 ${yen(d.market.p5)} ／ 10位 ${yen(d.market.p10)}</div>

   ${d.verdict?`<div class="ins ${vclass(d.verdict)}">${d.verdict}</div>`:''}</div>`;
 }
 document.getElementById('body').innerHTML=h||'<p>データなし</p>';
}
render();
