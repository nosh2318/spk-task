<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>全店 車両マスタ｜HANDYMAN</title>
<style>
  :root{--bg:#0b1222;--card:#111a2e;--line:rgba(255,255,255,.1);--mut:#93a4bf}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:#e8f0ff;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif}
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#0b1222,rgba(11,18,34,.96));padding:12px 16px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:17px;font-weight:800}
  .sub{font-size:11px;color:var(--mut);margin-top:2px}
  .bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
  .bar button{font-size:12px;background:#16223c;color:#cbd5e1;border:1px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer;font-weight:700}
  .bar button.on{background:#2563eb;color:#fff;border-color:#3b82f6}
  .bar input{flex:1;min-width:130px;background:#0e1830;border:1px solid var(--line);border-radius:8px;color:#fff;padding:7px 10px;font-size:13px}
  .cnt{font-size:12px;color:var(--mut);margin-left:auto}
  main{padding:14px 16px 60px}
  .grp{margin-bottom:20px}
  .grph{font-size:13px;font-weight:800;color:#8fd3e6;border-left:4px solid #38bdf8;padding-left:8px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .grph .n{font-size:11px;color:var(--mut);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .ch{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line)}
  .ch .cls{font-size:12px;font-weight:900;color:#fff;border-radius:7px;padding:3px 9px}
  .ch .nm{font-weight:800;font-size:15px}
  .ch .pl{margin-left:auto;font-family:ui-monospace,monospace;font-weight:800;font-size:15px;background:#0e1830;border:1px solid var(--line);border-radius:7px;padding:3px 9px;color:#bfe3ff}
  .cb{padding:11px 13px;font-size:12.5px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .kv{background:#0e1830;border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:11.5px}
  .kv b{color:#fde68a;font-weight:800}
  .kv .k{color:var(--mut);margin-right:5px;font-size:10.5px}
  .etc{background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.3);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:10px}
  .etc .lbl{font-size:11px;color:#8fd3e6;font-weight:800}
  .etc .loc{font-size:13.5px;font-weight:800;color:#e8f2ff}
  .etc img{width:56px;height:42px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer;margin-left:auto}
  .eq{display:flex;flex-wrap:wrap;gap:5px}
  .eq span{font-size:10.5px;border-radius:6px;padding:2px 7px;border:1px solid var(--line)}
  .eq .y{background:rgba(74,222,128,.12);color:#86efac;border-color:rgba(74,222,128,.3)}
  .eq .n{background:rgba(255,255,255,.04);color:#64748b}
  .mt{display:flex;gap:8px;flex-wrap:wrap}
  .mt .m{background:#0e1830;border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:11px}
  .mt .m.warn{border-color:#f59e0b;background:rgba(245,158,11,.12);color:#fcd34d}
  .mt .m b{font-weight:800}
  .caut{font-size:11.5px;color:#fca5a5;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:7px;padding:6px 9px}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .lb.open{display:flex}.lb img{max-width:100%;max-height:100%;border-radius:8px}
  .empty{color:var(--mut);text-align:center;padding:40px;font-size:13px}
  @media(max-width:640px){
    header{padding:10px 11px}
    h1{font-size:15px}
    .sub{font-size:10px}
    .bar{gap:5px}
    .bar button{font-size:11px;padding:5px 10px}
    .bar input{flex-basis:100%;order:5;min-width:0;font-size:16px}
    .cnt{font-size:11px;margin-left:0}
    main{padding:11px 10px 50px}
    .grid{grid-template-columns:1fr;gap:10px}
    .ch{padding:9px 11px} .ch .nm{font-size:14px} .ch .pl{font-size:14px}
    .etc img{width:64px;height:48px}
  }
</style>
</head>
<body>
<header>
  <h1>🚗 全店 車両マスタ</h1>
  <div class="sub" id="sub">読み込み中…</div>
  <div class="bar">
    <button data-s="all" class="on">全店</button>
    <button data-s="nha">🌺 那覇</button>
    <button data-s="spk">❄️ 札幌</button>
    <button data-s="bt">🍜 高松(HDM/BUDDICA)</button>
    <input id="q" placeholder="🔍 車種・ナンバー・クラスで検索">
    <span class="cnt" id="cnt"></span>
  </div>
</header>
<main id="main"><div class="empty">読み込み中…</div></main>
<div class="lb" id="lb" onclick="this.classList.remove('open')"><img id="lbimg"></div>
<script>
const MAIN_URL='https://ckrxttbnawkclshczsia.supabase.co',MAIN_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
const BT_URL='https://ggqugvyskyiblxiycpci.supabase.co',BT_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18';
const CLSCOL={A:'#7c3aed',A2:'#6d28d9',B:'#0284c7',B2:'#0369a1',C:'#059669',D:'#0d9488',S:'#d97706',F:'#db2777',G:'#65a30d',H:'#64748b',E:'#4f46e5',AA:'#9333ea',J:'#c026d3'};
const STORES={nha:'🌺 HDM那覇',spk:'❄️ HDM札幌',bt:'🍜 HDM/BUDDICA 高松'};
let DATA={nha:[],spk:[],bt:[]}, curS='all', q='';
function rpc(url,anon,fn,body){return fetch(url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:anon,'Authorization':'Bearer '+anon,'Content-Type':'application/json'},body:JSON.stringify(body||{})}).then(r=>r.json()).catch(()=>[]);}
function daysTo(d){if(!d)return null;const t=new Date(d);if(isNaN(t))return null;return Math.round((t-new Date())/864e5);}
function eqChip(on,label){return `<span class="${on?'y':'n'}">${on?'✓':'—'} ${label}</span>`;}
function card(v,store){
  const col=CLSCOL[v.cls]||'#475569';
  const kv=[];
  if(v.seats)kv.push(`<div class="kv"><span class="k">乗車</span><b>${v.seats}</b></div>`);
  if(v.year)kv.push(`<div class="kv"><span class="k">年式</span>${v.year}</div>`);
  if(v.color)kv.push(`<div class="kv"><span class="k">色</span>${v.color}</div>`);
  if(v.grade)kv.push(`<div class="kv"><span class="k">グレード</span>${v.grade}</div>`);
  if(v.fuel)kv.push(`<div class="kv"><span class="k">燃料</span>${v.fuel}</div>`);
  if(v.brand)kv.push(`<div class="kv"><span class="k">ブランド</span><b>${v.brand}</b></div>`);
  if(v.mileage!=null)kv.push(`<div class="kv"><span class="k">走行</span>${Number(v.mileage).toLocaleString()}km</div>`);
  let etc='';
  if(v.etc_loc||v.etc_img){
    etc=`<div class="etc"><div><div class="lbl">📍 ETC設置場所</div><div class="loc">${v.etc_loc||'（写真参照）'}</div></div>${v.etc_img?`<img src="${v.etc_img}" onclick="event.stopPropagation();openLb('${v.etc_img}')">`:''}</div>`;
  }
  const hasEq = v.backcam!=null||v.dashcam!=null||v.bluetooth!=null||v.rearmonitor!=null||v.usb!=null;
  let eq='';
  if(hasEq){eq=`<div class="eq">${eqChip(v.backcam,'バックカメラ')}${eqChip(v.dashcam,'ドラレコ')}${eqChip(v.bluetooth,'Bluetooth')}${v.rearmonitor!=null?eqChip(v.rearmonitor,'後席モニタ'):''}${v.usb!=null?eqChip(v.usb,'USB'):''}</div>`;}
  else if(v.equip){eq=`<div class="kv"><span class="k">装備</span>${v.equip.replace(/[{}\[\]"]/g,'')}</div>`;}
  const mt=[];
  const sd=daysTo(v.shaken), td=daysTo(v.tenken);
  if(v.shaken)mt.push(`<div class="m${sd!=null&&sd<45?' warn':''}"><span class="k">🔧車検</span> <b>${v.shaken}</b>${sd!=null?` (${sd}日)`:''}</div>`);
  if(v.tenken)mt.push(`<div class="m${td!=null&&td<20?' warn':''}"><span class="k">🔩点検</span> <b>${v.tenken}</b>${td!=null?` (${td}日)`:''}</div>`);
  if(v.oil_km)mt.push(`<div class="m"><span class="k">🛢オイル</span> ${Number(v.oil_km).toLocaleString()}km毎</div>`);
  return `<div class="card">
    <div class="ch"><span class="cls" style="background:${col}">${v.cls||'—'}</span><span class="nm">${v.name||''}</span><span class="pl">${v.plate||''}</span></div>
    <div class="cb">
      ${etc}
      ${kv.length?`<div class="row">${kv.join('')}</div>`:''}
      ${eq}
      ${mt.length?`<div class="mt">${mt.join('')}</div>`:''}
      ${v.caution?`<div class="caut">⚠️ ${v.caution}</div>`:''}
    </div>
  </div>`;
}
function render(){
  const stores = curS==='all'?['nha','spk','bt']:[curS];
  let total=0, html='';
  stores.forEach(s=>{
    let list=DATA[s]||[];
    if(q){const qq=q.toLowerCase();list=list.filter(v=>((v.name||'')+(v.plate||'')+(v.cls||'')+(v.brand||'')).toLowerCase().includes(qq));}
    if(!list.length)return;
    total+=list.length;
    // クラス別グループ
    const byCls={};list.forEach(v=>{(byCls[v.cls||'—']=byCls[v.cls||'—']||[]).push(v);});
    const clsList=Object.keys(byCls).sort();
    html+=`<div class="grp"><div class="grph">${STORES[s]} <span class="n">${list.length}台</span></div>`;
    clsList.forEach(c=>{
      html+=`<div style="margin-bottom:6px"><div style="font-size:12px;color:#cbd5e1;font-weight:700;margin:8px 0 6px">クラス ${c}（${byCls[c].length}）</div><div class="grid">${byCls[c].map(v=>card(v,s)).join('')}</div></div>`;
    });
    html+=`</div>`;
  });
  document.getElementById('main').innerHTML = total?html:'<div class="empty">該当する車両がありません</div>';
  document.getElementById('cnt').textContent = `${total}台`;
}
window.openLb=function(u){document.getElementById('lbimg').src=u;document.getElementById('lb').classList.add('open');};
document.querySelectorAll('.bar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.bar button').forEach(x=>x.classList.remove('on'));b.classList.add('on');curS=b.dataset.s;render();});
document.getElementById('q').oninput=e=>{q=e.target.value.trim();render();};
Promise.all([
  rpc(MAIN_URL,MAIN_ANON,'company_vehicles',{p_store:'nha'}).then(a=>DATA.nha=Array.isArray(a)?a:[]),
  rpc(MAIN_URL,MAIN_ANON,'company_vehicles',{p_store:'spk'}).then(a=>DATA.spk=Array.isArray(a)?a:[]),
  rpc(BT_URL,BT_ANON,'bt_company_vehicles',{}).then(a=>DATA.bt=Array.isArray(a)?a:[]),
]).then(()=>{
  const tot=DATA.nha.length+DATA.spk.length+DATA.bt.length;
  document.getElementById('sub').textContent=`那覇 ${DATA.nha.length} / 札幌 ${DATA.spk.length} / 高松 ${DATA.bt.length}　計 ${tot}台　（ETC設置場所・装備・車検/点検 等のマスタ情報）`;
  render();
});
</script>
</body>
</html>
