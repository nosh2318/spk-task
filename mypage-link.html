<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>お客様マイページURL - HANDYMAN札幌</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;background:#f1f5f9;color:#0f172a;font-size:14px;max-width:720px;margin:0 auto;padding-bottom:60px}
.bar{background:linear-gradient(135deg,#0f172a,#0e7a6b);color:#fff;padding:14px 16px;font-weight:800;font-size:17px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px}
.bar a{margin-left:auto;color:#fff;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:8px;text-decoration:none;font-size:12px}
.wrap{padding:12px}
.note{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;font-size:12px;border-radius:10px;padding:9px 12px;margin-bottom:12px;line-height:1.5}
.search{position:sticky;top:52px;z-index:4;background:#f1f5f9;padding:8px 0 10px}
.search input{width:100%;font-size:16px;padding:12px 14px;border:2px solid #0e7a6b;border-radius:12px;background:#fff;color:#0f172a;font-weight:600}
.card{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.nm{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tp{font-size:10px;font-weight:700;padding:1px 8px;border-radius:10px;background:#dbeafe;color:#1d4ed8}
.sub{font-size:12px;color:#64748b;margin-top:3px}
.urlrow{display:flex;gap:6px;margin-top:10px;align-items:center}
.urlrow input{flex:1;font-size:11px;padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;color:#475569}
.btn{font-size:13px;font-weight:800;padding:10px 14px;border-radius:10px;border:none;cursor:pointer;white-space:nowrap}
.btn.cp{background:#0e7a6b;color:#fff}
.btn.op{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.btn.ro{background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;font-size:11px;padding:8px 10px}
.actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.loading{text-align:center;padding:60px;color:#64748b}
.spin{width:32px;height:32px;border:4px solid #e2e8f0;border-top-color:#0e7a6b;border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:20px;margin:16px;text-align:center;line-height:1.6}
.empty{text-align:center;color:#94a3b8;padding:40px;font-size:13px}
.notk{font-size:11px;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px;margin-top:8px}
</style></head>
<body>
<div class="bar">🪪 お客様マイページURL<a href="./">← APPに戻る</a></div>
<div id="app"><div class="loading"><div class="spin"></div>読み込み中…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SB="https://ckrxttbnawkclshczsia.supabase.co";
var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
var app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
// アプリのログイントークンを再利用（ログイン不要で開ける）
function appToken(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k));var t=(v&&(v.access_token||(v.currentSession&&v.currentSession.access_token)||(v.session&&v.session.access_token)))||(Array.isArray(v)&&v[0]);if(t)return t;}}}catch(e){}return null;}
var TK=appToken();
var BASE=location.origin+location.pathname.replace(/[^/]*$/,"");
function custUrl(tok){return BASE+"my.html?t="+tok;}           // お客様に送るURL（編集可）
function staffUrl(tok){return BASE+"my.html?t="+tok+"&ro=1";}  // スタッフ確認（閲覧専用）
var OTA={HP:"公式HP",R:"楽天",J:"じゃらん",S:"skyticket",E:"エアトリ",KEYDROP:"KEYDROP"};

function copy(id,btn){var el=document.getElementById(id);if(!el)return;el.select();el.setSelectionRange(0,99999);var v=el.value;try{navigator.clipboard.writeText(v);}catch(e){try{document.execCommand("copy");}catch(_){}}if(btn){var o=btn.textContent;btn.textContent="✓ コピー済み";btn.style.background="#059669";setTimeout(function(){btn.textContent=o;btn.style.background="";},1400);}}
window.copy=copy;

function fmtD(d){if(!d)return"";var m=String(d).match(/(\d{4})-(\d{2})-(\d{2})/);return m?(+m[2])+"/"+(+m[3]):d;}
function cardHtml(r,i){
  var tok=r.mypage_token;
  var period=fmtD(r.lend_date)+(r.return_date&&r.return_date!==r.lend_date?("〜"+fmtD(r.return_date)):"");
  var ota=OTA[r.ota]||r.ota||"";
  var h='<div class="card">';
  h+='<div class="nm">'+esc(r.name||"(氏名なし)")+' 様'+(ota?'<span class="tp">'+esc(ota)+'</span>':'')+'</div>';
  h+='<div class="sub">'+esc(r.id)+'　'+esc(period)+(r.status==="cancelled"||r.status==="キャンセル"?'　❌キャンセル':'')+'</div>';
  if(tok){
    var cid="c"+i;
    h+='<div class="urlrow"><input id="'+cid+'" readonly value="'+esc(custUrl(tok))+'" onclick="this.select()"><button class="btn cp" onclick="copy(\''+cid+'\',this)">🔗 URLをコピー</button></div>';
    h+='<div class="actions">'
      +'<a class="btn op" href="'+esc(custUrl(tok))+'" target="_blank" rel="noopener">👀 お客様画面を開く</a>'
      +'<a class="btn ro" href="'+esc(staffUrl(tok))+'" target="_blank" rel="noopener">🪪 スタッフ確認(閲覧専用)</a>'
      +'</div>';
  }else{
    h+='<div class="notk">マイページtoken未発行です（予約取込直後は数分後に発行されます）</div>';
  }
  h+='</div>';
  return h;
}
function render(list,q){
  var head='<div class="wrap"><div class="note">お客様に送るURL＝<b>「🔗 URLをコピー」</b>（お客様が場所/時間の変更もできる編集可URL）。<br>名前・予約番号で検索できます。既定は直近〜今後の予約。過去分は検索窓に入力してください。</div>'
    +'<div class="search"><input id="q" placeholder="🔍 お客様名 または 予約番号で検索" value="'+esc(q||"")+'" autocomplete="off"></div>';
  var body="";
  if(!list.length){body='<div class="empty">'+(q?'「'+esc(q)+'」に一致する予約がありません':'表示できる予約がありません')+'</div>';}
  else{list.forEach(function(r,i){body+=cardHtml(r,i);});}
  app.innerHTML=head+body+'</div>';
  var qi=document.getElementById("q");
  qi.addEventListener("input",onSearch);
  if(q!=null){qi.focus();var vl=qi.value.length;qi.setSelectionRange(vl,vl);}
}

var COLS="id,name,ota,lend_date,return_date,mypage_token,status";
var timer=null;
function onSearch(e){
  var q=e.target.value.trim();
  if(timer)clearTimeout(timer);
  timer=setTimeout(function(){doSearch(q);},250);
}
async function doSearch(q){
  var H={apikey:ANON,Authorization:"Bearer "+(TK||ANON)};
  try{
    var url;
    if(q){
      var qe=encodeURIComponent("%"+q+"%");
      url=SB+"/rest/v1/reservations?select="+COLS+"&or=(id.ilike."+qe+",name.ilike."+qe+")&order=lend_date.desc&limit=60";
    }else{
      var cut=new Date(Date.now()-3*86400000).toISOString().slice(0,10);
      url=SB+"/rest/v1/reservations?select="+COLS+"&return_date=gte."+cut+"&neq=status.cancelled&order=lend_date.asc&limit=300";
    }
    var r=await fetch(url,{headers:H});
    if(!r.ok)throw new Error("HTTP "+r.status);
    var data=await r.json();
    if(!q)data=data.filter(function(x){return x.status!=="cancelled"&&x.status!=="キャンセル";});
    render(data,q);
  }catch(err){
    if(!TK){app.innerHTML='<div class="err">🔒 予約データを読むにはログインが必要です。<br>先に <a href="./">HANDYMAN札幌APP</a> にログインしてから、このページを開いてください。</div>';return;}
    app.innerHTML='<div class="err">読み込みに失敗しました（'+esc(err.message)+'）<br><button class="btn cp" onclick="doSearch(\'\')">再読み込み</button></div>';
  }
}
doSearch("");
</script>
</body></html>
