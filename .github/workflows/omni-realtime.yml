name: Omni Realtime (本物 claude --agent omni)

# このworkflowは "Slackから本物のomniを叩く" 経路の実体。
# PCの ~/.claude を runner に展開し、claude --agent omni --model sonnet を直接起動する。
#
# 配置: 対象リポジトリの .github/workflows/omni-realtime.yml にコピー
# 同時に .omni-runtime/ ディレクトリ（agents・CLAUDE.md・knowledge）もリポジトリ直下にコミット必須。
#
# 必要 GitHub Secrets:
#   - ANTHROPIC_API_KEY   ← Anthropic API キー（クラウドからclaudeを叩くため）
#   - SLACK_BOT_TOKEN     ← Slack回答投稿用
#   - OMNI_ALLOWED_USERS  ← カンマ区切りのSlack User ID 許可リスト（6名）

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Slackから来た依頼文'
        required: true
        type: string
      slack_channel:
        description: 'Slack channel ID'
        required: true
        type: string
      slack_thread_ts:
        description: 'Slack thread timestamp'
        required: false
        type: string
        default: ''
      slack_user_id:
        description: 'Requester Slack User ID（認可チェック用）'
        required: true
        type: string
      image_urls:
        description: 'Slack添付画像URL（カンマ区切り・任意）'
        required: false
        type: string
        default: ''

permissions:
  contents: write          # ★ コード修正 → git push を許可
  pull-requests: write     # ★ PR作成を許可
  issues: read
  # ⚠️ omni には「main直push禁止・必ずブランチ作成→PR」を strict に指示する
  #    （Run step 内の OPERATIONAL_RULES prefix 参照）

jobs:
  run-omni:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ─────────────────────────────────────────────
      # 🔐 ① 認可ゲート（最初に・未認可なら何もしない）
      # ─────────────────────────────────────────────
      - name: 🔐 Authorization gate
        env:
          REQUESTER: ${{ inputs.slack_user_id }}
          ALLOWED: ${{ secrets.OMNI_ALLOWED_USERS }}
          PROMPT: ${{ inputs.prompt }}
        run: |
          if [ -z "$ALLOWED" ]; then
            echo "::error::OMNI_ALLOWED_USERS secret 未設定。安全のため停止します。"
            exit 1
          fi
          case ",$ALLOWED," in
            *",$REQUESTER,"*) echo "✅ 認可OK: $REQUESTER" ;;
            *) echo "::error::未認可ユーザー ($REQUESTER) の実行をブロックしました。"; exit 1 ;;
          esac
          # プロンプト長ガード（GitHub Actions input は2000字上限なので実上限は約1900）
          LEN=${#PROMPT}
          echo "prompt length = $LEN chars"
          if [ "$LEN" -gt 1900 ]; then
            echo "::warning::プロンプトが1900字を超えています ($LEN字)。GitHub Actions側で切詰めされる可能性。"
          fi

      # ─────────────────────────────────────────────
      # 📦 ② リポジトリchecout（.omni-runtime/ 込み）
      # ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 🛠 ③ Node + claude CLI install
      # ─────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install claude CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      # ─────────────────────────────────────────────
      # 📥 ④ PC ~/.claude をrunnerに展開（搬入）
      # ─────────────────────────────────────────────
      - name: Provision ~/.claude (omni runtime)
        run: |
          if [ ! -d ".omni-runtime" ]; then
            echo "::error::.omni-runtime/ がリポジトリに見つかりません。omni_bot/.omni-runtime をコミットしてください。"
            exit 1
          fi
          mkdir -p ~/.claude
          cp -R .omni-runtime/agents     ~/.claude/agents
          cp    .omni-runtime/CLAUDE.md  ~/.claude/CLAUDE.md
          cp -R .omni-runtime/knowledge  ~/.claude/knowledge
          echo "✅ provisioned $(du -sh ~/.claude | cut -f1)"
          echo "agents: $(ls ~/.claude/agents/*.md | wc -l)"
          echo "knowledge: $(ls ~/.claude/knowledge/*.md | wc -l)"
          [ -f .omni-runtime/SYNCED_AT ] && echo "搬入物 SYNCED_AT: $(cat .omni-runtime/SYNCED_AT)"

      # ─────────────────────────────────────────────
      # 🛠 ⑤ git identity 設定（commit に必要）
      # ─────────────────────────────────────────────
      - name: Setup git identity
        run: |
          git config --global user.email "omni-bot@handyman.local"
          git config --global user.name "HANDYMAN OMNI Bot"

      # ─────────────────────────────────────────────
      # 🖼 ⑤.5 Slack 添付画像をダウンロード（任意・カンマ区切りURL）
      # ─────────────────────────────────────────────
      - name: Download Slack images
        if: ${{ inputs.image_urls != '' }}
        env:
          IMAGE_URLS: ${{ inputs.image_urls }}
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          mkdir -p /tmp/imgs
          IFS=',' read -ra URLS <<< "$IMAGE_URLS"
          for i in "${!URLS[@]}"; do
            URL="${URLS[$i]}"
            EXT=$(echo "$URL" | sed -nE 's|.*\.([a-zA-Z]{3,4})(\?.*)?$|\1|p')
            [ -z "$EXT" ] && EXT="png"
            OUT="/tmp/imgs/img_${i}.${EXT}"
            echo "Downloading: $URL → $OUT"
            curl -sSL -H "Authorization: Bearer $SLACK_TOKEN" "$URL" -o "$OUT"
            ls -la "$OUT"
          done
          ls -la /tmp/imgs/

      # ─────────────────────────────────────────────
      # 🌍 ⑥ 本物 omni を起動（B案: /tmpから起動して project CLAUDE.md 自動loadを抑制）
      # ─────────────────────────────────────────────
      - name: Run claude --agent omni (from /tmp)
        id: omni
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OMNI_PROMPT: ${{ inputs.prompt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_PATH: ${{ github.workspace }}
        run: |
          # ★ omni に渡す前置ルール（受信種別ごとのプレイブック + 絶対ルール）+ ユーザー依頼
          # /tmp 起動なので omni 自身に「リポジトリは $REPO_PATH にある」と教える
          {
            echo "[ROLE]"
            echo "あなたは HANDYMAN OMNI。Slack から呼ばれた現場指揮官。"
            echo "対象店舗は今は spk-task (札幌) のみ。NHA/BT は対象外。"
            echo "リポジトリは $REPO_PATH に checkout 済み。git ops はそこで行う。"
            echo ""
            echo "[CLASSIFY FIRST]"
            echo "依頼を受けたら、まず以下の7種別のどれかに分類してから動く。"
            echo "  1. CODE   = コード修正・新機能 (キーワード: 修正/追加/実装/変更/UI/タブ/v4./バグ)"
            echo "  2. INFO   = 情報照会 (キーワード: 教えて/何/いくつ/何台/状況)"
            echo "  3. CALC   = 経営計算・実績シミュ (キーワード: 試算/もし/増車/値上げ/シミュ/予測)"
            echo "  4. DATA   = データ修正 (キーワード: DB/レコード/UPDATE/直して/書き換え)"
            echo "  5. OP     = オペ指示 (キーワード: スタッフに/連絡/伝えて/Slack送って)"
            echo "  6. INVEST = 調査・原因究明 (キーワード: なぜ/原因/調べて/ログ)"
            echo "  7. IMAGE  = 画像内容確認 (添付画像がある場合・上記と併用可)"
            echo "回答冒頭に [種別: CODE] のように分類を明示する。"
            echo ""
            echo "[PLAYBOOKS]"
            echo "■ CODE"
            echo "  cd \$REPO_PATH"
            echo "  git checkout -b omni/<slug>-\$(date +%s)"
            echo "  ファイル編集 → git add → git commit -m '修正概要 (omni)'"
            echo "  git push -u origin <branch>"
            echo "  gh pr create --base main --title '...' --body '依頼: ...'"
            echo "  最後の行に 'PR: <url>' を出す"
            echo "  ★ NEVER push to main。必ずブランチ+PR。"
            echo ""
            echo "■ INFO"
            echo "  まず: ユーザーが既にAPPで見られる値か考える。見られるなら 'APP の <タブ名> で表示されています' と案内。"
            echo "  再集計せず案内する。再集計が必要な場合は理由を明示。"
            echo "  画像添付があれば Read tool で読んでから回答。"
            echo ""
            echo "■ CALC"
            echo "  経営判断のシミュレーションは「APP に既にある実績」を引用して組み合わせる。"
            echo "  業界平均・推測値は使わない。「過去の VEL 粗利が ¥X だから 2台目試算は…」のように実績ベース。"
            echo "  根拠数字の出所 (どのタブ・どの月) を明示する。"
            echo ""
            echo "■ DATA"
            echo "  ★ 必ず2段階。"
            echo "  Step1: 「UPDATE 対象テーブル WHERE 〇〇=△△ SET □□=◇◇ を実行します。よろしいですか?」と Slack で計画提示。"
            echo "  Step2: ユーザーが「OK」「実行して」と返してから初めて実行。"
            echo "  実行後は SELECT で再確認し「修正後の値は □□ になりました」と報告。"
            echo "  ★ DELETE / WHERE 省略の UPDATE は計画提示の段階で即拒否。"
            echo ""
            echo "■ OP"
            echo "  スタッフへの連絡は Slack DM か該当チャネルに postMessage。"
            echo "  文面は事前にユーザーに見せて承認を得る (DATAと同じ2段階)。"
            echo ""
            echo "■ INVEST"
            echo "  リポジトリ内のコード/ログ/CLAUDE.md を Read tool で読む。"
            echo "  根拠ファイル・行番号を回答に含める。推測のみの結論は出さない。"
            echo ""
            echo "■ IMAGE"
            echo "  添付画像は Read tool で読む。画像内容の要約と、依頼との関係を述べる。"
            echo ""
            echo "[ABSOLUTE RULES — 全種別共通]"
            echo "1. 不確実なら「分からない」「アクセスできない」と明示。'データが存在しません' '見つかりません' を断定するな。"
            echo "   アクセスできないだけの可能性が高い。'<テーブル> に対する読み取り権限がない可能性があります' と書く。"
            echo "2. 書込 (UPDATE/INSERT/DELETE/git push/Slack送信) は必ず事前に計画提示 → ユーザー確認を待つ。"
            echo "3. WHERE 省略の UPDATE / DELETE は計画段階で拒否。安全装置。"
            echo "4. 書込後は再 SELECT / git status / Slack 返信確認 で検証してから完了報告する。"
            echo "5. APP に表示されている KPI を DB から再集計しない。'<タブ名> で表示されています' と案内。"
            echo "6. 店舗 (NHA/SPK/BT) の混同禁止。今回の対象は spk-task のみ。NHA/BT 依頼は対象外と返す。"
            echo ""
            echo "[OUTPUT FORMAT]"
            echo "1行目: [種別: CODE|INFO|CALC|DATA|OP|INVEST|IMAGE]"
            echo "本文: 簡潔に。長文禁止。"
            echo "最終行 (CODE のみ): PR: <url>"
            # 添付画像があれば omni に Read tool で読むよう指示
            if [ -d /tmp/imgs ] && [ -n "$(ls /tmp/imgs/ 2>/dev/null)" ]; then
              echo ""
              echo "[ATTACHED IMAGES]"
              echo "ユーザーが画像を添付しています。Read tool で各画像を読んでから回答してください:"
              for img in /tmp/imgs/*; do
                echo "- $img"
              done
            fi
            echo ""
            echo "[REQUEST]"
            echo "$OMNI_PROMPT"
          } > /tmp/prompt.txt
          # /tmp から起動 = project CLAUDE.md 自動load を回避
          cd /tmp
          set +e
          claude --agent omni --model haiku \
            --print --dangerously-skip-permissions \
            -p "$(cat /tmp/prompt.txt)" \
            > /tmp/omni_answer.txt 2> /tmp/omni_err.txt
          EXIT=$?
          set -e
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          echo "----- prompt size -----"
          wc -c /tmp/prompt.txt
          echo "----- STDOUT (先頭2000字) -----"
          head -c 2000 /tmp/omni_answer.txt
          echo ""
          echo "----- STDERR (先頭1500字) -----"
          head -c 1500 /tmp/omni_err.txt
          exit 0

      # ─────────────────────────────────────────────
      # 💬 ⑥ 回答を Slack スレッドに返す
      #   ※ if: secrets.* は step レベルで使えない仕様のため削除。
      #     SLACK_BOT_TOKEN が未設定なら curl が認証エラーで失敗するが、Job 全体は続行。
      # ─────────────────────────────────────────────
      - name: Post answer to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ inputs.slack_channel }}
          THREAD_TS: ${{ inputs.slack_thread_ts }}
          EXIT_CODE: ${{ steps.omni.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 回答テキストを取得（最大3500字でカット = Slackメッセージ上限対策）
          if [ "$EXIT_CODE" = "0" ] && [ -s /tmp/omni_answer.txt ]; then
            ANSWER=$(head -c 3500 /tmp/omni_answer.txt)
            HEADER="🌍"
          else
            ANSWER="⚠️ omni が応答できませんでした（exit=$EXIT_CODE）。詳細: $RUN_URL"
            ERRTXT=$(head -c 500 /tmp/omni_err.txt 2>/dev/null || echo '')
            [ -n "$ERRTXT" ] && ANSWER="$ANSWER"$'\n'"\`\`\`$ERRTXT\`\`\`"
            HEADER="❌"
          fi
          # jq でJSONエスケープ（改行・絵文字・コードブロックも安全）
          BODY=$(jq -n \
            --arg ch "$CHANNEL" \
            --arg thread "$THREAD_TS" \
            --arg text "$HEADER $ANSWER" \
            '{channel:$ch, text:$text} + (if $thread != "" then {thread_ts:$thread} else {} end)')
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$BODY" | jq -r '.ok, .error // empty'

      # ─────────────────────────────────────────────
      # ⚠️ ⑦ omni が失敗していたらjob全体も失敗扱い（GH Actionsの統計のため）
      # ─────────────────────────────────────────────
      - name: Propagate omni exit
        if: ${{ steps.omni.outputs.exit_code != '0' }}
        run: |
          echo "omni step failed (exit=${{ steps.omni.outputs.exit_code }})"
          exit 1
