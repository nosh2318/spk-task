name: 画面の文法チェック
on:
  pull_request:
    paths: ['**.html']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 変更した .html の JavaScript を確かめる
        run: |
          files=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD -- '*.html')
          echo "$files"
          [ -z "$files" ] && exit 0
          node .github/scripts/check-html-js.mjs $files
