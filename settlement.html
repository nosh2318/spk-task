<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>請求書</title>
<style>
:root{--ink:#0f172a;--sub:#475569;--line:#cbd5e1;--soft:#f1f5f9;--accent:#1e3a8a;--bg:#e2e8f0;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{max-width:820px;margin:16px auto 0;padding:0 16px;display:flex;gap:8px;justify-content:flex-end}
.bar button{padding:8px 18px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
.bar button.sub{background:#fff;color:var(--sub);border:1px solid var(--line)}
.paper{max-width:820px;margin:12px auto 32px;background:var(--paper);padding:40px 44px;box-shadow:0 2px 12px rgba(15,23,42,.08)}
h1{font-size:24px;letter-spacing:.3em;text-align:center;margin:0 0 28px;font-weight:800}
.head{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
.to{font-size:18px;font-weight:800;border-bottom:2px solid var(--ink);padding-bottom:4px;min-width:260px}
.meta{font-size:13px;color:var(--sub);line-height:1.9;text-align:right}
.from{margin-top:18px;font-size:13px;line-height:1.8;text-align:right}
.from b{font-size:15px}
.lead{margin:22px 0 10px;font-size:13px}
.total{display:flex;align-items:baseline;gap:16px;border:2px solid var(--ink);padding:10px 16px;margin:0 0 22px;width:max-content;max-width:100%}
.total span{font-size:14px;font-weight:700}
.total b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--soft);font-weight:700;color:var(--sub);padding:9px 10px;border:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
td.r{text-align:right;white-space:nowrap}
.sum{margin-left:auto;margin-top:14px;width:300px;max-width:100%}
.sum td{border:none;border-bottom:1px solid var(--line);padding:7px 10px}
.sum tr.g td{font-weight:900;font-size:16px;border-bottom:2px solid var(--ink)}
.note{margin-top:24px;font-size:12px;color:var(--sub);line-height:1.8}
.stamp{display:inline-block;margin-top:14px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px}
.ok{background:#dcfce7;color:#166534}.wait{background:#fef3c7;color:#92400e}.void{background:#fee2e2;color:#991b1b}
.msg{max-width:820px;margin:60px auto;padding:0 16px;text-align:center;color:var(--sub);font-size:14px}
@media (max-width:600px){.paper{padding:24px 16px}h1{font-size:20px}.meta,.from{text-align:left}table{font-size:12px}th,td{padding:7px 6px}}
@media print{body{background:#fff}.bar,.stamp{display:none}.paper{box-shadow:none;margin:0;max-width:none;padding:0}@page{size:A4;margin:16mm}}
</style>
</head>
<body>
<div class="bar"><button class="sub" onclick="history.length>1?history.back():window.close()">戻る</button><button onclick="window.print()">印刷・PDF保存</button></div>
<div id="root"><div class="msg">読み込み中...</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 請求書（2026-10-15）：partner_settlements / partner_settlement_items を表示するだけ（DB書込なし）。請求者＝協力会社、宛先＝株式会社Global Lines。
// 請求項目は固定＝ナンバー／車種名／〇月稼働分／稼働日数／単価（オーナー指定）。明細は予約単位で保存し、ここで車両×返却月×単価にまとめる。
const SB_URL='https://ckrxttbnawkclshczsia.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen=n=>'¥'+(Number(n)||0).toLocaleString();
const root=document.getElementById('root');
function fail(t){root.innerHTML='<div class="msg">'+esc(t)+'</div>';}
(async()=>{
  const id=new URLSearchParams(location.search).get('id');
  if(!id||!/^\d+$/.test(id)){fail('請求書の番号が指定されていません。');return;}
  const sb=window.supabase.createClient(SB_URL,SB_KEY);
  const{data:{session}}=await sb.auth.getSession();
  if(!session){fail('ログインが切れています。アプリ（または協力会社ページ）を開き直してから、もう一度お試しください。');return;}
  const[{data:h,error:e1},{data:items,error:e2}]=await Promise.all([
    sb.from('partner_settlements').select('*').eq('id',id).maybeSingle(),
    sb.from('partner_settlement_items').select('*').eq('settlement_id',id).eq('deleted',false)
  ]);
  if(e1||e2){fail('読み込めませんでした（'+esc((e1||e2).message)+'）');return;}
  if(!h){fail('この請求書は見つからないか、表示する権限がありません。');return;}
  // 車両×返却月×単価でまとめる
  const g={};
  (items||[]).forEach(it=>{
    const ym=(it.return_date||'').slice(0,7);
    const k=it.vehicle_code+'|'+ym+'|'+it.daily_cost;
    if(!g[k])g[k]={plate:it.plate_no||'',name:it.vehicle_name||'',ym,days:0,unit:it.daily_cost,amt:0};
    g[k].days+=it.days;g[k].amt+=it.amount_in;
  });
  // 請求額＝お支払い金額（税抜）：行（車両×返却月×単価）ごとに ÷1.1・円未満切捨て（協力会社ページのコスト一覧と同じ計算）
  Object.values(g).forEach(r=>{r.ex=Math.floor(r.amt*10/11);});
  const totEx=Object.values(g).reduce((s,r)=>s+r.ex,0);
  const rows=Object.values(g).sort((a,b)=>a.ym.localeCompare(b.ym)||a.plate.localeCompare(b.plate));
  const ymL=ym=>{const p=ym.split('-');return p.length===2?(+p[1])+'月稼働分':'—';};
  const st=h.deleted?'<span class="stamp void">取消済み</span>':h.confirmed_at?'<span class="stamp ok">HANDYMAN 受領確認済み（'+esc(new Date(h.confirmed_at).toLocaleDateString('ja-JP'))+'）</span>':'<span class="stamp wait">HANDYMAN 確認待ち</span>';
  const d=new Date(h.issue_date+'T00:00:00');
  root.innerHTML='<div class="paper">'
    +'<h1>請求書</h1>'
    +'<div class="head"><div class="to">'+esc(h.addressee||'株式会社Global Lines')+' 御中</div>'
    +'<div class="meta">No. '+esc(h.doc_no)+'<br>発行日 '+d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日</div></div>'
    +'<div class="from"><b>'+esc(h.issuer_name)+'</b></div>'
    +'<div class="lead">下記のとおりご請求申し上げます。</div>'
    +'<div class="total"><span>ご請求金額（税抜）</span><b>'+yen(totEx)+'</b></div>'
    +'<table><thead><tr><th>ナンバー</th><th>車種名</th><th>稼働月</th><th>稼働日数</th><th>単価（税込）</th><th>金額（税抜）</th></tr></thead><tbody>'
    +rows.map(r=>'<tr><td>'+esc(r.plate)+'</td><td>'+esc(r.name)+'</td><td>'+esc(ymL(r.ym))+'</td><td class="r">'+r.days+'日</td><td class="r">'+yen(r.unit)+'</td><td class="r">'+yen(r.ex)+'</td></tr>').join('')
    +'</tbody></table>'
    +'<table class="sum"><tr class="g"><td>合計（税抜）</td><td class="r">'+yen(totEx)+'</td></tr></table>'
    +'<div class="note">※ 稼働日数は貸出日から返却日までの日数（返却月で集計）です。<br>※ 金額（税抜）＝単価（税込）×稼働日数 ÷1.1（円未満切捨て）。</div>'
    +st+'</div>';
  document.title='請求書 '+h.doc_no;
})().catch(e=>fail('表示できませんでした（'+(e&&e.message||e)+'）'));
</script>
</body>
</html>
