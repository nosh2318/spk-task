<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>📅 アクション牽引 v1.0</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:#f7f8fa;color:#111827;margin:0;padding:18px;font-size:14px;line-height:1.5}
.header{background:#fff;padding:18px 22px;border-radius:12px;margin-bottom:16px;border:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.header h1{margin:0;font-size:20px;font-weight:700;color:#111827;display:flex;align-items:center;gap:8px}
.header .sub{font-size:12px;color:#6b7280;margin-top:2px}
.controls{background:#fff;padding:14px 18px;border-radius:12px;margin-bottom:16px;border:1px solid #e5e7eb;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.controls label{font-size:12px;color:#6b7280;font-weight:500}
.controls select,.controls input{padding:6px 10px;font-size:13px;border:1px solid #d1d5db;border-radius:6px;background:#fff;color:#111827}
.controls button{padding:7px 16px;background:#2563eb;color:#fff;border:0;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
.controls button:hover{background:#1d4ed8}
.controls .status{margin-left:auto;font-size:12px;color:#6b7280}
.section{background:#fff;border:1px solid #e5e7eb;border-radius:12px;margin-bottom:16px;overflow:hidden}
.section-head{padding:14px 20px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;justify-content:space-between;gap:10px}
.section-head h2{margin:0;font-size:15px;font-weight:600;color:#111827;display:flex;align-items:center;gap:8px}
.section-head .sub{font-size:12px;color:#9ca3af;font-weight:400}
.section-body{padding:18px 20px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t thead th{padding:10px 12px;background:#f9fafb;color:#374151;text-align:left;font-weight:600;font-size:12px;border-bottom:1px solid #e5e7eb;white-space:nowrap}
table.t tbody td{padding:9px 12px;border-bottom:1px solid #f3f4f6;color:#374151}
table.t .num{text-align:right;font-variant-numeric:tabular-nums}
table.t .center{text-align:center}
.bar{height:8px;background:#f3f4f6;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:4px}
.bar>div{height:100%;border-radius:4px}
.alert{padding:11px 16px;border-radius:8px;margin-bottom:10px;font-size:13px;display:flex;align-items:center;gap:10px}
.alert.warn{background:#fffbeb;border-left:3px solid #f59e0b;color:#92400e}
.alert.info{background:#eff6ff;border-left:3px solid #3b82f6;color:#1e40af}
.alert.success{background:#ecfdf5;border-left:3px solid #10b981;color:#065f46}
.loading{padding:60px 20px;text-align:center;color:#6b7280;font-size:13px}
.spinner{width:32px;height:32px;border:3px solid #e5e7eb;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.tag{display:inline-block;padding:2px 9px;border-radius:5px;font-size:11px;font-weight:700;color:#fff}
.tag.early{background:#2563eb}
.tag.mid{background:#d97706}
.tag.late{background:#dc2626}
.tag.mixed{background:#6b7280}
</style>
</head>
<body>

<div class="header">
  <h1>📅 アクション牽引</h1>
  <div class="sub">v1.0 ｜ OTA別リードタイム可視化 → アクション期限算出 → 目標達成</div>
</div>

<div class="controls">
  <label>店舗</label>
  <select id="store">
    <option value="spk">❄️ SPK（札幌）</option>
    <option value="nha">🏝 NHA（那覇）</option>
  </select>
  <label>対象月</label>
  <select id="month"></select>
  <label>基準日</label>
  <input type="date" id="asOf">
  <button onclick="run()">▶ 分析</button>
  <span class="status" id="status">起動準備中...</span>
</div>

<div id="content">
  <div class="loading"><div class="spinner"></div>初期化中...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL='https://ckrxttbnawkclshczsia.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);

const STORE_CFG={
  nha:{name:'NHA 那覇',tables:{resv:'nha_reservations'},cols:{end:'end_date',start:'start_date'},reliableFrom:'2026-03-30'},
  spk:{name:'SPK 札幌',tables:{resv:'reservations'},cols:{end:'return_date',start:'lend_date'},reliableFrom:'2026-03-30'}
};

const OTA_LABELS={J:'じゃらん',R:'楽天',S:'skyticket',O:'エアトリ',HP:'HP公式',G:'GoGoOut',RC:'RC',SP:'スタッフ',direct:'直販'};

async function ensureAuth(){
  const{data:s}=await sb.auth.getSession();
  if(!s||!s.session){
    const{error}=await sb.auth.signInWithPassword({email:'member@g-lines.jp',password:'8888'});
    if(error)throw new Error('認証失敗: '+error.message);
  }
}

async function fetchAll(table){
  const rows=[];let from=0;const SZ=1000;
  while(true){
    const{data,error}=await sb.from(table).select('*').range(from,from+SZ-1);
    if(error){console.error('fetch',table,error);break;}
    if(!data||!data.length)break;
    rows.push(...data);
    if(data.length<SZ)break;
    from+=SZ;
  }
  return rows;
}

function normStatus(s){
  const v=(s||'').trim().toLowerCase();
  if(['cancel','cancelled','canceled','キャンセル'].includes(v))return 'cancelled';
  return 'confirmed';
}

function ymd(d){return d.toISOString().slice(0,10);}

function calcLeadTimes(resv,store,asOf){
  const cfg=STORE_CFG[store];
  const buckets={'≥30日':0,'15-29日':0,'8-14日':0,'1-7日':0,'当日':0};
  const byOta={};
  let total=0,sameMonth=0,reliable=0;
  resv.forEach(r=>{
    if(normStatus(r.status)==='cancelled')return;
    const cr=(r.created_at||'').slice(0,10);
    const sd=(r[cfg.cols.start]||'').slice(0,10);
    if(!cr||!sd)return;
    if(cr<cfg.reliableFrom)return; // 一括取込分除外
    reliable++;
    const lt=Math.round((new Date(sd)-new Date(cr))/86400000);
    if(lt<0)return;
    let bucket;
    if(lt===0)bucket='当日';
    else if(lt<=7)bucket='1-7日';
    else if(lt<=14)bucket='8-14日';
    else if(lt<=29)bucket='15-29日';
    else bucket='≥30日';
    buckets[bucket]++;
    total++;
    if(cr.slice(0,7)===sd.slice(0,7))sameMonth++;
    const ota=r.ota||'?';
    if(!byOta[ota])byOta[ota]={total:0,sameMonth:0,buckets:{'≥30日':0,'15-29日':0,'8-14日':0,'1-7日':0,'当日':0},lts:[]};
    byOta[ota].total++;
    if(cr.slice(0,7)===sd.slice(0,7))byOta[ota].sameMonth++;
    byOta[ota].buckets[bucket]++;
    byOta[ota].lts.push(lt);
  });
  return{total,sameMonth,reliable,buckets,byOta};
}

function ota客層判定(otaData){
  const t=otaData.total;
  if(t<5)return{tag:'mixed',label:'データ不足',color:'#6b7280'};
  const direct=(otaData.buckets['1-7日']+otaData.buckets['当日'])/t;
  const mid=otaData.buckets['8-14日']/t;
  const early=(otaData.buckets['15-29日']+otaData.buckets['≥30日'])/t;
  if(direct>=0.5)return{tag:'late',label:'直前型',color:'#dc2626',ratio:direct};
  if(early>=0.5)return{tag:'early',label:'早期型',color:'#2563eb',ratio:early};
  if(mid>=0.35)return{tag:'mid',label:'中期型',color:'#d97706',ratio:mid};
  return{tag:'mixed',label:'混在型',color:'#6b7280',ratio:0};
}

function median(arr){
  if(!arr.length)return 0;
  const s=[...arr].sort((a,b)=>a-b);
  const m=Math.floor(s.length/2);
  return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2);
}

function fmtN(n){return n.toLocaleString();}

async function run(){
  const store=document.getElementById('store').value;
  const month=parseInt(document.getElementById('month').value);
  const asOfStr=document.getElementById('asOf').value;
  const asOf=new Date(asOfStr+'T00:00:00');
  document.getElementById('status').textContent='読込中...';
  document.getElementById('content').innerHTML='<div class="loading"><div class="spinner"></div>データ取得中...</div>';
  try{
    await ensureAuth();
    const cfg=STORE_CFG[store];
    const resv=await fetchAll(cfg.tables.resv);
    const lt=calcLeadTimes(resv,store,asOf);
    let html='';

    // サマリー
    html+=`<div class="section"><div class="section-head"><h2>📊 リードタイム分析サマリー</h2><span class="sub">${cfg.name} / 信頼できる created_at のみ集計 (≥${cfg.reliableFrom})</span></div><div class="section-body">`;
    html+=`<div class="alert info">対象予約: <b>${lt.total}件</b> (信頼可能 ${lt.reliable}件) / 当月予約率 <b>${lt.total>0?(lt.sameMonth/lt.total*100).toFixed(1):0}%</b> (${lt.sameMonth}件)</div>`;
    // 全体分布
    html+=`<table class="t" style="margin-top:8px"><thead><tr><th>リードタイム</th><th class="num">件数</th><th>分布</th><th class="num">割合</th></tr></thead><tbody>`;
    const order=['≥30日','15-29日','8-14日','1-7日','当日'];
    order.forEach(b=>{
      const c=lt.buckets[b]||0;
      const pct=lt.total>0?c/lt.total*100:0;
      html+=`<tr><td>${b}前</td><td class="num">${fmtN(c)}件</td><td><div class="bar" style="width:200px"><div style="width:${pct}%;background:${b==='当日'||b==='1-7日'?'#ef4444':b==='8-14日'?'#f59e0b':'#3b82f6'}"></div></div></td><td class="num">${pct.toFixed(1)}%</td></tr>`;
    });
    html+=`</tbody></table></div></div>`;

    // OTA別
    html+=`<div class="section"><div class="section-head"><h2>🎯 OTA別 客層プロファイル</h2><span class="sub">OTAごとの予約タイミング特性 → 値下げタイミング戦略の根拠</span></div><div class="section-body">`;
    const otaEntries=Object.entries(lt.byOta).sort((a,b)=>b[1].total-a[1].total);
    if(otaEntries.length===0){
      html+=`<div class="alert warn">信頼できるリードタイムデータがありません</div>`;
    }else{
      html+=`<table class="t"><thead><tr><th>OTA</th><th class="num">件数</th><th>客層</th><th class="num">中央値</th><th class="num">当月予約率</th><th>分布 (≥30 / 15-29 / 8-14 / 1-7 / 当日)</th></tr></thead><tbody>`;
      otaEntries.forEach(([ota,d])=>{
        const profile=ota客層判定(d);
        const med=median(d.lts);
        const smRate=d.total>0?(d.sameMonth/d.total*100).toFixed(0):0;
        const otaName=OTA_LABELS[ota]||ota;
        const distHtml=order.map(b=>{
          const c=d.buckets[b]||0;
          const p=d.total>0?c/d.total*100:0;
          const col=b==='当日'||b==='1-7日'?'#ef4444':b==='8-14日'?'#f59e0b':b==='15-29日'?'#0ea5e9':'#3b82f6';
          return `<div class="bar" style="width:42px"><div style="width:${p}%;background:${col}"></div></div>`;
        }).join(' ');
        html+=`<tr><td><b>${otaName}</b> <span style="color:#9ca3af;font-size:10px">(${ota})</span></td>`;
        html+=`<td class="num">${fmtN(d.total)}件</td>`;
        html+=`<td><span class="tag ${profile.tag}">${profile.label}</span>${profile.ratio?` <span style="font-size:10px;color:#6b7280">${(profile.ratio*100).toFixed(0)}%</span>`:''}</td>`;
        html+=`<td class="num">${med}日</td>`;
        html+=`<td class="num">${smRate}%</td>`;
        html+=`<td>${distHtml}</td>`;
        html+=`</tr>`;
      });
      html+=`</tbody></table>`;
      html+=`<div class="alert success" style="margin-top:12px">💡 <b>客層タイプ別の戦略</b>:<br>`;
      html+=`🔵 <b>早期型</b>: 今すぐ値下げ → 機会の山が今・遅いと取り逃す<br>`;
      html+=`🟠 <b>中期型</b>: 出発15日前あたりで価格調整<br>`;
      html+=`🔴 <b>直前型</b>: 段階的値下げで直前まで刈り取り (3% → 7% → 10%)`;
      html+=`</div>`;
    }
    html+=`</div></div>`;

    // 次に作るもの
    html+=`<div class="section"><div class="section-head"><h2>🚧 次に実装するもの (Phase 2-3)</h2></div><div class="section-body">`;
    html+=`<ul style="margin:0;padding-left:20px;line-height:2;color:#374151">`;
    html+=`<li>OTA別「アクション実施期限」自動算出 (出発日 - 客層リードタイム)</li>`;
    html+=`<li>段階的値下げカレンダー生成 (直前型OTA向け)</li>`;
    html+=`<li>「いつまでに何件 → AI判定%が何%上がる」シミュレーション</li>`;
    html+=`<li>TODO 化 + 完了管理 + 実施後効果追跡</li>`;
    html+=`</ul></div></div>`;

    document.getElementById('content').innerHTML=html;
    document.getElementById('status').textContent='完了 '+new Date().toLocaleTimeString();
  }catch(e){
    console.error(e);
    document.getElementById('content').innerHTML=`<div class="alert danger">⚠️ エラー: ${e.message}</div>`;
    document.getElementById('status').textContent='エラー';
  }
}

function init(){
  const ms=document.getElementById('month');
  for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.text=m+'月';ms.appendChild(o);}
  const today=new Date();
  ms.value=today.getMonth()+1;
  document.getElementById('asOf').value=today.toISOString().slice(0,10);
  const u=new URLSearchParams(location.search);
  if(u.get('store'))document.getElementById('store').value=u.get('store');
  if(u.get('month'))ms.value=u.get('month');
  run();
}
init();
</script>
</body>
</html>
