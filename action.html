// 最終局面エスカレーション設計
const ESCALATION_LEVELS={

// 残日数 × AI判定% から エスカレーションレベル判定
function determineEscalation(daysLeft,aiProb){
  if(daysLeft>=14)return ESCALATION_LEVELS.normal;
  if(daysLeft>=7){
    if(aiProb<80)return ESCALATION_LEVELS.standard;
    return ESCALATION_LEVELS.normal;
  }
  if(daysLeft>=3){
    if(aiProb<85)return ESCALATION_LEVELS.aggressive;
    return ESCALATION_LEVELS.normal;
  }
  if(daysLeft>=1){
    if(aiProb<90)return ESCALATION_LEVELS.last;
    return ESCALATION_LEVELS.normal;
  }
  // 最終日 (残0日)
  if(aiProb<95)return ESCALATION_LEVELS.final_dash;
  return ESCALATION_LEVELS.normal;
}

// 簡易AI判定% 計算 (forecast.html ロジックの簡略版)
function calcAIProb(monthData,target,daysLeft,monthDays,velocity){
  if(target<=0)return 100;
  const current=monthData.sub||0;
  // 残期間予測 = 現在 + velocity × 残日数
  const projected=current+velocity*daysLeft;
  const baseProb=Math.min(100,projected/target*100);
  // 信頼度補正 (残日数少ないほど確実度高い)
  const elapsed=Math.max(0,monthDays-daysLeft);
  const confidence=Math.min(1,elapsed/monthDays);
  return Math.min(95,baseProb*(0.7+confidence*0.3));
}

function monthEnd(y,m){return new Date(y,m,0);}
function monthDays(y,m){return monthEnd(y,m).getDate();}

// ==================== 💰 価格 → 順位 → CV率 → 件数 予測モデル ====================

// 順位 → CV率倍率 (基準=1位=1.0, 業界一般値ベース)
const RANK_CV_CURVE={
  1:1.00,2:0.92,3:0.85,4:0.78,5:0.72,
  6:0.62,7:0.55,8:0.48,9:0.42,10:0.37,
  11:0.32,12:0.28,13:0.25,14:0.22,15:0.19,
  16:0.16,17:0.14,18:0.12,19:0.10,20:0.08
};
function rankToCV(rank){
  if(rank>=1&&rank<=20)return RANK_CV_CURVE[rank];
  return Math.max(0.03,0.08*Math.pow(0.9,rank-20));
}

// 価格 → 順位 (市場Top20価格分布から逆引き)
function priceToRank(price,marketPrices){
  if(!marketPrices||!marketPrices.length)return null;
  let rank=1;
  for(const mp of marketPrices){
    if(price<mp)break;
    rank++;
  }
  return Math.min(rank,21);
}

// 価格変更シミュレーション
function simulatePriceChange(currentPrice,newPrice,currentVelocity,marketPrices,daysLeft){
  const curRank=priceToRank(currentPrice,marketPrices)||10;
  const newRank=priceToRank(newPrice,marketPrices)||10;
  const curCV=rankToCV(curRank);
  const newCV=rankToCV(newRank);
  const cvMultiplier=curCV>0?newCV/curCV:1;
  const newVelocity=currentVelocity*cvMultiplier;
  const addCount=Math.round((newVelocity-currentVelocity)*daysLeft);
  const curRev=currentVelocity*daysLeft*currentPrice;
  const newRev=newVelocity*daysLeft*newPrice;
  const revDiff=newRev-curRev;
  return{
    curRank,newRank,curCV,newCV,cvMultiplier,
    curVelocity:currentVelocity,newVelocity,
    addCount,curRev:Math.round(curRev),newRev:Math.round(newRev),
    revDiff:Math.round(revDiff)
  };
}

function runSimulation(){
  const curPrice=parseInt(document.getElementById('sim-cur-price').value);
  const velocity=parseFloat(document.getElementById('sim-velocity').value);
  const daysLeft=parseInt(document.getElementById('sim-days').value);
  const marketRaw=document.getElementById('sim-market').value;
  const store=document.getElementById('store').value;
  localStorage.setItem(`hdm_sim_market_${store}`,marketRaw);
  const marketPrices=marketRaw.trim().split(/[\n,、\s]+/).map(s=>parseInt(s.replace(/[¥,]/g,''))).filter(n=>!isNaN(n)&&n>0).sort((a,b)=>a-b);
  if(marketPrices.length===0){
    document.getElementById('sim-result').innerHTML=`<div class="alert warn">市場価格データを入力してください</div>`;
    return;
  }
  // 5つの価格パターンで比較: 現在 / -5% / -10% / -15% / 最適
  const patterns=[
    {label:'現在価格',price:curPrice},
    {label:'-5%',price:Math.round(curPrice*0.95/100)*100},
    {label:'-10%',price:Math.round(curPrice*0.90/100)*100},
    {label:'-15%',price:Math.round(curPrice*0.85/100)*100},
    {label:'-20%',price:Math.round(curPrice*0.80/100)*100}
  ];
  // 最適価格探索
  let bestPrice=curPrice,bestRev=velocity*daysLeft*curPrice,bestSim=null;
  for(let p=Math.round(curPrice*0.5/100)*100;p<=Math.round(curPrice*1.2/100)*100;p+=100){
    const s=simulatePriceChange(curPrice,p,velocity,marketPrices,daysLeft);
    if(s.newRev>bestRev){bestRev=s.newRev;bestPrice=p;bestSim=s;}
  }
  patterns.push({label:'🎯 最適',price:bestPrice});
  let html=`<table class="t"><thead><tr><th>パターン</th><th class="num">価格</th><th class="num">推定順位</th><th class="num">CV率倍率</th><th class="num">予約ペース</th><th class="num">残${daysLeft}日 件数増</th><th class="num">売上影響</th><th>判定</th></tr></thead><tbody>`;
  patterns.forEach(pt=>{
    const sim=simulatePriceChange(curPrice,pt.price,velocity,marketPrices,daysLeft);
    const verdict=sim.revDiff>0?'🟢 売上↑':sim.revDiff<0?'🔴 売上↓':'⚪ 同等';
    const isOpt=pt.label.includes('最適');
    html+=`<tr ${isOpt?'style="background:#dcfce7;font-weight:700"':''}>`;
    html+=`<td>${pt.label}</td>`;
    html+=`<td class="num">${fmtN(Math.round(pt.price))}</td>`;
    html+=`<td class="num">${sim.newRank}位</td>`;
    html+=`<td class="num" style="color:${sim.cvMultiplier>1?'#059669':sim.cvMultiplier<1?'#dc2626':'#6b7280'}">${(sim.cvMultiplier*100).toFixed(0)}%</td>`;
    html+=`<td class="num">${sim.newVelocity.toFixed(2)}件/日</td>`;
    html+=`<td class="num" style="color:${sim.addCount>0?'#059669':sim.addCount<0?'#dc2626':'#6b7280'}">${sim.addCount>0?'+':''}${sim.addCount}件</td>`;
    html+=`<td class="num" style="color:${sim.revDiff>0?'#059669':sim.revDiff<0?'#dc2626':'#6b7280'}">${sim.revDiff>0?'+':''}¥${fmtN(Math.round(sim.revDiff/1000))}k</td>`;
    html+=`<td>${verdict}</td></tr>`;
  });
  html+=`</tbody></table>`;
  if(bestSim&&bestPrice<curPrice){
    html+=`<div class="alert success" style="margin-top:14px">💡 <b>推奨</b>: 価格を <b>¥${fmtN(curPrice)} → ¥${fmtN(bestPrice)}</b> (${((curPrice-bestPrice)/curPrice*100).toFixed(1)}%↓) に変更すると<br>順位 ${bestSim.curRank} → ${bestSim.newRank}位想定 / 残${daysLeft}日で <b>+${bestSim.addCount}件</b> / 売上 <b>+¥${fmtN(Math.round(bestSim.revDiff/1000))}k</b> 期待</div>`;
  }else if(bestPrice>=curPrice){
    html+=`<div class="alert info" style="margin-top:14px">💡 現在価格が既に最適 (値下げで件数増えても単価減を埋められない)</div>`;
  }
  document.getElementById('sim-result').innerHTML=html;
}

async function fetchAll(table){
  const rows=[];let from=0;const SZ=1000;
  while(true){
    const{data,error}=await sb.from(table).select('*').range(from,from+SZ-1);
    if(error){console.error('fetch',table,error);break;}
    if(!data||!data.length)break;
    rows.push(...data);
    if(data.length<SZ)break;
    from+=SZ;
  }
  return rows;
}

function normStatus(s){
  const v=(s||'').trim().toLowerCase();
  if(['cancel','cancelled','canceled','キャンセル'].includes(v))return 'cancelled';
  return 'confirmed';
}

function ymd(d){return d.toISOString().slice(0,10);}

function calcLeadTimes(resv,store,asOf){
  const cfg=STORE_CFG[store];
  const buckets={'≥30日':0,'15-29日':0,'8-14日':0,'1-7日':0,'当日':0};
  const byOta={};
  let total=0,sameMonth=0,reliable=0;
  resv.forEach(r=>{
    if(normStatus(r.status)==='cancelled')return;
    const cr=(r.created_at||'').slice(0,10);
    const sd=(r[cfg.cols.start]||'').slice(0,10);
    if(!cr||!sd)return;
    if(cr<cfg.reliableFrom)return; // 一括取込分除外
    reliable++;
    const lt=Math.round((new Date(sd)-new Date(cr))/86400000);
    if(lt<0)return;
    let bucket;
    if(lt===0)bucket='当日';
    else if(lt<=7)bucket='1-7日';
    else if(lt<=14)bucket='8-14日';
    else if(lt<=29)bucket='15-29日';
    else bucket='≥30日';
    buckets[bucket]++;
    total++;
    if(cr.slice(0,7)===sd.slice(0,7))sameMonth++;
    const ota=r.ota||'?';
    if(!byOta[ota])byOta[ota]={total:0,sameMonth:0,buckets:{'≥30日':0,'15-29日':0,'8-14日':0,'1-7日':0,'当日':0},lts:[]};
    byOta[ota].total++;
    if(cr.slice(0,7)===sd.slice(0,7))byOta[ota].sameMonth++;
    byOta[ota].buckets[bucket]++;
    byOta[ota].lts.push(lt);
  });
  return{total,sameMonth,reliable,buckets,byOta};
}

function ota客層判定(otaData){
  const t=otaData.total;
  if(t<5)return{tag:'mixed',label:'データ不足',color:'#6b7280'};
  const direct=(otaData.buckets['1-7日']+otaData.buckets['当日'])/t;
  const mid=otaData.buckets['8-14日']/t;
  const early=(otaData.buckets['15-29日']+otaData.buckets['≥30日'])/t;
  if(direct>=0.5)return{tag:'late',label:'直前型',color:'#dc2626',ratio:direct};
  if(early>=0.5)return{tag:'early',label:'早期型',color:'#2563eb',ratio:early};
  if(mid>=0.35)return{tag:'mid',label:'中期型',color:'#d97706',ratio:mid};
  return{tag:'mixed',label:'混在型',color:'#6b7280',ratio:0};
}

function median(arr){
  if(!arr.length)return 0;
  const s=[...arr].sort((a,b)=>a-b);
  const m=Math.floor(s.length/2);
  return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2);
}

function fmtN(n){return n.toLocaleString();}

async function run(){
  const store=document.getElementById('store').value;
  const month=parseInt(document.getElementById('month').value);
  const asOfStr=document.getElementById('asOf').value;
  const asOf=new Date(asOfStr+'T00:00:00');
  document.getElementById('status').textContent='読込中...';
  document.getElementById('content').innerHTML='<div class="loading"><div class="spinner"></div>データ取得中...</div>';
  try{
    await ensureAuth();
    const cfg=STORE_CFG[store];
    const resv=await fetchAll(cfg.tables.resv);
    const lt=calcLeadTimes(resv,store,asOf);
    let html='';

    // ==================== 🚨 最終局面アラート (Phase 2A) ====================
    // 月別集計
    const byM={};
    resv.forEach(r=>{
      if(normStatus(r.status)==='cancelled')return;
      const ed=(r[cfg.cols.end]||'').slice(0,10);
      if(!ed)return;
      const ym=ed.slice(0,7);
      if(!byM[ym])byM[ym]={cnt:0,sub:0};
      byM[ym].cnt++;
      const bp=+(r.base_price||0),op=+(r.option_price||0),dc=+(r.discount||0);
      const sub=(bp===0&&op===0)?+(r.price||0):(bp+op-dc);
      byM[ym].sub+=sub;
    });
    // 各月の直近30日 velocity (信頼できるcreated_atから)
    const cutoff=new Date(asOf.getTime()-30*86400000);
    const cutoffStr=cutoff.toISOString().slice(0,10);
    const velByM={};
    resv.forEach(r=>{
      if(normStatus(r.status)==='cancelled')return;
      const cr=(r.created_at||'').slice(0,10);
      if(!cr||cr<cfg.reliableFrom||cr<cutoffStr)return;
      const ed=(r[cfg.cols.end]||'').slice(0,10);
      if(!ed)return;
      const ym=ed.slice(0,7);
      if(!velByM[ym])velByM[ym]={cnt:0,sub:0};
      velByM[ym].cnt++;
      const bp=+(r.base_price||0),op=+(r.option_price||0),dc=+(r.discount||0);
      velByM[ym].sub+=(bp===0&&op===0)?+(r.price||0):(bp+op-dc);
    });

    // 当月+翌月 で判定
    const alertMonths=[];
    for(let off=0;off<2;off++){
      let y=asOf.getFullYear(),mm=asOf.getMonth()+1+off;
      while(mm>12){mm-=12;y++;}
      const ym=`${y}-${String(mm).padStart(2,'0')}`;
      const target=TARGETS[store]?.[mm]||0;
      const rank=RANKS[store]?.[mm]||'B';
      const mEnd=monthEnd(y,mm);
      const mDays=monthDays(y,mm);
      const daysLeft=Math.max(0,Math.round((mEnd-asOf)/86400000));
      const monthData=byM[ym]||{cnt:0,sub:0};
      const vel=(velByM[ym]?.sub||0)/30; // 直近30日の日次velocity
      const aiProb=calcAIProb(monthData,target,daysLeft,mDays,vel);
      const esc=determineEscalation(daysLeft,aiProb);
      alertMonths.push({y,m:mm,ym,target,rank,daysLeft,monthData,vel,aiProb,esc});
    }

    // アラート描画
    const activeAlerts=alertMonths.filter(a=>a.esc.label!=='通常期');
    html+=`<div class="section" style="border-color:${activeAlerts.length>0?'#dc2626':'#22c55e'}">`;
    html+=`<div class="section-head" style="background:${activeAlerts.length>0?'linear-gradient(135deg,#fef2f2,#fee2e2)':'linear-gradient(135deg,#ecfdf5,#d1fae5)'}">`;
    html+=`<h2 style="color:${activeAlerts.length>0?'#991b1b':'#065f46'}">${activeAlerts.length>0?'🚨':'✅'} 最終局面アラート</h2>`;
    html+=`<span class="sub">残日数 × AI判定% で自動エスカレーション判定 (4段階)</span>`;
    html+=`</div><div class="section-body">`;

    alertMonths.forEach(a=>{
      const esc=a.esc;
      const isActive=esc.label!=='通常期';
      html+=`<div style="margin-bottom:14px;padding:14px 18px;background:${esc.bgColor};border:2px solid ${esc.borderColor};border-radius:10px">`;
      html+=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">`;
      html+=`<div style="font-size:24px">${esc.icon}</div>`;
      html+=`<div style="font-size:17px;font-weight:800;color:${esc.color}">${a.m}月 ${esc.label}</div>`;
      html+=`<span class="tag ${a.rank==='AA'||a.rank==='A'?'late':a.rank==='B'?'mid':'early'}">${a.rank}</span>`;
      html+=`<span style="font-size:11px;color:#6b7280">残${a.daysLeft}日 / AI判定 ${a.aiProb.toFixed(0)}%</span>`;
      html+=`</div>`;
      if(isActive){
        html+=`<div style="font-size:13px;line-height:1.8;color:${esc.color}">`;
        html+=`<b>推奨アクション:</b> ${esc.action}<br>`;
        if(esc.discount)html+=`<b>値下げ目安:</b> ${esc.discount}<br>`;
        html+=`<b>現状:</b> ${fmtN(a.monthData.cnt)}件 ¥${fmtN(Math.round(a.monthData.sub/10000))}万 / 目標 ¥${fmtN(Math.round(a.target/10000))}万<br>`;
        html+=`<b>直近30日ペース:</b> ¥${fmtN(Math.round(a.vel*30/10000))}万/月 → 残期間予測 +¥${fmtN(Math.round(a.vel*a.daysLeft/10000))}万`;
        html+=`</div>`;
      }else{
        html+=`<div style="font-size:13px;color:${esc.color}">順調・通常価格で OK・特別アクション不要</div>`;
      }
      html+=`</div>`;
    });

    // エスカレーション設計表
    html+=`<details style="margin-top:14px"><summary>📋 エスカレーション設計表 (どの状態で何を発動するか)</summary><div style="padding:12px">`;
    html+=`<table class="t" style="margin:0"><thead><tr><th>残日数</th><th>AI判定%</th><th>レベル</th><th>推奨アクション</th><th>値下げ目安</th></tr></thead><tbody>`;
    html+=`<tr><td>14日以上</td><td>-</td><td>🟢 通常期</td><td>通常価格 (競合5位×95%)</td><td>-</td></tr>`;
    html+=`<tr><td>7-13日</td><td>&lt;80%</td><td>🟡 標準値下げ</td><td>競合5位×90%</td><td>-3〜5%</td></tr>`;
    html+=`<tr><td>3-6日</td><td>&lt;85%</td><td>🟠 直前値下げ</td><td>競合5位×80%</td><td>-7〜10%</td></tr>`;
    html+=`<tr><td>1-2日</td><td>&lt;90%</td><td>🔴 ラスト値下げ</td><td>競合3位水準</td><td>-12〜15%</td></tr>`;
    html+=`<tr><td>最終日</td><td>&lt;95%</td><td>🚨 最終ラッシュ</td><td>競合1位水準 (絶対取り切る)</td><td>-15〜20%</td></tr>`;
    html+=`</tbody></table>`;
    html+=`<div style="margin-top:10px;font-size:11px;color:#6b7280;line-height:1.7">💡 <b>哲学:</b> 「最後まで営業活動をやめない」= 機会損失ゼロ・単価少々下げてでも件数で勝負・直前客 (価格弾力性高い層) の市場ニーズと一致</div>`;
    html+=`</div></details>`;

    html+=`</div></div>`;

    // ==================== 💰 価格戦略シミュレーション (Phase 2B) ====================
    // 価格 → 順位 → CV率 → 件数増 → 売上影響 → AI判定 の予測
    html+=`<div class="section"><div class="section-head"><h2>💰 価格戦略シミュレーション</h2><span class="sub">価格変更の効果を「順位 / CV率 / 件数 / 売上」で予測</span></div><div class="section-body">`;
    html+=`<div class="alert info">価格を下げた時の効果を予測します:<br><b>価格 → 順位 → CV率(コンバージョン率) → 件数増 → 売上影響 → AI判定%</b></div>`;
    html+=`<div id="sim-controls" style="background:#f9fafb;padding:14px;border-radius:8px;margin-top:10px">`;
    html+=`<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:end">`;
    html+=`<div><label style="font-size:11px;color:#6b7280;font-weight:600;display:block;margin-bottom:4px">自社現在価格</label><input type="number" id="sim-cur-price" step="100" value="11000" style="padding:6px 10px;font-size:13px;border:1px solid #d1d5db;border-radius:6px;width:120px"></div>`;
    html+=`<div><label style="font-size:11px;color:#6b7280;font-weight:600;display:block;margin-bottom:4px">予約velocity (件/日)</label><input type="number" id="sim-velocity" step="0.1" value="0.5" style="padding:6px 10px;font-size:13px;border:1px solid #d1d5db;border-radius:6px;width:100px"></div>`;
    html+=`<div><label style="font-size:11px;color:#6b7280;font-weight:600;display:block;margin-bottom:4px">残日数</label><input type="number" id="sim-days" step="1" value="10" style="padding:6px 10px;font-size:13px;border:1px solid #d1d5db;border-radius:6px;width:80px"></div>`;
    html+=`<button onclick="runSimulation()" style="padding:7px 16px;background:#16a34a;color:#fff;border:0;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600">▶ シミュレート</button>`;
    html+=`</div>`;
    html+=`<div style="margin-top:14px"><label style="font-size:11px;color:#6b7280;font-weight:600;display:block;margin-bottom:4px">市場 Top20 価格 (改行 or カンマ区切り)</label>`;
    const savedMarket=localStorage.getItem(`hdm_sim_market_${store}`)||'';
    html+=`<textarea id="sim-market" rows="3" style="width:100%;padding:8px;font-family:monospace;font-size:12px;border:1px solid #d1d5db;border-radius:6px" placeholder="例: 8500\\n9200\\n9800\\n10500\\n11000\\n11500\\n12200\\n...">${savedMarket}</textarea>`;
    html+=`<div style="font-size:11px;color:#9ca3af;margin-top:4px">⚠️ 現在は手動入力 (Phase 2B.2 で OTA Price Fetcher 自動連動予定)</div></div>`;
    html+=`</div>`;
    html+=`<div id="sim-result" style="margin-top:14px"></div>`;
    html+=`</div></div>`;

    // ==================== リードタイム分析 (既存) ====================
    // サマリー
    html+=`<div class="section"><div class="section-head"><h2>📊 リードタイム分析サマリー</h2><span class="sub">${cfg.name} / 信頼できる created_at のみ集計 (≥${cfg.reliableFrom})</span></div><div class="section-body">`;
    html+=`<div class="alert info">対象予約: <b>${lt.total}件</b> (信頼可能 ${lt.reliable}件) / 当月予約率 <b>${lt.total>0?(lt.sameMonth/lt.total*100).toFixed(1):0}%</b> (${lt.sameMonth}件)</div>`;
    // 全体分布
    html+=`<table class="t" style="margin-top:8px"><thead><tr><th>リードタイム</th><th class="num">件数</th><th>分布</th><th class="num">割合</th></tr></thead><tbody>`;
    const order=['≥30日','15-29日','8-14日','1-7日','当日'];
    order.forEach(b=>{
      const c=lt.buckets[b]||0;
      const pct=lt.total>0?c/lt.total*100:0;
      html+=`<tr><td>${b}前</td><td class="num">${fmtN(c)}件</td><td><div class="bar" style="width:200px"><div style="width:${pct}%;background:${b==='当日'||b==='1-7日'?'#ef4444':b==='8-14日'?'#f59e0b':'#3b82f6'}"></div></div></td><td class="num">${pct.toFixed(1)}%</td></tr>`;
    });
    html+=`</tbody></table></div></div>`;

    // OTA別
    html+=`<div class="section"><div class="section-head"><h2>🎯 OTA別 客層プロファイル</h2><span class="sub">OTAごとの予約タイミング特性 → 値下げタイミング戦略の根拠</span></div><div class="section-body">`;
    const otaEntries=Object.entries(lt.byOta).sort((a,b)=>b[1].total-a[1].total);
    if(otaEntries.length===0){
      html+=`<div class="alert warn">信頼できるリードタイムデータがありません</div>`;
    }else{
      html+=`<table class="t"><thead><tr><th>OTA</th><th class="num">件数</th><th>客層</th><th class="num">中央値</th><th class="num">当月予約率</th><th>分布 (≥30 / 15-29 / 8-14 / 1-7 / 当日)</th></tr></thead><tbody>`;
      otaEntries.forEach(([ota,d])=>{
        const profile=ota客層判定(d);
        const med=median(d.lts);
        const smRate=d.total>0?(d.sameMonth/d.total*100).toFixed(0):0;
        const otaName=OTA_LABELS[ota]||ota;
        const distHtml=order.map(b=>{
          const c=d.buckets[b]||0;
          const p=d.total>0?c/d.total*100:0;
          const col=b==='当日'||b==='1-7日'?'#ef4444':b==='8-14日'?'#f59e0b':b==='15-29日'?'#0ea5e9':'#3b82f6';
          return `<div class="bar" style="width:42px"><div style="width:${p}%;background:${col}"></div></div>`;
        }).join(' ');
        html+=`<tr><td><b>${otaName}</b> <span style="color:#9ca3af;font-size:10px">(${ota})</span></td>`;
        html+=`<td class="num">${fmtN(d.total)}件</td>`;
        html+=`<td><span class="tag ${profile.tag}">${profile.label}</span>${profile.ratio?` <span style="font-size:10px;color:#6b7280">${(profile.ratio*100).toFixed(0)}%</span>`:''}</td>`;
        html+=`<td class="num">${med}日</td>`;
        html+=`<td class="num">${smRate}%</td>`;
        html+=`<td>${distHtml}</td>`;
        html+=`</tr>`;
      });
      html+=`</tbody></table>`;
      html+=`<div class="alert success" style="margin-top:12px">💡 <b>客層タイプ別の戦略</b>:<br>`;
      html+=`🔵 <b>早期型</b>: 今すぐ値下げ → 機会の山が今・遅いと取り逃す<br>`;
      html+=`🟠 <b>中期型</b>: 出発15日前あたりで価格調整<br>`;
      html+=`🔴 <b>直前型</b>: 段階的値下げで直前まで刈り取り (3% → 7% → 10%)`;
      html+=`</div>`;
    }
    html+=`</div></div>`;

    // 次に作るもの
    html+=`<div class="section"><div class="section-head"><h2>🚧 次に実装するもの (Phase 2-3)</h2></div><div class="section-body">`;
    html+=`<ul style="margin:0;padding-left:20px;line-height:2;color:#374151">`;
    html+=`<li>OTA別「アクション実施期限」自動算出 (出発日 - 客層リードタイム)</li>`;
    html+=`<li>段階的値下げカレンダー生成 (直前型OTA向け)</li>`;
    html+=`<li>「いつまでに何件 → AI判定%が何%上がる」シミュレーション</li>`;
    html+=`<li>TODO 化 + 完了管理 + 実施後効果追跡</li>`;
    html+=`</ul></div></div>`;

    document.getElementById('content').innerHTML=html;
    document.getElementById('status').textContent='完了 '+new Date().toLocaleTimeString();
  }catch(e){
    console.error(e);
    document.getElementById('content').innerHTML=`<div class="alert danger">⚠️ エラー: ${e.message}</div>`;
    document.getElementById('status').textContent='エラー';
  }
}

function init(){
  const ms=document.getElementById('month');
  for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.text=m+'月';ms.appendChild(o);}
  const today=new Date();
  ms.value=today.getMonth()+1;
  document.getElementById('asOf').value=today.toISOString().slice(0,10);
  const u=new URLSearchParams(location.search);
  if(u.get('store'))document.getElementById('store').value=u.get('store');
  if(u.get('month'))ms.value=u.get('month');
  run();
}
init();
</script>
</body>
</html>
