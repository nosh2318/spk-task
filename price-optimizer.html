function pclass(p){return {'最安以下':'p-cheapest','最安〜5位':'p-comp','5位〜10位':'p-mid','10位超':'p-high'}[p]||''}
function renderInsight(){const c=sel.value;let h='';for(const t of['A','B','C']){const d=DATA[c+'|'+t];if(!d)continue;const mx=Math.max(...d.levels.map(L=>L.cnt),1);
 let rows=d.levels.map(L=>`<tr><td class="l">${yen(L.price)}</td><td>${L.cnt}本 <span class="bar2" style="width:${Math.round(L.cnt/mx*70)}px"></span></td><td class="${pclass(L.pos)}">${L.pos}</td><td class="l ${pclass(L.pos)}">${L.reason}</td></tr>`).join('');
 h+=`<div class="card"><h2>${c} / ${d.tname} <span style="font-size:12px;color:#888">計${d.total}本</span></h2><div class="sub">市場(5OTA中央値)：最安 ${yen(d.market.min)} ／ 5位 ${yen(d.market.p5)} ／ 10位 ${yen(d.market.p10)}</div>${utilHTML(d.util)}<table><thead><tr><th class="l">自社 日帰り価格</th><th>本数</th><th>市場位置</th><th class="l">理由</th></tr></thead><tbody>${rows}</tbody></table>${d.verdict?`<div class="ins ${vclass(d.verdict)}">${d.verdict}</div>`:''}</div>`;}
 return h||'<div class="card">データなし</div>';}
function renderWhatif(){const c=sel.value;const d=DATA[c+'|A']||DATA[c+'|B']||Object.values(DATA).find(x=>x.cls==c);if(!d)return'<div class="card">データなし</div>';
 const base=d.levels.reduce((a,b)=>b.cnt>(a?.cnt||0)?b:a,null);const m=d.market;
 return `<div class="card"><h2>🧪 what-if（${c} / ${d.tname}）</h2><div class="sub">価格を動かすと市場位置→本数が動く＝やる前に試算（簡易）。</div>
 <div class="wif"><div class="col"><label>日帰り価格：<b id="wv">${yen(base?base.price:m.min)}</b></label><input type="range" id="wf" min="${(m.min||2000)*0.6|0}" max="${(m.p10||8000)*1.3|0}" step="100" value="${base?base.price:m.min}" oninput="wif('${c}','${d.tier}')"></div></div>
 <div class="kpi"><div><div class="n" id="wpos">—</div><div class="l">市場位置</div></div><div><div class="n" id="wcnt">—</div><div class="l">想定本数/月</div></div><div><div class="n" id="wrev">—</div><div class="l">想定売上</div></div></div>
 <div class="muted">市場：最安${yen(m.min)}／5位${yen(m.p5)}／10位${yen(m.p10)}</div></div>`;}
function wif(c,t){const d=DATA[c+'|'+t];const m=d.market;const p=+document.getElementById('wf').value;document.getElementById('wv').textContent=yen(p);let pos,base;const tot=d.total;
 if(m.min&&p<=m.min){pos='最安以下';base=tot*1.1}else if(m.p5&&p<=m.p5){pos='最安〜5位';base=tot*0.95}else if(m.p10&&p<=m.p10){pos='5位〜10位';base=tot*0.6}else{pos='10位超';base=tot*0.35}
 const perMo=Math.max(1,Math.round(base/3));document.getElementById('wpos').textContent=pos;document.getElementById('wcnt').textContent=perMo+'本';document.getElementById('wrev').textContent=yen(perMo*p);}
function renderPace(){const c=sel.value;const list=ALERTS.filter(a=>a.cls==c);const beh=list.filter(a=>a.st=='遅れ').length,hot=list.filter(a=>a.st=='過熱').length;
 let rows=list.map(a=>`<tr><td class="l">${a.mlabel} ${a.tname}</td><td>残${a.dleft}日</td><td>${a.util}%</td><td>${a.expL}%</td><td class="${a.st=='遅れ'?'p-high':''}" style="font-weight:800">${a.pace}% ${a.st}</td></tr>`).join('');
 return `<div class="card"><h2>📈 ペース監視（${c}）</h2><div class="sub">先行予約(稼働=途中)を2025同月の期待着地に対し何%進んでいるか。遅れ${beh}件・過熱${hot}件。</div><table><thead><tr><th class="l">枠</th><th>残日数</th><th>稼働(途中)</th><th>期待着地</th><th>ペース</th></tr></thead><tbody>${rows}</tbody></table><div class="muted">本番はリードタイム別カーブで精緻化。現状は2025同月着地を簡易ベンチ。</div></div>`;}
function render(){const r={cal:renderCal,insight:renderInsight,whatif:renderWhatif,pace:renderPace}[TAB];document.getElementById('body').innerHTML=r();
 if(TAB=='whatif'){const c=sel.value;const d=DATA[c+'|A']||Object.values(DATA).find(x=>x.cls==c);if(d)wif(c,d.tier);}}
render();
</script></body></html>
