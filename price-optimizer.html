 if(day&&day[cls]!=null&&Number.isFinite(+day[cls]))return +day[cls];

 const monthly=seg.monthlyTierClassPrices||state.monthlyTierClassPrices||{};
 const mv=monthly[ym]?.[tier]?.[cls]??monthly[`${y}-${m}`]?.[tier]?.[cls];
 if(mv!=null&&Number.isFinite(+mv))return +mv;
 const tv=(seg.tierClassPrices||state.tierClassPrices||{})[tier]?.[cls];
 if(tv!=null&&Number.isFinite(+tv))return +tv;
 const base=(seg.basePrices||state.basePrices||{})[cls];

 if(base!=null&&Number.isFinite(+base))return Math.round(+base*(coef==null?1:+coef));

async function sbRows(table,select){
 const rows=[];let from=0;const size=1000;
 while(true){
  let q=sbClient.from(table).select(select).range(from,from+size-1);
  if(table.includes('monthly_kpi'))q=q.order('year_month',{ascending:true}).order('vehicle_code',{ascending:true});
  else if(table.includes('vehicles'))q=q.order('code',{ascending:true});
  else if(table.includes('fleet'))q=q.order('reservation_id',{ascending:true});
  else q=q.order('id',{ascending:true});
  const{data,error}=await q;if(error)throw new Error(`${table}: ${error.message}`);
  if(!data||!data.length)break;rows.push(...data);if(data.length<size)break;from+=size;
 }
 return rows;
}

  h+=`<div class="mcal"><h3>${C.mn}月</h3>${g}</div>`;
 }
 h+=`</div><div class="muted">※未来日＝先行予約での途中値（空きは今後の予約で減る）。お盆は2025年実績で最終稼働64%まで埋まりうる＝現状の空き多は「まだ伸びしろ」。空き＝あと何台売れるか。</div></div>`;
 return h;
}
function openDay(ds){
 const T=DAYTOT[ds]||{};const PC=DAYCLS[ds]||{};const [y,m,d]=ds.split('-').map(Number);
 let tier='A';for(const c in UNI){if(UNI[c]&&UNI[c][ds]){tier=UNI[c][ds].t;break;}}
 const dow=['日','月','火','水','木','金','土'][new Date(y,m-1,d).getDay()];
 let rows='';
 for(const c of owned){const p=PC[c];if(!p)continue;const u2=p.fleet?Math.round(p.out/p.fleet*100):null;
  const ux=(UNI[c]||{})[ds]||{};const[ra,rc]=rec(u2,ux.pos);
  const avc=p.avail==0?'av-full':(p.avail>=p.fleet*0.6?'av-lots':'av-some');
  rows+=`<tr><td class="l"><b>${c}</b></td><td>${p.fleet}</td><td>${p.out}</td><td>${p.maint||0}</td><td>${p.next||0}</td><td class="${avc}">${p.avail}</td><td>${ux.p?yen(ux.p):'—'}</td><td class="${pclass(ux.pos)}">${ux.pos||'—'}</td><td><span class="act ${rc}">${ra}</span></td></tr>`;
 }
 const extra=(T.a2||T.b2)?`<tr><td class="l" style="color:#7c3aed">預かりA2/B2</td><td>—</td><td>${(T.a2||0)+(T.b2||0)}</td><td>—</td><td>—</td><td colspan=4 class="l" style="color:#94a3b8">協力会社車（保有外）</td></tr>`:'';
 const u=T.u;const ok=u!=null&&u>=50;
 document.getElementById('sheet').innerHTML=`<span class="x" onclick="closeM()">✕</span>
  <h3>📅 ${m}/${d}(${dow}) <span style="font-size:12px;color:#7c3aed">${TN[tier]}</span></h3>
  <div style="font-size:11px;color:#94a3b8">残${Math.round((new Date(y,m-1,d)-new Date(2026,5,28))/86400000)}日・先行予約での途中値</div>
  <div class="gauge"><div class="gfill ${ok?'ok':'ng'}" style="width:${Math.min(u||0,100)}%"></div><div class="gline"></div></div>
  <div class="daykpi"><div><div class="n av-lots">${T.avail??'—'}<small style="font-size:11px;color:#94a3b8">/${T.fleet??'—'}</small></div><div class="l">空き台数</div></div>
   <div><div class="n">${T.out??'—'}台</div><div class="l">貸出中</div></div>
   <div><div class="n">${T.maint??0}台</div><div class="l">メンテ中</div></div>
   <div><div class="n">${T.next??0}台</div><div class="l">翌日予約</div></div>
   <div><div class="n" style="color:${ok?'#15803d':'#d97706'}">${u??'—'}%</div><div class="l">稼働率(目標50%)</div></div>
   <div><div class="n">${man(T.rev)}</div><div class="l">想定売上(日割)</div></div></div>
  <table><thead><tr><th class="l">クラス</th><th>稼働対象</th><th>貸出中</th><th>メンテ中</th><th>翌日予約</th><th>空き</th><th>現価格</th><th>市場位置</th><th>先手</th></tr></thead><tbody>${rows}${extra}</tbody></table>
  <div class="muted">空き＝該当月の稼働対象車両−貸出中−メンテ中−翌日貸出開始車両（返却日除外）。同じ車両は二重控除しません。市場位置＝那覇価格マスターの現価格 vs 5OTA。先手＝稼働(50%)×市場位置。価格/市場は日帰り基準。${PRICE_MASTER_STATUS==='loaded'?'価格マスター連携済み。':'⚠️ この端末で那覇価格マスターを一度開いてください。'}</div>`;
 document.getElementById('sheet').style.display='block';document.getElementById('scrim').classList.add('on');
}
function closeM(e){if(e&&e.target!==document.getElementById('scrim'))return;document.getElementById('sheet').style.display='none';document.getElementById('scrim').classList.remove('on');}
function utilHTML(U){if(!U||U.rep==null)return'<div class="ins v-na">稼働率データなし</div>';const rep=U.rep,ok=rep>=50;const chips=(U.rows||[]).map(r=>`<span class="mchip ${r.st==='途中'?'fut':''}">${r.m.slice(5)}月 ${r.util}%${r.st==='途中'?'途':''}</span>`).join('');
 return `<div style="margin:6px 0;font-size:12px"><b>稼働率(成績表・目標50%)：<span style="color:${ok?'#15803d':'#d97706'}">${rep}%</span></b> <span style="color:#888">(${U.status}月基準)</span><div class="gauge"><div class="gfill ${ok?'ok':'ng'}" style="width:${Math.min(rep,100)}%"></div><div class="gline"></div></div>${chips}</div>`;}
function vclass(v){if(v.startsWith('⬆'))return'v-up';if(v.startsWith('⬇'))return'v-down';if(v.startsWith('🎯'))return'v-traffic';if(v.startsWith('✅'))return'v-keep';return'v-na'}
function renderInsight(){let h='<div class="card"><div class="sub">空き台数カレンダーの根拠：クラス×シーズンの「いくらで何本×市場位置×稼働率」。</div></div>';
 for(const c of owned)for(const t of['A','B','C']){const d=DATA[c+'|'+t];if(!d)continue;const mx=Math.max(...d.levels.map(L=>L.cnt),1);
  let rows=d.levels.map(L=>`<tr><td class="l">${yen(L.price)}</td><td>${L.cnt}本 <span class="bar2" style="width:${Math.round(L.cnt/mx*70)}px"></span></td><td class="${pclass(L.pos)}">${L.pos}</td><td class="l ${pclass(L.pos)}">${L.reason}</td></tr>`).join('');
  h+=`<div class="card"><h2>${c} / ${d.tname} <span style="font-size:12px;color:#888">計${d.total}本</span></h2><div class="sub">市場：最安 ${yen(d.market.min)} ／ 5位 ${yen(d.market.p5)} ／ 10位 ${yen(d.market.p10)}</div>${utilHTML(d.util)}<table><thead><tr><th class="l">自社 日帰り価格</th><th>本数</th><th>市場位置</th><th class="l">理由</th></tr></thead><tbody>${rows}</tbody></table>${d.verdict?`<div class="ins ${vclass(d.verdict)}">${d.verdict}</div>`:''}</div>`;}
 return h;}
function render(){const r={cal:renderCal,insight:renderInsight}[TAB];document.getElementById('body').innerHTML=r();}
render();loadMonthlyFleet();
</script></body></html>
