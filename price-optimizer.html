   const ds=`${mo}-${String(d).padStart(2,'0')}`;const T=DTOT[ds];const u=T?T.u:null;const tier=dayTier[d];
   g+=`<div class="cell ${uCls(u)}${tier=='C'?' obon':''}" onclick="openDay('${ds}')">${d}<small>${T?T.bk+'台':''}</small>${tier=='C'?'<span class="ob">盆</span>':''}</div>`;
  }
  g+='</div>';
  h+=`<div class="mcal"><h3>${C.mn}月</h3>${g}</div>`;
 }
 h+=`</div><div class="muted">※未来日＝先行予約での途中値（直前で上昇）。お盆は2025年実績64%まで伸びうる。タップで日別の合体ビュー。</div></div>`;
 return h;
}
function openDay(ds){
 const T=DTOT[ds]||{};const [y,m,d]=ds.split('-').map(Number);
 // tier of this day (from any class unified)
 let tier='A';for(const c in UNI){if(UNI[c][ds]){tier=UNI[c][ds].t;break;}}
 const dow=['日','月','火','水','木','金','土'][new Date(y,m-1,d).getDay()];
 let rows='';
 for(const c of order){const x=(UNI[c]||{})[ds];if(!x)continue;if(x.bk==0&&x.p==null)continue;
  const[ra,rc]=rec(x.u,x.pos,x.dl);
  rows+=`<tr><td class="l"><b>${c}</b></td><td>${x.bk}/${x.cap??'—'}台</td><td>${x.u??'—'}%</td><td>${x.p?yen(x.p):'—'}</td><td class="${pclass(x.pos)}">${x.pos}</td><td><span class="act ${rc}">${ra}</span></td></tr>`;
 }
 const u=T.u;const ok=u!=null&&u>=50;
 document.getElementById('sheet').innerHTML=`<span class="x" onclick="closeM()">✕</span>
  <h3>📅 ${m}/${d}(${dow}) <span style="font-size:12px;color:#7c3aed">${TN[tier]}</span></h3>
  <div style="font-size:11px;color:#94a3b8">残${Math.round((new Date(y,m-1,d)-new Date(2026,5,28))/86400000)}日・先行予約での途中値</div>
  <div class="gauge"><div class="gfill ${ok?'ok':'ng'}" style="width:${Math.min(u||0,100)}%"></div><div class="gline"></div></div>
  <div class="daykpi"><div><div class="n" style="color:${ok?'#16a34a':'#d97706'}">${u??'—'}%</div><div class="l">稼働率(目標50%)</div></div>
   <div><div class="n">${T.bk??'—'}<span style="font-size:11px">/${T.cap??'—'}台</span></div><div class="l">稼働台数(全クラス)</div></div>
   <div><div class="n">${man(T.rev)}</div><div class="l">想定売上(日割)</div></div></div>
  <table><thead><tr><th class="l">クラス</th><th>本/台</th><th>稼働</th><th>現価格</th><th>市場位置</th><th>先手</th></tr></thead><tbody>${rows||'<tr><td colspan=6 class="l" style="color:#94a3b8">この日の予約なし</td></tr>'}</tbody></table>
  <div class="muted">市場位置＝現価格 vs 5OTA(最安/5位/10位)。先手＝稼働(50%)×市場位置の推奨。日帰り基準。</div>`;
 document.getElementById('sheet').style.display='block';document.getElementById('scrim').classList.add('on');
}
function closeM(e){if(e&&e.target.id!=='scrim'&&e.type==='click'&&e.target!==document.getElementById('scrim'))return;document.getElementById('sheet').style.display='none';document.getElementById('scrim').classList.remove('on');}
function utilHTML(U){if(!U||U.rep==null)return'<div class="ins v-na">稼働率データなし</div>';const rep=U.rep,ok=rep>=50;const chips=(U.rows||[]).map(r=>`<span class="mchip ${r.st==='途中'?'fut':''}">${r.m.slice(5)}月 ${r.util}%${r.st==='途中'?'途':''}</span>`).join('');
 return `<div style="margin:6px 0;font-size:12px"><b>稼働率(成績表・目標50%)：<span style="color:${ok?'#16a34a':'#d97706'}">${rep}%</span></b> <span style="color:#888">(${U.status}月基準)</span><div class="gauge"><div class="gfill ${ok?'ok':'ng'}" style="width:${Math.min(rep,100)}%"></div><div class="gline"></div></div>${chips}</div>`;}
function vclass(v){if(v.startsWith('⬆'))return'v-up';if(v.startsWith('⬇'))return'v-down';if(v.startsWith('🎯'))return'v-traffic';if(v.startsWith('✅'))return'v-keep';return'v-na'}
function renderInsight(){let h='<div class="card"><div class="sub">日別カレンダーの根拠：クラス×シーズンの「いくらで何本×市場位置×稼働率」。</div></div>';
 for(const c of order)for(const t of['A','B','C']){const d=DATA[c+'|'+t];if(!d)continue;const mx=Math.max(...d.levels.map(L=>L.cnt),1);
  let rows=d.levels.map(L=>`<tr><td class="l">${yen(L.price)}</td><td>${L.cnt}本 <span class="bar2" style="width:${Math.round(L.cnt/mx*70)}px"></span></td><td class="${pclass(L.pos)}">${L.pos}</td><td class="l ${pclass(L.pos)}">${L.reason}</td></tr>`).join('');
  h+=`<div class="card"><h2>${c} / ${d.tname} <span style="font-size:12px;color:#888">計${d.total}本</span></h2><div class="sub">市場：最安 ${yen(d.market.min)} ／ 5位 ${yen(d.market.p5)} ／ 10位 ${yen(d.market.p10)}</div>${utilHTML(d.util)}<table><thead><tr><th class="l">自社 日帰り価格</th><th>本数</th><th>市場位置</th><th class="l">理由</th></tr></thead><tbody>${rows}</tbody></table>${d.verdict?`<div class="ins ${vclass(d.verdict)}">${d.verdict}</div>`:''}</div>`;}
 return h;}
function renderPace(){
 // 月×クラス 稼働(全体 baselined) – ここは簡易：各クラスの未来月稼働 vs 期待(insight util 確定)
 let h='<div class="card"><h2>📈 ペース監視</h2><div class="sub">日別カレンダーの色＝この監視の集約。詳細は需要タブ参照。</div></div>';return h;}
function render(){const r={cal:renderCal,insight:renderInsight,pace:renderPace}[TAB];document.getElementById('body').innerHTML=r();}
render();
</script></body></html>
