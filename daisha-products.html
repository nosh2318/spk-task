<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代車.com 商品情報設定</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans',sans-serif;background:#f5f6f8;color:#1a1a1a;padding-bottom:90px}
  .hd{background:#0b3d2e;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
  .hd b{font-size:16px;font-weight:900}.hd .y{color:#dfff20}
  .hd .st{font-size:11px;opacity:.7;margin-left:auto}
  .wrap{max-width:880px;margin:0 auto;padding:16px}
  .desc{font-size:12px;color:#666;background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:14px;line-height:1.7}
  .note{font-size:11px;color:#155e44;background:#eefcf4;border:1px solid #7fd8b0;border-radius:9px;padding:9px 12px;margin-bottom:14px}
  .cls{background:#fff;border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.06);margin-bottom:12px;overflow:hidden}
  .cls-hd{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none}
  .tag{font-size:11px;font-weight:900;color:#fff;border-radius:6px;padding:3px 9px}
  .cls-hd .nm{font-size:12px;color:#888}
  .cls-hd .chev{margin-left:auto;color:#bbb;transition:.2s}
  .cls.open .chev{transform:rotate(90deg)}
  .cls-body{display:none;padding:4px 16px 16px}
  .cls.open .cls-body{display:block}
  .sec{margin-top:14px}
  .sec>label.h{display:block;font-size:12px;font-weight:900;color:#0b3d2e;margin-bottom:7px}
  .fld label{display:block;font-size:10px;font-weight:800;color:#666;margin-bottom:3px}
  .fld input,.fld textarea{width:100%;padding:9px 11px;border:1.5px solid #e2e2e2;border-radius:8px;font-size:14px;outline:none;font-family:inherit}
  .fld input:focus,.fld textarea:focus{border-color:#0b9d6a}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  @media(max-width:560px){.grid2{grid-template-columns:1fr}}
  .rep-row{display:grid;grid-template-columns:54px 1fr 1fr 30px;gap:7px;align-items:center;margin-bottom:7px}
  .rep-row.gal{grid-template-columns:1fr 110px 30px}
  .rep-row input{padding:8px 9px;border:1.5px solid #e2e2e2;border-radius:7px;font-size:13px;outline:none;width:100%}
  .del{background:#fee2e2;color:#dc2626;border:none;border-radius:7px;width:30px;height:32px;font-size:15px;font-weight:900;cursor:pointer}
  .add{background:#eefcf4;color:#0b9d6a;border:1px solid #7fd8b0;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer;margin-top:2px}
  .chk{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-bottom:7px}
  .chk input{padding:8px 9px;border:1.5px solid #e2e2e2;border-radius:7px;font-size:13px;outline:none;width:100%}
  .savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #eee;padding:12px 16px;display:flex;justify-content:center;z-index:30}
  .save{padding:14px 30px;background:#0b9d6a;color:#fff;border:none;border-radius:11px;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 3px 10px rgba(11,157,106,.4);max-width:600px;width:100%}
  .msg{font-size:12px;font-weight:800;text-align:center;position:fixed;bottom:64px;left:0;right:0;z-index:31}
  .ok{color:#16a34a}.err{color:#dc2626}
  .hint{font-size:10px;color:#999;margin-bottom:6px}
</style>
</head>
<body>
<div class="hd"><span style="font-size:18px">🚗</span><b>代車<span class="y">.com</span> 商品情報設定</b><span class="st" id="storeLbl">札幌店</span></div>
<div class="wrap">
  <div class="desc">スワイプ予約サイトの<b>車両詳細</b>に表示される情報を<b>クラス別</b>に編集します。クラス名・定員・価格・空車数は「KEYDROP車両紹介/価格」と共有（自動反映）。ここでは<b>年式・装備・安心チェック・ギャラリー・紹介コピー</b>を設定します。</div>
  <div class="note">💡 未入力の項目はアプリ側の既定表示になります。保存すると代車.comに即反映されます。</div>
  <div id="list"></div>
</div>
<div class="savebar"><button class="save" id="saveBtn">💾 保存（代車.comに即反映）</button></div>
<div class="msg" id="msg"></div>

<script>
// NHAコピーは STORE='naha' / TABLE='nha_app_settings' に置換
const STORE='spk';
const TABLE='app_settings';
const STORE_LABEL=(STORE==='naha')?'那覇店':'札幌店';
document.getElementById('storeLbl').textContent=STORE_LABEL;

const SU='https://ckrxttbnawkclshczsia.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
function _ex(d){if(!d)return null;if(typeof d==='string')return d;if(d.access_token)return d.access_token;if(d.currentSession&&d.currentSession.access_token)return d.currentSession.access_token;if(d.session&&d.session.access_token)return d.session.access_token;if(Array.isArray(d)&&typeof d[0]==='string')return d[0];return null;}
function getTok(){try{const v=localStorage.getItem('sb-ckrxttbnawkclshczsia-auth-token');if(v){try{const t=_ex(JSON.parse(v));if(t)return t;}catch(e){}}for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('sb-')&&k.indexOf('auth-token')>=0){const val=localStorage.getItem(k);if(!val)continue;try{const t=_ex(JSON.parse(val));if(t)return t;}catch(e){}}}return null;}catch(e){return null;}}
function authH(){return 'Bearer '+(getTok()||SK);}
function ensureAuth(cb){if(getTok()){cb();return;}var ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';ov.innerHTML='<div style="background:#fff;padding:30px 26px;border-radius:16px;width:90%;max-width:360px;text-align:center"><div style="font-size:16px;font-weight:900;margin-bottom:14px">ログイン</div><input id="ae" type="email" autocapitalize="off" placeholder="メール" style="width:100%;padding:11px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;margin-bottom:8px"><input id="ap" type="password" placeholder="パスワード" style="width:100%;padding:11px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;margin-bottom:8px"><div id="aerr" style="color:#dc2626;font-size:12px;display:none;margin-bottom:8px"></div><button id="ab" style="width:100%;padding:12px;background:#0b3d2e;color:#fff;border:none;border-radius:9px;font-weight:800;cursor:pointer">ログイン</button></div>';document.body.appendChild(ov);ov.addEventListener('keydown',function(e){if(e.key==='Enter')dl(cb,ov);});document.getElementById('ab').onclick=function(){dl(cb,ov);};}
async function dl(cb,ov){var b=document.getElementById('ab'),er=document.getElementById('aerr');var em=(document.getElementById('ae')||{}).value||'',pw=(document.getElementById('ap')||{}).value||'';if(!em||!pw){er.style.display='';er.textContent='入力してください';return;}b.disabled=true;b.textContent='確認中...';try{var r=await fetch(SU+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SK,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})});var d=await r.json();if(d&&d.access_token){localStorage.setItem('sb-ckrxttbnawkclshczsia-auth-token',JSON.stringify({access_token:d.access_token,refresh_token:d.refresh_token||'',expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600),token_type:'bearer',user:d.user||{}}));ov.remove();cb();}else{er.style.display='';er.textContent='認証失敗';b.disabled=false;b.textContent='ログイン';}}catch(e){er.style.display='';er.textContent='接続エラー';b.disabled=false;b.textContent='ログイン';}}
async function sbGet(key){const r=await fetch(SU+'/rest/v1/'+TABLE+'?key=eq.'+key+'&select=value',{headers:{apikey:SK,Authorization:authH()}});if(!r.ok)return null;const d=await r.json();return d&&d[0]?d[0].value:null;}
async function sbSet(key,obj){const r=await fetch(SU+'/rest/v1/'+TABLE,{method:'POST',headers:{apikey:SK,Authorization:authH(),'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify({key:key,value:JSON.stringify(obj)})});if(!r.ok)throw new Error('HTTP '+r.status+' '+await r.text());return await r.json();}
function pv(v){if(v==null)return null;if(typeof v==='string'){try{return JSON.parse(v);}catch(e){return null;}}return v;}
function esc(s){return String(s==null?'':s).replace(/"/g,'&quot;');}

const COLORS={A:'#7c3aed',A2:'#6d28d9',B:'#0284c7',B2:'#0369a1',C:'#059669',S:'#d97706',F:'#db2777',H:'#64748b',D:'#0891b2'};
const DEF_ORDER=['A','A2','B','B2','C','S','F','H'];
const DEF_EQUIP=[['🗺️','ナビ','車両ごとに確認'],['🎥','ドラレコ','車両ごとに確認'],['🔌','充電端子','車両ごとに確認'],['🧳','荷室','写真追加予定']];
const DEF_DAISHA=[['すぐ使える？','お届け時間と保険適用を予約前に確認'],['家族が乗れる？','定員に応じてチャイルドシートも相談可能'],['返却は簡単？','指定場所で回収。店舗へ戻す必要なし']];
const DEF_SHIJO=[['車庫に入る？','自宅まで届けて実際の駐車環境で確認'],['家族の評価は？','後席・乗降・荷物を普段どおり試せる'],['維持できる？','通勤で実燃費と取り回しを確認']];

let DATA=null, CLASSMETA={};

function repRow(kind,a,b,c){
  if(kind==='gal'){
    return '<div class="rep-row gal"><input class="g-url" placeholder="画像URL（https://...）" value="'+esc(a)+'"><input class="g-lbl" placeholder="ラベル（運転席 等）" value="'+esc(b)+'"><button class="del" onclick="this.parentElement.remove()">×</button></div>';
  }
  return '<div class="rep-row"><input class="e-ico" placeholder="🗺️" value="'+esc(a)+'"><input class="e-nm" placeholder="名称（ナビ）" value="'+esc(b)+'"><input class="e-sub" placeholder="補足（全車標準）" value="'+esc(c)+'"><button class="del" onclick="this.parentElement.remove()">×</button></div>';
}
function clsCard(k){
  const it=(DATA.items||{})[k]||{};
  const meta=CLASSMETA[k]||{};
  const nm=meta.label||meta.vehicles||(k+'クラス');
  const eq=(it.equipment&&it.equipment.length)?it.equipment:DEF_EQUIP;
  const gal=it.gallery||[];
  const dch=(it.checks&&it.checks.daisha&&it.checks.daisha.length)?it.checks.daisha:DEF_DAISHA;
  const sch=(it.checks&&it.checks.shijo&&it.checks.shijo.length)?it.checks.shijo:DEF_SHIJO;
  const persona=it.persona||{};const tags=it.tags||{};
  return '<div class="cls" data-k="'+k+'">'
    +'<div class="cls-hd" onclick="this.parentElement.classList.toggle(\'open\')"><span class="tag" style="background:'+(COLORS[k]||'#1a1a1a')+'">'+k+'クラス</span><span class="nm">'+esc(nm)+'</span><span class="chev">›</span></div>'
    +'<div class="cls-body">'
      +'<div class="sec"><label class="h">📅 年式</label><div class="fld"><input class="f-year" placeholder="例：2021〜2024年式" value="'+esc(it.year||'')+'"></div></div>'
      +'<div class="sec"><label class="h">🔧 車両装備</label><div class="hint">アイコン（絵文字）／名称／補足。実車差がある場合は補足に「車両ごとに確認」。</div><div class="eq-list">'+eq.map(function(x){return repRow('eq',x[0],x[1],x[2]);}).join('')+'</div><button class="add" onclick="addRow(this,\'eq\')">＋ 装備を追加</button></div>'
      +'<div class="sec"><label class="h">📷 ギャラリー写真</label><div class="hint">外観以外（運転席・2列目・荷室 等）。URLは画像直リンク。空ならクラス画像のみ表示。</div><div class="gal-list">'+gal.map(function(x){return repRow('gal',x[0],x[1]);}).join('')+'</div><button class="add" onclick="addRow(this,\'gal\')">＋ 写真を追加</button></div>'
      +'<div class="sec"><label class="h">✅ 借りる前の安心チェック（代車モード・3項目）</label>'+[0,1,2].map(function(i){var r=dch[i]||['',''];return '<div class="chk dch"><input class="c-q" placeholder="見出し（すぐ使える？）" value="'+esc(r[0])+'"><input class="c-a" placeholder="説明" value="'+esc(r[1])+'"></div>';}).join('')+'</div>'
      +'<div class="sec"><label class="h">🏠 暮らし試乗で確かめること（試乗モード・3項目）</label>'+[0,1,2].map(function(i){var r=sch[i]||['',''];return '<div class="chk sch"><input class="c-q" placeholder="見出し（車庫に入る？）" value="'+esc(r[0])+'"><input class="c-a" placeholder="説明" value="'+esc(r[1])+'"></div>';}).join('')+'</div>'
      +'<div class="sec"><label class="h">💬 紹介コピー</label><div class="grid2">'
        +'<div class="fld"><label>キャッチ（代車）</label><input class="p-daisha" placeholder="例：事故修理の足、すぐ用意します" value="'+esc(persona.daisha||'')+'"></div>'
        +'<div class="fld"><label>キャッチ（試乗）</label><input class="p-shijo" placeholder="例：買う前に、暮らしで試す" value="'+esc(persona.shijo||'')+'"></div>'
        +'<div class="fld"><label>タグ（代車・カンマ区切り）</label><input class="t-daisha" placeholder="即納, 保険対応, デリバリー" value="'+esc((tags.daisha||[]).join(', '))+'"></div>'
        +'<div class="fld"><label>タグ（試乗・カンマ区切り）</label><input class="t-shijo" placeholder="週末試乗, 家族で, 実燃費" value="'+esc((tags.shijo||[]).join(', '))+'"></div>'
      +'</div></div>'
    +'</div></div>';
}
function addRow(btn,kind){var list=btn.previousElementSibling;list.insertAdjacentHTML('beforeend',kind==='gal'?repRow('gal','',''):repRow('eq','','',''));}

function build(){
  const order=DATA.order&&DATA.order.length?DATA.order:DEF_ORDER;
  // KEYDROPクラス設定に存在するクラスを優先（無ければ既定順）
  const metaOrder=CLASSMETA._order&&CLASSMETA._order.length?CLASSMETA._order:order;
  document.getElementById('list').innerHTML=metaOrder.map(clsCard).join('');
  var first=document.querySelector('.cls');if(first)first.classList.add('open');
}
function collect(){
  const items={},order=[];
  document.querySelectorAll('.cls').forEach(function(c){
    const k=c.dataset.k;order.push(k);
    const eq=[];c.querySelectorAll('.eq-list .rep-row').forEach(function(r){var ic=r.querySelector('.e-ico').value.trim(),nm=r.querySelector('.e-nm').value.trim(),sb=r.querySelector('.e-sub').value.trim();if(nm)eq.push([ic||'•',nm,sb]);});
    const gal=[];c.querySelectorAll('.gal-list .rep-row').forEach(function(r){var u=r.querySelector('.g-url').value.trim(),l=r.querySelector('.g-lbl').value.trim();if(u)gal.push([u,l||'写真']);});
    const dch=[];c.querySelectorAll('.dch').forEach(function(r){var q=r.querySelector('.c-q').value.trim(),a=r.querySelector('.c-a').value.trim();if(q)dch.push([q,a]);});
    const sch=[];c.querySelectorAll('.sch').forEach(function(r){var q=r.querySelector('.c-q').value.trim(),a=r.querySelector('.c-a').value.trim();if(q)sch.push([q,a]);});
    const td=c.querySelector('.t-daisha').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
    const ts=c.querySelector('.t-shijo').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
    items[k]={
      year:c.querySelector('.f-year').value.trim(),
      equipment:eq, gallery:gal,
      checks:{daisha:dch,shijo:sch},
      persona:{daisha:c.querySelector('.p-daisha').value.trim(),shijo:c.querySelector('.p-shijo').value.trim()},
      tags:{daisha:td,shijo:ts}
    };
  });
  return {order:order,items:items,updated_at:new Date().toISOString()};
}
document.getElementById('saveBtn').onclick=async function(){
  const m=document.getElementById('msg');m.textContent='';m.className='msg';this.disabled=true;this.textContent='保存中...';
  try{await sbSet('hdm_daisha_product',collect());m.textContent='✅ 保存しました（代車.comに即反映）';m.className='msg ok';}
  catch(e){m.textContent='保存失敗: '+e.message;m.className='msg err';}
  this.disabled=false;this.textContent='💾 保存（代車.comに即反映）';
};
async function load(){
  // 既存のクラス構成（KEYDROP車両紹介）から表示名・順序を取得
  const cls=pv(await sbGet('hdm_keydrop_classes'));
  if(cls&&cls.items){CLASSMETA=cls.items;CLASSMETA._order=cls.order||Object.keys(cls.items);}
  DATA=pv(await sbGet('hdm_daisha_product'))||{order:DEF_ORDER,items:{}};
  if(!DATA.items)DATA.items={};
  build();
}
ensureAuth(load);
</script>
</body>
</html>
